<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Condensed Matter — Daily Literature Monitor</title>
<meta name="description" content="Daily condensed matter experimental physics literature discovery, research summaries, and journal club archive, in English and Chinese." />
<style>
:root{--ink:#20252c;--muted:#67727d;--rule:#dce1e6;--blue:#174f79;--light:#f6f8f9;--serif:Georgia,'Times New Roman',serif;--sans:Inter,'Helvetica Neue',Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font:14px/1.56 var(--sans)}button,input{font:inherit}a{color:var(--blue)}
.mast{border-top:4px solid #152f44;border-bottom:1px solid var(--rule);padding:25px max(4vw,calc((100vw - 1180px)/2)) 22px}
.mast-row{display:flex;align-items:start;justify-content:space-between;gap:26px}.mast h1{font:normal 35px/1.18 var(--serif);margin:7px 0;letter-spacing:-.02em}.mast p{color:var(--muted);margin:0}.kicker{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lang-switch{display:flex;gap:0;align-self:flex-start;border:1px solid #c4cdd5;margin-top:7px;white-space:nowrap}.lang-switch button{font-size:12px;padding:7px 12px;border:0;background:#fff;color:#556675;cursor:pointer}.lang-switch button+button{border-left:1px solid #c4cdd5}.lang-switch button[aria-pressed="true"]{background:#203f56;color:#fff;font-weight:600}
.layout{max-width:1250px;margin:auto;padding:27px 22px 65px;display:grid;grid-template-columns:198px minmax(0,1fr);gap:44px}.side{border-right:1px solid var(--rule);padding-right:24px}.side h3{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:0 0 15px}.side button{width:100%;border:0;background:transparent;color:var(--ink);padding:10px 12px;text-align:left;cursor:pointer;border-left:2px solid transparent}.side button[aria-current="true"]{background:var(--light);border-color:var(--blue);font-weight:600}.side small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.stamp{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}.issue-head{border-bottom:2px solid #273744;padding-bottom:19px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:end;gap:15px}.issue-head h2{font:normal 28px var(--serif);margin:4px 0 5px}.issue-head p{margin:0;color:var(--muted)}.pdf{display:inline-block;white-space:nowrap;border:1px solid #afbbc6;padding:8px 13px;font-size:12px;text-decoration:none}.pdf:hover{background:#edf3f7}.pdf-group{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pdf.current{border-color:#254d69;background:#edf3f7;font-weight:600}
.toolbar{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin:0 0 18px}.search{min-width:235px;flex:1;border:1px solid #cbd2d8;border-radius:0;padding:9px 12px;outline-offset:1px;background:#fff}.topics{display:flex;gap:5px;flex-wrap:wrap}.chip{border:1px solid var(--rule);background:transparent;font-size:12px;color:#405261;padding:7px 10px;cursor:pointer}.chip.active{background:#203f56;color:#fff;border-color:#203f56}.count{font-size:11px;color:var(--muted);margin:3px 0 12px;letter-spacing:.075em;text-transform:uppercase}
.group-heading{font:600 12px/1.4 var(--sans);letter-spacing:.075em;text-transform:uppercase;color:#213d54;border-bottom:1px solid #abbac6;padding:12px 0 9px;margin:23px 0 0}.group-heading small{font:400 11px/1.4 var(--sans);letter-spacing:0;text-transform:none;color:var(--muted);margin-left:10px}.paper{padding:20px 0 22px;border-top:1px solid var(--rule)}.topline{display:flex;justify-content:space-between;gap:15px;align-items:baseline}.label{font-size:11px;letter-spacing:.045em;text-transform:uppercase;color:var(--muted);font-weight:600}.feature{color:#184e73}.pub{font-size:12px;color:var(--muted);text-align:right}.paper h3{font:normal 21px/1.33 var(--serif);margin:6px 0 5px}.paper h3 a{color:#1f3444;text-decoration:none}.paper h3 a:hover{text-decoration:underline}.authors{font-size:12px;color:#55626e;margin:0 0 8px}.paper .abstract{margin:9px 0 8px;font-size:13.5px}.paper .reason{font-size:12px;color:#55626e;margin:6px 0}.paper .expand{border:0;background:transparent;padding:4px 0;color:var(--blue);font-size:12px;cursor:pointer;font-weight:600}.details{padding:11px 15px;margin-top:8px;border-left:2px solid #829bab;background:#f7f9fa}.details p{margin:6px 0}.details strong{color:#263846}.footer{padding:20px 0;border-top:1px solid var(--rule);font-size:11px;color:var(--muted)}.empty{padding:26px 0;color:var(--muted)}
@media(max-width:760px){.mast{padding:21px 18px}.mast h1{font-size:28px}.mast p{font-size:12px}.lang-switch button{padding:6px 9px}.layout{display:block;padding:17px 18px 45px}.side{border:0;border-bottom:1px solid var(--rule);margin-bottom:18px;padding-bottom:8px}.side button{width:auto;display:inline-block;margin-right:10px}.side h3{margin-bottom:5px}.side small{display:none}.issue-head{align-items:start;flex-direction:column}.paper h3{font-size:19px}.topline{flex-wrap:wrap}.pub{text-align:left}}
</style>
</head>
<body>
<header class="mast"><div class="mast-row">
  <div><div class="kicker" id="site-kicker">Daily research monitor / condensed matter physics</div><h1 id="site-title">Condensed Matter Literature</h1><p id="site-subtitle">Experimental quantum materials · New papers · Journal club</p></div>
  <div class="lang-switch" role="group" aria-label="Language / 语言">
    <button type="button" id="lang-en" aria-pressed="true" lang="en">English</button>
    <button type="button" id="lang-zh" aria-pressed="false" lang="zh-CN">中文</button>
  </div>
</div></header>
<div class="layout"><aside class="side"><h3 id="archive-title">Archive</h3><nav id="archive" aria-label="Issue archive"></nav></aside>
<main><div id="head"></div><div class="toolbar"><input id="search" class="search" type="search" placeholder="Search titles, authors, materials and findings…" aria-label="Search literature"><div id="topics" class="topics"></div></div><div id="counter" class="count"></div><div id="papers"></div><div class="footer" id="footer">DAILY CONDENSED MATTER LITERATURE · ORIGINAL SOURCES LINKED PER ARTICLE</div></main></div>
<script id="issues-data" type="application/json">__ISSUES__</script>
<script>
'use strict';
const AVAILABLE_REPORTS=__REPORTS__;
const issues=JSON.parse(document.getElementById('issues-data').textContent);
const TOPIC_ZH={'All':'全部','Superconductivity':'超导','Thermal & Thermoelectric':'热输运与热电','Magnetism':'磁性','Materials & Growth':'材料与晶体生长','Topology & Transport':'拓扑与输运','Correlated Electrons':'关联电子','Low-dimensional & Optical':'低维与光学','Other Condensed Matter':'其他凝聚态'};
const STR={
 en:{kicker:'DAILY RESEARCH MONITOR / CONDENSED MATTER PHYSICS',title:'Condensed Matter Literature',subtitle:'Experimental quantum materials · New papers · Journal club',archive:'Archive',issue:'Issue',untitled:'Daily Literature',papers:'papers',featured:'featured reads',pdfEn:'Journal Club PDF · English ↗',pdfZh:'Journal Club PDF · 中文 ↗',search:'Search titles, authors, materials and findings…',all:'All',shown:'papers shown',indexed:'indexed',feature:'Featured reading',brief:'Literature index',corresponding:'Corresponding',estimated:'Estimated journal tier',actualJournal:'Actual publication',tierReason:'Assessment',read:'Read paper notes +',close:'Close notes −',methods:'Methods',findings:'Authors’ findings',followup:'Experimental follow-up',fullText:'Original paper / Full text ↗',empty:'No papers match the current filter.',footer:'DAILY CONDENSED MATTER LITERATURE · ORIGINAL SOURCES LINKED PER ARTICLE'},
 zh:{kicker:'每日凝聚态物理文献速递',title:'凝聚态物理文献',subtitle:'量子材料实验 · 最新论文 · Journal Club',archive:'往期归档',issue:'期刊速递',untitled:'每日文献',papers:'篇论文',featured:'篇重点精读',pdfEn:'Journal Club PDF · English ↗',pdfZh:'Journal Club PDF · 中文 ↗',search:'搜索论文标题、作者、材料与研究结果…',all:'全部',shown:'篇符合条件',indexed:'篇收录',feature:'重点精读',brief:'文献索引',corresponding:'通讯作者',estimated:'预估期刊档次',actualJournal:'实际发表期刊',tierReason:'评级理由',read:'阅读详细笔记 +',close:'收起笔记 −',methods:'研究方法',findings:'作者主要发现',followup:'我们可以做什么',fullText:'阅读论文原文 ↗',empty:'当前筛选条件下没有论文。',footer:'每日凝聚态物理文献 · 每篇均附原始论文链接'}
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 2025 Journal Impact Factors (2026 JCR release); sorting is by source journal.
const JOURNAL_JIF_2025=Object.freeze({
 'nature':56.1,'science':47.3,'nature materials':38.0,
 'nature communications':18.1,'nature physics':18.0,
 'physical review x':16.8,'prx':16.8,'science advances':13.9,
 'pnas':9.5,'proceedings of the national academy of sciences':9.5,
 'physical review letters':9.4,'prl':9.4
});
function journalImpact(p){
 // Classify by discovery source; arXiv articles stay last even if accepted by a journal.
 if(p.type==='arXiv'||p.arxiv_id||/^arxiv\b/i.test(String(p.journal||'')))return -Infinity;
 const name=String(p.journal||'').trim().toLowerCase().replace(/\s+/g,' ');
 return JOURNAL_JIF_2025[name]??-1;
}
function journalOrder(a,b){
 const x=journalImpact(a),y=journalImpact(b);
 if(x!==y)return y>x?1:-1;
 return String(a.title||'').localeCompare(String(b.title||''));
}
const byId=id=>document.getElementById(id);
let selected=0,topic='All';
// English is the default for first visits. A visitor's explicit choice persists.
let lang=(()=>{try{return localStorage.getItem('condmat-language')==='zh'?'zh':'en'}catch{return 'en'}})();
function field(p,name){
  const en=p[name+'_en'],zh=p[name+'_zh'];
  if(lang==='en')return en||((name==='summary')?(p.abstract||p.summary||''):(p[name]||''));
  return zh||p[name]||en||'';
}
function displayTopic(t){return lang==='zh'?(TOPIC_ZH[t]||t):t}
function chooseLanguage(next){lang=next;try{localStorage.setItem('condmat-language',lang)}catch{};render()}
function showIssue(i){selected=i;topic='All';byId('search').value='';render()}
function toggleNotes(btn){const details=btn.nextElementSibling;details.hidden=!details.hidden;btn.textContent=details.hidden?STR[lang].read:STR[lang].close}
function render(){
 const t=STR[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';
 byId('lang-en').setAttribute('aria-pressed',String(lang==='en'));byId('lang-zh').setAttribute('aria-pressed',String(lang==='zh'));
 byId('site-kicker').textContent=t.kicker;byId('site-title').textContent=t.title;byId('site-subtitle').textContent=t.subtitle;
 byId('archive-title').textContent=t.archive;byId('search').placeholder=t.search;byId('search').setAttribute('aria-label',t.search);byId('footer').textContent=t.footer;
 const issue=issues[selected]||{papers:[],date:'—'};
 byId('archive').innerHTML=issues.map((v,i)=>`<button type="button" aria-current="${i===selected}" data-issue="${i}">${esc(v.date)}<small>${v.papers.length} ${esc(t.papers)}</small></button>`).join('');
 byId('archive').querySelectorAll('[data-issue]').forEach(b=>b.addEventListener('click',()=>showIssue(Number(b.dataset.issue))));
 const reports=AVAILABLE_REPORTS[issue.date]||{};
 const languageOrder=lang==='zh'?['zh','en']:['en','zh'];
 const reportLinks=languageOrder.filter(l=>reports[l]).map(l=>`<a class="pdf ${l===lang?'current':''}" href="${esc(reports[l])}" target="_blank" rel="noopener" lang="${l==='zh'?'zh-CN':'en'}">${esc(l==='zh'?t.pdfZh:t.pdfEn)}</a>`).join('');
 const issueTitle=(lang==='zh'&&issue.title_zh)||issue.title||t.untitled;
 byId('head').innerHTML=`<div class="issue-head"><div><div class="stamp">${esc(t.issue)} / ${esc(issue.date)}</div><h2>${esc(issueTitle)}</h2><p>${issue.papers.length} ${esc(t.papers)} · ${issue.papers.filter(p=>p.level==='Feature').length} ${esc(t.featured)}</p></div>${reportLinks?`<div class="pdf-group">${reportLinks}</div>`:''}</div>`;
 const types=['All',...new Set(issue.papers.map(x=>x.topic))];
 byId('topics').innerHTML=types.map(tp=>`<button type="button" class="chip ${topic===tp?'active':''}" data-topic="${esc(tp)}">${esc(displayTopic(tp))}</button>`).join('');
 byId('topics').querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>{topic=b.dataset.topic;render()}));
 const q=byId('search').value.trim().toLocaleLowerCase();
 const papers=issue.papers.filter(p=>(topic==='All'||p.topic===topic)&&[
   p.title,p.authors,p.journal,p.corresponding,p.topic,TOPIC_ZH[p.topic],
   p.summary,p.summary_en,p.summary_zh,p.abstract,p.method,p.method_en,p.method_zh,
   p.result,p.result_en,p.result_zh,p.future,p.future_en,p.future_zh,
   p.tier,p.tier_reason,p.tier_reason_en,p.tier_reason_zh
 ].join(' ').toLocaleLowerCase().includes(q)).sort((a,b)=>
   Number(b.level==='Feature')-Number(a.level==='Feature')||journalOrder(a,b));
 byId('counter').textContent=`${papers.length} ${t.shown} / ${issue.papers.length} ${t.indexed}`;
 byId('papers').innerHTML=papers.map((p,i)=>{
   const isFeatured=p.level==='Feature';
   const prior=papers[i-1];
   const heading=(i===0||isFeatured!==(prior.level==='Feature'))?
     `<h2 class="group-heading">${esc(isFeatured?t.feature:t.brief)}</h2>`:'';
   const summary=field(p,'summary'),method=field(p,'method'),result=field(p,'result'),future=field(p,'future'),reason=field(p,'tier_reason');
   const details=[p.published_journal?`<p><strong>${esc(t.actualJournal)}</strong> — ${p.published_doi?`<a href="${esc(p.published_doi)}" target="_blank" rel="noopener">${esc(p.published_journal)} ↗</a>`:esc(p.published_journal)}</p>`:'',p.tier?`<p><strong>${esc(t.estimated)}</strong> — ${esc(p.tier)}${reason?' · '+esc(reason):''}</p>`:'',method?`<p><strong>${esc(t.methods)}</strong> — ${esc(method)}</p>`:'',result?`<p><strong>${esc(t.findings)}</strong> — ${esc(result)}</p>`:'',future?`<p><strong>${esc(t.followup)}</strong> — ${esc(future)}</p>`:''].join('');
   return `${heading}<article class="paper" id="${esc(p.id)}"><div class="topline"><div class="label ${p.level==='Feature'?'feature':''}">${esc(displayTopic(p.topic))} · ${esc(p.level==='Feature'?t.feature:t.brief)}</div><span class="pub">${esc(p.journal)}${Number.isFinite(Number(p.relevance_score))&&p.relevance_score!==null?` · ${lang==="zh"?"科学评分":"Physics score"} ${esc(p.relevance_score)}/100`:""}</span></div><h3><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)} ↗</a></h3><div class="authors">${esc(p.authors)}${p.corresponding&&p.corresponding!=='—'?' · '+esc(t.corresponding)+': '+esc(p.corresponding):''}</div>${summary?`<p class="abstract">${esc(summary)}</p>`:''}${details?`<button type="button" class="expand">${esc(t.read)}</button><div class="details" hidden>${details}<p><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(t.fullText)}</a></p></div>`:''}</article>`;
 }).join('')||`<div class="empty">${esc(t.empty)}</div>`;
 byId('papers').querySelectorAll('.expand').forEach(b=>b.addEventListener('click',()=>toggleNotes(b)));
}
byId('lang-en').addEventListener('click',()=>chooseLanguage('en'));
byId('lang-zh').addEventListener('click',()=>chooseLanguage('zh'));
byId('search').addEventListener('input',render);
render();
</script></body></html>
