name: Cloud trigger regression checks
on:
  push:
    branches: [codex/cloud-trigger-safety]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run release and scientific regression checks
        run: python -m unittest -q test_relevance test_pipeline test_daily_release
