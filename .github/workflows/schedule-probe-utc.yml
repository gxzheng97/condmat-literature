name: Temporary schedule probe UTC
on:
  schedule:
    - cron: '2-57/5 18-19 29 10 *'
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record trigger and actual clock
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          TRIGGER_EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(dt.timezone.utc)
          print(json.dumps({
              "event":os.getenv("TRIGGER_EVENT"),
              "cron":os.getenv("TRIGGER_SCHEDULE"),
              "run_id":os.getenv("RUN_ID"),
              "utc":now.isoformat(),
              "los_angeles":now.astimezone(ZoneInfo("America/Los_Angeles")).isoformat(),
              "purpose":"Temporary schedule-only diagnosis; no article generation or deployment"
          }),flush=True)
          PY
