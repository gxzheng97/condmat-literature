name: Daily literature and GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: condensed-matter-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate physics relevance screen
        run: python -m unittest -q test_relevance
      - name: Check AI semantic screening configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "::notice::AI semantic screening key is configured."
          else
            echo "::warning::AI semantic screening key missing. Add OPENAI_API_KEY in repository Actions secrets."
          fi
      - name: Smoke test live AI semantic screening
        if: github.event_name == 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from relevance import screen
          if not os.environ.get("OPENAI_API_KEY"):
              raise SystemExit("OPENAI_API_KEY is not configured as an Actions repository secret.")
          candidates = [
              {
                  "id": "qa-spin",
                  "title": "Spin order and excitations in a collinear kagome antiferromagnet",
                  "abstract": "Elastic and inelastic neutron scattering resolve the magnetic structure and spin excitation spectrum. The authors identify exchange interactions and anisotropy of a bulk quantum material."
              },
              {
                  "id": "qa-optics",
                  "title": "High-numerical-aperture extreme ultraviolet flat optics via a cascaded momentum relay",
                  "abstract": "A lens design improves numerical aperture and projection performance through two cascaded diffractive elements."
              }
          ]
          selected, stats = screen(candidates, use_ai=True)
          print(f"Semantic screening smoke test: {stats['ai_assessed']} AI-assessed papers, {len(selected)} retained")
          if stats["ai_assessed"] != len(candidates):
              raise SystemExit("AI model call did not complete for all smoke-test abstracts; inspect relevance logs.")
          print("OpenAI API connection and JSON semantic screening: OK")
          PY
      - name: Update daily literature
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python update_daily.py
      - name: Refresh complete author bibliographies
        run: python fill_authors.py
      - name: Generate bilingual PDF reports
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install -q weasyprint
          python make_reports.py
      - name: Build site
        run: python build.py
      - name: Commit daily issue
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add issues/ index.html
          if ! git diff --cached --quiet; then
            git commit -m "Daily literature update"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
