name: Daily literature and GitHub Pages
run-name: "Daily literature | ${{ github.event_name }} | ${{ github.event.schedule || 'manual/push' }}"
on:
  push:
    branches: [main, codex/v1-quantum-materials-review]
  schedule:
    - cron: '0 6 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
    inputs:
      date:
        description: 'Issue date YYYY-MM-DD; blank means today in Los Angeles'
        required: false
        type: string
      rescreen:
        description: 'Reassess every candidate under the current rules'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: condensed-matter-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'literature-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check daily release freshness
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_DATE: ${{ inputs.date }}
          RESCREEN: ${{ inputs.rescreen }}
        run: python daily_release.py plan
      - name: Validate physics relevance screen
        run: python -m unittest -q test_relevance test_pipeline test_daily_release
      - name: Check AI semantic screening configuration
        if: steps.freshness.outputs.mode == 'generate'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "::notice::AI semantic screening key is configured."
          else
            echo "::warning::AI semantic screening key missing. Add OPENAI_API_KEY in repository Actions secrets."
          fi
      - name: Smoke test live AI semantic screening
        if: github.event_name != 'schedule' && steps.freshness.outputs.mode == 'generate'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from relevance import screen
          if not os.environ.get("OPENAI_API_KEY"):
              raise SystemExit("OPENAI_API_KEY is not configured as an Actions repository secret.")
          candidates = [
              {
                  "id": "qa-spin",
                  "title": "Spin order and excitations in a collinear kagome antiferromagnet",
                  "abstract": "Elastic and inelastic neutron scattering resolve the magnetic structure and spin excitation spectrum. The authors identify exchange interactions and anisotropy of a bulk quantum material."
              },
              {
                  "id": "qa-optics",
                  "title": "High-numerical-aperture extreme ultraviolet flat optics via a cascaded momentum relay",
                  "abstract": "A lens design improves numerical aperture and projection performance through two cascaded diffractive elements."
              },
              {
                  "id": "qa-qec",
                  "title": "Autonomous quantum error correction on a superconducting quantum processor",
                  "abstract": "Improved logical-qubit lifetime and quantum computing reliability through a superconducting circuit protocol, without studying a new state of matter."
              },
              {
                  "id": "qa-review",
                  "title": "An advanced piezoelectric thin-film material for memory devices: mechanisms and applications",
                  "abstract": "This review surveys device switching performance, fabrication, high-yield integration and emerging sensor applications."
              }
          ]
          selected, stats = screen(candidates, use_ai=True)
          print(f"Semantic screening smoke test: {stats['ai_assessed']} AI-assessed papers, {len(selected)} retained")
          if stats["ai_assessed"] != len(candidates):
              raise SystemExit("AI model call did not complete for all smoke-test abstracts; inspect relevance logs.")
          selected_ids = {p["id"] for p in selected}
          assert "qa-spin" in selected_ids, "Missed real magnetic-structure physics"
          assert not ({"qa-optics","qa-qec","qa-review"} & selected_ids), "Included a primarily technological/non-condensed-matter article"
          print("OpenAI API connection and scientific-scope gate: OK")
          PY
      - name: Update daily literature
        if: steps.freshness.outputs.mode == 'generate'
        env:
          ISSUE_DATE: ${{ steps.freshness.outputs.date }}
          RESCREEN: ${{ inputs.rescreen }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python update_daily.py
      - name: Re-screen October 23 archive once
        id: rescreen
        if: github.event_name == 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -f rescreen-2026-10-23.request ]; then
            test -n "$OPENAI_API_KEY" || { echo "AI API key missing"; exit 1; }
            git fetch --depth=1 origin 6817bab144768962534751c5bc2ece728de34ecc
            python rescreen_issue.py
            rm rescreen-2026-10-23.request
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save AI-reviewed issue before PDF rendering
        if: steps.rescreen.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add issues/2026-10-23.json
          git add -u rescreen-2026-10-23.request
          git commit -m "Publish complete AI semantic re-screen of October 23"
          git push
      - name: Strictly re-screen October 24 archive
        id: rescreen24
        if: github.event_name == 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -f rescreen-2026-10-24.request ]; then
            test -n "$OPENAI_API_KEY" || { echo "AI API key missing"; exit 1; }
            python rescreen_oct24.py
            rm rescreen-2026-10-24.request
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate daily publication size and AI completion
        if: steps.freshness.outputs.mode != 'current'
        env:
          ISSUE_DATE: ${{ steps.freshness.outputs.date }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from update_daily import validate_issue
          day=os.getenv("ISSUE_DATE") or datetime.now(ZoneInfo("America/Los_Angeles")).date().isoformat()
          path=Path("issues")/(day+".json")
          assert path.exists(), "Today's issue was not generated"
          issue=json.loads(path.read_text(encoding="utf-8"))
          validate_issue(issue)
          print(f"Editorial release gate passed: {len(issue['papers'])} papers")
          PY
      - name: Save validated list before PDF rendering
        if: steps.freshness.outputs.mode != 'current'
        run: |
          python build.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add issues/ audits/ index.html
          if ! git diff --cached --quiet; then
            git commit -m "Save validated daily selection and screening audit"
            git push
          fi
      - name: Refresh complete author bibliographies
        if: steps.freshness.outputs.mode != 'current'
        env:
          ISSUE_DATE: ${{ steps.freshness.outputs.date }}
        run: python fill_authors.py
      - name: Generate bilingual PDF reports
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.mode != 'current'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install -q weasyprint
          python make_reports.py
      - name: Build site
        if: steps.freshness.outputs.mode != 'current'
        run: python build.py
      - name: Commit daily issue
        if: steps.freshness.outputs.mode != 'current'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add issues/ index.html
          if [ -d audits ]; then git add audits/; fi
          git add -u rescreen-2026-10-23.request || true
          git add -u rescreen-2026-10-24.request || true
          if ! git diff --cached --quiet; then
            git commit -m "Daily literature update and AI editorial screening"
            git push
          fi
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.mode != 'current'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.mode != 'current'
        with:
          path: .
      - id: deployment
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.mode != 'current'
        uses: actions/deploy-pages@v4
      - name: Verify published daily issue
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.mode != 'current'
        env:
          ISSUE_DATE: ${{ steps.freshness.outputs.date }}
        run: python daily_release.py verify


