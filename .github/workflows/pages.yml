name: Daily literature and GitHub Pages
run-name: "Daily literature | ${{ github.event_name }} | ${{ github.event.schedule || 'manual/push' }}"
on:
  push:
    branches: [main, codex/v1-quantum-materials-review]
  schedule:
    - cron: '0 6 * * *'
      timezone: 'America/Los_Angeles'
    - cron: '17,47 6-12 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
    inputs:
      date:
        description: 'Issue date YYYY-MM-DD; blank means today in Los Angeles'
        required: false
        type: string
      rescreen:
        description: 'Reassess every candidate under the current rules'
        type: boolean
        default: false
      reuse_valid_issue:
        description: 'Cloud trigger: reuse a valid issue and resume only unfinished publication'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: condensed-matter-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !inputs.reuse_valid_issue }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'literature-preview' }}
      url: ${{ steps.reports_deployment.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ (github.event_name == 'schedule' || inputs.reuse_valid_issue) && github.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-reports.txt
      - name: Check daily release freshness
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_DATE: ${{ inputs.date }}
          RESCREEN: ${{ inputs.rescreen }}
          REUSE_VALID_ISSUE: ${{ inputs.reuse_valid_issue }}
        run: python daily_release.py plan
      - name: Validate physics relevance screen
        run: python -m unittest -q test_relevance test_pipeline test_daily_release test_intake_window test_reports test_build test_report_assets test_prepare_reports test_fetch
      - name: Check AI semantic screening configuration
        if: steps.freshness.outputs.mode == 'generate'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "::notice::AI semantic screening key is configured."
          else
            echo "::warning::AI semantic screening key missing. Add OPENAI_API_KEY in repository Actions secrets."
          fi
      - name: Smoke test live AI semantic screening
        if: github.event_name != 'schedule' && steps.freshness.outputs.mode == 'generate'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from relevance import screen
          if not os.environ.get("OPENAI_API_KEY"):
              raise SystemExit("OPENAI_API_KEY is not configured as an Actions repository secret.")
          candidates = [
              {
                  "id": "qa-spin",
                  "title": "Spin order and excitations in a collinear kagome antiferromagnet",
                  "abstract": "Elastic and inelastic neutron scattering resolve the magnetic structure and spin excitation spectrum. The authors identify exchange interactions and anisotropy of a bulk quantum material."
              },
              {
                  "id": "qa-optics",
                  "title": "High-numerical-aperture extreme ultraviolet flat optics via a cascaded momentum relay",
                  "abstract": "A lens design improves numerical aperture and projection performance through two cascaded diffractive elements."
              },
              {
                  "id": "qa-qec",
                  "title": "Autonomous quantum error correction on a superconducting quantum processor",
                  "abstract": "Improved logical-qubit lifetime and quantum computing reliability through a superconducting circuit protocol, without studying a new state of matter."
              },
              {
                  "id": "qa-review",
                  "title": "An advanced piezoelectric thin-film material for memory devices: mechanisms and applications",
                  "abstract": "This review surveys device switching performance, fabrication, high-yield integration and emerging sensor applications."
              }
          ]
          selected, stats = screen(candidates, use_ai=True)
          print(f"Semantic screening smoke test: {stats['ai_assessed']} AI-assessed papers, {len(selected)} retained")
          if stats["ai_assessed"] != len(candidates):
              raise SystemExit("AI model call did not complete for all smoke-test abstracts; inspect relevance logs.")
          selected_ids = {p["id"] for p in selected}
          assert "qa-spin" in selected_ids, "Missed real magnetic-structure physics"
          assert not ({"qa-optics","qa-qec","qa-review"} & selected_ids), "Included a primarily technological/non-condensed-matter article"
          print("OpenAI API connection and scientific-scope gate: OK")
          PY
      - name: Update daily literature
        if: steps.freshness.outputs.mode == 'generate'
        env:
          ISSUE_DATE: ${{ steps.freshness.outputs.date }}
          RESCREEN: ${{ inputs.rescreen }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python update_daily.py
      - name: Re-screen October 23 archive once
        id: rescreen
        if: github.event_name == 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -f rescreen-2026-10-23.request ]; then
            test -n "$OPENAI_API_KEY" || { echo "AI API key missing"; exit 1; }
            git fetch --depth=1 origin 6817bab144768962534751c5bc2ece728de34ecc
            python rescreen_issue.py
            rm rescreen-2026-10-23.request
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save AI-reviewed issue before PDF rendering
        if: steps.rescreen.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add issues/2026-10-23.json
          git add -u rescreen-2026-10-23.request
          git commit -m "Publish complete AI semantic re-screen of October 23"
          git push origin "HEAD:$GITHUB_REF"
      - name: Strictly re-screen October 24 archive
        id: rescreen24
        if: github.event_name == 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -f rescreen-2026-10-24.request ]; then
            test -n "$OPENAI_API_KEY" || { echo "AI API key missing"; exit 1; }
            python rescreen_oct24.py
            rm rescreen-2026-10-24.request
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh complete author bibliographies
        if: steps.freshness.outputs.mode != 'current'
        continue-on-error: true
        timeout-minutes: 4
        env:
          ISSUE_DATE: ${{ steps.freshness.outputs.date }}
        run: python fill_authors.py
      - name: Validate daily publication size and AI completion
        if: steps.freshness.outputs.mode != 'current'
        env:
          ISSUE_DATE: ${{ steps.freshness.outputs.date }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from update_daily import validate_issue
          day=os.getenv("ISSUE_DATE") or datetime.now(ZoneInfo("America/Los_Angeles")).date().isoformat()
          path=Path("issues")/(day+".json")
          assert path.exists(), "Today's issue was not generated"
          issue=json.loads(path.read_text(encoding="utf-8"))
          validate_issue(issue)
          print(f"Editorial release gate passed: {len(issue['papers'])} papers")
          PY
      - name: Save validated selection before recovering optional assets
        if: steps.freshness.outputs.mode != 'current'
        run: |
          python build.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add issues/ audits/ index.html
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Save validated daily selection and screening audit"
            git push origin "HEAD:$GITHUB_REF"
          fi
      - name: Restore cached reports and fonts
        id: report_cache
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            reports
            ~/.local/share/fonts/condmat
          key: reports-${{ runner.os }}-${{ hashFiles('make_reports.py', 'requirements-reports.txt', 'prepare_reports.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            reports-${{ runner.os }}-
      - name: Preserve published PDF archive on cache misses
        id: restore_assets
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 5
        run: python report_assets.py
      - name: Require preserved archive before replacing the live website
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.mode != 'current'
        run: |
          test '${{ steps.restore_assets.outcome }}' = success || { echo 'Published archive could not be recovered; keep the current website and retry the saved selection.'; exit 1; }
      - name: Build the daily website before PDF generation
        if: steps.freshness.outputs.mode != 'current'
        run: python build.py --output _site
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.mode != 'current'
        with:
          name: literature-body
          path: _site
      - id: deployment
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.mode != 'current'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: literature-body
      - name: Verify published daily issue
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.mode != 'current'
        env:
          ISSUE_DATE: ${{ steps.freshness.outputs.date }}
        run: python daily_release.py verify
      - name: Plan PDF recovery without repeating scientific screening
        id: report_plan
        if: github.ref == 'refs/heads/main' && steps.restore_assets.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        env:
          ISSUE_DATE: ${{ steps.freshness.outputs.date }}
        run: python daily_release.py reports
      - name: Generate only missing or outdated bilingual PDFs
        id: pdf
        if: github.ref == 'refs/heads/main' && steps.report_plan.outputs.mode == 'render'
        continue-on-error: true
        timeout-minutes: 8
        env:
          ISSUE_DATE: ${{ steps.freshness.outputs.date }}
        run: |
          python prepare_reports.py
          python -m pip install --disable-pip-version-check --retries 3 --timeout 20 -r requirements-reports.txt
          python make_reports.py --date "$ISSUE_DATE"
      - name: Build website with completed PDF reports
        id: report_site
        if: github.ref == 'refs/heads/main' && (steps.report_plan.outputs.mode == 'deploy' || steps.pdf.outcome == 'success')
        continue-on-error: true
        run: python build.py --output _site
      - name: Upload website with reports
        id: report_upload
        if: steps.report_site.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          name: literature-with-reports
          path: _site
      - name: Publish PDF reports
        id: reports_deployment
        if: steps.report_upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: literature-with-reports
      - name: Verify published reports and unchanged daily selection
        id: report_verify
        if: steps.reports_deployment.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 4
        env:
          ISSUE_DATE: ${{ steps.freshness.outputs.date }}
        run: |
          python daily_release.py verify
          python daily_release.py verify-reports
      - name: Retain reports and fonts for the next recovery attempt
        if: always() && github.ref == 'refs/heads/main' && steps.restore_assets.outcome == 'success' && (steps.restore_assets.outputs.restored != '0' || steps.pdf.outcome == 'success' || steps.pdf.outcome == 'failure')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            reports
            ~/.local/share/fonts/condmat
          key: reports-${{ runner.os }}-${{ hashFiles('make_reports.py', 'requirements-reports.txt', 'prepare_reports.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report deferred PDF publication
        if: always() && github.ref == 'refs/heads/main' && (steps.freshness.outputs.mode == 'current' && steps.restore_assets.outcome == 'failure' || steps.report_plan.outcome == 'failure' || steps.pdf.outcome == 'failure' || steps.report_site.outcome == 'failure' || steps.report_upload.outcome == 'failure' || steps.reports_deployment.outcome == 'failure' || steps.report_verify.outcome == 'failure')
        run: |
          echo '::warning::The daily article list remains published. PDF publication is pending and the next recovery will retry it without repeating AI screening.'
          echo 'Daily article publication completed; bilingual PDF publication needs a retry.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source failure audit for diagnosis
        if: failure() && steps.freshness.outputs.mode == 'generate'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: failed-harvest-${{ steps.freshness.outputs.date }}
          path: audits/${{ steps.freshness.outputs.date }}.failed.json
          if-no-files-found: ignore
          retention-days: 14


