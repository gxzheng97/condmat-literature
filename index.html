moelectric semiconductor database: DFT-based discovery and experimental validation [Phys. Rev. B 113, 205203 (2026)]", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78541-6", "doi": "10.1038/s41467-026-78541-6", "type": "Journal", "journal": "Nature Communications", "title": "Force-driven single-molecule transformations through tip-mediated stabilization of transition states", "authors": "Kota Iwata, Ikutaro Hamada, Ranmaru Kuno et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78541-6", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Abstract Mechanochemistry uses mechanical forces to drive chemical transformations, offering an energy-efficient alternative to traditional thermal, optical, or electrical reaction pathways. At the single-molecule scale, controlling structural changes with mechanical stimuli is fundamental for developing nanoscale devices and understanding chemical reactivity. In conventional single-molecule react", "summary": "Abstract Mechanochemistry uses mechanical forces to drive chemical transformations, offering an energy-efficient alternative to traditional thermal, optical, or electrical reaction pathways. At the single-molecule scale, controlling structural changes with mechanical stimuli is fundamental for developing nanoscale devices and understanding chemical reactivity. In conventional single-molecule react", "abstract": "Abstract Mechanochemistry uses mechanical forces to drive chemical transformations, offering an energy-efficient alternative to traditional thermal, optical, or electrical reaction pathways. At the single-molecule scale, controlling structural changes with mechanical stimuli is fundamental for developing nanoscale devices and understanding chemical reactivity. In conventional single-molecule reactions driven by light or electrical currents, energy is supplied through one-way excitation processes, requiring the single-event energy input to exceed the activation energy barrier. Here we show that mechanically driven single-molecule reactions can bypass this limitation, proceeding with a net energy cost below the activation energy. By using atomic force microscopy to induce the structural inversion of individual, bowl-shaped sumanene molecules on a gold surface, we measure the mechanical energy spent during the transformation. The net energy cost is significantly lower than the theoretical activation energy. This sub-barrier reaction occurs because attractive van der Waals forces from the mesoscopic tip body stabilize the transition state more effectively than the final state. Our findings demonstrate a distinct energetic mechanism in mechanochemistry, highlighting alternative strategies for energy-efficient molecular manipulation.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78740-1", "doi": "10.1038/s41467-026-78740-1", "type": "Journal", "journal": "Nature Communications", "title": "Non-polar surface passivation of PbS Quantum Dots using metal thiolates enables photodiodes rivaling InGaAs performance", "authors": "Debranjan Mandal, Yongjie Wang, Carmelita Rodá et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78740-1", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Abstract Colloidal quantum dots (CQDs) short-wave infrared (SWIR) detectors (1-2 µm) are of great interest for a plethora of applications including autonomous driving, machine vision, night and adverse weather imaging, in view of their low-cost and compatibility to read-out electronics. However, to date, CQDs photodetectors still suffer from high dark current and thereby noise such that their perf", "summary": "Abstract Colloidal quantum dots (CQDs) short-wave infrared (SWIR) detectors (1-2 µm) are of great interest for a plethora of applications including autonomous driving, machine vision, night and adverse weather imaging, in view of their low-cost and compatibility to read-out electronics. However, to date, CQDs photodetectors still suffer from high dark current and thereby noise such that their perf", "abstract": "Abstract Colloidal quantum dots (CQDs) short-wave infrared (SWIR) detectors (1-2 µm) are of great interest for a plethora of applications including autonomous driving, machine vision, night and adverse weather imaging, in view of their low-cost and compatibility to read-out electronics. However, to date, CQDs photodetectors still suffer from high dark current and thereby noise such that their performance remains inferior to epitaxially grown III-V semiconductors. This performance gap originates from the limited passivation of non-polar surfaces existent in large PbS CQDs needed to access the SWIR spectral range. Here we report on a lead-thiolate based chemistry that serves to passivate both polar and non-polar surfaces of PbS CQDs yielding inks with unprecedented optoelectronic quality evidenced by open circuit voltage deficit and dark current activation energies matching those of single crystalline semiconductors. As a result, we demonstrate infrared photodetectors with remarkable thermal resilience, very low dark current density ( ~ 34 nA cm −2 at −1 V) and a specific detectivity D* of ~8×10 12 Jones. The measured D* value is on par with that of commercially available InGaAs photodiodes (PDs).", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-sply-f2km", "doi": "10.1103/sply-f2km", "type": "Journal", "journal": "PRL", "title": "Role of Anisotropic Electronic Friction in Laser-Driven Hydrogen Recombination on Copper", "authors": "Alexander Spears, Wojciech G. Stark, Reinhard J. Maurer", "corresponding": "", "url": "https://doi.org/10.1103/sply-f2km", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Ultrafast light-driven chemical dynamics at surfaces are governed by energy transfer from excited electrons to vibrational degrees of freedom. When this nonadiabatic energy transfer is anisotropic, it can lead to dynamical steering effects that affect reaction probabilities or nonthermal final energy distributions in molecules. Here, enabled by a machine-learning-based simulation framework, we com", "summary": "Ultrafast light-driven chemical dynamics at surfaces are governed by energy transfer from excited electrons to vibrational degrees of freedom. When this nonadiabatic energy transfer is anisotropic, it can lead to dynamical steering effects that affect reaction probabilities or nonthermal final energy distributions in molecules. Here, enabled by a machine-learning-based simulation framework, we com", "abstract": "Ultrafast light-driven chemical dynamics at surfaces are governed by energy transfer from excited electrons to vibrational degrees of freedom. When this nonadiabatic energy transfer is anisotropic, it can lead to dynamical steering effects that affect reaction probabilities or nonthermal final energy distributions in molecules. Here, enabled by a machine-learning-based simulation framework, we compare isotropic and anisotropic models of electronic friction during laser-driven hydrogen evolution on the (111) facet of copper. While anisotropic electronic friction determines the rate of energy transfer into the adsorbate and the fluence dependence of desorption probabilities, final translational, vibrational, and rotational energy distributions are mainly governed by the potential energy landscape at the barrier and insensitive to nonadiabatic effects.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-h6t6-v1xx", "doi": "10.1103/h6t6-v1xx", "type": "Journal", "journal": "PRB", "title": "Band structure and topology of a periodically deformed Kitaev honeycomb model", "authors": "Abdullah AlJishi, Ali AlSwaid, Moayad Ekhwan et al.", "corresponding": "", "url": "https://doi.org/10.1103/h6t6-v1xx", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Band structure and topology of a periodically deformed Kitaev honeycomb model", "summary": "Band structure and topology of a periodically deformed Kitaev honeycomb model", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-5cgn-yll2", "doi": "10.1103/5cgn-yll2", "type": "Journal", "journal": "PRB", "title": "Cascade of topological phase transitions and revival of topological zero modes in imperfect double helical liquids", "authors": "Anna Ohorodnyk, Chen-Hsuan Hsu", "corresponding": "", "url": "https://doi.org/10.1103/5cgn-yll2", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Cascade of topological phase transitions and revival of topological zero modes in imperfect double helical liquids", "summary": "Cascade of topological phase transitions and revival of topological zero modes in imperfect double helical liquids", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-lmf2-27g1", "doi": "10.1103/lmf2-27g1", "type": "Journal", "journal": "PRB", "title": "Constructing bulk topological orders via layered gauging", "authors": "Shang Liu", "corresponding": "", "url": "https://doi.org/10.1103/lmf2-27g1", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Constructing bulk topological orders via layered gauging", "summary": "Constructing bulk topological orders via layered gauging", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-lvt5-5y4x", "doi": "10.1103/lvt5-5y4x", "type": "Journal", "journal": "PRB", "title": "Contrasting anomalous Hall mechanisms in Fe 3 GeTe 2 and Fe 5 GeTe 2 : Intrinsic Berry curvature and the emergence of skew scattering", "authors": "Jyoti Saini, Siddharth Kumar, Ankita Tiwari et al.", "corresponding": "", "url": "https://doi.org/10.1103/lvt5-5y4x", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Contrasting anomalous Hall mechanisms in Fe 3 GeTe 2 and Fe 5 GeTe 2 : Intrinsic Berry curvature and the emergence of skew scattering", "summary": "Contrasting anomalous Hall mechanisms in Fe 3 GeTe 2 and Fe 5 GeTe 2 : Intrinsic Berry curvature and the emergence of skew scattering", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-m86k-4m6v", "doi": "10.1103/m86k-4m6v", "type": "Journal", "journal": "PRB", "title": "Coupled topological interface states and phonon molecules in GaAs/AlAs superlattices", "authors": "S. Sandeep, O. Colmegna, C. Xiang et al.", "corresponding": "", "url": "https://doi.org/10.1103/m86k-4m6v", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Topological interface states in one-dimensional superlattices provide spatially localized phonon modes protected by the topology of the underlying band structure. In GaAs/AlAs distributed Bragg reflectors (DBRs), such states can be engineered through band inversion between superlattices with opposite Zak phases within the Su-Schrieffer-Heeger framework. Here, we demonstrate topological phonon mole", "summary": "Topological interface states in one-dimensional superlattices provide spatially localized phonon modes protected by the topology of the underlying band structure. In GaAs/AlAs distributed Bragg reflectors (DBRs), such states can be engineered through band inversion between superlattices with opposite Zak phases within the Su-Schrieffer-Heeger framework. Here, we demonstrate topological phonon mole", "abstract": "Topological interface states in one-dimensional superlattices provide spatially localized phonon modes protected by the topology of the underlying band structure. In GaAs/AlAs distributed Bragg reflectors (DBRs), such states can be engineered through band inversion between superlattices with opposite Zak phases within the Su-Schrieffer-Heeger framework. Here, we demonstrate topological phonon molecules and extended chains formed by coupled nanophononic interface states. By concatenating three superlattices with alternating topology, we realize two coupled interface states that hybridize into symmetric and antisymmetric modes, whose splitting can be tuned over tens of gigahertz by varying the reflectivity of the central DBR. Extending this concept, we engineer chains of up to N = 6 coupled interface states that form narrow topological minibands while remaining strongly localized at the interfaces. We experimentally observe these coupled states in molecular-beam-epitaxy-grown GaAs/AlAs heterostructures using time-domain pump-probe transient reflectivity measurements, and reproduce their behavior using transfer-matrix calculations and a simple analytical model for the mode splitting. These results establish topological interface states as a robust platform for engineering coupled phononic systems and tunable nanophononic architectures in the GHz regime.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75444", "doi": "10.1002/adma.75444", "type": "Journal", "journal": "Advanced Materials", "title": "Decoupling Protection and Doping Unlocks Asymmetric Zn Single Atoms for Efficient Oxygen Reduction", "authors": "Pengcheng Zhao, Xinchen Xu, Liu Yang et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75444", "topic": "Topology & Transport", "level": "Brief", "summary_en": "ABSTRACT Precise manipulation of the coordination environment in single‐atom catalysts is crucial yet challenging for boosting oxygen reduction reaction (ORR) performance. Here we present a sacrificial‐guided etching strategy to activate intrinsically passive d 10 Zn centers in single‐atom catalysts, wherein Bi(NO 3 ) 3 ‐mediated protection preserves ZnN 4 coordination by mitigating excessive etch", "summary": "ABSTRACT Precise manipulation of the coordination environment in single‐atom catalysts is crucial yet challenging for boosting oxygen reduction reaction (ORR) performance. Here we present a sacrificial‐guided etching strategy to activate intrinsically passive d 10 Zn centers in single‐atom catalysts, wherein Bi(NO 3 ) 3 ‐mediated protection preserves ZnN 4 coordination by mitigating excessive etch", "abstract": "ABSTRACT Precise manipulation of the coordination environment in single‐atom catalysts is crucial yet challenging for boosting oxygen reduction reaction (ORR) performance. Here we present a sacrificial‐guided etching strategy to activate intrinsically passive d 10 Zn centers in single‐atom catalysts, wherein Bi(NO 3 ) 3 ‐mediated protection preserves ZnN 4 coordination by mitigating excessive etching, while NaCl‐driven Cl doping imparts a remote electron‐withdrawing effect, concertedly modulating the electronic structure of the Zn centers. This decoupling strategy, which assigns protection and doping to distinct species, unlocks asymmetric Zn single atoms with dual precision over coordination number and dopant configuration. The resulting catalyst achieves an exceptional ORR half‐wave potential of 0.916 V, surpassing commercial Pt/C, and delivers a record peak power density of 258 mW cm −2 with outstanding cycling stability exceeding 450 h in zinc‐air batteries. Integrated theoretical and in situ spectroscopic analyses reveal that Cl incorporation disrupts the symmetric ZnN 4 electronic structure, optimizes the d‐band center, and alters unoccupied orbital hybridization, thereby accelerating O 2 protonation and boosting the overall catalytic activity. This work establishes a well‐defined strategy for the precise construction of single‐atom metal centers, providing insights into the development of high‐performance non‐precious metal electrocatalysts.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-cxsy-gshw", "doi": "10.1103/cxsy-gshw", "type": "Journal", "journal": "PRL", "title": "Directional Transport by Topological Pump of Localized Moiré Bulk States", "authors": "Dan Yao, Zhonghao Fu, Hailong He et al.", "corresponding": "", "url": "https://doi.org/10.1103/cxsy-gshw", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Directional Transport by Topological Pump of Localized Moiré Bulk States", "summary": "Directional Transport by Topological Pump of Localized Moiré Bulk States", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-8yyp-vx4t", "doi": "10.1103/8yyp-vx4t", "type": "Journal", "journal": "PRL", "title": "Electronic Transport in Hexagonal-Boron-Nitride-Encapsulated Graphene Limited by Remote Phonon Scattering", "authors": "K. Dinar, F. Macheda, A. Guandalini et al.", "corresponding": "", "url": "https://doi.org/10.1103/8yyp-vx4t", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Electronic Transport in Hexagonal-Boron-Nitride-Encapsulated Graphene Limited by Remote Phonon Scattering", "summary": "Electronic Transport in Hexagonal-Boron-Nitride-Encapsulated Graphene Limited by Remote Phonon Scattering", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-zw7c-lytz", "doi": "10.1103/zw7c-lytz", "type": "Journal", "journal": "PRB", "title": "Fabry-Pérot interference in three-dimensional nodal line semimetals", "authors": "Xiaohui Wang, Qiongkun Lv, Kun Luo et al.", "corresponding": "", "url": "https://doi.org/10.1103/zw7c-lytz", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Fabry-Pérot interference in three-dimensional nodal line semimetals", "summary": "Fabry-Pérot interference in three-dimensional nodal line semimetals", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-yjsv-yhxk", "doi": "10.1103/yjsv-yhxk", "type": "Journal", "journal": "PRB", "title": "Flux-driven delocalization transition in disordered topological insulator nanowires", "authors": "Shimon Arie Haver, Emuna Rimon, Eytan Grosfeld", "corresponding": "", "url": "https://doi.org/10.1103/yjsv-yhxk", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Flux-driven delocalization transition in disordered topological insulator nanowires", "summary": "Flux-driven delocalization transition in disordered topological insulator nanowires", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75457", "doi": "10.1002/adma.75457", "type": "Journal", "journal": "Advanced Materials", "title": "GaSe x Nanoparticles Modulate Neutrophil Function and Mitigate NET‐Driven Osteogenic Impairment in Osteomyelitis Therapy", "authors": "Kai Ye, Xuanzhe Liu, Zifan Pei et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75457", "topic": "Topology & Transport", "level": "Brief", "summary_en": "ABSTRACT Osteomyelitis remains a major clinical challenge; however, current therapeutic strategies do not sufficiently address host immune defense, inflammatory microenvironment remodeling, or bone regeneration. Here, we show that excessive accumulation of neutrophil extracellular traps (NETs) in infected bone tissues contributes to osteomyelitis‐associated apoptosis and impaired osteogenesis. NET", "summary": "ABSTRACT Osteomyelitis remains a major clinical challenge; however, current therapeutic strategies do not sufficiently address host immune defense, inflammatory microenvironment remodeling, or bone regeneration. Here, we show that excessive accumulation of neutrophil extracellular traps (NETs) in infected bone tissues contributes to osteomyelitis‐associated apoptosis and impaired osteogenesis. NET", "abstract": "ABSTRACT Osteomyelitis remains a major clinical challenge; however, current therapeutic strategies do not sufficiently address host immune defense, inflammatory microenvironment remodeling, or bone regeneration. Here, we show that excessive accumulation of neutrophil extracellular traps (NETs) in infected bone tissues contributes to osteomyelitis‐associated apoptosis and impaired osteogenesis. NETs disrupt PINK1/Parkin‐mediated mitochondrial quality control in osteoblast lineage cells, thereby promoting apoptosis, whereas inhibition of NET formation alleviates these pathological changes and improves bone repair in mice. Bone defects are aggravated in Prkn ‐knockout mice upon the induction of osteomyelitis, supporting the functional role of PINK1/Parkin‐dependent mitophagy in the repair of infected bone. As a therapeutic strategy, gallium–selenium nanoparticles (GaSe x ) exert potent antibacterial activity, redirect neutrophils from NET formation toward phagocytosis, preserve osteoblast mitochondrial homeostasis, attenuate excessive mitophagy, and ultimately promote the repair of infected bone defects in rats. Collectively, these findings support NET‐driven osteoblast mitochondrial injury as a critical repair‐limiting mechanism in osteomyelitis and establish GaSe x as a redox‐regulating platform that modulates this mechanism while preserving neutrophil antibacterial defense.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78654-y", "doi": "10.1038/s41467-026-78654-y", "type": "Journal", "journal": "Nature Communications", "title": "Global-scale variability of glacier velocity and mass loss across terminus environments", "authors": "Joseph Mallalieu, Jonathan L. Carrivick, Matthias Huss et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78654-y", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Abstract The environment in which a glacier terminates can strongly influence its behaviour, stability and future evolution, yet the relationship between terminus type and glacier dynamics at the global scale remains poorly constrained. Here we present a globally-complete classification of glacier termini distinguishing between land, lake, marine and shelf environments, and integrate it with datas", "summary": "Abstract The environment in which a glacier terminates can strongly influence its behaviour, stability and future evolution, yet the relationship between terminus type and glacier dynamics at the global scale remains poorly constrained. Here we present a globally-complete classification of glacier termini distinguishing between land, lake, marine and shelf environments, and integrate it with datas", "abstract": "Abstract The environment in which a glacier terminates can strongly influence its behaviour, stability and future evolution, yet the relationship between terminus type and glacier dynamics at the global scale remains poorly constrained. Here we present a globally-complete classification of glacier termini distinguishing between land, lake, marine and shelf environments, and integrate it with datasets of glacier geometry, dynamics and climate. We show that although lake-, marine- and shelf-terminating glaciers comprise only 3.2% of glaciers globally, they account for over half of global glacier area and mass loss. We also show that lake- and marine-terminating glaciers flow, on average, 10% and 44% faster than land-terminating glaciers, respectively. Furthermore, specific (area-normalised) mass loss rates at lake-terminating glaciers are 57% greater than those at land- and marine-terminating glaciers. Our findings underscore the need for improved representation of non-land glacier termini in models of glacier evolution and sea-level rise, and suggest that distinguishing the environmental and geometric controls of termini on glacier dynamics remains an important challenge for future research.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1073-pnas-2611567123", "doi": "10.1073/pnas.2611567123", "type": "Journal", "journal": "PNAS", "title": "Mechanistic insight into conflicting valence fluctuation of Cu(I) photocorrosion pathways: The role of charge behaviors", "authors": "Yi-Cheng Wang, Chenyu Xu, Peng-Fei Sui et al.", "corresponding": "", "url": "https://doi.org/10.1073/pnas.2611567123", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Photocorrosion remains a major challenge that hinders the development of photoelectrochemical (PEC) solar fuel production. Although Cu 2 O is a promising photocathode material due to its suitable band structure and visible light absorption, both oxidative and reductive photocorrosion pathways have been reported, with no consensus established in the research community in the PEC system. In this wor", "summary": "Photocorrosion remains a major challenge that hinders the development of photoelectrochemical (PEC) solar fuel production. Although Cu 2 O is a promising photocathode material due to its suitable band structure and visible light absorption, both oxidative and reductive photocorrosion pathways have been reported, with no consensus established in the research community in the PEC system. In this wor", "abstract": "Photocorrosion remains a major challenge that hinders the development of photoelectrochemical (PEC) solar fuel production. Although Cu 2 O is a promising photocathode material due to its suitable band structure and visible light absorption, both oxidative and reductive photocorrosion pathways have been reported, with no consensus established in the research community in the PEC system. In this work, we fabricate three Cu 2 O photocathodes with distinct charge transport properties to investigate the correlation between charge accumulation and photocorrosion behavior. Both oxidative and reductive photocorrosion were observed depending on the type and location of charge accumulation. Notably, we propose a refined oxidative photocorrosion mechanism in which photogenerated holes induce surface Cu 2 O dissolution to Cu 2+ , followed by coordination with adsorbed *OH to form Cu(OH) 2 /CuO under illumination, which is contrary to the widely assumed direct oxidation from Cu 2 O to CuO. This work not only provides a unified understanding of the dual photocorrosion pathways in Cu 2 O, but also offers a generalizable framework for understanding photo-induced degradation in metal oxide photocathodes and for guiding the design of more robust PEC systems through charge transport engineering.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-1rkh-nhq5", "doi": "10.1103/1rkh-nhq5", "type": "Journal", "journal": "PRB", "title": "Microscopic study of topological phase transitions: Percolation point of view", "authors": "Keisuke Kataoka, Ikuo Ichinose", "corresponding": "", "url": "https://doi.org/10.1103/1rkh-nhq5", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Microscopic study of topological phase transitions: Percolation point of view", "summary": "Microscopic study of topological phase transitions: Percolation point of view", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-hys8-c2rs", "doi": "10.1103/hys8-c2rs", "type": "Journal", "journal": "PRB", "title": "Open Wilson chain numerical renormalization group approach to steady-state nonequilibrium quantum transport", "authors": "Anand Manaparambil, Frithjof B. Anders", "corresponding": "", "url": "https://doi.org/10.1103/hys8-c2rs", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Open Wilson chain numerical renormalization group approach to steady-state nonequilibrium quantum transport", "summary": "Open Wilson chain numerical renormalization group approach to steady-state nonequilibrium quantum transport", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-w75t-4cz7", "doi": "10.1103/w75t-4cz7", "type": "Journal", "journal": "PRB", "title": "Spatiotemporal dynamics of heat-pulse propagation in graphite via phonon Boltzmann transport equation", "authors": "Yan Huang, Wanying Liu, Yangyu Guo et al.", "corresponding": "", "url": "https://doi.org/10.1103/w75t-4cz7", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Spatiotemporal dynamics of heat-pulse propagation in graphite via phonon Boltzmann transport equation", "summary": "Spatiotemporal dynamics of heat-pulse propagation in graphite via phonon Boltzmann transport equation", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78578-7", "doi": "10.1038/s41467-026-78578-7", "type": "Journal", "journal": "Nature Communications", "title": "Suppressor tRNAs restore functionally enhanced tumour suppressor protein to induce tumour regression", "authors": "Bangyan Kong, Zhetao Zheng, Zeyuan Mi et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78578-7", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Abstract Nonsense mutations in tumour suppressor genes (TSGs) drive cancer initiation and progression but remain “undruggable” due to formidable challenges in rescuing the functional impairment of heterogeneous truncated proteins with a single agent. Here we observe that suppressor transfer RNAs (sup-tRNAs) can overcome diverse nonsense mutations in TP53 , restoring full-length p53 expression and ", "summary": "Abstract Nonsense mutations in tumour suppressor genes (TSGs) drive cancer initiation and progression but remain “undruggable” due to formidable challenges in rescuing the functional impairment of heterogeneous truncated proteins with a single agent. Here we observe that suppressor transfer RNAs (sup-tRNAs) can overcome diverse nonsense mutations in TP53 , restoring full-length p53 expression and ", "abstract": "Abstract Nonsense mutations in tumour suppressor genes (TSGs) drive cancer initiation and progression but remain “undruggable” due to formidable challenges in rescuing the functional impairment of heterogeneous truncated proteins with a single agent. Here we observe that suppressor transfer RNAs (sup-tRNAs) can overcome diverse nonsense mutations in TP53 , restoring full-length p53 expression and function. Sup-tRNAs enable high-fidelity incorporation of optimal amino acids and can further enhance the transcriptional activity of p53 to suppress tumour cell proliferation. Moreover, we employ a computational model to guide sup-tRNA design by in silico saturation mutagenesis for targeted readthrough of different nonsense-mutant TSGs. Remarkably, sup-tRNAs produced p53 variants with enhanced activity relative to restored wild-type p53, reducing cancer cell colony area by up to 82%. In two xenograft models harbouring nonsense mutant TP53 , we observed up to a 74% reduction in tumour volume after lipid nanoparticle (LNP)-based sup-tRNA treatment, attributed to robust recovery of p53 expression and function. Critically, sup-tRNA monotherapy surpassed nab-paclitaxel chemotherapy in efficacy, and their combination induced near-complete tumour regression (a maximum of 93% reduction in tumour volume) without detectable toxicity in multiple mouse tumour models. Our findings highlight the potential of tRNA-based therapy to provide a promising strategy for rescuing nonsense-mutant TP53 .", "method": "", "result": "", "future": ""}, {"id": "doi-10-1073-pnas-2603847123", "doi": "10.1073/pnas.2603847123", "type": "Journal", "journal": "PNAS", "title": "The survival paradox of close-in planets orbiting red-clump giants", "authors": "Wen-Xu Lin, Sheng-Bang Qian, Qi-Bin Sun et al.", "corresponding": "", "url": "https://doi.org/10.1073/pnas.2603847123", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Close-in planets orbiting core-helium-burning red-clump giants directly challenge tidal-engulfment theory, which predicts that planets within about 1 au of Sun-like stars should be engulfed during red-giant-branch (RGB) expansion. The existence of such survivors would imply missing physical processes in the late stages of stellar and planetary evolution. Yet only one such “forbidden” planet had be", "summary": "Close-in planets orbiting core-helium-burning red-clump giants directly challenge tidal-engulfment theory, which predicts that planets within about 1 au of Sun-like stars should be engulfed during red-giant-branch (RGB) expansion. The existence of such survivors would imply missing physical processes in the late stages of stellar and planetary evolution. Yet only one such “forbidden” planet had be", "abstract": "Close-in planets orbiting core-helium-burning red-clump giants directly challenge tidal-engulfment theory, which predicts that planets within about 1 au of Sun-like stars should be engulfed during red-giant-branch (RGB) expansion. The existence of such survivors would imply missing physical processes in the late stages of stellar and planetary evolution. Yet only one such “forbidden” planet had been identified to date. Here we report three systems—24 Boo b, HD 12648 b, and TYC 4282-605-1 b—whose host stars are confirmed red-clump giants through asteroseismology, showing that each has already undergone dramatic expansion and contraction following helium ignition. Their planets now reside at orbital separations smaller than the maximum stellar radii attained during the RGB phase, implying that they should not have survived. Among them, 24 Boo b orbits at only 0.183 au with a 30-d period, making it the closest planet known around a red-clump giant. These findings demonstrate that this paradox is not an isolated anomaly but signals the emergence of a class of evolved planetary systems. Their survival defies current models of stellar–planetary coevolution and points to unexplored physics shaping planetary architectures around post-RGB stars.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78154-z", "doi": "10.1038/s41467-026-78154-z", "type": "Journal", "journal": "Nature Communications", "title": "Topology and evolution of global transcriptional regulatory networks across the Klebsiella pneumoniae pan-genome", "authors": "Beifang Lu, Tongtong Feng, Letong Xu et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78154-z", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Topology and evolution of global transcriptional regulatory networks across the Klebsiella pneumoniae pan-genome", "summary": "Topology and evolution of global transcriptional regulatory networks across the Klebsiella pneumoniae pan-genome", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-8vvl-cs6t", "doi": "10.1103/8vvl-cs6t", "type": "Journal", "journal": "PRB", "title": "Transport in close-packed solids with stacking defects", "authors": "C. M. Wilson, R. Ganesh, K. V. Samokhin", "corresponding": "", "url": "https://doi.org/10.1103/8vvl-cs6t", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Transport in close-packed solids with stacking defects", "summary": "Transport in close-packed solids with stacking defects", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78839-5", "doi": "10.1038/s41467-026-78839-5", "type": "Journal", "journal": "Nature Communications", "title": "Unveiling the functional specialisation of human white matter circuits with naturalistic stimuli", "authors": "M. Ovando-Tellez, C. Foulon, V. Nozais et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78839-5", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Abstract Functional MRI (fMRI) has traditionally focused on grey matter activations, overlooking the contribution of white matter pathways to brain organisation. Yet evidence suggests that white matter constrains, modulates, and integrates signals across distant regions. Here, we introduce a framework to map the functional specialisation of white matter circuits using fMRI scans collected while pa", "summary": "Abstract Functional MRI (fMRI) has traditionally focused on grey matter activations, overlooking the contribution of white matter pathways to brain organisation. Yet evidence suggests that white matter constrains, modulates, and integrates signals across distant regions. Here, we introduce a framework to map the functional specialisation of white matter circuits using fMRI scans collected while pa", "abstract": "Abstract Functional MRI (fMRI) has traditionally focused on grey matter activations, overlooking the contribution of white matter pathways to brain organisation. Yet evidence suggests that white matter constrains, modulates, and integrates signals across distant regions. Here, we introduce a framework to map the functional specialisation of white matter circuits using fMRI scans collected while participants watched naturalistic videos. By leveraging ecologically valid stimuli, this method captures cognition as it naturally unfolds. Integrating fMRI with brain connections, we derived a functionally grounded parcellation of the connectome, challenging conventional cortical-based cognitive taxonomy. Distinct cognitive profiles emerged for association and commissural fibres, with association pathways preferentially linked to language-related processes and commissural pathways to executive and motor functions, affirming the functionally heterogeneous nature of white matter systems. An artificial intelligence framework applied to independent datasets confirmed the robustness and functional relevance of the identified parcels. This open-access framework also enables the interactive exploration of white matter functional organisation, offering a new lens on the neural bases of cognition.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78870-6", "doi": "10.1038/s41467-026-78870-6", "type": "Journal", "journal": "Nature Communications", "title": "Water in kimberlitic olivine provides insights into kimberlite ascent and diamond transport", "authors": "Soumendu Sarkar, Rondi M. Davies, Qiwei Zhang et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78870-6", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Water in kimberlitic olivine provides insights into kimberlite ascent and diamond transport", "summary": "Water in kimberlitic olivine provides insights into kimberlite ascent and diamond transport", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31031", "arxiv_id": "2610.31031", "type": "arXiv", "journal": "arXiv:2610.31031", "journal_ref": "", "title": "Contact Renormalization of One-Mode Electron Correlation: Validation in Four- and Ten-Electron Systems", "authors": "Itai Panas", "corresponding": "", "url": "https://arxiv.org/abs/2610.31031", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "A stationary many-electron eigenstate has one dynamical phase although its internal response can be strongly multimode. We ask whether the stationary Hartree--Fock information carrier contains enough information to determine the scalar correlation energy through one effective return. In regularized Hartree--Fock, Gaussian primitive products fix a minimum-information relative-coordinate mode before", "summary": "A stationary many-electron eigenstate has one dynamical phase although its internal response can be strongly multimode. We ask whether the stationary Hartree--Fock information carrier contains enough information to determine the scalar correlation energy through one effective return. In regularized Hartree--Fock, Gaussian primitive products fix a minimum-information relative-coordinate mode before", "abstract": "A stationary many-electron eigenstate has one dynamical phase although its internal response can be strongly multimode. We ask whether the stationary Hartree--Fock information carrier contains enough information to determine the scalar correlation energy through one effective return. In regularized Hartree--Fock, Gaussian primitive products fix a minimum-information relative-coordinate mode before any one-mode reduction; virial completion defines the correlation source, while exact contact measures the additional return restriction created by neighboring occupied pairs. The Be-like $1s^22s^2$ sequence establishes the one-valence-pair boundary: with no neighboring occupied valence pair, the source returns through the universal floor $D_0=\\sqrt{1+δ^2}$. Ten-electron molecules and Ne-like ions then test how finite-pair contact dresses that return. The same parameter-free source--return construction reproduces the established molecular and ionic correlation trends with quantitative accuracy. The numerical agreement therefore serves as validation of a physical separation between source strength and return restriction, rather than as the objective by itself.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30870", "arxiv_id": "2610.30870", "type": "arXiv", "journal": "arXiv:2610.30870", "journal_ref": "", "title": "Designing sustainable high-entropy alloys directly from mixed oxides: A thermodynamic perspective", "authors": "Albert Linda, Shiv Shankar, Dierk Raabe", "corresponding": "", "url": "https://arxiv.org/abs/2610.30870", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "Hydrogen-based direct reduction (HyDR) of mixed oxide precursors offers an alternative route to produce sustainable alloys, bypassing the sequential extraction, refining, and remelting steps that dominate the carbon footprint of conventional metallurgy and individual metal production. However, the thermodynamic limits and most effective H$_2$/H$_2$O ratio needed for full metallization of multicomp", "summary": "Hydrogen-based direct reduction (HyDR) of mixed oxide precursors offers an alternative route to produce sustainable alloys, bypassing the sequential extraction, refining, and remelting steps that dominate the carbon footprint of conventional metallurgy and individual metal production. However, the thermodynamic limits and most effective H$_2$/H$_2$O ratio needed for full metallization of multicomp", "abstract": "Hydrogen-based direct reduction (HyDR) of mixed oxide precursors offers an alternative route to produce sustainable alloys, bypassing the sequential extraction, refining, and remelting steps that dominate the carbon footprint of conventional metallurgy and individual metal production. However, the thermodynamic limits and most effective H$_2$/H$_2$O ratio needed for full metallization of multicomponent oxides are not yet established. This is because the formation of metallic and oxide solid solutions alters the chemical activity of both the reduced metallic phases and the unreduced oxides, coupling their equilibria in ways that cannot be deduced from the stability of the pure individual oxides. Herein, we develop a CALPHAD-based thermodynamic framework to establish the compoistion-temperature-H$_2$/H$_2$O window for complete metallization of CoCrFeMnNi-based oxide mixtures. Mn and Cr generally increase oxide stability, while Co, Fe, and Ni decrease it, allowing reduction at lower H$_2$/H$_2$O ratios. The effect of each element is not fixed; it depends on the starting mixed oxide composition and can reverse when the last oxide to reduce changes. Furthermore, we show that the reduction pathway complexity does not correlate with the difficulty of removing the final oxygen: a system with few intermediate transformation steps can still terminate as a highly stable residual oxide, whereas extensive partial reduction may leave the stability of the final residual oxide essentially unchanged. By linking residual-oxide stability to the H$_2$/H$_2$O ratio, the framework identifies the thermodynamic limits and provides guidelines for designing sustainable multicomponent alloys directly from mixed oxide precursors.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30627", "arxiv_id": "2610.30627", "type": "arXiv", "journal": "arXiv:2610.30627", "journal_ref": "", "title": "Emergent Entropic Forces Drive Inverse and Reentrant Phase Transitions in Condensates of Intrinsically Disordered Proteins", "authors": "David A. Herrera-Martí, Marc Jamin", "corresponding": "", "url": "https://arxiv.org/abs/2610.30627", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "We present a phenomenological, mean-field model for condensates of intrinsically disordered proteins that describes inverse phase transitions and qualitatively predicts reentrant phase behavior as a function of salt concentration. The model is based on a matrix-based formulation of the Flory-Huggins free energy, in which the enthalpic interaction parameter and the protein valence, defined here as ", "summary": "We present a phenomenological, mean-field model for condensates of intrinsically disordered proteins that describes inverse phase transitions and qualitatively predicts reentrant phase behavior as a function of salt concentration. The model is based on a matrix-based formulation of the Flory-Huggins free energy, in which the enthalpic interaction parameter and the protein valence, defined here as ", "abstract": "We present a phenomenological, mean-field model for condensates of intrinsically disordered proteins that describes inverse phase transitions and qualitatively predicts reentrant phase behavior as a function of salt concentration. The model is based on a matrix-based formulation of the Flory-Huggins free energy, in which the enthalpic interaction parameter and the protein valence, defined here as the number of effective \"sticky patches\", are treated as free parameters. Its central insight is that integrating out dynamics of fast-moving molecular species generates an effective entropic force that increases the free-energy barrier to mixing, even within a mean-field description. We account for this by linking Gaussian integration of co-solutes to the Schur complement of the matrix-based Flory-Huggins free energy. This provides a general thermodynamic framework illustrating how enthalpic interactions that increase the number of available microstates necessarily induce effective entropic forces. We demonstrate the expressiveness and predictive power of the model by qualitatively reproducing recent experimental observations on the rabies virus phosphoprotein.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31350", "arxiv_id": "2610.31350", "type": "arXiv", "journal": "arXiv:2610.31350", "journal_ref": "", "title": "Graph-Recurrent Learning of Emergent Collective Dynamics", "authors": "Ali Rayat, Acacia Lee, Gia-Wei Chern", "corresponding": "", "url": "https://arxiv.org/abs/2610.31350", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "Collective ordering in correlated electron systems emerges from microscopic dynamics, yet the evolution of observable textures need not admit a closed, memoryless description. We introduce a graph-recurrent neural network (GRNN) framework that learns such emergent dynamics directly from trajectories without specifying microscopic equations of motion. The framework integrates gated recurrent memory", "summary": "Collective ordering in correlated electron systems emerges from microscopic dynamics, yet the evolution of observable textures need not admit a closed, memoryless description. We introduce a graph-recurrent neural network (GRNN) framework that learns such emergent dynamics directly from trajectories without specifying microscopic equations of motion. The framework integrates gated recurrent memory", "abstract": "Collective ordering in correlated electron systems emerges from microscopic dynamics, yet the evolution of observable textures need not admit a closed, memoryless description. We introduce a graph-recurrent neural network (GRNN) framework that learns such emergent dynamics directly from trajectories without specifying microscopic equations of motion. The framework integrates gated recurrent memory with graph message passing: local hidden states encode information beyond the instantaneous observables, while spatial coupling allows this information to propagate between sites. The observable and hidden fields evolve jointly through a shared local rule, providing a scalable representation of dynamics with spatial interactions and temporal memory. We demonstrate this framework on the emergent dynamics of charge-density-wave order in the semiclassical Holstein model, successfully reproducing temporal and spatial correlations and dynamical scaling during domain coarsening. By learning finite-time evolution directly, the GRNN offers a route to efficient, data-driven descriptions of collective dynamics with unresolved microscopic degrees of freedom.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30641", "arxiv_id": "2610.30641", "type": "arXiv", "journal": "arXiv:2610.30641", "journal_ref": "", "title": "How good are universal MLIPs for alloys? A benchmark is only as trustworthy as its controls", "authors": "Gus L. W. Hart, Jacob N. Pursley", "corresponding": "", "url": "https://arxiv.org/abs/2610.30641", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "Universal machine-learned interatomic potentials (uMLIPs) are ranked by their formation-energy error against a DFT database, as if that database were ground truth, but independent DFT databases disagree. We benchmark fourteen uMLIPs on 1.45 million ordered intermetallics against AFLOW, which none trained on, and compare every energy and stability error with that disagreement. For half the structur", "summary": "Universal machine-learned interatomic potentials (uMLIPs) are ranked by their formation-energy error against a DFT database, as if that database were ground truth, but independent DFT databases disagree. We benchmark fourteen uMLIPs on 1.45 million ordered intermetallics against AFLOW, which none trained on, and compare every energy and stability error with that disagreement. For half the structur", "abstract": "Universal machine-learned interatomic potentials (uMLIPs) are ranked by their formation-energy error against a DFT database, as if that database were ground truth, but independent DFT databases disagree. We benchmark fourteen uMLIPs on 1.45 million ordered intermetallics against AFLOW, which none trained on, and compare every energy and stability error with that disagreement. For half the structures, AFLOW, Alexandria, and OQMD differ by less than 6-8 meV/atom, but a minority differ by far more, raising the average to 16-30. That disagreement sets a floor on any model's measurable error. Re-referenced, the best uMLIP agrees with AFLOW as closely as Alexandria does, and the next four sit 2-7 meV/atom above the floor. Once broken elemental references are screened, the energy and stability rankings agree almost everywhere. Three apparent model failures shrink or vanish under the right control: poorly correlated shear moduli, thousands of \"bad\" DFT references, and the leader's inflated lead.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2512-13044", "arxiv_id": "2512.13044", "type": "arXiv", "journal": "Physical Review Research (2026)", "journal_ref": "Physical Review Research (2026)", "title": "Imaginary-time-enhanced feedback-based quantum algorithms for universal ground-state preparation", "authors": "Thanh Nguyen Van Long, Lan Nguyen Tran, Le Bin Ho", "corresponding": "", "url": "https://arxiv.org/abs/2512.13044", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "Preparing ground states of strongly correlated quantum systems is a central goal in quantum simulation and optimization. The feedback-based quantum algorithm (FALQON) provides an attractive alternative to variational methods with a fully quantum feedback rule, but it fails in the presence of spectral degeneracies, where the feedback signal collapses and the evolution cannot reach the ground state.", "summary": "Preparing ground states of strongly correlated quantum systems is a central goal in quantum simulation and optimization. The feedback-based quantum algorithm (FALQON) provides an attractive alternative to variational methods with a fully quantum feedback rule, but it fails in the presence of spectral degeneracies, where the feedback signal collapses and the evolution cannot reach the ground state.", "abstract": "Preparing ground states of strongly correlated quantum systems is a central goal in quantum simulation and optimization. The feedback-based quantum algorithm (FALQON) provides an attractive alternative to variational methods with a fully quantum feedback rule, but it fails in the presence of spectral degeneracies, where the feedback signal collapses and the evolution cannot reach the ground state. Using the Fermi-Hubbard model on lattices up to 3x3, we show that this breakdown appears at half-filling on the 2x2 lattice and extends to both half-filled and doped configurations on the 3x3 lattice. We then introduce an imaginary-time-enhanced FALQON ($i$FALQON) scheme, which inserts short imaginary-time evolution steps into the feedback loop. This proposed method suppresses excited-state components, escapes degenerate subspaces, restores monotonic energy descent and improves ground-state convergence across the tested fillings. We further benchmark its performance against existing methods, showing improved results for iFALQON, demonstrating the potential of hybrid real-imaginary-time feedback dynamics for ground-state preparation in strongly correlated quantum systems.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30964", "arxiv_id": "2610.30964", "type": "arXiv", "journal": "arXiv:2610.30964", "journal_ref": "", "title": "Intensity-driven Mott-like transition in a 2D Ruddlesden-Popper perovskite", "authors": "Koushik Mondal, Amit Haldar, Indrajit Mondal et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30964", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "Two-dimensional Ruddlesden-Popper-type halide perovskites have emerged as promising cutting-edge nonlinear optical materials due to their strong excitonic effects and carrier-density-dependent optical responses. In this work, we investigate the nonlinear optical properties and ultrafast carrier dynamics of (BA)$_2$PbI$_4$ under infrared excitation, resonant with the two-photon energy of its excito", "summary": "Two-dimensional Ruddlesden-Popper-type halide perovskites have emerged as promising cutting-edge nonlinear optical materials due to their strong excitonic effects and carrier-density-dependent optical responses. In this work, we investigate the nonlinear optical properties and ultrafast carrier dynamics of (BA)$_2$PbI$_4$ under infrared excitation, resonant with the two-photon energy of its excito", "abstract": "Two-dimensional Ruddlesden-Popper-type halide perovskites have emerged as promising cutting-edge nonlinear optical materials due to their strong excitonic effects and carrier-density-dependent optical responses. In this work, we investigate the nonlinear optical properties and ultrafast carrier dynamics of (BA)$_2$PbI$_4$ under infrared excitation, resonant with the two-photon energy of its excitonic transition. Using a nonlinear femtosecond Z-scan measurement with a 1030\\,nm pump pulse, we observe a pronounced intensity-dependent evolution of the nonlinear absorption coefficient and the refractive index. With increasing pump intensity, a switch from saturable absorption to reverse saturable absorption emerges, suggesting an intensity-driven Mott-like transition. To elucidate the underlying carrier dynamics, intensity-dependent transient absorption spectroscopy was performed under the same excitation intensities. This reveals a long-lived charge carrier population above the estimated Mott density, reflecting a clear phase transition from an exciton-dominated regime to a dense electron-hole plasma regime. Moreover, such an intensity-driven, high, and switchable nonlinear optical response, along with a Mott-like transition under infrared pulse excitation, makes the 2D (BA)$_2$PbI$_4$ perovskites suitable for all-optical operation in the infrared regime.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30741", "arxiv_id": "2610.30741", "type": "arXiv", "journal": "arXiv:2610.30741", "journal_ref": "", "title": "Localization Contrast As a Fundamental Limit of Radiative Quantum Efficiency", "authors": "Arsineh Apelian, Tanay Tak, Xuance Jiang et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30741", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "Disorder can localize valence- and conduction-band states to different degrees, yet whether such localization contrast has observable consequences remains poorly understood. Here, we show that localization contrast strongly impacts competing carrier-recombination channels. We illustrate this behavior in random In$_x$Ga$_{1-x}$N alloys. Increasing the In content from $x=13.5\\%$ to $x=22\\%$ progress", "summary": "Disorder can localize valence- and conduction-band states to different degrees, yet whether such localization contrast has observable consequences remains poorly understood. Here, we show that localization contrast strongly impacts competing carrier-recombination channels. We illustrate this behavior in random In$_x$Ga$_{1-x}$N alloys. Increasing the In content from $x=13.5\\%$ to $x=22\\%$ progress", "abstract": "Disorder can localize valence- and conduction-band states to different degrees, yet whether such localization contrast has observable consequences remains poorly understood. Here, we show that localization contrast strongly impacts competing carrier-recombination channels. We illustrate this behavior in random In$_x$Ga$_{1-x}$N alloys. Increasing the In content from $x=13.5\\%$ to $x=22\\%$ progressively localizes the valence-band maximum state while leaving the conduction-band minimum state comparatively delocalized. This contrasting localization decreases the interband optical momentum matrix element underlying radiative recombination. For Auger-Meitner recombination, however, localization alone does not determine the coupling; atomic-scale disorder also breaks primitive-cell translational symmetry and modifies the momentum-space and phase structure of the states. This generates additional low-$Q$ components and enhances the Auger coupling by more than five orders of magnitude relative to pristine GaN. Thus, we provide a microscopic explanation for the competing trends in radiative and Auger recombination. More broadly, our results establish localization contrast as a mechanism through which disorder can control optical and carrier-carrier interactions in semiconductors.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2602-22463", "arxiv_id": "2602.22463", "type": "arXiv", "journal": "arXiv:2602.22463", "journal_ref": "", "title": "Many-Body effects beyond excitons in second-harmonic generation of monolayer MoS$_{2}$", "authors": "Peio Garcia-Goiricelaya, Julen Ibañez-Azpiroz", "corresponding": "", "url": "https://arxiv.org/abs/2602.22463", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "We present a quantitative study of many-body effects including the three-particle level on second-harmonic generation in monolayer MoS$_2$. Our approach combines many-body perturbation theory with time-dependent current-density-functional theory within an \\textit{ab initio} framework in the optical limit. The inclusion of two-particle excitonic effects \\textit{via} a dynamical long-range linear ex", "summary": "We present a quantitative study of many-body effects including the three-particle level on second-harmonic generation in monolayer MoS$_2$. Our approach combines many-body perturbation theory with time-dependent current-density-functional theory within an \\textit{ab initio} framework in the optical limit. The inclusion of two-particle excitonic effects \\textit{via} a dynamical long-range linear ex", "abstract": "We present a quantitative study of many-body effects including the three-particle level on second-harmonic generation in monolayer MoS$_2$. Our approach combines many-body perturbation theory with time-dependent current-density-functional theory within an \\textit{ab initio} framework in the optical limit. The inclusion of two-particle excitonic effects \\textit{via} a dynamical long-range linear exchange-correlation kernel reproduces the qualitative features of the second-harmonic response, but differs from the experimentally reported magnitude by nearly a factor of two. By incorporating three-particle trionic correlations through a static long-range quadratic exchange-correlation kernel, we achieve significantly improved quantitative agreement with experiment for the three main bound excitonic resonances. These findings suggest that many-body interactions beyond the two-body excitonic level can play an important role in accurately describing second-order optical responses in two-dimensional semiconductors.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30287", "arxiv_id": "2610.30287", "type": "arXiv", "journal": "arXiv:2610.30287", "journal_ref": "", "title": "Non-Destructive Detection of Early Drought Stress via Spectral Submanifold Analysis", "authors": "Sunghwan Jung, Isabella Thiel, Jisoo Yuk et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30287", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "Non-destructive early detection of water stress is critical for precision agriculture, yet current detection methods are often labor-intensive or destructive. We propose a rapid, non-invasive method based on Spectral Submanifold (SSM) reduction to analyze the nonlinear vibration dynamics of soybean plants. Unlike traditional linear modal analysis, our data-driven approach reveals a distinct transi", "summary": "Non-destructive early detection of water stress is critical for precision agriculture, yet current detection methods are often labor-intensive or destructive. We propose a rapid, non-invasive method based on Spectral Submanifold (SSM) reduction to analyze the nonlinear vibration dynamics of soybean plants. Unlike traditional linear modal analysis, our data-driven approach reveals a distinct transi", "abstract": "Non-destructive early detection of water stress is critical for precision agriculture, yet current detection methods are often labor-intensive or destructive. We propose a rapid, non-invasive method based on Spectral Submanifold (SSM) reduction to analyze the nonlinear vibration dynamics of soybean plants. Unlike traditional linear modal analysis, our data-driven approach reveals a distinct transition in the dominant dynamics of the plant stem as drought progresses. Specifically, we uncover a sign reversal in the nonlinear damping coefficient within SSM-reduced models of full plants. Our finding reveals a fundamental transition in the plant's dissipative mechanics from a pressurized, fluid-rich vessel exhibiting superlinear (viscoelastic) damping to a dry, cellular solid dominated by sublinear (frictional) damping. This transition is closely correlated with the onset of physiological stress indicated by a significant decrease in the values of mature-leaf soil plant analysis development (SPAD) and colorimetric metrics. In contrast, traditional metrics, such as linear frequency and leaf wilting, do not provide consistent statistical signals of water stress. This study provides the first experimental evidence that SSM-based nonlinear model reduction can detect the changing internal state of a living organism, offering a physics-based metric for high-throughput plant phenotyping.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31330", "arxiv_id": "2610.31330", "type": "arXiv", "journal": "arXiv:2610.31330", "journal_ref": "", "title": "Quantum Fokker-Planck solvers as trainable generative models", "authors": "Tariq Mahassen, Marcin Jastrzebski, Oleksandr Kyriienko", "corresponding": "", "url": "https://arxiv.org/abs/2610.31330", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "We develop and analyze generative models based on quantum solvers of stochastic differential equations. Unlike the common approach based on layered variational quantum circuits with parameterized rotations, we parameterize the potential of a Langevin process. The associated Fokker-Planck (FP) equations are Hermitianized and solved using a linear combination of cosine operators implemented through ", "summary": "We develop and analyze generative models based on quantum solvers of stochastic differential equations. Unlike the common approach based on layered variational quantum circuits with parameterized rotations, we parameterize the potential of a Langevin process. The associated Fokker-Planck (FP) equations are Hermitianized and solved using a linear combination of cosine operators implemented through ", "abstract": "We develop and analyze generative models based on quantum solvers of stochastic differential equations. Unlike the common approach based on layered variational quantum circuits with parameterized rotations, we parameterize the potential of a Langevin process. The associated Fokker-Planck (FP) equations are Hermitianized and solved using a linear combination of cosine operators implemented through quantum singular value transformation. By encoding the square root of the stationary density, the model enables sampling through computational-basis measurements and is efficiently controlled by coefficients of the block-encoded diagonal potential. We train the proposed model to match empirical distributions within the family described by FP equations, demonstrating parameter recovery for multivariate probability distributions. Crucially, the model remains trainable at scale. Sample-efficient and convex optimization for in-distribution targets arises from a physics-informed inductive bias and holds regardless of the dimensionality of the problem. We provide circuit constructions and efficient block encodings of the main components of the algorithm and analyze resource requirements. Our approach frames quantum generative learning as quantum model discovery and provides a foundation for extending this framework to high-dimensional, strongly correlated scientific data.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30236", "arxiv_id": "2610.30236", "type": "arXiv", "journal": "arXiv:2610.30236", "journal_ref": "", "title": "Reentrant $d=2+1$ Superfluidity at High Temperature", "authors": "Subham Dutta Chowdhury, Joan Elias Miro", "corresponding": "", "url": "https://arxiv.org/abs/2610.30236", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "We present a UV-complete model with a global $U(1)$ symmetry in $d=2+1$ dimensions that exhibits a Berezinskii-Kosterlitz-Thouless (BKT) ordered phase at arbitrarily high temperatures. A careful separation of scales yields a two-dimensional Euclidean effective field theory whose construction remains perturbatively controlled even when its soft modes become strongly coupled. We determine the BKT ph", "summary": "We present a UV-complete model with a global $U(1)$ symmetry in $d=2+1$ dimensions that exhibits a Berezinskii-Kosterlitz-Thouless (BKT) ordered phase at arbitrarily high temperatures. A careful separation of scales yields a two-dimensional Euclidean effective field theory whose construction remains perturbatively controlled even when its soft modes become strongly coupled. We determine the BKT ph", "abstract": "We present a UV-complete model with a global $U(1)$ symmetry in $d=2+1$ dimensions that exhibits a Berezinskii-Kosterlitz-Thouless (BKT) ordered phase at arbitrarily high temperatures. A careful separation of scales yields a two-dimensional Euclidean effective field theory whose construction remains perturbatively controlled even when its soft modes become strongly coupled. We determine the BKT phase boundary by carefully matching this theory to existing lattice Monte Carlo results. The high-temperature phase supports gapless static modes and algebraically decaying correlations even as $T\\to\\infty$.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30290", "arxiv_id": "2610.30290", "type": "arXiv", "journal": "arXiv:2610.30290", "journal_ref": "", "title": "$π$-Flux Tuning of Quantum Paramagnetism in the Triangular-Lattice Hubbard Model", "authors": "Zhaochen Liu, Andreas Feuerpfeil, Ronny Thomale", "corresponding": "", "url": "https://arxiv.org/abs/2610.30290", "topic": "Magnetism", "level": "Brief", "summary_en": "We compare two time-reversal-symmetric triangular-lattice Hubbard models at half filling: the zero-flux model and a staggered $π$-flux model with zero and $π$ flux through oppositely oriented triangles. Although both reduce to the same Heisenberg model at leading order in the strong-coupling limit, their distinct charge fluctuation profiles yield different quantum paramagnetic regimes. Combining a", "summary": "We compare two time-reversal-symmetric triangular-lattice Hubbard models at half filling: the zero-flux model and a staggered $π$-flux model with zero and $π$ flux through oppositely oriented triangles. Although both reduce to the same Heisenberg model at leading order in the strong-coupling limit, their distinct charge fluctuation profiles yield different quantum paramagnetic regimes. Combining a", "abstract": "We compare two time-reversal-symmetric triangular-lattice Hubbard models at half filling: the zero-flux model and a staggered $π$-flux model with zero and $π$ flux through oppositely oriented triangles. Although both reduce to the same Heisenberg model at leading order in the strong-coupling limit, their distinct charge fluctuation profiles yield different quantum paramagnetic regimes. Combining a strong-coupling expansion with infinite density matrix renormalization group (iDMRG) calculations, we find that the positive ring-exchange of the zero-flux model promotes spontaneous chirality, consistent with its notion of a chiral spin liquid at intermediate coupling. In the staggered-$π$-flux model, whose noninteracting limit is a Dirac semimetal, the ring exchange changes sign and disfavors chiral order and we find no resolvable scalar chirality. This renders flux-tuned ring-exchange an efficient discriminator between chiral and non-chiral quantum paramagnets at finite coupling.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2502-18933", "arxiv_id": "2502.18933", "type": "arXiv", "journal": "(2025). Phys. Rev. B, 112, 024433", "journal_ref": "(2025). Phys. Rev. B, 112, 024433", "title": "Antiferromagnetic resonance in $α$-MnTe", "authors": "J. Dzian, P. Kubaščík, S. Tázlarů et al.", "corresponding": "", "url": "https://arxiv.org/abs/2502.18933", "topic": "Magnetism", "level": "Brief", "summary_en": "Antiferromagnetic resonance in a bulk $α$-MnTe crystal is investigated using both frequency-domain and time-domain THz spectroscopy techniques. At low temperatures, an excitation at the photon energy of $(3.5\\pm 0.1)$~meV is observed and identified as a magnon mode through its distinctive dependence on temperature and magnetic field. This behavior is reproduced using a simplified model for antifer", "summary": "Antiferromagnetic resonance in a bulk $α$-MnTe crystal is investigated using both frequency-domain and time-domain THz spectroscopy techniques. At low temperatures, an excitation at the photon energy of $(3.5\\pm 0.1)$~meV is observed and identified as a magnon mode through its distinctive dependence on temperature and magnetic field. This behavior is reproduced using a simplified model for antifer", "abstract": "Antiferromagnetic resonance in a bulk $α$-MnTe crystal is investigated using both frequency-domain and time-domain THz spectroscopy techniques. At low temperatures, an excitation at the photon energy of $(3.5\\pm 0.1)$~meV is observed and identified as a magnon mode through its distinctive dependence on temperature and magnetic field. This behavior is reproduced using a simplified model for antiferromagnetic resonance in an easy-plane antiferromagnet. The results of our experiments, when compared to exchange constants established in the literature, allow us to extract the out-of-plane component of the single-ion magnetic anisotropy reaching $(40\\pm10)$~$μ$eV.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30743", "arxiv_id": "2610.30743", "type": "arXiv", "journal": "arXiv:2610.30743", "journal_ref": "", "title": "Anyon Chern bands of opposite sign and reversed drift", "authors": "Zhenyu Xiao, Minxuan Wang, Shinsei Ryu", "corresponding": "", "url": "https://arxiv.org/abs/2610.30743", "topic": "Magnetism", "level": "Brief", "summary_en": "The elementary charged excitations of fractional quantum Hall states are anyons. Without continuous translation symmetry, they acquire a dispersion and richer dynamics. We study the Laughlin quasihole at filling $1/3$ in a periodically modulated magnetic field, a common model of fractional Chern insulators in two-dimensional materials. From the microscopic wave functions, we derive the commutator ", "summary": "The elementary charged excitations of fractional quantum Hall states are anyons. Without continuous translation symmetry, they acquire a dispersion and richer dynamics. We study the Laughlin quasihole at filling $1/3$ in a periodically modulated magnetic field, a common model of fractional Chern insulators in two-dimensional materials. From the microscopic wave functions, we derive the commutator ", "abstract": "The elementary charged excitations of fractional quantum Hall states are anyons. Without continuous translation symmetry, they acquire a dispersion and richer dynamics. We study the Laughlin quasihole at filling $1/3$ in a periodically modulated magnetic field, a common model of fractional Chern insulators in two-dimensional materials. From the microscopic wave functions, we derive the commutator of its guiding-center coordinates, set by a many-body Berry curvature that governs its wave packets. A modulation with two flux quanta per unit cell splits the quasihole band into bands with Chern numbers $6$ and $-3$; such opposite signs are generic as long as a weak modulation opens a gap between the anyon bands. In the $C=-3$ band, the quasihole drifts against $\\mathbf{E}\\times\\mathbf{B}$, although the magnetic field has the same sign everywhere. Perturbation theory in the modulation explains these results, and large-scale Monte Carlo calculations confirm them. Anyon bands thus acquire their own topology, which controls anyon motion and may shape the phases of itinerant anyons.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30502", "arxiv_id": "2610.30502", "type": "arXiv", "journal": "arXiv:2610.30502", "journal_ref": "", "title": "Chiral Cavity Vacua as Local Generators and Probes of Non-Abelian Kitaev Topology", "authors": "Yu Zhang", "corresponding": "", "url": "https://arxiv.org/abs/2610.30502", "topic": "Magnetism", "level": "Brief", "summary_en": "We show how a gyrotropic cavity vacuum generates, probes, and spatially programs non-Abelian topology in the Kitaev honeycomb model. Gauge-consistent virtual-photon elimination produces a universal helicity-odd interaction $\\mathrm{i}[P_x,P_y]$ alongside same-order even dressing. For the leading bond polarization, this commutator is exactly the Kitaev three-spin mass. Mode normalization imposes a ", "summary": "We show how a gyrotropic cavity vacuum generates, probes, and spatially programs non-Abelian topology in the Kitaev honeycomb model. Gauge-consistent virtual-photon elimination produces a universal helicity-odd interaction $\\mathrm{i}[P_x,P_y]$ alongside same-order even dressing. For the leading bond polarization, this commutator is exactly the Kitaev three-spin mass. Mode normalization imposes a ", "abstract": "We show how a gyrotropic cavity vacuum generates, probes, and spatially programs non-Abelian topology in the Kitaev honeycomb model. Gauge-consistent virtual-photon elimination produces a universal helicity-odd interaction $\\mathrm{i}[P_x,P_y]$ alongside same-order even dressing. For the leading bond polarization, this commutator is exactly the Kitaev three-spin mass. Mode normalization imposes a thermodynamic constraint: one extended normalized mode gives a local mass that vanishes with sample area, whereas a localized mode writes a finite topological island and a finite mode density enables a bulk mass. The exact Majorana solution yields helicity-reversed Chern gaps and edge propagation, while integrated circular dichroism exactly measures the mass generator, $\\langle\\mathrm{i}[P_x,P_y]\\rangle=-\\sqrt3p^2\\langle O_3\\rangle$. Real-space calculations reveal a non-Abelian island and a helicity wall with two co-propagating Majorana modes. Uniform helicity reversal is a Dirac-mass quench with $n_{\\rm ex}\\proptoτ_Q^{-1}$, whereas moving a wall localizes the gap closing. The equilibrium vacuum kernel contains sum-frequency rather than resonant denominators. These results establish distinct criteria for local and bulk cavity-induced topology.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2606-04841", "arxiv_id": "2606.04841", "type": "arXiv", "journal": "arXiv:2606.04841", "journal_ref": "", "title": "Chiral Transport in Metric-Affine Geometries", "authors": "Miguel A. Vazquez-Mozo", "corresponding": "", "url": "https://arxiv.org/abs/2606.04841", "topic": "Magnetism", "level": "Brief", "summary_en": "Anomalous transport in equilibrium fermionic fluids chirally coupled to background Weyl-type nonmetricity is studied. A formal descent analysis is carried out in which the dependence of the anomaly polynomial on the nonmetricity tensor is encoded in a Weyl invariant four-form. The constitutive relation of the axial-vector current is evaluated from the equilibrium partition function obtained using ", "summary": "Anomalous transport in equilibrium fermionic fluids chirally coupled to background Weyl-type nonmetricity is studied. A formal descent analysis is carried out in which the dependence of the anomaly polynomial on the nonmetricity tensor is encoded in a Weyl invariant four-form. The constitutive relation of the axial-vector current is evaluated from the equilibrium partition function obtained using ", "abstract": "Anomalous transport in equilibrium fermionic fluids chirally coupled to background Weyl-type nonmetricity is studied. A formal descent analysis is carried out in which the dependence of the anomaly polynomial on the nonmetricity tensor is encoded in a Weyl invariant four-form. The constitutive relation of the axial-vector current is evaluated from the equilibrium partition function obtained using transgression techniques, showing the existence of nonmetricity-mediated chiral separation effects driven by the fluid's vorticity and the Weyl magnetic field. A second nonminimal coupling of fermionic matter to metric-affine geometries proposed in the literature is also discussed.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30416", "arxiv_id": "2610.30416", "type": "arXiv", "journal": "arXiv:2610.30416", "journal_ref": "", "title": "Design of Nuclear and Magnetic Scattering Length Density Profiles", "authors": "Alexandros Barnasas, Edward J. Stuckey, Alexei A. Vorobiev et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30416", "topic": "Magnetism", "level": "Brief", "summary_en": "The scattering length density (SLD) profile of a sample can be deliberately designed to enhance the information of interest obtained from neutron reflectometry. Here, we demonstrate this approach using amorphous $\\mathrm{Fe}_{x}\\mathrm{Co}_{y}\\mathrm{Al}_{8}\\mathrm{Zr}_{2}$ thin films. Four samples, each comprising ten repetitions of an AlZr spacer layer and a magnetic layer, were prepared with ma", "summary": "The scattering length density (SLD) profile of a sample can be deliberately designed to enhance the information of interest obtained from neutron reflectometry. Here, we demonstrate this approach using amorphous $\\mathrm{Fe}_{x}\\mathrm{Co}_{y}\\mathrm{Al}_{8}\\mathrm{Zr}_{2}$ thin films. Four samples, each comprising ten repetitions of an AlZr spacer layer and a magnetic layer, were prepared with ma", "abstract": "The scattering length density (SLD) profile of a sample can be deliberately designed to enhance the information of interest obtained fro
