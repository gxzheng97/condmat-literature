predominantly electrostatic, and n-type edges are not an intrinsic consequence of oxygen-plasma etching. A design map shows that fringing dominates the width dependence whenever the gate dielectric is thicker than 30-50 nm, whereas in scaled high-K transistors, edge charge dominates and would shift the threshold voltage of a 10 nm ribbon by ~ 0.1-0.15 V. Fitting the CNP versus width with the strip capacitance provides a simple test for edge doping in any gated two-dimensional nanostructure", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31126", "arxiv_id": "2610.31126", "type": "arXiv", "journal": "arXiv:2610.31126", "journal_ref": "", "title": "Entropy-production cost limits hierarchical decision-making in homing pigeon flocks", "authors": "Bibaswan Ghosh, Vipul Rai, Harsh Soni et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.31126", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Collective decision-making requires individuals to reconcile diverse, often conflicting opinions to reach a common course of action. However, within a group, they rarely exert equal influence, leading to non-reciprocal communication patterns manifested as leader-follower relationships and social hierarchies. Here, using homing pigeon flocks as a model system, we develop a trajectory-based framewor", "summary": "Collective decision-making requires individuals to reconcile diverse, often conflicting opinions to reach a common course of action. However, within a group, they rarely exert equal influence, leading to non-reciprocal communication patterns manifested as leader-follower relationships and social hierarchies. Here, using homing pigeon flocks as a model system, we develop a trajectory-based framewor", "abstract": "Collective decision-making requires individuals to reconcile diverse, often conflicting opinions to reach a common course of action. However, within a group, they rarely exert equal influence, leading to non-reciprocal communication patterns manifested as leader-follower relationships and social hierarchies. Here, using homing pigeon flocks as a model system, we develop a trajectory-based framework to infer and quantify hierarchy within navigating living collectives. We find that while small flocks exhibit pronounced hierarchy, increasing flock size progressively weakens it, driving the collection toward more egalitarian decision-making. We provide a physical basis of this observation using a thermodynamic framework in which non-reciprocal communication between birds carries an information-entropy cost. Our calculations reveal that hierarchy weakening observed in larger flocks is a direct consequence of maintaining a constant per-individual entropy production rate across flock sizes. Together, these results suggest that constraints on information-processing capacity may play an important role in the collective dynamics of living organisms.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30189", "arxiv_id": "2610.30189", "type": "arXiv", "journal": "arXiv:2610.30189", "journal_ref": "", "title": "Foresight-dependent entropy production in stochastic two-agent dynamics", "authors": "Arpan Dey", "corresponding": "", "url": "https://arxiv.org/abs/2610.30189", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Nonreciprocal interactions can break detailed balance by sustaining stationary probability currents. Here we ask whether such currents can also emerge when the agents' immediate coordination preferences are reciprocal, but their state-adjustment rules are determined by forward-looking optimization (foresight). We study a minimal stochastic linear-quadratic game in which two agents control noisy sc", "summary": "Nonreciprocal interactions can break detailed balance by sustaining stationary probability currents. Here we ask whether such currents can also emerge when the agents' immediate coordination preferences are reciprocal, but their state-adjustment rules are determined by forward-looking optimization (foresight). We study a minimal stochastic linear-quadratic game in which two agents control noisy sc", "abstract": "Nonreciprocal interactions can break detailed balance by sustaining stationary probability currents. Here we ask whether such currents can also emerge when the agents' immediate coordination preferences are reciprocal, but their state-adjustment rules are determined by forward-looking optimization (foresight). We study a minimal stochastic linear-quadratic game in which two agents control noisy scalar states and minimize individual discounted costs in a full-information feedback Nash equilibrium. The optimized controls yield an Ornstein-Uhlenbeck process whose stationary probability current and entropy-production rate, measuring statistical time-irreversibility, can be calculated exactly. For reciprocal coordination with unequal self-anchoring strengths, the effective drift asymmetry first appears at order $τ^5$, where $τ$ is the planning timescale, and the normalized entropy production consequently scales as $τ^8$ in the limit $τ\\to0$. We derive this cancellation from the coupled Nash Riccati equations. For conformist-contrarian coupling, normalized entropy production approaches a nonzero short-foresight limit and initially decreases from that limit by an amount proportional to $τ^2$. We also determine the long-foresight limit for a conformist-contrarian pair with equal self-anchoring strengths. Numerical solutions of the full Nash equations verify the asymptotic laws and reveal the effect of foresight. Thus, forward-looking optimization can generate or reduce normalized stationary irreversibility, depending on the underlying interaction.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2605-29958", "arxiv_id": "2605.29958", "type": "arXiv", "journal": "arXiv:2605.29958", "journal_ref": "", "title": "Lattice Brownian bees with cooperative reproduction: steady states, collapse, and spreading", "authors": "Ohad Vilk, Baruch Meerson", "corresponding": "", "url": "https://arxiv.org/abs/2605.29958", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "We extend the ``Brownian bees'' model of Berestycki et al.\\ (2021, 2022) to cooperative reproduction, $kA\\to(k{+}1)A$, of a population of $N$ symmetric random walkers with removal, at each birth event, of the particle farthest from the origin. Working in the limit $N\\to\\infty$, we formulate a hydrodynamic free-boundary problem for this model. Using this formalism, we determine steady state populat", "summary": "We extend the ``Brownian bees'' model of Berestycki et al.\\ (2021, 2022) to cooperative reproduction, $kA\\to(k{+}1)A$, of a population of $N$ symmetric random walkers with removal, at each birth event, of the particle farthest from the origin. Working in the limit $N\\to\\infty$, we formulate a hydrodynamic free-boundary problem for this model. Using this formalism, we determine steady state populat", "abstract": "We extend the ``Brownian bees'' model of Berestycki et al.\\ (2021, 2022) to cooperative reproduction, $kA\\to(k{+}1)A$, of a population of $N$ symmetric random walkers with removal, at each birth event, of the particle farthest from the origin. Working in the limit $N\\to\\infty$, we formulate a hydrodynamic free-boundary problem for this model. Using this formalism, we determine steady state population densities for all~$k$ and prove their linear stability for $k\\le 2$ and instability for $k\\ge 4$. In the marginal case $k=3$, there is a whole continuous family of steady states at a single critical ratio of the reproduction and diffusion rates. Above criticality the population undergoes an asymptotically self-similar finite-time collapse to the origin. Below the criticality the population spreads diffusively, but the reproduction remains quantitatively relevant. For $k\\ge 4$, the unstable steady state separates regimes of a finite-time collapse and diffusive spreading. Here the collapse dynamics is asymptotically self-similar, and the population density exhibits a scale separation requiring a matched-asymptotic description. Our analytical predictions are confirmed by numerical solutions of the hydrodynamic free-boundary problem and by Monte Carlo simulations of the original microscopic model.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2603-19411", "arxiv_id": "2603.19411", "type": "arXiv", "journal": "arXiv:2603.19411", "journal_ref": "", "title": "Level 2.5 large deviations and uncertainty relations for self-interacting jump processes: tilting constructions and the emergence of time-scale separation", "authors": "Francesco Coghi, Juan P. Garrahan", "corresponding": "", "url": "https://arxiv.org/abs/2603.19411", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Self-interacting jump processes (SIJPs) describe systems with non-Markovian stochastic dynamics in which transition rates depend on empirical observables of the process, which gives rise to long-range memory and feedback. We derive the ``level-2.5'' large deviation (LD) principle governing the joint fluctuations of empirical occupation measure and the flux matrix for a broad class of SIJPs with ge", "summary": "Self-interacting jump processes (SIJPs) describe systems with non-Markovian stochastic dynamics in which transition rates depend on empirical observables of the process, which gives rise to long-range memory and feedback. We derive the ``level-2.5'' large deviation (LD) principle governing the joint fluctuations of empirical occupation measure and the flux matrix for a broad class of SIJPs with ge", "abstract": "Self-interacting jump processes (SIJPs) describe systems with non-Markovian stochastic dynamics in which transition rates depend on empirical observables of the process, which gives rise to long-range memory and feedback. We derive the ``level-2.5'' large deviation (LD) principle governing the joint fluctuations of empirical occupation measure and the flux matrix for a broad class of SIJPs with general functional dependence on an empirical observable. The derivation is based on an exponential tilting construction and reveals a separation between a faster timescale of the microscopic dynamics and a slower timescale of the memory-driven evolution of transition rates, which is expressed through an exponentially discounted LD rate functional. Using this variational framework, we derive kinetic and thermodynamic uncertainty relations that extend classical Markovian bounds to non-Markovian systems, and illustrate their performance with simple examples.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2604-12464", "arxiv_id": "2604.12464", "type": "arXiv", "journal": "arXiv:2604.12464", "journal_ref": "", "title": "Many-body localization", "authors": "Jakub Zakrzewski", "corresponding": "", "url": "https://arxiv.org/abs/2604.12464", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "We present an introductory review of nonergodic dynamics in interacting many-body quantum systems, focusing on the phenomenon of many-body localization (MBL). We describe aspects of MBL and summarize the evidence for a crossover from the ergodic to the MBL regime in finite systems, using the paradigmatic XXZ model as an example. We then broaden the scope to other models to illustrate the generalit", "summary": "We present an introductory review of nonergodic dynamics in interacting many-body quantum systems, focusing on the phenomenon of many-body localization (MBL). We describe aspects of MBL and summarize the evidence for a crossover from the ergodic to the MBL regime in finite systems, using the paradigmatic XXZ model as an example. We then broaden the scope to other models to illustrate the generalit", "abstract": "We present an introductory review of nonergodic dynamics in interacting many-body quantum systems, focusing on the phenomenon of many-body localization (MBL). We describe aspects of MBL and summarize the evidence for a crossover from the ergodic to the MBL regime in finite systems, using the paradigmatic XXZ model as an example. We then broaden the scope to other models to illustrate the generality of the phenomenon. We briefly touch on the largely unexplored relation between MBL and quantum computing.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2507-21602", "arxiv_id": "2507.21602", "type": "arXiv", "journal": "arXiv:2507.21602", "journal_ref": "", "title": "On buoyancy in disperse two-phase flow and its impact on the well-posedness of two-fluid models", "authors": "Rui Zhu, Yulan Chen, Katharina Tholen et al.", "corresponding": "", "url": "https://arxiv.org/abs/2507.21602", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "The Maxey--Riley--Gatignol equation for the flow around a sphere at low particle Reynolds number tells us that the fluid-particle interaction force decomposes into a contribution from the local flow disturbance caused by the particle's boundary---consisting of the drag, virtual-mass, and history forces, and their Faxén corrections---and another contribution from the stress of the background flow, ", "summary": "The Maxey--Riley--Gatignol equation for the flow around a sphere at low particle Reynolds number tells us that the fluid-particle interaction force decomposes into a contribution from the local flow disturbance caused by the particle's boundary---consisting of the drag, virtual-mass, and history forces, and their Faxén corrections---and another contribution from the stress of the background flow, ", "abstract": "The Maxey--Riley--Gatignol equation for the flow around a sphere at low particle Reynolds number tells us that the fluid-particle interaction force decomposes into a contribution from the local flow disturbance caused by the particle's boundary---consisting of the drag, virtual-mass, and history forces, and their Faxén corrections---and another contribution from the stress of the background flow, termed generalized-buoyancy force. There is also a consensus that, for general disperse two-phase flow, the interfacial force density, coupling the average fluid phase and dispersed-phase momentum balances, decomposes in a like manner. However, there has been a long-standing controversy about the physical closure separating the generalized-buoyancy from the interfacial force density, especially whether or not pseudo-stresses, such as the Reynolds stress, should be attributed to the background flow. Furthermore, most existing propositions for this closure involve small-particle approximations. Here, we show that all existing buoyancy closures are inconsistent with particle-resolving numerical simulations and/or at least one of two simple thought experiments designed to determine the roles of pseudo-stresses and small-particle approximations. We then derive the unique consistent closure. It requires no approximation and implies that all stresses and pseudo-stresses in the average fluid phase momentum balance, except the Reynolds stress, fully contribute to the background flow responsible for buoyancy. Remarkably, it exhibits a low-pass filter property, attenuating buoyancy at short wavelengths, that prevents it from causing Hadamard instabilities, constituting a first-principles-based solution to the long-standing ill-posedness problem of two-fluid models. When employing the derived closure, even simplistic two-fluid models are linearly well-posed.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31244", "arxiv_id": "2610.31244", "type": "arXiv", "journal": "arXiv:2610.31244", "journal_ref": "", "title": "Optimal Search Strategies under Finite Resource Constraints: The Role of Environmental Memory and Directional Information in Informed and Blind Protocols", "authors": "Hugues Meyer", "corresponding": "", "url": "https://arxiv.org/abs/2610.31244", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Improving the efficiency of a stochastic search often requires to provide the searching agent with resources that modify its dynamics and help it explore space more quickly. Although such resources are often assumed to be unlimited and treated as a cost to mitigate, many realistic search processes operate under a finite resource budget, e.g. in processes with environmental memory in which the sear", "summary": "Improving the efficiency of a stochastic search often requires to provide the searching agent with resources that modify its dynamics and help it explore space more quickly. Although such resources are often assumed to be unlimited and treated as a cost to mitigate, many realistic search processes operate under a finite resource budget, e.g. in processes with environmental memory in which the sear", "abstract": "Improving the efficiency of a stochastic search often requires to provide the searching agent with resources that modify its dynamics and help it explore space more quickly. Although such resources are often assumed to be unlimited and treated as a cost to mitigate, many realistic search processes operate under a finite resource budget, e.g. in processes with environmental memory in which the searcher deposits long-lasting cues along its path that it can interact with at later times to guide its further search. Here, we address the question of how to allocate a limited budget to maximize search efficiency by investigating a one-dimensional diffusing agent whose access to resources is constrained. We consider three resource models, namely an external force applied by an external controller to pull the searcher towards the target, directional flags deposited by the searcher along its path that redirect its motion towards the target, and self-generated chemorepulsive cues that act as a force field. For all these models, we find that resource usage should be concentrated in narrow regions of space when information about the searcher's current and past positions is available. In contrast, in blind strategies where a predefined time protocol is followed, resources should be used at a steady rate to ensure it to be used at most of its capacity by the time it reaches the target. We further show that blind strategies in non-Markovian processes with environmental memory are significantly less efficient due to the inherent fluctuations in the locations of deposited cues.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-26356", "arxiv_id": "2610.26356", "type": "arXiv", "journal": "arXiv:2610.26356", "journal_ref": "", "title": "Origins of Faceted Anomalous Scaling", "authors": "Maximilien Bernard, José Luis Iguain, Alejandro Kolton et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.26356", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Fluctuating interfaces are typically characterized by their global, spectral, and local roughness exponents. Faceted anomalous scaling, characterized by $α_s>1$, $α_s\\neqα$, and $α_{\\mathrm{loc}}=1$, owes its name to the tendency of such interfaces to develop long, nearly linear segments called facets. Its statistical origin, and whether facets are required, have remained unclear. We show that thi", "summary": "Fluctuating interfaces are typically characterized by their global, spectral, and local roughness exponents. Faceted anomalous scaling, characterized by $α_s>1$, $α_s\\neqα$, and $α_{\\mathrm{loc}}=1$, owes its name to the tendency of such interfaces to develop long, nearly linear segments called facets. Its statistical origin, and whether facets are required, have remained unclear. We show that thi", "abstract": "Fluctuating interfaces are typically characterized by their global, spectral, and local roughness exponents. Faceted anomalous scaling, characterized by $α_s>1$, $α_s\\neqα$, and $α_{\\mathrm{loc}}=1$, owes its name to the tendency of such interfaces to develop long, nearly linear segments called facets. Its statistical origin, and whether facets are required, have remained unclear. We show that this exponent structure is determined by the spatial statistics of the slope field. Slope increments split into typical fluctuations and rare, larger jumps. This anomalous scaling arises either when the typical slope increment displays genuine system-size-dependent anomalous scaling or when the rare jumps dominate the second moment. The two contributions can coexist, and their competition leads to bifractal scaling of the slopes. We establish this framework analytically in the generalized anharmonic Larkin model and the columnar Kardar--Parisi--Zhang equation, and we derive exactly the global, spectral, and local roughness exponents in both cases. The Larkin model realizes both mechanisms and produces anomalous interfaces with or without facets, whereas columnar KPZ belongs to the jump-dominated case and yields $α_s=3/2$.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31067", "arxiv_id": "2610.31067", "type": "arXiv", "journal": "arXiv:2610.31067", "journal_ref": "", "title": "Scale-free localization in pseudo-Hermitian quantum walk", "authors": "Haiting Zhang, Lei Xiao, Cui-Xian Guo et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.31067", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Scale-free localization is a distinctive phenomenon in non-Hermitian systems, where specific eigenstates, known as scale-free localized states (LSs), possess localization lengths that scale linearly with the system size. Here, we show that a single non-Hermitian defect in one-dimensional quantum walks (QWs) induces scale-free localization. Driven by non-Hermiticity, the QW system undergoes a pseud", "summary": "Scale-free localization is a distinctive phenomenon in non-Hermitian systems, where specific eigenstates, known as scale-free localized states (LSs), possess localization lengths that scale linearly with the system size. Here, we show that a single non-Hermitian defect in one-dimensional quantum walks (QWs) induces scale-free localization. Driven by non-Hermiticity, the QW system undergoes a pseud", "abstract": "Scale-free localization is a distinctive phenomenon in non-Hermitian systems, where specific eigenstates, known as scale-free localized states (LSs), possess localization lengths that scale linearly with the system size. Here, we show that a single non-Hermitian defect in one-dimensional quantum walks (QWs) induces scale-free localization. Driven by non-Hermiticity, the QW system undergoes a pseudo-Hermitian (PH) phase transition and the PH symmetry breaking is accompanied by the emergence of scale-free localization. As non-Hermiticity is further increased, the system undergoes a second phase transition, marked by the emergence of two pairs of bound states. Crucially, we identify the critical points of both transitions using localization properties. Furthermore, we extend our investigation to two-dimensional QWs, where a single non-Hermitian defect also induces scale-free localization, thereby demonstrating the universality of this phenomenon. Our work provides a valuable perspective for further exploring defect physics and a type of novel LS in non-Hermitian quantum systems.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31541", "arxiv_id": "2610.31541", "type": "arXiv", "journal": "arXiv:2610.31541", "journal_ref": "", "title": "Sign-problem-free Bosonic Auxiliary Field Quantum Monte Carlo", "authors": "Yin-Kai Yu, Zhong-Chao Wei, Zi-Xiang Li", "corresponding": "", "url": "https://arxiv.org/abs/2610.31541", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "The sign problem poses a fundamental barrier to numerically exact quantum Monte Carlo simulations, severely hindering our understanding of quantum many-body physics across disciplines ranging from condensed matter to particle and nuclear physics. Geometrical frustration makes this barrier especially acute for interacting bosons. Here, we develop a bosonic auxiliary-field quantum Monte Carlo (BAFQM", "summary": "The sign problem poses a fundamental barrier to numerically exact quantum Monte Carlo simulations, severely hindering our understanding of quantum many-body physics across disciplines ranging from condensed matter to particle and nuclear physics. Geometrical frustration makes this barrier especially acute for interacting bosons. Here, we develop a bosonic auxiliary-field quantum Monte Carlo (BAFQM", "abstract": "The sign problem poses a fundamental barrier to numerically exact quantum Monte Carlo simulations, severely hindering our understanding of quantum many-body physics across disciplines ranging from condensed matter to particle and nuclear physics. Geometrical frustration makes this barrier especially acute for interacting bosons. Here, we develop a bosonic auxiliary-field quantum Monte Carlo (BAFQMC) method and rigorously prove that time-reversal symmetry and reflection positivity each provide a general sufficient condition for sign-problem-free simulations. Crucially, under either criterion, BAFQMC evades the sign problem even on frustrated lattices where conventional world-line and stochastic-series-expansion methods fail. Benchmarking our approach on a two-flavor Bose-Hubbard model on the triangular lattice yields excellent quantitative agreement with finite-temperature exact diagonalization. By establishing unifying principles to solve the sign problem in BAFQMC, our work substantially expands the reach of unbiased, numerically exact simulations for frustrated bosonic matter.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31190", "arxiv_id": "2610.31190", "type": "arXiv", "journal": "arXiv:2610.31190", "journal_ref": "", "title": "Site and bond percolation thresholds of all $k$-uniform tilings with $k\\le 10$", "authors": "Maksim Elisov", "corresponding": "", "url": "https://arxiv.org/abs/2610.31190", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "We determine the site and bond percolation thresholds of all 23,396 $k$-uniform tilings of the plane by regular polygons with $k\\le 10$, the complete set according to the known enumeration. We use Monte Carlo simulation on tori and the condition that no wrapping and a cross-wrapping cluster are equally probable, the Monte Carlo form of the critical-polynomial criterion, which needs no knowledge of", "summary": "We determine the site and bond percolation thresholds of all 23,396 $k$-uniform tilings of the plane by regular polygons with $k\\le 10$, the complete set according to the known enumeration. We use Monte Carlo simulation on tori and the condition that no wrapping and a cross-wrapping cluster are equally probable, the Monte Carlo form of the critical-polynomial criterion, which needs no knowledge of", "abstract": "We determine the site and bond percolation thresholds of all 23,396 $k$-uniform tilings of the plane by regular polygons with $k\\le 10$, the complete set according to the known enumeration. We use Monte Carlo simulation on tori and the condition that no wrapping and a cross-wrapping cluster are equally probable, the Monte Carlo form of the critical-polynomial criterion, which needs no knowledge of the large-scale anisotropy that most of these lattices have. The 486 thresholds with $k\\le4$ have uncertainties of a few units in the sixth decimal and reproduce the 22 Archimedean reference values (rms deviation 0.71 standard errors) and unpublished bond thresholds of the 20 two-uniform lattices ($χ^2=19.5$ for 20 values); the others have median statistical uncertainties of $2\\times10^{-5}$ ($k\\le7$) to $7\\times10^{-5}$ ($k\\ge8$) and no detectable finite-size bias. The vertex-type fractions alone fix the thresholds for $k\\ge5$ to about $2\\times10^{-3}$ (linear rule fitted on $k\\le4$), while tilings with equal composition differ by up to $6\\times10^{-3}$ (site) and $2\\times10^{-2}$ (bond). In the range of domain sizes covered, descriptors of radius one account for more than half of this difference, and stackings of identical strips have thresholds linear in the fraction of each boundary type. For tilings that differ only by the registry of strips separated by $h$ rows of squares, the bond threshold difference decreases by a factor of 6-8 per row, comparable to the leading momentum-$π$ eigenvalue of the square-band transfer matrix.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2505-17679", "arxiv_id": "2505.17679", "type": "arXiv", "journal": "arXiv:2505.17679", "journal_ref": "", "title": "Sparse SYK quantum batteries: Boosting quantum efficiency by reducing complexity", "authors": "Giovanni Sisorio, Alberto Cappellaro, Luca Dell'Anna", "corresponding": "", "url": "https://arxiv.org/abs/2505.17679", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "In the context of energy storage at the nanoscale, exploring the notion of quantum advantage implies walking on the thin line at the boundary between quantum mechanics and thermodynamics, which underpins our conventional understanding of battery devices. With no classical analogue, the Sachdev-Ye-Kitaev (SYK) model has emerged in the last years as a promising platform to boost charging and storage", "summary": "In the context of energy storage at the nanoscale, exploring the notion of quantum advantage implies walking on the thin line at the boundary between quantum mechanics and thermodynamics, which underpins our conventional understanding of battery devices. With no classical analogue, the Sachdev-Ye-Kitaev (SYK) model has emerged in the last years as a promising platform to boost charging and storage", "abstract": "In the context of energy storage at the nanoscale, exploring the notion of quantum advantage implies walking on the thin line at the boundary between quantum mechanics and thermodynamics, which underpins our conventional understanding of battery devices. With no classical analogue, the Sachdev-Ye-Kitaev (SYK) model has emerged in the last years as a promising platform to boost charging and storage efficiency thanks to its highly-entangling dynamics. Here, we explore how the robustness of this setup by considering the sparse version of the SYK model, showing that, as long as chaos is not completely broken, reducing its complexity may lead to more efficient quantum batteries amplifying the charging power.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30169", "arxiv_id": "2610.30169", "type": "arXiv", "journal": "Physica A 701 (2026) 132041", "journal_ref": "Physica A 701 (2026) 132041", "title": "Stochastic Diversity Stabilization in Nonlinear Competitive Dynamics: A Statistical Mechanics Approach to Fluctuation Suppression and Finite-Size Scaling", "authors": "Ruocun Ou", "corresponding": "", "url": "https://arxiv.org/abs/2610.30169", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Stochastic forcing can prevent diversity collapse in competitive dynamical systems, yet the quantitative conditions and the dynamical mechanism responsible remain poorly characterized. We address both questions in a class of nonlinear stochastic replicator dynamics on the N-dimensional probability simplex, parameterized by a nonlinearity exponent gamma and additive Gaussian noise of intensity sigm", "summary": "Stochastic forcing can prevent diversity collapse in competitive dynamical systems, yet the quantitative conditions and the dynamical mechanism responsible remain poorly characterized. We address both questions in a class of nonlinear stochastic replicator dynamics on the N-dimensional probability simplex, parameterized by a nonlinearity exponent gamma and additive Gaussian noise of intensity sigm", "abstract": "Stochastic forcing can prevent diversity collapse in competitive dynamical systems, yet the quantitative conditions and the dynamical mechanism responsible remain poorly characterized. We address both questions in a class of nonlinear stochastic replicator dynamics on the N-dimensional probability simplex, parameterized by a nonlinearity exponent gamma and additive Gaussian noise of intensity sigma. Under the baseline interaction, the minimum noise required to sustain diversity decays as a power law, sigma_c ~ N^(-alpha); replacing the baseline interaction with a superlinear variant shifts alpha from about 1.1 to about 2.0, in agreement with a linear-stability prediction alpha = (gamma+2)/2, identifying alpha as a model-specific quantity rather than a universal index. Scanning the (gamma, sigma) plane reveals a smooth dynamical crossover: the fluctuation susceptibility chi_H = N Var(H) peaks at gamma ~ 0.7 (chi_H ~ 0.6) and is suppressed at high gamma, with no divergence near gamma ~ 1.4; matched finite-size analysis finds no systematic divergence of the peak with N, ruling out a genuine second-order phase transition. The entropy relaxation time tau_relax(gamma) remains approximately constant (about 2.9 time units) across the full range of gamma, even as chi_H decreases sixfold; this decoupling between relaxation timescale and fluctuation amplitude implies that suppression arises from convergence of diverse pathways to similar endpoints rather than from accelerated relaxation along a single channel. These findings identify nonlinear fluctuation suppression via pathway multiplicity -- distinct from both noise-induced transitions and equilibrium criticality -- as the operative stabilization pattern in this class of nonequilibrium stochastic systems.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30749", "arxiv_id": "2610.30749", "type": "arXiv", "journal": "arXiv:2610.30749", "journal_ref": "", "title": "Strain Waves Generate Compression and Trigger Buckling in Active Polymers", "authors": "Wen-de Tian, Kang Chen, Tianhui Zhang", "corresponding": "", "url": "https://arxiv.org/abs/2610.30749", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Chemical reactions can sustain polymer motion without necessarily generating the compression required for buckling. Theory and simulations show that tension-dependent chemical transitions coupled to bond elasticity generate finite-wavelength traveling strain waves in a semiflexible polymer. In the straight chain at fixed axial span, the waves reduce mean active contraction while leaving mean elast", "summary": "Chemical reactions can sustain polymer motion without necessarily generating the compression required for buckling. Theory and simulations show that tension-dependent chemical transitions coupled to bond elasticity generate finite-wavelength traveling strain waves in a semiflexible polymer. In the straight chain at fixed axial span, the waves reduce mean active contraction while leaving mean elast", "abstract": "Chemical reactions can sustain polymer motion without necessarily generating the compression required for buckling. Theory and simulations show that tension-dependent chemical transitions coupled to bond elasticity generate finite-wavelength traveling strain waves in a semiflexible polymer. In the straight chain at fixed axial span, the waves reduce mean active contraction while leaving mean elastic tension unchanged, generating compression that drives bending above a threshold. Releasing the mean load allows longitudinal waves to persist while transverse perturbations decay.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30831", "arxiv_id": "2610.30831", "type": "arXiv", "journal": "Ind. Eng. Chem. Res., 65, 21859-21871 (2026)", "journal_ref": "Ind. Eng. Chem. Res., 65, 21859-21871 (2026)", "title": "Surface morphology and shear effect on lubricated granular system", "authors": "Ravindra S. Ghodake, Ashish V. Orpe", "corresponding": "", "url": "https://arxiv.org/abs/2610.30831", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Improving the particle surface frictional behavior is of considerable importance in several industries so as to manipulate the powder flowability and handling. In this work, we have studied the lubrication phenomena in an assembly of flowing bulk powder particles in presence of a fine powder lubricant. Experiments were conducted in two different shear environments, for two different levels of conf", "summary": "Improving the particle surface frictional behavior is of considerable importance in several industries so as to manipulate the powder flowability and handling. In this work, we have studied the lubrication phenomena in an assembly of flowing bulk powder particles in presence of a fine powder lubricant. Experiments were conducted in two different shear environments, for two different levels of conf", "abstract": "Improving the particle surface frictional behavior is of considerable importance in several industries so as to manipulate the powder flowability and handling. In this work, we have studied the lubrication phenomena in an assembly of flowing bulk powder particles in presence of a fine powder lubricant. Experiments were conducted in two different shear environments, for two different levels of confinement and using three different bulk powder particles having distinct surface morphology. The added lubricant particles tend to adhere to the surface of bulk particles thereby altering their surface morphology. This results in altered inter-particle friction, which typically reduces for small addition of lubricant, but increases on its excess addition, thereby altering the particle flowability. While this behavior is generally understood through previous studies, the current work explores how the effect of confinement, shear environment and particle surface characteristics combine in a unique manner to provide modified flow behavior for different lubricant concentrations. Extended shear duration seems to extend the range of lubricant concentrations for improved flowability. On the other hand flow confinement seems to limit the extent of lubrication for these range of concentrations. Both these opposing effects also exhibit a unique dependence on the particle surface morphology and its seeming affinity with the lubricant particle. The parameter types and ranges explored comprise most conditions encountered in industrial systems, the outcome thereby providing a basis for designing of applications handling lubricant-particle mixtures.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-15214", "arxiv_id": "2610.15214", "type": "arXiv", "journal": "arXiv:2610.15214", "journal_ref": "", "title": "Transition-Metal Chalcogenide Nanowires: A First-Principles Study of Stability, Electronic Structure, and Mechanical Response", "authors": "Danilo de Araújo Moura, Flavio Bento de Oliveira, Andreia Luisa da Rosa", "corresponding": "", "url": "https://arxiv.org/abs/2610.15214", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Subnanometer transition-metal chalcogenide nanowires provide a one-dimensional platform in which electronic functionality and mechanical response can be tuned through chemical composition. Here, density functional theory calculations are combined with machine-learning force-field (MLFF) molecular dynamics to investigate MoS, MoSe, MoTe, WS, WSe, and WTe nanowires. The optimized structures are dyna", "summary": "Subnanometer transition-metal chalcogenide nanowires provide a one-dimensional platform in which electronic functionality and mechanical response can be tuned through chemical composition. Here, density functional theory calculations are combined with machine-learning force-field (MLFF) molecular dynamics to investigate MoS, MoSe, MoTe, WS, WSe, and WTe nanowires. The optimized structures are dyna", "abstract": "Subnanometer transition-metal chalcogenide nanowires provide a one-dimensional platform in which electronic functionality and mechanical response can be tuned through chemical composition. Here, density functional theory calculations are combined with machine-learning force-field (MLFF) molecular dynamics to investigate MoS, MoSe, MoTe, WS, WSe, and WTe nanowires. The optimized structures are dynamically stable within the harmonic approximation, and their electronic character evolves systematically across the chalcogen series: MoS, MoSe, WS, and WSe are metallic, whereas MoTe and WTe are semiconducting, with HSE06 band gaps of 0.52 and 0.20 eV, respectively. The effective axial stiffness decreases from sulfides to selenides and tellurides, consistent with the increase in metal--chalcogen bond length; using a circular effective cross section, the corresponding Young moduli range from 392 to 718 GPa. All six nanowires have negative formation energies relative to the selected elemental reference phases. MLFF trajectories extending to 2.5 ns at 300 K preserve the one-dimensional morphology and local atomic order, providing evidence of finite-temperature dynamical stability on the simulated time scale. The corresponding MLFF molecular-dynamics energy traces are shown in. We further examine the response of the nanowires to axial strain and curvature, including strain-induced band-gap modulation in the tellurides. These results establish composition and mechanical deformation as complementary routes for tuning the electronic and mechanical properties of ultrathin transition-metal chalcogenide nanowires and support their further investigation as components of flexible nanoelectronic systems.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-18892", "arxiv_id": "2610.18892", "type": "arXiv", "journal": "arXiv:2610.18892", "journal_ref": "", "title": "Two-Species Boltzmann--Kac Kinetics with Matsumoto--Yor Nonlinear Collisions: Conserved Energy and Conic Equilibria", "authors": "Yoshiaki Itoh", "corresponding": "", "url": "https://arxiv.org/abs/2610.18892", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "We extend Mark Kac's kinetic framework from single-species Euclidean spaces to a two-species, non-linear interaction space on the open cone $(0, \\infty)^2$ governed by the Matsumoto--Yor rational collision involution. We identify a non-linear conserved energy $E(x,y) = x + y + 1/x$ and an invariant conic metric measure $dμ= \\frac{dx \\, dy}{x(x+y)}$. By establishing a two-species $H$-theorem, we pr", "summary": "We extend Mark Kac's kinetic framework from single-species Euclidean spaces to a two-species, non-linear interaction space on the open cone $(0, \\infty)^2$ governed by the Matsumoto--Yor rational collision involution. We identify a non-linear conserved energy $E(x,y) = x + y + 1/x$ and an invariant conic metric measure $dμ= \\frac{dx \\, dy}{x(x+y)}$. By establishing a two-species $H$-theorem, we pr", "abstract": "We extend Mark Kac's kinetic framework from single-species Euclidean spaces to a two-species, non-linear interaction space on the open cone $(0, \\infty)^2$ governed by the Matsumoto--Yor rational collision involution. We identify a non-linear conserved energy $E(x,y) = x + y + 1/x$ and an invariant conic metric measure $dμ= \\frac{dx \\, dy}{x(x+y)}$. By establishing a two-species $H$-theorem, we prove that entropy production vanishes if and only if post-collision velocities are statistically independent ($I(U;V)=0$). In contrast to the transform-domain proof of Letac and Wesołowski~\\cite{letac2000}, which relies on joint Laplace transforms of general measures, our approach yields a direct physical derivation in state space via the transformation law for logarithmic gradients and separation of variables. This uncouples the functional-differential system to uniquely characterize the Generalized Inverse Gaussian (GIG) and Gamma distributions as the non-equilibrium thermodynamic equilibria.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30547", "arxiv_id": "2610.30547", "type": "arXiv", "journal": "arXiv:2610.30547", "journal_ref": "", "title": "Anisotropic thermoelectric transport in the Sr2RuO4-Ru eutectic system", "authors": "Takeru Ito, Shogo Yoshida, Hiroshi Yaguchi et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30547", "topic": "Superconductivity", "level": "Brief", "summary_en": "The Sr2RuO4-Ru eutectic system, in which metallic Ru inclusions are embedded in a Sr2RuO4 matrix, exhibits an enhanced superconducting onset temperature of about 3 K, known as the 3-K phase. Here we investigate the in-plane thermoelectric response of this eutectic system in the normal state and find a pronounced anisotropy in the thermopower for thermal gradients applied parallel and perpendicular", "summary": "The Sr2RuO4-Ru eutectic system, in which metallic Ru inclusions are embedded in a Sr2RuO4 matrix, exhibits an enhanced superconducting onset temperature of about 3 K, known as the 3-K phase. Here we investigate the in-plane thermoelectric response of this eutectic system in the normal state and find a pronounced anisotropy in the thermopower for thermal gradients applied parallel and perpendicular", "abstract": "The Sr2RuO4-Ru eutectic system, in which metallic Ru inclusions are embedded in a Sr2RuO4 matrix, exhibits an enhanced superconducting onset temperature of about 3 K, known as the 3-K phase. Here we investigate the in-plane thermoelectric response of this eutectic system in the normal state and find a pronounced anisotropy in the thermopower for thermal gradients applied parallel and perpendicular to the Ru lamellae. To clarify its origin, we combine thermopower measurements with electronic-structure-based transport calculations and finite-element modeling of the local strain distribution generated by the thermal-expansion mismatch between Sr2RuO4 and Ru. The calculations show that uniaxial compression of Sr2RuO4 produces a sizable thermopower anisotropy through modification of the Fermi surfaces. When an idealized spatially inhomogeneous strain field around the Ru lamellae is included, the observed sign and qualitative magnitude of the anisotropy are reproduced more closely than in a simple unstrained two-component model. These results are consistent with a substantial contribution from strain-induced changes in the Sr2RuO4 electronic structure near the interfaces, although contributions from interfacial phase mixing and three-dimensional transport connectivity cannot be excluded.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-26573", "arxiv_id": "2610.26573", "type": "arXiv", "journal": "arXiv:2610.26573", "journal_ref": "", "title": "Avalanches and Aging Driven by Parametric Amplification in Kerr Oscillator Networks", "authors": "Alejandro S. Gómez, Javier del Pino", "corresponding": "", "url": "https://arxiv.org/abs/2610.26573", "topic": "Superconductivity", "level": "Brief", "summary_en": "Gain, loss, and nonlinearity shape the phase-space landscape of driven-dissipative systems, such as Kerr parametric oscillator (KPO) networks realized in superconducting, nanomechanical, and photonic arrays. Networks of KPOs exploit the stationary states of this landscape for Ising machines, bosonic error-correcting codes, and sensing. Yet how transients reach these states from a given initial con", "summary": "Gain, loss, and nonlinearity shape the phase-space landscape of driven-dissipative systems, such as Kerr parametric oscillator (KPO) networks realized in superconducting, nanomechanical, and photonic arrays. Networks of KPOs exploit the stationary states of this landscape for Ising machines, bosonic error-correcting codes, and sensing. Yet how transients reach these states from a given initial con", "abstract": "Gain, loss, and nonlinearity shape the phase-space landscape of driven-dissipative systems, such as Kerr parametric oscillator (KPO) networks realized in superconducting, nanomechanical, and photonic arrays. Networks of KPOs exploit the stationary states of this landscape for Ising machines, bosonic error-correcting codes, and sensing. Yet how transients reach these states from a given initial condition remains largely unexplored. Here we show that KPO networks with nonlinear couplings can develop avalanches in their deterministic transient dynamics: rapid cascades of amplification between modes reminiscent of the relaxation avalanches of glassy systems. The mechanism is that parametric gain first activates the modes whose detuning it can overcome, and their nonlinear frequency shifts then pull dormant modes into the gain window one at a time. Dormant modes keep decaying while they wait for their turn, so every activation starts from a smaller seed and the intervals between activations grow geometrically. The network thus ages: the longer it has evolved, the slower it changes, and activations accumulate only logarithmically in time. In a 20-mode network, each dwell lasts about twice as long as the previous one.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2603-25858", "arxiv_id": "2603.25858", "type": "arXiv", "journal": "arXiv:2603.25858", "journal_ref": "", "title": "Benchmarking the accuracy of superconducting pair-pair correlations within Constrained Path Quantum Monte Carlo", "authors": "Jodie Roberts, Beau A. Thompson, R. Torsten Clay", "corresponding": "", "url": "https://arxiv.org/abs/2603.25858", "topic": "Superconductivity", "level": "Brief", "summary_en": "Ground state properties of the Hubbard model are of fundamental importance to understand the mechanism of unconventional superconductivity in the high-T_c cuprates and other materials. One of the most powerful numerical methods for strongly interacting models is quantum Monte Carlo, which however faces a fundamental limitation, the Fermion sign problem. The sign problem can be mitigated using appr", "summary": "Ground state properties of the Hubbard model are of fundamental importance to understand the mechanism of unconventional superconductivity in the high-T_c cuprates and other materials. One of the most powerful numerical methods for strongly interacting models is quantum Monte Carlo, which however faces a fundamental limitation, the Fermion sign problem. The sign problem can be mitigated using appr", "abstract": "Ground state properties of the Hubbard model are of fundamental importance to understand the mechanism of unconventional superconductivity in the high-T_c cuprates and other materials. One of the most powerful numerical methods for strongly interacting models is quantum Monte Carlo, which however faces a fundamental limitation, the Fermion sign problem. The sign problem can be mitigated using approximate methods such as Constrained Path Monte Carlo, where the sign of the overlap with a trial wavefunction is constrained to remain positive. Beyond the constraint, additional approximations must be made in order to measure observables for operators that do not commute with the Hamiltonian. We examine critically the most commonly used approximation, back propagation, as well as a recently proposed constraint release measurement technique. In comparisons with a variety of systems that can be solved numerically exactly by other methods, we find that back propagation tends to underestimate long-range superconducting pair-pair correlations. Except in special cases such as one dimension, back propagation introduces an uncontrolled approximation even when the exact trial wavefunction is used. The constraint release technique can provide accurate results, with the disadvantages that it much more computationally expensive and reintroduces the sign problem.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30271", "arxiv_id": "2610.30271", "type": "arXiv", "journal": "arXiv:2610.30271", "journal_ref": "", "title": "Charge-monitored Luttinger liquid", "authors": "Victor Gurarie, Leo Radzihovsky", "corresponding": "", "url": "https://arxiv.org/abs/2610.30271", "topic": "Superconductivity", "level": "Brief", "summary_en": "We discuss phases of interacting fermionic Luttinger liquids without particle number conservation, such as those in proximity to a superconductor, subjected to weak continuous measurements of their particle density, in the regime where the bosonization approach is applicable. We show that the phases of these systems are controlled by the competition between measurements, which favor the area-law p", "summary": "We discuss phases of interacting fermionic Luttinger liquids without particle number conservation, such as those in proximity to a superconductor, subjected to weak continuous measurements of their particle density, in the regime where the bosonization approach is applicable. We show that the phases of these systems are controlled by the competition between measurements, which favor the area-law p", "abstract": "We discuss phases of interacting fermionic Luttinger liquids without particle number conservation, such as those in proximity to a superconductor, subjected to weak continuous measurements of their particle density, in the regime where the bosonization approach is applicable. We show that the phases of these systems are controlled by the competition between measurements, which favor the area-law phase and particle tunneling in and out of the Luttinger liquid, which favors the volume-law phase. The volume-law phase in this system is always charge fuzzy. We show that within this framework, the phase boundary between the two phases is given by a universal dependence of the Luttinger parameter on the measurement rate. This behavior can be contrasted with the non-universal phase boundaries in more generic highly excited one dimensional systems whose behavior is no longer captured by the Luttinger liquid framework.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30581", "arxiv_id": "2610.30581", "type": "arXiv", "journal": "arXiv:2610.30581", "journal_ref": "", "title": "Cluster property and entanglement in the superconducting state", "authors": "Katsuhiko Higuchi, Masahiko Higuchi", "corresponding": "", "url": "https://arxiv.org/abs/2610.30581", "topic": "Superconductivity", "level": "Brief", "summary_en": "We present the conditions for satisfying the cluster property in the superconducting state. Using these conditions, we show that the cluster property employed when deriving the order parameter of the superconducting state (OPSS) holds true, and that the OPSS is given by ${}_S\\langle Ψ| \\hatψ(x)\\hatψ(x') | Ψ\\rangle_S$, where $|Ψ\\rangle_S$ is the superconducting state, and where $\\hatψ(x)$ is the fi", "summary": "We present the conditions for satisfying the cluster property in the superconducting state. Using these conditions, we show that the cluster property employed when deriving the order parameter of the superconducting state (OPSS) holds true, and that the OPSS is given by ${}_S\\langle Ψ| \\hatψ(x)\\hatψ(x') | Ψ\\rangle_S$, where $|Ψ\\rangle_S$ is the superconducting state, and where $\\hatψ(x)$ is the fi", "abstract": "We present the conditions for satisfying the cluster property in the superconducting state. Using these conditions, we show that the cluster property employed when deriving the order parameter of the superconducting state (OPSS) holds true, and that the OPSS is given by ${}_S\\langle Ψ| \\hatψ(x)\\hatψ(x') | Ψ\\rangle_S$, where $|Ψ\\rangle_S$ is the superconducting state, and where $\\hatψ(x)$ is the field operator of superconducting electrons. This provides a resolution to the long-standing concern raised by Leggett et al.\\ regarding particle-number fluctuation in the superconducting state. In addition, by considering the entanglement between two particles composed of the maximum geminal of the BCS ground state [J.\\ Phys. Commun. 5, 095003 (2021)], it is confirmed that the larger the deviation from the conditions for satisfying the cluster property becomes, the greater the magnitude of the entanglement becomes. This shows not only the effectiveness of the conditions for satisfying the cluster property but also the justification of the OPSS that has been commonly used.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2501-14017", "arxiv_id": "2501.14017", "type": "arXiv", "journal": "arXiv:2501.14017", "journal_ref": "", "title": "Exact few-magnon Bethe scars of the non-integrable alternating Heisenberg chain", "authors": "Ronald Melendrez, Bhaskar Mukherjee, Marcin Szyniszewski et al.", "corresponding": "", "url": "https://arxiv.org/abs/2501.14017", "topic": "Superconductivity", "level": "Brief", "summary_en": "Exact solutions of quantum lattice models serve as useful guides for interpreting physical phenomena in condensed matter systems. Prominent examples of integrability appear in one dimension, including the Heisenberg chain, where the Bethe ansatz method has been widely successful. Recent work has noted that certain non-integrable models harbor quantum many-body scar states, which form a superspin o", "summary": "Exact solutions of quantum lattice models serve as useful guides for interpreting physical phenomena in condensed matter systems. Prominent examples of integrability appear in one dimension, including the Heisenberg chain, where the Bethe ansatz method has been widely successful. Recent work has noted that certain non-integrable models harbor quantum many-body scar states, which form a superspin o", "abstract": "Exact solutions of quantum lattice models serve as useful guides for interpreting physical phenomena in condensed matter systems. Prominent examples of integrability appear in one dimension, including the Heisenberg chain, where the Bethe ansatz method has been widely successful. Recent work has noted that certain non-integrable models harbor quantum many-body scar states, which form a superspin of regular states hidden in an otherwise chaotic spectrum. Here we consider one of the simplest examples of a non-integrable model, the alternating ferromagnetic-antiferromagnetic (bond-staggered) Heisenberg chain, a close cousin of the spin-1 Haldane chain and a spin analog of the Su-Schrieffer-Heeger model, and show the presence of exponentially many zero-energy states. We highlight features of the alternating chain that allow treatment with the coordinate Bethe ansatz (with important modifications), and surprisingly, for a non-integrable system, we find simple compact expressions for zero-energy eigenfunctions for a few magnons, including solutions with fractionalized particle momentum. These states exhibit wavefunction scarring similar to that of single-particle states in chaotic billiards. We discuss a general numerical recipe to diagnose the existence of such generalized Bethe ansatz (GBA) scar states and also provide exact analytic expressions for their entanglement. We conclude by conjecturing a picture of magnon pairing which may generalize to multiple magnons. Our work opens the avenue to describe certain eigenstates of partially integrable systems using the GBA.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-22307", "arxiv_id": "2610.22307", "type": "arXiv", "journal": "arXiv:2610.22307", "journal_ref": "", "title": "Extended strange metal and superconductivity in partially filled moiré Hubbard bands", "authors": "Yiyu Xia, Yichi Zhang, Zhongdong Han et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.22307", "topic": "Superconductivity", "level": "Brief", "summary_en": "Moiré semiconductors provide a physical realization of the Hubbard model. Bandwidth-tuned Mott transitions and complex phase diagrams mimicking those of high-temperature superconductors have been demonstrated near a weak Mott insulating state at half-band-filling. The platform also provides an opportunity to explore the physics of a partially filled Hubbard band at doping densities far away from t", "summary": "Moiré semiconductors provide a physical realization of the Hubbard model. Bandwidth-tuned Mott transitions and complex phase diagrams mimicking those of high-temperature superconductors have been demonstrated near a weak Mott insulating state at half-band-filling. The platform also provides an opportunity to explore the physics of a partially filled Hubbard band at doping densities far away from t", "abstract": "Moiré semiconductors provide a physical realization of the Hubbard model. Bandwidth-tuned Mott transitions and complex phase diagrams mimicking those of high-temperature superconductors have been demonstrated near a weak Mott insulating state at half-band-filling. The platform also provides an opportunity to explore the physics of a partially filled Hubbard band at doping densities far away from the Mott insulator, a regime that has remained largely unexplored. Here we report the emergence of an extended strange metal (ESM), in both doping density and twist angle, in a partially filled Hubbard band of twisted bilayer WSe2. The ESM is in the clean limit, persists down to about 50mK, and spans over multiple symmetry-breaking ground states; it also appears only at small twist angles, where electronic correlations are strong. These observations distinguish the state from the reported strange metals associated with quantum criticality and favor the viewpoint that it is an intrinsic state of matter. We also report the observation of a new superconducting dome being developed from the ESM but far away from both the Mott insulating state and the van Hove singularity of the material. Our work opens the door to exploring the new regime of partially filled Hubbard bands in the clean limit.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30321", "arxiv_id": "2610.30321", "type": "arXiv", "journal": "arXiv:2610.30321", "journal_ref": "", "title": "Extreme competition between stripes and superconductivity in the hole-doped Hubbard model", "authors": "Ao Chen, Johnnie Gray, Si-Jing Du et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30321", "topic": "Superconductivity", "level": "Brief", "summary_en": "The two-dimensional Hubbard model was originally proposed as the minimal model of uniform $d$-wave superconductivity in the cuprate high-temperature superconductors, but recent calculations with relevant parameters in a realistic doping regime have often found other ground states. Further, uncertainty remains over such results due to the intrinsic bias of different computational methods. Here we a", "summary": "The two-dimensional Hubbard model was originally proposed as the minimal model of uniform $d$-wave superconductivity in the cuprate high-temperature superconductors, but recent calculations with relevant parameters in a realistic doping regime have often found other ground states. Further, uncertainty remains over such results due to the intrinsic bias of different computational methods. Here we a", "abstract": "The two-dimensional Hubbard model was originally proposed as the minimal model of uniform $d$-wave superconductivity in the cuprate high-temperature superconductors, but recent calculations with relevant parameters in a realistic doping regime have often found other ground states. Further, uncertainty remains over such results due to the intrinsic bias of different computational methods. Here we address this uncertainty through state-of-the-art neural tensor network and neural backflow state simulations, enabled by large-scale GPU computation, that together reach an unprecedented variational accuracy on lattices with up to 1024 sites. At $1/8$ doping in the pure Hubbard model, as well as with next-nearest-neighbor hopping relevant to the hole-doped cuprates, we reveal a near degeneracy among a low-energy uniform $d$-wave state, superconducting stripes, and non-superconducting stripe states on the milli-$t$ energy scale. Our work rebalances the narrative that the Hubbard model supports a single dominant order in relevant parameter regimes towards a picture of extreme competition between stripes and superconductivity.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30556", "arxiv_id": "2610.30556", "type": "arXiv", "journal": "arXiv:2610.30556", "journal_ref": "", "title": "Field-free superconducting diode and tunable vortex dynamics in NbN/FePt stripe-domain heterostructures", "authors": "Juan C. Zapata, Emilio De Biasi, Martin Sirena et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30556", "topic": "Superconductivity", "level": "Brief", "summary_en": "We demonstrate reconfigurable, field-free superconducting diode behavior in NbN/FePt and NbN/AlN/FePt heterostructures with remanent stripe domains in the FePt layer. NbN films 10 nm thick are capped either directly with FePt or through a thin AlN spacer, which reduces electronic proximity effects while preserving magnetic coupling through stray fields. At zero applied magnetic field, the supercon", "summary": "We demonstrate reconfigurable, field-free superconducting diode behavior in NbN/FePt and NbN/AlN/FePt heterostructures with remanent stripe domains in the FePt layer. NbN films 10 nm thick are capped either directly with FePt or through a thin AlN spacer, which reduces electronic proximity effects while preserving magnetic coupling through stray fields. At zero applied magnetic field, the supercon", "abstract": "We demonstrate reconfigurable, field-free superconducting diode behavior in NbN/FePt and NbN/AlN/FePt heterostructures with remanent stripe domains in the FePt layer. NbN films 10 nm thick are capped either directly with FePt or through a thin AlN spacer, which reduces electronic proximity effects while preserving magnetic coupling through stray fields. At zero applied magnetic field, the superconducting diode efficiency reaches approximately 50--60% in NbN/FePt when the stripes are perpendicular to the current and is strongly reduced when they are parallel. The diode effect persists in NbN/AlN/FePt with efficiencies reaching approximately 35--40%, supporting a magnetic origin of the nonreciprocity. We interpret the response as asymmetric vortex transport in the remanent magnetic landscape, with preferential edge vorticity and a Lorentz force that favors inward flux injection or outward motion depending on current polarity. Under applied perpendicular magnetic fields, the interplay between the external field and the magnetic stray fields modifies the flux-flow instability and the apparent instability velocity inferred from transport, with values below those reported for bare NbN films. These results show that stripe-domain ferromagnetic overlayers provide a reconfigurable route to control superconducting nonreciprocity and flux-flow stability in NbN-based heterostructures.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30322", "arxiv_id": "2610.30322", "type": "arXiv", "journal": "arXiv:2610.30322", "journal_ref": "", "title": "Kinetic-inductance Parametric Amplification in Superconducting Hybrid Magnonics", "authors": "Pratap Kumar Pal, Moojune Song, Jinho Lim et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30322", "topic": "Superconductivity", "level": "Brief", "summary_en": "Parametric amplification enables sensitive microwave detection and signal processing by amplifying weak signals with minimal added noise. Here, we demonstrate kinetic inductance mediated parametric amplification in a hybrid magnonic system comprising a nonlinear NbN nanowire resonator strongly coupled to a yttrium iron garnet sphere. The resonator exhibits four wave mixing and nonlinear frequency ", "summary": "Parametric amplification enables sensitive microwave detection and signal processing by amplifying weak signals with minimal added noise. Here, we demonstrate kinetic inductance mediated parametric amplification in a hybrid magnonic system comprising a nonlinear NbN nanowire resonator strongly coupled to a yttrium iron garnet sphere. The resonator exhibits four wave mixing and nonlinear frequency ", "abstract": "Parametric amplification enables sensitive microwave detection and signal processing by amplifying weak signals with minimal added noise. Here, we demonstrate kinetic inductance mediated parametric amplification in a hybrid magnonic system comprising a nonlinear NbN nanowire resonator strongly coupled to a yttrium iron garnet sphere. The resonator exhibits four wave mixing and nonlinear frequency pulling, enabling parametric amplification both away from and within the magnon-photon strong coupling regime. In the magnon detuned regime, we observe 7 dB gain, while coupling to the YIG magnon shifts the parametric amplification response by ~20 MHz and yields 3.4 dB gain in the hybrid mode. Thus, magnon photon coupling provides a route to magnetically tune the spectral position of kinetic inductance parametric amplification. At higher pump powers, the system transitions to a self oscillatory regime featuring comb-like sidebands and probe activated nonlinear mode mixing. These results establish hybrid magnonics as a platform for tunable nonlinear microwave amplification and dynamics.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2607-05890", "arxiv_id": "2607.05890", "type": "arXiv", "journal": "Physical Review Applied 26, L031007 (2026)", "journal_ref": "Physical Review Applied 26, L031007 (2026)", "title": "Microscopic theory of the lower critical field in superconducting thin-film strips", "authors": "Takayuki Kubo", "corresponding": "", "url": "https://arxiv.org/abs/2607.05890", "topic": "Superconductivity", "level": "Brief", "summary_en": "The lower critical field $B_{c1}$ of a narrow superconducting thin-film strip sets the thermodynamic scale for vortex-free operation in a perpendicular magnetic field. The standard Pearl--London estimate requires a phenomenological vortex-core cutoff, because the London theory does not resolve the core. We formulate a microscopic theory for a dirty strip by solving the two-dimensional Usadel equat", "summary": "The lower critical field $B_{c1}$ of a narrow superconducting thin-film strip sets the thermodynamic scale for vortex-free operation in a perpendicular magnetic field. The standard Pearl--London estimate requires a phenomenological vortex-core cutoff, because the London theory does not resolve the core. We formulate a microscopic theory for a dirty strip by solving the two-dimensional Usadel equat", "abstract": "The lower critical field $B_{c1}$ of a narrow superconducting thin-film strip sets the thermodynamic scale for vortex-free operation in a perpendicular magnetic field. The standard Pearl--London estimate requires a phenomenological vortex-core cutoff, because the London theory does not resolve the core. We formulate a microscopic theory for a dirty strip by solving the two-dimensional Usadel equations in the film plane, with the applied field included directly in the gauge-invariant momentum. Self-consistent vortex and Meissner solutions are computed at fixed field, and $B_{c1}$ is obtained from their Gibbs-energy difference. The calculation resolves the vortex core and its finite-width deformation without introducing a cutoff. The resulting vortex self-energy is larger than the naive Pearl--London estimate and cannot, in general, be represented by a London logarithm with a single width-independent cutoff. The formulation applies at any $T<T_c$ and provides a microscopic basis for predicting $B_{c1}$ in superconducting nanostrips and related thin-film devices.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31269", "arxiv_id": "2610.31269", "type": "arXiv", "journal": "arXiv:2610.31269", "journal_ref": "", "title": "Monodromy Defects of 3D Wilson-Fisher Criticality on the Fuzzy Sphere", "authors": "Yin Tang, W. Zhu", "corresponding": "", "url": "https://arxiv.org/abs/2610.31269", "topic": "Superconductivity", "level": "Brief", "summary_en": "Monodromy (twist) line defects arise as the boundaries of topological symmetry surfaces, which are among the simplest non-trivial conformal defects with direct realizations as magnetic vortex in quantum magnets, as Wilson and t Hooft lines of gauge theories, and as the replica twist operators in quantum information theory. However, their interacting dynamics remains difficult to characterize non-p", "summary": "Monodromy (twist) line defects arise as the boundaries of topological symmetry surfaces, which are among the simplest non-trivial conformal defects with direct realizations as magnetic vortex in quantum magnets, as Wilson and t Hooft lines of gauge theories, and as the replica twist operators in quantum information theory. However, their interacting dynamics remains difficult to characterize non-p", "abstract": "Monodromy (twist) line defects arise as the boundaries of topological symmetry surfaces, which are among the simplest non-trivial conformal defects with direct realizations as magnetic vortex in quantum magnets, as Wilson and t Hooft lines of gauge theories, and as the replica twist operators in quantum information theory. However, their interacting dynamics remains difficult to characterize non-perturbatively. Here we design a way to realize the monodromy boundary conditions in the fuzzy-sphere regularization by threading a symmetry-selective Aharonov-Bohm flux through the two poles of the sphere. We apply this construction to the $\\mathbb{Z}_2$ twist of the 3D Ising conformal field theory (CFT), $π$-twist of the 3D O(2) CFT and three inequivalent monodromies of O(3) (centre twist, z-axis $π$-twist and the reflection). For each defect, we extract the low-lying defect spectrum together with bulk-to-defect and defect-defect operator product expansion coefficients, which characterize the operators living on the defect line, their mutual interactions, and how they couple to the surrounding critical bulk. Among the low-lying defect primaries resolved in our spectra, we find no relevant scalar perturbation that preserves all the symmetries of the corresponding defect. The relevant deformations identified in our calculations break at least one preserved symmetry, providing evidence that these monodromy defects are stable against symmetry-preserving relevant perturbations. These results establish a systematic set of non-perturbative conformal data for monodromy defects beyond the Ising twist. Our construction therefore turns the symmetry flux into a tunable knob of the fuzzy-sphere regularization, opening a route to exploring the response of critical matter to distinct defects.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-25412", "arxiv_id": "2610.25412", "type": "arXiv", "journal": "arXiv:2610.25412", "journal_ref": "", "title": "Near self-duality and spatial reorganization of anyon vortex lattices", "authors": "Bao-Duy Le", "corresponding": "", "url": "https://arxiv.org/abs/2610.25412", "topic": "Superconductivity", "level": "Brief", "summary_en": "Contact attraction drives the self-generated vortex lattice of a trapped anyon gas towards self-duality, but integrated energies do not reveal where the remaining departure from it is located. We address this question in the almost-bosonic Chern--Simons--Schrödinger average-field model using a positive, gauge-invariant local defect that measures the covariant kinetic energy in excess of the magnet", "summary": "Contact attraction drives the self-generated vortex lattice of a trapped anyon gas towards self-duality, but integrated energies do not reveal where the remaining departure from it is located. We address this question in the almost-bosonic Chern--Simons--Schrödinger average-field model using a positive, gauge-invariant local defect that measures the covariant kinetic energy in excess of the magnet", "abstract": "Contact attraction drives the self-generated vortex lattice of a trapped anyon gas towards self-duality, but integrated energies do not reveal where the remaining departure from it is located. We address this question in the almost-bosonic Chern--Simons--Schrödinger average-field model using a positive, gauge-invariant local defect that measures the covariant kinetic energy in excess of the magnetic bound. Numerically computed low-energy states at three statistical fluxes show that, as the stability line is approached, the integrated defect falls by about two orders of magnitude while the density modulation grows, so that magnetic saturation and density uniformity separate. The residual defect concentrates in a vortex-free outer shell that carries unscreened statistical flux. There it reduces to a smooth radial mismatch between the statistical flow and the density decay, which the interior lattice cannot cancel, whereas the covariant kinetic and amplitude-gradient energies show no comparable enrichment. The effect is robust to grid and box refinement, while its magnitude depends on flux and on the low-energy branch. Exact dilation and contact-response identities relate the squared energy to the density shape and provide consistency checks. Repulsion produces the opposite trend: a smoother density with a larger defect.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2609-35754", "arxiv_id": "2609.35754", "type": "arXiv", "journal": "arXiv:2609.35754", "journal_ref": "", "title": "Perfect Born Sampling of Symmetric Thermal Tensor Network States", "authors": "Jianxin Gao, Qiaoyi Li, Yuan Gao et al.", "corresponding": "", "url": "https://arxiv.org/abs/2609.35754", "topic": "Superconductivity", "level": "Brief", "summary_en": "Accurate calculations of correlated fermions at low temperatures constitute a major challenge in quantum many-body physics, most notably in the studies of high-$T_c$ superconductivity and ultracold atom optical lattices. Stochastic sampling of tensor-network states offers a promising route to tackle this problem; however, existing schemes have long faced a fundamental dilemma---sampling efficiency", "summary": "Accurate calculations of correlated fermions at low temperatures constitute a major challenge in quantum many-body physics, most notably in the studies of high-$T_c$ superconductivity and ultracold atom optical lattices. Stochastic sampling of tensor-network states offers a promising route to tackle this problem; however, existing schemes have long faced a fundamental dilemma---sampling efficiency", "abstract": "Accurate calculations of correlated fermions at low temperatures constitute a major challenge in quantum many-body physics, most notably in the studies of high-$T_c$ superconductivity and ultracold atom optical lattices. Stochastic sampling of tensor-network states offers a promising route to tackle this problem; however, existing schemes have long faced a fundamental dilemma---sampling efficiency and symmetry acceleration \\textit{cannot} be achieved simultaneously. Here we propose a perfect Born sampling approach for thermal tensor networks, which performs importance sampling directly from the purified density matrix via the Born rule and incorporates Abelian and non-Abelian symmetries by sampling symmetry quantum numbers. We benchmark the method, realized as both stochastic matrix product states (stoMPS) and stochastic projected entangled pair states (stoPEPS), on large-scale quantum lattice models. Using stoMPS, we accurately simulate the square-lattice Hubbard model on cylinders up to width $W=10$, and study the triangular-lattice Hubbard model down to $T/t = 1/64$. We reveal scalar chiral order at half filling and kinetic ferromagnetism upon electron doping, with the latter directly compared to ultracold atom experiments. We further extend the stoMPS method to compute finite-temperature quantum dynamics, as demonstrated by the optical conductivity of the Hubbard model. We showcase the generalization of stoPEPS on up to $20\\times20$ square-lattice quantum Ising model, where accurate results are obtained near its quantum critical point. Our method combines high sampling efficiency with full symmetry acceleration. The resulting state-of-the-art framework captures both equilibrium and dynamical properties down to ultralow temperatures, thereby providing a powerful theoretical tool
