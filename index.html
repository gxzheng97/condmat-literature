ted Electrons", "summary_en": "This Letter develops a theory for interpreting shifts in transition-metal dichalcogenide exciton resonances caused by long-range Coulomb interactions with electrons in nearby, electrically isolated two-dimensional materials. It applies the theory to WSe₂ near graphene bilayers and multilayers as an example.", "summary": "Many monolayer transition metal dichalcogenides, including MoS$_2$, MoSe$_2$, WS$_2$, and WSe$_2$, are direct bandgap two-dimensional (2D) semiconductors with sharp optical resonances at excitonic bound state frequencies. Recent experiments have demonstrated that excitonic resonance frequencies in multilayer van der Waals stacks are altered by long-range Coulomb interactions with electrons in near", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "It provides a quantitative account of how Coulomb coupling to nearby graphene electron fluids shifts WSe₂ exciton resonances, enabling optical sensing of remote electronic correlations.", "ai_in_scope": true, "relevance_reason": "The paper develops theory for interpreting excitonic optical shifts caused by remote correlated electron states in 2D heterostructures, a substantive quantum-materials problem.", "relevance_method": "semantic", "relevance_score": 67, "feature_candidate": false, "summary_zh": "本文建立理论框架，用以解释过渡金属硫族化物激子共振频率如何受邻近、但电学隔离的二维材料中电子的长程库仑相互作用影响，并以邻近双层及多层石墨烯的 WSe₂ 为例进行应用。", "method_en": "The authors formulate a theory of exciton-resonance frequency shifts induced by Coulomb coupling to a remote electron system. They apply it to WSe₂ placed near graphene bilayers and multilayers.", "method_zh": "作者建立描述远端电子体系的库仑耦合所致激子共振频移的理论，并将其应用于邻近双层及多层石墨烯的 WSe₂。", "result_en": "The theory provides a quantitative framework for interpreting excitonic-sensing experiments in which optical resonance shifts detect changes between states of remote, strongly correlated two-dimensional electron fluids. Its application to WSe₂ near graphene bilayers and multilayers illustrates the proposed approach.", "result_zh": "该理论为激子传感实验提供定量解释框架；在这类实验中，光学共振频移可用于探测远端强关联二维电子流体不同态之间的转变。将理论应用于邻近双层及多层石墨烯的 WSe₂，展示了这一方法的用法。", "future_en": "Further comparison of the theory with excitonic-resonance measurements across correlated states of remote electron fluids could establish its quantitative accuracy and applicability.", "future_zh": "后续可将该理论与远端电子流体不同关联态下的激子共振测量进一步比较，以检验其定量准确性和适用范围。"}, {"id": "doi-10-1103-qqqh-6b6q", "doi": "10.1103/qqqh-6b6q", "title": "Microscopic Geometric Theory for Gapped Excitations in Fractional Topological Fluids", "type": "Journal", "journal": "PRL", "authors": "Yuzhu Wang, Bo Yang", "abstract": "We propose a geometric description of all gapped excitations in fractional quantum Hall phases that reveals several fundamental understandings with experimental consequences. These include a duality between the Hilbert space of multiple gapped ``graviton-like\" spin 2 excitations at $ν=1/3$ Laughlin phase, and that of non-Abelian quasiholes of an irrational Haffnian conformal field theory. This leads us to construct microscopic wave functions for multiple higher-spin gapped neutral modes in the Laughlin phase. Carrying spin $s \\ge 2$, they emerge from higher-order geometric deformations of the topological ground state, and live within the Gaffnian conformal Hilbert space asymptotically. We show that the full many-body Hilbert space of an FQH phase can be generated from superpositions of such geometric deformations, supporting a concrete geometric interpretation of all gapped excitations. We analyse the scattering between these higher spin modes and conjecture that they can have a long lifetime, and propose methods for their experimental detection.", "published_online": [[2026, 10, 26]], "corresponding": "", "url": "https://doi.org/10.1103/qqqh-6b6q", "level": "Brief", "method": "", "result": "", "future": "", "abstract_source": "http://arxiv.org/abs/2603.13489v1", "abstract_status": "available", "topic": "Magnetism", "summary_en": "This published work develops a geometric description of gapped excitations in fractional quantum Hall phases and constructs microscopic wavefunctions for higher-spin neutral modes in the Laughlin phase.", "summary": "We propose a geometric description of all gapped excitations in fractional quantum Hall phases that reveals several fundamental understandings with experimental consequences. These include a duality between the Hilbert space of multiple gapped ``graviton-like\" spin 2 excitations at $ν=1/3$ Laughlin phase, and that of non-Abelian quasiholes of an irrational Haffnian conformal field theory. This lea", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "It constructs higher-spin neutral-mode wavefunctions in the Laughlin phase from geometric deformations, relates their asymptotic space to the Gaffnian conformal Hilbert space, and identifies a duality connecting multiple spin-2 excitations with non-Abelian qua", "ai_in_scope": true, "relevance_reason": "This is original theoretical work on excitations and geometric structure in fractional quantum Hall matter, with proposed experimentally testable consequences.", "relevance_method": "semantic", "relevance_score": 81, "feature_candidate": false, "summary_zh": "这篇已发表的研究为分数量子霍尔相中的有隙激发建立几何描述，并构造了 Laughlin 相中高自旋中性模的微观波函数。", "method_en": "The authors relate multiple spin-2 graviton-like excitations at ν=1/3 to non-Abelian quasiholes of an irrational Haffnian conformal field theory, and construct higher-spin modes through higher-order geometric deformations of the topological ground state.", "method_zh": "作者将 ν=1/3 处多个类引力子自旋 2 激发与无理 Haffnian 共形场论的非阿贝尔准空穴联系起来，并通过拓扑基态的高阶几何形变构造高自旋模。", "result_en": "The work proposes that higher-spin neutral modes with s≥2 emerge from geometric deformations and asymptotically inhabit the Gaffnian conformal Hilbert space. It argues that superpositions of such deformations can generate the full many-body Hilbert space of a fractional quantum Hall phase, yielding a geometric interpretation of its gapped excitations. The authors analyze mode scattering, conjecture that these modes may have long lifetimes, and propose experimental detection methods.", "result_zh": "该研究提出，自旋 s≥2 的高自旋中性模源于几何形变，并在渐近意义上属于 Gaffnian 共形希尔伯特空间。作者指出，此类形变的叠加可生成分数量子霍尔相的完整多体希尔伯特空间，从而为其有隙激发提供几何解释。研究还分析了模之间的散射，推测这些模可能具有较长寿命，并提出了实验探测方法。", "future_en": "The authors propose experimental methods to detect the higher-spin modes and identify their potentially long lifetimes as a feature to test.", "future_zh": "作者提出了探测高自旋模的实验方法，并将其可能较长的寿命作为有待检验的特征。"}, {"id": "doi-10-1103-wk6v-1x5s", "doi": "10.1103/wk6v-1x5s", "title": "Ultrasensitive strain modulation of terahertz magnons at a magnetic phase transition", "type": "Journal", "journal": "PRL", "authors": "Lichen Wang, Sajna Hameed, Yiran Liu, Manuel Knauft, Kazuki Higuchi, Maximilian Krautloher, Sonia Francoual, Giniyat Khaliullin, Huimei Liu, Matteo Minola, Bernhard Keimer", "abstract": "Antiferromagnets typically host spin-wave (magnon) excitations in the terahertz (THz) regime, offering a promising platform for high-speed magnonic information technologies. Harnessing these excitations requires sensitive control of their spectral properties. Here we use resonant x-ray diffraction and Raman scattering to demonstrate uniaxial-strain control of the antiferromagnetic (AFM) ground state and THz magnon excitations in the layered Mott insulator Ca$_2$RuO$_4$. Although the states separated by the strain-induced phase transition differ only by the sign of the weak and partially frustrated interlayer interaction, their magnon energies differ by more than 10% (~ 0.3 THz). Our theoretical analysis explains this surprising observation by tracing the origin of both the sign reversal of the interlayer coupling and the magnon energy to the spin-orbital composition of the Ru valence electrons. The extreme strain sensitivity of the THz magnon energy near a magnetic phase transition opens up pathways towards a new generation of transition-edge magnonic devices.", "published_online": [[2026, 10, 26]], "corresponding": "", "url": "https://doi.org/10.1103/wk6v-1x5s", "level": "Feature", "method": "", "result": "", "future": "", "abstract_source": "http://arxiv.org/abs/2602.13924v1", "abstract_status": "available", "topic": "Magnetism", "summary_en": "Using Ca₂RuO₄, the study demonstrates that uniaxial strain can control the antiferromagnetic ground state and terahertz magnon excitations near a strain-induced phase transition. The magnon energies on the two sides differ by more than 10% (about 0.3 THz), despite the states differing only in the sign of a weak, partially frustrated interlayer interaction.", "summary": "Antiferromagnets typically host spin-wave (magnon) excitations in the terahertz (THz) regime, offering a promising platform for high-speed magnonic information technologies. Harnessing these excitations requires sensitive control of their spectral properties. Here we use resonant x-ray diffraction and Raman scattering to demonstrate uniaxial-strain control of the antiferromagnetic (AFM) ground sta", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "Shows that a strain-induced reversal of weak interlayer coupling across a magnetic phase transition accompanies a greater than 10% change in magnon energy, explained by the spin-orbital composition of Ru valence electrons.", "ai_in_scope": true, "relevance_reason": "Experiments and theory establish strain-controlled changes in the antiferromagnetic state and terahertz magnon spectrum of the correlated Mott insulator Ca2RuO4.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": true, "summary_zh": "该研究以Ca₂RuO₄为对象，展示单轴应变能够调控应变诱导相变附近的反铁磁基态及太赫兹磁振子激发。相变两侧的磁振子能量相差超过10%（约0.3 THz），尽管两种状态仅在微弱且部分受挫的层间相互作用符号上不同。", "method_en": "The authors use resonant x-ray diffraction and Raman scattering to investigate strain-dependent magnetic order and terahertz magnon excitations in Ca₂RuO₄. They also present theoretical analysis linking the interlayer-coupling sign reversal and magnon energy to the spin-orbital composition of Ru valence electrons.", "method_zh": "作者利用共振X射线衍射和拉曼散射，研究Ca₂RuO₄中随应变变化的磁有序与太赫兹磁振子激发。他们还通过理论分析，将层间耦合符号反转和磁振子能量联系到Ru价电子的自旋—轨道组成。", "result_en": "Uniaxial strain controls the antiferromagnetic ground state and the terahertz magnon excitations in Ca₂RuO₄. Across the strain-induced phase transition, the magnon energies differ by more than 10%, or approximately 0.3 THz, although the states differ only in the sign of the weak, partially frustrated interlayer interaction. The theoretical analysis attributes the coupling reversal and magnon-energy change to the spin-orbital composition of the Ru valence electrons. The pronounced strain sensitivity near the magnetic transition points to a potential route for transition-edge magnonic devices.", "result_zh": "单轴应变能够调控Ca₂RuO₄的反铁磁基态及太赫兹磁振子激发。跨越应变诱导相变时，磁振子能量相差超过10%，约为0.3 THz；而两种状态仅在微弱且部分受挫的层间相互作用符号上不同。理论分析将层间耦合反转及磁振子能量变化归因于Ru价电子的自旋—轨道组成。磁相变附近显著的应变敏感性，为相变边缘磁振子器件提供了潜在途径。", "future_en": "Follow-up studies could map the strain dependence of magnon spectra more finely around the magnetic transition and test how reproducibly the large energy shift can be controlled. Device-oriented work could investigate whether this sensitivity can be used to manipulate terahertz magnon signals, as suggested by the authors.", "future_zh": "后续研究可在磁相变附近更精细地测量磁振子谱随应变的变化，并检验这一显著能量位移能否稳定、可重复地调控。面向器件的研究可进一步考察能否利用这种敏感性操控太赫兹磁振子信号，正如作者所提出的设想。"}, {"id": "arxiv-2610-32797", "arxiv_id": "2610.32797", "type": "arXiv", "journal": "arXiv:2610.32797", "journal_ref": "", "title": "Unconventional charge density wave order in ErTe$_{3}$: symmetry breakings and fluctuations probed by Raman scattering", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-23T15:39:26Z", "updated_at": "2026-10-23T15:39:26Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Théotime Freitas, Mattia Udina, Alexandr Alekhin, Niloufar Nilforoushan, Sarah Houver, Alain Sacuto, Benito A. Gonzalez, Ian R. Fisher, Indranil Paul, Yann Gallais", "corresponding": "", "url": "https://arxiv.org/abs/2610.32797v1", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "This study uses Raman scattering to examine mirror-symmetry breaking and possible ferro-axial fluctuations associated with the CDW state of ErTe₃.", "summary": "Recent experiments have revealed unexpected mirror-symmetry breakings in the charge density-wave (CDW) state of rare-earth tritellurides, suggesting a putative ferro-axial CDW state. Here we report polarization-resolved Raman scattering measurements tracking the point-group symmetry breakings across the CDW phase transition in the rare-earth tritelluride ErTe$_3$. We show that the mirror-symmetry ", "abstract": "Recent experiments have revealed unexpected mirror-symmetry breakings in the charge density-wave (CDW) state of rare-earth tritellurides, suggesting a putative ferro-axial CDW state. Here we report polarization-resolved Raman scattering measurements tracking the point-group symmetry breakings across the CDW phase transition in the rare-earth tritelluride ErTe$_3$. We show that the mirror-symmetry breakings follow closely the emergence of the CDW order, suggesting a single component CDW order parameter. Furthermore, Raman measurements in the $A_{2g}$ symmetry channel above the CDW transition temperature indicate the absence of significant ferro-axial fluctuations. We discuss the broad implications of these findings with respect to the nature of the CDW state in the tritellurides.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "In ErTe₃, mirror-symmetry breaking tracks the CDW transition and is consistent with a single-component order parameter, while the measurements find no significant ferro-axial fluctuations above the transition.", "ai_in_scope": true, "relevance_reason": "The Raman measurements establish how symmetry breaking and fluctuations relate to charge-density-wave order in a quantum material.", "relevance_method": "semantic", "relevance_score": 76, "feature_candidate": false, "summary_zh": "本文利用拉曼散射研究 ErTe₃ 电荷密度波（CDW）态相关的镜面对称性破缺及可能的铁轴向涨落。", "method_en": "The authors perform polarization-resolved Raman measurements across the CDW transition, including measurements in the A₂g symmetry channel above the transition temperature.", "method_zh": "作者在 CDW 转变前后开展偏振分辨拉曼测量，并在转变温度以上测量 A₂g 对称性通道。", "result_en": "The mirror-symmetry breakings track the emergence of CDW order, which the authors interpret as suggesting a single-component CDW order parameter. Above the transition, the A₂g Raman measurements indicate no significant ferro-axial fluctuations.", "result_zh": "镜面对称性破缺与 CDW 有序的出现紧密同步，作者据此认为结果指向单分量 CDW 序参量。转变温度以上的 A₂g 通道拉曼测量未显示显著的铁轴向涨落。", "future_en": "The authors discuss the broader implications for the nature of CDW order in rare-earth tritellurides; the abstract does not specify further experiments.", "future_zh": "作者讨论了这些结果对稀土三碲化物 CDW 态性质的广泛意义；摘要未具体说明后续实验。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The polarization-resolved measurements address a timely symmetry question in a specific CDW material, but the abstract describes a focused result without evidence of a broadly general framework or unusually wide impact.", "tier_reason_zh": "偏振分辨测量探讨了特定 CDW 材料中一个具有现实意义的对称性问题，但摘要呈现的是聚焦于单一材料的结果，未显示广泛通用的理论框架或特别广泛的影响。"}, {"id": "arxiv-2610-31732", "arxiv_id": "2610.31732", "type": "arXiv", "journal": "arXiv:2610.31732", "journal_ref": "Phys. Rev. Lett. 137, 176702 (2026)", "title": "Altermagnetism in Folded Iron Chain Systems", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-22T15:55:01Z", "updated_at": "2026-10-22T15:55:01Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Ling-Fang Lin, Yang Zhang, Satoshi Okamoto, Adriana Moreo, Lun-Hui Hu, Elbio Dagotto", "corresponding": "", "url": "https://arxiv.org/abs/2610.31732v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper identifies a route to altermagnetism in quasi-one-dimensional folded iron-chain systems with block-type magnetic order: stacking chains and allowing finite inter-chain hopping can generate spin splitting forbidden in the strictly one-dimensional case. First-principles calculations identify the K₃Fe₂Se₄ family as a candidate platform and predict a d-wave altermagnet without lattice C₄ symmetry.", "summary": "Altermagnetism, a moment-compensated magnetism with momentum-dependent spin splitting, has so far been realized primarily in Néel-type antiferromagnets. Here, we demonstrate altermagnetism in folded iron-chain systems with block-type magnetic order (e.g., $\\uparrow \\uparrow \\downarrow \\downarrow$). In the strictly one-dimensional (1D) case, altermagnetism is forbidden by the $[C_2||{\\cal T}]$ symm", "abstract": "Altermagnetism, a moment-compensated magnetism with momentum-dependent spin splitting, has so far been realized primarily in Néel-type antiferromagnets. Here, we demonstrate altermagnetism in folded iron-chain systems with block-type magnetic order (e.g., $\\uparrow \\uparrow \\downarrow \\downarrow$). In the strictly one-dimensional (1D) case, altermagnetism is forbidden by the $[C_2||{\\cal T}]$ symmetry, but it can emerge when such chains are stacked into a quasi-1D array. To generate altermagnetic spin splitting via this chain-stacking mechanism, two essential ingredients are required: a block-type spin order that spontaneously breaks the combined parity-time reversal symmetry, and finite inter-chain hopping. Using first-principles calculations, we identify the K$_3$Fe$_2$Se$_4$ family as a promising platform that realizes this mechanism, hosting a $d$-wave altermagnet even without lattice $C_{4}$ symmetry. Moreover, owing to its lower symmetry, the block-type folded chain exhibits an isotropic altermagnetic spin splitting, which may manifest as an altermagnetic wrapping effect. Our findings unify real-space block magnetism and reciprocal-space altermagnetism, establishing folded iron chains as a tunable platform for zero-moment spintronic applications.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Stacking block-ordered iron chains with finite inter-chain hopping can produce altermagnetic spin splitting, including a proposed realization in the K₃Fe₂Se₄ family without lattice C₄ symmetry.", "ai_in_scope": true, "relevance_reason": "This original theoretical work identifies a symmetry and inter-chain-hopping mechanism for altermagnetism in folded iron-chain systems and proposes a material family realizing it.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "本文揭示了准一维折叠铁链系统中实现交替磁性的途径：链的堆叠与有限链间跃迁可产生严格一维情形中被禁止的自旋劈裂。第一性原理计算指出 K₃Fe₂Se₄ 家族是候选平台，并预测其可实现不依赖晶格 C₄ 对称性的 d 波交替磁性。", "method_en": "The authors analyze the symmetry requirements for altermagnetic spin splitting in folded chains and compare strictly one-dimensional chains with quasi-one-dimensional stacked arrays. They use first-principles calculations to investigate the K₃Fe₂Se₄ family.", "method_zh": "作者分析折叠链中产生交替磁性自旋劈裂所需的对称性条件，并比较严格一维链与准一维堆叠链阵列。研究采用第一性原理计算考察 K₃Fe₂Se₄ 家族。", "result_en": "In the strictly one-dimensional case, the combined [C₂||𝒯] symmetry forbids altermagnetism, whereas chain stacking can permit it when block-type order breaks combined parity-time reversal symmetry and inter-chain hopping is finite. The K₃Fe₂Se₄ family is identified as a candidate d-wave altermagnet even without lattice C₄ symmetry. The lower-symmetry block-type folded chain is predicted to have isotropic altermagnetic spin splitting, potentially producing an altermagnetic wrapping effect.", "result_zh": "严格一维情形下，组合对称性 [C₂||𝒯] 禁止交替磁性；而链堆叠后，若块状磁序破坏组合宇称—时间反演对称性且链间跃迁非零，则可允许交替磁性。研究将 K₃Fe₂Se₄ 家族确定为候选 d 波交替磁体，即使其晶格不具有 C₄ 对称性。作者还预测，低对称性的块状折叠链具有各向同性的交替磁性自旋劈裂，可能表现为交替磁性缠绕效应。", "future_en": "A useful follow-up is to test the predicted block order and momentum-dependent spin splitting in K₃Fe₂Se₄-family materials, including whether the proposed wrapping effect can be observed.", "future_zh": "后续可在 K₃Fe₂Se₄ 家族材料中检验所预测的块状磁序与动量依赖自旋劈裂，并探查所提出的缠绕效应能否被观测。"}, {"id": "arxiv-2610-31952", "arxiv_id": "2610.31952", "type": "arXiv", "journal": "arXiv:2610.31952", "journal_ref": "", "title": "Dipole chains of Bloch point singularities revealed by X-ray magnetic tomography", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall", "cond-mat.mtrl-sci"], "submitted_at": "2026-10-22T21:59:42Z", "updated_at": "2026-10-22T21:59:42Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Jeffrey Neethirajan, Rikako Yamamoto, Marisel Di Pietro Martínez, Luke A. Turnbull, Praveen Vir, Chandra Shekar, Claudia Felser, Luis Carlos Colocho Hurtarte, Benedikt J. Daurer, Majid Kazemian, Burkhard Kaulich, Claire Donnelly", "corresponding": "", "url": "https://arxiv.org/abs/2610.31952v1", "topic": "Magnetism", "level": "Brief", "summary_en": "Soft X-ray magnetic vector tomography reveals a one-dimensional chain of Bloch and anti-Bloch point singularities in an anisotropic chiral magnet. The points lie along a boundary between regions of opposite chirality, remain stable at separations down to 60 nm, and show an approximately 90 nm threshold for spontaneous pair annihilation within chiral domain walls.", "summary": "Bloch point singularities play an important role in magnetic systems, mediating changes in topology in three dimensional configurations. However, until now they have only been observed as isolated objects or as part of individual topological textures. Here we present the experimental observation of a 1D dipole chain of Bloch points in an anisotropic chiral magnet using soft X-ray magnetic vector t", "abstract": "Bloch point singularities play an important role in magnetic systems, mediating changes in topology in three dimensional configurations. However, until now they have only been observed as isolated objects or as part of individual topological textures. Here we present the experimental observation of a 1D dipole chain of Bloch points in an anisotropic chiral magnet using soft X-ray magnetic vector tomography. We identify that the chain of Bloch point singularities lies along a boundary between regions of opposite chirality and that neighbouring Bloch and anti-Bloch points are stable at separations down to 60 nm. The stability of the Bloch points is determined to be closely related to the surrounding topology of the magnetisation configuration and a threshold separation for the spontaneous annihilation of Bloch point-anti-Bloch point pairs within chiral domain walls is identified to be approximately 90 nm in distance. This observation of a chain of Bloch points and the insight into their stability, offers a route to explore the correlative behaviour of such topological point defects. The behaviour and control of such point defects is of relevance for the control of 3D magnetisation configurations, and provides a new route towards the creation of correlated configurations of singularities in a magnetic system.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "A one-dimensional chain of Bloch and anti-Bloch points is observed along a boundary between opposite-chirality regions, with a measured pair-annihilation threshold of about 90 nm.", "ai_in_scope": true, "relevance_reason": "This is original experimental magnetism research establishing topological point-defect structures and stability in a chiral magnet.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": false, "summary_zh": "软X射线磁矢量断层成像揭示了各向异性手性磁体中的一维Bloch点与反Bloch点奇点链。这些奇点位于手性相反区域的边界，间距小至60 nm时仍保持稳定；在手性畴壁内，奇点对自发湮灭的阈值间距约为90 nm。", "method_en": "The study uses soft X-ray magnetic vector tomography to image three-dimensional magnetization and identify Bloch point singularities in an anisotropic chiral magnet. It examines their positions relative to chirality boundaries and determines the observed stability and annihilation threshold from their separations.", "method_zh": "该研究采用软X射线磁矢量断层成像，观察各向异性手性磁体中的三维磁化结构并识别Bloch点奇点。作者考察奇点相对于手性边界的位置，并依据奇点间距确定其稳定性和湮灭阈值。", "result_en": "The measurements reveal a one-dimensional dipole chain of Bloch point singularities along a boundary between regions of opposite chirality. Neighbouring Bloch and anti-Bloch points are stable at separations down to 60 nm. Their stability is closely related to the surrounding magnetization topology, and the threshold separation for spontaneous annihilation of Bloch point–anti-Bloch point pairs within chiral domain walls is approximately 90 nm. The observation provides a setting for studying correlated configurations of three-dimensional magnetic point defects.", "result_zh": "测量揭示了一维Bloch点奇点偶极链，其沿着手性相反区域之间的边界排列。相邻Bloch点与反Bloch点的间距即使小至60 nm仍可保持稳定。奇点稳定性与周围磁化拓扑密切相关；在手性畴壁内，Bloch点—反Bloch点对发生自发湮灭的阈值间距约为90 nm。这一观测为研究三维磁性点缺陷的关联构型提供了体系。", "future_en": "Further work could test how the chain structure and pair stability respond to controlled changes in magnetic configuration, and examine whether the reported separation threshold persists across different conditions. Such studies could develop the proposed route toward creating and controlling correlated configurations of point defects.", "future_zh": "后续研究可检验链状结构及奇点对稳定性如何响应可控的磁构型变化，并考察所报告的间距阈值在不同条件下是否保持。此类研究可推进作者提出的方向，即构造并调控点缺陷的关联构型。", "tier": "PRL", "tier_reason_en": "The work reports a direct three-dimensional observation of a new arrangement of topological magnetic singularities and quantifies a stability scale for neighbouring defect pairs. The distinctive imaging result and its implications for controlling magnetic textures make this a strong, focused result consistent with the PRL tier.", "tier_reason_zh": "该研究直接三维观测到一种新的拓扑磁奇点排列，并量化了相邻缺陷对的稳定性尺度。其独特成像结果及对磁织构调控的意义，使其成为一项有力且聚焦的成果，符合PRL层级。"}, {"id": "arxiv-2610-32261", "arxiv_id": "2610.32261", "type": "arXiv", "journal": "arXiv:2610.32261", "journal_ref": "", "title": "Intrinsic Raman Modes and Crystal Symmetry of Altermagnetic $α$-MnTe", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci"], "submitted_at": "2026-10-23T07:17:05Z", "updated_at": "2026-10-23T07:17:05Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Yunpeng Cui, Shuai Zhang, Jia-Liang Xie, Jinxuan Liang, Hao Lin, Miao Qin, Jiawei Shao, Gongling Chen, Yidian Li, Yixuan Luo, Deng Hu, Bingru Lu, Hao Li, Xiang Li, Tiantian Liu, Haodong Yu, Hongyun Zhang, Shuyun Zhou, Zhiwei Wang, Yanfeng Guo, Tiantian Zhang, Miao-Ling Lin, Ping-Heng Tan, Feng Jin, Luyi Yang", "corresponding": "", "url": "https://arxiv.org/abs/2610.32261v1", "topic": "Magnetism", "level": "Brief", "summary_en": "This study revisits the Raman assignments and bulk crystal symmetry of altermagnetic α-MnTe, where earlier interpretations had been conflicting.", "summary": "Crystal symmetry governs the physical properties of materials and provides the framework for interpreting their microscopic excitations and macroscopic responses. In altermagnets, the crystal symmetries that relate opposite-spin sublattices give rise to momentum-dependent spin splitting despite compensated magnetization. Determining the real crystal symmetry is therefore essential for understandin", "abstract": "Crystal symmetry governs the physical properties of materials and provides the framework for interpreting their microscopic excitations and macroscopic responses. In altermagnets, the crystal symmetries that relate opposite-spin sublattices give rise to momentum-dependent spin splitting despite compensated magnetization. Determining the real crystal symmetry is therefore essential for understanding the intrinsic electronic and magnetic properties. For the altermagnetic semiconductor $α$-MnTe, conflicting Raman assignments have left both its intrinsic lattice excitations and its crystal symmetry unresolved. Here we combine high-resolution Raman and second-harmonic generation (SHG) spectroscopy with first-principles calculations to distinguish intrinsic lattice excitations from Te-derived spectral contributions and to examine bulk inversion symmetry of $α$-MnTe. We show that several prominent Raman features previously assigned to $α$-MnTe instead originate from segregated Te clusters or precipitates. The remaining intrinsic Raman response consists of a single Raman-active mode assigned to the calculated $E_{2g}$ phonon, consistent with the centrosymmetric $D_{6h}$ symmetry. The SHG response agrees with surface electric-dipole and bulk electric-quadrupole contributions expected for a centrosymmetric $D_{6h}$ crystal, supporting the preservation of bulk inversion symmetry in $α$-MnTe. Our findings revise the Raman assignments in $α$-MnTe and provide a basis for interpreting its altermagnetic properties within the appropriate crystal-symmetry framework.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "The intrinsic Raman response is identified as a single E₂g phonon, while other prominent features are attributed to Te inclusions; SHG supports centrosymmetric D₆h bulk symmetry.", "ai_in_scope": true, "relevance_reason": "This combines spectroscopy and first-principles calculations to resolve an important crystal-symmetry and lattice-mode question in the altermagnetic semiconductor α-MnTe.", "relevance_method": "semantic", "relevance_score": 77, "feature_candidate": false, "summary_zh": "本文重新审视反铁磁交错磁体 α-MnTe 的拉曼峰归属及其体相晶体对称性，此前相关解释存在分歧。", "method_en": "The authors combine high-resolution Raman and second-harmonic generation (SHG) spectroscopy with first-principles calculations to distinguish intrinsic phonons from Te-derived signals and examine inversion symmetry.", "method_zh": "作者结合高分辨率拉曼光谱、二次谐波产生（SHG）光谱与第一性原理计算，以区分本征声子和源自 Te 的信号，并考察反演对称性。", "result_en": "Several prominent Raman features previously attributed to α-MnTe are assigned instead to segregated Te clusters or precipitates. The remaining intrinsic response is a single Raman-active mode assigned to the calculated E₂g phonon, consistent with centrosymmetric D₆h symmetry. The SHG response is consistent with surface electric-dipole and bulk electric-quadrupole contributions expected for D₆h, supporting preservation of bulk inversion symmetry.", "result_zh": "此前归属于 α-MnTe 的若干显著拉曼特征被重新指认为偏析 Te 团簇或析出物的信号。剩余的本征响应仅包含一个拉曼活性模，被归属为计算得到的 E₂g 声子，并与中心对称的 D₆h 对称性相符。SHG 响应符合 D₆h 晶体预期的表面电偶极和体相电四极贡献，支持 α-MnTe 体相反演对称性得以保留。", "future_en": "The revised assignments provide a symmetry-grounded basis for interpreting α-MnTe’s altermagnetic properties.", "future_zh": "修订后的峰归属为在正确的对称性框架下解释 α-MnTe 的交错磁性质提供了基础。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work resolves a focused but important materials-symmetry controversy with complementary spectroscopy and calculations; the abstract supports a solid specialist result rather than a broader, field-transforming claim.", "tier_reason_zh": "该研究通过互补光谱与计算解决了一个范围明确但重要的材料对称性争议；摘要所述成果具有扎实的专业领域价值，但尚不足以支持更广泛、改变领域格局的判断。"}, {"id": "arxiv-2610-31676", "arxiv_id": "2610.31676", "type": "arXiv", "journal": "arXiv:2610.31676", "journal_ref": "", "title": "Lattice Symmetry Remnants in Spatial and Temporal Entanglement of Quantum Critical Spin Chains", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.str-el"], "submitted_at": "2026-09-07T18:15:35Z", "updated_at": "2026-09-07T18:15:35Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Xiao-Han Yang, Rui-Zhen Huang", "corresponding": "", "url": "https://arxiv.org/abs/2610.31676v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper investigates how microscopic lattice symmetries and an LSM constraint remain visible in spatial and temporal entanglement at quantum criticality, beyond bulk infrared CFT data. For the XXZ chain, it finds that symmetry enforces an alternation between translation-related Dirichlet sectors in the temporal entanglement spectrum, while breaking U(1) removes the associated zero mode and alternation.", "summary": "Quantum critical lattice models carry universal information beyond the bulk data of their infrared conformal field theory (CFT): microscopic lattice symmetries constrain how the CFT is realized. We probe these remnants through the spatial and temporal entanglement of two Euclidean-evolved states from the same critical model. In the finite-length scaling regime, a conformal boundary encodes the lon", "abstract": "Quantum critical lattice models carry universal information beyond the bulk data of their infrared conformal field theory (CFT): microscopic lattice symmetries constrain how the CFT is realized. We probe these remnants through the spatial and temporal entanglement of two Euclidean-evolved states from the same critical model. In the finite-length scaling regime, a conformal boundary encodes the long-distance effect of the short-range initial state, and boundary CFT (BCFT) organizes the universal low-lying entanglement spectrum. We formulate the temporal state as a uniform infinite matrix product state evolved by a symmetry-preserving infinite matrix product operator, using a local factorization regular even at arbitrarily small Trotter steps. For the Ising and three-state Potts chains, whose relevant symmetries are onsite, the spatial and temporal constructions approach the same BCFT structure; varying the initial state engineers conformal boundaries distinguishable spectroscopically. The spin-1/2 XXZ chain instead realizes a Lieb--Schultz--Mattis (LSM) constraint between internal U(1) symmetry and one-site translation. A U(1)-preserving short-range spatial state accommodates it through a doubled unit cell and inequivalent entanglement cuts, whereas the temporal state remains uniform along Euclidean time. Successive spatial transfer steps pump the temporal entanglement spectrum between translation-related Dirichlet sectors, equivalently between integer and half-integer compact-boson zero modes. Breaking U(1) removes both the zero mode and the alternation. Continued evolution at fixed bond dimension crosses over from the finite-length BCFT regime to a finite-entanglement regime generated by symmetry-allowed relevant deformations. Thus microscopic symmetry and anomaly data remain visible in universal entanglement by constraining the boundary realization of the infrared CFT.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "For the XXZ chain, spatial transfer steps pump the temporal entanglement spectrum between translation-related Dirichlet sectors, revealing how the U(1)-translation LSM constraint persists in universal entanglement structure.", "ai_in_scope": true, "relevance_reason": "This theoretical study shows how microscopic lattice symmetries and the LSM constraint shape entanglement spectra in quantum-critical spin chains.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "本文研究在量子临界点处，微观晶格对称性及 LSM 约束如何在空间与时间纠缠中留下痕迹，而这些信息并非仅由红外共形场论的体性质决定。对于 XXZ 链，研究发现对称性使时间纠缠谱在平移相关的 Dirichlet 扇区之间交替；破坏 U(1) 对称性则会消除相应零模与交替。", "method_en": "The authors formulate the temporal state using a uniform infinite matrix product state evolved by a symmetry-preserving infinite matrix product operator, with a local factorization that remains regular at arbitrarily small Trotter steps. They use boundary CFT to organize the low-lying entanglement spectrum and compare Ising, three-state Potts, and spin-1/2 XXZ chains.", "method_zh": "作者以均匀无限矩阵乘积态表示时间态，并用保持对称性的无限矩阵乘积算符对其演化；所用局域分解在任意小的 Trotter 步长下均保持正则。研究借助边界共形场论组织低能纠缠谱，并比较 Ising 链、三态 Potts 链与自旋 1/2 XXZ 链。", "result_en": "For the Ising and three-state Potts chains, spatial and temporal constructions approach the same BCFT structure, and varying the initial state spectroscopically distinguishes conformal boundaries. In the XXZ chain, the LSM constraint links U(1) symmetry and one-site translation: a short-range spatial state accommodates it through a doubled unit cell and inequivalent entanglement cuts, whereas the temporal state remains uniform along Euclidean time. Successive spatial transfer steps pump the temporal entanglement spectrum between translation-related Dirichlet sectors, equivalently between integer and half-integer compact-boson zero modes; breaking U(1) removes both the zero mode and the alternation. At fixed bond dimension, continued evolution crosses from the finite-length BCFT regime to a finite-entanglement regime generated by symmetry-allowed relevant deformations.", "result_zh": "对于 Ising 链和三态 Potts 链，空间与时间构造趋向相同的边界共形场论结构；改变初态可在谱学上区分不同共形边界。对于 XXZ 链，LSM 约束将 U(1) 对称性与单格点平移联系起来：短程空间态通过加倍晶胞及不等价纠缠切口容纳该约束，而时间态沿欧几里得时间方向保持均匀。连续空间转移步骤使时间纠缠谱在平移相关的 Dirichlet 扇区间泵浦，这等价于紧致玻色子整数与半整数零模之间的交替；破坏 U(1) 对称性会同时消除零模与交替。在固定键维数下继续演化，体系会从有限长度 BCFT 区域过渡到由对称性允许的相关形变所产生的有限纠缠区域。", "future_en": "A natural follow-up is to test the predicted symmetry-dependent entanglement-spectrum structures in other critical lattice models with LSM constraints and to track the crossover from finite-length BCFT to finite-entanglement behavior.", "future_zh": "后续可在其他具有 LSM 约束的临界晶格模型中检验所预测的对称性依赖纠缠谱结构，并追踪从有限长度 BCFT 行为到有限纠缠行为的交叉。", "tier": "PRL", "tier_reason_en": "The work connects lattice symmetry and an LSM constraint to universal entanglement structure, combining a general computational formulation with comparisons across distinct critical chains and a specific spectral-pumping result; this supports a substantial and broadly relevant theoretical contribution.", "tier_reason_zh": "该研究将晶格对称性及 LSM 约束与普适纠缠结构联系起来，结合一般性的计算框架、不同临界链的比较，以及明确的纠缠谱泵浦结果，构成具有较广相关性的理论贡献。"}, {"id": "arxiv-2610-32199", "arxiv_id": "2610.32199", "type": "arXiv", "journal": "arXiv:2610.32199", "journal_ref": "", "title": "Magnonic time crystal with lasing coherence", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall"], "submitted_at": "2026-10-23T05:51:44Z", "updated_at": "2026-10-23T05:51:44Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Jiantao Song, C. K. Wei, Shuhuan Ma, Yiming Pan, Zhijian Chen, Li Yu, Wei Lu, Bimu Yao", "corresponding": "", "url": "https://arxiv.org/abs/2610.32199v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The authors report a room-temperature magnonic time crystal whose period-doubled response is emitted with lasing coherence. They connect the response to nonlinear magnon interactions and also demonstrate that its temporal dynamics can provide frequency-resolved features for reservoir computing.", "summary": "Discrete time crystals (DTC) can respond at an integer multiple of the drive period. Internal order-parameter measurements have advanced studies of this novel non-equilibrium phase of matter; however, turning this order into highly coherent, externally accessible radiation remains challenging: pump-driven nonlinear processes must supply sufficient gain to compensate dissipation while preserving su", "abstract": "Discrete time crystals (DTC) can respond at an integer multiple of the drive period. Internal order-parameter measurements have advanced studies of this novel non-equilibrium phase of matter; however, turning this order into highly coherent, externally accessible radiation remains challenging: pump-driven nonlinear processes must supply sufficient gain to compensate dissipation while preserving subharmonic stability. Here we realize a room-temperature magnonic time crystal (MTC) with radiation of lasing coherence using a pump-induced magnon mode in yttrium iron garnet. A microwave beat drive produces robust period doubling over a finite parameter range, with spectral signatures of higher-order MTC at stronger driving. The emitted field exhibits linewidth narrowing to 260.0 Hz and a first-order correlation decay time of $995 μs$. Our model links this response to three-magnon confluence, yields a stability region consistent with experiment and predicts a possible transition to chaos. We further map the complex temporal dynamics into frequency-resolved nonlinear features for reservoir computing. These results bridge time-crystalline order and nonlinear information processing through intrinsic magnon-magnon interactions and lasing coherence.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "A room-temperature magnonic time crystal emits radiation with lasing coherence, and its period-doubled response is linked to three-magnon confluence.", "ai_in_scope": true, "relevance_reason": "The experiment reveals coherent nonequilibrium magnetic order and its nonlinear dynamics in a solid-state magnon system.", "relevance_method": "semantic", "relevance_score": 80, "feature_candidate": false, "summary_zh": "作者报道了一种室温磁振子时间晶体，其周期倍增响应以具有激光相干性的辐射形式输出。他们将这一响应与磁振子的非线性相互作用联系起来，并展示其时间动力学可为储备池计算提供频率分辨特征。", "method_en": "The experiment uses a pump-induced magnon mode in yttrium iron garnet driven by a microwave beat signal, and characterizes the emitted field and its temporal correlations. A model based on three-magnon confluence is used to analyze stability and possible dynamical behavior.", "method_zh": "实验利用微波拍频信号驱动钇铁石榴石中的泵浦诱导磁振子模，并表征辐射场及其时间关联。作者采用基于三磁振子汇聚过程的模型分析稳定性和可能的动力学行为。", "result_en": "The system exhibits robust period doubling over a finite parameter range and higher-order time-crystal spectral signatures at stronger drive; the emitted field has a linewidth narrowed to 260.0 Hz and a first-order correlation decay time of 995 μs. The model yields a stability region consistent with experiment and predicts a possible transition to chaos, while the authors map nonlinear temporal dynamics into frequency-resolved features for reservoir computing.", "result_zh": "该系统在有限参数范围内呈现稳健的周期倍增，并在更强驱动下出现高阶时间晶体的谱特征；辐射场线宽窄化至260.0 Hz，一阶关联衰减时间为995 μs。模型给出的稳定区域与实验相符，并预言可能发生向混沌的转变；作者还将非线性时间动力学映射为用于储备池计算的频率分辨特征。", "future_en": "Follow-up work could investigate the predicted transition to chaos and evaluate how robustly the frequency-resolved dynamics support reservoir-computing tasks.", "future_zh": "后续可研究模型预言的混沌转变，并评估频率分辨动力学对储备池计算任务的支持能力及其稳健性。", "tier": "Nature Communications/Science Advances/PRX", "tier_reason_en": "The abstract reports a room-temperature realization with quantified coherence, a model consistent with experiment, and a connection to information processing, suggesting substantial scope beyond a narrow materials result; it does not provide enough evidence to justify the very highest tier.", "tier_reason_zh": "摘要报道了具有定量相干性指标的室温实现、与实验相符的模型，以及与信息处理的联系，显示其影响范围可能超出狭窄的材料问题；但现有信息不足以支持最高档次评价。"}, {"id": "arxiv-2610-32457", "arxiv_id": "2610.32457", "type": "arXiv", "journal": "arXiv:2610.32457", "journal_ref": "", "title": "Multifractal Magnons Around Localized Defects", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall", "cond-mat.str-el"], "submitted_at": "2026-10-23T10:21:02Z", "updated_at": "2026-10-23T10:21:02Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Adarsh Hullahalli, Yusuf Khand, Christos Panagopoulos, Christina Psaroudaki", "corresponding": "", "url": "https://arxiv.org/abs/2610.32457v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper proposes that localized defects can generate mesoscopic multifractal magnon wavefunctions in otherwise crystalline two-dimensional magnets, without disorder or quasiperiodicity. It argues that skyrmion-induced hybridization with internal deformation modes can make a subset of these states magnetically active and accessible to uniform ac fields.", "summary": "Multifractal wavefunctions fluctuate over a hierarchy of spatial scales, remaining spatially extended while exhibiting strongly nonuniform structure. We show that magnons in otherwise crystalline two-dimensional magnets can exhibit such behavior on mesoscopic scales, without disorder or quasiperiodicity. A localized defect can mix discrete groups of nearly degenerate magnon states in a finite samp", "abstract": "Multifractal wavefunctions fluctuate over a hierarchy of spatial scales, remaining spatially extended while exhibiting strongly nonuniform structure. We show that magnons in otherwise crystalline two-dimensional magnets can exhibit such behavior on mesoscopic scales, without disorder or quasiperiodicity. A localized defect can mix discrete groups of nearly degenerate magnon states in a finite sample, generating multiscale interference patterns and multifractal wavefunctions. We demonstrate this mechanism for both a simple spin defect and topological magnetic skyrmions. Large-scale spin-wave calculations for skyrmions in chiral and frustrated magnets reveal clear multifractal diagnostics over the full accessible range of system sizes of above-gap modes. Crucially, skyrmions make these states experimentally observable by hybridizing them with magnetically active internal deformation modes, which gives a subset of the multifractal states a nonzero magnetic dipole moment. These states can therefore be excited by uniform ac fields and remain distinguishable at realistic frequency resolution, providing a direct route to observing mesoscopic magnon multifractality.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Localized defects, including skyrmions, can mix nearly degenerate magnon states to generate mesoscopic multifractal patterns, with skyrmion deformation modes making some states excitable by uniform ac fields.", "ai_in_scope": true, "relevance_reason": "The paper advances quantum-magnetic collective-mode physics by identifying a defect-driven route to observable magnon multifractality in otherwise crystalline magnets.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": false, "summary_zh": "本文提出，在原本晶态的二维磁体中，局域缺陷无需无序或准周期性便可产生介观多重分形磁振子波函数。研究指出，斯格明子与内部形变模的杂化可使其中一部分态具有磁活性，从而能够由均匀交流场激发。", "method_en": "The authors analyze defect-induced mixing among nearly degenerate magnon states and demonstrate the mechanism for both a simple spin defect and topological magnetic skyrmions. Large-scale spin-wave calculations in chiral and frustrated magnets are used to assess multifractal diagnostics and magnetic-mode hybridization.", "method_zh": "作者分析局域缺陷如何混合近简并磁振子态，并以简单自旋缺陷和拓扑磁斯格明子展示该机制。研究还对手性磁体和受挫磁体进行大规模自旋波计算，以考察多重分形判据及其与磁活性模的杂化。", "result_en": "Defect-induced mixing of discrete, nearly degenerate magnon states produces multiscale interference patterns and multifractal wavefunctions while the states remain spatially extended. For skyrmions in chiral and frustrated magnets, the authors report clear multifractal diagnostics for above-gap modes over the full accessible range of system sizes. Hybridization with magnetically active internal deformation modes gives a subset of these states a nonzero magnetic dipole moment, making them excitable by uniform ac fields and distinguishable at realistic frequency resolution. The proposed mechanism therefore offers a route to observing mesoscopic magnon multifractality.", "result_zh": "局域缺陷对离散近简并磁振子态的混合会产生多尺度干涉图样和多重分形波函数，同时这些态仍保持空间延展性。对于手性磁体和受挫磁体中的斯格明子，作者在可达到的全部系统尺寸范围内，均观察到带隙以上模的清晰多重分形判据。与具有磁活性的内部形变模杂化后，部分态获得非零磁偶极矩，因而可由均匀交流场激发，并在现实频率分辨率下区分。该机制由此为观测介观磁振子多重分形提供了途径。", "future_en": "A direct follow-up is to use uniform ac-field spectroscopy of skyrmion-hosting chiral or frustrated magnets to seek the predicted dipole-active multifractal modes and test their resolvability at realistic frequency resolution.", "future_zh": "后续可对含斯格明子的手性或受挫磁体开展均匀交流场谱学测量，寻找所预测的偶极活性多重分形模，并检验其在现实频率分辨率下是否可分辨。", "tier": "PRL", "tier_reason_en": "The abstract presents a distinctive defect-driven route to multifractal magnons and connects the theoretical phenomenon to experimentally accessible, dipole-active states; this combination supports a strong, broad condensed-matter result, though no experimental observation is reported.", "tier_reason_zh": "摘要提出了缺陷驱动磁振子多重分形的独特机制，并将理论现象与实验可探测的偶极活性态联系起来，具有较强且较广泛的凝聚态物理意义；不过摘要未报告实验观测。"}, {"id": "arxiv-2610-31725", "arxiv_id": "2610.31725", "type": "arXiv", "journal": "arXiv:2610.31725", "journal_ref": "", "title": "Phonon evidence for a partial, re-entrant spin reorientation near room temperature in LaFe$_{1-x}$Ni$_x$O$_3$", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mes-hall", "cond-mat.mtrl-sci"], "submitted_at": "2026-10-22T13:00:38Z", "updated_at": "2026-10-22T13:00:38Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Subha Maity, Dushyant Singh, Vigneshwari S R, Tharundev V, Navneet Sharma, Subhavenkadesh SS, Krista R. Khiangte", "corresponding": "", "url": "https://arxiv.org/abs/2610.31725v1", "topic": "Magnetism", "level": "Brief", "summary_en": "This study reports Raman and magnetic anomalies in LaFe₁₋ₓNiₓO₃ and interprets them as evidence for partial, re-entrant spin reorientation near room temperature, including in the absence of a magnetic rare-earth ion.", "summary": "Spin reorientation near room temperature offers a route to controlling antiferromagnetic order, yet LaFeO$3$, which lacks a magnetic rare-earth ion, is generally expected to retain its spin orientation along the $a$ axis below $T{\\mathrm N}\\approx740$~K. Here, we investigate LaFe$_{1-x}$Ni$_x$O$_3$ ($x=0$ and 0.1) using temperature-dependent magnetization and Raman spectroscopy over 200--400~K. Bo", "abstract": "Spin reorientation near room temperature offers a route to controlling antiferromagnetic order, yet LaFeO$3$, which lacks a magnetic rare-earth ion, is generally expected to retain its spin orientation along the $a$ axis below $T{\\mathrm N}\\approx740$~K. Here, we investigate LaFe$_{1-x}$Ni$_x$O$_3$ ($x=0$ and 0.1) using temperature-dependent magnetization and Raman spectroscopy over 200--400~K. Both compositions exhibit magnetic anomalies at 285.6 and 323~K, respectively, accompanied by correlated deviations of 12 Raman modes from their conventional anharmonic behavior. Principal component analysis and a global fitting approach reveal a common temperature-dependent phonon response, with mode-dependent amplitudes and signs. To interpret these anomalies, we develop a Landau-based spin-phonon coupling model describing complete, partial re-entrant, and incipient spin reorientation. Comparison with the experimental Raman profiles favors a partial, re-entrant rotation of the N'eel vector in both compositions, centered near 290~K. Ni substitution narrows the characteristic reorientation interval from approximately 116 to 84~K and enhances the magnetization anomaly by a factor of four. An additional feature near 262~K in LaFeO$_3$ is consistent with the Morin transition of trace $α$-Fe$_2$O$_3$. These findings suggest that partial spin reorientation can emerge without magnetic rare-earth ions and establish collective Raman phonon anomalies as a sensitive indirect probe of magnetic anisotropy changes in orthoferrites.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "Temperature-dependent magnetic and phonon anomalies support partial, re-entrant Néel-vector rotation near 290 K in LaFeO₃ and Ni-substituted LaFeO₃, with substitution narrowing the reorientation interval and enhancing the magnetization anomaly.", "ai_in_scope": true, "relevance_reason": "The study combines magnetic and Raman measurements with a spin-phonon model to investigate a new magnetic-order phenomenon in an oxide material.", "relevance_method": "semantic", "relevance_score": 76, "feature_candidate": false, "summary_zh": "本文报告 LaFe₁₋ₓNiₓO₃ 中的拉曼与磁学异常，并将其解释为近室温部分性、再入式自旋重取向的证据；这一现象也出现在不含磁性稀土离子的体系中。", "method_en": "The authors measure magnetization and Raman spectra from 200 to 400 K for x=0 and 0.1, analyze the phonon response using principal component analysis and global fitting, and compare it with a Landau-based spin–phonon coupling model.", "method_zh": "作者对 x=0 和 0.1 的样品在 200–400 K 范围内测量磁化强度和拉曼光谱，利用主成分分析及全局拟合分析声子响应，并将结果与基于朗道理论的自旋–声子耦合模型比较。", "result_en": "Both compositions show magnetic anomalies at 285.6 K and 323 K, respectively, accompanied by correlated departures of 12 Raman modes from conventional anharmonic behavior. The Raman profiles favor a partial, re-entrant Néel-vector rotation centered near 290 K; Ni substitution narrows the characteristic interval from approximately 116 to 84 K and increases the magnetization anomaly by a factor of four. An additional feature near 262 K in LaFeO₃ is consistent with the Morin transition of trace α-Fe₂O₃.", "result_zh": "两种组分分别在 285.6 K 和 323 K 出现磁学异常，同时有 12 个拉曼模偏离常规非谐行为。拉曼谱线更支持以约 290 K 为中心的部分性、再入式 Néel 矢量转动；Ni 掺杂使特征温区由约 116 K 缩窄至 84 K，并使磁化异常增强四倍。LaFeO₃ 在约 262 K 处的额外特征与微量 α-Fe₂O₃ 的 Morin 转变相符。", "future_en": "The authors present collective Raman phonon anomalies as an indirect probe of magnetic-anisotropy changes; further tests of the proposed spin-reorientation interpretation are not specified in the abstract.", "future_zh": "作者提出可将集体拉曼声子异常作为磁各向异性变化的间接探针；摘要未具体说明如何进一步检验所提出的自旋重取向解释。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The combination of multi-mode Raman analysis, magnetization, and a model supports a substantial materials-physics result with quantitative composition-dependent effects, while the abstract’s scope remains focused on one orthoferrite series.", "tier_reason_zh": "多模拉曼分析、磁化测量与模型相结合，构成了具有定量组分依赖效应的扎实材料物理成果；但摘要所述范围仍集中于一类正交铁氧体。"}, {"id": "arxiv-2610-32283", "arxiv_id": "2610.32283", "type": "arXiv", "journal": "arXiv:2610.32283", "journal_ref": "", "title": "Triplon dynamics from partial Kondo screening in frustrated heavy-fermion systems", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-23T07:40:57Z", "updated_at": "2026-10-23T07:40:57Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Hiroki Nakahara, Masahito Mochizuki, Rintaro Eto", "corresponding": "", "url": "https://arxiv.org/abs/2610.32283v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The study examines how magnetic excitations evolve across the Kondo-insulating, partially disordered, and magnetically ordered phases of a frustrated heavy-fermion model. It finds that Kondo-screened sites support triplon modes whose condensation drives successive phase transitions and whose hybridization with magnons shapes the partially disordered phase.", "summary": "The partially disordered (PD) phase, in which magnetically ordered and Kondo-screened sites coexist, has been proposed as a possible ground state of geometrically frustrated heavy-fermion systems. We investigate its dynamical properties in the half-filled periodic Anderson model on a triangular lattice by calculating the dynamical spin susceptibility within the random-phase approximation built on ", "abstract": "The partially disordered (PD) phase, in which magnetically ordered and Kondo-screened sites coexist, has been proposed as a possible ground state of geometrically frustrated heavy-fermion systems. We investigate its dynamical properties in the half-filled periodic Anderson model on a triangular lattice by calculating the dynamical spin susceptibility within the random-phase approximation built on a self-consistent Hartree-Fock solution. We show that successive quantum phase transitions from the Kondo-insulating phase to the PD phase and to a magnetically ordered phase are driven by the condensation of triplon modes originating predominantly from the Kondo-screened sites. In the PD phase, magnons and triplons coexist and hybridize, leading to characteristic level repulsion in the excitation spectrum. These results reveal how triplet excitations evolve into collective magnetic modes across the successive phase transitions and highlight the dynamical interplay between magnetic order and Kondo screening in frustrated heavy-fermion systems.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Triplon condensation is identified as the driver of successive transitions from a Kondo insulator to a partially disordered phase and then magnetic order, where triplons hybridize with magnons.", "ai_in_scope": true, "relevance_reason": "The work develops a dynamical account of competing Kondo screening and magnetic order in a frustrated heavy-fermion system.", "relevance_method": "semantic", "relevance_score": 75, "feature_candidate": false, "summary_zh": "本文研究受挫重费米子模型中磁激发如何随体系从近藤绝缘相，经部分无序相，进入磁有序相而演化。研究发现，近藤屏蔽位点承载的三重态激发凝聚驱动连续相变，并在部分无序相中与磁振子杂化。", "method_en": "The authors calculate the dynamical spin susceptibility of the half-filled periodic Anderson model on a triangular lattice. They use the random-phase approximation based on a self-consistent Hartree–Fock solution.", "method_zh": "作者计算三角晶格半填充周期安德森模型的动力学自旋磁化率。计算采用基于自洽 Hartree–Fock 解的随机相位近似。", "result_en": "Triplon modes originating predominantly from Kondo-screened sites condense at successive transitions from the Kondo-insulating phase to the partially disordered phase and then to magnetic order. In the partially disordered phase, magnons and triplons coexist and hybridize, producing level repulsion in the excitation spectrum. The results trace the evolution of triplet excitations into collective magnetic modes across these transitions.", "result_zh": "主要源自近藤屏蔽位点的三重态激发模在连续相变中凝聚，推动体系由近藤绝缘相进入部分无序相，并进一步转为磁有序相。部分无序相中磁振子与三重态激发共存并发生杂化，在激发谱中产生能级排斥。研究展示了三重态激发如何跨越这些相变演化为集体磁模。", "future_en": "A natural next step is to test the predicted triplon condensation and magnon–triplon level repulsion in spectroscopic measurements of frustrated heavy-fermion systems.", "future_zh": "后续可在受挫重费米子体系中通过谱学测量检验所预测的三重态激发凝聚及磁振子—三重态激发能级排斥。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work develops a focused theoretical account of excitation dynamics across phases in a specific frustrated heavy-fermion model, with a clear mechanism and spectral predictions; the abstract does not indicate the breadth or experimental validation expected for a higher tier.", "tier_reason_zh": "该研究针对特定受挫重费米子模型，提出跨相激发动力学的理论解释，并给出明确机制与谱学预测；摘要未显示更高层级期刊通常要求的广泛性或实验验证。"}, {"id": "arxiv-2610-32136", "arxiv_id": "2610.32136", "type": "arXiv", "journal": "arXiv:2610.32136", "journal_ref": "", "title": "Zeeman Shift and Injection Currents under Light Irradiation", "arxiv_version": 1, "primary_category": "cond-mat.other", "categories": ["cond-mat.other"], "submitted_at": "2026-10-23T04:05:06Z", "updated_at": "2026-10-23T04:05:06Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Ruizhi Dong, Yihua Xiao, Pengfei Wang, Ruixiang Fei", "corresponding": "", "url": "https://arxiv.org/abs/2610.32136v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The authors propose two light-induced photocurrents—Zeeman shift and injection currents—arising jointly from the electric and magnetic components of light. They derive their microscopic conductivity tensors and show that, unlike conventional second-order photocurrents, these responses can occur in centrosymmetric systems under specified magnetic or spin-orbit conditions.", "summary": "The conversion of light into electrical currents enables energy harvesting and photodetection. Conventional second-order dc photocurrents are driven by the electric component of light through electric-dipole coupling and require broken inversion symmetry. Here, we show that the electric and magnetic components of light jointly generate Zeeman shift and injection currents. Using quantum perturbatio", "abstract": "The conversion of light into electrical currents enables energy harvesting and photodetection. Conventional second-order dc photocurrents are driven by the electric component of light through electric-dipole coupling and require broken inversion symmetry. Here, we show that the electric and magnetic components of light jointly generate Zeeman shift and injection currents. Using quantum perturbation theory, we derive explicit microscopic expressions for their conductivity tensors. We systematically classify the symmetry constraints on these responses and show how they differ from those governing conventional photocurrents. In particular, both responses can occur in centrosymmetric systems with spin-orbit coupling or noncollinear magnetic order, irrespective of time-reversal symmetry. A centrosymmetric kagome model exhibits broadband responses. First-principles calculations for Mn$_3$Sn further predict Zeeman injection and shift current densities of $10^{2}$-$10^{3}~\\mathrm{A/m^{2}}$ and $1$-$10~\\mathrm{A/m^{2}}$, respectively, under illumination with an electric-field amplitude $E=10^{4}~\\mathrm{V/m}$. These magnitudes place both currents within experimental reach.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "The work identifies Zeeman shift and injection currents generated jointly by the electric and magnetic components of light, and shows they can occur in centrosymmetric systems, including noncollinear magnets.", "ai_in_scope": true, "relevance_reason": "It derives and predicts new light-induced electronic responses in magnetic and spin-orbit-coupled materials, including Mn3Sn.", "relevance_method": "semantic", "relevance_score": 76, "feature_candidate": false, "summary_zh": "作者提出两种由光诱导的光电流——塞曼位移电流和注入电流——它们由光的电场分量与磁场分量共同产生。作者推导了相应的微观电导张量，并指出，与传统二阶光电流不同，这些响应在满足特定磁性或自旋轨道条件的中心对称系统中也可出现。", "method_en": "The authors use quantum perturbation theory to derive conductivity tensors and systematically classify the symmetry constraints on the two responses. They illustrate the theory with a centrosymmetric kagome model and first-principles calculations for Mn3Sn.", "method_zh": "作者利用量子微扰理论推导电导张量，并系统分类两种响应所受的对称性约束。研究以中心对称的kagome模型和Mn3Sn的第一性原理计算为例说明该理论。", "result_en": "Both responses are predicted to occur in centrosymmetric systems with spin-orbit coupling or noncollinear magnetic order, irrespective of time-reversal symmetry. For Mn3Sn under illumination with electric-field amplitude E=10^4 V/m, the predicted Zeeman injection and shift current densities are 10^2–10^3 A/m² and 1–10 A/m², respectively.", "result_zh": "理论预言，在具有自旋轨道耦合或非共线磁序的中心对称系统中，无论时间反演对称性如何，两种响应均可出现。对于电场振幅E=10^4 V/m的照明条件，Mn3Sn中预测的塞曼注入电流密度为10^2–10^3 A/m²，塞曼位移电流密度为1–10 A/m²。", "future_en": "Experimental tests could seek the predicted currents in Mn3Sn under the specified illumination conditions and distinguish them using their symmetry-dependent responses.", "future_zh": "可在所述照明条件下于Mn3Sn中寻找这些预言的电流，并利用其对称性依赖特征加以区分。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work offers a systematic theoretical treatment, symmetry classification, and material-specific current estimates, but the abstract reports no experimental observation and frames the magnitudes as predictions.", "tier_reason_zh": "该研究提供了系统的理论处理、对称性分类以及针对具体材料的电流估算，但摘要未报告实验观测，所给电流大小仍是理论预言。"}, {"id": "arxiv-2610-32743", "arxiv_id": "2610.32743", "type": "arXiv", "journal": "arXiv:2610.32743", "journal_ref": "", "title": "First- and Second-Order Electron Position Correlators Reveal Topological Phase Transitions", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.dis-nn", "cond-mat.mes-hall", "cond-mat.mtrl-sci", "cond-mat.stat-mech"], "submitted_at": "2026-10-23T14:55:16Z", "updated_at": "2026-10-23T14:55:16Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Antimo Marrazzo, Christian Loer Llemit, Massimo Capone", "corresponding": "", "url": "https://arxiv.org/abs/2610.32743v1", "topic": "Materials & Growth", "level": "Brief", "summary_en": "The authors develop a correlator-based framework for identifying topological phase transitions using fluctuations of the electronic position operator. They show that antisymmetric position correlators encode the Chern number and that critical behavior can be captured by these correlators or, in more general settings, by higher-order Chern-Chern correlators.", "summary": "The theory of conventional critical phenomena is built around the concepts of fluctuations and correlators of local observables. Here, we show that topological phase transitions can also be characterized through spatial and temporal two-point correlation functions associated with fluctuations of the electronic position operator. The key object is the antisymmetric part of the position-position cor", "abstract": "The theory of conventional critical phenomena is built around the concepts of fluctuations and correlators of local observables. Here, we show that topological phase transitions can also be characterized through spatial and temporal two-point correlation functions associated with fluctuations of the electronic position operator. The key object is the antisymmetric part of the position-position correlation function, which yields the Chern number in the equal-time and equal-space limit. When the system is translationally invariant in space or time (the latter case corresponding to an equilibrium condition), these two-point correlators reduce to one-variable functions of the remaining variable. Remarkably, these functions are both reminiscent of critical behaviour, including divergent correlation times and lengths signalling the phase transitions. Away from these conditions, namely in non-periodic systems or genuinely dynamical processes, criticality is instead better captured by higher-order Chern-Chern correlators constructed from local or dynamical markers obtained as coincident-point limits of the position correlators. These higher-order Chern-Chern correlators can be seen as double Levi-Civita contractions of second-order position correlators, selecting the antisymmetric sector in each index pair. We substantiate this framework through numerical simulations and analytic calculations. Our results establish a general correlator-based description of topological phase transitions, applicable to crystalline, noncrystalline, equilibrium, and dynamical systems.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Antisymmetric position-position correlators encode the Chern number and exhibit critical behavior at topological transitions, with higher-order Chern-Chern correlators extending the framework to non-periodic and dynamical systems.", "ai_in_scope": true, "relevance_reason": "It develops and tests a theoretical description of topological electronic phase transitions using position-based correlators.", "relevance_method": "semantic", "relevance_score": 72, "feature_candidate": false, "summary_zh": "作者建立了一种基于关联函数的框架，利用电子位置算符涨落识别拓扑相变。他们表明，位置关联函数的反对称部分编码陈数；在更一般的情形下，则可借助高阶陈数—陈数关联函数刻画临界行为。", "method_en": "The authors analyze equal-time and equal-space limits of first- and second-order position correlators, and construct higher-order correlators from local or dynamical Chern markers. They support the framework with numerical simulations and analytic calculations.", "method_zh": "作者分析一阶和二阶位置关联函数在等时、等空间极限下的性质，并由局域或动力学陈数标记构造高阶关联函数。该框架通过数值模拟和解析计算加以验证。", "result_en": "The antisymmetric position-position correlator yields the Chern number in the equal-time, equal-space limit, while reduced correlators show divergent correlation times or lengths under spatial or temporal translational invariance. For non-periodic systems or genuinely dynamical processes, the authors identify higher-order Chern-Chern correlators as the more suitable diagnostic of criticality.", "result_zh": "位置—位置关联函数的反对称部分在等时、等空间极限下给出陈数；在具有空间或时间平移不变性的情形中，约化关联函数呈现发散的关联时间或关联长度。对于非周期系统或真正的动力学过程，作者指出高阶陈数—陈数关联函数是更合适的临界性诊断量。", "future_en": "A natural follow-up is to apply the proposed correlators to concrete noncrystalline and driven systems and assess how their critical signatures can be measured.", "future_zh": "后续可将所提出的关联函数应用于具体的非晶格系统和受驱动系统，并评估如何测量其中的临界特征。", "tier": "PRL", "tier_reason_en": "The abstract presents a conceptually broad framework that unifies topological criticality across crystalline, noncrystalline, equilibrium, and dynamical settings, supported by analytic and numerical work; the abstract alone gives limited detail on validation and impact.", "tier_reason_zh": "摘要提出了一个概念上具有广泛适用性的框架，试图统一晶体、非晶格、平衡及动力学情形下的拓扑临界性，并提供解析与数值支持；但摘要对验证范围和影响的细节有限。"}, {"id": "arxiv-2610-32157", "arxiv_id": "2610.32157", "type": "arXiv", "journal": "arXiv:2610.32157", "journal_ref": "", "title": "Compass Correlations in a Square-Lattice Magnet", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-23T04:49:35Z", "updated_at": "2026-10-23T04:49:35Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Otkur Omar, Matthias D. Frontzek, Gabriele Sala, Junying Shen, Xinmin Wang, Ze Hu, Zhuang Xu, Zecong Qin, Xin Tong, Joe Paddison, Max Hirschberger, Shinichiro Seki, Masaaki Matsuda, Matthew B. Stone, Andrew D. Christianson, Nguyen D. Khanh, Shang Gao", "corresponding": "", "url": "https://arxiv.org/abs/2610.32157v1", "topic": "Superconductivity", "level": "Feature", "summary_en": "The authors identify compass correlations in the square-lattice magnet ErRu₂Si₂ using neutron diffuse scattering and comparison with NdRu₂Si₂. Crystal-field spectroscopy and a compass-Heisenberg model connect the directional correlations to four preferred Er³⁺ moment orientations and account for the double-Q vortex-antivortex ground state.", "summary": "The square-lattice compass model is a paradigm of bond-dependent frustration, yet experimental evidence for its characteristic spin correlations has remained elusive. Here we identify compass correlations in the square-lattice intermetallic ErRu$_2$Si$_2$ using single-crystal neutron diffuse scattering. Comparative measurements on the isostructural compounds NdRu$_2$Si$_2$ and ErRu$_2$Si$_2$ revea", "abstract": "The square-lattice compass model is a paradigm of bond-dependent frustration, yet experimental evidence for its characteristic spin correlations has remained elusive. Here we identify compass correlations in the square-lattice intermetallic ErRu$_2$Si$_2$ using single-crystal neutron diffuse scattering. Comparative measurements on the isostructural compounds NdRu$_2$Si$_2$ and ErRu$_2$Si$_2$ reveal a pronounced contrast between nearly uniform diffuse rings in the former and strong intensity modulation between Brillouin zones in the latter. Through the magnetic neutron polarization factor, this modulation reveals compass correlations that couple moment orientation to the correlation wavevector. Crystal-field spectroscopy identifies four preferred in-plane orientations for the Er$^{3+}$ moments. A minimal compass-Heisenberg model incorporating this anisotropy quantitatively reproduces the diffuse scattering and accounts for the double-$Q$ vortex-antivortex ground state. Fits with the compass couplings fixed at values set by the dipolar energy scale retain good agreement with the data, supporting a substantial dipolar contribution to the bond-dependent interactions. Our results establish a square-lattice platform for compass physics and suggest that dipolar interactions, acting together with local crystal-field anisotropy, can shape directional magnetic correlations alongside conduction-electron-mediated exchange.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "Diffuse scattering in ErRu₂Si₂ reveals compass correlations linking moment orientation to correlation wavevector; crystal-field anisotropy and dipolar-scale compass couplings account for the observations and the proposed double-Q vortex-antivortex ground state", "ai_in_scope": true, "relevance_reason": "Neutron-scattering and spectroscopy measurements establish distinctive bond-dependent magnetic correlations in a square-lattice material and connect them to a quantitative magnetic model.", "relevance_method": "semantic", "relevance_score": 84, "feature_candidate": true, "summary_zh": "作者通过中子漫散射并与NdRu₂Si₂比较，在方格磁体ErRu₂Si₂中识别出罗盘关联。晶场谱学和罗盘—海森堡模型将方向性关联与Er³⁺磁矩的四种优选取向联系起来，并解释了双Q涡旋—反涡旋基态。", "method_en": "Single-crystal neutron diffuse-scattering measurements compare ErRu₂Si₂ with isostructural NdRu₂Si₂, while crystal-field spectroscopy determines preferred in-plane moment orientations. The authors fit the scattering with a minimal compass-Heisenberg model and also test fits with compass couplings fixed at values set by the dipolar energy scale.", "method_zh": "作者对ErRu₂Si₂和同结构化合物NdRu₂Si₂进行单晶中子漫散射测量，并通过晶场谱学确定面内磁矩的优选取向。他们使用最简罗盘—海森堡模型拟合散射数据，并进一步检验将罗盘耦合固定为由偶极能标确定的数值时的拟合效果。", "result_en": "The diffuse scattering differs markedly between the compounds: NdRu₂Si₂ shows nearly uniform rings, whereas ErRu₂Si₂ has strong intensity modulation between Brillouin zones. Through the magnetic neutron polarization factor, this modulation reveals compass correlations coupling moment orientation to correlation wavevector. Crystal-field spectroscopy finds four preferred in-plane orientations for Er³⁺ moments, and a minimal compass-Heisenberg model incorporating this anisotropy quantitatively reproduces the diffuse scattering and accounts for a double-Q vortex-antivortex ground state. Good agreement persists when the compass couplings are fixed at dipolar-energy-scale values, supporting a substantial dipolar contribution to the bond-dependent interactions.", "result_zh": "两种化合物的漫散射存在显著差异：NdRu₂Si₂呈现近乎均匀的散射环，而ErRu₂Si₂在不同布里渊区之间表现出强烈的强度调制。通过磁性中子极化因子，这种调制揭示了将磁矩取向与关联波矢耦合起来的罗盘关联。晶场谱学发现Er³⁺磁矩具有四种面内优选取向；纳入这一各向异性的最简罗盘—海森堡模型能够定量再现实验漫散射，并解释双Q涡旋—反涡旋基态。即使将罗盘耦合固定在偶极能标对应的数值，模型仍能良好拟合数据，支持偶极相互作用对键依赖耦合有显著贡献。", "future_en": "Further experiments could vary temperature or magnetic field to track how the directional diffuse-scattering pattern evolves and to test the stability of the inferred correlations. Comparative studies across related compounds could help clarify how local crystal-field anisotropy and dipolar interactions shape compass correlations.", "future_zh": "后续实验可改变温度或磁场，追踪方向性漫散射图样的演化，并检验所推断关联的稳定性。对相关化合物开展比较研究，有助于厘清局域晶场各向异性与偶极相互作用如何共同塑造罗盘关联。", "tier": "PRL", "tier_reason_en": "The work addresses a longstanding experimental gap by identifying compass correlations in a material, and combines neutron scattering, crystal-field information, and quantitative modeling to connect them to a candidate ground state. The experimentally grounded result and broader relevance to frustrated magnetism support a PRL-level assessment.", "tier_reason_zh": "该研究通过在具体材料中识别罗盘关联，填补了长期存在的实验空白，并结合中子散射、晶场信息与定量建模，将关联与候选基态联系起来。其实验基础和对受挫磁性的广泛意义支持将其评为PRL层级。"}, {"id": "arxiv-2610-32097", "arxiv_id": "2610.32097", "type": "arXiv", "journal": "arXiv:2610.32097", "journal_ref": "", "title": "Heterogeneous superconductivity emerging from a charge-stripe state in kagome lattices", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el", "cond-mat.supr-con"], "submitted_at": "2026-10-23T02:58:25Z", "updated_at": "2026-10-23T02:58:25Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Hongyu Li, Shuikang Yu, Huachen Rao, Zhuying Wang, Xingchen Zhou, Houpu Li, Yunmei Zhang, Zhao Gong, Xin Yu, Rui Wu, Tao Wu, Zhenyu Wang, Ziji Xiang, Xianhui Chen", "corresponding": "", "url": "https://arxiv.org/abs/2610.32097v1", "topic": "Superconductivity", "level": "Feature", "summary_en": "This study reports that superconductivity in CsV₃Sb₅₋ₓSnₓ changes abruptly as the triple-Q charge-density wave gives way to a short-range stripe-like state at x₍c₎ = 0.07. Beyond this transition, superconductivity is spatially heterogeneous, with observations consistent with strong pair breaking by charge stripes and an unconventional order parameter.", "summary": "Charge density wave (CDW) and superconductivity have long been recognized as competing orders. However, recent achievements establish that the interplay between these two collective electronic phenomena can be more perplexing, with emergent phenomena arising from their cooperation. Here we report a distinctive case of the kagome superconductors CsV3Sb5-xSnx, in which the characteristics of superco", "abstract": "Charge density wave (CDW) and superconductivity have long been recognized as competing orders. However, recent achievements establish that the interplay between these two collective electronic phenomena can be more perplexing, with emergent phenomena arising from their cooperation. Here we report a distinctive case of the kagome superconductors CsV3Sb5-xSnx, in which the characteristics of superconductivity evolve in accordance with the form of CDW order. As the triple-Q CDW in CsV3Sb5 transforms to a short-range stripelike CDW at xc = 0.07, a sudden change in superconducting properties occurs concomitantly. A combination of thermodynamic, electrical transport and scanning tunneling microscopy experiments reveals a heterogeneous superconducting state beyond xc: the superconducting gap exhibits pronounced spatial variation, in conformity with a distribution of critical temperature and the resulted superconducting precursor effects. Moreover, abundant normal fluid persists deep into the superconducting state, as evidenced by remnants of electronic specific heat and zero-energy quasiparticle interference. These observations are unrelated to the chemical inhomogeneity and residual strain effect introduced by Sn substitution. Instead, they emulate the phenomenology that a sign-changing superconducting order parameter is subject to strong pair-breaking scattering with the short-range charge stripes and hence reflect the unconventional nature of superconductivity developing inside the charge-stripe state.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "The short-range stripe CDW state is accompanied by spatially varying superconducting gaps and critical temperatures, precursor effects, and residual normal-fluid signatures, consistent with strong pair breaking of unconventional superconductivity.", "ai_in_scope": true, "relevance_reason": "This experimental study of a kagome superconductor links a change in charge order to spatially heterogeneous superconductivity and unusual residual excitations, making it a strong quantum-materials result.", "relevance_method": "semantic", "relevance_score": 80, "feature_candidate": true, "summary_zh": "该研究发现，CsV₃Sb₅₋ₓSnₓ中的超导性在三Q电荷密度波转变为短程条纹态时（x₍c₎ = 0.07）发生突变。转变之后，超导呈现空间非均匀性；相关观测与电荷条纹造成强烈成对破坏、且超导序参量具有非常规性质的情形相符。", "method_en": "The authors combine thermodynamic and electrical-transport measurements with scanning tunneling microscopy to track superconducti
