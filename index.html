erns, emerges from a symmetry-breaking Fermi surface near v = -2 and D = 0, and it survives at a large in-plane magnetic field up to 2 T, strongly deviating from the Pauli limit. Moreover, we observe a strong modulation of the Ginzburg-Landau coherence length from 467 nm to 145 nm as the in-plane magnetic field increases from 0 to 2 T, whereas the critical current Ic barely changes. Unlike previous studies in RMG, we observe a competition between superconductivity and a correlated insulator at v = -2, monitored by displacement fields and twist angles. Note that we also observe integer Chern insulators with C = 1, 3, and -3 at v = 1/2, 1, and 3, respectively, for large D > 0 in the same superconducting device. The observations establish twisted rhombohedral graphene multilayers as a fascinating system to investigate unconventional superconductivity, high Chern number topology, and their interplay.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "Twisted rhombohedral bilayer-trilayer graphene exhibits superconductivity that survives in-plane fields to 2 T, competes with a correlated insulator, and occurs in the same device as Chern insulators with C = 1, 3, and -3.", "ai_in_scope": true, "relevance_reason": "The work reports new superconducting and Chern-insulating phases in a moiré quantum material and examines their competition and coexistence.", "relevance_method": "semantic", "relevance_score": 90, "feature_candidate": false, "summary_zh": "本文在同一扭转菱方双层-三层石墨烯器件中报告了超导与整数陈绝缘体。研究描述了超导特征（包括其在较大面内磁场下存续）、超导与关联绝缘体的竞争，以及多个陈态。", "method_en": "The authors characterize the device through transport measurements, including superconducting transition and current-voltage behavior, phase-sensitive interference, and responses to in-plane magnetic field. They also map correlated insulating and Chern insulating states as functions of filling, displacement field, and twist angle.", "method_zh": "作者通过输运测量表征器件，包括超导转变、电流-电压行为、相位敏感干涉，以及对面内磁场的响应。研究还考察了关联绝缘态与陈绝缘态随填充、位移场和扭转角的变化。", "result_en": "Superconductivity appears near ν = −2 and D = 0, with a sharp transition at approximately 180 mK, a BKT temperature of 135 mK, nonlinear I–V behavior, and phase-sensitive interference signatures. It survives in-plane fields up to 2 T, substantially beyond the Pauli limit. As the in-plane field increases from 0 to 2 T, the reported Ginzburg–Landau coherence length changes from 467 nm to 145 nm, while the critical current barely changes. The study also finds competition between superconductivity and a correlated insulator at ν = −2, and integer Chern insulators with C = 1, 3, and −3 at ν = 1/2, 1, and 3, respectively, for large positive D.", "result_zh": "超导出现在 ν = −2、D = 0 附近，其转变温度约为 180 mK，BKT 温度为 135 mK，并具有非线性 I–V 特征和相位敏感干涉信号。该超导态在面内磁场高达 2 T 时仍能存续，显著超过泡利极限。面内磁场从 0 增至 2 T 时，报告的 Ginzburg–Landau 相干长度从 467 nm 变为 145 nm，而临界电流几乎不变。研究还发现 ν = −2 处超导与关联绝缘体相互竞争；在较大的正 D 下，ν = 1/2、1、3 处分别出现 C = 1、3、−3 的整数陈绝缘体。", "future_en": "Further phase-sensitive measurements could help clarify the superconducting state in relation to the observed Chern phases and correlated insulator. Systematic studies of the field-dependent coherence length and critical current would test the unusual contrast reported here.", "future_zh": "进一步的相位敏感测量可帮助阐明超导态与所观察到的陈相及关联绝缘体之间的关系。对磁场依赖的相干长度和临界电流开展系统研究，可检验本文报告的反常差异。", "tier": "PRL", "tier_reason_en": "The coexistence of superconductivity and multiple integer Chern insulating states in one device, together with superconductivity above the Pauli limit, is a strong result for moiré graphene. The abstract indicates an important platform advance, but the evidence described is not by itself sufficient to warrant a broader top-tier designation.", "tier_reason_zh": "同一器件中超导与多个整数陈绝缘态并存，加之超导超过泡利极限，是莫尔石墨烯领域的重要结果。摘要显示了显著的平台进展，但所述证据本身尚不足以支持更广泛的顶级期刊层级。"}, {"id": "arxiv-2610-38966", "arxiv_id": "2610.38966", "type": "arXiv", "journal": "arXiv:2610.38966", "journal_ref": "", "journal_doi": "", "title": "Coexistence of superconductivity and magnetic order in BaFe$_2$S$_3$: evidence for orbital-selective delocalization", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.str-el", "cond-mat.supr-con"], "submitted_at": "2026-10-28T21:50:49Z", "updated_at": "2026-10-28T21:50:49Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Y. Oubaid, N. S. Dhami, P. Fertey, C. V. Colin, C. Ritter, A. Forget, D. Bounoua, J. -P. Rueff, M. Verseils, P. Foury-Leylekian, V. Balédent", "corresponding": "", "url": "https://arxiv.org/abs/2610.38966v1", "topic": "Superconductivity", "level": "Feature", "summary_en": "This study examines the evolution of structural, magnetic, and electronic properties in the quasi-one-dimensional spin-ladder compound BaFe₂S₃ under pressure, focusing on how superconductivity relates to its antiferromagnetic order. It reports superconductivity emerging while long-range magnetic order remains present and proposes an orbital-selective interpretation.", "summary": "Understanding how superconductivity emerges from correlated electronic states is a central challenge in condensed matter physics. The quasi-one-dimensional spin-ladder compound \\bfs\\ serves as a unique platform to study this interplay, as it lacks the two-dimensional square lattice characteristic of most iron-based superconductors. Here, we combine high-pressure x-ray and neutron diffraction, x-ra", "abstract": "Understanding how superconductivity emerges from correlated electronic states is a central challenge in condensed matter physics. The quasi-one-dimensional spin-ladder compound \\bfs\\ serves as a unique platform to study this interplay, as it lacks the two-dimensional square lattice characteristic of most iron-based superconductors. Here, we combine high-pressure x-ray and neutron diffraction, x-ray emission spectroscopy, and electrical transport to map its structural, magnetic, and electronic evolution into the superconducting regime. We \\revised{observe} a striking pressure-induced decoupling: while the long-range stripe-type antiferromagnetic order remains remarkably robust under pressure up to the onset of superconductivity, the local iron magnetic moment is suppressed by nearly 80\\%. This dichotomy \\revised{points to an orbital-selective mechanism}, where specific Fe $3d$ electrons remain localized to sustain magnetism while others delocalize to form the itinerant and superconducting state. \\revised{Superconductivity emerges while long-range magnetic order is still present, revealing that the two coexist in \\bfs, which we attribute to} the selective response of multiorbital electronic degrees of freedom.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "In BaFe₂S₃, superconductivity emerges alongside persistent long-range antiferromagnetic order even as the local iron moment is strongly suppressed, consistent with orbital-selective localization and delocalization.", "ai_in_scope": true, "relevance_reason": "The work experimentally resolves the interplay of magnetism and superconductivity in a correlated iron-ladder material and supports an orbital-selective mechanism.", "relevance_method": "semantic", "relevance_score": 84, "feature_candidate": true, "summary_zh": "本文研究准一维自旋梯化合物 BaFe₂S₃ 在压力下的结构、磁性与电子性质演变，重点考察超导与反铁磁序的关系。研究报告了超导在长程磁序仍存在时出现，并提出轨道选择性的解释。", "method_en": "The authors combine high-pressure x-ray and neutron diffraction, x-ray emission spectroscopy, and electrical transport measurements. These probes track structural and magnetic order, local iron moments, and transport into the superconducting regime.", "method_zh": "作者结合高压 X 射线与中子衍射、X 射线发射谱和电输运测量。上述手段用于追踪进入超导区间时的结构与磁序、铁局域磁矩及输运性质。", "result_en": "Stripe-type long-range antiferromagnetic order remains remarkably robust under pressure up to the onset of superconductivity. In contrast, the local iron magnetic moment is suppressed by nearly 80%. The authors interpret this decoupling as evidence for an orbital-selective response: some Fe 3d electrons remain localized and sustain magnetism, while others delocalize into an itinerant superconducting state. Thus, superconductivity and long-range magnetic order coexist in BaFe₂S₃.", "result_zh": "直至超导出现，条纹型长程反铁磁序在压力下仍表现出显著的稳健性。相比之下，铁局域磁矩降低了近 80%。作者将这种差异解释为轨道选择性响应的证据：部分 Fe 3d 电子保持局域以维持磁性，另一些则离域并形成巡游超导态。因此，BaFe₂S₃ 中超导与长程磁序共存。", "future_en": "Further pressure-dependent measurements that resolve orbital-specific electronic behavior could test the proposed selective localization and delocalization. Comparing the evolution of local moments and long-range order across the superconducting boundary would further clarify how these states coexist.", "future_zh": "进一步开展能够分辨轨道特定电子行为的压力依赖测量，可检验所提出的选择性局域与离域机制。比较超导边界两侧局域磁矩与长程磁序的演变，将有助于阐明两种状态如何共存。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work combines complementary high-pressure probes and reports a clear magnetic-versus-local-moment decoupling relevant to superconductivity in an unusual iron-based system. The abstract supports a substantial, focused advance, but does not establish a broad enough conceptual or experimental reach to justify a higher tier.", "tier_reason_zh": "该研究结合多种高压探测手段，揭示了与一种特殊铁基体系超导相关的长程磁序和局域磁矩之间的明确脱耦。摘要显示其具有重要且聚焦的进展，但尚不足以支持更高层级所需的广泛概念或实验影响。"}, {"id": "arxiv-2610-40104", "arxiv_id": "2610.40104", "type": "arXiv", "journal": "arXiv:2610.40104", "journal_ref": "", "journal_doi": "", "title": "Continuous tuning of quantum critical behavior in hybrid Josephson junction arrays", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall", "cond-mat.supr-con"], "submitted_at": "2026-10-29T14:05:24Z", "updated_at": "2026-10-29T14:05:24Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "E. Fugl, L. L. Olsen, S. Sasmal, M. Efthymiou-Tsironi, G. Nagda, F. Krizek, L. Casparis, S. Vaitiekėnas", "corresponding": "", "url": "https://arxiv.org/abs/2610.40104v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "This work reports finite-temperature scaling of voltage-driven quantum phase transitions in hybrid Josephson junction arrays, where dual gates independently tune interisland coupling and proximity-induced superconductivity. The critical resistivity and scaling exponent change continuously with electrostatic tuning across superconducting, insulating, and metallic transport regimes.", "summary": "We report finite-temperature scaling of voltage-driven quantum phase transitions in hybrid Josephson junction arrays. A dual-gate geometry separately tunes interisland coupling and proximity-induced superconductivity, providing access to superconducting, insulating, and metallic transport regimes. The critical resistivity and scaling exponent evolve continuously with electrostatic tuning. Where th", "abstract": "We report finite-temperature scaling of voltage-driven quantum phase transitions in hybrid Josephson junction arrays. A dual-gate geometry separately tunes interisland coupling and proximity-induced superconductivity, providing access to superconducting, insulating, and metallic transport regimes. The critical resistivity and scaling exponent evolve continuously with electrostatic tuning. Where the three regimes converge, the critical resistivity approaches $h/4e^2$, consistent with the self-dual limit, while the scaling exponent approaches the quantum-percolation estimate. Tuning toward stronger insulating behavior raises the critical resistivity and shifts the scaling exponent toward the classical-percolation value, while both parameters decrease toward the metallic regime. These results connect scaling regimes previously reported in different two-dimensional superconducting systems through continuous electrostatic control.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "Electrostatic tuning continuously connects distinct scaling regimes, with the critical resistivity and exponent evolving between values associated with self-dual, quantum-percolation, and classical-percolation limits.", "ai_in_scope": true, "relevance_reason": "It experimentally maps tunable quantum-critical scaling across superconducting, insulating, and metallic regimes in a two-dimensional Josephson-junction array.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "该研究报告了混合约瑟夫森结阵列中电压驱动量子相变的有限温度标度行为，其中双栅可分别调节岛间耦合和邻近诱导超导性。随着静电调控，临界电阻率和标度指数在超导、绝缘和金属输运区间之间连续变化。", "method_en": "The authors use a dual-gate geometry to tune interisland coupling and proximity-induced superconductivity separately, and analyze finite-temperature scaling across voltage-driven transitions. They compare the critical resistivity and scaling exponent as the system is tuned among superconducting, insulating, and metallic regimes.", "method_zh": "作者采用双栅几何结构，分别调节岛间耦合和邻近诱导超导性，并分析电压驱动相变的有限温度标度行为。他们比较系统在超导、绝缘和金属区间调控时的临界电阻率与标度指数。", "result_en": "The critical resistivity and scaling exponent evolve continuously with electrostatic tuning. Where the three transport regimes converge, the critical resistivity approaches h/4e² and the exponent approaches the quantum-percolation estimate; toward stronger insulating behavior the critical resistivity rises and the exponent shifts toward the classical-percolation value, while both decrease toward the metallic regime. The results connect scaling regimes previously reported in different two-dimensional superconducting systems through continuous electrostatic control.", "result_zh": "临界电阻率和标度指数随静电调控连续演化。在三种输运区间汇聚处，临界电阻率趋近 h/4e²，标度指数趋近量子渗流估计值；向更强绝缘行为调控时，临界电阻率升高、指数向经典渗流值移动，而向金属区调控时两者均下降。研究通过连续静电调控，将此前在不同二维超导系统中报告的标度区间联系起来。", "future_en": "A natural follow-up is to examine whether the reported continuous evolution and the associated percolation estimates persist across other gate settings or hybrid-array realizations. The abstract presents electrostatic tuning as a means of connecting scaling regimes, but does not report such broader tests.", "future_zh": "一个自然的后续方向是考察所报告的连续演化及相关渗流估计是否在其他栅压设置或混合阵列实现中仍然成立。摘要将静电调控作为联系不同标度区间的手段，但未报告这类更广泛的检验。", "tier": "PRL", "tier_reason_en": "The work reports experimentally accessible continuous tuning across superconducting, insulating, and metallic regimes, with quantitative connections to self-duality and percolation estimates. The abstract supports a strong condensed-matter result, while offering limited detail on the range of devices or independent validation.", "tier_reason_zh": "该工作报告了可实验调控的超导、绝缘和金属区间间连续演化，并定量联系自对偶极限与渗流估计。摘要支持其作为一项有力的凝聚态物理成果，但对器件范围或独立验证提供的信息有限。"}, {"id": "arxiv-2610-38421", "arxiv_id": "2610.38421", "type": "arXiv", "journal": "arXiv:2610.38421", "journal_ref": "", "journal_doi": "", "title": "Direct real-space imaging of sign-reversal superconducting state by scanning Josephson tunneling", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.mes-hall", "cond-mat.mtrl-sci", "cond-mat.str-el", "cond-mat.supr-con"], "submitted_at": "2026-10-28T08:07:10Z", "updated_at": "2026-10-28T08:07:10Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Tianheng Wei, Yanzhao Liu, Wei Ren, Zhen Liang, Ziqiang Wang, Jian Wang", "corresponding": "", "url": "https://arxiv.org/abs/2610.38421v1", "topic": "Superconductivity", "level": "Feature", "summary_en": "Using scanning Josephson tunneling microscopy, this study images sub-unit-cell Josephson-tunneling modulations in monolayer Fe(Te,Se) on SrTiO₃. The observed pattern, together with a full superconducting gap in single-particle spectra, is reported to be consistent with nodeless sign-reversal d-wave pairing.", "summary": "Phase-sensitive experiments based on Josephson tunneling have been considered as a pivotal method to determine the pairing symmetry in high-temperature (high-Tc) cuprate superconductors. However, in iron-based superconductors, traditional phase-sensitive experiments face setbacks because of the complexity of pairing symmetry in multiband systems. Here, using scanning Josephson tunneling microscopy", "abstract": "Phase-sensitive experiments based on Josephson tunneling have been considered as a pivotal method to determine the pairing symmetry in high-temperature (high-Tc) cuprate superconductors. However, in iron-based superconductors, traditional phase-sensitive experiments face setbacks because of the complexity of pairing symmetry in multiband systems. Here, using scanning Josephson tunneling microscopy (SJTM), we report the half-unit-cell periodic Josephson tunneling modulations in monolayer high-Tc Fe(Te,Se) film epitaxially grown on SrTiO3(001). The Josephson tunneling almost vanishes along the lines connecting next-nearest-neighbor Fe atoms under an s-wave superconducting tip. Combined with single-particle tunneling spectra showing the full superconducting gap, our experimental results are consistent with the sign-reversal nodeless d-wave pairing symmetry. Our findings provide sub-unit-cell scale superconducting phase information for understanding the mechanism of high-Tc superconductivity. We anticipate our work as a starting point for atomically resolved Josephson interference experiments using SJTM in various unconventional superconductors.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "In monolayer Fe(Te,Se), half-unit-cell Josephson-tunneling modulations and near-vanishing tunneling along specific atomic directions provide real-space evidence consistent with nodeless sign-reversal d-wave pairing.", "ai_in_scope": true, "relevance_reason": "This is a phase-sensitive experiment on an unconventional superconductor that provides sub-unit-cell evidence consistent with sign-reversing pairing.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": true, "summary_zh": "本文利用扫描约瑟夫森隧道显微术，对 SrTiO₃ 上单层 Fe(Te,Se) 中小于晶胞尺度的约瑟夫森隧穿调制进行成像。观察到的图样与单粒子谱中的完整超导能隙相结合，被认为与无节点、变号的 d 波配对相一致。", "method_en": "The authors use scanning Josephson tunneling microscopy with an s-wave superconducting tip to map local Josephson tunneling in the monolayer film. They compare these measurements with single-particle tunneling spectra to assess the pairing-state signatures.", "method_zh": "作者使用配备 s 波超导针尖的扫描约瑟夫森隧道显微术，绘制单层薄膜中的局域约瑟夫森隧穿图。研究将这些测量与单粒子隧道谱进行比较，以评估配对态特征。", "result_en": "The Josephson tunneling signal shows half-unit-cell-period modulations and almost vanishes along lines connecting next-nearest-neighbor Fe atoms. Together with the full superconducting gap in single-particle tunneling spectra, this pattern is consistent with nodeless d-wave pairing with a sign reversal. The authors present the measurements as sub-unit-cell-scale information about the superconducting phase in an iron-based superconductor.", "result_zh": "约瑟夫森隧穿信号呈现半晶胞周期调制，并在连接次近邻 Fe 原子的直线上几乎消失。结合单粒子隧道谱中观察到的完整超导能隙，这一图样与具有变号特征的无节点 d 波配对相一致。作者将这些测量视为铁基超导体中亚晶胞尺度超导相信息的获取。", "future_en": "The authors propose that this work can motivate atomically resolved Josephson-interference experiments in other unconventional superconductors. Such measurements could test how broadly the imaging approach distinguishes candidate pairing symmetries.", "future_zh": "作者提出，该工作可推动在其他非常规超导体中开展原子分辨约瑟夫森干涉实验。此类测量可检验这种成像方法区分候选配对对称性的适用范围。", "tier": "Nature Physics/Nature Materials", "tier_reason_en": "Sub-unit-cell real-space Josephson imaging that bears on the pairing symmetry of an iron-based superconductor is a potentially high-impact experimental advance. The abstract reports evidence consistent with, rather than an unambiguous determination of, a pairing state, so the assessment is strong but does not place the work in the very highest tier.", "tier_reason_zh": "对铁基超导体开展亚晶胞尺度实空间约瑟夫森成像，并由此探讨配对对称性，是具有潜在高影响力的实验进展。摘要报告的证据与某种配对态相一致，而非对其作出无歧义判定，因此评价较高，但未列入最高层级。"}, {"id": "arxiv-2610-39978", "arxiv_id": "2610.39978", "type": "arXiv", "journal": "arXiv:2610.39978", "journal_ref": "", "journal_doi": "", "title": "Electronic liquid crystals and superconductivity from doping a moiré Mott insulator", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.str-el", "cond-mat.supr-con"], "submitted_at": "2026-10-29T13:07:04Z", "updated_at": "2026-10-29T13:07:04Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Yichi Zhang, Yiyu Xia, Zhongdong Han, Jekwan Lee, Brandon Bauer, Kenji Watanabe, Takashi Taniguchi, Wenjin Zhao, Kin Fai Mak, Jie Shan", "corresponding": "", "url": "https://arxiv.org/abs/2610.39978v1", "topic": "Superconductivity", "level": "Feature", "summary_en": "The authors report stripe phases and a stripe-to-superconductor quantum phase transition in twisted bilayer WSe₂, a moiré platform near a Mott insulator. Their transport observations connect stripe ordering, Fermi-surface reconstruction, and superconductivity.", "summary": "Electronic liquid crystals, such as stripe phases and nematics, are self-organized states of matter with spontaneously broken rotational symmetry. They are expected to emerge in a doped Mott insulator as a compromise between short- and long-range Coulomb interactions, and are believed to be intimately connected to the emergence of high temperature superconductivity either as a competing order or a", "abstract": "Electronic liquid crystals, such as stripe phases and nematics, are self-organized states of matter with spontaneously broken rotational symmetry. They are expected to emerge in a doped Mott insulator as a compromise between short- and long-range Coulomb interactions, and are believed to be intimately connected to the emergence of high temperature superconductivity either as a competing order or an intertwined order. Moiré semiconductors provide a controllable platform to explore the relationship between stripe phases and superconductivity near a Mott insulator. Here we report the generic appearance of stripe phases in a doped moiré Mott insulator and the observation of a stripe to-superconductor quantum phase transition in twisted bilayer WSe2. The stripe phases were revealed by electrical transport studies as a thermodynamic phase transition from a high temperature isotropic phase to a low-temperature anisotropic phase accompanied by a Fermi surface reconstruction. Near the stripe-to-superconductor transition, we also observed an additional thermodynamic phase transition from metallic stripes to pinned insulating stripes. The stripe-to-superconductor transition further exhibits an intriguing self-similarity that highlights the intimate relationship between the two orders. Our results pave the path for studying intertwined orders in moiré materials.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "Twisted bilayer WSe2 exhibits stripe phases with Fermi-surface reconstruction, a transition from metallic to pinned insulating stripes, and a stripe-to-superconductor transition with reported self-similarity.", "ai_in_scope": true, "relevance_reason": "Transport and thermodynamic measurements establish stripe order and its transitions with superconductivity in a doped moiré Mott insulator, directly advancing understanding of competing and intertwined electronic orders.", "relevance_method": "semantic", "relevance_score": 88, "feature_candidate": true, "summary_zh": "作者在接近莫特绝缘体的莫尔平台——扭转双层 WSe₂——中报告了条纹相及条纹相到超导态的量子相变。输运观测将条纹有序、费米面重构与超导联系起来。", "method_en": "The study uses electrical transport to identify phase transitions and characterize the stripe and superconducting regimes. It tracks anisotropy and Fermi-surface reconstruction, including an additional transition near the stripe-to-superconductor boundary.", "method_zh": "研究通过电输运识别相变并表征条纹相与超导区间。作者追踪各向异性和费米面重构，并考察条纹相向超导转变附近出现的另一相变。", "result_en": "Stripe phases appear generically in the doped moiré Mott insulator. Transport reveals a thermodynamic transition from a high-temperature isotropic phase to a low-temperature anisotropic stripe phase, accompanied by Fermi-surface reconstruction. Near the stripe-to-superconductor transition, an additional thermodynamic transition separates metallic stripes from pinned insulating stripes. The stripe-to-superconductor transition also exhibits self-similarity, which the authors identify as a feature of the relationship between the two orders.", "result_zh": "在掺杂的莫尔莫特绝缘体中，条纹相普遍出现。输运测量揭示了从高温各向同性相到低温各向异性条纹相的热力学相变，并伴随费米面重构。在条纹相到超导态转变附近，还出现一个区分金属条纹与钉扎绝缘条纹的额外热力学相变。条纹相到超导态的转变还呈现自相似性，作者认为这体现了两种有序之间的关联。", "future_en": "Measurements that resolve the evolution of stripe correlations and superconductivity across the transition could clarify the reported self-similarity and the relationship between the two orders. Testing this behavior across other moiré Mott systems would assess how general the observed phase sequence is.", "future_zh": "在相变过程中分辨条纹关联与超导演变的测量，可进一步阐明所报告的自相似性及两种有序之间的关系。在其他莫尔莫特体系中检验这一行为，则有助于判断所观察到的相序是否具有普遍性。", "tier": "PRL", "tier_reason_en": "The work reports a thermodynamic stripe-to-superconductor transition in a tunable moiré Mott system, along with Fermi-surface reconstruction and a further stripe transition. These findings are conceptually significant and well suited to a high-impact physics letter, while the abstract alone does not establish the broader reach needed for a higher tier.", "tier_reason_zh": "该研究在可调控的莫尔莫特体系中报告了条纹相到超导态的热力学相变，并观察到费米面重构及另一条纹相变。这些发现具有重要概念意义，适合高影响力物理学快报；但仅依据摘要，尚不足以确认更高层级所要求的更广泛影响。"}, {"id": "arxiv-2610-37781", "arxiv_id": "2610.37781", "type": "arXiv", "journal": "arXiv:2610.37781", "journal_ref": "", "journal_doi": "", "title": "Evidence for a charged vortex lattice in an exciton superfluid", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mes-hall", "cond-mat.str-el"], "submitted_at": "2026-10-27T18:02:45Z", "updated_at": "2026-10-27T18:02:45Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Ryan L. Lee, Jungwoo Lee, Viliam Vaňo, Bo Zou, Cheng-Li Chiu, Kenji Watanabe, Takashi Taniguchi, Allan MacDonald, Ali Yazdani", "corresponding": "", "url": "https://arxiv.org/abs/2610.37781v1", "topic": "Superconductivity", "level": "Feature", "summary_en": "This work reports evidence for a charged vortex lattice in a bilayer exciton condensate, a predicted state in which fractionally charged vortex cores stabilize a vortex–antivortex lattice in a magnetic field. Scanning tunnelling microscopy reveals that the lattice periodicity scales with total excess charge and is insensitive to how that charge is distributed between the layers, in quantitative agreement with theory.", "summary": "Lattices of quantized vortices are a defining property of rotating superfluids and of type-II superconductors in magnetic fields. Realizing an analogous vortex lattice in an exciton superfluid-formed from bound electron-hole pairs-has remained challenging because excitons are electrically neutral. Building on previous theoretical studies of the low-energy excitations in an exciton superfluid, rece", "abstract": "Lattices of quantized vortices are a defining property of rotating superfluids and of type-II superconductors in magnetic fields. Realizing an analogous vortex lattice in an exciton superfluid-formed from bound electron-hole pairs-has remained challenging because excitons are electrically neutral. Building on previous theoretical studies of the low-energy excitations in an exciton superfluid, recent theory has predicted that in a strong magnetic field, a weakly charged exciton superfluid can stabilize a vortex-antivortex lattice arising from the mutual repulsion of fractionally charged vortex cores. Here we report evidence for this predicted vortex lattice in a bilayer exciton condensate by imaging its charged vortices with the scanning tunnelling microscope. The condensate forms between Landau levels of two graphene layers separated by a thin hexagonal boron nitride barrier in a perpendicular magnetic field. We find that the vortex lattice periodicity scales with the total excess charge and is insensitive to its distribution between the two layers, in quantitative agreement with theoretical predictions. Our observations provide evidence for phase coherence in an exciton superfluid system.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "STM imaging reveals charged vortices whose lattice periodicity scales with total excess charge and is insensitive to how that charge is distributed between the layers, consistent with the predicted vortex lattice and exciton-superfluid phase coherence.", "ai_in_scope": true, "relevance_reason": "The study reports experimental evidence for a predicted vortex lattice in a graphene bilayer exciton condensate, a distinctive collective state of quantum matter.", "relevance_method": "semantic", "relevance_score": 88, "feature_candidate": true, "summary_zh": "本研究报告了双层激子凝聚体中带电涡旋晶格的证据；理论预测，在磁场中，分数电荷涡旋芯可稳定涡旋—反涡旋晶格。扫描隧道显微镜显示，晶格周期随总过量电荷变化，且不受电荷在两层间分配方式的影响，这与理论定量符合。", "method_en": "The authors study an exciton condensate formed between Landau levels in two graphene layers separated by a thin hexagonal boron nitride barrier, in a perpendicular magnetic field. They use scanning tunnelling microscopy to image charged vortices and compare the observed lattice periodicity with its dependence on total excess charge and interlayer charge distribution.", "method_zh": "作者研究垂直磁场下、由薄六方氮化硼势垒隔开的两个石墨烯层之间朗道能级形成的激子凝聚体。研究使用扫描隧道显微镜成像带电涡旋，并将观测到的晶格周期与其对总过量电荷及层间电荷分布的依赖关系进行比较。", "result_en": "The measurements provide evidence for a vortex lattice in the bilayer exciton condensate. Its periodicity scales with the total excess charge, while remaining insensitive to how that charge is distributed between the two layers. Both trends are in quantitative agreement with theoretical predictions for the charged vortex lattice. The observations support phase coherence in this exciton-superfluid system.", "result_zh": "测量结果为双层激子凝聚体中的涡旋晶格提供了证据。其周期随总过量电荷变化，同时对电荷在两层间的分布方式不敏感。这两种趋势均与带电涡旋晶格的理论预测定量符合。观测结果支持该激子超流系统具有相位相干性。", "future_en": "Further measurements could map the vortex-lattice periodicity over a broader range of magnetic fields and excess charge, testing the predicted scaling beyond the reported conditions. Complementary probes of phase coherence could also help distinguish the condensate response from other sources of charged spatial structure.", "future_zh": "后续测量可在更广的磁场和过量电荷范围内绘制涡旋晶格周期图，以检验所报告条件之外的理论标度关系。结合其他相位相干性探测手段，也有助于区分凝聚态响应与其他带电空间结构来源。", "tier": "Nature Physics/Nature Materials", "tier_reason_en": "The abstract describes direct imaging of a predicted, previously challenging exciton-superfluid state and reports quantitative agreement with its distinctive charge-dependence predictions. This combination of a clear physical advance and a direct experimental signature supports a high-tier physics assessment.", "tier_reason_zh": "摘要描述了对一种此前难以实现、由理论预测的激子超流态进行直接成像，并报告了与其独特电荷依赖预测的定量符合。明确的物理进展与直接实验特征相结合，支持将其评为高水平物理学工作。"}, {"id": "arxiv-2610-39979", "arxiv_id": "2610.39979", "type": "arXiv", "journal": "arXiv:2610.39979", "journal_ref": "", "journal_doi": "", "title": "Evidence for an effective gauge field in flakes of superconducting 4Hb-TaS2", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.supr-con"], "submitted_at": "2026-10-29T13:08:12Z", "updated_at": "2026-10-29T13:08:12Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Shalev Gur, T. R. Devidas, Eylon Persky, Roni Anna Gofman, Irena Feldman, Avior Almoalem, Sudip Kumar Saha, Mark H. Fischer, Avraham Klein, Jonathan Ruhman, Amit Kanigel, Beena Kalisky", "corresponding": "", "url": "https://arxiv.org/abs/2610.39979v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "The study finds that magnetic memory in exfoliated 4Hb-TaS₂ persists in the vortex-free Meissner regime as a stable remanent change in the superconducting screening response. The zero-field flux profile is inconsistent with conventional weak magnetism, which the authors interpret as evidence for a hidden electronic phase imprinting an effective flux on the condensate.", "summary": "Understanding the normal state of unconventional superconductors is central to uncovering the origin of superconductivity itself. Unconventional superconductivity often emerges from correlated electronic states characterized by intertwined symmetry-breaking orders. A striking example is 4Hb-TaS2, whose superconducting state exhibits a remarkable range of phenomena, including an unusual magnetic me", "abstract": "Understanding the normal state of unconventional superconductors is central to uncovering the origin of superconductivity itself. Unconventional superconductivity often emerges from correlated electronic states characterized by intertwined symmetry-breaking orders. A striking example is 4Hb-TaS2, whose superconducting state exhibits a remarkable range of phenomena, including an unusual magnetic memory effect. Previous experiments showed that magnetic memory can be encoded above Tc and later revealed through spontaneous vortices below Tc, suggesting time-reversal symmetry breaking. However, since memory and vorticity are intertwined, this prevents establishing whether the effect results from trapped flux, weak conventional magnetism, or a true hidden electronic order. Here, we show that magnetic memory persists in the vortex-free Meissner regime of exfoliated 4Hb-TaS2 flakes, where it appears as a stable remanent modification of the superconducting screening response. Our results rule out explanations based on trapped vortices. Furthermore, the spatial profile of the flux generated by trained samples at zero field is inconsistent with conventional weak magnetism, suggesting a hidden electronic phase that imprints an effective flux on the superconducting condensate.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "Magnetic memory persists in vortex-free Meissner-state flakes of 4Hb-TaS2; the zero-field flux profile is inconsistent with conventional weak magnetism and suggests hidden electronic order that imprints an effective flux on the condensate.", "ai_in_scope": true, "relevance_reason": "The measurements probe a hidden electronic phenomenon in an unconventional superconductor and distinguish it from trapped vortices and conventional weak magnetism.", "relevance_method": "semantic", "relevance_score": 83, "feature_candidate": false, "summary_zh": "该研究发现，剥离的 4Hb-TaS₂ 在无涡旋的迈斯纳态中仍保留磁记忆，表现为超导屏蔽响应的稳定剩余变化。零场下的磁通空间分布与常规弱磁性不符；作者据此认为，结果支持一种向凝聚态施加有效磁通印记的隐藏电子相。", "method_en": "The authors examine magnetic memory in exfoliated 4Hb-TaS₂ flakes in the vortex-free Meissner regime. They measure the remanent change in superconducting screening and analyze the spatial profile of flux generated at zero field after magnetic training.", "method_zh": "作者在剥离的 4Hb-TaS₂ 薄片中研究无涡旋迈斯纳态下的磁记忆。他们测量超导屏蔽响应的剩余变化，并分析磁场训练后零场下产生的磁通空间分布。", "result_en": "Magnetic memory persists in the vortex-free Meissner regime, ruling out trapped vortices as the explanation for the observed effect. The spatial profile of the zero-field flux is reported to be inconsistent with conventional weak magnetism, supporting the authors’ interpretation that a hidden electronic phase imprints an effective flux on the superconducting condensate.", "result_zh": "磁记忆在无涡旋的迈斯纳态中仍然存在，因此观测到的效应不能用被困涡旋解释。作者报告，零场磁通的空间分布与常规弱磁性不符，并据此支持其解释：隐藏电子相向超导凝聚态施加了有效磁通印记。", "future_en": "Further measurements that characterize the proposed hidden phase and distinguish it from other possible sources of remanent screening changes would help establish the interpretation.", "future_zh": "未来若能进一步表征所提出的隐藏相，并将其与其他可能造成屏蔽响应剩余变化的来源区分开来，将有助于确立这一解释。", "tier": "PRL", "tier_reason_en": "Demonstrating magnetic memory in a vortex-free superconducting regime directly addresses whether the effect requires trapped flux and provides evidence for a hidden electronic state in an unconventional superconductor; the interpretation remains suggestive rather than definitive in the abstract.", "tier_reason_zh": "在无涡旋超导态中展示磁记忆，直接回应了该效应是否需要被困磁通这一问题，并为非常规超导体中的隐藏电子态提供证据；不过，摘要中的解释仍属支持性证据，尚非定论。"}, {"id": "arxiv-2610-38025", "arxiv_id": "2610.38025", "type": "arXiv", "journal": "arXiv:2610.38025", "journal_ref": "", "journal_doi": "", "title": "From a Lifshitz Transition to Spin-Density-Wave Order: Sr$_2$RuO$_4$ under Uniaxial Strain", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-27T22:21:56Z", "updated_at": "2026-10-27T22:21:56Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Evgeny A. Stepanov, Sophie Beck, Maria Chatzieleftheriou, Antoine Georges", "corresponding": "", "url": "https://arxiv.org/abs/2610.38025v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "The authors study uniaxially strained Sr₂RuO₄ and find that an anisotropic Lifshitz transition is associated with direction-dependent scattering and Fermi-liquid coherence. Accounting for this anisotropy allows their analysis to capture a finite-temperature magnetic ordered state at large strain, with competing magnetic wave vectors tied to different Fermi-surface nesting features.", "summary": "In recent years, the effects of uniaxial strain on Sr$_2$RuO$_4$ have been extensively investigated, revealing a pronounced enhancement of the superconducting critical temperature accompanied by experimental indications of an emergent magnetically ordered state. In this Letter, we study the impact of strain on the spectral and magnetic properties of this material within an advanced many-body theor", "abstract": "In recent years, the effects of uniaxial strain on Sr$_2$RuO$_4$ have been extensively investigated, revealing a pronounced enhancement of the superconducting critical temperature accompanied by experimental indications of an emergent magnetically ordered state. In this Letter, we study the impact of strain on the spectral and magnetic properties of this material within an advanced many-body theoretical framework. We find that strain induces an anisotropic Lifshitz transition, which enhances the electron scattering rate along the elongation axis while simultaneously promoting coherent Fermi-liquid behavior in the perpendicular direction, in close agreement with experimental observations. Taking into account this anisotropic behavior allows us to capture the magnetic instability leading to a finite-temperature ordered state at large strain values. Our analysis further reveals that the magnetic response is dominated by two competing wave vectors associated with distinct nesting vectors: one within the $γ$ sheet and the other between the $α$ and $β$ sheets of the Fermi surface. Both wave vectors can stabilize magnetic order, with their competition depending sensitively on the coherence of the respective Fermi surface sheets.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "The theory links an anisotropic strain-induced Lifshitz transition to direction-dependent quasiparticle coherence and predicts finite-temperature magnetic order at large strain, with competing instabilities at two distinct nesting wave vectors.", "ai_in_scope": true, "relevance_reason": "This is an original many-body theory study of strain-driven electronic and magnetic phenomena in the quantum material Sr$_2$RuO$_4$.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": false, "summary_zh": "作者研究单轴应变下的 Sr₂RuO₄，发现各向异性 Lifshitz 转变伴随着方向依赖的散射和费米液体相干性。将这种各向异性纳入分析后，他们得以描述大应变下的有限温度磁有序态；相关磁性由对应不同费米面嵌套特征的竞争波矢主导。", "method_en": "The study uses an advanced many-body theoretical framework to analyze strain-dependent spectral and magnetic properties. It incorporates the anisotropic electronic behavior associated with the Lifshitz transition when assessing magnetic instability and finite-temperature order.", "method_zh": "该研究采用先进的多体理论框架分析应变依赖的谱学与磁性。作者在评估磁不稳定性和有限温度有序时，纳入了 Lifshitz 转变所伴随的各向异性电子行为。", "result_en": "Strain induces an anisotropic Lifshitz transition: scattering is enhanced along the elongation axis, while more coherent Fermi-liquid behavior develops perpendicular to it, in agreement with the experimental observations described in the abstract. At large strain, the analysis finds a finite-temperature magnetic ordered state. Its response is dominated by two competing wave vectors, one associated with nesting within the γ sheet and the other with nesting between the α and β sheets; their competition depends sensitively on the coherence of those sheets.", "result_zh": "应变诱发各向异性 Lifshitz 转变：沿拉伸轴的散射增强，而垂直方向的费米液体行为更为相干，这与摘要所述实验观察相符。在大应变下，分析得到有限温度磁有序态。其磁响应由两个竞争波矢主导：一个对应 γ 费米面片内部的嵌套，另一个对应 α 与 β 费米面片之间的嵌套；二者的竞争对这些费米面片的相干性十分敏感。", "future_en": "Comparisons of the predicted strain-dependent magnetic wave vectors and ordering behavior with measurements across strain could test the proposed competition between the two nesting channels.", "future_zh": "可通过测量不同应变下的磁有序行为和磁波矢，与理论预测进行比较，以检验所提出的两种嵌套通道之间的竞争。", "tier": "PRL", "tier_reason_en": "The work connects an anisotropic Lifshitz transition to the experimentally relevant strain-induced magnetic state in a prominent superconducting material and identifies competing ordering wave vectors, making it a strong, focused result for a broad physics audience.", "tier_reason_zh": "该工作将各向异性 Lifshitz 转变与重要超导材料中具有实验相关性的应变诱导磁态联系起来，并识别出竞争的有序波矢，是一项面向广泛物理读者的有力且聚焦的成果。"}, {"id": "arxiv-2610-38449", "arxiv_id": "2610.38449", "type": "arXiv", "journal": "arXiv:2610.38449", "journal_ref": "", "journal_doi": "", "title": "Layer-Parity Control of the Superconducting Diode Effect in Monolayer NbSe$_2$", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.mes-hall", "cond-mat.supr-con"], "submitted_at": "2026-10-28T08:26:13Z", "updated_at": "2026-10-28T08:26:13Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Yusuf Wicaksono, Toshikaze Kariyado", "corresponding": "", "url": "https://arxiv.org/abs/2610.38449v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "This theoretical study shows that magnetic-proximity layer parity and orientation control helical and trigonal superconducting diode responses in monolayer NbSe₂. It predicts distinct effects on equilibrium pair momentum and diode efficiency, including suppression and low-temperature reversal of the response by an out-of-plane exchange component.", "summary": "The superconducting diode effect is often associated with finite-momentum pairing, although model studies indicate that rectification reflects the asymmetry of the free energy about its minimum rather than the equilibrium pair momentum itself. Using a Wannier-based, self-consistent finite-$\\mathbf Q$ Bogoliubov-de Gennes approach with a Fermi-surface-adaptive quadrature that converges the critical", "abstract": "The superconducting diode effect is often associated with finite-momentum pairing, although model studies indicate that rectification reflects the asymmetry of the free energy about its minimum rather than the equilibrium pair momentum itself. Using a Wannier-based, self-consistent finite-$\\mathbf Q$ Bogoliubov-de Gennes approach with a Fermi-surface-adaptive quadrature that converges the critical currents, we show that the layer parity and orientation of magnetic proximity select the diode response of monolayer NbSe$_2$. For in-plane exchange, the equilibrium pair momentum $\\mathbf Q_{\\rm eq}$ and the diode efficiency are both linear in the layer-odd exchange contrast: parallel proximity on the two Se sublayers is reciprocal, and antiparallel proximity doubles the response. An out-of-plane component separates the two observables. It leaves $\\mathbf Q_{\\rm eq}$ nearly unchanged but, through pair breaking, suppresses the efficiency by more than an order of magnitude and, at low temperature, reverses it. Purely out-of-plane exchange, for which $C_3$ symmetry forbids a helical term, keeps $\\mathbf Q_{\\rm eq}=0$ yet produces a trigonal diode effect, controlled by the layer-even exchange and larger than the in-plane one above $0.65$~meV at low temperature. Magnetic layer parity thus selects between a helical and a trigonal diode channel. The trigonal channel is an intrinsic, symmetry-allowed contribution to the field-free rectification reported in NbSe$_2$/CrBr$_3$ and predicts that two-sided out-of-plane proximity cancels it when antiparallel and, at the same exchange per layer, enhances it about fourfold when parallel, in the computed range.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Layer-odd in-plane exchange controls the helical diode response, while out-of-plane exchange enables a distinct trigonal diode channel even when the equilibrium pair momentum remains zero.", "ai_in_scope": true, "relevance_reason": "This develops a material-specific theory of superconducting rectification and predicts how magnetic proximity and layer parity select distinct diode mechanisms in monolayer NbSe₂.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "该理论研究表明，磁近邻效应的层奇偶性及方向可以调控单层 NbSe₂ 中的螺旋型与三角型超导二极管响应。研究预测，这些因素对平衡配对动量和二极管效率的影响不同；其中，面外交换分量会抑制二极管响应，并可在低温下使其反转。", "method_en": "The authors use a Wannier-based, self-consistent finite-Q Bogoliubov–de Gennes approach. A Fermi-surface-adaptive quadrature is employed to converge the calculated critical currents and assess the diode response for different exchange orientations and layer parities.", "method_zh": "作者采用基于 Wannier 函数的自洽有限 Q Bogoliubov–de Gennes 方法。研究使用适配费米面的数值积分以收敛临界电流，并考察不同交换方向和层奇偶性下的二极管响应。", "result_en": "For in-plane exchange, both the equilibrium pair momentum and diode efficiency are linear in the layer-odd exchange contrast: parallel proximity on the two Se sublayers gives no diode response, while antiparallel proximity doubles it. An out-of-plane component leaves the equilibrium momentum nearly unchanged but suppresses diode efficiency by more than an order of magnitude through pair breaking and reverses it at low temperature. Purely out-of-plane exchange yields zero equilibrium pair momentum but a trigonal diode effect; in the computed range, two-sided out-of-plane proximity is predicted to cancel this effect for antiparallel alignment and enhance it about fourfold for parallel alignment at the same exchange per layer.", "result_zh": "对于面内交换，平衡配对动量和二极管效率均随层奇交换对比度线性变化：两个 Se 子层的平行近邻耦合不产生二极管响应，而反平行耦合使响应加倍。面外交换分量几乎不改变平衡配对动量，却会通过破对效应使二极管效率降低一个数量级以上，并在低温下令其反转。纯面外交换产生零平衡配对动量，但仍可形成三角型二极管效应；在所计算的范围内，研究预测，两侧面外近邻耦合在反平行排列时会抵消该效应，而在每层交换强度相同的平行排列时会使其增强约四倍。", "future_en": "Experimental tests that vary the magnetic proximity orientation and layer alignment in NbSe₂-based heterostructures could distinguish the predicted helical and trigonal diode channels and check their predicted cancellation or enhancement.", "future_zh": "可在基于 NbSe₂ 的异质结构中调节磁近邻方向和层间排列，检验所预测的螺旋型与三角型二极管通道，并验证其抵消或增强的预期。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work provides a detailed, symmetry-informed computational account and quantitative predictions for diode responses in a specific material system, but the abstract describes theoretical results without experimental validation or a broader demonstrated application.", "tier_reason_zh": "该工作针对特定材料体系，给出了细致且基于对称性分析的计算说明和定量二极管响应预测；但摘要介绍的是理论结果，尚无实验验证或已展示的更广泛应用。"}, {"id": "arxiv-2610-38959", "arxiv_id": "2610.38959", "type": "arXiv", "journal": "arXiv:2610.38959", "journal_ref": "", "journal_doi": "", "title": "Separating the Density Wave Phase from Zero-Resistance Superconductivity in La$_4$Ni$_3$O$_{10}$", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.str-el", "cond-mat.supr-con"], "submitted_at": "2026-10-28T21:40:59Z", "updated_at": "2026-10-28T21:40:59Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "P. Puphal, A. Suthar, B. Wehinger, V. Sundaramurthy, T. Priessnitz, M. Knauft, P. Sosa-Lizama, Y. -M. Wu, M. Hepting, J. Nuss, M. Isobe, P. A. van Aken, Y. E. Suyolcu, B. Keimer, H. Takagi, P. Reiss", "corresponding": "", "url": "https://arxiv.org/abs/2610.38959v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "This study uses clean single crystals of trilayer La₄Ni₃O₁₀ to examine pressure-induced superconductivity and its relation to a low-pressure density-wave phase. It reports a zero-resistance state at a pressure 60% lower than in previous reports and separates that state from the density-wave phase.", "summary": "Identifying the key ingredients for superconductivity under pressure in the Ruddlesden-Popper nickelates remains a formidable challenge, due to a complex interplay between structural variations, oxygen content and location, electronically ordered phases, and the need for high pressures to reach the superconducting phase. To disentangle these complex inter-dependencies, here we study a series of cl", "abstract": "Identifying the key ingredients for superconductivity under pressure in the Ruddlesden-Popper nickelates remains a formidable challenge, due to a complex interplay between structural variations, oxygen content and location, electronically ordered phases, and the need for high pressures to reach the superconducting phase. To disentangle these complex inter-dependencies, here we study a series of clean single crystals of trilayer La$_4$Ni$_3$O$_{10}$. We discover that enhanced biaxial, compressive pressures induce a zero-resistance state at a 60\\% lower pressure compared to previous reports. At the same time, we completely separate the low-pressure density wave phase from superconductivity, effectively ruling out that soft, quantum critical fluctuations of the density wave order parameter act as the pairing glue in this system. Our results establish biaxial, in-plane pressures as a powerful tool for promoting superconductivity in nickelates, unifying the required pressure scales for superconductivity in different Ruddlesden-Popper structures, and providing a connection to the recently discovered thin film samples.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "In La₄Ni₃O₁₀, biaxial compression induces zero resistance at substantially lower pressure while separating superconductivity from the low-pressure density-wave phase, weighing against density-wave critical fluctuations as the pairing glue.", "ai_in_scope": true, "relevance_reason": "This is a substantial experimental study of nickelate superconductivity that separates the density-wave phase from the zero-resistance state under biaxial pressure.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": false, "summary_zh": "本文利用高质量三层 La₄Ni₃O₁₀ 单晶，研究压力诱导超导及其与低压密度波相的关系。研究报告了压力比以往报道低 60% 时出现的零电阻态，并将其与密度波相区分开来。", "method_en": "The authors study a series of clean trilayer La₄Ni₃O₁₀ single crystals under enhanced biaxial compressive pressure. They compare the pressure ranges of the density-wave phase and zero-resistance superconductivity.", "method_zh": "作者在增强的双轴压缩压力下研究一系列高质量三层 La₄Ni₃O₁₀ 单晶。研究比较了密度波相与零电阻超导态出现的压力区间。", "result_en": "Enhanced biaxial compressive pressure induces a zero-resistance state at a pressure 60% lower than reported previously. The low-pressure density-wave phase is completely separated from superconductivity in these crystals. The authors therefore argue against soft quantum-critical fluctuations of the density-wave order parameter as the pairing glue in this system. They further present biaxial in-plane pressure as a means of promoting superconductivity and connecting pressure scales across Ruddlesden–Popper structures and thin films.", "result_zh": "增强的双轴压缩压力使零电阻态在比以往报道低 60% 的压力下出现。在这些单晶中，低压密度波相与超导完全分离。因此，作者认为该体系中密度波序参量的软量子临界涨落并非配对胶水。作者还指出，面内双轴压力可用于促进超导，并可联系不同 Ruddlesden–Popper 结构与薄膜中的压力尺度。", "future_en": "Further experiments could determine how biaxial pressure and sample properties control the superconducting pressure scale across nickelate structures. Measurements that track density-wave and superconducting signatures together could further test the proposed separation and its implications for pairing.", "future_zh": "进一步实验可确定双轴压力与样品性质如何共同控制不同镍酸盐结构中的超导压力尺度。同步追踪密度波与超导特征的测量，可进一步检验所提出的相分离及其对配对机制的意义。", "tier": "PRL", "tier_reason_en": "The reported 60% reduction in the pressure for a zero-resistance state and the separation of superconductivity from the density-wave phase address central questions in pressure-induced nickelate superconductivity. This is a notable, focused advance; the abstract does not by itself establish the broader scope required for a higher tier.", "tier_reason_zh": "零电阻态所需压力降低 60%，以及超导与密度波相的分离，回应了压力诱导镍酸盐超导中的核心问题。这是一项重要且聚焦的进展；但仅凭摘要尚不足以证明其具备更高层级所要求的广泛影响。"}, {"id": "arxiv-2610-38528", "arxiv_id": "2610.38528", "type": "arXiv", "journal": "arXiv:2610.38528", "journal_ref": "", "journal_doi": "", "title": "Giant piezomagnetic response driven by spin reorientation in the topological Kagome magnet TbMn6Sn6", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci"], "submitted_at": "2026-10-28T09:37:18Z", "updated_at": "2026-10-28T09:37:18Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Hanyang Qian, Wen Sun, Juntao Huo, Guowei Li", "corresponding": "", "url": "https://arxiv.org/abs/2610.38528v1", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The authors report a large magnetostrictive response in the topological kagome magnet TbMn₆Sn₆ associated with field-induced spin reorientation below 310 K. At 240 K the response exceeds 120 ppm, with a differential piezomagnetic coefficient of approximately 5000 ppm T⁻¹.", "summary": "Achieving a large strain response to a small magnetic-field variation remains a challenge in magnetomechanical materials, particularly in topological systems where the coupling between spin reconstruction and lattice deformation remains unclear. Here, we report an anomalous magnetostrictive response associated with field-induced spin reorientation in the topological Kagome magnet TbMn6Sn6. Below i", "abstract": "Achieving a large strain response to a small magnetic-field variation remains a challenge in magnetomechanical materials, particularly in topological systems where the coupling between spin reconstruction and lattice deformation remains unclear. Here, we report an anomalous magnetostrictive response associated with field-induced spin reorientation in the topological Kagome magnet TbMn6Sn6. Below its spin-reorientation temperature of 310 K, an in-plane magnetic field induces an abrupt increase in magnetostriction, which exceeds 120 ppm at 240 K. This transition produces a giant differential piezomagnetic coefficient of approximately 5000 ppm T-1, far exceeding the values reported for other topological magnetic materials and commercial FeGa alloys, and placing TbMn6Sn6 among the most field-sensitive magnetostrictive materials. The field position of this peak agrees with the anomalies in magnetization and magnetotransport, demonstrating that the large differential response is tied to field-induced spin reorientation. Thermal expansion also changes across the spin-reorientation boundary. Raman measurements reveal corresponding anomalies in phonon energy and linewidth, indicating that the reorientation modifies the lattice dynamics. The combined results support a mechanism in which competing magnetic anisotropies of the Tb and Mn sublattices, coupled through Tb-Mn exchange, create magnetic configurations with different equilibrium strains. This finding establishes spin reorientation as a route to giant piezomagnetic responses in topological magnets and provides a basis for magnetomechanical sensing and switching near room temperature.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "Field-induced spin reorientation in TbMn6Sn6 produces giant differential piezomagnetism, with the response attributed to competing Tb and Mn anisotropies and exchange-mediated coupling to strain.", "ai_in_scope": true, "relevance_reason": "The experiments reveal a substantial spin-reorientation-linked magnetoelastic response in a kagome quantum magnet and connect it to magnetic and lattice changes.", "relevance_method": "semantic", "relevance_score": 77, "feature_candidate": false, "summary_zh": "作者报告了拓扑 kagome 磁体 TbMn₆Sn₆ 中与磁场诱导自旋重取向相关的大磁致伸缩响应，该效应出现在 310 K 以下。240 K 时响应超过 120 ppm，差分压磁系数约为 5000 ppm T⁻¹。", "method_en": "The study measures magnetostriction and relates its field dependence to magnetization and magnetotransport anomalies, while also examining thermal expansion. Raman measurements probe accompanying changes in phonon energy and linewidth.", "method_zh": "研究测量磁致伸缩，并将其随磁场的变化与磁化和磁输运异常联系起来，同时考察热膨胀。作者还通过 Raman 测量探测伴随的声子能量和线宽变化。", "result_en": "Below the 310 K spin-reorientation temperature, an in-plane field produces an abrupt magnetostriction increase exceeding 120 ppm at 240 K and a differential piezomagnetic coefficient of approximately 5000 ppm T⁻¹. The peak field agrees with anomalies in magnetization and magnetotransport, while thermal-expansion and Raman anomalies accompany the reorientation. The authors attribute the response to competing Tb and Mn magnetic anisotropies coupled through Tb–Mn exchange, which give magnetic configurations with different equilibrium strains. They present spin reorientation as a route to large piezomagnetic response and note potential relevance to sensing and switching near room temperature.", "result_zh": "在 310 K 的自旋重取向温度以下，面内磁场会引发突增的磁致伸缩；240 K 时该响应超过 120 ppm，差分压磁系数约为 5000 ppm T⁻¹。峰值所在磁场与磁化和磁输运异常一致，重取向同时伴随热膨胀及 Raman 异常。作者将该响应归因于 Tb 与 Mn 子晶格间相互竞争的磁各向异性及 Tb–Mn 交换耦合，这些因素使不同磁构型具有不同的平衡应变。研究提出自旋重取向是获得大压磁响应的一条途径，并指出其对近室温传感和开关应用的潜在价值。", "future_en": "A natural next step is to test whether the reported response can be used in magnetomechanical sensing or switching near room temperature, as proposed in the abstract. Further measurements could also clarify how the response varies across the spin-reorientation boundary.", "future_zh": "一个自然的后续方向是检验摘要所提出的近室温磁机械传感或开关应用是否可行。进一步测量还可厘清该响应在自旋重取向边界两侧如何变化。", "tier": "Nature Communications/Science Advances/PRX", "tier_reason_en": "The abstract reports an unusually large, quantitatively specified response in a topological magnet and connects it to spin reorientation using complementary magnetic, thermal, and Raman observations. The result is compelling as a materials discovery, although the abstract does not describe device demonstrations or a broader class of materials.", "tier_reason_zh": "摘要报告了拓扑磁体中幅值异常大且定量明确的响应，并通过互补的磁学、热学和 Raman 观测将其与自旋重取向联系起来。作为材料发现，该结果颇具吸引力；不过摘要未描述器件演示或更广泛的材料类别。"}, {"id": "arxiv-2610-38704", "arxiv_id": "2610.38704", "type": "arXiv", "journal": "arXiv:2610.38704", "journal_ref": "", "journal_doi": "", "title": "Gravitational anomaly spectroscopy of a Kitaev spin liquid", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mes-hall", "cond-mat.str-el", "quant-ph"], "submitted_at": "2026-10-28T19:04:51Z", "updated_at": "2026-10-28T19:04:51Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Kumar Ghosh", "corresponding": "", "url": "https://arxiv.org/abs/2610.38704v1", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The paper proposes extracting the chiral central charge of a topological edge from absorption weights under a traveling modulation of edge couplings, rather than relying on thermal transport or a pure ground-state probe. For the Kitaev honeycomb spin liquid, the reported estimates include c=0.49999 and conformal spin hσ=0.06250 on 7168 spins, with smaller-system and disorder tests also described.", "summary": "The chiral central charge $c$ measures the gravitational anomaly of a two-dimensional topological phase. It fixes the heat current carried along the edge. So far, it has been accessed through thermal transport, where phonons complicate the signal, or through wave-function probes that need a pure ground state. Here we show that $c$ is a spectroscopic quantity of the edge. A weak modulation of the e", "abstract": "The chiral central charge $c$ measures the gravitational anomaly of a two-dimensional topological phase. It fixes the heat current carried along the edge. So far, it has been accessed through thermal transport, where phonons complicate the signal, or through wave-function probes that need a pure ground state. Here we show that $c$ is a spectroscopic quantity of the edge. A weak modulation of the edge couplings that travel along the edge is absorbed according to the Virasoro algebra. Normalized by the response to a static change of the same couplings, the absorbed weights obey $D_n=2n\\langle L_0\\rangle+\\frac{c}{12}(n^3-n)$, so that $\\mathcal{C}\\equiv2D_2-4D_1=c$ in any state of the ideal edge theory, thermal or not. The central charge thus appears in transition weights, although it cancels from excitation gaps. The ratio of line weights with and without a vison in the bulk, $Λ=4h_σ/c$, needs no calibration and fixes the conformal spin $h_σ$ of the non-Abelian Ising anyon. For the Kitaev honeycomb spin liquid we find $\\mathcal{C}=0.49999$ and $h_σ=0.06250$ on 7168 spins. Calibrating with the shift of the measured line itself gives $c$ within about $1\\%$ on 96 spins and within $1\\%$ under $20\\%$ random coupling errors. Interacting edge Majoranas in a fixed flux sector, treated with DMRG, keep $\\mathcal{C}$ within $1.5\\%$ while the edge velocity changes by $\\pm13\\%$. An exact simulation of a quantum-processor protocol, including the native Floquet circuit, returns $c$ within $3.5\\%$ on 96 to 600 spins.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Edge transition-weight ratios reveal the chiral central charge and non-Abelian anyon conformal spin, with numerical tests showing robustness to finite size, coupling disorder, and edge interactions.", "ai_in_scope": true, "relevance_reason": "This is original theoretical work on a Kitaev quantum spin liquid that develops robust edge-spectroscopy measures of its topological properties.", "relevance_method": "semantic", "relevance_score": 84, "feature_candidate": false, "summary_zh": "该论文提出，通过沿边缘传播的耦合调制所产生的吸收权重提取拓扑边缘的手性中心荷，而不必依赖热输运或纯基态探测。对于 Kitaev 蜂窝自旋液体，作者在 7168 个自旋的系统上报告 c=0.49999、共形自旋 hσ=0.06250，并介绍了较小系统和无序条件下的检验。", "method_en": "The authors derive a relation between normalized absorption weights and Virasoro generators, yielding the central-charge estimator 𝒞=2D₂−4D₁ and a line-weight ratio for the conformal spin. They test the protocol in Kitaev-model calculations, with random coupling errors and interacting edge Majoranas, and simulate a quantum-processor implementation including its native Floquet circuit.", "method_zh": "作者推导归一化吸收权重与 Virasoro 生成元之间的关系，由此得到中心荷估计量 𝒞=2D₂−4D₁，以及用于求共形自旋的谱线权重比。他们通过 Kitaev 模型计算、随机耦合误差和相互作用边缘 Majorana 模式检验该方案，并模拟了包含原生 Floquet 电路的量子处理器实现。", "result_en": "For an ideal edge, the normalized absorption weights obey Dₙ=2n⟨L₀⟩+(c/12)(n³−n), so 𝒞 equals c in thermal and nonthermal states; the central charge appears in transition weights but cancels from excitation gaps. The vison-dependent line-weight ratio Λ=4hσ/c provides a calibration-free route to the conformal spin. In the Kitaev honeycomb spin liquid, the study reports 𝒞=0.49999 and hσ=0.06250 on 7168 spins. Calibration using the shift of the measured line yields c within about 1% on 96 spins and remains within 1% under 20% random coupling errors; interacting-edge calculations stay within 1.5% despite a ±13% edge-velocity change, while the simulated processor protocol returns c within 3.5% on 96–600 spins.", "result_zh": "对于理想边缘，归一化吸收权重满足 Dₙ=2n⟨L₀⟩+(c/12)(n³−n)，因此在热态和非热态中 𝒞 均等于 c；中心荷出现在跃迁权重中，却会从激发能隙中抵消。依赖体内 vison 的谱线权重比 Λ=4hσ/c 提供了无需校准的共形自旋测定方法。在 Kitaev 蜂窝自旋液体中，研究在 7168 个自旋的系统上得到 𝒞=0.49999 和 hσ=0.06250。利用实测谱线的位移进行校准后，96 个自旋系统中的 c 误差约在 1% 以内，且在 20% 随机耦合误差下仍在 1% 以内；相互作用边缘计算在边缘速度变化 ±13% 时保持在 1.5% 以内，模拟的量子处理器方案则在 96–600 个自旋的系统上将 c 的误差控制在 3.5% 以内。", "future_en": "A natural next step is to implement the proposed absorption-weight measurement experimentally and test its robustness beyond the simulated quantum-processor protocol. The reported disorder and interacting-edge tests also motivate applying the estimator to other topological edges and nonideal edge conditions.", "future_zh": "一个自然的后续方向是实验实现所提出的吸收权重测量，并检验其在模拟量子处理器方案之外的稳健性。研究中的无序和相互作用边缘检验也为将该估计方法用于其他拓扑边缘及非理想边缘条件提供了动机。", "tier": "Nature Physics/Nature Materials", "tier_reason_en": "The work presents a conceptually distinctive spectroscopic probe of a gravitational anomaly and supports it with extensive quantitative tests, including disorder, interactions, finite-size systems, and a quantum-processor protocol. This combination of a general method and unusually broad validation makes a high-tier physics placement plausible.", "tier_reason_zh": "该工作提出了概念上新颖的引力反常谱学探针，并通过大量定量检验支持该方法，涵盖无序、相互作用、有限尺寸系统和量子处理器方案。一般性方法与广泛验证的结合，使其具备冲击高水平物理期刊的潜力。"}, {"id": "arxiv-2610-39669", "arxiv_id": "2610.39669", "type": "arXiv", "journal": "arXiv:2610.39669", "journal_ref": "", "journal_doi": "", "title": "High-Field Heat Capacity of Atacamite Cu$_2$Cl(OH)$_3$ for $\\mathbf{H} \\parallel b$ axis: From Antiferromagnetic Order to Correlated Disorder", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.str-el"], "submitted_at": "2026-10-29T09:19:13Z", "updated_at": "2026-10-29T09:19:13Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "L. Stödter, A. Demuer, T. Kotte, A. U. B. Wolter, B. Büchner, K. C. Rule, S. Süllow", "corresponding": "", "url": "https://arxiv.org/abs/2610.39669v1", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The paper reports heat-capacity measurements on frustrated sawtooth-chain atacamite, Cu₂Cl(OH)₃, for a magnetic field parallel to the b axis, up to 35 T. The measurements trace a change from antiferromagnetic order to a high-field state without a sharp transition anomaly, with a broad anomaly appearing above 32 T.", "summary": "We present the heat capacity of the frustrated sawtooth-chain compound atacamite Cu$_2$Cl(OH)$_3$ in high magnetic fields up to 35 T for $\\mathbf{H} \\parallel b$ axis. We clearly observe the change from antiferromagnetic long-range order, indicated by a sharp transition anomaly shifted to lower temperatures when increasing field, to a field-induced spin-liquid-like state with the absence of any tr", "abstract": "We present the heat capacity of the frustrated sawtooth-chain compound atacamite Cu$_2$Cl(OH)$_3$ in high magnetic fields up to 35 T for $\\mathbf{H} \\parallel b$ axis. We clearly observe the change from antiferromagnetic long-range order, indicated by a sharp transition anomaly shifted to lower temperatures when increasing field, to a field-induced spin-liquid-like state with the absence of any transition anomaly. Here, in highest magnetic fields above 32 T a broad anomaly is present which is shifted to higher temperatures as the field is increased. The low-temperature heat capacity in the high-field region can be described well by an exponential behavior indicating a thermal activation over a spin gap. The findings are consistent with our scenario for the high-field state in atacamite for $\\mathbf{H} \\parallel c$ axis, where we proposed the sawtooth chains to decouple into two spin subsystems, basal and apical spin sites, leading to a partially polarized state with $M \\sim M_\\mathrm{sat}/2$.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "The heat capacity evolves from an antiferromagnetic transition to a high-field state without a transition anomaly, with a broad feature and thermally activated low-temperature behavior consistent with a spin gap.", "ai_in_scope": true, "relevance_reason": "High-field heat-capacity measurements reveal a field-induced disordered, gapped regime in a frustrated quantum magnet, directly advancing quantum-magnetism physics.", "relevance_method": "semantic", "relevance_score": 77, "feature_candidate": false, "summary_zh": "本文报告了锯齿链受挫化合物 atacamite（Cu₂Cl(OH)₃）在磁场平行于 b 轴、最高达 35 T 时的热容测量。测量显示体系从反铁磁有序转变为高场下无尖锐转变异常的状态，并在 32 T 以上出现宽异常。", "method_en": "The authors measure the heat capacity of Cu₂Cl(OH)₃ in magnetic fields up to 35 T with H parallel to the b axis. They examine the field and temperature dependence of the transition anomalies and low-temperature heat capacity.", "method_zh": "作者测量了磁场平行于 b 轴、最高达 35 T 时 Cu₂Cl(OH)₃ 的热容。研究了转变异常及低温热容随磁场和温度的变化。", "result_en": "The sharp anomaly associated with antiferromagnetic long-range order shifts to lower temperatures as the field increases, while the high-field state lacks a transition anomaly; above 32 T, a broad anomaly shifts to higher temperatures with increasing field. High-field low-temperature heat capacity follows an exponential form consistent with thermal activation across a spin gap, and the findings are consistent with a proposed partially polarized state near half the saturation magnetization, in which basal and apical spin subsystems decouple.", "result_zh": "与反铁磁长程有序相关的尖锐异常随磁场增强而移向低温；高场态则没有转变异常，而在 32 T 以上，宽异常随磁场增强移向高温。高场低温热容呈指数形式，符合跨越自旋能隙的热激活行为；结果也与先前提出的部分极化态相符，该态中基底位点和顶端位点的自旋子系统解耦，磁化强度约为饱和磁化强度的一半。", "future_en": "Further high-field measurements could clarify the origin of the broad anomaly above 32 T and test the proposed decoupling of basal and apical spin subsystems for H parallel to the b axis.", "future_zh": "后续高场测量可进一步厘清 32 T 以上宽异常的来源，并检验磁场平行于 b 轴时基底与顶端自旋子系统解耦的设想。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The study provides substantive high-field thermodynamic data on a frustrated magnet and connects them to a specific proposed state, but the abstract describes a focused, material-specific investigation rather than a broadly established new result.", "tier_reason_zh": "该研究为受挫磁体提供了有实质内容的高场热力学数据，并将其联系到一种具体的候选态；但摘要呈现的是聚焦于特定材料的研究，尚不足以体现已确立的广泛突破。"}, {"id": "arxiv-2610-37950", "arxiv_id": "2610.37950", "type": "arXiv", "journal": "arXiv:2610.37950", "journal_ref": "", "journal_doi": "", "title": "Few-Electron Partitioning in the Fractional Quantum Hall Regime", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall"], "submitted_at": "2026-10-27T20:36:32Z", "updated_at": "2026-10-27T20:36:32Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "T. Jonckheere, J. Rech, B. Grémaud", "corresponding": "", "url": "https://arxiv.org/abs/2610.37950v1", "topic": "Topology & Transport", "level": "Brief", "summary_en": "This study analyzes partition statistics for N-electron states at a fractional quantum Hall point contact, motivated by recent few-electron experiments. At the solvable point g=1/2, it gives nonperturbative current and noise formulas for arbitrary drives and shows that Lorentzian-pulse full counting statistics reduces to an N×N determinant.", "summary": "Motivated by few-electron partitioning experiments [Shaju et al., Nature 642, 928 (2025)], we study the partition statistics of $N$-electron states at a fractional quantum Hall point contact. At the solvable point $g=1/2$, we obtain nonperturbative current and noise formulas for arbitrary drives, while for Lorentzian pulses (Levitons) the full counting statistics reduces to an $N\\times N$ determin", "abstract": "Motivated by few-electron partitioning experiments [Shaju et al., Nature 642, 928 (2025)], we study the partition statistics of $N$-electron states at a fractional quantum Hall point contact. At the solvable point $g=1/2$, we obtain nonperturbative current and noise formulas for arbitrary drives, while for Lorentzian pulses (Levitons) the full counting statistics reduces to an $N\\times N$ determinant. We show that the charge is transferred solely in units of $e$, and that symmetrized cumulants for $N=2,3,4$ reveal strong antibunching and higher-order correlations, observable in a $(ν_1,ν_2)=(1,1/3)$ junction.", "method": "", "result": "", "future": "", "so
