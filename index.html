in lightly hole-doped cuprates.", "summary": "Poorly screened Coulomb interactions organize electronic textures in lightly hole-doped cuprates.", "abstract": "Motivated by recent experiments on Ca$_2$CuO$_2$Cl$_2$, we present a comprehensive study of the interplay between dopants and localized Zhang-Rice singlets in lightly hole-doped cuprates. Owing to the poorly screened Coulomb potential, the interactions between dopants and localized Zhang-Rice singlets favor asymmetric electronic configurations characterized by effective electric \"dipoles\". Using the MPS-based Lanczos method, we show that these localized holes give rise to in-gap bound states within the charge-transfer gap. When tunneling matrix-element effects are included, the bound states exhibit a characteristic $4a_0 \\times 2a_0$ internal structure, consistent with experimental observations. Our results suggest that Coulomb interactions between dopants and localized Zhang-Rice singlets, together with tunneling matrix-element effects, provide a microscopic mechanism for the observed $4a_0$ electronic structures.", "method": "", "result": "", "future": "", "summary_zh": "理论研究轻度空穴掺杂铜氧化物中库仑相互作用驱动的非均匀电子织构。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "The work explains experimentally observed 4a0 electronic structures in lightly hole-doped cuprates by identifying Coulomb-driven electric dipole 'textures' involving dopants and Zhang-Rice singlets, linking disorder, Coulomb interactions, a", "feature_candidate": true, "physics_advance": "Microscopic mechanism showing Coulomb interactions between dopants and localized Zhang-Rice singlets generate in-gap bound states with characteristic 4a0 electronic structure in lightly hole-doped cuprates", "ai_in_scope": true}, {"id": "arxiv-2610-30371", "arxiv_id": "2610.30371", "type": "arXiv", "journal": "arXiv:2610.30371", "journal_ref": "", "title": "Emergent altermagnetism in (LaVO$_3$)$_n$/(LaNiO$_3$)$_m$ superlattices from interfacial charge transfer and octahedral tilts", "authors": "Gustavo H. Cassemiro, Walber H. Brito", "corresponding": "", "url": "https://arxiv.org/abs/2610.30371", "topic": "Magnetism", "level": "Brief", "summary_en": "First-principles calculations predict interfacial-charge-transfer- and octahedral-tilt-induced altermagnetism in LaVO3/LaNiO3 superlattices.", "summary": "First-principles calculations predict interfacial-charge-transfer- and octahedral-tilt-induced altermagnetism in LaVO3/LaNiO3 superlattices.", "abstract": "Using first-principles calculations, we show that altermagnetism emerges in (LaVO$_3$)$_n$/(LaNiO$_3$)$_m$ superlattices, with $(n,m) = (1,1), (2,2)$ and $(2,4)$, from the interplay of interfacial charge transfer and octahedral tilts. Charge transfer drives the system towards the V$^{4+}$ and Ni$^{2+}$ configuration, turning the otherwise paramagnetic nickelate layers into a magnetically active sublattice. The resulting $C$-type antiferromagnetic order, combined with $a^-b^+c^-$ or $a^-b^-c^-$ octahedral tilts, links opposite-spin sublattices only through nonsymmorphic operations, yielding a $d$-wave spin splitting without spin-orbit coupling. Within DFT+U, the splitting reaches 118 meV in the insulating (LVO)$_1$/(LNO)$_1$ superlattice, about twice that calculated for bulk LaVO$_3$, and decreases as the nickelate layers become thicker. Our findings indicate that this splitting is hosted by both the V and Ni sublattices, with nearly half of its weight on oxygen $2p$ states through $p$-$d$ covalency. Interfacial charge transfer thus emerges as a \\textit{design} principle for engineering altermagnetism in oxide heterostructures.", "method": "", "result": "", "future": "", "summary_zh": "第一性原理计算表明 LaVO₃/LaNiO₃ 超晶格的界面电荷转移与八面体倾斜可诱导交替磁性。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "Using first-principles calculations, this work identifies a new mechanism for altermagnetism arising from interfacial charge transfer and structural distortions in oxide superlattices, establishing a concrete design principle for spin-split", "feature_candidate": true, "physics_advance": "Prediction of altermagnetism driven by interfacial charge transfer and octahedral tilts in layered oxide superlattices, leading to d-wave spin splitting without spin-orbit coupling", "ai_in_scope": true}, {"id": "arxiv-2610-30733", "arxiv_id": "2610.30733", "type": "arXiv", "journal": "arXiv:2610.30733", "journal_ref": "", "title": "Ferroelastic Reversal Magnon Thermal Hall Effect in a Fully Compensated Ferrimagnet", "authors": "Yingxi Bai, Zihan Chen, Chengwang Niu, Ming Yang", "corresponding": "", "url": "https://arxiv.org/abs/2610.30733", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Ferroelastic switching is predicted to reversibly control magnon thermal Hall response in fully compensated ferrimagnets.", "summary": "Ferroelastic switching is predicted to reversibly control magnon thermal Hall response in fully compensated ferrimagnets.", "abstract": "Magnons offer a charge-neutral channel for spin and heat transport, yet reversible and nonvolatile control of their thermal Hall response poses a fundamental challenge in systems with zero net magnetization. Here, we establish ferroelastic switching as an effective route to manipulate magnonic transverse responses in fully compensated ferrimagnets. A minimal Heisenberg-Dzyaloshinskii-Moriya model reveals that ferroelastic switching can re-orientate the lattice anisotropy, which reconstructs the chirality-resolved magnon bands and Berry curvature distribution. Consequently, the two orthogonal fully compensated ferrimagnetic variants related by [C2||C4z] exhibit magnon thermal Hall responses with opposite signs, whereas the response vanishes in the intermediate altermagnetic phase. First-principles calculations further identify monolayer V2SSe as a promising material candidate for realizing the proposed ferroelastic control of transverse magnon transport. Remarkably, ferroelastic switching drives a dual magnonic-electronic band reconstruction, enabling nonvolatile reversal of the magnon thermal Hall effect while producing anisotropic orbital Hall responses and distinct magneto-optical spectra as complementary transport and optical fingerprints. Our findings establish ferroelasticity as an effective route to nonvolatile magnon control and multichannel state identification in zero net magnetization systems.", "method": "", "result": "", "future": "", "summary_zh": "提出通过铁弹性翻转非易失地反转完全补偿亚铁磁体的磁振子热霍尔信号。", "tier": "PRL", "tier_reason_en": "A clear, testable response or experimentally distinctive mechanism of broad condensed-matter interest.", "tier_reason_zh": "提出清晰可检验的响应或具有代表性的实验机制，具有较广凝聚态意义。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "Reveals ferroelastic switching as a means to control magnon thermal Hall effect and chirality in fully compensated ferrimagnets, a new mechanism enabling reversible, nonvolatile transverse magnonic transport control at zero net magnetizatio", "feature_candidate": true, "physics_advance": "Establishing ferroelasticity-driven tunable reversal of magnon thermal Hall effect and band reconstruction in compensated ferrimagnets.", "ai_in_scope": true}, {"id": "arxiv-2610-31142", "arxiv_id": "2610.31142", "type": "arXiv", "journal": "arXiv:2610.31142", "journal_ref": "", "title": "Interaction-enhanced antiferromagnetic correlations in a Kondo ladder with a gapped band structure", "authors": "Tatsuya Kaneko, Ritsuki Hirabayashi, Yutaka Akagi", "corresponding": "", "url": "https://arxiv.org/abs/2610.31142", "topic": "Magnetism", "level": "Brief", "summary_en": "Interactions enhance antiferromagnetic correlations in a Kondo ladder with a gapped band structure.", "summary": "Interactions enhance antiferromagnetic correlations in a Kondo ladder with a gapped band structure.", "abstract": "We investigate magnetic correlations in the two-leg Kondo-Hubbard ladder using the density-matrix renormalization group method. We focus on a parameter regime in which the noninteracting electronic system has a narrow indirect band gap. In this regime, there is no Fermi surface, and the conventional Fermi-surface-based Ruderman-Kittel-Kasuya-Yosida picture is not directly applicable; magnetic correlations between localized spins become weaker as the noninteracting band gap increases. We find that a moderate on-site Coulomb interaction enhances the antiferromagnetic correlations between localized spins. This enhancement, which is also seen in the staggered magnetization induced by a pinning field at the edges, occurs for both ferromagnetic and antiferromagnetic Kondo couplings. Our results show that electron-electron interactions can enhance magnetic correlations between localized spins even when the underlying noninteracting electronic structure is gapped, suggesting an interaction-driven route to magnetic instabilities in narrow-gap Kondo-lattice systems.", "method": "", "result": "", "future": "", "summary_zh": "研究具有能隙能带结构的 Kondo 梯子中相互作用增强的反铁磁关联。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "By demonstrating that electron-electron interactions enhance antiferromagnetic correlations in a narrow-gap Kondo-Hubbard ladder where Fermi-surface approaches fail, this work provides new insight into interaction-driven magnetism beyond co", "feature_candidate": true, "physics_advance": "Discovery that Coulomb interactions enhance antiferromagnetic correlations and magnetic instabilities in narrow-gap Kondo-lattice ladders lacking a Fermi surface", "ai_in_scope": true}, {"id": "arxiv-2610-30929", "arxiv_id": "2610.30929", "type": "arXiv", "journal": "arXiv:2610.30929", "journal_ref": "", "title": "Piezo-Kerr effect in altermagnets and noncollinear antiferromagnets", "authors": "Yuqi Liu, Qiu-Shi Huang, Xinfeng Chen, Yilin Han, Run-Wu Zhang, Zhi-Ming Yu, Yugui Yao", "corresponding": "", "url": "https://arxiv.org/abs/2610.30929", "topic": "Magnetism", "level": "Brief", "summary_en": "Strain activates symmetry-forbidden Kerr rotation in 16 of 122 magnetic point groups, with calculated signals of tens to hundreds of millidegrees.", "summary": "Strain activates symmetry-forbidden Kerr rotation in 16 of 122 magnetic point groups, with calculated signals of tens to hundreds of millidegrees.", "abstract": "Symmetry is usually viewed as a constraint on physical responses, but it can also be used to design the fields that control them. Here, we adopt the representation-matching principle used to identify conjugate fields of order parameters and apply it to response tensors. A linear coupling, the key ingredient for sign-switching control, is symmetry-allowed when a component (or a combination of components) of the control field and the selected response component share the same irreducible representation of the magnetic point group (MPG) of the system. Applied to the magneto-optical Kerr effect, this principle yields a piezo-Kerr effect, in which specific strain combinations activate a Kerr response forbidden in the unstrained state. Enumerating all 122 MPGs, we identify 16 groups in which the unstrained Kerr response is forbidden while a linear strain-induced contribution is allowed. These groups are realized by altermagnets and noncollinear antiferromagnets with symmetry-enforced vanishing net magnetization. The active strain channels and the associated first-order sign reversals follow directly from symmetry. First-principles calculations for bulk MnTe$_{2}$ and CoF$_{2}$, and Cr$_{2}$Se$_{2}$O and Cr$_{2}$Te$_{2}$O monolayers confirm these predictions. In these materials, the Kerr rotation vanishes without strain, whereas 0.5-3% strain produces rotations ranging from tens to hundreds of millidegrees, and reversing the matched strain channel reverses the Kerr sign. These results establish a general route to large and switchable Kerr responses emerging from symmetry-forbidden states in compensated magnets.", "method": "", "result": "", "future": "", "summary_zh": "提出应变激活原本对称性禁戒的 Kerr 响应；122 种磁点群中有 16 种允许线性效应，预测 Kerr 旋转可达数十至数百毫度。", "tier": "PRL", "tier_reason_en": "A general symmetry selection rule with quantitative material predictions and a clean, testable sign-reversal signature.", "tier_reason_zh": "普适对称性选择定则、定量材料预测及干净可检验的符号翻转特征，具备 PRL 水平潜力。", "method_en": "Magnetic-point-group representation analysis over all 122 MPGs, followed by first-principles magneto-optical conductivity and strain calculations for bulk MnTe2, CoF2 and monolayer Cr2Se2O/Cr2Te2O.", "method_zh": "枚举全部 122 种磁点群的表示，计算线性应变–Kerr 张量；随后对块体 MnTe₂、CoF₂ 及单层 Cr₂Se₂O/Cr₂Te₂O 做第一性原理应变与磁光电导计算。", "result_en": "The central equation is θ_i = Σ_jk Λ_i,jk ε_jk, where the time-reversal-odd piezo-Kerr tensor Λ is symmetry-constrained. Fig. 1 illustrates a zero-background Kerr signal activated and sign-reversed by strain. Table 1 identifies 16 MPGs allowing the response; for 4′/mm′m, θ_z ∝ ε_xx−ε_yy. The calculated Cr2Se2O response (Fig. 4) reaches ~50 mdeg at 1% and 164 mdeg at 3% strain (photon energy 1.44 eV). The authors extend representation matching from order parameters to response tensors.", "result_zh": "核心公式为 θ_i=Σ_jk Λ_i,jk ε_jk，其中时间反演奇的 piezo-Kerr 张量 Λ 由磁点群对称性约束。Fig. 1 展示零背景 Kerr 信号被应变激活并随应变反向翻转；Table 1 列出允许该响应的 16 种磁点群，例如 4′/mm′m 中 θ_z∝ε_xx−ε_yy；Fig. 4 计算单层 Cr₂Se₂O 在 1% 应变下约 50 mdeg、3% 下约 164 mdeg（光子能量 1.44 eV）。作者将序参量的表示匹配原则推广到响应张量。", "future_en": "Test bulk CoF2 or MnTe2 with piezo-driven AC strain and lock-in Kerr rotation; use orthogonal εxx−εyy channels and magnetic-domain training to verify linearity and sign reversal before seeking transverse transport analogues.", "future_zh": "优先在块体 CoF₂ 或 MnTe₂ 上施加压电 AC 应变，用锁相 Kerr 测量；对比 εxx−εyy 的正负通道并训练磁畴，验证线性关系与符号翻转，再寻找相应横向输运响应。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "This work identifies a symmetry-enabled piezo-Kerr effect in altermagnets and noncollinear AFMs, showing a new mechanism for strain-controlled magneto-optical response in compensated magnets, supported by first-principles calculations.", "feature_candidate": true, "physics_advance": "Prediction and first-principles confirmation of strain-induced Kerr effects absent in unstrained altermagnets and compensated antiferromagnets, revealing a new linear coupling between strain and magneto-optical response controlled by magnetic point group symme", "ai_in_scope": true}, {"id": "arxiv-2606-10420", "arxiv_id": "2606.10420", "type": "arXiv", "journal": "arXiv:2606.10420", "journal_ref": "", "title": "Superheating field of clean superconductors near the type-I--type-II boundary: the low-temperature Meissner stability limit of niobium", "authors": "Takayuki Kubo", "corresponding": "", "url": "https://arxiv.org/abs/2606.10420", "topic": "Superconductivity", "level": "Brief", "summary_en": "The work calculates the low-temperature superheating field and Meissner stability near the type-I/type-II boundary.", "summary": "The work calculates the low-temperature superheating field and Meissner stability near the type-I/type-II boundary.", "abstract": "We calculate the low-temperature superheating field $B_{\\rm sh}$ of clean superconductors near the boundary between type-I and type-II superconductivity, with particular emphasis on Nb. Ginzburg--Landau theory is not applicable at low temperatures, while previous microscopic calculations have been limited to either the large-$κ$ regime or the dirty limit. The clean, low-$κ$ regime relevant to Nb has therefore remained unresolved. We solve the self-consistent nonlinear nonlocal Eilenberger problem for the Meissner state and then analyze its stability against small perturbations. For a Nb-like material with $κ_{\\rm GL}=0.7$, we obtain $B_{\\rm sh}\\simeq 290\\,{\\rm mT}$ at $T/T_c=0.2$, using $B_{c0}\\simeq 200\\,{\\rm mT}$. For a TESLA-shaped Nb accelerator cavity, this corresponds to an intrinsic Meissner-stability limit of about $67\\,{\\rm MV/m}$.", "method": "", "result": "", "future": "", "summary_zh": "研究洁净超导体在 I 型与 II 型边界附近的低温过热场及 Meissner 态稳定性。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "Provides a new microscopic calculation of low-temperature superheating fields in clean niobium near the type-I/II boundary, resolving an important regime inaccessible to Ginzburg-Landau theory and relevant to intrinsic stability limits in s", "feature_candidate": true, "physics_advance": "First self-consistent microscopic solution of Meissner-state stability and superheating field in clean niobium near the type-I/II superconductivity boundary.", "ai_in_scope": true}, {"id": "arxiv-2610-31184", "arxiv_id": "2610.31184", "type": "arXiv", "journal": "arXiv:2610.31184", "journal_ref": "", "title": "Anomalous polar chains in halide perovskites", "authors": "Erik Fransson, Apinya Ngoipala, Priyanka Deswal, Ethan Berger, Nicholas C. Bristowe, Paul Erhart, Julia Wiktor", "corresponding": "", "url": "https://arxiv.org/abs/2610.31184", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Molecular dynamics identifies tens-of-nanometers-long, nanosecond-lived polar chains in nominally cubic CsGeBr3.", "summary": "Molecular dynamics identifies tens-of-nanometers-long, nanosecond-lived polar chains in nominally cubic CsGeBr3.", "abstract": "Local polar distortions, their collective ordering, and their field-driven reversal have been studied extensively in ferroelectric perovskites for decades. Here we identify an unusual behavior in the ferroelectric halide perovskite CsGeBr3 using large-scale molecular dynamics with first-principles-trained interatomic potentials. In its nominally cubic phase the Ge off-centering forms one-dimensional polar chains that extend over at least tens of nanometers and relax on nanosecond timescales, four orders of magnitude slower than in BaTiO3 and PbTiO3, with CsSnBr3 in between. The cubic CsGeBr3 phase is a dynamically disordered state in which oppositely polarized chains flip throughout the crystal, and a long-lived one-dimensional local polarization coexists with zero net polarization. A simple three-dimensional perovskite thus hosts long-ranged one-dimensional polar correlations with remarkably slow dynamics. In the ferroelectric phase the same chains set a one-dimensional switching mechanism, in which the polarization reverses chain by chain.", "method": "", "result": "", "future": "", "summary_zh": "模拟发现 CsGeBr₃ 名义立方相中存在寿命很长、长度达数十纳米的一维极化链。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "Identification of unusually long-lived, one-dimensional polar chains with slow dynamics in cubic halide perovskite CsGeBr3 reveals a novel type of polar order and novel switching mechanism at the nanoscale, extending understanding of polar ", "feature_candidate": true, "physics_advance": "Discovery of long-range, slowly relaxing one-dimensional polar chains and chain-by-chain switching dynamics in nominally cubic halide perovskite", "ai_in_scope": true}, {"id": "arxiv-2610-30556", "arxiv_id": "2610.30556", "type": "arXiv", "journal": "arXiv:2610.30556", "journal_ref": "", "title": "Field-free superconducting diode and tunable vortex dynamics in NbN/FePt stripe-domain heterostructures", "authors": "Juan C. Zapata, Emilio De Biasi, Martin Sirena, Jeehoon Kim, Nestor Haberkorn", "corresponding": "", "url": "https://arxiv.org/abs/2610.30556", "topic": "Superconductivity", "level": "Brief", "summary_en": "NbN/FePt stripe-domain heterostructures exhibit a field-free superconducting diode efficiency of roughly 50–60%, retaining 35–40% with an AlN spacer.", "summary": "NbN/FePt stripe-domain heterostructures exhibit a field-free superconducting diode efficiency of roughly 50–60%, retaining 35–40% with an AlN spacer.", "abstract": "We demonstrate reconfigurable, field-free superconducting diode behavior in NbN/FePt and NbN/AlN/FePt heterostructures with remanent stripe domains in the FePt layer. NbN films 10 nm thick are capped either directly with FePt or through a thin AlN spacer, which reduces electronic proximity effects while preserving magnetic coupling through stray fields. At zero applied magnetic field, the superconducting diode efficiency reaches approximately 50--60% in NbN/FePt when the stripes are perpendicular to the current and is strongly reduced when they are parallel. The diode effect persists in NbN/AlN/FePt with efficiencies reaching approximately 35--40%, supporting a magnetic origin of the nonreciprocity. We interpret the response as asymmetric vortex transport in the remanent magnetic landscape, with preferential edge vorticity and a Lorentz force that favors inward flux injection or outward motion depending on current polarity. Under applied perpendicular magnetic fields, the interplay between the external field and the magnetic stray fields modifies the flux-flow instability and the apparent instability velocity inferred from transport, with values below those reported for bare NbN films. These results show that stripe-domain ferromagnetic overlayers provide a reconfigurable route to control superconducting nonreciprocity and flux-flow stability in NbN-based heterostructures.", "method": "", "result": "", "future": "", "summary_zh": "在 NbN/FePt 条纹磁畴异质结构中实现零外场超导二极管，效率约 50–60%，加入 AlN 隔层后仍保留约 35–40%。", "tier": "PRL", "tier_reason_en": "A clear, testable response or experimentally distinctive mechanism of broad condensed-matter interest.", "tier_reason_zh": "提出清晰可检验的响应或具有代表性的实验机制，具有较广凝聚态意义。", "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "The paper experimentally demonstrates reconfigurable, field-free superconducting diode behavior and asymmetric vortex dynamics controlled via ferromagnetic stripe domains, providing a novel route to control superconducting nonreciprocity an", "feature_candidate": true, "physics_advance": "Discovery of magnetic domain-controlled field-free superconducting diode effect and tunable vortex dynamics in NbN/FePt heterostructures.", "ai_in_scope": true}, {"id": "arxiv-2610-30684", "arxiv_id": "2610.30684", "type": "arXiv", "journal": "arXiv:2610.30684", "journal_ref": "", "title": "Impact of localized $4f$ magnetism on Berry curvature and the intrinsic anomalous Hall effect in CeRu$_2$Si$_2$", "authors": "Takehiro Kobayashi, Shunsuke Hirai, Ibuki Terada, Michi-To Suzuki", "corresponding": "", "url": "https://arxiv.org/abs/2610.30684", "topic": "Magnetism", "level": "Brief", "summary_en": "Localized Ce 4f magnetism can induce conduction-band exchange splitting and intrinsic Berry-curvature Hall response in CeRu2Si2.", "summary": "Localized Ce 4f magnetism can induce conduction-band exchange splitting and intrinsic Berry-curvature Hall response in CeRu2Si2.", "abstract": "The intrinsic anomalous Hall effect (AHE), originating from Berry curvature, has been extensively studied in $f$-electron systems, including Ce-based compounds. However, how the magnetism of localized $f$ electrons affect the intrinsic AHE remains unclear. Here, we investigate this issue in CeRu$_2$Si$_2$ by calculating the intrinsic anomalous Hall conductivity (AHC) for several occupied Ce-$4f$ states using first-principles LDA+$U$ calculations combined with Wannier interpolation method. We find that the intrinsic AHC remains finite even when the Ce-$4f$ states are localized and do not contribute directly to the Fermi surface, and that its magnitude depends on which Ce-$4f$ state is occupied. We show that localized $4f$-electron magnetism induces exchange splitting in the conduction bands, generating Berry curvature in specific regions near the Fermi surface. This mechanism enables conduction bands that are derived from nonmagnetic orbitals and form the Fermi surface to contribute to the intrinsic AHE, suggesting a route to realizing large intrinsic AHE in $f$-electron materials.", "method": "", "result": "", "future": "", "summary_zh": "计算表明 CeRu₂Si₂ 中局域 4f 磁矩可通过导带交换劈裂调节 Berry 曲率及内禀反常霍尔电导。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "The study elucidates how localized 4f electron magnetism produces exchange splitting of conduction bands to generate Berry curvature and intrinsic anomalous Hall effect in CeRu2Si2, revealing a subtle interplay between localized magnetism a", "feature_candidate": true, "physics_advance": "Identification that localized 4f magnetism induces Berry curvature via exchange-split conduction bands to realize intrinsic AHE in Ce-based materials", "ai_in_scope": true}, {"id": "arxiv-2610-30964", "arxiv_id": "2610.30964", "type": "arXiv", "journal": "arXiv:2610.30964", "journal_ref": "", "title": "Intensity-driven Mott-like transition in a 2D Ruddlesden-Popper perovskite", "authors": "Koushik Mondal, Amit Haldar, Indrajit Mondal, Arpita Dutta, Himanshu Bhatt, Biswajit Mahata, Soumili Banerjee, Hirendra Nath Ghosh, Satyaprasad P Senanayak, Shovon Pal", "corresponding": "", "url": "https://arxiv.org/abs/2610.30964", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "The study reports an intensity-driven Mott-like transition in a two-dimensional Ruddlesden–Popper perovskite.", "summary": "The study reports an intensity-driven Mott-like transition in a two-dimensional Ruddlesden–Popper perovskite.", "abstract": "Two-dimensional Ruddlesden-Popper-type halide perovskites have emerged as promising cutting-edge nonlinear optical materials due to their strong excitonic effects and carrier-density-dependent optical responses. In this work, we investigate the nonlinear optical properties and ultrafast carrier dynamics of (BA)$_2$PbI$_4$ under infrared excitation, resonant with the two-photon energy of its excitonic transition. Using a nonlinear femtosecond Z-scan measurement with a 1030\\,nm pump pulse, we observe a pronounced intensity-dependent evolution of the nonlinear absorption coefficient and the refractive index. With increasing pump intensity, a switch from saturable absorption to reverse saturable absorption emerges, suggesting an intensity-driven Mott-like transition. To elucidate the underlying carrier dynamics, intensity-dependent transient absorption spectroscopy was performed under the same excitation intensities. This reveals a long-lived charge carrier population above the estimated Mott density, reflecting a clear phase transition from an exciton-dominated regime to a dense electron-hole plasma regime. Moreover, such an intensity-driven, high, and switchable nonlinear optical response, along with a Mott-like transition under infrared pulse excitation, makes the 2D (BA)$_2$PbI$_4$ perovskites suitable for all-optical operation in the infrared regime.", "method": "", "result": "", "future": "", "summary_zh": "在二维 Ruddlesden–Popper 钙钛矿中研究光强驱动的类 Mott 转变。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "The paper experimentally evidences and analyzes an intensity-driven Mott-like transition in a 2D halide perovskite, revealing a phase change from excitonic to electron-hole plasma regimes under optical pumping, contributing an experimentall", "feature_candidate": true, "physics_advance": "Experimental identification and characterization of an intensity-driven Mott-like transition from exciton-dominated to electron-hole plasma regime in a 2D halide perovskite", "ai_in_scope": true}, {"id": "arxiv-2610-30241", "arxiv_id": "2610.30241", "type": "arXiv", "journal": "arXiv:2610.30241", "journal_ref": "", "title": "Vacancy-driven topological transition of a Chern insulator", "authors": "Peize Ding, Raquel Queiroz", "corresponding": "", "url": "https://arxiv.org/abs/2610.30241", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Hybridization of vacancy-bound ring states provides a microscopic account of strong-disorder Chern-insulator transitions.", "summary": "Hybridization of vacancy-bound ring states provides a microscopic account of strong-disorder Chern-insulator transitions.", "abstract": "We develop a microscopic description of the strong-disorder transition in a Chern insulator using the in-gap ring states bound to individual vacancies. Using Green's function formalism, we construct an energy-dependent Hamiltonian describing their hybridization. In a commensurate periodic vacancy lattice, a Dirac inversion of the zero-energy vacancy kernel accounts for the change in the occupied-state Chern number of the full system. We treat weak positional disorder using the self-consistent Born approximation and numerical disorder averaging, and study independently distributed vacancies using transfer-matrix and multifractal scaling. The local Chern marker and current textures track the transition in real space. Together, these results highlight the role that nonperturbative ring states have as microscopic deg crowave amplification and nonlinear dynamics mediated by magnon-photon interactions.", "summary": "A nonlinear NbN nanowire coupled to YIG magnons exhibits kinetic-inductance parametric amplification with up to 7 dB detuned gain.", "abstract": "Parametric amplification enables sensitive microwave detection and signal processing by amplifying weak signals with minimal added noise. Here, we demonstrate kinetic inductance mediated parametric amplification in a hybrid magnonic system comprising a nonlinear NbN nanowire resonator strongly coupled to a yttrium iron garnet sphere. The resonator exhibits four wave mixing and nonlinear frequency pulling, enabling parametric amplification both away from and within the magnon-photon strong coupling regime. In the magnon detuned regime, we observe 7 dB gain, while coupling to the YIG magnon shifts the parametric amplification response by ~20 MHz and yields 3.4 dB gain in the hybrid mode. Thus, magnon photon coupling provides a route to magnetically tune the spectral position of kinetic inductance parametric amplification. At higher pump powers, the system transitions to a self oscillatory regime featuring comb-like sidebands and probe activated nonlinear mode mixing. These results establish hybrid magnonics as a platform for tunable nonlinear microwave amplification and dynamics.", "method": "", "result": "", "future": "", "summary_zh": "本文展示了在由非线性NbN纳米线谐振腔与YIG球体强耦合构成的混合磁振子系统中实现的动感感应参量放大。系统表现出可调谐的微波放大和由磁振子-光子相互作用介导的非线性动力学。", "tier": "Nature Communications/Science Advances/PRX", "tier_reason_en": "The work demonstrates a novel tunable microwave amplification mechanism in hybrid magnonics with clear experimental validation and potential quantum technology applications, fitting the profile of a high-impact interdisciplinary journal.", "tier_reason_zh": "该研究在混合磁振子领域展示了新颖的可调微波放大机制，有明确实验验证及量子技术潜力，符合高影响力跨学科期刊的特点。", "relevance_score": 65, "relevance_method": "semantic", "relevance_reason": "The work shows experimentally kinetic inductance mediated parametric amplification in a hybrid magnonic-superconducting system, revealing magnon-photon tunability of nonlinear microwave amplification representing a new nonlinear dynamics re", "feature_candidate": false, "method_en": "The method uses a nonlinear NbN nanowire resonator coupled to a yttrium iron garnet sphere to explore parametric amplification via four-wave mixing and nonlinear frequency pulling in both magnon detuned and strong coupling regimes.", "method_zh": "方法采用非线性NbN纳米线谐振腔与钇铁石榴石球体耦合，研究四波混频与非线性频率牵引下的参量放大，在磁振子失谐和强耦合区域均有表现。", "result_en": "They observed about 7 dB gain away from magnon resonance and 3.4 dB gain within the hybrid mode, with parametric amplification tunable by magnetic coupling. At higher pump powers, self-oscillations and complex nonlinear mode mixing appear.", "result_zh": "在磁振子失谐区获得约7 dB增益，在混合模态中获得3.4 dB增益，参量放大响应可通过磁耦合调节。高泵浦功率下系统进入自激振荡，出现梳状边带及探测激活的非线性模式混合。", "future_en": "Future experiments may explore further tuning mechanisms of the parametric amplifier and investigate detailed nonlinear dynamics at higher pump powers for application in sensitive microwave signal processing.", "future_zh": "未来实验可进一步探讨参量放大器的调节机制，并研究高泵浦功率下的详细非线性动力学，以推动微波灵敏信号处理应用。", "physics_advance": "Demonstration of tunable kinetic-inductance parametric amplification via magnon-photon coupling in hybrid superconducting-magnonic systems.", "ai_in_scope": true}, {"id": "arxiv-2610-30918", "arxiv_id": "2610.30918", "type": "arXiv", "journal": "arXiv:2610.30918", "journal_ref": "", "title": "Thermal expansion mechanisms, heat transport, and band-gap renormalization in strongly anharmonic Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ from machine-learned interatomic potentials", "authors": "Ekaterina Spirande, Rustam Arabov, Sofya Demina, Nikita Rybin, Alexander Shapeev", "corresponding": "", "url": "https://arxiv.org/abs/2610.30918", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The study uses machine-learned interatomic potentials trained on DFT to simulate lattice dynamics, thermal expansion, heat transport, and band-gap renormalization in structurally complex anharmonic materials Rb2SO4, Rb2Ca2(SO4)3, and Ba3Lu(BO3)3.", "summary": "Machine-learned potentials connect thermal expansion, heat transport and band-gap renormalization in strongly anharmonic sulfates and borates.", "abstract": "Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ are structurally complex materials whose thermal expansion has been interpreted, on the basis of high-temperature x-ray diffraction, in terms of specific polyhedral rearrangements. We study their lattice dynamics and its consequences for thermal and electronic properties using molecular dynamics with actively learned moment tensor potentials trained on density-functional theory data. The anharmonicity measure $σ^A$ (compares the anharmonic contribution to the interatomic forces with the total forces acting on atoms) reaches $\\approx$0.3-0.5 for $β$-Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ and $\\approx$0.75 for orientationally disordered $α$-Rb$_2$SO$_4$, and the imaginary harmonic modes of Rb$_2$Ca$_2$(SO$_4$)$_3$ and $α$-Rb$_2$SO$_4$ are stabilized at finite temperature. The simulations reproduce the measured thermal expansion and support the mechanisms proposed from diffraction: expansion along $c$ in $β$-Rb$_2$SO$_4$ arises from both elongation and straightening of corrugated Rb chains, BO$_3$ reorientation accompanies the anisotropic expansion of Ba$_3$Lu(BO$_3$)$_3$, and bending of polyhedral linkages limits expansion along the weakly expanding directions and in cubic Rb$_2$Ca$_2$(SO$_4$)$_3$. Green-Kubo lattice thermal conductivities differ by more than an order of magnitude between compounds with comparable $σ^A$, showing that the anharmonicity measure alone does not determine heat transport. Phonon-induced band-gap renormalization, including lattice thermal expansion, reaches 2.7 and 1.7 eV at 1250 K in Rb$_2$Ca$_2$(SO$_4$)$_3$ and Ba$_3$Lu(BO$_3$)$_3$ and 1.4 eV at 650 K in $β$-Rb$_2$SO$_4$, with zero-point renormalizations of 0.64, 0.70, and 0.31 eV for $β$-Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$, respectively.", "method": "", "result": "", "future": "", "summary_zh": "本研究利用基于DFT训练的机器学习原子间势，模拟了结构复杂的高非谐性材料Rb2SO4、Rb2Ca2(SO4)3和Ba3Lu(BO3)3的晶格动力学、热膨胀、热传导及带隙重整。", "tier": "Uncertain", "tier_reason_en": "The work applies advanced computational methods to complex materials with strong anharmonicity, yielding detailed property insights; publication tier depends on experimental validation and broader impact.", "tier_reason_zh": "该工作利用先进计算方法研究强非谐复杂材料并获得详细性质，发表层级视实验验证和影响力而定。", "relevance_score": 65, "relevance_method": "semantic", "relevance_reason": "Using machine-learned interatomic potentials, this work elucidates anharmonic lattice dynamics, thermal expansion mechanisms, thermal conductivity disparities, and phonon-induced band-gap renormalization in structurally complex strongly anh", "feature_candidate": false, "method_en": "Molecular dynamics simulations with actively learned moment tensor potentials capture anharmonic effects and finite-temperature stabilization, reproducing experimental thermal expansion and computing Green-Kubo thermal conductivities and band-gap shifts.", "method_zh": "采用主动学习的矩张量势进行分子动力学模拟，捕捉非谐效应和有限温度稳定性，重现实验热膨胀，计算Green-Kubo热导率及带隙变化。", "result_en": "Simulations confirm proposed thermal expansion mechanisms from diffraction, show anharmonicity alone does not determine heat transport efficacy, and reveal substantial phonon-induced band-gap renormalizations up to several eV at elevated temperatures.", "result_zh": "模拟证实了衍射提出的热膨胀机制，表明非谐性本身不足以决定热传导效率，且揭示了高温下高达数电子伏特的声子诱导带隙重整。", "future_en": "Follow-up studies could explore design rules for tuning anharmonicity and thermal/electronic properties in complex materials using machine-learned potentials across broader compositional spaces.", "future_zh": "后续研究可利用机器学习势在更广成分空间探索调控 e anisotropy are reproduced more closely than in a simple unstrained two-component model. These results are consistent with a substantial contribution from strain-induced changes in the Sr2RuO4 electronic structure near the interfaces, although contributions from interfacial phase mixing and three-dimensional transport connectivity cannot be excluded.", "method": "", "result": "", "future": "", "summary_zh": "在 Sr₂RuO₄–Ru 共晶中测得相对 Ru 片层平行与垂直方向的热电势各向异性，局域应变模型解释其符号和量级。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "Careful Seebeck and strain-model comparison; its central interpretation is qualitative and based on one eutectic sample.", "tier_reason_zh": "Seebeck 与应变模拟结合较完整，但目前主要是单块共晶样品上的定性机制论证。", "method_en": "Floating-zone-grown Sr2RuO4–Ru eutectic with ~2% visible Ru lamellae; steady-state Seebeck measurements for heat gradients parallel/perpendicular to lamellae; DFT Boltzmann transport and finite-element strain maps.", "method_zh": "使用浮区法生长的 Sr₂RuO₄–Ru 共晶（表面 Ru 片层面积约 2%）；沿片层平行/垂直方向测稳态 Seebeck 系数，结合 DFT Boltzmann 输运和有限元局域应变模拟。", "result_en": "Fig. 1 compares Sxx and Syy of the eutectic with a pure Sr2RuO4 reference and establishes anisotropy tied to lamellar orientation. Figs. 2–3 examine uniaxial-strain-driven Fermi-surface changes and the spatial strain distribution near Ru. Fig. 4 shows that an unstrained two-component mixing model produces <1% anisotropy, while a finite-element strain-informed calculation gives the observed sign and a closer magnitude. The authors argue that thermopower is a sensitive normal-state probe of interfacial strain associated with the 3-K superconducting phase.", "result_zh": "Fig. 1 比较共晶沿 Ru 片层垂直和平行方向的 Sxx、Syy，并以纯 Sr₂RuO₄ 为参照；Figs. 2–3 研究单轴应变导致的费米面变化和 Ru 附近的空间应变分布；Fig. 4 表明简单无应变双组分混合模型只给出小于 1% 的各向异性，而纳入有限元应变后可重现实验符号并更接近量级。作者认为热电势是与 3-K 界面超导有关的局域应变的灵敏常态探针。", "future_en": "On strain-controlled Sr2RuO4, measure Sxx−Syy and elastocaloric response on the same crystal while tracking Tc and the van-Hove-sensitive thermopower; pendent reference period $T_{\\rm lib}=7.77ε^{-1/2}$, where $ε$ is the coupling. Without fitted parameters, the leading response predicts a negative first minimum at $0.952T_{\\rm lib}$ with depth $-0.74$ times the independent-cell exchange coefficient. Isolated-pair simulations test this reference and resolve finite-coupling corrections. The chain reaches its first minimum on the same time scale, with a shallower minimum and a small later residual. Comparisons with chaotic cells and energy-conserving noise show regimes in which coherent return is absent or interrupted over the measured windows. These finite-time results provide a quantitative reference for separating the early exchange plateau from subsequent correlated dynamics.", "method": "", "result": "", "future": "", "summary_zh": "本研究在弱耦合四次振子链中发现谐振能量回返机制，影响早期Green–Kubo导热系数的平稳期，定量描述了谐振相邻对能量交换及相干回返。", "tier": "Uncertain", "tier_reason_en": "The paper provides quantitative theoretical and numerical insights into fundamental heat transport mechanisms, suitable for specialized physics journals pending broader impact validation.", "tier_reason_zh": "论文对基础热传输机制进行定量理论和数值研究，有助于专业物理期刊发表，视影响范围待定。", "relevance_score": 60, "relevance_method": "semantic", "relevance_reason": "Presents a detailed study of resonant energy exchange and coherent return in a classical quartic oscillator chain, elucidating microscopic mechanisms relevant to interpreting thermal transport in model nonlinear lattices.", "feature_candidate": false, "method_en": "The authors theoretically map the pair heat-current integral to a classical pendulum trapping response and validate predictions with isolated-pair simulations and comparisons to noisy and chaotic systems.", "method_zh": "作者将对偶热流积分映射至经典摆锁定响应，通过孤立对模拟及与噪声和混沌系统的比较验证理论预测。", "result_en": "Predicted negative minima of the heat-current integral appear at characteristic time scales without fitting parameters, matching simulations. Coherent energy return is shown to be absent or disrupted under certain conditions.", "result_zh": "热流积分的负极值出现在特征时间尺度上且无拟合参数，与模拟吻合。证明在特定条件下相干能量回返缺失或被打断。", "future_en": "Further studies could investigate how introducing controlled perturbations affects the coherent return and long-time conductivity behaviors experimentally or via simulation.", "future_zh": "后续研究可通过实验或模拟探讨受控扰动如何影响相干回返及长期导热行为。", "physics_advance": "Quantitative identification of resonant-pair coherent energy return phenomena affecting early-time thermal transport signatures in quartic oscillator chains.", "ai_in_scope": true}, {"id": "arxiv-2610-30665", "arxiv_id": "2610.30665", "type": "arXiv", "journal": "arXiv:2610.30665", "journal_ref": "", "title": "From phase analysis to phase tracking: a robust approach to atomic-scale strain mapping", "authors": "Ying Han, Yuan Tian", "corresponding": "", "url": "https://arxiv.org/abs/2610.30665", "topic": "Topology & Transport", "level": "Brief", "summary_en": "This paper introduces geometric phase tracking analysis (GPTA), an improved method for atomic-scale strain mapping that dynamically tracks Bragg reflections in real space, overcoming limitations of standard geometric phase analysis under large strain or grain misorientation.", "summary": "A Bragg-peak-tracking strain-mapping method reduces failure rates from 27% to 11.5% across 13,795 microscopy images.", "abstract": "Atomic-scale strain governs the electronic, ferroic and mechanical properties of materials, and atomic-resolution microscopy measures it most directly. Geometric phase analysis (GPA) is the standard tool, but it fails when a Bragg reflection moves outside its fixed Fourier aperture under large strain or rotation, or in misoriented grains. Here we introduce geometric phase tracking analysis (GPTA), whose Fourier aperture tracks the Bragg reflection at each pixel in real space. A narrow aperture can therefore reject noise without losing a displaced reflection. On 13,795 simulated and experimental atomic-resolution images under various imaging conditions, GPT <script>
'use strict';
const AVAILABLE_REPORTS={"2026-10-23": {"zh": "reports/2026-10-23.zh.pdf", "en": "reports/2026-10-23.en.pdf"}, "2026-10-22": {"zh": "reports/2026-10-22.zh.pdf", "en": "reports/2026-10-22.en.pdf"}, "2026-10-24": {"en": "reports/2026-10-24.en.pdf", "zh": "reports/2026-10-24.zh.pdf"}};
const issues=JSON.parse(document.getElementById('issues-data').textContent);
const TOPIC_ZH={'All':'全部','Superconductivity':'超导','Thermal & Thermoelectric':'热输运与热电','Magnetism':'磁性','Materials & Growth':'材料与晶体生长','Topology & Transport':'拓扑与输运','Correlated Electrons':'关联电子','Low-dimensional & Optical':'低维与光学','Other Condensed Matter':'其他凝聚态'};
const STR={
 en:{kicker:'DAILY RESEARCH MONITOR / CONDENSED MATTER PHYSICS',title:'Condensed Matter Literature',subtitle:'Experimental quantum materials · New papers · Journal club',archive:'Archive',issue:'Issue',untitled:'Daily Literature',papers:'papers',featured:'featured reads',pdfEn:'Journal Club PDF · English ↗',pdfZh:'Journal Club PDF · 中文 ↗',search:'Search titles, authors, materials and findings…',all:'All',shown:'papers shown',indexed:'indexed',feature:'Featured reading',brief:'Literature index',corresponding:'Corresponding',estimated:'Estimated journal tier',actualJournal:'Actual publication',tierReason:'Assessment',read:'Read paper notes +',close:'Close notes −',methods:'Methods',findings:'Authors’ findings',followup:'Experimental follow-up',fullText:'Original paper / Full text ↗',empty:'No papers match the current filter.',footer:'DAILY CONDENSED MATTER LITERATURE · ORIGINAL SOURCES LINKED PER ARTICLE'},
 zh:{kicker:'每日凝聚态物理文献速递',title:'凝聚态物理文献',subtitle:'量子材料实验 · 最新论文 · Journal Club',archive:'往期归档',issue:'期刊速递',untitled:'每日文献',papers:'篇论文',featured:'篇重点精读',pdfEn:'Journal Club PDF · English ↗',pdfZh:'Journal Club PDF · 中文 ↗',search:'搜索论文标题、作者、材料与研究结果…',all:'全部',shown:'篇符合条件',indexed:'篇收录',feature:'重点精读',brief:'文献索引',corresponding:'通讯作者',estimated:'预估期刊档次',actualJournal:'实际发表期刊',tierReason:'评级理由',read:'阅读详细笔记 +',close:'收起笔记 −',methods:'研究方法',findings:'作者主要发现',followup:'我们可以做什么',fullText:'阅读论文原文 ↗',empty:'当前筛选条件下没有论文。',footer:'每日凝聚态物理文献 · 每篇均附原始论文链接'}
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 2025 Journal Impact Factors (2026 JCR release); sorting is by source journal.
const JOURNAL_JIF_2025=Object.freeze({
 'nature':56.1,'science':47.3,'nature materials':38.0,
 'nature communications':18.1,'nature physics':18.0,
 'physical review x':16.8,'prx':16.8,'science advances':13.9,
 'pnas':9.5,'proceedings of the national academy of sciences':9.5,
 'physical review letters':9.4,'prl':9.4
});
function journalImpact(p){
 // Classify by discovery source; arXiv articles stay last even if accepted by a journal.
 if(p.type==='arXiv'||p.arxiv_id||/^arxiv\b/i.test(String(p.journal||'')))return -Infinity;
 const name=String(p.journal||'').trim().toLowerCase().replace(/\s+/g,' ');
 return JOURNAL_JIF_2025[name]??-1;
}
function journalOrder(a,b){
 const x=journalImpact(a),y=journalImpact(b);
 if(x!==y)return y>x?1:-1;
 return String(a.title||'').localeCompare(String(b.title||''));
}
const byId=id=>document.getElementById(id);
let selected=0,topic='All';
// English is the default for first visits. A visitor's explicit choice persists.
let lang=(()=>{try{return localStorage.getItem('condmat-language')==='zh'?'zh':'en'}catch{return 'en'}})();
function field(p,name){
  const en=p[name+'_en'],zh=p[name+'_zh'];
  if(lang==='en')return en||((name==='summary')?(p.abstract||p.summary||''):(p[name]||''));
  return zh||p[name]||en||'';
}
function displayTopic(t){return lang==='zh'?(TOPIC_ZH[t]||t):t}

 byId('archive').innerHTML=issues.map((v,i)=>`<button type="button" aria-current="${i===selected}" data-issue="${i}">${esc(v.date)}<small>${v.papers.length} ${esc(t.papers)}</small></button>`).join('');
 byId('archive').querySelectorAll('[data-issue]').forEach(b=>b.addEventListener('click',()=>showIssue(Number(b.dataset.issue))));
 const reports=AVAILABLE_REPORTS[issue.date]||{};

 const reportLinks=languageOrder.filter(l=>reports[l]).map(l=>`<a class="pdf ${l===lang?'current':''}" href="${esc(reports[l])}" target="_blank" rel="noopener" lang="${l==='zh'?'zh-CN':'en'}">${esc(l==='zh'?t.pdfZh:t.pdfEn)}</a>`).join('');
 const issueTitle=(lang==='zh'&&issue.title_zh)||issue.title||t.untitled;
 byId('head').innerHTML=`<div class="issue-head"><div><div class="stamp">${esc(t.issue)} / ${esc(issue.date)}</div><h2>${esc(issueTitle)}</h2><p>${issue.papers.length} ${esc(t.papers)} · ${issue.papers.filter(p=>p.level==='Feature').length} ${esc(t.featured)}</p></div>${reportLinks?`<div class="pdf-group">${reportLinks}</div>`:''}</div>`;
 const types=['All',...new Set(issue.papers.map(x=>x.topic))];
 byId('topics').innerHTML=types.map(tp=>`<button type="button" class="chip ${topic===tp?'active':''}" data-topic="${esc(tp)}">${esc(displayTopic(tp))}</button>`).join('');
 byId('topics').querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>{topic=b.dataset.topic;render()}));
 const q=byId('search').value.trim().toLocaleLowerCase();
 const papers=issue.papers.filter(p=>(topic==='All'||p.topic===topic)&&[
   p.title,p.authors,p.journal,p.corresponding,p.topic,TOPIC_ZH[p.topic],
   p.summary,p.summary_en,p.summary_zh,p.abstract,p.method,p.method_en,p.method_zh,
   p.result,p.result_en,p.result_zh,p.future,p.future_en,p.future_zh,
   p.tier,p.tier_reason,p.tier_reason_en,p.tier_reason_zh
 ].join(' ').toLocaleLowerCase().includes(q)).sort((a,b)=>
   Number(b.level==='Feature')-Number(a.level==='Feature')||journalOrder(a,b));
 byId('counter').textContent=`${papers.length} ${t.shown} / ${issue.papers.length} ${t.indexed}`;
 byId('papers').innerHTML=papers.map((p,i)=>{
   const isFeatured=p.level==='Feature';
   const prior=papers[i-1];
   const heading=(i===0||isFeatured!==(prior.level==='Feature'))?
     `<h2 class="group-heading">${esc(isFeatured?t.feature:t.brief)}</h2>`:'';
   const summary=field(p,'summary'),method=field(p,'method'),result=field(p,'result'),future=field(p,'future'),reason=field(p,'tier_reason');
   const details=[p.published_journal?`<p><strong>${esc(t.actualJournal)}</strong> — ${p.published_doi?`<a href="${esc(p.published_doi)}" target="_blank" rel="noopener">${esc(p.published_journal)} ↗</a>`:esc(p.published_journal)}</p>`:'',p.tier?`<p><strong>${esc(t.estimated)}</strong> — ${esc(p.tier)}${reason?' · '+esc(reason):''}</p>`:'',method?`<p><strong>${esc(t.methods)}</strong> — ${esc(method)}</p>`:'',result?`<p><strong>${esc(t.findings)}</strong> — ${esc(result)}</p>`:'',future?`<p><strong>${esc(t.followup)}</strong> — ${esc(future)}</p>`:''].join('');
   return `${heading}<article class="paper" id="${esc(p.id)}"><div class="topline"><div class="label ${p.level==='Feature'?'feature':''}">${esc(displayTopic(p.topic))} · ${esc(p.level==='Feature'?t.feature:t.brief)}</div><span class="pub">${esc(p.journal)}</span></div><h3><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)} ↗</a></h3><div class="authors">${esc(p.authors)}${p.corresponding&&p.corresponding!=='—'?' · '+esc(t.corresponding)+': '+esc(p.corresponding):''}</div>${summary?`<p class="abstract">${esc(summary)}</p>`:''}${details?`<button type="button" class="expand">${esc(t.read)}</button><div class="details" hidden>${details}<p><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(t.fullText)}</a></p></div>`:''}</article>`;
 }).join('')||`<div class="empty">${esc(t.empty)}</div>`;
 byId('papers').querySelectorAll('.expand').forEach(b=>b.addEventListener('click',()=>toggleNotes(b)));
}
byId('lang-en').addEventListener('click',()=>chooseLanguage('en'));
byId('lang-zh').addEventListener('click',()=>chooseLanguage('zh'));
byId('search').addEventListener('input',render);
render();
</script></body></html>
