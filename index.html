, supported by analytic and numerical evidence; this conceptual breadth supports a strong tier assessment.", "tier_reason_zh": "该工作提出了可能具有普适性的关联函数表征方法，覆盖非晶态与动力学情形，并有解析和数值证据支持；其概念广度足以支持较高档次的评价。"}, {"id": "arxiv-2610-32157", "arxiv_id": "2610.32157", "type": "arXiv", "journal": "arXiv:2610.32157", "journal_ref": "", "journal_doi": "", "title": "Compass Correlations in a Square-Lattice Magnet", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-23T04:49:35Z", "updated_at": "2026-10-23T04:49:35Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Otkur Omar, Matthias D. Frontzek, Gabriele Sala, Junying Shen, Xinmin Wang, Ze Hu, Zhuang Xu, Zecong Qin, Xin Tong, Joe Paddison, Max Hirschberger, Shinichiro Seki, Masaaki Matsuda, Matthew B. Stone, Andrew D. Christianson, Nguyen D. Khanh, Shang Gao", "corresponding": "", "url": "https://arxiv.org/abs/2610.32157v1", "topic": "Superconductivity", "level": "Feature", "summary_en": "Using ErRu₂Si₂, this study reports neutron-scattering evidence for compass correlations in a square-lattice magnet, distinguished from the diffuse-scattering pattern of isostructural NdRu₂Si₂. A minimal compass-Heisenberg model incorporating Er moment anisotropy reproduces the scattering and accounts for a double-Q vortex-antivortex ground state.", "summary": "The square-lattice compass model is a paradigm of bond-dependent frustration, yet experimental evidence for its characteristic spin correlations has remained elusive. Here we identify compass correlations in the square-lattice intermetallic ErRu$_2$Si$_2$ using single-crystal neutron diffuse scattering. Comparative measurements on the isostructural compounds NdRu$_2$Si$_2$ and ErRu$_2$Si$_2$ revea", "abstract": "The square-lattice compass model is a paradigm of bond-dependent frustration, yet experimental evidence for its characteristic spin correlations has remained elusive. Here we identify compass correlations in the square-lattice intermetallic ErRu$_2$Si$_2$ using single-crystal neutron diffuse scattering. Comparative measurements on the isostructural compounds NdRu$_2$Si$_2$ and ErRu$_2$Si$_2$ reveal a pronounced contrast between nearly uniform diffuse rings in the former and strong intensity modulation between Brillouin zones in the latter. Through the magnetic neutron polarization factor, this modulation reveals compass correlations that couple moment orientation to the correlation wavevector. Crystal-field spectroscopy identifies four preferred in-plane orientations for the Er$^{3+}$ moments. A minimal compass-Heisenberg model incorporating this anisotropy quantitatively reproduces the diffuse scattering and accounts for the double-$Q$ vortex-antivortex ground state. Fits with the compass couplings fixed at values set by the dipolar energy scale retain good agreement with the data, supporting a substantial dipolar contribution to the bond-dependent interactions. Our results establish a square-lattice platform for compass physics and suggest that dipolar interactions, acting together with local crystal-field anisotropy, can shape directional magnetic correlations alongside conduction-electron-mediated exchange.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "Diffuse scattering in ErRu₂Si₂ reveals compass correlations linking moment orientation to correlation wavevector; crystal-field anisotropy and dipolar-scale compass couplings account for the observations and the proposed double-Q vortex-antivortex ground state", "ai_in_scope": true, "relevance_reason": "Neutron-scattering and spectroscopy measurements establish distinctive bond-dependent magnetic correlations in a square-lattice material and connect them to a quantitative magnetic model.", "relevance_method": "semantic", "relevance_score": 84, "feature_candidate": true, "summary_zh": "本研究利用 ErRu₂Si₂ 报告了方格磁体中 compass 关联的中子散射证据，其漫散射图样与同构化合物 NdRu₂Si₂ 不同。结合 Er 磁矩各向异性的最小 compass-Heisenberg 模型能够重现散射，并解释 double-Q 涡旋—反涡旋基态。", "method_en": "The authors use single-crystal neutron diffuse scattering to compare NdRu₂Si₂ and ErRu₂Si₂, and interpret the zone-dependent intensity modulation using the magnetic neutron polarization factor. Crystal-field spectroscopy identifies preferred in-plane Er³⁺ moment orientations; the resulting anisotropy is incorporated into a minimal compass-Heisenberg model and compared with the measured scattering.", "method_zh": "作者利用单晶中子漫散射比较 NdRu₂Si₂ 与 ErRu₂Si₂，并借助磁中子偏振因子解释不同布里渊区之间的强度调制。晶场谱学确定了 Er³⁺ 磁矩偏好的面内取向；研究将由此得到的各向异性纳入最小 compass-Heisenberg 模型，并与实测散射进行比较。", "result_en": "NdRu₂Si₂ exhibits nearly uniform diffuse rings, whereas ErRu₂Si₂ shows strong intensity modulation between Brillouin zones. The authors identify this modulation, through the magnetic neutron polarization factor, as evidence of compass correlations coupling moment orientation to the correlation wavevector. Crystal-field spectroscopy finds four preferred in-plane orientations for Er³⁺ moments, and a minimal compass-Heisenberg model incorporating this anisotropy quantitatively reproduces the diffuse scattering. The model also accounts for a double-Q vortex-antivortex ground state. Good agreement persists when compass couplings are fixed to values set by the dipolar energy scale, supporting a substantial dipolar contribution to the bond-dependent interactions.", "result_zh": "NdRu₂Si₂ 呈现近乎均匀的漫散射环，而 ErRu₂Si₂ 在不同布里渊区之间表现出强烈的强度调制。作者依据磁中子偏振因子，将这种调制识别为 compass 关联的证据；该关联使磁矩取向与关联波矢相耦合。晶场谱学发现 Er³⁺ 磁矩有四种偏好的面内取向；纳入这一各向异性的最小 compass-Heisenberg 模型能够定量重现漫散射。该模型还可解释 double-Q 涡旋—反涡旋基态。即使将 compass 耦合固定为由偶极能标确定的数值，模型仍与数据符合良好，支持偶极相互作用对键依赖相互作用有显著贡献。", "future_en": "Further experiments could vary the conditions controlling magnetic correlations to test how robust the observed directional scattering and double-Q state are. Quantitative comparisons of dipolar and conduction-electron-mediated contributions could also clarify the origin of the bond-dependent interactions.", "future_zh": "后续实验可改变影响磁关联的条件，以检验观测到的方向性散射和 double-Q 态是否稳健。定量比较偶极作用与传导电子介导作用的贡献，也有助于厘清键依赖相互作用的来源。", "tier": "PRL", "tier_reason_en": "The work presents a clear experimental identification of compass correlations in a square-lattice material, supported by a quantitative model and a comparison compound. The connection to dipolar-scale couplings adds a substantive physical interpretation, making PRL a reasonable assessment.", "tier_reason_zh": "该研究在方格材料中清晰识别出 compass 关联，并以定量模型和对照化合物加以支持。其与偶极能标耦合的联系提供了有实质内容的物理解释，因此 PRL 是合理的评价。"}, {"id": "arxiv-2610-32097", "arxiv_id": "2610.32097", "type": "arXiv", "journal": "arXiv:2610.32097", "journal_ref": "", "journal_doi": "", "title": "Heterogeneous superconductivity emerging from a charge-stripe state in kagome lattices", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el", "cond-mat.supr-con"], "submitted_at": "2026-10-23T02:58:25Z", "updated_at": "2026-10-23T02:58:25Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Hongyu Li, Shuikang Yu, Huachen Rao, Zhuying Wang, Xingchen Zhou, Houpu Li, Yunmei Zhang, Zhao Gong, Xin Yu, Rui Wu, Tao Wu, Zhenyu Wang, Ziji Xiang, Xianhui Chen", "corresponding": "", "url": "https://arxiv.org/abs/2610.32097v1", "topic": "Superconductivity", "level": "Feature", "summary_en": "This study examines how superconductivity changes when the charge-density-wave state in CsV₃Sb₅₋ₓSnₓ changes from triple-Q order to short-range stripe-like order at x₍c₎ = 0.07. Beyond this composition, several measurements indicate a spatially heterogeneous superconducting state that the authors interpret as consistent with strong pair breaking by charge stripes.", "summary": "Charge density wave (CDW) and superconductivity have long been recognized as competing orders. However, recent achievements establish that the interplay between these two collective electronic phenomena can be more perplexing, with emergent phenomena arising from their cooperation. Here we report a distinctive case of the kagome superconductors CsV3Sb5-xSnx, in which the characteristics of superco", "abstract": "Charge density wave (CDW) and superconductivity have long been recognized as competing orders. However, recent achievements establish that the interplay between these two collective electronic phenomena can be more perplexing, with emergent phenomena arising from their cooperation. Here we report a distinctive case of the kagome superconductors CsV3Sb5-xSnx, in which the characteristics of superconductivity evolve in accordance with the form of CDW order. As the triple-Q CDW in CsV3Sb5 transforms to a short-range stripelike CDW at xc = 0.07, a sudden change in superconducting properties occurs concomitantly. A combination of thermodynamic, electrical transport and scanning tunneling microscopy experiments reveals a heterogeneous superconducting state beyond xc: the superconducting gap exhibits pronounced spatial variation, in conformity with a distribution of critical temperature and the resulted superconducting precursor effects. Moreover, abundant normal fluid persists deep into the superconducting state, as evidenced by remnants of electronic specific heat and zero-energy quasiparticle interference. These observations are unrelated to the chemical inhomogeneity and residual strain effect introduced by Sn substitution. Instead, they emulate the phenomenology that a sign-changing superconducting order parameter is subject to strong pair-breaking scattering with the short-range charge stripes and hence reflect the unconventional nature of superconductivity developing inside the charge-stripe state.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "The short-range stripe CDW state is accompanied by spatially varying superconducting gaps and critical temperatures, precursor effects, and residual normal-fluid signatures, consistent with strong pair breaking of unconventional superconductivity.", "ai_in_scope": true, "relevance_reason": "This experimental study of a kagome superconductor links a change in charge order to spatially heterogeneous superconductivity and unusual residual excitations, making it a strong quantum-materials result.", "relevance_method": "semantic", "relevance_score": 80, "feature_candidate": true, "summary_zh": "本研究考察 CsV₃Sb₅₋ₓSnₓ 的电荷密度波由 triple-Q 有序转变为短程条纹状有序时，超导性质如何随之变化；该转变发生在 x₍c₎ = 0.07。超过这一组分后，多种测量显示出空间非均匀的超导态，作者认为这与电荷条纹导致的强配对破坏相符。", "method_en": "The authors combine thermodynamic measurements, electrical transport, and scanning tunneling microscopy across the composition-driven change in charge-density-wave order. They compare superconducting properties on either side of x₍c₎ and assess whether the observed inhomogeneity can instead be attributed to Sn-related chemical inhomogeneity or residual strain.", "method_zh": "作者结合热力学测量、电输运和扫描隧道显微术，研究随组分变化而发生的电荷密度波转变。研究比较 x₍c₎ 两侧的超导性质，并考察观测到的非均匀性是否可由 Sn 引入的化学非均匀性或残余应变解释。", "result_en": "At x₍c₎ = 0.07, the triple-Q charge-density wave in CsV₃Sb₅ changes into a short-range stripe-like state, concomitant with an abrupt change in superconducting properties. Beyond this threshold, the superconducting gap varies markedly across space, alongside a distribution of critical temperatures and superconducting precursor effects. Remnant electronic specific heat and zero-energy quasiparticle interference indicate that abundant normal fluid persists deep into the superconducting state. The authors report that these observations are unrelated to chemical inhomogeneity or residual strain from Sn substitution. They interpret the results as resembling strong pair breaking of a sign-changing superconducting order parameter by short-range charge stripes, and thus as evidence consistent with unconventional superconductivity within the stripe state.", "result_zh": "在 x₍c₎ = 0.07，CsV₃Sb₅ 中的 triple-Q 电荷密度波转变为短程条纹状态，超导性质也同时发生突变。超过这一阈值后，超导能隙呈现显著空间变化，并伴有临界温度分布和超导前驱效应。残余电子比热和零能准粒子干涉表明，大量正常流体在超导态深处仍然存在。作者报告称，这些现象与 Sn 替代引入的化学非均匀性或残余应变无关。作者将结果解释为与短程电荷条纹对变号超导序参量造成强配对破坏的情形相似，并认为这支持条纹态中的超导具有非常规性质。", "future_en": "Further work could test more directly whether the inferred sign-changing order parameter and stripe-related pair breaking account for the spatial gap and critical-temperature variations. Extending the measurements across composition and under controlled tuning of the stripe correlations could clarify how the heterogeneous superconducting state develops.", "future_zh": "后续研究可更直接地检验所推断的变号序参量及条纹相关配对破坏，是否能够解释能隙和临界温度的空间变化。拓展组分范围的测量，并可控调节条纹关联，有助于厘清非均匀超导态的形成过程。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The combination of thermodynamic, transport, and spatially resolved evidence supports a substantial result on superconductivity in a prominent kagome family. The proposed link to sign-changing pairing and stripe-induced pair breaking remains an interpretation rather than a direct determination of the pairing state, making PRB/Physical Review Materials a proportionate assessment.", "tier_reason_zh": "热力学、电输运和空间分辨证据的结合，为重要 kagome 材料家族中的超导行为提供了有分量的结果。但关于变号配对及条纹诱导配对破坏的联系仍属解释，而非对配对态的直接判定，因此 PRB/Physical Review Materials 是较为适当的评价。"}, {"id": "arxiv-2610-32767", "arxiv_id": "2610.32767", "type": "arXiv", "journal": "arXiv:2610.32767", "journal_ref": "", "journal_doi": "", "title": "Majorana Edge-to-bound State Transition in Interferometric Superconductor Rings", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.mtrl-sci", "cond-mat.supr-con"], "submitted_at": "2026-10-23T15:08:06Z", "updated_at": "2026-10-23T15:08:06Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Xiangyu Bi, Aoshen Yang, Hongzi Cao, Ganyu Chen, Yuqiang Fang, Zeya Li, Qizheng Sun, Junwei Huang, Da Wang, Fuqiang Huang, Toshiya Ideue, Qianghua Wang, Yoshihiro Iwasa, Hongtao Yuan", "corresponding": "", "url": "https://arxiv.org/abs/2610.32767v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "This study proposes a way to change the flux configuration in a topological-superconductor nanoring from extended edge states to vortex-bound states by tuning the relative scales of vortex size and annulus width. Little–Parks oscillations in a 2M-WS₂ ring are interpreted as evidence for this change as the sample is cooled.", "summary": "Manipulating flux quanta in topological superconductors is central to vortex braiding in quantum computing. Their interferometric superconducting rings can host either topologically protected edge states with fluxes confined inside the central hollow area or vortex bound states in flux cores at the annulus walls. Here we demonstrate a strategy to drive topological edge states into vortex bound sta", "abstract": "Manipulating flux quanta in topological superconductors is central to vortex braiding in quantum computing. Their interferometric superconducting rings can host either topologically protected edge states with fluxes confined inside the central hollow area or vortex bound states in flux cores at the annulus walls. Here we demonstrate a strategy to drive topological edge states into vortex bound states by tuning the relative scale of vortex size and annulus width in nano-ring interferometric device on 2M-WS$_2$ topological superconductor. Near its superconducting transition where the coherence length exceeds the annulus width, Little-Parks oscillations exhibit expected periods for flux bundles in ring-center, consistent with edge states residing at inner and outer rims of the annulus. Upon cooling, where the coherence length shrinks below the annulus width, the unexpectedly increased oscillation period reflects multiple fluxes distributed along annulus region in flux necklace configuration, implying a transition from extended edge states to localized vortex bound states. Ginzburg-Landau simulations and local density-of-states calculations with Bogoliubov-de Gennes equations reveal that large values for both Ginzburg-Landau parameter and flux-pinning energy are vital for such a transition. Our findings provide a novel strategy for understanding flux manipulation towards flux braiding and topological quantum computing.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "It reports a coherence-length-dependent change from flux associated with extended annular edge states to a flux-necklace configuration consistent with localized vortex-bound states.", "ai_in_scope": true, "relevance_reason": "The paper combines measurements on a topological superconductor with GL and BdG calculations to investigate a change in its flux-state physics.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": false, "summary_zh": "本文提出，可通过调节涡旋尺寸与环形环带宽度的相对尺度，使拓扑超导纳米环中的磁通构型由延展边缘态转变为涡旋束缚态。作者将 2M-WS₂ 环中的 Little–Parks 振荡解释为样品冷却时发生这一转变的证据。", "method_en": "The authors measure Little–Parks oscillations near and below the superconducting transition, comparing the flux-period behavior as the coherence length changes relative to the annulus width. They also use Ginzburg–Landau simulations and local-density-of-states calculations based on the Bogoliubov–de Gennes equations.", "method_zh": "作者测量超导转变附近及以下温区的 Little–Parks 振荡，并比较相干长度相对于环带宽度变化时的磁通周期行为。他们还进行了 Ginzburg–Landau 模拟，并基于 Bogoliubov–de Gennes 方程计算局域态密度。", "result_en": "Near the superconducting transition, when the coherence length exceeds the annulus width, the oscillation periods are consistent with flux bundles in the central hollow and edge states at the annulus rims. On cooling, when the coherence length becomes smaller than the annulus width, the increased period is interpreted as multiple fluxes distributed along the annulus in a necklace configuration, indicating a transition to localized vortex-bound states. The simulations identify large Ginzburg–Landau parameter and flux-pinning energy as important for this transition.", "result_zh": "在超导转变附近，相干长度大于环带宽度时，振荡周期与磁通束位于中心空腔、边缘态位于环带内外缘的情形相符。冷却后，当相干长度小于环带宽度时，振荡周期增大；作者将其解释为多个磁通沿环带呈项链状分布，表明系统转向局域涡旋束缚态。模拟显示，较大的 Ginzburg–Landau 参数和磁通钉扎能对该转变十分重要。", "future_en": "The proposed control of flux localization offers a route for studying flux manipulation relevant to braiding proposals in topological superconductors.", "future_zh": "这种调控磁通局域化的方法为研究与拓扑超导体涡旋编织方案相关的磁通操控提供了途径。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work combines device measurements with established simulations to support a potentially useful flux-reconfiguration strategy, but the abstract describes the state assignment as an interpretation of oscillation behavior rather than a direct demonstration of Majorana braiding.", "tier_reason_zh": "该研究结合器件测量与成熟的模拟方法，支持一种可能有用的磁通重构策略；但摘要将态的判定表述为对振荡行为的解释，并未声称直接实现了 Majorana 编织。"}, {"id": "arxiv-2610-32714", "arxiv_id": "2610.32714", "type": "arXiv", "journal": "arXiv:2610.32714", "journal_ref": "", "journal_doi": "", "title": "Nano-ARPES observation of a flat band at the \\bar{M} point in 2.4° twisted bilayer graphene", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall", "cond-mat.mtrl-sci"], "submitted_at": "2026-10-23T14:35:25Z", "updated_at": "2026-10-23T14:35:25Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Giovanna Feraco, Przemysław Przybysz, Oreste De Luca, Ying Wang, Pavel Dudin, José Avila, Jianting Ye, Paweł Dąbrowski, Paweł J. Kowalczyk, Jagoda Sławińska, Petra Rudolf, Antonija Grubišić-Čabo", "corresponding": "", "url": "https://arxiv.org/abs/2610.32714v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "The authors report a flat band at the $\\bar{M}$ point, far from the Fermi level, in 2.4° twisted bilayer graphene, directly visualized by angle-resolved photoemission spectroscopy. They describe it as the first observation of a flat band away from the $\\bar{K}$ point in twisted bilayer graphene and argue that the full Brillouin zone should be probed.", "summary": "The emergence of flat bands in twisted bilayer graphene at the so-called magic angle reveals a range of intriguing phases, such as superconductivity and Mott insulating states, resulting from electrons entering a correlated state. This establishes twisted bilayer graphene as an excellent platform for exploring correlation effects in many-body phases and across various twist angles. However, in mos", "abstract": "The emergence of flat bands in twisted bilayer graphene at the so-called magic angle reveals a range of intriguing phases, such as superconductivity and Mott insulating states, resulting from electrons entering a correlated state. This establishes twisted bilayer graphene as an excellent platform for exploring correlation effects in many-body phases and across various twist angles. However, in most cases, the twist angle is not an easy parameter to control because it exhibits structural instabilities such as relaxation and reconstruction that reduce the correlation effects. Here, we report the unexpected appearance of a flat band at the \\bar{M} point far from the Fermi level in a 2.4° twisted bilayer graphene, directly visualized by angle-resolved photoemission spectroscopy. Our work is the first observation of flat bands away from the \\bar{K} point in twisted bilayer graphene and highlights the need to probe the entire Brillouin zone to fully capture electronic states in twisted structures.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "A flat band is observed at the Brillouin-zone \\bar{M} point, away from the previously emphasized \\bar{K} point, in 2.4° twisted bilayer graphene.", "ai_in_scope": true, "relevance_reason": "The ARPES result experimentally identifies an unexpected electronic flat band in twisted bilayer graphene, a correlated low-dimensional quantum material.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": false, "summary_zh": "作者报告在 2.4° 扭转双层石墨烯中观测到远离费米能级、位于 $\\bar{M}$ 点的平带，并通过角分辨光电子能谱直接成像。作者称这是首次在扭转双层石墨烯中观测到 $\\bar{K}$ 点以外的平带，并指出应探测整个布里渊区。", "method_en": "The authors use nano-ARPES to directly visualize the electronic band structure of 2.4° twisted bilayer graphene, focusing on states around the $\\bar{M}$ point.", "method_zh": "作者采用 nano-ARPES 直接成像 2.4° 扭转双层石墨烯的电子能带结构，重点考察 $\\bar{M}$ 点附近的态。", "result_en": "The measurement reveals a flat band at $\\bar{M}$ far from the Fermi level, which the authors identify as the first observed flat band away from $\\bar{K}$ in twisted bilayer graphene. The result highlights that examining only the vicinity of $\\bar{K}$ may miss electronic states in twisted structures.", "result_zh": "测量揭示了一个远离费米能级、位于 $\\bar{M}$ 点的平带；作者将其称为扭转双层石墨烯中首次观测到的 $\\bar{K}$ 点以外平带。该结果指出，只考察 $\\bar{K}$ 附近可能会遗漏扭转结构中的电子态。", "future_en": "Mapping additional regions of the Brillouin zone and examining how the observed band varies with twist angle could establish the broader distribution and angle dependence of such states. These are natural follow-up questions, not results reported in the abstract.", "future_zh": "进一步测绘布里渊区的其他区域，并考察该能带随扭转角的变化，可帮助确定此类态更广泛的分布及其角度依赖性。这些是由摘要结果引出的后续问题，并非摘要中已报告的结论。", "tier": "PRL", "tier_reason_en": "A direct nano-ARPES observation claimed as the first flat band away from $\\bar{K}$ in twisted bilayer graphene is a clear and potentially broadly relevant experimental finding; the abstract supports a strong letter-level assessment, though it does not establish wider implications beyond the reported observation.", "tier_reason_zh": "摘要所称的首次通过 nano-ARPES 观测到扭转双层石墨烯中 $\\bar{K}$ 点以外的平带，是明确且可能具有广泛相关性的实验发现；摘要足以支持较强的快报层级评价，但尚未确立该观测之外的更广泛影响。"}, {"id": "arxiv-2610-32224", "arxiv_id": "2610.32224", "type": "arXiv", "journal": "arXiv:2610.32224", "journal_ref": "", "journal_doi": "", "title": "Intrinsic Paramagnetism of Optical Phonons and Thermal Hall Effect in Quantum Paraelectrics", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mes-hall", "cond-mat.str-el"], "submitted_at": "2026-10-23T06:31:54Z", "updated_at": "2026-10-23T06:31:54Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Harsh Jain, Manideep Gone, Nabyendu Das", "corresponding": "", "url": "https://arxiv.org/abs/2610.32224v1", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "This paper proposes that quantum fluctuations of nearly critical optical phonons give quantum paraelectrics intrinsic paramagnetism that can drive a phonon-mediated thermal Hall effect. The theory links the Hall response to the spectral-weight imbalance between circularly polarized chiral phonon modes.", "summary": "We propose a microscopic theory of the phonon-mediated thermal Hall effect in quantum paraelectrics, driven by the intrinsic paramagnetism due to quantum fluctuations of the (nearly) critical optical phonon modes. The effective magnetization due to temporal fluctuations of the assosciated dipoles couple to an external magnetic field resulting the magnetoelectric term $\\mathbf{H} \\cdot (\\mathbf{P} ", "abstract": "We propose a microscopic theory of the phonon-mediated thermal Hall effect in quantum paraelectrics, driven by the intrinsic paramagnetism due to quantum fluctuations of the (nearly) critical optical phonon modes. The effective magnetization due to temporal fluctuations of the assosciated dipoles couple to an external magnetic field resulting the magnetoelectric term $\\mathbf{H} \\cdot (\\mathbf{P} \\times \\dot{\\mathbf{P}})$ in the effective Lagrangian density of the polarisation field $\\mathbf{P}$. This coupling splits the transverse optical phonon spectrum into right- and left-circularly polarized chiral branches. Using the chiral phonon Green's functions and the Kubo formalism, we derive the thermal Hall conductivity $κ_{xy}$ from the heat-current correlation function. We observe that $κ_{xy}$ is proportional to the difference in spectral weights of the two chiral modes, $κ_{xy} \\propto A_+^2 - A_-^2$, establishing a direct microscopic link between phonon chirality and transverse heat transport. Our theory predicts three key observations: (i) a linear-in-magnetic-field response $κ_{xy} \\propto H$ at low fields, evolving into nonlinear behavior at higher fields (ii) a non-monotonic temperature dependence of $κ_{xy}$ with a peak arising from the competition between thermal population and phonon scattering and (iii) strong enhancement of $κ_{xy}$ near the quantum critical point $ω_0 \\to 0$, it exhibits power-law scaling $κ_{xy} \\propto T^α$ with $α\\approx 0.41$. Our findings provide an understanding of thermal Hall transport in quantum paraelectrics due to intrinsic paramagnetism and is aligned with the observed behaviour in SrTiO$_3$ and related materials.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Quantum fluctuations of nearly critical optical phonons generate intrinsic paramagnetism and split transverse phonons into chiral branches, yielding a thermal Hall response linked to their spectral-weight difference and enhanced near the quantum critical point", "ai_in_scope": true, "relevance_reason": "The paper develops a microscopic theory connecting optical-phonon chirality in quantum paraelectrics to magnetic-field-dependent thermal Hall transport.", "relevance_method": "semantic", "relevance_score": 77, "feature_candidate": false, "summary_zh": "本文提出，近临界光学声子的量子涨落会使量子顺电体具有内禀顺磁性，并可驱动声子介导的热霍尔效应。该理论将霍尔响应与圆偏振手性声子模式之间的谱权重差联系起来。", "method_en": "The authors derive an effective magnetoelectric coupling of the form H · (P × Ṗ), use it to obtain chiral optical-phonon Green's functions, and calculate the thermal Hall conductivity with the Kubo formalism. Their calculation expresses κₓᵧ in terms of the difference in spectral weights of the two chiral modes.", "method_zh": "作者推导了 H · (P × Ṗ) 形式的有效磁电耦合，据此构造手性光学声子格林函数，并利用 Kubo 形式体系计算热霍尔电导。计算将 κₓᵧ 表示为两种手性模式谱权重之差。", "result_en": "The theory predicts that κₓᵧ is linear in magnetic field at low fields and becomes nonlinear at higher fields, while its temperature dependence is non-monotonic because thermal population competes with phonon scattering. Near the quantum critical point ω₀ → 0, it predicts a strong enhancement with power-law scaling κₓᵧ ∝ T^α, where α ≈ 0.41. The authors identify this mechanism as consistent with reported behavior in SrTiO₃ and related materials.", "result_zh": "理论预测 κₓᵧ 在低磁场下与磁场呈线性关系，在较高磁场下转为非线性；其温度依赖则因热占据与声子散射的竞争而呈非单调变化。在量子临界点 ω₀ → 0 附近，理论预言热霍尔响应显著增强，并遵循 κₓᵧ ∝ T^α 的幂律，其中 α ≈ 0.41。作者指出，该机制与 SrTiO₃ 及相关材料中报道的行为相符。", "future_en": "The proposed mechanism provides a basis for testing whether intrinsic optical-phonon paramagnetism accounts for thermal Hall behavior in quantum paraelectrics such as SrTiO₃.", "future_zh": "这一机制为检验内禀光学声子顺磁性是否能够解释 SrTiO₃ 等量子顺电体中的热霍尔行为提供了依据。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The abstract offers a coherent microscopic theory and quantitative predictions for a relevant materials problem, but it does not report a decisive experimental test or evidence of broad applicability beyond the proposed setting.", "tier_reason_zh": "摘要为一个重要材料问题提供了连贯的微观理论和定量预测，但未报告决定性的实验检验，也未显示该理论已在所提体系之外广泛适用。"}, {"id": "arxiv-2610-32437", "arxiv_id": "2610.32437", "type": "arXiv", "journal": "arXiv:2610.32437", "journal_ref": "", "journal_doi": "", "title": "Electronic structure of a persistent excitonic fluid far beyond the Mott limit", "arxiv_version": 1, "primary_category": "cond-mat.other", "categories": ["cond-mat.other"], "submitted_at": "2026-10-23T10:03:38Z", "updated_at": "2026-10-23T10:03:38Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Weiyan Qi, Stefano Ponzoni, Ashim Pramanik, Vitaly Gorelov, Yannis Laplace, Gianluca Stefanucci, Enrico Perfetto, Esteban Morcos, Marino Marsi, Steven Francis Udaundo, Sebastian Maherlein, Amina Taleb-Ibrahimi, Kaibo Zheng, Tonu Pullerits, Luca Perfetti", "corresponding": "", "url": "https://arxiv.org/abs/2610.32437v1", "topic": "Topology & Transport", "level": "Feature", "summary_en": "This work reports a high-density excitonic state in two-dimensional hybrid perovskites, identified by a Mexican-hat electronic dispersion measured using time- and angle-resolved photoelectron spectroscopy. The reconstructed band structure persists far longer than the optical coherence time and remains observable beyond optical saturation, including at densities where exciton wavefunctions strongly overlap.", "summary": "Excitons are conventionally expected to destabilize at high photoexcitation densities, as screening weakens the electron-hole attraction. Recent studies, however, challenge this paradigm, suggesting that excitons generated by strong optical pumping can remain stable even beyond the onset of population inversion. Here, using time- and angle-resolved photoelectron spectroscopy on 2D hybrid perovskit", "abstract": "Excitons are conventionally expected to destabilize at high photoexcitation densities, as screening weakens the electron-hole attraction. Recent studies, however, challenge this paradigm, suggesting that excitons generated by strong optical pumping can remain stable even beyond the onset of population inversion. Here, using time- and angle-resolved photoelectron spectroscopy on 2D hybrid perovskites, we provide direct evidence for such a high-density excitonic state, characterized by a distinctive Mexican-hat dispersion. Remarkably, this excitonic band reconstruction endures for orders of magnitude longer than the optical coherence time, revealing a population-sustained electronic structure that survives well into the incoherent regime. The excitonic resonance also persists far beyond optical saturation, at densities where exciton wavefunctions strongly overlap. Our findings reveal a long-lived, high-density quantum fluid of excitons with characteristics reminiscent of a BCS condensate, an electronic structure markedly different from that of the dilute limit.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "A Mexican-hat excitonic band reconstruction persists far beyond optical coherence and saturation, showing that a high-density excitonic state survives into the incoherent regime beyond the Mott limit.", "ai_in_scope": true, "relevance_reason": "Direct spectroscopic evidence for a persistent high-density excitonic electronic state is a substantial discovery about collective electronic matter in a solid.", "relevance_method": "semantic", "relevance_score": 88, "feature_candidate": true, "summary_zh": "本研究在二维杂化钙钛矿中报告了一种高密度激子态，并通过时间分辨、角分辨光电子能谱测得的墨西哥帽状电子色散加以识别。重构后的能带结构持续时间远超光学相干时间，并在超过光学饱和的条件下仍可观测，包括激子波函数强烈重叠的密度范围。", "method_en": "The authors use time- and angle-resolved photoelectron spectroscopy to track the electronic structure of optically excited two-dimensional hybrid perovskites. They examine the density dependence and persistence of the reconstructed dispersion, relating its lifetime to the optical coherence time and its occurrence to optical saturation and exciton overlap.", "method_zh": "作者使用时间分辨、角分辨光电子能谱，追踪光激发二维杂化钙钛矿的电子结构。研究考察重构色散随激发密度的变化及其持续时间，并将其与光学相干时间、光学饱和以及激子波函数重叠联系起来。", "result_en": "The measurements reveal a distinctive Mexican-hat dispersion, which the authors identify as direct evidence of a high-density excitonic state. This band reconstruction lasts for orders of magnitude longer than the optical coherence time, indicating that it persists well into an incoherent regime. The excitonic resonance remains observable far beyond optical saturation and at densities where exciton wavefunctions strongly overlap. These observations challenge the expectation that excitons must destabilize at high excitation density because screening weakens electron-hole attraction. The authors describe the state as a long-lived, population-sustained excitonic quantum fluid with features reminiscent of a BCS condensate, and distinguish its electronic structure from that of the dilute limit.", "result_zh": "测量发现了独特的墨西哥帽状色散，作者将其视为高密度激子态的直接证据。该能带重构持续时间比光学相干时间长数个数量级，表明它在非相干区间仍能持续。激子共振在远超光学饱和的条件下仍然存在，并延伸至激子波函数强烈重叠的密度范围。这些观测挑战了如下预期：高激发密度下，由于屏蔽削弱电子—空穴吸引，激子必然失稳。作者将这一状态描述为长寿命、由粒子布居维持的激子量子流体，其特征令人联想到 BCS 凝聚态，并且其电子结构不同于稀薄极限下的情形。", "future_en": "Further work could map the reconstructed dispersion and excitonic resonance over a broader range of excitation densities and delays to establish their limits of persistence. Testing how the inferred population-sustained state relates to coherence and to the BCS-like analogy would help distinguish its properties from those of a dilute exciton gas.", "future_zh": "后续研究可在更宽的激发密度和延迟时间范围内绘制重构色散及激子共振，以确定其持续存在的边界。进一步检验所推断的粒子布居维持态与相干性的关系，以及其与 BCS 类比的适用性，有助于区分该状态与稀薄激子气体的性质。", "tier": "Nature Physics/Nature Materials", "tier_reason_en": "The reported persistence of a distinct excitonic band reconstruction beyond optical saturation and far beyond the coherence time is a potentially broad result in quantum materials and nonequilibrium excitonics. The abstract supports a strong experimental claim, while the BCS-condensate comparison is presented as resemblance rather than proof of a condensate, favoring a high but not topmost tier.", "tier_reason_zh": "独特激子能带重构在超过光学饱和、且远超相干时间的条件下持续存在，是量子材料与非平衡激子研究中可能具有广泛意义的结果。摘要支持一项有力的实验主张，但 BCS 凝聚态比较是特征相似而非凝聚态的证明，因此适合较高但非最高等级。"}, {"id": "arxiv-2610-32763", "arxiv_id": "2610.32763", "type": "arXiv", "journal": "arXiv:2610.32763", "journal_ref": "", "journal_doi": "", "title": "Spontaneous Decay of High Energy Composite Fermions", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall", "cond-mat.str-el"], "submitted_at": "2026-10-23T15:05:06Z", "updated_at": "2026-10-23T15:05:06Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Mytraya Gattu, J. K. Jain", "corresponding": "", "url": "https://arxiv.org/abs/2610.32763v1", "topic": "Topology & Transport", "level": "Brief", "summary_en": "The paper reports that a high-energy fractionally charged composite fermion in a fractional quantum Hall fluid can decay into a collection containing quasiparticles, quasiholes, and whole electrons.", "summary": "An electron, when added to a fractional quantum Hall fluid, famously splits into fractionally charged composite-fermion quasiparticles. We show here that a high energy composite fermion carrying a fractional charge decays into a collection of particles, including quasiparticles, quasiholes, and even whole electrons.", "abstract": "An electron, when added to a fractional quantum Hall fluid, famously splits into fractionally charged composite-fermion quasiparticles. We show here that a high energy composite fermion carrying a fractional charge decays into a collection of particles, including quasiparticles, quasiholes, and even whole electrons.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "A high-energy fractionally charged composite fermion can spontaneously decay into a collection that includes quasiparticles, quasiholes, and whole electrons.", "ai_in_scope": true, "relevance_reason": "This is original theory of fractional quantum Hall quasiparticles and their decay, a direct contribution to correlated electronic matter.", "relevance_method": "semantic", "relevance_score": 73, "feature_candidate": false, "summary_zh": "本文指出，分数量子霍尔流体中的高能分数电荷复合费米子可以衰变为包含准粒子、准空穴乃至完整电子的粒子集合。", "method_en": "The abstract states uations affect quantum paramagnetism. It finds contrasting scalar-chirality behavior associated with the different signs of ring exchange in the two models.", "summary": "We compare two time-reversal-symmetric triangular-lattice Hubbard models at half filling: the zero-flux model and a staggered $π$-flux model with zero and $π$ flux through oppositely oriented triangles. Although both reduce to the same Heisenberg model at leading order in the strong-coupling limit, their distinct charge fluctuation profiles yield different quantum paramagnetic regimes. Combining a", "abstract": "We compare two time-reversal-symmetric triangular-lattice Hubbard models at half filling: the zero-flux model and a staggered $π$-flux model with zero and $π$ flux through oppositely oriented triangles. Although both reduce to the same Heisenberg model at leading order in the strong-coupling limit, their distinct charge fluctuation profiles yield different quantum paramagnetic regimes. Combining a strong-coupling expansion with infinite density matrix renormalization group (iDMRG) calculations, we find that the positive ring-exchange of the zero-flux model promotes spontaneous chirality, consistent with its notion of a chiral spin liquid at intermediate coupling. In the staggered-$π$-flux model, whose noninteracting limit is a Dirac semimetal, the ring exchange changes sign and disfavors chiral order and we find no resolvable scalar chirality. This renders flux-tuned ring-exchange an efficient discriminator between chiral and non-chiral quantum paramagnets at finite coupling.", "method": "", "result": "", "future": "", "physics_advance": "The sign of ring exchange distinguishes the chiral tendency of the zero-flux model from the absence of resolvable scalar chirality in the staggered-π-flux model.", "ai_in_scope": true, "relevance_reason": "This is an original study of quantum paramagnetic regimes in a triangular-lattice Hubbard system and identifies flux-dependent ring exchange as a mechanism affecting chirality.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": true, "summary_zh": "本研究比较半填充三角晶格 Hubbard 模型中的零磁通与交错 π 磁通情形，考察磁通依赖的电荷涨落如何影响量子顺磁态。研究发现，两种模型中环交换符号不同，并伴随不同的标量手征性表现。", "method_en": "The authors combine a strong-coupling expansion with infinite density matrix renormalization group (iDMRG) calculations. The comparison focuses on the effective ring-exchange terms and scalar chirality in the two models.", "method_zh": "作者结合强耦合展开与无限密度矩阵重整化群（iDMRG）计算。比较重点是两种模型中的有效环交换项和标量手征性。", "result_en": "Although both models reduce to the same Heisenberg model at leading order in the strong-coupling limit, their charge-fluctuation profiles differ. Positive ring exchange in the zero-flux model promotes spontaneous chirality, consistent with a chiral spin liquid at intermediate coupling, whereas ring exchange changes sign in the staggered-π-flux model and disfavors chiral order. No resolvable scalar chirality is found in the latter model. The results identify flux-tuned ring exchange as a discriminator between chiral and non-chiral quantum paramagnets at finite coupling.", "result_zh": "尽管两种模型在强耦合极限的最低阶都化为相同的 Heisenberg 模型，其电荷涨落分布却不同。零磁通模型中的正环交换促进自发手征性，这与中等耦合下的手征自旋液体图景相符；而在交错 π 磁通模型中，环交换变号并抑制手征有序。后一模型中未发现可分辨的标量手征性。结果表明，在有限耦合下，磁通调控的环交换可用于区分手征与非手征量子顺磁态。", "future_en": "The authors propose flux-tuned ring exchange as an efficient discriminator between chiral and non-chiral quantum paramagnets at finite coupling. The abstract does not specify a separate experimental follow-up.", "future_zh": "作者提出，在有限耦合下利用磁通调控的环交换，有效区分手征与非手征量子顺磁态。摘要未具体说明后续实验方案。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work offers a focused numerical and strong-coupling comparison that clarifies how flux changes ring exchange and chirality, but the abstract describes a specific model-level result rather than a broadly demonstrated advance.", "tier_reason_zh": "该工作通过针对性的数值计算和强耦合比较，阐明磁通如何改变环交换与手征性；但摘要呈现的是特定模型层面的结果，而非已广泛验证的突破。"}, {"id": "arxiv-2610-30743", "arxiv_id": "2610.30743", "type": "arXiv", "journal": "arXiv:2610.30743", "journal_ref": "", "title": "Anyon Chern bands of opposite sign and reversed drift", "authors": "Zhenyu Xiao, Minxuan Wang, Shinsei Ryu", "corresponding": "", "url": "https://arxiv.org/abs/2610.30743", "topic": "Magnetism", "level": "Brief", "summary_en": "This theoretical and numerical study investigates the dispersion and dynamics of Laughlin quasiholes at filling 1/3 in a periodically modulated magnetic field. It finds anyon bands with opposite Chern-number signs and a quasihole drift opposite to the usual E×B direction in one band.", "summary": "The elementary charged excitations of fractional quantum Hall states are anyons. Without continuous translation symmetry, they acquire a dispersion and richer dynamics. We study the Laughlin quasihole at filling $1/3$ in a periodically modulated magnetic field, a common model of fractional Chern insulators in two-dimensional materials. From the microscopic wave functions, we derive the commutator ", "abstract": "The elementary charged excitations of fractional quantum Hall states are anyons. Without continuous translation symmetry, they acquire a dispersion and richer dynamics. We study the Laughlin quasihole at filling $1/3$ in a periodically modulated magnetic field, a common model of fractional Chern insulators in two-dimensional materials. From the microscopic wave functions, we derive the commutator of its guiding-center coordinates, set by a many-body Berry curvature that governs its wave packets. A modulation with two flux quanta per unit cell splits the quasihole band into bands with Chern numbers $6$ and $-3$; such opposite signs are generic as long as a weak modulation opens a gap between the anyon bands. In the $C=-3$ band, the quasihole drifts against $\\mathbf{E}\\times\\mathbf{B}$, although the magnetic field has the same sign everywhere. Perturbation theory in the modulation explains these results, and large-scale Monte Carlo calculations confirm them. Anyon bands thus acquire their own topology, which controls anyon motion and may shape the phases of itinerant anyons.", "method": "", "result": "", "future": "", "physics_advance": "Periodic magnetic modulation can split Laughlin quasiholes into bands with opposite Chern numbers, including a band whose quasiholes drift opposite to the usual E×B direction despite a magnetic field of unchanged sign.", "ai_in_scope": true, "relevance_reason": "The paper establishes new topological and dynamical behavior of fractional quantum Hall quasiholes, a substantial theoretical advance in condensed-matter physics.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": false, "summary_zh": "本理论与数值研究考察填充因子 1/3 的 Laughlin 准空穴在周期调制磁场中的色散与动力学。研究发现，任意子能带可具有符号相反的陈数，且其中一个能带的准空穴漂移方向与通常的 E×B 方向相反。", "method_en": "The authors derive the commutator of quasihole guiding-center coordinates from microscopic wave functions, with the commutator set by a many-body Berry curvature. They analyze the modulation perturbatively and use large-scale Monte Carlo calculations to confirm the results.", "method_zh": "作者从微观波函数推导准空穴导引中心坐标的对易关系，其对易关系由多体 Berry 曲率决定。研究通过微扰理论分析磁场调制，并以大规模 Monte Carlo 计算验证结果。", "result_en": "For a modulation with two flux quanta per unit cell, the quasihole band splits into bands with Chern numbers 6 and −3. The authors report that opposite-sign Chern numbers are generic when a weak modulation opens a gap between anyon bands. In the C = −3 band, the quasihole drifts against E×B even though the magnetic field has the same sign everywhere. These results show that anyon-band topology can govern anyon motion and may influence phases of itinerant anyons.", "result_zh": "当每个晶胞的调制磁通为两个磁通量子时，准空穴能带分裂为陈数分别为 6 和 −3 的能带。作者指出，只要弱调制在任意子能带之间打开能隙，陈数符号相反的情形便具有普遍性。在 C = −3 的能带中，尽管磁场处处同号，准空穴仍逆着 E×B 方向漂移。这些结果表明，任意子能带拓扑能够控制任意子运动，并可能影响可运动任意子的相态。", "future_en": "The authors suggest that the topology of anyon bands may shape phases of itinerant anyons. The abstract does not specify a particular experimental test or follow-up study.", "future_zh": "作者指出，任意子能带的拓扑可能影响可运动任意子的相态。摘要未提出具体的实验检验或后续研究方案。", "tier": "PRL", "tier_reason_en": "The result links many-body Berry curvature and anyon-band topology to a striking reversed-drift response, supported by both perturbation theory and large-scale Monte Carlo; this is a concise conceptual advance with potential relevance beyond the specific model.", "tier_reason_zh": "该结果将多体 Berry 曲率和任意子能带拓扑与显著的反向漂移响应联系起来，并由微扰理论和大规模 Monte Carlo 共同支持；这是一个简洁的概念性进展，具有超出特定模型的潜在意义。"}, {"id": "arxiv-2607-22176", "arxiv_id": "2607.22176", "type": "arXiv", "journal": "arXiv:2607.22176", "journal_ref": "Phys. Rev. B 114, 204423 (2026)", "title": "GHz non-reciprocal optical conductivity in hematite ($α$-$\\text{Fe}_2\\text{O}_3$)", "authors": "Peng Rao, Johannes Gröbmeyer, P. Peter Stavropoulos, Alexander Mook, Matthias Althammer, Hans Huebl, Alexander Holleitner, Johannes Knolle", "corresponding": "", "url": "https://arxiv.org/abs/2607.22176", "topic": "Magnetism", "level": "Brief", "summary_en": "This study calculates sub-gap optical response and nonreciprocity in canted easy-plane antiferromagnetic hematite across the GHz-to-THz range. It finds that the canting-induced net magnetic moment is associated with a nonzero Hall conductivity and evaluates a prospective circulator response.", "summary": "We study the non-reciprocal properties of the iron oxide $α$-Fe$_2$O$_3$ (hematite) in the canted easy-plane antiferromagnetic phase, specifically in the GHz to THz frequency range. First, using the the microscopic spin Hamiltonian, we obtain the correct classical ground state where the canting is induced by the Dzyaloshinskii-Moriya interactions (DMI). The magnon spectrum is simulated using linea", "abstract": "We study the non-reciprocal properties of the iron oxide $α$-Fe$_2$O$_3$ (hematite) in the canted easy-plane antiferromagnetic phase, specifically in the GHz to THz frequency range. First, using the the microscopic spin Hamiltonian, we obtain the correct classical ground state where the canting is induced by the Dzyaloshinskii-Moriya interactions (DMI). The magnon spectrum is simulated using linear spin wave theory. We then compute the polarizability and the sub-gap optical conductivities using linear response. We find that the conductivity tensor contains frequency peaks at the zero momentum magnon gaps of order $0.1~$meV which can be tuned by the DMI and on-site anisotropic spin interactions. Furthermore, we show that the canting-induced net magnetic moment $\\mathbf{m}$ represents a measure for the effective time-reversal-symmetry breaking and non-reciprocity of the system: a finite $\\mathbf{m}$ results in a non-zero Hall conductivity. Finally, we discuss the prospective application of hematite in non-reciprocal circulator design, by computing the non-reciprocal circulator transmission amplitude using the conductivities as input.", "method": "", "result": "", "future": "", "physics_advance": "The calculation predicts a nonzero Hall conductivity in canted hematite and connects its magnitude to the net moment, with conductivity peaks at magnon gaps tunable by DMI and anisotropy.", "ai_in_scope": true, "relevance_reason": "This is condensed-matter theory of an antiferromagnetic material, predicting how its magnetic order and magnon modes produce non-reciprocal optical conductivity.", "relevance_method": "semantic", "relevance_score": 72, "feature_candidate": false, "summary_zh": "本研究计算了易平面倾斜反铁磁赤铁矿在 GHz 至 THz 频段的带隙内光学响应与非互易性。研究发现，倾斜产生的净磁矩与非零霍尔电导相关，并评估了其潜在环行器响应。", "method_en": "The authors determine the classical canted ground state from a microscopic spin Hamiltonian, simulate magnons using linear spin-wave theory, and calculate polarizability and sub-gap optical conductivities with linear response. They use the resulting conductivities to compute a nonreciprocal circulator transmission amplitude.", "method_zh": "作者从微观自旋哈密顿量确定经典倾斜基态，以线性自旋波理论模拟磁振子，并通过线性响应计算极化率和带隙内光学电 phase of perovskite oxide NaNbO$_3$. Employing a group-theoretic classification, we introduce eight unique classes of domain walls in the $R3c$ structure, four of which have a domain wall orientation determined uniquely by the conditions of elastic compatibility and charge neutrality, and perform structural relaxations for each representative domain wall class. We find that one class of 109° domain walls has a notably low energy of 9 mJ m$^{-2}$, comparable to the low-energy ferroelectric walls in BaTiO$_3$. Finally, we find that this class of 109° walls is compatible with the crystal twinning observed in experiments on the $R3c$ phase, and propose an atomistic mechanism for the $R3c \\leftrightarrow Pbcm$ phase transition.", "method": "", "result": "", "future": "", "physics_advance": "It classifies eight domain-wall types in rhombohedral NaNbO₃, identifies a low-energy 109° wall compatible with observed twinning, and proposes an atomistic mechanism for the R3c-to-Pbcm transition.", "ai_in_scope": true, "relevance_reason": "This first-principles study investigates domain-wall energetics and structural transformations in a condensed-matter oxide.", "relevance_method": "semantic", "relevance_score": 73, "feature_candidate": false, "summary_zh": "这项第一性原理研究对 NaNbO₃ 低温 R3c 相中的结构畴壁进行分类和考察。", "method_en": "Using group theory, the authors identify eight domain-wall classes, derive unique orientations for four from elastic compatibility and charge neutrality, and relax representative structures.", "method_zh": "作者运用群论识别出八类畴壁，并依据弹性相容性和电荷中性条件确定其中四类的唯一取向，再对各类代表结构进行弛豫。", "result_en": "One 109° wall class has a calculated energy of 9 mJ m⁻², comparable to low-energy ferroelectric walls in BaTiO₃; the authors also find it compatible with observed crystal twinning and propose an atomistic mechanism for the R3c↔Pbcm transition.", "result_zh": "一类 109° 畴壁的计算能量为 9 mJ m⁻²，与 BaTiO₃ 中低能铁电畴壁相当；作者还指出它与实验观察到的晶体孪晶相容，并提出 R3c↔Pbcm 相变的原子机制。", "future_en": "Experimental characterization of the vestigate these effects in La-doped BaTiO3 using density functional theory, density-functional perturbation theory, and the Berry-phase formalism for polarization. For a model with 12.5% La substitution at the Ba site, La incorporation induces anisotropic lattice contraction, reduces tetragonality and Ti off-centering, and weakens the energetic stabilization of the tetragonal ferroelectric phase. The accompanying reduction in polarization is associated with enhanced electronic screening and reduced anomalous Born effective charges. Phonon calculations indicate that the relaxed doped structure is dynamically stable, while hardening of a low-frequency polar mode is consistent with weakened ferroelectricity. The high-frequency dielectric response increases moderately, whereas the static dielectric response decreases as the lattice contribution is suppressed. Electronic-structure calculations show a Fermi-level shift toward the conduction band without mid-gap defect states. The optical spectra exhibit an absorption-edge shift consistent with a Burstein-Moss-type mechanism, enhanced near-edge transparency, and reduced birefringence. Together, these results suggest a microscopic connection between donor-induced screening, polar-mode hardening, reduced dynamical charges, polarization suppression, and decreased optical anisotropy. The conclusions apply to the investigated 12.5% composition; calculations at additional concentrations are needed to establish quantitative doping trends.", "method": "", "result": "", "future": "", "physics_advance": "For 12.5% La substitution in BaTiO3, enhanced electronic screening and reduced anomalous Born charges accompany weaker Ti off-centering, a hardened polar mode, and suppressed polarization and optical anisotropy.", "ai_in_scope": true, "relevance_reason": "The calculations address how donor doping changes ferroelectric lattice, dielectric, and electronic properties in a solid-state material, though the result is limited to one modeled composition.", "relevance_method": "semantic", "relevance_score": 58, "feature_candidate": false, "summary_zh": "这项研究通过第一性原理计算考察 Ba 位 12.5% La 替代对 BaTiO₃ 结构、铁电、介电、电子和光学性质的耦合影响。", "method_en": "The authors combine density functional theory, density-functional perturbation theory, and Berry-phase polarization calculations for the specified doped composition.", "method_zh": "作者针对所研究的掺杂组分，结合密度泛函理论、密度泛函微扰理论和 Berry 相位极化计算。", "result_en": "La substitution contracts the lattice anisotropically, reduces tetragonality, Ti off-centering, and polarization, and hardens a low-frequency polar mode; the calculations also find a moderately increased high-frequency dielectric response but a reduced static response, a conduction-band-directed Fermi-level shift without mid-gap defect states, a Burstein–Moss-type absorption-edge shift, increased near-edge transparency, and reduced birefringence.", "result_zh": "La 替代导致晶格各向异性收缩，并降低四方畸变、Ti 离心位移和极化，同时使低频极化模硬化；计算还显示高频介电响应适度增强而静态响应降低、费米能级向导带移动但没有带隙中缺陷态、吸收边发生 Burstein–Moss 型位移、近带边透明度提高且双折射减弱。", "future_en": "Calculations at additional La concentrations are needed to establish quantitative doping trends, as the abstract explicitly notes; experimental measurements could test the predicted dielectric and optical changes.", "future_zh": "正如摘要所指出的，还需计算更多 La 浓度以确定定量掺杂趋势；实验测量则可检验所预测的介电和光学变化。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The abstract presents a broad, internally connected set of predictions for a technologically relevant oxide, but the evidence is limited to one modeled concentration and computational results, making a specialist materials-physics tier the best fit.", "tier_reason_zh": "摘要针对具有应用意义的氧化物提出了一组相互关联的预测，但证据仅限于一个模型浓度和计算结果，因此专业材料物理期刊层级较为合适。"}, {"id": "arxiv-2602-12944", "arxiv_id": "2602.12944", "type": "arXiv", "journal": "arXiv:2602.12944", "journal_ref": "", "title": "Electrostatic edge effects versus edge doping in graphene nanoribbons: a scanning gate microscopy and modelling study", "authors": "Colm Durkan, Xiao Liu, Ed Saunders", "corresponding": "", "url": "https://arxiv.org/abs/2602.12944", "topic": "Other Condensed Matter", "level": "Feature", "summary_en": "The study re-examines width-dependent charge-neutrality-point shifts in oxygen-plasma-patterned graphene nanoribbons and finds that gate-field fringing explains most of the trend, rather than intrinsic n-type edges. Its combined modeling, capacitance analysis, and scanning-gate measurements identify a smaller, device-dependent edge-charge contribution.", "summary": "The charge neutrality point (CNP) of graphene nanoribbons (GNRs) patterned by oxygen plasma etching moves towards zero as the ribbon narrows and, on 300 nm SiO2, changes sign below a crossover width of ~ 50 nm: an observation previously attributed to n-type edges surrounding a p-type bulk. We test this edge-doping hypothesis in three ways. First, finite element modelling of complete GNR transistor", "abstract": "The charge neutrality point (CNP) of graphene nanoribbons (GNRs) patterned by oxygen plasma etching moves towards zero as the ribbon narrows and, on 300 nm SiO2, changes sign below a crossover width of ~ 50 nm: an observation previously attributed to n-type edges surrounding a p-type bulk. We test this edge-doping hypothesis in three ways. First, finite element modelling of complete GNR transistors with uniform doping shows that fringing of the gate field at the edges reproduces the trend of the measured CNP with width down to ~ 50nm without any edge doping, while producing a bias-dependent inversion of the carrier type at the edges that mimics n-type edges in scanned-probe measurements. Second, fitting the CNP of ribbons on 90 nm and 300 nm SiO2 with the gate capacitance of a finite strip, which fixes the electrostatic contribution with no adjustable parameter other than the bulk doping, shows that fringing accounts for most of the width dependence and isolates the remainder as an edge charge. This is acceptor-like (0.24 e/nm per edge) in the present ribbons, which therefore have no n-type edges, and donor-like but small in devices on 300 nm SiO2; no single edge-charge, field-coupled or contact-doping mechanism describes both. Third, scanning gate microscopy finds no edge contrast of the sign expected for n-type edges. The width dependence of the CNP is therefore predominantly electrostatic, and n-type edges are not an intrinsic consequence of oxygen-plasma etching. A design map shows that fringing dominates the width dependence whenever the gate dielectric is thicker than 30-50 nm, whereas in scaled high-K transistors, edge charge dominates and would shift the threshold voltage of a 10 nm ribbon by ~ 0.1-0.15 V. Fitting the CNP versus width with the strip capacitance provides a simple test for edge doping in any gated two-dimensional nanostructure", "method": "", "result": "", "future": "", "physics_advance": "Gate-field fringing explains most of the width-dependent charge-neutrality-point shift and can mimic n-type edge signatures, while the measured edge charge in these ribbons is acceptor-like rather than n-type.", "ai_in_scope": true, "relevance_reason": "Measurements and modeling in graphene nanoribbons identify the physical origins of width-dependent charge-neutrality shifts, making this a credible, focused advance in two-dimensional electronic materials.", "relevance_method": "semantic", "relevance_score": 64, "feature_candidate": true, "summary_zh": "本研究重新考察氧等离子体刻蚀石墨烯纳米带中电荷中性点随宽度变化的现象，发现栅极电场边缘效应解释了其中大部分趋势，而非本征 n 型边缘。建模、电容分析和扫描门显微测量共同表明，边缘电荷的贡献较小且依赖器件条件。", "method_en": "Finite-element modeling of complete transistors with uniform doping tests whether gate-field fringing can reproduce the observed width dependence; fitting finite-strip gate capacitance separates electrostatic effects from edge charge. Scanning gate microscopy independently tests for the expected signal of n-type edges.", "method_zh": "研究对均匀掺杂的完整晶体管进行有限元建模，以检验栅极电场边缘效应能否再现观测到的宽度依赖；通过拟合有限宽条带的栅极电容，区分静电效应与边缘电荷。另以扫描门显微术独立检验 n 型边缘应有的信号。", "result_en": "Uniform-doping electrostatic modeling reproduces the charge-neutrality-point trend down to ribbon widths of about 50 nm and can generate a bias-dependent edge carrier-type inversion that mimics n-type edges in probe measurements. For the studied ribbons, the remaining fitted edge charge is acceptor-like, at 0.24 e/nm per edge, so the authors conclude that these ribbons do not have n-type edges; devices on 300 nm SiO₂ instead show a small donor-like edge charge. Scanning gate microscopy finds no edge contrast with the sign expected for n-type edges. The design analysis finds fringing dominates the width dependence when the gate dielectric is thicker than 30–50 nm, whereas in scaled high-K transistors edge charge dominates and would shift the threshold voltage of a 10 nm ribbon by about 0.1–0.15 V.", "result_zh": "均匀掺杂的静电模型可再现宽度低至约 50 nm 的纳米带电荷中性点趋势，并能产生随偏压变化的边缘载流子类型反转，从而在探针测量中模拟 n 型边缘。对所研究的纳米带，拟合得到的剩余边缘电荷为受主型，每条边缘为 0.24 e/nm，因此作者认为这些纳米带并无 n 型边缘；而在 300 nm SiO₂ 上的器件中，边缘电荷较小且为施主型。扫描门显微术未发现符号符合 n 型边缘预期的边缘对比信号。设计分析表明，当栅介质厚于 30–50 nm 时，边缘电场效应主导宽度依赖；而在缩放的高介电常数晶体管中，边缘电荷占主导，并可使 10 nm 纳米带的阈值电压移动约 0.1–0.15 V。", "future_en": "The authors present fitting the charge-neutrality point versus width with strip capacitance as a simple test for edge doping in gated two-dimensional nanostructures. Their design map also identifies when electrostatic fringing or edge charge is expected to dominate, including the estimated threshold-voltage shift for a 10 nm ribbon.", "future_zh": "作者提出，将电荷中性点随宽度的变化拟合到条带电容，是检验栅控二维纳米结构中边缘掺杂的简便方法。其设计图还指出了静电边缘效应或边缘电荷分别占主导的条件，并给出了 10 nm 纳米带的阈值电压移动估计。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work combines complementary modeling and scanning-probe evidence to resolve a focused electrostatic interpretation question, with useful quantitative design implications; the abstract does not indicate the broader conceptual reach or advance warranting a higher tier.", "tier_reason_zh": "该工作结合互补的建模与扫描探针证据，厘清了一个范围明确的静电解释问题，并给出有用的定量设计启示；摘要所述成果尚未显示出足以支持更高档次的广泛概念影响或突破。"}, {"id": "arxiv-2501-14017", "arxiv_id": "2501.14017", "type": "arXiv", "journal": "arXiv:2501.14017", "journal_ref": "", "title": "Exact few-magnon Bethe scars of the non-integrable alternating Heisenberg chain", "authors": "Ronald Melendrez, Bhaskar Mukherjee, Marcin Szyniszewski, Christopher J. Turner, Arijeet Pal, Hitesh J. Changlani", "corresponding": "", "url": "https://arxiv.org/abs/2501.14017", "topic": "Superconductivity", "level": "Brief", "summary_en": "This work identifies exact few-magnon scar states in the non-integrable alternating ferromagnetic–antiferromagnetic Heisenberg chain and relates them to modified Bethe-ansatz constructions.", "summary": "Exact solutions of quantum lattice models serve as useful guides for interpreting physical phenomena in condensed matter systems. Prominent examples of integrability appear in one dimension, including the Heisenberg chain, where the Bethe ansatz method has been widely successful. Recent work has noted that certain non-integrable models harbor quantum many-body scar states, which form a superspin o", "abstract": "Exact solutions of quantum lattice models serve as useful guides for interpreting physical phenomena in condensed matter systems. Prominent examples of integrability appear in one dimension, including the Heisenberg chain, where the Bethe ansatz method has been widely successful. Recent work has noted that certain non-integrable models harbor quantum many-body scar states, which form a superspin of regular states hidden in an otherwise chaotic spectrum. Here we consider one of the simplest examples of a non-integrable model, the alternating ferromagnetic-antiferromagnetic (bond-staggered) Heisenberg chain, a close cousin of the spin-1 Haldane chain and a spin analog of the Su-Schrieffer-Heeger model, and show the presence of exponentially many zero-energy states. We highlight features of the alternating chain that allow treatment with the coordinate Bethe ansatz (with important modifications), and surprisingly, for a non-integrable system, we find simple compact expressions for zero-energy eigenfunctions for a few magnons, including solutions with fractionalized particle momentum. These states exhibit wavefunction scarring similar to that of single-particle states in chaotic billiards. We discuss a general numerical recipe to diagnose the existence of such generalized Bethe ansatz (GBA) scar states and also provide exact analytic expressions for their entanglement. We conclude by conjecturing a picture of magnon pairing which may generalize to multiple magnons. Our work opens the avenue to describe certain eigenstates of partially integrable systems using the GBA.", "method": "", "result": "", "future": "", "physics_advance": "Finds exponentially many zero-energy states and compact few-magnon scar eigenfunctions, including fractionalized-momentum solutions, in the alternating Heisenberg chain.", "ai_in_scope": true, "relevance_reason": "This develops exact results for many-body eigenstates and magnon excitations in a non-integrable quantum spin chain.", "relevance_method": "semantic", "relevance_score": 80, "feature_candidate": false, "summary_zh": "这项工作在非可积的交替铁磁—反铁磁 Heisenberg 链中识别出精确的少磁振子 scar 态，并将其与经过修改的 Bethe ansatz 构造联系起来。", "method_en": "The authors adapt the coordinate Bethe ansatz to the alternating chain, derive compact few-magnon eigenfunctions, and provide a numerical diagnostic recipe and analytic entanglement expressions for generalized Bethe-ansatz scar states.", "method_zh": "作者将坐标 Bethe ansatz 推广至交替链，推导紧凑形式的少磁振子本征波函数，并给出广义 Bethe ansatz scar 态的数值诊断方案和解析纠缠表达式。", "result_en": "The chain is shown to host exponentially many zero-energy states, including few-magnon solutions with fractionalized particle momentum; these states exhibit scarring, and the authors conjecture a magnon-pairing picture that may extend to multiple magnons.", "result_zh": "研究表明该链具有指数多的零能态，其中包括具有分数化粒子动量的少磁振子解；这些态呈现 scar 特征，作者还猜想一种可能推广至多磁振子的磁振子配对图景。", "future_en": "Further work could test the conjectured pairing picture for multiple magnons and apply the proposed generalized Bethe-ansatz diagnostics to other partially integrable systems.", "future_zh": "后续研究可检验针对多磁振子的配对猜想，并将所提出的广义 Bethe ansatz 诊断方法应用于其他部分可积系统。", "tier": "PRL", "tier_reason_en": "The exact scar solutions, exponentially many zero-energy states, fractionalized momenta, and analytic entanglement results constitute a compact conceptual advance in non-integrable quantum dynamics, supporting a strong short-format physics tier.", "tier_reason_zh": "精确 scar 解、指数多零能态、分数化动量以及解析纠缠结果共同构成了对非可积量子动力学的集中概念性推进，足以支持较高水平的短篇物理期刊层级。"}, {"id": "arxiv-2606-21507", "arxiv_id": "2606.21507", "type": "arXiv", "journal": "arXiv:2606.21507", "journal_ref": "Liu W, Natale G, Farhang C, et al. Nontrivial Boundary-Mediated Superconducting Transport in a TRSB Topological Iron-Based Superconductor. Phys. Rev. X 16, 041022(2026)", "title": "Nontrivial Boundary-Mediated Superconducting Transport in a TRSB Topological Iron-Based Superconductor", "authors": "Wenyao Liu, Gabriel Natale, Camron Farhang, Michael Geiwitz, Qishuo Tan, Xingyao Guo, Mason Gray, Vincent LambertiJazzmin Victorin, Huairuo Zhang, James L. Hart, Vsevolod Belosevich, Xi Ling, Qiong Ma, Wan Kyu Park, Kenji Watanabe, Takashi Taniguchi, Judy J. Cha, Albert V. Davydov, Kin Chung Fong, Ethan Arnault, Genda Gu, Rui-Xing Zhang, Enrico Rossi, Jing Xia, Kenneth S. Burch", "corresponding": "", "url": "https://arxiv.org/abs/2606.21507", "topic": "Superconductivity", "level": "Feature", "summary_en": "This study reports evidence for boundary-mediated superconducting transport in FeTe₀.₅₅Se₀.₄₅, where superconductivity, nontrivial band topology, and spontaneous time-reversal-symmetry breaking (TRSB) coexist. The transport signatures depend on composition, edge geometry, and the temperature scale associated with TRSB.", "summary": "The interplay of superconductivity, band topology, and spontaneous time-reversal-symmetry breaking (TRSB) is expected to enable topological superconducting boundary states. FeTe0.55Se0.45 provides a promising single-material platform because it combines superconductivity, nontrivial band topology, and spontaneous magnetization in the superconducting state. Here we report evidence for a boundary-me", "abstract": "The interplay of superconductivity, band topology, and spontaneous time-reversal-symmetry breaking (TRSB) is expected to enable topological superconducting boundary states. FeTe0.55Se0.45 provides a promising single-material platform because it combines superconductivity, nontrivial band topology, and spontaneous magnetization in the superconducting state. Here we report evidence for a boundary-mediated superconducting transport response in exfoliated Fe(Te,Se) devices. Polar Kerr measurements show that TRSB emerges below TKerr < Tc and coexists with superconductivity across multiple compositions, providing an independent symmetry-breaking scale for transport. Using crystallographically sharp, continuous edges and side-surface-dominant contacts, we find that topological FeTe0.55Se0.45 exhibits an anomalous conductance plateau absent in topologically trivial FeTe0.40Se0.60 and Fe1.02Te0.55Se0.45 under comparable measurements. This plateau requires uninterrupted sharp edges connecting source and drain, persists over micrometer-scale separations far exceeding the bulk coherence length, shows strongly suppressed thermal broadening, and collapses when the drain is moved to the top surface. Its temperature evolution follows the TRSB scale: the plateau remains weakly broadened below T*Kerr and disappears near TKerr rather than Tc. These doping-selective, edge-geometry-dependent, TRSB-correlated, and long-range nonlocal signatures establish experimental criteria for identifying boundary-mediated superconducting transport in FeTe0.55Se0.45 and motivate phase-sensitive and theoretical studies of its microscopic origin.", "method": "", "result": "", "future": "", "physics_advance": "In FeTe0.55Se0.45, an anomalous long-range, edge-mediated superconducting conductance plateau is associated with the TRSB temperature scale and absent in the compared topologically trivial compositions.", "ai_in_scope": true, "relevance_reason": "This experimental study probes superconducting transport and symmetry breaking in a condensed-matter material, reporting a distinctive edge-geometry-dependent response.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": true, "summary_zh": "本研究报告了 FeTe₀.₅₅Se₀.₄₅ 中边界介导超导输运的证据；该材料同时具有超导性、非平庸能带拓扑和自发时间反演对称性破缺（TRSB）。输运特征取决于材料组分、边缘几何以及与 TRSB 相关的温度尺度。", "method_en": "Polar Kerr measurements were used to identify the onset of TRSB across multiple compositions, and transport was measured in exfoliated devices with crystallographically sharp, continuous edges and side-surface-dominant contacts. Comparisons included topological FeTe₀.₅₅Se₀.₄₅ and two topologically trivial compositions, as well as changes in edge continuity, contact surface, separation, and temperature.", "method_zh": "研究通过极向克尔测量确定多个组分中 TRSB 的出现，并在具有晶体学上锋利且连续边缘、以侧表面接触为主的剥离器件中测量输运。比较对象包括拓扑非平庸的 FeTe₀.₅₅Se₀.₄₅ 和两种拓扑平庸组分，同时考察边缘连续性、接触表面、间距及温度的影响。", "result_en": "A conductance plateau is observed in topological FeTe₀.₅₅Se₀.₄₅ but not in the two topologically trivial compositions under comparable measurements. The plateau requires uninterrupted sharp edges connecting source and drain, persists over micrometer-scale separations well beyond the bulk coherence length, and is strongly broadened less by temperature than expected for ordinary bulk transport. It collapses when the drain contact is moved to the top surface, and its temperature evolution tracks the TRSB scale: it remains weakly broadened below T*Kerr and disappears near TKerr rather than Tc. Together, the composition selectivity, edge-geometry dependence, long-range nonlocality, and correlation with TRSB support boundary-mediated superconducting transport.", "result_zh": "在拓扑非平庸的 FeTe₀.₅₅Se₀.₄₅ 中观察到电导平台，而在相同测量条件下的两种拓扑平庸组分中未观察到该平台。平台要求源极与漏极之间存在不间断的锋利边缘；即使两者相距数微米、远超体相相干长度，平台仍可存在，且其热展宽受到显著抑制。将漏极移至顶表面后，平台会消失；其温度演化与 TRSB 温标相符：低于 T*Kerr 时仅略有展宽，并在接近 TKerr 而非 Tc 时消失。组分选择性、对边缘几何的依赖、长程非局域性及与 TRSB 的关联共同支持边界介导超导输运的解释。", "future_en": "The authors propose phase-sensitive measurements and theoretical studies to investigate the microscopic origin of the reported transport. The identified composition, geometry, nonlocality, and TRSB-related temperature dependence provide experimental criteria for further tests of boundary-mediated transport.", "future_zh": "作者提出开展相位敏感测量和理论研究，以探究所报告输运现象的微观起源。所识别的组分、几何、非局域性及与 TRSB 相关的温度依赖，为进一步检验边界介导输运提供了实验判据。"}, {"id": "arxiv-2605-26233", "arxiv_id": "2605.26233", "type": "arXiv", "journal": "arXiv:2605.26233", "journal_ref": "Phys. Rev. B 114, 194511 (2026)", "title": "Slave-boson Formalism for Superconducting Pairing at Strong Coupling", "authors": "Sarbajit Mazumdar, Jonas Issing, Jannis Seufert, David Riegler, Peter Wölfle, Ronny Thomale, Michael Klett", "corresponding": "", "url": "https://arxiv.org/abs/2605.26233", "topic": "Superconductivity", "level": "Brief", "summary_en": "This work develops a spin-rotation-invariant Kotliar–Ruckenstein slave-boson approach to superconducting pairing in the one-band Hubbard model at strong coupling.", "summary": "We study the emergence of superconductivity in the one-band Hubbard model using the spin-rotation-invariant Kotliar-Ruckenstein slave-boson (SB) approach. Motivated by its intrinsically renormalized mean-field ground state, we construct an effective pairing vertex from dynamical fluctuations about the saddle point. Solving the anisotropic, frequency-dependent gap equation on the square lattice, we", "abstract": "We study the emergence of superconductivity in the one-band Hubbard model using the spin-rotation-invariant Kotliar-Ruckenstein slave-boson (SB) approach. Motivated by its intrinsically renormalized mean-field ground state, we construct an effective pairing vertex from dynamical fluctuations about the saddle point. Solving the anisotropic, frequency-dependent gap equation on the square lattice, we map the pairing instabilities across doping, interaction, temperature and real-frequency gap structure that qualitatively match experimental cuprate observations. This framework merges strong-correlation SB-type renormalizations with RPA-type pairing transparency, providing a scalable route to modeling multi-orbital superconductivity at strong coupling.", "method": "", "result": "", "future": "", "physics_advance": "Constructs a dynamical pairing vertex from fluctuations around a spin-rotation-invariant slave-boson saddle point and maps superconducting instabilities across doping, interaction, and temperature.", "ai_in_scope": true, "relevance_reason": "This is a theoretical study of pairing in the Hubbard model, but its main advance is a modeling framework and broad instability mapping rather than a clearly isolated new material phenomenon.", "relevance_method": "semantic", "relevance_score": 67, "feature_candidate": false, "summary_zh": "这项工作发展了一种自旋旋转不变的 Kotliar–Ruckenstein slave-boson 方法，用于研究强耦合单带 Hubbard 模型中的超导配对。", "method_en": "The authors construct an effective pairing vertex from dynamical fluctuations around the slave-boson saddle point and solve an anisotropic, frequency-dependent gap equation on the square lattice.", "method_zh": "作者从 slave-boson 鞍点附近的动力学涨落构造有效配对顶角，并在正方晶格上求解各向异性、含频率依赖的能隙方程。", "result_en": "The resulting pairing instabilities across doping, interaction, temperature, and real-frequency gap structure qualitatively match experimental observations in cuprates, and the framework combines strong-correlation renormalization with RPA-like pairing transparency.", "result_zh": "所得配对不稳定性随掺杂、相互作用、温度和实频能隙结构的变化，在定性上与铜氧化物实验观察相符；该框架结合了强关联重整化与类似 RPA 的配对分析透明度。", "future_en": "The proposed framework could be tested against additional cuprate observables and extended to multi-orbital systems, which the authors identify as a potential application.", "future_zh": "可通过更多铜氧化物观测量检验该框架，并将其扩展至多轨道体系，这是作者指出的潜在应用方向。"}, {"id": "arxiv-2607-13294", "arxiv_id": "2607.13294", "type": "arXiv", "journal": "arXiv:2607.13294", "journal_ref": "Phys. Rev. Research 8, 043069 (2026)", "title": "Electronic properties and topological aspects of graphene nanohelicoids", "authors": "Xiaoqian Liu, Arsen Herasymchuk, Yaroslav Zhumagulov, Oleg V. Yazyev", "corresponding": "", "url": "https://arxiv.org/abs/2607.13294", "topic": "Topology & Transport", "level": "Brief", "summary_en": "This work introduces graphene nanohelicoids and studies how their width and edge orientation shape their electronic bands and one-dimensional topological indices.", "summary": "We introduce graphene nanohelicoids, geometric analogs of graphene nanoribbons, in which the honeycomb lattice is embedded on a helicoidal surface. Starting from the three-dimensional helical structure, we construct effective one-dimensional lattice models with band structures characterized by a momentum-shifted particle-hole relation $E_v(k)=-E_c(k+π)$ that reflects an antichiral symmetry arising", "abstract": "We introduce graphene nanohelicoids, geometric analogs of graphene nanoribbons, in which the honeycomb lattice is embedded on a helicoidal surface. Starting from the three-dimensional helical structure, we construct effective one-dimensional lattice models with band structures characterized by a momentum-shifted particle-hole relation $E_v(k)=-E_c(k+π)$ that reflects an antichiral symmetry arising from the nonsymmorphic symmetry. A systematic investigation of graphene nanohelicoids using the tight-binding approximation reveals a number of trends upon varying width and edge orientation, for instance, alternating transitions between semiconducting and metallic regimes. As the structure width varies, the band gap periodically closes and reopens, accompanied by an alternating Zak phase that switches between trivial and nontrivial. Using
