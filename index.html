url": "https://arxiv.org/abs/2502.18933", "topic": "Magnetism", "level": "Brief", "summary_en": "Using frequency- and time-domain THz spectroscopy, the authors observe an antiferromagnetic resonance magnon mode at 3.5 meV in bulk α-MnTe and estimate the out-of-plane single-ion magnetic anisotropy as (40 ± 10) μeV.", "summary": "Antiferromagnetic resonance in a bulk $α$-MnTe crystal is investigated using both frequency-domain and time-domain THz spectroscopy techniques. At low temperatures, an excitation at the photon energy of $(3.5\\pm 0.1)$~meV is observed and identified as a magnon mode through its distinctive dependence on temperature and magnetic field. This behavior is reproduced using a simplified model for antifer", "abstract": "Antiferromagnetic resonance in a bulk $α$-MnTe crystal is investigated using both frequency-domain and time-domain THz spectroscopy techniques. At low temperatures, an excitation at the photon energy of $(3.5\\pm 0.1)$~meV is observed and identified as a magnon mode through its distinctive dependence on temperature and magnetic field. This behavior is reproduced using a simplified model for antiferromagnetic resonance in an easy-plane antiferromagnet. The results of our experiments, when compared to exchange constants established in the literature, allow us to extract the out-of-plane component of the single-ion magnetic anisotropy reaching $(40\\pm10)$~$μ$eV.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "通过频域和时域太赫兹光谱技术，实测α-MnTe块体中3.5 meV的反铁磁共振模式，并分析出单离子磁各向异性垂直分量为(40 ± 10) μeV。", "method_en": "The experimental approach combines frequency-domain and time-domain THz spectroscopy, supported by a simplified easy-plane antiferromagnet resonance model.", "method_zh": "实验采用频域与时域太赫兹光谱技术，结合简化的易平面反铁磁共振模型进行分析。", "result_en": "The measured resonance energy and its temperature and magnetic field dependence match the model predictions, enabling extraction of magnetic anisotropy parameters consistent with literature exchange constants.", "result_zh": "实测共振能量及其温度、磁场依赖符合模型，结合交换常数推断磁各向异性参数。", "future_en": "These results pave the way for deeper understanding and control of spin dynamics in MnTe and related antiferromagnetic materials.", "future_zh": "研究为深入理解及调控MnTe及类似反铁磁材料的自旋动力学提供实验依据。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2603-24187", "arxiv_id": "2603.24187", "type": "arXiv", "journal": "arXiv:2603.24187", "journal_ref": "", "title": "Dipole-exchange spin waves and mode hybridization in magnetic nanoparticles", "authors": "Fedor Shuklin, Khristina Albitskaya, Sergei Solovyov, Alexander Chernov, Mihail Petrov", "corresponding": "", "url": "https://arxiv.org/abs/2603.24187", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper investigates spin-wave modes and hybridization in confined ferromagnetic resonators with spherical and cylindrical geometry, analyzing the effects of exchange and dipolar interactions.", "summary": "We investigate spin-wave modes in confined ferromagnetic resonators with spherical and cylindrical geometries across the exchange-dominated, dipole-exchange, and dipolar interaction regimes. Starting from the linearized Landau-Lifshitz-Gilbert equation, we show that the projection of the total angular momentum and mirror parity are conserved quantities in the problem of axially symmetric resonator", "abstract": "We investigate spin-wave modes in confined ferromagnetic resonators with spherical and cylindrical geometries across the exchange-dominated, dipole-exchange, and dipolar interaction regimes. Starting from the linearized Landau-Lifshitz-Gilbert equation, we show that the projection of the total angular momentum and mirror parity are conserved quantities in the problem of axially symmetric resonators. These symmetries provide a natural classification of spin-wave modes and explain the degeneracy of exchange modes, as well as its lifting by dipolar interactions. Numerical analysis shows that the nonlocal dipolar interaction removes the exchange degeneracy and hybridizes modes, leading to avoided crossings between modes that belong to the same symmetry sector. To describe this behavior, we develop a coupled-mode theory formulated directly in terms of dynamical magnetization, which reduces the dipole-exchange problem to a finite system of interacting modes. The resulting framework provides a unified description of spin-wave spectra in confined magnetic particles from the exchange limit to the dipolar regime.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本文研究了球形和圆柱形受限铁磁谐振器中的自旋波模态及其混合，分析交换与偶极相互作用的影响。", "method_en": "Using the linearized Landau-Lifshitz-Gilbert equation, conserved symmetries like angular momentum projection and mirror parity classify modes; a coupled-mode theory in dynamical magnetization captures mode hybridization.", "method_zh": "应用线性化Landau-Lifshitz-Gilbert方程，利用角动量投影和镜像对称性分类模态；构建耦合模态理论描述模式混合。", "result_en": "They find dipolar interactions lift exchange mode degeneracy and produce avoided crossings by hybridizing modes within symmetry sectors, unifying spin-wave spectra descriptions from exchange to dipolar regimes.", "result_zh": "研究发现偶极相互作用解除了交换态简并，导致同对称区间内模式混合与反交叉，实现了从交换到偶极极限的自旋波谱统一描述。", "future_en": "This framework could be extended to other geometries and materials to further understand spin-wave phenomena in nanoscale magnetic resonators.", "future_zh": "该框架可扩展至其他几何结构和材料，深化对纳米磁共振器自旋波现象的理解。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2607-10091", "arxiv_id": "2607.10091", "type": "arXiv", "journal": "arXiv:2607.10091", "journal_ref": "", "title": "Dynamical Nonrelativistic Spin Splitting via THz Nonlinear Phononics", "authors": "Linding Yuan, ChanJu You, Ankit Disa, James M. Rondinelli", "corresponding": "", "url": "https://arxiv.org/abs/2607.10091", "topic": "Magnetism", "level": "Brief", "summary_en": "This work demonstrates ultrafast, reversible control of nonrelativistic spin splitting (NRSS) in collinear antiferromagnets using THz laser pulses via nonlinear phononics, supported by density functional theory. It derives selection criteria for phonon modes that activate NRSS and illustrates NRSS creation and enhancement in NiO and LaFeO3 respectively.", "summary": "Nonrelativistic spin splitting (NRSS) in collinear antiferromagnets, including altermagnets and compensated ferrimagnets, offers a route to high-frequency spintronics immune to stray fields, but its dynamic control has remained elusive. We demonstrate, using density functional theory (DFT) and nonlinear phononics, that THz laser pulses can achieve ultrafast, reversible control of NRSS on picosecon", "abstract": "Nonrelativistic spin splitting (NRSS) in collinear antiferromagnets, including altermagnets and compensated ferrimagnets, offers a route to high-frequency spintronics immune to stray fields, but its dynamic control has remained elusive. We demonstrate, using density functional theory (DFT) and nonlinear phononics, that THz laser pulses can achieve ultrafast, reversible control of NRSS on picosecond timescales in antiferromagnets. We derive two mode-selection criteria, accounting for phonon and magnetic wavevector compatibility and inversion parity, to identify which phonon modes can activate NRSS. Our calculations illustrate the creation of NRSS in spin-degenerate NiO and the enhancement of existing splitting in LaFeO$_3$. While practical implementation depends on excitation conditions, lattice dynamics, and mode coupling, these results establish design principles for identifying materials with stronger and more accessible responses. Limitations imposed by driving fields, phonon damping, and anharmonic detuning motivate further materials screening based on accessible excitation strengths, lattice stability, resonance frequency matching, and favorable anharmonic coupling.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本文展示了通过THz激光脉冲利用非线性声子学实现对共线反铁磁体中非相对论自旋劈裂（NRSS）的超快可逆控制，并基于密度泛函理论进行支持。文章推导了激活NRSS的声子模式选择准则，并分别在NiO和LaFeO3中演示了NRSS的产生和增强。", "method_en": "The authors use density functional theory combined with nonlinear phononics to model how THz laser pulses interact with phonon modes in antiferromagnets. Two mode-selection criteria based on phonon and magnetic wavevector compatibility and inversion parity are derived to identify modes that can activate NRSS.", "method_zh": "作者结合密度泛函理论和非线性声子学模拟THz激光脉冲如何与反铁磁体中的声子模式相互作用。推导出基于声子与磁波矢量兼容性及反演奇偶性的两条模式选择准则，用于识别能够激活NRSS的声子模式。", "result_en": "Calculations show that NRSS can be dynamically created in spin-degenerate NiO and existing NRSS can be enhanced in LaFeO3. These findings establish design principles for materials with stronger NRSS responses while noting practical limitations such as phonon damping and anharmonic detuning.", "result_zh": "计算显示可在自旋简并的NiO中动态产生NRSS，并在LaFeO3中增强已存在的NRSS。研究结果为寻找具有更强NRSS响应的材料确立了设计原则，同时指出实际应用受声子阻尼和非简谐失谐等限制。", "future_en": "Future efforts should focus on material screening considering excitation strengths, lattice stability, resonance frequency matching, and anharmonic coupling to overcome limitations imposed by driving fields and phonon dynamics, facilitating practical realization of dynamic NRSS control.", "future_zh": "未来应集中于材料筛选，考虑激发强度、晶格稳定性、共振频率匹配及非简谐耦合，以克服驱动场和声子动力学带来的限制，促进动态NRSS控制的实际实现。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2511-19389", "arxiv_id": "2511.19389", "type": "arXiv", "journal": "arXiv:2511.19389", "journal_ref": "Phys. Rev. B 114, 225131 (2026)", "title": "Kondo screening and random-singlet formation in highly disordered systems", "authors": "Lucas G. Rabelo, Igor C. Almeida, Eduardo Miranda, Vladimir Dobrosavljević, Eric C. Andrade", "corresponding": "", "url": "https://arxiv.org/abs/2511.19389", "topic": "Magnetism", "level": "Brief", "summary_en": "A minimal effective framework is presented to capture anomalous low-temperature thermodynamics in strongly disordered systems near metal-insulator transitions by modeling competition between Kondo screening and random-singlet formation.", "summary": "We introduce a minimal effective framework designed to address the anomalous low-temperature thermodynamics observed in strongly disordered interacting systems near a metal-insulator transition, such as doped semiconductors. Our approach examines how a strongly inhomogeneous electronic bath quenches dilute pairs of local magnetic moments. By solving the resulting two-impurity Kondo-Heisenberg prob", "abstract": "We introduce a minimal effective framework designed to address the anomalous low-temperature thermodynamics observed in strongly disordered interacting systems near a metal-insulator transition, such as doped semiconductors. Our approach examines how a strongly inhomogeneous electronic bath quenches dilute pairs of local magnetic moments. By solving the resulting two-impurity Kondo-Heisenberg problem within a large-$\\mathcal{N}$ variational framework, we capture the competition between Kondo screening and random-singlet formation. Both mechanisms give rise to singular thermodynamic responses, producing a magnetic susceptibility of the form $χ(T)\\sim T^{-α}$, where the exponent $α$ evolves smoothly with model parameters and saturates in the metallic regime, consistent with experimental observations. Our results establish a unified framework that connects random-singlet physics and disorder-induced Kondo screening in strongly disordered correlated materials.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "提出了一个简约有效框架，通过研究稀疏局部磁矩的两杂质Kondo-Heisenberg模型，捕获强无序体系近金属-绝缘体转变处异常低温热力学行为，体现Kondo筛选和随机单态形成的竞争。", "method_en": "The two-impurity Kondo-Heisenberg problem is solved within a large-N variational approach to capture singlet formation and Kondo screening effects, enabling predictions of singular magnetic susceptibilities across disorder regimes.", "method_zh": "利用large-N变分方法求解两杂质Kondo-Heisenberg问题，捕捉单态形成与Kondo筛选效应，预测无序体系中奇异磁化率行为。", "result_en": "Both Kondo and random-singlet mechanisms yield magnetic susceptibilities following $\u0003c7(T)  T^{-\u0003b1}$ with a continuously varying exponent \u0003b1 saturating in metallic phases, consistent with experiments on doped semiconductors.", "result_zh": "Kondo筛选和随机单态机制均导致磁化率$\u0003c7(T)  T^{-\u0003b1}$，指数\u0003b1随模型参数连续变化并在金属态趋稳，符合掺杂半导体实验。", "future_en": "This unified framework invites further studies connecting disorder-induced Kondo effects and random-singlet physics in correlated materials, potentially guiding interpretation of complex thermodynamics near metal-insulator transitions.", "future_zh": "该统一框架为深入探讨强关联材料中无序诱发的Kondo效应与随机单态物理相互关系提供理论基础，有助于解释金属-绝缘体转变附近的复杂热力学。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2607-07630", "arxiv_id": "2607.07630", "type": "arXiv", "journal": "arXiv:2607.07630", "journal_ref": "", "title": "Lattice dynamics and structural correlations in antiferromagnet SrLaCoNbO$_6$ double perovskite", "authors": "Ajay Kumar, Clemens Ulrich, Rajendra S. Dhaka", "corresponding": "", "url": "https://arxiv.org/abs/2607.07630", "topic": "Magnetism", "level": "Brief", "summary_en": "The study reports temperature-dependent Raman and EXAFS measurements revealing anomalous phonon behaviors and subtle local structural distortions in antiferromagnetic SrLaCoNbO6. Phonon anomalies occur around 60 K and 160–180 K, above the Neel temperature, linked to lattice dynamics and local structure.", "summary": "We report a detailed temperature-dependent Raman spectroscopy and Co $K$-edge extended x-ray absorption fine structure (EXAFS) study of the insulating antiferromagnetic double perovskite SrLaCoNbO$_6$. Interestingly, pronounced changes in the phonon frequencies, linewidths, and intensities are observed around 60~K, well above the long-range antiferromagnetic ordering temperature, $T_{\\rm N} \\appro", "abstract": "We report a detailed temperature-dependent Raman spectroscopy and Co $K$-edge extended x-ray absorption fine structure (EXAFS) study of the insulating antiferromagnetic double perovskite SrLaCoNbO$_6$. Interestingly, pronounced changes in the phonon frequencies, linewidths, and intensities are observed around 60~K, well above the long-range antiferromagnetic ordering temperature, $T_{\\rm N} \\approx 15$~K. These anomalies indicate a modification of the lattice dynamics that may involve local structural distortions, short-range magnetic correlations, or an interplay between them. Additional changes in both high- and low-energy Raman modes are detected near 160--180~K via variations in phonon intensities and linewidths, together with changes in the Fano asymmetry of selected low-energy modes. The asymmetric line shapes of these modes are well described phenomenologically by Fano profiles and indicate coupling of the discrete phonons to an underlying continuum, whose possible microscopic origins are discussed. Moreover, the EXAFS analysis reveals correlated changes in bond distances and Debye--Waller factors around the Co ions near 60~K and 160~K, indicating subtle local structural distortions at temperatures corresponding to the Raman anomalies. The combined Raman and EXAFS results therefore demonstrate a close correlation between anomalous lattice dynamics and local structural evolution in SrLaCoNbO$_6$.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本研究通过温度依赖的拉曼光谱和EXAFS测量，揭示了反铁磁SrLaCoNbO6中异常的声子行为和微妙的局域结构畸变。声子异常出现在60 K和160–180 K附近，高于Neel温度，反映晶格动力学和局域结构相关的变化。", "method_en": "Combined temperature-dependent Raman spectroscopy characterized phonon frequency, linewidth, intensity, and Fano asymmetry, while Co K-edge EXAFS provided bond distance and Debye–Waller factor information around Co ions.", "method_zh": "结合温度依赖的拉曼光谱测量声子的频率、线宽、强度和Fano不对称性，Co K边EXAFS分析Co离子周围的键长和Debye–Waller因子信息。", "result_en": "Pronounced phonon anomalies at 60 K and 160–180 K were linked to local structural distortions and changes in lattice dynamics, with Fano line shapes indicating phonon coupling to a continuum. EXAFS confirmed correlated bond and disorder changes near Co ions at those temperatures.", "result_zh": "60 K及160–180 K时显著的声子异常对应局域结构畸变和晶格动力学变化，Fano线形表明声子与连续态的耦合。EXAFS验证了Co离子附近键长及无序度的相关变化。", "future_en": "Future work can explore the microscopic origins of the coupled lattice and magnetic anomalies and their role in electronic and magnetic properties of SrLaCoNbO6 and related double perovskites.", "future_zh": "未来可进一步探索晶格与磁各向异性耦合的微观机理，以及其在SrLaCoNbO6及类似双钙钛矿材料电子和磁性质中的作用。", "tier": "Uncertain", "tier_reason_en": "This detailed experimental study combines vibrational and local structural probes to reveal lattice-magnetic coupling far above magnetic ordering, of interest to condensed matter and materials physics.", "tier_reason_zh": "该实验性研究结合振动光谱与局域结构探针，揭示磁序远高温下的晶格-磁耦合，对凝聚态物理和材料物理领域具有较高兴趣。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2605-21284", "arxiv_id": "2605.21284", "type": "arXiv", "journal": "arXiv:2605.21284", "journal_ref": "Physical Review B (2026)", "title": "Ligand-mediated Origin of Altermagnetic Spin-Splitting", "authors": "Luigi Camerano, Federico Bisti, Gianni Profeta", "corresponding": "", "url": "https://arxiv.org/abs/2605.21284", "topic": "Magnetism", "level": "Brief", "summary_en": "Using first-principles calculations and Wannier Hamiltonians, the authors identify ligand-mediated hybridization as the dominant microscopic mechanism of altermagnetic spin splitting in Co$_{1/4}$NbSe$_2$, rather than direct magnetic-ion hopping.", "summary": "Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitt", "abstract": "Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitting in the $g$-wave altermagnet Co$_{1/4}$NbSe$_2$. We show that the splitting is captured by a short-range tight-binding model, establishing its local origin. By selectively controlling hopping channels, we demonstrate that the dominant contribution arises not from direct magnetic-ion hopping, but from ligand-mediated hybridization that transfers anisotropy to itinerant states. This identifies ligand-assisted coupling as the key mechanism of altermagnetic spin splitting and provides a microscopic bridge between minimal models and symmetry guided first-principles material searches, enabling real-space design of altermagnetic functionality.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "通过第一性原理计算和Wannier哈密顿量构建，作者发现Co$_{1/4}$NbSe$_2$中的另类磁性自旋劈裂主要源自配体介导的杂化，而非直接磁离子间跃迁。", "method_en": "The study employs short-range tight-binding models selectively controlling hopping channels derived from first-principles to dissect the contributions to spin splitting, supported by Wannier Hamiltonian engineering.", "method_zh": "利用从第一性原理导出的短程紧束缚模型选择性控制跃迁通道，配合Wannier哈密顿量构建，解析自旋劈裂的微观成分。", "result_en": "The analysis shows that ligand-assisted coupling transfers anisotropy to itinerant states, providing a microscopic understanding that bridges minimal models and symmetry-based classifications of altermagnets.", "result_zh": "结果表明配体辅助耦合将各向异性传递给游离态，构建了微观机制，连接了简化模型与基于对称性的另类磁性材料分类。", "future_en": "This insight enables real-space design of altermagnetic properties by tuning ligand environments, facilitating targeted material searches and engineering for spintronic applications.", "future_zh": "该认识使通过调控配体环境实现另类磁性性能的实空间设计成为可能，助力定向材料搜索与自旋电子学应用工程。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2610-31206", "arxiv_id": "2610.31206", "type": "arXiv", "journal": "arXiv:2610.31206", "journal_ref": "", "title": "Mn-deficient Ni-Mn-Ga alloys: phase transitions, magnetic properties, and disappearance of martensitic transformation", "authors": "Valentina Moskvina, Jaroslav Čapek, Michal Rameš, Denys Musiienko, Petr Veřtát, Alexej Perevertov, Ladislav Straka, Oleg Heczko", "corresponding": "", "url": "https://arxiv.org/abs/2610.31206", "topic": "Magnetism", "level": "Brief", "summary_en": "This study uses Mn-deficient and near-stoichiometric Ni-Mn-Ga oligocrystals with composition gradients to systematically investigate composition-dependent phase transitions and magnetic properties, revealing abrupt transformation disappearance for Mn below ~22 at.% and associated magnetic behavior.", "summary": "Composition gradients formed during directional solidification are generally considered undesirable in Ni-Mn-Ga magnetic shape-memory alloys. However, these gradients offer a highly effective platform for systematically investigating composition-property relationships under identical growth and heat-treatment conditions. To exploit this approach, one Mn-deficient and two near-stoichiometric Ni-Mn-", "abstract": "Composition gradients formed during directional solidification are generally considered undesirable in Ni-Mn-Ga magnetic shape-memory alloys. However, these gradients offer a highly effective platform for systematically investigating composition-property relationships under identical growth and heat-treatment conditions. To exploit this approach, one Mn-deficient and two near-stoichiometric Ni-Mn-Ga oligocrystals were grown by optical zone remelting and characterized by X-ray fluorescence mapping, optical microscopy, X-ray diffraction, low-field magnetic measurements, and vibrating-sample magnetometry. The ingots contained elongated grains and axial compositional gradients, primarily associated with the redistribution of Mn and Ga, whereas Ni remained relatively uniformly distributed. The martensitic and premartensitic transformation temperatures generally increased with increasing Mn content. Neither transformation was detected between 10 and 400 K in specimens containing 20.5-22.0 at.% Mn, all of which had $e/a < 7.40$. In contrast, both transformations were observed in the investigated specimens containing at least 22.1 at.% ($e/a \\geq 7.46$). This abrupt change may indicate a possible electron-concentration threshold for the occurrence of these transformations. Saturation magnetization increased with Mn content up to 25.8 at.%, reaching 96.9 A m$^2$/kg at 10 K and 71.2 A m$^2$/kg at 300 K. Post-growth annealing increased the transition temperatures and changed the low-field magnetic response. The results indicate that composition-gradient oligocrystals serve as an effective platform for investigating the relationships between composition, structure, and magnetic properties in Ni-Mn-Ga alloys with the same processing history.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本研究利用含成分梯度的Mn缺陷及近化学计量Ni-Mn-Ga寡晶系统，系统探究成分对相变及磁性的影响，发现Mn含量低于约22原子%时马氏体转变骤然消失及相应磁性特征。", "method_en": "Samples were prepared by optical zone remelting and characterized using X-ray fluorescence mapping, microscopy, X-ray diffraction, low-field magnetometry, and vibrating sample magnetometry.", "method_zh": "样品通过光区再熔炼制备，采用X射线荧光映射、显微镜、X射线衍射、低场磁测量及振动样品磁强计进行表征。", "result_en": "Martensitic and premartensitic transformations were absent between 10–400 K for specimens with 20.5–22.0 at.% Mn (e/a < 7.40), but present for Mn ≥ 22.1 at.% (e/a ≥ 7.46). Saturation magnetization increased with Mn up to 25.8 at.%, reaching 96.9 A m²/kg at 10 K.", "result_zh": "Mn含量20.5–22.0原子%（e/a < 7.40）的样品在10–400 K区间未观测到马氏体及预马氏体转变，≥22.1原子%（e/a ≥ 7.46）则存在。饱和磁化强度随Mn含量升高至25.8原子%，10 K时达96.9 A·m²/kg。", "future_en": "These composition-gradient oligocrystals offer a platform for detailed study of composition-structure-property relationships under identical conditions, potentially guiding alloy design to tailor phase transformations and magnetic responses.", "future_zh": "这些成分梯度寡晶为一致条件下组成-结构-性能关系的细致研究提供平台，有望指导合金设计以调控相变及磁性。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2610-30251", "arxiv_id": "2610.30251", "type": "arXiv", "journal": "arXiv:2610.30251", "journal_ref": "", "title": "Nature of the bosonic edge phase in a double quantum spin Hall insulator", "authors": "Andreas Feuerpfeil, Ronny Thomale, Trithep Devakul, Nicolas Regnault, Julian May-Mann", "corresponding": "", "url": "https://arxiv.org/abs/2610.30251", "topic": "Magnetism", "level": "Brief", "summary_en": "This paper numerically demonstrates an interaction-driven transition from fermionic to bosonic edge phases in double quantum spin Hall insulators, confirming the existence of gapped single-fermion excitations and gapless fermion pairs.", "summary": "Field-theoretic analysis has predicted that the edge of a double quantum spin Hall insulator (DQSHI) can undergo an interaction-driven transition from a phase with fermionic edge modes into one with only bosonic modes. All single-fermion edge excitations are gapped in this bosonic edge phase, but fermion pairs remain gapless, leading to distinct experimental signatures. We numerically simulate the", "abstract": "Field-theoretic analysis has predicted that the edge of a double quantum spin Hall insulator (DQSHI) can undergo an interaction-driven transition from a phase with fermionic edge modes into one with only bosonic modes. All single-fermion edge excitations are gapped in this bosonic edge phase, but fermion pairs remain gapless, leading to distinct experimental signatures. We numerically simulate the interacting DQSHI edge and verify the existence of the bosonic edge phase. This calculation requires an explicit bulk embedding of the DQSHI edge, due to its mixed anomaly between charge and $S^z$ conservation. We hence employ segment DMRG on an infinite two-dimensional cylinder, where the DQSHI bulk is modeled in terms of two copies of the spin-up lowest Landau level, combined with their time-reversed counterparts. We find that interactions can open a single-fermion gap at the DQSHI edge while fermion pairs remain gapless, matching the predictions for the bosonic edge phase. We find the scaling of the single-fermion gap with interaction strength to be consistent with field-theoretic calculations, and discuss the relevance of the bosonic edge phase to twisted homobilayers of WSe$_2$ and MoTe$_2$. We elaborate on the methodological extension of the segment geometry used here to other topological phases with edge anomalies.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本文数值证明了双量子自旋霍尔绝缘体中由相互作用驱动的从费米子边缘态到玻色子边缘态的跃迁，确认了单费米子激发有隙、费米子对无隙的存在。", "method_en": "Using segment DMRG on an infinite cylinder with a bulk embedding modeled by spin-polarized Landau levels and their time-reversed counterparts, the edge is explicitly simulated respecting the mixed anomaly.", "method_zh": "通过在无限圆柱上的段DMRG，结合由自旋极化朗道能级及其时间反演构成的体嵌入，明确模拟了包含混合异常的边缘。", "result_en": "Findings include single-fermion gap opening consistent with field theory, gapless pair modes, and implications for experimental systems like twisted WSe2 and MoTe2 homobilayers.", "result_zh": "结果显示单费米子隙符合场论预言，费米子对无隙，且探讨了其在扭曲WSe2和MoTe2同质层中的相关性。", "future_en": "Further research should extend the segment geometry approach to other topological phases with edge anomalies and explore experimental detection techniques.", "future_zh": "未来工作应将段几何方法推广至含边缘异常的其他拓扑相，探索其实验检测手段。", "tier": "Nature Physics/Nature Materials", "tier_reason_en": "The paper presents a significant numerical confirmation of a theoretically predicted bosonic edge phase in topological materials with mixed anomalies, employing advanced tensor network methods with concrete experimental relevance.", "tier_reason_zh": "本文通过先进张量网络方法数值确认了含混合异常拓扑材料中预言的玻色子边缘相，具有重要理论价值和实际实验相关性。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2505-02911", "arxiv_id": "2505.02911", "type": "arXiv", "journal": "arXiv:2505.02911", "journal_ref": "J.H.Cullen, D.P.Arovas, R.Raimondi, and D.Culcer, (2026). Advances in Physics, 1-26", "title": "Quantum geometry and quantum capacitance in the orbital magneto-electric effect", "authors": "James H. Cullen, Daniel P. Arovas, Roberto Raimondi, Dimitrie Culcer", "corresponding": "", "url": "https://arxiv.org/abs/2505.02911", "topic": "Magnetism", "level": "Brief", "summary_en": "This paper develops a density-matrix formulation of the orbital magneto-electric effect (OME) in Bloch electrons, revealing intra-band and inter-band contributions with distinct quantum geometric origins and a band-diagonal charge dipole governed by the quantum metric.", "summary": "The orbital magneto-electric effect (OME), the generation of a steady-state orbital angular momentum (OAM) density by an electric field, is a central component of orbitronics. Nevertheless its microscopic interpretation is complicated by the existence of two qualitatively different contributions: the intra-band Edelstein term stemming from the combined effect of the equilibrium OAM and Fermi surfa", "abstract": "The orbital magneto-electric effect (OME), the generation of a steady-state orbital angular momentum (OAM) density by an electric field, is a central component of orbitronics. Nevertheless its microscopic interpretation is complicated by the existence of two qualitatively different contributions: the intra-band Edelstein term stemming from the combined effect of the equilibrium OAM and Fermi surface shift, and the inter-band contribution, stemming from Zitterbewegung induced by the electric field. Here we develop a pedagogical density-matrix formulation of the OME within the framework of the modern theory of Bloch-electron OAM, in which the two contributions naturally emerge from distinct parts of the density matrix, and their distinct quantum geometric structures are clearly seen. In the inter-band contribution, in addition to the local- and itinerant-circulation terms, we show that a band-diagonal displacement, or charge dipole, is present, which is linear in the electric field and governed by the normalized quantum metric. For a tilted massive Dirac cone the Zitterbewegung OME and the Fermi-surface orbital response occur for orthogonal electric-field orientations, providing a route to separate them experimentally. The itinerant-circulation contribution is identical to the dipolar one, so in a two-band model the dipole accounts for exactly half of the inter-band response, both in the doped regime and in the insulating gap. Our recent insights identify quantum-metric engineering as a route for enhancing orbital magneto-electric responses and clarify the relation between modern orbital magnetization, polarization, and orbital torque phenomenology.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本文基于Bloch电子轨道角动量的现代理论，发展了轨道磁电效应的密度矩阵描述，阐明了来自能带内和能带间的不同量子几何结构贡献及由量子度量规范的带对角电偶极子。", "method_en": "Using density-matrix formalism, the authors separate Edelstein (intra-band) and Zitterbewegung (inter-band) contributions and analyze their quantum geometric structures including charge dipole terms.", "method_zh": "利用密度矩阵方法，作者区分了Edelstein能带内贡献与Zitterbewegung能带间贡献，分析了它们的量子几何结构及包含电偶极子项的作用。", "result_en": "They identify that itinerant circulation equals the dipolar term in two-band models, and show orthogonal electric field orientations can experimentally separate response components in tilted massive Dirac cones.", "result_zh": "研究确认在两能带模型中，游动环流等于电偶极子项，并指出倾斜大质量Dirac锥中可通过正交电场方向分离不同响应分量。", "future_en": "The findings suggest quantum-metric engineering as a promising route to enhance orbital magneto-electric responses and clarify their relation to orbital torque phenomena.", "future_zh": "结果表明，量子度量调控是增强轨道磁电响应的潜在途径，并澄清了其与轨道力矩现象的关系。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2610-30647", "arxiv_id": "2610.30647", "type": "arXiv", "journal": "arXiv:2610.30647", "journal_ref": "", "title": "String Order in Quench Dynamics as a Probe of Quantum Phase Transitions", "authors": "H. P. Zhang, Z. Song", "corresponding": "", "url": "https://arxiv.org/abs/2610.30647", "topic": "Magnetism", "level": "Brief", "summary_en": "This study introduces a global string order parameter for the anisotropic XY chain in a transverse field and analyzes its equilibrium and quench dynamics, revealing nonanalytic behavior at quantum critical lines and connecting nonlocal order to measurable spin observables.", "summary": "We study the anisotropic XY chain in a transverse field by introducing a global string order parameter and examining its equilibrium behavior and its quench dynamics from a fully polarized initial state. The corresponding string operator is defined as the product of local projected spin operators over the entire chain. The nonequilibrium order parameter is the long-time average of the logarithm of", "abstract": "We study the anisotropic XY chain in a transverse field by introducing a global string order parameter and examining its equilibrium behavior and its quench dynamics from a fully polarized initial state. The corresponding string operator is defined as the product of local projected spin operators over the entire chain. The nonequilibrium order parameter is the long-time average of the logarithm of the string-operator expectation value per site after the quench.For the ground state, its field derivative is singular on the Ising critical lines; after the quench, the steady-state response also records the field boundaries and the anisotropy transition. We derive analytically the nonanalytic behavior of the order parameter at the quantum critical lines. Our results reveal a hidden nonlocal order underlying this paradigmatic model of conventional quantum phase transitions. They also connect measurable spin populations with equilibrium and dynamical topological structure.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本研究为横场各向异性XY链引入全局弦序参数，分析其平衡及淬火动力学，揭示量子临界线处的非解析行为，并将非局域序连接到可测量的自旋概率。", "method_en": "They define a string operator as a product of local projected spin operators over the chain, then study the long-time average of its logarithmic expectation value per site after quenching from a polarized initial state, deriving analytical expressions for criticality signatures.", "method_zh": "定义链上局部投影自旋算符的积作为弦算符，考察从极化初态淬火后该算符对数期望的长时间平均，并推导出临界行为的解析表达式。", "result_en": "The field derivative of the ground-state string order parameter is singular on Ising critical lines; after quench, the steady-state response reflects field boundaries and anisotropy transitions, revealing hidden nonlocal topological order underlying conventional quantum phase transitions.", "result_zh": "基态弦序参数对场的导数在伊辛临界线上表现奇异；淬火后稳态响应映射出场边界和各向异性转变，揭示了传统量子相变背后的隐藏非局域拓扑序。", "future_en": "This framework connects measurable spin populations with equilibrium and dynamical topological structures, suggesting experimental probes of hidden order via quench dynamics in quantum spin chains.", "future_zh": "该框架将可测自旋分布与平衡及动力学拓扑结构联系，提示通过淬火动力学实验探测量子自旋链中的隐藏序。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2511-07402", "arxiv_id": "2511.07402", "type": "arXiv", "journal": "arXiv:2511.07402", "journal_ref": "", "title": "The ideal limit of rhombohedral graphene: Dynamical skyrmion lattices and their excitations", "authors": "Tixuan Tan, Patrick J. Ledwith, Trithep Devakul", "corresponding": "", "url": "https://arxiv.org/abs/2511.07402", "topic": "Magnetism", "level": "Brief", "summary_en": "An ideal interacting limit of rhombohedral graphene is proposed where electronic interactions spontaneously form a correlated Chern insulator identified as a dynamical skyrmion lattice in the layer-pseudospin space.", "summary": "We introduce an interacting ideal limit of rhombohedral graphene in which interactions spontaneously generate a correlated Chern insulator. Our analysis reveals that this Chern insulator can be understood as a layer-pseudospin skyrmion lattice stabilized by electronic interactions, and that it gives rise to genuine skyrmion lattice physics, complete with dynamics. This dynamical skyrmion lattice n", "abstract": "We introduce an interacting ideal limit of rhombohedral graphene in which interactions spontaneously generate a correlated Chern insulator. Our analysis reveals that this Chern insulator can be understood as a layer-pseudospin skyrmion lattice stabilized by electronic interactions, and that it gives rise to genuine skyrmion lattice physics, complete with dynamics. This dynamical skyrmion lattice naturally leads to experimentally measurable consequences. In particular, we identify new collective excitations corresponding to chiral shape deformations of the skyrmions, and propose a new positively charged quasiparticle, the skyrmion vacancy. These results establish a qualitatively new form of moiré Chern physics in rhombohedral graphene: an interaction-generated skyrmion lattice whose skyrmions are dynamical low-energy degrees of freedom.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "提出了菱方石石墨烯的理想相互作用极限，电子相互作用自发形成为层伪自旋空间中的相关Chern绝缘体，即动力学斯格明子晶格。", "method_en": "The authors analyze the spontaneous formation of skyrmion lattices via interaction effects in the layer-pseudospin space and study their emergent collective excitations and charged quasiparticles.", "method_zh": "通过分析层伪自旋空间相互作用驱动的斯格明子晶格自发形成，研究其集体现象激发态及带电准粒子。", "result_en": "They identify novel collective modes corresponding to chiral shape deformations of skyrmions and propose a new positively charged quasiparticle termed the skyrmion vacancy, expanding the phenomenology of moiré Chern physics in rhombohedral graphene.", "result_zh": "鉴定出与斯格明子手性形变相关的新型集体激发，并提出正电荷准粒子“斯格明子空位”，拓展了菱方石石墨烯中莫尔Chern物理的表征。", "future_en": "Future experimental exploration can probe the predicted skyrmion lattice dynamics and charged excitations, developing a new class of interaction-driven Chern states in moiré materials.", "future_zh": "未来实验可验证预测的斯格明子晶格动力学及带电激发，发展莫尔材料中新型相互作用驱动的Chern态。", "tier": "Uncertain", "tier_reason_en": "This theoretical work introduces a qualitatively novel interaction-induced Chern insulator phase with dynamical skyrmion lattices in a graphene moiré system, potentially high impact but currently unpublished.", "tier_reason_zh": "该理论工作提出了石墨烯莫尔体系中动力学斯格明子晶格导致的相互作用诱发Chern绝缘体新相，潜在高影响力，尚未发表。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2610-30281", "arxiv_id": "2610.30281", "type": "arXiv", "journal": "arXiv:2610.30281", "journal_ref": "", "title": "Charge Density Waves and In-Gap States in Coupled Chains and Moiré Superlattices", "authors": "Muhammad Akram, Onur Erten", "corresponding": "", "url": "https://arxiv.org/abs/2610.30281", "topic": "Materials & Growth", "level": "Brief", "summary_en": "This paper studies charge density waves (CDWs) and bound states emerging from coupled Su-Schrieffer-Heeger chains forming ladders and moiré superlattices, revealing diverse CDW phases controlled by electron-phonon coupling, interchain tunneling, and lattice mismatch.", "summary": "Charge density waves (CDWs) arise from the interplay between electrons and lattice distortions and are a hallmark of low-dimensional systems. Here we study coupled Su-Schrieffer-Heeger chains, both lattice-matched ladders and lattice-mismatched moiré superlattices, and find a rich set of CDW phases together with symmetry-protected bound states. In lattice-matched chains, the competition between el", "abstract": "Charge density waves (CDWs) arise from the interplay between electrons and lattice distortions and are a hallmark of low-dimensional systems. Here we study coupled Su-Schrieffer-Heeger chains, both lattice-matched ladders and lattice-mismatched moiré superlattices, and find a rich set of CDW phases together with symmetry-protected bound states. In lattice-matched chains, the competition between electron-phonon coupling and interchain tunneling drives a sequence of CDW phases, including staggered dimers, trimers, and incommensurate states. These phases are generally gapped and host bound states protected by crystalline symmetries rather than chiral symmetry, and are therefore not pinned to zero energy. Lattice mismatch further reconstructs these phases into long-period supermoiré CDWs, with an ordered array of defects, pinned to the moiré length scale, that host localized electronic states. Interchain tunneling and lattice mismatch thus emerge as natural control parameters for CDW order and bound states in one-dimensional chains.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本文研究了通过耦合Su-Schrieffer-Heeger链构成的梯子和莫尔超晶格中出现的电荷密度波及束缚态，显示了由电子-声子耦合、链间隧穿和晶格失配调控的多样CDW相。", "method_en": "Theoretical analysis of coupled SSH chains considers both lattice-matched and mismatched cases, examining how interchain tunneling and electron-phonon interactions induce staggered and incommensurate CDWs and symmetry-protected bound states pinned by crystalline symmetries or moiré length scales.", "method_zh": "对耦合SSH链进行理论分析，涵盖晶格匹配与失配情况，研究链间隧穿和电子-声子相互作用如何引起交错、三聚体及非整比CDW相，以及受晶体对称性或莫尔长度尺度约束的束缚态。", "result_en": "Multiple CDW phases including staggered dimers, trimers, and incommensurate states are demonstrated, often hosting crystalline symmetry-protected, but nonzero-energy, bound states; lattice mismatch generates long-period supermoiré CDWs with defect arrays that localize electronic states at moiré scales.", "result_zh": "展示了包括交错二聚体、三聚体及非整比态的多种CDW相，这些相通常存在受晶体对称性保护但非零能量的束缚态；晶格失配产生长周期超莫尔CDW，含有定位在莫尔尺度的缺陷阵列的局域电子态。", "future_en": "Future directions include manipulating interchain coupling and lattice mismatch to engineer tunable CDW phases and localized electronic modes relevant to low-dimensional quantum materials.", "future_zh": "未来可通过调控链间耦合和晶格失配，设计可调CDW相及局域电子模式，应用于低维量子材料。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2604-26871", "arxiv_id": "2604.26871", "type": "arXiv", "journal": "arXiv:2604.26871", "journal_ref": "", "title": "Correlation-Driven Ballistic Exciton Expansion in a Moiré Bose-Fermi Mixture", "authors": "Shibin Deng, Jonas M. Peterson, Maximilian Hauer, Jonas Reimann, Heonjoon Park, Ammon Fischer, Takashi Taniguchi, Kenji Watanabe, Xiaodong Xu, Dante M. Kennes, Libai Huang", "corresponding": "", "url": "https://arxiv.org/abs/2604.26871", "topic": "Materials & Growth", "level": "Brief", "summary_en": "The study demonstrates ballistic exciton transport selectively populating higher-energy moiré exciton bands in a WSe2/WS2 heterobilayer due to strong exciton-electron and exciton-exciton repulsions.", "summary": "Moiré superlattices of transition-metal dichalcogenides (TMDs) host strongly interacting Bose-Fermi mixtures in which bosonic excitons coexist with correlated electron lattices. Using ultrafast, time- and energy-resolved photoluminescence (PL) microscopy, we show that strong exciton-electron and exciton-exciton repulsion can enable ballistic exciton transport in a WSe$_2$/WS$_2$ heterobilayer. Thi", "abstract": "Moiré superlattices of transition-metal dichalcogenides (TMDs) host strongly interacting Bose-Fermi mixtures in which bosonic excitons coexist with correlated electron lattices. Using ultrafast, time- and energy-resolved photoluminescence (PL) microscopy, we show that strong exciton-electron and exciton-exciton repulsion can enable ballistic exciton transport in a WSe$_2$/WS$_2$ heterobilayer. This ballistic transport is energy selective: repulsive interactions populate higher-energy moiré exciton bands, including the doubly occupied exciton state XX and the exciton-electron co-localized state Xe, exhibiting mean-squared displacement (MSD) with a quadratic time dependence, MSD $\\propto t^2$. Transport in the Xe band is jointly governed by exciton and electron correlations. Exciton correlations suppress relaxation into the lower-energy localized exciton state, while generalized Wigner-crystal (GWC) order at fractional electron fillings enhances Auger recombination and the group velocity of the ballistic expansion. A two-dimensional Bose-Fermi Hubbard model solved using time-dependent mean-field methods qualitatively reproduces the measured exciton transport and time-dependent response. It further confirms that strong cross-species interactions allow the electron crystal to perforate the exciton Mott background, enhancing exciton motion. Our results establish moiré TMDs as highly tunable platforms for realizing strongly interacting Bose-Fermi mixtures.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "研究展示了在WSe2/WS2异质双层中，由于强烈的激子-电子和激子-激子排斥作用，激子以弹道方式选择性填充较高能的莫尔激子能带。", "method_en": "Using ultrafast time- and energy-resolved photoluminescence microscopy and a two-dimensional Bose-Fermi Hubbard model solved via time-dependent mean-field methods, the authors characterize exciton transport and its correlation with electron lattice order.", "method_zh": "通过超快时空分辨光致发光显微镜及二维玻色-费米哈伯德模型的时变平均场解法，作者描绘了激子输运及其与电子晶格序的相关性。", "result_en": "They observe mean-squared displacement with quadratic time dependence in doubly occupied exciton and exciton-electron co-localized states, revealing energy-selective ballistic transport influenced by exciton correlations and generalized Wigner-crystal order enhancing Auger recombination and expansion velocity.", "result_zh": "观测到双占据激子态和激子-电子共定位态的均方位移随时间呈二次方增长，揭示能量选择性的弹道输运，激子关联和广义维格纳晶体序增强了奥格复合和扩散速度。", "future_en": "The findings establish moiré TMD heterostructures as highly tunable platforms for investigating strongly interacting Bose-Fermi mixtures and correlated transport phenomena.", "future_zh": "研究确立了莫尔TMD异质结作为调控强相互作用玻色-费米混合物及相关输运现象的理想平台。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2610-22307", "arxiv_id": "2610.22307", "type": "arXiv", "journal": "arXiv:2610.22307", "journal_ref": "", "title": "Extended strange metal and superconductivity in partially filled moiré Hubbard bands", "authors": "Yiyu Xia, Yichi Zhang, Zhongdong Han, Hongyuan Li, Brandon Bauer, Kenji Watanabe, Takashi Taniguchi, Wenjin Zhao, Jie Shan, Kin Fai Mak", "corresponding": "", "url": "https://arxiv.org/abs/2610.22307", "topic": "Superconductivity", "level": "Feature", "summary_en": "The study reports the emergence of an extended strange metal (ESM) phase in partially filled Hubbard bands of twisted bilayer WSe2, which persists down to 50 mK and spans multiple symmetry-breaking states, occurring only at small twist angles where correlations are strong. It also discovers a new superconducting dome developing from the ESM far from the Mott insulator and van Hove singularity.", "summary": "Moiré semiconductors provide a physical realization of the Hubbard model. Bandwidth-tuned Mott transitions and complex phase diagrams mimicking those of high-temperature superconductors have been demonstrated near a weak Mott insulating state at half-band-filling. The platform also provides an opportunity to explore the physics of a partially filled Hubbard band at doping densities far away from t", "abstract": "Moiré semiconductors provide a physical realization of the Hubbard model. Bandwidth-tuned Mott transitions and complex phase diagrams mimicking those of high-temperature superconductors have been demonstrated near a weak Mott insulating state at half-band-filling. The platform also provides an opportunity to explore the physics of a partially filled Hubbard band at doping densities far away from the Mott insulator, a regime that has remained largely unexplored. Here we report the emergence of an extended strange metal (ESM), in both doping density and twist angle, in a partially filled Hubbard band of twisted bilayer WSe2. The ESM is in the clean limit, persists down to about 50mK, and spans over multiple symmetry-breaking ground states; i \\ln\\left(R/r_{\\text{core}}\\right)\\), \\(κ= πρ_s /2\\). The resulting confinement is carried not by a one dimensional string but by an extended two-dimensional spin texture. Thus, the loss of long-range Néel order does not eliminate antiferromagnetic confinement but removes the global Néel lift. This activates a distinct projective mechanism in which a local path dependent string is replaced, at long wavelengths, by a global topological texture with logarithmic confinement.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本文研究了长程Néel序丧失但短程相关仍存情况下反铁磁弦机制的演变。", "method_en": "Using a singlet bond representation, the authors describe the surviving antiferromagnetic axis as a director (n ~ -n) in the RP² manifold and analyze the emergence of a topologically nontrivial ℤ₂ sector with half-vortex defects.", "method_zh": "采用单重态键表示，将存续的反铁磁轴描述为RP²流形中的向量主轴(n ~ -n)，并分析了带有半涡旋缺陷的非平凡ℤ₂拓扑区域的出现。", "result_en": "They find that half-vortex pairs are logarithmically confined by extended two-dimensional spin textures rather than one-dimensional strings, indicating that antiferromagnetic confinement persists without global Néel lift but via a distinct projective mechanism.", "result_zh": "发现半涡旋对通过二维自旋纹理呈对数限制，而非一维弦，表明反铁磁限制在无全局Néel升维下通过不同的投影机制持续存在。", "future_en": "This work reveals new topological mechanisms of confinement in disordered antiferromagnets and motivates further studies of fractional excitations and their dynamics beyond conventional Néel order descriptions.", "future_zh": "该研究揭示了无序反铁磁体中新型的拓扑限制机制，推动对分数激发及其动力学超越传统Néel序理论的深入探索。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2610-31084", "arxiv_id": "2610.31084", "type": "arXiv", "journal": "arXiv:2610.31084", "journal_ref": "", "title": "Nitrogen vacancy cluster-mediated ferroelectric domain growth in wurtzite AlN", "authors": "Zijian Zhou, Kan-Hao Xue, Ziqi Pang, Heng Yu, Shanzhong Xie, Hang Liu, Haiming Qin, Yi Tong, Bowen Su, Yi Yang, Tian-Ling Ren, Xiangshui Miao", "corr g chiroptically induced valley polarization decays on sub-picosecond timescales through intervalley scattering mediated by electron-phonon coupling. Furthermore, we show theoretically that the population imbalance between valleys at opposite momenta gives rise to a helicity-reversible transient photocurrent. These findings provide microscopic insight into how quantum geometry governs valley-selective light-matter interactions, valley polarization, and photocurrent generation in van der Waals materials exhibiting hidden and transient symmetry breaking.", "method": "", "result": "", "future": "", "summary_zh": "利用时间分辨角分辨光电子谱在 SnSe 中观测圆偏振激发引起的谷选择性载流子分布。", "tier": "Nature Communications/Science Advances/PRX", "tier_reason_en": "A substantial conceptual or methodological advance with cross-community relevance.", "tier_reason_zh": "概念或方法进展较显著，可跨多个研究方向应用。", "relevance_score": 80, "relevance_method": "semantic", "relevance_reason": "By combining experiment and ab initio theory, the paper establishes quantum geometric selection rules for valley-resolved chiroptical responses and transient valley polarization, linking crystal symmetry, quantum geometry, and helicity-depe", "feature_candidate": true, "physics_advance": "Experimental and theoretical demonstration of symmetry- and quantum-geometry-governed helicity-dependent valley-selective excitation and dynamics in bulk SnSe", "ai_in_scope": true}, {"id": "arxiv-2610-30766", "arxiv_id": "2610.30766", "type": "arXiv", "journal": "arXiv:2610.30766", "journal_ref": "", "title": "Coulomb-Driven Electronic Textures in Lightly Hole-Doped Cuprates", "authors": "Wei-Wei Yang, Yang Shen, Yuxin Wang, Pengfei Li, Mingpu Qin, Kun Jiang", "corresponding": "", "url": "https://arxiv.org/abs/2610.30766", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Poorly screened Coulomb interactions organize electronic textures in lightly hole-doped cuprates.", "summary": "Poorly screened Coulomb interactions organize electronic textures in lightly hole-doped cuprates.", "abstract": "Motivated by recent experiments on Ca$_2$CuO$_2$Cl$_2$, we present a comprehensive study of the interplay between dopants and localized Zhang-Rice singlets in lightly hole-doped cuprates. Owing to the poorly screened Coulomb potential, the interactions between dopants and localized Zhang-Rice singlets favor asymmetric electronic configurations characterized by effective electric \"dipoles\". Using the MPS-based Lanczos method, we show that these localized holes give rise to in-gap bound states within the charge-transfer gap. When tunneling matrix-element effects are included, the bound states exhibit a characteristic $4a_0 \\times 2a_0$ internal structure, consistent with experimental observations. Our results suggest that Coulomb interactions between dopants and localized Zhang-Rice singlets, together with tunneling matrix-element effects, provide a microscopic mechanism for the observed $4a_0$ electronic structures.", "method": "", "result": "", "future": "", "summary_zh": "理论研究轻度空穴掺杂铜氧化物中库仑相互作用驱动的非均匀电子织构。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "The work explains experimentally observed 4a0 electronic structures in lightly hole-doped cuprates by identifying Coulomb-driven electric dipole 'textures' involving dopants and Zhang-Rice singlets, linking disorder, Coulomb interactions, a", "feature_candidate": true, "physics_advance": "Microscopic mechanism showing Coulomb interactions between dopants and localized Zhang-Rice singlets generate in-gap bound states with characteristic 4a0 electronic structure in lightly hole-doped cuprates", "ai_in_scope": true}, {"id": "arxiv-2610-30371", "arxiv_id": "2610.30371", "type": "arXiv", "journal": "arXiv:2610.30371", "journal_ref": "", "title": "Emergent altermagnetism in (LaVO$_3$)$_n$/(LaNiO$_3$)$_m$ superlattices from interfacial charge transfer and octahedral tilts", "authors": "Gustavo H. Cassemiro, Walber H. Brito", "corresponding": "", "url": "https://arxiv.org/abs/2610.30371", "topic": "Magnetism", "level": "Brief", "summary_en": "First-principles calculations predict interfacial-charge-transfer- and octahedral-tilt-induced altermagnetism in LaVO3/LaNiO3 superlattices.", "summary": "First-principles calculations predict interfacial-charge-transfer- and octahedral-tilt-induced altermagnetism in LaVO3/LaNiO3 superlattices.", "abstract": "Using first-principles calculations, we show that altermagnetism emerges in (LaVO$_3$)$_n$/(LaNiO$_3$)$_m$ superlattices, with $(n,m) = (1,1), (2,2)$ and $(2,4)$, from the interplay of interfacial charge transfer and octahedral tilts. Charge transfer drives the system towards the V$^{4+}$ and Ni$^{2+}$ configuration, turning the otherwise paramagnetic nickelate layers into a magnetically active sublattice. The resulting $C$-type antiferromagnetic order, combined with $a^-b^+c^-$ or $a^-b^-c^-$ octahedral tilts, links opposite-spin sublattices only through nonsymmorphic operations, yielding a $d$-wave spin splitting without spin-orbit coupling. Within DFT+U, the splitting reaches 118 meV in the insulating (LVO)$_1$/(LNO)$_1$ superlattice, about twice that calculated for bulk LaVO$_3$, and decreases as the nickelate layers become thicker. Our findings indicate that this splitting is hosted by both the V and Ni sublattices, with nearly half of its weight on oxygen $2p$ states through $p$-$d$ covalency. Interfacial charge transfer thus emerges as a \\textit{design} principle for engineering altermagnetism in oxide heterostructures.", "method": "", "result": "", "future": "", "summary_zh": "第一性原理计算表明 LaVO₃/LaNiO₃ 超晶格的界面电荷转移与八面体倾斜可诱导交替磁性。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "Using first-principles calculations, this work identifies a new mechanism for altermagnetism arising from interfacial charge transfer and structural distortions in oxide superlattices, establishing a concrete design principle for spin-split", "feature_candidate": true, "physics_advance": "Prediction of altermagnetism driven by interfacial charge transfer and octahedral tilts in layered oxide superlattices, leading to d-wave spin splitting without spin-orbit coupling", "ai_in_scope": true}, {"id": "arxiv-2610-30733", "arxiv_id": "2610.30733", "type": "arXiv", "journal": "arXiv:2610.30733", "journal_ref": "", "title": "Ferroelastic Reversal Magnon Thermal Hall Effect in a Fully Compensated Ferrimagnet", "authors": "Yingxi Bai, Zihan Chen, Chengwang Niu, Ming Yang", "corresponding": "", "url": "https://arxiv.org/abs/2610.30733", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Ferroelastic switching is predicted to reversibly control magnon thermal Hall response in fully compensated ferrimagnets.", "summary": "Ferroelastic switching is predicted to reversibly control magnon thermal Hall response in fully compensated ferrimagnets.", "abstract": "Magnons offer a charge-neutral channel for spin and heat transport, yet reversible and nonvolatile control of their thermal Hall response poses a fundamental challenge in systems with zero net magnetization. Here, we establish ferroelastic switching as an effective route to manipulate magnonic transverse responses in fully compensated ferrimagnets. A minimal Heisenberg-Dzyaloshinskii-Moriya model reveals that ferroelastic switching can re-orientate the lattice anisotropy, which reconstructs the chirality-resolved magnon bands and Berry curvature distribution. Consequently, the two orthogonal fully compensated ferrimagnetic variants related by [C2||C4z] exhibit magnon thermal Hall responses with opposite signs, whereas the response vanishes in the intermediate altermagnetic phase. First-principles calculations further identify monolayer V2SSe as a promising material candidate for realizing the proposed ferroelastic control of transverse magnon transport. Remarkably, ferroelastic switching drives a dual magnonic-electronic band reconstruction, enabling nonvolatile reversal of the magnon thermal Hall effect while producing anisotropic orbital Hall responses and distinct magneto-optical spectra as complementary transport and optical fingerprints. Our findings establish ferroelasticity as an effective route to nonvolatile magnon control and multichannel state identification in zero net magnetization systems.", "method": "", "result": "", "future": "", "summary_zh": "提出通过铁弹性翻转非易失地反转完全补偿亚铁磁体的磁振子热霍尔信号。", "tier": "PRL", "tier_reason_en": "A clear, testable response or experimentally distinctive mechanism of broad condensed-matter interest.", "tier_reason_zh": "提出清晰可检验的响应或具有代表性的实验机制，具有较广凝聚态意义。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "Reveals ferroelastic switching as a means to control magnon thermal Hall effect and chirality in fully compensated ferrimagnets, a new mechanism enabling reversible, nonvolatile transverse magnonic transport control at zero net magnetizatio", "feature_candidate": true, "physics_advance": "Establishing ferroelasticity-driven tunable reversal of magnon thermal Hall effect and band reconstruction in compensated ferrimagnets.", "ai_in_scope": true}, {"id": "arxiv-2610-31142", "arxiv_id": "2610.31142", "type": "arXiv", "journal": "arXiv:2610.31142", "journal_ref": "", "title": "Interaction-enhanced antiferromagnetic correlations in a Kondo ladder with a gapped band structure", "authors": "Tatsuya Kaneko, Ritsuki Hirabayashi, Yutaka Akagi", "corresponding": "", "url": "https://arxiv.org/abs/2610.31142", "topic": "Magnetism", "level": "Brief", "summary_en": "Interactions enhance antiferromagnetic correlations in a Kondo ladder with a gapped band structure.", "summary": "Interactions enhance antiferromagnetic correlations in a Kondo ladder with a gapped band structure.", "abstract": "We investigate magnetic correlations in the two-leg Kondo-Hubbard ladder using the density-matrix renormalization group method. We focus on a parameter regime in which the noninteracting electronic system has a narrow indirect band gap. In this regime, there is no Fermi surface, and the conventional Fermi-surface-based Ruderman-Kittel-Kasuya-Yosida picture is not directly applicable; magnetic correlations between localized spins become weaker as the noninteracting band gap increases. We find that a moderate on-site Coulomb interaction enhances the antiferromagnetic correlations between localized spins. This enhancement, which is also seen in the staggered magnetization induced by a pinning field at the edges, occurs for both ferromagnetic and antiferromagnetic Kondo couplings. Our results show that electron-electron interactions can enhance magnetic correlations between localized spins even when the underlying noninteracting electronic structure is gapped, suggesting an interaction-driven route to magnetic instabilities in narrow-gap Kondo-lattice systems.", "method": "", "result": "", "future": "", "summary_zh": "研究具有能隙能带结构的 Kondo 梯子中相互作用增强的反铁磁关联。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "By demonstrating that electron-electron interactions enhance antiferromagnetic correlations in a narrow-gap Kondo-Hubbard ladder where Fermi-surface approaches fail, this work provides new insight into interaction-driven magnetism beyond co", "feature_candidate": true, "physics_advance": "Discovery that Coulomb interactions enhance antiferromagnetic correlations and magnetic instabilities in narrow-gap Kondo-lattice ladders lacking a Fermi surface", "ai_in_scope": true}, {"id": "arxiv-2610-30929", "arxiv_id": "2610.30929", "type": "arXiv", "journal": "arXiv:2610.30929", "journal_ref": "", "title": "Piezo-Kerr effect in altermagnets and noncollinear antiferromagnets", "authors": "Yuqi Liu, Qiu-Shi Huang, Xinfeng Chen, Yilin Han, Run-Wu Zhang, Zhi-Ming Yu, Yugui Yao", "corresponding": "", "url": "https://arxiv.org/abs/2610.30929", "topic": "Magnetism", "level": "Brief", "summary_en": "Strain activates symmetry-forbidden Kerr rotation in 16 of 122 magnetic point groups, with calculated signals of tens to hundreds of millidegrees.", "summary": "Strain activates symmetry-forbidden Kerr rotation in 16 of 122 magnetic point groups, with calculated signals of tens to hundreds of millidegrees.", "abstract": "Symmetry is usually viewed as a constraint on physical responses, but it can also be used to design the fields that control them. Here, we adopt the representation-matching principle used to identify conjugate fields of order parameters and apply it to response tensors. A linear coupling, the key ingredient for sign-switching control, is symmetry-allowed when a component (or a combination of components) of the control field and the selected response component share the same irreducible representation of the magnetic point group (MPG) of the system. Applied to the magneto-optical Kerr effect, this principle yields a piezo-Kerr effect, in which specific strain combinations activate a Kerr response forbidden in the unstrained state. Enumerating all 122 MPGs, we identify 16 groups in which the unstrained Kerr response is forbidden while a linear strain-induced contribution is allowed. These groups are realized by altermagnets and noncollinear antiferromagnets with symmetry-enforced vanishing net magnetization. The active strain channels and the associated first-order sign reversals follow directly from symmetry. First-principles calculations for bulk MnTe$_{2}$ and CoF$_{2}$, and Cr$_{2}$Se$_{2}$O and Cr$_{2}$Te$_{2}$O monolayers confirm these predictions. In these materials, the Kerr rotation vanishes without strain, whereas 0.5-3% strain produces rotations ranging from tens to hundreds of millidegrees, and reversing the matched strain channel reverses the Kerr sign. These results establish a general route to large and switchable Kerr responses emerging from symmetry-forbidden states in compensated magnets.", "method": "", "result": "", "future": "", "summary_zh": "提出应变激活原本对称性禁戒的 Kerr 响应；122 种磁点群中有 16 种允许线性效应，预测 Kerr 旋转可达数十至数百毫度。", "tier": "PRL", "tier_reason_en": "A general symmetry selection rule with quantitative material predictions and a clean, testable sign-reversal signature.", "tier_reason_zh": "普适对称性选择定则、定量材料预测及干净可检验的符号翻转特征，具备 PRL 水平潜力。", "method_en": "Magnetic-point-group representation analysis over all 122 MPGs, followed by first-principles magneto-optical conductivity and strain calculations for bulk MnTe2, CoF2 and monolayer Cr2Se2O/Cr2Te2O.", "method_zh": "枚举全部 122 种磁点群的表示，计算线性应变–Kerr 张量；随后对块体 MnTe₂、CoF₂ 及单层 Cr₂Se₂O/Cr₂Te₂O 做第一性原理应变与磁光电导计算。", "result_en": "The central equation is θ_i = Σ_jk Λ_i,jk ε_jk, where the time-reversal-odd piezo-Kerr tensor Λ is symmetry-constrained. Fig. 1 illustrates a zero-background Kerr signal activated and sign-reversed by strain. Table 1 identifies 16 MPGs allowing the response; for 4′/mm′m, θ_z ∝ ε_xx−ε_yy. The calculated Cr2Se2O response (Fig. 4) reaches ~50 mdeg at 1% and 164 mdeg at 3% strain (photon energy 1.44 eV). The authors extend representation matching from order parameters to response tensors.", "result_zh": "核心公式为 θ_i=Σ_jk Λ_i,jk ε_jk，其中时间反演奇的 piezo-Kerr 张量 Λ 由磁点群对称性约束。Fig. 1 展示零背景 Kerr 信号被应变激活并随应变反向翻转；Table 1 列出允许该响应的 16 种磁点群，例如 4′/mm′m 中 θ_z∝ε_xx−ε_yy；Fig. 4 计算单层 Cr₂Se₂O 在 1% 应变下约 50 mdeg、3% 下约 164 mdeg（光子能量 1.44 eV）。作者将序参量的表示匹配原则推广到响应张量。", "future_en": "Test bulk CoF2 or MnTe2 with piezo-driven AC strain and lock-in Kerr rotation; use orthogonal εxx−εyy channels and magnetic-domain training to verify linearity and sign reversal before seeking transverse transport analogues.", "future_zh": "优先在块体 CoF₂ 或 MnTe₂ 上施加压电 AC 应变，用锁相 Kerr 测量；对比 εxx−εyy 的正负通道并训练磁畴，验证线性关系与符号翻转，再寻找相应横向输运响应。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "This work identifies a symmetry-enabled piezo-Kerr effect in altermagnets and noncollinear AFMs, showing a new mechanism for strain-controlled magneto-optical response in compensated magnets, supported by first-principles calculations.", "feature_candidate": true, "physics_advance": "Prediction and first-principles confirmation of strain-induced Kerr effects absent in unstrained altermagnets and compensated antiferromagnets, revealing a new linear coupling between strain and magneto-optical response controlled by magnetic point group symme", "ai_in_scope": true}, {"id": "arxiv-2606-10420", "arxiv_id": "2606.10420", "type": "arXiv", "journal": "arXiv:2606.10420", "journal_ref": "", "title": "Superheating field of clean superconductors near the type-I--type-II boundary: the low-temperature Meissner stability limit of niobium", "authors": "Takayuki Kubo", "corresponding": "", "url": "https://arxiv.org/abs/2606.10420", "topic": "Superconductivity", "level": "Brief", "summary_en": "The work calculates the low-temperature superheating field and Meissner stability near the type-I/type-II boundary.", "summary": "The work calculates the low-temperature superheating field and Meissner stability near the type-I/type-II boundary.", "abstract": "We calculate the low-temperature superheating field $B_{\\rm sh}$ of clean superconductors near the boundary between type-I and type-II superconductivity, with particular emphasis on Nb. Ginzburg--Landau theory is not applicable at low temperatures, while previous microscopic calculations have been limited to either the large-$κ$ regime or the dirty limit. The clean, low-$κ$ regime relevant to Nb has therefore remained unresolved. We solve the self-consistent nonlinear nonlocal Eilenberger problem for the Meissner state and then analyze its stability against small perturbations. For a Nb-like material with $κ_{\\rm GL}=0.7$, we obtain $B_{\\rm sh}\\simeq 290\\,{\\rm mT}$ at $T/T_c=0.2$, using $B_{c0}\\simeq 200\\,{\\rm mT}$. For a TESLA-shaped Nb accelerator cavity, this corresponds to an intrinsic Meissner-stability limit of about $67\\,{\\rm MV/m}$.", "method": "", "result": "", "future": "", "summary_zh": "研究洁净超导体在 I 型与 II 型边界附近的低温过热场及 Meissner 态稳定性。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "Provides a new microscopic calculation of low-temperature superheating fields in clean niobium near the type-I/II boundary, resolving an important regime inaccessible to Ginzburg-Landau theory and relevant to intrinsic stability limits in s", "feature_candidate": true, "physics_advance": "First self-consistent microscopic solution of Meissner-state stability and superheating field in clean niobium near the type-I/II superconductivity boundary.", "ai_in_scope": true}, {"id": "arxiv-2610-31184", "arxiv_id": "2610.31184", "type": "arXiv", "journal": "arXiv:2610.31184", "journal_ref": "", "title": "Anomalous polar chains in halide perovskites", "authors": "Erik Fransson, Apinya Ngoipala, Priyanka Deswal, Ethan Berger, Nicholas C. Bristowe, Paul Erhart, Julia Wiktor", "corresponding": "", "url": "https://arxiv.org/abs/2610.31184", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Molecular dynamics identifies tens-of-nanometers-long, nanosecond-lived polar chains in nominally cubic CsGeBr3.", "summary": "Molecular dynamics identifies tens-of-nanometers-long, nanosecond-lived polar chains in nominally cubic CsGeBr3.", "abstract": "Local polar distortions, their collective ordering, and their field-driven reversal have been studied extensively in ferroelectric perovskites for decades. Here we identify an unusual behavior in the ferroelectric halide perovskite CsGeBr3 using large-scale molecular dynamics with first-principles-trained interatomic potentials. In its nominally cubic phase the Ge off-centering forms one-dimensional polar chains that extend over at least tens of nanometers and relax on nanosecond timescales, four orders of magnitude slower than in BaTiO3 and PbTiO3, with CsSnBr3 in between. The cubic CsGeBr3 phase is a dynamically disordered state in which oppositely polarized chains flip throughout the crystal, and a long-lived one-dimensional local polarization coexists with zero net polarization. A simple three-dimensional perovskite thus hosts long-ranged one-dimensional polar correlations with remarkably slow dynamics. In the ferroelectric phase the same chains set a one-dimensional switching mechanism, in which the polarization reverses chain by chain.", "method": "", "result": "", "future": "", "summary_zh": "模拟发现 CsGeBr₃ 名义立方相中存在寿命很长、长度达数十纳米的一维极化链。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "Identification of unusually long-lived, one-dimensional polar chains with slow dynamics in cubic halide perovskite CsGeBr3 reveals a novel type of polar order and novel switching mechanism at the nanoscale, extending understanding of polar ", "feature_candidate": true, "physics_advance": "Discovery of long-range, slowly relaxing one-dimensional polar chains and chain-by-chain switching dynamics in nominally cubic halide perovskite", "ai_in_scope": true}, {"id": "arxiv-2610-30556", "arxiv_id": "2610.30556", "type": "arXiv", "journal": "arXiv:2610.30556", "journal_ref": "", "title": "Field-free superconducting diode and tunable vortex dynamics in NbN/FePt stripe-domain heterostructures", "authors": "Juan C. Zapata, Emilio De Biasi, Martin Sirena, Jeehoon Kim, Nestor Haberkorn", "corresponding": "", "url": "https://arxiv.org/abs/2610.30556", "topic": "Superconductivity", "level": "Brief", "summary_en": "NbN/FePt stripe-domain heterostructures exhibit a field-free superconducting diode efficiency of roughly 50–60%, retaining 35–40% with an AlN spacer.", "summary": "NbN/FePt stripe-domain heterostructures exhibit a field-free superconducting diode efficiency of roughly 50–60%, retaining 35–40% with an AlN spacer.", "abstract": "We demonstrate reconfigurable, field-free superconducting diode behavior in NbN/FePt and NbN/AlN/FePt heterostructures with remanent stripe domains in the FePt layer. NbN films 10 nm thick are capped either directly with FePt or through a thin AlN spacer, which reduces electronic proximity effects while preserving magnetic coupling through stray fields. At zero applied magnetic field, the superconducting diode efficiency reaches approximately 50--60% in NbN/FePt when the stripes are perpendicular to the current and is strongly reduced when they are parallel. The diode effect persists in NbN/AlN/FePt with efficiencies reaching approximately 35--40%, supporting a magnetic origin of the nonreciprocity. We interpret the response as asymmetric vortex transport in the remanent magnetic landscape, with preferential edge vorticity and a Lorentz force that favors inward flux injection or outward motion depending on current polarity. Under applied perpendicular magnetic fields, the interplay between the external field and the magnetic stray fields modifies the flux-flow instability and the apparent instability velocity inferred from transport, with values below those reported for bare NbN films. These results show that stripe-domain ferromagnetic overlayers provide a reconfigurable route to control superconducting nonreciprocity and flux-flow stability in NbN-based heterostructures.", "method": "", "result": "", "future": "", "summary_ driven Mott-like transition in a two-dimensional Ruddlesden–Popper perovskite.", "summary": "The study reports an intensity-driven Mott-like transition in a two-dimensional Ruddlesden–Popper perovskite.", "abstract": "Two-dimensional Ruddlesden-Popper-type halide perovskites have emerged as promising cutting-edge nonlinear optical materials due to their strong excitonic effects and carrier-density-dependent optical responses. In this work, we investigate the nonlinear optical properties and ultrafast carrier dynamics of (BA)$_2$PbI$_4$ under infrared excitation, resonant with the two-photon energy of its excitonic transition. Using a nonlinear femtosecond Z-scan measurement with a 1030\\,nm pump pulse, we observe a pronounced intensity-dependent evolution of the nonlinear absorption coefficient and the refractive index. With increasing pump intensity, a switch from saturable absorption to reverse saturable absorption emerges, suggesting an intensity-driven Mott-like transition. To elucidate the underlying carrier dynamics, intensity-dependent transient absorption spectroscopy was performed under the same excitation intensities. This reveals a long-lived charge carrier population above the estimated Mott density, reflecting a clear phase transition from an exciton-dominated regime to a dense electron-hole plasma regime. Moreover, such an intensity-driven, high, and switchable nonlinear optical response, along with a Mott-like transition under infrared pulse excitation, makes the 2D (BA)$_2$PbI$_4$ perovskites suitable for all-optical operation in the infrared regime.", "method": "", "result": "", "future": "", "summary_zh": "在二维 Ruddlesden–Popper 钙钛矿中研究光强驱动的类 Mott 转变。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "The paper experimentally evidences and analyzes an in re": "", "summary_zh": "通过空位束缚环态及其杂化描述陈绝缘体中强无序驱动的拓扑相变。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "Provides a microscopic theoretical framework for disorder-induced topological phase transition in Chern insulators via vacancy-bound in-gap ring states, with real-space analysis linking localized states to global topological destruction.", "feature_candidate": true, "physics_advance": "Elucidation of strong-disorder topological phase transition mechanism in Chern insulators mediated by hybridization and inversion of vacancy-bound ring states.", "ai_in_scope": true}, {"id": "arxiv-2610-29729", "arxiv_id": "2610.29729", "type": "arXiv", "journal": "arXiv:2610.29729", "journal_ref": "", "title": "Intertwined complex orbital order and ferrimagnetism in honeycomb molybdate Fe$_2$Mo$_3$O$_8$", "authors": "Hong-Hao Song, Gang v. Chen", "corresponding": "", "url": "https://arxiv.org/abs/2610.29729", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The authors study intertwined orbital ordering and ferrimagnetism in honeycomb Fe2Mo3O8.", "summary": "The authors study intertwined orbital ordering and ferrimagnetism in honeycomb Fe2Mo3O8.", "abstract": "Motivated by the recent experimental interest in honeycomb molybdates A$_2$Mo$_3$O$_8$, we return and develop the minimal models to capture the essential physics for Fe$_2$Mo$_3$O$_8$. It is pointed out that, the magnetism in these materials arises from the mutual induction between the spin-orbit coupling of the tetrahedral sublattice with active orbitals and the superexchange with the spins from the octahedral sublattice. Essentially, the superexchange between the tetrahedral and octahedral sublattices directly drives the ferrimagnetism, and the residual spin-orbit coupling on the tetrahedral sublattice in ear NbN nanowire coupled to YIG magnons exhibits kinetic-inductance parametric amplification with up to 7 dB detuned gain.", "abstract": "Parametric amplification enables sensitive microwave detection and signal processing by amplifying weak signals with minimal added noise. Here, we demonstrate kinetic inductance mediated parametric amplification in a hybrid magnonic system comprising a nonlinear NbN nanowire resonator strongly coupled to a yttrium iron garnet sphere. The resonator exhibits four wave mixing and nonlinear frequency pulling, enabling parametric amplification both away from and within the magnon-photon strong coupling regime. In the magnon detuned regime, we observe 7 dB gain, while coupling to the YIG magnon shifts the parametric amplification response by ~20 MHz and yields 3.4 dB gain in the hybrid mode. Thus, magnon photon coupling provides a route to magnetically tune the spectral position of kinetic inductance parametric amplification. At higher pump powers, the system transitions to a self oscillatory regime featuring comb-like sidebands and probe activated nonlinear mode mixing. These results establish hybrid magnonics as a platform for tunable nonlinear microwave amplification and dynamics.", "method": "", "result": "", "future": "", "summary_zh": "本文展示了在由非线性NbN纳米线谐振腔与YIG球体强耦合构成的混合磁振子系统中实现的动感感应参量放大。系统表现出可调谐的微波放大和由磁振子-光子相互作用介导的非线性动力学。", "tier": "Nature Communications/Science Advances/PRX", "tier_reason_en": "The work demonstrates a novel tunable microwave amplification mechanism in hybrid magnonics with clear experimental validation and potential quantum technology applications, fitting the profile of a high-impact interdisciplinary journal.", "tier_reason_zh": "该研究在混合磁振子领域展示了新颖的可调微波放大机制，有明确实验验证及量子技术潜力，符合高影响力跨学科期刊的特点。", "relevance_score": 65, "relevance_method": "semantic", "relevance_reason": "The work shows experimentally kinetic inductance mediated parametric amplification in a hybrid magnonic-superconducting system, revealing magnon-photon
