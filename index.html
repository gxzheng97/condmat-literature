 flavor chemical potential, corresponding to a Zeeman perturbation, the authors find a chiral-flux phase with finite mean emergent gauge flux and relativistic Landau levels for the Dirac fermions. Field-theory arguments indicate spontaneous breaking of U(1)ₘ magnetic symmetry in this phase, implying a gapless photon mode that would contribute to the low-energy longitudinal spin response. The calculated spin structure factors agree with the stated continuum and lattice mean-field predictions. Elsewhere in the phase diagram, strong gauge-field fluctuations produce antiferromagnetic order with gapped Dirac fermions and a deconfined gauge field, and an intermediate regime exhibits coexistence of antiferromagnetism and chiral flux.", "result_zh": "在味化学势为零时，该模型实现 QED₃；此前有研究提出以此描述 Dirac 自旋液体。在有限味化学势下——对应于塞曼扰动——作者发现手征磁通相，其中存在非零平均涌现规范磁通，Dirac 费米子形成相对论朗道能级。场论论证表明，该相中 U(1)ₘ 磁对称性会自发破缺，从而产生无能隙光子模，并对低能纵向自旋响应作出贡献。计算得到的自旋结构因子与文中给出的连续及格点平均场预测相符。在相图的其他区域，强规范场涨落导致反铁磁有序、Dirac 费米子开隙而规范场保持去禁闭；两者之间还出现反铁磁序与手征磁通共存的区域。", "future_en": "Further work could test the predicted longitudinal and transverse spin responses in frustrated antiferromagnets under a Zeeman field, as proposed by the authors. Studies could also examine whether the predicted chiral-flux, antiferromagnetic, and coexistence regimes are realized across the relevant parameter space in candidate Dirac spin liquids.", "future_zh": "后续研究可按作者提出的方向，在塞曼场作用下的受挫反铁磁体中检验其预测的纵向与横向自旋响应。还可进一步考察候选 Dirac 自旋液体在相关参数范围内是否实现手征磁通相、反铁磁相及其共存区域。"}, {"id": "doi-10-1103-vcvp-w5fd", "doi": "10.1103/vcvp-w5fd", "title": "Nonrelativistic Optically Induced Spin Torque in Noncollinear Magnets", "type": "Journal", "journal": "PRL", "authors": "Zhiyuan Li, Jian Zhou", "abstract": "Manipulating spin using contactless and non-invasive optical approaches is one of the forefront topic in the modern spintronic science and technology. Prior studies on optically-induced spin reorientation usually scales with spin-orbit coupling strength, setting a limitation on compo lly scales with spin-orbit coupling strength, setting a limitation on composing heavy elements. In this work, we extend such a limit into nonrelativistic regime by exploring noncollinear magn", "related_arxiv_id": "2610.16052", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Symmetries of spin and lattice operators can generate optical spin torque in noncollinear magnets even without relying on spin-orbit coupling, with associated selection rules and quantum-geometric effects.", "ai_in_scope": true, "relevance_reason": "Theoretical analysis of optically driven torque in noncollinear magnets establishes a condensed-matter spin-dynamics mechanism and predicts its realization in magnetic materials.", "relevance_method": "semantic", "relevance_score": 73, "feature_candidate": false, "summary_zh": "本研究建立了一个用于描述非共线磁体中光诱导自旋力矩的群论框架，其机制不依赖自旋—轨道耦合。作者通过 kagome 晶格模型和一类真实材料展示了光照下预测的局域力矩。", "method_en": "The authors analyze spin and lattice symmetries using spin-group theory, deriving selection rules and relating symmetric operators to spin torque and Bloch-state quantum geometry. They then apply the framework to a kagome-lattice model and a realistic material family.", "method_zh": "作者利用自旋群理论分析自旋与晶格对称性，推导选择定则，并关联对称算符、自旋力矩与布洛赫态量子几何。随后，他们将该框架应用于 kagome 晶格模型及一类真实材料。", "result_en": "The work identifies how symmetric operators in spin and lattice spaces govern optically induced torque and the quantum metric and Berry curvature of Bloch wavefunctions, and it specifies site-resolved spin symmetries and selection rules. The kagome model and realistic material family illustrate local spin torque under irradiation. The authors argue that, because nonrelativistic spin splitting is typically on the order of electron-volts and exceeds typical spin–orbit-induced splitting, the resulting torque can be much stronger than its relativistic counterpart.", "result_zh": "研究阐明了自旋空间与晶格空间中的对称算符如何控制光诱导力矩以及布洛赫波函数的量子度规和 Berry 曲率，并给出了位点分辨的自旋对称性与选择定则。kagome 模型和真实材料类别展示了光照下的局域自旋力矩。作者指出，非相对论自旋劈裂通常达到电子伏特量级，显著大于典型的自旋—轨道诱导劈裂，因此相应力矩可能远强于其相对论对应形式。", "future_en": "Experimental work could test the predicted site-resolved selection rules and local spin torque under optical irradiation in suitable noncollinear magnets. Further studies could assess how the proposed nonrelativistic response compares with spin–orbit-driven optical torque across the material family considered.", "future_zh": "后续实验可在适当的非共线磁体中检验所预测的位点分辨选择定则及光照下的局域自旋力矩。还可在所讨论的材料类别中进一步评估这种非相对论响应与自旋—轨道驱动光学力矩的相对强度。"}, {"id": "doi-10-1038-s41467-026-78306-1", "doi": "10.1038/s41467-026-78306-1", "title": "Observation of quantized charge accumulation in a quantum anomalous Hall system", "type": "Journal", "journal": "Nature Communications", "authors": "Yuanze Li, Jiahao Chen, Renfei Wang, Yifan Zhang, Yingdong Deng, Jin Xie, Xufeng Kou, Yang Liu, Tian Liang", "abstract": "The quantum anomalous Hall effect in magnetically doped topological insulators exhibits a quantized Hall conductance σxy = e2/h arising from the two-dimensional surface states. While conventional transport probes confirm this quantization, they remain insensitive to the field-induced surface charge accumulation as a direct manifestation of σxy. Here, we experimentally validate an out-of-plane capacitive method that directly detects this quantized charge accumulation in a quantum anomalous Hall system. Using Corbino and simple disk devices, we measure charge accumulation proportional to field variation ΔB, with dissipation characterized by longitudinal conductance σxx and frequency f. A quantitative dissipation model extracts the intrinsic quantized charge density η0 = (e2/h)ΔB, which is confirmed through f- and σxx-dependent measurements. Under ultra-low dissipation (σxx ≈ 10−9 S), we directly resolve the fully quantized charge accumulation. This methodology establishes a direct charge-accumulation probe and provides a pathway toward detecting the topological magnetoelectric effect, a condensed matter manifestation of the four-dimensional quantum Hall effect. The quantum anomalous Hall effect in a magnetically doped topological insulator exhibits a quantized Hall conductance. Here, the authors demonstrate an out-of-plane capacitive method that directly measures field-induced quantized charge accumulation originating from the quantized Hall conductance.", "crossref_online_date": [[2026, 10, 30]], "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78306-1", "level": "Feature", "method": "", "result": "", "future": "", "article_kind": "Article", "publication_date": "2026-10-30", "publication_status": "published", "publication_evidence": {"source": "publisher", "url": "https://www.nature.com/articles/s41467-026-78306-1"}, "abstract_source": "publisher", "abstract_status": "available", "topic": "Magnetism", "summary_en": "This work demonstrates an out-of-plane capacitive method for directly detecting field-induced charge accumulation in a quantum anomalous Hall system. Under ultra-low dissipation, it resolves charge accumulation consistent with the quantized Hall conductance.", "summary": "The quantum anomalous Hall effect in magnetically doped topological insulators exhibits a quantized Hall conductance σxy = e2/h arising from the two-dimensional surface states. While conventional transport probes confirm this quantization, they remain insensitive to the field-induced surface charge accumulation as a direct manifestation of σxy. Here, we experimentally validate an out-of-plane capa", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "Field-induced charge accumulation in a quantum anomalous Hall system is directly measured and shown, after accounting for dissipation, to follow the quantized density η₀ = (e²/h)ΔB.", "ai_in_scope": true, "relevance_reason": "It directly probes a distinctive quantized response of a quantum anomalous Hall material and resolves the quantized charge accumulation in the low-dissipation regime.", "relevance_method": "semantic", "relevance_score": 80, "feature_candidate": true, "summary_zh": "本研究展示了一种面外电容测量方法，可直接探测量子反常霍尔系统中由磁场诱导的电荷积累。在耗散极低时，实验分辨出与量子化霍尔电导相符的电荷积累。", "method_en": "The authors measure charge accumulation in Corbino and disk devices using an out-of-plane capacitive technique while varying the magnetic field. They model dissipation in terms of longitudinal conductance σxx and frequency f, and use measurements with different f and σxx to extract the intrinsic response.", "method_zh": "作者采用面外电容技术，在 Corbino 和圆盘器件中测量磁场变化引起的电荷积累。他们建立以纵向电导 σxx 和频率 f 表征的耗散模型，并通过改变 f 与 σxx 的测量提取本征响应。", "result_en": "The measured charge accumulation is proportional to the field variation ΔB, with its observed magnitude affected by dissipation. The quantitative model yields an intrinsic quantized charge density η₀ = (e²/h)ΔB, consistent with the frequency- and σxx-dependent measurements. At ultra-low dissipation, σxx ≈ 10⁻⁹ S, the experiment directly resolves the fully quantized charge accumulation. The authors present the method as a direct probe of charge accumulation associated with the quantum anomalous Hall response and as a possible route toward detecting the topological magnetoelectric effect.", "result_zh": "测得的电荷积累与磁场变化 ΔB 成正比，其观测幅度受耗散影响。定量模型提取出的本征量子化电荷密度为 η₀ = (e²/h)ΔB，与频率及 σxx 依赖的测量结果一致。当耗散极低、σxx ≈ 10⁻⁹ S 时，实验直接分辨出完全量子化的电荷积累。作者将该方法视为探测量子反常霍尔响应所伴随电荷积累的直接手段，并提出其可能用于探测拓扑磁电效应。", "future_en": "Follow-up experiments could test the capacitive probe in regimes with varied frequency and longitudinal conductance, extending the characterization of its dissipation dependence. The proposed application to the topological magnetoelectric effect remains a direction for future experimental investigation.", "future_zh": "后续实验可在不同频率和纵向电导条件下检验该电容探针，进一步刻画其耗散依赖性。将该方法用于探测拓扑磁电效应仍有待未来实验研究。"}, {"id": "doi-10-1038-s41567-026-03504-z", "doi": "10.1038/s41567-026-03504-z", "title": "Thermodynamic demonstration of tetracriticality and multicomponent superconductivity in UTe2", "type": "Journal", "journal": "Nature Physics", "authors": "Sahas Kamat, Jared Dans, Shanta Saha, Artem D. Kokovin, Johnpierre Paglione, Jörg Schmalian, B. J. Ramshaw", "abstract": "The candidate topological superconductor UTe2 exhibits a complex phase diagram with multiple superconducting states, and the nature of their coexistence is not yet resolved. In particular, the apparent observation of two intersecting second-order phase boundaries at a triple point in the pressure–temperature phase diagram is thermodynamically forbidden. This suggests either a hidden phase transition or a fundamental misunderstanding of the superconductivity in this material. Here we observe an additional phase boundary that is characterized by an upward jump in the sound velocity. This is direct thermodynamic evidence for a phase transition in which superconducting order is lost on cooling. Our results establish a tetracritical point beyond which the ambient and pressure-induced superconducting order parameters form a multicomponent state. We use the measured phase diagram to demonstrate that strong competition between the two superconducting order parameters drives the loss of order when cooling, and leads to phase locking that suppresses superconducting fluctuations. These findings provide the definitive magnetic field–pressure–temperature phase diagram of UTe2 and establish a thermodynamic foundation for multicomponent superconductivity. Prior measurements of the phase diagram of UTe2 contain a triple point that is forbidden by thermodynamics. Now, an additional phase boundary is discovered that resolves this problem and confirms multicomponent superconductivity in this material.", "crossref_online_date": [[2026, 10, 30]], "corresponding": "", "url": "https://doi.org/10.1038/s41567-026-03504-z", "level": "Feature", "method": "", "result": "", "future": "", "article_kind": "Article", "publication_date": "2026-10-30", "publication_status": "published", "publication_evidence": {"source": "publisher", "url": "https://www.nature.com/articles/s41567-026-03504-z"}, "abstract_source": "publisher", "abstract_status": "available", "topic": "Superconductivity", "summary_en": "This study resolves a thermodynamic inconsistency in the pressure–temperature phase diagram of UTe₂ by identifying an additional phase boundary. The resulting phase diagram supports a tetracritical point and a multicomponent superconducting state formed from ambient-pressure and pressure-induced order parameters.", "summary": "The candidate topological superconductor UTe2 exhibits a complex phase diagram with multiple superconducting states, and the nature of their coexistence is not yet resolved. In particular, the apparent observation of two intersecting second-order phase boundaries at a triple point in the pressure–temperature phase diagram is thermodynamically forbidden. This suggests either a hidden phase transiti", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "An additional phase boundary establishes a tetracritical point where ambient-pressure and pressure-induced superconducting order parameters form a multicomponent state, with competition and phase locking accounting for the loss of order on cooling.", "ai_in_scope": true, "relevance_reason": "It provides direct thermodynamic evidence that resolves the UTe2 superconducting phase diagram and establishes multicomponent superconductivity in a quantum material.", "relevance_method": "semantic", "relevance_score": 89, "feature_candidate": true, "summary_zh": "本研究通过发现一条额外相界，解决了 UTe₂ 压力—温度相图中的热力学矛盾。由此得到的相图支持四临界点的存在，并表明环境压力与压力诱导的超导序参量构成多组分超导态。", "method_en": "The authors use sound-velocity measurements to identify an additional phase boundary, marked by an upward jump in sound velocity, and construct the magnetic-field–pressure–temperature phase diagram. They interpret the measured phase boundaries in terms of competition and coupling between the two superconducting order parameters.", "method_zh": "作者通过声速测量识别出一条额外相界，其特征是声速向上跃变，并据此构建磁场—压力—温度相图。他们结合测得的相界，分析两个超导序参量之间的竞争与耦合。", "result_en": "The additional boundary provides direct thermodynamic evidence for a transition in which superconducting order is lost upon cooling. Its identification resolves the previously reported triple-point inconsistency and establishes a tetracritical point. Beyond that point, the ambient-pressure and pressure-induced superconducting order parameters form a multicomponent state. The authors attribute the loss of order on cooling to strong competition between the order parameters, and report that phase locking suppresses superconducting fluctuations. The resulting phase diagram is presented as a thermodynamic foundation for multicomponent superconductivity in UTe₂.", "result_zh": "额外相界为一种随降温而失去超导序的相变提供了直接热力学证据。该相界的发现消除了此前相图中三相点与热力学不相容的问题，并确立了四临界点。在该点之外，环境压力与压力诱导的超导序参量形成多组分态。作者将降温时序的消失归因于两个序参量之间的强竞争，并指出相位锁定会抑制超导涨落。所得相图为理解 UTe₂ 的多组分超导性提供了热力学基础。", "future_en": "Further work could test the reported order-parameter competition and phase locking with independent probes across the identified phase boundaries. The magnetic-field–pressure–temperature phase diagram also provides a basis for examining how the multicomponent state evolves under changes in field and pressure.", "future_zh": "后续研究可利用独立实验探针，在已识别的相界附近检验所提出的序参量竞争与相位锁定。该磁场—压力—温度相图也为进一步考察多组分态随磁场和压力变化的演化提供了依据。"}], "stats": {"scanned": 55, "first_pass_selected": 4, "selected": 4, "rejected": 51, "ai_assessed": 55, "ai_cached": 0, "ai_unscored": 0, "global_editorial": true, "field_scope_excluded": 0, "duplicate_work_excluded": 0, "arxiv_selected": 0, "journal_selected": 4, "arxiv_harvest_excluded": 0, "pending_journal_abstracts": 3, "non_original_excluded": 13, "publication_not_eligible": 28}}, {"date": "2026-10-30", "title": "Daily Condensed Matter Literature", "generated_at": "2026-10-30T06:00:34.969125-07:00", "screening_ve on quasiparticle is a bound st", "related_arxiv_id": "2512.17801", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "The simulated heavy-fermion and Kondo-breakdown regimes have distinct composite-fermion coherence, low-frequency transport, and Luttinger-volume counts, providing transport and spectral fingerprints of gauge-mediated Kondo breakdown.", "ai_in_scope": true, "relevance_reason": "Sign-problem-free simulations establish a nonperturbative account of Kondo breakdown and its electronic and transport signatures in a heavy-fermion model.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": false, "summary_zh": "本研究采用紧致 U(1) 晶格规范模型和无符号问题的行列式量子蒙特卡洛，研究耦合二维狄拉克导电电子的自旋链中的 Kondo 失效。研究区分出两种状态：具有尖锐复合费米子共振和稳健低频输运的重费米子金属，以及具有非相干共振和消失的低频输运的 Kondo 失效金属。", "method_en": "The model represents the spin chain using spin-carrying fermionic partons with U(1) gauge charge and describes the heavy-fermion quasiparticle as a bound state of a charged U(1) matter field and a parton. The authors investigate it with sign-problem-free determinant quantum Monte Carlo.", "method_zh": "模型以携带自旋和 U(1) 规范荷的费米子 parton 描述自旋链，并将重费米子准粒子表示为带电 U(1) 物质场与 parton 的束缚态。作者使用无符号问题的行列式量子蒙特卡洛进行研究。", "result_en": "The simulations identify two symmetry-equivalent regimes: a heavy-fermion metal with a sharp composite-fermion resonance and robust low-frequency transport, and a Kondo-breakdown metal with an incoherent resonance and vanishing low-frequency transport. For any finite lattice extent perpendicular to the chain, the heavy-fermion phase’s Luttinger volume counts both composite and conduction electrons, whereas the Kondo-breakdown phase’s volume counts only conduction electrons. Changes in the composite-fermion spectrum, dynamical spin structure factor, and optical conductivity provide a nonperturbative demonstration of gauge-mediated Kondo breakdown and transport signatures of an orbital-selective Mo um allows the replicas to hybridize with bands offset in both energy and momentum.", "summary": "Floquet phenomena - where a coherent, time-periodic drive hybridizes the conduction band with energy-replicated copies of the valence band - have been demonstrated with intense optical fields and, more recently, other bosonic excitations. However, within mean-field approximations and the current understanding of Floquet phenomena, these effects survive only for the coherence time of the drive, lim", "abstract": "Floquet phenomena - where a coherent, time-periodic drive hybridizes the conduction band with energy-replicated copies of the valence band - have been demonstrated with intense optical fields and, more recently, other bosonic excitations. However, within mean-field approximations and the current understanding of Floquet phenomena, these effects survive only for the coherence time of the drive, limiting practical use and current demonstrations to the sub-picosecond regime. Here, consistent with recent theoretical predictions beyond the mean-field picture, using time- and angle-resolved photoemission spectroscopy in WSe$_2$/MoS$_2$ heterostructures, we show that incoherent, dense populations of dark interlayer excitons hybridize the conduction band with energy-replicated copies of the valence band, mimicking Floquet-like phenomena - now persisting for nearly a nanosecond. With increasing interlayer exciton density, the valence band and its replica evolve from an inverted-parabolic to a Mexican-hat dispersion, a signature of the predicted non-zero static coupling that hybridizes the bands and scales linearly with the exciton density. By tuning twist angle, we further show that dark excitons with net momentum create replicas that hybridize with bands offset not just in energy but also in momentum, providing another powerful degree of freedom beyond conventional Floquet engineering. These results establish a robust, long-lived route to engineering electronic states, beyond a coherent, zero-momentum drive.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "Dense incoherent dark interlayer excitons produce Floquet-like band replicas and hybridization lasting nearly a nanosecond; twist angle enables replicas and hybridization at finite momentum, while increasing density drives a valence-band dispersion toward a Me", "ai_in_scope": true, "relevance_reason": "The work experimentally demonstrates long-lived exciton-induced electronic-band hybridization in TMD heterostructures, establishing a distinctive collective electronic phenomenon in low-dimensional materials.", "relevance_method": "semantic", "relevance_score": 84, "feature_candidate": false, "summary_zh": "本研究报告，在 WSe₂/MoS₂ 异质结构中，密集的非相干暗层间激子可诱导类 Floquet 能带副本，并使其持续近一纳秒。时间分辨与角分辨光电子能谱还显示，通过扭转角调节激子动量，可使副本与能量和动量均有偏移的能带发生杂化。", "method_en": "The authors use time- and angle-resolved photoemission spectroscopy on WSe₂/MoS₂ heterostructures to track band dispersions in the presence of dark interlayer excitons. They vary exciton density and twist angle to examine the density-dependent band reconstruction and the role of exciton momentum.", "method_zh": "作者在 WSe₂/MoS₂ 异质结构上使用时间分辨与角分辨光电子能谱，追踪暗层间激子存在时的能带色散。研究调节激子密度和扭转角，以考察随密度变化的能带重构及激子动量的作用。", "result_en": "The measurements show that dense, incoherent dark interlayer excitons hybridize the conduction band with energy-replicated valence-band states, producing Floquet-like effects that persist for nearly a nanosecond. As exciton density increases, the valence band and its replica evolve from an inverted-parabolic dispersion to a Mexican-hat dispersion. The abstract identifies this evolution as a signature of a predicted non-zero static coupling that scales linearly with exciton density. By tuning the twist angle, the authors further show that finite-momentum dark excitons produce replicas that hybridize with bands offset in both energy and momentum.", "result_zh": "测量显示，密集的非相干暗层间激子使导带与能量复制的价带态发生杂化，产生持续近一纳秒的类 Floquet 效应。随着激子密度增加，价带及其副本的色散由倒抛物线形演变为墨西哥帽形。摘要将这一演变视为所预测的非零静态耦合的特征，该耦合随激子密度线性增长。作者还通过调节扭转角显示，具有有限动量的暗激子会产生副本，并使其与能量和动量均有偏移的能带杂化。", "future_en": "Further measurements could map the lifetime and band-reconstruction signatures across exciton densities to test the reported nearly nanosecond persistence and linear density dependence. Exploring additional twist angles could also clarify the range of momentum offsets over which dark-exciton-induced hybridization occurs.", "future_zh": "后续测量可在不同激子密度下系统绘制寿命和能带重构特征，以检验所报告的近一纳秒持续时间及线性密度依赖。进一步探索不同扭转角，也可明确暗激子诱导杂化所覆盖的动量偏移范围。", "tier": "Nature Physics/Nature Materials", "tier_reason_en": "The abstract reports a striking lifetime extension to nearly a nanosecond for Floquet-like band hybridization, along with twist-controlled momentum-offset hybridization measured by time- and angle-resolved photoemission. The combination of a substantial advance over the stated sub-picosecond regime and an additional tuning degree of freedom supports a high-tier physics assessment.", "tier_reason_zh": "摘要报告类 Floquet 能带杂化持续近一纳秒这一显著长寿命效应，并通过时间分辨与角分辨光电子能谱展示了由扭转角控制的动量偏移杂化。相较摘要所述亚皮秒时间尺度的明显进展，加上新增的调控自由度，支持将其评为高水平物理学工作。"}, {"id": "arxiv-2610-39218", "arxiv_id": "2610.39218", "type": "arXiv", "journal": "arXiv:2610.39218", "journal_ref": "", "journal_doi": "", "title": "Colossal magnetoresistance in narrow-gap magnetic semiconductor Eu$_2$CdAs$_2$", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-29T02:38:42Z", "updated_at": "2026-10-29T02:38:42Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Zhiyu Zhou, Zhi-Cheng Wang, Xiyu Chen, Xin-Yu Zhao, Yaran Duan, Shiran Tao, Guang-Han Cao, Shuai Dong", "corresponding": "", "url": "https://arxiv.org/abs/2610.39218v1", "topic": "Magnetism", "level": "Brief", "summary_en": "This study reports antiferromagnetic ordering at 9 K and a colossal magnetoresistance of −10⁴% at 9 T in the narrow-gap Zintl arsenide Eu₂CdAs₂, which has a low-temperature activation energy of 3.2 meV. It also finds butterfly-shaped magnetoresistance hysteresis below the ordering temperature and a near-exponential trend between maximum CMR magnitude and low-temperature activation energy across reported Eu-based Zintl phases.", "summary": "Discovering antiferromagnetic materials with a sizable colossal magnetoresistance (CMR) effect and precisely tuning their responses remain significant challenges in materials science. This work reports the synthesis, phase transitions, and magnetotransport properties of the narrow-gap Zintl arsenide Eu$_2$CdAs$_2$. The compound undergoes antiferromagnetic ordering at $T_\\mathrm{N} = 9$ K and exhib", "abstract": "Discovering antiferromagnetic materials with a sizable colossal magnetoresistance (CMR) effect and precisely tuning their responses remain significant challenges in materials science. This work reports the synthesis, phase transitions, and magnetotransport properties of the narrow-gap Zintl arsenide Eu$_2$CdAs$_2$. The compound undergoes antiferromagnetic ordering at $T_\\mathrm{N} = 9$ K and exhibits semiconducting behavior with a low-temperature activation energy of 3.2 meV, achieving a large CMR effect of $-10^4\\%$ at 9 T. Below $T_\\mathrm{N}$, a distinct butterfly-shaped magnetoresistance hysteresis emerges without any macroscopic ferromagnetic order, revealing a transport anomaly likely dictated by AFM domain dynamics and/or the formation and percolation of localized magnetic polarons. Furthermore, a systematic survey of reported Eu-based Zintl phases uncovers a nearly exponential scaling trend between the maximum CMR magnitude and the low-temperature activation energy. This correlation demonstrates that bandgap engineering serves as an effective strategy for tailoring magnetotransport, establishing Eu-containing Zintl phases as a versatile platform for exploring and manipulating CMR effects.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "Reports approximately −10^4% colossal magnetoresistance in antiferromagnetic Eu₂CdAs₂ and butterfly-shaped low-temperature hysteresis without macroscopic ferromagnetic order, with magnetic-domain dynamics or localized-polaron percolation proposed as possible e", "ai_in_scope": true, "relevance_reason": "This experimental study establishes large magnetoresistance and unusual antiferromagnetic transport behavior in a magnetic semiconductor.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "本研究报告窄带隙 Zintl 砷化物 Eu₂CdAs₂ 在 9 K 发生反铁磁有序，并在 9 T 下呈现 −10⁴% 的庞磁阻；其低温激活能为 3.2 meV。研究还发现有序温度以下出现蝴蝶形磁阻滞后，并在已报道的 Eu 基 Zintl 相中观察到最大 CMR 幅度与低温激活能之间近似指数关系。", "method_en": "The authors synthesize Eu₂CdAs₂ and characterize its phase transitions and magnetotransport, including its low-temperature activation energy and field-dependent resistance. They also survey reported Eu-based Zintl phases to examine the relationship between maximum CMR magnitude and activation energy.", "method_zh": "作者合成 Eu₂CdAs₂，并表征其相变和磁输运性质，包括低温激活能及电阻随磁场的变化。研究还梳理已报道的 Eu 基 Zintl 相，以考察最大 CMR 幅度与激活能之间的关系。", "result_en": "Eu₂CdAs₂ orders antiferromagnetically at Tₙ = 9 K and shows semiconducting behavior with a low-temperature activation energy of 3.2 meV. It exhibits a CMR effect of −10⁴% at 9 T, and below Tₙ its magnetoresistance has a distinct butterfly-shaped hysteresis despite the absence of macroscopic ferromagnetic order. The authors suggest that the transport anomaly may be governed by antiferromagnetic domain dynamics and/or the formation and percolation of localized magnetic polarons. Their survey of reported Eu-based Zintl phases reveals a near-exponential scaling trend between maximum CMR magnitude and low-temperature activation energy.", "result_zh": "Eu₂CdAs₂ 在 Tₙ = 9 K 时发生反铁磁有序，并呈现半导体行为，低温激活能为 3.2 meV。该材料在 9 T 下表现出 −10⁴% 的 CMR；在 Tₙ 以下，即使不存在宏观铁磁有序，磁阻仍出现鲜明的蝴蝶形滞后。作者提出，这一输运异常可能受反铁磁畴动力学和/或局域磁极化子形成及渗流支配。对已报道 Eu 基 Zintl 相的梳理发现，最大 CMR 幅度与低温激活能之间存在近似指数标度趋势。", "future_en": "Further measurements could distinguish the proposed roles of antiferromagnetic domain dynamics and localized magnetic polarons in the hysteretic transport anomaly. Testing the reported activation-energy trend in additional Eu-based Zintl phases would also assess its usefulness for guiding band-gap engineering.", "future_zh": "后续测量可区分反铁磁畴动力学与局域磁极化子在滞后输运异常中的作用。对更多 Eu 基 Zintl 相检验所报告的激活能趋势，也有助于评估其指导带隙工程的实用性。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The abstract reports a large magnetoresistance and a potentially useful trend across Eu-based Zintl phases, making the work a strong materials-focused study. Because the proposed origin of the hysteresis remains tentative and the abstract does not establish a broader mechanism, a specialized condensed-matter tier is the best fit.", "tier_reason_zh": "摘要报告了显著磁阻及 Eu 基 Zintl 相中可能有用的趋势，构成一项有力的材料研究。但滞后现象的起源仍属推测，摘要也未确立更广泛的机制，因此专业凝聚态层级较为合适。"}, {"id": "arxiv-2610-37754", "arxiv_id": "2610.37754", "type": "arXiv", "journal": "arXiv:2610.37754", "journal_ref": "", "journal_doi": "", "title": "Meta-Altermagnetism and Enhanced Spin-Splitting", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-27T18:00:01Z", "updated_at": "2026-10-27T18:00:01Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Bogeng Wen, Hae-Young Kee", "corresponding": "", "url": "https://arxiv.org/abs/2610.37754v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper proposes meta-altermagnetism, a discontinuous change in altermagnetic order that can occur when magnetic-order-induced band reconstruction moves spin-split van Hove singularities across the Fermi level. It predicts a regime in which reduced staggered magnetization coexists with enhanced magnetic octupole and spin-splitter conductivity.", "summary": "Altermagnets are collinear magnets with zero net magnetization and spin-split electronic bands. Here, we explore whether altermagnetism can exhibit a discontinuous jump, a phenomenon we refer to as meta-altermagnetism. We show that meta-altermagnetism can emerge in 2D systems when magnetic-order-induced band reconstruction drives spin-split van Hove singularities (vHSs) across the Fermi level. Usi", "abstract": "Altermagnets are collinear magnets with zero net magnetization and spin-split electronic bands. Here, we explore whether altermagnetism can exhibit a discontinuous jump, a phenomenon we refer to as meta-altermagnetism. We show that meta-altermagnetism can emerge in 2D systems when magnetic-order-induced band reconstruction drives spin-split van Hove singularities (vHSs) across the Fermi level. Using mean-field theory for an extended $t$-$J$ model on a two-sublattice square lattice including anisotropic hopping integral, we find that a first-order meta-altermagnetic transition produces an intermediate altermagnetic regime with reduced staggered magnetization but strongly enhanced magnetic octupole and time-reversal-odd spin-splitter conductivity. We further show that the first-order transition line terminates at a quantum critical endpoint, giving rise to a rich phase diagram as the chemical potential and anisotropic hopping strength are varied. Our results identify the spin split vHSs as a route to enhancing spin-splitter effect for spintronic applications.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "In the extended t-J model, spin-split van Hove singularities crossing the Fermi level can produce a first-order meta-altermagnetic transition, an intermediate regime with enhanced magnetic octupole and spin-splitter conductivity, and a quantum critical endpoin", "ai_in_scope": true, "relevance_reason": "This theoretical study identifies a first-order transition and quantum critical endpoint in an altermagnetic electronic system, with implications for its spin-split transport.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "本文提出“元交错磁性”（meta-altermagnetism），即当磁有序诱导的能带重构使自旋劈裂的范霍夫奇点穿越费米能级时，交错磁序可能发生不连续变化。研究预测，在这一机制下，较弱的交错磁化可与增强的磁八极矩及自旋分流电导并存。", "method_en": "The authors use mean-field theory for an extended t-J model on a two-sublattice square lattice with anisotropic hopping. They analyze how the reconstructed bands and magnetic order vary with chemical potential and hopping anisotropy.", "method_zh": "作者对含各向异性跃迁的双亚晶格方格晶格扩展 t-J 模型进行平均场研究。分析了重构能带与磁序随化学势和跃迁各向异性变化的情况。", "result_en": "The calculations yield a first-order meta-altermagnetic transition and an intermediate altermagnetic regime with reduced staggered magnetization but strongly enhanced magnetic octupole and time-reversal-odd spin-splitter conductivity. The first-order transition line ends at a quantum critical endpoint, producing a phase diagram that varies with chemical potential and anisotropic hopping strength.", "result_zh": "计算得到一阶元交错磁性转变，以及一个交错磁中间相：其交错磁化减弱，但磁八极矩和时间反演奇的自旋分流电导显著增强。一阶转变线终止于量子临界端点，并随化学势和各向异性跃迁强度变化形成丰富的相图。", "future_en": "A useful next step would be to test whether materials or devices can access the predicted spin-split van Hove singularities and the associated enhancement of spin-splitter conductivity.", "future_zh": "后续可研究是否存在能够调控至所预测自旋劈裂范霍夫奇点附近、并检验相关自旋分流电导增强的材料或器件。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work presents a coherent theoretical mechanism and phase diagram, but its evidence is based on mean-field calculations for a model rather than material-specific validation, supporting a strong specialist-journal tier.", "tier_reason_zh": "该研究提出了连贯的理论机制并给出相图，但证据来自模型的平均场计算，尚无针对具体材料的验证，因此适合较强的专业期刊档次。"}, {"id": "arxiv-2610-39695", "arxiv_id": "2610.39695", "type": "arXiv", "journal": "arXiv:2610.39695", "journal_ref": "", "journal_doi": "", "title": "Observation of light-induced topological state in graphene", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci"], "submitted_at": "2026-10-29T09:32:52Z", "updated_at": "2026-10-29T09:32:52Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Sotirios Fragkos, Ann Chantal Goutier, Umberto Dellasette, Dominique Descamps, Stéphane Petit, Wiebke Bennecke, Philip Hofmann, Marcel Reutzel, Stefan Mathias, Yann Mairesse, Michael Schüler, Samuel Beaulieu", "corresponding": "", "url": "https://arxiv.org/abs/2610.39695v1", "topic": "Magnetism", "level": "Brief", "summary_en": "Combining circular-dichroic time-resolved extreme-ultraviolet momentum microscopy with ab initio theory, the authors report a pump-induced photoemission circular dichroism near graphene’s Dirac point. Its sign reverses with pump helicity and across the Dirac energy, providing spectroscopic evidence associated with the pseudospin texture and Berry curvature of a light-induced Floquet topological insulating state.", "summary": "Driving quantum materials with light can reshape not only their electronic band structures but also the geometry of their electronic wavefunctions. In graphene, circularly polarized light is predicted to open gaps at the Dirac points and induce a pseudospin texture and Berry curvature characteristic of the Haldane model, realizing a Floquet Chern insulator. Transport and all-optical measurements h", "abstract": "Driving quantum materials with light can reshape not only their electronic band structures but also the geometry of their electronic wavefunctions. In graphene, circularly polarized light is predicted to open gaps at the Dirac points and induce a pseudospin texture and Berry curvature characteristic of the Haldane model, realizing a Floquet Chern insulator. Transport and all-optical measurements have provided evidence for a light-induced anomalous Hall response, but cannot resolve the underlying electronic states in both energy and momentum space. Time- and angle-resolved photoemission spectroscopy has revealed Floquet-Bloch sidebands and hybridization gaps at crossings between Floquet bands. However, these experiments used linearly polarized driving, which preserves time-reversal symmetry and thus does not induce a topological phase. Here, we combine circular-dichroic time-resolved extreme-ultraviolet momentum microscopy with ab initio theory to investigate graphene driven by circularly polarized light. We observe a pump-induced photoemission circular dichroism near the Dirac point that reverses sign with pump helicity and across the Dirac energy, in agreement with our calculations. These results link the measured dichroic response to the light-induced pseudospin texture and its associated Berry curvature, providing spectroscopic evidence for the Floquet-engineered topological insulating state in graphene.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "Helicity- and energy-dependent photoemission circular dichroism in driven graphene is linked to the Floquet-induced pseudospin texture and Berry curvature expected for a topological insulating state.", "ai_in_scope": true, "relevance_reason": "The experiment and calculations provide spectroscopic evidence for a light-induced topological electronic state in graphene.", "relevance_method": "semantic", "relevance_score": 85, "feature_candidate": false, "summary_zh": "作者结合圆二色性时间分辨极紫外动量显微术与第一性原理理论，在石墨烯狄拉克点附近观测到泵浦诱导的光电子圆二色性。该信号随泵浦光螺旋度以及跨越狄拉克能量而反号，为与光诱导 Floquet 拓扑绝缘态的赝自旋纹理和 Berry 曲率相关的谱学证据。", "method_en": "The study combines circular-dichroic time-resolved extreme-ultraviolet momentum microscopy with ab initio calculations to examine graphene driven by circularly polarized light. The measurements resolve the photoemission response near the Dirac point and test its dependence on pump helicity and energy relative to the Dirac point.", "method_zh": "该研究结合圆二色性时间分辨极紫外动量显微术与第一性原理计算，研究圆偏振光驱动的石墨烯。测量解析狄拉克点附近的光电子响应，并检验其对泵浦光螺旋度及相对于狄拉克点的能量位置的依赖。", "result_en": "The authors observe pump-induced photoemission circular dichroism near the Dirac point that reverses sign both when the pump helicity is reversed and across the Dirac energy, in agreement with their calculations. They connect this response to the light-induced pseudospin texture and associated Berry curvature, presenting it as spectroscopic evidence for Floquet-engineered topological insulating behavior. The abstract distinguishes this result from earlier time- and angle-resolved photoemission studies using linearly polarized driving, which does not induce the time-reversal-symmetry-breaking topological phase discussed here.", "result_zh": "作者观测到狄拉克点附近的泵浦诱导光电子圆二色性；改变泵浦光螺旋度或跨越狄拉克能量时，信号均会反号，与计算结果一致。他们将这一响应与光诱导的赝自旋纹理及其相关 Berry 曲率联系起来，并将其视为 Floquet 工程化拓扑绝缘行为的谱学证据。摘要指出，此结果不同于此前采用线偏振驱动的时间与角分辨光电子能谱研究，因为后者不会诱导本文讨论的破坏时间反演对称性的拓扑相。", "future_en": "Further momentum- and energy-resolved measurements that track the light-induced electronic states and their dependence on driving conditions could more fully test the proposed connection between the dichroism and Floquet topology.", "future_zh": "未来可开展更深入的动量与能量分辨测量，追踪光诱导电子态及其对驱动条件的依赖，从而更全面地检验圆二色性与 Floquet 拓扑之间的联系。", "tier": "Nature Physics/Nature Materials", "tier_reason_en": "The reported helicity- and energy-dependent photoemission signal, combined with momentum microscopy and ab initio theory, offers a direct spectroscopic probe of light-induced topological electronic structure in graphene, a broadly significant result at the interface of ultrafast and topological physics.", "tier_reason_zh": "该工作将具有光螺旋度和能量依赖性的光电子信号与动量显微术及第一性原理理论相结合，为探测石墨烯中光诱导的拓扑电子结构提供了直接谱学手段；这一结果对超快物理与拓扑物理交叉领域具有广泛意义。"}, {"id": "arxiv-2610-37746", "arxiv_id": "2610.37746", "type": "arXiv", "journal": "arXiv:2610.37746", "journal_ref": "", "journal_doi": "", "title": "A $B_{1g}$ phonon unlocks $d$-wave superconductivity in the repulsive Hubbard model", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.str-el", "cond-mat.supr-con"], "submitted_at": "2026-10-27T18:00:00Z", "updated_at": "2026-10-27T18:00:00Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Wen O. Wang, Tianshu Li, Xiaoyue Ma, Rong Zhang, Lei Zhang, Shruti Agarwal, Benjamin Cohen-Stead, Emily Z. Zhang, Brian Moritz, Steven Johnston, Zhi-Xun Shen, Thomas P. Devereaux", "corresponding": "", "url": "https://arxiv.org/abs/2610.37746v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "The study reports that coupling a B₁g phonon to the doped repulsive t–t′ Hubbard model enhances d-wave superconductivity beyond that produced by either interaction alone, with a doping-dependent superconducting dome. The enhancement persists over the accessible range of stronger Hubbard repulsion and follows a common trend across phonon frequencies when expressed using the retardation scale 2πT/Ω.", "summary": "Using numerically exact finite-temperature quantum Monte Carlo, we demonstrate that a $B_{1g}$ phonon coupled to the doped $t$-$t'$ repulsive Hubbard model produces genuine $d$-wave superconductivity at a substantial transition temperature, in excess of either interaction alone. The observed trends suggest that stronger Hubbard repulsion may cooperate with the phonon to further raise the pairing s", "abstract": "Using numerically exact finite-temperature quantum Monte Carlo, we demonstrate that a $B_{1g}$ phonon coupled to the doped $t$-$t'$ repulsive Hubbard model produces genuine $d$-wave superconductivity at a substantial transition temperature, in excess of either interaction alone. The observed trends suggest that stronger Hubbard repulsion may cooperate with the phonon to further raise the pairing scale. The enhancement persists at stronger repulsion within the accessible window, limited by the fermion sign problem, and follows a common trend across phonon frequencies $Ω$ when organized by a retardation scale $2πT/Ω$. We also find a well-defined superconducting dome in doping, echoing a characteristic feature of correlated superconductors. Our results identify the $B_{1g}$ phonon as a plausible microscopic ingredient for robust $d$-wave superconductivity in the Hubbard model and suggest a concrete, physically motivated route toward materials with higher superconducting transition temperatures.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "A B1g phonon coupled to the doped repulsive Hubbard model enhances d-wave superconductivity beyond either interaction alone and yields a doping-dependent superconducting dome.", "ai_in_scope": true, "relevance_reason": "Numerically exact calculations show that a symmetry-specific phonon can cooperate with electronic repulsion to produce robust d-wave superconductivity in a correlated-electron model.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": false, "summary_zh": "该研究报告，向掺杂的排斥型 t–t′ Hubbard 模型耦合 B₁g 声子，可使 d 波超导增强至高于任一相互作用单独作用时的水平，并形成随掺杂变化的超导穹顶。在数值可及的更强 Hubbard 排斥范围内，这种增强仍然存在；按迟滞尺度 2πT/Ω 表示时，不同声子频率下的结果呈现共同趋势。", "method_en": "The authors use numerically exact finite-temperature quantum Monte Carlo to study the doped t–t′ repulsive Hubbard model coupled to a B₁g phonon. They compare the superconducting behavior with that arising from either interaction alone and examine its dependence on doping, repulsion, and phonon frequency.", "method_zh": "作者采用数值精确的有限温度量子蒙特卡洛方法，研究耦合 B₁g 声子的掺杂 t–t′ 排斥型 Hubbard 模型。他们将超导行为与任一相互作用单独作用时的情形进行比较，并考察其对掺杂、排斥强度和声子频率的依赖。", "result_en": "The calculation finds genuine d-wave superconductivity at a substantial transition temperature, with the combined Hubbard and phonon interactions producing stronger superconductivity than either interaction alone. The enhancement persists as the Hubbard repulsion increases within the accessible range, although further exploration is limited by the fermion sign problem, and results across phonon frequencies follow a common trend versus 2πT/Ω. The study also identifies a superconducting dome in doping and suggests that stronger repulsion may further raise the pairing scale.", "result_zh": "计算发现，该模型出现转变温度相当高的真实 d 波超导；Hubbard 相互作用与声子的共同作用比任一者单独作用产生更强的超导。在数值可及范围内，增强效应随 Hubbard 排斥增强仍然存在，但进一步探索受到费米子符号问题限制；不同声子频率下的结果关于 2πT/Ω 呈现共同趋势。研究还识别出随掺杂变化的超导穹顶，并指出更强排斥可能进一步提高配对能标。", "future_en": "Further calculations beyond the sign-problem-limited repulsion range, together with tests of the proposed phonon-assisted pairing in material-specific models, could assess the robustness and material relevance of the enhancement.", "future_zh": "未来可在符号问题允许的范围内推进更强排斥下的计算，并在材料特定模型中检验所提出的声子辅助配对机制，以评估该增强效应的稳健性及其材料相关性。", "tier": "PRL", "tier_reason_en": "The numerically exact identification of enhanced finite-temperature d-wave superconductivity from cooperating phonon and Hubbard interactions is a significant result for a central model of correlated superconductivity, supporting a strong general-physics tier; the accessible parameter range remains limited by the sign problem.", "tier_reason_zh": "该工作以数值精确方法识别出声子与 Hubbard 相互作用协同增强有限温度 d 波超导，对关联超导的核心模型具有重要意义，足以支持较高的综合物理期刊档次；但可探索的参数范围仍受符号问题限制。"}, {"id": "arxiv-2610-40469", "arxiv_id": "2610.40469", "type": "arXiv", "journal": "arXiv:2610.40469", "journal_ref": "", "journal_doi": "", "title": "Chiral $p$-Wave Superconductivity Proximate to a Fractional Chern Insulator and a Topological Charge Density Wave in a Moiré Chern Band", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.mes-hall", "cond-mat.str-el", "cond-mat.supr-con"], "submitted_at": "2026-10-29T17:07:07Z", "updated_at": "2026-10-29T17:07:07Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Yunze Ouyang, Fengcheng Wu", "corresponding": "", "url": "https://arxiv.org/abs/2610.40469v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "The study finds chiral p-wave superconductivity in a spin-polarized twisted-MoTe₂ Chern band near a fractional Chern insulator at filling 2/3 and a topological charge density wave at 3/4. Exact diagonalization indicates pair binding across fillings of approximately 0.7–0.77, with finite superfluid stiffness and a superconducting BdG Chern number of −1.", "summary": "We study a spin-polarized moiré Chern band of twisted MoTe$_2$ with short-range repulsion, finding superconductivity proximate to a fractional Chern insulator at filling $ν=2/3$ and a topological charge density wave at $ν=3/4$. Exact diagonalization reveals pair binding over $0.7\\lesssimν\\lesssim0.77$, consistent with experiment, along with finite superfluid stiffness, chiral $p$-wave pairing corr", "abstract": "We study a spin-polarized moiré Chern band of twisted MoTe$_2$ with short-range repulsion, finding superconductivity proximate to a fractional Chern insulator at filling $ν=2/3$ and a topological charge density wave at $ν=3/4$. Exact diagonalization reveals pair binding over $0.7\\lesssimν\\lesssim0.77$, consistent with experiment, along with finite superfluid stiffness, chiral $p$-wave pairing correlations, and adiabatic connectivity to an attractive model. At weak repulsion, Kohn-Luttinger theory supports a Fermi-surface instability with the same pairing symmetry. The superconducting state has a Bogoliubov-de Gennes Chern number $C_{\\mathrm{BdG}}=-1$, opposite to the normal-state Chern number at $ν=1$. Our results reveal interplay among superconductivity, fractional topology, and charge order.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "In twisted MoTe₂, calculations find chiral p-wave superconductivity with finite stiffness and BdG Chern number −1, proximate to a fractional Chern insulator and a topological charge density wave.", "ai_in_scope": true, "relevance_reason": "The work predicts chiral superconductivity in a moiré Chern band and investigates its relationship to fractional topology and charge order.", "relevance_method": "semantic", "relevance_score": 83, "feature_candidate": false, "summary_zh": "该研究在自旋极化的扭转 MoTe₂ 陈能带中发现手性 p 波超导，其邻近填充数为 2/3 的分数量子陈绝缘体和填充数为 3/4 的拓扑电荷密度波。精确对角化显示，在约 0.7–0.77 的填充范围内存在束缚配对，并呈现有限超流刚度；超导态的 BdG 陈数为 −1。", "method_en": "The authors use exact diagonalization to examine pairing, superfluid stiffness, and competing phases in the moiré Chern band. They also compare the pairing correlations with an attractive model and use weak-coupling Kohn–Luttinger theory to assess a Fermi-surface instability.", "method_zh": "作者采用精确对角化研究该莫尔陈能带中的配对、超流刚度及竞争相。研究还将配对关联与吸引模型比较，并用弱耦合 Kohn–Luttinger 理论考察费米面不稳定性。", "result_en": "Pair binding is found over approximately 0.7≲ν≲0.77, consistent with experiment, alongside finite superfluid stiffness and chiral p-wave pairing correlations. The superconducting state is reported to be adiabatically connected to an attractive model, and weak-repulsion Kohn–Luttinger theory supports the same pairing symmetry. Its BdG Chern number is −1, opposite to the normal-state Chern number at ν=1. Together, these results connect superconductivity with nearby fractional topology and charge order in the studied band.", "result_zh": "研究在约 0.7≲ν≲0.77 的范围内发现束缚配对，与实验相符，并观察到有限超流刚度和手性 p 波配对关联。超导态被认为可绝热连通至一个吸引模型；弱排斥下的 Kohn–Luttinger 理论也支持相同的配对对称性。其 BdG 陈数为 −1，与 ν=1 时正常态的陈数相反。总体而言，这些结果揭示了所研究能带中超导与邻近分数量子拓扑相及电荷有序之间的联系。", "future_en": "A natural next step is to test the predicted pairing symmetry and its relation to the neighboring fractional Chern insulator and charge-density-wave phase in experiments. The abstract also motivates further study of how these phases evolve across the reported filling range.", "future_zh": "一个自然的后续方向是在实验中检验所预测的配对对称性，以及它与邻近分数量子陈绝缘体和电荷密度波相的关系。摘要也提示可进一步研究这些相在所报告填充范围内的演化。", "tier": "PRL", "tier_reason_en": "The work combines evidence for pairing over a substantial filling interval with superfluid stiffness, a topological characterization, and a weak-coupling account of the same symmetry. This is a substantial result for moiré superconductivity, though the abstract describes primarily numerical and theoretical evidence rather than a new experimental observation.", "tier_reason_zh": "该工作将较宽填充区间内的配对证据、超流刚度、拓扑刻画以及对相同配对对称性的弱耦合解释结合起来，是莫尔超导领域的重要结果。不过，摘要所述证据主要来自数值与理论分析，而非新的实验观测。"}, {"id": "arxiv-2610-40170", "arxiv_id": "2610.40170", "type": "arXiv", "journal": "arXiv:2610.40170", "journal_ref": "", "journal_doi": "", "title": "Coexistence of Superconductivity and Chern insulators with |C| $\\geq 1$ in twisted rhombohedral bilayer-trilayer graphene", "arxiv_version": 1,
