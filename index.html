<script id="issues-data" type="application/json">[{"date":"2026-10-22","title":"Daily Condensed Matter Literature","note":"2026-10-22 archival issue, assembled from the first Journal Club plus follow-up selections.","papers":[{"id":"liu-prx","type":"Journal","journal":"Physical Review X","title":"Nontrivial Boundary-Mediated Superconducting Transport in a TRSB Topological Iron-Based Superconductor","authors":"Wenyao Liu, Gabriel Natale, Camron Farhang et al.","corresponding":"Kenneth S. Burch","url":"https://doi.org/10.1103/8vgt-twh5","topic":"Superconductivity","level":"Feature","summary":"在 FeTe₀.₅₅Se₀.₄₅ 薄片中结合 Kerr 与局域/非局域输运，报告和 TRSB 温标相关的边缘超导电导 plateau。","method":"Polar Kerr; edge-contact differential conductance; nonlocal transport; sample and contact geometry comparisons.","result":"报告连续边缘上的异常 conductance plateau，温度演化与 Kerr 定义的 TRSB 温标相关。","future":"适用于对 4Hb-TaS₂ 等候选材料设计不同接触几何的非局域输运实验。","summary_zh":"在 FeTe₀.₅₅Se₀.₄₅ 薄片中结合 Kerr 与局域/非局域输运，报告和 TRSB 温标相关的边缘超导电导 plateau。","summary_en":"Using polar Kerr rotation and local/nonlocal transport in FeTe₀.₅₅Se₀.₄₅ flakes, the authors report an edge-associated conductance plateau whose temperature dependence tracks the onset of time-reversal symmetry breaking.","method_zh":"Polar Kerr; edge-contact differential conductance; nonlocal transport; sample and contact geometry comparisons.","method_en":"Polar Kerr measurements, edge-contact differential conductance, nonlocal transport, and comparison of contact geometries.","result_zh":"报告连续边缘上的异常 conductance plateau，温度演化与 Kerr 定义的 TRSB 温标相关。","result_en":"An anomalous conductance plateau is observed along a continuous edge; its temperature evolution correlates with the Kerr-defined TRSB onset.","future_zh":"适用于对 4Hb-TaS₂ 等候选材料设计不同接触几何的非局域输运实验。","future_en":"Test edge-contact geometries and nonlocal superconducting transport in 4Hb-TaS₂ or other candidate TRSB superconductors."},{"id":"cscr6sb6","type":"arXiv","journal":"arXiv:2610.29366","title":"Hybridization-Induced Enhancement of the Thermoelectric Response in the Kagome Material CsCr₆Sb₆","authors":"Hongye Zhang, Boqin Song, Aifeng Wang et al.","corresponding":"Ying Zhu; Tianping Ying; Mingquan He","url":"https://arxiv.org/abs/2610.29366","topic":"Thermal & Thermoelectric","level":"Feature","summary":"测量 CsCr₆Sb₆ 单晶的 Seebeck、Nernst、Hall、比热与热导，关联热电增强与能带杂化、Kondo scattering 和 phonon drag。","method":"Flux-grown single crystals; resistivity, Hall, Seebeck, Nernst, thermal conductivity, specific heat.","result":"作者识别 ~70 K 的 crossover 和 ~20–25 K 热电极值，并讨论重费米子标度及声子贡献。","future":"同样品测 Sxx、Syx、Hall、ρxx，加入角分辨和应变调控。","summary_zh":"测量 CsCr₆Sb₆ 单晶的 Seebeck、Nernst、Hall、比热与热导，关联热电增强与能带杂化、Kondo scattering 和 phonon drag。","summary_en":"Measurements of Seebeck and Nernst signals, Hall response, thermal conductivity, and heat capacity in CsCr₆Sb₆ link enhanced thermoelectric transport with band hybridization, Kondo scattering, and phonon drag.","method_zh":"Flux-grown single crystals; resistivity, Hall, Seebeck, Nernst, thermal conductivity, specific heat.","method_en":"Flux-grown single crystals; electrical resistivity, Hall, Seebeck, Nernst, thermal conductivity, and heat-capacity measurements.","result_zh":"作者识别 ~70 K 的 crossover 和 ~20–25 K 热电极值，并讨论重费米子标度及声子贡献。","result_en":"The authors identify a crossover near 70 K and thermoelectric extrema around 20–25 K, and discuss heavy-fermion scaling and phonon contributions.","future_zh":"同样品测 Sxx、Syx、Hall、ρxx，加入角分辨和应变调控。","future_en":"Measure longitudinal and transverse thermopower, Hall response, and resistivity on the same crystal, with angle-resolved and strain-dependent follow-ups.","tier":"PRB / Physical Review Materials","tier_reason_en":"Detailed thermoelectric, Nernst, Hall, and thermal-transport characterization connects band hybridization to a correlated kagome metal; the central advance is a material-specific transport interpretation rather than a new universal effect.","tier_reason_zh":"系统的 Seebeck、Nernst、Hall 与热输运实验把能带杂化和 Kagome 关联行为联系起来；亮点是材料体系中的输运物理，而非全新的普适效应。"},{"id":"fetse-jde","type":"arXiv","journal":"arXiv:2610.29124","title":"Magnetization and Josephson current coupling drives the Josephson diode effect in FeTe₀.₅₅Se₀.₄₅ van der Waals junctions","authors":"Seung-Hyun Shin, Cheong-Eung Ahn, Chang-Won Choi et al.","corresponding":"Gil Young Cho; Gil-Ho Lee","url":"https://arxiv.org/abs/2610.29124","topic":"Superconductivity","level":"Feature","summary":"在 FeTeSe 范德华约瑟夫森结中发现零场二极管效应，结合 Fraunhofer、Shapiro steps 与动力学建模研究磁化与超流耦合。","method":"van der Waals Josephson junction fabrication; switching currents; Fraunhofer pattern; microwave Shapiro steps.","result":"非互易临界电流与界面磁化和 Josephson 相位耦合相关。","future":"在可加工材料中比较 Ic+ / Ic−、场历史、Fraunhofer 和微波响应。","summary_zh":"在 FeTeSe 范德华约瑟夫森结中发现零场二极管效应，结合 Fraunhofer、Shapiro steps 与动力学建模研究磁化与超流耦合。","summary_en":"In FeTe₀.₅₅Se₀.₄₅ van der Waals Josephson junctions, the authors report a zero-field Josephson diode effect and examine the coupling of interfacial magnetization to the supercurrent.","method_zh":"van der Waals Josephson junction fabrication; switching currents; Fraunhofer pattern; microwave Shapiro steps.","method_en":"Fabrication of van der Waals Josephson junctions; switching-current, Fraunhofer-interference, and microwave Shapiro-step measurements.","result_zh":"非互易临界电流与界面磁化和 Josephson 相位耦合相关。","result_en":"Nonreciprocal critical current is attributed to the coupling between interfacial magnetization and the Josephson phase.","future_zh":"在可加工材料中比较 Ic+ / Ic−、场历史、Fraunhofer 和微波响应。","future_en":"Compare positive and negative critical currents, magnetic-field training, Fraunhofer patterns, and microwave response in device-compatible superconductors.","tier":"PRL","tier_reason_en":"Combines zero-field Josephson diode behavior, hysteretic Fraunhofer interference, half-integer Shapiro steps, and coupled dynamical modeling to identify a specific interfacial mechanism.","tier_reason_zh":"结合零场 Josephson diode、磁滞 Fraunhofer、半整数 Shapiro 台阶及动力学模拟，建立界面磁化与 Josephson 电流耦合的机制。"},{"id":"folded-chain","type":"Journal","journal":"Physical Review Letters","title":"Altermagnetism in Folded Iron Chain Systems","authors":"Ling-Fang Lin, Yang Zhang, Satoshi Okamoto et al.","corresponding":"Yang Zhang; Lun-Hui Hu","url":"https://doi.org/10.1103/6327-7256","topic":"Magnetism","level":"Brief","summary":"理论研究折叠铁链的 block-type order 与链间跃迁，提出动量依赖自旋劈裂及潜在 altermagnet 候选材料。","method":"Symmetry analysis and first-principles calculations.","result":"在 quasi-1D 阵列中得到 altermagnetic spin splitting 的理论条件。","future":"评估 K₃Fe₂Se₄ 生长路线和角分辨磁性输运。","summary_zh":"理论研究折叠铁链的 block-type order 与链间跃迁，提出动量依赖自旋劈裂及潜在 altermagnet 候选材料。","summary_en":"A theoretical study of folded iron-chain systems identifies symmetry conditions for momentum-dependent spin splitting associated with altermagnetic order.","method_zh":"Symmetry analysis and first-principles calculations.","method_en":"Magnetic-symmetry analysis and first-principles electronic-structure calculations.","result_zh":"在 quasi-1D 阵列中得到 altermagnetic spin splitting 的理论条件。","result_en":"The authors identify theoretical conditions for altermagnetic spin splitting in quasi-one-dimensional folded-chain arrays.","future_zh":"评估 K₃Fe₂Se₄ 生长路线和角分辨磁性输运。","future_en":"Explore synthesis of K₃Fe₂Se₄ candidates and characterize field-angle-dependent magnetic transport."},{"id":"magnon-chern","type":"Journal","journal":"Physical Review Letters","title":"Magnon Chern Insulator in Two-Dimensional Fully Compensated Ferrimagnetic Heterostructures","authors":"Yingxi Bai, Zhiqi Chen, Baibiao Huang et al.","corresponding":"Ying Dai; Chengwang Niu","url":"https://doi.org/10.1103/wh99-b81w","topic":"Magnetism","level":"Brief","summary":"提出完全补偿二维 ferrimagnetic heterostructure 中的 magnon Chern bands 与 magnon thermal Hall response。","method":"Spin model and first-principles calculations.","result":"预测 CrI₃/CrGeTe₃ 等异质结的拓扑磁振子和热 Hall 响应。","future":"结合薄层异质结制备开展热 Hall 测量。","summary_zh":"提出完全补偿二维 ferrimagnetic heterostructure 中的 magnon Chern bands 与 magnon thermal Hall response。","summary_en":"A theoretical proposal predicts magnon Chern bands and a magnon thermal Hall response in fully compensated two-dimensional ferrimagnetic heterostructures.","method_zh":"Spin model and first-principles calculations.","method_en":"Spin-Hamiltonian modeling and first-principles calculations.","result_zh":"预测 CrI₃/CrGeTe₃ 等异质结的拓扑磁振子和热 Hall 响应。","result_en":"Topological magnons and thermal Hall signatures are predicted for heterostructures including CrI₃/CrGeTe₃.","future_zh":"结合薄层异质结制备开展热 Hall 测量。","future_en":"Investigate thermal Hall measurements in fabricated layered magnetic heterostructures."},{"id":"fe-tasite","type":"arXiv","journal":"arXiv:2610.29463","title":"Large anisotropic magnetoresistance in paramagnetic Fe-doped Ta₄SiTe₄","authors":"Keita Nagasawa, Ryutaro Okuma, Jun-ichi Yamaura et al.","corresponding":"Keita Nagasawa","url":"https://arxiv.org/abs/2610.29463","topic":"Magnetism","level":"Brief","summary":"研究 Fe 掺杂准一维 Ta₄SiTe₄ 在顺磁态下的大幅 AMR，并用各向异性 spin-disorder scattering 描述。","method":"Magnetization and anisotropic magnetoresistance measurements.","result":"在 8 K、10 T 条件下报告约 −33% AMR。","future":"同步测量 M(B,θ)、torque 和 MR(B,θ)。","summary_zh":"研究 Fe 掺杂准一维 Ta₄SiTe₄ 在顺磁态下的大幅 AMR，并用各向异性 spin-disorder scattering 描述。","summary_en":"The authors report unusually large anisotropic magnetoresistance in the paramagnetic regime of Fe-doped quasi-one-dimensional Ta₄SiTe₄ and discuss anisotropic spin-disorder scattering.","method_zh":"Magnetization and anisotropic magnetoresistance measurements.","method_en":"Magnetization and angle-dependent magnetoresistance measurements.","result_zh":"在 8 K、10 T 条件下报告约 −33% AMR。","result_en":"An anisotropic magnetoresistance of approximately −33% is reported at 8 K and 10 T.","future_zh":"同步测量 M(B,θ)、torque 和 MR(B,θ)。","future_en":"Combine angle-dependent magnetization, torque, and magnetoresistance on the same crystal.","tier":"PRB / Physical Review Materials","tier_reason_en":"Substantial paramagnetic AMR is demonstrated with magnetization anisotropy and a spin-disorder description in one well-characterized material system.","tier_reason_zh":"在单一材料体系中展示了较大的顺磁态 AMR，并用磁化各向异性和 spin-disorder 模型进行解释，属于扎实的材料输运研究。"},{"id":"yfe3sn3","type":"arXiv","journal":"arXiv:2610.29708","title":"Spin order and excitations in the collinear kagome antiferromagnet Y₀.₅Fe₃Sn₃","authors":"Jin Ding et al.","corresponding":"—","url":"https://arxiv.org/abs/2610.29708","topic":"Magnetism","level":"Brief","summary":"利用中子散射研究 kagome 反铁磁体 Y₀.₅Fe₃Sn₃ 的磁结构和激发，并结合磁场诱导 canting 讨论 AHE。","method":"Elastic, inelastic, and polarized neutron scattering.","result":"报告高温共线 AFM 有序、Y-shaped spin excitations 和双能隙特征。","future":"单晶磁输运与 torque 测量可补充磁各向异性信息。","summary_zh":"利用中子散射研究 kagome 反铁磁体 Y₀.₅Fe₃Sn₃ 的磁结构和激发，并结合磁场诱导 canting 讨论 AHE。","summary_en":"Neutron-scattering experiments resolve the magnetic structure and spin excitations of the kagome antiferromagnet Y₀.₅Fe₃Sn₃, with field-induced spin canting discussed in relation to anomalous Hall transport.","method_zh":"Elastic, inelastic, and polarized neutron scattering.","method_en":"Elastic, inelastic, and polarized neutron scattering.","result_zh":"报告高温共线 AFM 有序、Y-shaped spin excitations 和双能隙特征。","result_en":"The authors report high-temperature collinear antiferromagnetic order, Y-shaped spin excitations, and two spin-gap scales.","future_zh":"单晶磁输运与 torque 测量可补充磁各向异性信息。","future_en":"Use angle-dependent magnetic transport and torque magnetometry to map anisotropy and field-induced magnetic responses in single crystals.","published_journal":"Physical Review B 114, 204418 (2026)","published_doi":"https://doi.org/10.1103/PhysRevB.114.204418"},{"id":"eupd2si2","type":"arXiv","journal":"arXiv:2610.29180","title":"Valence-Driven Structural Transformation and Phase Coexistence in Chemically Substituted EuPd₂Si₂","authors":"Masoud Mardani et al.","corresponding":"—","url":"https://arxiv.org/abs/2610.29180","topic":"Correlated Electrons","level":"Brief","summary":"通过化学替代和同步辐射衍射研究 EuPd₂Si₂ 价态转变与结构相共存。","method":"Chemical substitution; synchrotron X-ray diffraction.","result":"报道 Ge 替代对价态转变温度和结构相共存的影响。","future":"适用于联合热容、电阻、磁化与应变响应追踪价态相变。","summary_zh":"通过化学替代和同步辐射衍射研究 EuPd₂Si₂ 价态转变与结构相共存。","summary_en":"Through chemical substitution and synchrotron diffraction, the authors investigate the coupling of valence changes to structural transformation and phase coexistence in EuPd₂Si₂.","method_zh":"Chemical substitution; synchrotron X-ray diffraction.","method_en":"Controlled chemical substitution and synchrotron X-ray diffraction.","result_zh":"报道 Ge 替代对价态转变温度和结构相共存的影响。","result_en":"Ge substitution changes the valence-transition temperature and the coexistence of structural phases.","future_zh":"适用于联合热容、电阻、磁化与应变响应追踪价态相变。","future_en":"Combine heat capacity, resistivity, magnetization, and strain measurements to track valence-driven transitions.","published_journal":"Physical Review Materials (accepted October 16, 2026)","published_doi":"https://doi.org/10.1103/xmz9-1mb4"}],"title_zh":"每日凝聚态物理文献"}]</script>

}
function displayTopic(t){return lang==='zh'?(TOPIC_ZH[t]||t):t}
function chooseLanguage(next){lang=next;try{localStorage.setItem('condmat-language',lang)}catch{};render()}
function showIssue(i){selected=i;topic='All';byId('search').value='';render()}
function toggleNotes(btn){const details=btn.nextElementSibling;details.hidden=!details.hidden;btn.textContent=details.hidden?STR[lang].read:STR[lang].close}
function render(){
 const t=STR[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';
 byId('lang-en').setAttribute('aria-pressed',String(lang==='en'));byId('lang-zh').setAttribute('aria-pressed',String(lang==='zh'));
 byId('site-kicker').textContent=t.kicker;byId('site-title').textContent=t.title;byId('site-subtitle').textContent=t.subtitle;
 byId('archive-title').textContent=t.archive;byId('search').placeholder=t.search;byId('search').setAttribute('aria-label',t.search);byId('footer').textContent=t.footer;
 const issue=issues[selected]||{papers:[],date:'—'};
 byId('archive').innerHTML=issues.map((v,i)=>`<button type="button" aria-current="${i===selected}" data-issue="${i}">${esc(v.date)}<small>${v.papers.length} ${esc(t.papers)}</small></button>`).join('');
 byId('archive').querySelectorAll('[data-issue]').forEach(b=>b.addEventListener('click',()=>showIssue(Number(b.dataset.issue))));
 const reports=AVAILABLE_REPORTS[issue.date]||{};
 const languageOrder=lang==='zh'?['zh','en']:['en','zh'];
 const reportLinks=languageOrder.filter(l=>reports[l]).map(l=>`<a class="pdf ${l===lang?'current':''}" href="${esc(reports[l])}" target="_blank" rel="noopener" lang="${l==='zh'?'zh-CN':'en'}">${esc(l==='zh'?t.pdfZh:t.pdfEn)}</a>`).join('');
 const issueTitle=(lang==='zh'&&issue.title_zh)||issue.title||t.untitled;
 byId('head').innerHTML=`<div class="issue-head"><div><div class="stamp">${esc(t.issue)} / ${esc(issue.date)}</div><h2>${esc(issueTitle)}</h2><p>${issue.papers.length} ${esc(t.papers)} · ${issue.papers.filter(p=>p.level==='Feature').length} ${esc(t.featured)}</p></div>${reportLinks?`<div class="pdf-group">${reportLinks}</div>`:''}</div>`;
 const types=['All',...new Set(issue.papers.map(x=>x.topic))];
 byId('topics').innerHTML=types.map(tp=>`<button type="button" class="chip ${topic===tp?'active':''}" data-topic="${esc(tp)}">${esc(displayTopic(tp))}</button>`).join('');
 byId('topics').querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>{topic=b.dataset.topic;render()}));
 const q=byId('search').value.trim().toLocaleLowerCase();
 const papers=issue.papers.filter(p=>(topic==='All'||p.topic===topic)&&[
   p.title,p.authors,p.journal,p.corresponding,p.topic,TOPIC_ZH[p.topic],
   p.summary,p.summary_en,p.summary_zh,p.abstract,p.method,p.method_en,p.method_zh,
   p.result,p.result_en,p.result_zh,p.future,p.future_en,p.future_zh,
   p.tier,p.tier_reason,p.tier_reason_en,p.tier_reason_zh
 ].join(' ').toLocaleLowerCase().includes(q));
 byId('counter').textContent=`${papers.length} ${t.shown} / ${issue.papers.length} ${t.indexed}`;
 byId('papers').innerHTML=papers.map(p=>{
   const summary=field(p,'summary'),method=field(p,'method'),result=field(p,'result'),future=field(p,'future'),reason=field(p,'tier_reason');
   const details=[p.published_journal?`<p><strong>${esc(t.actualJournal)}</strong> — ${p.published_doi?`<a href="${esc(p.published_doi)}" target="_blank" rel="noopener">${esc(p.published_journal)} ↗</a>`:esc(p.published_journal)}</p>`:'',p.tier?`<p><strong>${esc(t.estimated)}</strong> — ${esc(p.tier)}${reason?' · '+esc(reason):''}</p>`:'',method?`<p><strong>${esc(t.methods)}</strong> — ${esc(method)}</p>`:'',result?`<p><strong>${esc(t.findings)}</strong> — ${esc(result)}</p>`:'',future?`<p><strong>${esc(t.followup)}</strong> — ${esc(future)}</p>`:''].join('');
   return `<article class="paper" id="${esc(p.id)}"><div class="topline"><div class="label ${p.level==='Feature'?'feature':''}">${esc(displayTopic(p.topic))} · ${esc(p.level==='Feature'?t.feature:t.brief)}</div><span class="pub">${esc(p.journal)}</span></div><h3><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)} ↗</a></h3><div class="authors">${esc(p.authors)}${p.corresponding&&p.corresponding!=='—'?' · '+esc(t.corresponding)+': '+esc(p.corresponding):''}</div>${summary?`<p class="abstract">${esc(summary)}</p>`:''}${details?`<button type="button" class="expand">${esc(t.read)}</button><div class="details" hidden>${details}<p><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(t.fullText)}</a></p></div>`:''}</article>`;
 }).join('')||`<div class="empty">${esc(t.empty)}</div>`;
 byId('papers').querySelectorAll('.expand').forEach(b=>b.addEventListener('click',()=>toggleNotes(b)));
}
byId('lang-en').addEventListener('click',()=>chooseLanguage('en'));
byId('lang-zh').addEventListener('click',()=>chooseLanguage('zh'));
byId('search').addEventListener('input',render);
render();
</script></body></html>
