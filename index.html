 constrains magnetic band crossings but does not determine their topological descendants. We show that the Chern contribution of an isolated inverted sector is controlled by the phase winding of its transverse mass pair: when the masses and tangential velocities reverse together, contributions from successive Dirac points add rather than cancel. This distinguishes topological winding from the polynomial degree labeling the magnetic parent. For specified complementary masses, periodic tetragonal $h$- and hexagonal $j$-wave models host eight and twelve same-chirality Weyl points on a momentum plane, with gapped-slice Chern numbers $|C|=4$ and $6$, respectively. A microscopic four-band $p$-wave model identifies an antiunitary obstruction to first-order transverse masses and demonstrates a symmetry-broken $C=1$ phase at quarter filling. First-principles calculations for the proposed coplanar spin-vortex texture of LaMnAu$_5$ reveal the $h$-wave nodal pattern, its anisotropic spin--orbit reconstruction, and a mirror-channel spectral response that reverses under opposite spin rotations. Together, these results distinguish the symmetry of an odd-parity magnetic parent from the mass structure controlling the topology of its descendants.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "Shows that the phase winding of transverse masses, rather than the magnetic-parent polynomial degree, determines whether Dirac-point Chern contributions add or cancel; identifies high-Chern descendants and a candidate h-wave nodal pattern in LaMnAu5.", "ai_in_scope": true, "relevance_reason": "This combines original theory of magnetic topological phases with first-principles study of a proposed antiferromagnetic material.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": false, "summary_zh": "该工作提出，决定反铁磁母相拓扑后代性质的是横向质量项的相位绕数，而非母相的多项式标签，并以模型分析和第一性原理计算支持这一观点。", "method_en": "The authors analyze inverted Dirac sectors and complementary-mass models, construct a microscopic four-band p-wave model, and perform first-principles calculations for the proposed coplanar spin-vortex texture of LaMnAu₅.", "method_zh": "作者分析反转 Dirac 扇区及互补质量项模型，构建微观四带 p 波模型，并对所提出的 LaMnAu₅ 共面自旋涡旋纹理进行第一性原理计算。", "result_en": "For specified complementary masses, periodic tetragonal h-wave and hexagonal j-wave models host eight and twelve same-chirality Weyl points on a momentum plane, with gapped-slice Chern numbers |C|=4 and 6, respectively; the four-band model reveals an antiunitary obstruction to first-order transverse masses and a symmetry-broken C=1 phase at quarter filling. The LaMnAu₅ calculations identify an h-wave nodal pattern, its anisotropic spin-orbit reconstruction, and a mirror-channel spectral response that reverses under opposite spin rotations.", "result_zh": "对于指定的互补质量项，周期性四方 h 波和六方 j 波模型在一个动量平面上分别具有 8 个和 12 个同手性 Weyl 点，且相应的有隙切片陈数为 |C|=4 和 6；四带模型揭示了一阶横向质量项受到反幺正对称性阻碍，并在四分之一填充处出现对称性破缺的 C=1 相。LaMnAu₅ 计算识别出 h 波节点结构、其各向异性自旋轨道重构，以及在相反自旋旋转下反转的镜面通道谱响应。", "future_en": "The abstract does not specify a future research direction.", "future_zh": "摘要未说明具体的未来研究方向。", "tier": "PRL", "tier_reason_en": "The work advances a general organizing principle for the topology of altermagnetic descendants and substantiates it with quantitative model results and material-specific first-principles predictions, making a high-impact condensed-matter letter tier plausible.", "tier_reason_zh": "该工作提出了理解反铁磁拓扑后代的一般性组织原则，并以定量模型结果和针对具体材料的第一性原理预测加以支持，因此达到高影响力凝聚态快报层级是合理的。"}, {"id": "arxiv-2610-35341", "arxiv_id": "2610.35341", "type": "arXiv", "journal": "arXiv:2610.35341", "journal_ref": "", "journal_doi": "", "title": "Anisotropic magneto-elastic coupling in the quasi-2D Ising magnet Li$_2$FeSiO$_4$ and thermodynamic signature of low-energy orbital excitations", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.str-el"], "submitted_at": "2026-10-26T12:34:28Z", "updated_at": "2026-10-26T12:34:28Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Waldemar Hergett, Kevin Ackermann, Sven Spachmann, Martin Jonak, Mahmoud Abdel-Hafiez, Hend Shahed, Michael Merz, Maurits W. Haverkort, Rüdiger Klingeler", "corresponding": "", "url": "https://arxiv.org/abs/2610.35341v1", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Thermal expansion and specific-heat measurements, supported by numerical studies, are used to disentangle spin, lattice, and orbital contributions in the quasi-two-dimensional Ising-like magnet Li₂FeSiO₄. The analysis identifies a low-energy orbital gap and anisotropic magneto-elastic responses, while showing that short-range magnetic order above the ordering temperature does not follow the same energy scale as that temperature.", "summary": "The relevance of spin, lattice and orbital degrees of freedom in the quasi-2D Ising-like magnet Li$_2$FeSiO$_4$ is demonstrated by thermal expansion and specific heat measurements supported by numerical studies. By means of thermodynamic and Grüneisen analysis, we separate the orbital signatures and quantify the energy gap and its pressure dependence from the experimental data as $Δ\\sim 300 - 350$", "abstract": "The relevance of spin, lattice and orbital degrees of freedom in the quasi-2D Ising-like magnet Li$_2$FeSiO$_4$ is demonstrated by thermal expansion and specific heat measurements supported by numerical studies. By means of thermodynamic and Grüneisen analysis, we separate the orbital signatures and quantify the energy gap and its pressure dependence from the experimental data as $Δ\\sim 300 - 350$ K and $\\partial \\ln Δ/\\partial p_{\\rm c} \\approx -4.6$ %/GPa). Both values excellently agree with the theoretical DFT predictions. The thermal expansion anomalies associated with the onset of long-range magnetic order imply significant magneto-elastic coupling and are used to determine the anisotropic uniaxial strain dependencies of $T_{\\rm N}$. They are dominated by the in-plane (i.e., $c$ axis) response $(\\partial \\ln{ T_{\\rm N}} )/\\partial p_{\\rm c} \\simeq 15$ %/GPa while the (negative) $a$ axis and (positive) out-of-plane ($b$ axis) pressure dependencies are much smaller. Short-range magnetic order extends well above $T_{\\rm N}$ but is not driven by the same energy scale as $T_{\\rm N}$ as evidenced by the observation of non-monotonic in-plane distortion, sign-change of the Grüneisen parameter, and failure of Grüneisen scaling.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "The study identifies a roughly 300–350 K orbital excitation gap and its pressure dependence, quantifies strongly anisotropic strain dependence of the magnetic ordering temperature, and shows that short-range magnetic order above the transition does not share t", "ai_in_scope": true, "relevance_reason": "Thermodynamic measurements and supporting calculations reveal orbital and magnetic physics, including anisotropic magnetoelastic coupling, in a quasi-two-dimensional Ising magnet.", "relevance_method": "semantic", "relevance_score": 77, "feature_candidate": false, "summary_zh": "作者结合热膨胀、比热测量与数值研究，分析准二维类 Ising 磁体 Li₂FeSiO₄ 中自旋、晶格和轨道自由度的作用。分析确定了低能轨道激发能隙及各向异性的磁弹响应，并表明有序温度以上的短程磁有序并不遵循与该温度相同的能量尺度。", "method_en": "The study combines thermal-expansion and specific-heat measurements with thermodynamic and Grüneisen analyses and numerical calculations, including DFT predictions for comparison.", "method_zh": "研究结合热膨胀与比热测量、热力学及 Grüneisen 分析和数值计算，并与 DFT 预测进行比较。", "result_en": "The orbital gap is estimated as Δ ∼ 300–350 K, with ∂lnΔ/∂p_c ≈ −4.6%/GPa, in excellent agreement with the reported DFT predictions. Thermal-expansion anomalies at the onset of long-range magnetic order reveal significant magneto-elastic coupling and yield an anisotropic dependence of T_N on uniaxial pressure: the c-axis response is dominant, with ∂lnT_N/∂p_c ≃ 15%/GPa, whereas the a-axis response is negative and the out-of-plane b-axis response is positive and both are much smaller. Short-range magnetic order extends well above T_N, but non-monotonic in-plane distortion, a sign change in the Grüneisen parameter, and failure of Grüneisen scaling indicate that it is not governed by the same energy scale as T_N.", "result_zh": "轨道能隙估计为 Δ ∼ 300–350 K，且 ∂lnΔ/∂p_c ≈ −4.6%/GPa，与文中报告的 DFT 预测高度一致。长程磁有序出现时的热膨胀异常表明存在显著磁弹耦合，并给出 T_N 对单轴压力的各向异性依赖：c 轴响应占主导，∂lnT_N/∂p_c ≃ 15%/GPa；a 轴响应为负，面外 b 轴响应为正，且二者都小得多。短程磁有序延伸至远高于 T_N 的温度，但面内畸变的非单调变化、Grüneisen 参数变号及 Grüneisen 标度失效表明，其控制能标与 T_N 并不相同。", "future_en": "Further pressure-dependent thermodynamic measurements could test the reported orbital-gap and anisotropic ordering-temperature responses over a wider range of conditions.", "future_zh": "后续可在更宽条件范围内开展压力依赖的热力学测量，以检验文中报告的轨道能隙及有序温度各向异性响应。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work combines detailed thermodynamic measurements with numerical comparison to establish material-specific orbital and magneto-elastic properties; the abstract does not indicate a broader materials platform or a new general mechanism.", "tier_reason_zh": "该工作结合细致的热力学测量与数值比较，确定了特定材料的轨道和磁弹性质；摘要未显示其涉及更广泛的材料平台或普适新机制。"}, {"id": "arxiv-2610-33556", "arxiv_id": "2610.33556", "type": "arXiv", "journal": "arXiv:2610.33556", "journal_ref": "", "journal_doi": "", "title": "First-order magnetostructural transition in Ni-Mn-Sn powder - A matter of particle and grain size", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci"], "submitted_at": "2026-10-24T09:14:45Z", "updated_at": "2026-10-24T09:14:45Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Johannes Puy, David Koch, Enrico Bruder, Sagar Ghorai, Benedikt Beckmann, Heiner Gutte, Volodymyr Baran, Oliver Gutfleisch, Franziska Scheibel", "corresponding": "", "url": "https://arxiv.org/abs/2610.33556v1", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "This study separates particle- and grain-size effects on the first-order magnetostructural transition in gas-atomized Ni-Mn-Sn powder and links them to transformation barriers and nucleation behavior.", "summary": "In Ni-Mn-based Heusler alloys, the magnetocaloric effect originates from a first-order magnetostructural transition (FOMST). However, the influence of particle and grain size on thermal hysteresis, transition width, and nucleation and growth mechanism remains poorly understood, as mechanical grinding can introduce residual stresses and processing-induced defects. In this study, we examined the siz", "abstract": "In Ni-Mn-based Heusler alloys, the magnetocaloric effect originates from a first-order magnetostructural transition (FOMST). However, the influence of particle and grain size on thermal hysteresis, transition width, and nucleation and growth mechanism remains poorly understood, as mechanical grinding can introduce residual stresses and processing-induced defects. In this study, we examined the size dependence of the FOMST in gas-atomized Ni-Mn-Sn powder by combining microstructural characterization with temperature-dependent XRD, magnetometry, calorimetry and single-particle measurements, enabling decoupling of size dependence from processing-related influences. We observed a pronounced size dependence of the transition ranges (Ms-Mf) and (Af-As), which decrease with decreasing particle size and approach zero for single-crystalline particles below ~20-30 micrometer. The thermal hysteresis decreases with increasing particle size, reaching a lower limit of 17 K for large polycrystalline particles above 100 micrometer. EBSD reveals a nearly constant grain size, implying a transition from polycrystalline to single-crystalline particles as particle size decreases. In polycrystalline particles, multiple grains transform gradually over an extended temperature interval because grain boundaries act as barriers to the progression of transformation. In contrast, single-grain particles lack preferred nucleation sites, resulting in larger hysteresis, while the absence of barriers to transformation propagation causes the entire particle to transform in a narrow range. These results demonstrate that the size dependence of the FOMST is governed by the interplay between particle size, grain boundaries, and the free particle surface.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "In Ni-Mn-Sn powder, smaller particles approach single-crystal behavior and exhibit narrower transition ranges, while grain boundaries in polycrystalline particles broaden transformation; the transition behavior reflects the interplay of particle size, grain bo", "ai_in_scope": true, "relevance_reason": "This experiment establishes how particle and grain structure govern a magnetic-lattice phase transition in a Heusler alloy, a substantive materials-physics result.", "relevance_method": "semantic", "relevance_score": 71, "feature_candidate": false, "summary_zh": "该研究区分了气体雾化 Ni-Mn-Sn 粉末中颗粒尺寸与晶粒尺寸对一级磁结构相变的影响，并将其联系到相变阻碍和形核行为。", "method_en": "The authors combine microstructural characterization with temperature-dependent XRD, magnetometry, calorimetry, EBSD, and single-particle measurements to examine the size dependence while avoiding grinding-induced effects.", "method_zh": "作者结合显微结构表征、变温 XRD、磁测量、量热、EBSD 和单颗粒测量，研究尺寸效应并避免机械研磨引入的影响。", "result_en": "The transition ranges (Ms–Mf) and (Af–As) narrow as particle size decreases and approach zero for single-crystalline particles below about 20–30 μm, whereas thermal hysteresis decreases with increasing particle size and reaches 17 K for large polycrystalline particles above 100 μm. The results associate gradual transformation in polycrystalline particles with grain-boundary barriers, while single-grain particles transform over a narrow range but show larger hysteresis because they lack preferred nucleation sites.", "result_zh": "颗粒尺寸减小时，(Ms–Mf) 和 (Af–As) 转变区间缩窄，并在尺寸低于约 20–30 μm 的单晶颗粒中趋近于零；热滞后则随颗粒尺寸增大而减小，在尺寸大于 100 μm 的大型多晶颗粒中达到 17 K。结果表明，多晶颗粒中的渐进相变与晶界阻碍有关，而单晶粒颗粒缺少优先形核位点，因此热滞后更大，但转变集中在较窄温区内。", "future_en": "The abstract does not specify a future research direction.", "future_zh": "摘要未说明具体的未来研究方向。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The paper reports a systematic, multimethod experimental study with quantitative size-dependent transition and hysteresis results, fitting a strong specialist materials journal tier; the abstract does not indicate the breadth needed for a broader venue.", "tier_reason_zh": "该工作通过多种实验方法系统研究尺寸效应，并报告了定量的相变区间和热滞后结果，适合较强的专业材料期刊层级；摘要所述研究范围尚不足以支持更综合性期刊层级。"}, {"id": "arxiv-2610-35255", "arxiv_id": "2610.35255", "type": "arXiv", "journal": "arXiv:2610.35255", "journal_ref": "", "journal_doi": "", "title": "Orbital-selective correlations in kagome flat bands of Co$_3$Sn$_2$S$_2$", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-26T11:38:27Z", "updated_at": "2026-10-26T11:38:27Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Rongxiang Zhu, Huaiqiang Wang, Haijun Zhang, Jianzhou Zhao", "corresponding": "", "url": "https://arxiv.org/abs/2610.35255v1", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "This theoretical study attributes a flat-band feature near the Fermi level in Co3Sn2S2 to orbital- and spin-dependent self-energies that shift a geometrical kagome flat band, rather than to heavy-fermion-like dynamical band renormalization. It connects the shifted band with enhanced Berry curvature and anomalous thermoelectric transport.", "summary": "Geometrical flat bands provide an ideal platform for studying electronic correlations and quantum-geometric effects. Although the ferromagnetic Weyl semimetal \\CoSnS is generally considered a moderately correlated system, recent spectroscopy experiments have revealed a flat-band feature near the Fermi level ($\\EF$) that is absent in conventional density functional theory (DFT) calculations. Using ", "abstract": "Geometrical flat bands provide an ideal platform for studying electronic correlations and quantum-geometric effects. Although the ferromagnetic Weyl semimetal \\CoSnS is generally considered a moderately correlated system, recent spectroscopy experiments have revealed a flat-band feature near the Fermi level ($\\EF$) that is absent in conventional density functional theory (DFT) calculations. Using DFT plus dynamical mean-field theory and a minimal kagome model, we show that this feature arises not from heavy-fermion-like dynamical band renormalization, but from the shifting of a $d_{x^2-y^2}$ dominated geometrical kagome flat band toward $\\EF$ driven by orbital- and spin-dependent self-energies. The relocated flat band enhances the local Berry curvature near $\\EF$, resulting in a strongly energy-dependent anomalous Hall conductivity and a giant anomalous Nernst effect. Our findings establish an orbital-selective correlation mechanism for positioning geometrical flat bands at $\\EF$, and propose anomalous thermoelectric transport as a sensitive probe of flat band induced topology.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Orbital- and spin-dependent self-energies shift a geometrical kagome flat band toward the Fermi level, enhancing local Berry curvature and producing strongly energy-dependent anomalous Hall and Nernst responses.", "ai_in_scope": true, "relevance_reason": "This is a material-specific theory of correlated kagome bands and anomalous transport in a magnetic Weyl semimetal, making a substantive contribution to condensed-matter physics.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "该理论研究将 Co3Sn2S2 中费米能级附近的平带特征归因于轨道和自旋依赖的自能对几何 kagome 平带的移动，而非类似重费米子体系的动态能带重整化。研究将移动后的平带与增强的 Berry 曲率及反常热电输运联系起来。", "method_en": "The authors used density functional theory combined with dynamical mean-field theory, together with a minimal kagome model. They analyzed how orbital- and spin-dependent self-energies affect the flat-band position and associated transport properties.", "method_zh": "作者结合使用密度泛函理论与动力学平均场理论，并建立了最简 kagome 模型。他们分析了轨道和自旋依赖自能对平带位置及相关输运性质的影响。", "result_en": "The calculations show that a dx2−y2-dominated geometrical kagome flat band is shifted toward the Fermi level by orbital- and spin-dependent self-energies, rather than by heavy-fermion-like dynamical renormalization. The relocated band enhances local Berry curvature near the Fermi level and is associated with strongly energy-dependent anomalous Hall conductivity and a giant anomalous Nernst effect.", "result_zh": "计算表明，受轨道和自旋依赖自能作用，dx2−y2 轨道占主导的几何 kagome 平带向费米能级移动；这一变化并非源于类似重费米子体系的动态重整化。移动后的平带增强了费米能级附近的局域 Berry 曲率，并与强烈依赖能量的反常霍尔电导及巨大的反常 Nernst 效应相关联。", "future_en": "Experimental tests that track the flat-band position and anomalous thermoelectric response as a function of energy would help assess the proposed orbital-selective mechanism.", "future_zh": "通过实验追踪平带位置及反常热电响应随能量的变化，将有助于检验所提出的轨道选择性机制。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work proposes a specific correlation-driven explanation for a spectroscopic flat-band feature and connects it to measurable Hall and Nernst responses, but the abstract presents a theoretical account rather than a demonstrated experimental validation.", "tier_reason_zh": "该工作为光谱观测到的平带特征提出了具体的关联驱动解释，并将其联系到可测量的霍尔和 Nernst 响应；但摘要呈现的是理论解释，而非已完成的实验验证。"}], "stats": {"scanned": 182, "first_pass_selected": 43, "selected": 24, "rejected": 158, "ai_assessed": 182, "ai_cached": 0, "ai_unscored": 0, "global_editorial": true rl-sci"], "submitted_at": "2026-10-22T21:59:42Z", "updated_at": "2026-10-22T21:59:42Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Jeffrey Neethirajan, Rikako Yamamoto, Marisel Di Pietro Martínez, Luke A. Turnbull, Praveen Vir, Chandra Shekar, Claudia Felser, Luis Carlos Colocho Hurtarte, Benedikt J. Daurer, Majid Kazemian, Burkhard Kaulich, Claire Donnelly", "corresponding": "", "url": "https://arxiv.org/abs/2610.31952v1", "topic": "Magnetism", "level": "Feature", "summary_en": "Using soft X-ray magnetic vector tomography, this study reports a one-dimensional chain of Bloch and anti-Bloch points in an anisotropic chiral magnet, located along a boundary between regions of opposite chirality. The work identifies stable neighboring points at separations down to 60 nm and an approximate 90 nm threshold for spontaneous pair annihilation within chiral domain walls.", "summary": "Bloch point singularities play an important role in magnetic systems, mediating changes in topology in three dimensional configurations. However, until now they have only been observed as isolated objects or as part of individual topological textures. Here we present the experimental observation of a 1D dipole chain of Bloch points in an anisotropic chiral magnet using soft X-ray magnetic vector t", "abstract": "Bloch point singularities play an important role in magnetic systems, mediating changes in topology in three dimensional configurations. However, until now they have only been observed as isolated objects or as part of individual topological textures. Here we present the experimental observation of a 1D dipole chain of Bloch points in an anisotropic chiral magnet using soft X-ray magnetic vector tomography. We identify that the chain of Bloch point singularities lies along a boundary between regions of opposite chirality and that neighbouring Bloch and anti-Bloch points are stable at separations down to 60 nm. The stability of the Bloch points is determined to be closely related to the surrounding topology of the magnetisation configuration and a threshold separation for the spontaneous annihilation of Bloch point-anti-Bloch point pairs within chiral domain walls is identified to be approximately 90 nm in distance. This observation of a chain of Bloch points and the insight into their stability, offers a route to explore the correlative behaviour of such topological point defects. The behaviour and control of such point defects is of relevance for the control of 3D magnetisation configurations, and provides a new route towards the creation of correlated configurations of singularities in a magnetic system.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "A one-dimensional chain of Bloch and anti-Bloch points is observed along a boundary between opposite-chirality regions, with a measured pair-annihilation threshold of about 90 nm.", "ai_in_scope": true, "relevance_reason": "This is original experimental magnetism research establishing topological point-defect structures and stability in a chiral magnet.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": true, "summary_zh": "本研究利用软 X 射线磁矢量断层成像，在各向异性手性磁体中观测到一维 Bloch 点与反 Bloch 点链，且该链位于手性相反区域的边界上。研究发现，相邻点间距低至 60 nm 时仍可稳定存在；在手性畴壁内，点对自发湮灭的阈值间距约为 90 nm。", "method_en": "The authors use soft X-ray magnetic vector tomography to reconstruct three-dimensional magnetic configurations and identify the positions of Bloch and anti-Bloch points. They examine the chain’s location relative to opposite-chirality regions and assess defect stability as a function of point separation within chiral domain walls.", "method_zh": "作者使用软 X 射线磁矢量断层成像重建三维磁构型，并确定 Bloch 点与反 Bloch 点的位置。研究考察点链相对于手性相反区域的空间位置，并分析手性畴壁内缺陷稳定性随点间距的变化。", "result_en": "The tomography reveals a one-dimensional dipole chain of Bloch-point singularities, rather than isolated points or points confined to individual topological textures. The chain lies along a boundary between regions of opposite chirality. Neighboring Bloch and anti-Bloch points remain stable at separations down to 60 nm. The authors identify an approximate 90 nm threshold separation below which Bloch point–anti-Bloch point pairs within chiral domain walls spontaneously annihilate. They relate the stability of the points to the topology of the surrounding magnetization configuration.", "result_zh": "断层成像揭示了一维 Bloch 点奇点偶极链，而非孤立点或仅存在于单个拓扑纹理中的点。该链沿手性相反区域之间的边界分布。相邻 Bloch 点与反 Bloch 点的间距低至 60 nm 时仍保持稳定。作者确定，在手性畴壁内，Bloch 点—反 Bloch 点对自发湮灭的阈值间距约为 90 nm。作者将这些点的稳定性与周围磁化构型的拓扑性质联系起来。", "future_en": "Further studies could examine how defect-chain stability changes with magnetic configuration and whether the reported separation threshold is robust across conditions. The observed chain also motivates investigating whether interactions among multiple singularities can be used to create or control correlated three-dimensional magnetization configurations.", "future_zh": "后续研究可考察缺陷链的稳定性如何随磁构型变化，以及所报告的间距阈值在不同条件下是否稳健。该点链的发现也促使研究者探索能否利用多个奇点间的相互作用，构造或调控相关的三维磁化构型。", "tier": "PRL", "tier_reason_en": "The work reports a new, spatially resolved configuration of three-dimensional magnetic singularities and quantifies stability at nanoscale separations. The combination of a distinctive observation and a measured annihilation threshold supports a strong focused result, although the abstract does not establish broad control or application, making PRL a reasonable tier.", "tier_reason_zh": "该研究报告了一种新的三维磁奇点空间构型，并量化了纳米尺度间距下的稳定性。独特观测与湮灭阈值测量相结合，构成了有力且聚焦的成果；不过摘要尚未证明其具有广泛的可控性或应用，因此 PRL 是合理的等级。"}, {"id": "arxiv-2610-32261", "arxiv_id": "2610.32261", "type": "arXiv", "journal": "arXiv:2610.32261", "journal_ref": "", "journal_doi": "", "title": "Intrinsic Raman Modes and Crystal Symmetry of Altermagnetic $α$-MnTe", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci"], "submitted_at": "2026-10-23T07:17:05Z", "updated_at": "2026-10-23T07:17:05Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Yunpeng Cui, Shuai Zhang, Jia-Liang Xie, Jinxuan Liang, Hao Lin, Miao Qin, Jiawei Shao, Gongling Chen, Yidian Li, Yixuan Luo, Deng Hu, Bingru Lu, Hao Li, Xiang Li, Tiantian Liu, Haodong Yu, Hongyun Zhang, Shuyun Zhou, Zhiwei Wang, Yanfeng Guo, Tiantian Zhang, Miao-Ling Lin, Ping-Heng Tan, Feng Jin, Luyi Yang", "corresponding": "", "url": "https://arxiv.org/abs/2610.32261v1", "topic": "Magnetism", "level": "Brief", "summary_en": "This study reassesses Raman features and bulk inversion symmetry in altermagnetic α-MnTe using Raman and second-harmonic-generation spectroscopy alongside first-principles calculations. It attributes several prominent Raman features to segregated Te and identifies the remaining intrinsic Raman-active response with a single E₂g phonon, consistent with centrosymmetric D₆h symmetry.", "summary": "Crystal symmetry governs the physical properties of materials and provides the framework for interpreting their microscopic excitations and macroscopic responses. In altermagnets, the crystal symmetries that relate opposite-spin sublattices give rise to momentum-dependent spin splitting despite compensated magnetization. Determining the real crystal symmetry is therefore essential for understandin", "abstract": "Crystal symmetry governs the physical properties of materials and provides the framework for interpreting their microscopic excitations and macroscopic responses. In altermagnets, the crystal symmetries that relate opposite-spin sublattices give rise to momentum-dependent spin splitting despite compensated magnetization. Determining the real crystal symmetry is therefore essential for understanding the intrinsic electronic and magnetic properties. For the altermagnetic semiconductor $α$-MnTe, conflicting Raman assignments have left both its intrinsic lattice excitations and its crystal symmetry unresolved. Here we combine high-resolution Raman and second-harmonic generation (SHG) spectroscopy with first-principles calculations to distinguish intrinsic lattice excitations from Te-derived spectral contributions and to examine bulk inversion symmetry of $α$-MnTe. We show that several prominent Raman features previously assigned to $α$-MnTe instead originate from segregated Te clusters or precipitates. The remaining intrinsic Raman response consists of a single Raman-active mode assigned to the calculated $E_{2g}$ phonon, consistent with the centrosymmetric $D_{6h}$ symmetry. The SHG response agrees with surface electric-dipole and bulk electric-quadrupole contributions expected for a centrosymmetric $D_{6h}$ crystal, supporting the preservation of bulk inversion symmetry in $α$-MnTe. Our findings revise the Raman assignments in $α$-MnTe and provide a basis for interpreting its altermagnetic properties within the appropriate crystal-symmetry framework.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "The intrinsic Raman response is identified as a single E₂g phonon, while other prominent features are attributed to Te inclusions; SHG supports centrosymmetric D₆h bulk symmetry.", "ai_in_scope": true, "relevance_reason": "This combines spectroscopy and first-principles calculations to resolve an important crystal-symmetry and lattice-mode question in the altermagnetic semiconductor α-MnTe.", "relevance_method": "semantic", "relevance_score": 77, "feature_candidate": false, "summary_zh": "本研究结合拉曼与二次谐波产生光谱及第一性原理计算，重新审视反铁磁材料 α-MnTe 的拉曼特征和体相反演对称性。研究将若干显著拉曼特征归因于偏析 Te，并将剩余的本征拉曼活性响应归为单一 E₂g 声子，与中心对称的 D₆h 对称性相符。", "method_en": "The authors combine high-resolution Raman spectroscopy, second-harmonic-generation spectroscopy, and first-principles calculations to distinguish intrinsic α-MnTe excitations from Te-derived spectral contributions. They use the measured SHG response to assess bulk inversion symmetry and compare the intrinsic Raman response with calculated phonon assignments.", "method_zh": "作者结合高分辨拉曼光谱、二次谐波产生光谱和第一性原理计算，以区分 α-MnTe 的本征激发与 Te 相关的谱学贡献。研究利用 SHG 响应评估体相反演对称性，并将本征拉曼响应与计算得到的声子指认进行比较。", "result_en": "The study finds that several prominent Raman features previously assigned to α-MnTe instead arise from segregated Te clusters or precipitates. The remaining intrinsic Raman response consists of a single Raman-active mode, assigned to the calculated E₂g phonon. The SHG response is consistent with surface electric-dipole and bulk electric-quadrupole contributions expected for a centrosymmetric D₆h crystal, supporting preservation of bulk inversion symmetry in α-MnTe.", "result_zh": "研究发现，先前归属于 α-MnTe 的若干显著拉曼特征实际源自偏析的 Te 团簇或析出物。剩余的本征拉曼响应仅包含一个拉曼活性模，被指认为计算得到的 E₂g 声子。SHG 响应与中心对称 D₆h 晶体所预期的表面电偶极和体相电四极贡献相符，支持 α-MnTe 保持体相反演对称性。", "future_en": "The revised phonon assignments and symmetry analysis provide a basis for interpreting α-MnTe’s intrinsic electronic and magnetic properties. Further studies could use this framework to reassess Raman features in altermagnetic MnTe samples while accounting for possible Te segregation.", "future_zh": "修订后的声子指认和对称性分析为解释 α-MnTe 的本征电子与磁性质提供了依据。后续研究可依据这一框架重新评估反铁磁 MnTe 样品中的拉曼特征，同时考虑 Te 偏析的可能影响。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work resolves a meaningful materials-characterization dispute by combining spectroscopy and calculations, with implications for interpreting α-MnTe’s altermagnetic properties. Its principal contribution is a revised symmetry and phonon assignment rather than a broader new physical phenomenon, supporting PRB/Physical Review Materials.", "tier_reason_zh": "该研究结合光谱学与计算，解决了一个对材料表征有意义的争议，并影响对 α-MnTe 反铁磁性质的解释。其主要贡献是修订对称性和声子指认，而非揭示更广泛的新物理现象，因此适合 PRB/Physical Review Materials。"}, {"id": "arxiv-2610-31676", "arxiv_id": "2610.31676", "type": "arXiv", "journal": "arXiv:2610.31676", "journal_ref": "", "journal_doi": "", "title": "Lattice Symmetry Remnants in Spatial and Temporal Entanglement of Quantum Critical Spin Chains", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.str-el"], "submitted_at": "2026-09-07T18:15:35Z", "updated_at": "2026-09-07T18:15:35Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Xiao-Han Yang, Rui-Zhen Huang", "corresponding": "", "url": "https://arxiv.org/abs/2610.31676v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper studies how microscopic lattice symmetries and Lieb–Schultz–Mattis (LSM) constraints shape spatial and temporal entanglement in critical spin chains beyond the bulk information of their infrared conformal field theories. It finds that these constraints are encoded in the boundary realization and entanglement spectra of the corresponding boundary conformal field theories (BCFTs).", "summary": "Quantum critical lattice models carry universal information beyond the bulk data of their infrared conformal field theory (CFT): microscopic lattice symmetries constrain how the CFT is realized. We probe these remnants through the spatial and temporal entanglement of two Euclidean-evolved states from the same critical model. In the finite-length scaling regime, a conformal boundary encodes the lon", "abstract": "Quantum critical lattice models carry universal information beyond the bulk data of their infrared conformal field theory (CFT): microscopic lattice symmetries constrain how the CFT is realized. We probe these remnants through the spatial and temporal entanglement of two Euclidean-evolved states from the same critical model. In the finite-length scaling regime, a conformal boundary encodes the long-distance effect of the short-range initial state, and boundary CFT (BCFT) organizes the universal low-lying entanglement spectrum. We formulate the temporal state as a uniform infinite matrix product state evolved by a symmetry-preserving infinite matrix product operator, using a local factorization regular even at arbitrarily small Trotter steps. For the Ising and three-state Potts chains, whose relevant symmetries are onsite, the spatial and temporal constructions approach the same BCFT structure; varying the initial state engineers conformal boundaries distinguishable spectroscopically. The spin-1/2 XXZ chain instead realizes a Lieb--Schultz--Mattis (LSM) constraint between internal U(1) symmetry and one-site translation. A U(1)-preserving short-range spatial state accommodates it through a doubled unit cell and inequivalent entanglement cuts, whereas the temporal state remains uniform along Euclidean time. Successive spatial transfer steps pump the temporal entanglement spectrum between translation-related Dirichlet sectors, equivalently between integer and half-integer compact-boson zero modes. Breaking U(1) removes both the zero mode and the alternation. Continued evolution at fixed bond dimension crosses over from the finite-length BCFT regime to a finite-entanglement regime generated by symmetry-allowed relevant deformations. Thus microscopic symmetry and anomaly data remain visible in universal entanglement by constraining the boundary realization of the infrared CFT.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "For the XXZ chain, spatial transfer steps pump the temporal entanglement spectrum between translation-related Dirichlet sectors, revealing how the U(1)-translation LSM constraint persists in universal entanglement structure.", "ai_in_scope": true, "relevance_reason": "This theoretical study shows how microscopic lattice symmetries and the LSM constraint shape entanglement spectra in quantum-critical spin chains.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "本文研究微观晶格对称性与 Lieb–Schultz–Mattis（LSM）约束如何影响临界自旋链的空间和时间纠缠，并补充红外共形场论（CFT）体性质之外的信息。研究发现，这些约束体现在边界共形场论（BCFT）的边界实现方式及纠缠谱中。", "method_en": "The authors formulate the temporal state using a uniform infinite matrix product state evolved by a symmetry-preserving infinite matrix product operator, with a local factorization that remains regular for arbitrarily small Trotter steps. They analyze the Ising, three-state Potts, and spin-1/2 XXZ chains, and compare spatial and temporal entanglement in finite-length and finite-entanglement scaling regimes.", "method_zh": "作者将时间态表述为由保对称性的无限矩阵乘积算符演化的均匀无限矩阵乘积态，并采用在任意小 Trotter 步长下仍保持正则的局域分解。研究分析 Ising、三态 Potts 和自旋-1/2 XXZ 链，并比较有限长度与有限纠缠标度区间中的空间和时间纠缠。", "result_en": "For the Ising and three-state Potts chains, spatial and temporal constructions approach the same BCFT structure, while different initial states can produce spectroscopically distinguishable conformal boundaries. In the XXZ chain, the LSM constraint between U(1) symmetry and one-site translation is accommodated in the spatial state by a doubled unit cell and inequivalent entanglement cuts, whereas the temporal state remains uniform in Euclidean time. Successive spatial transfer steps pump the temporal entanglement spectrum between translation-related Dirichlet sectors, corresponding to integer and half-integer compact-boson zero modes; breaking U(1) removes both the zero mode and the alternation. At fixed bond dimension, continued evolution crosses over from finite-length BCFT behavior to a finite-entanglement regime generated by symmetry-allowed relevant deformations.", "result_zh": "在 Ising 和三态 Potts 链中，空间与时间构造趋向相同的 BCFT 结构，而不同初态可产生在谱上可区分的共形边界。在 XXZ 链中，U(1) 对称性与单格点平移之间的 LSM 约束通过空间态的双倍晶胞和不等价纠缠切口得到体现，而时间态沿欧几里得时间仍保持均匀。连续的空间转移步骤会将时间纠缠谱泵送至彼此由平移关联的 Dirichlet 扇区，对应紧致玻色子零模的整数与半整数取值；破缺 U(1) 后，零模和交替现象均消失。在固定键维数下继续演化，系统会从有限长度 BCFT 行为转入由对称性允许的相关形变产生的有限纠缠区间。", "future_en": "The results motivate extending entanglement-spectrum tests of symmetry-constrained boundary realizations to other critical lattice models and to regimes where finite-entanglement effects are significant. The abstract does not report such extensions as completed work.", "future_zh": "这些结果为将对称性约束边界实现的纠缠谱检验推广至其他临界晶格模型，以及研究有限纠缠效应显著的区间提供了动机。摘要未称这些推广工作已经完成。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The abstract presents a technically developed and conceptually useful entanglement framework, including an LSM-related spectral-pumping result across several standard critical chains; on the evidence given, this supports a strong specialist-journal tier rather than a broader top-tier assignment.", "tier_reason_zh": "摘要提出了技术上成熟且具有概念价值的纠缠框架，并在多个典型临界链中给出与 LSM 约束相关的谱泵送结果；仅依据摘要，这更适合评为较强的专业期刊层级，而非更广泛的顶级层级。"}, {"id": "arxiv-2610-32199", "arxiv_id": "2610.32199", "type": "arXiv", "journal": "arXiv:2610.32199", "journal_ref": "", "journal_doi": "", "title": "Magnonic time crystal with lasing coherence", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall"], "submitted_at": "2026-10-23T05:51:44Z", "updated_at": "2026-10-23T05:51:44Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Jiantao Song, C. K. Wei, Shuhuan Ma, Yiming Pan, Zhijian Chen, Li Yu, Wei Lu, Bimu Yao", "corresponding": "", "url": "https://arxiv.org/abs/2610.32199v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The authors report a room-temperature magnonic time crystal in yttrium iron garnet whose period-doubled response is emitted with lasing coherence. They connect this coherent radiation to nonlinear magnon interactions and demonstrate a route for mapping time-crystalline dynamics into reservoir-computing features.", "summary": "Discrete time crystals (DTC) can respond at an integer multiple of the drive period. Internal order-parameter measurements have advanced studies of this novel non-equilibrium phase of matter; however, turning this order into highly coherent, externally accessible radiation remains challenging: pump-driven nonlinear processes must supply sufficient gain to compensate dissipation while preserving su", "abstract": "Discrete time crystals (DTC) can respond at an integer multiple of the drive period. Internal order-parameter measurements have advanced studies of this novel non-equilibrium phase of matter; however, turning this order into highly coherent, externally accessible radiation remains challenging: pump-driven nonlinear processes must supply sufficient gain to compensate dissipation while preserving subharmonic stability. Here we realize a room-temperature magnonic time crystal (MTC) with radiation of lasing coherence using a pump-induced magnon mode in yttrium iron garnet. A microwave beat drive produces robust period doubling over a finite parameter range, with spectral signatures of higher-order MTC at stronger driving. The emitted field exhibits linewidth narrowing to 260.0 Hz and a first-order correlation decay time of $995 μs$. Our model links this response to three-magnon confluence, yields a stability region consistent with experiment and predicts a possible transition to chaos. We further map the complex temporal dynamics into frequency-resolved nonlinear features for reservoir computing. These results bridge time-crystalline order and nonlinear information processing through intrinsic magnon-magnon interactions and lasing coherence.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "A room-temperature magnonic time crystal emits radiation with lasing coherence, and its period-doubled response is linked to three-magnon confluence.", "ai_in_scope": true, "relevance_reason": "The experiment reveals coherent nonequilibrium magnetic order and its nonlinear dynamics in a solid-state magnon system.", "relevance_method": "semantic", "relevance_score": 80, "feature_candidate": false, "summary_zh": "作者在钇铁石榴石中实现了室温磁振子时间晶体，其周期倍增响应以具有激光相干性的辐射形式发出。他们将相干辐射与磁振子非线性相互作用联系起来，并展示了将时间晶体动力学映射为储备池计算特征的途径。", "method_en": "A microwave beat drive excites a pump-induced magnon mode in yttrium iron garnet, and the emitted field is characterized through its spectrum and first-order correlation. The authors use a model based on three-magnon confluence to describe stability and examine frequency-resolved nonlinear features for reservoir computing.", "method_zh": "作者以微波拍频驱动激发钇铁石榴石中的泵浦诱导磁振子模式，并通过辐射场的频谱和一阶关联函数进行表征。他们采用基于三磁振子合流的模型描述稳定性，并考察用于储备池计算的频率分辨非线性特征。", "result_en": "The system exhibits robust period doubling over a finite parameter range, with higher-order time-crystal spectral signatures appearing at stronger drive. The emitted field has a linewidth narrowed to 260.0 Hz and a first-order correlation decay time of 995 μs. The model yields a stability region consistent with experiment and predicts a possible transition to chaos.", "result_zh": "系统在有限参数范围内表现出稳健的周期倍增，并在更强驱动下出现高阶时间晶体的谱特征。辐射场线宽收窄至 260.0 Hz，一阶关联衰减时间为 995 μs。模型得到与实验相符的稳定区域，并预测可能发生向混沌态的转变。", "future_en": "The work points to using frequency-resolved nonlinear time-crystal dynamics for reservoir computing and to exploring the predicted transition to chaos.", "future_zh": "该研究指出，可将频率分辨的时间晶体非线性动力学用于储备池计算，并进一步探索模型预测的混沌转变。", "tier": "PRL", "tier_reason_en": "The reported room-temperature period doubling with quantitatively characterized, narrow-linewidth coherent emission is a strong experimental result that bridges nonequilibrium order and nonlinear information processing.", "tier_reason_zh": "室温周期倍增及其经定量表征的窄线宽相干辐射构成了有力的实验结果，并将非平衡有序与非线性信息处理联系起来，具有较强的物理学广泛意义。"}, {"id": "arxiv-2610-32457", "arxiv_id": "2610.32457", "type": "arXiv", "journal": "arXiv:2610.32457", "journal_ref": "", "journal_doi": "", "title": "Multifractal Magnons Around Localized Defects", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall", "cond-mat.str-el"], "submitted_at": "2026-10-23T10:21:02Z", "updated_at": "2026-10-23T10:21:02Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Adarsh Hullahalli, Yusuf Khand, Christos Panagopoulos, Christina Psaroudaki", "corresponding": "", "url": "https://arxiv.org/abs/2610.32457v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper proposes that localized defects can mix nearly degenerate magnon states in clean two-dimensional magnets, producing mesoscopic multifractal wavefunctions without disorder or quasiperiodicity.", "summary": "Multifractal wavefunctions fluctuate over a hierarchy of spatial scales, remaining spatially extended while exhibiting strongly nonuniform structure. We show that magnons in otherwise crystalline two-dimensional magnets can exhibit such behavior on mesoscopic scales, without disorder or quasiperiodicity. A localized defect can mix discrete groups of nearly degenerate magnon states in a finite samp", "abstract": "Multifractal wavefunctions fluctuate over a hierarchy of spatial scales, remaining spatially extended while exhibiting strongly nonuniform structure. We show that magnons in otherwise crystalline two-dimensional magnets can exhibit such behavior on mesoscopic scales, without disorder or quasiperiodicity. A localized defect can mix discrete groups of nearly degenerate magnon states in a finite sample, generating multiscale interference patterns and multifractal wavefunctions. We demonstrate this mechanism for both a simple spin defect and topological magnetic skyrmions. Large-scale spin-wave calculations for skyrmions in chiral and frustrated magnets reveal clear multifractal diagnostics over the full accessible range of system sizes of above-gap modes. Crucially, skyrmions make these states experimentally observable by hybridizing them with magnetically active internal deformation modes, which gives a subset of the multifractal states a nonzero magnetic dipole moment. These states can therefore be excited by uniform ac fields and remain distinguishable at realistic frequency resolution, providing a direct route to observing mesoscopic magnon multifractality.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Localized defects, including skyrmions, can mix nearly degenerate magnon states to generate mesoscopic multifractal patterns, with skyrmion deformation modes making some states excitable by uniform ac fields.", "ai_in_scope": true, "relevance_reason": "The paper advances quantum-magnetic collective-mode physics by identifying a defect-driven route to observable magnon multifractality in otherwise crystalline magnets.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": false, "summary_zh": "本文提出，局域缺陷可在无无序或准周期性的二维磁体中混合近简并磁振子态，从而产生介观多重分形波函数。", "method_en": "The authors analyze a simple spin defect and topological skyrmions, using large-scale spin-wave calculations for skyrmions in chiral and frustrated magnets.", "method_zh": "作者研究了简单自旋缺陷和拓扑斯格明子，并对手性磁体及受挫磁体中的斯格明子开展大规模自旋波计算。", "result_en": "The calculations show clear multifractal diagnostics for above-gap modes across the full accessible range of system sizes. Hybridization with magnetically active internal skyrmion deformation modes gives some of these states a nonzero magnetic dipole moment. The resulting states can be driven by uniform ac fields and distinguished at realistic frequency resolution, offering a proposed experimental route to observing mesoscopic magnon multifractality.", "result_zh": "计算显示，带隙以上模式在所有可达系统尺寸范围内均呈现清晰的多重分形特征。与具有磁活性的斯格明子内部形变模式杂化后，部分态获得非零磁偶极矩。因此，这些态可由均匀交流场激发，并能在现实的频率分辨率下区分，为观测介观磁振子多重分形提供了一条实验途径。", "future_en": "A natural follow-up is to test the predicted field-driven response and frequency-resolved signatures experimentally, and to determine how robust they are across defect and skyrmion settings.", "future_zh": "后续可通过实验检验所预测的场驱动响应及其频率分辨特征，并研究这些特征在不同缺陷和斯格明子体系中的稳健性。", "tier": "PRL", "tier_reason_en": "The proposed clean-system mechanism, calculations across accessible sizes, and explicit route to experimental excitation make a potentially broad and timely result; the abstract does not establish the breadth needed for a higher tier.", "tier_reason_zh": "该工作提出了洁净体系中的新机制，给出了覆盖可达尺寸范围的计算，并明确指出实验激发途径，具有较强的广泛意义和时效性；但摘要尚不足以支持更高档次的判断。"}, {"id": "arxiv-2610-31843", "arxiv_id": "2610.31843", "type": "arXiv", "journal": "arXiv:2610.31843", "journal_ref": "", "journal_doi": "", "title": "Optical signatures of Rashba--Dresselhaus coupling across Franz--Keldysh and Landau regimes in two-dimensional semiconductors", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall"], "submitted_at": "2026-10-22T19:26:41Z", "updated_at": "2026-10-22T19:26:41Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Bahruz Suleymanli, Samir Tariverdiev, B. Tanatar", "corresponding": "", "url": "https://arxiv.org/abs/2610.31843v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper develops a unified theory of interband optical response in two-dimensional semiconductors with simultaneous Rashba and Dresselhaus spin–orbit coupling under electric and magnetic fields. It predicts distinguishable optical signatures across zero-field, Franz–Keldysh, Landau, and crossed-field regimes.", "summary": "We develop a unified theory of the interband optical response of a two-dimensional semiconductor with simultaneous Rashba and Dresselhaus spin-orbit couplings in electric and magnetic fields. In crossed fields, the in-plane electric field generates an effective spin-orbit drift field that modifies the Landau spectrum and spinor states, while at zero magnetic field the problem maps onto Landau--Zen", "abstract": "We develop a unified theory of the interband optical response of a two-dimensional semiconductor with simultaneous Rashba and Dresselhaus spin-orbit couplings in electric and magnetic fields. In crossed fields, the in-plane electric field generates an effective spin-orbit drift field that modifies the Landau spectrum and spinor states, while at zero magnetic field the problem maps onto Landau--Zener spin dynamics.At zero external fields, the total joint density of states above the band gap remains unchanged, while characteristic subgap structures appear. Pure Rashba coupling produces an inverse square root singularity, whereas a finite Dresselhaus term gives a step and a logarithmic peak, allowing the two couplings to be distinguished optically. At zero magnetic field, the Franz--Keldysh response shows a crossover from diabatic to adiabatic spin dynamics as the electric field is reduced. In the weak-field Rashba regime, the field-free singularity becomes a finite peak whose height scales as $\\mathcal E^{-1/3}$ and whose position approaches $E_g-E_{\\rm SO}$, providing a direct measure of the Rashba energy. In a perpendicular magnetic field, spin-orbit coupling shifts and splits the Landau absorption lines and produces anticrossings without changing their total weights. The Rashba splitting changes from a $\\sqrt{B}$ dependence at weak fields to a linear dependence at strong fields. Finally, in crossed electric and magnetic fields, the electric field broadens the Landau lines and drives a continuous crossover toward the Franz--Keldysh regime, while spin-orbit coupling produces opposite shifts and different widths for the two members of each doublet.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Rashba and Dresselhaus coupling produce distinct subgap optical structures, field-dependent spin dynamics, and characteristic Landau-level shifts and splittings.", "ai_in_scope": true, "relevance_reason": "This is original theory of spin-orbit-coupled low-dimensional electrons that predicts experimentally distinguishable optical and magneto-optical signatures.", "relevance_method": "semantic", "relevance_score": 72, "feature_candidate": false, "summary_zh": "本文建立了二维半导体在电场和磁场中同时具有 Rashba 与 Dresselhaus 自旋轨道耦合时的带间光学响应统一理论。该理论预测了零场、Franz–Keldysh、Landau 以及交叉场区间中可资区分的光学特征。", "method_en": "The authors analyze the interband optical response with both spin–orbit couplings and external fields, mapping the zero-magnetic-field problem to Landau–Zener spin dynamics. They compare the predicted response across zero-field, electric-field, magnetic-field, and crossed-field limits.", "method_zh": "作者分析同时包含两种自旋轨道耦合和外场的带间光学响应，并将零磁场问题映射为 Landau–Zener 自旋动力学。研究比较了零场、电场、磁场和交叉场极限下的理论响应。", "result_en": "At zero external fields, the total joint density of states above the band gap is unchanged, but subgap structures distinguish the couplings: pure Rashba coupling yields an inverse-square-root singularity, whereas finite Dresselhaus coupling produces a step and logarithmic peak. In the weak-field Rashba Franz–Keldysh regime, the field-free singularity becomes a finite peak whose height scales as $\\mathcal E^{-1/3}$ and whose position approaches $E_g-E_{\\rm SO}$. In a perpendicular magnetic field, spin–orbit coupling shifts and splits Landau absorption lines and creates anticrossings without changing their total weights; the Rashba splitting crosses from $\\sqrt{B}$ dependence at weak fields to linear dependence at strong fields. In crossed fields, the electric field broadens Landau lines and drives a continuous crossover toward the Franz–Keldysh regime, with opposite shifts and different widths for the two members of each spin–orbit doublet.", "result_zh": "在无外场时，带隙以上的总联合态密度保持不变，但带隙以下的结构可区分两种耦合：纯 Rashba 耦合产生逆平方根奇异性，而有限 Dresselhaus 耦合产生阶跃和对数峰。在弱场 Rashba Franz–Keldysh 区间，无场奇异性变为有限峰，其峰高按 $\\mathcal E^{-1/3}$ 标度变化，峰位趋近于 $E_g-E_{\\rm SO}$。垂直磁场中，自旋轨道耦合会移动并分裂 Landau 吸收线、产生反交叉，但不改变其总权重；Rashba 分裂由弱场下的 $\\sqrt{B}$ 依赖转为强场下的线性依赖。在交叉场中，电场使 Landau 谱线展宽并推动其连续过渡至 Franz–Keldysh 区间，同时自旋轨道耦合使每个双重态的两条谱线产生方向相反的位移和不同的线宽。", "future_en": "The predicted field- and coupling-dependent spectral features provide concrete targets for optical measurements that could distinguish Rashba from Dresselhaus contributions and test the proposed crossovers. The abstract does not specify a particular experimental implementation.", "future_zh": "这些依赖外场和耦合强度的谱特征为光学测量提供了具体目标，可用于区分 Rashba 与 Dresselhaus 贡献并检验所预测的交叉行为。摘要未指定具体实验实现方案。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The abstract indicates a broad, detailed theoretical treatment with quantitative optical signatures, but describes predictions rather than an experimentally established effect; this supports a strong condensed-matter specialist tier on the available evidence.", "tier_reason_zh": "摘要显示该工作对光学响应进行了广泛而细致的理论处理，并给出定量谱特征，但所述结果是理论预测而非实验确立的效应；据现有信息，适合较强的凝聚态专业期刊层级。"}, {"id": "arxiv-2610-31725", "arxiv_id": "2610.31725", "type": "arXiv", "journal": "arXiv:2610.31725", "journal_ref": "", "journal_doi": "", "title": "Phonon evidence for a partial, re-entrant spin reorientation near room temperature in LaFe$_{1-x}$Ni$_x$O$_3$", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mes-hall", "cond-mat.mtrl-sci"], "submitted_at": "2026-10-22T13:00:38Z", "updated_at": "2026-10-22T13:00:38Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Subha Maity, Dushyant Singh, Vigneshwari S R, Tharundev V, Navneet Sharma, Subhavenkadesh SS, Krista R. Khiangte", "corresponding": "", "url": "https://arxiv.org/abs/2610.31725v1", "topic": "Magnetism", "level": "Brief", "summary_en": "This study investigates whether Ni-substituted LaFeO₃ undergoes spin reorientation near room temperature, despite the usual expectation that its Néel vector remains along the a axis below the Néel temperature. Magnetization and Raman data are interpreted as evidence for a partial, re-entrant rotation in both compositions.", "summary": "Spin reorientation near room temperature offers a route to controlling antiferromagnetic order, yet LaFeO$3$, which lacks a magnetic rare-earth ion, is generally expected to retain its spin orientation along the $a$ axis below $T{\\mathrm N}\\approx740$~K. Here, we investigate LaFe$_{1-x}$Ni$_x$O$_3$ ($x=0$ and 0.1) using temperature-dependent magnetization and Raman spectroscopy over 200--400~K. Bo", "abstract": "Spin reorientation near room temperature offers a route to controlling antiferromagnetic order, yet LaFeO$3$, which lacks a magnetic rare-earth ion, is generally expected to retain its spin orientation along the $a$ axis below $T{\\mathrm N}\\approx740$~K. Here, we investigate LaFe$_{1-x}$Ni$_x$O$_3$ ($x=0$ and 0.1) using temperature-dependent magnetization and Raman spectroscopy over 200--400~K. Both compositions exhibit magnetic anomalies at 285.6 and 323~K, respectively, accompanied by correlated deviations of 12 Raman modes from their conventional anharmonic behavior. Principal component analysis and a global fitting approach reveal a common temperature-dependent phonon response, with mode-dependent amplitudes and signs. To interpret these anomalies, we develop a Landau-based spin-phonon coupling model describing complete, partial re-entrant, and incipient spin reorientation. Comparison with the experimental Raman profiles favors a partial, re-entrant rotation of the N'eel vector in both compositions, centered near 290~K. Ni substitution narrows the characteristic reorientation interval from approximately 116 to 84~K and enhances the magnetization anomaly by a factor of four. An additional feature near 262~K in LaFeO$_3$ is consistent with the Morin transition of trace $α$-Fe$_2$O$_3$. These findings suggest that partial spin reorientation can emerge without magnetic rare-earth ions and establish collective Raman phonon anomalies as a sensitive indirect probe of magnetic anisotropy changes in orthoferrites.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "Temperature-dependent magnetic and phonon anomalies support partial, re-entrant Néel-vector rotation near 290 K in LaFeO₃ and Ni-substituted LaFeO₃, with substitution narrowing the reorientation interval and enhancing the magnetization anomaly.", "ai_in_scope": true, "relevance_reason": "The study combines magnetic and Raman measurements with a spin-phonon model to investigate a new magnetic-order phenomenon in an oxide material.", "relevance_method": "semantic", "relevance_score": 76, "feature_candidate": false, "summary_zh": "本文研究 Ni 掺杂的 LaFeO₃ 是否会在室温附近发生自旋重取向，尽管通常认为其 Néel 矢量在 Néel 温度以下保持沿 a 轴排列。作者将磁化率与拉曼数据解释为两种成分中均存在部分、再入式旋转的证据。", "method_en": "The authors measured temperature-dependent magnetization and Raman spectra for LaFe₁₋ₓNiₓO₃ (x = 0 and 0.1) from 200 to 400 K, and analyzed the Raman response using principal component analysis and global fitting. They developed a Landau-based spin–phonon coupling model to compare complete, partial re-entrant, and incipient spin reorientation scenarios with the observed profiles.", "method_zh": "作者测量了 LaFe₁₋ₓNiₓO₃（x = 0 和 0.1）在 200–400 K 范围内的温度依赖磁化率与拉曼光谱，并用主成分分析和全局拟合分析拉曼响应。他们还建立基于 Landau 理论的自旋-声子耦合模型，将完整、部分再入式及初始自旋重取向情形与实验谱形进行比较。", "result_en": "Magnetic anomalies occur at 285.6 K for x = 0 and 323 K for x = 0.1, accompanied by correlated deviations from conventional anharmonic behavior in 12 Raman modes. The model comparison favors partial, re-entrant Néel-vector rotation centered near 290 K in both samples; Ni substitution narrows the characteristic interval from about 116 to 84 K and increases the magnetization anomaly by a factor of four. An additional feature near 262 K in LaFeO₃ is consistent with a Morin transition of trace α-Fe₂O₃.", "result_zh": "在 x = 0 和 x = 0.1 样品中，磁异常分别出现在 285.6 K 和 323 K，并伴随 12 个拉曼模式偏离常规非谐行为的相关变化。模型比较更支持两种样品的 Néel 矢量在约 290 K 附近发生部分再入式旋转；Ni 掺杂使特征温区由约 116 K 缩窄至 84 K，并使磁化异常增强四倍。LaFeO₃ 在约 262 K 处的另一特征与微量 α-Fe₂O₃ 的 Morin 转变相符。", "future_en": "The results motivate using collective Raman phonon anomalies as an indirect probe of magnetic-anisotropy changes and partial spin reorientation in orthoferrites.", "future_zh": "这些结果提示，可将集体拉曼声子异常用作探测正交铁氧体中磁各向异性变化及部分自旋重取向的间接手段。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The combination of temperature-dependent measurements and a model-based interpretation supports a focused materials-physics result, while the abstract does not indicate evidence for a broader conceptual advance warranting a higher tier.", "tier_reason_zh": "温度依赖测量与模型解释相结合，构成了有明确材料物理价值的研究；但摘要未显示足以支持更高档次期刊所需的广泛概念性突破。"}, {"id": "arxiv-2610-32405", "arxiv_id": "2610.32405", "type": "arXiv", "journal": "arXiv:2610.32405", "journal_ref": "", "journal_doi": "", "title": "Quantum Landau Lifshitz Gilbert equation in ferromagnetic conductors and magnetic insulators", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall", "quant-ph"], "submitted_at": "2026-10-23T09:30:30Z", "updated_at": "2026-10-23T09:30:30Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Ji Yang Zhu, Zheng Chuan Wang", "corresponding": "", "url": "https://arxiv.org/abs/2610.32405v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper develops microscopic derivations of quantum Landau–Lifshitz–Gilbert equations and argues that damping is interaction-dependent rather than universally described by a scalar Gilbert parameter.", "summary": "Understanding the microscopic origin of magnetic damping is essential for describing magnetization dynamics in nanoscale magnetic systems. In this work, we develop a microscopic framework to derive Gilbert damping terms from specific interactions in ferromagnetic conductors and magnetic insulators. In ferromagnetic conductors, magnetic damping is dominated by the s d exchange interaction between t", "abstract": "Understanding the microscopic origin of magnetic damping is essential for describing magnetization dynamics in nanoscale magnetic systems. In this work, we develop a microscopic framework to derive Gilbert damping terms from specific interactions in ferromagnetic conductors and magnetic insulators. In ferromagnetic conductors, magnetic damping is dominated by the s d exchange interaction between the localized magnetic moments and the itinerant electrons, which is effectively equivalent to an electronmagnon interaction. From the spin diffusion equation and the spin transfer torque therein, we obtain the corresponding quantum LLG equation. In magnetic insulators, where free electrons are absent, spin phonon interactions become the primary source of the damping.Starting from an effective spin phonon interaction and using linear response theory, we derive a quantum LLG equation with a Gilbert damping tensor analytically. Our results demonstrate that different microscopic interactions lead to qualitatively different structures of magnetic damping. Instead of being described by a universal scalar parameter, Gilbert damping can exhibit spatial dependence and tensorial characteristics determined by the underlying microscopic interactions.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "It derives quantum LLG damping from electron–magnon interactions in conductors and spin–phonon interactions in insulators, showing that the resulting damping can be spatially dependent and tensorial rather than a universal scalar.", "ai_in_scope": true, "relevance_reason": "This is original theoretical work on magnetic damping in solid-state ferromagnets, deriving how distinct microscopic interactions shape magnetization dynamics.", "relevance_method": "semantic", "relevance_score": 72, "feature_candidate": false, "summary_zh": "本文从微观出发推导量子 Landau–Lifshitz–Gilbert 方程，并指出磁阻尼取决于具体相互作用，不能普遍用单一标量 Gilbert 参数描述。", "method_en": "For ferromagnetic conductors, the authors use spin diffusion and spin-transfer torque associated with s–d exchange; for magnetic insulators, they use an effective spin–phonon interaction and linear response theory.", "method_zh": "对于铁磁导体，作者基于 s–d 交换相关的自旋扩散和自旋转移力矩进行推导；对于磁性绝缘体，则采用有效自旋—声子相互作用和线性响应理论。", "result_en": "The two settings yield qualitatively different damping structures: the conductor treatment is tied to electron–magnon coupling, while the insulator treatment produces an analytically derived Gilbert damping tensor. The abstract emphasizes that damping can have spatial dependence and tensorial characteristics determined by the underlying microscopic interactions.", "result_zh": "两种体系得到的阻尼结构在定性上不同：导体中的处理与电子—磁振子耦合相关，而绝缘体中的处理解析地给出 Gilbert 阻尼张量。摘要强调，阻尼可具有由微观相互作用决定的空间依赖性和张量特征。", "future_en": "Further work could connect these derived damping structures to specific measurable dynamics in nanoscale conductors and insulators and assess the regimes in which each microscopic contribution dominates.", "future_zh": "后续可将这些推导出的阻尼结构与纳米导体及绝缘体中的具体可测动力学联系起来，并确定各类微观贡献占主导的条件。", "tier": "PRB", "tier_reason_en": "The abstract describes a useful microscopic framework and analytic results for two classes of magnets, but offers no specific quantitative validation or broader experimental demonstration to support a higher tier.", "tier_reason_zh": "摘要提出了适用于两类磁体的微观框架和解析结果，具有价值；但未给出具体定量验证或更广泛的实验展示，因此不足以支持更高档次。"}, {"id": "arxiv-2610-32283", "arxiv_id": "2610.32283", "type": "arXiv", "journal": "arXiv:2610.32283", "journal_ref": "", "journal_doi": "", "title": "Triplon dynamics from partial Kondo screening in frustrated heavy-fermion systems", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-23T07:40:57Z", "updated_at": "2026-10-23T07:40:57Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Hiroki Nakahara, Masahito Mochizuki, Rintaro Eto", "corresponding": "", "url": "https://arxiv.org/abs/2610.32283v1", "topic": "Magnetism", "level": "Brief", "summary_en": "This work studies the dynamics of the partially disordered phase in a frustrated heavy-fermion system, where magnetically ordered and Kondo-screened sites coexist. It traces how triplon excitations evolve into collective magnetic modes across transitions between Kondo-insulating, partially disordered, and magnetically ordered phases.", "summary": "The partially disordered (PD) phase, in which magnetically ordered and Kondo-screened sites coexist, has been proposed as a possible ground state of geometrically frustrated heavy-fermion systems. We investigate its dynamical properties in the half-filled periodic Anderson model on a triangular lattice by calculating the dynamical spin susceptibility within the random-phase approximation built on ", "abstract": "The partially disordered (PD) phase, in which magnetically ordered and Kondo-screened sites coexist, has been proposed as a possible ground state of geometrically frustrated heavy-fermion systems. We investigate its dynamical properties in the half-filled periodic Anderson model on a triangular lattice by calculating the dynamical spin susceptibility within the random-phase approximation built on a self-consistent Hartree-Fock solution. We show that successive quantum phase transitions from the Kondo-insulating phase to the PD phase and to a magnetically ordered phase are driven by the condensation of triplon modes originating predominantly from the Kondo-screened sites. In the PD phase, magnons and triplons coexist and hybridize, leading to characteristic level repulsion in the excitation spectrum. These results reveal how triplet excitations evolve into collective magnetic modes across the successive phase transitions and highlight the dynamical interplay between magnetic order and Kondo screening in frustrated heavy-fermion systems.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Triplon condensation is identified as the driver of successive transitions from a Kondo insulator to a partially disordered phase and then magnetic order, where triplons hybridize with magnons.", "ai_in_scope": true, "relevance_reason": "The work develops a dynamical account of competing Kondo screening and magnetic order in a frustrated heavy-fermion system.", "relevance_method": "semantic", "relevance_score": 75, "feature_candidate": false, "summary_zh": "本文研究受挫重费米子系统中部分无序相的动力学，其中磁有序位点与 Kondo 屏蔽位点共存。研究追踪了三重态激发如何在 Kondo 绝缘相、部分无序相和磁有序相之间的转变过程中演化为集体磁模式。", "method_en": "The authors calculate the dynamical spin susceptibility of the half-filled periodic Anderson model on a triangular lattice using the random-phase approximation built on a self-consistent Hartree–Fock solution.", "method_zh": "作者针对三角晶格上的半填充周期 Anderson 模型，在自洽 Hartree–Fock 解的基础上采用随机相位近似计算动力学自旋磁化率。", "result_en": "They find successive transitions from the Kondo-insulating phase to the partially disordered phase and then to a magnetically ordered phase, driven by condensation of triplon modes predominantly associated with Kondo-screened sites. Within the partially disordered phase, magnons and triplons coexist and hybridize, producing level repulsion in the excitation spectrum.", "result_zh": "研究发现，系统依次从 Kondo 绝缘相转变为部分无序相，再转变为磁有序相；这些转变由主要源自 Kondo 屏蔽位点的三重态模式凝聚驱动。在部分无序相中，磁振子与三重态激发共存并发生杂化，使激发谱出现能级排斥。", "future_en": "The results provide a dynamical framework for examining the interplay of magnetic order and Kondo screening in frustrated heavy-fermion systems.", "future_zh": "这些结果为进一步考察受挫重费米子系统中磁有序与 Kondo 屏蔽的动力学相互作用提供了框架。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The abstract presents a technically focused theoretical analysis of excitations in a specific model, with clear physical conclusions but no stated experimental validation or unusually broad result.", "tier_reason_zh": "摘要呈现了针对特定模型激发谱的理论分析，物理结论明确，但未提及实验验证或具有异常广泛影响的结果。"}, {"id": "arxiv-2610-32136", "arxiv_id": "2610.32136", "type": "arXiv", "journal": "arXiv:2610.32136", "journal_ref": "", "journal_doi": "", "title": "Zeeman Shift and Injection Currents under Light Irradiation", "arxiv_version": 1, "primary_category": "cond-mat.other", "categories": ["cond-mat.other"], "submitted_at": "2026-10-23T04:05:06Z", "updated_at": "2026-10-23T04:05:06Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Ruizhi Dong, Yihua Xiao, Pengfei Wang, Ruixiang Fei", "corresponding": "", "url": "https://arxiv.org/abs/2610.32136v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper predicts Zeeman shift and injection photocurrents generated jointly by the electric and magnetic components of light, including in centrosymmetric systems with spin-orbit coupling or noncollinear magnetic order.", "summary": "The conversion of light into electrical currents enables energy harvesting and photodetection. Conventional second-order dc photocurrents are driven by the electric component of light through electric-dipole coupling and require broken inversion symmetry. Here, we show that the electric and magnetic components of light jointly generate Zeeman shift and injection currents. Using quantum perturbatio", "abstract": "The conversion of light into electrical currents enables energy harvesting and photodetection. Conventional second-order dc photocurrents are driven by the electric component of light through electric-dipole coupling and require broken inversion symmetry. Here, we show that the electric and magnetic components of light jointly generate Zeeman shift and injection currents. Using quantum perturbation theory, we derive explicit microscopic expressions for their conductivity tensors. We systematically classify the symmetry constraints on these responses and show how they differ from those governing conventional photocurrents. In particular, both responses can occur in centrosymmetric systems with spin-orbit coupling or noncollinear magnetic order, irrespective of time-reversal symmetry. A centrosymmetric kagome model exhibits broadband responses. First-principles calculations for Mn$_3$Sn further predict Zeeman injection and shift current densities of $10^{2}$-$10^{3}~\\mathrm{A/m^{2}}$ and $1$-$10~\\mathrm{A/m^{2}}$, respectively, under illumination with an electric-field amplitude $E=10^{4}~\\mathrm{V/m}$. These magnitudes place both currents within experimental reach.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "The work identifies Zeeman shift and injection currents generated jointly by the electric and magnetic components of light, and shows they can occur in centrosymmetric systems, including noncollinear magnets.", "ai_in_scope": true, "relevance_reason": "It derives and predicts new light-induced electronic responses in magnetic and spin-orbit-coupled materials, including Mn3Sn.", "relevance_method": "semantic", "relevance_score": 76, "feature_candidate": false, "summary_zh": "本文预测，光的电场和磁场分量协同作用可产生塞曼位移光电流和注入光电流；在具有自旋轨道耦合或非共线磁序的中心对称体系中也可出现这些响应。", "method_en": "Using quantum perturbation theory, the authors derive microscopic conductivity tensors and classify the symmetries of the responses; they also study a centrosymmetric kagome model and perform first-principles calculations for Mn₃Sn.", "method_zh": "作者利用量子微扰理论推导微观电导张量并分类响应的对称性；此外，他们研究了中心对称 kagome 模型，并对 Mn₃Sn 进行了第一性原理计算。", "result_en": "The derived symmetry conditions differ from those for conventional electric-dipole photocurrents, and the predicted responses can occur irrespective of time-reversal symmetry. The kagome model exhibits broadband responses. For Mn₃Sn under illumination with electric-field amplitude 10⁴ V/m, the predicted Zeeman injection and shift current densities are 10²–10³ A/m² and 1–10 A/m², respectively, which the authors place within experimental reach.", "result_zh": "推导得到的对称性条件不同于传统电偶极光电流的条件，而且这些响应可在时间反演对称性存在或破缺时出现。kagome 模型呈现宽带响应。对于电场振幅为 10⁴ V/m 的照明，Mn₃Sn 中预测的塞曼注入电流密度为 10²–10³ A/m²，塞曼位移电流密度为 1–10 A/m²；作者认为这些量级可通过实验测得。", "future_en": "Experimental tests of the predicted current densities in Mn₃Sn and studies of the response across frequency and magnetic-order regimes would assess the proposed mechanisms and their practical observability.", "future_zh": "在 Mn₃Sn 中实验检验所预测的电流密度，并研究不同频率及磁序条件下的响应，可进一步评估所提出机制及其实际可观测性。", "tier": "PRL", "tier_reason_en": "The work combines a distinct light-matter response, symmetry classification, and material-specific predictions at experimentally accessible magnitudes, supporting a strong broad-interest assessment.", "tier_reason_zh": "该工作结合了不同于传统机制的光物质响应、对称性分类及达到实验可及量级的材料特定预测，具有较强的广泛兴趣价值。"}, {"id": "arxiv-2610-32743", "arxiv_id": "2610.32743", "type": "arXiv", "journal": "arXiv:2610.32743", "journal_ref": "", "journal_doi": "", "title": "First- and Second-Order Electron Position Correlators Reveal Topological Phase Transitions", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.dis-nn", "cond-mat.mes-hall", "cond-mat.mtrl-sci", "cond-mat.stat-mech"], "submitted_at": "2026-10-23T14:55:16Z", "updated_at": "2026-10-23T14:55:16Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Antimo Marrazzo, Christian Loer Llemit, Massimo Capone", "corresponding": "", "url": "https://arxiv.org/abs/2610.32743v1", "topic": "Materials & Growth", "level": "Brief", "summary_en": "The paper proposes position-operator two-point correlators and higher-order Chern–Chern correlators as a framework for diagnosing topological phase transitions in crystalline, noncrystalline, equilibrium, and dynamical systems.", "summary": "The theory of conventional critical phenomena is built around the concepts of fluctuations and correlators of local observables. Here, we show that topological phase transitions can also be characterized through spatial and temporal two-point correlation functions associated with fluctuations of the electronic position operator. The key object is the antisymmetric part of the position-position cor", "abstract": "The theory of conventional critical phenomena is built around the concepts of fluctuations and correlators of local observables. Here, we show that topological phase transitions can also be characterized through spatial and temporal two-point correlation functions associated with fluctuations of the electronic position operator. The key object is the antisymmetric part of the position-position correlation function, which yields the Chern number in the equal-time and equal-space limit. When the system is translationally invariant in space or time (the latter case corresponding to an equilibrium condition), these two-point correlators reduce to one-variable functions of the remaining variable. Remarkably, these functions are both reminiscent of critical behaviour, including divergent correlation times and lengths signalling the phase transitions. Away from these conditions, namely in non-periodic systems or genuinely dynamical processes, criticality is instead better captured by higher-order Chern-Chern correlators constructed from local or dynamical markers obtained as coincident-point limits of the position correlators. These higher-order Chern-Chern correlators can be seen as double Levi-Civita contractions of second-order position correlators, selecting the antisymmetric sector in each index pair. We substantiate this framework through numerical simulations and analytic calculations. Our results establish a general correlator-based description of topological phase transitions, applicable to crystalline, noncrystalline, equilibrium, and dynamical systems.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Antisymmetric position-position correlators encode the Chern number and exhibit critical behavior at topological transitions, with higher-order Chern-Chern correlators extending the framework to non-periodic and dynamical systems.", "ai_in_scope": true, "relevance_reason": "It develops and tests a theoretical description of topological electronic phase transitions using position-based correlators.", "relevance_method": "semantic", "relevance_score": 72, "feature_candidate": false, "summary_zh": "本文提出以位置算符的两点关联函数及更高阶 Chern–Chern 关联函数为框架，用于诊断晶态、非晶态、平衡态和动力学体系中的拓扑相变。", "method_en": "The authors relate the antisymmetric position–position correlator to the Chern number in the equal-time, equal-space limit, and construct higher-order correlators from local or dynamical markers for settings without spatial or temporal translation invariance. They support the framework with numerical simulations and analytic calculations.", "method_zh": "作者证明位置—位置关联函数的反对称部分在等时、等空间极限下给出 Chern 数，并针对缺乏空间或时间平移不变性的情形，基于局域或动力学标记构造高阶关联函数。该框架由数值模拟和解析计算加以验证。", "result_en": "Under spatial or temporal translation invariance, the two-point correlators reduce to functions of a single variable and exhibit critical-like behavior, including divergent correlation lengths and times at transitions. For nonperiodic systems or genuinely dynamical processes, the authors argue that criticality is better captured by higher-order Chern–Chern correlators formed through antisymmetric contractions of the second-order correlators. The framework is presented as applicable across crystalline and noncrystalline systems and across equilibrium and dynamical regimes.", "result_zh": "在空间或时间平移不变条件下，两点关联函数可化为单变量函数，并呈现类似临界现象的行为，包括相变处发散的关联长度和关联时间。对于非周期体系或真正的动力学过程，作者认为由二阶关联函数的反对称收缩构成的高阶 Chern–Chern 关联函数更适合刻画临界性。该框架旨在适用于晶态与非晶态体系，以及平衡与动力学情形。", "future_en": "Further studies could apply the correlator framework to concrete nonperiodic and dynamical topological transitions and test how its proposed critical signatures behave in specific models or experiments.", "future_zh": "后续可将该关联函数框架应用于具体的非周期及动力学拓扑相变，并在特定模型或实验中检验其所提出的临界特征。", "tier": "PRL", "tier_reason_en": "The work offers a potentially general correlator-based characterization spanning noncrystalline and dynamical settings
