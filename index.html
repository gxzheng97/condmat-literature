opic": "Materials & Growth", "level": "Brief", "summary_en": "Structural basis of bile acid lateral diffusion facilitated by the OSTα/β transporter", "summary": "Structural basis of bile acid lateral diffusion facilitated by the OSTα/β transporter", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-ggnj-y9lb", "doi": "10.1103/ggnj-y9lb", "type": "Journal", "journal": "PRB", "title": "Symmetry rules for cavity materials engineering with linearly polarized vacuum fields", "authors": "Jingkai Quan, Chongxiao Fan, Benshu Fan et al.", "corresponding": "", "url": "https://doi.org/10.1103/ggnj-y9lb", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Cavity materials engineering, aiming to manipulate material properties by coupling to vacuum fluctuations inside a cavity, is a rapidly advancing field. Despite significant progress, most studies to date have focused on specific materials and cavity configurations. Here, through a comprehensive group-theoretical analysis, we establish general symmetry rules for cavity materials engineering with li", "summary": "Cavity materials engineering, aiming to manipulate material properties by coupling to vacuum fluctuations inside a cavity, is a rapidly advancing field. Despite significant progress, most studies to date have focused on specific materials and cavity configurations. Here, through a comprehensive group-theoretical analysis, we establish general symmetry rules for cavity materials engineering with li", "abstract": "Cavity materials engineering, aiming to manipulate material properties by coupling to vacuum fluctuations inside a cavity, is a rapidly advancing field. Despite significant progress, most studies to date have focused on specific materials and cavity configurations. Here, through a comprehensive group-theoretical analysis, we establish general symmetry rules for cavity materials engineering with linearly polarized cavity photon modes. By analyzing the symmetry of the Pauli-Fierz Hamiltonian within the long-wavelength approximation, we provide a classification of the symmetry-breaking patterns induced by cavity modes for all crystallographic point groups. The power of this framework is then demonstrated by quantum-electrodynamical density functional theory calculations. In particular, we explain the distinct cavity-induced lifting of band degeneracies in cubic BaTiO 3 for different cavity mode configurations, and the cavity-modified infrared and Raman spectra of monolayer MoS 2 due to symmetry breaking. Our results highlight the central role of symmetry in cavity materials engineering and provide general guidelines for future studies in this field.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-w38j-dmbg", "doi": "10.1103/w38j-dmbg", "type": "Journal", "journal": "Physical Review Materials", "title": "Third harmonic generation in the transition metal trichalcogenides", "authors": "Timothy Y. Chung, Vergil M. Schreiber, Randy M. Sterbentz et al.", "corresponding": "", "url": "https://doi.org/10.1103/w38j-dmbg", "topic": "Materials & Growth", "level": "Brief", "summary_en": "The transition metal trichalcogenides (TMTs) are an interesting class of layered 2D materials that have strong anisotropic electrical and optical properties. We report on the polarization-dependent nonlinear optical response of exfoliated crystals at the third harmonic using nonresonant excitation with a 1560 nm femtosecond laser. All members of the TMT crystal family explored ( ZrS 3 , HfS 3 , Ti", "summary": "The transition metal trichalcogenides (TMTs) are an interesting class of layered 2D materials that have strong anisotropic electrical and optical properties. We report on the polarization-dependent nonlinear optical response of exfoliated crystals at the third harmonic using nonresonant excitation with a 1560 nm femtosecond laser. All members of the TMT crystal family explored ( ZrS 3 , HfS 3 , Ti", "abstract": "The transition metal trichalcogenides (TMTs) are an interesting class of layered 2D materials that have strong anisotropic electrical and optical properties. We report on the polarization-dependent nonlinear optical response of exfoliated crystals at the third harmonic using nonresonant excitation with a 1560 nm femtosecond laser. All members of the TMT crystal family explored ( ZrS 3 , HfS 3 , TiS 3 , and NbS 3 ) display large anisotropy in their polarized third harmonic generation signal, with anisotropy ratios as large as χ 11 / χ 22 ≈ 6.5 . From the expected nonlinear dependence of these monoclinic and triclinic crystals, we extract the relative nonlinear susceptibility coefficients. We find that the anisotropy ratio is largest for ZrS 3 and decreases across the family, a trend we associate with the proximity of the third harmonic energy to the strongly b -polarized absorption edge of each material. NbS 3 , the only triclinic crystal, displays a pronounced anisotropy in thick flakes that is strongly reduced in the thinnest flakes, which we attribute to a partial relaxation of the Peierls-type Nb–Nb dimerization that underlies the triclinic distortion. The large anisotropic nonlinear response in this crystal family sets it apart from other 2D materials and makes them particularly attractive for further investigation.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75356", "doi": "10.1002/adma.75356", "type": "Journal", "journal": "Advanced Materials", "title": "Ultrasound‐Activated Hydrogen‐Bonded Organic Framework Synergistically Enhances Antitumor Immunity by Epigenetic Reprogramming and Pyroptosis Induction", "authors": "Fan Zhuang, Jingjing Li, Chenguang Shi et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75356", "topic": "Materials & Growth", "level": "Brief", "summary_en": "ABSTRACT Pyroptosis, a pro‐inflammatory form of cell death, elicits robust antitumor immune responses. However, pyroptosis‐based cancer immunotherapy is hampered by the epigenetic silencing of gasdermin E (GSDME) through hypermethylation of the DFNA5 gene. To overcome this limitation, we engineered an innovative nanosystem by first synthesizing a reactive oxygen species (ROS)‐responsive decitabine", "summary": "ABSTRACT Pyroptosis, a pro‐inflammatory form of cell death, elicits robust antitumor immune responses. However, pyroptosis‐based cancer immunotherapy is hampered by the epigenetic silencing of gasdermin E (GSDME) through hypermethylation of the DFNA5 gene. To overcome this limitation, we engineered an innovative nanosystem by first synthesizing a reactive oxygen species (ROS)‐responsive decitabine", "abstract": "ABSTRACT Pyroptosis, a pro‐inflammatory form of cell death, elicits robust antitumor immune responses. However, pyroptosis‐based cancer immunotherapy is hampered by the epigenetic silencing of gasdermin E (GSDME) through hypermethylation of the DFNA5 gene. To overcome this limitation, we engineered an innovative nanosystem by first synthesizing a reactive oxygen species (ROS)‐responsive decitabine prodrug (DTO), which was subsequently encapsulated within hydrogen‐bonded organic frameworks to form the HDTO nanoplatform. Upon ultrasound (US) activation, the HDTO nanoplatform exhibited potent ROS generation, enabling two complementary functions: (1) triggering decitabine release to demethylate DFNA5 and restore GSDME expression and (2) activating caspase‐3, thereby initiating the caspase‐3/GSDME‐mediated pyroptotic pathway. This apoptosis‐to‐pyroptosis switching mechanism significantly enhanced immunogenic cell death and potentiated antitumor immunity. In vivo studies demonstrated that US‐activated HDTO induced robust pyroptosis, remodeled the tumor microenvironment, and elicited superior antitumor immune responses, resulting in marked suppression of tumor growth and metastasis. Single‐cell RNA sequencing analysis confirmed that HDTO + US‐induced pyroptosis depleted nonimmune cells while expanding monocyte and neutrophil populations, demonstrating effective immunoreprogramming. This study establishes a novel therapeutic paradigm that synergistically integrates epigenetic modulation with pyroptosis induction to enhance the efficacy of cancer immunotherapy.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41567-026-03516-9", "doi": "10.1038/s41567-026-03516-9", "type": "Journal", "journal": "Nature Physics", "title": "Wigner crystals get dressed", "authors": "Mauro Brotons-Gisbert, Brian D. Gerardot", "corresponding": "", "url": "https://doi.org/10.1038/s41567-026-03516-9", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Wigner crystals get dressed", "summary": "Wigner crystals get dressed", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78394-z", "doi": "10.1038/s41467-026-78394-z", "type": "Journal", "journal": "Nature Communications", "title": "XIST drives X-chromosome inactivation and safeguards female extraembryonic cells in humans", "authors": "Amitesh Panda, Léo Carrillo, Bradley Philip Balaton et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78394-z", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Abstract X-chromosome inactivation (XCI) is essential for extraembryonic tissue growth and embryo development in mice. However, species-specific differences in its timing and regulation have left its role in human development unclear. Here, we show that the in vitro differentiation of naive human pluripotent stem cells to trophoblast stem cells and extraembryonic mesoderm cells is accompanied by X", "summary": "Abstract X-chromosome inactivation (XCI) is essential for extraembryonic tissue growth and embryo development in mice. However, species-specific differences in its timing and regulation have left its role in human development unclear. Here, we show that the in vitro differentiation of naive human pluripotent stem cells to trophoblast stem cells and extraembryonic mesoderm cells is accompanied by X", "abstract": "Abstract X-chromosome inactivation (XCI) is essential for extraembryonic tissue growth and embryo development in mice. However, species-specific differences in its timing and regulation have left its role in human development unclear. Here, we show that the in vitro differentiation of naive human pluripotent stem cells to trophoblast stem cells and extraembryonic mesoderm cells is accompanied by XCI. The inactive X chromosome displays an atypical chromatin state, lacking DNA methylation and canonical heterochromatin marks. We demonstrate that extraembryonic differentiation and XCI are temporally linked. Using loss of function approaches, we found that XIST is required for XCI establishment in humans. Furthermore, we show that XCI is needed for the survival of human female extraembryonic cells. Together, these findings link XCI to the formation of human extraembryonic lineages, with important implications for human reproductive biology.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78914-x", "doi": "10.1038/s41467-026-78914-x", "type": "Journal", "journal": "Nature Communications", "title": "An untethered sub-gram flapping-wing flight system achieves sustained self-stabilizing and altitude-controlled flight", "authors": "Xiang Lu, Jie Chen, Yulie Wu et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78914-x", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Abstract Insect-scale flapping-wing micro aerial vehicles offer substantial potential for applications such as search and rescue. However, stringent power and payload constraints at the sub-gram scale have precluded sustained untethered flight. Inspired by the high lift generated by full-circumferential rotor motion, this study presents a cross-shaped piezoelectric direct-drive V-wing structure. T", "summary": "Abstract Insect-scale flapping-wing micro aerial vehicles offer substantial potential for applications such as search and rescue. However, stringent power and payload constraints at the sub-gram scale have precluded sustained untethered flight. Inspired by the high lift generated by full-circumferential rotor motion, this study presents a cross-shaped piezoelectric direct-drive V-wing structure. T", "abstract": "Abstract Insect-scale flapping-wing micro aerial vehicles offer substantial potential for applications such as search and rescue. However, stringent power and payload constraints at the sub-gram scale have precluded sustained untethered flight. Inspired by the high lift generated by full-circumferential rotor motion, this study presents a cross-shaped piezoelectric direct-drive V-wing structure. The structure uses a tuning-fork vibration mode to generate full-circumferential flapping, suppressing fuselage vibration without external anchoring and substantially improving the lift performance of the piezoelectric direct-drive flapping-wing micro aerial vehicle. Based on this principle, we developed a cross-shaped four-piezoelectric-actuator V-wing micro aerial vehicle weighing 389 mg with a wingspan of 6.8 cm, capable of generating a maximum lift of 1850 mg. Waveform modulation increases the efficiency of the 173 mg drive circuit to 45%, while mechanical self-stabilization suppresses attitude disturbances. Integrated with a 350 mg battery, the 984 mg system achieves untethered, sustained, stable flight for a sub-gram flapping-wing micro aerial vehicle. The maximum lift-to-weight ratio of the untethered flapping-wing micro aerial vehicle system is 1.88. Its maximum flight altitude exceeds 10 m, and its continuous flight duration under low-power operation exceeds 240 s. The system also demonstrates altitude-controlled and disturbance-resilient untethered flight.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41567-026-03486-y", "doi": "10.1038/s41567-026-03486-y", "type": "Journal", "journal": "Nature Physics", "title": "Beating the break-even point with autonomous quantum error correction", "authors": "Yi Li, Qingyuan Mei, Qing-Xuan Jie et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41567-026-03486-y", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Beating the break-even point with autonomous quantum error correction", "summary": "Beating the break-even point with autonomous quantum error correction", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1073-pnas-2625566123", "doi": "10.1073/pnas.2625566123", "type": "Journal", "journal": "PNAS", "title": "Blinks are strategically coupled with head movements in unconstrained natural gaze behavior", "authors": "Alexander Goettker, Mary Hayhoe", "corresponding": "", "url": "https://doi.org/10.1073/pnas.2625566123", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Blinks are a ubiquitous yet largely unnoticed aspect of human vision, despite causing frequent interruptions of visual input that can amount to up to 10% of waking time. By leveraging a large dataset of unconstrained gaze behavior during two natural tasks, we found a behavioral strategy to limit the impact of blinks: blinks were strategically coupled with head movements, which minimizes informatio", "summary": "Blinks are a ubiquitous yet largely unnoticed aspect of human vision, despite causing frequent interruptions of visual input that can amount to up to 10% of waking time. By leveraging a large dataset of unconstrained gaze behavior during two natural tasks, we found a behavioral strategy to limit the impact of blinks: blinks were strategically coupled with head movements, which minimizes informatio", "abstract": "Blinks are a ubiquitous yet largely unnoticed aspect of human vision, despite causing frequent interruptions of visual input that can amount to up to 10% of waking time. By leveraging a large dataset of unconstrained gaze behavior during two natural tasks, we found a behavioral strategy to limit the impact of blinks: blinks were strategically coupled with head movements, which minimizes information loss due to unreliable visual input during head movements. Specifically, blink probability increased with higher head velocities and showed strong temporal modulation relative to head movement onset: Blink probability was reduced before head movement initiation and then peaked during the head movement. The strength of this coupling was tailored to the individual needs of participants, with participants with higher baseline blink rates showing stronger synchronization. This indicates that blinks are a part of an individually coordinated strategy when orchestrating eye and head movements during unconstrained natural behavior.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78335-w", "doi": "10.1038/s41467-026-78335-w", "type": "Journal", "journal": "Nature Communications", "title": "Chemistry-infused bandit framework for interpretable autonomous campaign of electrocatalysis", "authors": "Yi-An Lai, Muxin Xiong, Jingwen Sun et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78335-w", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Abstract Autonomous experimentation offers a time-efficient route towards accelerated catalyst discovery, but current practices often rely on black-box models that are difficult to interpret. Here we demonstrate the paradigm of interpretable autonomous exploration of a 12-dimensional space in the electrocatalytic hydrogen evolution reaction by integrating an interpretable decision-making artificia", "summary": "Abstract Autonomous experimentation offers a time-efficient route towards accelerated catalyst discovery, but current practices often rely on black-box models that are difficult to interpret. Here we demonstrate the paradigm of interpretable autonomous exploration of a 12-dimensional space in the electrocatalytic hydrogen evolution reaction by integrating an interpretable decision-making artificia", "abstract": "Abstract Autonomous experimentation offers a time-efficient route towards accelerated catalyst discovery, but current practices often rely on black-box models that are difficult to interpret. Here we demonstrate the paradigm of interpretable autonomous exploration of a 12-dimensional space in the electrocatalytic hydrogen evolution reaction by integrating an interpretable decision-making artificial intelligence with a fully automated electrochemical platform. Guided by a human’s chemistry-informed hypothesis, a chemistry-infused bandit is established to reflect the locally quadratic approximation between synthetic conditions and electrocatalytic activities near the explored optimum region. Not only does such a decision-making bandit lead to the discovery of previously unreported, earth-abundant electrocatalysts at least comparable to Pt-based ones, the bandit also reveals model-derived hypothesis for how synthetic conditions affect the electrocatalysts’ performance near the identified local optima as autonomous inquiry proceeds, which is otherwise untenable from black-box ones. Incorporating chemistry-informed hypothesis into the decision-making bandit is generally applicable to any chemistry problem and offers a framework for autonomous investigation, advancing hypothesis generation for catalyst’s design principles beyond simple optimization.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78448-2", "doi": "10.1038/s41467-026-78448-2", "type": "Journal", "journal": "Nature Communications", "title": "Clade-specific transmission dynamics of enterovirus D68 and their association with acute flaccid myelitis", "authors": "David Jorgensen, Noémie Lefrancq, Nicholas C. Grassly et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78448-2", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Abstract Enterovirus D68 (EV-D68) is a common cause of mild respiratory illness in children but is also linked to acute flaccid myelitis (AFM), a rare and severe neurological condition which can result in permanent paralysis. Tracking EV-D68 transmission is difficult because symptoms overlap with other common childhood illnesses, making case reporting unreliable. As a result, the burden of EV-D68 ", "summary": "Abstract Enterovirus D68 (EV-D68) is a common cause of mild respiratory illness in children but is also linked to acute flaccid myelitis (AFM), a rare and severe neurological condition which can result in permanent paralysis. Tracking EV-D68 transmission is difficult because symptoms overlap with other common childhood illnesses, making case reporting unreliable. As a result, the burden of EV-D68 ", "abstract": "Abstract Enterovirus D68 (EV-D68) is a common cause of mild respiratory illness in children but is also linked to acute flaccid myelitis (AFM), a rare and severe neurological condition which can result in permanent paralysis. Tracking EV-D68 transmission is difficult because symptoms overlap with other common childhood illnesses, making case reporting unreliable. As a result, the burden of EV-D68 transmission remains poorly understood, particularly prior to the first widely recognised outbreak in 2014. Phylodynamic approaches offer a powerful alternative to case-based surveillance, inferring epidemiological parameters directly from pathogen genetic sequences. Here we show, using a birth-death-sampling phylodynamic model applied to publicly available EV-D68 sequences from the 1990s to 2023 collected in Europe and North America, that seasonal EV-D68 transmission was well established long before the 2014 outbreak brought the virus to widespread attention. Furthermore, we show that AFM case burden is strongly associated with the transmission dynamics of a specific EV-D68 clade, clade B, an association not seen for clades A and D. These findings suggest that clade-specific biological differences drive AFM risk, with important implications for surveillance prioritisation and the timing of future burden of neurological disease.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-43s7-tgzq", "doi": "10.1103/43s7-tgzq", "type": "Journal", "journal": "PRL", "title": "Comment on “Quantum limits to incoherent imaging are achieved by linear interferometry”", "authors": "George Brumpton, Aiman Khan, Helia Hooshmand et al.", "corresponding": "", "url": "https://doi.org/10.1103/43s7-tgzq", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Comment on “Quantum limits to incoherent imaging are achieved by linear interferometry”", "summary": "Comment on “Quantum limits to incoherent imaging are achieved by linear interferometry”", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-bqc1-pd6j", "doi": "10.1103/bqc1-pd6j", "type": "Journal", "journal": "PRB", "title": "Competing regimes of carrier and impurity scattering limiting phonon heat conduction in heavily doped silicon", "authors": "Raja Sen, Juan Carlos Acosta Abanto, Mélanie Brouillard et al.", "corresponding": "", "url": "https://doi.org/10.1103/bqc1-pd6j", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Competing regimes of carrier and impurity scattering limiting phonon heat conduction in heavily doped silicon", "summary": "Competing regimes of carrier and impurity scattering limiting phonon heat conduction in heavily doped silicon", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-zvy4-x95k", "doi": "10.1103/zvy4-x95k", "type": "Journal", "journal": "PRB", "title": "Computing effective parameters for Landau-type nonequilibrium dynamics", "authors": "Mauro Pulzone, Iñigo Robredo-Magro, Jorge Íñiguez-González", "corresponding": "", "url": "https://doi.org/10.1103/zvy4-x95k", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Computing effective parameters for Landau-type nonequilibrium dynamics", "summary": "Computing effective parameters for Landau-type nonequilibrium dynamics", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78270-w", "doi": "10.1038/s41467-026-78270-w", "type": "Journal", "journal": "Nature Communications", "title": "Cosmogenic isotopic evidence from Chang’e-6 clasts for excavation history and ejecta provenance in the South Pole-Aitken basin", "authors": "Mi Zhou, Yingnan Zhang, Jian Chen et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78270-w", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Abstract Impact and space weathering play a key role in resurfacing the Moon, yet their effects on the lunar farside remain poorly constrained. Chang’e-6 (CE-6) samples provide a unique opportunity to understand space weathering and material redistributions within the South Pole-Aitken (SPA) Basin. Our combined cosmogenic Sm, Hf, and Cr isotope results indicate an average cosmic-ray exposure (CRE)", "summary": "Abstract Impact and space weathering play a key role in resurfacing the Moon, yet their effects on the lunar farside remain poorly constrained. Chang’e-6 (CE-6) samples provide a unique opportunity to understand space weathering and material redistributions within the South Pole-Aitken (SPA) Basin. Our combined cosmogenic Sm, Hf, and Cr isotope results indicate an average cosmic-ray exposure (CRE)", "abstract": "Abstract Impact and space weathering play a key role in resurfacing the Moon, yet their effects on the lunar farside remain poorly constrained. Chang’e-6 (CE-6) samples provide a unique opportunity to understand space weathering and material redistributions within the South Pole-Aitken (SPA) Basin. Our combined cosmogenic Sm, Hf, and Cr isotope results indicate an average cosmic-ray exposure (CRE) age of ~500 Ma for the CE-6 soil. Most low-Ti basaltic clasts experienced prolonged exposure similar to the host soil, whereas two were excavated more recently. Three KREEP-bearing clasts falling into two compositional groups show non-overlapping CRE ages, indicative of different excavation histories. Comparison with remote-sensing data suggests the Mg-rich pyroxene annulus and cryptomare as candidate source regions, respectively. These findings suggest that KREEP components are more widely distributed across the lunar farside than previously recognized.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-dlfv-z6m2", "doi": "10.1103/dlfv-z6m2", "type": "Journal", "journal": "PRX", "title": "Cosmological and High-Energy Physics Implications from Gravitational-Wave Background Searches in LIGO-Virgo-KAGRA’s O1–O4a Runs", "authors": "A. G. Abac, I. Abouelfettouh, F. Acernese et al.", "corresponding": "", "url": "https://doi.org/10.1103/dlfv-z6m2", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "We search for gravitational-wave background signals produced by various early Universe processes in the Advanced LIGO O4a dataset, combined with the data from the earlier O1, O2, and O3 (LIGO-Virgo) runs. The absence of detectable signals enables powerful constraints on fundamental physics. We derive gravitational-wave background energy density upper limits from the O1–O4a data to constrain parame", "summary": "We search for gravitational-wave background signals produced by various early Universe processes in the Advanced LIGO O4a dataset, combined with the data from the earlier O1, O2, and O3 (LIGO-Virgo) runs. The absence of detectable signals enables powerful constraints on fundamental physics. We derive gravitational-wave background energy density upper limits from the O1–O4a data to constrain parame", "abstract": "We search for gravitational-wave background signals produced by various early Universe processes in the Advanced LIGO O4a dataset, combined with the data from the earlier O1, O2, and O3 (LIGO-Virgo) runs. The absence of detectable signals enables powerful constraints on fundamental physics. We derive gravitational-wave background energy density upper limits from the O1–O4a data to constrain parameters associated with various possible processes in the early Universe: first-order phase transitions, cosmic strings, domain walls, stiff equation of state, axion inflation, second-order scalar perturbations, primordial black hole binaries, and parity violation. In our analyses, the presence of an astrophysical background produced by compact (black hole and neutron star) binary coalescences throughout the Universe is also considered. We address the implications for various cosmological and high-energy physics models based on the obtained parameter constraints. We conclude that LIGO-Virgo data already yield significant constraints on numerous early Universe scenarios.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-6rsq-mjzw", "doi": "10.1103/6rsq-mjzw", "type": "Journal", "journal": "PRL", "title": "Dark Matter, Baryon Number, and Cosmic-Ray Antinuclei", "authors": "Caleb Gemmell, Dan Hooper, Seth Koren et al.", "corresponding": "", "url": "https://doi.org/10.1103/6rsq-mjzw", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Antideuterons and antihelium nuclei in the cosmic-ray spectrum have long been considered a smoking gun signature of dark matter annihilation, making the tentative observation of several such events by AMS highly intriguing. Conventional dark matter models, however, can produce only up to O ( 1 ) antideuteron events at AMS and are not capable of generating observable fluxes of antihelium. In this L", "summary": "Antideuterons and antihelium nuclei in the cosmic-ray spectrum have long been considered a smoking gun signature of dark matter annihilation, making the tentative observation of several such events by AMS highly intriguing. Conventional dark matter models, however, can produce only up to O ( 1 ) antideuteron events at AMS and are not capable of generating observable fluxes of antihelium. In this L", "abstract": "Antideuterons and antihelium nuclei in the cosmic-ray spectrum have long been considered a smoking gun signature of dark matter annihilation, making the tentative observation of several such events by AMS highly intriguing. Conventional dark matter models, however, can produce only up to O ( 1 ) antideuteron events at AMS and are not capable of generating observable fluxes of antihelium. In this Letter, we propose a class of models in which dark matter annihilates into particles carrying baryon and lepton number, whose subsequent decays produce enhanced fluxes of antinucleons and antinuclei. Such scenarios are motivated by grand unified theories and can lead to an order-of-magnitude or larger enhancement in the resulting antideuteron and antihelium-3 fluxes, providing a means by which to potentially explain the events reported by the AMS Collaboration.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-n3mw-w3zg", "doi": "10.1103/n3mw-w3zg", "type": "Journal", "journal": "PRB", "title": "Designing XY and Dzyaloshinskii-Moriya couplings in Majorana Cooper pair boxes", "authors": "Manato Teranishi, Shintaro Hoshino, Ai Yamakage", "corresponding": "", "url": "https://doi.org/10.1103/n3mw-w3zg", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Designing XY and Dzyaloshinskii-Moriya couplings in Majorana Cooper pair boxes", "summary": "Designing XY and Dzyaloshinskii-Moriya couplings in Majorana Cooper pair boxes", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78168-7", "doi": "10.1038/s41467-026-78168-7", "type": "Journal", "journal": "Nature Communications", "title": "Determining depth-resolved spatial distribution of solid–electrolyte interphase using non-destructive angle-resolved X-ray photoelectron spectroscopy for lithium-metal batteries", "authors": "Giulio D’Acunto, Sanzeeda Baig Shuchi, Yi Cui et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78168-7", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Determining depth-resolved spatial distribution of solid–electrolyte interphase using non-destructive angle-resolved X-ray photoelectron spectroscopy for lithium-metal batteries", "summary": "Determining depth-resolved spatial distribution of solid–electrolyte interphase using non-destructive angle-resolved X-ray photoelectron spectroscopy for lithium-metal batteries", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75462", "doi": "10.1002/adma.75462", "type": "Journal", "journal": "Advanced Materials", "title": "Electronic Coupling and Dual‐Spillover Effect in Co/Co 7 Fe 3 Heterointerface for Boosting Nitrate‐to‐Ammonia Conversion", "authors": "Lin Gao, Zhuofan Wang, Xue Wang et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75462", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "ABSTRACT Rational design of dual‐site catalysts to decouple complex multi‐electron pathways is crucial for efficient electrocatalytic nitrate (NO 3 − ) reduction reaction (NO 3 RR). Here, we construct a Co/Co 7 Fe 3 heterojunction with strong electronic coupling that drives NO 3 RR efficiently via an unconventional [4+4] tandem mechanism. In this [4+4] pathway, the first 4‐electron step reduces NO", "summary": "ABSTRACT Rational design of dual‐site catalysts to decouple complex multi‐electron pathways is crucial for efficient electrocatalytic nitrate (NO 3 − ) reduction reaction (NO 3 RR). Here, we construct a Co/Co 7 Fe 3 heterojunction with strong electronic coupling that drives NO 3 RR efficiently via an unconventional [4+4] tandem mechanism. In this [4+4] pathway, the first 4‐electron step reduces NO", "abstract": "ABSTRACT Rational design of dual‐site catalysts to decouple complex multi‐electron pathways is crucial for efficient electrocatalytic nitrate (NO 3 − ) reduction reaction (NO 3 RR). Here, we construct a Co/Co 7 Fe 3 heterojunction with strong electronic coupling that drives NO 3 RR efficiently via an unconventional [4+4] tandem mechanism. In this [4+4] pathway, the first 4‐electron step reduces NO 3 − to the *HNOH intermediate at the Fe sites. The second 4‐electron process involves the migration of *HNOH to adjacent Co sites, followed by a 4‐electron hydrogenation step. Experimental and theoretical investigations demonstrate that the interfacial electric field modulates the local water network, accelerating water dissociation and ensuring a robust proton supply via hydrogen spillover. Benefiting from well‐defined heterointerfaces, the adsorption energetics of key intermediates are favorably optimized, endowing Co/Co 7 Fe 3 with markedly boosted electrocatalytic activity for NO 3 RR through synergistic dual‐spillover effects, and enabling it to achieve a near‐unity Faradaic efficiency of 99.16% ± 0.3% and a remarkable NH 3 yield rate of 36.07 ± 0.52 mg h −1 cm −2 at −0.48 V versus RHE. Additionally, a rechargeable Zn‐nitrate battery featuring this material as the cathode delivers a peak power density of 18.15 mW cm −2 with excellent cycling stability. This study provides a novel paradigm for designing efficient tandem electrocatalysts.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-bwkk-3l92", "doi": "10.1103/bwkk-3l92", "type": "Journal", "journal": "PRB", "title": "Failure of the Goldstone theorem for vector fields and boundary-mode proliferation in hyperbolic lattices", "authors": "Daniel Sela, Nan Cheng, Kai Sun", "corresponding": "", "url": "https://doi.org/10.1103/bwkk-3l92", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Failure of the Goldstone theorem for vector fields and boundary-mode proliferation in hyperbolic lattices", "summary": "Failure of the Goldstone theorem for vector fields and boundary-mode proliferation in hyperbolic lattices", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-pskw-8xfs", "doi": "10.1103/pskw-8xfs", "type": "Journal", "journal": "PRL", "title": "Floquet engineering of a quasiequilibrium superradiant phase transition in Landau polaritons", "authors": "Wen-Hua Wu, Fuyang Tay, Mengqian Che et al.", "corresponding": "", "url": "https://doi.org/10.1103/pskw-8xfs", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Floquet engineering of a quasiequilibrium superradiant phase transition in Landau polaritons", "summary": "Floquet engineering of a quasiequilibrium superradiant phase transition in Landau polaritons", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-z9t9-mwgv", "doi": "10.1103/z9t9-mwgv", "type": "Journal", "journal": "PRL", "title": "Genuine Quantum Strong Mpemba Effect by Eliminating Coherence", "authors": "Xiang Zhan, Huixia Gao, Lei Xiao et al.", "corresponding": "", "url": "https://doi.org/10.1103/z9t9-mwgv", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Genuine Quantum Strong Mpemba Effect by Eliminating Coherence", "summary": "Genuine Quantum Strong Mpemba Effect by Eliminating Coherence", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-6bwx-7q8k", "doi": "10.1103/6bwx-7q8k", "type": "Journal", "journal": "PRL", "title": "Hyperboloidal initial data with prescribed asymptotic charges", "authors": "Károly Csukás, János Östör, István Rácz", "corresponding": "", "url": "https://doi.org/10.1103/6bwx-7q8k", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Hyperboloidal initial data with prescribed asymptotic charges", "summary": "Hyperboloidal initial data with prescribed asymptotic charges", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-cbnp-56ch", "doi": "10.1103/cbnp-56ch", "type": "Journal", "journal": "Physical Review Materials", "title": "Impact of early-age exposure to power ultrasound on the micromechanical properties of hardened cement paste", "authors": "Martin Chaigne, Sébastien Manneville, Michael Haist et al.", "corresponding": "", "url": "https://doi.org/10.1103/cbnp-56ch", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Impact of early-age exposure to power ultrasound on the micromechanical properties of hardened cement paste", "summary": "Impact of early-age exposure to power ultrasound on the micromechanical properties of hardened cement paste", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-nxhj-g7gh", "doi": "10.1103/nxhj-g7gh", "type": "Journal", "journal": "PRL", "title": "Interpreting Liouvillian eigenmodes: Quantized orbits in dissipative systems", "authors": "Ashlin V Thomas, Felix Fritzsch, Masudul Haque et al.", "corresponding": "", "url": "https://doi.org/10.1103/nxhj-g7gh", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Interpreting Liouvillian eigenmodes: Quantized orbits in dissipative systems", "summary": "Interpreting Liouvillian eigenmodes: Quantized orbits in dissipative systems", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78653-z", "doi": "10.1038/s41467-026-78653-z", "type": "Journal", "journal": "Nature Communications", "title": "Light-powered photosynthetic living actuator", "authors": "Fan Jiang, Friedrich Hans Kleiner, Roland Kieffer et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78653-z", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Light-powered photosynthetic living actuator", "summary": "Light-powered photosynthetic living actuator", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78857-3", "doi": "10.1038/s41467-026-78857-3", "type": "Journal", "journal": "Nature Communications", "title": "Marine primary production enhances removal of hydrophobic organic contaminants from Eurasian Arctic shelf waters", "authors": "Xiaodi Shi, Laurent Oziel, Jonathan P. Benskin et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78857-3", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Abstract Global oceans store large quantities of human-made persistent hydrophobic organic contaminants (HOCs), driven by the organic carbon (OC) cycle. Despite diverse organic matter composition, bulk OC is typically treated as a uniform sorbent when assessing HOC fate. Significant uncertainty remains regarding the factors controlling variability in the sorption of HOCs by organic matter. Using s", "summary": "Abstract Global oceans store large quantities of human-made persistent hydrophobic organic contaminants (HOCs), driven by the organic carbon (OC) cycle. Despite diverse organic matter composition, bulk OC is typically treated as a uniform sorbent when assessing HOC fate. Significant uncertainty remains regarding the factors controlling variability in the sorption of HOCs by organic matter. Using s", "abstract": "Abstract Global oceans store large quantities of human-made persistent hydrophobic organic contaminants (HOCs), driven by the organic carbon (OC) cycle. Despite diverse organic matter composition, bulk OC is typically treated as a uniform sorbent when assessing HOC fate. Significant uncertainty remains regarding the factors controlling variability in the sorption of HOCs by organic matter. Using surface sediments across the Eurasian Arctic shelves, spanning a land-to-ocean continuum of OC, we show that polychlorinated biphenyl concentrations per unit marine‑derived OC are up to an order of magnitude higher than those per unit terrestrial OC. Coupling these empirical relationships with a state‑of‑the‑art ocean biogeochemistry model shows that climate‑driven increases in marine primary production in the Eurasian Arctic shelves lead to 1.3 times more HOC removal from the water column. These findings reveal that both OC quantity and quality control the sediment HOC sink and that climate‑induced shifts in OC cycles may restructure HOC fate in the Arctic Ocean.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-n7s9-8btb", "doi": "10.1103/n7s9-8btb", "type": "Journal", "journal": "PRL", "title": "Measurement of inclusive charged-current ν ‾ μ scattering on C, CH, Fe, and Pb at ⟨ E ν ‾ ⟩ ∼ 6 GeV with MINERvA", "authors": "A. Klustová, S. Akhter, Z. Ahmad Dar et al.", "corresponding": "", "url": "https://doi.org/10.1103/n7s9-8btb", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Measurement of inclusive charged-current ν ‾ μ scattering on C, CH, Fe, and Pb at ⟨ E ν ‾ ⟩ ∼ 6 GeV with MINERvA", "summary": "Measurement of inclusive charged-current ν ‾ μ scattering on C, CH, Fe, and Pb at ⟨ E ν ‾ ⟩ ∼ 6 GeV with MINERvA", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-5lvd-k4qb", "doi": "10.1103/5lvd-k4qb", "type": "Journal", "journal": "PRL", "title": "Microquasars as the major contributors to Galactic cosmic rays around the knee", "authors": "Samy Kaci, Gwenael Giacinti, Felix Aharonian et al.", "corresponding": "", "url": "https://doi.org/10.1103/5lvd-k4qb", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Microquasars as the major contributors to Galactic cosmic rays around the knee", "summary": "Microquasars as the major contributors to Galactic cosmic rays around the knee", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-bb7h-h564", "doi": "10.1103/bb7h-h564", "type": "Journal", "journal": "Physical Review Materials", "title": "Modeling polaron excitations and stabilization mechanisms in conjugated polymers", "authors": "Vishal Jindal, Scott T. Milner", "corresponding": "", "url": "https://doi.org/10.1103/bb7h-h564", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Modeling polaron excitations and stabilization mechanisms in conjugated polymers", "summary": "Modeling polaron excitations and stabilization mechanisms in conjugated polymers", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78656-w", "doi": "10.1038/s41467-026-78656-w", "type": "Journal", "journal": "Nature Communications", "title": "Multi-omics profiling of primary human B cells activated via distinct stimuli", "authors": "Vitor R. C. Aguiar, Marcella E. Franco, Nada Abdel Aziz et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78656-w", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Abstract B cells are central for immunity and immune-mediated diseases (IMD), but how distinct signaling pathways drive diverse activation responses over time is not comprehensively understood. Here, we obtain peripheral blood B cells from 27 female healthy donors for in vitro stimulation, profiling the response at multiple time points using RNA-seq, single-cell RNA-seq with surface protein marker", "summary": "Abstract B cells are central for immunity and immune-mediated diseases (IMD), but how distinct signaling pathways drive diverse activation responses over time is not comprehensively understood. Here, we obtain peripheral blood B cells from 27 female healthy donors for in vitro stimulation, profiling the response at multiple time points using RNA-seq, single-cell RNA-seq with surface protein marker", "abstract": "Abstract B cells are central for immunity and immune-mediated diseases (IMD), but how distinct signaling pathways drive diverse activation responses over time is not comprehensively understood. Here, we obtain peripheral blood B cells from 27 female healthy donors for in vitro stimulation, profiling the response at multiple time points using RNA-seq, single-cell RNA-seq with surface protein markers (CITE-seq), and ATAC-seq. Using diverse stimuli including activation of the B cell receptor (BCR), Toll-like receptor 7 (TLR7), TLR9, CD40, and differentiation into double negative 2 (DN2) IgD – CD27 – CD11c + CD21 – B cells, our analyses uncover activation-dependent B cell states, stimulation-specific transcription factors and regulatory regions, the dynamic response of IMD-associated gene expression, and specific open chromatin regions associated with IMD genetic risk. Furthermore, we also identify a lupus risk variant in an enhancer regulating TNFSF4 expression. The analysis data can be accessed via an interactive browser: https://mgalab.shinyapps.io/bcellactivation . Our findings underscore how profiling the full breadth of B cell activation pathways may be important for understanding B cell biology in health and disease.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75328", "doi": "10.1002/adma.75328", "type": "Journal", "journal": "Advanced Materials", "title": "Multifunctional Entropy‐Driven Supramolecular Glasses From Thermopolymerization of Metal‐Urea Deep Eutectic Solvents (Adv. Mater. 59/2026)", "authors": "Fei Nie, Jiayi Guo, Dongpeng Yan", "corresponding": "", "url": "https://doi.org/10.1002/adma.75328", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Multifunctional Entropy‐Driven Supramolecular Glasses From Thermopolymerization of Metal‐Urea Deep Eutectic Solvents (Adv. Mater. 59/2026)", "summary": "Multifunctional Entropy‐Driven Supramolecular Glasses From Thermopolymerization of Metal‐Urea Deep Eutectic Solvents (Adv. Mater. 59/2026)", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1073-pnas-2606806123", "doi": "10.1073/pnas.2606806123", "type": "Journal", "journal": "PNAS", "title": "Neuropharmacology of language: ERP evidence for catecholaminergic modulation of syntactic processing", "authors": "Yingying Tan, Ashley G. Lewis, Iris C. Schmits et al.", "corresponding": "", "url": "https://doi.org/10.1073/pnas.2606806123", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "A few studies have shown that brain catecholamines are implicated in language comprehension. However, the specific cognitive processes they modulate remain underexplored. We hypothesized that catecholamines enhance the unification of syntactic roles and word meanings into coherent multiword structures. This study combined electroencephalography and psychopharmacology to examine the effects of a ca", "summary": "A few studies have shown that brain catecholamines are implicated in language comprehension. However, the specific cognitive processes they modulate remain underexplored. We hypothesized that catecholamines enhance the unification of syntactic roles and word meanings into coherent multiword structures. This study combined electroencephalography and psychopharmacology to examine the effects of a ca", "abstract": "A few studies have shown that brain catecholamines are implicated in language comprehension. However, the specific cognitive processes they modulate remain underexplored. We hypothesized that catecholamines enhance the unification of syntactic roles and word meanings into coherent multiword structures. This study combined electroencephalography and psychopharmacology to examine the effects of a catecholaminergic stimulant (methylphenidate) on processing sentences containing local syntactic ambiguities. Methylphenidate amplified the P600 event-related potential effect, which has been linked to the recruitment of cognitive resources for processing sentences with increased syntactic load. The drug’s impact on semantic processing was subtler, showing a suggestive attenuation of the N400 effect to ambiguous sentences. Furthermore, the increase in the P600 effect under methylphenidate was most pronounced in participants with lower working memory capacity. This study provides evidence for linking catecholamine activity to syntactic unification in healthy individuals. Elevated catecholamine levels appear to increase the cognitive effort invested in syntactic unification, and to support the dynamic prioritization of syntactic information when contextual demands require it.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-5cyh-2mqf", "doi": "10 d incommensurate Kekulé spiral order in twisted bilayer graphene: A quantum many-body study", "authors": "Cheng Huang, Yves H. Kwan, Maksim Ulybyshev et al.", "corresponding": "", "url": "https://doi.org/10.1103/f3zp-8s7c", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Strain-tuned incommensurate Kekulé spiral order in twisted bilayer graphene: A quantum many-body study", "summary": "Strain-tuned incommensurate Kekulé spiral order in twisted bilayer graphene: A quantum many-body study", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1073-pnas-2612273123", "doi": "10.1073/pnas.2612273123", "type": "Journal", "journal": "PNAS", "title": "Superlubricity by glycerosome boundary layers", "authors": "Yihui Dong, Wei Cao, Roman Kamyshinsky et al.", "corresponding": "", "url": "https://doi.org/10.1073/pnas.2612273123", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "The search for high-performance lubricants is of broad relevance to biomedical applications, including artificial joints, regenerative scaffolds, and osteoarthritis therapies. Here we introduce glycerosomes—phosphatidylcholine (PC)-based vesicles containing glycerol—as a promising boundary lubricant. Using a surface force balance, we show that glycerosomes achieve a friction coefficient as low as ", "summary": "The search for high-performance lubricants is of broad relevance to biomedical applications, including artificial joints, regenerative scaffolds, and osteoarthritis therapies. Here we introduce glycerosomes—phosphatidylcholine (PC)-based vesicles containing glycerol—as a promising boundary lubricant. Using a surface force balance, we show that glycerosomes achieve a friction coefficient as low as ", "abstract": "The search for high-performance lubricants is of broad relevance to biomedical applications, including artificial joints, regenerative scaffolds, and osteoarthritis therapies. Here we introduce glycerosomes—phosphatidylcholine (PC)-based vesicles containing glycerol—as a promising boundary lubricant. Using a surface force balance, we show that glycerosomes achieve a friction coefficient as low as 10 − 5 under a high compression pressure of 15.6 MPa, representing a 20-fold reduction compared to conventional PC liposomes. This level of lubrication surpasses any previously reported boundary lubricant system at such pressures in aqueous media. Mechanistically, glycerosomes exhibit substantially lower adhesion energy than PC liposomes, and theoretical simulations reveal enhanced vesicle stability and flexibility. Our findings establish glycerosomes as a superior hydration lubrication platform, with promising implications for both biomedical implants and industrial applications requiring robust lubricity.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75394", "doi": "10.1002/adma.75394", "type": "Journal", "journal": "Advanced Materials", "title": "Targeting Endoplasmic Reticulum Stress‐ROS‐Inflammation Cycle With Antibacterial Heterojunctions for Periodontitis Therapy", "authors": "Wanxi Chen, Wenxuan He, Wenyu Dai et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75394", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "ABSTRACT In periodontitis, recalcitrant biofilms and the vicious endoplasmic reticulum (ER) stress‐ROS‐inflammation cycle cause persistent inflammatory osteolysis. However, current treatments mainly alleviate infection and inflammation, without targeting this ER stress‐centered etiological circuit. Herein, we report the de novo design of an ER‐regulating heterojunction (ERR‐HJ), composed of cobalt", "summary": "ABSTRACT In periodontitis, recalcitrant biofilms and the vicious endoplasmic reticulum (ER) stress‐ROS‐inflammation cycle cause persistent inflammatory osteolysis. However, current treatments mainly alleviate infection and inflammation, without targeting this ER stress‐centered etiological circuit. Herein, we report the de novo design of an ER‐regulating heterojunction (ERR‐HJ), composed of cobalt", "abstract": "ABSTRACT In periodontitis, recalcitrant biofilms and the vicious endoplasmic reticulum (ER) stress‐ROS‐inflammation cycle cause persistent inflammatory osteolysis. However, current treatments mainly alleviate infection and inflammation, without targeting this ER stress‐centered etiological circuit. Herein, we report the de novo design of an ER‐regulating heterojunction (ERR‐HJ), composed of cobalt selenide (CoSe), Ti 3 C 2 MXene, and taurine, for periodontitis treatment via bacterial clearance, ER homeostasis maintenance, and alveolar bone regeneration. Our studies demonstrate that the unique structure of the CoSe/Ti 3 C 2 heterojunction can scavenge ROS and easily transfer electrons from H 2 O 2 to bacterial membranes, which disrupts bacterial respiration and metabolism. At the cellular level, the heterojunction with taurine activates selenoprotein metabolism, restores redox balance, and alleviates ER stress by dampening the PERK‐CHOP pathway, collectively reprogramming macrophages towards a tissue‐regenerative M2 phenotype while inhibiting their osteoclastogenic differentiation. Strikingly, the osteogenic differentiation of human periodontal ligament cells is profoundly boosted. In periodontitis models, the ERR‐HJ promotes tissue repair and reduces alveolar bone resorption through concomitant suppression of oxidative stress, ER stress, and inflammation, suggesting the disruption of the self‐perpetuating cycle. This work furnishes an intriguing avenue for developing innovative heterojunction biomaterials to treat bacterial infection‐associated disorders by integrating bacterial killing and ER stress‐ROS‐inflammation cycle inhibition.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-crzt-ss4w", "doi": "10.1103/crzt-ss4w", "type": "Journal", "journal": "PRL", "title": "Third-order mixed electroweak-QCD corrections to the W -boson mass prediction from the muon lifetime", "authors": "Ievgen Dubovyk, Ayres Freitas, Janusz Gluza et al.", "corresponding": "", "url": "https://doi.org/10.1103/crzt-ss4w", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Third-order mixed electroweak-QCD corrections to the W -boson mass prediction from the muon lifetime", "summary": "Third-order mixed electroweak-QCD corrections to the W -boson mass prediction from the muon lifetime", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-w479-fcb1", "doi": "10.1103/w479-fcb1", "type": "Journal", "journal": "PRB", "title": "Tuning the interlayer electronic coupling of twisted bilayer graphene by pressure", "authors": "Yanlin Mou, Qiaoxia Xing, Xingding Li et al.", "corresponding": "", "url": "https://doi.org/10.1103/w479-fcb1", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Tuning the interlayer electronic coupling of twisted bilayer graphene by pressure", "summary": "Tuning the interlayer electronic coupling of twisted bilayer graphene by pressure", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-m4dt-9rkf", "doi": "10.1103/m4dt-9rkf", "type": "Journal", "journal": "PRL", "title": "Twinned Dynamical Decoupling", "authors": "Nayden P. Nedev, Nikolay V. Vitanov", "corresponding": "", "url": "https://doi.org/10.1103/m4dt-9rkf", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Twinned Dynamical Decoupling", "summary": "Twinned Dynamical Decoupling", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-2ymd-9zt7", "doi": "10.1103/2ymd-9zt7", "type": "Journal", "journal": "PRB", "title": "Two-dimensional weak localization in trilayer Ruddlesden-Popper nickelates", "authors": "Hyo-Bin Ahn, Xinglong Chen, Yu Zhang et al.", "corresponding": "", "url": "https://doi.org/10.1103/2ymd-9zt7", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Two-dimensional weak localization in trilayer Ruddlesden-Popper nickelates", "summary": "Two-dimensional weak localization in trilayer Ruddlesden-Popper nickelates", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78373-4", "doi": "10.1038/s41467-026-78373-4", "type": "Journal", "journal": "Nature Communications", "title": "Ultrafast single-qubit gates through multi-photon transition removal", "authors": "Y. Gao, A. Galicia, J. D. Da Costa Jesus et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78373-4", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Abstract Fast qubit control is essential for scalable quantum computing. However, the strong driving that is required can induce significant leakage from the computational subspace, particularly in weakly anharmonic qubits. We demonstrate single qubit gates with a total leakage error consistently below 2.0 × 10 −5 on a transmon qubit, and obtain fidelities above 99.98% at 6.8 ns pulse duration in ", "summary": "Abstract Fast qubit control is essential for scalable quantum computing. However, the strong driving that is required can induce significant leakage from the computational subspace, particularly in weakly anharmonic qubits. We demonstrate single qubit gates with a total leakage error consistently below 2.0 × 10 −5 on a transmon qubit, and obtain fidelities above 99.98% at 6.8 ns pulse duration in ", "abstract": "Abstract Fast qubit control is essential for scalable quantum computing. However, the strong driving that is required can induce significant leakage from the computational subspace, particularly in weakly anharmonic qubits. We demonstrate single qubit gates with a total leakage error consistently below 2.0 × 10 −5 on a transmon qubit, and obtain fidelities above 99.98% at 6.8 ns pulse duration in both X and X /2 gates. This is achieved by removing direct transitions beyond nearest-neighbor levels using double recursive applications of Derivative Removal by Adiabatic Gate pulse shape. We also introduce the amplified leakage error sequence which can directly measure the leakage error down to 10 −6 . We test single qubit gates across a range of pulse durations using multiple benchmarking methods to reveal the error channels. The presented approach can be straightforwardly adapted by other platforms.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1073-pnas-2618744123", "doi": "10.1073/pnas.2618744123", "type": "Journal", "journal": "PNAS", "title": "Virus transmission required for maintenance and host adaptation mirrors neurophysiological differences in rabies-derived peptides", "authors": "Alice Remal, Emily S. Acheson, Patrick A. Leighton et al.", "corresponding": "", "url": "https://doi.org/10.1073/pnas.2618744123", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Pathogen adaptations to new hosts are central to the disease ecology of cross-species transmission and host switching of viruses. The rabies virus is a model for adaptations to different hosts as it induces behavioral changes that facilitate transmission, while being maintained in distinct species-specific cycles of infection. Here, we demonstrate that the rabies virus requires distinct transmissi", "summary": "Pathogen adaptations to new hosts are central to the disease ecology of cross-species transmission and host switching of viruses. The rabies virus is a model for adaptations to different hosts as it induces behavioral changes that facilitate transmission, while being maintained in distinct species-specific cycles of infection. Here, we demonstrate that the rabies virus requires distinct transmissi", "abstract": "Pathogen adaptations to new hosts are central to the disease ecology of cross-species transmission and host switching of viruses. The rabies virus is a model for adaptations to different hosts as it induces behavioral changes that facilitate transmission, while being maintained in distinct species-specific cycles of infection. Here, we demonstrate that the rabies virus requires distinct transmission dynamics in two hosts with different ecologies to establish maintenance, using agent-based modeling, analyses of virus glycoprotein-mediated manipulation of neuroreceptor function, and phylogenetic analysis. Epidemiological models suggest that rabies virus variants adapted to arctic foxes, which sustain rabies virus at very low host densities, require a higher probability of transmission than viruses adapted to raccoons. Using in vitro electrophysiology, we demonstrate that the rabies glycoprotein-derived peptides from arctic fox rabies variants are more potent antagonists of alpha7 nicotinic acetylcholine receptors. These findings suggest a possible functional basis for the behavioral modifications that drive enzootic rabies transmission in the context of host ecology. In addition, a large proportion of residues that may drive rabies virus adaptation to raccoons and arctic foxes are found within this neurotoxin-like region. Furthermore, a residue in the neurotoxin-like region of the mature rabies virus glycoprotein (residue 183) has been associated with pathogenicity, host switching, and disease ecology in previous studies. We propose the hypothesis that rabies virus transmission dynamics adapt to the ecology and physiology of novel hosts through the selection of glycoproteins that elicit specific degrees of behavioral modification and transmission probability.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-k3ng-gm5v", "doi": "10.1103/k3ng-gm5v", "type": "Journal", "journal": "PRL", "title": "Watching polarons form in real time", "authors": "Victor Garcia-Herrero, Christoph Emeis, Zhenbang Dai et al.", "corresponding": "", "url": "https://doi.org/10.1103/k3ng-gm5v", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Watching polarons form in real time", "summary": "Watching polarons form in real time", "abstract": "", "method": "", "result": "", "future": ""}, { ap superconductivity with extended s -wave and s -wave gaps in Zn-incorporated FeSe", "authors": "Han-Shu Xu, Changhao Ding, Guanyin Gao et al.", "corresponding": "", "url": "https://doi.org/10.1103/rw7j-zxw6", "topic": "Superconductivity", "level": "Brief", "summary_en": "Nonmonotonic evolution of the superconducting transition temperature and robust multigap superconductivity with extended s -wave and s -wave gaps in Zn-incorporated FeSe", "summary": "Nonmonotonic evolution of the superconducting transition temperature and robust multigap superconductivity with extended s -wave and s -wave gaps in Zn-incorporated FeSe", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-8vgt-twh5", "doi": "10.1103/8vgt-twh5", "type": "Journal", "journal": "PRX", "title": "Nontrivial Boundary-Mediated Superconducting Transport in a TRSB Topological Iron-Based Superconductor", "authors": "Wenyao Liu, Gabriel Natale, Camron Farhang et al.", "corresponding": "", "url": "https://doi.org/10.1103/8vgt-twh5", "topic": "Superconductivity", "level": "Brief", "summary_en": "The interplay of superconductivity, band topology, and spontaneous time-reversal-symmetry breaking (TRSB) is expected to enable topological superconducting boundary states. Intriguingly, the iron-chalcogenide superconductor FeTe 0.55 Se 0.45 exhibits spontaneous magnetization in the superconducting state, motivating its use as a single-material platform in which three ingredients coexist. Here, we", "summary": "The interplay of superconductivity, band topology, and spontaneous time-reversal-symmetry breaking (TRSB) is expected to enable topological superconducting boundary states. Intriguingly, the iron-chalcogenide superconductor FeTe 0.55 Se 0.45 exhibits spontaneous magnetization in the superconducting state, motivating its use as a single-material platform in which three ingredients coexist. Here, we", "abstract": "The interplay of superconductivity, band topology, and spontaneous time-reversal-symmetry breaking (TRSB) is expected to enable topological superconducting boundary states. Intriguingly, the iron-chalcogenide superconductor FeTe 0.55 Se 0.45 exhibits spontaneous magnetization in the superconducting state, motivating its use as a single-material platform in which three ingredients coexist. Here, we report evidence for a nontrivial, boundary-mediated superconducting transport response in exfoliated Fe(Te,Se) devices, exhibiting long-range nonlocality and strongly suppressed thermal broadening. Polar Kerr measurements establish that TRSB emerges below T Kerr &lt; T c and coexists with superconductivity across multiple Fe(Te,Se) compositions studied here, providing an independent symmetry-breaking scale that can be directly compared with transport. To reliably access boundary transport, we engineer crystallographically sharp, continuous edges and implement side-surface-dominant contacts, as validated by contact-size analysis and cross-sectional imaging. Under these conditions, topological FeTe 0.55 Se 0.45 exhibits an anomalous conductance plateau that is absent in topologically trivial FeTe 0.40 Se 0.60 and Fe 1.02 Te 0.55 Se 0.45 under comparable measurements. This plateau requires both the source and drain to be attached to uninterrupted sharp edges, persists over micrometer-scale separations far exceeding the bulk coherence length, has markedly reduced thermal decoherence, and collapses when the drain is moved to the top surface. Its temperature evolution is governed by TRSB: The plateau shows minimal thermal broadening below T Kerr * and disappears near T Kerr rather than T c . Collectively, the doping selectivity, TRSB correlation, edge-geometry requirement, and long-range nonlocal nature establish experimentally grounded criteria for identifying boundary-mediated superconducting transport in FeTe 0.55 Se 0.45 and motivate further phase-sensitive and theoretical work to determine its microscopic origin.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-k96f-s31s", "doi": "10.1103/k96f-s31s", "type": "Journal", "journal": "PRB", "title": "Superconducting diode effect in magnetic superconductors realized by nonreciprocal domain-wall dynamics", "authors": "Dong Hui Han, Suk Bum Chung, Se Kwon Kim", "corresponding": "", "url": "https://doi.org/10.1103/k96f-s31s", "topic": "Superconductivity", "level": "Brief", "summary_en": "Superconducting diode effect in magnetic superconductors realized by nonreciprocal domain-wall dynamics", "summary": "Superconducting diode effect in magnetic superconductors realized by nonreciprocal domain-wall dynamics", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-nv71-s5dd", "doi": "10.1103/nv71-s5dd", "type": "Journal", "journal": "PRL", "title": "Surface-induced vortex core restructuring in a spin-triplet superfluid", "authors": "Riku Rantanen, Mikael Huppunen, Erkki Thuneberg et al.", "corresponding": "", "url": "https://doi.org/10.1103/nv71-s5dd", "topic": "Superconductivity", "level": "Brief", "summary_en": "Surface-induced vortex core restructuring in a spin-triplet superfluid", "summary": "Surface-induced vortex core restructuring in a spin-triplet superfluid", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41567-026-03484-0", "doi": "10.1038/s41567-026-03484-0", "type": "Journal", "journal": "Nature Physics", "title": "Teleportation transition of surface codes on a superconducting quantum processor", "authors": "Yiren Zou, Hong-Kuan Xia, Aosai Zhang et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41567-026-03484-0", "topic": "Superconductivity", "level": "Brief", "summary_en": "Teleportation transition of surface codes on a superconducting quantum processor", "summary": "Teleportation transition of surface codes on a superconducting quantum processor", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-6cyn-zbpm", "doi": "10.1103/6cyn-zbpm", "type": "Journal", "journal": "PRL", "title": "Topological multicomponent superconductivity with sizable s -wave admixture in twisted bilayer cuprates", "authors": "Yu-Hang Li, Congjun Wu, Wang Yang", "corresponding": "", "url": "https://doi.org/10.1103/6cyn-zbpm", "topic": "Superconductivity", "level": "Brief", "summary_en": "Topological multicomponent superconductivity with sizable s -wave admixture in twisted bilayer cuprates", "summary": "Topological multicomponent superconductivity with sizable s -wave admixture in twisted bilayer cuprates", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75432", "doi": "10.1002/adma.75432", "type": "Journal", "journal": "Advanced Materials", "title": "A Novel pH‐Activatable Nanozyme for Treating Breast Cancer Bone Metastasis by Regulating Cancer Cell Metabolic Reprogramming and the Tumor Microenvironment", "authors": "Qianqian Qiao, Haosheng Wang, Ying Chen et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75432", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "ABSTRACT Multi‐omics analyses implicate enhanced oxidative phosphorylation (OXPHOS) in breast cancer bone metastasis (BCBM). To target this metabolic vulnerability, we develop SPMMPA, a bone‐targeted nanozyme comprising a Prussian blue core, a disulfide‐bridged mesoporous silica interlayer, and a manganese oxide shell, functionalized with polyethylenimine, alendronate, and the Ser‐Asp‐Ser‐Ser‐Asp ", "summary": "ABSTRACT Multi‐omics analyses implicate enhanced oxidative phosphorylation (OXPHOS) in breast cancer bone metastasis (BCBM). To target this metabolic vulnerability, we develop SPMMPA, a bone‐targeted nanozyme comprising a Prussian blue core, a disulfide‐bridged mesoporous silica interlayer, and a manganese oxide shell, functionalized with polyethylenimine, alendronate, and the Ser‐Asp‐Ser‐Ser‐Asp ", "abstract": "ABSTRACT Multi‐omics analyses implicate enhanced oxidative phosphorylation (OXPHOS) in breast cancer bone metastasis (BCBM). To target this metabolic vulnerability, we develop SPMMPA, a bone‐targeted nanozyme comprising a Prussian blue core, a disulfide‐bridged mesoporous silica interlayer, and a manganese oxide shell, functionalized with polyethylenimine, alendronate, and the Ser‐Asp‐Ser‐Ser‐Asp peptide. Its acid‐enhanced catalytic activity promotes reactive oxygen species production and glutathione depletion, accompanied by mitochondrial dysfunction, reduced OXPHOS and adenosine triphosphate production, and downregulation of peroxisome proliferator‐activated receptor gamma coactivator 1‐alpha. Alendronate and silicon release contribute to reduced osteoclast activity and preservation of bone structure. Near‐infrared irradiation further enhances treatment efficacy through photothermal heating below 48°C. In mouse models of BCBM, SPMMPA suppresses tumor growth and alleviates osteolysis, without overt toxicity in the assays performed. These findings support a pH‐responsive catalytic strategy that couples disruption of tumor energy metabolism with protection of bone homeostasis.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-rjyv-gmsw", "doi": "10.1103/rjyv-gmsw", "type": "Journal", "journal": "Physical Review Materials", "title": "Defect-assisted nonradiative recombination and vibrational excitation in the initial photothermal stage of laser ignition", "authors": "Yirui Lu, Zeyu Jiang, Bing Huang", "corresponding": "", "url": "https://doi.org/10.1103/rjyv-gmsw", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Defect-assisted nonradiative recombination and vibrational excitation in the initial photothermal stage of laser ignition", "summary": "Defect-assisted nonradiative recombination and vibrational excitation in the initial photothermal stage of laser ignition", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75472", "doi": "10.1002/adma.75472", "type": "Journal", "journal": "Advanced Materials", "title": "Engineered Excited‐State Coupling Enables Efficient Exciton Harvesting in Binuclear Copper Iodide Cluster Scintillators", "authors": "Xudong Hu, Simil Thomas, Wentao Wu et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75472", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "ABSTRACT Environmentally benign scintillators with broadband radioluminescence are highly desirable for low‐cost, high‐performance x‐ray imaging. Recently, copper iodide (Cu–I) clusters have emerged as promising candidates, owing to strong spin‐orbit coupling, favorable solution processability, excellent x‐ray absorption efficiency, and efficient exciton harvesting enabled by aggregation‐induced e", "summary": "ABSTRACT Environmentally benign scintillators with broadband radioluminescence are highly desirable for low‐cost, high‐performance x‐ray imaging. Recently, copper iodide (Cu–I) clusters have emerged as promising candidates, owing to strong spin‐orbit coupling, favorable solution processability, excellent x‐ray absorption efficiency, and efficient exciton harvesting enabled by aggregation‐induced e", "abstract": "ABSTRACT Environmentally benign scintillators with broadband radioluminescence are highly desirable for low‐cost, high‐performance x‐ray imaging. Recently, copper iodide (Cu–I) clusters have emerged as promising candidates, owing to strong spin‐orbit coupling, favorable solution processability, excellent x‐ray absorption efficiency, and efficient exciton harvesting enabled by aggregation‐induced emission and thermally activated delayed fluorescence. However, the mechanism by which aggregation‐state variation enhances the light yield by modulating intermolecular interactions remains poorly understood. Here, we establish a pair of isomeric Cu–I clusters with nearly identical x‐ray attenuation coefficients as a model platform to isolate and elucidate the role of intermolecular coupling. In this context, we uncover a breakthrough mechanistic picture in which engineered excited‐state coupling accelerates carrier relaxation and promotes efficient exciton harvesting and radiative recombination. Guided by this mechanism, water‐resistant cluster scintillator glasses with excellent processing flexibility are fabricated, delivering a high light yield of 32,456 photons MeV −1 and spatial resolution of 33.6 lp mm −1 . Furthermore, tandem integration with a high‐Z scintillator enables selective density‐discriminating x‐ray imaging and micro‐computed tomography. This work provides mechanistic guidance for ligand engineering in the design of efficient cluster scintillators and facilitates the high‐throughput development of promising metal‐cluster complexes for advanced optoelectronic applications.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75480", "doi": "10.1002/adma.75480", "type": "Journal", "journal": "Advanced Materials", "title": "Engineering Bidirectional Neuromodulation: A Review of Neural Excitation and Inhibition Technologies", "authors": "Xue Cai, Yuxin Liu, Xing Sheng", "corresponding": "", "url": "https://doi.org/10.1002/adma.75480", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "ABSTRACT Neuromodulation provides a means to perturb neural activity for investigating nervous system function and treating neurological disorders. Advances in stimulation strategies, molecular tools, functional materials and neural interfaces have progressively expanded the precision and versatility of such interventions. Yet neural activity can require regulation in opposing directions across di", "summary": "ABSTRACT Neuromodulation provides a means to perturb neural activity for investigating nervous system function and treating neurological disorders. Advances in stimulation strategies, molecular tools, functional materials and neural interfaces have progressively expanded the precision and versatility of such interventions. Yet neural activity can require regulation in opposing directions across di", "abstract": "ABSTRACT Neuromodulation provides a means to perturb neural activity for investigating nervous system function and treating neurological disorders. Advances in stimulation strategies, molecular tools, functional materials and neural interfaces have progressively expanded the precision and versatility of such interventions. Yet neural activity can require regulation in opposing directions across different cellular, circuit and pathological states, motivating bidirectional neuromodulation that can both enhance and suppress neural activity. In this review, we examine the mechanisms and technologies that enable such bidirectional control across electrical, optical, thermal, mechanical, magnetic and chemical modalities. We compare these approaches in terms of spatiotemporal performance, penetration depth, specificity and safety, and examine the materials, transduction strategies and device architectures used to implement bidirectional neural control. We further discuss the applications of bidirectional neuromodulation in neuroscience research and the treatment of neurological disorders. Finally, we discuss the technical challenges and future directions toward more precise, independent and integrated bidirectional control, including its extension to closed‐loop adaptive regulation.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-vn88-hyn8", "doi": "10.1103/vn88-hyn8", "type": "Journal", "journal": "PRB", "title": "Erratum: Thermoelectric semiconductor database: DFT-based discovery and experimental validation [Phys. Rev. B 113, 205203 (2026)]", "authors": "Yujie Xia, Mingran Kong, Pu Miao et al.", "corresponding": "", "url": "https://doi.org/10.1103/vn88-hyn8", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Erratum: Thermoelectric semiconductor database: DFT-based discovery and experimental validation [Phys. Rev. B 113, 205203 (2026)]", "summary": "Erratum: Ther
