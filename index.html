he results of our experiments, when compared to exchange constants established in the literature, allow us to extract the out-of-plane component of the single-ion magnetic anisotropy reaching $(40\\pm10)$~$μ$eV.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "通过频域和时域太赫兹光谱技术，实测α-MnTe块体中3.5 meV的反铁磁共振模式，并分析出单离子磁各向异性垂直分量为(40 ± 10) μeV。", "method_en": "The experimental approach combines frequency-domain and time-domain THz spectroscopy, supported by a simplified easy-plane antiferromagnet resonance model.", "method_zh": "实验采用频域与时域太赫兹光谱技术，结合简化的易平面反铁磁共振模型进行分析。", "result_en": "The measured resonance energy and its temperature and magnetic field dependence match the model predictions, enabling extraction of magnetic anisotropy parameters consistent with literature exchange constants.", "result_zh": "实测共振能量及其温度、磁场依赖符合模型，结合交换常数推断磁各向异性参数。", "future_en": "These results pave the way for deeper understanding and control of spin dynamics in MnTe and related antiferromagnetic materials.", "future_zh": "研究为深入理解及调控MnTe及类似反铁磁材料的自旋动力学提供实验依据。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2603-24187", "arxiv_id": "2603.24187", "type": "arXiv", "journal": "arXiv:2603.24187", "journal_ref": "", "title": "Dipole-exchange spin waves and mode hybridization in magnetic nanoparticles", "authors": "Fedor Shuklin, Khristina Albitskaya, Sergei Solovyov, Alexander Chernov, Mihail Petrov", "corresponding": "", "url": "https://arxiv.org/abs/2603.24187", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper investigates spin-wave modes and hybridization in confined ferromagnetic resonators with spherical and cylindrical geometry, analyzing the effects of exchange and dipolar interactions.", "summary": "We investigate spin-wave modes in confined ferromagnetic resonators with spherical and cylindrical geometries across the exchange-dominated, dipole-exchange, and dipolar interaction regimes. Starting from the linearized Landau-Lifshitz-Gilbert equation, we show that the projection of the total angular momentum and mirror parity are conserved quantities in the problem of axially symmetric resonator", "abstract": "We investigate spin-wave modes in confined ferromagnetic resonators with spherical and cylindrical geometries across the exchange-dominated, dipole-exchange, and dipolar interaction regimes. Starting from the linearized Landau-Lifshitz-Gilbert equation, we show that the projection of the total angular momentum and mirror parity are conserved quantities in the problem of axially symmetric resonators. These symmetries provide a natural classification of spin-wave modes and explain the degeneracy of exchange modes, as well as its lifting by dipolar interactions. Numerical analysis shows that the nonlocal dipolar interaction removes the exchange degeneracy and hybridizes modes, leading to avoided crossings between modes that belong to the same symmetry sector. To describe this behavior, we develop a coupled-mode theory formulated directly in terms of dynamical magnetization, which reduces the dipole-exchange problem to a finite system of interacting modes. The resulting framework provides a unified description of spin-wave spectra in confined magnetic particles from the exchange limit to the dipolar regime.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本文研究了球形和圆柱形受限铁磁谐振器中的自旋波模态及其混合，分析交换与偶极相互作用的影响。", "method_en": "Using the linearized Landau-Lifshitz-Gilbert equation, conserved symmetries like angular momentum projection and mirror parity classify modes; a coupled-mode theory in dynamical magnetization captures mode hybridization.", "method_zh": "应用线性化Landau-Lifshitz-Gilbert方程，利用角动量投影和镜像对称性分类模态；构建耦合模态理论描述模式混合。", "result_en": "They find dipolar interactions lift exchange mode degeneracy and produce avoided crossings by hybridizing modes within symmetry sectors, unifying spin-wave spectra descriptions from exchange to dipolar regimes.", "result_zh": "研究发现偶极相互作用解除了交换态简并，导致同对称区间内模式混合与反交叉，实现了从交换到偶极极限的自旋波谱统一描述。", "future_en": "This framework could be extended to other geometries and materials to further understand spin-wave phenomena in nanoscale magnetic resonators.", "future_zh": "该框架可扩展至其他几何结构和材料，深化对纳米磁共振器自旋波现象的理解。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2607-10091", "arxiv_id": "2607.10091", "type": "arXiv", "journal": "arXiv:2607.10091", "journal_ref": "", "title": "Dynamical Nonrelativistic Spin Splitting via THz Nonlinear Phononics", "authors": "Linding Yuan, ChanJu You, Ankit Disa, James M. Rondinelli", "corresponding": "", "url": "https://arxiv.org/abs/2607.10091", "topic": "Magnetism", "level": "Brief", "summary_en": "This work demonstrates ultrafast, reversible control of nonrelativistic spin splitting (NRSS) in collinear antiferromagnets using THz laser pulses via nonlinear phononics, supported by density functional theory. It derives selection criteria for phonon modes that activate NRSS and illustrates NRSS creation and enhancement in NiO and LaFeO3 respectively.", "summary": "Nonrelativistic spin splitting (NRSS) in collinear antiferromagnets, including altermagnets and compensated ferrimagnets, offers a route to high-frequency spintronics immune to stray fields, but its dynamic control has remained elusive. We demonstrate, using density functional theory (DFT) and nonlinear phononics, that THz laser pulses can achieve ultrafast, reversible control of NRSS on picosecon", "abstract": "Nonrelativistic spin splitting (NRSS) in collinear antiferromagnets, including altermagnets and compensated ferrimagnets, offers a route to high-frequency spintronics immune to stray fields, but its dynamic control has remained elusive. We demonstrate, using density functional theory (DFT) and nonlinear phononics, that THz laser pulses can achieve ultrafast, reversible control of NRSS on picosecond timescales in antiferromagnets. We derive two mode-selection criteria, accounting for phonon and magnetic wavevector compatibility and inversion parity, to identify which phonon modes can activate NRSS. Our calculations illustrate the creation of NRSS in spin-degenerate NiO and the enhancement of existing splitting in LaFeO$_3$. While practical implementation depends on excitation conditions, lattice dynamics, and mode coupling, these results establish design principles for identifying materials with stronger and more accessible responses. Limitations imposed by driving fields, phonon damping, and anharmonic detuning motivate further materials screening based on accessible excitation strengths, lattice stability, resonance frequency matching, and favorable anharmonic coupling.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本文展示了通过THz激光脉冲利用非线性声子学实现对共线反铁磁体中非相对论自旋劈裂（NRSS）的超快可逆控制，并基于密度泛函理论进行支持。文章推导了激活NRSS的声子模式选择准则，并分别在NiO和LaFeO3中演示了NRSS的产生和增强。", "method_en": "The authors use density functional theory combined with nonlinear phononics to model how THz laser pulses interact with phonon modes in antiferromagnets. Two mode-selection criteria based on phonon and magnetic wavevector compatibility and inversion parity are derived to identify modes that can activate NRSS.", "method_zh": "作者结合密度泛函理论和非线性声子学模拟THz激光脉冲如何与反铁磁体中的声子模式相互作用。推导出基于声子与磁波矢量兼容性及反演奇偶性的两条模式选择准则，用于识别能够激活NRSS的声子模式。", "result_en": "Calculations show that NRSS can be dynamically created in spin-degenerate NiO and existing NRSS can be enhanced in LaFeO3. These findings establish design principles for materials with stronger NRSS responses while noting practical limitations such as phonon damping and anharmonic detuning.", "result_zh": "计算显示可在自旋简并的NiO中动态产生NRSS，并在LaFeO3中增强已存在的NRSS。研究结果为寻找具有更强NRSS响应的材料确立了设计原则，同时指出实际应用受声子阻尼和非简谐失谐等限制。", "future_en": "Future efforts should focus on material screening considering excitation strengths, lattice stability, resonance frequency matching, and anharmonic coupling to overcome limitations imposed by driving fields and phonon dynamics, facilitating practical realization of dynamic NRSS control.", "future_zh": "未来应集中于材料筛选，考虑激发强度、晶格稳定性、共振频率匹配及非简谐耦合，以克服驱动场和声子动力学带来的限制，促进动态NRSS控制的实际实现。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2511-19389", "arxiv_id": "2511.19389", "type": "arXiv", "journal": "arXiv:2511.19389", "journal_ref": "Phys. Rev. B 114, 225131 (2026)", "title": "Kondo screening and random-singlet formation in highly disordered systems", "authors": "Lucas G. Rabelo, Igor C. Almeida, Eduardo Miranda, Vladimir Dobrosavljević, Eric C. Andrade", "corresponding": "", "url": "https://arxiv.org/abs/2511.19389", "topic": "Magnetism", "level": "Brief", "summary_en": "A minimal effective framework is presented to capture anomalous low-temperature thermodynamics in strongly disordered systems near metal-insulator transitions by modeling competition between Kondo screening and random-singlet formation.", "summary": "We introduce a minimal effective framework designed to address the anomalous low-temperature thermodynamics observed in strongly disordered interacting systems near a metal-insulator transition, such as doped semiconductors. Our approach examines how a strongly inhomogeneous electronic bath quenches dilute pairs of local magnetic moments. By solving the resulting two-impurity Kondo-Heisenberg prob", "abstract": "We introduce a minimal effective framework designed to address the anomalous low-temperature thermodynamics observed in strongly disordered interacting systems near a metal-insulator transition, such as doped semiconductors. Our approach examines how a strongly inhomogeneous electronic bath quenches dilute pairs of local magnetic moments. By solving the resulting two-impurity Kondo-Heisenberg problem within a large-$\\mathcal{N}$ variational framework, we capture the competition between Kondo screening and random-singlet formation. Both mechanisms give rise to singular thermodynamic responses, producing a magnetic susceptibility of the form $χ(T)\\sim T^{-α}$, where the exponent $α$ evolves smoothly with model parameters and saturates in the metallic regime, consistent with experimental observations. Our results establish a unified framework that connects random-singlet physics and disorder-induced Kondo screening in strongly disordered correlated materials.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "提出了一个简约有效框架，通过研究稀疏局部磁矩的两杂质Kondo-Heisenberg模型，捕获强无序体系近金属-绝缘体转变处异常低温热力学行为，体现Kondo筛选和随机单态形成的竞争。", "method_en": "The two-impurity Kondo-Heisenberg problem is solved within a large-N variational approach to capture singlet formation and Kondo screening effects, enabling predictions of singular magnetic susceptibilities across disorder regimes.", "method_zh": "利用large-N变分方法求解两杂质Kondo-Heisenberg问题，捕捉单态形成与Kondo筛选效应，预测无序体系中奇异磁化率行为。", "result_en": "Both Kondo and random-singlet mechanisms yield magnetic susceptibilities following $\u0003c7(T)  T^{-\u0003b1}$ with a continuously varying exponent \u0003b1 saturating in metallic phases, consistent with experiments on doped semiconductors.", "result_zh": "Kondo筛选和随机单态机制均导致磁化率$\u0003c7(T)  T^{-\u0003b1}$，指数\u0003b1随模型参数连续变化并在金属态趋稳，符合掺杂半导体实验。", "future_en": "This unified framework invites further studies connecting disorder-induced Kondo effects and random-singlet physics in correlated materials, potentially guiding interpretation of complex thermodynamics near metal-insulator transitions.", "future_zh": "该统一框架为深入探讨强关联材料中无序诱发的Kondo效应与随机单态物理相互关系提供理论基础，有助于解释金属-绝缘体转变附近的复杂热力学。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2607-07630", "arxiv_id": "2607.07630", "type": "arXiv", "journal": "arXiv:2607.07630", "journal_ref": "", "title": "Lattice dynamics and structural correlations in antiferromagnet SrLaCoNbO$_6$ double perovskite", "authors": "Ajay Kumar, Clemens Ulrich, Rajendra S. Dhaka", "corresponding": "", "url": "https://arxiv.org/abs/2607.07630", "topic": "Magnetism", "level": "Brief", "summary_en": "The study reports temperature-dependent Raman and EXAFS measurements revealing anomalous phonon behaviors and subtle local structural distortions in antiferromagnetic SrLaCoNbO6. Phonon anomalies occur around 60 K and 160–180 K, above the Neel temperature, linked to lattice dynamics and local structure.", "summary": "We report a detailed temperature-dependent Raman spectroscopy and Co $K$-edge extended x-ray absorption fine structure (EXAFS) study of the insulating antiferromagnetic double perovskite SrLaCoNbO$_6$. Interestingly, pronounced changes in the phonon frequencies, linewidths, and intensities are observed around 60~K, well above the long-range antiferromagnetic ordering temperature, $T_{\\rm N} \\appro", "abstract": "We report a detailed temperature-dependent Raman spectroscopy and Co $K$-edge extended x-ray absorption fine structure (EXAFS) study of the insulating antiferromagnetic double perovskite SrLaCoNbO$_6$. Interestingly, pronounced changes in the phonon frequencies, linewidths, and intensities are observed around 60~K, well above the long-range antiferromagnetic ordering temperature, $T_{\\rm N} \\approx 15$~K. These anomalies indicate a modification of the lattice dynamics that may involve local structural distortions, short-range magnetic correlations, or an interplay between them. Additional changes in both high- and low-energy Raman modes are detected near 160--180~K via variations in phonon intensities and linewidths, together with changes in the Fano asymmetry of selected low-energy modes. The asymmetric line shapes of these modes are well described phenomenologically by Fano profiles and indicate coupling of the discrete phonons to an underlying continuum, whose possible microscopic origins are discussed. Moreover, the EXAFS analysis reveals correlated changes in bond distances and Debye--Waller factors around the Co ions near 60~K and 160~K, indicating subtle local structural distortions at temperatures corresponding to the Raman anomalies. The combined Raman and EXAFS results therefore demonstrate a close correlation between anomalous lattice dynamics and local structural evolution in SrLaCoNbO$_6$.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本研究通过温度依赖的拉曼光谱和EXAFS测量，揭示了反铁磁SrLaCoNbO6中异常的声子行为和微妙的局域结构畸变。声子异常出现在60 K和160–180 K附近，高于Neel温度，反映晶格动力学和局域结构相关的变化。", "method_en": "Combined temperature-dependent Raman spectroscopy characterized phonon frequency, linewidth, intensity, and Fano asymmetry, while Co K-edge EXAFS provided bond distance and Debye–Waller factor information around Co ions.", "method_zh": "结合温度依赖的拉曼光谱测量声子的频率、线宽、强度和Fano不对称性，Co K边EXAFS分析Co离子周围的键长和Debye–Waller因子信息。", "result_en": "Pronounced phonon anomalies at 60 K and 160–180 K were linked to local structural distortions and changes in lattice dynamics, with Fano line shapes indicating phonon coupling to a continuum. EXAFS confirmed correlated bond and disorder changes near Co ions at those temperatures.", "result_zh": "60 K及160–180 K时显著的声子异常对应局域结构畸变和晶格动力学变化，Fano线形表明声子与连续态的耦合。EXAFS验证了Co离子附近键长及无序度的相关变化。", "future_en": "Future work can explore the microscopic origins of the coupled lattice and magnetic anomalies and their role in electronic and magnetic properties of SrLaCoNbO6 and related double perovskites.", "future_zh": "未来可进一步探索晶格与磁各向异性耦合的微观机理，以及其在SrLaCoNbO6及类似双钙钛矿材料电子和磁性质中的作用。", "tier": "Uncertain", "tier_reason_en": "This detailed experimental study combines vibrational and local structural probes to reveal lattice-magnetic coupling far above magnetic ordering, of interest to condensed matter and materials physics.", "tier_reason_zh": "该实验性研究结合振动光谱与局域结构探针，揭示磁序远高温下的晶格-磁耦合，对凝聚态物理和材料物理领域具有较高兴趣。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2605-21284", "arxiv_id": "2605.21284", "type": "arXiv", "journal": "arXiv:2605.21284", "journal_ref": "Physical Review B (2026)", "title": "Ligand-mediated Origin of Altermagnetic Spin-Splitting", "authors": "Luigi Camerano, Federico Bisti, Gianni Profeta", "corresponding": "", "url": "https://arxiv.org/abs/2605.21284", "topic": "Magnetism", "level": "Brief", "summary_en": "Using first-principles calculations and Wannier Hamiltonians, the authors identify ligand-mediated hybridization as the dominant microscopic mechanism of altermagnetic spin splitting in Co$_{1/4}$NbSe$_2$, rather than direct magnetic-ion hopping.", "summary": "Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitt", "abstract": "Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitting in the $g$-wave altermagnet Co$_{1/4}$NbSe$_2$. We show that the splitting is captured by a short-range tight-binding model, establishing its local origin. By selectively controlling hopping channels, we demonstrate that the dominant contribution arises not from direct magnetic-ion hopping, but from ligand-mediated hybridization that transfers anisotropy to itinerant states. This identifies ligand-assisted coupling as the key mechanism of altermagnetic spin splitting and provides a microscopic bridge between minimal models and symmetry guided first-principles material searches, enabling real-space design of altermagnetic functionality.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "通过第一性原理计算和Wannier哈密顿量构建，作者发现Co$_{1/4}$NbSe$_2$中的另类磁性自旋劈裂主要源自配体介导的杂化，而非直接磁离子间跃迁。", "method_en": "The study employs short-range tight-binding models selectively controlling hopping channels derived from first-principles to dissect the contributions to spin splitting, supported by Wannier Hamiltonian engineering.", "method_zh": "利用从第一性原理导出的短程紧束缚模型选择性控制跃迁通道，配合Wannier哈密顿量构建，解析自旋劈裂的微观成分。", "result_en": "The analysis shows that ligand-assisted coupling transfers anisotropy to itinerant states, providing a microscopic understanding that bridges minimal models and symmetry-based classifications of altermagnets.", "result_zh": "结果表明配体辅助耦合将各向异性传递给游离态，构建了微观机制，连接了简化模型与基于对称性的另类磁性材料分类。", "future_en": "This insight enables real-space design of altermagnetic properties by tuning ligand environments, facilitating targeted material searches and engineering for spintronic applications.", "future_zh": "该认识使通过调控配体环境实现另类磁性性能的实空间设计成为可能，助力定向材料搜索与自旋电子学应用工程。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2610-31206", "arxiv_id": "2610.31206", "type": "arXiv", "journal": "arXiv:2610.31206", "journal_ref": "", "title": "Mn-deficient Ni-Mn-Ga alloys: phase transitions, magnetic properties, and disappearance of martensitic transformation", "authors": "Valentina Moskvina, Jaroslav Čapek, Michal Rameš, Denys Musiienko, Petr Veřtát, Alexej Perevertov, Ladislav Straka, Oleg Heczko", "corresponding": "", "url": "https://arxiv.org/abs/2610.31206", "topic": "Magnetism", "level": "Brief", "summary_en": "This study uses Mn-deficient and near-stoichiometric Ni-Mn-Ga oligocrystals with composition gradients to systematically investigate composition-dependent phase transitions and magnetic properties, revealing abrupt transformation disappearance for Mn below ~22 at.% and associated magnetic behavior.", "summary": "Composition gradients formed during directional solidification are generally considered undesirable in Ni-Mn-Ga magnetic shape-memory alloys. However, these gradients offer a highly effective platform for systematically investigating composition-property relationships under identical growth and heat-treatment conditions. To exploit this approach, one Mn-deficient and two near-stoichiometric Ni-Mn-", "abstract": "Composition gradients formed during directional solidification are generally considered undesirable in Ni-Mn-Ga magnetic shape-memory alloys. However, these gradients offer a highly effective platform for systematically investigating composition-property relationships under identical growth and heat-treatment conditions. To exploit this approach, one Mn-deficient and two near-stoichiometric Ni-Mn-Ga oligocrystals were grown by optical zone remelting and characterized by X-ray fluorescence mapping, optical microscopy, X-ray diffraction, low-field magnetic measurements, and vibrating-sample magnetometry. The ingots contained elongated grains and axial compositional gradients, primarily associated with the redistribution of Mn and Ga, whereas Ni remained relatively uniformly distributed. The martensitic and premartensitic transformation temperatures generally increased with increasing Mn content. Neither transformation was detected between 10 and 400 K in specimens containing 20.5-22.0 at.% Mn, all of which had $e/a < 7.40$. In contrast, both transformations were observed in the investigated specimens containing at least 22.1 at.% ($e/a \\geq 7.46$). This abrupt change may indicate a possible electron-concentration threshold for the occurrence of these transformations. Saturation magnetization increased with Mn content up to 25.8 at.%, reaching 96.9 A m$^2$/kg at 10 K and 71.2 A m$^2$/kg at 300 K. Post-growth annealing increased the transition temperatures and changed the low-field magnetic response. The results indicate that composition-gradient oligocrystals serve as an effective platform for investigating the relationships between composition, structure, and magnetic properties in Ni-Mn-Ga alloys with the same processing history.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本研究利用含成分梯度的Mn缺陷及近化学计量Ni-Mn-Ga寡晶系统，系统探究成分对相变及磁性的影响，发现Mn含量低于约22原子%时马氏体转变骤然消失及相应磁性特征。", "method_en": "Samples were prepared by optical zone remelting and characterized using X-ray fluorescence mapping, microscopy, X-ray diffraction, low-field magnetometry, and vibrating sample magnetometry.", "method_zh": "样品通过光区再熔炼制备，采用X射线荧光映射、显微镜、X射线衍射、低场磁测量及振动样品磁强计进行表征。", "result_en": "Martensitic and premartensitic transformations were absent between 10–400 K for specimens with 20.5–22.0 at.% Mn (e/a < 7.40), but present for Mn ≥ 22.1 at.% (e/a ≥ 7.46). Saturation magnetization increased with Mn up to 25.8 at.%, reaching 96.9 A m²/kg at 10 K.", "result_zh": "Mn含量20.5–22.0原子%（e/a < 7.40）的样品在10–400 K区间未观测到马氏体及预马氏体转变，≥22.1原子%（e/a ≥ 7.46）则存在。饱和磁化强度随Mn含量升高至25.8原子%，10 K时达96.9 A·m²/kg。", "future_en": "These composition-gradient oligocrystals offer a platform for detailed study of composition-structure-property relationships under identical conditions, potentially guiding alloy design to tailor phase transformations and magnetic responses.", "future_zh": "这些成分梯度寡晶为一致条件下组成-结构-性能关系的细致研究提供平台，有望指导合金设计以调控相变及磁性。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2610-30251", "arxiv_id": "2610.30251", "type": "arXiv", "journal": "arXiv:2610.30251", "journal_ref": "", "title": "Nature of the bosonic edge phase in a double quantum spin Hall insulator", "authors": "Andreas Feuerpfeil, Ronny Thomale, Trithep Devakul, Nicolas Regnault, Julian May-Mann", "corresponding": "", "url": "https://arxiv.org/abs/2610.30251", "topic": "Magnetism", "level": "Brief", "summary_en": "This paper numerically demonstrates an interaction-driven transition from fermionic to bosonic edge phases in double quantum spin Hall insulators, confirming the existence of gapped single-fermion excitations and gapless fermion pairs.", "summary": "Field-theoretic analysis has predicted that the edge of a double quantum spin Hall insulator (DQSHI) can undergo an interaction-driven transition from a phase with fermionic edge modes into one with only bosonic modes. All single-fermion edge excitations are gapped in this bosonic edge phase, but fermion pairs remain gapless, leading to distinct experimental signatures. We numerically simulate the", "abstract": "Field-theoretic analysis has predicted that the edge of a double quantum spin Hall insulator (DQSHI) can undergo an interaction-driven transition from a phase with fermionic edge modes into one with only bosonic modes. All single-fermion edge excitations are gapped in this bosonic edge phase, but fermion pairs remain gapless, leading to distinct experimental signatures. We numerically simulate the interacting DQSHI edge and verify the existence of the bosonic edge phase. This calculation requires an explicit bulk embedding of the DQSHI edge, due to its mixed anomaly between charge and $S^z$ conservation. We hence employ segment DMRG on an infinite two-dimensional cylinder, where the DQSHI bulk is modeled in terms of two copies of the spin-up lowest Landau level, combined with their time-reversed counterparts. We find that interactions can open a single-fermion gap at the DQSHI edge while fermion pairs remain gapless, matching the predictions for the bosonic edge phase. We find the scaling of the single-fermion gap with interaction strength to be consistent with field-theoretic calculations, and discuss the relevance of the bosonic edge phase to twisted homobilayers of WSe$_2$ and MoTe$_2$. We elaborate on the methodological extension of the segment geometry used here to other topological phases with edge anomalies.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本文数值证明了双量子自旋霍尔绝缘体中由相互作用驱动的从费米子边缘态到玻色子边缘态的跃迁，确认了单费米子激发有隙、费米子对无隙的存在。", "method_en": "Using segment DMRG on an infinite cylinder with a bulk embedding modeled by spin-polarized Landau levels and their time-reversed counterparts, the edge is explicitly simulated respecting the mixed anomaly.", "method_zh": "通过在无限圆柱上的段DMRG，结合由自旋极化朗道能级及其时间反演构成的体嵌入，明确模拟了包含混合异常的边缘。", "result_en": "Findings include single-fermion gap opening consistent with field theory, gapless pair modes, and implications for experimental systems like twisted WSe2 and MoTe2 homobilayers.", "result_zh": "结果显示单费米子隙符合场论预言，费米子对无隙，且探讨了其在扭曲WSe2和MoTe2同质层中的相关性。", "future_en": "Further research should extend the segment geometry approach to other topological phases with edge anomalies and explore experimental detection techniques.", "future_zh": "未来工作应将段几何方法推广至含边缘异常的其他拓扑相，探索其实验检测手段。", "tier": "Nature Physics/Nature Materials", "tier_reason_en": "The paper presents a significant numerical confirmation of a theoretically predicted bosonic edge phase in topological materials with mixed anomalies, employing advanced tensor network methods with concrete experimental relevance.", "tier_reason_zh": "本文通过先进张量网络方法数值确认了含混合异常拓扑材料中预言的玻色子边缘相，具有重要理论价值和实际实验相关性。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2505-02911", "arxiv_id": "2505.02911", "type": "arXiv", "journal": "arXiv:2505.02911", "journal_ref": "J.H.Cullen, D.P.Arovas, R.Raimondi, and D.Culcer, (2026). Advances in Physics, 1-26", "title": "Quantum geometry and quantum capacitance in the orbital magneto-electric effect", "authors": "James H. Cullen, Daniel P. Arovas, Roberto Raimondi, Dimitrie Culcer", "corresponding": "", "url": "https://arxiv.org/abs/2505.02911", "topic": "Magnetism", "level": "Brief", "summary_en": "This paper develops a density-matrix formulation of the orbital magneto-electric effect (OME) in Bloch electrons, revealing intra-band and inter-band contributions with distinct quantum geometric origins and a band-diagonal charge dipole governed by the quantum metric.", "summary": "The orbital magneto-electric effect (OME), the generation of a steady-state orbital angular momentum (OAM) density by an electric field, is a central component of orbitronics. Nevertheless its microscopic interpretation is complicated by the existence of two qualitatively different contributions: the intra-band Edelstein term stemming from the combined effect of the equilibrium OAM and Fermi surfa", "abstract": "The orbital magneto-electric effect (OME), the generation of a steady-state orbital angular momentum (OAM) density by an electric field, is a central component of orbitronics. Nevertheless its microscopic interpretation is complicated by the existence of two qualitatively different contributions: the intra-band Edelstein term stemming from the combined effect of the equilibrium OAM and Fermi surface shift, and the inter-band contribution, stemming from Zitterbewegung induced by the electric field. Here we develop a pedagogical density-matrix formulation of the OME within the framework of the modern theory of Bloch-electron OAM, in which the two contributions naturally emerge from distinct parts of the density matrix, and their distinct quantum geometric structures are clearly seen. In the inter-band contribution, in addition to the local- and itinerant-circulation terms, we show that a band-diagonal displacement, or charge dipole, is present, which is linear in the electric field and governed by the normalized quantum metric. For a tilted massive Dirac cone the Zitterbewegung OME and the Fermi-surface orbital response occur for orthogonal electric-field orientations, providing a route to separate them experimentally. The itinerant-circulation contribution is identical to the dipolar one, so in a two-band model the dipole accounts for exactly half of the inter-band response, both in the doped regime and in the insulating gap. Our recent insights identify quantum-metric engineering as a route for enhancing orbital magneto-electric responses and clarify the relation between modern orbital magnetization, polarization, and orbital torque phenomenology.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本文基于Bloch电子轨道角动量的现代理论，发展了轨道磁电效应的密度矩阵描述，阐明了来自能带内和能带间的不同量子几何结构贡献及由量子度量规范的带对角电偶极子。", "method_en": "Using density-matrix formalism, the authors separate Edelstein (intra-band) and Zitterbewegung (inter-band) contributions and analyze their quantum geometric structures including charge dipole terms.", "method_zh": "利用密度矩阵方法，作者区分了Edelstein能带内贡献与Zitterbewegung能带间贡献，分析了它们的量子几何结构及包含电偶极子项的作用。", "result_en": "They identify that itinerant circulation equals the dipolar term in two-band models, and show orthogonal electric field orientations can experimentally separate response components in tilted massive Dirac cones.", "result_zh": "研究确认在两能带模型中，游动环流等于电偶极子项，并指出倾斜大质量Dirac锥中可通过正交电场方向分离不同响应分量。", "future_en": "The findings suggest quantum-metric engineering as a promising route to enhance orbital magneto-electric responses and clarify their relation to orbital torque phenomena.", "future_zh": "结果表明，量子度量调控是增强轨道磁电响应的潜在途径，并澄清了其与轨道力矩现象的关系。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2610-30647", "arxiv_id": "2610.30647", "type": "arXiv", "journal": "arXiv:2610.30647", "journal_ref": "", "title": "String Order in Quench Dynamics as a Probe of Quantum Phase Transitions", "authors": "H. P. Zhang, Z. Song", "corresponding": "", "url": "https://arxiv.org/abs/2610.30647", "topic": "Magnetism", "level": "Brief", "summary_en": "This study introduces a global string order parameter for the anisotropic XY chain in a transverse field and analyzes its equilibrium and quench dynamics, revealing nonanalytic behavior at quantum critical lines and connecting nonlocal order to measurable spin observables.", "summary": "We study the anisotropic XY chain in a transverse field by introducing a global string order parameter and examining its equilibrium behavior and its quench dynamics from a fully polarized initial state. The corresponding string operator is defined as the product of local projected spin operators over the entire chain. The nonequilibrium order parameter is the long-time average of the logarithm of", "abstract": "We study the anisotropic XY chain in a transverse field by introducing a global string order parameter and examining its equilibrium behavior and its quench dynamics from a fully polarized initial state. The corresponding string operator is defined as the product of local projected spin operators over the entire chain. The nonequilibrium order parameter is the long-time average of the logarithm of the string-operator expectation value per site after the quench.For the ground state, its field derivative is singular on the Ising critical lines; after the quench, the steady-state response also records the field boundaries and the anisotropy transition. We derive analytically the nonanalytic behavior of the order parameter at the quantum critical lines. Our results reveal a hidden nonlocal order underlying this paradigmatic model of conventional quantum phase transitions. They also connect measurable spin populations with equilibrium and dynamical topological structure.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本研究为横场各向异性XY链引入全局弦序参数，分析其平衡及淬火动力学，揭示量子临界线处的非解析行为，并将非局域序连接到可测量的自旋概率。", "method_en": "They define a string operator as a product of local projected spin operators over the chain, then study the long-time average of its logarithmic expectation value per site after quenching from a polarized initial state, deriving analytical expressions for criticality signatures.", "method_zh": "定义链上局部投影自旋算符的积作为弦算符，考察从极化初态淬火后该算符对数期望的长时间平均，并推导出临界行为的解析表达式。", "result_en": "The field derivative of the ground-state string order parameter is singular on Ising critical lines; after quench, the steady-state response reflects field boundaries and anisotropy transitions, revealing hidden nonlocal topological order underlying conventional quantum phase transitions.", "result_zh": "基态弦序参数对场的导数在伊辛临界线上表现奇异；淬火后稳态响应映射出场边界和各向异性转变，揭示了传统量子相变背后的隐藏非局域拓扑序。", "future_en": "This framework connects measurable spin populations with equilibrium and dynamical topological structures, suggesting experimental probes of hidden order via quench dynamics in quantum spin chains.", "future_zh": "该框架将可测自旋分布与平衡及动力学拓扑结构联系，提示通过淬火动力学实验探测量子自旋链中的隐藏序。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2511-07402", "arxiv_id": "2511.07402", "type": "arXiv", "journal": "arXiv:2511.07402", "journal_ref": "", "title": "The ideal limit of rhombohedral graphene: Dynamical skyrmion lattices and their excitations", "authors": "Tixuan Tan, Patrick J. Ledwith, Trithep Devakul", "corresponding": "", "url": "https://arxiv.org/abs/2511.07402", "topic": "Magnetism", "level": "Brief", "summary_en": "An ideal interacting limit of rhombohedral graphene is proposed where electronic interactions spontaneously form a correlated Chern insulator identified as a dynamical skyrmion lattice in the layer-pseudospin space.", "summary": "We introduce an interacting ideal limit of rhombohedral graphene in which interactions spontaneously generate a correlated Chern insulator. Our analysis reveals that this Chern insulator can be understood as a layer-pseudospin skyrmion lattice stabilized by electronic interactions, and that it gives rise to genuine skyrmion lattice physics, complete with dynamics. This dynamical skyrmion lattice n", "abstract": "We introduce an interacting ideal limit of rhombohedral graphene in which interactions spontaneously generate a correlated Chern insulator. Our analysis reveals that this Chern insulator can be understood as a layer-pseudospin skyrmion lattice stabilized by electronic interactions, and that it gives rise to genuine skyrmion lattice physics, complete with dynamics. This dynamical skyrmion lattice naturally leads to experimentally measurable consequences. In particular, we identify new collective excitations corresponding to chiral shape deformations of the skyrmions, and propose a new positively charged quasiparticle, the skyrmion vacancy. These results establish a qualitatively new form of moiré Chern physics in rhombohedral graphene: an interaction-generated skyrmion lattice whose skyrmions are dynamical low-energy degrees of freedom.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "提出了菱方石石墨烯的理想相互作用极限，电子相互作用自发形成为层伪自旋空间中的相关Chern绝缘体，即动力学斯格明子晶格。", "method_en": "The authors analyze the spontaneous formation of skyrmion lattices via interaction effects in the layer-pseudospin space and study their emergent collective excitations and charged quasiparticles.", "method_zh": "通过分析层伪自旋空间相互作用驱动的斯格明子晶格自发形成，研究其集体现象激发态及带电准粒子。", "result_en": "They identify novel collective modes corresponding to chiral shape deformations of skyrmions and propose a new positively charged quasiparticle termed the skyrmion vacancy, expanding the phenomenology of moiré Chern physics in rhombohedral graphene.", "result_zh": "鉴定出与斯格明子手性形变相关的新型集体激发，并提出正电荷准粒子“斯格明子空位”，拓展了菱方石石墨烯中莫尔Chern物理的表征。", "future_en": "Future experimental exploration can probe the predicted skyrmion lattice dynamics and charged excitations, developing a new class of interaction-driven Chern states in moiré materials.", "future_zh": "未来实验可验证预测的斯格明子晶格动力学及带电激发，发展莫尔材料中新型相互作用驱动的Chern态。", "tier": "Uncertain", "tier_reason_en": "This theoretical work introduces a qualitatively novel interaction-induced Chern insulator phase with dynamical skyrmion lattices in a graphene moiré system, potentially high impact but currently unpublished.", "tier_reason_zh": "该理论工作提出了石墨烯莫尔体系中动力学斯格明子晶格导致的相互作用诱发Chern绝缘体新相，潜在高影响力，尚未发表。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2610-30281", "arxiv_id": "2610.30281", "type": "arXiv", "journal": "arXiv:2610.30281", "journal_ref": "", "title": "Charge Density Waves and In-Gap States in Coupled Chains and Moiré Superlattices", "authors": "Muhammad Akram, Onur Erten", "corresponding": "", "url": "https://arxiv.org/abs/2610.30281", "topic": "Materials & Growth", "level": "Brief", "summary_en": "This paper studies charge density waves (CDWs) and bound states emerging from coupled Su-Schrieffer-Heeger chains forming ladders and moiré superlattices, revealing diverse CDW phases controlled by electron-phonon coupling, interchain tunneling, and lattice mismatch.", "summary": "Charge density waves (CDWs) arise from the interplay between electrons and lattice distortions and are a hallmark of low-dimensional systems. Here we study coupled Su-Schrieffer-Heeger chains, both lattice-matched ladders and lattice-mismatched moiré superlattices, and find a rich set of CDW phases together with symmetry-protected bound states. In lattice-matched chains, the competition between el", "abstract": "Charge density waves (CDWs) arise from the interplay between electrons and lattice distortions and are a hallmark of low-dimensional systems. Here we study coupled Su-Schrieffer-Heeger chains, both lattice-matched ladders and lattice-mismatched moiré superlattices, and find a rich set of CDW phases together with symmetry-protected bound states. In lattice-matched chains, the competition between electron-phonon coupling and interchain tunneling drives a sequence of CDW phases, including staggered dimers, trimers, and incommensurate states. These phases are generally gapped and host bound states protected by crystalline symmetries rather than chiral symmetry, and are therefore not pinned to zero energy. Lattice mismatch further reconstructs these phases into long-period supermoiré CDWs, with an ordered array of defects, pinned to the moiré length scale, that host localized electronic states. Interchain tunneling and lattice mismatch thus emerge as natural control parameters for CDW order and bound states in one-dimensional chains.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本文研究了通过耦合Su-Schrieffer-Heeger链构成的梯子和莫尔超晶格中出现的电荷密度波及束缚态，显示了由电子-声子耦合、链间隧穿和晶格失配调控的多样CDW相。", "method_en": "Theoretical analysis of coupled SSH chains considers both lattice-matched and mismatched cases, examining how interchain tunneling and electron-phonon interactions induce staggered and incommensurate CDWs and symmetry-protected bound states pinned by crystalline symmetries or moiré length scales.", "method_zh": "对耦合SSH链进行理论分析，涵盖晶格匹配与失配情况，研究链间隧穿和电子-声子相互作用如何引起交错、三聚体及非整比CDW相，以及受晶体对称性或莫尔长度尺度约束的束缚态。", "result_en": "Multiple CDW phases including staggered dimers, trimers, and incommensurate states are demonstrated, often hosting crystalline symmetry-protected, but nonzero-energy, bound states; lattice mismatch generates long-period supermoiré CDWs with defect arrays that localize electronic states at moiré scales.", "result_zh": "展示了包括交错二聚体、三聚体及非整比态的多种CDW相，这些相通常存在受晶体对称性保护但非零能量的束缚态；晶格失配产生长周期超莫尔CDW，含有定位在莫尔尺度的缺陷阵列的局域电子态。", "future_en": "Future directions include manipulating interchain coupling and lattice mismatch to engineer tunable CDW phases and localized electronic modes relevant to low-dimensional quantum materials.", "future_zh": "未来可通过调控链间耦合和晶格失配，设计可调CDW相及局域电子模式，应用于低维量子材料。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2604-26871", "arxiv_id": "2604.26871", "type": "arXiv", "journal": "arXiv:2604.26871", "journal_ref": "", "title": "Correlation-Driven Ballistic Exciton Expansion in a Moiré Bose-Fermi Mixture", "authors": "Shibin Deng, Jonas M. Peterson, Maximilian Hauer, Jonas Reimann, Heonjoon Park, Ammon Fischer, Takashi Taniguchi, Kenji Watanabe, Xiaodong Xu, Dante M. Kennes, Libai Huang", "corresponding": "", "url": "https://arxiv.org/abs/2604.26871", "topic": "Materials & Growth", "level": "Brief", "summary_en": "The study demonstrates ballistic exciton transport selectively populating higher-energy moiré exciton bands in a WSe2/WS2 heterobilayer due to strong exciton-electron and exciton-exciton repulsions.", "summary": "Moiré superlattices of transition-metal dichalcogenides (TMDs) host strongly interacting Bose-Fermi mixtures in which bosonic excitons coexist with correlated electron lattices. Using ultrafast, time- and energy-resolved photoluminescence (PL) microscopy, we show that strong exciton-electron and exciton-exciton repulsion can enable ballistic exciton transport in a WSe$_2$/WS$_2$ heterobilayer. Thi", "abstract": "Moiré superlattices of transition-metal dichalcogenides (TMDs) host strongly interacting Bose-Fermi mixtures in which bosonic excitons coexist with correlated electron lattices. Using ultrafast, time- and energy-resolved photoluminescence (PL) microscopy, we show that strong exciton-electron and exciton-exciton repulsion can enable ballistic exciton transport in a WSe$_2$/WS$_2$ heterobilayer. This ballistic transport is energy selective: repulsive interactions populate higher-energy moiré exciton bands, including the doubly occupied exciton state XX and the exciton-electron co-localized state Xe, exhibiting mean-squared displacement (MSD) with a quadratic time dependence, MSD $\\propto t^2$. Transport in the Xe band is jointly governed by exciton and electron correlations. Exciton correlations suppress relaxation into the lower-energy localized exciton state, while generalized Wigner-crystal (GWC) order at fractional electron fillings enhances Auger recombination and the group velocity of the ballistic expansion. A two-dimensional Bose-Fermi Hubbard model solved using time-dependent mean-field methods qualitatively reproduces the measured exciton transport and time-dependent response. It further confirms that strong cross-species interactions allow the electron crystal to perforate the exciton Mott background, enhancing exciton motion. Our results establish moiré TMDs as highly tunable platforms for realizing strongly interacting Bose-Fermi mixtures.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "研究展示了在WSe2/WS2异质双层中，由于强烈的激子-电子和激子-激子排斥作用，激子以弹道方式选择性填充较高能的莫尔激子能带。", "method_en": "Using ultrafast time- and energy-resolved photoluminescence microscopy and a two-dimensional Bose-Fermi Hubbard model solved via time-dependent mean-field methods, the authors characterize exciton transport and its correlation with electron lattice order.", "method_zh": "通过超快时空分辨光致发光显微镜及二维玻色-费米哈伯德模型的时变平均场解法，作者描绘了激子输运及其与电子晶格序的相关性。", "result_en": "They observe mean-squared displacement with quadratic time dependence in doubly occupied exciton and exciton-electron co-localized states, revealing energy-selective ballistic transport influenced by exciton correlations and generalized Wigner-crystal order enhancing Auger recombination and expansion velocity.", "result_zh": "观测到双占据激子态和激子-电子共定位态的均方位移随时间呈二次方增长，揭示能量选择性的弹道输运，激子关联和广义维格纳晶体序增强了奥格复合和扩散速度。", "future_en": "The findings establish moiré TMD heterostructures as highly tunable platforms for investigating strongly interacting Bose-Fermi mixtures and correlated transport phenomena.", "future_zh": "研究确立了莫尔TMD异质结作为调控强相互作用玻色-费米混合物及相关输运现象的理想平台。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2610-22307", "arxiv_id": "2610.22307", "type": "arXiv", "journal": "arXiv:2610.22307", "journal_ref": "", "title": "Extended strange metal and superconductivity in partially filled moiré Hubbard bands", "authors": "Yiyu Xia, Yichi Zhang, Zhongdong Han, Hongyuan Li, Brandon Bauer, Kenji Watanabe, Takashi Taniguchi, Wenjin Zhao, Jie Shan, Kin Fai Mak", "corresponding": "", "url": "https://arxiv.org/abs/2610.22307", "topic": "Superconductivity", "level": "Feature", "summary_en": "The study reports the emergence of an extended strange metal (ESM) phase in partially filled Hubbard bands of twisted bilayer WSe2, which persists down to 50 mK and spans multiple symmetry-breaking states, occurring only at small twist angles where correlations are strong. It also discovers a new superconducting dome developing from the ESM far from the Mott insulator and van Hove singularity.", "summary": "Moiré semiconductors provide a physical realization of the Hubbard model. Bandwidth-tuned Mott transitions and complex phase diagrams mimicking those of high-temperature superconductors have been demonstrated near a weak Mott insulating state at half-band-filling. The platform also provides an opportunity to explore the physics of a partially filled Hubbard band at doping densities far away from t", "abstract": "Moiré semiconductors provide a physical realization of the Hubbard model. Bandwidth-tuned Mott transitions and complex phase diagrams mimicking those of high-temperature superconductors have been demonstrated near a weak Mott insulating state at half-band-filling. The platform also provides an opportunity to explore the physics of a partially filled Hubbard band at doping densities far away from the Mott insulator, a regime that has remained largely unexplored. Here we report the emergence of an extended strange metal (ESM), in both doping density and twist angle, in a partially filled Hubbard band of twisted bilayer WSe2. The ESM is in the clean limit, persists down to about 50mK, and spans over multiple symmetry-breaking ground states; it also appears only at small twist angles, where electronic correlations are strong. These observations distinguish the state from the reported strange metals associated with quantum criticality and favor the viewpoint that it is an intrinsic state of matter. We also report the observation of a new superconducting dome being developed from the ESM but far away from both the Mott insulating state and the van Hove singularity of the material. Our work opens the door to exploring the new regime of partially filled Hubbard bands in the clean limit.", "method": "", "result": "", "future": "", "feature_candidate": true, "summary_zh": "该研究报道了在扭曲双层WSe2的部分填充Hubbard能带中出现扩展奇异金属（ESM）相，该相可持续至50 mK并跨越多种对称性破缺的基态，仅出现在具有强关联的小扭曲角区。还发现了一个远离Mott绝缘体和van Hove奇点的新超导穹顶，由ESM发展而来。", "method_en": "The authors experimentally tune doping density and twist angles in twisted bilayer WSe2 to probe electronic phases, focusing on transport measurements to characterize the ESM phase and superconductivity in the clean limit at low temperatures.", "method_zh": "作者通过调节扭曲双层WSe2的掺杂密度和扭曲角，利用电子输运测量探查电子相，特别是在低温洁净极限下对ESM相和超导性进行表征。", "result_en": "They show that the ESM regime is extended over a range of doping and twist angles, is robust against disorder, and differs qualitatively from strange metals linked to quantum criticality. Furthermore, the identified superconducting dome emerges far from typical correlated insulator or singularity regimes, suggesting an intrinsic many-body origin.", "result_zh": "结果表明，ESM相覆盖掺杂和扭曲角的较大区域，对无序稳健，并且与基于量子临界性的奇异金属有本质区别。此外，发现的超导穹顶远离传统关联系绝缘体和奇点区，暗示其为一种内在多体起源态。", "future_en": "Future research should explore the intrinsic mechanisms underlying the ESM and its relation to superconductivity, potentially enabling new insights into strongly correlated electron systems beyond the proximity of Mott phases.", "future_zh": "未来研究应深入探讨ESM的内在机制及其与超导性的关系，可能为强关联电子体系中Mott相邻域之外的新物理现象提供重要见解。", "tier": "Uncertain", "tier_reason_en": "Significant experimental results in moiré Hubbard systems with implications for correlated and superconducting phases; however, further detailed mechanistic understanding and broader peer validation are needed to place in a specific journal tier.", "tier_reason_zh": "在moire Hubbard体系实验发现重要的电子关联和超导相，但尚需更深入的机制解析和同行验证，难以明确归入特定期刊层次。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2607-05890", "arxiv_id": "2607.05890", "type": "arXiv", "journal": "arXiv:2607.05890", "journal_ref": "Physical Review Applied 26, L031007 (2026)", "title": "Microscopic theory of the lower critical field in superconducting thin-film strips", "authors": "Takayuki Kubo", "corresponding": "", "url": "https://arxiv.org/abs/2607.05890", "topic": "Superconductivity", "level": "Brief", "summary_en": "A microscopic theory is developed to calculate the lower critical field B_c1 in narrow superconducting thin-film strips by solving Usadel equations, resolving vortex core structure without phenomenological cutoffs. The theory provides improved vortex self-energy estimates valid at any temperature below Tc.", "summary": "The lower critical field $B_{c1}$ of a narrow superconducting thin-film strip sets the thermodynamic scale for vortex-free operation in a perpendicular magnetic field. The standard Pearl--London estimate requires a phenomenological vortex-core cutoff, because the London theory does not resolve the core. We formulate a microscopic theory for a dirty strip by solving the two-dimensional Usadel equat", "abstract": "The lower critical field $B_{c1}$ of a narrow superconducting thin-film strip sets the thermodynamic scale for vortex-free operation in a perpendicular magnetic field. The standard Pearl--London estimate requires a phenomenological vortex-core cutoff, because the London theory does not resolve the core. We formulate a microscopic theory for a dirty strip by solving the two-dimensional Usadel equations in the film plane, with the applied field included directly in the gauge-invariant momentum. Self-consistent vortex and Meissner solutions are computed at fixed field, and $B_{c1}$ is obtained from their Gibbs-energy difference. The calculation resolves the vortex core and its finite-width deformation without introducing a cutoff. The resulting vortex self-energy is larger than the naive Pearl--London estimate and cannot, in general, be represented by a London logarithm with a single width-independent cutoff. The formulation applies at any $T<T_c$ and provides a microscopic basis for predicting $B_{c1}$ in superconducting nanostrips and related thin-film devices.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "建立了显微理论，通过求解Usadel方程计算狭窄超导薄膜条的低临界场B_c1，成功解析了涡旋核结构而无需经验截断。该理论提供了适用于任意低于临界温度的涡旋自能改进估计。", "method_en": "The approach solves two-dimensional Usadel equations with magnetic field included in the gauge-invariant momentum to obtain self-consistent vortex and Meissner states and computes B_c1 from their Gibbs free energy difference.", "method_zh": "方法通过将磁场直接包含进规范不变量动量，求解二维Usadel方程获得自洽的涡旋与迈斯纳态，进而从自由能差计算B_c1。", "result_en": "Results reveal that vortex self-energy is larger than Pearl–London estimates and cannot be represented by a single width-independent cutoff London logarithm. The theory enables accurate predictions for B_c1 in superconducting nanostrips and related devices across temperature regimes.", "result_zh": "结果显示涡旋自能高于Pearl–London估计，且无法用单一宽度无关的伦敦对数截断表达。该理论可准确预测纳米条状超导体及相关器件在不同温度下的B_c1。", "future_en": "The framework can be used to optimize designs of superconducting thin-film devices requiring precise knowledge of vortex entry fields, suggesting further studies including more complex geometries and different disorder regimes.", "future_zh": "该框架可用于优化需精确涡旋进入场信息的超导薄膜器件设计，建议进一步研究更复杂结构及不同无序环境下的行为。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2609-30346", "arxiv_id": "2609.30346", "type": "arXiv", "journal": "arXiv:2609.30346", "journal_ref": "", "title": "What Becomes of the Antiferromagnetic String When Long Range Neel Order Is Lost? Exact Results", "authors": "Yuri DiMaggio", "corresponding": "", "url": "https://arxiv.org/abs/2609.30346", "topic": "Superconductivity", "level": "Brief", "summary_en": "The paper investigates the fate of the antiferromagnetic string mechanistic description when long-range Néel order is lost but short-range correlations survive.", "summary": "Early string descriptions of doped antiferromagnets associate hole motion in a locally Néel-ordered background with a path-dependent antiferromagnetic string. We ask what becomes of this mechanism when long range Néel order is lost while short range antiferromagnetic correlations persist. In a singlet bond representation, the underlying basis states do not assign an oriented \\(A/B\\) spin registrat", "abstract": "Early string descriptions of doped antiferromagnets associate hole motion in a locally Néel-ordered background with a path-dependent antiferromagnetic string. We ask what becomes of this mechanism when long range Néel order is lost while short range antiferromagnetic correlations persist. In a singlet bond representation, the underlying basis states do not assign an oriented \\(A/B\\) spin registration to each bond. Therefore, any surviving long wavelength antiferromagnetic axis is naturally described as a director, \\(\\mathbf n\\sim-\\mathbf n\\). Long range Néel order can nevertheless provide a global \\(S^2\\) lift of this director field; when that long range registration is lost, non liftable configurations of the \\(RP^2\\) manifold become physically accessible, opening a topologically nontrivial \\(\\mathbb Z_2\\) sector. Its elementary defects are half vortices that globally minimize the \\(RP^2\\) \\(σ\\)-model energy within the nontrivial \\(\\mathbb Z_2\\) sector. An \\textit{a posteriori} energetic comparison further shows that the projective half vortex texture is softer than the corresponding vector reference texture. A pair of half vortices with opposite windings is logarithmically confined, \\(V(R) = κ\\ln\\left(R/r_{\\text{core}}\\right)\\), \\(κ= πρ_s /2\\). The resulting confinement is carried not by a one dimensional string but by an extended two-dimensional spin texture. Thus, the loss of long-range Néel order does not eliminate antiferromagnetic confinement but removes the global Néel lift. This activates a distinct projective mechanism in which a local path dependent string is replaced, at long wavelengths, by a global topological texture with logarithmic confinement.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本文研究了长程Néel序丧失但短程相关仍存情况下反铁磁弦机制的演变。", "method_en": "Using a singlet bond representation, the authors describe the surviving antiferromagnetic axis as a director (n ~ -n) in the RP² manifold and analyze the emergence of a topologically nontrivial ℤ₂ sector with half-vortex defects.", "method_zh": "采用单重态键表示，将存续的反铁磁轴描述为RP²流形中的向量主轴(n ~ -n)，并分析了带有半涡旋缺陷的非平凡ℤ₂拓扑区域的出现。", "result_en": "They find that half-vortex pairs are logarithmically confined by extended two-dimensional spin textures rather than one-dimensional strings, indicating that antiferromagnetic confinement persists without global Néel lift but via a distinct projective mechanism.", "result_zh": "发现半涡旋对通过二维自旋纹理呈对数限制，而非一维弦，表明反铁磁限制在无全局Néel升维下通过不同的投影机制持续存在。", "future_en": "This work reveals new topological mechanisms of confinement in disordered antiferromagnets and motivates further studies of fractional excitations and their dynamics beyond conventional Néel order descriptions.", "future_zh": "该研究揭示了无序反铁磁体中新型的拓扑限制机制，推动对分数激发及其动力学超越传统Néel序理论的深入探索。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2610-31084", "arxiv_id": "2610.31084", "type": "arXiv", "journal": "arXiv:2610.31084", "journal_ref": "", "title": "Nitrogen vacancy cluster-mediated ferroelectric domain growth in wurtzite AlN", "authors": "Zijian Zhou, Kan-Hao Xue, Ziqi Pang, Heng Yu, Shanzhong Xie, Hang Liu, Haiming Qin, Yi Tong, Bowen Su, Yi Yang, Tian-Ling Ren, Xiangshui Miao", "corresponding": "", "url": "https://arxiv.org/abs/2610.31084", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "This study elucidates how nitrogen vacancies influence ferroelectric domain growth and coercive field in AlN, reconciling discrepancies between theoretical and experimental observations.", "summary": "Aluminum nitride-based ferroelectrics combine high remanent polarization, thermal stability, weak size effects, a wide bandgap and back-end process compatibility, making them promising for high density non-volatile memory. However, their high coercive field ($E_\\mathrm{c}$) and unclear polarization switching mechanism limit further applications. Theoretical predictions indicate preferential revers", "abstract": "Aluminum nitride-based ferroelectrics combine high remanent polarization, thermal stability, weak size effects, a wide bandgap and back-end process compatibility, making them promising for high density non-volatile memory. However, their high coercive field ($E_\\mathrm{c}$) and unclear polarization switching mechanism limit further applications. Theoretical predictions indicate preferential reversed domain growth along the polar axis, whereas experiments show nearly isotropic growth or preferential growth perpendicular to this axis. Here, we combine density functional theory, Deep Potential molecular dynamics and experimental characterization to determine how nitrogen vacancies ($V_\\mathrm{N}$) regulate domain growth and $E_\\mathrm{c}$. In ideal crystal, strong lattice coupling along the polar axis drives preferential domain growth in this direction. $V_\\mathrm{N}$ locally weakens this coupling and promotes polarization nucleation. The spatial distribution of $V_\\mathrm{N}$ and the temporal sequence of vacancy induced switching jointly determine the direction and morphology of reversed domain growth. We further show that scandium doping promotes $V_\\mathrm{N}$ formation, thereby enhancing defect mediated nucleation and reducing $E_\\mathrm{c}$. These findings establish a multiscale mechanism governing thin-film domain-growth kinetics and macroscopic $E_\\mathrm{c}$, reconciling experimental observations with ideal crystal simulations and providing defect engineering principles for low-voltage, reliable and scalable ferroelectric devices.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本研究阐明了氮空位如何影响AlN中的铁电畴生长和矫顽场，调和了理论与实验观测之间的差异。", "method_en": "The authors use density functional theory, Deep Potential molecular dynamics, and experiments to analyze vacancy effects and scandium doping on domain kinetics and coercive field.", "method_zh": "作者结合密度泛函理论、深度势分子动力学和实验，分析空位影响及钪掺杂对畴动力学和矫顽场的作用。", "result_en": "Vacancies locally weaken lattice coupling along the polar axis promoting nucleation and affect reversed domain morphology; scandium doping enhances vacancy formation, reducing coercive field.", "result_zh": "空位局部削弱极轴方向的晶格耦合促进核化，影响反转畴形态；钪掺杂促进空位形成，降低矫顽场。", "future_en": "The findings suggest defect engineering strategies for scalable low-voltage ferroelectric devices and emphasize multiscale mechanisms in domain growth.", "future_zh": "研究成果为低压可扩展铁电器件提供缺陷工程策略，强调畴生长的多尺度机制。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2609-29472", "arxiv_id": "2609.29472", "type": "arXiv", "journal": "arXiv:2609.29472", "journal_ref": "Phys. Rev. Lett. 137, 176901 (2026)", "title": "Selective strain tuning of nonequilibrium multiferroic dynamics in BiFeO$_\\text3$", "authors": "Chenhang Xu, Patrick Liu, Bo Zhang, Minyong Han, Henry G. Bell, Cameron J. R. Duncan, Yusong Liu, Patrick L. Kramer, Randy Lemons, Jake D. Koralek, Alexander H. Reid, Dong Qian, Harold Y. Hwang, Alfred Zong", "corresponding": "", "url": "https://arxiv.org/abs/2609.29472", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "This study demonstrates selective control of photoinduced lattice dynamics in multiferroic BiFeO₃ membranes via in-situ tensile strain, affecting ferroelectric but not magnetic-related distortions.", "summary": "Quantum materials are characterized by intertwined orders, and a fundamental goal in condensed matter physics is to achieve their selective control in such a way that one order parameter can be tuned while leaving others largely unaffected. Although significant progress has been made in thermal equilibrium, realizing such control out of equilibrium remains highly challenging. Here we employed in-s", "abstract": "Quantum materials are characterized by intertwined orders, and a fundamental goal in condensed matter physics is to achieve their selective control in such a way that one order parameter can be tuned while leaving others largely unaffected. Although significant progress has been made in thermal equilibrium, realizing such control out of equilibrium remains highly challenging. Here we employed in-situ tensile strain to selectively manipulate the photoinduced lattice dynamics associated with ferroelectric and magnetic orders in multiferroic BiFeO$_3$. By applying MeV ultrafast electron diffraction to freestanding BiFeO$_3$ membranes under tunable strain, we showed that tensile strain markedly suppresses the ultrafast photoinduced reduction of the ferroelectric displacement. By contrast, the photoinduced dynamics of the antiferrodistortive rotation of the oxygen octahedra, which modulates the magnetic order, remains insensitive to strain. Not only do these findings reveal distinct microscopic pathways underlying nonequilibrium multiferroic dynamics, they also establish tunable strain as an effective route for engineering ultrafast phase control in correlated materials.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "该研究通过原位拉伸应变选择性调控多铁性BiFeO₃膜的光诱导晶格动力学，影响铁电畸变而不显著改变磁畸变。", "method_en": "Using MeV ultrafast electron diffraction on freestanding BiFeO₃ membranes under tunable tensile strain, photoinduced lattice responses related to ferroelectric displacement and oxygen octahedra rotation were measured.", "method_zh": "利用兆电子伏特超快电子衍射技术，测量可调拉伸应变下悬浮BiFeO₃膜铁电位移及氧八面体旋转的光诱导动力学。", "result_en": "Tensile strain significantly suppresses the ultrafast reduction of ferroelectric displacement while leaving antiferrodistortive oxygen octahedra rotation dynamics strain-insensitive, revealing distinct pathways for ultrafast multiferroic response.", "result_zh": "拉伸应变显著抑制铁电位移的超快减少，但对反扭曲氧八面体旋转动力学无显著影响，揭示超快多铁响应的不同微观路径。", "future_en": "The work suggests tunable strain as an effective approach to engineer nonequilibrium phase dynamics in correlated quantum materials.", "future_zh": "该工作表明可调应变是调控关联量子材料非平衡相变动力学的有效手段。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2610-30536", "arxiv_id": "2610.30536", "type": "arXiv", "journal": "arXiv:2610.30536", "journal_ref": "", "title": "Finite-width altermagnetic quantum rings: angular-channel hybridization and Aharonov--Bohm physics", "authors": "Edilberto O. Silva", "corresponding": "", "url": "https://arxiv.org/abs/2610.30536", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "This paper studies a finite-width 2D quantum ring with a d-wave altermagnetic term, confinement potential, magnetic field, and Aharonov-Bohm flux, revealing angular-channel mixing effects, shell oscillations, and persistent charge currents, but no persistent spin current.", "summary": "We study a finite-width two-dimensional quantum ring with a quadratic $d$-wave altermagnetic term, Tan--Inkson confinement, a perpendicular magnetic field, and independently tunable Aharonov--Bohm (AB) flux. The altermagnetic interaction mixes $m$ and $m\\pm2$ angular channels while preserving their parity. Circular symmetry renders the crystal orientation spectrally irrelevant and makes the two sp", "abstract": "We study a finite-width two-dimensional quantum ring with a quadratic $d$-wave altermagnetic term, Tan--Inkson confinement, a perpendicular magnetic field, and independently tunable Aharonov--Bohm (AB) flux. The altermagnetic interaction mixes $m$ and $m\\pm2$ angular channels while preserving their parity. Circular symmetry renders the crystal orientation spectrally irrelevant and makes the two spin blocks exactly isospectral. The resulting same-parity anticrossings are resolved at low filling, and multichannel mixing is found near the Fermi level of highly occupied rings. Independent converged calculations for $N_e=1400$ and $1800$ establish the reconstructed Fermi edge and magnetic response in a finite field window and the persistent current over a full AB flux period. The analytic conventional reference separates radial-subband depopulation (dHvA-type cycles) from finer finite-ring shell oscillations; we do not assign a global Fourier spectrum to unverified altermagnetic field scans. The few-electron thermal response is obtained from an exact fixed-particle-number canonical partition function, avoiding finite-system errors of a fixed-mean-number approximation. The circular model supports an equilibrium charge current but no persistent spin current.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "本文研究含d波altermagnetic项的有限宽度二维量子环，考虑限制势、磁场及Aharonov-Bohm通量，揭示角动量通道混合、壳层振荡及持久电荷流，但无持久自旋流。", "method_en": "Using a circular-symmetric model with Tan-Inkson confinement, the authors solve for mixed angular momentum channels coupled by the altermagnetic term, analyzing Fermi edge reconstruction and thermal responses with exact canonical partition functions.", "method_zh": "采用具有圆对称性的Tan-Inkson限制模型，解耦含altermagnetic项导致混合的角动量通道，利用精确正则系综分区函数分析费米边缘重构和热响应。", "result_en": "Distinct anticrossings at low filling and multichannel mixing at high occupation are resolved; radial subband depopulation and finite-ring shell oscillations govern magnetic and persistent current responses; no global Fourier spectrum is assigned to altermagnetic scans.", "result_zh": "低填充密度时出现明显反交叉，高填充分布出现多通道混合；径向子带耗尽及有限环壳层振荡主导磁响应和持久电流；未对altermagnetic扫描赋予全局傅里叶谱。", "future_en": "Further experimental and theoretical work could explore spin transport under altermagnetic interactions and the impact of varied ring geometries or disorder on Aharonov-Bohm physics.", "future_zh": "未来实验和理论工作可探讨altermagnetic相互作用下的自旋输运及不同量子环几何结构或无序对Aharonov-Bohm物理的影响。", "review_method": "editorial_physics_scope"}], "stats": {"original_candidates": 201, "initially_published": 124, "editorially_reviewed": 124, "selected": 25, "featured": 4, "global_editorial": true}, "note": "Physics-first editorial correction of overly broad automated October 24 selections."}, {"date": "2026-10-23", "title": "Daily Condensed Matter Literature", "papers": [{"id": "doi-10-1038-s41467-026-78018-6", "doi": "10.1038/s41467-026-78018-6", "type": "Journal", "journal": "Nature Communications", "title": "Evidence of optical Aharonov-Bohm interference in spin-polarized moiré excitonic complexes", "authors": "Andreij C. Gadelha, Diego R. Costa, André Pelais, Luciano F. D. Almeida, Italo C. Albuquerque, Raimundo C. R. N. Bezerra, Rafael R. Rojas-Lopez, Frederico B. Sousa, Alessandra Ames, Danian A. Dugato, Kenji Watanabe, Takashi Taniguchi, Gilmar E. Marques, Antônio G. S. Filho, Leandro M. Malard, Andrey Chaves, Marcio D. Teodoro", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78018-6", "topic": "Magnetism", "level": "Feature", "summary_en": "Magneto-photoluminescence in near-60° twisted MoS2 reveals oscillatory exciton/biexciton optical Aharonov–Bohm signals and nearly full biexciton valley–spin polarization.", "summary": "Magneto-photoluminescence in near-60° twisted MoS2 reveals oscillatory exciton/biexciton optical Aharonov–Bohm signals and nearly full biexciton valley–spin polarization.", "abstract": "", "method": "", "result": "", "future": "", "summary_zh": "在近 60° 扭转 MoS₂ 双层中报告激子与双激子的光学 Aharonov–Bohm 干涉及接近完全的谷自旋极化。", "relevance_score": 80, "relevance_method": "semantic", "relevance_reason": "The paper reports clear experimental observation of optical Aharonov-Bohm interference in spin-polarized moiré excitonic complexes, providing a new platform to explore quantum geometric and topological effects in 2D moiré materials.", "feature_candidate": true, "physics_advance": "Magneto-photoluminescence evidence for oscillatory Aharonov-Bohm interference effects in moiré excitons/biexcitons with nearly full valley-spin polarization, revealing new coherent quantum phenomena in twisted 2D semiconductors.", "ai_in_scope": true}, {"id": "arxiv-2610-30321", "arxiv_id": "2610.30321", "type": "arXiv", "journal": "arXiv:2610.30321", "journal_ref": "", "title": "Extreme competition between stripes and superconductivity in the hole-doped Hubbard model", "authors": "Ao Chen, Johnnie Gray, Si-Jing Du, Garnet Kin-Lic Chan", "corresponding": "", "url": "https://arxiv.org/abs/2610.30321", "topic": "Superconductivity", "level": "Feature", "summary_en": "High-accuracy simulations on up to 1024 sites find near-degenerate uniform d-wave superconducting, superconducting-stripe and insulating-stripe states in the doped Hubbard model.", "summary": "High-accuracy simulations on up to 1024 sites find near-degenerate uniform d-wave superconducting, superconducting-stripe and insulating-stripe states in the doped Hubbard model.", "abstract": "The two-dimensional Hubbard model was originally proposed as the minimal model of uniform $d$-wave superconductivity in the cuprate high-temperature superconductors, but recent calculations with relevant parameters in a realistic doping regime have often found other ground states. Further, uncertainty remains over such results due to the intrinsic bias of different computational methods. Here we address this uncertainty through state-of-the-art neural tensor network and neural backflow state simulations, enabled by large-scale GPU computation, that together reach an unprecedented variational accuracy on lattices with up to 1024 sites. At $1/8$ doping in the pure Hubbard model, as well as with next-nearest-neighbor hopping relevant to the hole-doped cuprates, we reveal a near degeneracy among a low-energy uniform $d$-wave state, superconducting stripes, and non-superconducting stripe states on the milli-$t$ energy scale. Our work rebalances the narrative that the Hubbard model supports a single dominant order in relevant parameter regimes towards a picture of extreme competition between stripes and superconductivity.", "method": "", "result": "", "future": "", "summary_zh": "在最多 1024 格点的二维 Hubbard 模型中发现均匀 d 波超导、超导条纹和非超导条纹能量极其接近。", "tier": "Nature Communications/Science Advances/PRX", "tier_reason_en": "A substantial conceptual or methodological advance with cross-community relevance.", "tier_reason_zh": "概念或方法进展较显著，可跨多个研究方向应用。", "relevance_score": 90, "relevance_method": "semantic", "relevance_reason": "By achieving benchmark variational accuracy on large lattices, this work reveals near degeneracy and extreme competition among uniform d-wave superconductivity and stripe orders in the 2D Hubbard model, profoundly clarifying a fundamental a", "feature_candidate": true, "physics_advance": "High-accuracy demonstration of near degeneracy and extreme competition between uniform d-wave superconductivity and stripe orders in the hole-doped 2D Hubbard model", "ai_in_scope": true}, {"id": "arxiv-2610-30502", "arxiv_id": "2610.30502", "type": "arXiv", "journal": "arXiv:2610.30502", "journal_ref": "", "title": "Chiral Cavity Vacua as Local Generators and Probes of Non-Abelian Kitaev Topology", "authors": "Yu Zhang", "corresponding": "", "url": "https://arxiv.org/abs/2610.30502", "topic": "Magnetism", "level": "Feature", "summary_en": "A chiral cavity vacuum is predicted to write and probe local non-Abelian Kitaev topological regions.", "summary": "A chiral cavity vacuum is predicted to write and probe local non-Abelian Kitaev topological regions.", "abstract": "We show how a gyrotropic cavity vacuum generates, probes, and spatially programs non-Abelian topology in the Kitaev honeycomb model. Gauge-consistent virtual-photon elimination produces a universal helicity-odd interaction $\\mathrm{i}[P_x,P_y]$ alongside same-order even dressing. For the leading bond polarization, this commutator is exactly the Kitaev three-spin mass. Mode normalization imposes a thermodynamic constraint: one extended normalized mode gives a local mass that vanishes with sample area, whereas a localized mode writes a finite topological island and a finite mode density enables a bulk mass. The exact Majorana solution yields helicity-reversed Chern gaps and edge propagation, while integrated circular dichroism exactly measures the mass generator, $\\langle\\mathrm{i}[P_x,P_y]\\rangle=-\\sqrt3p^2\\langle O_3\\rangle$. Real-space calculations reveal a non-Abelian island and a helicity wall with two co-propagating Majorana modes. Uniform helicity reversal is a Dirac-mass quench with $n_{\\rm ex}\\proptoτ_Q^{-1}$, whereas moving a wall localizes the gap closing. The equilibrium vacuum kernel contains sum-frequency rather than resonant denominators. These results establish distinct criteria for local and bulk cavity-induced topology.", "method": "", "result": "", "future": "", "summary_zh": "提出用手性腔真空在 Kitaev 蜂窝模型中局域产生、 mal Hall response in fully compensated ferrimagnets.", "abstract": "Magnons offer a charge-neutral channel for spin and heat transport, yet reversible and nonvolatile control of their thermal Hall response poses a fundamental challenge in systems with zero net magnetization. Here, we establish ferroelastic switching as an effective route to manipulate magnonic transverse responses in fully compensated ferrimagnets. A minimal Heisenberg-Dzyaloshinskii-Moriya model reveals that ferroelastic switching can re-orientate the lattice anisotropy, which reconstructs the chirality-resolved magnon bands and Berry curvature distribution. Consequently, the two orthogonal fully compensated ferrimagnetic variants related by [C2||C4z] exhibit magnon thermal Hall responses with opposite signs, whereas the response vanishes in the intermediate altermagnetic phase. First-principles calculations further identify monolayer V2SSe as a promising material candidate for realizing the proposed ferroelastic control of transverse magnon transport. Remarkably, ferroelastic switching drives a dual magnonic-electronic band reconstruction, enabling nonvolatile reversal of the magnon thermal Hall effect while producing anisotropic orbital Hall responses and distinct magneto-optical spectra as complementary transport and optical fingerprints. Our findings establish ferroelasticity as an effective route to nonvolatile magnon control and multichannel state identification in zero net magnetization systems.", "method": "", "result": "", "future": "", "summary_zh": "提出通过铁弹性翻转非易失地反转完全补偿亚铁磁体的磁振子热霍尔信号。", "tier": "PRL", "tier_reason_en": "A clear, testable response or experimentally distinctive mechanism of broad condensed-matter interest.", "tier_reason_zh": "提出清晰可检验的响应或具有代表性的实验机制，具有较广凝聚态意义。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "Reveals ferroelastic switching as a means to control magnon thermal Hall effect and chirality in fully compensated ferrimagnets, a new mechan p Kondo-lattice systems.", "method": "", "result": "", "future": "", "summary_zh": "研究具有能隙能带结构的 Kondo 梯子中相互作用增强的反铁磁关联。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "By demonstrating that electron-electron interactions enhance antiferromagnetic correlations in a narrow-gap Kondo-Hubbard ladder where Fermi-surface approaches fail, this work provides new insight into interaction-driven magnetism beyond co", "feature_candidate": true, "physics_advance": "Discovery that Coulomb interactions enhance antiferromagnetic correlations and magnetic instabilities in narrow-gap Kondo-lattice ladders lacking a Fermi surface", "ai_in_scope": true}, {"id": "arxiv-2610-30929", "arxiv_id": "2610.30929", "type": "arXiv", "journal": "arXiv:2610.30929", "journal_ref": "", "title": "Piezo-Kerr effect in altermagnets and noncollinear antiferromagnets", "authors": "Yuqi Liu, Qiu-Shi Huang, Xinfeng Chen, Yilin Han, Run-Wu Zhang, Zhi-Ming Yu, Yugui Yao", "corresponding": "", "url": "https://arxiv.org/abs/2610.30929", "topic": "Magnetism", "level": "Brief", "summary_en": "Strain activates symmetry-forbidden Kerr rotation in 16 of 122 magnetic point groups, with calculated signals of tens to hundreds of millidegrees.", "summary": "Strain activates symmetry-forbidden Kerr rotation in 16 of 122 magnetic point groups, with calculated signals of tens to hundreds of millidegrees.", "abstract": "Symmetry is usually viewed as a constraint on physical responses, but it can also be used to design the fields that control them. Here, we adopt the representation-matching principle used to identify conjugate fields of order parameters and apply it to response tensors. A linear coupling, the key ingredient for sign-switching control, is symmetry-allowed when a component (or a combination of components) of t ": true}, {"id": "arxiv-2610-31184", "arxiv_id": "2610.31184", "type": "arXiv", "journal": "arXiv:2610.31184", "journal_ref": "", "title": "Anomalous polar chains in halide perovskites", "authors": "Erik Fransson, Apinya Ngoipala, Priyanka Deswal, Ethan Berger, Nicholas C. Bristowe, Paul Erhart, Julia Wiktor", "corresponding": "", "url": "https://arxiv.org/abs/2610.31184", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Molecular dynamics identifies tens-of-nanometers-long, nanosecond-lived polar chains in nominally cubic CsGeBr3.", "summary": "Molecular dynamics identifies tens-of-nanometers-long, nanosecond-lived polar chains in nominally cubic CsGeBr3.", "abstract": "Local polar distortions, their collective ordering, and their field-driven reversal have been studied extensively in ferroelectric perovskites for decades. Here we identify an unusual behavior in the ferroelectric halide perovskite CsGeBr3 using large-scale molecular dynamics with first-principles-trained interatomic potentials. In its nominally cubic phase the Ge off-centering forms one-dimensional polar chains that extend over at least tens of nanometers and relax on nanosecond timescales, four orders of magnitude slower than in BaTiO3 and PbTiO3, with CsSnBr3 in between. The cubic CsGeBr3 phase is a dynamically disordered state in which oppositely polarized chains flip throughout the crystal, and a long-lived one-dimensional local polarization coexists with zero net polarization. A simple three-dimensional perovskite thus hosts long-ranged one-dimensional polar correlations with remarkably slow dynamics. In the ferroelectric phase the same chains set a one-dimensional switching mechanism, in which the polarization reverses chain by chain.", "method": "", "result": "", "future": "", "summary_zh": "模拟发现 CsGeBr₃ 名义立方相中存在寿命很长、长度达数十纳米的一维极化链。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh"
