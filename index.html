 for correlated quantum systems, particularly fermion Hubbard quantum gas microscopy.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31185", "arxiv_id": "2610.31185", "type": "arXiv", "journal": "arXiv:2610.31185", "journal_ref": "", "title": "Realization of a Superleak in a Quantum Gas", "authors": "Wan-Ling Yang, Shao-Bo Liu, Xiang Luo et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.31185", "topic": "Superconductivity", "level": "Brief", "summary_en": "Ultracold quantum gases offer a controllable and microscopically accessible platform for understanding and engineering superfluidity. Yet, realizing a superleak that selectively transports the superfluid while suppressing normal flow has remained elusive. Here, we harness an optical superlattice to realize such a superleak through dynamical selectivity. The superfluid undergoes coherent Josephson ", "summary": "Ultracold quantum gases offer a controllable and microscopically accessible platform for understanding and engineering superfluidity. Yet, realizing a superleak that selectively transports the superfluid while suppressing normal flow has remained elusive. Here, we harness an optical superlattice to realize such a superleak through dynamical selectivity. The superfluid undergoes coherent Josephson ", "abstract": "Ultracold quantum gases offer a controllable and microscopically accessible platform for understanding and engineering superfluidity. Yet, realizing a superleak that selectively transports the superfluid while suppressing normal flow has remained elusive. Here, we harness an optical superlattice to realize such a superleak through dynamical selectivity. The superfluid undergoes coherent Josephson transport, whereas the normal component exhibits slow, thermodynamically limited response, resulting in a flow-rate contrast of 500(49). Exploiting this contrast, we demonstrate repeated filtering of the normal component and dynamical purification of the superfluid, while sustaining coherent driven oscillations for up to 100 cycles. Our results establish a controllable atomic superleak and open possibilities for manipulating transport and thermodynamics in quantum fluids.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2605-26233", "arxiv_id": "2605.26233", "type": "arXiv", "journal": "Phys. Rev. B 114, 194511 (2026)", "journal_ref": "Phys. Rev. B 114, 194511 (2026)", "title": "Slave-boson Formalism for Superconducting Pairing at Strong Coupling", "authors": "Sarbajit Mazumdar, Jonas Issing, Jannis Seufert et al.", "corresponding": "", "url": "https://arxiv.org/abs/2605.26233", "topic": "Superconductivity", "level": "Brief", "summary_en": "We study the emergence of superconductivity in the one-band Hubbard model using the spin-rotation-invariant Kotliar-Ruckenstein slave-boson (SB) approach. Motivated by its intrinsically renormalized mean-field ground state, we construct an effective pairing vertex from dynamical fluctuations about the saddle point. Solving the anisotropic, frequency-dependent gap equation on the square lattice, we", "summary": "We study the emergence of superconductivity in the one-band Hubbard model using the spin-rotation-invariant Kotliar-Ruckenstein slave-boson (SB) approach. Motivated by its intrinsically renormalized mean-field ground state, we construct an effective pairing vertex from dynamical fluctuations about the saddle point. Solving the anisotropic, frequency-dependent gap equation on the square lattice, we", "abstract": "We study the emergence of superconductivity in the one-band Hubbard model using the spin-rotation-invariant Kotliar-Ruckenstein slave-boson (SB) approach. Motivated by its intrinsically renormalized mean-field ground state, we construct an effective pairing vertex from dynamical fluctuations about the saddle point. Solving the anisotropic, frequency-dependent gap equation on the square lattice, we map the pairing instabilities across doping, interaction, temperature and real-frequency gap structure that qualitatively match experimental cuprate observations. This framework merges strong-correlation SB-type renormalizations with RPA-type pairing transparency, providing a scalable route to modeling multi-orbital superconductivity at strong coupling.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2606-10420", "arxiv_id": "2606.10420", "type": "arXiv", "journal": "arXiv:2606.10420", "journal_ref": "", "title": "Superheating field of clean superconductors near the type-I--type-II boundary: the low-temperature Meissner stability limit of niobium", "authors": "Takayuki Kubo", "corresponding": "", "url": "https://arxiv.org/abs/2606.10420", "topic": "Superconductivity", "level": "Brief", "summary_en": "We calculate the low-temperature superheating field $B_{\\rm sh}$ of clean superconductors near the boundary between type-I and type-II superconductivity, with particular emphasis on Nb. Ginzburg--Landau theory is not applicable at low temperatures, while previous microscopic calculations have been limited to either the large-$κ$ regime or the dirty limit. The clean, low-$κ$ regime relevant to Nb h", "summary": "We calculate the low-temperature superheating field $B_{\\rm sh}$ of clean superconductors near the boundary between type-I and type-II superconductivity, with particular emphasis on Nb. Ginzburg--Landau theory is not applicable at low temperatures, while previous microscopic calculations have been limited to either the large-$κ$ regime or the dirty limit. The clean, low-$κ$ regime relevant to Nb h", "abstract": "We calculate the low-temperature superheating field $B_{\\rm sh}$ of clean superconductors near the boundary between type-I and type-II superconductivity, with particular emphasis on Nb. Ginzburg--Landau theory is not applicable at low temperatures, while previous microscopic calculations have been limited to either the large-$κ$ regime or the dirty limit. The clean, low-$κ$ regime relevant to Nb has therefore remained unresolved. We solve the self-consistent nonlinear nonlocal Eilenberger problem for the Meissner state and then analyze its stability against small perturbations. For a Nb-like material with $κ_{\\rm GL}=0.7$, we obtain $B_{\\rm sh}\\simeq 290\\,{\\rm mT}$ at $T/T_c=0.2$, using $B_{c0}\\simeq 200\\,{\\rm mT}$. For a TESLA-shaped Nb accelerator cavity, this corresponds to an intrinsic Meissner-stability limit of about $67\\,{\\rm MV/m}$.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30399", "arxiv_id": "2610.30399", "type": "arXiv", "journal": "arXiv:2610.30399", "journal_ref": "", "title": "Unrestricted Binary Tree State for the Fermionic Hubbard Model", "authors": "Mahroo Mirabdolhagh Hazaveh, Armin Khamoshi, Fei Gao et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30399", "topic": "Superconductivity", "level": "Brief", "summary_en": "Binary tree states have been introduced as compact correlated pair wave functions that improve upon the antisymmetrized geminal power by adding variational flexibility. Here, we extend the binary tree state to the fermionic half-filled Hubbard model using restricted and unrestricted orbitals. Although the ansatz is seniority zero in its optimized pairing basis, its expansion in the original Hubbar", "summary": "Binary tree states have been introduced as compact correlated pair wave functions that improve upon the antisymmetrized geminal power by adding variational flexibility. Here, we extend the binary tree state to the fermionic half-filled Hubbard model using restricted and unrestricted orbitals. Although the ansatz is seniority zero in its optimized pairing basis, its expansion in the original Hubbar", "abstract": "Binary tree states have been introduced as compact correlated pair wave functions that improve upon the antisymmetrized geminal power by adding variational flexibility. Here, we extend the binary tree state to the fermionic half-filled Hubbard model using restricted and unrestricted orbitals. Although the ansatz is seniority zero in its optimized pairing basis, its expansion in the original Hubbard site basis can contain nonzero site- seniority character, while unrestricted orbital optimization provides additional flexibility through independent spin-up and spin-down orbitals. This provides a mechanism for a paired ansatz to describe the singly occupied configurations that dominate the repulsive Hubbard model at large U/t. We find that unrestricted BTS closely approaches optimized DOCI in the repulsive regime, substantially improves upon AGP, and reproduces DOCI density correlations more accurately than pCCD", "method": "", "result": "", "future": ""}, {"id": "arxiv-2609-30346", "arxiv_id": "2609.30346", "type": "arXiv", "journal": "arXiv:2609.30346", "journal_ref": "", "title": "What Becomes of the Antiferromagnetic String When Long Range Neel Order Is Lost? Exact Results", "authors": "Yuri DiMaggio", "corresponding": "", "url": "https://arxiv.org/abs/2609.30346", "topic": "Superconductivity", "level": "Brief", "summary_en": "Early string descriptions of doped antiferromagnets associate hole motion in a locally Néel-ordered background with a path-dependent antiferromagnetic string. We ask what becomes of this mechanism when long range Néel order is lost while short range antiferromagnetic correlations persist. In a singlet bond representation, the underlying basis states do not assign an oriented \\(A/B\\) spin registrat", "summary": "Early string descriptions of doped antiferromagnets associate hole motion in a locally Néel-ordered background with a path-dependent antiferromagnetic string. We ask what becomes of this mechanism when long range Néel order is lost while short range antiferromagnetic correlations persist. In a singlet bond representation, the underlying basis states do not assign an oriented \\(A/B\\) spin registrat", "abstract": "Early string descriptions of doped antiferromagnets associate hole motion in a locally Néel-ordered background with a path-dependent antiferromagnetic string. We ask what becomes of this mechanism when long range Néel order is lost while short range antiferromagnetic correlations persist. In a singlet bond representation, the underlying basis states do not assign an oriented \\(A/B\\) spin registration to each bond. Therefore, any surviving long wavelength antiferromagnetic axis is naturally described as a director, \\(\\mathbf n\\sim-\\mathbf n\\). Long range Néel order can nevertheless provide a global \\(S^2\\) lift of this director field; when that long range registration is lost, non liftable configurations of the \\(RP^2\\) manifold become physically accessible, opening a topologically nontrivial \\(\\mathbb Z_2\\) sector. Its elementary defects are half vortices that globally minimize the \\(RP^2\\) \\(σ\\)-model energy within the nontrivial \\(\\mathbb Z_2\\) sector. An \\textit{a posteriori} energetic comparison further shows that the projective half vortex texture is softer than the corresponding vector reference texture. A pair of half vortices with opposite windings is logarithmically confined, \\(V(R) = κ\\ln\\left(R/r_{\\text{core}}\\right)\\), \\(κ= πρ_s /2\\). The resulting confinement is carried not by a one dimensional string but by an extended two-dimensional spin texture. Thus, the loss of long-range Néel order does not eliminate antiferromagnetic confinement but removes the global Néel lift. This activates a distinct projective mechanism in which a local path dependent string is replaced, at long wavelengths, by a global topological texture with logarithmic confinement.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30375", "arxiv_id": "2610.30375", "type": "arXiv", "journal": "arXiv:2610.30375", "journal_ref": "", "title": "Delta-Doped GeV$^-$ in diamond with isotope resolvable optical spectra", "authors": "Ian N. Hammock, Kinfung Ngan, Antoni W. Wellisz et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30375", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Group IV color centers in diamond -- silicon, germanium, tin, and lead-vacancy centers -- are a promising platform for quantum networking. Typical Group-IV creation utilizes ion implantation during diamond growth that leaves the color centers with a broad depth distribution and damage-induced strain inhomogeneity. Deterministic placement and damage reduction in Group IV generation are essential fo", "summary": "Group IV color centers in diamond -- silicon, germanium, tin, and lead-vacancy centers -- are a promising platform for quantum networking. Typical Group-IV creation utilizes ion implantation during diamond growth that leaves the color centers with a broad depth distribution and damage-induced strain inhomogeneity. Deterministic placement and damage reduction in Group IV generation are essential fo", "abstract": "Group IV color centers in diamond -- silicon, germanium, tin, and lead-vacancy centers -- are a promising platform for quantum networking. Typical Group-IV creation utilizes ion implantation during diamond growth that leaves the color centers with a broad depth distribution and damage-induced strain inhomogeneity. Deterministic placement and damage reduction in Group IV generation are essential for improving this platform. In this letter, we report on the localization of germanium-vacancy (GeV$^-$) to a $<$ 10 nm layer via the timed injection of GeH$_4$ during microwave plasma chemical vapor deposition. In this layer we have realized 17 ppm of Ge and a strain-free environment for the GeV$^-$. Subsequent electron irradiation and annealing have generated a sheet density of 0.12 GeV$^-$/$μ$m$^2$. The minimal damage from color center generation mitigates spectral inhomogeneity and allows spectral resolution of isotopic clusters, with the best cluster having an inhomogeneous distribution of 2.14 GHz and an average linewidth of $47 \\pm 11$ MHz. Our study gives insight into formation dynamics of GeV$^-$ in delta-doped systems and estimates our vacancy to GeV$^-$ yield to be $\\geq$ 90%, establishing an athermal nearest-neighbor formation model. We further characterized the spin $T_2^*$ and set a lower bound of 730 ns, limited by a paramagnetic defect.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30266", "arxiv_id": "2610.30266", "type": "arXiv", "journal": "arXiv:2610.30266", "journal_ref": "", "title": "Discrete time liquids", "authors": "Zuo Wang, Paul M. Schindler, Marin Bukov et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30266", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Discrete time crystals exhibit robust subharmonic oscillations, spontaneously breaking the discrete time-translation symmetry of a periodic drive. Since their emergence, the question of whether other types of temporal many-body order can exist has attracted considerable attention. Here we identify discrete time liquids -- a new form of spatiotemporal order characterized by short-range temporal coh", "summary": "Discrete time crystals exhibit robust subharmonic oscillations, spontaneously breaking the discrete time-translation symmetry of a periodic drive. Since their emergence, the question of whether other types of temporal many-body order can exist has attracted considerable attention. Here we identify discrete time liquids -- a new form of spatiotemporal order characterized by short-range temporal coh", "abstract": "Discrete time crystals exhibit robust subharmonic oscillations, spontaneously breaking the discrete time-translation symmetry of a periodic drive. Since their emergence, the question of whether other types of temporal many-body order can exist has attracted considerable attention. Here we identify discrete time liquids -- a new form of spatiotemporal order characterized by short-range temporal coherence as a result of time-solitons. We study a two-dimensional spin system coupled to a finite-temperature cavity, whose fluctuations provide a noisy, approximately periodic drive with only finite temporal coherence. Remarkably, the spins nevertheless form a metastable state with robust period-doubled dynamics over an extended parameter regime. Unlike a time crystal, this state has only finite temporal coherence: individual trajectories stochastically switch between the two symmetry-related temporal configurations of the period-doubled response. We identify these switches as time-solitons: topological defects in temporal order that preserve local period doubling while destroying long-range temporal coherence, thereby producing the time liquid state. We propose a minimal model which reproduces the distribution of temporal correlations of the many-body system, suggesting a general description of the time liquid as a time crystal with a finite density of time-solitons. Because these solitons can occur at arbitrary times, ensemble averaging restores continuous time-translation symmetry, raising the intriguing possibility that discrete time liquids can exist in thermal equilibrium.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30194", "arxiv_id": "2610.30194", "type": "arXiv", "journal": "arXiv:2610.30194", "journal_ref": "", "title": "Einstein's theory of Brownian motion: The non-Fickian normal diffusion", "authors": "A. Bhattacharyay", "corresponding": "", "url": "https://arxiv.org/abs/2610.30194", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Einstein's theory of diffusion defines what is considered {\\it normal diffusion}. Historically, Einstein considered homogeneous diffusion characterised by a diffusion constant in his original calculations, resulting in what is known as {\\it Fickian} diffusion, which thermally relaxes concentration inhomogeneities. However, in the same derivation of Einstein, the seed of generalisation of the theor", "summary": "Einstein's theory of diffusion defines what is considered {\\it normal diffusion}. Historically, Einstein considered homogeneous diffusion characterised by a diffusion constant in his original calculations, resulting in what is known as {\\it Fickian} diffusion, which thermally relaxes concentration inhomogeneities. However, in the same derivation of Einstein, the seed of generalisation of the theor", "abstract": "Einstein's theory of diffusion defines what is considered {\\it normal diffusion}. Historically, Einstein considered homogeneous diffusion characterised by a diffusion constant in his original calculations, resulting in what is known as {\\it Fickian} diffusion, which thermally relaxes concentration inhomogeneities. However, in the same derivation of Einstein, the seed of generalisation of the theory to {\\it non-Fickian} diffusion in the presence of space-dependent diffusivity is hidden. This indicates that non-Fickian diffusion, which can drive concentration inhomogeneities, can also be normal diffusion. The present article discusses the origin of the {\\it normal} non-Fickian diffusion in Einstein's theory of diffusion.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30733", "arxiv_id": "2610.30733", "type": "arXiv", "journal": "arXiv:2610.30733", "journal_ref": "", "title": "Ferroelastic Reversal Magnon Thermal Hall Effect in a Fully Compensated Ferrimagnet", "authors": "Yingxi Bai, Zihan Chen, Chengwang Niu et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30733", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Magnons offer a charge-neutral channel for spin and heat transport, yet reversible and nonvolatile control of their thermal Hall response poses a fundamental challenge in systems with zero net magnetization. Here, we establish ferroelastic switching as an effective route to manipulate magnonic transverse responses in fully compensated ferrimagnets. A minimal Heisenberg-Dzyaloshinskii-Moriya model ", "summary": "Magnons offer a charge-neutral channel for spin and heat transport, yet reversible and nonvolatile control of their thermal Hall response poses a fundamental challenge in systems with zero net magnetization. Here, we establish ferroelastic switching as an effective route to manipulate magnonic transverse responses in fully compensated ferrimagnets. A minimal Heisenberg-Dzyaloshinskii-Moriya model ", "abstract": "Magnons offer a charge-neutral channel for spin and heat transport, yet reversible and nonvolatile control of their thermal Hall response poses a fundamental challenge in systems with zero net magnetization. Here, we establish ferroelastic switching as an effective route to manipulate magnonic transverse responses in fully compensated ferrimagnets. A minimal Heisenberg-Dzyaloshinskii-Moriya model reveals that ferroelastic switching can re-orientate the lattice anisotropy, which reconstructs the chirality-resolved magnon bands and Berry curvature distribution. Consequently, the two orthogonal fully compensated ferrimagnetic variants related by [C2||C4z] exhibit magnon thermal Hall responses with opposite signs, whereas the response vanishes in the intermediate altermagnetic phase. First-principles calculations further identify monolayer V2SSe as a promising material candidate for realizing the proposed ferroelastic control of transverse magnon transport. Remarkably, ferroelastic switching drives a dual magnonic-electronic band reconstruction, enabling nonvolatile reversal of the magnon thermal Hall effect while producing anisotropic orbital Hall responses and distinct magneto-optical spectra as complementary transport and optical fingerprints. Our findings establish ferroelasticity as an effective route to nonvolatile magnon control and multichannel state identification in zero net magnetization systems.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30536", "arxiv_id": "2610.30536", "type": "arXiv", "journal": "arXiv:2610.30536", "journal_ref": "", "title": "Finite-width altermagnetic quantum rings: angular-channel hybridization and Aharonov--Bohm physics", "authors": "Edilberto O. Silva", "corresponding": "", "url": "https://arxiv.org/abs/2610.30536", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "We study a finite-width two-dimensional quantum ring with a quadratic $d$-wave altermagnetic term, Tan--Inkson confinement, a perpendicular magnetic field, and independently tunable Aharonov--Bohm (AB) flux. The altermagnetic interaction mixes $m$ and $m\\pm2$ angular channels while preserving their parity. Circular symmetry renders the crystal orientation spectrally irrelevant and makes the two sp", "summary": "We study a finite-width two-dimensional quantum ring with a quadratic $d$-wave altermagnetic term, Tan--Inkson confinement, a perpendicular magnetic field, and independently tunable Aharonov--Bohm (AB) flux. The altermagnetic interaction mixes $m$ and $m\\pm2$ angular channels while preserving their parity. Circular symmetry renders the crystal orientation spectrally irrelevant and makes the two sp", "abstract": "We study a finite-width two-dimensional quantum ring with a quadratic $d$-wave altermagnetic term, Tan--Inkson confinement, a perpendicular magnetic field, and independently tunable Aharonov--Bohm (AB) flux. The altermagnetic interaction mixes $m$ and $m\\pm2$ angular channels while preserving their parity. Circular symmetry renders the crystal orientation spectrally irrelevant and makes the two spin blocks exactly isospectral. The resulting same-parity anticrossings are resolved at low filling, and multichannel mixing is found near the Fermi level of highly occupied rings. Independent converged calculations for $N_e=1400$ and $1800$ establish the reconstructed Fermi edge and magnetic response in a finite field window and the persistent current over a full AB flux period. The analytic conventional reference separates radial-subband depopulation (dHvA-type cycles) from finer finite-ring shell oscillations; we do not assign a global Fourier spectrum to unverified altermagnetic field scans. The few-electron thermal response is obtained from an exact fixed-particle-number canonical partition function, avoiding finite-system errors of a fixed-mean-number approximation. The circular model supports an equilibrium charge current but no persistent spin current.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30846", "arxiv_id": "2610.30846", "type": "arXiv", "journal": "arXiv:2610.30846", "journal_ref": "", "title": "Fit-error corrected auxiliary master equation approach for low-temperature nonequilibrium dynamical mean-field theory", "authors": "Sebastian Alois Fuchs, Enrico Arrigoni, Tommaso Maria Mazzocchi", "corresponding": "", "url": "https://arxiv.org/abs/2610.30846", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The auxiliary master equation approach (AMEA) is a nonperturbative impurity solver for steady-state nonequilibrium dynamical mean-field theory (DMFT). It replaces the physical hybridization function by that of a small auxiliary open quantum system, whose parameters are fitted to reproduce it, and then solves the resulting many-body problem essentially exactly. AMEA's accuracy is thus limited by th", "summary": "The auxiliary master equation approach (AMEA) is a nonperturbative impurity solver for steady-state nonequilibrium dynamical mean-field theory (DMFT). It replaces the physical hybridization function by that of a small auxiliary open quantum system, whose parameters are fitted to reproduce it, and then solves the resulting many-body problem essentially exactly. AMEA's accuracy is thus limited by th", "abstract": "The auxiliary master equation approach (AMEA) is a nonperturbative impurity solver for steady-state nonequilibrium dynamical mean-field theory (DMFT). It replaces the physical hybridization function by that of a small auxiliary open quantum system, whose parameters are fitted to reproduce it, and then solves the resulting many-body problem essentially exactly. AMEA's accuracy is thus limited by the quality of this fit: since the fastest-varying part of the hybridization is set by the distribution function, whose Fermi edges sharpen at low temperature, the fit tends to overestimate the temperature, especially for weak reservoir coupling. For the auxiliary hybridization itself, however, AMEA's self-energy is essentially exact. We correct for the fit error by estimating, via an approximate solver applicable to arbitrary hybridization functions, the ratio between the self-energies of the physical and auxiliary hybridizations, and using it to extend AMEA's self-energy from the auxiliary to the physical case. This fit-error correction becomes exact whenever either the fit or the approximate solver is exact. We benchmark the scheme using the nonequilibrium Kajueter-Kotliar iterated perturbation theory (IPT), generalized here to spin-polarized solutions, as the approximate solver; other approximate solvers, such as the noncrossing approximation, can be used as well. Applied to an Anderson impurity model with a spin-polarized bath, and within DMFT to a Hubbard layer weakly coupled to two metallic reservoirs, the correction largely removes the spurious heating from the AMEA fit and from insufficient thermalization by the reservoirs, while preserving the correct description of the Mott insulator, which IPT alone cannot fully recover.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-29729", "arxiv_id": "2610.29729", "type": "arXiv", "journal": "arXiv:2610.29729", "journal_ref": "", "title": "Intertwined complex orbital order and ferrimagnetism in honeycomb molybdate Fe$_2$Mo$_3$O$_8$", "authors": "Hong-Hao Song, Gang v. Chen", "corresponding": "", "url": "https://arxiv.org/abs/2610.29729", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Motivated by the recent experimental interest in honeycomb molybdates A$_2$Mo$_3$O$_8$, we return and develop the minimal models to capture the essential physics for Fe$_2$Mo$_3$O$_8$. It is pointed out that, the magnetism in these materials arises from the mutual induction between the spin-orbit coupling of the tetrahedral sublattice with active orbitals and the superexchange with the spins from ", "summary": "Motivated by the recent experimental interest in honeycomb molybdates A$_2$Mo$_3$O$_8$, we return and develop the minimal models to capture the essential physics for Fe$_2$Mo$_3$O$_8$. It is pointed out that, the magnetism in these materials arises from the mutual induction between the spin-orbit coupling of the tetrahedral sublattice with active orbitals and the superexchange with the spins from ", "abstract": "Motivated by the recent experimental interest in honeycomb molybdates A$_2$Mo$_3$O$_8$, we return and develop the minimal models to capture the essential physics for Fe$_2$Mo$_3$O$_8$. It is pointed out that, the magnetism in these materials arises from the mutual induction between the spin-orbit coupling of the tetrahedral sublattice with active orbitals and the superexchange with the spins from the octahedral sublattice. Essentially, the superexchange between the tetrahedral and octahedral sublattices directly drives the ferrimagnetism, and the residual spin-orbit coupling on the tetrahedral sublattice induces the complex orbital order. The hybrid magnon-phonon excitations are further explored together with their resulting Berry curvatures and thermal Hall effect. We discuss the experimental relevance with Fe$_2$Mo$_3$O$_8$, and the framework can be extended to FeNiMo$_3$O$_8$, Ni$_2$Mo$_3$O$_8$ and other isostructural magnets.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31507", "arxiv_id": "2610.31507", "type": "arXiv", "journal": "arXiv:2610.31507", "journal_ref": "", "title": "Macroscopic Nuclear Resonance Energy Transfer Mediated by Coherent Magnons", "authors": "Ryan Weed", "corresponding": "", "url": "https://arxiv.org/abs/2610.31507", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Phonon-mediated nuclear Resonance Energy Transfer (RET) in metal deuterides is severely constrained by inertial rest-mass dilution, lattice fracture limits, and thermal nuclear spin cancellation. Extending the generalized nuclear Dicke model to Ferromagnetic Resonance (FMR) magnons eliminates mass dilution via hyperfine-amplified M1 coupling while unlocking relativistic Dirac M2 coupling via Overh", "summary": "Phonon-mediated nuclear Resonance Energy Transfer (RET) in metal deuterides is severely constrained by inertial rest-mass dilution, lattice fracture limits, and thermal nuclear spin cancellation. Extending the generalized nuclear Dicke model to Ferromagnetic Resonance (FMR) magnons eliminates mass dilution via hyperfine-amplified M1 coupling while unlocking relativistic Dirac M2 coupling via Overh", "abstract": "Phonon-mediated nuclear Resonance Energy Transfer (RET) in metal deuterides is severely constrained by inertial rest-mass dilution, lattice fracture limits, and thermal nuclear spin cancellation. Extending the generalized nuclear Dicke model to Ferromagnetic Resonance (FMR) magnons eliminates mass dilution via hyperfine-amplified M1 coupling while unlocking relativistic Dirac M2 coupling via Overhauser spin polarization. We derive a Suhl-clamped FMR scaling law predicting 14.2 MeV (Pd-106) and 11.4 MeV (Ni-58) breakup neutrons, 19.9 MeV alpha particles, and reconciled sub-keV fusion anomalies.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30457", "arxiv_id": "2610.30457", "type": "arXiv", "journal": "arXiv:2610.30457", "journal_ref": "", "title": "Memory--Transport Competition in Physical Two-Bath Quantum Reset Dynamics", "authors": "Jishad Kumar, Achilleas Lazarides, Tapio Ala-Nissila", "corresponding": "", "url": "https://arxiv.org/abs/2610.30457", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Coherence preservation and environmental renewal offer competing ways of controlling quantum memory and transport. We show that a seemingly natural protocol which exactly replaces the bath occupations while preserving arbitrary system--bath coherences need not correspond to a physical fermionic state. We instead construct a two-reservoir protocol with independent, number-conserving thermal attenua", "summary": "Coherence preservation and environmental renewal offer competing ways of controlling quantum memory and transport. We show that a seemingly natural protocol which exactly replaces the bath occupations while preserving arbitrary system--bath coherences need not correspond to a physical fermionic state. We instead construct a two-reservoir protocol with independent, number-conserving thermal attenua", "abstract": "Coherence preservation and environmental renewal offer competing ways of controlling quantum memory and transport. We show that a seemingly natural protocol which exactly replaces the bath occupations while preserving arbitrary system--bath coherences need not correspond to a physical fermionic state. We instead construct a two-reservoir protocol with independent, number-conserving thermal attenuators, for which complete positivity and fermionic admissibility hold by construction. Physical attenuation necessarily modifies bath populations as well as cross correlations; the coherence control is not an independent hard-reset knob. Quadratic dynamics reduces the stroboscopic problem to an exact matrix fixed-point equation without a weak-coupling or Markov approximation. Analytically, coherence retention enhances the leading short-cycle transfer rate, including the complete-erasure limit; no general endpoint-vanishing theorem exists. An exact stationary continuity theorem forces the through-current to vanish whenever either reservoir is left entirely unrefreshed, although no analogous theorem suppresses it at complete erasure. For biased structured reservoirs, exact finite-chain calculations display distinct coherence-, current-, and signed energy-transfer operating points; a resolved high-retention boundary layer exposes strong finite-size sensitivity of the coherence peak. The model provides a microscopic, fermion-admissible benchmark for the interplay of reservoir coherence, particle transport, and energetic exchange.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2507-16373", "arxiv_id": "2507.16373", "type": "arXiv", "journal": "arXiv:2507.16373", "journal_ref": "", "title": "Meta-learning of Gibbs states for many-body Hamiltonians with applications to Quantum Boltzmann Machines", "authors": "Ruchira V Bhat, Rahul Bhowmick, Avinash Singh et al.", "corresponding": "", "url": "https://arxiv.org/abs/2507.16373", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The preparation of quantum Gibbs states is a fundamental challenge in quantum computing, essential for applications ranging from modeling open quantum systems to quantum machine learning. Building on the Meta-Variational Quantum Eigensolver framework proposed by Cervera-Lierta et al. and a problem-driven ansatz design, we introduce two meta-learning algorithms: Meta-Variational Quantum Thermalizer", "summary": "The preparation of quantum Gibbs states is a fundamental challenge in quantum computing, essential for applications ranging from modeling open quantum systems to quantum machine learning. Building on the Meta-Variational Quantum Eigensolver framework proposed by Cervera-Lierta et al. and a problem-driven ansatz design, we introduce two meta-learning algorithms: Meta-Variational Quantum Thermalizer", "abstract": "The preparation of quantum Gibbs states is a fundamental challenge in quantum computing, essential for applications ranging from modeling open quantum systems to quantum machine learning. Building on the Meta-Variational Quantum Eigensolver framework proposed by Cervera-Lierta et al. and a problem-driven ansatz design, we introduce two meta-learning algorithms: Meta-Variational Quantum Thermalizer (Meta-VQT) and Neural Network Meta-VQT (NN-Meta VQT) for efficient thermal state preparation of parametrized Hamiltonians on Noisy Intermediate-Scale Quantum (NISQ) devices. Meta-VQT utilizes a fully quantum ansatz, while NN Meta-VQT integrates a quantum--classical hybrid architecture. Both use collective optimization over a finite set of training parameter values to prepare approximate Gibbs states at held-out parameter values within the sampled parameter domain. We validate our methods on Transverse Field Ising Models (TFIM) with up to eight qubits and on a two-qubit Heisenberg model with all field terms. Within these finite-size benchmarks, the trained models accurately prepare thermal states at test points inside the training interval. For the six and eight qubit cases of TFIM, meta-learned parameters when combined with appropriately designed ansatz serve as warm-start initializations, significantly outperforming random initializations in the optimization tasks. Furthermore, a 3 qubit Kitaev ring example showcases our algorithm's effectiveness across finite-temperature crossover regimes. Finally, we apply our algorithms to train a Quantum Boltzmann Machine (QBM) on a 2-qubit Heisenberg model with all field terms, achieving enhanced training efficiency, improved Gibbs state accuracy, and a 30-fold runtime speedup over existing techniques such as variational quantum imaginary time (VarQITE)-based QBM highlighting the practicality of meta-algorithm-based QBMs.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31580", "arxiv_id": "2610.31580", "type": "arXiv", "journal": "arXiv:2610.31580", "journal_ref": "", "title": "Mixed State Deep Thermalization under Generic Quantum Errors", "authors": "Xie-Hang Yu, Pavel Kos", "corresponding": "", "url": "https://arxiv.org/abs/2610.31580", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Pure-state deep thermalization predicts that, after sufficient scrambling, projected ensembles approach universal distributions that contain information beyond the reduced density matrix. In realistic quantum systems, however, noise is unavoidable and the projected states are generally mixed. Whether mixed-state deep thermalization admits an analogous universal limiting distribution has remained u", "summary": "Pure-state deep thermalization predicts that, after sufficient scrambling, projected ensembles approach universal distributions that contain information beyond the reduced density matrix. In realistic quantum systems, however, noise is unavoidable and the projected states are generally mixed. Whether mixed-state deep thermalization admits an analogous universal limiting distribution has remained u", "abstract": "Pure-state deep thermalization predicts that, after sufficient scrambling, projected ensembles approach universal distributions that contain information beyond the reduced density matrix. In realistic quantum systems, however, noise is unavoidable and the projected states are generally mixed. Whether mixed-state deep thermalization admits an analogous universal limiting distribution has remained unclear. Here we answer this question for quantum dynamics containing local quantum channels, i.e., errors. We show that the late-time mixed-state projected ensemble is completely determined by the normalized Choi state of the error channel and is universal, independent of the microscopic details of the underlying unitary dynamics. We establish this result analytically for dual-unitary circuits, global Haar-random dynamics, and local Haar-random circuits at large local dimension, and verify it numerically in qubit circuits and kicked Ising dynamics. In a solvable setting, we further find exponentially fast convergence to the limiting ensemble. Our results extend deep thermalization to noisy quantum dynamics and establish a direct correspondence between quantum errors and universal random mixed-state ensembles.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31084", "arxiv_id": "2610.31084", "type": "arXiv", "journal": "arXiv:2610.31084", "journal_ref": "", "title": "Nitrogen vacancy cluster-mediated ferroelectric domain growth in wurtzite AlN", "authors": "Zijian Zhou, Kan-Hao Xue, Ziqi Pang et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.31084", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Aluminum nitride-based ferroelectrics combine high remanent polarization, thermal stability, weak size effects, a wide bandgap and back-end process compatibility, making them promising for high density non-volatile memory. However, their high coercive field ($E_\\mathrm{c}$) and unclear polarization switching mechanism limit further applications. Theoretical predictions indicate preferential revers", "summary": "Aluminum nitride-based ferroelectrics combine high remanent polarization, thermal stability, weak size effects, a wide bandgap and back-end process compatibility, making them promising for high density non-volatile memory. However, their high coercive field ($E_\\mathrm{c}$) and unclear polarization switching mechanism limit further applications. Theoretical predictions indicate preferential revers", "abstract": "Aluminum nitride-based ferroelectrics combine high remanent polarization, thermal stability, weak size effects, a wide bandgap and back-end process compatibility, making them promising for high density non-volatile memory. However, their high coercive field ($E_\\mathrm{c}$) and unclear polarization switching mechanism limit further applications. Theoretical predictions indicate preferential reversed domain growth along the polar axis, whereas experiments show nearly isotropic growth or preferential growth perpendicular to this axis. Here, we combine density functional theory, Deep Potential molecular dynamics and experimental characterization to determine how nitrogen vacancies ($V_\\mathrm{N}$) regulate domain growth and $E_\\mathrm{c}$. In ideal crystal, strong lattice coupling along the polar axis drives preferential domain growth in this direction. $V_\\mathrm{N}$ locally weakens this coupling and promotes polarization nucleation. The spatial distribution of $V_\\mathrm{N}$ and the temporal sequence of vacancy induced switching jointly determine the direction and morphology of reversed domain growth. We further show that scandium doping promotes $V_\\mathrm{N}$ formation, thereby enhancing defect mediated nucleation and reducing $E_\\mathrm{c}$. These findings establish a multiscale mechanism governing thin-film domain-growth kinetics and macroscopic $E_\\mathrm{c}$, reconciling experimental observations with ideal crystal simulations and providing defect engineering principles for low-voltage, reliable and scalable ferroelectric devices.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30301", "arxiv_id": "2610.30301", "type": "arXiv", "journal": "arXiv:2610.30301", "journal_ref": "", "title": "Non-adiabatic Optimisation via Localisation-Delocalisation Transitions", "authors": "Ryan Smith, Sabrina Yue Wang, Filippo Maria Gambetta et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30301", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The promise of efficiently solving classical optimisation problems on quantum computers is tantalizing. As many such problems can be mapped to approximating the ground state of spin-glasses, paradigmatic models for studying many-body localisation, it is natural to ask if some of the intuition coming from quantum statistical mechanics can help guide the construction of novel quantum optimisation al", "summary": "The promise of efficiently solving classical optimisation problems on quantum computers is tantalizing. As many such problems can be mapped to approximating the ground state of spin-glasses, paradigmatic models for studying many-body localisation, it is natural to ask if some of the intuition coming from quantum statistical mechanics can help guide the construction of novel quantum optimisation al", "abstract": "The promise of efficiently solving classical optimisation problems on quantum computers is tantalizing. As many such problems can be mapped to approximating the ground state of spin-glasses, paradigmatic models for studying many-body localisation, it is natural to ask if some of the intuition coming from quantum statistical mechanics can help guide the construction of novel quantum optimisation algorithms. In this work, we discuss how continuous reverse quantum annealing crossing a many-body localisation transition can be accelerated by considering the density of Landau-Zener crossings as the system is quenched. We provide an interpretation of this behaviour in terms of an effective Fokker-Planck equation for the success probability of the algorithm. This interpretation suggests an improvement in the required annealing time as a function of the system size $N$, which goes from $\\mathcal{O}({\\rm poly}(N))$ to $\\mathcal{O}(1)$ for reference states with non-vanishing energy density. We show that the continuous dynamics can be Trotterised with a number of steps that remains modest as system size increases, making it appealing for near-term devices. For the resulting circuit implementation, we provide a quantitative strategy for determining the parameters of the time-dependent Hamiltonian. We compare the performance of our digitised algorithm, which we call FRIO, against that of the QAOA for finding the ground state of spin-glass problems, in particular the SK model. The numerical results suggest that with suitably selected circuit parameters which can be efficiently found using thermalizing dynamics, FRIO almost always outperforms the conventional QAOA ansatz with pre-optimized angles.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31564", "arxiv_id": "2610.31564", "type": "arXiv", "journal": "arXiv:2610.31564", "journal_ref": "", "title": "Occupancy Driven Phase Transitions in Gapped Systems", "authors": "Ian Madden, Alex Kociubinski, Wouter Montfrooij", "corresponding": "", "url": "https://arxiv.org/abs/2610.31564", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Systems characterized by an energy gap between the ground state and excited states support a growing number of thermal excitations upon raising the temperature. Provided these excitations interact with each other, their number affects the size of the energy gap akin to a harmonic oscillator where the oscillation frequency is damping dependent. Here we show that once a critical number of excitation", "summary": "Systems characterized by an energy gap between the ground state and excited states support a growing number of thermal excitations upon raising the temperature. Provided these excitations interact with each other, their number affects the size of the energy gap akin to a harmonic oscillator where the oscillation frequency is damping dependent. Here we show that once a critical number of excitation", "abstract": "Systems characterized by an energy gap between the ground state and excited states support a growing number of thermal excitations upon raising the temperature. Provided these excitations interact with each other, their number affects the size of the energy gap akin to a harmonic oscillator where the oscillation frequency is damping dependent. Here we show that once a critical number of excitations is reached, the excitation population becomes thermodynamically unstable and the system transitions between two states. This transition is marked by a divergence in the specific heat, which does not have to be accompanied by an order parameter, nor by the full closure of the gap. We illustrate the thermodynamics using a simple two level system and superfluid $^4$He as examples, and we argue that the hidden order transition in URu$_2$Si$_2$ is an example of such an occupancy driven transition in the absence of an order parameter.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2511-22899", "arxiv_id": "2511.22899", "type": "arXiv", "journal": "arXiv:2511.22899", "journal_ref": "", "title": "Order-Disorder in Fe-Si Alloys: Implications for Seismic and Transport Properties of Earth's Inner Core", "authors": "Cong Liu, Xin Deng, R. E. Cohen", "corresponding": "", "url": "https://arxiv.org/abs/2511.22899", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Understanding the structure and dynamics of Earth's inner core is essential for constraining its composition, thermal evolution, and seismic behavior. Silicon is widely considered a major light element in the core. Here, we use first-principles molecular dynamics and thermodynamic modeling to investigate the structural, elastic, and transport properties of iron-silicon (Fe-Si) alloys under inner-c", "summary": "Understanding the structure and dynamics of Earth's inner core is essential for constraining its composition, thermal evolution, and seismic behavior. Silicon is widely considered a major light element in the core. Here, we use first-principles molecular dynamics and thermodynamic modeling to investigate the structural, elastic, and transport properties of iron-silicon (Fe-Si) alloys under inner-c", "abstract": "Understanding the structure and dynamics of Earth's inner core is essential for constraining its composition, thermal evolution, and seismic behavior. Silicon is widely considered a major light element in the core. Here, we use first-principles molecular dynamics and thermodynamic modeling to investigate the structural, elastic, and transport properties of iron-silicon (Fe-Si) alloys under inner-core conditions. By computing the Gibbs free energies of multiple solid phases, including ordered B2, hexagonal close-packed (hcp), face-centered cubic (fcc), and body-centered cubic (bcc) Fe-Si, we construct a phase diagram relevant to inner-core pressures and temperatures. We identify a pronounced miscibility gap between hcp and cubic Fe--Si phases, with phase coexistence over approximately 6--11 wt\\% Si at 6000 K. The cubic phase exhibits a strong order-dependent elastic response, with disordered bcc showing a large intrinsic shear anisotropy (22.9\\% at 6000 K), in contrast to the nearly isotropic hcp phase (0.6\\%). Meanwhile, disordered bcc Fe--Si produces shear wave velocities ($V_S=3.73$ km$\\cdot$s$^{-1}$) and Poisson's ratios comparable with seismological constraints. In addition, disordered bcc Fe--Si exhibits a lower thermal conductivity than hcp Fe--Si, providing a quantitative constraint on phase-dependent electronic heat transport. These results demonstrate that chemical ordering strongly controls the stability and physical properties of cubic Fe--Si alloys, and suggest that metastable or localized cubic Fe--Si phases may contribute to the structural and transport complexity of Earth's inner core.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30555", "arxiv_id": "2610.30555", "type": "arXiv", "journal": "arXiv:2610.30555", "journal_ref": "", "title": "Probing quasiperiodic spectral accessibility with a finite-rate quantum Otto cycle", "authors": "Shujie Cheng, Lucas C. Céleri, Norton G. de Almeida et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30555", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Quasiperiodic systems combine sharply different spectral and localisation regimes with a dense hierarchy of dynamical time scales. We show that a finite-rate quantum Otto cycle can use this structure as a thermodynamic probe, revealing which parts of the spectrum become dynamically accessible and thermodynamically relevant during a driven transformation. For a generalised Aubry-André-Harper chain,", "summary": "Quasiperiodic systems combine sharply different spectral and localisation regimes with a dense hierarchy of dynamical time scales. We show that a finite-rate quantum Otto cycle can use this structure as a thermodynamic probe, revealing which parts of the spectrum become dynamically accessible and thermodynamically relevant during a driven transformation. For a generalised Aubry-André-Harper chain,", "abstract": "Quasiperiodic systems combine sharply different spectral and localisation regimes with a dense hierarchy of dynamical time scales. We show that a finite-rate quantum Otto cycle can use this structure as a thermodynamic probe, revealing which parts of the spectrum become dynamically accessible and thermodynamically relevant during a driven transformation. For a generalised Aubry-André-Harper chain, the resulting response is not determined by the static quasiperiodic regime alone: extended, near-critical, and crossing protocols do not exhibit universal ordering of work fluctuations. Instead, the statistics reflect transition pathways that are simultaneously dynamically coupled, thermally occupied, and energetically significant. The same spectral accessibility separates thermodynamic recovery from microscopic adiabatic recovery. Positive mean work can reappear while the population transfer dynamics remain strongly nonadiabatic because finite-rate population transfer is redistributed toward energetically less costly channels rather than suppressed. The full work distribution reveals a further separation, with a finite rate window in which positive-work cycles form a majority although the mean work remains negative. This behaviour persists in finite-size analysis. A thermally weighted spectral susceptibility connects these effects to a distributed hierarchy of dynamically active spectral regions rather than to a single minimum-gap bottleneck. Finite thermal contacts preserve this picture while introducing a second time scale and intercycle memory. Quantum Otto cycles can therefore provide a fluctuation-resolved thermodynamic probe of quasiperiodic spectral accessibility, complementary to direct spectroscopic and eigenstate-resolved diagnostics.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2506-21318", "arxiv_id": "2506.21318", "type": "arXiv", "journal": "arXiv:2506.21318", "journal_ref": "", "title": "Quantum thermal state preparation for near-term quantum processors", "authors": "Jerome Lloyd, Dmitry A. Abanin", "corresponding": "", "url": "https://arxiv.org/abs/2506.21318", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Preparation of quantum thermal states of many-body systems is a key computational challenge for quantum processors, with applications in physics, chemistry, and classical optimization. We provide a simple and efficient algorithm for thermal state preparation, combining engineered bath resetting and modulated system-bath coupling to derive a quantum channel approximately satisfying quantum detailed", "summary": "Preparation of quantum thermal states of many-body systems is a key computational challenge for quantum processors, with applications in physics, chemistry, and classical optimization. We provide a simple and efficient algorithm for thermal state preparation, combining engineered bath resetting and modulated system-bath coupling to derive a quantum channel approximately satisfying quantum detailed", "abstract": "Preparation of quantum thermal states of many-body systems is a key computational challenge for quantum processors, with applications in physics, chemistry, and classical optimization. We provide a simple and efficient algorithm for thermal state preparation, combining engineered bath resetting and modulated system-bath coupling to derive a quantum channel approximately satisfying quantum detailed balance relations. We show that the fixed point $\\hatσ$ of the channel approximates the Gibbs state as $\\|\\hatσ-\\hatσ_β\\|\\sim θ^2$, where $θ$ is the system-bath coupling and $\\hatσ_β\\propto e^{-β\\hat H_S}$. We provide extensive numerics, for the example of the 2D Quantum Ising model, confirming that the protocol successfully prepares the thermal state throughout the finite-temperature phase diagram, including near the quantum phase transition. Simulations for free-fermion systems provide further evidence for the accuracy of the protocol for large system sizes in the weak-coupling limit. Our algorithm provides a path to efficient quantum simulation of quantum-correlated states at finite temperature with current and near-term quantum processors.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30172", "arxiv_id": "2610.30172", "type": "arXiv", "journal": "arXiv:2610.30172", "journal_ref": "", "title": "Resonant-pair energy return beyond the early Green-Kubo plateau in a quartic chain", "authors": "Julian Olszewski, Zijian Liu, Jie Xu", "corresponding": "", "url": "https://arxiv.org/abs/2610.30172", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Distinguishing rapid local energy exchange from sustained transport matters when thermal conductivity is inferred from finite simulations. In a weakly coupled chain of separable quartic oscillators, we identify a quantitative mechanism that changes an early Green--Kubo plateau: resonant neighbors exchange energy and coherently return it. The pair heat-current integral maps to the classical pendulu", "summary": "Distinguishing rapid local energy exchange from sustained transport matters when thermal conductivity is inferred from finite simulations. In a weakly coupled chain of separable quartic oscillators, we identify a quantitative mechanism that changes an early Green--Kubo plateau: resonant neighbors exchange energy and coherently return it. The pair heat-current integral maps to the classical pendulu", "abstract": "Distinguishing rapid local energy exchange from sustained transport matters when thermal conductivity is inferred from finite simulations. In a weakly coupled chain of separable quartic oscillators, we identify a quantitative mechanism that changes an early Green--Kubo plateau: resonant neighbors exchange energy and coherently return it. The pair heat-current integral maps to the classical pendulum trapping response. Quartic homogeneity gives an energy-independent reference period $T_{\\rm lib}=7.77ε^{-1/2}$, where $ε$ is the coupling. Without fitted parameters, the leading response predicts a negative first minimum at $0.952T_{\\rm lib}$ with depth $-0.74$ times the independent-cell exchange coefficient. Isolated-pair simulations test this reference and resolve finite-coupling corrections. The chain reaches its first minimum on the same time scale, with a shallower minimum and a small later residual. Comparisons with chaotic cells and energy-conserving noise show regimes in which coherent return is absent or interrupted over the measured windows. These finite-time results provide a quantitative reference for separating the early exchange plateau from subsequent correlated dynamics.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2605-03011", "arxiv_id": "2605.03011", "type": "arXiv", "journal": "Phys. Rev. A 114, 042445 (2026)", "journal_ref": "Phys. Rev. A 114, 042445 (2026)", "title": "Rigorous error bounds for dissipative thermal state preparation from weak system-bath coupling", "authors": "Christopher Ong, S. A. Parameswaran, Benedikt Placke et al.", "corresponding": "", "url": "https://arxiv.org/abs/2605.03011", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Thermal state preparation is a central challenge in the simulation of quantum many-body systems. Yet, provably efficient algorithms for this task were only introduced recently [Chen et al. Nature 646, 561 (2025)]. These algorithms are based on dissipative Lindbladian evolution which exactly fixes the thermal state. Controlled and efficient digital simulation of this evolution, although possible in", "summary": "Thermal state preparation is a central challenge in the simulation of quantum many-body systems. Yet, provably efficient algorithms for this task were only introduced recently [Chen et al. Nature 646, 561 (2025)]. These algorithms are based on dissipative Lindbladian evolution which exactly fixes the thermal state. Controlled and efficient digital simulation of this evolution, although possible in", "abstract": "Thermal state preparation is a central challenge in the simulation of quantum many-body systems. Yet, provably efficient algorithms for this task were only introduced recently [Chen et al. Nature 646, 561 (2025)]. These algorithms are based on dissipative Lindbladian evolution which exactly fixes the thermal state. Controlled and efficient digital simulation of this evolution, although possible in principle, remains out of reach for present-day quantum hardware. Subsequent work has therefore focused on analog approximations of the proposed Lindbladians via `collision models' with relatively modest requirements -- a resettable bath of ancilla qubits whose couplings to the system can be tuned in time-dependent fashion -- while still admitting rigorous fixed-point error bounds. Existing rigorous approaches, however, do not exploit the fact that these constructions generically implement not only the desired Lindblad dynamics, but also an additional unitary evolution generated by the system Hamiltonian which may aid convergence to the thermal state [Lloyd and Abanin arXiv:2506.21318 (2025)]. Here, we show that this unitary contribution does indeed tighten the fixed-point error bound and demonstrate that it is rigorously controlled by the system-bath coupling strength $J$, scaling as $J^2$. This demonstrates that the effect of the spurious `Lamb shift' term generated by the system-bath interaction can be controlled by tuning $J$. We clarify the role, previously observed, of a randomized implementation in suppressing possible resonances of the drive with the many-body spectrum, and bound the additional variance that this randomization imposes on observables. Finally, we numerically study aspects of the protocol which are relevant for its practical realization, such as the mixing time.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31591", "arxiv_id": "2610.31591", "type": "arXiv", "journal": "arXiv:2610.31591", "journal_ref": "", "title": "Screening strongly correlated materials in solid oxide cells with quantum simulation", "authors": "Ouns El Harzli, Jelle Bor, Linde Wester et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.31591", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "We develop an end-to-end framework for assessing a quantum-computing application in industrial materials science: the screening of strongly correlated oxygen-electrode materials for SOFCs and SOECs. We formulate the materials problem in terms of interface observables including oxygen-vacancy formation energies, vacancy migration barriers, and electronic conductivity. We describe how these observab", "summary": "We develop an end-to-end framework for assessing a quantum-computing application in industrial materials science: the screening of strongly correlated oxygen-electrode materials for SOFCs and SOECs. We formulate the materials problem in terms of interface observables including oxygen-vacancy formation energies, vacancy migration barriers, and electronic conductivity. We describe how these observab", "abstract": "We develop an end-to-end framework for assessing a quantum-computing application in industrial materials science: the screening of strongly correlated oxygen-electrode materials for SOFCs and SOECs. We formulate the materials problem in terms of interface observables including oxygen-vacancy formation energies, vacancy migration barriers, and electronic conductivity. We describe how these observables can be obtained using a diagrammatic GW-based embedding, either GW+DMFT or self-energy embedding theory (SEET), applied to a DFT-screened shortlist. The atomistic electrode/electrolyte interface defines the electronic structure problem from which the correlated impurity models are constructed. Quantum impurity solvers would provide the finite-temperature impurity Green's functions required by the embedding. The computational challenges that classical solvers may encounter as the interacting active space grows, together with the polynomial scaling of quantum Hamiltonian simulation for efficiently represented discretized models, open an opportunity for quantum advantage. We identify the benchmarks needed to assess this opportunity through convergence of vacancy and migration energetics and comparison with the best applicable classical solvers. We provide illustrative logical qubit counts and identify the thermal state preparation, simulation, measurement, and repeated-solve costs needed for a complete resource assessment. We connect microscopic observables to macroscopic engineering metrics using a continuum model for mixed ionic--electronic conducting oxygen electrodes that couples oxygen surface exchange, solid-state oxygen transport, electrode microstructure, and finite electrode thickness. Finally, we estimate the potential worldwide business value of improved electrode materials under SOFC and SOEC deployment scenarios informed by public technical targets and electrolyser deployment data.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2609-29472", "arxiv_id": "2609.29472", "type": "arXiv", "journal": "Phys. Rev. Lett. 137, 176901 (2026)", "journal_ref": "Phys. Rev. Lett. 137, 176901 (2026)", "title": "Selective strain tuning of nonequilibrium multiferroic dynamics in BiFeO$_\\text3$", "authors": "Chenhang Xu, Patrick Liu, Bo Zhang et al.", "corresponding": "", "url": "https://arxiv.org/abs/2609.29472", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Quantum materials are characterized by intertwined orders, and a fundamental goal in condensed matter physics is to achieve their selective control in such a way that one order parameter can be tuned while leaving others largely unaffected. Although significant progress has been made in thermal equilibrium, realizing such control out of equilibrium remains highly challenging. Here we employed in-s", "summary": "Quantum materials are characterized by intertwined orders, and a fundamental goal in condensed matter physics is to achieve their selective control in such a way that one order parameter can be tuned while leaving others largely unaffected. Although significant progress has been made in thermal equilibrium, realizing such control out of equilibrium remains highly challenging. Here we employed in-s", "abstract": "Quantum materials are characterized by intertwined orders, and a fundamental goal in condensed matter physics is to achieve their selective control in such a way that one order parameter can be tuned while leaving others largely unaffected. Although significant progress has been made in thermal equilibrium, realizing such control out of equilibrium remains highly challenging. Here we employed in-situ tensile strain to selectively manipulate the photoinduced lattice dynamics associated with ferroelectric and magnetic orders in multiferroic BiFeO$_3$. By applying MeV ultrafast electron diffraction to freestanding BiFeO$_3$ membranes under tunable strain, we showed that tensile strain markedly suppresses the ultrafast photoinduced reduction of the ferroelectric displacement. By contrast, the photoinduced dynamics of the antiferrodistortive rotation of the oxygen octahedra, which modulates the magnetic order, remains insensitive to strain. Not only do these findings reveal distinct microscopic pathways underlying nonequilibrium multiferroic dynamics, they also establish tunable strain as an effective route for engineering ultrafast phase control in correlated materials.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30419", "arxiv_id": "2610.30419", "type": "arXiv", "journal": "arXiv:2610.30419", "journal_ref": "", "title": "Spin polarization in a chiral ladder: elastic and inelastic environments", "authors": "D. T. Verrilli H., Jorge Cardenas-Gamboa, Mayra Peralta et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30419", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "We study how the transport window and environmental reinjection determine the spin polarization transmitted through a minimal two-leg chiral ladder. The model contains time-reversal-invariant helical spin--orbit coupling, spin-independent interchain hopping, and nonmagnetic contacts with two orbital modes per lead. Sublattice symmetry makes the coherent spin-transmission kernel exactly odd in ener", "summary": "We study how the transport window and environmental reinjection determine the spin polarization transmitted through a minimal two-leg chiral ladder. The model contains time-reversal-invariant helical spin--orbit coupling, spin-independent interchain hopping, and nonmagnetic contacts with two orbital modes per lead. Sublattice symmetry makes the coherent spin-transmission kernel exactly odd in ener", "abstract": "We study how the transport window and environmental reinjection determine the spin polarization transmitted through a minimal two-leg chiral ladder. The model contains time-reversal-invariant helical spin--orbit coupling, spin-independent interchain hopping, and nonmagnetic contacts with two orbital modes per lead. Sublattice symmetry makes the coherent spin-transmission kernel exactly odd in energy. A window centered on the symmetry point therefore gives zero integrated spin current, whereas a displaced window selects an uncanceled spectral interval. The resulting polarization reverses between enantiomers and vanishes in the decoupled-chain, zero-spin--orbit, and equivalent-strand limits of this model. We compare uniform absorption, energy-resolved elastic probes, and thermalized voltage probes at the same finite bias, including reinjection whenever probes are present. Charge conservation alone does not prohibit enhancement of the integrated spin signal: the elastic-probe response can increase at finite bias even where its linear-response counterpart decreases. Thermalized probes can also lift the centered-window zero that elastic probes preserve. Absorption and reinjection also change the transmitted charge, so enhancement of spin current and enhancement of normalized polarization must be distinguished. Static onsite disorder produces sample-dependent fluctuations; its signed ensemble mean is reported with uncertainty and is not forced to vanish in a displaced window. These results identify the energy interval and reservoir prescription that must be controlled when interpreting dephasing trends in minimal models relevant to chirality-induced spin selectivity.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-12511", "arxiv_id": "2610.12511", "type": "arXiv", "journal": "arXiv:2610.12511", "journal_ref": "", "title": "Spinodal-controlled freeze-out and nucleation at the first-order superfluid-supersolid transition of a dipolar gas", "authors": "Wai Kui Wong", "corresponding": "", "url": "https://arxiv.org/abs/2610.12511", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Dipolar quantum gases in elongated traps become supersolid through a transition that is continuous at intermediate density but first order at low and high density; at the continuous point, ramps of the scattering length follow Kibble-Zurek scaling. We study ramps across the first-order superfluid-supersolid transition of $^{164}$Dy in an infinite tube using the 3D extended Gross-Pitaevskii equatio", "summary": "Dipolar quantum gases in elongated traps become supersolid through a transition that is continuous at intermediate density but first order at low and high density; at the continuous point, ramps of the scattering length follow Kibble-Zurek scaling. We study ramps across the first-order superfluid-supersolid transition of $^{164}$Dy in an infinite tube using the 3D extended Gross-Pitaevskii equatio", "abstract": "Dipolar quantum gases in elongated traps become supersolid through a transition that is continuous at intermediate density but first order at low and high density; at the continuous point, ramps of the scattering length follow Kibble-Zurek scaling. We study ramps across the first-order superfluid-supersolid transition of $^{164}$Dy in an infinite tube using the 3D extended Gross-Pitaevskii equation with truncated-Wigner noise. With quantum noise only, the uniform superfluid survives the metastable window and transforms after its spinodal, where the roton softens. For onsets occurring during the linear ramp, the delay measured from this spinodal has a fitted exponent $ζ= 0.36 \\pm 0.02$, close to the continuous-transition result and the mean-field value $1/3$. Reverse ramps show a comparable delay beyond the fold of the crystal branch, producing dynamical hysteresis. Initial thermal noise with nominal temperatures of 2.5-10 nK produces crystalline regions inside the metastable window during holds, with faster nucleation closer to the spinodal and at higher initial temperature. In ramps at 5 nK, thermal fluctuations make the superfluid fraction $f_s$ cross onset thresholds near $f_s = 1$ early, whereas the bulk of the crystal still forms after the zero-temperature spinodal with a similar scaling. Without a heat bath these effective rates depend on preparation: ramps crossing the window at the same rate nucleate early in 2 of 32 or 11 of 16 realizations depending on their starting point. At low density, slower ramps select larger spacings in a crystal of separated droplets, and droplets survive far above the transition on reverse ramps. A Maxwell construction gives a coexistence window $0.037 a_0$ wide around the first-order transition point, in which localized states exist; in the simulated tube they lie above the homogeneous states. At the continuous point there is no coexistence.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2608-02513", "arxiv_id": "2608.02513", "type": "arXiv", "journal": "Physical Review B 114, 245414 (2026)", "journal_ref": "Physical Review B 114, 245414 (2026)", "title": "Strain engineering of transient exciton diffusion in WSe2 monolayers at cryogenic temperatures", "authors": "Roberto Rosati, Mohammed Adel Aly, Robert Schmidt et al.", "corresponding": "", "url": "https://arxiv.org/abs/2608.02513", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Tungsten-based transition metal dichalcogenides exhibit dark excitons as the energetically lowest states. These are crucial for exciton thermalization and propagation and they dominate low-temperature photoluminescence via the emergence of pronounced phonon sidebands. After a resonant excitation, highly mobile hot dark excitons are formed, which quickly thermalize into an equilibrium distribution.", "summary": "Tungsten-based transition metal dichalcogenides exhibit dark excitons as the energetically lowest states. These are crucial for exciton thermalization and propagation and they dominate low-temperature photoluminescence via the emergence of pronounced phonon sidebands. After a resonant excitation, highly mobile hot dark excitons are formed, which quickly thermalize into an equilibrium distribution.", "abstract": "Tungsten-based transition metal dichalcogenides exhibit dark excitons as the energetically lowest states. These are crucial for exciton thermalization and propagation and they dominate low-temperature photoluminescence via the emergence of pronounced phonon sidebands. After a resonant excitation, highly mobile hot dark excitons are formed, which quickly thermalize into an equilibrium distribution. The application of strain modifies the exciton energy landscape and, in particular, the relative energy separation between bright and dark exciton states. The impact of strain on the transient photoluminescence and diffusion of non-equilibrium excitons has remained largely unexplored so far. In this work, we investigate the spatiotemporal exciton dynamics in strained hBN-encapsulated WSe2 monolayers at cryogenic temperatures. We demonstrate that tensile strain abruptly increases the excess energy of hot excitons, thereby accelerating their transient diffusion. We trace this back to suppressed phonon-mediated scattering from bright to dark excitons. Furthermore, we predict a periodic modulation of the transient exciton diffusion in the presence of a compressive strain resulting from strain-driven emission of M phonons. The gained microscopic insights illustrate how strain can be used to engineer transient photoluminescence and exciton diffusion in technologically promising 2D semiconductors.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30598", "arxiv_id": "2610.30598", "type": "arXiv", "journal": "arXiv:2610.30598", "journal_ref": "", "title": "Strain-induced structural transformations in hexagonal monolayer boron nitride. A density functional study", "authors": "O. Bystrenko, B. Ilkiv, S. Petrovska et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30598", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "In this work we theoretically study the structural transformations occurring in monolayer hexagonal boron nitride (h-BN) subjected to strong deformations. The first-principle computer simulations are based on the density functional theory employing the pseudopotentials with the exchange-correlation energy given in Perdew-Burke-Ernzerhof form. Depending on the direction and the type of the strain, ", "summary": "In this work we theoretically study the structural transformations occurring in monolayer hexagonal boron nitride (h-BN) subjected to strong deformations. The first-principle computer simulations are based on the density functional theory employing the pseudopotentials with the exchange-correlation energy given in Perdew-Burke-Ernzerhof form. Depending on the direction and the type of the strain, ", "abstract": "In this work we theoretically study the structural transformations occurring in monolayer hexagonal boron nitride (h-BN) subjected to strong deformations. The first-principle computer simulations are based on the density functional theory employing the pseudopotentials with the exchange-correlation energy given in Perdew-Burke-Ernzerhof form. Depending on the direction and the type of the strain, the simulations reveal different types of structural transformations in two-dimensional (2D) h-BN associated with the elastic failure. It is found that, under certain shear strains, there can form an ordered 2D orthorhombic phase with the 2D layer space symmetry pmmm. Thermal stability of the latter up to ~900 K is demonstrated by first-principle Born-Oppenheimer molecular dynamics. The examination of electronic structure indicates that, in contrast to the conventional h-BN, which is an insulator with the wide band gap, the predicted orthorhombic phase is expected to be a semiconductor with the narrow band gap of ~ 0.65 eV.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31127", "arxiv_id": "2610.31127", "type": "arXiv", "journal": "arXiv:2610.31127", "journal_ref": "", "title": "The often overlooked role of sound in liquid thermal transport", "authors": "Kamran Behnia", "corresponding": "", "url": "https://arxiv.org/abs/2610.31127", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Formulated a hundred years ago, the Bridgman formula for thermal conductivity of liquids postulates a proportionality between sound velocity and thermal conductivity. This designates phonons as heat carriers in a liquid. Its empirical success has been under-appreciated and its conceptual implications overlooked. It is not mentioned in well-known condensed-matter textbook. Here, we review its origi", "summary": "Formulated a hundred years ago, the Bridgman formula for thermal conductivity of liquids pos
