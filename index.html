ltraviolet photoemission spectroscopy with ab initio real-time simulations of photoexcited carrier dynamics, we identify valley-selective excitation at opposite crystal momenta arising from the breaking of time-reversal symmetry under circularly polarized illumination. We theoretically demonstrate that the magnitude of valley circular dichroism is strongly constrained by crystal symmetry through its influence on the quantum geometric tensor, the key quantity underlying valley optical selection rules. The resulting chiroptically induced valley polarization decays on sub-picosecond timescales through intervalley scattering mediated by electron-phonon coupling. Furthermore, we show theoretically that the population imbalance between valleys at opposite momenta gives rise to a helicity-reversible transient photocurrent. These findings provide microscopic insight into how quantum geometry governs valley-selective light-matter interactions, valley polarization, and photocurrent generation in van der Waals materials exhibiting hidden and transient symmetry breaking.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2604-26871", "arxiv_id": "2604.26871", "type": "arXiv", "journal": "arXiv:2604.26871", "journal_ref": "", "title": "Correlation-Driven Ballistic Exciton Expansion in a Moiré Bose-Fermi Mixture", "authors": "Shibin Deng, Jonas M. Peterson, Maximilian Hauer et al.", "corresponding": "", "url": "https://arxiv.org/abs/2604.26871", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Moiré superlattices of transition-metal dichalcogenides (TMDs) host strongly interacting Bose-Fermi mixtures in which bosonic excitons coexist with correlated electron lattices. Using ultrafast, time- and energy-resolved photoluminescence (PL) microscopy, we show that strong exciton-electron and exciton-exciton repulsion can enable ballistic exciton transport in a WSe$_2$/WS$_2$ heterobilayer. Thi", "summary": "Moiré superlattices of transition-metal dichalcogenides (TMDs) host strongly interacting Bose-Fermi mixtures in which bosonic excitons coexist with correlated electron lattices. Using ultrafast, time- and energy-resolved photoluminescence (PL) microscopy, we show that strong exciton-electron and exciton-exciton repulsion can enable ballistic exciton transport in a WSe$_2$/WS$_2$ heterobilayer. Thi", "abstract": "Moiré superlattices of transition-metal dichalcogenides (TMDs) host strongly interacting Bose-Fermi mixtures in which bosonic excitons coexist with correlated electron lattices. Using ultrafast, time- and energy-resolved photoluminescence (PL) microscopy, we show that strong exciton-electron and exciton-exciton repulsion can enable ballistic exciton transport in a WSe$_2$/WS$_2$ heterobilayer. This ballistic transport is energy selective: repulsive interactions populate higher-energy moiré exciton bands, including the doubly occupied exciton state XX and the exciton-electron co-localized state Xe, exhibiting mean-squared displacement (MSD) with a quadratic time dependence, MSD $\\propto t^2$. Transport in the Xe band is jointly governed by exciton and electron correlations. Exciton correlations suppress relaxation into the lower-energy localized exciton state, while generalized Wigner-crystal (GWC) order at fractional electron fillings enhances Auger recombination and the group velocity of the ballistic expansion. A two-dimensional Bose-Fermi Hubbard model solved using time-dependent mean-field methods qualitatively reproduces the measured exciton transport and time-dependent response. It further confirms that strong cross-species interactions allow the electron crystal to perforate the exciton Mott background, enhancing exciton motion. Our results establish moiré TMDs as highly tunable platforms for realizing strongly interacting Bose-Fermi mixtures.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2604-01918", "arxiv_id": "2604.01918", "type": "arXiv", "journal": "Physical Review A 114, 042217 (2026)", "journal_ref": "Physical Review A 114, 042217 (2026)", "title": "Critical timescales for chiral state conversion and irreversibility", "authors": "Giorgos Pappas, Diego Bautista Avilés, Luis E. F. Foa Torres et al.", "corresponding": "", "url": "https://arxiv.org/abs/2604.01918", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Non-Hermitian systems driven along slow parametric loops undergo non-adiabatic transitions whose outcome depends sensitively on the driving speed, yet no explicit formula has been available for the critical timescale $T_{\\mathrm{cr}}$ at which these transitions develop. Using a $2\\times 2$ Hamiltonian with circular parameter trajectories, we derive $T_{\\mathrm{cr}} = \\mathcal{G}\\,\\ln(1/|Δ|)$ in cl", "summary": "Non-Hermitian systems driven along slow parametric loops undergo non-adiabatic transitions whose outcome depends sensitively on the driving speed, yet no explicit formula has been available for the critical timescale $T_{\\mathrm{cr}}$ at which these transitions develop. Using a $2\\times 2$ Hamiltonian with circular parameter trajectories, we derive $T_{\\mathrm{cr}} = \\mathcal{G}\\,\\ln(1/|Δ|)$ in cl", "abstract": "Non-Hermitian systems driven along slow parametric loops undergo non-adiabatic transitions whose outcome depends sensitively on the driving speed, yet no explicit formula has been available for the critical timescale $T_{\\mathrm{cr}}$ at which these transitions develop. Using a $2\\times 2$ Hamiltonian with circular parameter trajectories, we derive $T_{\\mathrm{cr}} = \\mathcal{G}\\,\\ln(1/|Δ|)$ in closed form for non-encircling loops, phase-shifted loops, offset loops, and loops encircling exceptional points, where $\\mathcal{G}$ is a geometry-dependent growth factor and $Δ$ is the instability seed. This formula sharply separates the regime where the system remains in the averagely dominant eigenstate ($T T_{\\mathrm{cr}}$), resolving the apparent tension between the previous literature. We identify two competing seeds: a geometric Stokes multiplier and the finite-precision floor. When the geometric seed vanishes, precision alone governs the transition, yielding $T_{\\mathrm{cr}} \\propto m\\lnβ$, linear in the number $m$ of digits in base $β$ (bits for $β=2$). For loops encircling an exceptional point, the Stokes seed only sets an intermediate plateau; the final transition is again seeded by the precision floor, and $T_{\\mathrm{cr}}$ remains linear in $m$. This provides a purely forward-evolution manifestation of precision-induced irreversibility [Phys. Rev. A 114, 012207 (2026)], demonstrating that the fundamental limit identified through echo protocols also controls the outcome of slow non-Hermitian dynamics without requiring time reversal. For PT-symmetric energy spectra, $T_{\\mathrm{cr}}$ additionally determines the onset of chirality: the dynamics is non-chiral for $T T_{\\mathrm{cr}}$.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-27762", "arxiv_id": "2610.27762", "type": "arXiv", "journal": "arXiv:2610.27762", "journal_ref": "", "title": "CrystalAR: Autoregressive Modeling for Symmetric Crystal Generation", "authors": "Ziqiao Meng, Rongsheng Chen, Zhi Zheng et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.27762", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Deep generative modeling has achieved remarkable progress in crystal generation. Given the rich symmetries inherent in crystalline structures, recent work has sought to explicitly incorporate space-group symmetry into generative models, enabling more effective exploration of novel symmetry templates. Yet introducing symmetry templates increases the combinatorial complexity of stoichiometric relati", "summary": "Deep generative modeling has achieved remarkable progress in crystal generation. Given the rich symmetries inherent in crystalline structures, recent work has sought to explicitly incorporate space-group symmetry into generative models, enabling more effective exploration of novel symmetry templates. Yet introducing symmetry templates increases the combinatorial complexity of stoichiometric relati", "abstract": "Deep generative modeling has achieved remarkable progress in crystal generation. Given the rich symmetries inherent in crystalline structures, recent work has sought to explicitly incorporate space-group symmetry into generative models, enabling more effective exploration of novel symmetry templates. Yet introducing symmetry templates increases the combinatorial complexity of stoichiometric relationships between atomic species and crystallographic sites, while creating a fundamental tension between flexible exploration of discrete crystallographic templates and faithful realization of these templates as continuous three-dimensional structures. To address these challenges, we propose CrystalAR, a unified autoregressive framework that models Wyckoff symmetry templates and complete crystal structures within a single generative sequence. Specifically, CrystalAR reformulates continuous coordinate generation as a symmetry-conditioned hierarchy of discrete spatial localization decisions, autoregressively refining the positions of all symmetry-inequivalent sites across resolution levels while jointly modeling their spatial configuration within each level. This discrete hierarchical formulation further enables constraint-aware search over both crystallographic templates and geometric realizations. As a result, CrystalAR retains strong symmetry-template generation capability while achieving competitive de novo generation performance and template-free crystal structure prediction (CSP) accuracy. These results suggest that symmetry-template generation can be retained alongside broadly competitive de novo generation performance and competitive CSP without reliance on symmetry templates retrieved from prior data, providing a promising alternative paradigm for symmetry-preserving crystal generation.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30318", "arxiv_id": "2610.30318", "type": "arXiv", "journal": "arXiv:2610.30318", "journal_ref": "", "title": "Domain walls in $R3c$-structured NaNbO$_3$", "authors": "Jack G. Nedell, Craig J. Fennie", "corresponding": "", "url": "https://arxiv.org/abs/2610.30318", "topic": "Materials & Growth", "level": "Brief", "summary_en": "In this work, we undertake a systematic first-principles study of structural domain walls in the low-temperature rhombohedral $R3c$ phase of perovskite oxide NaNbO$_3$. Employing a group-theoretic classification, we introduce eight unique classes of domain walls in the $R3c$ structure, four of which have a domain wall orientation determined uniquely by the conditions of elastic compatibility and c", "summary": "In this work, we undertake a systematic first-principles study of structural domain walls in the low-temperature rhombohedral $R3c$ phase of perovskite oxide NaNbO$_3$. Employing a group-theoretic classification, we introduce eight unique classes of domain walls in the $R3c$ structure, four of which have a domain wall orientation determined uniquely by the conditions of elastic compatibility and c", "abstract": "In this work, we undertake a systematic first-principles study of structural domain walls in the low-temperature rhombohedral $R3c$ phase of perovskite oxide NaNbO$_3$. Employing a group-theoretic classification, we introduce eight unique classes of domain walls in the $R3c$ structure, four of which have a domain wall orientation determined uniquely by the conditions of elastic compatibility and charge neutrality, and perform structural relaxations for each representative domain wall class. We find that one class of 109° domain walls has a notably low energy of 9 mJ m$^{-2}$, comparable to the low-energy ferroelectric walls in BaTiO$_3$. Finally, we find that this class of 109° walls is compatible with the crystal twinning observed in experiments on the $R3c$ phase, and propose an atomistic mechanism for the $R3c \\leftrightarrow Pbcm$ phase transition.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31575", "arxiv_id": "2610.31575", "type": "arXiv", "journal": "arXiv:2610.31575", "journal_ref": "", "title": "Dynamics of random recurrent neural networks: colored noise and sublinear activations", "authors": "German Mato, Facundo Rigatuso, Gonzalo Torroba", "corresponding": "", "url": "https://arxiv.org/abs/2610.31575", "topic": "Materials & Growth", "level": "Brief", "summary_en": "We study the dynamics of recurrent neural networks with random couplings, sublinear odd activation functions, and temporally correlated noise. Using large N methods, we determine stationary correlations and distinguish the loss of local linear stability from the onset of chaos, characterized by a positive largest Lyapunov exponent. These thresholds delimit an intermediate regime in which local ins", "summary": "We study the dynamics of recurrent neural networks with random couplings, sublinear odd activation functions, and temporally correlated noise. Using large N methods, we determine stationary correlations and distinguish the loss of local linear stability from the onset of chaos, characterized by a positive largest Lyapunov exponent. These thresholds delimit an intermediate regime in which local ins", "abstract": "We study the dynamics of recurrent neural networks with random couplings, sublinear odd activation functions, and temporally correlated noise. Using large N methods, we determine stationary correlations and distinguish the loss of local linear stability from the onset of chaos, characterized by a positive largest Lyapunov exponent. These thresholds delimit an intermediate regime in which local instability coexists with asymptotic stability under a common noise history. Their separation depends on both the noise correlation time and the asymptotic growth of the activation function. We show that internal noise with any finite correlation time cuts off the divergence of the network's intrinsic correlation time tau_corr at the edge of chaos; it exhibits a critical scaling tau_{corr,max} propto 1/sqrt{D_0}, where D_0 is the integrated noise strength. Static random input instead produces coincident thresholds and a divergent correlation time. We also calculate the frequency-dependent participation dimension from a four-point correlation function. Its zero-frequency value is inversely proportional to the fourth power of the network correlation time, predicting a smooth minimum at the weak-noise chaos threshold. Numerical simulations support the large-network predictions and reveal appreciable finite-size effects.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30210", "arxiv_id": "2610.30210", "type": "arXiv", "journal": "arXiv:2610.30210", "journal_ref": "", "title": "Electronic Screening as a Design Lever in La-Doped BaTiO$_3$: Coupled Polarization, Dielectric Response, and Optical Anisotropy", "authors": "Sikandar Azam, Muhammad Fareed, Qaiser Rafiq et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30210", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Donor substitution can tune the coupled ferroelectric, dielectric, electronic, and optical properties of perovskite oxides by modifying lattice distortions and electronic screening. We investigate these effects in La-doped BaTiO3 using density functional theory, density-functional perturbation theory, and the Berry-phase formalism for polarization. For a model with 12.5% La substitution at the Ba ", "summary": "Donor substitution can tune the coupled ferroelectric, dielectric, electronic, and optical properties of perovskite oxides by modifying lattice distortions and electronic screening. We investigate these effects in La-doped BaTiO3 using density functional theory, density-functional perturbation theory, and the Berry-phase formalism for polarization. For a model with 12.5% La substitution at the Ba ", "abstract": "Donor substitution can tune the coupled ferroelectric, dielectric, electronic, and optical properties of perovskite oxides by modifying lattice distortions and electronic screening. We investigate these effects in La-doped BaTiO3 using density functional theory, density-functional perturbation theory, and the Berry-phase formalism for polarization. For a model with 12.5% La substitution at the Ba site, La incorporation induces anisotropic lattice contraction, reduces tetragonality and Ti off-centering, and weakens the energetic stabilization of the tetragonal ferroelectric phase. The accompanying reduction in polarization is associated with enhanced electronic screening and reduced anomalous Born effective charges. Phonon calculations indicate that the relaxed doped structure is dynamically stable, while hardening of a low-frequency polar mode is consistent with weakened ferroelectricity. The high-frequency dielectric response increases moderately, whereas the static dielectric response decreases as the lattice contribution is suppressed. Electronic-structure calculations show a Fermi-level shift toward the conduction band without mid-gap defect states. The optical spectra exhibit an absorption-edge shift consistent with a Burstein-Moss-type mechanism, enhanced near-edge transparency, and reduced birefringence. Together, these results suggest a microscopic connection between donor-induced screening, polar-mode hardening, reduced dynamical charges, polarization suppression, and decreased optical anisotropy. The conclusions apply to the investigated 12.5% composition; calculations at additional concentrations are needed to establish quantitative doping trends.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31157", "arxiv_id": "2610.31157", "type": "arXiv", "journal": "arXiv:2610.31157", "journal_ref": "", "title": "Functional understanding of structural components in polypseudorotaxane gels", "authors": "Ella Sapsford, Andrea Bonato, Simon Weir et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.31157", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Biomedical devices, wearable interfaces, and soft robots require compliant soft materials with reliable mechanical performance, yet the molecular principles needed to design such materials are not always fully understood. Thus, there is an urgent need to understand how to design novel stretchable and soft hydrogels with enhanced toughness, i.e. resistance to breakage. Slide-ring gels (SRGs) are a ", "summary": "Biomedical devices, wearable interfaces, and soft robots require compliant soft materials with reliable mechanical performance, yet the molecular principles needed to design such materials are not always fully understood. Thus, there is an urgent need to understand how to design novel stretchable and soft hydrogels with enhanced toughness, i.e. resistance to breakage. Slide-ring gels (SRGs) are a ", "abstract": "Biomedical devices, wearable interfaces, and soft robots require compliant soft materials with reliable mechanical performance, yet the molecular principles needed to design such materials are not always fully understood. Thus, there is an urgent need to understand how to design novel stretchable and soft hydrogels with enhanced toughness, i.e. resistance to breakage. Slide-ring gels (SRGs) are a class of unconventional soft materials formed by polyrotaxanes (PR) building blocks whereby sliding cyclodextrins (CD) replace traditional chemical and physical crosslinks and in turn enhance toughness and stretchability by several orders of magnitude. The rational design of SRGs re- mains challenging due to a lack of a mechanistic understanding of the role played by individual components. In this work, we implement simple synthetic perturbations that individually target polymer-CD and CD-CD interactions in unstoppered pseudopolyrotaxanes (pPR) solutions and measure the consequent changes in viscoelastic properties. Weakening the intermolecular interaction between CDs abolishes crystallisation and significantly weakens the gel. At the same time, thermodynamically favouring threading by using azobenzene-modified PEG chains favours the formation of stable and long-lived networks even at remarkably low CD stoichiometries. We rationalise these observations with coarse-grained Molecular Dynamics simulations which clarify the structure-function relationship of the components forming these materials. Our work contributes to guiding the rational design and development of enhanced SRG hydrogels and elastomers.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30919", "arxiv_id": "2610.30919", "type": "arXiv", "journal": "arXiv:2610.30919", "journal_ref": "", "title": "Learning Cole-Hopf Coordinates for Stochastic Growth Dynamics: the KPZ class", "authors": "Lorenzo Mensi, Simone Cuonzo, Maria Chiara Angelini et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30919", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Inferring effective equations from observations of nonlinear stochastic processes is challenging because individual trajectories are noisy realizations, while the relevant physical information is encoded in ensemble statistics. We introduce a data-driven framework that learns a change of variables in which nonlinear stochastic dynamics become linear. The model combines a neural change of represent", "summary": "Inferring effective equations from observations of nonlinear stochastic processes is challenging because individual trajectories are noisy realizations, while the relevant physical information is encoded in ensemble statistics. We introduce a data-driven framework that learns a change of variables in which nonlinear stochastic dynamics become linear. The model combines a neural change of represent", "abstract": "Inferring effective equations from observations of nonlinear stochastic processes is challenging because individual trajectories are noisy realizations, while the relevant physical information is encoded in ensemble statistics. We introduce a data-driven framework that learns a change of variables in which nonlinear stochastic dynamics become linear. The model combines a neural change of representation with a linear stochastic latent evolution and is trained through a short-time moment-matching objective, thereby avoiding trajectory \\rev{simulation} during optimization. This construction yields an interpretable generative model: both the learned transformation and the latent evolution operators can be directly inspected. We validate the method on the one-dimensional Kardar--Parisi--Zhang (KPZ) equation, a paradigmatic model of stochastic growth for which the Cole--Hopf transformation maps the nonlinear dynamics to the stochastic heat equation. From simulated height trajectories alone, the model recovers the local exponential Cole--Hopf map and the associated linear stochastic operator. Generated trajectories reproduce the main statistical signatures of the KPZ universality class, including the growth law $\\mathrm{Var}(h^{t})\\sim t^{2β}$ with $β=1/3$ and the GOE Tracy--Widom height distribution for flat initial conditions. These results show that interpretable stochastic equations can be inferred from data by learning representations in which the dynamics closes in a simple form. Furthermore the development of the physical informed learning permits to get insights on the physics of the dynamical process.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30404", "arxiv_id": "2610.30404", "type": "arXiv", "journal": "arXiv:2610.30404", "journal_ref": "", "title": "Microstructural Generative Inverse Models for Additive Manufacturing Digital Twins", "authors": "Pablo Luna Falcon, Jason Mayeur, Amirkoushyar Ziabari et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30404", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Metal additive manufacturing (AM) offers substantial advantages to the fabrication of complex structural components, but its widespread adoption is slowed due to complexities in the process-structure-property relations which is the cause for uncertainty and drives risk. Accurately quantifying these complex relations solely via experimental workflows is time consuming and costly. Integrated computa", "summary": "Metal additive manufacturing (AM) offers substantial advantages to the fabrication of complex structural components, but its widespread adoption is slowed due to complexities in the process-structure-property relations which is the cause for uncertainty and drives risk. Accurately quantifying these complex relations solely via experimental workflows is time consuming and costly. Integrated computa", "abstract": "Metal additive manufacturing (AM) offers substantial advantages to the fabrication of complex structural components, but its widespread adoption is slowed due to complexities in the process-structure-property relations which is the cause for uncertainty and drives risk. Accurately quantifying these complex relations solely via experimental workflows is time consuming and costly. Integrated computational materials and engineering (ICME) frameworks address this challenge by leveraging advanced computational tools, such as crystal plasticity finite element models (CPFEM), to predict critical mechanical properties directly from microstructural data. However, these frameworks require a large datasets that are often difficult to obtain, and their predictive accuracy depends on the availability of realistic AM microstructure representations. Generative deep learning models are a promising approach towards synthesizing AM microstructures which contain complex morphological and crystallographic features. Denoising diffusion probabilistic models (DDPMs), in particular, show a strong potential to capture the inherent complexities of AM structures. In this work, we demonstrate that DDPMs can reliably synthesize digital-twin orientation-imaging micrographs, and we support this claim with quantitative evidence of the fidelity of the generated samples. Additionally, we establish a classifier-free guidance framework for solving complex inverse problems such as property-to-structure and process-to-structure mappings, and we showcase a potential application on a qualification-relevant uncertainty quantification problem. Our work highlights the potential of AI-based generative modeling as a key component of computational frameworks for accelerating AM materials qualification and certification.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30453", "arxiv_id": "2610.30453", "type": "arXiv", "journal": "arXiv:2610.30453", "journal_ref": "", "title": "Orientation-selective microwave heating of laser-graphitized diamond at 2.45 GHz", "authors": "Massimiliano Zamengo, Meguya Ryu, Haoran Mu et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30453", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Pristine diamond couples negligibly to a 2.45 GHz field. We show that femtosecond-laser inscription of a buried graphitic (sp2) architecture makes a 4 x 4 x 2 mm^3 N-doped (100 ppm) high-pressure high- temperature (HPHT) crystal absorb strongly, and that the absorption is switched by the orientation of the inscribed structure relative to the cavity electric field. With the 1.8 mm depth of a concen", "summary": "Pristine diamond couples negligibly to a 2.45 GHz field. We show that femtosecond-laser inscription of a buried graphitic (sp2) architecture makes a 4 x 4 x 2 mm^3 N-doped (100 ppm) high-pressure high- temperature (HPHT) crystal absorb strongly, and that the absorption is switched by the orientation of the inscribed structure relative to the cavity electric field. With the 1.8 mm depth of a concen", "abstract": "Pristine diamond couples negligibly to a 2.45 GHz field. We show that femtosecond-laser inscription of a buried graphitic (sp2) architecture makes a 4 x 4 x 2 mm^3 N-doped (100 ppm) high-pressure high- temperature (HPHT) crystal absorb strongly, and that the absorption is switched by the orientation of the inscribed structure relative to the cavity electric field. With the 1.8 mm depth of a concentric grating along E, stepped power gave a smooth staircase to an indicated ~500C at 80 W followed, at 90 W, by an abrupt excursion to an indicated ~900C with surface roughening and terraced oxidation. Rotating the same sample so that the grating diameter lay along E, and an unmodified crystal in either orientation, gave no signal above the ~40C floor. We account for this by the depolarisation factors L of the sub-wavelength tracks, collapsed into one screening parameter S = Lσ/(ωε0εh), here, σ conductivity, ω - cyclic frequency, εh,0 - permittivity of host and vacuum, respectively. The model turns element length, diameter and writing regime into design variables for microwave absorption in a transparent host.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30356", "arxiv_id": "2610.30356", "type": "arXiv", "journal": "arXiv:2610.30356", "journal_ref": "", "title": "Peridynamic Thermo-Mechanical Modeling of Cracking in Tungsten under Fusion-Relevant Heat Fluxes", "authors": "Rinkle Juneja, Pablo Seleson, Samuel Temple Reeve et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30356", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Plasma-facing materials (PFMs) are the primary armor materials in fusion reactors, protecting reactor wall components from extreme heat fluxes, energetic particles, and intense neutron irradiation. These harsh conditions induce thermo-mechanical stresses, irradiation damage, and overall degradation in PFMs. Among these, thermo-mechanical damage induced by extreme heat flux is one of the key factor", "summary": "Plasma-facing materials (PFMs) are the primary armor materials in fusion reactors, protecting reactor wall components from extreme heat fluxes, energetic particles, and intense neutron irradiation. These harsh conditions induce thermo-mechanical stresses, irradiation damage, and overall degradation in PFMs. Among these, thermo-mechanical damage induced by extreme heat flux is one of the key factor", "abstract": "Plasma-facing materials (PFMs) are the primary armor materials in fusion reactors, protecting reactor wall components from extreme heat fluxes, energetic particles, and intense neutron irradiation. These harsh conditions induce thermo-mechanical stresses, irradiation damage, and overall degradation in PFMs. Among these, thermo-mechanical damage induced by extreme heat flux is one of the key factors limiting the lifetime of PFMs. We present a modeling and simulation approach for predicting thermo-mechanical cracking and damage in tungsten, a leading PFM candidate, under fusion-reactor-relevant heat fluxes. Specifically, we study damage induced by cyclic electron beam (e-beam) exposure under different combinations of base temperature and heat flux. We carry out component-scale thermo-mechanical simulations using CabanaPD, a peridynamics fracture mechanics code, informed by experimental data for recrystallized pure tungsten from the JUDITH e-beam facility. The simulations compare well with the experimental classification and enable identification of cracking thresholds across a range of heat fluxes and base temperatures. These predictions can provide detailed insights into the spatial distribution and temporal accumulation of cracks and damage, while offering a pathway for screening candidate PFMs and quantifying their lifespan under fusion-relevant conditions.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30381", "arxiv_id": "2610.30381", "type": "arXiv", "journal": "arXiv:2610.30381", "journal_ref": "", "title": "Quantum Phases and Structural Transitions of Bosons in Bubble-Shaped Confinements", "authors": "Fabio Cinti, Gabriele Costa, Giuseppe Pellicane et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30381", "topic": "Materials & Growth", "level": "Brief", "summary_en": "We investigate the structural properties and superfluid behavior of soft-core bosons confined in a spherical bubble trap at large particle numbers ($N \\le 1800$). Using Path Integral Monte Carlo simulations with worm algorithm sampling in continuous space, we show that increasing $N$ drives a sequence of layering transitions: beyond the established bilayer supersolid, a third concentric layer of c", "summary": "We investigate the structural properties and superfluid behavior of soft-core bosons confined in a spherical bubble trap at large particle numbers ($N \\le 1800$). Using Path Integral Monte Carlo simulations with worm algorithm sampling in continuous space, we show that increasing $N$ drives a sequence of layering transitions: beyond the established bilayer supersolid, a third concentric layer of c", "abstract": "We investigate the structural properties and superfluid behavior of soft-core bosons confined in a spherical bubble trap at large particle numbers ($N \\le 1800$). Using Path Integral Monte Carlo simulations with worm algorithm sampling in continuous space, we show that increasing $N$ drives a sequence of layering transitions: beyond the established bilayer supersolid, a third concentric layer of clusters emerges at $N \\approx 1800$. By analyzing the distribution of permutation cycles distribution, we demonstrate that a finite superfluid fraction ($f_s \\approx 10\\%$) persists even in this multi-layer regime. These findings clarify the role of particle number in driving layer formation on curved manifolds, offering a concrete guide for future experiments with bubble-trapped bosons.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30978", "arxiv_id": "2610.30978", "type": "arXiv", "journal": "arXiv:2610.30978", "journal_ref": "", "title": "Role of Chalcogen-p States in the Optical Response of Bulk PtSe2 and PtTe2", "authors": "Ji Eun Lee, R. Mathew Roy, Premakumar Yanda et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30978", "topic": "Materials & Growth", "level": "Brief", "summary_en": "The type-II Dirac semimetals PtSe$_2$ and PtTe$_2$ are isostructural and isovalent layered compounds but exhibit distinct electronic properties. We measure the in-plane infrared reflectivity of bulk crystals between 10 and 300 K and compare the interband contribution to the optical conductivity with band-resolved density-functional calculations. At low temperature, the Drude spectral weight of PtT", "summary": "The type-II Dirac semimetals PtSe$_2$ and PtTe$_2$ are isostructural and isovalent layered compounds but exhibit distinct electronic properties. We measure the in-plane infrared reflectivity of bulk crystals between 10 and 300 K and compare the interband contribution to the optical conductivity with band-resolved density-functional calculations. At low temperature, the Drude spectral weight of PtT", "abstract": "The type-II Dirac semimetals PtSe$_2$ and PtTe$_2$ are isostructural and isovalent layered compounds but exhibit distinct electronic properties. We measure the in-plane infrared reflectivity of bulk crystals between 10 and 300 K and compare the interband contribution to the optical conductivity with band-resolved density-functional calculations. At low temperature, the Drude spectral weight of PtTe$_2$ is an order of magnitude larger than that of PtSe$_2$. PtTe$_2$ also shows a broad mid-infrared absorption continuum, whereas the absorption of PtSe$_2$ remains weak. The calculations attribute this continuum to transitions from a predominantly chalcogen-$p$ band into a Pt-$d$ band. In PtTe$_2$, the chalcogen-$p$ band lies higher in energy, which lowers the onset of these transitions and increases the semimetallic band overlap, in line with the larger Drude spectral weight. The type-II Dirac points lie far below the Fermi level, so that transitions between the bands forming the Dirac cones do not contribute appreciably to the interband conductivity.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30257", "arxiv_id": "2610.30257", "type": "arXiv", "journal": "arXiv:2610.30257", "journal_ref": "", "title": "Scalable Neural Wave Functions via Information Mixing and Hierarchical Network Architectures", "authors": "Faith Oyedemi, Stefanie Czischek", "corresponding": "", "url": "https://arxiv.org/abs/2610.30257", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Numerically simulating quantum many-body systems is one of the central challenges in modern physics, as the exponential growth of the Hilbert space with system size renders large-scale exact solutions intractable. Over the past decade, generative artificial neural networks have emerged as powerful wave function ansätze that have powered advances in finding ground state representations, reconstruct", "summary": "Numerically simulating quantum many-body systems is one of the central challenges in modern physics, as the exponential growth of the Hilbert space with system size renders large-scale exact solutions intractable. Over the past decade, generative artificial neural networks have emerged as powerful wave function ansätze that have powered advances in finding ground state representations, reconstruct", "abstract": "Numerically simulating quantum many-body systems is one of the central challenges in modern physics, as the exponential growth of the Hilbert space with system size renders large-scale exact solutions intractable. Over the past decade, generative artificial neural networks have emerged as powerful wave function ansätze that have powered advances in finding ground state representations, reconstructing quantum states from data, and modeling dynamics in quantum many-body systems. While recurrent neural networks (RNNs) are computationally efficient, the recurrent nature can limit their capacity to capture long-range correlations. Transformer models with their underlying self-attention mechanism excel at capturing these long-range correlations, but incur increased computational requirements, restricting applications to small physical systems. In this work, we address these limitations by exploring the multi-layer perceptron (MLP) mixer model as a wave function ansatz. By mixing information globally and locally through the system via a computationally lightweight mixing strategy, this architecture promises to combine the ability to capture long-range correlations with low computational costs. We benchmark the model on finding ground state representations of two-dimensional quantum many-body systems in various phases of matter and investigate the behavior of representational accuracy and computational efficiency for different physical system sizes. By comparing its performance to RNNs and transformer models with single-site and patched input definitions, we demonstrate that the MLP mixer architecture performs competitively with state-of-the-art network models. We further show that a hierarchical combination of this model with the transformer model outperforms other state-of-the-art architectures for large-scale quantum systems, opening new avenues for investigating quantum phases of matter.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30451", "arxiv_id": "2610.30451", "type": "arXiv", "journal": "arXiv:2610.30451", "journal_ref": "", "title": "Suppression of Grain Boundary Nitrogen Degradation by Boron in Superalloys", "authors": "C. Crabb, G. Topore, J. O. Douglas et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30451", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Superalloys enable the hottest sections of jet engines to operate at high temperatures, but environmentally assisted degradation limits their lifetime. In polycrystalline alloys, nitrogen penetrates beneath the protective surface oxides, to produce embrittling grain boundary nitrides. Boron is added in trace amounts to improve grain boundary strength, yet its role, if any, in oxidation-related deg", "summary": "Superalloys enable the hottest sections of jet engines to operate at high temperatures, but environmentally assisted degradation limits their lifetime. In polycrystalline alloys, nitrogen penetrates beneath the protective surface oxides, to produce embrittling grain boundary nitrides. Boron is added in trace amounts to improve grain boundary strength, yet its role, if any, in oxidation-related deg", "abstract": "Superalloys enable the hottest sections of jet engines to operate at high temperatures, but environmentally assisted degradation limits their lifetime. In polycrystalline alloys, nitrogen penetrates beneath the protective surface oxides, to produce embrittling grain boundary nitrides. Boron is added in trace amounts to improve grain boundary strength, yet its role, if any, in oxidation-related degradation remains unclear. Here we show that boron segregates to an internal nitride--matrix interface in a Ni/Co-base $γ$/$γ^{\\prime}$ strengthened superalloy. Both B-free and B-containing alloys develop stratified chromia/alumina scales at 800~$^{\\circ}$C in \\SI{100}{\\hour}, but the B-free variant produces larger, deeper and more elongated Ti/Nb-rich subsurface grain boundary nitrides. Correlative 4D S/TEM and atom probe tomography identify the particle as a chemically complex B1 nitride and reveal interfacial boron segregation. This shows that trace alloying as an alloy strategy can control damaging internal reaction product precipitation and growth by core-shell segregation.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31176", "arxiv_id": "2610.31176", "type": "arXiv", "journal": "arXiv:2610.31176", "journal_ref": "", "title": "Tracking the Emergence and Persistence of Abnormal Grain Growth in an Aluminum Alloy using Diffraction-Contrast Tomography", "authors": "Helmuth-André Schulz-Harder, Karolína Gutbrod, Madlen Atzen et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.31176", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Abnormal grain growth is inherently three-dimensional, making 3D tracking of grain evolution essential for understanding its underlying mechanisms. This study combines synchrotron-based diffraction-contrast tomography and phase-contrast tomography to characterize the three-dimensional grain structure and quantify the size and spatial distribution of second-phase particles in the aluminum alloy AA5", "summary": "Abnormal grain growth is inherently three-dimensional, making 3D tracking of grain evolution essential for understanding its underlying mechanisms. This study combines synchrotron-based diffraction-contrast tomography and phase-contrast tomography to characterize the three-dimensional grain structure and quantify the size and spatial distribution of second-phase particles in the aluminum alloy AA5", "abstract": "Abnormal grain growth is inherently three-dimensional, making 3D tracking of grain evolution essential for understanding its underlying mechanisms. This study combines synchrotron-based diffraction-contrast tomography and phase-contrast tomography to characterize the three-dimensional grain structure and quantify the size and spatial distribution of second-phase particles in the aluminum alloy AA5252. Using an interrupted annealing protocol, we tracked the persistent growth of abnormal grains and the emergence of abnormal growth in a grain initially belonging to the matrix. Although second-phase particles effectively suppressed grain growth in the matrix, variations in local particle density showed no apparent correlation with either the emergence or subsequent rapid growth of abnormal grains. Instead, crystallographic misorientation and, more notably, neighboring grain size were identified as stronger predictors of abnormal growth rate. Matrix grains were consumed more rapidly when they were relatively small and shared high-angle grain boundaries with the growing abnormal grain. The same trends were observed for the grain that underwent a transition from normal to abnormal growth. Remarkably, even before the onset of abnormal growth, this grain was surrounded by smaller matrix grains with exclusively high-angle grain boundaries, while the local particle density was slightly higher than average. These findings suggest that the same microstructural characteristics facilitate both the emergence and persistence of abnormal grain growth, although the mechanism triggering the transition to rapid growth remains unresolved.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30764", "arxiv_id": "2610.30764", "type": "arXiv", "journal": "arXiv:2610.30764", "journal_ref": "", "title": "Universal Synthesis of Large-Area Hybrid Perovskite Monolayers Enabling Lithography-Free, Low-Static-Power Optoelectronics", "authors": "Shankeerthan Kalyanasundaram, Swarit Dwivedi, Sanje Mahasivam et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30764", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Solution-phase synthesis of monolayer hybrid organic-inorganic perovskites is constrained by rapid out-of-plane crystal growth, uncontrolled nucleation, and strong interlayer aggregation, yielding flakes of only a few μm. We introduce a steric-engineering ternary-solvent growth strategy to synthesize monolayer and few-layer A2MX4 hybrid perovskites with exceptionally large surface areas. By combin", "summary": "Solution-phase synthesis of monolayer hybrid organic-inorganic perovskites is constrained by rapid out-of-plane crystal growth, uncontrolled nucleation, and strong interlayer aggregation, yielding flakes of only a few μm. We introduce a steric-engineering ternary-solvent growth strategy to synthesize monolayer and few-layer A2MX4 hybrid perovskites with exceptionally large surface areas. By combin", "abstract": "Solution-phase synthesis of monolayer hybrid organic-inorganic perovskites is constrained by rapid out-of-plane crystal growth, uncontrolled nucleation, and strong interlayer aggregation, yielding flakes of only a few μm. We introduce a steric-engineering ternary-solvent growth strategy to synthesize monolayer and few-layer A2MX4 hybrid perovskites with exceptionally large surface areas. By combining alcohol cosolvents with an amine additive, out-of-plane stacking is suppressed. Using (PEA)2CuCl4 as a model system, monolayers with lateral areas exceeding 1000 μm2 are achieved, representing a massive dimensional increase over conventional methods. Molecular dynamics and quantum-chemical calculations show that longer-chain alcohols reorganize precursor solvation, while solvent volatility prolongs edge-mediated precursor transport during annealing. This strategy demonstrates universal applicability across diverse organic spacer cations (PEA+, F-PEA+, PentA+), metal centers (Cu2+, Mn2+, Pb2+), and halides (Cl-, Br-, I-). The large lateral dimensions enable direct, solvent-free electrical contact fabrication via physical shadow masking, bypassing chemical degradation from solvents used in conventional lithography. Planar devices fabricated from isolated ultrathin (PEA)2PbI4 channels exhibit ultra-low dark currents down to the 10^-15 - 10^-13 A range, enabling femtowatt-to-picowatt static power consumption, ~ 0.2 pW at 5 V, a 250-fold reduction relative to drop-cast films, while maintaining a high light-to-dark current ratio of 4.3 x 102. This work establishes precise steric and solvation control as a paradigm for scalable, compositionally diverse, low-static-power monolayer 2D perovskite optoelectronics.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2508-14862", "arxiv_id": "2508.14862", "type": "arXiv", "journal": "arXiv:2508.14862", "journal_ref": "", "title": "Universal winding laws in chiral active motion", "authors": "Ion Santra, Debraj Dutta, Urna Basu et al.", "corresponding": "", "url": "https://arxiv.org/abs/2508.14862", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Chiral active particles, from bacteria and sperm cells to engineered microswimmers, undergo persistent motion that breaks both time-reversal and mirror symmetries. This broken mirror symmetry leaves geometric signatures in trajectories that cannot be captured by conventional measures like position fluctuations. Here we identify the signed area and winding angle as key observables to characterize t", "summary": "Chiral active particles, from bacteria and sperm cells to engineered microswimmers, undergo persistent motion that breaks both time-reversal and mirror symmetries. This broken mirror symmetry leaves geometric signatures in trajectories that cannot be captured by conventional measures like position fluctuations. Here we identify the signed area and winding angle as key observables to characterize t", "abstract": "Chiral active particles, from bacteria and sperm cells to engineered microswimmers, undergo persistent motion that breaks both time-reversal and mirror symmetries. This broken mirror symmetry leaves geometric signatures in trajectories that cannot be captured by conventional measures like position fluctuations. Here we identify the signed area and winding angle as key observables to characterize the geometric and topological aspects of the trajectories of chiral active particles. Combining theory, experiment, and computer simulations, we demonstrate that these observables exhibit universal growth laws and fluctuation statistics that are independent of propulsion details. The presence of chirality generates multiple off-centred closed loops in the trajectories, resulting in a linear temporal growth of the signed area and a much slower logarithmic growth for the winding angle. Our work uncovers universal trajectory-level signatures of chirality and provides a unifying description of chiral dynamics in active matter.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2511-03580", "arxiv_id": "2511.03580", "type": "arXiv", "journal": "arXiv:2511.03580", "journal_ref": "", "title": "When can phonon modes be trapped by arbitrarily weak local defects? Rigorous sufficient conditions in a monatomic lattice", "authors": "Jaden Thomas, Rodrigo Arrieta, Shu-Ching Yang et al.", "corresponding": "", "url": "https://arxiv.org/abs/2511.03580", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Although many studies have shown that localized defects in vibrational lattices can trap localized phonon modes for particular geometries, there has been no general proof of localization for arbitrary localized defects of arbitrarily weak strength. This is distinct from the problem of Anderson localization, where random perturbations are spread across the entire lattice and one aims to prove wheth", "summary": "Although many studies have shown that localized defects in vibrational lattices can trap localized phonon modes for particular geometries, there has been no general proof of localization for arbitrary localized defects of arbitrarily weak strength. This is distinct from the problem of Anderson localization, where random perturbations are spread across the entire lattice and one aims to prove wheth", "abstract": "Although many studies have shown that localized defects in vibrational lattices can trap localized phonon modes for particular geometries, there has been no general proof of localization for arbitrary localized defects of arbitrarily weak strength. This is distinct from the problem of Anderson localization, where random perturbations are spread across the entire lattice and one aims to prove whether all states become localized. Here, we study the former problem for monatomic 1d and 2d crystals with nearest-neighbor harmonic interactions, corresponding in 2d to square lattices of masses and springs, and prove that arbitrary localized perturbations (such as any finite set of defect masses) that decrease the net mass by any amount must lead to localized states. In contrast, the analogous statement is generally false in 3d. Our proof employs a straightforward variational method, inspired by analogous results for the Schrödinger and Maxwell equations, that should be extensible to other discrete systems.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-26755", "arxiv_id": "2610.26755", "type": "arXiv", "journal": "arXiv:2610.26755", "journal_ref": "", "title": "A McLennan formula for equiaccessible steady states", "authors": "Jacob Calvert", "corresponding": "", "url": "https://arxiv.org/abs/2610.26755", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Near equilibrium, the Boltzmann distribution is corrected by the transient irreversible entropy flux, a result known as the McLennan formula. By expanding around equiaccessible steady states instead, we derive an analogue that can hold arbitrarily far from equilibrium. At zeroth order, steady-state occupation is determined solely by local escape rates, yielding a strong form of the active-matter p", "summary": "Near equilibrium, the Boltzmann distribution is corrected by the transient irreversible entropy flux, a result known as the McLennan formula. By expanding around equiaccessible steady states instead, we derive an analogue that can hold arbitrarily far from equilibrium. At zeroth order, steady-state occupation is determined solely by local escape rates, yielding a strong form of the active-matter p", "abstract": "Near equilibrium, the Boltzmann distribution is corrected by the transient irreversible entropy flux, a result known as the McLennan formula. By expanding around equiaccessible steady states instead, we derive an analogue that can hold arbitrarily far from equilibrium. At zeroth order, steady-state occupation is determined solely by local escape rates, yielding a strong form of the active-matter principle of \"low rattling.\" The first-order correction measures the impact of traffic imbalances on the accessibility of each state, marking the onset of nonlocal determinants of relative occupation.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2603-03691", "arxiv_id": "2603.03691", "type": "arXiv", "journal": "ACS Photonics 13 (18), 5398-5405 (2026)", "journal_ref": "ACS Photonics 13 (18), 5398-5405 (2026)", "title": "A Photonic Tautochrone: Spatiotemporal Beam Focusing for Enhanced Nonlinear Response", "authors": "W. Verstraelen, S. Zanotti, N. W. E. Seet et al.", "corresponding": "", "url": "https://arxiv.org/abs/2603.03691", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "We propose to implement an optical analogue of the tautochrone property of the cycloid to allow the focusing of ultrashort pulses inside photonic systems. This allows to enhance nonlinear effects, resulting in orders of magnitude increase of nonlinearity-induced phase shifts, while employing low irradiances. Building upon the optical-mechanical analogy, we show how to produce optical limiters for ", "summary": "We propose to implement an optical analogue of the tautochrone property of the cycloid to allow the focusing of ultrashort pulses inside photonic systems. This allows to enhance nonlinear effects, resulting in orders of magnitude increase of nonlinearity-induced phase shifts, while employing low irradiances. Building upon the optical-mechanical analogy, we show how to produce optical limiters for ", "abstract": "We propose to implement an optical analogue of the tautochrone property of the cycloid to allow the focusing of ultrashort pulses inside photonic systems. This allows to enhance nonlinear effects, resulting in orders of magnitude increase of nonlinearity-induced phase shifts, while employing low irradiances. Building upon the optical-mechanical analogy, we show how to produce optical limiters for temporal light pulses, and how to implement temporal bistability and even multistability with large numbers of states. Finally, we move this concept to the quantum realm and predict a tautochrone quantum blockade regime with a stronger antibunching.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2609-03179", "arxiv_id": "2609.03179", "type": "arXiv", "journal": "arXiv:2609.03179", "journal_ref": "", "title": "Accelerating stochastic processes through nonequilibrium driving: Thermodynamic constraints on the maximum speed-up", "authors": "Davide Santolin, Gianmaria Falasco", "corresponding": "", "url": "https://arxiv.org/abs/2609.03179", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "We derive a new set of bounds controlling the speed-up of the survival rate of trajectory-dependent observables induced by the application of a perturbation. Via the study of survival probabilities in two different contexts, continuous-time Markov jump processes and overdamped diffusions, we obtain different fashions of the bound on the achievable boost. These bounds, obtained by a nonlinear respo", "summary": "We derive a new set of bounds controlling the speed-up of the survival rate of trajectory-dependent observables induced by the application of a perturbation. Via the study of survival probabilities in two different contexts, continuous-time Markov jump processes and overdamped diffusions, we obtain different fashions of the bound on the achievable boost. These bounds, obtained by a nonlinear respo", "abstract": "We derive a new set of bounds controlling the speed-up of the survival rate of trajectory-dependent observables induced by the application of a perturbation. Via the study of survival probabilities in two different contexts, continuous-time Markov jump processes and overdamped diffusions, we obtain different fashions of the bound on the achievable boost. These bounds, obtained by a nonlinear response theory of constrained path probabilities, are explicitly linked to thermodynamics. For arbitrary time-dependent survival rates, we find a linear bound that depends on both the perturbation strength and the entropy production rate prior to the perturbation. For rare processes characterized by a constant survival rate, the bound is exponential and is determined by the excess heat generated by the perturbation. We exemplify the inequalities on two prototypical model systems, namely, a unicyclic network and forced diffusion in a bistable potential.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30958", "arxiv_id": "2610.30958", "type": "arXiv", "journal": "arXiv:2610.30958", "journal_ref": "", "title": "Active phase separation from concentration-dependent diffusion in chemical networks", "authors": "Giulia Pisegna, Ramin Golestanian", "corresponding": "", "url": "https://arxiv.org/abs/2610.30958", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Active phase separation in living systems is ubiquitous, yet the microscopic origins of the non-equilibrium terms in active field theories remain largely unknown. Here, starting from stochastic mass-conserving reaction-diffusion dynamics of two interacting chemical species, we perform a systematic slow-mode reduction and derive the complete Active Model B+ field theory, with all phenomenological c", "summary": "Active phase separation in living systems is ubiquitous, yet the microscopic origins of the non-equilibrium terms in active field theories remain largely unknown. Here, starting from stochastic mass-conserving reaction-diffusion dynamics of two interacting chemical species, we perform a systematic slow-mode reduction and derive the complete Active Model B+ field theory, with all phenomenological c", "abstract": "Active phase separation in living systems is ubiquitous, yet the microscopic origins of the non-equilibrium terms in active field theories remain largely unknown. Here, starting from stochastic mass-conserving reaction-diffusion dynamics of two interacting chemical species, we perform a systematic slow-mode reduction and derive the complete Active Model B+ field theory, with all phenomenological coefficients expressed in terms of microscopic parameters. We identify concentration-dependent diffusivities and asymmetric inter-species chemotactic couplings as the minimal microscopic ingredients generating the genuinely non-equilibrium coefficient responsible for microphase separation, cluster phases, and arrested coarsening. Our framework recovers the equilibrium limit consistently and is validated by stochastic numerical simulations. These results establish a direct, bottom-up link between the architecture of chemical reaction networks and the universality class of their emergent large-scale dynamics.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31319", "arxiv_id": "2610.31319", "type": "arXiv", "journal": "arXiv:2610.31319", "journal_ref": "", "title": "Atomic limits of empirical measures of interacting particle systems with self-duality", "authors": "Mario Ayala, Nicolas Dirr, Johannes Zimmer", "corresponding": "", "url": "https://arxiv.org/abs/2610.31319", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "We study the fixed-particle limit of empirical measures for a unified self-dual family of conservative particle systems on $\\mathbb{Z}^d$: independent random walkers, the symmetric exclusion process, and the symmetric inclusion process. For a fixed number of particles $k$, under diffusive space-time scaling parametrised by $n$, we prove that as $n\\to\\infty$ the normalised empirical measure converg", "summary": "We study the fixed-particle limit of empirical measures for a unified self-dual family of conservative particle systems on $\\mathbb{Z}^d$: independent random walkers, the symmetric exclusion process, and the symmetric inclusion process. For a fixed number of particles $k$, under diffusive space-time scaling parametrised by $n$, we prove that as $n\\to\\infty$ the normalised empirical measure converg", "abstract": "We study the fixed-particle limit of empirical measures for a unified self-dual family of conservative particle systems on $\\mathbb{Z}^d$: independent random walkers, the symmetric exclusion process, and the symmetric inclusion process. For a fixed number of particles $k$, under diffusive space-time scaling parametrised by $n$, we prove that as $n\\to\\infty$ the normalised empirical measure converges in $D([0,T],\\mathcal{M}_1(\\mathbb{R}^d))$ to an atomic empirical measure carried by $k$ independent diffusions, with constant covariance determined by the microscopic jump kernel. Equivalently, the limit is the unique atomic solution of the Dean-Kawasaki martingale problem with mass quantisation $1/k$. In particular, exclusion and inclusion have the same fixed-$k$ atomic limit as independent walkers: the interaction contributes only through microscopic near-collisions, whose rescaled occupation time vanishes. The proof combines self-duality, consistency-based reduction to two particles, and Green-function estimates for finite perturbations of symmetric random walks.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31581", "arxiv_id": "2610.31581", "type": "arXiv", "journal": "arXiv:2610.31581", "journal_ref": "", "title": "Breathing and quadrupole modes in squeezed Bose-Bose liquid drops", "authors": "Marko Korda, Leandra Vranješ Markić, Jordi Boronat", "corresponding": "", "url": "https://arxiv.org/abs/2610.31581", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "We investigate the lowest excitation modes of binary $^{39}$K ultradilute droplets confined harmonically in one direction, which reduces the critical number of particles needed to sustain a self-bound state. Using the density functional built from first-principles quantum Monte Carlo calculations (QMC), which incorporates the effects of finite range interactions, we study the crossover of the osci", "summary": "We investigate the lowest excitation modes of binary $^{39}$K ultradilute droplets confined harmonically in one direction, which reduces the critical number of particles needed to sustain a self-bound state. Using the density functional built from first-principles quantum Monte Carlo calculations (QMC), which incorporates the effects of finite range interactions, we study the crossover of the osci", "abstract": "We investigate the lowest excitation modes of binary $^{39}$K ultradilute droplets confined harmonically in one direction, which reduces the critical number of particles needed to sustain a self-bound state. Using the density functional built from first-principles quantum Monte Carlo calculations (QMC), which incorporates the effects of finite range interactions, we study the crossover of the oscillation modes from three to two dimensions. For weak squeezing, we observe the coupling between breathing and quadrupole modes, resulting from the breaking of spherical symmetry. Increasing the squeezing, the higher-frequency mode corresponding to three-dimensional breathing mode becomes unstable. For squeezings stronger and comparable to experiments, we analyze the dependence of the excitation modes on the droplet size for several interactions and show the reduction of the number of particles needed to sustain stable oscillations. The differences between the results obtained with the QMC functional and the extended Gross-Pitaevskii theory are increased with respect to the case of previously studied spherical droplets.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30905", "arxiv_id": "2610.30905", "type": "arXiv", "journal": "arXiv:2610.30905", "journal_ref": "", "title": "Broadband emitter localization and prefabrication two-photon interference from InAs/InP quantum dots monolithically grown on an InGaAsP/InP distributed Bragg reflector", "authors": "Paweł Mrowiński, Jan Śmigiel, Mikołaj Badura et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30905", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "We demonstrate a monolithic telecom C-band single-photon platform based on low-density InAs/InP quantum dots grown on an InGaAsP/InP distributed Bragg reflector, with simulated upward light-extraction efficiency exceeding 10% within the 40 nm spectral band. Enhanced light extraction is crucial for wide-field photoluminescence imaging, enabling approximately 3 nm statistical centroid-localization p", "summary": "We demonstrate a monolithic telecom C-band single-photon platform based on low-density InAs/InP quantum dots grown on an InGaAsP/InP distributed Bragg reflector, with simulated upward light-extraction efficiency exceeding 10% within the 40 nm spectral band. Enhanced light extraction is crucial for wide-field photoluminescence imaging, enabling approximately 3 nm statistical centroid-localization p", "abstract": "We demonstrate a monolithic telecom C-band single-photon platform based on low-density InAs/InP quantum dots grown on an InGaAsP/InP distributed Bragg reflector, with simulated upward light-extraction efficiency exceeding 10% within the 40 nm spectral band. Enhanced light extraction is crucial for wide-field photoluminescence imaging, enabling approximately 3 nm statistical centroid-localization precision of QD emitters due to improved signal-to-noise ratio. The identified charged exciton emitting at 1549.5 nm exhibits single-photon emission purity up to 94.7%, validated by a raw peak-area integration under pulsed quasi-resonant excitation. Under these conditions, photons emitted sequentially from the unprocessed planar structure reveal a raw two-photon interference visibility of 51% of the photon wave packet within the 2 ns time window and 41% over a 4 ns integration window, all without Purcell enhancement typical for cavity-embedded emitters. Combining broadband extraction, high photon coherence, and emitter preselection on a native III-V wafer, this architecture paves the way for marker-based deterministic fabrication of high-quality monolithic nanophotonic devices.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30766", "arxiv_id": "2610.30766", "type": "arXiv", "journal": "arXiv:2610.30766", "journal_ref": "", "title": "Coulomb-Driven Electronic Textures in Lightly Hole-Doped Cuprates", "authors": "Wei-Wei Yang, Yang Shen, Yuxin Wang et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30766", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Motivated by recent experiments on Ca$_2$CuO$_2$Cl$_2$, we present a comprehensive study of the interplay between dopants and localized Zhang-Rice singlets in lightly hole-doped cuprates. Owing to the poorly screened Coulomb potential, the interactions between dopants and localized Zhang-Rice singlets favor asymmetric electronic configurations characterized by effective electric \"dipoles\". Using t", "summary": "Motivated by recent experiments on Ca$_2$CuO$_2$Cl$_2$, we present a comprehensive study of the interplay between dopants and localized Zhang-Rice singlets in lightly hole-doped cuprates. Owing to the poorly screened Coulomb potential, the interactions between dopants and localized Zhang-Rice singlets favor asymmetric electronic configurations characterized by effective electric \"dipoles\". Using t", "abstract": "Motivated by recent experiments on Ca$_2$CuO$_2$Cl$_2$, we present a comprehensive study of the interplay between dopants and localized Zhang-Rice singlets in lightly hole-doped cuprates. Owing to the poorly screened Coulomb potential, the interactions between dopants and localized Zhang-Rice singlets favor asymmetric electronic configurations characterized by effective electric \"dipoles\". Using the MPS-based Lanczos method, we show that these localized holes give rise to in-gap bound states within the charge-transfer gap. When tunneling matrix-element effects are included, the bound states exhibit a characteristic $4a_0 \\times 2a_0$ internal structure, consistent with experimental observations. Our results suggest that Coulomb interactions between dopants and localized Zhang-Rice singlets, together with tunneling matrix-element effects, provide a microscopic mechanism for the observed $4a_0$ electronic structures.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30591", "arxiv_id": "2610.30591", "type": "arXiv", "journal": "arXiv:2610.30591", "journal_ref": "", "title": "Decoding Composition-Structure-Performance Relations in Sodium Layered Oxide Positive Electrode Materials", "authors": "Yunyeong Choi, Hasindhi H. Lokuge, Joshua D. Bocarsly et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30591", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Layered sodium transition-metal (TM) oxides, Na$_x$TMO$_2$, are among the most promising sodium-ion positive electrode materials, yet their Na/vacancy orderings, layer stacking sequences, and cooperative Jahn--Teller distortions are known only for a few single-TM compounds. We compile the Na/vacancy orderings reported in earlier studies into a single library of 41 unique orderings and apply this u", "summary": "Layered sodium transition-metal (TM) oxides, Na$_x$TMO$_2$, are among the most promising sodium-ion positive electrode materials, yet their Na/vacancy orderings, layer stacking sequences, and cooperative Jahn--Teller distortions are known only for a few single-TM compounds. We compile the Na/vacancy orderings reported in earlier studies into a single library of 41 unique orderings and apply this u", "abstract": "Layered sodium transition-metal (TM) oxides, Na$_x$TMO$_2$, are among the most promising sodium-ion positive electrode materials, yet their Na/vacancy orderings, layer stacking sequences, and cooperative Jahn--Teller distortions are known only for a few single-TM compounds. We compile the Na/vacancy orderings reported in earlier studies into a single library of 41 unique orderings and apply this uniformly to five single-TM and all ten Na$_x$TM$_{0.5}$TM$'_{0.5}$O$_2$ oxides (TM = Ti, Mn, Fe, Co, Ni), screening more than 120,000 structures with machine-learning interatomic potentials prior to 1,025 accurate first-principles calculations. The phase diagrams explain the observed O3/P3/O1 sequences and voltages, and the O3-to-P3 competition hinges on ordering energies of a few meV per atom that scalar descriptors, such as the cationic potential and the interlayer-slab distance, miss. Our extensive analysis reveals that the redox couples form a nearly partner-independent ladder, Ti$^{3+/4+}$ $<$ Mn$^{3+/4+}$ $<$ Co$^{3+/4+}$ $<$ Ni$^{2+/3+}$ $<$ Fe$^{3+/4+}$, explaining pristine charge transfer and the oxidation sequence. Van Vleck analysis of every TMO$_6$ octahedron reveals that TM mixing suppresses the cooperative Jahn--Teller distortions of Mn$^{3+}$ and Ni$^{3+}$ through charge transfer to Jahn--Teller-inactive states or dilution of Jahn--Teller-active centers. We formulate an energy-density-versus-strain map that yields a design rule: a high-voltage couple without Jahn--Teller strain, which Mn$^{4+}$/Ni$^{2+}$ charge transfer realizes in Na$_x$Mn$_{0.5}$Ni$_{0.5}$O$_2$, the most practical composition. We release the ordering-resolved dataset as a training set for subsequent training of accurate machine-learning interatomic potentials.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30977", "arxiv_id": "2610.30977", "type": "arXiv", "journal": "Physica Scripta, 2026", "journal_ref": "Physica Scripta, 2026", "title": "Donor-acceptor recombination in diamond", "authors": "Konstantin Iakoubovskii, Andrey Katrusha, Weihua Peng et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30977", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "We re-examine several optical systems that have previously been attributed to donor-acceptor (D-A) recombination in diamond, including the broad 2.8 eV and 2.3 eV bands, and the sharp-lined series in the ranges 2.0-2.7 eV and 4.0-5.0 eV. In all cases, internal transitions at one or multiple defect centers provide a more consistent explanation of the experimental observations than the D-A model. Th", "summary": "We re-examine several optical systems that have previously been attributed to donor-acceptor (D-A) recombination in diamond, including the broad 2.8 eV and 2.3 eV bands, and the sharp-lined series in the ranges 2.0-2.7 eV and 4.0-5.0 eV. In all cases, internal transitions at one or multiple defect centers provide a more consistent explanation of the experimental observations than the D-A model. Th", "abstract": "We re-examine several optical systems that have previously been attributed to donor-acceptor (D-A) recombination in diamond, including the broad 2.8 eV and 2.3 eV bands, and the sharp-lined series in the ranges 2.0-2.7 eV and 4.0-5.0 eV. In all cases, internal transitions at one or multiple defect centers provide a more consistent explanation of the experimental observations than the D-A model. The 2.3 eV case is marginal, where the key argument against the D-A recombination is the improbably low probability of tunneling between remote donors and acceptors in diamonds with very low concentrations of impurities (~0.1 ppm). A more realistic model for the 2.3 eV band and the associated phosphorescence and thermoluminescence phenomena is trapping of electrons and holes at nitrogen and boron defects, respectively, followed by recombination at a deep center, which is tentatively assigned to the nearest neighbor B-N pair.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2608-16486", "arxiv_id": "2608.16486", "type": "arXiv", "journal": "arXiv:2608.16486", "journal_ref": "", "title": "Effective field equations with stochastic initial conditions", "authors": "Ian G. Moss", "corresponding": "", "url": "https://arxiv.org/abs/2608.16486", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "The evolution of quantum field expectation values from an initial non-equilibrium quantum state can be followed numerically using the Truncated Wigner technique. It can track non-perturbative quantum phenomena, such as false vacuum decay, in real time with promising results. Nevertheless, it is an approximate method subject to quantum loop corrections. The extension of Truncated Wigner into a full", "summary": "The evolution of quantum field expectation values from an initial non-equilibrium quantum state can be followed numerically using the Truncated Wigner technique. It can track non-perturbative quantum phenomena, such as false vacuum decay, in real time with promising results. Nevertheless, it is an approximate method subject to quantum loop corrections. The extension of Truncated Wigner into a full", "abstract": "The evolution of quantum field expectation values from an initial non-equilibrium quantum state can be followed numerically using the Truncated Wigner technique. It can track non-perturbative quantum phenomena, such as false vacuum decay, in real time with promising results. Nevertheless, it is an approximate method subject to quantum loop corrections. The extension of Truncated Wigner into a fully fledged effective field equation approach is discussed here, including corrections from higher loops and higher momenta.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2602-12944", "arxiv_id": "2602.12944", "type": "arXiv", "journal": "arXiv:2602.12944", "journal_ref": "", "title": "Electrostatic edge effects versus edge doping in graphene nanoribbons: a scanning gate microscopy and modelling study", "authors": "Colm Durkan, Xiao Liu, Ed Saunders", "corresponding": "", "url": "https://arxiv.org/abs/2602.12944", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "The charge neutrality point (CNP) of graphene nanoribbons (GNRs) patterned by oxygen plasma etching moves towards zero as the ribbon narrows and, on 300 nm SiO2, changes sign below a crossover width of ~ 50 nm: an observation previously attributed to n-type edges surrounding a p-type bulk. We test this edge-doping hypothesis in three ways. First, finite element modelling of complete GNR transistor", "summary": "The charge neutrality point (CNP) of graphene nanoribbons (GNRs) patterned by oxygen plasma etching moves towards zero as the ribbon narrows and, on 300 nm SiO2, changes sign below a crossover width of ~ 50 nm: an observation previously attributed to n-type edges surrounding a p-type bulk. We test this edge-doping hypothesis in three ways. First, finite element modelling of complete GNR transistor", "abstract": "The charge neutrality point (CNP) of graphene nanoribbons (GNRs) patterned by oxygen plasma etching moves towards zero as the ribbon narrows and, on 300 nm SiO2, changes sign below a crossover width of ~ 50 nm: an observation previously attributed to n-type edges surrounding a p-type bulk. We test this edge-doping hypothesis in three ways. First, finite element modelling of complete GNR transistors with uniform doping shows that fringing of the gate field at the edges reproduces the trend of the measured CNP with width down to ~ 50nm without any edge doping, while producing a bias-dependent inversion of the carrier type at the edges that mimics n-type edges in scanned-probe measurements. Second, fitting the CNP of ribbons on 90 nm and 300 nm SiO2 with the gate capacitance of a finite strip, which fixes the electrostatic contribution with no adjustable parameter other than the bulk doping, shows that fringing accounts for most of the width dependence and isolates the remainder as an edge charge. This is acceptor-like (0.24 e/nm per edge) in the present ribbons, which therefore have no n-type edges, and donor-like but small in devices on 300 nm SiO2; no single edge-charge, field-coupled or contact-doping mechanism describes both. Third, scanning gate microscopy finds no edge contrast of the sign expected for n-type edges. The width dependence of the CNP is therefore
