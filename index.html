pecific numerical result.", "result_zh": "摘要指出，该理论可对激子传感实验作出更定量的解释；这类实验利用共振频率调制探测远程强关联二维电子流体不同状态之间的转变。摘要未报告具体数值结果。", "future_en": "The theory provides a basis for quantitative analysis of excitonic sensing in van der Waals heterostructures and for applying it to nearby correlated electron systems.", "future_zh": "该理论为范德华异质结构中的激子传感定量分析，以及将此方法用于邻近的关联电子系统，提供了基础。"}, {"id": "doi-10-1038-s41567-026-03495-x", "doi": "10.1038/s41567-026-03495-x", "title": "A simple twist to altermagnetism", "type": "Journal", "journal": "Nature Physics", "authors": "Yingying Zhang, Cheng Song", "abstract": "Two-dimensional altermagnets hold promise for next-generation spintronics but remain difficult to synthesize. Now, altermagnetism has been observed in an orthogonally twisted van der Waals homostructure, opening possibilities for ultrathin devices.", "published_online": [[2026, 10, 26]], "corresponding": "", "url": "https://doi.org/10.1038/s41567-026-03495-x", "level": "Brief", "method": "", "result": "", "future": "", "abstract_source": "publisher", "abstract_status": "available", "topic": "Magnetism", "summary_en": "The abstract reports the observation of altermagnetism in an orthogonally twisted van der Waals homostructure and identifies this as a potential route toward ultrathin spintronic devices.", "summary": "Two-dimensional altermagnets hold promise for next-generation spintronics but remain difficult to synthesize. Now, altermagnetism has been observed in an orthogonally twisted van der Waals homostructure, opening possibilities for ultrathin devices.", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "Altermagnetism is observed in an orthogonally twisted van der Waals homostructure, establishing twisting as a route to realize this magnetic state in a two-dimensional system.", "ai_in_scope": true, "relevance_reason": "The reported observation of altermagnetism in a twisted van der Waals homostructure is a substantive experimental result in quantum materials physics.", "relevance_method": "semantic", "relevance_score": 76, "feature_candidate": false, "summary_zh": "摘要报告在正交扭转的范德华同质结构中观测到交错磁性，并指出这可能为超薄自旋电子器件提供一条途径。", "method_en": "The abstract does not specify the experimental or theoretical methods used to observe altermagnetism.", "method_zh": "摘要未说明用于观测交错磁性的实验或理论方法。", "result_en": "Altermagnetism is reported in an orthogonally twisted van der Waals homostructure, addressing the stated difficulty of synthesizing two-dimensional altermagnets.", "result_zh": "研究报告在正交扭转的范德华同质结构中发现交错磁性，回应了二维交错磁体难以合成这一问题。", "future_en": "The authors suggest that the result opens possibilities for ultrathin spintronic devices.", "future_zh": "作者指出，这一结果为超薄自旋电子器件带来了可能性。"}, {"id": "doi-10-1103-qqqh-6b6q", "doi": "10.1103/qqqh-6b6q", "title": "Microscopic Geometric Theory for Gapped Excitations in Fractional Topological Fluids", "type": "Journal", "journal": "PRL", "authors": "Yuzhu Wang, Bo Yang", "abstract": "We propose a geometric description of all gapped excitations in fractional quantum Hall phases that reveals several fundamental understandings with experimental consequences. These include a duality between the Hilbert space of multiple gapped ``graviton-like\" spin 2 excitations at $ν=1/3$ Laughlin phase, and that of non-Abelian quasiholes of an irrational Haffnian conformal field theory. This leads us to construct microscopic wave functions for multiple higher-spin gapped neutral modes in the Laughlin phase. Carrying spin $s \\ge 2$, they emerge from higher-order geometric deformations of the topological ground state, and live within the Gaffnian conformal Hilbert space asymptotically. We show that the full many-body Hilbert space of an FQH phase can be generated from superpositions of such geometric deformations, supporting a concrete geometric interpretation of all gapped excitations. We analyse the scattering between these higher spin modes and conjecture that they can have a long lifetime, and propose methods for their experimental detection.", "published_online": [[2026, 10, 26]], "corresponding": "", "url": "https://doi.org/10.1103/qqqh-6b6q", "level": "Brief", "method": "", "result": "", "future": "", "abstract_source": "http://arxiv.org/abs/2603.13489v1", "abstract_status": "available", "topic": "Magnetism", "summary_en": "The paper proposes a geometric account of gapped excitations in fractional quantum Hall phases, relating higher-spin neutral modes in the ν = 1/3 Laughlin phase to geometric deformations of the ground state and to conformal-field-theory Hilbert spaces.", "summary": "We propose a geometric description of all gapped excitations in fractional quantum Hall phases that reveals several fundamental understandings with experimental consequences. These include a duality between the Hilbert space of multiple gapped ``graviton-like\" spin 2 excitations at $ν=1/3$ Laughlin phase, and that of non-Abelian quasiholes of an irrational Haffnian conformal field theory. This lea", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "It constructs higher-spin neutral-mode wavefunctions in the Laughlin phase from geometric deformations, relates their asymptotic space to the Gaffnian conformal Hilbert space, and identifies a duality connecting multiple spin-2 excitations with non-Abelian qua", "ai_in_scope": true, "relevance_reason": "This is original theoretical work on excitations and geometric structure in fractional quantum Hall matter, with proposed experimentally testable consequences.", "relevance_method": "semantic", "relevance_score": 81, "feature_candidate": false, "summary_zh": "该论文提出分数量子霍尔相中有隙激发的几何描述，将 ν = 1/3 Laughlin 相中的高自旋中性模与基态的几何形变及共形场论希尔伯特空间联系起来。", "method_en": "The authors construct microscopic wave functions for multiple higher-spin neutral modes using higher-order geometric deformations of the topological ground state. They also analyze mode scattering and relate the resulting states to Gaffnian and Haffnian conformal Hilbert spaces.", "method_zh": "作者通过对拓扑基态施加高阶几何形变，构造多个高自旋中性模的微观波函数。他们还分析模之间的散射，并将相关态与 Gaffnian 和 Haffnian 共形希尔伯特空间联系起来。", "result_en": "The authors describe a duality between the Hilbert space of multiple spin-2 “graviton-like” excitations in the ν = 1/3 Laughlin phase and that of non-Abelian quasiholes in an irrational Haffnian conformal field theory. They construct higher-spin gapped neutral-mode wave functions for s ≥ 2, find that these modes asymptotically lie within the Gaffnian conformal Hilbert space, and argue that superpositions of geometric deformations can generate the full many-body Hilbert space of an FQH phase. Their scattering analysis leads them to conjecture that the modes may have long lifetimes.", "result_zh": "作者描述了 ν = 1/3 Laughlin 相中多个自旋 2“类引力子”激发的希尔伯特空间与无理 Haffnian 共形场论非阿贝尔准空穴希尔伯特空间之间的对偶关系。他们构造了自旋 s ≥ 2 的高自旋有隙中性模波函数，并发现这些模在渐近意义下属于 Gaffnian 共形希尔伯特空间；作者还提出，几何形变的叠加可生成 FQH 相的完整多体希尔伯特空间。对模间散射的分析使作者推测这些模可能具有较长寿命。", "future_en": "The authors propose methods for experimentally detecting the higher-spin modes and identify their potentially long lifetimes as a conjecture for further examination.", "future_zh": "作者提出了实验探测这些高自旋模的方法，并将其可能具有较长寿命的判断作为有待进一步检验的猜想。"}, {"id": "doi-10-1103-wk6v-1x5s", "doi": "10.1103/wk6v-1x5s", "title": "Ultrasensitive strain modulation of terahertz magnons at a magnetic phase transition", "type": "Journal", "journal": "PRL", "authors": "Lichen Wang, Sajna Hameed, Yiran Liu, Manuel Knauft, Kazuki Higuchi, Maximilian Krautloher, Sonia Francoual, Giniyat Khaliullin, Huimei Liu, Matteo Minola, Bernhard Keimer", "abstract": "Antiferromagnets typically host spin-wave (magnon) excitations in the terahertz (THz) regime, offering a promising platform for high-speed magnonic information technologies. Harnessing these excitations requires sensitive control of their spectral properties. Here we use resonant x-ray diffraction and Raman scattering to demonstrate uniaxial-strain control of the antiferromagnetic (AFM) ground state and THz magnon excitations in the layered Mott insulator Ca$_2$RuO$_4$. Although the states separated by the strain-induced phase transition differ only by the sign of the weak and partially frustrated interlayer interaction, their magnon energies differ by more than 10% (~ 0.3 THz). Our theoretical analysis explains this surprising observation by tracing the origin of both the sign reversal of the interlayer coupling and the magnon energy to the spin-orbital composition of the Ru valence electrons. The extreme strain sensitivity of the THz magnon energy near a magnetic phase transition opens up pathways towards a new generation of transition-edge magnonic devices.", "published_online": [[2026, 10, 26]], "corresponding": "", "url": "https://doi.org/10.1103/wk6v-1x5s", "level": "Feature", "method": "", "result": "", "future": "", "abstract_source": "http://arxiv.org/abs/2602.13924v1", "abstract_status": "available", "topic": "Magnetism", "summary_en": "In Ca2RuO4, uniaxial strain across a magnetic phase transition changes the THz magnon energy by more than 10% (about 0.3 THz), although the two antiferromagnetic states differ only in the sign of a weak, partly frustrated interlayer interaction. Theoretical analysis attributes the effect to the spin-orbital composition of the Ru valence electrons.", "summary": "Antiferromagnets typically host spin-wave (magnon) excitations in the terahertz (THz) regime, offering a promising platform for high-speed magnonic information technologies. Harnessing these excitations requires sensitive control of their spectral properties. Here we use resonant x-ray diffraction and Raman scattering to demonstrate uniaxial-strain control of the antiferromagnetic (AFM) ground sta", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "Shows that a strain-induced reversal of weak interlayer coupling across a magnetic phase transition accompanies a greater than 10% change in magnon energy, explained by the spin-orbital composition of Ru valence electrons.", "ai_in_scope": true, "relevance_reason": "Experiments and theory establish strain-controlled changes in the antiferromagnetic state and terahertz magnon spectrum of the correlated Mott insulator Ca2RuO4.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": true, "summary_zh": "在Ca2RuO4中，跨越磁相变施加单轴应变可使太赫兹磁振子能量改变超过10%（约0.3 THz），尽管两种反铁磁态仅在弱且部分受挫的层间相互作用符号上不同。理论分析将这一效应归因于Ru价电子的自旋—轨道组成。", "method_en": "Resonant x-ray diffraction and Raman scattering are used to track the strain-controlled antiferromagnetic ground state and THz magnon excitations in layered Ca2RuO4. The authors combine these measurements with theoretical analysis of the interlayer coupling and magnon energy in relation to the Ru valence-electron spin-orbital composition.", "method_zh": "研究利用共振X射线衍射和拉曼散射，追踪层状Ca2RuO4中由应变控制的反铁磁基态及太赫兹磁振子激发。作者结合理论分析，考察层间耦合和磁振子能量与Ru价电子自旋—轨道组成之间的关系。", "result_en": "Uniaxial strain controls the antiferromagnetic ground state and the THz magnon excitations across a strain-induced phase transition. The two states differ only by the sign of the weak and partially frustrated interlayer interaction, yet their magnon energies differ by more than 10%, approximately 0.3 THz. The theoretical analysis traces both the sign reversal of the interlayer coupling and the magnon-energy change to the spin-orbital composition of the Ru valence electrons. The authors identify the strong strain sensitivity near the magnetic phase transition as a possible route toward transition-edge magnonic devices.", "result_zh": "单轴应变可跨越应变诱导的相变控制反铁磁基态和太赫兹磁振子激发。两种状态仅在弱且部分受挫的层间相互作用符号上不同，但磁振子能量相差超过10%，约为0.3 THz。理论分析将层间耦合符号反转和磁振子能量变化都追溯至Ru价电子的自旋—轨道组成。作者指出，磁相变附近的强应变敏感性可能为相变边缘磁振子器件提供途径。", "future_en": "Further experiments could map how the magnon spectrum responds to strain in the vicinity of the transition and test the proposed link to the Ru spin-orbital composition. The strong strain response also motivates exploring whether transition-edge magnonic devices can use this tunability.", "future_zh": "后续实验可绘制相变附近磁振子谱随应变变化的规律，并检验其与Ru自旋—轨道组成之间的所提联系。显著的应变响应也促使人们探索相变边缘磁振子器件能否利用这种可调性。"}, {"id": "arxiv-2610-32797", "arxiv_id": "2610.32797", "type": "arXiv", "journal": "arXiv:2610.32797", "journal_ref": "", "title": "Unconventional charge density wave order in ErTe$_{3}$: symmetry breakings and fluctuations probed by Raman scattering", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-23T15:39:26Z", "updated_at": "2026-10-23T15:39:26Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Théotime Freitas, Mattia Udina, Alexandr Alekhin, Niloufar Nilforoushan, Sarah Houver, Alain Sacuto, Benito A. Gonzalez, Ian R. Fisher, Indranil Paul, Yann Gallais", "corresponding": "", "url": "https://arxiv.org/abs/2610.32797v1", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "Polarization-resolved Raman measurements in ErTe₃ track symmetry breaking across its charge-density-wave transition and find that the mirror-symmetry breaking follows CDW onset, while significant ferro-axial fluctuations above the transition are absent.", "summary": "Recent experiments have revealed unexpected mirror-symmetry breakings in the charge density-wave (CDW) state of rare-earth tritellurides, suggesting a putative ferro-axial CDW state. Here we report polarization-resolved Raman scattering measurements tracking the point-group symmetry breakings across the CDW phase transition in the rare-earth tritelluride ErTe$_3$. We show that the mirror-symmetry ", "abstract": "Recent experiments have revealed unexpected mirror-symmetry breakings in the charge density-wave (CDW) state of rare-earth tritellurides, suggesting a putative ferro-axial CDW state. Here we report polarization-resolved Raman scattering measurements tracking the point-group symmetry breakings across the CDW phase transition in the rare-earth tritelluride ErTe$_3$. We show that the mirror-symmetry breakings follow closely the emergence of the CDW order, suggesting a single component CDW order parameter. Furthermore, Raman measurements in the $A_{2g}$ symmetry channel above the CDW transition temperature indicate the absence of significant ferro-axial fluctuations. We discuss the broad implications of these findings with respect to the nature of the CDW state in the tritellurides.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "In ErTe₃, mirror-symmetry breaking tracks the CDW transition and is consistent with a single-component order parameter, while the measurements find no significant ferro-axial fluctuations above the transition.", "ai_in_scope": true, "relevance_reason": "The Raman measurements establish how symmetry breaking and fluctuations relate to charge-density-wave order in a quantum material.", "relevance_method": "semantic", "relevance_score": 76, "feature_candidate": false, "summary_zh": "研究通过偏振分辨拉曼测量追踪ErTe₃电荷密度波转变过程中的对称性破缺，发现镜面对称性破缺随CDW序的出现而产生，而转变温度以上不存在显著的铁轴向涨落。", "method_en": "The study measures polarization-resolved Raman response across the CDW transition, including the A₂g symmetry channel above the transition temperature.", "method_zh": "研究测量了CDW转变前后的偏振分辨拉曼响应，并考察了转变温度以上的A₂g对称性通道。", "result_en": "The mirror-symmetry breaking closely tracks the emergence of CDW order, supporting a single-component CDW order parameter; the A₂g data show no significant ferro-axial fluctuations above the transition.", "result_zh": "镜面对称性破缺紧随CDW序的出现，支持单分量CDW序参量的解释；A₂g通道数据表明转变温度以上没有显著的铁轴向涨落。", "future_en": "Further work could clarify the broader implications of these symmetry and fluctuation results for the nature of CDW order in the tritellurides.", "future_zh": "后续研究可进一步阐明这些对称性与涨落结果对三碲化物中CDW序本质的广泛意义。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The abstract describes a focused Raman study that constrains the symmetry and fluctuations of the CDW state, but does not indicate a broader discovery or unusually extensive scope.", "tier_reason_zh": "摘要介绍了一项针对性较强的拉曼研究，对CDW态的对称性和涨落作出约束，但未显示出更广泛的突破性发现或特别广的研究范围。"}, {"id": "arxiv-2610-31732", "arxiv_id": "2610.31732", "type": "arXiv", "journal": "arXiv:2610.31732", "journal_ref": "Phys. Rev. Lett. 137, 176702 (2026)", "title": "Altermagnetism in Folded Iron Chain Systems", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-22T15:55:01Z", "updated_at": "2026-10-22T15:55:01Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Ling-Fang Lin, Yang Zhang, Satoshi Okamoto, Adriana Moreo, Lun-Hui Hu, Elbio Dagotto", "corresponding": "", "url": "https://arxiv.org/abs/2610.31732v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The study proposes that quasi-one-dimensional folded iron-chain systems with block-type magnetic order can host altermagnetism through chain stacking, and identifies the K₃Fe₂Se₄ family as a candidate platform.", "summary": "Altermagnetism, a moment-compensated magnetism with momentum-dependent spin splitting, has so far been realized primarily in Néel-type antiferromagnets. Here, we demonstrate altermagnetism in folded iron-chain systems with block-type magnetic order (e.g., $\\uparrow \\uparrow \\downarrow \\downarrow$). In the strictly one-dimensional (1D) case, altermagnetism is forbidden by the $[C_2||{\\cal T}]$ symm", "abstract": "Altermagnetism, a moment-compensated magnetism with momentum-dependent spin splitting, has so far been realized primarily in Néel-type antiferromagnets. Here, we demonstrate altermagnetism in folded iron-chain systems with block-type magnetic order (e.g., $\\uparrow \\uparrow \\downarrow \\downarrow$). In the strictly one-dimensional (1D) case, altermagnetism is forbidden by the $[C_2||{\\cal T}]$ symmetry, but it can emerge when such chains are stacked into a quasi-1D array. To generate altermagnetic spin splitting via this chain-stacking mechanism, two essential ingredients are required: a block-type spin order that spontaneously breaks the combined parity-time reversal symmetry, and finite inter-chain hopping. Using first-principles calculations, we identify the K$_3$Fe$_2$Se$_4$ family as a promising platform that realizes this mechanism, hosting a $d$-wave altermagnet even without lattice $C_{4}$ symmetry. Moreover, owing to its lower symmetry, the block-type folded chain exhibits an isotropic altermagnetic spin splitting, which may manifest as an altermagnetic wrapping effect. Our findings unify real-space block magnetism and reciprocal-space altermagnetism, establishing folded iron chains as a tunable platform for zero-moment spintronic applications.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Stacking block-ordered iron chains with finite inter-chain hopping can produce altermagnetic spin splitting, including a proposed realization in the K₃Fe₂Se₄ family without lattice C₄ symmetry.", "ai_in_scope": true, "relevance_reason": "This original theoretical work identifies a symmetry and inter-chain-hopping mechanism for altermagnetism in folded iron-chain systems and proposes a material family realizing it.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "研究提出，具有块状磁序的准一维折叠铁链体系可通过链间堆叠实现交错磁性，并将K₃Fe₂Se₄家族确定为候选平台。", "method_en": "First-principles calculations are used to analyze the symmetry conditions and spin splitting of folded iron chains with block-type magnetic order.", "method_zh": "研究利用第一性原理计算分析具有块状磁序的折叠铁链体系中的对称性条件与自旋劈裂。", "result_en": "The proposed mechanism requires block-type order that breaks combined parity-time reversal symmetry and finite inter-chain hopping; strictly one-dimensional chains are instead forbidden from being altermagnetic by [C₂||𝒯] symmetry. The K₃Fe₂Se₄ family is identified as a candidate d-wave altermagnet without lattice C₄ symmetry, and its lower symmetry is associated with isotropic altermagnetic spin splitting that may produce an altermagnetic wrapping effect.", "result_zh": "所提出的机制要求块状磁序破坏宇称与时间反演的联合对称性，并要求存在有限的链间跃迁；严格一维链则因[C₂||𝒯]对称性而不能呈现交错磁性。研究将K₃Fe₂Se₄家族确定为无需晶格C₄对称性的候选d波交错磁体，并指出其较低对称性对应各向同性的交错磁自旋劈裂，可能产生交错磁绕转效应。", "future_en": "Further work could examine whether the predicted chain-stacking mechanism and spin-splitting signatures are realized in candidate materials.", "future_zh": "后续研究可考察候选材料中是否确实实现了所预测的链间堆叠机制与自旋劈裂特征。"}, {"id": "arxiv-2610-31952", "arxiv_id": "2610.31952", "type": "arXiv", "journal": "arXiv:2610.31952", "journal_ref": "", "title": "Dipole chains of Bloch point singularities revealed by X-ray magnetic tomography", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall", "cond-mat.mtrl-sci"], "submitted_at": "2026-10-22T21:59:42Z", "updated_at": "2026-10-22T21:59:42Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Jeffrey Neethirajan, Rikako Yamamoto, Marisel Di Pietro Martínez, Luke A. Turnbull, Praveen Vir, Chandra Shekar, Claudia Felser, Luis Carlos Colocho Hurtarte, Benedikt J. Daurer, Majid Kazemian, Burkhard Kaulich, Claire Donnelly", "corresponding": "", "url": "https://arxiv.org/abs/2610.31952v1", "topic": "Magnetism", "level": "Brief", "summary_en": "Soft X-ray magnetic vector tomography reveals a one-dimensional chain of Bloch and anti-Bloch points along a boundary between regions of opposite chirality in an anisotropic chiral magnet. Neighboring points remain stable at separations down to 60 nm, with spontaneous pair annihilation in chiral domain walls occurring below an approximately 90 nm threshold.", "summary": "Bloch point singularities play an important role in magnetic systems, mediating changes in topology in three dimensional configurations. However, until now they have only been observed as isolated objects or as part of individual topological textures. Here we present the experimental observation of a 1D dipole chain of Bloch points in an anisotropic chiral magnet using soft X-ray magnetic vector t", "abstract": "Bloch point singularities play an important role in magnetic systems, mediating changes in topology in three dimensional configurations. However, until now they have only been observed as isolated objects or as part of individual topological textures. Here we present the experimental observation of a 1D dipole chain of Bloch points in an anisotropic chiral magnet using soft X-ray magnetic vector tomography. We identify that the chain of Bloch point singularities lies along a boundary between regions of opposite chirality and that neighbouring Bloch and anti-Bloch points are stable at separations down to 60 nm. The stability of the Bloch points is determined to be closely related to the surrounding topology of the magnetisation configuration and a threshold separation for the spontaneous annihilation of Bloch point-anti-Bloch point pairs within chiral domain walls is identified to be approximately 90 nm in distance. This observation of a chain of Bloch points and the insight into their stability, offers a route to explore the correlative behaviour of such topological point defects. The behaviour and control of such point defects is of relevance for the control of 3D magnetisation configurations, and provides a new route towards the creation of correlated configurations of singularities in a magnetic system.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "A one-dimensional chain of Bloch and anti-Bloch points is observed along a boundary between opposite-chirality regions, with a measured pair-annihilation threshold of about 90 nm.", "ai_in_scope": true, "relevance_reason": "This is original experimental magnetism research establishing topological point-defect structures and stability in a chiral magnet.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": false, "summary_zh": "软X射线磁矢量断层成像在各向异性手性磁体中揭示了一维Bloch点与反Bloch点链，其位于手性相反区域的边界上。相邻奇点在间距低至60 nm时仍稳定，而手性畴壁中的奇点对在间距低于约90 nm时会自发湮灭。", "method_en": "The authors use soft X-ray magnetic vector tomography to image three-dimensional magnetization configurations in an anisotropic chiral magnet and identify the positions of Bloch-point singularities. They examine the locations and separations of neighboring Bloch and anti-Bloch points in relation to the surrounding magnetic topology.", "method_zh": "作者采用软X射线磁矢量断层成像，观测各向异性手性磁体中的三维磁化构型并识别Bloch点奇点的位置。研究考察相邻Bloch点和反Bloch点的位置与间距，并将其与周围磁拓扑联系起来。", "result_en": "The tomography reveals a one-dimensional dipole chain of Bloch-point singularities along a boundary between regions of opposite chirality. Neighboring Bloch and anti-Bloch points are stable at separations down to 60 nm, while the threshold for spontaneous annihilation of pairs within chiral domain walls is approximately 90 nm. The authors relate the stability of the points to the surrounding magnetization topology.", "result_zh": "断层成像揭示了一维Bloch点奇点偶极链，位于手性相反区域之间的边界上。相邻Bloch点和反Bloch点在间距低至60 nm时仍能稳定存在，而手性畴壁中奇点对自发湮灭的阈值间距约为90 nm。作者将奇点稳定性与周围磁化拓扑联系起来。", "future_en": "The observed chains offer a basis for further study of correlations among topological point defects and of how their configurations can be controlled. Future work could examine how the reported stability and annihilation threshold vary across magnetic configurations.", "future_zh": "所观察到的奇点链为进一步研究拓扑点缺陷之间的关联及其构型控制提供了基础。后续工作可考察文中报告的稳定性和湮灭阈值如何随磁构型变化。", "tier": "PRL", "tier_reason_en": "Direct three-dimensional observation of a chain of Bloch-point singularities, together with quantitative stability and annihilation length scales, is a novel result in magnetic topology. The abstract supports a strong specialized physics paper, but does not establish a broad enough conceptual advance for a higher tier.", "tier_reason_zh": "对Bloch点奇点链的直接三维观测，以及对稳定性和湮灭长度尺度的定量研究，是磁拓扑领域的新颖结果。摘要支持其成为有力的专业物理学论文，但尚未显示足以支撑更高层级的广泛概念性突破。"}, {"id": "arxiv-2610-32261", "arxiv_id": "2610.32261", "type": "arXiv", "journal": "arXiv:2610.32261", "journal_ref": "", "title": "Intrinsic Raman Modes and Crystal Symmetry of Altermagnetic $α$-MnTe", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci"], "submitted_at": "2026-10-23T07:17:05Z", "updated_at": "2026-10-23T07:17:05Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Yunpeng Cui, Shuai Zhang, Jia-Liang Xie, Jinxuan Liang, Hao Lin, Miao Qin, Jiawei Shao, Gongling Chen, Yidian Li, Yixuan Luo, Deng Hu, Bingru Lu, Hao Li, Xiang Li, Tiantian Liu, Haodong Yu, Hongyun Zhang, Shuyun Zhou, Zhiwei Wang, Yanfeng Guo, Tiantian Zhang, Miao-Ling Lin, Ping-Heng Tan, Feng Jin, Luyi Yang", "corresponding": "", "url": "https://arxiv.org/abs/2610.32261v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The authors reassess Raman features and bulk inversion symmetry in altermagnetic α-MnTe using Raman and second-harmonic generation spectroscopy together with first-principles calculations. They conclude that several previously assigned Raman features arise from Te inclusions and that the intrinsic Raman response is consistent with centrosymmetric D₆h symmetry.", "summary": "Crystal symmetry governs the physical properties of materials and provides the framework for interpreting their microscopic excitations and macroscopic responses. In altermagnets, the crystal symmetries that relate opposite-spin sublattices give rise to momentum-dependent spin splitting despite compensated magnetization. Determining the real crystal symmetry is therefore essential for understandin", "abstract": "Crystal symmetry governs the physical properties of materials and provides the framework for interpreting their microscopic excitations and macroscopic responses. In altermagnets, the crystal symmetries that relate opposite-spin sublattices give rise to momentum-dependent spin splitting despite compensated magnetization. Determining the real crystal symmetry is therefore essential for understanding the intrinsic electronic and magnetic properties. For the altermagnetic semiconductor $α$-MnTe, conflicting Raman assignments have left both its intrinsic lattice excitations and its crystal symmetry unresolved. Here we combine high-resolution Raman and second-harmonic generation (SHG) spectroscopy with first-principles calculations to distinguish intrinsic lattice excitations from Te-derived spectral contributions and to examine bulk inversion symmetry of $α$-MnTe. We show that several prominent Raman features previously assigned to $α$-MnTe instead originate from segregated Te clusters or precipitates. The remaining intrinsic Raman response consists of a single Raman-active mode assigned to the calculated $E_{2g}$ phonon, consistent with the centrosymmetric $D_{6h}$ symmetry. The SHG response agrees with surface electric-dipole and bulk electric-quadrupole contributions expected for a centrosymmetric $D_{6h}$ crystal, supporting the preservation of bulk inversion symmetry in $α$-MnTe. Our findings revise the Raman assignments in $α$-MnTe and provide a basis for interpreting its altermagnetic properties within the appropriate crystal-symmetry framework.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "The intrinsic Raman response is identified as a single E₂g phonon, while other prominent features are attributed to Te inclusions; SHG supports centrosymmetric D₆h bulk symmetry.", "ai_in_scope": true, "relevance_reason": "This combines spectroscopy and first-principles calculations to resolve an important crystal-symmetry and lattice-mode question in the altermagnetic semiconductor α-MnTe.", "relevance_method": "semantic", "relevance_score": 77, "feature_candidate": false, "summary_zh": "作者结合拉曼与二次谐波产生光谱及第一性原理计算，重新考察交错磁性 α-MnTe 的拉曼特征和体反演对称性。他们认为，若干此前归属于 α-MnTe 的拉曼特征实际来自 Te 相，而本征拉曼响应与中心对称的 D₆h 对称性相符。", "method_en": "The study combines high-resolution Raman spectroscopy and second-harmonic generation (SHG) measurements with first-principles calculations to distinguish intrinsic lattice excitations from Te-derived spectral contributions and assess bulk inversion symmetry.", "method_zh": "研究结合高分辨拉曼光谱、二次谐波产生（SHG）测量和第一性原理计算，以区分本征晶格激发与源自 Te 的谱学贡献，并检验体反演对称性。", "result_en": "Several prominent Raman features previously assigned to α-MnTe are attributed instead to segregated Te clusters or precipitates. The remaining intrinsic Raman response consists of one Raman-active mode, assigned to the calculated E₂g phonon, while the SHG response supports preserved bulk inversion symmetry and centrosymmetric D₆h symmetry.", "result_zh": "若干此前被归属于 α-MnTe 的显著拉曼特征被重新判定为来自偏析的 Te 团簇或析出物。剩余的本征拉曼响应仅包含一个拉曼活性模，并被指认为计算得到的 E₂g 声子；SHG 响应则支持体反演对称性得以保留以及晶体具有中心对称 D₆h 对称性。", "future_en": "The revised Raman assignments provide a basis for interpreting α-MnTe’s altermagnetic properties within the appropriate crystal-symmetry framework.", "future_zh": "修订后的拉曼归属为在恰当的晶体对称性框架下理解 α-MnTe 的交错磁性提供了基础。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work addresses a consequential symmetry and spectral-assignment dispute in an altermagnetic material through complementary spectroscopy and calculations, but the abstract describes a focused reassessment rather than a broader new phenomenon.", "tier_reason_zh": "该工作通过互补光谱与计算，处理了交错磁性材料中重要的对称性和谱峰归属争议；但摘要所述主要是聚焦的重新评估，而非更广泛的新现象发现。"}, {"id": "arxiv-2610-32199", "arxiv_id": "2610.32199", "type": "arXiv", "journal": "arXiv:2610.32199", "journal_ref": "", "title": "Magnonic time crystal with lasing coherence", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall"], "submitted_at": "2026-10-23T05:51:44Z", "updated_at": "2026-10-23T05:51:44Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Jiantao Song, C. K. Wei, Shuhuan Ma, Yiming Pan, Zhijian Chen, Li Yu, Wei Lu, Bimu Yao", "corresponding": "", "url": "https://arxiv.org/abs/2610.32199v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The work reports a room-temperature magnonic time crystal in yttrium iron garnet that emits coherent subharmonic radiation and uses its nonlinear temporal dynamics for reservoir computing.", "summary": "Discrete time crystals (DTC) can respond at an integer multiple of the drive period. Internal order-parameter measurements have advanced studies of this novel non-equilibrium phase of matter; however, turning this order into highly coherent, externally accessible radiation remains challenging: pump-driven nonlinear processes must supply sufficient gain to compensate dissipation while preserving su", "abstract": "Discrete time crystals (DTC) can respond at an integer multiple of the drive period. Internal order-parameter measurements have advanced studies of this novel non-equilibrium phase of matter; however, turning this order into highly coherent, externally accessible radiation remains challenging: pump-driven nonlinear processes must supply sufficient gain to compensate dissipation while preserving subharmonic stability. Here we realize a room-temperature magnonic time crystal (MTC) with radiation of lasing coherence using a pump-induced magnon mode in yttrium iron garnet. A microwave beat drive produces robust period doubling over a finite parameter range, with spectral signatures of higher-order MTC at stronger driving. The emitted field exhibits linewidth narrowing to 260.0 Hz and a first-order correlation decay time of $995 μs$. Our model links this response to three-magnon confluence, yields a stability region consistent with experiment and predicts a possible transition to chaos. We further map the complex temporal dynamics into frequency-resolved nonlinear features for reservoir computing. These results bridge time-crystalline order and nonlinear information processing through intrinsic magnon-magnon interactions and lasing coherence.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "A room-temperature magnonic time crystal emits radiation with lasing coherence, and its period-doubled response is linked to three-magnon confluence.", "ai_in_scope": true, "relevance_reason": "The experiment reveals coherent nonequilibrium magnetic order and its nonlinear dynamics in a solid-state magnon system.", "relevance_method": "semantic", "relevance_score": 80, "feature_candidate": false, "summary_zh": "该研究在钇铁石榴石中实现了室温磁振子时间晶体，产生相干的亚谐波辐射，并利用其非线性时间动力学进行储备池计算。", "method_en": "The experiment uses a microwave beat drive to excite a pump-induced magnon mode, while a model based on three-magnon confluence is used to analyze stability and dynamics.", "method_zh": "实验通过微波拍频驱动激发泵浦诱导的磁振子模，并采用基于三磁振子合并过程的模型分析其稳定性与动力学。", "result_en": "The system shows robust period doubling over a finite parameter range and spectral signatures of higher-order time-crystalline response at stronger drive. The emitted field has a linewidth of 260.0 Hz and a first-order correlation decay time of 995 μs. The model yields a stability region consistent with experiment and predicts a possible transition to chaos; the temporal dynamics are also mapped to frequency-resolved nonlinear features for reservoir computing.", "result_zh": "该系统在有限参数范围内呈现稳健的周期倍增，并在较强驱动下出现高阶时间晶体响应的谱学特征。发射场的线宽为260.0 Hz，一阶关联衰减时间为995 μs。模型得到与实验一致的稳定区域，并预测可能发生向混沌的转变；研究还将时间动力学映射为用于储备池计算的频率分辨非线性特征。", "future_en": "Follow-up work could test the predicted transition to chaos and further assess the proposed use of the frequency-resolved dynamics for reservoir computing.", "future_zh": "后续研究可检验模型预测的混沌转变，并进一步评估这些频率分辨动力学用于储备池计算的可行性。", "tier": "PRL", "tier_reason_en": "The reported room-temperature realization combines externally accessible coherent subharmonic emission, quantified coherence, and nonlinear dynamics relevant to information processing, making it a strong and broad experimental result.", "tier_reason_zh": "该工作在室温下实现了可外部读取的相干亚谐波辐射，并量化其相干性，同时展示了与信息处理相关的非线性动力学，构成较强且具有广泛意义的实验结果。"}, {"id": "arxiv-2610-32457", "arxiv_id": "2610.32457", "type": "arXiv", "journal": "arXiv:2610.32457", "journal_ref": "", "title": "Multifractal Magnons Around Localized Defects", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall", "cond-mat.str-el"], "submitted_at": "2026-10-23T10:21:02Z", "updated_at": "2026-10-23T10:21:02Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Adarsh Hullahalli, Yusuf Khand, Christos Panagopoulos, Christina Psaroudaki", "corresponding": "", "url": "https://arxiv.org/abs/2610.32457v1", "topic": "Magnetism", "level": "Brief", "summary_en": "This work proposes that localized defects in clean two-dimensional magnets can generate mesoscopic multifractal magnon wavefunctions by mixing groups of nearly degenerate states. It identifies skyrmion-induced hybridization with magnetic deformation modes as a route to making such states optically accessible.", "summary": "Multifractal wavefunctions fluctuate over a hierarchy of spatial scales, remaining spatially extended while exhibiting strongly nonuniform structure. We show that magnons in otherwise crystalline two-dimensional magnets can exhibit such behavior on mesoscopic scales, without disorder or quasiperiodicity. A localized defect can mix discrete groups of nearly degenerate magnon states in a finite samp", "abstract": "Multifractal wavefunctions fluctuate over a hierarchy of spatial scales, remaining spatially extended while exhibiting strongly nonuniform structure. We show that magnons in otherwise crystalline two-dimensional magnets can exhibit such behavior on mesoscopic scales, without disorder or quasiperiodicity. A localized defect can mix discrete groups of nearly degenerate magnon states in a finite sample, generating multiscale interference patterns and multifractal wavefunctions. We demonstrate this mechanism for both a simple spin defect and topological magnetic skyrmions. Large-scale spin-wave calculations for skyrmions in chiral and frustrated magnets reveal clear multifractal diagnostics over the full accessible range of system sizes of above-gap modes. Crucially, skyrmions make these states experimentally observable by hybridizing them with magnetically active internal deformation modes, which gives a subset of the multifractal states a nonzero magnetic dipole moment. These states can therefore be excited by uniform ac fields and remain distinguishable at realistic frequency resolution, providing a direct route to observing mesoscopic magnon multifractality.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Localized defects, including skyrmions, can mix nearly degenerate magnon states to generate mesoscopic multifractal patterns, with skyrmion deformation modes making some states excitable by uniform ac fields.", "ai_in_scope": true, "relevance_reason": "The paper advances quantum-magnetic collective-mode physics by identifying a defect-driven route to observable magnon multifractality in otherwise crystalline magnets.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": false, "summary_zh": "本文提出，在无无序的二维磁体中，局域缺陷可通过混合近简并态群产生介观尺度的多重分形磁振子波函数。研究指出，斯格明子与磁性形变模的杂化可使这类态能够通过光学方式探测。", "method_en": "The authors analyze a simple spin defect and perform large-scale spin-wave calculations for skyrmions in chiral and frustrated magnets, using multifractal diagnostics across accessible system sizes. They also examine how hybridization with internal deformation modes affects the magnetic-dipole activity and experimental distinguishability of the states.", "method_zh": "作者分析了简单自旋缺陷，并对手性磁体和受挫磁体中的斯格明子开展大规模自旋波计算，利用可达系统尺寸范围内的多重分形诊断量进行检验。研究还考察了与内部形变模的杂化如何影响这些态的磁偶极活性及其实验可分辨性。", "result_en": "The calculations show clear multifractal diagnostics for above-gap skyrmion modes over the full accessible range of system sizes, without requiring disorder or quasiperiodicity. Hybridization with magnetically active internal deformation modes gives a subset of these states a nonzero magnetic dipole moment, allowing excitation by uniform ac fields and distinction at realistic frequency resolution.", "result_zh": "计算显示，斯格明子体系中的带隙以上模式在全部可达系统尺寸范围内均具有清晰的多重分形诊断特征，且无需无序或准周期性。与具有磁活性的内部形变模杂化后，部分态获得非零磁偶极矩，因此可由均匀交流场激发，并在现实频率分辨率下加以区分。", "future_en": "The proposed dipole-active states offer a route for experimental tests of mesoscopic magnon multifractality in skyrmion-hosting magnets.", "future_zh": "所提出的偶极活性态为在含斯格明子的磁体中实验检验介观磁振子多重分形提供了途径。", "tier": "PRL", "tier_reason_en": "The work presents a distinctive disorder-free mechanism for multifractal magnon states and links it to a concrete optical-access strategy, supported by large-scale calculations across system sizes; this combination merits a high-impact condensed-matter tier.", "tier_reason_zh": "该工作提出了无需无序即可产生多重分形磁振子态的独特机制，并将其与具体的光学探测方案相联系，且有跨系统尺寸的大规模计算支持，达到较高影响力凝聚态期刊的水平。"}, {"id": "arxiv-2610-31843", "arxiv_id": "2610.31843", "type": "arXiv", "journal": "arXiv:2610.31843", "journal_ref": "", "title": "Optical signatures of Rashba--Dresselhaus coupling across Franz--Keldysh and Landau regimes in two-dimensional semiconductors", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall"], "submitted_at": "2026-10-22T19:26:41Z", "updated_at": "2026-10-22T19:26:41Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Bahruz Suleymanli, Samir Tariverdiev, B. Tanatar", "corresponding": "", "url": "https://arxiv.org/abs/2610.31843v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The authors develop a unified theory of interband optical response in two-dimensional semiconductors with simultaneous Rashba and Dresselhaus spin–orbit coupling under electric and magnetic fields. The theory identifies distinct optical signatures across zero-field, Franz–Keldysh, Landau, and crossed-field regimes.", "summary": "We develop a unified theory of the interband optical response of a two-dimensional semiconductor with simultaneous Rashba and Dresselhaus spin-orbit couplings in electric and magnetic fields. In crossed fields, the in-plane electric field generates an effective spin-orbit drift field that modifies the Landau spectrum and spinor states, while at zero magnetic field the problem maps onto Landau--Zen", "abstract": "We develop a unified theory of the interband optical response of a two-dimensional semiconductor with simultaneous Rashba and Dresselhaus spin-orbit couplings in electric and magnetic fields. In crossed fields, the in-plane electric field generates an effective spin-orbit drift field that modifies the Landau spectrum and spinor states, while at zero magnetic field the problem maps onto Landau--Zener spin dynamics.At zero external fields, the total joint density of states above the band gap remains unchanged, while characteristic subgap structures appear. Pure Rashba coupling produces an inverse square root singularity, whereas a finite Dresselhaus term gives a step and a logarithmic peak, allowing the two couplings to be distinguished optically. At zero magnetic field, the Franz--Keldysh response shows a crossover from diabatic to adiabatic spin dynamics as the electric field is reduced. In the weak-field Rashba regime, the field-free singularity becomes a finite peak whose height scales as $\\mathcal E^{-1/3}$ and whose position approaches $E_g-E_{\\rm SO}$, providing a direct measure of the Rashba energy. In a perpendicular magnetic field, spin-orbit coupling shifts and splits the Landau absorption lines and produces anticrossings without changing their total weights. The Rashba splitting changes from a $\\sqrt{B}$ dependence at weak fields to a linear dependence at strong fields. Finally, in crossed electric and magnetic fields, the electric field broadens the Landau lines and drives a continuous crossover toward the Franz--Keldysh regime, while spin-orbit coupling produces opposite shifts and different widths for the two members of each doublet.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Rashba and Dresselhaus coupling produce distinct subgap optical structures, field-dependent spin dynamics, and characteristic Landau-level shifts and splittings.", "ai_in_scope": true, "relevance_reason": "This is original theory of spin-orbit-coupled low-dimensional electrons that predicts experimentally distinguishable optical and magneto-optical signatures.", "relevance_method": "semantic", "relevance_score": 72, "feature_candidate": false, "summary_zh": "作者建立了二维半导体在电场和磁场中同时具有Rashba与Dresselhaus自旋轨道耦合时的带间光学响应统一理论。该理论揭示了零场、Franz–Keldysh、Landau及交叉场区间各自不同的光学特征。", "method_en": "The analysis treats the crossed-field spin–orbit drift, maps the zero-magnetic-field problem to Landau–Zener spin dynamics, and calculates optical response across electric- and magnetic-field regimes.", "method_zh": "分析纳入交叉场中的自旋轨道漂移场，将零磁场问题映射为Landau–Zener自旋动力学，并计算不同电场与磁场区间的光学响应。", "result_en": "At zero external fields, the total joint density of states above the gap is unchanged, while subgap structures distinguish the couplings: pure Rashba coupling gives an inverse-square-root singularity, whereas finite Dresselhaus coupling yields a step and logarithmic peak. In the weak-field Rashba Franz–Keldysh regime, the field-free singularity becomes a finite peak whose height scales as $\\mathcal E^{-1/3}$ and whose position approaches $E_g-E_{\\rm SO}$; in magnetic fields, spin–orbit coupling shifts and splits Landau lines without changing their total weights, with Rashba splitting crossing from $\\sqrt{B}$ to linear dependence as the field strengthens. Crossed electric and magnetic fields broaden Landau lines and drive a continuous crossover toward the Franz–Keldysh regime, with opposite shifts and different widths for the two members of each spin–orbit-split doublet.", "result_zh": "零外场下，带隙以上的总联合态密度保持不变，但带隙以下结构可区分两种耦合：纯Rashba耦合产生反平方根奇异性，而有限Dresselhaus耦合产生阶跃和对数峰。在弱场Rashba的Franz–Keldysh区间，无场奇异性变为有限峰，其高度按$\\mathcal E^{-1/3}$标度变化，峰位趋近$E_g-E_{\\rm SO}$；在磁场中，自旋轨道耦合使Landau吸收线移动并分裂而不改变其总权重，Rashba分裂随磁场增强由$\\sqrt{B}$依赖转为线性依赖。交叉电磁场会展宽Landau谱线并推动其连续过渡至Franz–Keldysh区间，同时使每个自旋轨道双重态的两条谱线发生方向相反的位移并具有不同线宽。", "future_en": "The predicted line shapes, peak scaling, and field-dependent splitting provide optical observables for distinguishing Rashba and Dresselhaus coupling and tracking crossovers between field regimes.", "future_zh": "所预测的线形、峰高标度和随场变化的分裂为区分Rashba与Dresselhaus耦合及追踪不同场区间的交叉提供了光学观测量。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The abstract presents a technically broad and detailed theoretical treatment with several experimentally testable optical predictions, but describes no experimental validation or uniquely transformative result that would warrant a higher tier on the available evidence.", "tier_reason_zh": "摘要呈现了范围较广且细致的理论处理，并给出多项可实验检验的光学预言；但未报告实验验证，也未显示足以据现有信息支持更高期刊层级的突破性结果。"}, {"id": "arxiv-2610-31725", "arxiv_id": "2610.31725", "type": "arXiv", "journal": "arXiv:2610.31725", "journal_ref": "", "title": "Phonon evidence for a partial, re-entrant spin reorientation near room temperature in LaFe$_{1-x}$Ni$_x$O$_3$", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mes-hall", "cond-mat.mtrl-sci"], "submitted_at": "2026-10-22T13:00:38Z", "updated_at": "2026-10-22T13:00:38Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Subha Maity, Dushyant Singh, Vigneshwari S R, Tharundev V, Navneet Sharma, Subhavenkadesh SS, Krista R. Khiangte", "corresponding": "", "url": "https://arxiv.org/abs/2610.31725v1", "topic": "Magnetism", "level": "Brief", "summary_en": "Temperature-dependent magnetization and Raman measurements on LaFe₁₋ₓNiₓO₃ (x = 0 and 0.1) reveal magnetic anomalies and associated phonon deviations, which the authors interpret as evidence for partial, re-entrant spin reorientation near room temperature.", "summary": "Spin reorientation near room temperature offers a route to controlling antiferromagnetic order, yet LaFeO$3$, which lacks a magnetic rare-earth ion, is generally expected to retain its spin orientation along the $a$ axis below $T{\\mathrm N}\\approx740$~K. Here, we investigate LaFe$_{1-x}$Ni$_x$O$_3$ ($x=0$ and 0.1) using temperature-dependent magnetization and Raman spectroscopy over 200--400~K. Bo", "abstract": "Spin reorientation near room temperature offers a route to controlling antiferromagnetic order, yet LaFeO$3$, which lacks a magnetic rare-earth ion, is generally expected to retain its spin orientation along the $a$ axis below $T{\\mathrm N}\\approx740$~K. Here, we investigate LaFe$_{1-x}$Ni$_x$O$_3$ ($x=0$ and 0.1) using temperature-dependent magnetization and Raman spectroscopy over 200--400~K. Both compositions exhibit magnetic anomalies at 285.6 and 323~K, respectively, accompanied by correlated deviations of 12 Raman modes from their conventional anharmonic behavior. Principal component analysis and a global fitting approach reveal a common temperature-dependent phonon response, with mode-dependent amplitudes and signs. To interpret these anomalies, we develop a Landau-based spin-phonon coupling model describing complete, partial re-entrant, and incipient spin reorientation. Comparison with the experimental Raman profiles favors a partial, re-entrant rotation of the N'eel vector in both compositions, centered near 290~K. Ni substitution narrows the characteristic reorientation interval from approximately 116 to 84~K and enhances the magnetization anomaly by a factor of four. An additional feature near 262~K in LaFeO$_3$ is consistent with the Morin transition of trace $α$-Fe$_2$O$_3$. These findings suggest that partial spin reorientation can emerge without magnetic rare-earth ions and establish collective Raman phonon anomalies as a sensitive indirect probe of magnetic anisotropy changes in orthoferrites.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "Temperature-dependent magnetic and phonon anomalies support partial, re-entrant Néel-vector rotation near 290 K in LaFeO₃ and Ni-substituted LaFeO₃, with substitution narrowing the reorientation interval and enhancing the magnetization anomaly.", "ai_in_scope": true, "relevance_reason": "The study combines magnetic and Raman measurements with a spin-phonon model to investigate a new magnetic-order phenomenon in an oxide material.", "relevance_method": "semantic", "relevance_score": 76, "feature_candidate": false, "summary_zh": "对 LaFe₁₋ₓNiₓO₃（x = 0 和 0.1）进行的变温磁化与拉曼测量揭示了磁异常及相关声子偏离；作者将其解释为室温附近发生部分、再入式自旋重取向的证据。", "method_en": "The study combines magnetization and Raman spectroscopy from 200 to 400 K, analyzing 12 Raman modes with principal component analysis and global fitting. A Landau-based spin–phonon coupling model is used to compare possible complete, partial re-entrant, and incipient reorientation scenarios with the measured Raman profiles.", "method_zh": "研究结合了 200–400 K 范围内的磁化测量与拉曼光谱，并通过主成分分析和全局拟合分析 12 个拉曼模。作者建立基于朗道理论的自旋—声子耦合模型，将测得的拉曼谱与完全、部分再入式及初始自旋重取向情形进行比较。", "result_en": "Both compositions show magnetic anomalies at 285.6 K and 323 K, respectively, accompanied by correlated deviations of 12 Raman modes from conventional anharmonic behavior. The Raman profiles favor partial, re-entrant rotation of the Néel vector centered near 290 K in both compositions. Ni substitution narrows the characteristic reorientation interval from approximately 116 to 84 K and enhances the magnetization anomaly by a factor of four; an additional feature near 262 K in LaFeO₃ is consistent with a Morin transition of trace α-Fe₂O₃.", "result_zh": "两种组分分别在 285.6 K 和 323 K 出现磁异常，同时 12 个拉曼模均偏离通常的非谐行为。拉曼谱更支持两种组分中的 Néel 矢量在约 290 K 附近发生部分、再入式转动。Ni 取代使特征重取向温区由约 116 K 缩窄至 84 K，并使磁化异常增强四倍；LaFeO₃ 在约 262 K 的额外特征与微量 α-Fe₂O₃ 的 Morin 转变相符。", "future_en": "The authors argue that partial spin reorientation can occur without magnetic rare-earth ions and that collective Raman phonon anomalies provide an indirect probe of magnetic-anisotropy changes in orthoferrites.", "future_zh": "作者指出，无需磁性稀土离子也可能出现部分自旋重取向，并认为集体拉曼声子异常可作为探测正铁氧体磁各向异性变化的间接手段。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The paper combines temperature-dependent measurements, multivariate analysis, and a phenomenological model to support a specific magnetic-reorientation interpretation, but its evidence and scope appear focused on two compositions of one material family.", "tier_reason_zh": "该工作结合变温测量、多变量分析和唯象模型，支持一种具体的磁重取向解释；不过其证据和研究范围集中于同一材料家族中的两种组分。"}, {"id": "arxiv-2610-32283", "arxiv_id": "2610.32283", "type": "arXiv", "journal": "arXiv:2610.32283", "journal_ref": "", "title": "Triplon dynamics from partial Kondo screening in frustrated heavy-fermion systems", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-23T07:40:57Z", "updated_at": "2026-10-23T07:40:57Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Hiroki Nakahara, Masahito Mochizuki, Rintaro Eto", "corresponding": "", "url": "https://arxiv.org/abs/2610.32283v1", "topic": "Magnetism", "level": "Brief", "summary_en": "Within a triangular-lattice half-filled periodic Anderson model, the study finds that triplon condensation drives transitions from a Kondo insulator to a partially disordered phase and then to magnetic order, with magnons and triplons coexisting and hybridizing in the intermediate phase.", "summary": "The partially disordered (PD) phase, in which magnetically ordered and Kondo-screened sites coexist, has been proposed as a possible ground state of geometrically frustrated heavy-fermion systems. We investigate its dynamical properties in the half-filled periodic Anderson model on a triangular lattice by calculating the dynamical spin susceptibility within the random-phase approximation built on ", "abstract": "The partially disordered (PD) phase, in which magnetically ordered and Kondo-screened sites coexist, has been proposed as a possible ground state of geometrically frustrated heavy-fermion systems. We investigate its dynamical properties in the half-filled periodic Anderson model on a triangular lattice by calculating the dynamical spin susceptibility within the random-phase approximation built on a self-consistent Hartree-Fock solution. We show that successive quantum phase transitions from the Kondo-insulating phase to the PD phase and to a magnetically ordered phase are driven by the condensation of triplon modes originating predominantly from the Kondo-screened sites. In the PD phase, magnons and triplons coexist and hybridize, leading to characteristic level repulsion in the excitation spectrum. These results reveal how triplet excitations evolve into collective magnetic modes across the successive phase transitions and highlight the dynamical interplay between magnetic order and Kondo screening in frustrated heavy-fermion systems.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Triplon condensation is identified as the driver of successive transitions from a Kondo insulator to a partially disordered phase and then magnetic order, where triplons hybridize with magnons.", "ai_in_scope": true, "relevance_reason": "The work develops a dynamical account of competing Kondo screening and magnetic order in a frustrated heavy-fermion system.", "relevance_method": "semantic", "relevance_score": 75, "feature_candidate": false, "summary_zh": "针对三角晶格半填充周期Anderson模型，研究发现三重态激发的凝聚驱动系统从Kondo绝缘体转变为部分无序相，再进入磁有序相；在中间相中，磁振子与三重态激发共存并发生杂化。", "method_en": "The dynamical spin susceptibility is calculated within the random-phase approximation, using a self-consistent Hartree–Fock solution as the starting point.", "method_zh": "研究以自洽Hartree–Fock解为基础，在随机相近似中计算动力学自旋磁化率。", "result_en": "Successive quantum phase transitions are driven by triplon modes originating predominantly from Kondo-screened sites. In the partially disordered phase, magnon–triplon hybridization produces characteristic level repulsion in the excitation spectrum.", "result_zh": "连续的量子相变由主要起源于Kondo屏蔽位点的三重态激发模驱动。在部分无序相中，磁振子与三重态激发的杂化在激发谱中产生特征性的能级排斥。", "future_en": "Further work could test these predicted excitation spectra and phase-transition dynamics beyond the model and approximation used here.", "future_zh": "后续研究可在超出本文模型与近似的框架下检验这些预测的激发谱和相变动力学。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work offers a technically grounded theoretical account of collective excitations and phase transitions in a specific model, with the abstract giving no indication of broader validation or reach beyond the system studied.", "tier_reason_zh": "该工作对特定模型中的集体激发与相变给出了有理论依据的解释，但摘要没有显示其结论已在所研究系统之外得到验证或具有更广泛影响。"}, {"id": "arxiv-2610-32743", "arxiv_id": "2610.32743", "type": "arXiv", "journal": "arXiv:2610.32743", "journal_ref": "", "title": "First- and Second-Order Electron Position Correlators Reveal Topological Phase Transitions", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.dis-nn", "cond-mat.mes-hall", "cond-mat.mtrl-sci", "cond-mat.stat-mech"], "submitted_at": "2026-10-23T14:55:16Z", "updated_at": "2026-10-23T14:55:16Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Antimo Marrazzo, Christian Loer Llemit, Massimo Capone", "corresponding": "", "url": "https://arxiv.org/abs/2610.32743v1", "topic": "Materials & Growth", "level": "Brief", "summary_en": "This work develops a correlator-based framework for characterizing topological phase transitions through fluctuations of the electronic position operator. It connects second-order position correlators to the Chern number and uses higher-order Chern–Chern correlators to describe criticality in nonperiodic or dynamical settings.", "summary": "The theory of conventional critical phenomena is built around the concepts of fluctuations and correlators of local observables. Here, we show that topological phase transitions can also be characterized through spatial and temporal two-point correlation functions associated with fluctuations of the electronic position operator. The key object is the antisymmetric part of the position-position cor", "abstract": "The theory of conventional critical phenomena is built around the concepts of fluctuations and correlators of local observables. Here, we show that topological phase transitions can also be characterized through spatial and temporal two-point correlation functions associated with fluctuations of the electronic position operator. The key object is the antisymmetric part of the position-position correlation function, which yields the Chern number in the equal-time and equal-space limit. When the system is translationally invariant in space or time (the latter case corresponding to an equilibrium condition), these two-point correlators reduce to one-variable functions of the remaining variable. Remarkably, these functions are both reminiscent of critical behaviour, including divergent correlation times and lengths signalling the phase transitions. Away from these conditions, namely in non-periodic systems or genuinely dynamical processes, criticality is instead better captured by higher-order Chern-Chern correlators constructed from local or dynamical markers obtained as coincident-point limits of the position correlators. These higher-order Chern-Chern correlators can be seen as double Levi-Civita contractions of second-order position correlators, selecting the antisymmetric sector in each index pair. We substantiate this framework through numerical simulations and analytic calculations. Our results establish a general correlator-based description of topological phase transitions, applicable to crystalline, noncrystalline, equilibrium, and dynamical systems.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Antisymmetric position-position correlators encode the Chern number and exhibit critical behavior at topological transitions, with higher-order Chern-Chern correlators extending the framework to non-periodic and dynamical systems.", "ai_in_scope": true, "relevance_reason": "It develops and tests a theoretical description of topological electronic phase transitions using position-based correlators.", "relevance_method": "semantic", "relevance_score": 72, "feature_candidate": false, "summary_zh": "本文建立了一种基于关联函数的框架，通过电子位置算符涨落刻画拓扑相变。该框架将二阶位置关联函数与陈数联系起来，并用更高阶的陈数—陈数关联函数描述非周期或动力学情形中的临界性。", "method_en": "The authors derive relations between antisymmetric position–position correlators, Chern markers, and higher-order Chern–Chern correlators, and substantiate the framework using analytic calculations and numerical simulations.", "method_zh": "作者推导反对称位置—位置关联函数、陈标记与更高阶陈数—陈数关联函数之间的关系，并通过解析计算和数值模拟验证该框架。", "result_en": "In the equal-time and equal-space limit, the antisymmetric position–position correlator yields the Chern number; under spatial translation invariance or equilibrium, the correlators reduce to one-variable functions with divergent correlation lengths or times at transitions. For nonperiodic systems or genuinely dynamical processes, the authors identify higher-order Chern–Chern correlators as the more suitable description of criticality, extending the framework across crystalline, noncrystalline, equilibrium, and dynamical systems.", "result_zh": "在等时且等空间点的极限下，反对称位置—位置关联函数给出陈数；在具有空间平移不变性或处于平衡态时，关联函数化为单变量函数，并在相变处表现出发散的关联长度或关联时间。对于非周期系统或真正的动力学过程，作者指出更高阶陈数—陈数关联函数更适合描述临界性，从而将框架扩展至晶体、非晶体、平衡态及动力学系统。", "future_en": "The framework suggests a common route to studying topological criticality in settings where conventional momentum-space descriptions or equilibrium assumptions do not apply.", "future_zh": "该框架为研究常规动量空间描述或平衡态假设不适用情形中的拓扑临界性提供了一种统一途径。", "tier": "PRL", "tier_reason_en": "The paper offers a potentially broad conceptual framework that connects local correlators with topological invariants and extends the analysis to noncrystalline and dynamical systems, with both analytical and numerical support; this scope and generality are consistent with PRL-level significance.", "tier_reason_zh": "该工作提出了具有潜在广泛适用性的概念框架，将局域关联函数与拓扑不变量联系起来，并将分析扩展至非晶体和动力学系统，同时提供解析与数值支持；其范围和一般性符合PRL层级的影响力。"}, {"id": "arxiv-2610-32157", "arxiv_id": "2610.32157", "type": "arXiv", "journal": "arXiv:2610.32157", "journal_ref": "", "title": "Compass Correlations in a Square-Lattice Magnet", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-23T04:49:35Z", "updated_at": "2026-10-23T04:49:35Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Otkur Omar, Matthias D. Frontzek, Gabriele Sala, Junying Shen, Xinmin Wang, Ze Hu, Zhuang Xu, Zecong Qin, Xin Tong, Joe Paddison, Max Hirschberger, Shinichiro Seki, Masaaki Matsuda, Matthew B. Stone, Andrew D. Christianson, Nguyen D. Khanh, Shang Gao", "corresponding": "", "url": "https://arxiv.org/abs/2610.32157v1", "topic": "Superconductivity", "level": "Feature", "summary_en": "Using ErRu2Si2, the authors identify square-lattice compass correlations in neutron diffuse scattering and contrast them with the nearly uniform diffuse rings of isostructural NdRu2Si2. A minimal compass-Heisenberg model incorporating Er moment anisotropy reproduces the scattering and accounts for a double-Q vortex-antivortex ground state.", "summary": "The square-lattice compass model is a paradigm of bond-dependent frustration, yet experimental evidence for its characteristic spin correlations has remained elusive. Here we identify compass correlations in the square-lattice intermetallic ErRu$_2$Si$_2$ using single-crystal neutron diffuse scattering. Comparative measurements on the isostructural compounds NdRu$_2$Si$_2$ and ErRu$_2$Si$_2$ revea", "abstract": "The square-lattice compass model is a paradigm of bond-dependent frustration, yet experimental evidence for its characteristic spin correlations has remained elusive. Here we identify compass correlations in the square-lattice intermetallic ErRu$_2$Si$_2$ using single-crystal neutron diffuse scattering. Comparative measurements on the isostructural compounds NdRu$_2$Si$_2$ and ErRu$_2$Si$_2$ reveal a pronounced contrast between nearly uniform diffuse rings in the former and strong intensity modulation between Brillouin zones in the latter. Through the magnetic neutron polarization factor, this modulation reveals compass correlations that couple moment orientation to the correlation wavevector. Crystal-field spectroscopy identifies four preferred in-plane orientations for the Er$^{3+}$ moments. A minimal compass-Heisenberg model incorporating this anisotropy quantitatively reproduces the diffuse scattering and accounts for the double-$Q$ vortex-antivortex ground state. Fits with the compass couplings fixed at values set by the dipolar energy scale retain good agreement with the data, supporting a substantial dipolar contribution to the bond-dependent interactions. Our results establish a square-lattice platform for compass physics and suggest that dipolar interactions, acting together with local crystal-field anisotropy, can shape directional magnetic correlations alongside conduction-electron-mediated exchange.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "Diffuse scattering in ErRu₂Si₂ reveals compass correlations linking moment orientation to correlation wavevector; crystal-field anisotropy and dipolar-scale compass couplings account for the observations and the proposed double-Q vortex-antivortex ground state", "ai_in_scope": true, "relevance_reason": "Neutron-scattering and spectroscopy measurements establish distinctive bond-dependent magnetic correlations in a square-lattice material and connect them to a quantitative magnetic model.", "relevance_method": "semantic", "relevance_score": 84, "feature_candidate": true, "summary_zh": "作者通过ErRu2Si2的中子漫散射识别出方格子罗盘关联，并将其与同构化合物NdRu2Si2中近乎均匀的漫散射环作比较。包含Er磁矩各向异性的最简罗盘—海森堡模型重现了散射特征，并解释双Q涡旋—反涡旋基态。", "method_en": "Single-crystal neutron diffuse scattering on ErRu2Si2 is compared with measurements on isostructural NdRu2Si2; crystal-field spectroscopy is used to identify preferred Er3+ moment orientations. The authors fit the scattering with a minimal compass-Heisenberg model and test fits with compass couplings fixed to the dipolar energy scale.", "method_zh": "研究对ErRu2Si2开展单晶中子漫散射，并与同构的NdRu2Si2测量结果比较；同时利用晶场光谱确定Er3+磁矩的优选取向。作者以最简罗盘—海森堡模型拟合散射，并检验将罗盘耦合固定在偶极能量尺度时的拟合结果。", "result_en": "The diffuse scattering is nearly uniform in rings for NdRu2Si2 but strongly modulated between Brillouin zones for ErRu2Si2. Through the magnetic neutron polarization factor, the modulation identifies correlations coupling moment orientation to the correlation wavevector. Crystal-field spectroscopy finds four preferred in-plane Er3+ moment orientations, and a minimal compass-Heisenberg model incorporating this anisotropy quantitatively reproduces the diffuse scattering and accounts for a double-Q vortex-antivortex ground state. Fits remain good when the compass couplings are set by the dipolar energy scale, supporting a substantial dipolar contribution to the bond-dependent interactions.", "result_zh": "NdRu2Si2的漫散射环近乎均匀，而ErRu2Si2在不同布里渊区之间呈现强烈的强度调制。结合磁中子偏振因子，该调制揭示了磁矩取向与关联波矢相耦合的关联。晶场光谱发现Er3+磁矩有四种优选面内取向；纳入这种各向异性的最简罗盘—海森堡模型定量重现了漫散射，并解释双Q涡旋—反涡旋基态。将罗盘耦合设定为偶极能量尺度后，拟合仍然良好，支持偶极相互作用对键依赖耦合有显著贡献。", "future_en": "Further measurements and modeling could help separate the contributions of dipolar interactions and conduction-electron-mediated exchange to the bond-dependent couplings. The identified square-lattice material also provides a platform for exploring compass correlations and their associated magnetic states.", "future_zh": "后续测量和建模可进一步区分偶极相互作用与导电电子介导交换对键依赖耦合的贡献。所识别的方格子材料也为探索罗盘关联及其相关磁态提供了平台。", "tier": "PRL", "tier_reason_en": "The work presents a clear experimental identification of compass correlations, supported by comparative neutron measurements, crystal-field information, and quantitative modeling that links them to a candidate ground state. This is a focused and compelling result for frustrated magnetism, though the abstract does not establish a broader impact warranting a higher tier.", "tier_reason_zh": "该工作通过对比中子测量、晶场信息和定量建模，清晰识别罗盘关联，并将其与候选基态联系起来。这是 frustrated magnetism 领域有说服力的聚焦型成果，但摘要未显示足以支持更高层级的广泛影响。"}, {"id": "arxiv-2610-32097", "arxiv_id": "2610.32097", "type": "arXiv", "journal": "arXiv:2610.32097", "journal_ref": "", "title": "Heterogeneous superconductivity emerging from a charge-stripe state in kagome lattices", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el", "cond-mat.supr-con"], "submitted_at": "2026-10-23T02:58:25Z", "updated_at": "2026-10-23T02:58:25Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Hongyu Li, Shuikang Yu, Huachen Rao, Zhuying Wang, Xingchen Zhou, Houpu Li, Yunmei Zhang, Zhao Gong, Xin Yu, Rui Wu, Tao Wu, Zhenyu Wang, Ziji Xiang, Xianhui Chen", "corresponding": "", "url": "https://arxiv.org/abs/2610.32097v1", "topic": "Superconductivity", "level": "Feature", "summary_en": "The authors report that superconductivity in CsV3Sb5−xSnx changes abruptly when the triple-Q charge-density wave gives way to a short-range stripe-like state at x_c = 0.07. Beyond this point, superconductivity is spatially heterogeneous and retains signatures of normal fluid deep below the superconducting transition.", "summary": "Charge density wave (CDW) and superconductivity have long been recognized as competing orders. However, recent achievements establish that the interplay between these two collective electronic phenomena can be more perplexing, with emergent phenomena arising from their cooperation. Here we report a distinctive case of the kagome superconductors CsV3Sb5-xSnx, in which the characteristics of superco", "abstract": "Charge density wave (CDW) and superconductivity have long been recognized as competing orders. However, recent achievements establish that the interplay between these two collective electronic phenomena can be more perplexing, with emergent phenomena arising from their cooperation. Here we report a distinctive case of the kagome superconductors CsV3Sb5-xSnx, in which the characteristics of superconductivity evolve in accordance with the form of CDW order. As the triple-Q CDW in CsV3Sb5 transforms to a short-range stripelike CDW at xc = 0.07, a sudden change in superconducting properties occurs concomitantly. A combination of thermodynamic, electrical transport and scanning tunneling microscopy experiments reveals a heterogeneous superconducting state beyond xc: the superconducting gap exhibits pronounced spatial variation, in conformity with a distribution of critical temperature and the resulted superconducting precursor effects. Moreover, abundant normal fluid persists deep into the superconducting state, as evidenced by remnants of electronic specific heat and zero-energy quasiparticle interference. These observations are unrelated to the chemical inhomogeneity and residual strain effect introduced by Sn substitution. Instead, they emulate the phenomenology that a sign-changing superconducting order parameter is subject to strong pair-breaking scattering with the short-range charge stripes and hence reflect the unconventional nature of superconductivity developing inside the charge-stripe state.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "The short-range stripe CDW state is accompanied by spatially varying superconducting gaps and critical temperatures, precursor effects, and residual normal-fluid signatures, consistent with strong pair breaking of unconventional superconductivity.", "ai_in_scope": true, "relevance_reason": "This experimental study of a kagome superconductor links a change in charge order to spatially heterogeneous superconductivity and unusual residual excitations, making it a strong quantum-materials result.", "relevance_method": "semantic", "relevance_score": 80, "feature_candidate": true, "summary_zh": "作者报告，CsV3Sb5−xSnx中的三重Q电荷密度波转变为短程条纹态时（x_c = 0.07），超导性质发生突变。此后超导呈现空间非均匀性，并在超导转变温度以下较深处仍保留正常流体的迹象。", "method_en": "The study combines thermodynamic measurements, electrical transport, and scanning tunneling microscopy across the composition-driven change in charge order. The authors also assess whether Sn-induced chemical inhomogeneity or residual strain accounts for the observed superconducting changes.", "method_zh": "研究结合热力学测量、电输运和扫描隧道显微镜，考察电荷序随组分变化时的超导性质。作者还评估了Sn掺杂引起的化学非均匀性和残余应变是否能够解释这些变化。", "result_en": "At x_c = 0.07, the triple-Q CDW changes to a short-range stripe-like CDW, coincident with an abrupt change in superconducting properties. Beyond this composition, the superconducting gap varies markedly across space, consistent with a distribution of critical temperatures and superconducting precursor effects. Remnants of electronic specific heat and zero-energy quasiparticle interference indicate that substantial normal fluid persists deep into the superconducting state. The authors report that these observations are not attributable to chemical inhomogeneity or residual strain from Sn substitution, and interpret them as resembling strong pair breaking of a sign-changing order parameter by short-range charge stripes.", "result_zh": "在x_c = 0.07处，三重Q电荷密度波转变为短程条纹状电荷密度波，同时超导性质发生突变。超过该组分后，超导能隙呈现显著空间变化，与临界温度分布及超导前驱效应相符。电子比热残余和零能准粒子干涉表明，正常流体在超导态深处仍大量存在。作者指出，这些现象不能归因于Sn取代引入的化学非均匀性或残余应变，并将其解释为短程电荷条纹对变号序参量造成强烈破对效应的类似表现。", "future_en": "Further work could test how the spatial gap and critical-temperature distributions evolve with the stripe order, and whether those changes track the reported normal-fluid signatures. The proposed pair-breaking interpretation also motivates more direct tests of how short-range charge stripes affect the superconducting order parameter.", "future_zh": "后续研究可检验空间能隙和临界温度分布如何随条纹序演变，以及它们是否与文中报告的正常流体信号同步变化。所提出的破对解释也提示，可进一步直接检验短程电荷条纹对超导序参量的影响。", "tier": "PRL", "tier_reason_en": "The reported abrupt correspondence between charge-order reconstruction and heterogeneous superconductivity, supported by complementary thermodynamic, transport, and local-probe measurements, is a substantial result for a prominent kagome-superconductor problem. The abstract supports a strong focused condensed-matter paper, while the proposed pair-breaking interpretation remains an interpretation rather than a demonstrated microscopic mechanism.", "tier_reason_zh": "电荷序重构与非均匀超导之间的突变式对应关系由热力学、输运和局域探测等互补测量支持，是关于重要笼目超导问题的实质性结果。摘要所述工作适合高水平、聚焦型凝聚态论文；但破对图像仍是解释，而非已被证实的微观机制。"}, {"id": "arxiv-2610-32767", "arxiv_id": "2610.32767", "type": "arXiv", "journal": "arXiv:2610.32767", "journal_ref": "", "title": "Majorana Edge-to-bound State Transition in Interferometric Superconductor Rings", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.mtrl-sci", "cond-mat.supr-con"], "submitted_at": "2026-10-23T15:08:06Z", "updated_at": "2026-10-23T15:08:06Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Xiangyu Bi, Aoshen Yang, Hongzi Cao, Ganyu Chen, Yuqiang Fang, Zeya Li, Qizheng Sun, Junwei Huang, Da Wang, Fuqiang Huang, Toshiya Ideue, Qianghua Wang, Yoshihiro Iwasa, Hongtao Yuan", "corresponding": "", "url": "https://arxiv.org/abs/2610.32767v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "The paper proposes a flux-driven transition in a topological-superconductor nanoring from extended edge states to vortex-bound states as the coherence length becomes smaller than the annulus width. It interprets a change in Little–Parks oscillation period as evidence for flux distributed in a necklace configuration along the annulus.", "summary": "Manipulating flux quanta in topological superconductors is central to vortex braiding in quantum computing. Their interferometric superconducting rings can host either topologically protected edge states with fluxes confined inside the central hollow area or vortex bound states in flux cores at the annulus walls. Here we demonstrate a strategy to drive topological edge states into vortex bound sta", "abstract": "Manipulating flux quanta in topological superconductors is central to vortex braiding in quantum computing. Their interferometric superconducting rings can host either topologically protected edge states with fluxes confined inside the central hollow area or vortex bound states in flux cores at the annulus walls. Here we demonstrate a strategy to drive topological edge states into vortex bound states by tuning the relative scale of vortex size and annulus width in nano-ring interferometric device on 2M-WS$_2$ topological superconductor. Near its superconducting transition where the coherence length exceeds the annulus width, Little-Parks oscillations exhibit expected periods for flux bundles in ring-center, consistent with edge states residing at inner and outer rims of the annulus. Upon cooling, where the coherence length shrinks below the annulus width, the unexpectedly increased oscillation period reflects multiple fluxes distributed along annulus region in flux necklace configuration, implying a transition from extended edge states to localized vortex bound states. Ginzburg-Landau simulations and local density-of-states calculations with Bogoliubov-de Gennes equations reveal that large values for both Ginzburg-Landau parameter and flux-pinning energy are vital for such a transition. Our findings provide a novel strategy for understanding flux manipulation towards flux braiding and topological quantum computing.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "It reports a coherence-length-dependent change from flux associated with extended annular edge states to a flux-necklace configuration consistent with localized vortex-bound states.", "ai_in_scope": true, "relevance_reason": "The paper combines measurements on a topological superconductor with GL and BdG calculations to investigate a change in its flux-state physics.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": false, "summary_zh": "本文提出，随着相干长度缩短至小于环形区域宽度，拓扑超导纳米环可发生由延展边缘态向涡旋束缚态的转变。作者将Little–Parks振荡周期的变化解释为磁通以“项链”构型分布于环形区域的迹象。", "method_en": "The authors compare Little–Parks oscillations near and below the superconducting transition and use Ginzburg–Landau simulations together with Bogoliubov–de Gennes local-density-of-states calculations to analyze the proposed transition.", "method_zh": "作者比较超导转变附近及以下温度区间的Little–Parks振荡，并结合Ginzburg–Landau模拟和Bogoliubov–de Gennes局域态密度计算分析所提出的转变。", "result_en": "Near the transition, when the coherence length exceeds the annulus width, the oscillation periods are consistent with flux bundles confined to the
