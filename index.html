 ring center and states on the inner and outer rims. On cooling, when the coherence length falls below the annulus width, the unexpectedly increased period is attributed to multiple fluxes distributed along the annulus; the calculations identify large Ginzburg–Landau parameter and flux-pinning energy as important for this transition.", "result_zh": "在转变温度附近，相干长度大于环形区域宽度，振荡周期与磁通束位于环中心、态分布于内外边缘的情形相符。冷却后相干长度小于环宽，振荡周期出现出乎预期的增大，作者将其归因于多个磁通沿环形区域分布；计算表明，较大的Ginzburg–Landau参数和磁通钉扎能对该转变很重要。", "future_en": "The proposed dependence on coherence length, annulus width, and flux pinning provides design variables for probing flux localization and manipulation in interferometric superconducting rings.", "future_zh": "所提出的对相干长度、环宽及磁通钉扎的依赖关系，为在干涉超导环中探测和调控磁通局域化提供了设计参数。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The abstract reports an interesting device-scale transition supported by oscillation data and complementary simulations, but the evidence described is focused on one proposed device strategy rather than a broadly established result, making a specialist condensed-matter tier the best fit.", "tier_reason_zh": "摘要报告了一个有趣的器件尺度转变，并以振荡特征和互补模拟加以支持；但所述证据集中于一种拟议的器件策略，尚未显示出广泛确立的普适结果，因此专业凝聚态期刊层级较为合适。"}, {"id": "arxiv-2610-32714", "arxiv_id": "2610.32714", "type": "arXiv", "journal": "arXiv:2610.32714", "journal_ref": "", "title": "Nano-ARPES observation of a flat band at the \\bar{M} point in 2.4° twisted bilayer graphene", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall", "cond-mat.mtrl-sci"], "submitted_at": "2026-10-23T14:35:25Z", "updated_at": "2026-10-23T14:35:25Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Giovanna Feraco, Przemysław Przybysz, Oreste De Luca, Ying Wang, Pavel Dudin, José Avila, Jianting Ye, Paweł Dąbrowski, Paweł J. Kowalczyk, Jagoda Sławińska, Petra Rudolf, Antonija Grubišić-Čabo", "corresponding": "", "url": "https://arxiv.org/abs/2610.32714v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "The authors report a flat band at the \\bar{M} point, far from the Fermi level, in 2.4° twisted bilayer graphene, observed by angle-resolved photoemission spectroscopy (ARPES).", "summary": "The emergence of flat bands in twisted bilayer graphene at the so-called magic angle reveals a range of intriguing phases, such as superconductivity and Mott insulating states, resulting from electrons entering a correlated state. This establishes twisted bilayer graphene as an excellent platform for exploring correlation effects in many-body phases and across various twist angles. However, in mos", "abstract": "The emergence of flat bands in twisted bilayer graphene at the so-called magic angle reveals a range of intriguing phases, such as superconductivity and Mott insulating states, resulting from electrons entering a correlated state. This establishes twisted bilayer graphene as an excellent platform for exploring correlation effects in many-body phases and across various twist angles. However, in most cases, the twist angle is not an easy parameter to control because it exhibits structural instabilities such as relaxation and reconstruction that reduce the correlation effects. Here, we report the unexpected appearance of a flat band at the \\bar{M} point far from the Fermi level in a 2.4° twisted bilayer graphene, directly visualized by angle-resolved photoemission spectroscopy. Our work is the first observation of flat bands away from the \\bar{K} point in twisted bilayer graphene and highlights the need to probe the entire Brillouin zone to fully capture electronic states in twisted structures.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "A flat band is observed at the Brillouin-zone \\bar{M} point, away from the previously emphasized \\bar{K} point, in 2.4° twisted bilayer graphene.", "ai_in_scope": true, "relevance_reason": "The ARPES result experimentally identifies an unexpected electronic flat band in twisted bilayer graphene, a correlated low-dimensional quantum material.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": false, "summary_zh": "作者报告在 2.4° 扭转双层石墨烯中发现一个远离费米能级、位于 \\bar{M} 点的平带，并通过角分辨光电子能谱（ARPES）观测到该平带。", "method_en": "They use ARPES to directly examine the electronic structure of 2.4° twisted bilayer graphene.", "method_zh": "作者使用 ARPES 直接探测 2.4° 扭转双层石墨烯的电子结构。", "result_en": "The measurement reveals a flat band at \\bar{M}, which the authors identify as the first observation of a flat band away from \\bar{K} in twisted bilayer graphene.", "result_zh": "测量揭示了位于 \\bar{M} 点的平带；作者称这是首次在扭转双层石墨烯中观测到偏离 \\bar{K} 点的平带。", "future_en": "The result underscores the need to probe the entire Brillouin zone to capture electronic states in twisted structures.", "future_zh": "这一结果强调，为全面表征扭转结构中的电子态，需要探测整个布里渊区。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work reports a direct spectroscopic observation of an unexpected band feature in a well-studied material system, but the abstract presents a focused experimental finding without evidence of broader conceptual reach warranting a higher tier.", "tier_reason_zh": "该工作直接光谱观测到一种已广泛研究材料体系中的意外能带特征，但摘要呈现的是较为聚焦的实验发现，尚未体现足以支持更高档次期刊的广泛概念性影响。"}, {"id": "arxiv-2610-32224", "arxiv_id": "2610.32224", "type": "arXiv", "journal": "arXiv:2610.32224", "journal_ref": "", "title": "Intrinsic Paramagnetism of Optical Phonons and Thermal Hall Effect in Quantum Paraelectrics", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mes-hall", "cond-mat.str-el"], "submitted_at": "2026-10-23T06:31:54Z", "updated_at": "2026-10-23T06:31:54Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Harsh Jain, Manideep Gone, Nabyendu Das", "corresponding": "", "url": "https://arxiv.org/abs/2610.32224v1", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The study proposes that intrinsic paramagnetism from quantum fluctuations of nearly critical optical phonons produces a phonon-mediated thermal Hall effect in quantum paraelectrics, with predicted field, temperature, and critical-point dependences.", "summary": "We propose a microscopic theory of the phonon-mediated thermal Hall effect in quantum paraelectrics, driven by the intrinsic paramagnetism due to quantum fluctuations of the (nearly) critical optical phonon modes. The effective magnetization due to temporal fluctuations of the assosciated dipoles couple to an external magnetic field resulting the magnetoelectric term $\\mathbf{H} \\cdot (\\mathbf{P} ", "abstract": "We propose a microscopic theory of the phonon-mediated thermal Hall effect in quantum paraelectrics, driven by the intrinsic paramagnetism due to quantum fluctuations of the (nearly) critical optical phonon modes. The effective magnetization due to temporal fluctuations of the assosciated dipoles couple to an external magnetic field resulting the magnetoelectric term $\\mathbf{H} \\cdot (\\mathbf{P} \\times \\dot{\\mathbf{P}})$ in the effective Lagrangian density of the polarisation field $\\mathbf{P}$. This coupling splits the transverse optical phonon spectrum into right- and left-circularly polarized chiral branches. Using the chiral phonon Green's functions and the Kubo formalism, we derive the thermal Hall conductivity $κ_{xy}$ from the heat-current correlation function. We observe that $κ_{xy}$ is proportional to the difference in spectral weights of the two chiral modes, $κ_{xy} \\propto A_+^2 - A_-^2$, establishing a direct microscopic link between phonon chirality and transverse heat transport. Our theory predicts three key observations: (i) a linear-in-magnetic-field response $κ_{xy} \\propto H$ at low fields, evolving into nonlinear behavior at higher fields (ii) a non-monotonic temperature dependence of $κ_{xy}$ with a peak arising from the competition between thermal population and phonon scattering and (iii) strong enhancement of $κ_{xy}$ near the quantum critical point $ω_0 \\to 0$, it exhibits power-law scaling $κ_{xy} \\propto T^α$ with $α\\approx 0.41$. Our findings provide an understanding of thermal Hall transport in quantum paraelectrics due to intrinsic paramagnetism and is aligned with the observed behaviour in SrTiO$_3$ and related materials.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Quantum fluctuations of nearly critical optical phonons generate intrinsic paramagnetism and split transverse phonons into chiral branches, yielding a thermal Hall response linked to their spectral-weight difference and enhanced near the quantum critical point", "ai_in_scope": true, "relevance_reason": "The paper develops a microscopic theory connecting optical-phonon chirality in quantum paraelectrics to magnetic-field-dependent thermal Hall transport.", "relevance_method": "semantic", "relevance_score": 77, "feature_candidate": false, "summary_zh": "研究提出，近临界光学声子的量子涨落所产生的本征顺磁性，可在量子顺电体中引发声子介导的热霍尔效应，并预测其对磁场、温度和临界点的依赖关系。", "method_en": "The theory derives a magnetoelectric coupling of the form H·(P × Ṗ), uses it to obtain chiral optical-phonon modes, and calculates κxy from chiral phonon Green's functions and the Kubo formalism.", "method_zh": "理论推导出形式为H·(P × Ṗ)的磁电耦合，并据此得到手性光学声子模；随后利用手性声子格林函数和久保形式计算κxy。", "result_en": "The theory relates κxy to the difference in spectral weights of the two chiral modes, κxy ∝ A₊² − A₋². It predicts a response linear in magnetic field at low fields that becomes nonlinear at higher fields, a non-monotonic temperature dependence with a peak, and strong enhancement near the quantum critical point. Near that point it predicts power-law scaling κxy ∝ T^α with α ≈ 0.41.", "result_zh": "该理论将κxy与两个手性模的谱权重之差联系起来，即κxy ∝ A₊² − A₋²。理论预测热霍尔响应在低磁场下与磁场成正比、在较高磁场下转为非线性，温度依赖呈带峰值的非单调变化，并在量子临界点附近显著增强。该理论还预测临界点附近满足幂律标度κxy ∝ T^α，其中α ≈ 0.41。", "future_en": "Follow-up work could test the predicted magnetic-field, temperature, and near-critical scaling dependences in SrTiO₃ and related quantum paraelectrics.", "future_zh": "后续研究可在SrTiO₃及相关量子顺电体中检验该理论预测的磁场、温度及近临界标度关系。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The abstract presents a coherent microscopic mechanism and several testable quantitative predictions, but describes a theoretical proposal rather than an established experimental result or a demonstrated broad-impact advance.", "tier_reason_zh": "摘要提出了连贯的微观机制和多项可检验的定量预测，但其内容属于理论提案，尚非已确立的实验结果或已展示广泛影响的突破。"}, {"id": "arxiv-2610-32437", "arxiv_id": "2610.32437", "type": "arXiv", "journal": "arXiv:2610.32437", "journal_ref": "", "title": "Electronic structure of a persistent excitonic fluid far beyond the Mott limit", "arxiv_version": 1, "primary_category": "cond-mat.other", "categories": ["cond-mat.other"], "submitted_at": "2026-10-23T10:03:38Z", "updated_at": "2026-10-23T10:03:38Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Weiyan Qi, Stefano Ponzoni, Ashim Pramanik, Vitaly Gorelov, Yannis Laplace, Gianluca Stefanucci, Enrico Perfetto, Esteban Morcos, Marino Marsi, Steven Francis Udaundo, Sebastian Maherlein, Amina Taleb-Ibrahimi, Kaibo Zheng, Tonu Pullerits, Luca Perfetti", "corresponding": "", "url": "https://arxiv.org/abs/2610.32437v1", "topic": "Topology & Transport", "level": "Feature", "summary_en": "Time- and angle-resolved photoelectron spectroscopy on two-dimensional hybrid perovskites reveals a high-density excitonic state with a Mexican-hat electronic dispersion that persists far beyond optical saturation and into the incoherent regime. The authors interpret this long-lived, population-sustained state as a quantum fluid with characteristics reminiscent of a BCS condensate.", "summary": "Excitons are conventionally expected to destabilize at high photoexcitation densities, as screening weakens the electron-hole attraction. Recent studies, however, challenge this paradigm, suggesting that excitons generated by strong optical pumping can remain stable even beyond the onset of population inversion. Here, using time- and angle-resolved photoelectron spectroscopy on 2D hybrid perovskit", "abstract": "Excitons are conventionally expected to destabilize at high photoexcitation densities, as screening weakens the electron-hole attraction. Recent studies, however, challenge this paradigm, suggesting that excitons generated by strong optical pumping can remain stable even beyond the onset of population inversion. Here, using time- and angle-resolved photoelectron spectroscopy on 2D hybrid perovskites, we provide direct evidence for such a high-density excitonic state, characterized by a distinctive Mexican-hat dispersion. Remarkably, this excitonic band reconstruction endures for orders of magnitude longer than the optical coherence time, revealing a population-sustained electronic structure that survives well into the incoherent regime. The excitonic resonance also persists far beyond optical saturation, at densities where exciton wavefunctions strongly overlap. Our findings reveal a long-lived, high-density quantum fluid of excitons with characteristics reminiscent of a BCS condensate, an electronic structure markedly different from that of the dilute limit.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "A Mexican-hat excitonic band reconstruction persists far beyond optical coherence and saturation, showing that a high-density excitonic state survives into the incoherent regime beyond the Mott limit.", "ai_in_scope": true, "relevance_reason": "Direct spectroscopic evidence for a persistent high-density excitonic electronic state is a substantial discovery about collective electronic matter in a solid.", "relevance_method": "semantic", "relevance_score": 88, "feature_candidate": true, "summary_zh": "对二维杂化钙钛矿开展时间分辨角分辨光电子能谱，揭示了一种具有墨西哥帽型电子色散的高密度激子态；该态在远超光学饱和后仍持续存在，并延伸至非相干区间。作者将这一由粒子布居维持的长寿命态解释为具有类似BCS凝聚态特征的量子流体。", "method_en": "The study uses time- and angle-resolved photoelectron spectroscopy to measure the electronic structure of photoexcited two-dimensional hybrid perovskites. The authors track the reconstructed excitonic band and its persistence as the excitation density exceeds optical saturation and exciton wavefunctions strongly overlap.", "method_zh": "研究采用时间分辨角分辨光电子能谱，测量光激发二维杂化钙钛矿的电子结构。作者追踪重构后的激子能带，并考察其在激发密度超过光学饱和、激子波函数强烈重叠时是否仍能持续存在。", "result_en": "The measured high-density excitonic state has a distinctive Mexican-hat dispersion and persists at densities where exciton wavefunctions strongly overlap, far beyond optical saturation. The band reconstruction lasts orders of magnitude longer than the optical coherence time, indicating that it survives well into the incoherent regime. The excitonic resonance therefore persists beyond the density range at which excitons are conventionally expected to destabilize near the Mott limit. The authors describe the resulting state as a long-lived, population-sustained excitonic quantum fluid with characteristics reminiscent of a BCS condensate, distinct from the dilute-exciton limit.", "result_zh": "测得的高密度激子态具有独特的墨西哥帽型色散，并在激子波函数强烈重叠、远超光学饱和的密度下持续存在。能带重构的持续时间比光学相干时间长数个数量级，表明该态可延续至非相干区间。由此，激子共振在传统预期激子于接近莫特极限时失稳的密度范围之外仍然存在。作者将这一状态描述为长寿命、由粒子布居维持且具有类似BCS凝聚态特征的激子量子流体，并指出其不同于稀薄激子极限。", "future_en": "Further work could clarify the conditions governing the persistence of the reconstructed excitonic band as the system crosses from the coherent to the incoherent regime. Mapping the density and time dependence of this state would also help assess how broadly its BCS-like characteristics apply beyond the measured perovskites.", "future_zh": "后续工作可厘清体系从相干区进入非相干区时，重构激子能带持续存在的条件。绘制该态随密度和时间的变化，也有助于评估其类BCS特征在所测钙钛矿之外是否具有更广泛的适用性。", "tier": "Nature Physics/Nature Materials", "tier_reason_en": "Directly resolving a long-lived, high-density excitonic electronic structure beyond optical saturation and into the incoherent regime addresses a major question about exciton stability and is supported by time- and angle-resolved spectroscopy. The claimed persistence far beyond the conventional Mott-limit expectation gives the result substantial potential significance for quantum materials; the abstract alone does not establish a broader cross-disciplinary impact warranting the top general-science tier.", "tier_reason_zh": "直接分辨出在远超光学饱和后仍长寿命存在、并延伸至非相干区间的高密度激子电子结构，回应了激子稳定性的核心问题，并由时间分辨角分辨光谱支持。该结果所声称的激子在传统莫特极限预期之外持续存在，具有显著的量子材料意义；仅凭摘要尚不足以证明其具备更高综合性顶级期刊所要求的跨领域影响。"}, {"id": "arxiv-2610-32763", "arxiv_id": "2610.32763", "type": "arXiv", "journal": "arXiv:2610.32763", "journal_ref": "", "title": "Spontaneous Decay of High Energy Composite Fermions", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall", "cond-mat.str-el"], "submitted_at": "2026-10-23T15:05:06Z", "updated_at": "2026-10-23T15:05:06Z", "announcement_date": "2026-10-26", "announcement_section": "new", "authors": "Mytraya Gattu, J. K. Jain", "corresponding": "", "url": "https://arxiv.org/abs/2610.32763v1", "topic": "Topology & Transport", "level": "Brief", "summary_en": "The paper reports that a high-energy composite fermion with fractional charge can spontaneously decay into a collection of excitations that includes quasiparticles, quasiholes, and whole electrons.", "summary": "An electron, when added to a fractional quantum Hall fluid, famously splits into fractionally charged composite-fermion quasiparticles. We show here that a high energy composite fermion carrying a fractional charge decays into a collection of particles, including quasiparticles, quasiholes, and even whole electrons.", "abstract": "An electron, when added to a fractional quantum Hall fluid, famously splits into fractionally charged composite-fermion quasiparticles. We show here that a high energy composite fermion carrying a fractional charge decays into a collection of particles, including quasiparticles, quasiholes, and even whole electrons.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "A high-energy fractionally charged composite fermion can spontaneously decay into a collection that includes quasiparticles, quasiholes, and whole electrons.", "ai_in_scope": true, "relevance_reason": "This is original theory of fractional quantum Hall quasiparticles and their decay, a direct contribution to correlated electronic matter.", "relevance_method": "semantic", "relevance_score": 73, "feature_candidate": false, "summary_zh": "论文报告称，携带分数电荷的高能复合费米子可以自发衰变为一组激发，其中包括准粒子、准空穴，甚至完整电子。", "method_en": "The abstract does not specify the theoretical or experimental methods used to establish this decay.", "method_zh": "摘要未说明用于论证这种衰变的理论或实验方法。", "result_en": "The stated finding is that a high-energy, fractionally charged composite fermion decays into multiple particles, including quasiparticles, quasiholes, and whole electrons; no quantitative results are provided.", "result_zh": "摘要所述的主要发现是：携带分数电荷的高能复合费米子会衰变为多个粒子，包括准粒子、准空穴和完整电子；摘要未提供定量结果。", "future_en": "The abstract does not discuss experimental tests or future research directions.", "future_zh": "摘要未讨论实验检验或未来研究方向。", "tier": "Below PRB", "tier_reason_en": "The abstract presents an intriguing decay process in fractional quantum Hall physics, but provides no methods, quantitative evidence, or further context with which to assess its support or broader significance; based on the available information, Below PRB is the most defensible assessment.", "tier_reason_zh": "摘要提出了分数量子霍尔物理中一种颇有趣的衰变过程，但未提供方法、定量证据或其他背景，难以评估其论证力度及广泛意义；仅依据现有信息，评为低于PRB档最为稳妥。"}], "stats": {"scanned": 148, "first_pass_selected": 31, "selected": 21, "rejected": 127, "ai_assessed": 148, "ai_cached": 0, "ai_unscored": 0, "global_editorial": true, "field_scope_excluded": 0, "arxiv_selected": 17, "journal_selected": 4, "arxiv_harvest_excluded": 70, "pending_journal_abstracts": 15}}, {"date": "2026-10-25", "title": "Daily Condensed Matter Literature", "papers": [{"id": "arxiv-2610-30290", "arxiv_id": "2610.30290", "type": "arXiv", "journal": "arXiv:2610.30290", "journal_ref": "", "title": "$π$-Flux Tuning of Quantum Paramagnetism in the Triangular-Lattice Hubbard Model", "authors": "Zhaochen Liu, Andreas Feuerpfeil, Ronny Thomale", "corresponding": "", "url": "https://arxiv.org/abs/2610.30290", "topic": "Magnetism", "level": "Feature", "summary_en": "This work compares zero-flux and staggered-π-flux triangular-lattice Hubbard models at half filling to examine how flux-dependent charge fluctuations affect quantum paramagnetism. It finds contrasting scalar-chirality behavior associated with the different signs of ring exchange in the two models.", "summary": "We compare two time-reversal-symmetric triangular-lattice Hubbard models at half filling: the zero-flux model and a staggered $π$-flux model with zero and $π$ flux through oppositely oriented triangles. Although both reduce to the same Heisenberg model at leading order in the strong-coupling limit, their distinct charge fluctuation profiles yield different quantum paramagnetic regimes. Combining a", "abstract": "We compare two time-reversal-symmetric triangular-lattice Hubbard models at half filling: the zero-flux model and a staggered $π$-flux model with zero and $π$ flux through oppositely oriented triangles. Although both reduce to the same Heisenberg model at leading order in the strong-coupling limit, their distinct charge fluctuation profiles yield different quantum paramagnetic regimes. Combining a strong-coupling expansion with infinite density matrix renormalization group (iDMRG) calculations, we find that the positive ring-exchange of the zero-flux model promotes spontaneous chirality, consistent with its notion of a chiral spin liquid at intermediate coupling. In the staggered-$π$-flux model, whose noninteracting limit is a Dirac semimetal, the ring exchange changes sign and disfavors chiral order and we find no resolvable scalar chirality. This renders flux-tuned ring-exchange an efficient discriminator between chiral and non-chiral quantum paramagnets at finite coupling.", "method": "", "result": "", "future": "", "physics_advance": "The sign of ring exchange distinguishes the chiral tendency of the zero-flux model from the absence of resolvable scalar chirality in the staggered-π-flux model.", "ai_in_scope": true, "relevance_reason": "This is an original study of quantum paramagnetic regimes in a triangular-lattice Hubbard system and identifies flux-dependent ring exchange as a mechanism affecting chirality.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": true, "summary_zh": "本研究比较半填充三角晶格 Hubbard 模型中的零磁通与交错 π 磁通情形，考察磁通依赖的电荷涨落如何影响量子顺磁态。研究发现，两种模型中环交换符号不同，并伴随不同的标量手征性表现。", "method_en": "The authors combine a strong-coupling expansion with infinite density matrix renormalization group (iDMRG) calculations. The comparison focuses on the effective ring-exchange terms and scalar chirality in the two models.", "method_zh": "作者结合强耦合展开与无限密度矩阵重整化群（iDMRG）计算。比较重点是两种模型中的有效环交换项和标量手征性。", "result_en": "Although both models reduce to the same Heisenberg model at leading order in the strong-coupling limit, their charge-fluctuation profiles differ. Positive ring exchange in the zero-flux model promotes spontaneous chirality, consistent with a chiral spin liquid at intermediate coupling, whereas ring exchange changes sign in the staggered-π-flux model and disfavors chiral order. No resolvable scalar chirality is found in the latter model. The results identify flux-tuned ring exchange as a discriminator between chiral and non-chiral quantum paramagnets at finite coupling.", "result_zh": "尽管两种模型在强耦合极限的最低阶都化为相同的 Heisenberg 模型，其电荷涨落分布却不同。零磁通模型中的正环交换促进自发手征性，这与中等耦合下的手征自旋液体图景相符；而在交错 π 磁通模型中，环交换变号并抑制手征有序。后一模型中未发现可分辨的标量手征性。结果表明，在有限耦合下，磁通调控的环交换可用于区分手征与非手征量子顺磁态。", "future_en": "The authors propose flux-tuned ring exchange as an efficient discriminator between chiral and non-chiral quantum paramagnets at finite coupling. The abstract does not specify a separate experimental follow-up.", "future_zh": "作者提出，在有限耦合下利用磁通调控的环交换，有效区分手征与非手征量子顺磁态。摘要未具体说明后续实验方案。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work offers a focused numerical and strong-coupling comparison that clarifies how flux changes ring exchange and chirality, but the abstract describes a specific model-level result rather than a broadly demonstrated advance.", "tier_reason_zh": "该工作通过针对性的数值计算和强耦合比较，阐明磁通如何改变环交换与手征性；但摘要呈现的是特定模型层面的结果，而非已广泛验证的突破。"}, {"id": "arxiv-2610-30743", "arxiv_id": "2610.30743", "type": "arXiv", "journal": "arXiv:2610.30743", "journal_ref": "", "title": "Anyon Chern bands of opposite sign and reversed drift", "authors": "Zhenyu Xiao, Minxuan Wang, Shinsei Ryu", "corresponding": "", "url": "https://arxiv.org/abs/2610.30743", "topic": "Magnetism", "level": "Brief", "summary_en": "This theoretical and numerical study investigates the dispersion and dynamics of Laughlin quasiholes at filling 1/3 in a periodically modulated magnetic field. It finds anyon bands with opposite Chern-number signs and a quasihole drift opposite to the usual E×B direction in one band.", "summary": "The elementary charged excitations of fractional quantum Hall states are anyons. Without continuous translation symmetry, they acquire a dispersion and richer dynamics. We study the Laughlin quasihole at filling $1/3$ in a periodically modulated magnetic field, a common model of fractional Chern insulators in two-dimensional materials. From the microscopic wave functions, we derive the commutator ", "abstract": "The elementary charged excitations of fractional quantum Hall states are anyons. Without continuous translation symmetry, they acquire a dispersion and richer dynamics. We study the Laughlin quasihole at filling $1/3$ in a periodically modulated magnetic field, a common model of fractional Chern insulators in two-dimensional materials. From the microscopic wave functions, we derive the commutator of its guiding-center coordinates, set by a many-body Berry curvature that governs its wave packets. A modulation with two flux quanta per unit cell splits the quasihole band into bands with Chern numbers $6$ and $-3$; such opposite signs are generic as long as a weak modulation opens a gap between the anyon bands. In the $C=-3$ band, the quasihole drifts against $\\mathbf{E}\\times\\mathbf{B}$, although the magnetic field has the same sign everywhere. Perturbation theory in the modulation explains these results, and large-scale Monte Carlo calculations confirm them. Anyon bands thus acquire their own topology, which controls anyon motion and may shape the phases of itinerant anyons.", "method": "", "result": "", "future": "", "physics_advance": "Periodic magnetic modulation can split Laughlin quasiholes into bands with opposite Chern numbers, including a band whose quasiholes drift opposite to the usual E×B direction despite a magnetic field of unchanged sign.", "ai_in_scope": true, "relevance_reason": "The paper establishes new topological and dynamical behavior of fractional quantum Hall quasiholes, a substantial theoretical advance in condensed-matter physics.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": false, "summary_zh": "本理论与数值研究考察填充因子 1/3 的 Laughlin 准空穴在周期调制磁场中的色散与动力学。研究发现，任意子能带可具有符号相反的陈数，且其中一个能带的准空穴漂移方向与通常的 E×B 方向相反。", "method_en": "The authors derive the commutator of quasihole guiding-center coordinates from microscopic wave functions, with the commutator set by a many-body Berry curvature. They analyze the modulation perturbatively and use large-scale Monte Carlo calculations to confirm the results.", "method_zh": "作者从微观波函数推导准空穴导引中心坐标的对易关系，其对易关系由多体 Berry 曲率决定。研究通过微扰理论分析磁场调制，并以大规模 Monte Carlo 计算验证结果。", "result_en": "For a modulation with two flux quanta per unit cell, the quasihole band splits into bands with Chern numbers 6 and −3. The authors report that opposite-sign Chern numbers are generic when a weak modulation opens a gap between anyon bands. In the C = −3 band, the quasihole drifts against E×B even though the magnetic field has the same sign everywhere. These results show that anyon-band topology can govern anyon motion and may influence phases of itinerant anyons.", "result_zh": "当每个晶胞的调制磁通为两个磁通量子时，准空穴能带分裂为陈数分别为 6 和 −3 的能带。作者指出，只要弱调制在任意子能带之间打开能隙，陈数符号相反的情形便具有普遍性。在 C = −3 的能带中，尽管磁场处处同号，准空穴仍逆着 E×B 方向漂移。这些结果表明，任意子能带拓扑能够控制任意子运动，并可能影响可运动任意子的相态。", "future_en": "The authors suggest that the topology of anyon bands may shape phases of itinerant anyons. The abstract does not specify a particular experimental test or follow-up study.", "future_zh": "作者指出，任意子能带的拓扑可能影响可运动任意子的相态。摘要未提出具体的实验检验或后续研究方案。", "tier": "PRL", "tier_reason_en": "The result links many-body Berry curvature and anyon-band topology to a striking reversed-drift response, supported by both perturbation theory and large-scale Monte Carlo; this is a concise conceptual advance with potential relevance beyond the specific model.", "tier_reason_zh": "该结果将多体 Berry 曲率和任意子能带拓扑与显著的反向漂移响应联系起来，并由微扰理论和大规模 Monte Carlo 共同支持；这是一个简洁的概念性进展，具有超出特定模型的潜在意义。"}, {"id": "arxiv-2607-22176", "arxiv_id": "2607.22176", "type": "arXiv", "journal": "arXiv:2607.22176", "journal_ref": "Phys. Rev. B 114, 204423 (2026)", "title": "GHz non-reciprocal optical conductivity in hematite ($α$-$\\text{Fe}_2\\text{O}_3$)", "authors": "Peng Rao, Johannes Gröbmeyer, P. Peter Stavropoulos, Alexander Mook, Matthias Althammer, Hans Huebl, Alexander Holleitner, Johannes Knolle", "corresponding": "", "url": "https://arxiv.org/abs/2607.22176", "topic": "Magnetism", "level": "Brief", "summary_en": "This study calculates sub-gap optical response and nonreciprocity in canted easy-plane antiferromagnetic hematite across the GHz-to-THz range. It finds that the canting-induced net magnetic moment is associated with a nonzero Hall conductivity and evaluates a prospective circulator response.", "summary": "We study the non-reciprocal properties of the iron oxide $α$-Fe$_2$O$_3$ (hematite) in the canted easy-plane antiferromagnetic phase, specifically in the GHz to THz frequency range. First, using the the microscopic spin Hamiltonian, we obtain the correct classical ground state where the canting is induced by the Dzyaloshinskii-Moriya interactions (DMI). The magnon spectrum is simulated using linea", "abstract": "We study the non-reciprocal properties of the iron oxide $α$-Fe$_2$O$_3$ (hematite) in the canted easy-plane antiferromagnetic phase, specifically in the GHz to THz frequency range. First, using the the microscopic spin Hamiltonian, we obtain the correct classical ground state where the canting is induced by the Dzyaloshinskii-Moriya interactions (DMI). The magnon spectrum is simulated using linear spin wave theory. We then compute the polarizability and the sub-gap optical conductivities using linear response. We find that the conductivity tensor contains frequency peaks at the zero momentum magnon gaps of order $0.1~$meV which can be tuned by the DMI and on-site anisotropic spin interactions. Furthermore, we show that the canting-induced net magnetic moment $\\mathbf{m}$ represents a measure for the effective time-reversal-symmetry breaking and non-reciprocity of the system: a finite $\\mathbf{m}$ results in a non-zero Hall conductivity. Finally, we discuss the prospective application of hematite in non-reciprocal circulator design, by computing the non-reciprocal circulator transmission amplitude using the conductivities as input.", "method": "", "result": "", "future": "", "physics_advance": "The calculation predicts a nonzero Hall conductivity in canted hematite and connects its magnitude to the net moment, with conductivity peaks at magnon gaps tunable by DMI and anisotropy.", "ai_in_scope": true, "relevance_reason": "This is condensed-matter theory of an antiferromagnetic material, predicting how its magnetic order and magnon modes produce non-reciprocal optical conductivity.", "relevance_method": "semantic", "relevance_score": 72, "feature_candidate": false, "summary_zh": "本研究计算了易平面倾斜反铁磁赤铁矿在 GHz 至 THz 频段的带隙内光学响应与非互易性。研究发现，倾斜产生的净磁矩与非零霍尔电导相关，并评估了其潜在环行器响应。", "method_en": "The authors determine the classical canted ground state from a microscopic spin Hamiltonian, simulate magnons using linear spin-wave theory, and calculate polarizability and sub-gap optical conductivities with linear response. They use the resulting conductivities to compute a nonreciprocal circulator transmission amplitude.", "method_zh": "作者从微观自旋哈密顿量确定经典倾斜基态，以线性自旋波理论模拟磁振子，并通过线性响应计算极化率和带隙内光学电导。随后利用所得电导计算非互易环行器的透射振幅。", "result_en": "The conductivity tensor has peaks at zero-momentum magnon gaps of order 0.1 meV, which can be tuned by Dzyaloshinskii–Moriya interactions and on-site anisotropic spin interactions. A finite canting-induced net moment corresponds to nonzero Hall conductivity and serves as a measure of effective time-reversal-symmetry breaking and nonreciprocity. The authors discuss hematite as a prospective material for nonreciprocal circulator design.", "result_zh": "电导张量在零动量磁振子能隙处出现峰值，能隙量级约为 0.1 meV，并可通过 Dzyaloshinskii–Moriya 相互作用及格点内各向异性自旋相互作用调节。倾斜产生的净磁矩非零时，霍尔电导也非零；作者将净磁矩视为系统有效时间反演对称性破缺与非互易性的量度。作者讨论了赤铁矿用于非互易环行器设计的潜力。", "future_en": "The authors identify nonreciprocal circulator design as a prospective application and evaluate its transmission amplitude using the calculated conductivities. The abstract does not specify further experimental steps.", "future_zh": "作者将非互易环行器设计列为潜在应用，并利用计算得到的电导评估其透射振幅。摘要未具体说明进一步的实验步骤。"}, {"id": "arxiv-2610-30318", "arxiv_id": "2610.30318", "type": "arXiv", "journal": "arXiv:2610.30318", "journal_ref": "", "title": "Domain walls in $R3c$-structured NaNbO$_3$", "authors": "Jack G. Nedell, Craig J. Fennie", "corresponding": "", "url": "https://arxiv.org/abs/2610.30318", "topic": "Materials & Growth", "level": "Brief", "summary_en": "This first-principles study classifies and examines structural domain walls in the low-temperature rhombohedral R3c phase of NaNbO₃.", "summary": "In this work, we undertake a systematic first-principles study of structural domain walls in the low-temperature rhombohedral $R3c$ phase of perovskite oxide NaNbO$_3$. Employing a group-theoretic classification, we introduce eight unique classes of domain walls in the $R3c$ structure, four of which have a domain wall orientation determined uniquely by the conditions of elastic compatibility and c", "abstract": "In this work, we undertake a systematic first-principles study of structural domain walls in the low-temperature rhombohedral $R3c$ phase of perovskite oxide NaNbO$_3$. Employing a group-theoretic classification, we introduce eight unique classes of domain walls in the $R3c$ structure, four of which have a domain wall orientation determined uniquely by the conditions of elastic compatibility and charge neutrality, and perform structural relaxations for each representative domain wall class. We find that one class of 109° domain walls has a notably low energy of 9 mJ m$^{-2}$, comparable to the low-energy ferroelectric walls in BaTiO$_3$. Finally, we find that this class of 109° walls is compatible with the crystal twinning observed in experiments on the $R3c$ phase, and propose an atomistic mechanism for the $R3c \\leftrightarrow Pbcm$ phase transition.", "method": "", "result": "", "future": "", "physics_advance": "It classifies eight domain-wall types in rhombohedral NaNbO₃, identifies a low-energy 109° wall compatible with observed twinning, and proposes an atomistic mechanism for the R3c-to-Pbcm transition.", "ai_in_scope": true, "relevance_reason": "This first-principles study investigates domain-wall energetics and structural transformations in a condensed-matter oxide.", "relevance_method": "semantic", "relevance_score": 73, "feature_candidate": false, "summary_zh": "这项第一性原理研究对 NaNbO₃ 低温 R3c 相中的结构畴壁进行分类和考察。", "method_en": "Using group theory, the authors identify eight domain-wall classes, derive unique orientations for four from elastic compatibility and charge neutrality, and relax representative structures.", "method_zh": "作者运用群论识别出八类畴壁，并依据弹性相容性和电荷中性条件确定其中四类的唯一取向，再对各类代表结构进行弛豫。", "result_en": "One 109° wall class has a calculated energy of 9 mJ m⁻², comparable to low-energy ferroelectric walls in BaTiO₃; the authors also find it compatible with observed crystal twinning and propose an atomistic mechanism for the R3c↔Pbcm transition.", "result_zh": "一类 109° 畴壁的计算能量为 9 mJ m⁻²，与 BaTiO₃ 中低能铁电畴壁相当；作者还指出它与实验观察到的晶体孪晶相容，并提出 R3c↔Pbcm 相变的原子机制。", "future_en": "Experimental characterization of the predicted low-energy wall and its relation to twinning could test the proposed structural picture; further calculations could examine the proposed transition mechanism.", "future_zh": "对所预测低能畴壁及其与孪晶关系开展实验表征，可检验这一结构图景；进一步计算则可考察所提出的相变机制。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The symmetry-based classification and quantitative first-principles wall energetics provide a focused contribution to functional-oxide physics, but the abstract describes a single material and a computational study, supporting a solid specialist-journal tier rather than a broader high-impact tier.", "tier_reason_zh": "基于对称性的分类和定量第一性原理畴壁能计算，为功能氧化物物理提供了有针对性的成果；但摘要所述工作集中于单一材料且以计算为主，更适合扎实的专业期刊层级，而非更广泛的高影响力层级。"}, {"id": "arxiv-2610-30210", "arxiv_id": "2610.30210", "type": "arXiv", "journal": "arXiv:2610.30210", "journal_ref": "", "title": "Electronic Screening as a Design Lever in La-Doped BaTiO$_3$: Coupled Polarization, Dielectric Response, and Optical Anisotropy", "authors": "Sikandar Azam, Muhammad Fareed, Qaiser Rafiq, Jan Minar, Abed Alataway", "corresponding": "", "url": "https://arxiv.org/abs/2610.30210", "topic": "Materials & Growth", "level": "Brief", "summary_en": "This study uses first-principles calculations to examine how 12.5% La substitution at Ba sites affects the coupled structural, ferroelectric, dielectric, electronic, and optical properties of BaTiO₃.", "summary": "Donor substitution can tune the coupled ferroelectric, dielectric, electronic, and optical properties of perovskite oxides by modifying lattice distortions and electronic screening. We investigate these effects in La-doped BaTiO3 using density functional theory, density-functional perturbation theory, and the Berry-phase formalism for polarization. For a model with 12.5% La substitution at the Ba ", "abstract": "Donor substitution can tune the coupled ferroelectric, dielectric, electronic, and optical properties of perovskite oxides by modifying lattice distortions and electronic screening. We investigate these effects in La-doped BaTiO3 using density functional theory, density-functional perturbation theory, and the Berry-phase formalism for polarization. For a model with 12.5% La substitution at the Ba site, La incorporation induces anisotropic lattice contraction, reduces tetragonality and Ti off-centering, and weakens the energetic stabilization of the tetragonal ferroelectric phase. The accompanying reduction in polarization is associated with enhanced electronic screening and reduced anomalous Born effective charges. Phonon calculations indicate that the relaxed doped structure is dynamically stable, while hardening of a low-frequency polar mode is consistent with weakened ferroelectricity. The high-frequency dielectric response increases moderately, whereas the static dielectric response decreases as the lattice contribution is suppressed. Electronic-structure calculations show a Fermi-level shift toward the conduction band without mid-gap defect states. The optical spectra exhibit an absorption-edge shift consistent with a Burstein-Moss-type mechanism, enhanced near-edge transparency, and reduced birefringence. Together, these results suggest a microscopic connection between donor-induced screening, polar-mode hardening, reduced dynamical charges, polarization suppression, and decreased optical anisotropy. The conclusions apply to the investigated 12.5% composition; calculations at additional concentrations are needed to establish quantitative doping trends.", "method": "", "result": "", "future": "", "physics_advance": "For 12.5% La substitution in BaTiO3, enhanced electronic screening and reduced anomalous Born charges accompany weaker Ti off-centering, a hardened polar mode, and suppressed polarization and optical anisotropy.", "ai_in_scope": true, "relevance_reason": "The calculations address how donor doping changes ferroelectric lattice, dielectric, and electronic properties in a solid-state material, though the result is limited to one modeled composition.", "relevance_method": "semantic", "relevance_score": 58, "feature_candidate": false, "summary_zh": "这项研究通过第一性原理计算考察 Ba 位 12.5% La 替代对 BaTiO₃ 结构、铁电、介电、电子和光学性质的耦合影响。", "method_en": "The authors combine density functional theory, density-functional perturbation theory, and Berry-phase polarization calculations for the specified doped composition.", "method_zh": "作者针对所研究的掺杂组分，结合密度泛函理论、密度泛函微扰理论和 Berry 相位极化计算。", "result_en": "La substitution contracts the lattice anisotropically, reduces tetragonality, Ti off-centering, and polarization, and hardens a low-frequency polar mode; the calculations also find a moderately increased high-frequency dielectric response but a reduced static response, a conduction-band-directed Fermi-level shift without mid-gap defect states, a Burstein–Moss-type absorption-edge shift, increased near-edge transparency, and reduced birefringence.", "result_zh": "La 替代导致晶格各向异性收缩，并降低四方畸变、Ti 离心位移和极化，同时使低频极化模硬化；计算还显示高频介电响应适度增强而静态响应降低、费米能级向导带移动但没有带隙中缺陷态、吸收边发生 Burstein–Moss 型位移、近带边透明度提高且双折射减弱。", "future_en": "Calculations at additional La concentrations are needed to establish quantitative doping trends, as the abstract explicitly notes; experimental measurements could test the predicted dielectric and optical changes.", "future_zh": "正如摘要所指出的，还需计算更多 La 浓度以确定定量掺杂趋势；实验测量则可检验所预测的介电和光学变化。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The abstract presents a broad, internally connected set of predictions for a technologically relevant oxide, but the evidence is limited to one modeled concentration and computational results, making a specialist materials-physics tier the best fit.", "tier_reason_zh": "摘要针对具有应用意义的氧化物提出了一组相互关联的预测，但证据仅限于一个模型浓度和计算结果，因此专业材料物理期刊层级较为合适。"}, {"id": "arxiv-2602-12944", "arxiv_id": "2602.12944", "type": "arXiv", "journal": "arXiv:2602.12944", "journal_ref": "", "title": "Electrostatic edge effects versus edge doping in graphene nanoribbons: a scanning gate microscopy and modelling study", "authors": "Colm Durkan, Xiao Liu, Ed Saunders", "corresponding": "", "url": "https://arxiv.org/abs/2602.12944", "topic": "Other Condensed Matter", "level": "Feature", "summary_en": "The study re-examines width-dependent charge-neutrality-point shifts in oxygen-plasma-patterned graphene nanoribbons and finds that gate-field fringing explains most of the trend, rather than intrinsic n-type edges. Its combined modeling, capacitance analysis, and scanning-gate measurements identify a smaller, device-dependent edge-charge contribution.", "summary": "The charge neutrality point (CNP) of graphene nanoribbons (GNRs) patterned by oxygen plasma etching moves towards zero as the ribbon narrows and, on 300 nm SiO2, changes sign below a crossover width of ~ 50 nm: an observation previously attributed to n-type edges surrounding a p-type bulk. We test this edge-doping hypothesis in three ways. First, finite element modelling of complete GNR transistor", "abstract": "The charge neutrality point (CNP) of graphene nanoribbons (GNRs) patterned by oxygen plasma etching moves towards zero as the ribbon narrows and, on 300 nm SiO2, changes sign below a crossover width of ~ 50 nm: an observation previously attributed to n-type edges surrounding a p-type bulk. We test this edge-doping hypothesis in three ways. First, finite element modelling of complete GNR transistors with uniform doping shows that fringing of the gate field at the edges reproduces the trend of the measured CNP with width down to ~ 50nm without any edge doping, while producing a bias-dependent inversion of the carrier type at the edges that mimics n-type edges in scanned-probe measurements. Second, fitting the CNP of ribbons on 90 nm and 300 nm SiO2 with the gate capacitance of a finite strip, which fixes the electrostatic contribution with no adjustable parameter other than the bulk doping, shows that fringing accounts for most of the width dependence and isolates the remainder as an edge charge. This is acceptor-like (0.24 e/nm per edge) in the present ribbons, which therefore have no n-type edges, and donor-like but small in devices on 300 nm SiO2; no single edge-charge, field-coupled or contact-doping mechanism describes both. Third, scanning gate microscopy finds no edge contrast of the sign expected for n-type edges. The width dependence of the CNP is therefore predominantly electrostatic, and n-type edges are not an intrinsic consequence of oxygen-plasma etching. A design map shows that fringing dominates the width dependence whenever the gate dielectric is thicker than 30-50 nm, whereas in scaled high-K transistors, edge charge dominates and would shift the threshold voltage of a 10 nm ribbon by ~ 0.1-0.15 V. Fitting the CNP versus width with the strip capacitance provides a simple test for edge doping in any gated two-dimensional nanostructure", "method": "", "result": "", "future": "", "physics_advance": "Gate-field fringing explains most of the width-dependent charge-neutrality-point shift and can mimic n-type edge signatures, while the measured edge charge in these ribbons is acceptor-like rather than n-type.", "ai_in_scope": true, "relevance_reason": "Measurements and modeling in graphene nanoribbons identify the physical origins of width-dependent charge-neutrality shifts, making this a credible, focused advance in two-dimensional electronic materials.", "relevance_method": "semantic", "relevance_score": 64, "feature_candidate": true, "summary_zh": "本研究重新考察氧等离子体刻蚀石墨烯纳米带中电荷中性点随宽度变化的现象，发现栅极电场边缘效应解释了其中大部分趋势，而非本征 n 型边缘。建模、电容分析和扫描门显微测量共同表明，边缘电荷的贡献较小且依赖器件条件。", "method_en": "Finite-element modeling of complete transistors with uniform doping tests whether gate-field fringing can reproduce the observed width dependence; fitting finite-strip gate capacitance separates electrostatic effects from edge charge. Scanning gate microscopy independently tests for the expected signal of n-type edges.", "method_zh": "研究对均匀掺杂的完整晶体管进行有限元建模，以检验栅极电场边缘效应能否再现观测到的宽度依赖；通过拟合有限宽条带的栅极电容，区分静电效应与边缘电荷。另以扫描门显微术独立检验 n 型边缘应有的信号。", "result_en": "Uniform-doping electrostatic modeling reproduces the charge-neutrality-point trend down to ribbon widths of about 50 nm and can generate a bias-dependent edge carrier-type inversion that mimics n-type edges in probe measurements. For the studied ribbons, the remaining fitted edge charge is acceptor-like, at 0.24 e/nm per edge, so the authors conclude that these ribbons do not have n-type edges; devices on 300 nm SiO₂ instead show a small donor-like edge charge. Scanning gate microscopy finds no edge contrast with the sign expected for n-type edges. The design analysis finds fringing dominates the width dependence when the gate dielectric is thicker than 30–50 nm, whereas in scaled high-K transistors edge charge dominates and would shift the threshold voltage of a 10 nm ribbon by about 0.1–0.15 V.", "result_zh": "均匀掺杂的静电模型可再现宽度低至约 50 nm 的纳米带电荷中性点趋势，并能产生随偏压变化的边缘载流子类型反转，从而在探针测量中模拟 n 型边缘。对所研究的纳米带，拟合得到的剩余边缘电荷为受主型，每条边缘为 0.24 e/nm，因此作者认为这些纳米带并无 n 型边缘；而在 300 nm SiO₂ 上的器件中，边缘电荷较小且为施主型。扫描门显微术未发现符号符合 n 型边缘预期的边缘对比信号。设计分析表明，当栅介质厚于 30–50 nm 时，边缘电场效应主导宽度依赖；而在缩放的高介电常数晶体管中，边缘电荷占主导，并可使 10 nm 纳米带的阈值电压移动约 0.1–0.15 V。", "future_en": "The authors present fitting the charge-neutrality point versus width with strip capacitance as a simple test for edge doping in gated two-dimensional nanostructures. Their design map also identifies when electrostatic fringing or edge charge is expected to dominate, including the estimated threshold-voltage shift for a 10 nm ribbon.", "future_zh": "作者提出，将电荷中性点随宽度的变化拟合到条带电容，是检验栅控二维纳米结构中边缘掺杂的简便方法。其设计图还指出了静电边缘效应或边缘电荷分别占主导的条件，并给出了 10 nm 纳米带的阈值电压移动估计。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work combines complementary modeling and scanning-probe evidence to resolve a focused electrostatic interpretation question, with useful quantitative design implications; the abstract does not indicate the broader conceptual reach or advance warranting a higher tier.", "tier_reason_zh": "该工作结合互补的建模与扫描探针证据，厘清了一个范围明确的静电解释问题，并给出有用的定量设计启示；摘要所述成果尚未显示出足以支持更高档次的广泛概念影响或突破。"}, {"id": "arxiv-2501-14017", "arxiv_id": "2501.14017", "type": "arXiv", "journal": "arXiv:2501.14017", "journal_ref": "", "title": "Exact few-magnon Bethe scars of the non-integrable alternating Heisenberg chain", "authors": "Ronald Melendrez, Bhaskar Mukherjee, Marcin Szyniszewski, Christopher J. Turner, Arijeet Pal, Hitesh J. Changlani", "corresponding": "", "url": "https://arxiv.org/abs/2501.14017", "topic": "Superconductivity", "level": "Brief", "summary_en": "This work identifies exact few-magnon scar states in the non-integrable alternating ferromagnetic–antiferromagnetic Heisenberg chain and relates them to modified Bethe-ansatz constructions.", "summary": "Exact solutions of quantum lattice models serve as useful guides for interpreting physical phenomena in condensed matter systems. Prominent examples of integrability appear in one dimension, including the Heisenberg chain, where the Bethe ansatz method has been widely successful. Recent work has noted that certain non-integrable models harbor quantum many-body scar states, which form a superspin o", "abstract": "Exact solutions of quantum lattice models serve as useful guides for interpreting physical phenomena in condensed matter systems. Prominent examples of integrability appear in one dimension, including the Heisenberg chain, where the Bethe ansatz method has been widely successful. Recent work has noted that certain non-integrable models harbor quantum many-body scar states, which form a superspin of regular states hidden in an otherwise chaotic spectrum. Here we consider one of the simplest examples of a non-integrable model, the alternating ferromagnetic-antiferromagnetic (bond-staggered) Heisenberg chain, a close cousin of the spin-1 Haldane chain and a spin analog of the Su-Schrieffer-Heeger model, and show the presence of exponentially many zero-energy states. We highlight features of the alternating chain that allow treatment with the coordinate Bethe ansatz (with important modifications), and surprisingly, for a non-integrable system, we find simple compact expressions for zero-energy eigenfunctions for a few magnons, including solutions with fractionalized particle momentum. These states exhibit wavefunction scarring similar to that of single-particle states in chaotic billiards. We discuss a general numerical recipe to diagnose the existence of such generalized Bethe ansatz (GBA) scar states and also provide exact analytic expressions for their entanglement. We conclude by conjecturing a picture of magnon pairing which may generalize to multiple magnons. Our work opens the avenue to describe certain eigenstates of partially integrable systems using the GBA.", "method": "", "result": "", "future": "", "physics_advance": "Finds exponentially many zero-energy states and compact few-magnon scar eigenfunctions, including fractionalized-momentum solutions, in the alternating Heisenberg chain.", "ai_in_scope": true, "relevance_reason": "This develops exact results for many-body eigenstates and magnon excitations in a non-integrable quantum spin chain.", "relevance_method": "semantic", "relevance_score": 80, "feature_candidate": false, "summary_zh": "这项工作在非可积的交替铁磁—反铁磁 Heisenberg 链中识别出精确的少磁振子 scar 态，并将其与经过修改的 Bethe ansatz 构造联系起来。", "method_en": "The authors adapt the coordinate Bethe ansatz to the alternating chain, derive compact few-magnon eigenfunctions, and provide a numerical diagnostic recipe and analytic entanglement expressions for generalized Bethe-ansatz scar states.", "method_zh": "作者将坐标 Bethe ansatz 推广至交替链，推导紧凑形式的少磁振子本征波函数，并给出广义 Bethe ansatz scar 态的数值诊断方案和解析纠缠表达式。", "result_en": "The chain is shown to host exponentially many zero-energy states, including few-magnon solutions with fractionalized particle momentum; these states exhibit scarring, and the authors conjecture a magnon-pairing picture that may extend to multiple magnons.", "result_zh": "研究表明该链具有指数多的零能态，其中包括具有分数化粒子动量的少磁振子解；这些态呈现 scar 特征，作者还猜想一种可能推广至多磁振子的磁振子配对图景。", "future_en": "Further work could test the conjectured pairing picture for multiple magnons and apply the proposed generalized Bethe-ansatz diagnostics to other partially integrable systems.", "future_zh": "后续研究可检验针对多磁振子的配对猜想，并将所提出的广义 Bethe ansatz 诊断方法应用于其他部分可积系统。", "tier": "PRL", "tier_reason_en": "The exact scar solutions, exponentially many zero-energy states, fractionalized momenta, and analytic entanglement results constitute a compact conceptual advance in non-integrable quantum dynamics, supporting a strong short-format physics tier.", "tier_reason_zh": "精确 scar 解、指数多零能态、分数化动量以及解析纠缠结果共同构成了对非可积量子动力学的集中概念性推进，足以支持较高水平的短篇物理期刊层级。"}, {"id": "arxiv-2606-21507", "arxiv_id": "2606.21507", "type": "arXiv", "journal": "arXiv:2606.21507", "journal_ref": "Liu W, Natale G, Farhang C, et al. Nontrivial Boundary-Mediated Superconducting Transport in a TRSB Topological Iron-Based Superconductor. Phys. Rev. X 16, 041022(2026)", "title": "Nontrivial Boundary-Mediated Superconducting Transport in a TRSB Topological Iron-Based Superconductor", "authors": "Wenyao Liu, Gabriel Natale, Camron Farhang, Michael Geiwitz, Qishuo Tan, Xingyao Guo, Mason Gray, Vincent LambertiJazzmin Victorin, Huairuo Zhang, James L. Hart, Vsevolod Belosevich, Xi Ling, Qiong Ma, Wan Kyu Park, Kenji Watanabe, Takashi Taniguchi, Judy J. Cha, Albert V. Davydov, Kin Chung Fong, Ethan Arnault, Genda Gu, Rui-Xing Zhang, Enrico Rossi, Jing Xia, Kenneth S. Burch", "corresponding": "", "url": "https://arxiv.org/abs/2606.21507", "topic": "Superconductivity", "level": "Feature", "summary_en": "This study reports evidence for boundary-mediated superconducting transport in FeTe₀.₅₅Se₀.₄₅, where superconductivity, nontrivial band topology, and spontaneous time-reversal-symmetry breaking (TRSB) coexist. The transport signatures depend on composition, edge geometry, and the temperature scale associated with TRSB.", "summary": "The interplay of superconductivity, band topology, and spontaneous time-reversal-symmetry breaking (TRSB) is expected to enable topological superconducting boundary states. FeTe0.55Se0.45 provides a promising single-material platform because it combines superconductivity, nontrivial band topology, and spontaneous magnetization in the superconducting state. Here we report evidence for a boundary-me", "abstract": "The interplay of superconductivity, band topology, and spontaneous time-reversal-symmetry breaking (TRSB) is expected to enable topological superconducting boundary states. FeTe0.55Se0.45 provides a promising single-material platform because it combines superconductivity, nontrivial band topology, and spontaneous magnetization in the superconducting state. Here we report evidence for a boundary-mediated superconducting transport response in exfoliated Fe(Te,Se) devices. Polar Kerr measurements show that TRSB emerges below TKerr < Tc and coexists with superconductivity across multiple compositions, providing an independent symmetry-breaking scale for transport. Using crystallographically sharp, continuous edges and side-surface-dominant contacts, we find that topological FeTe0.55Se0.45 exhibits an anomalous conductance plateau absent in topologically trivial FeTe0.40Se0.60 and Fe1.02Te0.55Se0.45 under comparable measurements. This plateau requires uninterrupted sharp edges connecting source and drain, persists over micrometer-scale separations far exceeding the bulk coherence length, shows strongly suppressed thermal broadening, and collapses when the drain is moved to the top surface. Its temperature evolution follows the TRSB scale: the plateau remains weakly broadened below T*Kerr and disappears near TKerr rather than Tc. These doping-selective, edge-geometry-dependent, TRSB-correlated, and long-range nonlocal signatures establish experimental criteria for identifying boundary-mediated superconducting transport in FeTe0.55Se0.45 and motivate phase-sensitive and theoretical studies of its microscopic origin.", "method": "", "result": "", "future": "", "physics_advance": "In FeTe0.55Se0.45, an anomalous long-range, edge-mediated superconducting conductance plateau is associated with the TRSB temperature scale and absent in the compared topologically trivial compositions.", "ai_in_scope": true, "relevance_reason": "This experimental study probes superconducting transport and symmetry breaking in a condensed-matter material, reporting a distinctive edge-geometry-dependent response.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": true, "summary_zh": "本研究报告了 FeTe₀.₅₅Se₀.₄₅ 中边界介导超导输运的证据；该材料同时具有超导性、非平庸能带拓扑和自发时间反演对称性破缺（TRSB）。输运特征取决于材料组分、边缘几何以及与 TRSB 相关的温度尺度。", "method_en": "Polar Kerr measurements were used to identify the onset of TRSB across multiple compositions, and transport was measured in exfoliated devices with crystallographically sharp, continuous edges and side-surface-dominant contacts. Comparisons included topological FeTe₀.₅₅Se₀.₄₅ and two topologically trivial compositions, as well as changes in edge continuity, contact surface, separation, and temperature.", "method_zh": "研究通过极向克尔测量确定多个组分中 TRSB 的出现，并在具有晶体学上锋利且连续边缘、以侧表面接触为主的剥离器件中测量输运。比较对象包括拓扑非平庸的 FeTe₀.₅₅Se₀.₄₅ 和两种拓扑平庸组分，同时考察边缘连续性、接触表面、间距及温度的影响。", "result_en": "A conductance plateau is observed in topological FeTe₀.₅₅Se₀.₄₅ but not in the two topologically trivial compositions under comparable measurements. The plateau requires uninterrupted sharp edges connecting source and drain, persists over micrometer-scale separations well beyond the bulk coherence length, and is strongly broadened less by temperature than expected for ordinary bulk transport. It collapses when the drain contact is moved to the top surface, and its temperature evolution tracks the TRSB scale: it remains weakly broadened below T*Kerr and disappears near TKerr rather than Tc. Together, the composition selectivity, edge-geometry dependence, long-range nonlocality, and correlation with TRSB support boundary-mediated superconducting transport.", "result_zh": "在拓扑非平庸的 FeTe₀.₅₅Se₀.₄₅ 中观察到电导平台，而在相同测量条件下的两种拓扑平庸组分中未观察到该平台。平台要求源极与漏极之间存在不间断的锋利边缘；即使两者相距数微米、远超体相相干长度，平台仍可存在，且其热展宽受到显著抑制。将漏极移至顶表面后，平台会消失；其温度演化与 TRSB 温标相符：低于 T*Kerr 时仅略有展宽，并在接近 TKerr 而非 Tc 时消失。组分选择性、对边缘几何的依赖、长程非局域性及与 TRSB 的关联共同支持边界介导超导输运的解释。", "future_en": "The authors propose phase-sensitive measurements and theoretical studies to investigate the microscopic origin of the reported transport. The identified composition, geometry, nonlocality, and TRSB-related temperature dependence provide experimental criteria for further tests of boundary-mediated transport.", "future_zh": "作者提出开展相位敏感测量和理论研究，以探究所报告输运现象的微观起源。所识别的组分、几何、非局域性及与 TRSB 相关的温度依赖，为进一步检验边界介导输运提供了实验判据。"}, {"id": "arxiv-2605-26233", "arxiv_id": "2605.26233", "type": "arXiv", "journal": "arXiv:2605.26233", "journal_ref": "Phys. Rev. B 114, 194511 (2026)", "title": "Slave-boson Formalism for Superconducting Pairing at Strong Coupling", "authors": "Sarbajit Mazumdar, Jonas Issing, Jannis Seufert, David Riegler, Peter Wölfle, Ronny Thomale, Michael Klett", "corresponding": "", "url": "https://arxiv.org/abs/2605.26233", "topic": "Superconductivity", "level": "Brief", "summary_en": "This work develops a spin-rotation-invariant Kotliar–Ruckenstein slave-boson approach to superconducting pairing in the one-band Hubbard model at strong coupling.", "summary": "We study the emergence of superconductivity in the one-band Hubbard model using the spin-rotation-invariant Kotliar-Ruckenstein slave-boson (SB) approach. Motivated by its intrinsically renormalized mean-field ground state, we construct an effective pairing vertex from dynamical fluctuations about the saddle point. Solving the anisotropic, frequency-dependent gap equation on the square lattice, we", "abstract": "We study the emergence of superconductivity in the one-band Hubbard model using the spin-rotation-invariant Kotliar-Ruckenstein slave-boson (SB) approach. Motivated by its intrinsically renormalized mean-field ground state, we construct an effective pairing vertex from dynamical fluctuations about the saddle point. Solving the anisotropic, frequency-dependent gap equation on the square lattice, we map the pairing instabilities across doping, interaction, temperature and real-frequency gap structure that qualitatively match experimental cuprate observations. This framework merges strong-correlation SB-type renormalizations with RPA-type pairing transparency, providing a scalable route to modeling multi-orbital superconductivity at strong coupling.", "method": "", "result": "", "future": "", "physics_advance": "Constructs a dynamical pairing vertex from fluctuations around a spin-rotation-invariant slave-boson saddle point and maps superconducting instabilities across doping, interaction, and temperature.", "ai_in_scope": true, "relevance_reason": "This is a theoretical study of pairing in the Hubbard model, but its main advance is a modeling framework and broad instability mapping rather than a clearly isolated new material phenomenon.", "relevance_method": "semantic", "relevance_score": 67, "feature_candidate": false, "summary_zh": "这项工作发展了一种自旋旋转不变的 Kotliar–Ruckenstein slave-boson 方法，用于研究强耦合单带 Hubbard 模型中的超导配对。", "method_en": "The authors construct an effective pairing vertex from dynamical fluctuations around the slave-boson saddle point and solve an anisotropic, frequency-dependent gap equation on the square lattice.", "method_zh": "作者从 slave-boson 鞍点附近的动力学涨落构造有效配对顶角，并在正方晶格上求解各向异性、含频率依赖的能隙方程。", "result_en": "The resulting pairing instabilities across doping, interaction, temperature, and real-frequency gap structure qualitatively match experimental observations in cuprates, and the framework combines strong-correlation renormalization with RPA-like pairing transparency.", "result_zh": "所得配对不稳定性随掺杂、相互作用、温度和实频能隙结构的变化，在定性上与铜氧化物实验观察相符；该框架结合了强关联重整化与类似 RPA 的配对分析透明度。", "future_en": "The proposed framework could be tested against additional cuprate observables and extended to multi-orbital systems, which the authors identify as a potential application.", "future_zh": "可通过更多铜氧化物观测量检验该框架，并将其扩展至多轨道体系，这是作者指出的潜在应用方向。"}, {"id": "arxiv-2607-13294", "arxiv_id": "2607.13294", "type": "arXiv", "journal": "arXiv:2607.13294", "journal_ref": "Phys. Rev. Research 8, 043069 (2026)", "title": "Electronic properties and topological aspects of graphene nanohelicoids", "authors": "Xiaoqian Liu, Arsen Herasymchuk, Yaroslav Zhumagulov, Oleg V. Yazyev", "corresponding": "", "url": "https://arxiv.org/abs/2607.13294", "topic": "Topology & Transport", "level": "Brief", "summary_en": "This work introduces graphene nanohelicoids and studies how their width and edge orientation shape their electronic bands and one-dimensional topological indices.", "summary": "We introduce graphene nanohelicoids, geometric analogs of graphene nanoribbons, in which the honeycomb lattice is embedded on a helicoidal surface. Starting from the three-dimensional helical structure, we construct effective one-dimensional lattice models with band structures characterized by a momentum-shifted particle-hole relation $E_v(k)=-E_c(k+π)$ that reflects an antichiral symmetry arising", "abstract": "We introduce graphene nanohelicoids, geometric analogs of graphene nanoribbons, in which the honeycomb lattice is embedded on a helicoidal surface. Starting from the three-dimensional helical structure, we construct effective one-dimensional lattice models with band structures characterized by a momentum-shifted particle-hole relation $E_v(k)=-E_c(k+π)$ that reflects an antichiral symmetry arising from the nonsymmorphic symmetry. A systematic investigation of graphene nanohelicoids using the tight-binding approximation reveals a number of trends upon varying width and edge orientation, for instance, alternating transitions between semiconducting and metallic regimes. As the structure width varies, the band gap periodically closes and reopens, accompanied by an alternating Zak phase that switches between trivial and nontrivial. Using an analytic tight-binding model with a continuous deformation of the graphene nanohelicoids, we explain the origin of width- and termination-dependent band inversion and alternating Zak phase, and derive the relationship between the termination-resolved index and the sublattice symmetry operator in one-dimensional nonsymmorphic systems.", "method": "", "result": "", "future": "", "physics_advance": "The study predicts width-dependent gap closing and reopening with alternating Zak phases in graphene nanohelicoids, and relates termination-resolved topology to sublattice symmetry in one-dimensional nonsymmorphic systems.", "ai_in_scope": true, "relevance_reason": "This is original theoretical work on electronic bands and topology in a proposed graphene-based solid-state structure.", "relevance_method": "semantic", "relevance_score": 68, "feature_candidate": false, "summary_zh": "这项工作提出石墨烯纳米螺旋体，并研究其宽度和边缘取向如何影响电子能带与一维拓扑指标。", "method_en": "The authors construct effective one-dimensional models from helicoidal honeycomb lattices, analyze them using tight binding, and develop an analytic model with continuous deformation to explain band inversion and Zak-phase changes.", "method_zh": "作者从螺旋状蜂 well as resonant inelastic X-ray scattering of magnetic excitations in the new heavy-fermion van-der-Waals superconductor CeSiI. We determined effective Hamiltonians and ground states of crystal electric fields and magnons. Isotropic Heisenberg interactions on a quasi two dimensional lattice, including ferromagnetic nearest-neighbor exchange as the dominant interaction, provide an excellent account to the low-energy measured dynamics and stabilize a co-rotating spin cycloid. Our study provides the basis to model CeSiI from first principles, thereby laying the ground for microscopic understanding of heavy-fermion physics, their unconventional superconductivity, and quantum criticality.", "method": "", "result": "", "future": "", "feature_candidate": true, "summary_zh": "通过中子散射、X 射线吸收与共振非弹性 X 射线散射，研究解析了重费米子范德华超导体 CeSiI 的晶体电场能级和磁振子；以近似各向同性的海森堡交换描述低能激发，并得到同向旋转的自旋螺旋结构。", "review_method": "editorial_physics_scope", "method_en": "Neutron and X-ray absorption spectroscopy and resonant inelastic X-ray scattering; modeling with effective crystal-field and Heisenberg Hamiltonians.", "method_zh": "中子散射、X 射线吸收谱和共振非弹性 X 射线散射；建立晶体电场与海森堡交换的有效哈密顿量。", "result_en": "The measured low-energy magnetic dynamics are accounted for by quasi-2D isotropic Heisenberg exchange dominated by ferromagnetic nearest-neighbor coupling; the resulting model stabilizes a co-rotating spin cycloid.", "result_zh": "低能磁激发可以由准二维、近各向同性海森堡模型解释，其中最近邻铁磁交换占主导，并稳定同向旋转的自旋螺旋态。", "future_en": "Compare angular torque, heat capacity and field-dependent magnetic response against the extracted crystal-field and exchange model; examine how these energy scales interact with superconductivity.", "future_zh": "测量不同磁场和角度下的转矩、比热及磁响应，对照已提取的晶体电场与交换作用模型，并研究其与超导的关联。"}, {"id": "doi-10-1103-vlh4-qgrz", "doi": "10.1103/vlh4-qgrz", "type": "Journal", "journal": "PRX", "title": "Optical switching of two-dimensional charge-density-wave chirality", "authors": "Wayne Cheng-Wei Huang, Sai Mu, Gevin von Witte, Yanshuo Sophie Li, Felix Kurtz, Sheng-Hsiung Hung, Horng-Tay Jeng, Kai Rossnagel, Jan Gerrit Horstmann, Claus Ropers", "corresponding": "", "url": "https://doi.org/10.1103/vlh4-qgrz", "topic": "Other Condensed Matter", "level": "Feature", "summary_en": "Femtosecond optical quenching and electron diffraction reveal coexisting opposite CDW chiralities in the hidden state of 1T-TaS2. DFT predicts fractal moiré interfaces with kagome-like bands near the Fermi energy.", "summary": "Optical quenching reveals both CDW chiralities in the 1T-TaS2 hidden state and predicts electronic bands at heterochiral interfaces.", "abstract": "Tailored optical excitations can steer a system along non-equilibrium pathways into metastable states with distinct structural and electronic properties. The light-induced hidden state of 1T-TaS2, with its strongly enhanced conductivity and exceptionally long lifetime, represents a unique model system for studying ultrafast switching of correlated electronic states. Using surface-sensitive electron diffraction in combination with a femtosecond optical quench, we reveal the coexistence of both mirror-related two-dimensional charge-density-wave (CDW) chiralities as a structural characteristic of the hidden state. Density functional theory (DFT) simulations of interfaces between domains of opposite CDW chirality predict a higher-level, fractal-type moiré superstructure with a kagome band structure near the Fermi energy. More broadly, these findings identify heterochiral CDW interfaces as an additional structural degree of freedom, expanding the possibilities for engineering electronic properties through twist-angle control.", "method": "", "result": "", "future": "", "feature_candidate": true, "summary_zh": "利用飞秒光淬火与表面敏感电子衍射，研究在 1T-TaS₂ 隐藏态中发现镜像关联的两种二维 CDW 手性共存；DFT 预测异手性畴界产生分形式莫尔超结构及费米能附近的 kagome 能带。", "review_method": "editorial_physics_scope", "method_en": "Surface-sensitive electron diffraction following a femtosecond optical quench, together with DFT calculations of heterochiral CDW domain interfaces.", "method_zh": "飞秒光脉冲淬火后的表面敏感电子衍射，以及异手性 CDW 畴界的密度泛函理论计算。", "result_en": "The long-lived hidden state exhibits coexisting mirror-related two-dimensional CDW chiralities. Computed opposite-chirality interfaces produce a higher-order fractal moiré superstructure with kagome bands near EF.", "result_zh": "长寿命隐藏态具有镜像关联的两种二维 CDW 手性共存。相反手性畴界的计算结果给出更高阶分形莫尔结构及费米能附近的 kagome 能带。", "future_en": "Probe heterochiral interfaces with local tunneling spectroscopy and transport; test control of chirality/domain population by strain or optical-pulse parameters.", "future_zh": "使用局域隧穿谱和输运研究异手性畴界，检验应变与光脉冲参数对 CDW 手性和畴分布的调控。"}, {"id": "doi-10-1073-pnas-2623874123", "doi": "10.1073/pnas.2623874123", "type": "Journal", "journal": "PNAS", "title": "Deconfined criticality between an antiferromagnetic insulator and a nodal d -wave superconductor: A quantum Monte Carlo study", "authors": "Chuang Chen, Subir Sachdev, Zi Yang Meng", "corresponding": "", "url": "https://doi.org/10.1073/pnas.2623874123", "topic": "Superconductivity", "level": "Feature", "summary_en": "This quantum Monte Carlo study evidences a second-order deconfined quantum phase transition between antiferromagnetic insulator and nodal d-wave superconductor at half-filling on a square lattice.", "summary": "We present a quantum Monte Carlo study of the transition between the insulating Néel state and the nodal d -wave superconductor on the square lattice at half-filling. We access a regime of frustrated magnetic order without a sign problem using a parton representation of the electron in terms of fermionic spinons and bosonic chargons. Both partons move in a background π -flux (so the electron exper", "abstract": "We present a quantum Monte Carlo study of the transition between the insulating Néel state and the nodal d -wave superconductor on the square lattice at half-filling. We access a regime of frustrated magnetic order without a sign problem using a parton representation of the electron in terms of fermionic spinons and bosonic chargons. Both partons move in a background π -flux (so the electron experiences no net flux) and are coupled to a quantum fluctuating SU(2) lattice gauge field. In contrast to earlier studies directly on the electronic degrees of freedom, we find evidence for a second-order deconfined quantum phase transition at which both the Néel and d -wave superconductivity orders vanish continuously. We compute correlators of the spinon-chargon composite with the same quantum numbers as the electron: we find a gapless Dirac dispersion inside the d -wave superconductor, turning into a gapped dispersion in the antiferromagnet.", "method": "", "result": "", "future": "", "feature_candidate": true, "summary_zh": "本量子蒙特卡罗研究证实了方格子上半填充情况下，反铁磁绝缘体与点节d波超导体之间的二阶解禁闭量子相变。", "method_en": "Using a sign-problem-free parton approach with fermionic spinons and bosonic chargons coupled to a fluctuating SU(2) gauge field under π-flux backgrounds, the study accesses frustrated magnetic regimes.", "method_zh": "采用无符号问题的部分子表示法，费米旋子和玻色荷子耦合至π-flux背景下的动态SU(2)规范场，研究受挫磁序区。", "result_en": "Continuous vanishing of N\u0000eel and d-wave superconducting orders is observed, with electron composite correlators showing gapless Dirac dispersion in the superconductor and gapped dispersion in the antiferromagnet.", "result_zh": "发现N\u0000eel序和d波超导序连续消失，电子复合物相关函数在超导态表现为无隙狄拉克色散，而在反铁磁态为有隙色散。", "future_en": "This work provides a rare sign-problem-free microscopic model realization of deconfined criticality, opening pathways to numerical studies of intertwined orders and unconventional phase transitions.", "future_zh": "该研究为解禁闭临界性提供了罕见的无符号问题微观模型，促进了相互交织序和非常规相变的数值研究。", "review_method": "editorial_physics_scope"}, {"id": "doi-10-1073-pnas-2611564123", "doi": "10.1073/pnas.2611564123", "type": "Journal", "journal": "PNAS", "title": "High-resolution measurements of thermal conductivity matrix and search for thermal Hall effect in La 2 CuO 4", "authors": "Jiayi Hu, Haozhi Xu, Genda Gu, Qiang Li, N. P. Ong", "corresponding": "", "url": "https://doi.org/10.1073/pnas.2611564123", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Thermal conductivity matrix components \u0003xx and \u0003xy in La2CuO4 were measured between 2–20 K under magnetic fields up to 10 T, finding no resolvable thermal Hall effect with \u0003xy/T upper bound of 1x10–4 Wm–1K–2.", "summary": "We investigated the longitudinal thermal conductivity κ xx and thermal Hall conductivity κ xy in La 2 CuO 4 at temperatures T between 2 and 20 K in magnetic fields H up to 10 T. Within the temperature and field intervals studied, we do not resolve any thermal Hall signal with a conservative upper bound of | κ xy / T | &lt; 1 × 10 − 4 Wm − 1 K − 2 . The longitudinal thermal conductivity κ xx / T ag", "abstract": "We investigated the longitudinal thermal conductivity κ xx and thermal Hall conductivity κ xy in La 2 CuO 4 at temperatures T between 2 and 20 K in magnetic fields H up to 10 T. Within the temperature and field intervals studied, we do not resolve any thermal Hall signal with a conservative upper bound of | κ xy / T | &lt; 1 × 10 − 4 Wm − 1 K − 2 . The longitudinal thermal conductivity κ xx / T agrees well with previous reports, in both its magnitude and T dependence. Both κ xx and κ xy were measured using the field-swept protocol. To achieve high resolution, we carefully took into account relaxation effects after each step-increase in H . At low T , we find a weak linear decrease in κ xx / T vs. H , as well as weak hystereses near the metamagnetic transitions of the spins.", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "测量了La2CuO4在2–20 K及最高10 T磁场下的纵向热导率\u0003xx和热霍尔导率\u0003xy，未发现热霍尔效应，\u0003xy/T的上限为1x10–4 Wm–1K–2。", "method_en": "Used field-swept protocol with careful relaxation time considerations after incremental field increases to ensure high-resolution thermal conductivity measurements.", "method_zh": "采用场扫描协议，增场后充分考虑弛豫效应，确保高分辨率热导率测量。", "result_en": "Observed \u0003xx/T aligns with prior work; a weak linear decrease in \u0003xx/T with H and hysteresis near spin metamagnetic transitions were detected at low temperatures.", "result_zh": "\u0003xx/T结果与先前研究一致，低温下发现\u0003xx/T随磁场微弱线性下降及自旋亚稳态转变附近的迟滞现象。", "future_en": "These precise measurements constrain theories predicting thermal Hall effect in La2CuO4 and highlight the subtle interplay of magnetic transitions and heat transport.", "future_zh": "精确测量限制了La2CuO4中热霍尔效应的理论，突显了磁性转变与热传输间的微妙关系。", "review_method": "editorial_physics_scope"}, {"id": "doi-10-1103-cxsy-gshw", "doi": "10.1103/cxsy-gshw", "type": "Journal", "journal": "PRL", "title": "Directional Transport by Topological Pump of Localized Moiré Bulk States", "authors": "Dan Yao, Zhonghao Fu, Hailong He, Jiuyang Lu, Weiyin Deng, Liping Ye, Manzhu Ke, Zhengyou Liu", "corresponding": "", "url": "https://doi.org/10.1103/cxsy-gshw", "topic": "Topology & Transport", "level": "Brief", "summary_en": "No abstract available to summarize the directional transport via topological pumping of localized Moiré bulk states.", "summary": "Directional Transport by Topological Pump of Localized Moiré Bulk States", "abstract": "", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "无摘要，无法总结局域莫尔体体态的拓扑泵浦定向输运。", "review_method": "editorial_physics_scope"}, {"id": "doi-10-1103-8yyp-vx4t", "doi": "10.1103/8yyp-vx4t", "type": "Journal", "journal": "PRL", "title": "Electronic Transport in Hexagonal-Boron-Nitride-Encapsulated Graphene Limited by Remote Phonon Scattering", "authors": "K. Dinar, F. Macheda, A. Guandalini, M. Paillet, C. Consejo, F. Teppe, B. Jouault, T. Sohier, S. Nanot", "corresponding": "", "url": "https://doi.org/10.1103/8yyp-vx4t", "topic": "Topology & Transport", "level": "Brief", "summary_en": "No abstract provided for electronic transport in hexagonal-boron-nitride-encapsulated graphene limited by remote phonon scattering.", "summary": "Electronic Transport in Hexagonal-Boron-Nitride-Encapsulated Graphene Limited by Remote Phonon Scattering", "abstract": "", "method": "", "result": "", "future": "", "feature_candidate": false, "summary_zh": "无摘要，无法总结由远程声子散射限制的六方氮化硼封装石墨烯的电子输运。", "review_method": "editorial_physics_scope"}, {"id": "arxiv-2502-18933", "arxiv_id": "2502.18933", "type": "arXiv", "journal": "arXiv:2502.18933", "journal_ref": "(2025). Phys. Rev. B, 112, 024433", "title": "Antiferromagnetic resonance in $α$-MnTe", "authors": "J. Dzian, P. Kubaščík, S. Tázlarů, M. Białek, M. Šindler, F. Le Mardelé, C. Kadlec, F. Kadlec, M. Gryglas-Borysiewicz, K. P. Kluczyk, A. Mycielski, P. Skupiński, J. Hejtmánek, R. Tesař, J. Železný, A. -L. Barra, C. Faugeras, J. Volný, K. Uhlířová, L. Nádvorník, M. Veis, K. Výborný, M. Orlita", "corresponding": "", "url": "https://arxiv.org/abs/2502.18933", "topic": "Magnetism", "level": "Brief", "summary_en": "Using frequency- and time-domain THz spectroscopy, the authors observe an antiferromagnetic resonance magnon mode at 3.5 meV in bulk α-MnTe and estimate the out-of-plane single-ion magnetic anisotropy as (40 ± 10) μeV.", "summary": "Antiferromagnetic resonance in a bulk $α$-MnTe crystal is investigated using both frequency-domain and time-domain THz spectroscopy techniques. At low temperatures, an excitation at the photon energy of $(3.5\\pm 0.1)$~meV is observed and identified as a magnon mode through its distinctive dependence on temperature and magnetic field. This behavior is reproduced using a simplified model for antifer", "abstract": "Antiferromagnetic resonance in a bulk $α$-MnTe crystal is investigated using both frequency-domain and time-domain THz spectroscopy techniques. At low temperatures, an excitation at the photon energy of $(3.5\\pm 0.1)$~meV is observed and identified as a magnon mode through its distinctive dependence on temperature and magnetic field. This behavior is reproduced using a simplified model for antiferromagnetic resonance in an easy-plane antiferromagnet. T
