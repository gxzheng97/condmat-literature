 renormalization in structurally complex anharmonic materials Rb2SO4, Rb2Ca2(SO4)3, and Ba3Lu(BO3)3.", "summary": "Machine-learned potentials connect thermal expansion, heat transport and band-gap renormalization in strongly anharmonic sulfates and borates.", "abstract": "Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ are structurally complex materials whose thermal expansion has been interpreted, on the basis of high-temperature x-ray diffraction, in terms of specific polyhedral rearrangements. We study their lattice dynamics and its consequences for thermal and electronic properties using molecular dynamics with actively learned moment tensor potentials trained on density-functional theory data. The anharmonicity measure $σ^A$ (compares the anharmonic contribution to the interatomic forces with the total forces acting on atoms) reaches $\\approx$0.3-0.5 for $β$-Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ and $\\approx$0.75 for orientationally disordered $α$-Rb$_2$SO$_4$, and the imaginary harmonic modes of Rb$_2$Ca$_2$(SO$_4$)$_3$ and $α$-Rb$_2$SO$_4$ are stabilized at finite temperature. The simulations reproduce the measured thermal expansion and support the mechanisms proposed from diffraction: expansion along $c$ in $β$-Rb$_2$SO$_4$ arises from both elongation and straightening of corrugated Rb chains, BO$_3$ reorientation accompanies the anisotropic expansion of Ba$_3$Lu(BO$_3$)$_3$, and bending of polyhedral linkages limits expansion along the weakly expanding directions and in cubic Rb$_2$Ca$_2$(SO$_4$)$_3$. Green-Kubo lattice thermal conductivities differ by more than an order of magnitude between compounds with comparable $σ^A$, showing that the anharmonicity measure alone does not determine heat transport. Phonon-induced band-gap renormalization, including lattice thermal expansion, reaches 2.7 and 1.7 eV at 1250 K in Rb$_2$Ca$_2$(SO$_4$)$_3$ and Ba$_3$Lu(BO$_3$)$_3$ and 1.4 eV at 650 K in $β$-Rb$_2$SO$_4$, with zer lling thermal expansion, heat transport, and electronic band-gap renormalization in complex sulfate and borate crystals.", "ai_in_scope": true}, {"id": "arxiv-2610-30547", "arxiv_id": "2610.30547", "type": "arXiv", "journal": "arXiv:2610.30547", "journal_ref": "", "title": "Anisotropic thermoelectric transport in the Sr2RuO4-Ru eutectic system", "authors": "Takeru Ito, Shogo Yoshida, Hiroshi Yaguchi, Ryuji Okazaki", "corresponding": "Shogo Yoshida; Ryuji Okazaki", "url": "https://arxiv.org/abs/2610.30547", "topic": "Superconductivity", "level": "Brief", "summary_en": "Thermopower measured parallel and perpendicular to Ru lamellae in Sr2RuO4–Ru eutectics is anisotropic; local strain modeling captures its sign and approximate magnitude.", "summary": "Thermopower measured parallel and perpendicular to Ru lamellae in Sr2RuO4–Ru eutectics is anisotropic; local strain modeling captures its sign and approximate magnitude.", "abstract": "The Sr2RuO4-Ru eutectic system, in which metallic Ru inclusions are embedded in a Sr2RuO4 matrix, exhibits an enhanced superconducting onset temperature of about 3 K, known as the 3-K phase. Here we investigate the in-plane thermoelectric response of this eutectic system in the normal state and find a pronounced anisotropy in the thermopower for thermal gradients applied parallel and perpendicular to the Ru lamellae. To clarify its origin, we combine thermopower measurements with electronic-structure-based transport calculations and finite-element modeling of the local strain distribution generated by the thermal-expansion mismatch between Sr2RuO4 and Ru. The calculations show that uniaxial compression of Sr2RuO4 produces a sizable thermopower anisotropy through modification of the Fermi surfaces. When an idealized spatially inhomogeneous strain field around the Ru lamellae is included, the observed sign and qualitative magnitude of the anisotropy are reproduced more closely than in a simple unstrained two-component model. These results are consistent with a substantial contribution from strain-induced changes in the Sr2RuO4 electronic structure near the interfaces, although contributions from interfacial phase mixing and three-dimensional transport connectivity cannot be excluded.", "method": "", "result": "", "future": "", "summary_zh": "在 Sr₂RuO₄–Ru 共晶中测得相对 Ru 片层平行与垂直方向的热电势各向异性，局域应变模型解释其符号和量级。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "Careful Seebeck and strain-model comparison; its central interpretation is qualitative and based on one eutectic sample.", "tier_reason_zh": "Seebeck 与应变模拟结合较完整，但目前主要是单块共晶样品上的定性机制论证。", "method_en": "Floating-zone-grown Sr2RuO4–Ru eutectic with ~2% visible Ru lamellae; steady-state Seebeck measurements for heat gradients parallel/perpendicular to lamellae; DFT Boltzmann transport and finite-element strain maps.", "method_zh": "使用浮区法生长的 Sr₂RuO₄–Ru 共晶（表面 Ru 片层面积约 2%）；沿片层平行/垂直方向测稳态 Seebeck 系数，结合 DFT Boltzmann 输运和有限元局域应变模拟。", "result_en": "Fig. 1 compares Sxx and Syy of the eutectic with a pure Sr2RuO4 reference and establishes anisotropy tied to lamellar orientation. Figs. 2–3 examine uniaxial-strain-driven Fermi-surface changes and the spatial strain distribution near Ru. Fig. 4 shows that an unstrained two-component mixing model produces <1% anisotropy, while a finite-element strain-informed calculation gives the observed sign and a closer magnitude. The authors argue that thermopower is a sensitive normal-state probe of interfacial strain associated with the 3-K superconducting phase.", "result_zh": "Fig. 1 比较共晶沿 Ru 片层垂直和平行方向的 Sxx、Syy，并以纯 Sr₂RuO₄ 为参照；Figs. 2–3 研究单轴应变导致的费米面变化和 Ru 附近的空间应变分布；Fig. 4 表明简单无应变双组分混合模型只给出小于 1% 的各向异性，而纳入有限元应变后可重现实验符号并更接近量级。作者认为热电势是与 3-K 界面超导有关的局域应变的灵敏常态探针。", "future_en": "On strain-controlled Sr2RuO4, measure Sxx−Syy and elastocaloric response on the same crystal while tracking Tc and the van-Hove-sensitive thermopower; repeat with several eutectic lamellar orientations.", "future_zh": "可在同一块受控应变 Sr₂RuO₄ 样品上同时追踪 Sxx−Syy、弹热响应、  the leading response predicts a negative first minimum at $0.952T_{\\rm lib}$ with depth $-0.74$ times the independent-cell exchange coefficient. Isolated-pair simulations test this reference and resolve finite-coupling corrections. The chain reaches its first minimum on the same time scale, with a shallower minimum and a small later residual. Comparisons with chaotic cells and energy-conserving noise show regimes in which coherent return is absent or interrupted over the measured windows. These finite-time results provide a quantitative reference for separating the early exchange plateau from subsequent correlated dynamics.", "method": "", "result": "", "future": "", "summary_zh": "本研究在弱耦合四次振子链中发现谐振能量回返机制，影响早期Green–Kubo导热系数的平稳期，定量描述了谐振相邻对能量交换及相干回返。", "tier": "Uncertain", "tier_reason_en": "The paper provides quantitative theoretical and numerical insights into fundamental heat transport mechanisms, suitable for specialized physics journals pending broader impact validation.", "tier_reason_zh": "论文对基础热传输机制进行定量理论和数值研究，有助于专业物理期刊发表，视影响范围待定。", "relevance_score": 60, "relevance_method": "semantic", "relevance_reason": "Presents a detailed study of resonant energy exchange and coherent return in a classical quartic oscillator chain, elucidating microscopic mechanisms relevant to interpreting thermal transport in model nonlinear lattices.", "feature_candidate": false, "method_en": "The authors theoretically map the pair heat-current integral to a classical pendulum trapping response and validate predictions with isolated-pair simulations and comparisons to noisy and chaotic systems.", "method_zh": "作者将对偶热流积分映射至经典摆锁定响应，通过孤立对模拟及与噪声和混沌系统的比较验证理论预测。", "result_en": "Predicted negative minima of the heat-current integral appear at characteristic time scales without fitting parameters, matching simulations. Coherent energy return is shown to be absent or disrupted under certain conditions.", "result_zh": "热流积分的负极值出现在特征时间尺度上且无拟合参数，与模拟吻合。证明在特定条件下相干能量回返缺失或被打断。", "future_en": "Further studies could investigate how introducing controlled perturbations affects the coherent return and long-time conductivity behaviors experimentally or via simulation.", "future_zh": "后续研究可通过实验或模拟探讨受控扰动如何影响相干回返及长期导热行为。", "physics_advance": "Quantitative identification of resonant-pair coherent energy return phenomena affecting early-time thermal transport signatures in quartic oscillator chains.", "ai_in_scope": true}, {"id": "arxiv-2610-30665", "arxiv_id": "2610.30665", "type": "arXiv", "journal": "arXiv:2610.30665", "journal_ref": "", "title": "From phase analysis to phase tracking: a robust approach to atomic-scale strain mapping", "authors": "Ying Han, Yuan Tian", "corresponding": "", "url": "https://arxiv.org/abs/2610.30665", "topic": "Topology & Transport", "level": "Brief", "summary_en": "This paper introduces geometric phase tracking analysis (GPTA), an improved method for atomic-scale strain mapping that dynamically tracks Bragg reflections in real space, overcoming limitations of standard geometric phase analysis under large strain or grain misorientation.", "summary": "A Bragg-peak-tracking strain-mapping method reduces failure rates from 27% to 11.5% across 13,795 microscopy images.", "abstract": "Atomic-scale strain governs the electronic, ferroic and mechanical properties of materials, and atomic-resolution microscopy measures it most directly. Geometric phase analysis (GPA) is the standard tool, but it fails when a Bragg reflection moves outside its fixed Fourier aperture under large strain or rotation, or in misoriented grains. Here we introduce geometric phase tracking analysis (GPTA), whose Fourier aperture tracks the Bragg reflection at each pixel in real space. A narrow aperture can therefore reject noise without losing a displaced reflection. On 13,795 simulated and experimental atomic-resolution images under various imaging conditions, GPTA reduces GPA's failure rate from 27% to 11.5% with up to 335 times better accuracy. It also gives strain and dislocation maps across grains, resistance to dynamical-scattering extinction, and a confidence map, capabilities that GPA lacks. Tracking the aperture combines reciprocal-space dose efficiency with real-space spatial resolution and extends atomic-scale strain metrology to beam-sensitive materials and challenging imaging conditions.", "method": "", "result": "", "future": "", "summary_zh": "本文提出几何相位追踪分析（GPTA）方法，通过实时跟踪折射点，改进原子级应变映射，克服了标准几何相位分析在大应变和晶粒错位条件下的不足。", "tier": "Uncertain", "tier_reason_en": "This methodological advancement significantly improves strain mapping accuracy, with strong practical value for microscopy, but awaits widespread adoption to determine publication impact level.", "tier_reason_zh": "该方法改进显著提升应变映射精度，具备强大显微镜应用价值，但需进一步推广验证以确认发表影响层次。", "relevance_score": 55, "relevance_method": "semantic", "relevance_reason": "Develops a new robust phase-tracking technique for atomic-scale strain mapping overcoming limitations of geometric phase analysis, enabling more accurate strain measurements which impact understanding of strain-dependent materials physics.", "feature_candidate": false, "method_en": "GPTA uses a Fourier aperture that adaptively tracks Bragg reflections at each pixel, reducing noise and enabling strain and dislocation mapping even under challenging imaging conditions.", "method_zh": "GPTA采用自适应傅里叶孔径追踪每像素处的折射点，降低噪声并实现复杂成像条件下的应变和位错映射。", "result_en": "GPTA reduces GPA failure rates from 27% to 11.5%, improves accuracy by up to 335 times, and enables strain mapping across grains and in beam-sensitive materials with high confidence.", "result_zh": "GPTA将GPA失败率从27%降至11.5%，精度提升最多达335倍，实现了晶粒间和电子束敏感材料中的高置信度应变映射。", "future_en": "Future work might apply GPTA broadly in electron microscopy for real-time strain analysis in diverse material systems, and extend it to other types of scattering data.", "future_zh": "未来工作可将GPTA广泛应用于电子显微镜，实现多样材料体系的实时应变分析，并延展至其他散射数据类型。", "physics_advance": "Introduction of phase tracking microscopy algorithm enabling relia    const details=[p.published_journal?`<p><strong>${esc(t.actualJournal)}</strong> — ${p.published_doi?`<a href="${esc(p.published_doi)}" target="_blank" rel="noopener">${esc(p.published_journal)} ↗</a>`:esc(p.published_journal)}</p>`:'',p.tier?`<p><strong>${esc(t.estimated)}</strong> — ${esc(p.tier)}${reason?' · '+esc(reason):''}</p>`:'',method?`<p><strong>${esc(t.methods)}</strong> — ${esc(method)}</p>`:'',result?`<p><strong>${esc(t.findings)}</strong> — ${esc(result)}</p>`:'',future?`<p><strong>${esc(t.followup)}</strong> — ${esc(future)}</p>`:''].join('');
   return `${heading}<article class="paper" id="${esc(p.id)}"><div class="topline"><div class="label ${p.level==='Feature'?'feature':''}">${esc(displayTopic(p.topic))} · ${esc(p.level==='Feature'?t.feature:t.brief)}</div><span class="pub">${esc(p.journal)}${Number.isFinite(Number(p.relevance_score))&&p.relevance_score!==null?` · ${lang==="zh"?"科学评分":"Physics score"} ${esc(p.relevance_score)}/100`:""}</span></div><h3><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)} ↗</a></h3><div class="authors">${esc(p.authors)}${p.corresponding&&p.corresponding!=='—'?' · '+esc(t.corresponding)+': '+esc(p.corresponding):''}</div>${researchMeta?`<div class="authors">${esc(researchMeta)}</div>`:''}${summary?`<p class="abstract">${esc(summary)}</p>`:''}${details?`<button type="button" class="expand">${esc(t.read)}</button><div class="details" hidden>${details}<p><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(t.fullText)}</a></p></div>`:''}</article>`;
 }).join('')||`<div class="empty">${esc(t.empty)}</div>`;
 byId('papers').querySelectorAll('.expand').forEach(b=>b.addEventListener('click',()=>toggleNotes(b)));
}
byId('lang-en').addEventListener('click',()=>chooseLanguage('en'));
byId('lang-zh').addEventListener('click',()=>chooseLanguage('zh'));
byId('search').addEventListener('input',render);
render();
</script></body></html>
