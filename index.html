体中的适用范围，并进一步评估自旋轨道耦合表面态所发挥的作用。", "tier": "PRL", "tier_reason_en": "The abstract presents a symmetry-based route to zero-field nonreciprocal transport, supported by multiple magnetization and surface controls and a chemically ordered comparison; the proposed broader applicability is significant, although the evidence described remains focused on one material family.", "tier_reason_zh": "摘要提出了基于对称性的零场非互易输运途径，并以多种磁化与表面控制以及化学有序对照提供支持；其潜在普适性具有重要意义，但所述证据仍集中于一个材料家族。"}, {"id": "arxiv-2610-35353", "arxiv_id": "2610.35353", "type": "arXiv", "journal": "arXiv:2610.35353", "journal_ref": "Nature Communications 17, 10841 (2026)", "journal_doi": "10.1038/s41467-026-77571-4", "title": "Direct observation of a spin-polarized surface Dirac gap in the antiferromagnetic topological insulator NdBi", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-26T12:45:59Z", "updated_at": "2026-10-26T12:45:59Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Yuto Fukushima, Hiroyuki S. Suzuki, Masayuki Ochi, Takuma Nishida, Toshiya Ikenobe, Hiraku Saito, Yuto Kinoshita, Kaishu Kawaguchi, Hiroaki Tanaka, Ayumi Harasawa, Takushi Iimori, Koichiro Yaji, Masashi Tokunaga, Taro Nakajima, Kiyohisa Tanaka, Takahiro Morimoto, Ryo Mori, Takeshi Kondo", "corresponding": "", "url": "https://arxiv.org/abs/2610.35353v1", "topic": "Magnetism", "level": "Feature", "summary_en": "This study reports a spin-polarized surface Dirac cone in the antiferromagnetic topological insulator NdBi with a 17 meV gap at the Dirac point. Temperature and surface-contamination measurements link the gap to surface magnetic order.", "summary": "A gapped Dirac cone in antiferromagnetic topological insulators (AFM-TIs) is essential for realizing the quantized anomalous Hall effect, yet its intrinsic magnitude remains controversial. In the prototypical AFM-TI MnBi2Te4, however, the observed Dirac gap is significantly smaller than theoretical predictions or nearly absent, highlighting a long-standing discrepancy. Here we demonstrate that NdB", "abstract": "A gapped Dirac cone in antiferromagnetic topological insulators (AFM-TIs) is essential for realizing the quantized anomalous Hall effect, yet its intrinsic magnitude remains controversial. In the prototypical AFM-TI MnBi2Te4, however, the observed Dirac gap is significantly smaller than theoretical predictions or nearly absent, highlighting a long-standing discrepancy. Here we demonstrate that NdBi hosts a spin-polarized topological surface Dirac cone with a sizable gap of 17 meV at the Dirac point, in excellent agreement with density functional theory predictions (12 meV). This direct observation is enabled by high-resolution 7 eV laser-based spin- and angle-resolved photoemission spectroscopy, which unambiguously disentangles the spin-polarized surface Dirac cone from bulk-derived states. Furthermore, through temperature dependence and controlled surface contamination, we establish a direct linkage between surface magnetism and the Dirac gap, demonstrating that the gap opens only in the presence of surface magnetic order. These results provide definitive spectroscopic evidence for an intrinsic Dirac gap in AFM-TIs and establish NdBi as a model platform to resolve the long-standing discrepancy between experiment and theory in AFM-TIs.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "NdBi has a spin-polarized surface Dirac cone with a 17 meV gap, and temperature and surface-contamination measurements link the gap to surface magnetic order.", "ai_in_scope": true, "relevance_reason": "This spectroscopy study establishes a magnetic topological surface-state phenomenon in an antiferromagnetic material, directly addressing a key condensed-matter question.", "relevance_method": "semantic", "relevance_score": 83, "feature_candidate": true, "summary_zh": "本研究报告了反铁磁拓扑绝缘体 NdBi 中自旋极化的表面狄拉克锥，其狄拉克点处能隙为 17 meV。温度依赖和表面污染实验将该能隙与表面磁有序联系起来。", "method_en": "The authors use high-resolution 7 eV laser-based spin- and angle-resolved photoemission spectroscopy to separate the surface Dirac cone from bulk-derived states. They also examine temperature dependence and controlled surface contamination.", "method_zh": "作者采用高分辨率 7 eV 激光自旋分辨角分辨光电子能谱，将表面狄拉克锥与体态区分开来。他们还测量了温度依赖性，并对表面污染进行控制。", "result_en": "The measurements resolve a spin-polarized topological surface Dirac cone with a 17 meV gap, in agreement with the 12 meV density-functional-theory prediction. The temperature and contamination dependence show that the gap opens only when surface magnetic order is present. This provides spectroscopic evidence for an intrinsic Dirac gap in an antiferromagnetic topological insulator. The authors propose NdBi as a platform for addressing the discrepancy between theoretical predictions and measurements in MnBi2Te4.", "result_zh": "测量分辨出自旋极化的拓扑表面狄拉克锥，其能隙为 17 meV，与密度泛函理论预测的 12 meV 相符。温度和表面污染依赖性表明，只有存在表面磁有序时能隙才会打开。这为反铁磁拓扑绝缘体中的本征狄拉克能隙提供了光谱证据。作者提出 NdBi 可用于研究 MnBi2Te4 中理论预测与实验测量之间的差异。", "future_en": "Further measurements could quantify how the Dirac gap varies with surface magnetic order and test whether this relationship persists under different surface preparations. Applying comparable spin-resolved spectroscopy to other antiferromagnetic topological insulators could assess how broadly the NdBi result generalizes.", "future_zh": "后续测量可定量研究狄拉克能隙随表面磁有序的变化，并检验这种关系在不同表面制备条件下是否仍成立。对其他反铁磁拓扑绝缘体开展类似的自旋分辨光谱测量，可评估 NdBi 结果的普适性。"}, {"id": "arxiv-2610-33585", "arxiv_id": "2610.33585", "type": "arXiv", "journal": "arXiv:2610.33585", "journal_ref": "", "journal_doi": "", "title": "Exact Magnetic Confinement of a Doped Hole by Kinetic Frustration", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.str-el"], "submitted_at": "2026-10-24T10:27:10Z", "updated_at": "2026-10-24T10:27:10Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Nikolai Peshcherenko, Yixin Zhang, Cristian D. Batista, Yang Zhang", "corresponding": "", "url": "https://arxiv.org/abs/2610.33585v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The authors establish an exact kinetic-frustration mechanism that confines a doped hole in a finite, open sawtooth Hubbard chain. A magnetic field controls the size of the singlet region in which the hole is localized, without requiring disorder or an exchange-generated string tension.", "summary": "We establish an exact mechanism of magnetic confinement driven purely by kinetic frustration. In a finite open sawtooth $U=\\infty$ Hubbard chain of $L$ unit cells doped with one hole, the ground state at magnetization $M$ contains $M$ polarized triplet dimers surrounding a connected singlet region of length $\\ell_{\\rm s}=L-M$. A magnetic field selects $M$ and hence the confinement length. The hole", "abstract": "We establish an exact mechanism of magnetic confinement driven purely by kinetic frustration. In a finite open sawtooth $U=\\infty$ Hubbard chain of $L$ unit cells doped with one hole, the ground state at magnetization $M$ contains $M$ polarized triplet dimers surrounding a connected singlet region of length $\\ell_{\\rm s}=L-M$. A magnetic field selects $M$ and hence the confinement length. The hole forms a standing wave in the singlet region with exponential tails in the triplet background. Confinement requires neither disorder nor an exchange-generated string tension: destructive interference between direct and apex-mediated hopping makes the triplet bonds reflecting. At $t_2/t_1=[2+4\\cos(π/(\\ell_{\\rm s}+2))]^{-1/2}$, they become perfectly reflecting, producing a position-degenerate compact localized state. At every fixed field $0<h<h_{\\rm sat}$, the singlet region remains finite as $L\\to\\infty$ and shrinks stepwise with increasing field, whereas at $h=0$ it spans the system.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Kinetic interference alone can make triplet bonds perfectly reflecting and confine a doped hole to a finite singlet region, whose size changes stepwise with magnetic field.", "ai_in_scope": true, "relevance_reason": "This is a substantive theoretical result in correlated-electron and magnetic physics, identifying an exact field-tunable confinement mechanism in a Hubbard chain.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": false, "summary_zh": "作者在有限开放的锯齿形 Hubbard 链中建立了一种由运动学受挫导致掺杂空穴受限的精确机制。磁场控制空穴所在单态区域的大小，而该机制不需要无序或由交换作用产生的弦张力。", "method_en": "The study analyzes the one-hole ground state of an infinite-\u001bU\u001b Hubbard chain with open boundaries, resolving its dependence on magnetization, field, and hopping amplitudes.", "method_zh": "研究分析具有开放边界的无限-\u001bU\u001b Hubbard 链的单空穴基态，并考察其对磁化、磁场及跃迁振幅的依赖。", "result_en": "At magnetization M, the ground state contains M polarized triplet dimers surrounding a connected singlet region of length ℓₛ = L − M, where the hole forms a standing wave with exponential tails in the triplet background. Destructive interference between direct and apex-mediated hopping makes triplet bonds reflecting, so confinement does not require disorder or an exchange-generated string tension. At t₂/t₁ = [2 + 4 cos(π/(ℓₛ + 2))]⁻¹ᐟ², the bonds are perfectly reflecting and yield a position-degenerate compact localized state. For every fixed field 0 < h < hₛₐₜ, the singlet region remains finite as L → ∞ and shrinks stepwise with increasing field; at h = 0, it spans the system.", "result_zh": "磁化为 M 时，基态由 M 个极化三重态二聚体包围一个长度为 ℓₛ = L − M 的连通单态区域；空穴在该区域形成驻波，并在三重态背景中呈指数衰减尾部。直接跃迁与经顶点介导的跃迁发生相消干涉，使三重态键成为反射边界，因此无需无序或交换作用产生的弦张力即可实现束缚。当 t₂/t₁ = [2 + 4 cos(π/(ℓₛ + 2))]⁻¹ᐟ² 时，这些键完全反射，产生位置简并的紧致局域态。对任意固定的 0 < h < hₛₐₜ，L → ∞ 时单态区域仍保持有限，并随磁场增强而阶梯式缩小；在 h = 0 时，该区域则贯穿整个系统。", "future_en": "A natural next step is to investigate whether the exact confinement mechanism persists under changes to the chain parameters or extensions beyond the one-hole setting.", "future_zh": "后续可研究在改变链参数或扩展至单空穴情形之外时，这一精确束缚机制是否仍然成立。", "tier": "PRL", "tier_reason_en": "The abstract reports an exact, field-tunable confinement mechanism with a specific perfect-reflection condition and thermodynamic-limit behavior, giving the result conceptual significance beyond a numerical observation in one finite system.", "tier_reason_zh": "摘要报告了一种精确且可由磁场调控的束缚机制，给出了特定的完全反射条件及热力学极限行为，因此其概念意义超出单个有限系统中的数值观察。"}, {"id": "arxiv-2610-35238", "arxiv_id": "2610.35238", "type": "arXiv", "journal": "arXiv:2610.35238", "journal_ref": "", "journal_doi": "", "title": "Flexural Altermagnetism", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mes-hall", "cond-mat.mtrl-sci"], "submitted_at": "2026-10-26T11:22:33Z", "updated_at": "2026-10-26T11:22:33Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Songbo Li, Jinxiong Jia, Zeyu Li, Xudong Zhu, Jiaqi An, Feitong Chu, Songbo Zhang, Wenguang Zhu, Hualing Zeng, Zhenhua Qiao", "corresponding": "", "url": "https://arxiv.org/abs/2610.35238v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper proposes flexural deformation as a way to engineer distinct forms of altermagnetism and control spin splitting in two-dimensional collinear antiferromagnets.", "summary": "We establish flexural deformation as a versatile route for engineering altermagnetism in two-dimensional collinear antiferromagnets. By tailoring the flexure, we selectively break different symmetries to realize altermagnetic states with distinct wave symmetries and reverse their spin splitting. A tight-binding model and first-principles calculations for monolayer MnPS3 demonstrate d- and i-wave s", "abstract": "We establish flexural deformation as a versatile route for engineering altermagnetism in two-dimensional collinear antiferromagnets. By tailoring the flexure, we selectively break different symmetries to realize altermagnetic states with distinct wave symmetries and reverse their spin splitting. A tight-binding model and first-principles calculations for monolayer MnPS3 demonstrate d- and i-wave states and a switchable transverse spin current in the d-wave state.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Flexural deformation can select distinct d- and i-wave altermagnetic states and reverse spin splitting in monolayer MnPS3, with a switchable transverse spin current predicted for the d-wave state.", "ai_in_scope": true, "relevance_reason": "The work predicts symmetry-controlled altermagnetic states in a specific two-dimensional antiferromagnet, a direct contribution to quantum magnetism and low-dimensional materials physics.", "relevance_method": "semantic", "relevance_score": 73, "feature_candidate": false, "summary_zh": "本文提出利用弯曲变形，在二维共线反铁磁体中设计不同形式的交错磁性并调控自旋劈裂。", "method_en": "The authors use a tight-binding model and first-principles calculations for monolayer MnPS₃ to examine the symmetry changes induced by tailored flexure.", "method_zh": "作者结合紧束缚模型与单层 MnPS₃ 的第一性原理计算，研究定制弯曲所引起的对称性变化。", "result_en": "Tailored flexure can produce d- and i-wave altermagnetic states and reverse their spin splitting; the d-wave state also exhibits a switchable transverse spin current.", "result_zh": "定制弯曲可产生 d 波和 i 波交错磁态并反转其自旋劈裂；d 波态还表现出可切换的横向自旋流。", "future_en": "The abstract does not specify a future research direction.", "future_zh": "摘要未说明具体的未来研究方向。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work combines a clear symmetry-engineering proposal with model and first-principles support, while the abstract describes a focused materials-theory result without quantitative experimental validation.", "tier_reason_zh": "该工作提出了明确的对称性工程方案，并提供模型与第一性原理支持；不过摘要所述主要是范围较集中的材料理论结果，未包含定量实验验证。"}, {"id": "arxiv-2610-35614", "arxiv_id": "2610.35614", "type": "arXiv", "journal": "arXiv:2610.35614", "journal_ref": "", "journal_doi": "", "title": "Giant third-order nonlinearity amplifies second-harmonic transport in Ca3Ru2O7", "arxiv_version": 1, "primary_category": "cond-mat.other", "categories": ["cond-mat.other"], "submitted_at": "2026-10-26T15:32:53Z", "updated_at": "2026-10-26T15:32:53Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Subin Mali, Yufei Zhao, Yu Wang, Binghai Yan, Zhiqiang Mao", "corresponding": "", "url": "https://arxiv.org/abs/2610.35614v1", "topic": "Magnetism", "level": "Brief", "summary_en": "This study reports electrically tunable second-harmonic transport in the correlated polar metal Ca3Ru2O7, amplified by a dc bias acting on a strong third-order nonlinearity. The response appears below the spin-reorientation transition near 48 K.", "summary": "Nonlinear electrical transport enables the conversion and detection of electromagnetic signals, supporting wireless energy harvesting, sensing and frequency conversion. Achieving both a large response and electrical tunability remains a central materials challenge. Here we harness giant third-order nonlinearity to amplify and electrically control second-harmonic transport in the correlated polar m", "abstract": "Nonlinear electrical transport enables the conversion and detection of electromagnetic signals, supporting wireless energy harvesting, sensing and frequency conversion. Achieving both a large response and electrical tunability remains a central materials challenge. Here we harness giant third-order nonlinearity to amplify and electrically control second-harmonic transport in the correlated polar metal Ca3Ru2O7. Superposing a dc bias on an ac excitation enhances the second-harmonic signal by more than an order of magnitude. The bias controls the polarity of the induced response and activates channels forbidden by symmetry at zero bias. Both transverse and longitudinal components scale quadratically with the ac excitation and are odd in the dc bias, with angular dependences consistent with third-order conductivity. The underlying third-harmonic electric-field responsivity reaches 4.5 \\times 10-6 m2V-2 at 3 K, providing a quantitative measure of the strong nonlinearity. The induced response emerges below the spin-reorientation transition near 48 K, linking its enhancement to the reconstructed low-temperature electronic state. Theoretical calculations identify quantum-geometric contributions to the nonlinear conductivity and reproduce the observed response symmetry. These results demonstrate how strong higher-order nonlinearity can amplify an effective second-order response, providing a route to electrically tunable nonlinear transport in correlated materials.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "A dc bias amplifies and reverses the second-harmonic transport response in Ca3Ru2O7 by activating third-order conductivity channels; the effect appears below the spin-reorientation transition and has symmetry consistent with quantum-geometric contributions.", "ai_in_scope": true, "relevance_reason": "The experiment and supporting theory reveal nonlinear transport tied to the low-temperature electronic state of a correlated polar metal, making this a substantial condensed-matter result rather than a performance-only device study.", "relevance_method": "semantic", "relevance_score": 80, "feature_candidate": false, "summary_zh": "该研究报道了关联极性金属 Ca3Ru2O7 中由直流偏置作用于强三阶非线性而放大的、可电控二次谐波输运。该响应在约 48 K 的自旋重取向转变以下出现。", "method_en": "The authors measured transverse and longitudinal second-harmonic transport under superposed ac excitation and dc bias, examining its bias, excitation, temperature, and angular dependences. They compared the observed response symmetry with theoretical calculations of nonlinear conductivity.", "method_zh": "作者在交流激励与直流偏置叠加条件下测量横向和纵向二次谐波输运，并考察其偏置、激励、温度及角度依赖性。随后将观测到的响应对称性与非线性电导理论计算进行比较。", "result_en": "A dc bias enhances the second-harmonic signal by more than an order of magnitude, controls its polarity, and activates channels forbidden by symmetry at zero bias. Both measured components scale quadratically with ac excitation and are odd in dc bias, consistent with third-order conductivity; the third-harmonic electric-field responsivity reaches 4.5 × 10⁻⁶ m² V⁻² at 3 K. The response emerges below approximately 48 K, and calculations identify quantum-geometric contributions and reproduce its symmetry.", "result_zh": "直流偏置使二次谐波信号增强一个数量级以上、控制其极性，并激活零偏置时受对称性禁止的响应通道。两个测量分量均随交流激励呈二次标度、随直流偏置为奇函数，符合三阶电导特征；3 K 时三次谐波电场响应度达到 4.5 × 10⁻⁶ m² V⁻²。该响应在约 48 K 以下出现，理论计算指出量子几何贡献并再现其对称性。", "future_en": "A useful follow-up would be to map the bias- and temperature-dependent response across the spin-reorientation transition and test the predicted quantum-geometric contribution.", "future_zh": "后续可系统测绘跨越自旋重取向转变时响应随偏置和温度的变化，并检验理论预测的量子几何贡献。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work combines a substantial, electrically tunable nonlinear-transport effect with symmetry analysis and theoretical interpretation, making it a strong specialist condensed-matter result; the abstract alone does not establish the broader reach or depth expected for a higher tier.", "tier_reason_zh": "该工作将显著的可电控非线性输运效应与对称性分析和理论解释结合，是一项有力的凝聚态专业研究；仅凭摘要尚不足以证明其具有更高层级期刊所需的广泛影响或研究深度。"}, {"id": "arxiv-2610-34596", "arxiv_id": "2610.34596", "type": "arXiv", "journal": "arXiv:2610.34596", "journal_ref": "", "journal_doi": "", "title": "Non-magnetic impurities as a quantum microscope of finite size effects in spin chains", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-25T21:52:55Z", "updated_at": "2026-10-25T21:52:55Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Quentin Faure, Shintaro Takayoshi, Virginie Simonet, Béatrice Grenier, Stéphane Raymond, Eric Ressouche, Xavier Fabrèges, Pascal Lejay, Thierry Giamarchi, Sylvain Petit", "corresponding": "", "url": "https://arxiv.org/abs/2610.34596v1", "topic": "Magnetism", "level": "Brief", "summary_en": "This work investigates finite-size quantum excitations in Mg-substituted Ba(Co1−xMgx)2V2O8, where nonmagnetic impurities divide Ising-like spin chains into finite segments. It identifies boundary-confined spinons and a collective Néel-segment reversal mode in shorter chains.", "summary": "Finite-size effects are ubiquitous in quantum matter, yet typically invisible in the thermodynamic limit; when system size is restricted, boundaries and confinement reveal modified spectra, correlations, and emergent phenomena. With growing access to well-controlled few-spin systems, these effects are now directly observable and offer a route to probing universal physics and enabling quantum infor", "abstract": "Finite-size effects are ubiquitous in quantum matter, yet typically invisible in the thermodynamic limit; when system size is restricted, boundaries and confinement reveal modified spectra, correlations, and emergent phenomena. With growing access to well-controlled few-spin systems, these effects are now directly observable and offer a route to probing universal physics and enabling quantum information applications. Here, we study finite-size physics in the quasi-one-dimensional Ising-like quantum antiferromagnet Ba(Co$_{1-x}$Mg$_x$)$_2$V$_2$O$_8$ with $x = 2\\%$ and $x = 5\\%$, where non-magnetic Mg$^{2+}$ ions fragment the Co$^{2+}$ spin chains into finite segments. Combining inelastic neutron scattering and numerical calculations, we identify distinct regimes with fundamentally different low-energy quantum excitations: spinons confined to chain boundaries, and a cluster mode in shorter chains corresponding to a collective reversal of the Néel-ordered segment without classical analogue. Our results demonstrate how chemical substitution acts as a quantum microscope providing direct access to boundary-shaped excitations in strongly correlated spin systems.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "Non-magnetic impurities fragment the spin chains into segments with boundary-confined spinons and a distinct cluster mode corresponding to collective reversal of a short Néel-ordered segment.", "ai_in_scope": true, "relevance_reason": "Neutron scattering and numerical calculations reveal finite-size excitations in a strongly correlated quantum antiferromagnet.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": false, "summary_zh": "该研究考察 Mg 取代的 Ba(Co1−xMgx)2V2O8 中的有限尺寸量子激发，其中非磁性杂质将类 Ising 自旋链分割为有限链段。研究识别出受限于链边界的自旋子，以及较短链段中的集体 Néel 链段反转模。", "method_en": "The authors combined inelastic neutron scattering on samples with x = 2% and 5% with numerical calculations. They used impurity-induced chain segmentation to examine excitations associated with different finite chain lengths.", "method_zh": "作者对 x = 2% 和 5% 的样品进行非弹性中子散射，并结合数值计算。他们利用杂质诱导的链分割，考察不同有限链长所对应的激发。", "result_en": "The study identifies distinct low-energy regimes featuring spinons confined to chain boundaries and, in shorter chains, a cluster mode corresponding to collective reversal of the Néel-ordered segment. The latter is described as having no classical analogue.", "result_zh": "研究识别出不同的低能区间：其中包括受限于链边界的自旋子，以及较短链段中对应于 Néel 有序链段集体反转的团簇模。作者指出，后一激发没有经典对应物。", "future_en": "A useful next step would be to investigate how the observed excitation regimes evolve with impurity concentration and the resulting distribution of chain lengths.", "future_zh": "后续可研究所观测到的激发区间如何随杂质浓度及其造成的链长分布而演变。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The combination of neutron scattering and calculations reveals distinctive boundary and cluster excitations in a quantum magnet, a solid specialist result; the abstract does not indicate a broader conceptual advance sufficient to justify a higher tier.", "tier_reason_zh": "中子散射与计算相结合，揭示了量子磁体中独特的边界激发和团簇激发，属于扎实的专业研究；摘要未显示足以支持更高层级的广泛概念性突破。"}, {"id": "arxiv-2610-34536", "arxiv_id": "2610.34536", "type": "arXiv", "journal": "arXiv:2610.34536", "journal_ref": "", "journal_doi": "", "title": "Quasiparticle Interactions in the $S = 1/2$ Heisenberg Antiferromagnetic Chain CuPzN", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.str-el"], "submitted_at": "2026-10-25T19:55:19Z", "updated_at": "2026-10-25T19:55:19Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Leshan Zhao, Timothy Reeder, Matthew Stone, Daniel G. Mazzone, Jakob Lass, Christof Niedermayer, Daniel H. Reich, Anna Keselman, Oleg A. Starykh, Collin Broholm", "corresponding": "", "url": "https://arxiv.org/abs/2610.34536v1", "topic": "Magnetism", "level": "Brief", "summary_en": "This study uses the field-dependent excitation spectrum of the quasi-one-dimensional Heisenberg antiferromagnet CuPzN to probe spinon–spinon interactions. The field-induced gap between the uniform magnetization precession mode and the shifted spinon continuum provides a measure of spinon backscattering.", "summary": "We investigate spinon--spinon interactions in the quasi-one-dimensional $S=1/2$ Heisenberg antiferromagnet Cu(C$_4$H$_4$N$_2$)(NO$_3$)$_2$ (CuPzN) using inelastic neutron scattering. At zero field, the spectrum exhibits the canonical multi-spinon continuum of the Heisenberg chain. With increasing field we demonstrate the appearance of an energy gap $2Δ$ towards momentum $q\\rightarrow 0$ between th", "abstract": "We investigate spinon--spinon interactions in the quasi-one-dimensional $S=1/2$ Heisenberg antiferromagnet Cu(C$_4$H$_4$N$_2$)(NO$_3$)$_2$ (CuPzN) using inelastic neutron scattering. At zero field, the spectrum exhibits the canonical multi-spinon continuum of the Heisenberg chain. With increasing field we demonstrate the appearance of an energy gap $2Δ$ towards momentum $q\\rightarrow 0$ between the uniform magnetization precession mode and the shifted spinon continuum. $2Δ$ is a direct measure of spinon backscattering interactions. Comparison with numerical matrix-product-state calculations and a recent analytical theory shows excellent agreement. By examining the integrable spin-1/2 chain, we provide an example of how quasiparticle interactions can be quantified experimentally in isotropic quantum spin systems.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "In CuPzN under magnetic field, a gap opens between the uniform magnetization precession mode and the shifted spinon continuum as momentum approaches zero; its size directly measures spinon backscattering interactions.", "ai_in_scope": true, "relevance_reason": "Neutron-scattering measurements and theory establish a measurable spinon-interaction signature in a quantum antiferromagnetic chain.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "该研究利用准一维海森堡反铁磁体 CuPzN 的磁场依赖激发谱探测自旋子之间的相互作用。均匀磁化进动模与移动后的自旋子连续谱之间由磁场诱导的能隙，可用于量化自旋子反向散射。", "method_en": "The authors performed inelastic neutron scattering on CuPzN while varying the magnetic field, and compared the spectra with numerical matrix-product-state calculations and analytical theory. They also examined the integrable spin-1/2 chain as a setting for quantifying quasiparticle interactions.", "method_zh": "作者对 CuPzN 进行变磁场非弹性中子散射，并将所得谱与矩阵乘积态数值计算及解析理论进行比较。他们还考察了可积的自旋 1/2 链，以展示量化准粒子相互作用的方法。", "result_en": "At zero field, the measured spectrum shows the canonical multi-spinon continuum; increasing field produces a gap 2Δ toward q → 0 between the uniform magnetization precession mode and the shifted spinon continuum. The authors identify 2Δ as a direct measure of spinon backscattering, and report excellent agreement with the numerical and analytical comparisons.", "result_zh": "零场下，测得的谱呈现典型的多自旋子连续谱；随磁场增强，在 q → 0 方向，均匀磁化进动模与移动后的自旋子连续谱之间出现能隙 2Δ。作者将 2Δ 识别为自旋子反向散射的直接量度，并报告其与数值及解析结果高度吻合。", "future_en": "A natural follow-up would be to test whether the gap-based measure of spinon interactions applies across additional field regimes or other isotropic quantum spin chains.", "future_zh": "自然的后续研究方向是检验基于能隙的自旋子相互作用量度是否适用于其他磁场区间或其他各向同性量子自旋链。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The study offers a direct experimental measure of quasiparticle interactions supported by numerical and analytical agreement, but the abstract describes a focused result in a well-characterized one-dimensional model system.", "tier_reason_zh": "该研究提供了准粒子相互作用的直接实验量度，并得到数值和解析结果支持；但摘要所述成果聚焦于一个已充分研究的一维模型体系。"}, {"id": "arxiv-2610-34586", "arxiv_id": "2610.34586", "type": "arXiv", "journal": "arXiv:2610.34586", "journal_ref": "", "journal_doi": "", "title": "Spontaneous magnetic diode effect in Co$_{1/3}$TaS$_2$", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mes-hall", "cond-mat.mtrl-sci", "cond-mat.str-el"], "submitted_at": "2026-10-25T21:31:14Z", "updated_at": "2026-10-25T21:31:14Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Yining Hu, Taikang Chen, Jan Priessnitz, Zili Feng, Takashi Kurumaji, Linda Ye, Libor Šmejkal, Chunyu Mark Guo, Philip J. W. Moll", "corresponding": "", "url": "https://arxiv.org/abs/2610.34586v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The study reports a spontaneous nonreciprocal resistance in the triangular-lattice antiferromagnet Co1/3TaS2. Reversing the magnetic handedness reverses the diode polarity, which the authors attribute to noncoplanar spin order interacting with spin-orbit coupling.", "summary": "When electrons move through non-trivial spin textures in magnetic metals, conduction electrons couple to magnetic order through both their charge and their spin, acquiring non-trivial equations of motion and a dynamic spin polarization providing the foundation of spintronics. These mechanisms are, however, almost invariably reciprocal and the resistance a current encounters does not depend on its ", "abstract": "When electrons move through non-trivial spin textures in magnetic metals, conduction electrons couple to magnetic order through both their charge and their spin, acquiring non-trivial equations of motion and a dynamic spin polarization providing the foundation of spintronics. These mechanisms are, however, almost invariably reciprocal and the resistance a current encounters does not depend on its flow direction. Here we show that a chiral crystal lattice and an independently reversible chiral magnetic order together produce a diode whose forward direction is set by the magnetism rather than by the structure. In the triangular-lattice antiferromagnet Co$_{1/3}$TaS$_2$, whose chiral lattice hosts a chiral magnetic order of its own, independent handedness, we observe a pronounced nonreciprocal resistance. Unlike conventional electrical magnetochiral anisotropy, which is driven by an external magnetic field, our spontaneous magnetic diode effect arises from an internal noncoplanar spin texture with vanishing net magnetization. Symmetry analysis and model calculations show that the effect originates from the interplay of noncoplanar spin order and spin-orbit coupling, which generates a chiral, time-reversal-symmetry-breaking electronic response. Crucially, reversing the magnetic handedness reverses the sign of the nonreciprocal resistance, demonstrating magnetic control of the diode polarity.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "A noncoplanar antiferromagnetic texture and spin-orbit coupling produce a spontaneous magnetic diode response whose polarity reverses with magnetic handedness, without net magnetization or an applied field.", "ai_in_scope": true, "relevance_reason": "The paper reports a new nonreciprocal transport phenomenon in a magnetic material and identifies its dependence on reversible magnetic handedness.", "relevance_method": "semantic", "relevance_score": 86, "feature_candidate": false, "summary_zh": "本研究在三角晶格反铁磁体 Co1/3TaS2 中报告了自发的非互易电阻。作者将其归因于非共面自旋有序与自旋轨道耦合的相互作用，并发现反转磁性手性会反转二极管极性。", "method_en": "The authors measure nonreciprocal resistance in Co1/3TaS2 and combine symmetry analysis with model calculations to examine its relation to the chiral magnetic order.", "method_zh": "作者测量 Co1/3TaS2 中的非互易电阻，并结合对称性分析和模型计算考察其与手性磁有序的关系。", "result_en": "The study finds a pronounced nonreciprocal resistance associated with the interplay of the chiral lattice and independently reversible chiral magnetic order, without requiring an external magnetic field; reversing the magnetic handedness reverses the diode polarity.", "result_zh": "研究发现，手性晶格与可独立反转的手性磁有序相互作用会产生显著的非互易电阻，且无需外加磁场；反转磁性手性会使二极管极性反转。", "future_en": "Further experiments could map the diode response as a function of magnetic handedness and temperature to characterize its operating range and reproducibility.", "future_zh": "后续实验可测量二极管响应随磁性手性和温度的变化，以刻画其工作范围与可重复性。", "tier": "PRL", "tier_reason_en": "The reported spontaneous magnetic diode effect has a clear symmetry-based interpretation and a distinctive polarity reversal controlled by magnetic handedness, making it a notable result in magnetic transport. The abstract supports a strong specialist-journal assessment at the PRL tier.", "tier_reason_zh": "摘要报告的自发磁性二极管效应具有明确的对称性解释，并呈现由磁性手性控制的独特极性反转，是磁输运领域值得关注的结果。依据摘要信息，其水平适合评为 PRL 档次。"}, {"id": "arxiv-2610-34439", "arxiv_id": "2610.34439", "type": "arXiv", "journal": "arXiv:2610.34439", "journal_ref": "", "journal_doi": "", "title": "Theory of the $1/9$ Magnetization Plateau of the Spin-$1/2$ Kagome Heisenberg Antiferromagnet", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.str-el"], "submitted_at": "2026-10-25T16:54:06Z", "updated_at": "2026-10-25T16:54:06Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Pratyay Ghosh, Frédéric Mila", "corresponding": "", "url": "https://arxiv.org/abs/2610.34439v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The authors study the 1/9 magnetization plateau of the spin-1/2 kagome Heisenberg antiferromagnet and identify a 27-site spin-density-wave state with lower variational energy than previous approaches. The state breaks sixfold rotational symmetry to threefold symmetry, unlike the higher-magnetization plateaus discussed in the abstract.", "summary": "We investigate the $1/9$ magnetization plateau of the spin-$1/2$ kagome Heisenberg antiferromagnet using infinite projected entangled-pair states and identify a spin-density-wave state with a $27$-site unit cell and a lower variational energy than previous approaches. In contrast to higher-magnetization plateaus, which are well described by localized magnons on nonoverlapping hexagons and preserve", "abstract": "We investigate the $1/9$ magnetization plateau of the spin-$1/2$ kagome Heisenberg antiferromagnet using infinite projected entangled-pair states and identify a spin-density-wave state with a $27$-site unit cell and a lower variational energy than previous approaches. In contrast to higher-magnetization plateaus, which are well described by localized magnons on nonoverlapping hexagons and preserve a sixfold rotational symmetry, the $1/9$ plateau only keeps a threefold rotational symmmetry and consists of a tiling by three types of $9$-site clusters related by $\\pm2π/3$ rotations. These conclusions are supported by a complementary cluster mean-field theory which correctly preserves the symmetry of the higher plateaus but leads to the same spontaneous symmetry breaking for the $1/9$ plateau with a qualitatively similar pattern of nine different local magnetizations.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "The spin-1/2 kagome Heisenberg antiferromagnet’s 1/9 plateau is predicted to form a 27-site spin-density-wave state that breaks sixfold rotational symmetry to threefold, with a pattern of three distinct nine-site clusters.", "ai_in_scope": true, "relevance_reason": "This is an original theoretical study of a quantum-spin plateau and its spontaneous symmetry breaking in a frustrated magnet.", "relevance_method": "semantic", "relevance_score": 76, "feature_candidate": false, "summary_zh": "作者研究自旋-1/2 kagome 海森堡反铁磁体的 1/9 磁化平台，并发现一种具有 27 个格点周期的自旋密度波态，其变分能量低于此前研究方案。与文中讨论的较高磁化平台不同，该态将六重旋转对称性自发降低为三重旋转对称性。", "method_en": "Infinite projected entangled-pair states are used to study the plateau, and complementary cluster mean-field calculations test the proposed symmetry pattern.", "method_zh": "研究采用无限投影纠缠对态分析该平台，并以互补的团簇平均场计算检验所提出的对称性图样。", "result_en": "The iPEPS calculation identifies a 27-site spin-density-wave state with lower variational energy than previous approaches. It consists of a tiling by three types of nine-site clusters related by rotations of ±2π/3 and preserves only threefold rotational symmetry. Cluster mean-field theory reproduces the spontaneous symmetry breaking and a qualitatively similar pattern of nine distinct local magnetizations, while correctly preserving the symmetry of the higher plateaus.", "result_zh": "iPEPS 计算识别出一种具有 27 个格点周期的自旋密度波态，其变分能量低于此前方案。该态由三类九格点团簇铺排而成，三类团簇彼此相差 ±2π/3 旋转，且仅保留三重旋转对称性。团簇平均场理论复现了这一自发对称性破缺及定性相似的九种局域磁化图样，同时能够正确保留较高磁化平台的对称性。", "future_en": "A useful follow-up would be to test the stability of the proposed 27-site state beyond the reported variational and cluster mean-field treatments.", "future_zh": "后续可在文中采用的变分与团簇平均场方法之外，进一步检验所提出的 27 格点态的稳定性。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work presents a focused numerical and mean-field analysis of a specific magnetization plateau, with a concrete symmetry-breaking result but no abstract-reported experimental validation or broad materials demonstration.", "tier_reason_zh": "该工作以数值和平均场方法集中研究特定磁化平台，给出了明确的对称性破缺结果，但摘要未报告实验验证或广泛的材料展示。"}, {"id": "arxiv-2610-34230", "arxiv_id": "2610.34230", "type": "arXiv", "journal": "arXiv:2610.34230", "journal_ref": "", "journal_doi": "", "title": "Tuning from intrinsic to disorder-dominated quantum states in a kagome antiferromagnet", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.str-el"], "submitted_at": "2026-10-25T11:57:32Z", "updated_at": "2026-10-25T11:57:32Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Y. Tanaka, R. Kumakura, T. Yamaguchi, M. Kato, K. Totsuka, B. Li, Y. Zhao, Y. Li, R. Grasset, O. Cavani, A. Alessi, V. Sharma, Y. Kohama, S. Suetsugu", "corresponding": "", "url": "https://arxiv.org/abs/2610.34230v1", "topic": "Magnetism", "level": "Feature", "summary_en": "The study uses electron irradiation to introduce controlled point defects into the spin-1/2 kagome antiferromagnet YCu3(OH)6.5Br2.5 and tracks changes in its low-energy magnetic states. It finds that very dilute disorder suppresses magnetization plateaus while promoting defect-related magnetic responses and specific-heat scaling.", "summary": "The spin-1/2 kagome Heisenberg antiferromagnet (AFM) provides a paradigmatic platform for realizing quantum spin-liquid (QSL) and magnetization-plateau states. Experimental progress, however, has been hindered by structural disorder, whose effects on these quantum states remain elusive. A key experimental challenge is therefore to connect intrinsic and disorder-dominated regimes through controlled", "abstract": "The spin-1/2 kagome Heisenberg antiferromagnet (AFM) provides a paradigmatic platform for realizing quantum spin-liquid (QSL) and magnetization-plateau states. Experimental progress, however, has been hindered by structural disorder, whose effects on these quantum states remain elusive. A key experimental challenge is therefore to connect intrinsic and disorder-dominated regimes through controlled disorder and identify emergent degrees of freedom associated with disorder. Here we introduce controlled point defects through electron irradiation into the spin-1/2 kagome AFM YCu3(OH)6.5Br2.5 (YCOB) and track the resulting evolution of its low-energy magnetic states. High-field magnetic torque measurements reveal that the 1/9 and 1/3 magnetization plateaus are strongly suppressed by only ~0.05% irradiation-induced defects, demonstrating that these delicate quantum many-body states are extraordinarily fragile against dilute disorder. Moreover, the irradiation induces a sign reversal of the magnetic torque only at low temperatures and low fields, indicating the emergence of correlated defect-induced moments rather than isolated free spins. Remarkably, the characteristic scaling of the magnetic specific heat, absent in pristine YCOB, progressively emerges with increasing disorder. These findings establish dilute disorder as an effective tuning parameter that drives the kagome AFM from intrinsic quantum states toward a disorder-dominated regime. The contrasting responses further identify pristine YCOB as an exceptionally clean kagome AFM for accessing intrinsic quantum states.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "Very dilute defects strongly suppress the 1/9 and 1/3 magnetization plateaus, while low-temperature torque reversal and the emergence of specific-heat scaling indicate correlated defect moments and a crossover toward disorder-dominated magnetic behavior.", "ai_in_scope": true, "relevance_reason": "Controlled irradiation probes how dilute disorder reshapes quantum magnetic states in a kagome antiferromagnet, establishing a direct result on quantum magnetism.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": true, "summary_zh": "本研究通过电子辐照在自旋 1/2 kagome 反铁磁体 YCu3(OH)6.5Br2.5 中引入可控点缺陷，并追踪其低能磁态的变化。研究发现，极稀疏的无序会压制磁化平台，同时促进缺陷相关磁响应和比热标度行为。", "method_en": "The authors introduce point defects by electron irradiation and compare the resulting states with those of pristine YCOB. They use high-field magnetic torque measurements and magnetic-specific-heat measurements to track the disorder dependence.", "method_zh": "作者通过电子辐照引入点缺陷，并将所得状态与未辐照的 YCOB 进行比较。他们使用高场磁力矩和磁比热测量追踪系统对无序的响应。", "result_en": "Only about 0.05% irradiation-induced defects strongly suppress the 1/9 and 1/3 magnetization plateaus, indicating that these states are highly fragile to dilute disorder. At low temperatures and low fields, irradiation reverses the magnetic torque, which the authors interpret as evidence for correlated defect-induced moments rather than isolated free spins. A characteristic scaling of the magnetic specific heat, absent in pristine YCOB, progressively emerges with increasing disorder. The results identify dilute disorder as a tuning parameter between intrinsic and disorder-dominated regimes and support the view that pristine YCOB is an unusually clean kagome antiferromagnet.", "result_zh": "仅约 0.05% 的辐照诱导缺陷便显著压制 1/9 和 1/3 磁化平台，表明这些状态对稀疏无序极为脆弱。在低温低场下，辐照使磁力矩发生符号反转；作者将其解释为缺陷诱导的关联磁矩，而非孤立自由自旋。未辐照 YCOB 中不存在的一种特征磁比热标度，随无序增加而逐渐显现。结果表明，稀疏无序可作为连接本征态与无序主导态的调控参数，并支持未辐照 YCOB 是一种异常洁净的 kagome 反铁磁体这一判断。", "future_en": "Follow-up work could map the plateau suppression and defect-related responses across finer irradiation levels to clarify how the crossover develops. Complementary probes of the low-energy magnetic excitations could further test the interpretation of correlated defect-induced moments.", "future_zh": "后续可在更精细的辐照剂量范围内测量平台压制和缺陷相关响应，以厘清这一交叉过程如何发展。对低能磁激发进行补充探测，也可进一步检验缺陷诱导关联磁矩的解释。", "tier": "PRL", "tier_reason_en": "The abstract presents a controlled disorder study in a prominent kagome antiferromagnet, with a striking quantitative fragility of two plateaus at about 0.05% defects and distinct disorder-induced responses. This is a focused and potentially influential condensed-matter result, best suited to the PRL tier on the evidence provided.", "tier_reason_zh": "摘要展示了对重要 kagome 反铁磁体开展的可控无序研究：约 0.05% 的缺陷即可显著破坏两个磁化平台，并引发不同的无序相关响应。这是一项聚焦且可能具有影响力的凝聚态结果；依据摘要信息，PRL 档次较为合适。"}, {"id": "arxiv-2610-35401", "arxiv_id": "2610.35401", "type": "arXiv", "journal": "arXiv:2610.35401", "journal_ref": "", "journal_doi": "", "title": "Zeeman-field-induced three-spin interactions and relativistic coupling to the scalar spin chirality", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci"], "submitted_at": "2026-10-26T13:16:48Z", "updated_at": "2026-10-26T13:16:48Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Samir Lounis", "corresponding": "", "url": "https://arxiv.org/abs/2610.35401v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The authors derive field-linear three-spin interactions from a microscopic electronic Hamiltonian, distinguishing isotropic terms that do not require spin-orbit coupling from relativistic terms that do. They identify consequences for magnetic trimers and continuum chiral textures, including a field-dependent Dzyaloshinskii-Moriya interaction.", "summary": "Magnetic fields are commonly incorporated in atomistic spin models through the Zeeman energy of individual magnetic moments. Starting from a microscopic electronic Hamiltonian, we show that the Zeeman coupling of conduction electrons also generates field-linear three-spin interactions, the lowest-order corrections allowed by time-reversal symmetry. Using a Green-function expansion of the grand pot", "abstract": "Magnetic fields are commonly incorporated in atomistic spin models through the Zeeman energy of individual magnetic moments. Starting from a microscopic electronic Hamiltonian, we show that the Zeeman coupling of conduction electrons also generates field-linear three-spin interactions, the lowest-order corrections allowed by time-reversal symmetry. Using a Green-function expansion of the grand potential, we identify two classes of interactions. Isotropic terms of the form $(\\mathbf S_i\\cdot\\mathbf S_j)(\\mathbf S_k\\cdot\\mathbf B)$ exist without spin-orbit coupling, and their total strength obeys a sum rule involving the three-site electronic loop at the Fermi energy. Relativistic terms require spin-orbit coupling and include $\\mathbf K_{ijk}\\cdot\\mathbf B,χ_{ijk}$, where $χ_{ijk}=\\mathbf S_i\\cdot(\\mathbf S_j\\times\\mathbf S_k)$ is the scalar spin chirality. We show that this coupling is forbidden in the spin channel without spin-orbit coupling, whereas the orbital channel recovers the orbital-flux mechanism of Mott insulators. Exact diagonalization of the Hubbard trimer confirms the independence and additivity of both channels. For magnetic trimers in Rashba electron gases, we derive analytical expressions showing that $\\mathbf K_{ijk}$ lies in-plane at first order in spin-orbit coupling but vanishes for $C_{3v}$-symmetric trimers, where an out-of-plane component emerges at second order. These interactions can shift magnetization-step fields and modify field-induced noncoplanarity. In the continuum limit, the chirality coupling splits skyrmions from antiskyrmions, while the relativistic terms generate a field-dependent Dzyaloshinskii-Moriya interaction.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Zeeman coupling to conduction electrons generates field-linear three-spin interactions, including spin-orbit-dependent coupling to scalar spin chirality, which can alter magnetic textures and skyrmion–antiskyrmion energetics.", "ai_in_scope": true, "relevance_reason": "This microscopic theory establishes new field-induced interactions in magnetic systems and predicts their consequences for noncoplanarity and skyrmion energetics.", "relevance_method": "semantic", "relevance_score": 81, "feature_candidate": false, "summary_zh": "作者从微观电子哈密顿量推导出与磁场成线性关系的三自旋相互作用，并区分了不需要自旋轨道耦合的各向同性项和需要自旋轨道耦合的相对论项。研究指出这些相互作用会影响磁性三聚体及连续手性自旋结构，包括产生依赖磁场的 Dzyaloshinskii-Moriya 相互作用。", "method_en": "The study uses a Green-function expansion of the grand potential to derive and classify the interactions, including a sum rule for the isotropic terms. It checks the separation and additivity of the spin and orbital channels by exact diagonalization of a Hubbard trimer, and derives analytical results for magnetic trimers in Rashba electron gases.", "method_zh": "研究通过对巨势作格林函数展开来推导并分类这些相互作用，并给出各向同性项的求和规则。作者利用 Hubbard 三聚体的精确对角化检验自旋与轨道通道的区分及可加性，同时推导 Rashba 电子气中磁性三聚体的解析结果。", "result_en": "The field generates isotropic terms of the form (Sᵢ·Sⱼ)(Sₖ·B) even without spin-orbit coupling, whereas the relativistic coupling between scalar spin chirality and the field requires spin-orbit coupling in the spin channel. In Rashba systems, the vector Kᵢⱼₖ lies in-plane at first order in spin-orbit coupling but vanishes for C₃ᵥ-symmetric trimers; an out-of-plane component appears at second order. The authors further find that these interactions can shift magnetization-step fields and alter field-induced noncoplanarity, while the continuum chirality coupling splits skyrmions from antiskyrmions.", "result_zh": "即使没有自旋轨道耦合，磁场也会产生形式为 (Sᵢ·Sⱼ)(Sₖ·B) 的各向同性项；而在自旋通道中，标量自旋手性与磁场的相对论耦合则需要自旋轨道耦合。在 Rashba 体系中，Kᵢⱼₖ 在自旋轨道耦合的一阶近似下位于平面内，但对 C₃ᵥ 对称的三聚体为零；二阶时会出现面外分量。作者还指出，这些相互作用可改变磁化台阶对应的磁场并影响磁场诱导的非共面自旋结构，而连续极限下的手性耦合会使斯格明子与反斯格明子发生能量分裂。", "future_en": "A natural follow-up is to test whether the predicted field-dependent interactions produce measurable shifts in magnetization steps or skyrmion–antiskyrmion energetics in suitable materials and geometries.", "future_zh": "一个自然的后续方向是在合适的材料与几何结构中检验这些依赖磁场的相互作用是否会造成可测量的磁化台阶位移，或改变斯格明子与反斯格明子的能量关系。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The microscopic derivation, symmetry analysis, and independent checks provide a substantial and technically grounded contribution to spin interactions, but the abstract presents a theoretical framework without evidence of broad experimental validation that would justify a higher tier.", "tier_reason_zh": "微观推导、对称性分析和独立检验构成了对自旋相互作用领域有分量且技术扎实的贡献；但摘要呈现的是理论框架，尚未显示足以支持更高档次评价的广泛实验验证。"}, {"id": "arxiv-2610-33463", "arxiv_id": "2610.33463", "type": "arXiv", "journal": "arXiv:2610.33463", "journal_ref": "", "journal_doi": "", "title": "Chemical Substitution as a Route to Anomalous Surface Superconductivity in NiBi$_3$", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.mtrl-sci", "cond-mat.supr-con"], "submitted_at": "2026-10-24T05:36:27Z", "updated_at": "2026-10-24T05:36:27Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Anupam Barik, Subhadip Chakrabarty, Achintya Low, Sudip Pal, Setti Thirupathaiah", "corresponding": "", "url": "https://arxiv.org/abs/2610.33463v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "This paper reports evidence for a surface-associated, low-dimensional superconducting state in Pb-substituted NiBi3, with a resistive onset well above the bulk transition. Its critical-field and transport signatures distinguish the state from bulk superconductivity and indicate an unusually large enhancement beyond the bulk upper critical field.", "summary": "Stabilizing two-dimensional superconductivity in a bulk superconducting material provides a unique route to exploring the interplay between superconducting condensates of different dimensionalities. Here, we present evidence for a distinct surface-associated superconducting state in Pb-substituted NiBi$_3$. NiBi$_{2.8}$Pb$_{0.2}$ exhibits a resistive onset at $T_{c,\\mathrm{onset}}^{*}\\approx8.1$~K", "abstract": "Stabilizing two-dimensional superconductivity in a bulk superconducting material provides a unique route to exploring the interplay between superconducting condensates of different dimensionalities. Here, we present evidence for a distinct surface-associated superconducting state in Pb-substituted NiBi$_3$. NiBi$_{2.8}$Pb$_{0.2}$ exhibits a resistive onset at $T_{c,\\mathrm{onset}}^{*}\\approx8.1$~K, nearly twice the bulk superconducting transition temperature of approximately 4.1~K. The absence of a corresponding Meissner response or specific-heat anomaly at the higher-temperature transition supports its non-bulk origin. A cusp-like angular dependence of the critical field, well described by the two-dimensional Tinkham model, together with nonlinear current--voltage characteristics and signatures of a Berezinskii--Kosterlitz--Thouless transition, establishes the low-dimensional character of this superconducting state. Remarkably, the surface-associated superconductivity persists well beyond the bulk upper critical field, reaching a maximum ratio of $H_{c3}/H_{c2}\\approx4.3$, far exceeding the conventional Saint-James--de Gennes value of 1.695. These results demonstrate that Pb substitution can stabilize an anomalously enhanced low-dimensional superconducting state in NiBi$_3$, providing a platform for investigating superconductivity at the boundary of a bulk superconductor.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "Pb-substituted NiBi₃ exhibits surface-associated superconductivity with a transition onset near 8.1 K and an upper critical-field ratio reaching Hc3/Hc2 ≈ 4.3, supported by 2D angular-field and BKT signatures.", "ai_in_scope": true, "relevance_reason": "The measurements identify an anomalously robust, low-dimensional superconducting state at a bulk superconductor's surface, a substantive result in superconductivity.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "该论文报道了 Pb 取代 NiBi3 中表面相关低维超导态的证据，其电阻转变起始温度远高于体相转变温度。临界场和输运特征将该态与体相超导区分开来，并显示其超过体相上临界场的增强异常显著。", "method_en": "The authors studied resistive and magnetic responses, specific heat, angular dependence of the critical field, and nonlinear current–voltage characteristics in NiBi2.8Pb0.2. They used the two-dimensional Tinkham model and signatures of a Berezinskii–Kosterlitz–Thouless transition to assess the low-dimensional character of the state.", "method_zh": "作者研究了 NiBi2.8Pb0.2 的电阻和磁响应、比热、临界场角度依赖性及非线性电流—电压特征。他们利用二维 Tinkham 模型以及 Berezinskii–Kosterlitz–Thouless 转变的特征来判断该态的低维性质。", "result_en": "NiBi2.8Pb0.2 has a resistive onset at T*c,onset ≈ 8.1 K, nearly twice the bulk transition temperature of approximately 4.1 K, without a corresponding higher-temperature Meissner response or specific-heat anomaly. The cusp-like angular critical-field dependence, nonlinear current–voltage curves, and BKT signatures support a low-dimensional surface-associated state. It persists beyond the bulk upper critical field, with a maximum Hc3/Hc2 ≈ 4.3, far above the conventional Saint-James–de Gennes value of 1.695.", "result_zh": "NiBi2.8Pb0.2 的电阻转变起始温度为 T*c,onset ≈ 8.1 K，接近约 4.1 K 体相转变温度的两倍，但较高温处没有相应的迈斯纳响应或比热异常。临界场角度依赖的尖点、非线性电流—电压曲线及 BKT 特征支持存在低维表面相关态。该态持续存在于体相上临界场之外，最大 Hc3/Hc2 ≈ 4.3，远高于传统 Saint-James–de Gennes 值 1.695。", "future_en": "Further measurements that directly characterize the surface-associated state and test its reproducibility across substitution levels would help clarify the origin and robustness of the reported enhancement.", "future_zh": "进一步直接表征该表面相关态，并检验其在不同取代水平下的可重复性，有助于厘清所报道增强效应的起源与稳健性。", "tier": "PRL", "tier_reason_en": "The reported nearly doubled resistive onset and Hc3/Hc2 ratio of about 4.3, supported by several low-dimensionality signatures, make this a striking experimental claim with potential broad interest; the abstract does not establish enough microscopic evidence for a higher tier.", "tier_reason_zh": "近乎翻倍的电阻转变起始温度、约 4.3 的 Hc3/Hc2 比值及多项低维特征，使这项实验主张十分醒目且可能具有广泛兴趣；但摘要尚未提供足以支持更高层级的微观证据。"}, {"id": "arxiv-2610-33808", "arxiv_id": "2610.33808", "type": "arXiv", "journal": "arXiv:2610.33808", "journal_ref": "", "journal_doi": "", "title": "Chiral Superconductivity Adjacent to a Wigner Crystal in Rhombohedral Graphene", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.str-el", "cond-mat.supr-con"], "submitted_at": "2026-10-24T17:14:02Z", "updated_at": "2026-10-24T17:14:02Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Ke Wang", "corresponding": "", "url": "https://arxiv.org/abs/2610.33808v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "The authors investigate whether correlations that promote Wigner crystallization in rhombohedral tetralayer graphene can also drive superconductivity in the neighboring metallic regime.", "summary": "Can the correlations favoring electron crystallization also generate superconductivity in the neighboring metal? We investigate this possibility in rhombohedral tetralayer graphene with repulsive Coulomb interactions. Self-consistent Hartree--Fock calculations identify a commensurate triangular Wigner-crystal state. To investigate pairing on the metallic side, we construct a crossing-symmetric par", "abstract": "Can the correlations favoring electron crystallization also generate superconductivity in the neighboring metal? We investigate this possibility in rhombohedral tetralayer graphene with repulsive Coulomb interactions. Self-consistent Hartree--Fock calculations identify a commensurate triangular Wigner-crystal state. To investigate pairing on the metallic side, we construct a crossing-symmetric particle--hole vertex using coupled parquet and Bethe--Salpeter equations, incorporating exchange vertex corrections beyond polarization-bubble screening. Near crystallization, the enhanced electronic correlations generate an effective attraction favoring chiral $f$-wave pairing. Superconductivity is confined to a narrow metallic region adjacent to the crystal, qualitatively consistent with the superconducting sleeve observed near an insulating regime in rhombohedral graphene. These results connect the emergence of chiral pairing and its location in the phase diagram to the electronic correlations favoring crystallization.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "The calculations predict that correlations enhanced near triangular Wigner crystallization induce chiral f-wave pairing in a narrow metallic region adjacent to the crystal.", "ai_in_scope": true, "relevance_reason": "This is original theory of correlated electrons in a low-dimensional quantum material, connecting Wigner crystallization to a nearby superconducting phase.", "relevance_method": "semantic", "relevance_score": 77, "feature_candidate": false, "summary_zh": "作者研究了在菱方四层石墨烯中促成 Wigner 晶化的关联效应，是否也能在相邻金属区域驱动超导。", "method_en": "They identify a commensurate triangular Wigner crystal using self-consistent Hartree–Fock calculations and study metallic-side pairing with a crossing-symmetric particle-hole vertex from coupled parquet and Bethe–Salpeter equations.", "method_zh": "作者通过自洽 Hartree–Fock 计算识别出公度三角 Wigner 晶体，并利用耦合 parquet 与 Bethe–Salpeter 方程构造的交叉对称粒子—空穴顶角研究金属侧配对。", "result_en": "Near crystallization, the enhanced correlations generate an effective attraction favoring chiral f-wave pairing, which is confined to a narrow metallic region adjacent to the crystal and is qualitatively consistent with the observed superconducting sleeve near an insulating regime.", "result_zh": "接近晶化时，增强的电子关联产生有利于手性 f 波配对的有效吸引；超导仅存在于紧邻晶体的狭窄金属区域，这与实验观察到的绝缘区域附近超导带在定性上相符。", "future_en": "The abstract does not specify a future research direction.", "future_zh": "摘要未说明具体的未来研究方向。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The paper combines advanced many-body calculations with a timely, experimentally motivated prediction, but the abstract presents a material-specific theoretical result rather than evidence for broader experimental validation.", "tier_reason_zh": "该工作将先进多体计算与受实验启发的前沿预测相结合，但摘要呈现的是针对特定材料的理论结果，尚未显示更广泛的实验验证。"}, {"id": "arxiv-2610-34382", "arxiv_id": "2610.34382", "type": "arXiv", "journal": "arXiv:2610.34382", "journal_ref": "", "journal_doi": "", "title": "Nodeless d-wave pairing in monolayer FeSe revealed by intra-unit-cell Josephson interferometry", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.str-el", "cond-mat.supr-con"], "submitted_at": "2026-10-25T15:38:46Z", "updated_at": "2026-10-25T15:38:46Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Runxin Li, Yuchen Huo, Jiong Mei, Ming-Qiang Ren, Miaomiao Wang, Quanxing Wei, Fengyu Yao, Maowen Zheng, Qing Qu, Cui Ding, Hongtao Yuan, Zhuoyu Chen, Wei-Qiang Chen, Kun Jiang, Qi-Kun Xue, Yu-Jie Sun", "corresponding": "", "url": "https://arxiv.org/abs/2610.34382v1", "topic": "Superconductivity", "level": "Feature", "summary_en": "The study uses atomic-scale Josephson interferometry to probe the pairing phase within a unit cell of monolayer FeSe/SrTiO3. It identifies a local-response pattern interpreted as evidence for nodeless d-wave pairing despite a fully gapped quasiparticle spectrum.", "summary": "The Josephson effect provides a direct phase-sensitive probe of superconducting order and has played a central role in identifying unconventional pairing symmetries1-6. Conventional Josephson interferometry, however, extracts phase information through engineered junction geometries and crystallographic orientations, rather than by resolving the internal phase structure of the pair state within a s", "abstract": "The Josephson effect provides a direct phase-sensitive probe of superconducting order and has played a central role in identifying unconventional pairing symmetries1-6. Conventional Josephson interferometry, however, extracts phase information through engineered junction geometries and crystallographic orientations, rather than by resolving the internal phase structure of the pair state within a single unit cell. Here, we use a superconducting Nb tip to realize atomic-scale Josephson interferometry in monolayer FeSe/SrTiO3. Despite a fully gapped quasiparticle spectrum, the local Josephson response exhibits a striking intra-unit-cell pattern, with maxima centred on Fe-Fe bonds and robust nodal lines along the Fe-Se directions. We show that these nodal lines arise from destructive interference between Josephson tunnelling amplitudes associated with opposite-sign pairing components. Microscopic calculations reproduce the observed spatial pattern and identify it as a fingerprint of nodeless d-wave pairing. Our results establish intra-unit-cell Josephson interferometry as a local phase-sensitive probe of pairing symmetry in unconventional superconductors.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "The intra-unit-cell Josephson pattern in monolayer FeSe is identified as a fingerprint of nodeless d-wave pairing, arising from destructive interference between opposite-sign pairing components.", "ai_in_scope": true, "relevance_reason": "Atomic-scale Josephson measurements and microscopic calculations provide phase-sensitive evidence about pairing symmetry in an unconventional superconductor.", "relevance_method": "semantic", "relevance_score": 89, "feature_candidate": true, "summary_zh": "本研究利用原子尺度约瑟夫森干涉探测单层 FeSe/SrTiO3 晶胞内的配对相位。作者将局域响应图样解释为无节点 d 波配对的证据，尽管准粒子谱呈现完全能隙。", "method_en": "A superconducting Nb tip is used to perform atomic-scale Josephson interferometry on monolayer FeSe/SrTiO3. Microscopic calculations are used to interpret the spatial response pattern.", "method_zh": "研究使用超导 Nb 针尖对单层 FeSe/SrTiO3 进行原子尺度约瑟夫森干涉测量。作者结合微观计算解释其空间响应图样。", "result_en": "The local Josephson response has maxima centered on Fe–Fe bonds and robust nodal lines along Fe–Se directions. The authors attribute the lines to destructive interference between tunnelling amplitudes from pairing components with opposite signs, rather than to nodes in the quasiparticle spectrum. Microscopic calculations reproduce the observed pattern. They identify it as a fingerprint of nodeless d-wave pairing and establish intra-unit-cell Josephson interferometry as a local phase-sensitive probe of pairing symmetry.", "result_zh": "约瑟夫森局域响应在 Fe–Fe 键中心达到最大值，并沿 Fe–Se 方向出现稳定的节点线。作者将这些节点线归因于符号相反的配对分量所对应隧穿振幅之间的相消干涉，而非准粒子谱中的节点。微观计算再现了实验观察到的图样。研究将该图样认定为无节点 d 波配对的特征，并展示了晶胞内约瑟夫森干涉作为局域相位敏感配对对称性探针的用途。", "future_en": "A useful follow-up would be to apply this phase-sensitive mapping to other candidate pairing states and compare their spatial fingerprints. Measurements across controlled changes in temperature or sample conditions could also test the robustness of the inferred pattern.", "future_zh": "后续可将这种相位敏感成像用于其他候选配对态，并比较各自的空间特征。还可在受控温度或样品条件变化下进行测量，以检验所推断图样的稳健性。", "tier": "Nature/Science", "tier_reason_en": "The abstract describes a potentially consequential phase-sensitive determination of pairing symmetry in monolayer FeSe, together with a new atomic-scale measurement approach and a resolved distinction between a fully gapped spectrum and local response nodes. If the evidence is as definitive as summarized, the conceptual and methodological reach supports a top-tier assessment.", "tier_reason_zh": "摘要所述工作以相位敏感方式判定单层 FeSe 的配对对称性，并提出原子尺度测量方法，同时区分了完全能隙谱与局域响应节点。若证据确如摘要所述具有决定性，其概念和方法影响力足以支持顶级期刊档次的评价。"}, {"id": "arxiv-2610-35814", "arxiv_id": "2610.35814", "type": "arXiv", "journal": "arXiv:2610.35814", "journal_ref": "", "journal_doi": "", "title": "The fate of $s_{\\pm}$ superconductivity in the bilayer nickelate La$_3$Ni$_2$O$_7$", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.str-el", "cond-mat.supr-con"], "submitted_at": "2026-10-26T17:43:37Z", "updated_at": "2026-10-26T17:43:37Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Kaustubh Roy, Piers Coleman", "corresponding": "", "url": "https://arxiv.org/abs/2610.35814v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "This paper examines how interlayer coupling and the treatment of Coulomb repulsion affect competing superconducting pairing symmetries in bilayer La₃Ni₂O₇.", "summary": "Motivated by the recent measurement of high-temperature superconductivity in the bilayer nickelate system La$_3$Ni$_2$O$_7$ in the bulk as well as thin film samples, we seek to understand the role of the interlayer coupling in this system in dictating the pairing symmetry. Many proposals posit the existence of an $s_\\pm$ superconducting phase in close competition with the mroe conventional cuprate", "abstract": "Motivated by the recent measurement of high-temperature superconductivity in the bilayer nickelate system La$_3$Ni$_2$O$_7$ in the bulk as well as thin film samples, we seek to understand the role of the interlayer coupling in this system in dictating the pairing symmetry. Many proposals posit the existence of an $s_\\pm$ superconducting phase in close competition with the mroe conventional cuprate-like $d$-wave state in both weak- and strong-coupling theories. However, at least in the latter, the effects of Coulomb repulsion and the double occupancy constraint have been largely neglected. In this manuscript, we propose a mean-field fractionalization treatment that captures the full $SU(2)$ particle-hole symmetry of the t-J model at half-filling, and show how a systematic treatment of this new symmetry leads to an added Coulomb pseudopotential constraint - one that is absent in the usual $U(1)$ treatment. We then apply this new fractionalization scheme to a simplified bilayer t-J model of La$_3$Ni$_2$O$_7$, showing
