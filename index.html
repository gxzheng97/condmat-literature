m neutron reflectometry. Here, we demonstrate this approach using amorphous $\\mathrm{Fe}_{x}\\mathrm{Co}_{y}\\mathrm{Al}_{8}\\mathrm{Zr}_{2}$ thin films. Four samples, each comprising ten repetitions of an AlZr spacer layer and a magnetic layer, were prepared with magnetic-layer compositions of $\\mathrm{Fe}_{80}\\mathrm{Co}_{10}\\mathrm{Al}_{8}\\mathrm{Zr}_{2}$, $\\mathrm{Fe}_{70}\\mathrm{Co}_{20}\\mathrm{Al}_{8}\\mathrm{Zr}_{2}$, $\\mathrm{Fe}_{60}\\mathrm{Co}_{30}\\mathrm{Al}_{8}\\mathrm{Zr}_{2}$, and $\\mathrm{Fe}_{45}\\mathrm{Co}_{45}\\mathrm{Al}_{8}\\mathrm{Zr}_{2}$, and characterised using X-ray and polarised neutron reflectometry. Across the series, the nuclear SLD of the FeCoAlZr alloy decreases approximately linearly from $7.14 \\times 10^{-6}$ to $4.63 \\times 10^{-6}$ $\\mathring{\\mathrm{A}}^{-2}$ with increasing Co content, while the magnetic SLD is approximately $4.3$-$4.5 \\times 10^{-6}$ $\\mathring{\\mathrm{A}}^{-2}$. These results demonstrate that the nuclear and magnetic contributions can be controlled largely independently, with composition primarily tuning the nuclear SLD and the applied magnetic field offering, in principle, additional control of the magnetic contribution.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2603-24187", "arxiv_id": "2603.24187", "type": "arXiv", "journal": "arXiv:2603.24187", "journal_ref": "", "title": "Dipole-exchange spin waves and mode hybridization in magnetic nanoparticles", "authors": "Fedor Shuklin, Khristina Albitskaya, Sergei Solovyov et al.", "corresponding": "", "url": "https://arxiv.org/abs/2603.24187", "topic": "Magnetism", "level": "Brief", "summary_en": "We investigate spin-wave modes in confined ferromagnetic resonators with spherical and cylindrical geometries across the exchange-dominated, dipole-exchange, and dipolar interaction regimes. Starting from the linearized Landau-Lifshitz-Gilbert equation, we show that the projection of the total angular momentum and mirror parity are conserved quantities in the problem of axially symmetric resonator", "summary": "We investigate spin-wave modes in confined ferromagnetic resonators with spherical and cylindrical geometries across the exchange-dominated, dipole-exchange, and dipolar interaction regimes. Starting from the linearized Landau-Lifshitz-Gilbert equation, we show that the projection of the total angular momentum and mirror parity are conserved quantities in the problem of axially symmetric resonator", "abstract": "We investigate spin-wave modes in confined ferromagnetic resonators with spherical and cylindrical geometries across the exchange-dominated, dipole-exchange, and dipolar interaction regimes. Starting from the linearized Landau-Lifshitz-Gilbert equation, we show that the projection of the total angular momentum and mirror parity are conserved quantities in the problem of axially symmetric resonators. These symmetries provide a natural classification of spin-wave modes and explain the degeneracy of exchange modes, as well as its lifting by dipolar interactions. Numerical analysis shows that the nonlocal dipolar interaction removes the exchange degeneracy and hybridizes modes, leading to avoided crossings between modes that belong to the same symmetry sector. To describe this behavior, we develop a coupled-mode theory formulated directly in terms of dynamical magnetization, which reduces the dipole-exchange problem to a finite system of interacting modes. The resulting framework provides a unified description of spin-wave spectra in confined magnetic particles from the exchange limit to the dipolar regime.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2607-10091", "arxiv_id": "2607.10091", "type": "arXiv", "journal": "arXiv:2607.10091", "journal_ref": "", "title": "Dynamical Nonrelativistic Spin Splitting via THz Nonlinear Phononics", "authors": "Linding Yuan, ChanJu You, Ankit Disa et al.", "corresponding": "", "url": "https://arxiv.org/abs/2607.10091", "topic": "Magnetism", "level": "Brief", "summary_en": "Nonrelativistic spin splitting (NRSS) in collinear antiferromagnets, including altermagnets and compensated ferrimagnets, offers a route to high-frequency spintronics immune to stray fields, but its dynamic control has remained elusive. We demonstrate, using density functional theory (DFT) and nonlinear phononics, that THz laser pulses can achieve ultrafast, reversible control of NRSS on picosecon", "summary": "Nonrelativistic spin splitting (NRSS) in collinear antiferromagnets, including altermagnets and compensated ferrimagnets, offers a route to high-frequency spintronics immune to stray fields, but its dynamic control has remained elusive. We demonstrate, using density functional theory (DFT) and nonlinear phononics, that THz laser pulses can achieve ultrafast, reversible control of NRSS on picosecon", "abstract": "Nonrelativistic spin splitting (NRSS) in collinear antiferromagnets, including altermagnets and compensated ferrimagnets, offers a route to high-frequency spintronics immune to stray fields, but its dynamic control has remained elusive. We demonstrate, using density functional theory (DFT) and nonlinear phononics, that THz laser pulses can achieve ultrafast, reversible control of NRSS on picosecond timescales in antiferromagnets. We derive two mode-selection criteria, accounting for phonon and magnetic wavevector compatibility and inversion parity, to identify which phonon modes can activate NRSS. Our calculations illustrate the creation of NRSS in spin-degenerate NiO and the enhancement of existing splitting in LaFeO$_3$. While practical implementation depends on excitation conditions, lattice dynamics, and mode coupling, these results establish design principles for identifying materials with stronger and more accessible responses. Limitations imposed by driving fields, phonon damping, and anharmonic detuning motivate further materials screening based on accessible excitation strengths, lattice stability, resonance frequency matching, and favorable anharmonic coupling.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30371", "arxiv_id": "2610.30371", "type": "arXiv", "journal": "arXiv:2610.30371", "journal_ref": "", "title": "Emergent altermagnetism in (LaVO$_3$)$_n$/(LaNiO$_3$)$_m$ superlattices from interfacial charge transfer and octahedral tilts", "authors": "Gustavo H. Cassemiro, Walber H. Brito", "corresponding": "", "url": "https://arxiv.org/abs/2610.30371", "topic": "Magnetism", "level": "Brief", "summary_en": "Using first-principles calculations, we show that altermagnetism emerges in (LaVO$_3$)$_n$/(LaNiO$_3$)$_m$ superlattices, with $(n,m) = (1,1), (2,2)$ and $(2,4)$, from the interplay of interfacial charge transfer and octahedral tilts. Charge transfer drives the system towards the V$^{4+}$ and Ni$^{2+}$ configuration, turning the otherwise paramagnetic nickelate layers into a magnetically active su", "summary": "Using first-principles calculations, we show that altermagnetism emerges in (LaVO$_3$)$_n$/(LaNiO$_3$)$_m$ superlattices, with $(n,m) = (1,1), (2,2)$ and $(2,4)$, from the interplay of interfacial charge transfer and octahedral tilts. Charge transfer drives the system towards the V$^{4+}$ and Ni$^{2+}$ configuration, turning the otherwise paramagnetic nickelate layers into a magnetically active su", "abstract": "Using first-principles calculations, we show that altermagnetism emerges in (LaVO$_3$)$_n$/(LaNiO$_3$)$_m$ superlattices, with $(n,m) = (1,1), (2,2)$ and $(2,4)$, from the interplay of interfacial charge transfer and octahedral tilts. Charge transfer drives the system towards the V$^{4+}$ and Ni$^{2+}$ configuration, turning the otherwise paramagnetic nickelate layers into a magnetically active sublattice. The resulting $C$-type antiferromagnetic order, combined with $a^-b^+c^-$ or $a^-b^-c^-$ octahedral tilts, links opposite-spin sublattices only through nonsymmorphic operations, yielding a $d$-wave spin splitting without spin-orbit coupling. Within DFT+U, the splitting reaches 118 meV in the insulating (LVO)$_1$/(LNO)$_1$ superlattice, about twice that calculated for bulk LaVO$_3$, and decreases as the nickelate layers become thicker. Our findings indicate that this splitting is hosted by both the V and Ni sublattices, with nearly half of its weight on oxygen $2p$ states through $p$-$d$ covalency. Interfacial charge transfer thus emerges as a \\textit{design} principle for engineering altermagnetism in oxide heterostructures.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2507-02079", "arxiv_id": "2507.02079", "type": "arXiv", "journal": "Phys. Rev. D 114, 085017 (2026)", "journal_ref": "Phys. Rev. D 114, 085017 (2026)", "title": "Examining the Anomalous Nature of Chiral Effects in Thermodynamics", "authors": "Rémy Larue, Jérémie Quevillon, Diego Saviot", "corresponding": "", "url": "https://arxiv.org/abs/2507.02079", "topic": "Magnetism", "level": "Brief", "summary_en": "Quantum anomalies give rise to novel transport phenomena, including the generation of a current in a relativistic fluid due to the presence of magnetic field or vorticity. We present an exclusive and direct computation of the chiral anomaly in the adiabatic regime within the path integral for a massless fermion on a generic electromagnetic and curved background, including local temperature and che", "summary": "Quantum anomalies give rise to novel transport phenomena, including the generation of a current in a relativistic fluid due to the presence of magnetic field or vorticity. We present an exclusive and direct computation of the chiral anomaly in the adiabatic regime within the path integral for a massless fermion on a generic electromagnetic and curved background, including local temperature and che", "abstract": "Quantum anomalies give rise to novel transport phenomena, including the generation of a current in a relativistic fluid due to the presence of magnetic field or vorticity. We present an exclusive and direct computation of the chiral anomaly in the adiabatic regime within the path integral for a massless fermion on a generic electromagnetic and curved background, including local temperature and chemical potential. We identify new quantum-thermodynamical contributions to the breaking of axial symmetry which induce the Chiral Separation and Vortical Effects.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2607-22176", "arxiv_id": "2607.22176", "type": "arXiv", "journal": "Phys. Rev. B 114, 204423 (2026)", "journal_ref": "Phys. Rev. B 114, 204423 (2026)", "title": "GHz non-reciprocal optical conductivity in hematite ($α$-$\\text{Fe}_2\\text{O}_3$)", "authors": "Peng Rao, Johannes Gröbmeyer, P. Peter Stavropoulos et al.", "corresponding": "", "url": "https://arxiv.org/abs/2607.22176", "topic": "Magnetism", "level": "Brief", "summary_en": "We study the non-reciprocal properties of the iron oxide $α$-Fe$_2$O$_3$ (hematite) in the canted easy-plane antiferromagnetic phase, specifically in the GHz to THz frequency range. First, using the the microscopic spin Hamiltonian, we obtain the correct classical ground state where the canting is induced by the Dzyaloshinskii-Moriya interactions (DMI). The magnon spectrum is simulated using linea", "summary": "We study the non-reciprocal properties of the iron oxide $α$-Fe$_2$O$_3$ (hematite) in the canted easy-plane antiferromagnetic phase, specifically in the GHz to THz frequency range. First, using the the microscopic spin Hamiltonian, we obtain the correct classical ground state where the canting is induced by the Dzyaloshinskii-Moriya interactions (DMI). The magnon spectrum is simulated using linea", "abstract": "We study the non-reciprocal properties of the iron oxide $α$-Fe$_2$O$_3$ (hematite) in the canted easy-plane antiferromagnetic phase, specifically in the GHz to THz frequency range. First, using the the microscopic spin Hamiltonian, we obtain the correct classical ground state where the canting is induced by the Dzyaloshinskii-Moriya interactions (DMI). The magnon spectrum is simulated using linear spin wave theory. We then compute the polarizability and the sub-gap optical conductivities using linear response. We find that the conductivity tensor contains frequency peaks at the zero momentum magnon gaps of order $0.1~$meV which can be tuned by the DMI and on-site anisotropic spin interactions. Furthermore, we show that the canting-induced net magnetic moment $\\mathbf{m}$ represents a measure for the effective time-reversal-symmetry breaking and non-reciprocity of the system: a finite $\\mathbf{m}$ results in a non-zero Hall conductivity. Finally, we discuss the prospective application of hematite in non-reciprocal circulator design, by computing the non-reciprocal circulator transmission amplitude using the conductivities as input.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30597", "arxiv_id": "2610.30597", "type": "arXiv", "journal": "arXiv:2610.30597", "journal_ref": "", "title": "Hierarchical Reduction of Invariant Subspaces: From Fragmentation to Many-Body Scars", "authors": "Chihiro Matsui", "corresponding": "", "url": "https://arxiv.org/abs/2610.30597", "topic": "Magnetism", "level": "Brief", "summary_en": "We investigate a hierarchy of invariant Hilbert-space structures connecting Hilbert-space fragmentation, partial solvability, and quantum many-body scars. For spin chains with fragmented spin-$1/2$ subspaces and their local deformations, we show, using the spin-$1$ $XXC$ chain as a representative example, how successive local deformations reduce extensive irreducible-string fragmentation through a", "summary": "We investigate a hierarchy of invariant Hilbert-space structures connecting Hilbert-space fragmentation, partial solvability, and quantum many-body scars. For spin chains with fragmented spin-$1/2$ subspaces and their local deformations, we show, using the spin-$1$ $XXC$ chain as a representative example, how successive local deformations reduce extensive irreducible-string fragmentation through a", "abstract": "We investigate a hierarchy of invariant Hilbert-space structures connecting Hilbert-space fragmentation, partial solvability, and quantum many-body scars. For spin chains with fragmented spin-$1/2$ subspaces and their local deformations, we show, using the spin-$1$ $XXC$ chain as a representative example, how successive local deformations reduce extensive irreducible-string fragmentation through an implicitly embedded spin-$1/2$ invariant space and ultimately to a single scar tower, connecting the $XXC$, perturbed $XXC$, and spin-$1$ $XY$ scar models. Through the intermediate embedded space, local dynamics couples states from distinct frozen irreducible-string sectors and selects a new decomposition into representations, from which smaller invariant spaces can be retained. We also establish a rigidity constraint on isolating nonsymmetric towers and a constructive correspondence that transfers a reduction between locally realizable representations of the embedded dynamics. The latter demonstrates that the reduction hierarchy can be transferred through a unitary transformation within the embedded subspace, yielding an exact scar tower built on a Néel reference state without requiring unitary equivalence of the full Hamiltonians.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30684", "arxiv_id": "2610.30684", "type": "arXiv", "journal": "arXiv:2610.30684", "journal_ref": "", "title": "Impact of localized $4f$ magnetism on Berry curvature and the intrinsic anomalous Hall effect in CeRu$_2$Si$_2$", "authors": "Takehiro Kobayashi, Shunsuke Hirai, Ibuki Terada et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30684", "topic": "Magnetism", "level": "Brief", "summary_en": "The intrinsic anomalous Hall effect (AHE), originating from Berry curvature, has been extensively studied in $f$-electron systems, including Ce-based compounds. However, how the magnetism of localized $f$ electrons affect the intrinsic AHE remains unclear. Here, we investigate this issue in CeRu$_2$Si$_2$ by calculating the intrinsic anomalous Hall conductivity (AHC) for several occupied Ce-$4f$ s", "summary": "The intrinsic anomalous Hall effect (AHE), originating from Berry curvature, has been extensively studied in $f$-electron systems, including Ce-based compounds. However, how the magnetism of localized $f$ electrons affect the intrinsic AHE remains unclear. Here, we investigate this issue in CeRu$_2$Si$_2$ by calculating the intrinsic anomalous Hall conductivity (AHC) for several occupied Ce-$4f$ s", "abstract": "The intrinsic anomalous Hall effect (AHE), originating from Berry curvature, has been extensively studied in $f$-electron systems, including Ce-based compounds. However, how the magnetism of localized $f$ electrons affect the intrinsic AHE remains unclear. Here, we investigate this issue in CeRu$_2$Si$_2$ by calculating the intrinsic anomalous Hall conductivity (AHC) for several occupied Ce-$4f$ states using first-principles LDA+$U$ calculations combined with Wannier interpolation method. We find that the intrinsic AHC remains finite even when the Ce-$4f$ states are localized and do not contribute directly to the Fermi surface, and that its magnitude depends on which Ce-$4f$ state is occupied. We show that localized $4f$-electron magnetism induces exchange splitting in the conduction bands, generating Berry curvature in specific regions near the Fermi surface. This mechanism enables conduction bands that are derived from nonmagnetic orbitals and form the Fermi surface to contribute to the intrinsic AHE, suggesting a route to realizing large intrinsic AHE in $f$-electron materials.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31142", "arxiv_id": "2610.31142", "type": "arXiv", "journal": "arXiv:2610.31142", "journal_ref": "", "title": "Interaction-enhanced antiferromagnetic correlations in a Kondo ladder with a gapped band structure", "authors": "Tatsuya Kaneko, Ritsuki Hirabayashi, Yutaka Akagi", "corresponding": "", "url": "https://arxiv.org/abs/2610.31142", "topic": "Magnetism", "level": "Brief", "summary_en": "We investigate magnetic correlations in the two-leg Kondo-Hubbard ladder using the density-matrix renormalization group method. We focus on a parameter regime in which the noninteracting electronic system has a narrow indirect band gap. In this regime, there is no Fermi surface, and the conventional Fermi-surface-based Ruderman-Kittel-Kasuya-Yosida picture is not directly applicable; magnetic corr", "summary": "We investigate magnetic correlations in the two-leg Kondo-Hubbard ladder using the density-matrix renormalization group method. We focus on a parameter regime in which the noninteracting electronic system has a narrow indirect band gap. In this regime, there is no Fermi surface, and the conventional Fermi-surface-based Ruderman-Kittel-Kasuya-Yosida picture is not directly applicable; magnetic corr", "abstract": "We investigate magnetic correlations in the two-leg Kondo-Hubbard ladder using the density-matrix renormalization group method. We focus on a parameter regime in which the noninteracting electronic system has a narrow indirect band gap. In this regime, there is no Fermi surface, and the conventional Fermi-surface-based Ruderman-Kittel-Kasuya-Yosida picture is not directly applicable; magnetic correlations between localized spins become weaker as the noninteracting band gap increases. We find that a moderate on-site Coulomb interaction enhances the antiferromagnetic correlations between localized spins. This enhancement, which is also seen in the staggered magnetization induced by a pinning field at the edges, occurs for both ferromagnetic and antiferromagnetic Kondo couplings. Our results show that electron-electron interactions can enhance magnetic correlations between localized spins even when the underlying noninteracting electronic structure is gapped, suggesting an interaction-driven route to magnetic instabilities in narrow-gap Kondo-lattice systems.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2511-19389", "arxiv_id": "2511.19389", "type": "arXiv", "journal": "Phys. Rev. B 114, 225131 (2026)", "journal_ref": "Phys. Rev. B 114, 225131 (2026)", "title": "Kondo screening and random-singlet formation in highly disordered systems", "authors": "Lucas G. Rabelo, Igor C. Almeida, Eduardo Miranda et al.", "corresponding": "", "url": "https://arxiv.org/abs/2511.19389", "topic": "Magnetism", "level": "Brief", "summary_en": "We introduce a minimal effective framework designed to address the anomalous low-temperature thermodynamics observed in strongly disordered interacting systems near a metal-insulator transition, such as doped semiconductors. Our approach examines how a strongly inhomogeneous electronic bath quenches dilute pairs of local magnetic moments. By solving the resulting two-impurity Kondo-Heisenberg prob", "summary": "We introduce a minimal effective framework designed to address the anomalous low-temperature thermodynamics observed in strongly disordered interacting systems near a metal-insulator transition, such as doped semiconductors. Our approach examines how a strongly inhomogeneous electronic bath quenches dilute pairs of local magnetic moments. By solving the resulting two-impurity Kondo-Heisenberg prob", "abstract": "We introduce a minimal effective framework designed to address the anomalous low-temperature thermodynamics observed in strongly disordered interacting systems near a metal-insulator transition, such as doped semiconductors. Our approach examines how a strongly inhomogeneous electronic bath quenches dilute pairs of local magnetic moments. By solving the resulting two-impurity Kondo-Heisenberg problem within a large-$\\mathcal{N}$ variational framework, we capture the competition between Kondo screening and random-singlet formation. Both mechanisms give rise to singular thermodynamic responses, producing a magnetic susceptibility of the form $χ(T)\\sim T^{-α}$, where the exponent $α$ evolves smoothly with model parameters and saturates in the metallic regime, consistent with experimental observations. Our results establish a unified framework that connects random-singlet physics and disorder-induced Kondo screening in strongly disordered correlated materials.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2607-07630", "arxiv_id": "2607.07630", "type": "arXiv", "journal": "arXiv:2607.07630", "journal_ref": "", "title": "Lattice dynamics and structural correlations in antiferromagnet SrLaCoNbO$_6$ double perovskite", "authors": "Ajay Kumar, Clemens Ulrich, Rajendra S. Dhaka", "corresponding": "", "url": "https://arxiv.org/abs/2607.07630", "topic": "Magnetism", "level": "Brief", "summary_en": "We report a detailed temperature-dependent Raman spectroscopy and Co $K$-edge extended x-ray absorption fine structure (EXAFS) study of the insulating antiferromagnetic double perovskite SrLaCoNbO$_6$. Interestingly, pronounced changes in the phonon frequencies, linewidths, and intensities are observed around 60~K, well above the long-range antiferromagnetic ordering temperature, $T_{\\rm N} \\appro", "summary": "We report a detailed temperature-dependent Raman spectroscopy and Co $K$-edge extended x-ray absorption fine structure (EXAFS) study of the insulating antiferromagnetic double perovskite SrLaCoNbO$_6$. Interestingly, pronounced changes in the phonon frequencies, linewidths, and intensities are observed around 60~K, well above the long-range antiferromagnetic ordering temperature, $T_{\\rm N} \\appro", "abstract": "We report a detailed temperature-dependent Raman spectroscopy and Co $K$-edge extended x-ray absorption fine structure (EXAFS) study of the insulating antiferromagnetic double perovskite SrLaCoNbO$_6$. Interestingly, pronounced changes in the phonon frequencies, linewidths, and intensities are observed around 60~K, well above the long-range antiferromagnetic ordering temperature, $T_{\\rm N} \\approx 15$~K. These anomalies indicate a modification of the lattice dynamics that may involve local structural distortions, short-range magnetic correlations, or an interplay between them. Additional changes in both high- and low-energy Raman modes are detected near 160--180~K via variations in phonon intensities and linewidths, together with changes in the Fano asymmetry of selected low-energy modes. The asymmetric line shapes of these modes are well described phenomenologically by Fano profiles and indicate coupling of the discrete phonons to an underlying continuum, whose possible microscopic origins are discussed. Moreover, the EXAFS analysis reveals correlated changes in bond distances and Debye--Waller factors around the Co ions near 60~K and 160~K, indicating subtle local structural distortions at temperatures corresponding to the Raman anomalies. The combined Raman and EXAFS results therefore demonstrate a close correlation between anomalous lattice dynamics and local structural evolution in SrLaCoNbO$_6$.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2605-21284", "arxiv_id": "2605.21284", "type": "arXiv", "journal": "Physical Review B (2026)", "journal_ref": "Physical Review B (2026)", "title": "Ligand-mediated Origin of Altermagnetic Spin-Splitting", "authors": "Luigi Camerano, Federico Bisti, Gianni Profeta", "corresponding": "", "url": "https://arxiv.org/abs/2605.21284", "topic": "Magnetism", "level": "Brief", "summary_en": "Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitt", "summary": "Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitt", "abstract": "Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitting in the $g$-wave altermagnet Co$_{1/4}$NbSe$_2$. We show that the splitting is captured by a short-range tight-binding model, establishing its local origin. By selectively controlling hopping channels, we demonstrate that the dominant contribution arises not from direct magnetic-ion hopping, but from ligand-mediated hybridization that transfers anisotropy to itinerant states. This identifies ligand-assisted coupling as the key mechanism of altermagnetic spin splitting and provides a microscopic bridge between minimal models and symmetry guided first-principles material searches, enabling real-space design of altermagnetic functionality.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30260", "arxiv_id": "2610.30260", "type": "arXiv", "journal": "arXiv:2610.30260", "journal_ref": "", "title": "Maxwell-Chern-Simons-Matter in AdS$_3$", "authors": "Dean Carmi, Riccardo Ciccone", "corresponding": "", "url": "https://arxiv.org/abs/2610.30260", "topic": "Magnetism", "level": "Brief", "summary_en": "We study Maxwell-Chern-Simons theory on AdS$_3$ coupled to $N$ complex scalars or Dirac fermions, including sextic and Gross-Neveu interactions, respectively. First, we derive the bulk Maxwell-Chern-Simons propagator, clarifying how Dirichlet boundary conditions fix the contributions of the massive and flat sectors. Upon coupling to the matter sector, we work at large $N$ with $κ=k/N$ and $α=Ne^2$", "summary": "We study Maxwell-Chern-Simons theory on AdS$_3$ coupled to $N$ complex scalars or Dirac fermions, including sextic and Gross-Neveu interactions, respectively. First, we derive the bulk Maxwell-Chern-Simons propagator, clarifying how Dirichlet boundary conditions fix the contributions of the massive and flat sectors. Upon coupling to the matter sector, we work at large $N$ with $κ=k/N$ and $α=Ne^2$", "abstract": "We study Maxwell-Chern-Simons theory on AdS$_3$ coupled to $N$ complex scalars or Dirac fermions, including sextic and Gross-Neveu interactions, respectively. First, we derive the bulk Maxwell-Chern-Simons propagator, clarifying how Dirichlet boundary conditions fix the contributions of the massive and flat sectors. Upon coupling to the matter sector, we work at large $N$ with $κ=k/N$ and $α=Ne^2$ fixed, where $k$ is the Chern-Simons level. We determine the corresponding phase diagrams, and we resum matter insertions to obtain the photon propagator at leading order in large $N$, exactly in $α$ and $κ$. Its poles determine the spin-one boundary spectrum, split into two helicity sectors by the Chern-Simons interaction. With Dirichlet boundary conditions, the unHiggsed scalar phase contains a protected chiral current, which is lifted by Higgsing. In the fermionic phases, the current persists for nonzero effective Chern-Simons level, with helicity determined by the induced level shift. At bulk conformal points, we extract large-$N$ BCFT data for the critical and tricritical scalar theories, as well as for the regular fermion and Gross-Neveu theories.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31206", "arxiv_id": "2610.31206", "type": "arXiv", "journal": "arXiv:2610.31206", "journal_ref": "", "title": "Mn-deficient Ni-Mn-Ga alloys: phase transitions, magnetic properties, and disappearance of martensitic transformation", "authors": "Valentina Moskvina, Jaroslav Čapek, Michal Rameš et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.31206", "topic": "Magnetism", "level": "Brief", "summary_en": "Composition gradients formed during directional solidification are generally considered undesirable in Ni-Mn-Ga magnetic shape-memory alloys. However, these gradients offer a highly effective platform for systematically investigating composition-property relationships under identical growth and heat-treatment conditions. To exploit this approach, one Mn-deficient and two near-stoichiometric Ni-Mn-", "summary": "Composition gradients formed during directional solidification are generally considered undesirable in Ni-Mn-Ga magnetic shape-memory alloys. However, these gradients offer a highly effective platform for systematically investigating composition-property relationships under identical growth and heat-treatment conditions. To exploit this approach, one Mn-deficient and two near-stoichiometric Ni-Mn-", "abstract": "Composition gradients formed during directional solidification are generally considered undesirable in Ni-Mn-Ga magnetic shape-memory alloys. However, these gradients offer a highly effective platform for systematically investigating composition-property relationships under identical growth and heat-treatment conditions. To exploit this approach, one Mn-deficient and two near-stoichiometric Ni-Mn-Ga oligocrystals were grown by optical zone remelting and characterized by X-ray fluorescence mapping, optical microscopy, X-ray diffraction, low-field magnetic measurements, and vibrating-sample magnetometry. The ingots contained elongated grains and axial compositional gradients, primarily associated with the redistribution of Mn and Ga, whereas Ni remained relatively uniformly distributed. The martensitic and premartensitic transformation temperatures generally increased with increasing Mn content. Neither transformation was detected between 10 and 400 K in specimens containing 20.5-22.0 at.% Mn, all of which had $e/a < 7.40$. In contrast, both transformations were observed in the investigated specimens containing at least 22.1 at.% ($e/a \\geq 7.46$). This abrupt change may indicate a possible electron-concentration threshold for the occurrence of these transformations. Saturation magnetization increased with Mn content up to 25.8 at.%, reaching 96.9 A m$^2$/kg at 10 K and 71.2 A m$^2$/kg at 300 K. Post-growth annealing increased the transition temperatures and changed the low-field magnetic response. The results indicate that composition-gradient oligocrystals serve as an effective platform for investigating the relationships between composition, structure, and magnetic properties in Ni-Mn-Ga alloys with the same processing history.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30251", "arxiv_id": "2610.30251", "type": "arXiv", "journal": "arXiv:2610.30251", "journal_ref": "", "title": "Nature of the bosonic edge phase in a double quantum spin Hall insulator", "authors": "Andreas Feuerpfeil, Ronny Thomale, Trithep Devakul et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30251", "topic": "Magnetism", "level": "Brief", "summary_en": "Field-theoretic analysis has predicted that the edge of a double quantum spin Hall insulator (DQSHI) can undergo an interaction-driven transition from a phase with fermionic edge modes into one with only bosonic modes. All single-fermion edge excitations are gapped in this bosonic edge phase, but fermion pairs remain gapless, leading to distinct experimental signatures. We numerically simulate the", "summary": "Field-theoretic analysis has predicted that the edge of a double quantum spin Hall insulator (DQSHI) can undergo an interaction-driven transition from a phase with fermionic edge modes into one with only bosonic modes. All single-fermion edge excitations are gapped in this bosonic edge phase, but fermion pairs remain gapless, leading to distinct experimental signatures. We numerically simulate the", "abstract": "Field-theoretic analysis has predicted that the edge of a double quantum spin Hall insulator (DQSHI) can undergo an interaction-driven transition from a phase with fermionic edge modes into one with only bosonic modes. All single-fermion edge excitations are gapped in this bosonic edge phase, but fermion pairs remain gapless, leading to distinct experimental signatures. We numerically simulate the interacting DQSHI edge and verify the existence of the bosonic edge phase. This calculation requires an explicit bulk embedding of the DQSHI edge, due to its mixed anomaly between charge and $S^z$ conservation. We hence employ segment DMRG on an infinite two-dimensional cylinder, where the DQSHI bulk is modeled in terms of two copies of the spin-up lowest Landau level, combined with their time-reversed counterparts. We find that interactions can open a single-fermion gap at the DQSHI edge while fermion pairs remain gapless, matching the predictions for the bosonic edge phase. We find the scaling of the single-fermion gap with interaction strength to be consistent with field-theoretic calculations, and discuss the relevance of the bosonic edge phase to twisted homobilayers of WSe$_2$ and MoTe$_2$. We elaborate on the methodological extension of the segment geometry used here to other topological phases with edge anomalies.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30403", "arxiv_id": "2610.30403", "type": "arXiv", "journal": "arXiv:2610.30403", "journal_ref": "", "title": "Nonlinear Canonical Transformations for Studying Spin-1/2 Hamiltonians", "authors": "Swarnamoy Ghosh, Thomas M. Henderson, Gustavo E. Scuseria", "corresponding": "", "url": "https://arxiv.org/abs/2610.30403", "topic": "Magnetism", "level": "Brief", "summary_en": "Strongly correlated quantum systems, including frustrated spin lattices, remain challenging for conventional coupled-cluster methods because their ground states often exhibit strong multireference character and symmetry breaking. Although multireference and symmetry-projected coupled-cluster theories are promising, they are not yet black-box methods and require system-specific development. The XXZ", "summary": "Strongly correlated quantum systems, including frustrated spin lattices, remain challenging for conventional coupled-cluster methods because their ground states often exhibit strong multireference character and symmetry breaking. Although multireference and symmetry-projected coupled-cluster theories are promising, they are not yet black-box methods and require system-specific development. The XXZ", "abstract": "Strongly correlated quantum systems, including frustrated spin lattices, remain challenging for conventional coupled-cluster methods because their ground states often exhibit strong multireference character and symmetry breaking. Although multireference and symmetry-projected coupled-cluster theories are promising, they are not yet black-box methods and require system-specific development. The XXZ and $J_1$-$J_2$ spin models provide demanding benchmarks. Spin-BCS-based coupled-cluster methods may require high excitation ranks to recover the exact ground-state physics in strongly correlated regimes. We introduce a nonlinear spin-fermion-spin (SFS) transformation designed to map a strongly correlated spin Hamiltonian into a new spin Hamiltonian whose ground state is more accurately described at the mean-field level. For a representative SFS transformation, we identify a compact Clifford circuit that maps transformed product states to circuit-dressed, generally entangled states in the original representation. The transformed Hamiltonian can then be treated using broken-symmetry mean-field theory and post-mean-field methods. Benchmarks for the XXZ and $J_1$-$J_2$ Hamiltonians show that spin mean-field theory in the transformed representation reduces the energy error relative to conventional spin-BCS mean field. The spin-BCS-based coupled-cluster calculations for the one-dimensional XXZ model provide substantially improved accuracy relative to the corresponding untransformed methods. In 2D, the accuracy of the transformed mean-field solutions depends on the site ordering and boundary conditions, as nonlocal strings can appear. These results show that exact transformations of operator representations can serve as many-body preconditioners for mean-field and low-rank coupled-cluster approximations to strongly correlated spin systems.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30414", "arxiv_id": "2610.30414", "type": "arXiv", "journal": "arXiv:2610.30414", "journal_ref": "", "title": "Nonlinear and Chaotic Dynamics of Two Dipolar-Coupled Anisotropic Spins under Periodic Excitation", "authors": "Manish Anand", "corresponding": "", "url": "https://arxiv.org/abs/2610.30414", "topic": "Magnetism", "level": "Brief", "summary_en": "We investigate the non-linear magnetization dynamics of two identical anisotropic macrospins coupled by dipolar interaction and subjected to periodic transverse excitation. The coupled Landau- Lifshitz-Gilbert equations are solved numerically using a fourth-order Runge-Kutta method. By combining bifurcation diagrams, local-maxima analysis, Lyapunov exponents, and two-dimensional stability maps, we", "summary": "We investigate the non-linear magnetization dynamics of two identical anisotropic macrospins coupled by dipolar interaction and subjected to periodic transverse excitation. The coupled Landau- Lifshitz-Gilbert equations are solved numerically using a fourth-order Runge-Kutta method. By combining bifurcation diagrams, local-maxima analysis, Lyapunov exponents, and two-dimensional stability maps, we", "abstract": "We investigate the non-linear magnetization dynamics of two identical anisotropic macrospins coupled by dipolar interaction and subjected to periodic transverse excitation. The coupled Landau- Lifshitz-Gilbert equations are solved numerically using a fourth-order Runge-Kutta method. By combining bifurcation diagrams, local-maxima analysis, Lyapunov exponents, and two-dimensional stability maps, we characterize how dipolar coupling, transverse driving amplitudes, and uniaxial anisotropy govern the long-time dynamics. The results reveal a non-monotonic reorganization of dynamical regimes, with alternating intervals of enhanced and suppressed instability. Analysis of symmetric and antisymmetric coordinates distinguishes the collective and relative spin responses, while Fourier spectra and three-dimensional trajectories provide complementary frequency-domain and geometrical characterizations. Simultaneous positivity of the two largest Lyapunov exponents identifies parameter regions consistent with hyperchaotic dynamics. Finally, analytical linearization and ferromagnetic-resonance calculations reveal the distinct coupling dependence of the collectivemode frequencies and clarify the limitations of the linearized description beyond the stability thresholds of the collinear reference state. These findings establish a unified framework for understanding the interplay of dipolar coupling, anisotropy, and periodic excitation in the non-linear dynamics of a minimal interacting-spin system.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2605-23848", "arxiv_id": "2605.23848", "type": "arXiv", "journal": "arXiv:2605.23848", "journal_ref": "", "title": "On the Ising/tricritical-Ising interface: From ${W}_3$ symmetry to Rydberg atoms", "authors": "António Antunes, Junchen Rong", "corresponding": "", "url": "https://arxiv.org/abs/2605.23848", "topic": "Magnetism", "level": "Brief", "summary_en": "We consider interfaces between critical spin-chains in different universality classes, described in the continuum limit by defect/interface conformal field theory (DCFT/ICFT). We focus on a conformal interface between the Tricritical Ising (TIM) and the Ising CFT exploring the possibility of its experimental realizations in the context of Rydberg atom arrays. Our analysis emphasizes non-invertible", "summary": "We consider interfaces between critical spin-chains in different universality classes, described in the continuum limit by defect/interface conformal field theory (DCFT/ICFT). We focus on a conformal interface between the Tricritical Ising (TIM) and the Ising CFT exploring the possibility of its experimental realizations in the context of Rydberg atom arrays. Our analysis emphasizes non-invertible", "abstract": "We consider interfaces between critical spin-chains in different universality classes, described in the continuum limit by defect/interface conformal field theory (DCFT/ICFT). We focus on a conformal interface between the Tricritical Ising (TIM) and the Ising CFT exploring the possibility of its experimental realizations in the context of Rydberg atom arrays. Our analysis emphasizes non-invertible symmetries and consistency under modular transformations, and uses defect couplings and the defect spectrum -- including in the case of mixed boundary conditions -- to make sharp experimental predictions. The structure of the observables hinges on a newly discovered pattern of emergent ${W}_3$ chiral symmetry for the Tricritical-Ising/Ising interface.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31390", "arxiv_id": "2610.31390", "type": "arXiv", "journal": "arXiv:2610.31390", "journal_ref": "", "title": "Orbital-coherence memory in electrical transport and its self-consistent Maxwell response", "authors": "Pengfei Zhu", "corresponding": "", "url": "https://arxiv.org/abs/2610.31390", "topic": "Magnetism", "level": "Brief", "summary_en": "An internal electronic coherence changes electrical transport only when it feeds back on the physical current. We develop a reduced description of this feedback and distinguish its exact consequences from the assumptions required for a microscopic realization. An opposite-parity two-orbital Hamiltonian identifies a current-coupled orbital force. Under an explicitly stated moment closure and collis", "summary": "An internal electronic coherence changes electrical transport only when it feeds back on the physical current. We develop a reduced description of this feedback and distinguish its exact consequences from the assumptions required for a microscopic realization. An opposite-parity two-orbital Hamiltonian identifies a current-coupled orbital force. Under an explicitly stated moment closure and collis", "abstract": "An internal electronic coherence changes electrical transport only when it feeds back on the physical current. We develop a reduced description of this feedback and distinguish its exact consequences from the assumptions required for a microscopic realization. An opposite-parity two-orbital Hamiltonian identifies a current-coupled orbital force. Under an explicitly stated moment closure and collision ansatz, it yields a passive three-state response with an exponentially damped oscillatory memory. The resulting conductivity redistributes a fixed optical weight and predicts a nonmonotonic dependence of dc conduction on coherence damping at fixed remaining parameters. The orbital reduction constrains the coupling and internal frequency through a shared bare splitting, providing a test beyond unconstrained spectral fitting. A charge-conserving spatial extension couples to Maxwell equations through a positive energy balance and separates the constitutive response from longitudinal collective and transverse electromagnetic modes. We formulate complex-conductivity and transmission tests, including the limits of parameter identification over a finite bandwidth. The model supplies a conditional connection between orbital dynamics, transport memory, and electromagnetic observables; conductivity alone does not establish a uniquely quantum mechanism, and a material-specific collision calculation and closure-error assessment remain necessary.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2607-10757", "arxiv_id": "2607.10757", "type": "arXiv", "journal": "arXiv:2607.10757", "journal_ref": "", "title": "Parity-driven RKKY decoupling and anomalous $1/R$ Dzyaloshinskii-Moriya interaction in odd-parity magnets", "authors": "Morteza Salehi, Tohid Farajollahpour", "corresponding": "", "url": "https://arxiv.org/abs/2607.10757", "topic": "Magnetism", "level": "Brief", "summary_en": "Unconventional odd-parity magnets, characterized by an odd-parity momentum-dependent spin splitting, offer a fundamentally distinct paradigm for non-collinear spintronics. Here, we theoretically investigate the Ruderman-Kittel-Kasuya-Yosida indirect exchange in two-dimensional odd-parity magnets subjected to Rashba spin-orbit coupling. Using an analytical real-space Green's function formalism, we ", "summary": "Unconventional odd-parity magnets, characterized by an odd-parity momentum-dependent spin splitting, offer a fundamentally distinct paradigm for non-collinear spintronics. Here, we theoretically investigate the Ruderman-Kittel-Kasuya-Yosida indirect exchange in two-dimensional odd-parity magnets subjected to Rashba spin-orbit coupling. Using an analytical real-space Green's function formalism, we ", "abstract": "Unconventional odd-parity magnets, characterized by an odd-parity momentum-dependent spin splitting, offer a fundamentally distinct paradigm for non-collinear spintronics. Here, we theoretically investigate the Ruderman-Kittel-Kasuya-Yosida indirect exchange in two-dimensional odd-parity magnets subjected to Rashba spin-orbit coupling. Using an analytical real-space Green's function formalism, we uncover a parity-driven spatial decoupling in the magnetic response. Because of the odd-parity exchange field, the out-of-plane Ising interaction is structurally insulated from the macroscopic magnetic modulation, oscillating isotropically at the shifted Fermi wavevector. Conversely, the in-plane Heisenberg components exhibit pronounced, directionally tunable spatial beating. Beyond collinear exchange, the hybridized bands generate a highly tunable, three-component Dzyaloshinskii-Moriya interaction alongside symmetric off-diagonal anisotropies. We reveal that the out-of-plane chiral twisting is driven by the massive, nonrelativistic momentum shift, while the in-plane chiral components are relativistic. Furthermore, the competition between the nodal geometry and the Rashba gap drives an anomalous, dimension-reducing crossover, in which the in-plane chiral components follow a 1D-like $1/R$ spatial decay along the nodal lines over an extended intermediate-distance window before ultimately recovering the conventional 2D $1/R^2$ asymptote. We demonstrate that these findings hold universally across the odd-parity class by explicitly generalizing our framework to $f$-wave magnets. Finally, numerical tight-binding calculations verify the striking robustness of this parity-driven decoupling against both scalar and random magnetic exchange disorder. These findings establish odd-parity magnets as promising platforms for engineering robust, directionally tunable non-collinear spin textures.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30929", "arxiv_id": "2610.30929", "type": "arXiv", "journal": "arXiv:2610.30929", "journal_ref": "", "title": "Piezo-Kerr effect in altermagnets and noncollinear antiferromagnets", "authors": "Yuqi Liu, Qiu-Shi Huang, Xinfeng Chen et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30929", "topic": "Magnetism", "level": "Brief", "summary_en": "Symmetry is usually viewed as a constraint on physical responses, but it can also be used to design the fields that control them. Here, we adopt the representation-matching principle used to identify conjugate fields of order parameters and apply it to response tensors. A linear coupling, the key ingredient for sign-switching control, is symmetry-allowed when a component (or a combination of compo", "summary": "Symmetry is usually viewed as a constraint on physical responses, but it can also be used to design the fields that control them. Here, we adopt the representation-matching principle used to identify conjugate fields of order parameters and apply it to response tensors. A linear coupling, the key ingredient for sign-switching control, is symmetry-allowed when a component (or a combination of compo", "abstract": "Symmetry is usually viewed as a constraint on physical responses, but it can also be used to design the fields that control them. Here, we adopt the representation-matching principle used to identify conjugate fields of order parameters and apply it to response tensors. A linear coupling, the key ingredient for sign-switching control, is symmetry-allowed when a component (or a combination of components) of the control field and the selected response component share the same irreducible representation of the magnetic point group (MPG) of the system. Applied to the magneto-optical Kerr effect, this principle yields a piezo-Kerr effect, in which specific strain combinations activate a Kerr response forbidden in the unstrained state. Enumerating all 122 MPGs, we identify 16 groups in which the unstrained Kerr response is forbidden while a linear strain-induced contribution is allowed. These groups are realized by altermagnets and noncollinear antiferromagnets with symmetry-enforced vanishing net magnetization. The active strain channels and the associated first-order sign reversals follow directly from symmetry. First-principles calculations for bulk MnTe$_{2}$ and CoF$_{2}$, and Cr$_{2}$Se$_{2}$O and Cr$_{2}$Te$_{2}$O monolayers confirm these predictions. In these materials, the Kerr rotation vanishes without strain, whereas 0.5-3% strain produces rotations ranging from tens to hundreds of millidegrees, and reversing the matched strain channel reverses the Kerr sign. These results establish a general route to large and switchable Kerr responses emerging from symmetry-forbidden states in compensated magnets.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2505-02911", "arxiv_id": "2505.02911", "type": "arXiv", "journal": "J.H.Cullen, D.P.Arovas, R.Raimondi, and D.Culcer, (2026). Advances in Physics, 1-26", "journal_ref": "J.H.Cullen, D.P.Arovas, R.Raimondi, and D.Culcer, (2026). Advances in Physics, 1-26", "title": "Quantum geometry and quantum capacitance in the orbital magneto-electric effect", "authors": "James H. Cullen, Daniel P. Arovas, Roberto Raimondi et al.", "corresponding": "", "url": "https://arxiv.org/abs/2505.02911", "topic": "Magnetism", "level": "Brief", "summary_en": "The orbital magneto-electric effect (OME), the generation of a steady-state orbital angular momentum (OAM) density by an electric field, is a central component of orbitronics. Nevertheless its microscopic interpretation is complicated by the existence of two qualitatively different contributions: the intra-band Edelstein term stemming from the combined effect of the equilibrium OAM and Fermi surfa", "summary": "The orbital magneto-electric effect (OME), the generation of a steady-state orbital angular momentum (OAM) density by an electric field, is a central component of orbitronics. Nevertheless its microscopic interpretation is complicated by the existence of two qualitatively different contributions: the intra-band Edelstein term stemming from the combined effect of the equilibrium OAM and Fermi surfa", "abstract": "The orbital magneto-electric effect (OME), the generation of a steady-state orbital angular momentum (OAM) density by an electric field, is a central component of orbitronics. Nevertheless its microscopic interpretation is complicated by the existence of two qualitatively different contributions: the intra-band Edelstein term stemming from the combined effect of the equilibrium OAM and Fermi surface shift, and the inter-band contribution, stemming from Zitterbewegung induced by the electric field. Here we develop a pedagogical density-matrix formulation of the OME within the framework of the modern theory of Bloch-electron OAM, in which the two contributions naturally emerge from distinct parts of the density matrix, and their distinct quantum geometric structures are clearly seen. In the inter-band contribution, in addition to the local- and itinerant-circulation terms, we show that a band-diagonal displacement, or charge dipole, is present, which is linear in the electric field and governed by the normalized quantum metric. For a tilted massive Dirac cone the Zitterbewegung OME and the Fermi-surface orbital response occur for orthogonal electric-field orientations, providing a route to separate them experimentally. The itinerant-circulation contribution is identical to the dipolar one, so in a two-band model the dipole accounts for exactly half of the inter-band response, both in the doped regime and in the insulating gap. Our recent insights identify quantum-metric engineering as a route for enhancing orbital magneto-electric responses and clarify the relation between modern orbital magnetization, polarization, and orbital torque phenomenology.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2403-04572", "arxiv_id": "2403.04572", "type": "arXiv", "journal": "arXiv:2403.04572", "journal_ref": "", "title": "Quantum theory of molecular orientation", "authors": "Victor V. Albert, Eric Kubischta, Mikhail Lemeshko et al.", "corresponding": "", "url": "https://arxiv.org/abs/2403.04572", "topic": "Magnetism", "level": "Brief", "summary_en": "We formulate a quantum phase space for rotational and nuclear-spin states of rigid molecules. For each nuclear spin isomer, we re-derive the isomer's admissible angular momentum states from molecular geometry and nuclear-spin data, introduce its angular position states using quantization theory, and develop a generalized Fourier transform converting between the two. We classify molecules into thre", "summary": "We formulate a quantum phase space for rotational and nuclear-spin states of rigid molecules. For each nuclear spin isomer, we re-derive the isomer's admissible angular momentum states from molecular geometry and nuclear-spin data, introduce its angular position states using quantization theory, and develop a generalized Fourier transform converting between the two. We classify molecules into thre", "abstract": "We formulate a quantum phase space for rotational and nuclear-spin states of rigid molecules. For each nuclear spin isomer, we re-derive the isomer's admissible angular momentum states from molecular geometry and nuclear-spin data, introduce its angular position states using quantization theory, and develop a generalized Fourier transform converting between the two. We classify molecules into three types -- asymmetric, rotationally symmetric, and perrotationally symmetric -- with the last type having no macroscopic analogue due to nuclear-spin statistics constraints. We discuss two general features in perrotationally symmetric state spaces that are Hamiltonian-independent and induced solely by symmetry and spin statistics. First, we quantify when and how an isomer's state space is completely rotation-spin entangled, meaning that it does not admit any separable states. Second, we identify isomers whose position states house an internal pseudo-spin or \"fiber\" degree of freedom, and the fiber's Berry phase or matrix after adiabatic changes in position yields naturally robust operations, akin to braiding anyonic quasiparticles or realizing fault-tolerant quantum gates. We outline how the fiber can be used as a quantum error-correcting code and discuss scenarios where these features can be experimentally probed", "method": "", "result": "", "future": ""}, {"id": "arxiv-2404-15651", "arxiv_id": "2404.15651", "type": "arXiv", "journal": "arXiv:2404.15651", "journal_ref": "", "title": "Sampling from Spherical Spin Glasses in Total Variation via Algorithmic Stochastic Localization", "authors": "Brice Huang, Andrea Montanari, Huy Tuan Pham", "corresponding": "", "url": "https://arxiv.org/abs/2404.15651", "topic": "Magnetism", "level": "Brief", "summary_en": "We consider the problem of algorithmically sampling from the Gibbs measure of a mixed $p$-spin spherical spin glass. We give a polynomial-time algorithm that samples from the Gibbs measure up to vanishing total variation error, for any model whose mixture satisfies $$ ξ''(s) < \\frac{1}{(1-s)^2}, \\qquad \\forall s\\in [0,1). $$ Our algorithm follows the algorithmic stochastic localization (SL) approa", "summary": "We consider the problem of algorithmically sampling from the Gibbs measure of a mixed $p$-spin spherical spin glass. We give a polynomial-time algorithm that samples from the Gibbs measure up to vanishing total variation error, for any model whose mixture satisfies $$ ξ''(s) < \\frac{1}{(1-s)^2}, \\qquad \\forall s\\in [0,1). $$ Our algorithm follows the algorithmic stochastic localization (SL) approa", "abstract": "We consider the problem of algorithmically sampling from the Gibbs measure of a mixed $p$-spin spherical spin glass. We give a polynomial-time algorithm that samples from the Gibbs measure up to vanishing total variation error, for any model whose mixture satisfies $$ ξ''(s) < \\frac{1}{(1-s)^2}, \\qquad \\forall s\\in [0,1). $$ Our algorithm follows the algorithmic stochastic localization (SL) approach introduced in (Alaoui, Montanari, Sellke, 2022) and in fact achieves a more difficult task. Namely, it (approximately) generates a sample path $({\\boldsymbol y}_t)_{t\\ge 0}$ from the SL process. For large $T$, ${\\boldsymbol y}_T/T$ is an approximate sample from the target Gibbs measure, and hence we solve the original problem as a special case. We provide evidence that the condition $ξ''(s) < (1-s)^{-2}$ is sharp for the task of sampling SL sample paths. Furthermore, we prove that it is optimal within a class of generalized SL processes. Remarkably this threshold is close to the conjectured threshold for sampling from the original Gibbs measure. In particular, for the pure $p$-spin glasses it is within an absolute ($p$-independent) constant of the so-called shattering phase transition. Earlier work on related models was suboptimal by a factor diverging polynomially in $p$. A key step of this approach is to estimate the mean of a sequence of tilted measures. We produce an improved estimator for this task by identifying a suitable correction to the TAP fixed point selected by approximate message passing (AMP). As a consequence, we improve the algorithm's guarantee over previous work, from normalized Wasserstein to total variation error. In particular, the new algorithm and analysis open the way to perform inference about one-dimensional projections of the measure.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31508", "arxiv_id": "2610.31508", "type": "arXiv", "journal": "arXiv:2610.31508", "journal_ref": "", "title": "Spin-Dependent Transport in One-Dimensional Mercury- and Silver-Mediated DNA Nanowires", "authors": "Arpan De, William Livernois, Simon Vecchioni et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.31508", "topic": "Magnetism", "level": "Brief", "summary_en": "Metallo-DNA nanowires serve as a versatile, programmable scaffold for molecular-scale electronics. In this work, we demonstrate that periodic heavy-metal coordination fundamentally reshapes the electronic landscape of DNA, generating dispersive, metal-centered conduction bands rather than isolated localized states. Driven by enhanced inter-layer coupling, where second nearest-neighbor hopping play", "summary": "Metallo-DNA nanowires serve as a versatile, programmable scaffold for molecular-scale electronics. In this work, we demonstrate that periodic heavy-metal coordination fundamentally reshapes the electronic landscape of DNA, generating dispersive, metal-centered conduction bands rather than isolated localized states. Driven by enhanced inter-layer coupling, where second nearest-neighbor hopping play", "abstract": "Metallo-DNA nanowires serve as a versatile, programmable scaffold for molecular-scale electronics. In this work, we demonstrate that periodic heavy-metal coordination fundamentally reshapes the electronic landscape of DNA, generating dispersive, metal-centered conduction bands rather than isolated localized states. Driven by enhanced inter-layer coupling, where second nearest-neighbor hopping plays a crucial role: the conduction bandwidth can approach 1 eV, more than double that of canonical DNA. These broad bands suggest enhanced robustness of transport against structural fluctuations. As a result of relativistic effects, in these quasi-one-dimensional materials, spin-orbit (SO) coupling enhances band dispersion and governs spin-dependent transport. We predict that although ligand hybridization reduces atomic SO splitting, the effective SO splitting in these nanowires is comparable to the next-nearest-neighbor hopping strength, which results in considerable spin mixing. We find that Hg2+-coordinated nanowire exhibit pronounced spin-flip conductance comparable to spin-conserving conductance across the LUMO manifold. This efficient spin conversion remains robust over extended molecular lengths and is accompanied by a set of highly delocalized unoccupied states with oscillating nodal structures, readily accessible under low-bias transport measurements. In contrast, the Ag+-coordinated nanowires exhibit weak spin-flip scattering that is more than an order of magnitude smaller than spin-preserving transport. This duality establishes the choice of coordination metal as a decisive parameter to govern metal-metal interaction, electron delocalization, and spin-dependent transport. Overall, our findings demonstrate how relativistic effects and quantum confinement intersect in these bio-templated, quasi-one-dimensional molecular conductors.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2603-05478", "arxiv_id": "2603.05478", "type": "arXiv", "journal": "arXiv:2603.05478", "journal_ref": "", "title": "Spin-resolved microscopy of $^{87}$Sr SU($N$) Fermi-Hubbard systems", "authors": "Carlos Gas-Ferrer, Antonio Rubio-Abadal, Sandra Buob et al.", "corresponding": "", "url": "https://arxiv.org/abs/2603.05478", "topic": "Magnetism", "level": "Brief", "summary_en": "Quantum-gas microscopes provide direct access to the phases of the Hubbard model, bringing microscopic insight into the complex competition between interactions, SU(2) magnetism, and doping. Alkaline-earth(-like) fermions extend this spin-1/2 paradigm by realizing higher symmetries and giving access to SU($N$) Hubbard models, with rich phase diagrams to be unveiled. Despite its fundamental interes", "summary": "Quantum-gas microscopes provide direct access to the phases of the Hubbard model, bringing microscopic insight into the complex competition between interactions, SU(2) magnetism, and doping. Alkaline-earth(-like) fermions extend this spin-1/2 paradigm by realizing higher symmetries and giving access to SU($N$) Hubbard models, with rich phase diagrams to be unveiled. Despite its fundamental interes", "abstract": "Quantum-gas microscopes provide direct access to the phases of the Hubbard model, bringing microscopic insight into the complex competition between interactions, SU(2) magnetism, and doping. Alkaline-earth(-like) fermions extend this spin-1/2 paradigm by realizing higher symmetries and giving access to SU($N$) Hubbard models, with rich phase diagrams to be unveiled. Despite its fundamental interest, a microscopic exploration of SU($N$) quantum systems has remained elusive. Here we report the realization of a quantum-gas microscope for fermionic $^{87}$Sr. Our imaging scheme, based on cooling and fluorescence on the narrow intercombination line at 689 nm, enables spin-resolved single-atom detection. By implementing a spin-selective optical pumping protocol, we determine the occupation of each of the 10 spin states in a single experimental realization, a crucial capability for probing site-resolved magnetic correlations. We benchmark our method by observing single-particle Larmor precession across the full spin-9/2 ground-state manifold and use numerical simulations of SU($N$) Fermi-Hubbard chains, incorporating the measured detection fidelities, to demonstrate its capability to resolve many-body spin correlations. Our results establish $^{87}$Sr quantum-gas microscopy as a powerful approach to study exotic magnetism in the SU($N$) Fermi-Hubbard model, and provide a new detection tool for studies in quantum simulation, computation, and metrology.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30647", "arxiv_id": "2610.30647", "type": "arXiv", "journal": "arXiv:2610.30647", "journal_ref": "", "title": "String Order in Quench Dynamics as a Probe of Quantum Phase Transitions", "authors": "H. P. Zhang, Z. Song", "corresponding": "", "url": "https://arxiv.org/abs/2610.30647", "topic": "Magnetism", "level": "Brief", "summary_en": "We study the anisotropic XY chain in a transverse field by introducing a global string order parameter and examining its equilibrium behavior and its quench dynamics from a fully polarized initial state. The corresponding string operator is defined as the product of local projected spin operators over the entire chain. The nonequilibrium order parameter is the long-time average of the logarithm of", "summary": "We study the anisotropic XY chain in a transverse field by introducing a global string order parameter and examining its equilibrium behavior and its quench dynamics from a fully polarized initial state. The corresponding string operator is defined as the product of local projected spin operators over the entire chain. The nonequilibrium order parameter is the long-time average of the logarithm of", "abstract": "We study the anisotropic XY chain in a transverse field by introducing a global string order parameter and examining its equilibrium behavior and its quench dynamics from a fully polarized initial state. The corresponding string operator is defined as the product of local projected spin operators over the entire chain. The nonequilibrium order parameter is the long-time average of the logarithm of the string-operator expectation value per site after the quench.For the ground state, its field derivative is singular on the Ising critical lines; after the quench, the steady-state response also records the field boundaries and the anisotropy transition. We derive analytically the nonanalytic behavior of the order parameter at the quantum critical lines. Our results reveal a hidden nonlocal order underlying this paradigmatic model of conventional quantum phase transitions. They also connect measurable spin populations with equilibrium and dynamical topological structure.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2511-07402", "arxiv_id": "2511.07402", "type": "arXiv", "journal": "arXiv:2511.07402", "journal_ref": "", "title": "The ideal limit of rhombohedral graphene: Dynamical skyrmion lattices and their excitations", "authors": "Tixuan Tan, Patrick J. Ledwith, Trithep Devakul", "corresponding": "", "url": "https://arxiv.org/abs/2511.07402", "topic": "Magnetism", "level": "Brief", "summary_en": "We introduce an interacting ideal limit of rhombohedral graphene in which interactions spontaneously generate a correlated Chern insulator. Our analysis reveals that this Chern insulator can be understood as a layer-pseudospin skyrmion lattice stabilized by electronic interactions, and that it gives rise to genuine skyrmion lattice physics, complete with dynamics. This dynamical skyrmion lattice n", "summary": "We introduce an interacting ideal limit of rhombohedral graphene in which interactions spontaneously generate a correlated Chern insulator. Our analysis reveals that this Chern insulator can be understood as a layer-pseudospin skyrmion lattice stabilized by electronic interactions, and that it gives rise to genuine skyrmion lattice physics, complete with dynamics. This dynamical skyrmion lattice n", "abstract": "We introduce an interacting ideal limit of rhombohedral graphene in which interactions spontaneously generate a correlated Chern insulator. Our analysis reveals that this Chern insulator can be understood as a layer-pseudospin skyrmion lattice stabilized by electronic interactions, and that it gives rise to genuine skyrmion lattice physics, complete with dynamics. This dynamical skyrmion lattice naturally leads to experimentally measurable consequences. In particular, we identify new collective excitations corresponding to chiral shape deformations of the skyrmions, and propose a new positively charged quasiparticle, the skyrmion vacancy. These results establish a qualitatively new form of moiré Chern physics in rhombohedral graphene: an interaction-generated skyrmion lattice whose skyrmions are dynamical low-energy degrees of freedom.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30686", "arxiv_id": "2610.30686", "type": "arXiv", "journal": "arXiv:2610.30686", "journal_ref": "", "title": "Time-reversal-based quantum metrology in a central-spin architecture: from SATIN to butterfly echo", "authors": "Aditya Kumar, Sayan Choudhury", "corresponding": "", "url": "https://arxiv.org/abs/2610.30686", "topic": "Magnetism", "level": "Brief", "summary_en": "We investigate quantum-enhanced time-reversal-based metrology using the central spin model, in which a single ancilla spin of magnitude $S_{\\rm cen}$ mediates interactions between $N$ bath spins through a star-graph topology. We demonstrate that the SATIN (Signal Amplification Through Time-reversal Interaction) echo protocol can be implemented in this setup to achieve a Fisher information of $N^2/", "summary": "We investigate quantum-enhanced time-reversal-based metrology using the central spin model, in which a single ancilla spin of magnitude $S_{\\rm cen}$ mediates interactions between $N$ bath spins through a star-graph topology. We demonstrate that the SATIN (Signal Amplification Through Time-reversal Interaction) echo protocol can be implemented in this setup to achieve a Fisher information of $N^2/", "abstract": "We investigate quantum-enhanced time-reversal-based metrology using the central spin model, in which a single ancilla spin of magnitude $S_{\\rm cen}$ mediates interactions between $N$ bath spins through a star-graph topology. We demonstrate that the SATIN (Signal Amplification Through Time-reversal Interaction) echo protocol can be implemented in this setup to achieve a Fisher information of $N^2/e$ with the collective $\\langle J_y\\rangle$ readout, corresponding to a $4.34\\,\\mathrm{dB}$ offset from the Heisenberg limit. Furthermore, we establish that this platform provides a pathway to perform the butterfly echo protocol by conjugating each evolution step with a random collective bath rotation, thereby achieving axis-agnostic Heisenberg-scaled sensing. Crucially, with a small $N-$independent number of random steps, the butterfly echo reaches a Fisher information of $N^2/4$ ($6\\,\\mathrm{dB}$ below the Heisenberg limit) for any unknown encoding axis, with the plateau gain tracking the Haar limit. Finally, we demonstrate that the central-spin magnitude $S_{\\rm cen}$ provides a powerful knob to reduce the optimal protocol timescale without altering the metrological ceiling or the circuit depth required to reach isotropy. The proposed scheme is relevant to cavity QED and NMR quantum processors, where the central spin architecture arises naturally.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31184", "arxiv_id": "2610.31184", "type": "arXiv", "journal": "arXiv:2610.31184", "journal_ref": "", "title": "Anomalous polar chains in halide perovskites", "authors": "Erik Fransson, Apinya Ngoipala, Priyanka Deswal et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.31184", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Local polar distortions, their collective ordering, and their field-driven reversal have been studied extensively in ferroelectric perovskites for decades. Here we identify an unusual behavior in the ferroelectric halide perovskite CsGeBr3 using large-scale molecular dynamics with first-principles-trained interatomic potentials. In its nominally cubic phase the Ge off-centering forms one-dimension", "summary": "Local polar distortions, their collective ordering, and their field-driven reversal have been studied extensively in ferroelectric perovskites for decades. Here we identify an unusual behavior in the ferroelectric halide perovskite CsGeBr3 using large-scale molecular dynamics with first-principles-trained interatomic potentials. In its nominally cubic phase the Ge off-centering forms one-dimension", "abstract": "Local polar distortions, their collective ordering, and their field-driven reversal have been studied extensively in ferroelectric perovskites for decades. Here we identify an unusual behavior in the ferroelectric halide perovskite CsGeBr3 using large-scale molecular dynamics with first-principles-trained interatomic potentials. In its nominally cubic phase the Ge off-centering forms one-dimensional polar chains that extend over at least tens of nanometers and relax on nanosecond timescales, four orders of magnitude slower than in BaTiO3 and PbTiO3, with CsSnBr3 in between. The cubic CsGeBr3 phase is a dynamically disordered state in which oppositely polarized chains flip throughout the crystal, and a long-lived one-dimensional local polarization coexists with zero net polarization. A simple three-dimensional perovskite thus hosts long-ranged one-dimensional polar correlations with remarkably slow dynamics. In the ferroelectric phase the same chains set a one-dimensional switching mechanism, in which the polarization reverses chain by chain.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30281", "arxiv_id": "2610.30281", "type": "arXiv", "journal": "arXiv:2610.30281", "journal_ref": "", "title": "Charge Density Waves and In-Gap States in Coupled Chains and Moiré Superlattices", "authors": "Muhammad Akram, Onur Erten", "corresponding": "", "url": "https://arxiv.org/abs/2610.30281", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Charge density waves (CDWs) arise from the interplay between electrons and lattice distortions and are a hallmark of low-dimensional systems. Here we study coupled Su-Schrieffer-Heeger chains, both lattice-matched ladders and lattice-mismatched moiré superlattices, and find a rich set of CDW phases together with symmetry-protected bound states. In lattice-matched chains, the competition between el", "summary": "Charge density waves (CDWs) arise from the interplay between electrons and lattice distortions and are a hallmark of low-dimensional systems. Here we study coupled Su-Schrieffer-Heeger chains, both lattice-matched ladders and lattice-mismatched moiré superlattices, and find a rich set of CDW phases together with symmetry-protected bound states. In lattice-matched chains, the competition between el", "abstract": "Charge density waves (CDWs) arise from the interplay between electrons and lattice distortions and are a hallmark of low-dimensional systems. Here we study coupled Su-Schrieffer-Heeger chains, both lattice-matched ladders and lattice-mismatched moiré superlattices, and find a rich set of CDW phases together with symmetry-protected bound states. In lattice-matched chains, the competition between electron-phonon coupling and interchain tunneling drives a sequence of CDW phases, including staggered dimers, trimers, and incommensurate states. These phases are generally gapped and host bound states protected by crystalline symmetries rather than chiral symmetry, and are therefore not pinned to zero energy. Lattice mismatch further reconstructs these phases into long-period supermoiré CDWs, with an ordered array of defects, pinned to the moiré length scale, that host localized electronic states. Interchain tunneling and lattice mismatch thus emerge as natural control parameters for CDW order and bound states in one-dimensional chains.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30930", "arxiv_id": "2610.30930", "type": "arXiv", "journal": "arXiv:2610.30930", "journal_ref": "", "title": "Chiroptical Valleytronic in SnSe", "authors": "Yiming Pan, Sotirios Fragkos, Umberto Dellasette et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30930", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Quantum geometric properties of Bloch electrons play a central role in governing light-matter interactions and transport phenomena in solids. Here, we report quantum-geometric chiroptical selection rules that generate a helicity-dependent momentum-space population imbalance in the group-IV monochalcogenide SnSe. By combining time- and angle-resolved extreme-ultraviolet photoemission spectroscopy w", "summary": "Quantum geometric properties of Bloch electrons play a central role in governing light-matter interactions and transport phenomena in solids. Here, we report quantum-geometric chiroptical selection rules that generate a helicity-dependent momentum-space population imbalance in the group-IV monochalcogenide SnSe. By combining time- and angle-resolved extreme-ultraviolet photoemission spectroscopy w", "abstract": "Quantum geometric properties of Bloch electrons play a central role in governing light-matter interactions and transport phenomena in solids. Here, we report quantum-geometric chiroptical selection rules that generate a helicity-dependent momentum-space population imbalance in the group-IV monochalcogenide SnSe. By combining time- and angle-resolved extreme-u
