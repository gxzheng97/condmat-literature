idual vacancies. Using Green's function formalism, we construct an energy-dependent Hamiltonian describing their hybridization. In a commensurate periodic vacancy lattice, a Dirac inversion of the zero-energy vacancy kernel accounts for the change in the occupied-state Chern number of the full system. We treat weak positional disorder using the self-consistent Born approximation and numerical disorder averaging, and study independently distributed vacancies using transfer-matrix and multifractal scaling. The local Chern marker and current textures track the transition in real space. Together, these results highlight the role that nonperturbative ring states have as microscopic degrees of freedom through which strong disorder destroys the Chern phase.", "method": "", "result": "", "future": "", "summary_zh": "通过空位束缚环态及其杂化描述陈绝缘体中强无序驱动的拓扑相变。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "Provides a microscopic theoretical framework for disorder-induced topological phase transition in Chern insulators via vacancy-bound in-gap ring states, with real-space analysis linking localized states to global topological destruction.", "feature_candidate": true, "physics_advance": "Elucidation of strong-disorder topological phase transition mechanism in Chern insulators mediated by hybridization and inversion of vacancy-bound ring states.", "ai_in_scope": true}, {"id": "arxiv-2610-29729", "arxiv_id": "2610.29729", "type": "arXiv", "journal": "arXiv:2610.29729", "journal_ref": "", "title": "Intertwined complex orbital order and ferrimagnetism in honeycomb molybdate Fe$_2$Mo$_3$O$_8$", "authors": "Hong-Hao Song, Gang v. Chen", "corresponding": "", "url": "https://arxiv.org/abs/2610.29729", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The authors study intertwined orbital ordering and ferrimagnetism in honeycomb Fe2Mo3O8.", "summary": "The authors study intertwined orbital ordering and ferrimagnetism in honeycomb Fe2Mo3O8.", "abstract": "Motivated by the recent experimental interest in honeycomb molybdates A$_2$Mo$_3$O$_8$, we return and develop the minimal models to capture the essential physics for Fe$_2$Mo$_3$O$_8$. It is pointed out that, the magnetism in these materials arises from the mutual induction between the spin-orbit coupling of the tetrahedral sublattice with active orbitals and the superexchange with the spins from the octahedral sublattice. Essentially, the superexchange between the tetrahedral and octahedral sublattices directly drives the ferrimagnetism, and the residual spin-orbit coupling on the tetrahedral sublattice induces the complex orbital order. The hybrid magnon-phonon excitations are further explored together with their resulting Berry curvatures and thermal Hall effect. We discuss the experimental relevance with Fe$_2$Mo$_3$O$_8$, and the framework can be extended to FeNiMo$_3$O$_8$, Ni$_2$Mo$_3$O$_8$ and other isostructural magnets.", "method": "", "result": "", "future": "", "summary_zh": "研究蜂窝 Fe₂Mo₃O₈ 中复杂轨道序与亚铁磁序的耦合。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 68, "relevance_method": "semantic", "relevance_reason": "Develops minimal microscopic model clarifying intertwined spin-orbit coupling induced complex orbital order and ferrimagnetism in honeycomb molybdates, linking to Berry curvature and thermal Hall effects, important for correlated spin-orbit", "feature_candidate": false, "physics_advance": "Identification of spin-orbit coupling and superexchange driven intertwined complex orbital order and ferrimagnetism with topological magnon-phonon effects in Fe2Mo3O8.", "ai_in_scope": true}, {"id": "arxiv-2610-30322", "arxiv_id": "2610.30322", "type": "arXiv", "journal": "arXiv:2610.30322", "journal_ref": "", "title": "Kinetic-inductance Parametric Amplification in Superconducting Hybrid Magnonics", "authors": "Pratap Kumar Pal, Moojune Song, Jinho Lim, Juliang Li, Serhii Kruhlov, Ralu Divan, Ulrich Welp, Clarence Chang, Kab-Jin Kim, Valentine Novosad, Axel Hoffmann, Yi Li", "corresponding": "", "url": "https://arxiv.org/abs/2610.30322", "topic": "Superconductivity", "level": "Brief", "summary_en": "This paper reports the demonstration of kinetic inductance parametric amplification within a hybrid magnonic system formed by a nonlinear NbN nanowire resonator strongly coupled to a YIG sphere. The system shows tunable microwave amplification and nonlinear dynamics mediated by magnon-photon interactions.", "summary": "A nonlinear NbN nanowire coupled to YIG magnons exhibits kinetic-inductance parametric amplification with up to 7 dB detuned gain.", "abstract": "Parametric amplification enables sensitive microwave detection and signal processing by amplifying weak signals with minimal added noise. Here, we demonstrate kinetic inductance mediated parametric amplification in a hybrid magnonic system comprising a nonlinear NbN nanowire resonator strongly coupled to a yttrium iron garnet sphere. The resonator exhibits four wave mixing and nonlinear frequency pulling, enabling parametric amplification both away from and within the magnon-photon strong coupling regime. In the magnon detuned regime, we observe 7 dB gain, while coupling to the YIG magnon shifts the parametric amplification response by ~20 MHz and yields 3.4 dB gain in the hybrid mode. Thus, magnon photon coupling provides a route to magnetically tune the spectral position of kinetic inductance parametric amplification. At higher pump powers, the system transitions to a self oscillatory regime featuring comb-like sidebands and probe activated nonlinear mode mixing. These results establish hybrid magnonics as a platform for tunable nonlinear microwave oton coupling in hybrid superconducting-magnonic systems.", "ai_in_scope": true}, {"id": "arxiv-2610-30918", "arxiv_id": "2610.30918", "type": "arXiv", "journal": "arXiv:2610.30918", "journal_ref": "", "title": "Thermal expansion mechanisms, heat transport, and band-gap renormalization in strongly anharmonic Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ from machine-learned interatomic potentials", "authors": "Ekaterina Spirande, Rustam Arabov, Sofya Demina, Nikita Rybin, Alexander Shapeev", "corresponding": "", "url": "https://arxiv.org/abs/2610.30918", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The study uses machine-learned interatomic potentials trained on DFT to simulate lattice dynamics, thermal expansion, heat transport, and band-gap renormalization in structurally complex anharmonic materials Rb2SO4, Rb2Ca2(SO4)3, and Ba3Lu(BO3)3.", "summary": "Machine-learned potentials connect thermal expansion, heat transport and band-gap renormalization in strongly anharmonic sulfates and borates.", "abstract": "Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ are structurally complex materials whose thermal expansion has been interpreted, on the basis of high-temperature x-ray diffraction, in terms of specific polyhedral rearrangements. We study their lattice dynamics and its consequences for thermal and electronic properties using molecular dynamics with actively learned moment tensor potentials trained on density-functional theory data. The anharmonicity measure $σ^A$ (compares the anharmonic contribution to the interatomic forces with the total forces acting on atoms) reaches $\\approx$0.3-0.5 for $β$-Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ and $\\approx$0.75 for orientationally disordered $α$-Rb$_2$SO$_4$, and the imaginary harmonic modes of Rb$_2$Ca$_2$(SO$_4$)$_3$ and $α$-Rb$_2$SO$_4$ are stabilized at finite temperature. The simulations reproduce the measured thermal expansion and support the mechanisms proposed from diffraction: expansion along $c$ in $β$-Rb$_2$SO$_4$ arises from both elongation and straightening of corrugated Rb chains, BO$_3$ reorientation accompanies the anisotropic expansion of Ba$_3$Lu(BO$_3$)$_3$, and bending of polyhedral linkages limits expansion along the weakly expanding directions and in cubic Rb$_2$Ca$_2$(SO$_4$)$_3$. Green-Kubo lattice thermal conductivities differ by more than an order of magnitude between compounds with comparable $σ^A$, showing that the anharmonicity measure alone does not determine heat transport. Phonon-induced band-gap renormalization, including lattice thermal expansion, reaches 2.7 and 1.7 eV at 1250 K in Rb$_2$Ca$_2$(SO$_4$)$_3$ and Ba$_3$Lu(BO$_3$)$_3$ and 1.4 eV at 650 K in $β$-Rb$_2$SO$_4$, with zero-point renormalizations of 0.64, 0.70, and 0.31 eV for $β$-Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$, respectively.", "method": "", "result": "", "future": "", "summary_zh": "本研究利用基于DFT训练的机器学习原子间势，模拟了结构复杂的高非谐性材料Rb2SO4、Rb2Ca2(SO4)3和Ba3Lu(BO3)3的晶格动力学、热膨胀、热传导及带隙重整。", "tier": "Uncertain", "tier_reason_en": "The work applies advanced computational methods to complex materials with strong anharmonicity, yielding detailed property insights; publication tier depends on experimental validation and broader impact.", "tier_reason_zh": "该工作利用先进计算方法研究强非谐复杂材料并获得详细性质，发表层级视实验验证和影响力而定。", "relevance_score": 65, "relevance_method": "semantic", "relevance_reason": "Using machine-learned interatomic potentials, this work elucidates anharmonic lattice dynamics, thermal expansion mechanisms, thermal conductivity disparities, and phonon-induced band-gap renormalization in structurally complex strongly anh", "feature_candidate": false, "method_en": "Molecular dynamics simulations with actively learned moment tensor potentials capture anharmonic effects and finite-temperature stabilization, reproducing experimental thermal expansion and computing Green-Kubo thermal conductivities and band-gap shifts.", "method_zh": "采用主动学习的矩张量势进行分子动力学模拟，捕捉非谐效应和有限温度稳定性，重现实验热膨胀，计算Green-Kubo热导率及带隙变化。", "result_en": "Simulations confirm proposed thermal expansion mechanisms from diffraction, show anharmonicity alone does not determine heat transport efficacy, and reveal substantial phonon-induced band-gap renormalizations up to several eV at elevated temperatures.", "result_zh": "模拟证实了衍射提出的热膨胀机制，表明非谐性本身不足以决定热传导效率，且揭示了高温下高达数电子伏特的声子诱导带隙重整。", "future_en": "Follow-up studies could explore design rules for tuning anharmonicity and thermal/electronic properties in complex materials using machine-learned potentials across broader compositional spaces.", "future_zh": "后续研究可利用机器学习势在更广成分空间探索调控非谐性及热电子性质的设计规则。", "physics_advance": "Demonstration of anharmonicity-driven lattice dynamics effects controlling thermal expansion, heat transport, and electronic band-gap renormalization in complex sulfate and borate crystals.", "ai_in_scope": true}, {"id": "arxiv-2610-30547", "arxiv_id": "2610.30547", "type": "arXiv", "journal": "arXiv:2610.30547", "journal_ref": "", "title": "Anisotropic thermoelectric transport in the Sr2RuO4-Ru eutectic system", "authors": "Takeru Ito, Shogo Yoshida, Hiroshi Yaguchi, Ryuji Okazaki", "corresponding": "Shogo Yoshida; Ryuji Okazaki", "url": "https://arxiv.org/abs/2610.30547", "topic": "Superconductivity", "level": "Brief", "summary_en": "Thermopower measured parallel and perpendicular to Ru lamellae in Sr2RuO4–Ru eutectics is anisotropic; local strain modeling captures its sign and approximate magnitude.", "summary": "Thermopower measured parallel and perpendicular to Ru lamellae in Sr2RuO4–Ru eutectics is anisotropic; local strain modeling captures its sign and approximate magnitude.", "abstract": "The Sr2RuO4-Ru eutectic system, in which metallic Ru inclusions are embedded in a Sr2RuO4 matrix, exhibits an enhanced superconducting onset temperature of about 3 K, known as the 3-K phase. Here we investigate the in-plane thermoelectric response of this eutectic system in the normal state and find a pronounced anisotropy in the thermopower for thermal gradients applied parallel and perpendicular to the Ru lamellae. To clarify its origin, we combine thermopower measurements with electronic-structure-based transport calculations and finite-element modeling of the local strain distribution generated by the thermal-expansion mismatch between Sr2RuO4 and Ru. The calculations show that uniaxial compression of Sr2RuO4 produces a sizable thermopower anisotropy through modification of the Fermi surfaces. When an idealized spatially inhomogeneous strain field around the Ru lamellae is included, the observed sign and qualitative magnitude of the anisotropy are reproduced more closely than in a simple unstrained two-component model. These results are consistent with a substantial contribution from strain-induced changes in the Sr2RuO4 electronic structure near the interfaces, although contributions from interfacial phase mixing and three-dimensional transport connectivity cannot be excluded.", "method": "", "result": "", "future": "", "summary_zh": "在 Sr₂RuO₄–Ru 共晶中测得相对 Ru 片层平行与垂直方向的热电势各向异性，局域应变模型解释其符号和量级。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "Careful Seebeck and strain-model comparison; its central interpretation is qualitative and based on one eutectic sample.", "tier_reason_zh": "Seebeck 与应变模拟结合较完整，但目前主要是单块共晶样品上的定性机制论证。", "method_en": "Floating-zone-grown Sr2RuO4–Ru eutectic with ~2% visible Ru lamellae; steady-state Seebeck measurements for heat gradients parallel/perpendicular to lamellae; DFT Boltzmann transport and finite-element strain maps.", "method_zh": "使用浮区法生长的 Sr₂RuO₄–Ru 共晶（表面 Ru 片层面积约 2%）；沿片层平行/垂直方向测稳态 Seebeck 系数，结合 DFT Boltzmann 输运和有限元局域应变模拟。", "result_en": "Fig. 1 compares Sxx and Syy of the eutectic with a pure Sr2RuO4 reference and establishes anisotropy tied to lamellar orientation. Figs. 2–3 examine uniaxial-strain-driven Fermi-surface changes and the spatial strain distribution near Ru. Fig. 4 shows that an unstrained two-component mixing model produces <1% anisotropy, while a finite-element strain-informed calculation gives the observed sign and a closer magnitude. The authors argue that thermopower is a sensitive normal-state probe of interfacial strain associated with the 3-K superconducting phase.", "result_zh": "Fig. 1 比较共晶沿 Ru 片层垂直和平行方向的 Sxx、Syy，并以纯 Sr₂RuO₄ 为参照；Figs. 2–3 研究单轴应变导致的费米面变化和 Ru 附近的空间应变分布；Fig. 4 表明简单无应变双组分混合模型只给出小于 1% 的各向异性，而纳入有限元应变后可重现实验符号并更接近量级。作者认为热电势是与 3-K 界面超导有关的局域应变的灵敏常态探针。", "future_en": "On strain-controlled Sr2RuO4, measure Sxx−Syy and elastocaloric response on the same crystal while tracking Tc and the van-Hove-sensitive thermopower; repeat with several eutectic lamellar orientations.", "future_zh": "可在同一块受控应变 Sr₂RuO₄ 样品上同时追踪 Sxx−Syy、弹热响应、Tc 及 van Hove 敏感的热电势；再比较不同 Ru 片层取向的共晶样品。", "relevance_score": 62, "relevance_method": "semantic", "relevance_reason": "The paper demonstrates anisotropic thermoelectric transport linked to interface strain effects in Sr2RuO4-Ru eutectics, providing new insights into strain-modified electronic structure and thermopower anisotropy.", "feature_candidate": false, "physics_advance": "Experimental evidence and modeling of strain-induced anisotropic thermoelectric transport caused by Fermi surface modifications near Ru lamellae interfaces in Sr2RuO4, elucidating local strain effects on electronic properties.", "ai_in_scope": true}, {"id": "arxiv-2610-30172", "arxiv_id": "2610.30172", "type": "arXiv", "journal": "arXiv:2610.30172", "journal_ref": "", "title": "Resonant-pair energy return beyond the early Green-Kubo plateau in a quartic chain", "authors": "Julian Olszewski, Zijian Liu, Jie Xu", "corresponding": "", "url": "https://arxiv.org/abs/2610.30172", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "This study identifies a resonant energy return mechanism in a weakly coupled quartic oscillator chain affecting the early Green–Kubo conductivity plateau. It quantitatively describes how resonant neighbor pairs exchange and coherently return energy.", "summary": "Coherent energy return between resonant oscillators modifies the early Green–Kubo transport plateau in a quartic chain.", "abstract": "Distinguishing rapid local energy exchange from sustained transport matters when thermal conductivity is inferred from finite simulations. In a weakly coupled chain of separable quartic oscillators, we identify a quantitative mechanism that changes an early Green--Kubo plateau: resonant neighbors exchange energy and coherently return it. The pair heat-current integral maps to the classical pendulum trapping response. Quartic homogeneity gives an energy-independent reference period $T_{\\rm lib}=7.77ε^{-1/2}$, where $ε$ is the coupling. Without fitted parameters, the leading response predicts a negative first minimum at $0.952T_{\\rm lib}$ with depth $-0.74$ times the independent-cell exchange coefficient. Isolated-pair simulations test this reference and resolve finite-coupling corrections. The chain reaches its first minimum on the same time scale, with a shallower minimum and a small later residual. Comparisons with chaotic cells and energy-conserving noise show regimes in which coherent return is absent or interrupted over the measured windows. These finite-time results provide a quantitative reference for separating the early exchange plateau from subsequent correlated dynamics.", "method": "", "result": "", "future": "", "summary_zh": "本研究在弱耦合四次振子链中发现谐振能量回返机制，影响早期Green–Kubo导热系数的平稳期，定量描述了谐振相邻对能量交换及相干回返。", "tier": "Uncertain", "tier_reason_en": "The paper provides quantitative theoretical and numerical insights into fundamental heat transport mechanisms, suitable for specialized physics journals pending broader impact validation.", "tier_reason_zh": "论文对基础热传输机制进行定量理论和数值研究，有助于专业物理期刊发表，视影响范围待定。", "relevance_score": 60, "relevance_method": "semantic", "relevance_reason": "Presents a detailed study of resonant energy exchange and coherent return in a classical quartic oscillator chain, elucidating microscopic mechanisms relevant to interpreting thermal transport in model nonlinear lattices.", "feature_candidate": false, "method_en": "The authors theoretically map the pair heat-current integral to a classical pendulum trapping response and validate predictions with isolated-pair simulations and comparisons to noisy and chaotic systems.", "method_zh": "作者将对偶热流积分映射至经典摆锁定响应，通过孤立对模拟及与噪声和混沌系统的比较验证理论预测。", "result_en": "Predicted negative minima of the heat-current integral appear at characteristic time scales without fitting parameters, matching simulations. Coherent energy return is shown to be absent or disrupted under certain conditions.", "result_zh": "热流积分的负极值出现在特征时间尺度上且无拟合参数，与模拟吻合。证明在特定条件下相干能量回返缺失或被打断。", "future_en": "Further studies could investigate how introducing controlled perturbations affects the coherent return and long-time conductivity behaviors experimentally or via simulation.", "future_zh": "后续研究可通过实验或模拟探讨受控扰动如何影响相干回返及长期导热行为。", "physics_advance": "Quantitative identification of resonant-pair coherent energy return phenomena affecting early-time thermal transport signatures in quartic oscillator chains.", "ai_in_scope": true}, {"id": "arxiv-2610-30665", "arxiv_id": "2610.30665", "type": "arXiv", "journal": "arXiv:2610.30665", "journal_ref": "", "title": "From phase analysis to phase tracking: a robust approach to atomic-scale strain mapping", "authors": "Ying Han, Yuan Tian", "corresponding": "", "url": "https://arxiv.org/abs/2610.30665", "topic": "Topology & Transport", "level": "Brief", "summary_en": "This paper introduces geometric phase tracking analysis (GPTA), an improved method for atomic-scale strain mapping that dynamically tracks Bragg reflections in real space, overcoming limitations of standard geometric phase analysis under large strain or grain misorientation.", "summary": "A Bragg-peak-tracking strain-mapping method reduces failure rates from 27% to 11.5% across 13,795 microscopy images.", "abstract": "Atomic-scale strain governs the electronic, ferroic and mechanical properties of materials, and atomic-resolution microscopy measures it most directly. Geometric phase analysis (GPA) is the standard tool, but it fails when a Bragg reflection moves outside its fixed Fourier aperture under large strain or rotation, or in misoriented grains. Here we introduce geometric phase tracking analysis (GPTA), whose Fourier aperture tracks the Bragg reflection at each pixel in real space. A narrow aperture can therefore reject noise without losing a displaced reflection. On 13,795 simulated and experimental atomic-resolution images under various imaging conditions, GPTA reduces GPA's failure rate from 27% to 11.5% with up to 335 times better accuracy. It also gives strain and dislocation maps across grains, resistance to dynamical-scattering extinction, and a confidence map, capabilities that GPA lacks. Tracking the aperture combines reciprocal-space dose efficiency with real-space spatial resolution and extends atomic-scale strain metrology to beam-sensitive materials and challenging imaging conditions.", "method": "", "result": "", "future": "", "summary_zh": "本文提出几何相位追踪分析（GPTA）方法，通过实时跟踪折射点，改进原子级应变映射，克服了标准几何相位分析在大应变和晶粒错位条件下的不足。", "tier": "Uncertain", "tier_reason_en": "This methodological advancement significantly improves strain mapping accuracy, with strong practical value for microscopy, but awaits widespread adoption to determine publication impact level.", "tier_reason_zh": "该方法改进显著提升应变映射精度，具备强大显微镜应用价值，但需进一步推广验证以确认发表影响层次。", "relevance_score": 55, "relevance_method": "semantic", "relevance_reason": "Develops a new robust phase-tracking technique for atomic-scale strain mapping overcoming limitations of geometric phase analysis, enabling more accurate strain measurements which impact understanding of strain-dependent materials physics.", "feature_candidate": false, "method_en": "GPTA uses a Fourier aperture that adaptively tracks Bragg reflections a <script>
'use strict';
const AVAILABLE_REPORTS={"2026-10-23": {"zh": "reports/2026-10-23.zh.pdf", "en": "reports/2026-10-23.en.pdf"}, "2026-10-22": {"zh": "reports/2026-10-22.zh.pdf", "en": "reports/2026-10-22.en.pdf"}, "2026-10-25": {"zh": "reports/2026-10-25.zh.pdf", "en": "reports/2026-10-25.en.pdf"}, "2026-10-26": {"zh": "reports/2026-10-26.zh.pdf", "en": "reports/2026-10-26.en.pdf"}, "2026-10-24": {"en": "reports/2026-10-24.en.pdf", "zh": "reports/2026-10-24.zh.pdf"}};
const issues=JSON.parse(document.getElementById('issues-data').textContent);
const TOPIC_ZH={'All':'全部','Superconductivity':'超导','Thermal & Thermoelectric':'热输运与热电','Magnetism':'磁性','Materials & Growth':'材料与晶体生长','Topology & Transport':'拓扑与输运','Correlated Electrons':'关联电子','Low-dimensional & Optical':'低维与光学','Other Condensed Matter':'其他凝聚态'};
const STR={
 en:{kicker:'DAILY RESEARCH MONITOR / CONDENSED MATTER PHYSICS',title:'Condensed Matter Literature',subtitle:'Experimental quantum materials · New papers · Journal club',archive:'Archive',issue:'Issue',untitled:'Daily Literature',papers:'papers',featured:'featured reads',pdfEn:'Journal Club PDF · English ↗',pdfZh:'Journal Club PDF · 中文 ↗',search:'Search titles, authors, materials and findings…',all:'All',shown:'papers shown',indexed:'indexed',feature:'Featured reading',brief:'Literature index',corresponding:'Corresponding',estimated:'Estimated journal tier',actualJournal:'Actual publication',tierReason:'Assessment',read:'Read paper notes +',close:'Close notes −',methods:'Methods',findings:'Authors’ findings',followup:'Experimental follow-up',fullText:'Original paper / Full text ↗',empty:'No papers match the current filter.',footer:'DAILY CONDENSED MATTER LITERATURE · ORIGINAL SOURCES LINKED PER ARTICLE'},
 zh:{kicker:'每日凝聚态物理文献速递',title:'凝聚态物理文献',subtitle:'量子材料实验 · 最新论文 · Journal Club',archive:'往期归档',issue:'期刊速递',untitled:'每日文献',papers:'篇论文',featured:'篇重点精读',pdfEn:'Journal Club PDF · English ↗',pdfZh:'Journal Club PDF · 中文 ↗',search:'搜索论文标题、作者、材料与研究结果…',all:'全部',shown:'篇符合条件',indexed:'篇收录',feature:'重点精读',brief:'文献索引',corresponding:'通讯作者',estimated:'预估期刊档次',actualJournal:'实际发表期刊',tierReason:'评级理由',read:'阅读详细笔记 +',close:'收起笔记 −',methods:'研究方法',findings:'作者主要发现',followup:'我们可以做什么',fullText:'阅读论文原文 ↗',empty:'当前筛选条件下没有论文。',footer:'每日凝聚态物理文献 · 每篇均附原始论文链接'}
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 2025 Journal Impact Factors (2026 JCR release); sorting is by source journal.
const JOURNAL_JIF_2025=Object.freeze({
 'nature':56.1,'science':47.3,'nature materials':38.0,
 'nature communications':18.1,'nature physics':18.0,
 'physical review x':16.8,'prx':16.8,'science advances':13.9,
 'pnas':9.5,'proceedings of the national academy of sciences':9.5,
 'physical review letters':9.4,'prl':9.4
});
function journalImpact(p){
 // Classify by discovery source; arXiv articles stay last even if accepted by a journal.
 if(p.type==='arXiv'||p.arxiv_id||/^arxiv\b/i.test(String(p.journal||'')))return -Infinity;
 const name=String(p.journal||'').trim().toLowerCase().replace(/\s+/g,' ');
 return JOURNAL_JIF_2025[name]??-1;
}
function journalOrder(a,b){
 const x=journalImpact(a),y=journalImpact(b);
 if(x!==y)return y>x?1:-1;
 return String(a.title||'').localeCompare(String(b.title||''));
}
const byId=id=>document.getElementById(id);
let selected=0,topic='All';
// English is the default for first visits. A visitor's explicit choice persists.
let lang=(()=>{try{return localStorage.getItem('condmat-language')==='zh'?'zh':'en'}catch{return 'en'}})();
function field(p,name){
  const en=p[name+'_en'],zh=p[name+'_zh'];
  if(lang==='en')return en||((name==='summary')?(p.abstract||p.summary||''):(p[name]||''));
  return zh||p[name]||en||'';
}
function displayTopic(t){return lang==='zh'?(TOPIC_ZH[t]||t):t}
function chooseLanguage(next){lang=next;try{localStorage.setItem('condmat-language',lang)}catch{};render()}
function showIssue(i){selected=i;topic='All';byId('search').value='';render()}
function toggleNotes(btn){const details=btn.nextElementSibling;details.hidden=!details.hidden;btn.textContent=details.hidden?STR[lang].read:STR[lang].close}
function render(){
 const t=STR[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';
 byId('lang-en').setAttribute('aria-pressed',String(lang==='en'));byId('lang-zh').setAttribute('aria-pressed',String(lang==='zh'));
 byId('site-kicker').textContent=t.kicker;byId('site-title').textContent=t.title;byId('site-subtitle').textContent=t.subtitle;
 byId('archive-title').textContent=t.archive;byId('search').placeholder=t.search;byId('search').setAttribute('aria-label',t.search);byId('footer').textContent=t.footer;
 const issue=issues[selected]||{papers:[],date:'—'};
 byId('archive').innerHTML=issues.map((v,i)=>`<button type="button" aria-current="${i===selected}" data-issue="${i}">${esc(v.date)}<small>${v.papers.length} ${esc(t.papers)}</small></button>`).join('');
 byId('archive').querySelectorAll('[data-issue]').forEach(b=>b.addEventListener('click',()=>showIssue(Number(b.dataset.issue))));
 const reports=AVAILABLE_REPORTS[issue.date]||{};
 const languageOrder=lang==='zh'?['zh','en']:['en','zh'];
 const reportLinks=languageOrder.filter(l=>reports[l]).map(l=>`<a class="pdf ${l===lang?'current':''}" href="${esc(reports[l])}" target="_blank" rel="noopener" lang="${l==='zh'?'zh-CN':'en'}">${esc(l==='zh'?t.pdfZh:t.pdfEn)}</a>`).join('');
 const issueTitle=(lang==='zh'&&issue.title_zh)||issue.title||t.untitled;
 byId('head').innerHTML=`<div class="issue-head"><div><div class="stamp">${esc(t.issue)} / ${esc(issue.date)}</div><h2>${esc(issueTitle)}</h2><p>${issue.papers.length} ${esc(t.papers)} · ${issue.papers.filter(p=>p.level==='Feature').length} ${esc(t.featured)}</p></div>${reportLinks?`<div class="pdf-group">${reportLinks}</div>`:''}</div>`;
 const types=['All',...new Set(issue.papers.map(x=>x.topic))];
 byId('topics').innerHTML=types.map(tp=>`<button type="button" class="chip ${topic===tp?'active':''}" data-topic="${esc(tp)}">${esc(displayTopic(tp))}</button>`).join('');
 byId('topics').querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>{topic=b.dataset.topic;render()}));
 const q=byId('search').value.trim().toLocaleLowerCase();
 const papers=issue.papers.filter(p=>(topic==='All'||p.topic===topic)&&[
   p.title,p.authors,p.journal,p.corresponding,p.topic,TOPIC_ZH[p.topic],
   p.summary,p.summary_en,p.summary_zh,p.abstract,p.method,p.method_en,p.method_zh,
   p.result,p.result_en,p.result_zh,p.future,p.future_en,p.future_zh,
   p.tier,p.tier_reason,p.tier_reason_en,p.tier_reason_zh
 ].join(' ').toLocaleLowerCase().includes(q)).sort((a,b)=>
   Number(b.level==='Feature')-Number(a.level==='Feature')||journalOrder(a,b));
 byId('counter').textContent=`${papers.length} ${t.shown} / ${issue.papers.length} ${t.indexed}`;
 byId('papers').innerHTML=papers.map((p,i)=>{
   const isFeatured=p.level==='Feature';
   const prior=papers[i-1];
   const researchLabel=({theory:lang==='zh'?'理论':'Theory',experiment:lang==='zh'?'实验':'Experiment',mixed:lang==='zh'?'实验与理论':'Experiment + theory'})[p.research_type]||'';
   const intake=p.type==='arXiv'&&p.arxiv_version===1?('arXiv v1 · '+(lang==='zh'?'首次提交 ':'Submitted ')+(p.submitted_at||'').slice(0,10)+' · '+(lang==='zh'?'公告 ':'Announced ')+(p.announcement_date||'')):'';
   const researchMeta=[researchLabel,intake].filter(Boolean).join(' · ');
   const heading=(i===0||isFeatured!==(prior.level==='Feature'))?
     `<h2 class="group-heading">${esc(isFeatured?t.feature:t.brief)}</h2>`:'';
   const summary=field(p,'summary'),method=field(p,'method'),result=field(p,'result'),future=field(p,'future'),reason=field(p,'tier_reason');
   const details=[p.published_journal?`<p><strong>${esc(t.actualJournal)}</strong> — ${p.published_doi?`<a href="${esc(p.published_doi)}" target="_blank" rel="noopener">${esc(p.published_journal)} ↗</a>`:esc(p.published_journal)}</p>`:'',p.tier?`<p><strong>${esc(t.estimated)}</strong> — ${esc(p.tier)}${reason?' · '+esc(reason):''}</p>`:'',method?`<p><strong>${esc(t.methods)}</strong> — ${esc(method)}</p>`:'',result?`<p><strong>${esc(t.findings)}</strong> — ${esc(result)}</p>`:'',future?`<p><strong>${esc(t.followup)}</strong> — ${esc(future)}</p>`:''].join('');
   return `${heading}<article class="paper" id="${esc(p.id)}"><div class="topline"><div class="label ${p.level==='Feature'?'feature':''}">${esc(displayTopic(p.topic))} · ${esc(p.level==='Feature'?t.feature:t.brief)}</div><span class="pub">${esc(p.journal)}${Number.isFinite(Number(p.relevance_score))&&p.relevance_score!==null?` · ${lang==="zh"?"科学评分":"Physics score"} ${esc(p.relevance_score)}/100`:""}</span></div><h3><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)} ↗</a></h3><div class="authors">${esc(p.authors)}${p.corresponding&&p.corresponding!=='—'?' · '+esc(t.corresponding)+': '+esc(p.corresponding):''}</div>${researchMeta?`<div class="authors">${esc(researchMeta)}</div>`:''}${summary?`<p class="abstract">${esc(summary)}</p>`:''}${details?`<button type="button" class="expand">${esc(t.read)}</button><div class="details" hidden>${details}<p><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(t.fullText)}</a></p></div>`:''}</article>`;
 }).join('')||`<div class="empty">${esc(t.empty)}</div>`;
 byId('papers').querySelectorAll('.expand').forEach(b=>b.addEventListener('click',()=>toggleNotes(b)));
}
byId('lang-en').addEventListener('click',()=>chooseLanguage('en'));
byId('lang-zh').addEventListener('click',()=>chooseLanguage('zh'));
byId('search').addEventListener('input',render);
render();
</script></body></html>
