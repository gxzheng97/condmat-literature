eversal symmetry under circularly polarized illumination. We theoretically demonstrate that the magnitude of valley circular dichroism is strongly constrained by crystal symmetry through its influence on the quantum geometric tensor, the key quantity underlying valley optical selection rules. The resulting chiroptically induced valley polarization decays on sub-picosecond timescales through intervalley scattering mediated by electron-phonon coupling. Furthermore, we show theoretically that the population imbalance between valleys at opposite momenta gives rise to a helicity-reversible transient photocurrent. These findings provide microscopic insight into how quantum geometry governs valley-selective light-matter interactions, valley polarization, and photocurrent generation in van der Waals materials exhibiting hidden and transient symmetry breaking.", "method": "", "result": "", "future": "", "summary_zh": "利用时间分辨角分辨光电子谱在 SnSe 中观测圆偏振激发引起的谷选择性载流子分布。", "tier": "Nature Communications/Science Advances/PRX", "tier_reason_en": "A substantial conceptual or methodological advance with cross-community relevance.", "tier_reason_zh": "概念或方法进展较显著，可跨多个研究方向应用。", "relevance_score": 80, "relevance_method": "semantic", "relevance_reason": "By combining experiment and ab initio theory, the paper establishes quantum geometric selection rules for valley-resolved chiroptical responses and transient valley polarization, linking crystal symmetry, quantum geometry, and helicity-depe", "feature_candidate": true, "physics_advance": "Experimental and theoretical demonstration of symmetry- and quantum-geometry-governed helicity-dependent valley-selective excitation and dynamics in bulk SnSe", "ai_in_scope": true}, {"id": "arxiv-2610-30766", "arxiv_id": "2610.30766", "type": "arXiv", "journal": "arXiv:2610.30766", "journal_ref": "", "title": "Coulomb-Driven Electronic Textures in Lightly Hole-Doped Cuprates", "authors": "Wei-Wei Yang, Yang Shen, Yuxin Wang, Pengfei Li, Mingpu Qin, Kun Jiang", "corresponding": "", "url": "https://arxiv.org/abs/2610.30766", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Poorly screened Coulomb interactions organize electronic textures in lightly hole-doped cuprates.", "summary": "Poorly screened Coulomb interactions organize electronic textures in lightly hole-doped cuprates.", "abstract": "Motivated by recent experiments on Ca$_2$CuO$_2$Cl$_2$, we present a comprehensive study of the interplay between dopants and localized Zhang-Rice singlets in lightly hole-doped cuprates. Owing to the poorly screened Coulomb potential, the interactions between dopants and localized Zhang-Rice singlets favor asymmetric electronic configurations characterized by effective electric \"dipoles\". Using the MPS-based Lanczos method, we show that these localized holes give rise to in-gap bound states within the charge-transfer gap. When tunneling matrix-element effects are included, the bound states exhibit a characteristic $4a_0 \\times 2a_0$ internal structure, consistent with experimental observations. Our results suggest that Coulomb interactions between dopants and localized Zhang-Rice singlets, together with tunneling matrix-element effects, provide a microscopic mechanism for the observed $4a_0$ electronic structures.", "method": "", "result": "", "future": "", "summary_zh": "理论研究轻度空穴掺杂铜氧化物中库仑相互作用驱动的非均匀电子织构。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "The work explains experimentally observed 4a0 electronic structures in lightly hole-doped cuprates by identifying Coulomb-driven electric dipole 'textures' involving dopants and Zhang-Rice singlets, linking disorder, Coulomb interactions, a", "feature_candidate": true, "physics_advance": "Microscopic mechanism showing Coulomb interactions between dopants and localized Zhang-Rice singlets generate in-gap bound states with characteristic 4a0 electronic structure in lightly hole-doped cuprates", "ai_in_scope": true}, {"id": "arxiv-2610-30371", "arxiv_id": "2610.30371", "type": "arXiv", "journal": "arXiv:2610.30371", "journal_ref": "", "title": "Emergent altermagnetism in (LaVO$_3$)$_n$/(LaNiO$_3$)$_m$ superlattices from interfacial charge transfer and octahedral tilts", "authors": "Gustavo H. Cassemiro, Walber H. Brito", "corresponding": "", "url": "https://arxiv.org/abs/2610.30371", "topic": "Magnetism", "level": "Brief", "summary_en": "First-principles calculations predict interfacial-charge-transfer- and octahedral-tilt-induced altermagnetism in LaVO3/LaNiO3 superlattices.", "summary": "First-principles calculations predict interfacial-charge-transfer- and octahedral-tilt-induced altermagnetism in LaVO3/LaNiO3 superlattices.", "abstract": "Using first-principles calculations, we show that altermagnetism emerges in (LaVO$_3$)$_n$/(LaNiO$_3$)$_m$ superlattices, with $(n,m) = (1,1), (2,2)$ and $(2,4)$, from the interplay of interfacial charge transfer and octahedral tilts. Charge transfer drives the system towards the V$^{4+}$ and Ni$^{2+}$ configuration, turning the otherwise paramagnetic nickelate layers into a magnetically active sublattice. The resulting $C$-type antiferromagnetic order, combined with $a^-b^+c^-$ or $a^-b^-c^-$ octahedral tilts, links opposite-spin sublattices only through nonsymmorphic operations, yielding a $d$-wave spin splitting without spin-orbit coupling. Within DFT+U, the splitting reaches 118 meV in the insulating (LVO)$_1$/(LNO)$_1$ superlattice, about twice that calculated for bulk LaVO$_3$, and decreases as the nickelate layers become thicker. Our findings indicate that this splitting is hosted by both the V and Ni sublattices, with nearly half of its weight on oxygen $2p$ states through $p$-$d$ covalency. Interfacial charge transfer thus emerges as a \\textit{design} principle for engineering altermagnetism in oxide heterostructures.", "method": "", "result": "", "future": "", "summary_zh": "第一性原理计算表明 LaVO₃/LaNiO₃ 超晶格的界面电荷转移与八面体倾斜可诱导交替磁性。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "Using first-principles calculations, this work identifies a new mechanism for altermagnetism arising from interfacial charge transfer and structural distortions in oxide superlattices, establishing a concrete design principle for spin-split", "feature_candidate": true, "physics_advance": "Prediction of altermagnetism driven by interfacial charge transfer and octahedral tilts in layered oxide superlattices, leading to d-wave spin splitting without spin-orbit coupling", "ai_in_scope": true}, {"id": "arxiv-2610-30733", "arxiv_id": "2610.30733", "type": "arXiv", "journal": "arXiv:2610.30733", "journal_ref": "", "title": "Ferroelastic Reversal Magnon Thermal Hall Effect in a Fully Compensated Ferrimagnet", "authors": "Yingxi Bai, Zihan Chen, Chengwang Niu, Ming Yang", "corresponding": "", "url": "https://arxiv.org/abs/2610.30733", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Ferroelastic switching is predicted to reversibly control magnon thermal Hall response in fully compensated ferrimagnets.", "summary": "Ferroelastic switching is predicted to reversibly control magnon thermal Hall response in fully compensated ferrimagnets.", "abstract": "Magnons offer a charge-neutral channel for spin and heat transport, yet reversible and nonvolatile control of their thermal Hall response poses a fundamental challenge in systems with zero net magnetization. Here, we establish ferroelastic switching as an effective route to manipulate magnonic transverse responses in fully compensated ferrimagnets. A minimal Heisenberg-Dzyaloshinskii-Moriya model reveals that ferroelas demonstration of kinetic inductance parametric amplification within a hybrid magnonic system formed by a nonlinear NbN nanowire resonator strongly coupled to a YIG sphere. The system shows tunable microwave amplification and nonlinear dynamics mediated by magnon-photon interactions.", "summary": "A nonlinear NbN nanowire coupled to YIG magnons exhibits kinetic-inductance parametric amplification with up to 7 dB detuned gain.", "abstract": "Parametric amplification enables sensitive microwave detection and signal processing by amplifying weak signals with minimal added noise. Here, we demonstrate kinetic inductance mediated parametric amplification in a hybrid magnonic system comprising a nonlinear NbN nanowire resonator strongly coupled to a yttrium iron garnet sphere. The resonator exhibits four wave mixing and nonlinear frequency pulling, enabling parametric amplification both away from and within the magnon-photon strong coupling regime. In the magnon detuned regime, we observe 7 dB gain, while coupling to the YIG magnon shifts the parametric amplification response by ~20 MHz and yields 3.4 dB gain in the hybrid mode. Thus, magnon photon coupling provides a route to magnetically tune the spectral position of kinetic inductance parametric amplification. At higher pump powers, the system transitions to a self oscillatory regime featuring comb-like sidebands and probe activated nonlinear mode mixing. These results establish hybrid magnonics as a platform for tunable nonlinear microwave amplification and dynamics.", "method": "", "result": "", "future": "", "summary_zh": "本文展示了在由非线性NbN纳米线谐振腔与YIG球体强耦合构成的混合磁振子系统中实现的动感感应参量放大。系统表现出可调谐的微波放大和由磁振子-光子相互作用介导的非线性动力学。", "tier": "Nature Communications/Science Advances/PRX", "tier_reason_en": "The work demonstrates a novel tunable microwave amplification mechanism in hybrid magnonics with clear experimental validation and potential quantum technology applications, fitting the profile of a high-impact interdisciplinary journal.", ybin, Alexander Shapeev", "corresponding": "", "url": "https://arxiv.org/abs/2610.30918", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The study uses machine-learned interatomic potentials trained on DFT to simulate lattice dynamics, thermal expansion, heat transport, and band-gap renormalization in structurally complex anharmonic materials Rb2SO4, Rb2Ca2(SO4)3, and Ba3Lu(BO3)3.", "summary": "Machine-learned potentials connect thermal expansion, heat transport and band-gap renormalization in strongly anharmonic sulfates and borates.", "abstract": "Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ are structurally complex materials whose thermal expansion has been interpreted, on the basis of high-temperature x-ray diffraction, in terms of specific polyhedral rearrangements. We study their lattice dynamics and its consequences for thermal and electronic properties using molecular dynamics with actively learned moment tensor potentials trained on density-functional theory data. The anharmonicity measure $σ^A$ (compares the anharmonic contribution to the interatomic forces with the total forces acting on atoms) reaches $\\approx$0.3-0.5 for $β$-Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ and $\\approx$0.75 for orientationally disordered $α$-Rb$_2$SO$_4$, and the imaginary harmonic modes of Rb$_2$Ca$_2$(SO$_4$)$_3$ and $α$-Rb$_2$SO$_4$ are stabilized at finite temperature. The simulations reproduce the measured thermal expansion and support the mechanisms proposed from diffraction: expansion along $c$ in $β$-Rb$_2$SO$_4$ arises from both elongation and straightening of corrugated Rb chains, BO$_3$ reorientation accompanies the anisotropic expansion of Ba$_3$Lu(BO$_3$)$_3$, and bending of polyhedral linkages limits expansion along the weakly expanding directions and in cubic Rb$_2$Ca$_2$(SO$_4$)$_3$. Green-Kubo lattice thermal conductivities differ by more than an order of magnitude between compounds with compa wer anisotropy through modification of the Fermi surfaces. When an idealized spatially inhomogeneous strain field around the Ru lamellae is included, the observed sign and qualitative magnitude of the anisotropy are reproduced more closely than in a simple unstrained two-component model. These results are consistent with a substantial contribution from strain-induced changes in the Sr2RuO4 electronic structure near the interfaces, although contributions from interfacial phase mixing and three-dimensional transport connectivity cannot be excluded.", "method": "", "result": "", "future": "", "summary_zh": "在 Sr₂RuO₄–Ru 共晶中测得相对 Ru 片层平行与垂直方向的热电势各向异性，局域应变模型解释其符号和量级。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "Careful Seebeck and strain-model comparison; its central interpretation is qualitative and based on one eutectic sample.", "tier_reason_zh": "Seebeck 与应变模拟结合较完整，但目前主要是单块共晶样品上的定性机制论证。", "method_en": "Floating-zone-grown Sr2RuO4–Ru eutectic with ~2% visible Ru lamellae; steady-state Seebeck measurements for heat gradients parallel/perpendicular to lamellae; DFT Boltzmann transport and finite-element strain maps.", "method_zh": "使用浮区法生长的 Sr₂RuO₄–Ru 共晶（表面 Ru 片层面积约 2%）；沿片层平行/垂直方向测稳态 Seebeck 系数，结合 DFT Boltzmann 输运和有限元局域应变模拟。", "result_en": "Fig. 1 compares Sxx and Syy of the eutectic with a pure Sr2RuO4 reference and establishes anisotropy tied to lamellar orientation. Figs. 2–3 examine uniaxial-strain-driven Fermi-surface changes and the spatial strain distribution near Ru. Fig. 4 shows that an unstrained two-component mixing model produces <1% anisotropy, while a finite-element strain-informed calculation gives the observed sign and a closer magnitude. The authors argue that thermopower is a sensitive normal-state probe of interfacial strain associated with the 3-K superconducting phase.", "result_zh": "Fig. 1 比较共晶沿 Ru 片层垂直和平行方向的 Sxx、Syy，并以纯 Sr₂RuO₄ 为参照；Figs. 2–3 研究单轴应变导致的费米面变化和 Ru 附近的空间应变分布；Fig. 4 表明简单无应变双组分混合模型只给出小于 1% 的各向异性，而纳入有限元应变后可重现实验符号并更接近量级。作者 n--Kubo plateau: resonant neighbors exchange energy and coherently return it. The pair heat-current integral maps to the classical pendulum trapping response. Quartic homogeneity gives an energy-independent reference period $T_{\\rm lib}=7.77ε^{-1/2}$, where $ε$ is the coupling. Without fitted parameters, the leading response predicts a negative first minimum at $0.952T_{\\rm lib}$ with depth $-0.74$ times the independent-cell exchange coefficient. Isolated-pair simulations test this reference and resolve finite-coupling corrections. The chain reaches its first minimum on the same time scale, with a shallower minimum and a small later residual. Comparisons with chaotic cells and energy-conserving noise show regimes in which coherent return is absent or interrupted over the measured windows. These finite-time results provide a quantitative reference for separating the early exchange plateau from subsequent correlated dynamics.", "method": "", "result": "", "future": "", "summary_zh": "本研究在弱耦合四次振子链中发现谐振能量回返机制，影响早期Green–Kubo导热系数的平稳期，定量描述了谐振相邻对能量交换及相干回返。", "tier": "Uncertain", "tier_reason_en": "The paper provides quantitative theoretical and numerical insights into fundamental heat transport mechanisms, suitable for specialized physics journals pending broader impact validation.", "tier_reason_zh": "论文对基础热传输机制进行定量理论和数值研究，有助于专业物理期刊发表，视影响范围待定。", "relevance_score": 60, "relevance_method": "semantic", "relevance_reason": "Presents a detailed study of resonant energy exchange and coherent return in a classical quartic oscillator chain, elucidating microscopic mechanisms relevant to interpreting thermal transport in model nonlinear lattices.", "feature_candidate": false, "method_en": "The authors theoretically map the pair heat-current integral to a classical pendulum trapping response and validate predictions with isolated-pair simulations and comparisons to noisy and chaotic systems.", "method_zh": "作者将对偶热流积分映射至经典摆锁定响应，通过孤立对模拟及与噪声和混沌系统的比较验证理论预测。", "result_en": "Predicted negative minima of the heat-current integral appear at characteristic time scales without fitting parameters, matching simulations. Coherent energy return is shown to be absent or disrupted under certain conditions.", "result_zh": "热流积分的负极值出现在特征时间尺度上且无拟合参数，与模拟吻合。证明在特定条件下相干能量回返缺失或被打断。", "future_en": "Further studies could investigate how introducing controlled perturbations affects the coherent return and long-time conductivity behaviors experimentally or via simulation.", "future_zh": "后续研究可通过实验或模拟探讨受控扰动如何影响相干回返及长期导热行为。", "physics_advance": "Quantitative identification of resonant-pair coherent energy return phenomena affecting early-time thermal transport signatures in quartic oscillator chains.", "ai_in_scope": true}, {"id": "arxiv-2610-30665", "arxiv_id": "2610.30665", "type": "arXiv", "journal": "arXiv:2610.30665", "journal_ref": "", "title": "From phase analysis to phase tracking: a robust approach to atomic-scale strain mapping", "authors": "Ying Han, Yuan Tian", "corresponding": "", "url": "https://arxiv.org/abs/2610.30665", "topic": "Topology & Transport", "level": "Brief", "summary_en": "This paper introduces geometric phase tracking analysis (GPTA), an improved method for atomic-scale strain mapping that dynamically tracks Bragg reflections in real space, overcoming limitations of standard geometric phase analysis under large strain or grain misorientation.", "summary": "A Bragg-peak-tracking strain-mapping method reduces failure rates from 27% to 11.5% across 13,795 microscopy images.", "abstract": "Atomic-scale strain governs the electronic, ferroic and mechanical properties of materials, and atomic-resolution microscopy measures it most directly. Geometric phase analysis (GPA) is the standard tool, but it fails when a Bragg reflection moves outside its fixed Fourier aperture under large strain or rotation, or in misoriented grains. Here we introduce geometric phase tracking analysis (GPTA), whose Fourier aperture tracks the Bragg reflection at each pixel }
const byId=id=>document.getElementById(id);
let selected=0,topic='All';
// English is the default for first visits. A visitor's explicit choice persists.
let lang=(()=>{try{return localStorage.getItem('condmat-language')==='zh'?'zh':'en'}catch{return 'en'}})();
function field(p,name){
  const en=p[name+'_en'],zh=p[name+'_zh'];
  if(lang==='en')return en||((name==='summary')?(p.abstract||p.summary||''):(p[name]||''));
  return zh||p[name]||en||'';
}
function displayTopic(t){return lang==='zh'?(TOPIC_ZH[t]||t):t}
function chooseLanguage(next){lang=next;try{localStorage.setItem('condmat-language',lang)}catch{};render()}
function showIssue(i){selected=i;topic='All';byId('search').value='';render()}
function toggleNotes(btn){const details=btn.nextElementSibling;details.hidden=!details.hidden;btn.textContent=details.hidden?STR[lang].read:STR[lang].close}
function render(){
 const t=STR[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';
 byId('lang-en').setAttribute('aria-pressed',String(lang==='en'));byId('lang-zh').setAttribute('aria-pressed',String(lang==='zh'));
 byId('site-kicker').textContent=t.kicker;byId('site-title').textContent=t.title;byId('site-subtitle').textContent=t.subtitle;
 byId('archive-title').textContent=t.archive;byId('search').placeholder=t.search;byId('search').setAttribute('aria-label',t.search);byId('footer').textContent=t.footer;
 const issue=issues[selected]||{papers:[],date:'—'};
 byId('archive').innerHTML=issues.map((v,i)=>`<button type="button" aria-current="${i===selected}" data-issue="${i}">${esc(v.date)}<small>${v.papers.length} ${esc(t.papers)}</small></button>`).join('');
 byId('archive').querySelectorAll('[data-issue]').forEach(b=>b.addEventListener('click',()=>showIssue(Number(b.dataset.issue))));
 const reports=AVAILABLE_REPORTS[issue.date]||{};
 const languageOrder=lang==='zh'?['zh','en']:['en','zh'];
 const reportLinks=languageOrder.filter(l=>reports[l]).map(l=>`<a class="pdf ${l===lang?'current':''}" href="${esc(reports[l])}" target="_blank" rel="noopener" lang="${l==='zh'?'zh-CN':'en'}">${esc(l==='zh'?t.pdfZh:t.pdfEn)}</a>`).join('');
 const issueTitle=(lang==='zh'&&issue.title_zh)||issue.title||t.untitled;
 byId('head').innerHTML=`<div class="issue-head"><div><div class="stamp">${esc(t.issue)} / ${esc(issue.date)}</div><h2>${esc(issueTitle)}</h2><p>${issue.papers.length} ${esc(t.papers)} · ${issue.papers.filter(p=>p.level==='Feature').length} ${esc(t.featured)}</p></div>${reportLinks?`<div class="pdf-group">${reportLinks}</div>`:''}</div>`;
 const types=['All',...new Set(issue.papers.map(x=>x.topic))];
 byId('topics').innerHTML=types.map(tp=>`<button type="button" class="chip ${topic===tp?'active':''}" data-topic="${esc(tp)}">${esc(displayTopic(tp))}</button>`).join('');
 byId('topics').querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>{topic=b.dataset.topic;render()}));
 const q=byId('search').value.trim().toLocaleLowerCase();
 const papers=issue.papers.filter(p=>(topic==='All'||p.topic===topic)&&[
   p.title,p.authors,p.journal,p.corresponding,p.topic,TOPIC_ZH[p.topic],
   p.summary,p.summary_en,p.summary_zh,p.abstract,p.method,p.method_en,p.method_zh,
   p.result,p.result_en,p.result_zh,p.future,p.future_en,p.future_zh,
   p.tier,p.tier_reason,p.tier_reason_en,p.tier_reason_zh
 ].join(' ').toLocaleLowerCase().includes(q)).sort((a,b)=>
   Number(b.level==='Feature')-Number(a.level==='Feature')||journalOrder(a,b));
 byId('counter').textContent=`${papers.length} ${t.shown} / ${issue.papers.length} ${t.indexed}`;
 byId('papers').innerHTML=papers.map((p,i)=>{
   const isFeatured=p.level==='Feature';
   const prior=papers[i-1];
   const researchLabel=({theory:lang==='zh'?'理论':'Theory',experiment:lang==='zh'?'实验':'Experiment',mixed:lang==='zh'?'实验与理论':'Experiment + theory'})[p.research_type]||'';
   const intake=p.type==='arXiv'&&p.arxiv_version===1?('arXiv v1 · '+(lang==='zh'?'首次提交 ':'Submitted ')+(p.submitted_at||'').slice(0,10)+' · '+(lang==='zh'?'公告 ':'Announced ')+(p.announcement_date||'')):'';
   const researchMeta=[researchLabel,intake].filter(Boolean).join(' · ');
   const heading=(i===0||isFeatured!==(prior.level==='Feature'))?
     `<h2 class="group-heading">${esc(isFeatured?t.feature:t.brief)}</h2>`:'';
   const summary=field(p,'summary'),method=field(p,'method'),result=field(p,'result'),future=field(p,'future'),reason=field(p,'tier_reason');
   const details=[p.published_journal?`<p><strong>${esc(t.actualJournal)}</strong> — ${p.published_doi?`<a href="${esc(p.published_doi)}" target="_blank" rel="noopener">${esc(p.published_journal)} ↗</a>`:esc(p.published_journal)}</p>`:'',p.tier?`<p><strong>${esc(t.estimated)}</strong> — ${esc(p.tier)}${reason?' · '+esc(reason):''}</p>`:'',method?`<p><strong>${esc(t.methods)}</strong> — ${esc(method)}</p>`:'',result?`<p><strong>${esc(t.findings)}</strong> — ${esc(result)}</p>`:'',future?`<p><strong>${esc(t.followup)}</strong> — ${esc(future)}</p>`:''].join('');
   return `${heading}<article class="paper" id="${esc(p.id)}"><div class="topline"><div class="label ${p.level==='Feature'?'feature':''}">${esc(displayTopic(p.topic))} · ${esc(p.level==='Feature'?t.feature:t.brief)}</div><span class="pub">${esc(p.journal)}${Number.isFinite(Number(p.relevance_score))&&p.relevance_score!==null?` · ${lang==="zh"?"科学评分":"Physics score"} ${esc(p.relevance_score)}/100`:""}</span></div><h3><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)} ↗</a></h3><div class="authors">${esc(p.authors)}${p.corresponding&&p.corresponding!=='—'?' · '+esc(t.corresponding)+': '+esc(p.corresponding):''}</div>${researchMeta?`<div class="authors">${esc(researchMeta)}</div>`:''}${summary?`<p class="abstract">${esc(summary)}</p>`:''}${details?`<button type="button" class="expand">${esc(t.read)}</button><div class="details" hidden>${details}<p><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(t.fullText)}</a></p></div>`:''}</article>`;
 }).join('')||`<div class="empty">${esc(t.empty)}</div>`;
 byId('papers').querySelectorAll('.expand').forEach(b=>b.addEventListener('click',()=>toggleNotes(b)));
}
byId('lang-en').addEventListener('click',()=>chooseLanguage('en'));
byId('lang-zh').addEventListener('click',()=>chooseLanguage('zh'));
byId('search').addEventListener('input',render);
render();
</script></body></html>
