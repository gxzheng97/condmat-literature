turbative results for a focused fractional-quantum-Hall transport problem and identifies measurable few-electron correlations. The abstract indicates a useful theoretical contribution but gives no experimental validation or broader result that would support a higher tier.", "tier_reason_zh": "该论文针对一个具体的分数量子霍尔输运问题给出精确的非微扰结果，并指出可测量的少电子关联。摘要显示其具有价值明确的理论贡献，但未提供实验验证或足以支持更高档次的更广泛成果。"}, {"id": "arxiv-2610-38305", "arxiv_id": "2610.38305", "type": "arXiv", "journal": "arXiv:2610.38305", "journal_ref": "", "journal_doi": "", "title": "The Flexoelectric Twist: Persistence of Heavy Fermion Picture in Small-Angle Twisted Bilayer Graphene", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall"], "submitted_at": "2026-10-28T05:44:01Z", "updated_at": "2026-10-28T05:44:01Z", "announcement_date": "2026-10-30", "announcement_section": "new", "announcement_at": "2026-10-30T00:00:00+00:00", "announcement_time_basis": "arXiv dated batch and official 20:00 Eastern release schedule", "announcement_evidence_url": "https://arxiv.org/catchup/cond-mat/2026-10-30", "authors": "Qirong Yao, Ka Cheuk Fan, Tianyu Qiao, Hao Shi, Xi Dai, Berthold Jäck", "corresponding": "", "url": "https://arxiv.org/abs/2610.38305v1", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Using scanning tunnelling microscopy on twisted bilayer graphene with twist angles of about 0.3–0.7°, this study reports AA-site spectral peaks, particle–hole-asymmetric spectra, moiré-scale reconstruction, and AA-site atomic-lattice dilation. A phenomenological account links reconstruction and flexoelectric response to localized heavy-fermion states at AA sites coexisting energetically with itinerant electrons at AB/BA sites.", "summary": "Twisted bilayer graphene (TBG) near the first magic angle ($θ\\approx1.05^{\\circ}$) hosts flat bands that provide a fertile ground for exploring strongly correlated and topological phases. At smaller twist angles ($θ<1^{\\circ}$), attice relaxation profoundly alters the moiré landscape. The extent to which moiré lattice reconstruction at different length scales affects the electronic structure throu", "abstract": "Twisted bilayer graphene (TBG) near the first magic angle ($θ\\approx1.05^{\\circ}$) hosts flat bands that provide a fertile ground for exploring strongly correlated and topological phases. At smaller twist angles ($θ<1^{\\circ}$), attice relaxation profoundly alters the moiré landscape. The extent to which moiré lattice reconstruction at different length scales affects the electronic structure through electro-mechanical coupling remains unresolved. Here, using scanning tunneling microscopy on small-angle TBG devices ($θ\\approx0.3-0.7^{\\circ}$), we observe a pronounced $dI/dV$ peak at the AA site of the moiré lattice on top of a spectrum that is asymmetric about the charge neutrality point, lattice reconstruction over moiré lattice length scales, as well as a dilation of the atomic lattice at the AA sites. We demonstrate at a phenomenological level that the inclusion of moiré lattice reconstruction supports compact localized heavy fermion $f-$ states localized at AA sites. The additional inclusion of atomic lattice dilation enerates a strong flexo-electric response that explicitly breaks particle-hole symmetry, pushing compact, localized $f$-states at the AA sites down in energy. Consequently, these heavy fermion states energetically coexist with itinerant $c$-electrons at the AB/BA sites. Our spatially resolved spectroscopic measurements quantitatively visualize this coexistence, confirming the persistence of the heavy fermion model in the small-angle regime $θ<1^{\\circ}$. Our findings provide microscopic insights into how flexo-electricity affects the low-energy electronic structure of small-angle TBG. More broadly, our study establishes small-angle TBG as a new class of moiré materials to explore the interacting Kondo lattice problem with high tunability of the $f-$occupation and $c-$density through twist-angle and electrostatic back gates, respectively.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "In small-angle twisted bilayer graphene, AA-site-localized heavy-fermion-like states coexist with itinerant AB/BA-site electrons; the proposed flexoelectric response from atomic-lattice dilation breaks particle-hole symmetry and shifts the localized states.", "ai_in_scope": true, "relevance_reason": "Spatially resolved spectroscopy of twisted bilayer graphene reveals low-energy electronic structure and lattice-coupling effects relevant to its moiré heavy-fermion physics.", "relevance_method": "semantic", "relevance_score": 81, "feature_candidate": false, "summary_zh": "本研究利用扫描隧道显微镜研究扭转角约为 0.3–0.7° 的扭转双层石墨烯，报告了 AA 位点谱峰、粒子—空穴不对称谱、莫尔尺度重构及 AA 位点原子晶格膨胀。现象学分析将晶格重构和挠曲电响应与 AA 位点的局域重费米子态联系起来；这些态在能量上与 AB/BA 位点的巡游电子共存。", "method_en": "The authors perform spatially resolved scanning tunnelling microscopy and spectroscopy on small-angle twisted bilayer graphene devices. They use a phenomenological analysis to assess how moiré reconstruction and atomic-lattice dilation affect the electronic states.", "method_zh": "作者对小扭转角双层石墨烯器件进行空间分辨扫描隧道显微与谱学测量。研究通过现象学分析考察莫尔重构和原子晶格膨胀对电子态的影响。", "result_en": "The measurements reveal a pronounced differential-conductance peak at moiré AA sites, spectra asymmetric about charge neutrality, moiré-scale lattice reconstruction, and atomic-lattice dilation at AA sites. In the authors’ phenomenological account, reconstruction supports compact localized heavy-fermion states, while atomic dilation produces a flexoelectric response that breaks particle–hole symmetry and shifts these states down in energy. The proposed states coexist energetically with itinerant electrons at AB/BA sites, and the spatially resolved spectra are presented as evidence that the heavy-fermion picture persists below a 1° twist angle.", "result_z cted", "physics_advance": "Epitaxial strain and electrostatic boundary conditions stabilize a four-unit-cell monoclinic BiFeO3 phase with d-wave altermagnetic order and multiferroic topological textures, without a magnetic dead layer.", "ai_in_scope": true, "relevance_reason": "This study combines material-specific experiments and theory to establish unconventional magnetic and ferroelectric order in an ultrathin oxide, a substantial condensed-matter result.", "relevance_method": "semantic", "relevance_score": 86, "feature_candidate": false, "summary_zh": "作者报告了无磁性死层的超薄 BiFeO3 薄膜，并在四个晶胞厚的单斜相中发现 d 波交错磁性的特征。研究将外延应变和静电边界条件与厚度诱导的多铁相变及拓扑纹理联系起来。", "method_en": "The study combines first-principles calculations and symmetry analysis with atomic-resolution structural imaging and magnetic imaging. Magnetic circular dichroism and spin-resolved photoemission measurements provide evidence for the proposed four-unit-cell d-wave altermagnetic phase.", "method_zh": "研究将第一性原理计算和对称性分析与原子分辨结构成像、磁成像相结合。磁圆二色性和自旋分辨光电子能谱测量为所提出的四晶胞厚 d 波交错磁相提供了证据。", "result_en": "The authors report a multiferroic phase of BiFeO3 without a magnetic dead layer in the ultrathin limit. At four unit cells, short-circuit electrostatic boundary conditions stabilize a collinear monoclinic phase with d-wave altermagnetic order, supported by magnetic circular dichroism and spin-resolved photoemission. The work attributes a continuous thickness-induced phase transition and multiferroic topological textures to the combined influence of these boundary conditions and epitaxial strain. These findings present a route to stabilizing unconventional multiferroicity at device-relevant thicknesses.", "result_zh": "作者报告，在超薄极限下，BiFeO3 仍可形成不存在磁性死层的多铁相。在四个晶胞厚度下，短路静电边界条件稳定了具有 d 波交错磁序的共线单斜相，磁圆二色性和自旋分辨光电子能谱为此提供了支持。研究将连续的厚度诱导相变和多铁拓扑纹理归因于这些边界条件与外延应变的共同作用。这些发现为在器件相关厚度下稳定非常规多铁性提供了途径。", "future_en": "Further work could test the stability of the ultrathin phase and its altermagnetic signatures across changes in strain, boundary conditions and film thickness. Studies of electrical or magnetic control of the reported multiferroic textures could also assess their relevance to device operation.", "future_zh": "后续可研究该超薄相及其交错磁性特征在应变、边界条件和薄膜厚度变化下的稳定性。进一步考察能否通过电学或磁学方式调控所报告的多铁拓扑纹理，也有助于评估其对器件应用的意义。"}, {"id": "doi-10-1038-s41467-026-78979-8", "doi": "10.1038/s41467-026-78979-8", "title": "Nonlinear responses induced by inhomogeneous edge states in a centrosymmetric topological insulator", "type": "Journal", "journal": "Nature Communications", "authors": "Yitian Guo, Chengxin Jiang, Chenxi Liu, Zhanbo Fang, Yanjun Li, Jingyan Song, Dong Qiu, Kewen Zhang, Huazhan Liu, Hao Hong, Yichao Yan, Shengyuan A. Yang, Yuqiao Zhou, Yang Wang, Jie Xiong, Chao Yang, Jianjun Ying, Hui Zhang, Haomin Wang, Xixiang Zhang, Yan Li, Peng Li", "abstract": "Nonlinear electrical responses, second-order transport effects beyond Ohm’s law, typically arise in systems where inversion symmetry (P) or time-reversal symmetry (T) is broken, such as in non-centrosymmetric crystals exhibiting the nonlinear Hall effect, or in magnetic systems showing non-reciprocal transport. Here, we report the unexpected discovery of nonlinear electrical responses, under T symmetric conditions, in a bulk centrosymmetric, non-magnetic topological insulator, ZrTe5. We show that this nonlinearity is modulated by external magnetic fields, measured position and the Fermi level (EF) shifting, originating from the evolution of inversion symmetry breaking induced by inhomogeneous spatial distributions of surface edge states (ESs). Our findings unveil a mechanism for nonlinear transport in centrosymmetric systems and highlight an additional route for designing nonlinear electronic responses based on topological surface states. Second-order electrical nonlinearity is conventionally thought to originate in crystals with noncentrosymmetric lattices or magnetic order. Here, the authors show another generation paradigm in bulk centrosymmetric, nonmagnetic ZrTe5, arising from an inhomogeneous surface edge-state distribution.", "crossref_online_date": [[2026, 10, 28]], "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78979-8", "level": "Brief", "method": "", "result": "", "future": "", "article_kind": "Article", "publication_date": "2026-10-28", "publication_status": "published", "publication_evidence": {"source": "publisher", "url": "https://www.nature.com/articles/s41467-026-78979-8"}, "abstract_source": "publisher", "abstract_status": "available", "topic": "Magnetism", "summary_en": "The authors report second-order electrical responses in bulk centrosymmetric, nonmagnetic ZrTe5 under time-reversal-symmetric conditions. They attribute the responses to spatially inhomogeneous surface edge states that generate an evolving inversion-symmetry breaking.", "summary": "Nonlinear electrical responses, second-order transport effects beyond Ohm’s law, typically arise in systems where inversion symmetry (P) or time-reversal symmetry (T) is broken, such as in non-centrosymmetric crystals exhibiting the nonlinear Hall effect, or in magnetic systems showing non-reciprocal transport. Here, we report the unexpected discovery of nonlinear electrical responses, under T sym", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "In centrosymmetric, nonmagnetic ZrTe5, an inhomogeneous spatial distribution of surface edge states induces inversion-symmetry breaking and nonlinear electrical responses, even under time-reversal-symmetric conditions.", "ai_in_scope": true, "relevance_reason": "This experiment reports a new nonlinear transport mechanism in a topological insulator, making it a substantive advance in quantum-materials physics.", "relevance_method": "semantic", "relevance_score": 81, "feature_candidate": false, "summary_zh": "作者在时间反演对称条件下，于体相中心对称、非磁性的 ZrTe5 中观测到二阶电响应。他们将这些响应归因于空间分布不均的表面边缘态所产生的演化性反演对称性破缺。", "method_en": "They measure nonlinear transport while varying the magnetic field, measurement position, and Fermi level through shifting, and examine how these changes relate to the spatial distribution of surface edge states.", "method_zh": "研究通过改变磁场、测量位置以及费米能级偏移来测量非线性输运，并考察这些变化与表面边缘态空间分布的关系。", "result_en": "The nonlinear response varies with magnetic field, measurement position, and Fermi-level shifting, which the authors connect to inhomogeneous edge-state distributions in centrosymmetric ZrTe5. The work presents this as a route to second-order transport in a bulk centrosymmetric, nonmagnetic material.", "result_zh": "非线性响应随磁场、测量位置和费米能级偏移而变化；作者将其与中心对称 ZrTe5 中不均匀的边缘态分布联系起来。该工作提出了在体相中心对称、非磁性材料中产生二阶输运的一种途径。", "future_en": "The authors suggest that topological surface states with spatially inhomogeneous distributions could be used to design nonlinear electronic responses in centrosymmetric systems.", "future_zh": "作者指出，可利用空间分布不均的拓扑表面态，在中心对称体系中设计非线性电子响应。"}, {"id": "doi-10-1038-s41586-026-11227-7", "doi": "10.1038/s41586-026-11227-7", "title": "Time-reversal-symmetry-breaking spin injection from a compensated magnet", "type": "Journal", "journal": "Nature", "authors": "Jone Mencos, Antonin Badura, Eoin Dolan, Sebastian Beckert, Rafael González-Hernández, Nicolás Sigales, Tim Kokkeler, Ismaïla Kounta, Matthieu Petit, Charles Guillemard, Anna Birk Hellenes, Warlley Campos, Javier Rial, Dominik Kriegner, Vincent Baltz, Luis E. Hueso, Jairo Sinova, F. Sebastian Bergeret, Olena Gomonay, Tomáš Jungwirth, Libor Šmejkal, Lisa Michez, Helena Reichlova, Fèlix Casanova", "abstract": "The generation and transport of spin currents are central to spintronics, a technologically relevant field in which information is carried and manipulated using the electron spin rather than solely the electrical charge. Conventionally, electrical spin injection and the separation of charge and spin currents rely either on ferromagnets1–10, in which spin polarization originates from a net magnetization, or on relativistic effects such as the spin Hall effect11–16. Here we demonstrate spin injection from Mn5Si3, a compensated magnet with vanishing net magnetization. Using lateral spin-valve devices, we electrically inject spins from Mn5Si3 into a non-magnetic channel and detect their propagation at a spatially separated ferromagnetic electrode. Switching between time-reversed magnetic states of Mn5Si3 reverses the detected spin signal, demonstrating that the spin injection breaks time-reversal symmetry. This behaviour is observed for two distinct electrical-biasing geometries, providing a characteristic signature that differs from conventional ferromagnetic and spin-Hall injection. Symmetry analysis, first-principles calculations and spin-transport modelling show that our observations are consistent with the altermagnetic order of Mn5Si3, in which spin-polarized currents can arise despite the absence of net magnetization17–21. The calculations yield spin polarizations of 6.5–10%, comparable to those of conventional ferromagnets, whereas the spin-transport modelling of the experiments indicates spin diffusion lengths of 50–130 nm. Our results provide experimental evidence that a compensated magnet can generate spin currents controlled by its magnetic order and demonstrate that the altermagnetic properties of Mn5Si3 enable spintronic functionality without net magnetization. Experiments show that altermagnetic Mn5Si3 generates spin currents despite zero net magnetization, demonstrating a central prediction of altermagnetic spintronics.", "crossref_online_date": [[2026, 10, 28]], "corresponding": "", "url": "https://doi.org/10.1038/s41586-026-11227-7", "level": "Feature", "method": "", "result": "", "future": "", "article_kind": "Article", "publication_date": "2026-10-28", "publication_status": "published", "publication_evidence": {"source": "publisher", "url": "https://www.nature.com/articles/s41586-026-11227-7"}, "abstract_source": "publisher", "abstract_status": "available", "topic": "Magnetism", "summary_en": "This study demonstrates electrical spin injection from compensated, zero-net-magnetization Mn5Si3 into a non-magnetic channel, with the detected signal reversing when the magnet switches between time-reversed states. The results are consistent with altermagnetic spin polarization and establish a route to spintronic functionality controlled by magnetic order without net magnetization.", "summary": "The generation and transport of spin currents are central to spintronics, a technologically relevant field in which information is carried and manipulated using the electron spin rather than solely the electrical charge. Conventionally, electrical spin injection and the separation of charge and spin currents rely either on ferromagnets1–10, in which spin polarization originates from a net magnetiz", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "Time-reversed magnetic states of compensated Mn5Si3 reverse the detected spin-injection signal, showing that a magnet with zero net magnetization can generate controllable spin currents.", "ai_in_scope": true, "relevance_reason": "It experimentally establishes spin injection from an altermagnetic solid and connects the effect to its magnetic order through calculations and transport modelling.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": true, "summary_zh": "本研究展示了从净磁化为零的补偿磁体 Mn5Si3 向非磁性通道进行电学自旋注入；当磁体在时间反演相关的磁态间切换时，检测到的信号随之反转。结果与交错磁性自旋极化相符，并表明磁序可在无净磁化的情况下实现自旋电子学功能。", "method_en": "The authors use lateral spin-valve devices to inject spins electrically from Mn5Si3 into a non-magnetic channel and detect them at a spatially separated ferromagnetic electrode. They combine measurements using two biasing geometries with symmetry analysis, first-principles calculations and spin-transport modelling.", "method_zh": "作者采用横向自旋阀器件，将自旋从 Mn5Si3 电学注入非磁性通道，并在空间分离的铁磁电极处检测。研究结合两种偏置几何下的测量、对称性分析、第一性原理计算和自旋输运建模。", "result_en": "Reversing Mn5Si3 between time-reversed magnetic states reverses the detected spin signal, providing evidence that the injection is controlled by time-reversal-symmetry-breaking magnetic order. This behavior occurs in both electrical-biasing geometries and differs from conventional ferromagnetic and spin-Hall injection. The calculations yield spin polarizations of 6.5–10%, comparable to those of conventional ferromagnets, while modelling indicates spin diffusion lengths of 50–130 nm. Together, the observations are consistent with altermagnetic spin-polarized currents in a magnet with vanishing net magnetization.", "result_zh": "将 Mn5Si3 在时间反演相关的磁态间切换会使检测到的自旋信号反转，表明自旋注入受破坏时间反演对称性的磁序控制。该行为在两种电学偏置几何中均出现，并区别于传统铁磁体和自旋霍尔注入。计算得到的自旋极化率为 6.5–10%，与传统铁磁体相当；建模则表明自旋扩散长度为 50–130 nm。总体而言，这些观测与净磁化为零的磁体中由交错磁性产生自旋极化电流的解释相符。", "future_en": "A useful next step would be to test how the injected signal and spin-diffusion length vary with temperature, device geometry and Mn5Si3 magnetic state. Further comparisons across compensated magnets could assess how broadly this magnetic-order-controlled injection mechanism applies.", "future_zh": "后续可检验注入信号和自旋扩散长度如何随温度、器件几何及 Mn5Si3 磁态变化。进一步比较不同补偿磁体，可评估这种由磁序控制的注入机制具有多广泛的适用性。"}, {"id": "doi-10-1038-s41586-026-11202-2", "doi": "10.1038/s41586-026-11202-2", "title": "Narrow carbon pentaheptite nanoribbon as a covalent metal", "type": "Journal", "journal": "Nature", "authors": "Jianmin Huang, Qitang Fan, Jie Meng, Jia Liu, Jie Cui, Jianing Wang, Yi Li, Ruoting Yin, Honghe Ding, Junfa Zhu, Mengchun Ye, Shijing Tan, Chuanxu Ma, Yao Zhang, Qunxiang Li, Jinlong Yang, J. G. Hou, Bing Wang", "abstract": "Metallic carbon-based nanoribbons are sought after1,2 as atomically defined one-dimensional conductors with potential relevance to future carbon-based electrodes and interconnects3, ideally with quantum-limited conductance comparable to metallic carbon nanotubes4. Metallic graphene nanoribbons have been realized by band engineering, notably through zero-mode superlattices1. However, atomically precise metallic nanoribbons of fully non-benzenoid carbon allotropes, such as the theorized metallic carbon pentaheptites5,6, remain unexplored. The realization of these nanoribbons could enable bottom-up fabrication of all-carbon electronics7,8 compatible with semiconducting graphene nanoribbons9–13 and nanographenes14,15, along with their fascinating properties16–20. Here we report a hierarchical approach for the on-surface synthesis of planar carbon pentaheptite nanoribbons (CPHNs) by laterally fusing well-aligned polypentalene chains transformed from pre-synthesized polycyclooctadiene chains. Two distinct types of narrow pentaheptite nanoribbon share a similar basal structure consisting of a central heptagon chain flanked by either identically (CPHN 1) or differently (CPHN 2) oriented polypentalene chains on opposite lateral edges. CPHN 1 is an intrinsic metal, whereas CPHN 2 is a narrow-bandgap semiconductor. The CPHN 1 ribbon exhibits near-ballistic conductance approaching one conductance quantum, comparable to metallic carbon nanotubes4. This highlights CPHN 1 as a promising planar carbon metal and suggests a possible route towards carbon quantum wires, although further synthetic optimization will be required for device integration. Planar carbon pentaheptite nanoribbons are synthesized by laterally fusing polypentalene chains transformed from pre-synthesized polycyclooctadiene chains, suggesting a possible route towards carbon quantum wires.", "crossref_online_date": [[2026, 10, 28]], "corresponding": "", "url": "https://doi.org/10.1038/s41586-026-11202-2", "level": "Brief", "method": "", "result": "", "future": "", "article_kind": "Article", "publication_date": "2026-10-28", "publication_status": "published", "publication_evidence": {"source": "publisher", "url": "https://www.nature.com/articles/s41586-026-11202-2"}, "abstract_source": "publisher", "abstract_status": "available", "topic": "Materials & Growth", "summary_en": "The authors report the on-surface synthesis of planar carbon pentaheptite nanoribbons by laterally fusing polypentalene chains derived from pre-synthesized polycyclooctadiene chains. One ribbon type is an intrinsic metal with near-ballistic conductance approaching one conductance quantum, whereas another is a narrow-bandgap semiconductor.", "summary": "Metallic carbon-based nanoribbons are sought after1,2 as atomically defined one-dimensional conductors with potential relevance to future carbon-based electrodes and interconnects3, ideally with quantum-limited conductance comparable to metallic carbon nanotubes4. Metallic graphene nanoribbons have been realized by band engineering, notably through zero-mode superlattices1. However, atomically pre", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "A pentaheptite nanoribbon is realized as an intrinsic metal with near-ballistic conductance approaching one conductance quantum, while a related ribbon is a narrow-gap semiconductor.", "ai_in_scope": true, "relevance_reason": "The work establishes the electronic character and transport of atomically precise low-dimensional carbon materials, including a previously unexplored metallic pentaheptite ribbon.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "作者通过横向融合由预合成聚环辛二烯链转化而来的聚戊烯链，在表面合成平面碳五七元环纳米带。一种纳米带类型为本征金属，电导接近一个电导量子且近乎弹道；另一种则是窄带隙半导体。", "method_en": "The authors use a hierarchical on-surface synthesis route, transforming pre-synthesized polycyclooctadiene chains into polypentalene chains and then laterally fusing them into carbon pentaheptite nanoribbons.", "method_zh": "作者采用分层表面合成路线：先将预合成的聚环辛二烯链转化为聚戊烯链，再将其横向融合为碳五七元环纳米带。", "result_en": "Two narrow nanoribbon structures share a central heptagon chain but differ in the orientation of the polypentalene chains at their edges. CPHN 1 is an intrinsic metal with near-ballistic conductance approaching one conductance quantum, comparable to metallic carbon nanotubes, whereas CPHN 2 is a narrow-bandgap semiconductor.", "result_zh": "两种窄纳米带均具有中央七元环链，但边缘聚戊烯链的取向不同。CPHN 1 是本征金属，其近乎弹道的电导接近一个电导量子，与金属碳纳米管相当；CPHN 2 则是窄带隙半导体。", "future_en": "The authors identify CPHN 1 as a potential planar carbon metal and suggest a route toward carbon quantum wires, while noting that further synthetic optimization is needed for device integration.", "future_zh": "作者将 CPHN 1 视为潜在的平面碳金属，并指出该合成路线可能通向碳量子线；不过，实现器件集成仍需进一步优化合成方法。"}, {"id": "doi-10-1038-s41586-026-11214-y", "doi": "10.1038/s41586-026-11214-y", "title": "Subcycle videography of Landau–Zener–Majorana transitions in graphene", "type": "Journal", "journal": "Nature", "authors": "V. Eggers, G. Inzani, M. Meierhofer, L. Münster, J. Helml, R. Wallauer, S. Zajusch, S. Ito, L. Machtl, H. Yin, C. Kumpf, F. C. Bocquet, C. Bao, J. Güdde, F. S. Tautz, R. Huber, U. Höfer", "abstract": "Abstract Strong light fields have unlocked entirely new possibilities to tailor coherent electron trajectories, engineer band structures and shape emergent phases of matter all-optically 1–9 . Unravelling the underlying quantum mechanisms requires a visualization of the lightwave-driven electron motion 10,11 directly in the band structure. Although photoelectron momentum microscopy has imaged photoexcited electrons averaged over many cycles of light 12–19 , subcycle band-structure videography has been limited to small electron momenta 8,20 . Yet, lightwave-driven elementary processes in quantum materials often occur throughout momentum space. Here we introduce attosecond-precision, subcycle band-structure videography covering the entire first Brillouin zone and visualize one of the most fundamental but elusive strong-field processes: non-adiabatic Landau–Zener–Majorana tunnelling. The interplay of strong-field-driven acceleration within the Dirac-like band structure of graphene and periodic Landau–Zener–Majorana interband tunnelling manifests in a coherent subcycle displacement and distortion of the carrier distribution at the Brillouin zone edge. The extremely non-thermal electron distributions also allow us to disentangle competing scattering processes and assess their impact on coherent electronic control. Our panoramic view of field-driven electron motion enables a new quality of microscopic understanding of strong-field control of quantum materials.", "crossref_online_date": [[2026, 10, 28]], "corresponding": "", "url": "https://doi.org/10.1038/s41586-026-11214-y", "level": "Feature", "method": "", "result": "", "future": "", "article_kind": "Article", "publication_date": "2026-10-28", "publication_status": "published", "publication_evidence": {"source": "publisher", "url": "https://www.nature.com/articles/s41586-026-11214-y"}, "abstract_source": "Crossref", "abstract_status": "available", "topic": "Thermal & Thermoelectric", "summary_en": "The authors introduce attosecond-precision subcycle band-structure videography across the entire first Brillouin zone and use it to visualize Landau–Zener–Majorana tunnelling in graphene. They observe coherent subcycle changes in the carrier distribution and use the resulting non-thermal distributions to assess competing scattering processes.", "summary": "Abstract Strong light fields have unlocked entirely new possibilities to tailor coherent electron trajectories, engineer band structures and shape emergent phases of matter all-optically 1–9 . Unravelling the underlying quantum mechanisms requires a visualization of the lightwave-driven electron motion 10,11 directly in the band structure. Although photoelectron momentum microscopy has imaged phot", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "Subcycle band-structure videography reveals coherent carrier displacement and distortion at the Brillouin-zone edge from periodic Landau–Zener–Majorana tunnelling in graphene.", "ai_in_scope": true, "relevance_reason": "This is a condensed-matter experiment that directly images coherent strong-field electron dynamics and interband tunnelling across graphene’s Brillouin zone.", "relevance_method": "semantic", "relevance_score": 80, "feature_candidate": true, "summary_zh": "作者提出一种覆盖整个第一布里渊区、具有阿秒精度的亚周期能带摄像方法，并用它直接观察石墨烯中的 Landau–Zener–Majorana 隧穿。研究观测到载流子分布的相干亚周期变化，并利用由此产生的非热分布评估相互竞争的散射过程。", "method_en": "The study combines strong-field excitation of graphene with attosecond-precision photoelectron momentum microscopy to track light-driven electron motion across the first Brillouin zone within a light cycle. The resulting momentum-resolved distributions are used to examine interband tunnelling and the influence of competing scattering processes.", "method_zh": "研究将石墨烯的强场激发与具有阿秒精度的光电子动量显微术结合，在一个光周期内追踪整个第一布里渊区中的光驱动电子运动。研究利用所得的动量分辨分布考察带间隧穿以及相互竞争的散射过程的影响。", "result_en": "The method provides subcycle band-structure videography across the entire first Brillouin zone, extending prior imaging limited to small electron momenta. In graphene, strong-field-driven acceleration through the Dirac-like band structure and periodic Landau–Zener–Majorana interband tunnelling produce a coherent subcycle displacement and distortion of the carrier distribution at the Brillouin-zone edge. The resulting electron distributions are extremely non-thermal, allowing the authors to disentangle competing scattering processes and assess their impact on coherent electronic control. The work offers a momentum-wide view of light-driven electron motion and a means to examine strong-field processes in quantum materials directly in the band structure.", "result_zh": "该方法实现了覆盖整个第一布里渊区的亚周期能带摄像，突破了此前成像仅限于较小电子动量范围的限制。在石墨烯中，强场驱动的电子在类狄拉克能带结构中加速，并发生周期性的 Landau–Zener–Majorana 带间隧穿；两者共同导致布里渊区边缘载流子分布出现相干的亚周期位移和畸变。由此形成的电子分布高度非热，使作者能够区分相互竞争的散射过程并评估其对相干电子控制的影响。该工作提供了观察光驱动电子运动的全动量空间视角，也为直接在能带结构中研究量子材料强场过程提供了方法。", "future_en": "A useful extension would be to apply the method to other quantum materials and strong-field regimes to test how broadly it can resolve light-driven processes across momentum space. Further experiments could also use the time- and momentum-resolved distributions to compare the roles of distinct scattering processes under different excitation conditions.", "future_zh": "后续可将该方法应用于其他量子材料和强场条件，以检验它在多大范围内能够分辨整个动量空间中的光驱动过程。进一步实验还可利用时间与动量分辨的载流子分布，在不同激发条件下比较不同散射过程的作用。"}, {"id": "arxiv-2610-37402", "arxiv_id": "2610.37402", "type": "arXiv", "journal": "arXiv:2610.37402", "journal_ref": "Advanced Electronic Materials, 2026;12:e00882", "journal_doi": "10.1002/aelm.202500882", "title": "Electric Field-Induced Hole- and Electron-Type Flat Bands in Twisted Double Bilayer Graphene", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall", "cond-mat.mtrl-sci"], "submitted_at": "2026-10-27T15:18:36Z", "updated_at": "2026-10-27T15:18:36Z", "announcement_date": "2026-10-28", "announcement_section": "new", "authors": "Zhihao Jiang, Dongkyu Lee, Alfred J. H. Jones, Youngju Park, Paulina Majchrzak, Kimberly Hsieh, Chakradhar Sahoo, Thomas S. Nielsen, Kenji Watanabe, Takashi Taniguchi, Philip Hofmann, Yong P. Chen, Jeil Jung, Søren Ulstrup", "corresponding": "", "url": "https://arxiv.org/abs/2610.37402v1", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "The authors use gated microARPES to study twisted double bilayer graphene at twist angles of 3.1° and 6.0°, identifying how twist and electric field affect its electronic bands. At 3.1°, gate-induced doping can produce flat bands between the valence-band maximum of the bottom bilayer and the conduction-band minimum of the top bilayer.", "summary": "Application of a finite electric field and small twist angle between two graphene bilayers leads to widely tunable electronic structures that support emergent phenomena. Here, we measure the electronic structure of twisted double bilayer graphene with twist angles of 3.1$^{\\circ}$ and 6.0$^{\\circ}$ using micro-focused angle-resolved photoemission spectroscopy (microARPES) on \\textit{in situ} gated", "abstract": "Application of a finite electric field and small twist angle between two graphene bilayers leads to widely tunable electronic structures that support emergent phenomena. Here, we measure the electronic structure of twisted double bilayer graphene with twist angles of 3.1$^{\\circ}$ and 6.0$^{\\circ}$ using micro-focused angle-resolved photoemission spectroscopy (microARPES) on \\textit{in situ} gated samples. At a twist angle of 6.0$^{\\circ}$, we find that the dispersion around the valence and conduction band extrema is unchanged compared to separate graphene bilayers, whereas electric field tunable hybridisation gaps and band flattening effects occur at higher binding energies. In the 3.1$^{\\circ}$ structure, we find that the resulting superlattice drives dispersion changes around the valence and conduction band edges. Increasing the gate-induced doping in the bottom bilayer leads to the formation of flat bands between the valence band maximum in the bottom bilayer and conduction band minimum in the top bilayer. Our experiments establish combinations of twist angle and electric field that potentially support strong electron-hole excitations and that provide a benchmark for the theoretical description of moderately twisted double bilayer graphene.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "In twisted double bilayer graphene at 3.1°, gate-induced doping of the bottom bilayer produces flat bands between its valence-band maximum and the top bilayer's conduction-band minimum, while the measured effects depend on twist angle and electric field.", "ai_in_scope": true, "relevance_reason": "MicroARPES measurements establish electric-field- and twist-dependent electronic structure and flat-band formation in twisted double bilayer graphene, a direct quantum-materials result.", "relevance_method": "semantic", "relevance_score": 76, "feature_candidate": false, "summary_zh": "作者利用门控微区角分辨光电子能谱（microARPES）研究扭转角为 3.1° 和 6.0° 的扭转双双层石墨烯，揭示扭转与电场对能带的影响。在 3.1° 结构中，门控掺杂可在底部双层的价带顶与顶部双层的导带底之间形成平带。", "method_en": "The study measures in situ gated samples with microARPES at twist angles of 3.1° and 6.0°, varying the gate-induced doping in the bottom bilayer.", "method_zh": "研究采用 microARPES 测量扭转角为 3.1° 和 6.0° 的原位门控样品，并改变底部双层的门控掺杂。", "result_en": "At 6.0°, the valence- and conduction-band extrema remain similar to those of separate graphene bilayers, although higher-binding-energy states show electric-field-tunable hybridization gaps and band flattening. At 3.1°, the superlattice modifies the band edges, and increased bottom-bilayer doping produces flat bands between the bottom-bilayer valence-band maximum and the top-bilayer conduction-band minimum.", "result_zh": "在 6.0° 时，价带和导带极值附近的色散与独立石墨烯双层相近，但较高结合能处出现可由电场调控的杂化能隙与能带变平。在 3.1° 时，超晶格改变带边色散；提高底部双层的掺杂则会在底部双层价带顶与顶部双层导带底之间形成平带。", "future_en": "The authors propose these twist-angle and electric-field regimes as potential platforms for strong electron–hole excitations and as benchmarks for theories of moderately twisted double bilayer graphene.", "future_zh": "作者指出，这些扭转角与电场组合可能支持强电子—空穴激发，并可为中等扭转角双双层石墨烯的理论研究提供基准。"}, {"id": "arxiv-2610-35939", "arxiv_id": "2610.35939", "type": "arXiv", "journal": "arXiv:2610.35939", "journal_ref": "", "journal_doi": "", "title": "Planckian dissipation per unit critical entropy as a coupling-free probe of the strange-metal bath", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.str-el"], "submitted_at": "2026-10-23T00:44:06Z", "updated_at": "2026-10-23T00:44:06Z", "announcement_date": "2026-10-28", "announcement_section": "new", "authors": "Dino Škrgić, Dejan Stojkovic", "corresponding": "", "url": "https://arxiv.org/abs/2610.35939v1", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "The paper proposes a coupling-independent ratio of strange-metal transport and thermodynamic coefficients as a probe of the critical bath. It reports distinct ranges of this ratio for several bath classes and uses the value for LSCO to argue against a conformal bath and in favor of a Yukawa–SYK field.", "summary": "Strange metals pair a resistivity linear in temperature with a specific heat $C/T$ rising logarithmically on cooling. We find that, if electrons scatter off a local critical bath, the coupling cancels in the ratio $Q$ of their coefficients, leaving two measurable numbers: how slowly the bath relaxes, seen in photoemission or optics, and the share of critical entropy that relaxes current. Baths for", "abstract": "Strange metals pair a resistivity linear in temperature with a specific heat $C/T$ rising logarithmically on cooling. We find that, if electrons scatter off a local critical bath, the coupling cancels in the ratio $Q$ of their coefficients, leaving two measurable numbers: how slowly the bath relaxes, seen in photoemission or optics, and the share of critical entropy that relaxes current. Baths form classes: $Q\\le4.91$ for a conformal bath, as SYK models confirm; 9--15 for the Yukawa--SYK field; and far less for Kondo lattices. LSCO, at $Q\\approx9$, exceeds the conformal bound, pointing to the Yukawa--SYK field.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "A coupling-independent ratio of linear-resistivity and critical-entropy coefficients separates proposed local critical baths, and the LSCO value is consistent with the Yukawa–SYK field rather than a conformal bath.", "ai_in_scope": true, "relevance_reason": "This develops a theoretical diagnostic for strange-metal criticality and applies it to experimental data to distinguish candidate critical baths.", "relevance_method": "semantic", "relevance_score": 77, "feature_candidate": false, "summary_zh": "本文提出一种由奇异金属输运与热力学系数组成、且与耦合常数无关的比值，用以探测临界浴。作者给出若干类临界浴对应的不同比值范围，并据 LSCO 的数值认为其不符合共形浴、而指向 Yukawa–SYK 场。", "method_en": "The authors analyze electron scattering from a local critical bath and form a ratio Q from the coefficients of linear-in-temperature resistivity and logarithmically rising C/T. They compare the resulting bath-dependent values with LSCO and with SYK-model results.", "method_zh": "作者分析电子与局域临界浴的散射，并以电阻率线性温度项和随降温呈对数上升的 C/T 系数构造比值 Q。随后将不同临界浴对应的 Q 与 LSCO 以及 SYK 模型结果进行比较。", "result_en": "For a conformal bath, the authors find Q≤4.91, consistent with SYK models; they report Q=9–15 for the Yukawa–SYK field and much smaller values for Kondo lattices. LSCO has Q≈9, exceeding the conformal bound and pointing, in the authors’ interpretation, to the Yukawa–SYK field.", "result_zh": "作者得到共形浴的 Q≤4.91，与 SYK 模型相符；Yukawa–SYK 场对应 Q=9–15，而 Kondo 晶格的数值低得多。LSCO 的 Q≈9，超过共形上限；按作者的解释，这指向 Yukawa–SYK 场。", "future_en": "The proposed ratio is intended to use measurable relaxation and critical-entropy contributions to distinguish classes of strange-metal baths.", "future_zh": "该比值旨在利用可测得的弛豫特征和临界熵贡献，区分不同类别的奇异金属临界浴。", "tier": "PRL", "tier_reason_en": "The abstract presents a compact, potentially useful diagnostic that links transport and thermodynamics to distinguish critical-bath classes, with a quantitative application to LSCO. The claim is conceptually focused and testable, although the abstract alone does not establish broad validation.", "tier_reason_zh": "摘要提出了一个简洁且可能实用的诊断量，将输运与热力学联系起来以区分临界浴类别，并给出对 LSCO 的定量应用。其主张概念集中且可检验，但仅凭摘要尚不能确认其已得到广泛验证。"}, {"id": "arxiv-2610-36214", "arxiv_id": "2610.36214", "type": "arXiv", "journal": "arXiv:2610.36214", "journal_ref": "", "journal_doi": "", "title": "A cascade of orbital-field-driven phases with a Lifshitz-type transition to unidirectional spiral order", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.str-el"], "submitted_at": "2026-10-26T19:45:37Z", "updated_at": "2026-10-26T19:45:37Z", "announcement_date": "2026-10-28", "announcement_section": "new", "authors": "Hiroki Nakai, Hae-Young Kee", "corresponding": "", "url": "https://arxiv.org/abs/2610.36214v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper proposes an orbital-field interaction as a source of frustration in the honeycomb antiferromagnetic Heisenberg model. It reports a field-driven cascade of collinear magnetic phases followed by a transition to an incommensurate unidirectional spiral with spontaneous chiral-symmetry breaking.", "summary": "Frustration in magnetic systems gives rise to unconventional orders and exotic spin liquids. Here, we explore a new type of frustration arising from an intrinsic bond-dependent orbital-field that couples orbital degrees of freedom to spin correlations. Introducing this orbital-field interaction into the antiferromagnetic Heisenberg model on the honeycomb lattice, we show that local spin-orbital co", "abstract": "Frustration in magnetic systems gives rise to unconventional orders and exotic spin liquids. Here, we explore a new type of frustration arising from an intrinsic bond-dependent orbital-field that couples orbital degrees of freedom to spin correlations. Introducing this orbital-field interaction into the antiferromagnetic Heisenberg model on the honeycomb lattice, we show that local spin-orbital constraints generate a subextensive degeneracy, lifted by order-by-disorder to select distinct collinear magnets in a cascade of phases as the orbital field increases from a para-orbital liquid. At larger fields, the selected phase gives way to an incommensurate unidirectional spiral that spontaneously breaks chiral symmetry. This transition is driven by the coupling of a Goldstone mode to gapped dynamical spin-orbital fluctuations. The spin stiffness becomes negative along a particular direction, while the spiral wavevector grows as the square root of the distance from the transition, signaling a Lifshitz-type transition. We present a microscopic route to realizing this orbital field and discuss candidate materials.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "An orbital-field interaction lifts a subextensive degeneracy to select successive collinear magnetic phases, followed by a unidirectional spiral whose wavevector grows as the square root of the distance from a Lifshitz-type transition.", "ai_in_scope": true, "relevance_reason": "This is an original theory of frustrated quantum magnetism that predicts a field-driven sequence of magnetic phases and a Lifshitz-type transition.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "本文提出轨道场相互作用可在蜂窝反铁磁 Heisenberg 模型中产生一种挫折机制。研究预言随轨道场增强会出现一系列共线磁相，随后转变为具有自发手性对称性破缺的非公度单向螺旋态。", "method_en": "The authors introduce an intrinsic bond-dependent orbital-field coupling between orbital degrees of freedom and spin correlations in the honeycomb antiferromagnetic Heisenberg model. They analyze the degeneracy lifting by order-by-disorder and the fluctuations associated with the transition to spiral order.", "method_zh": "作者在蜂窝反铁磁 Heisenberg 模型中引入轨道自由度与自旋关联之间的内禀、依赖键方向的轨道场耦合。他们分析序无序效应如何解除简并，以及通向螺旋序转变时的涨落。", "result_en": "Local spin-orbital constraints produce a subextensive degeneracy that is lifted by order-by-disorder, selecting distinct collinear magnets as the orbital field increases from a para-orbital liquid. At larger fields, a transition leads to an incommensurate unidirectional spiral that spontaneously breaks chiral symmetry, driven by coupling between a Goldstone mode and gapped dynamical spin-orbital fluctuations. The spin stiffness becomes negative in one direction, and the spiral wavevector grows as the square root of the distance from the transition, indicating a Lifshitz-type transition.", "result_zh": "局域自旋—轨道约束产生次广延简并；轨道场从顺轨道液体状态增强时，序无序效应解除简并并依次选出不同的共线磁态。更强轨道场下，体系转变为自发破坏手性对称性的非公度单向螺旋态，该转变由 Goldstone 模与有能隙的动力学自旋—轨道涨落耦合驱动。某一方向的自旋刚度变为负值，螺旋波矢则按距转变点的距离平方根增长，表明这是 Lifshitz 型转变。", "future_en": "The authors describe a microscopic route to realizing the orbital field and discuss candidate materials for the proposed phases.", "future_zh": "作者讨论了实现该轨道场的一种微观途径，并提出了可能承载这些预言相的候选材料。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work presents a coherent theoretical phase sequence and a specific Lifshitz-type transition signature, along with a proposed microscopic route and candidate materials. Based on the abstract, the result is substantial but remains a theoretical proposal without reported experimental confirmation.", "tier_reason_zh": "该工作提出连贯的理论相序列和明确的 Lifshitz 型转变特征，并讨论了微观实现途径及候选材料。根据摘要，结果具有一定分量，但仍是尚无实验验证的理论方案。"}, {"id": "arxiv-2610-36501", "arxiv_id": "2610.36501", "type": "arXiv", "journal": "arXiv:2610.36501", "journal_ref": "", "journal_doi": "", "title": "Spin-Charge Conversion in an Epitaxial Kagome Flat-Band Metal", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mes-hall", "cond-mat.mtrl-sci"], "submitted_at": "2026-10-27T02:00:33Z", "updated_at": "2026-10-27T02:00:33Z", "announcement_date": "2026-10-28", "announcement_section": "new", "authors": "Wenyi Zhou, Yuqing Zhu, Katherine Johnson, Hari Paudyal, Duy Nguyen, Dimitri King, Jaden Ma, Jay A. Gupta, Michael E. Flatte, Roland K. Kawakami", "corresponding": "", "url": "https://arxiv.org/abs/2610.36501v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The authors investigate spin-charge conversion in epitaxial CoSn, a kagome flat-band metal, and report an effective spin Hall angle of 0.484 ± 0.005, compared with 0.0436 ± 0.0003 for Pt in Ni/Pt bilayers. Density functional theory calculations connect the intrinsic spin Hall effect to Berry curvature in momentum space.", "summary": "The formation of topological flat bands near the Fermi level in kagome-structured metals has generated substantial research interest. One key consequence of this electronic structure is the strong anisotropy in charge transport, such as the significantly higher in-plane resistivity relative to the out-of-plane direction. However, the spin transport properties of these flat-band kagome metals are s", "abstract": "The formation of topological flat bands near the Fermi level in kagome-structured metals has generated substantial research interest. One key consequence of this electronic structure is the strong anisotropy in charge transport, such as the significantly higher in-plane resistivity relative to the out-of-plane direction. However, the spin transport properties of these flat-band kagome metals are still largely unexplored. In this work, we investigate spin-charge conversion in CoSn, a representative flat-band kagome metal. Scanning tunneling microscopy is employed to image the CoSn surface with atomic resolution, and $dI/dV$ spectroscopy shows clear signatures of the flat bands. Using magneto-optical techniques, we quantify the spin-orbit torque (SOT) in bilayers of ferromagnetic nickel (Ni) and c-plane CoSn thin films. We find a large effective spin Hall angle of $θ_{SH} = 0.484 \\pm 0.005$ within the CoSn layers, significantly exceeding the value measured for Pt of $θ_{SH} = 0.0436 \\pm 0.0003$ in Ni/Pt bilayers. Density functional theory (DFT) calculations provide a microscopic understanding of the intrinsic spin Hall effect in CoSn, elucidating the sources of Berry curvature in momentum space. These findings establish kagome metals as promising materials for efficient spin-charge conversion and low-power spintronics.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "CoSn exhibits a large effective spin Hall angle, and the calculations identify momentum-space Berry curvature as a microscopic source of its intrinsic spin Hall response.", "ai_in_scope": true, "relevance_reason": "The work measures spin-charge conversion in a kagome flat-band metal and connects the large spin Hall response to its electronic Berry curvature, beyond merely reporting device performance.", "relevance_method": "semantic", "relevance_score": 71, "feature_candidate": false, "summary_zh": "作者研究外延 Kagome 平带金属 CoSn 中的自旋—电荷转换，测得有效自旋霍尔角为 0.484 ± 0.005；作为比较，Ni/Pt 双层中 Pt 的对应数值为 0.0436 ± 0.0003。密度泛函理论计算将本征自旋霍尔效应与动量空间中的 Berry 曲率联系起来。", "method_en": "The study combines atomic-resolution scanning tunneling microscopy and dI/dV spectroscopy with magneto-optical measurements of spin-orbit torque in Ni/CoSn bilayers, alongside density functional theory calculations.", "method_zh": "研究结合原子分辨扫描隧道显微镜与 dI/dV 谱、Ni/CoSn 双层中自旋轨道力矩的磁光测量，以及密度泛函理论计算。", "result_en": "The measured effective spin Hall angle in CoSn is 0.484 ± 0.005, substantially above the 0.0436 ± 0.0003 value measured for Pt in Ni/Pt bilayers. The calculations identify momentum-space Berry curvature as a source of the intrinsic spin Hall effect in CoSn.", "result_zh": "CoSn 中测得的有效自旋霍尔角为 0.484 ± 0.005，显著高于 Ni/Pt 双层中 Pt 的 0.0436 ± 0.0003。计算指出，动量空间 Berry 曲率是 CoSn 本征自旋霍尔效应的来源之一。", "future_en": "The findings motivate further exploration of kagome metals for efficient spin-charge conversion and low-power spintronic applications.", "future_zh": "这些发现为进一步探索 Kagome 金属在高效自旋—电荷转换和低功耗自旋电子学中的应用提供了依据。", "tier": "PRL", "tier_reason_en": "The abstract combines a large, quantitatively benchmarked spin Hall angle in a flat-band kagome metal with experimental spin-torque measurements and a first-principles account of its intrinsic origin, making the result potentially broad and timely enough for PRL.", "tier_reason_zh": "摘要报告了平带 Kagome 金属中较大且有定量对照的自旋霍尔角，并结合自旋力矩实验与本征效应的第一性原理解释；这一结果具有潜在的广泛意义与时效性，达到 PRL 水平。"}, {"id": "arxiv-2610-37003", "arxiv_id": "2610.37003", "type": "arXiv", "journal": "arXiv:2610.37003", "journal_ref": "", "journal_doi": "", "title": "Spontaneous topological diode effect induced by non-coplanar antiferromagnetic order", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci"], "submitted_at": "2026-10-27T10:48:17Z", "updated_at": "2026-10-27T10:48:17Z", "announcement_date": "2026-10-28", "announcement_section": "new", "authors": "Nguyen Duy Khanh, Hirotaka Takagi, Rina Takagi, Susumu Minami, Tatsuto Hatanaka, Hikaru Watanabe, Michi-To Suzuki, Yuki Yanagi, Aki Kitaori, Takuya Nomoto, Ryotaro Arita, Shinichiro Seki", "corresponding": "", "url": "https://arxiv.org/abs/2610.37003v1", "topic": "Magnetism", "level": "Feature", "summary_en": "This work reports zero-field nonreciprocal electron transport in the chiral-lattice, non-coplanar antiferromagnet CoTa3S6, attributing it to a spontaneous topological diode effect. First-principles calculations support a non-relativistic origin in which the magnetic order produces asymmetric band dispersions without spin–orbit coupling.", "summary": "In non-centrosymmetric bulk materials, electrons flowing in the opposite directions often exhibit different properties. This diode-like effect (i.e., non-reciprocal electron transport) typically originates from relativistic spin-orbit coupling, and its amplitude scales with external magnetic field or magnetization in ferromagnets. Although such rectification is usually absent in antiferromagnets a", "abstract": "In non-centrosymmetric bulk materials, electrons flowing in the opposite directions often exhibit different properties. This diode-like effect (i.e., non-reciprocal electron transport) typically originates from relativistic spin-orbit coupling, and its amplitude scales with external magnetic field or magnetization in ferromagnets. Although such rectification is usually absent in antiferromagnets at zero field, recent theories predict that non-coplanar antiferromagnetic order can host large non-reciprocity even without spin-orbit coupling, magnetization or external magnetic fields. This phenomenon - the spontaneous topological diode effect - can potentially be used for efficient electrical readout of antiferromagnetic domains, while it has not been verified for real materials. Here, we report the observation of this effect in a chiral-lattice non-coplanar antiferromagnet CoTa3S6. Nonlinear resistivity measurements reveal the non reciprocal nature of electron transport along the [001] direction at zero field. The observed non-reciprocity exceeds that in typical ferromagnets, whose amplitude is governed by antiferromagnetic order parameter rather than magnetization. First-principles calculations show that the non-coplanar antiferromagnetic order induces asymmetric band dispersions even without spin-orbit coupling, establishing the non-relativistic origin of the observed response. The present findings demonstrate a new mechanism for efficient electrical readout of antiferromagnetic domains, and highlight non-coplanar antiferromagnets as a promising material platform for realizing ferromagnet-like functional responses without relying on spin-orbit coupling or magnetization.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "Non-coplanar antiferromagnetic order in CoTa3S6 produces spontaneous nonreciprocal transport through asymmetric band dispersions even without spin-orbit coupling or magnetization.", "ai_in_scope": true, "relevance_reason": "It reports a new zero-field transport phenomenon in a non-coplanar antiferromagnet and supports its condensed-matter mechanism with first-principles calculations.", "relevance_method": "semantic", "relevance_score": 83, "feature_candidate": true, "summary_zh": "本研究报告了手性晶格非共面反铁磁体 CoTa3S6 中的零场非互易电子输运，并将其归因于自发拓扑二极管效应。第一性原理计算支持一种非相对论起源：磁序在不依赖自旋轨道耦合的情况下产生非对称能带色散。", "method_en": "The authors measure nonlinear resistivity along the [001] direction at zero magnetic field in CoTa3S6. They use first-principles calculations to examine the band dispersions associated with the non-coplanar antiferromagnetic order, including the case without spin–orbit coupling.", "method_zh": "作者在零磁场下测量 CoTa3S6 沿 [001] 方向的非线性电阻率。研究利用第一性原理计算考察非共面反铁磁序对应的能带色散，包括不含自旋轨道耦合的情形。", "result_en": "The nonlinear resistivity reveals nonreciprocal transport along [001] at zero field, demonstrating a spontaneous diode-like response in CoTa3S6. The reported nonreciprocity exceeds that in typical ferromagnets and is governed by the antiferromagnetic order parameter rather than magnetization. First-principles calculations show that the non-coplanar order induces asymmetric band dispersions even without spin–orbit coupling, supporting a non-relativistic explanation. The results identify non-coplanar antiferromagnets as a potential platform for electrical domain readout without relying on magnetization or spin–orbit coupling.", "result_zh": "非线性电阻率测量揭示了 CoTa3S6 沿 [001] 方向的零场非互易输运，展示出自发的二极管式响应。报告的非互易性强于典型铁磁体中的相应效应，并由反铁磁序参量而非磁化强度决定。第一性原理计算表明，即使没有自旋轨道耦合，非共面磁序也会诱导非对称能带色散，支持非相对论机制的解释。这些结果指出，非共面反铁磁体有望成为无需依赖磁化或自旋轨道耦合的电学磁畴读出平台。", "future_en": "Follow-up measurements could test whether the zero-field response can distinguish different antiferromagnetic domains and how robust it is to temperature and sample orientation. Comparisons with other non-coplanar antiferromagnets could clarify how general this non-relativistic diode mechanism is.", "future_zh": "后续测量可检验零场响应能否区分不同反铁磁磁畴，以及该响应对温度和样品取向的稳健性。与其他非共面反铁磁体进行比较，可进一步明确这种非相对论二极管机制的普遍程度。", "tier": "PRL", "tier_reason_en": "The observation of a strong zero-field diode response in a non-coplanar antiferromagnet, paired with calculations identifying a mechanism that does not require spin–orbit coupling, is a clear and conceptually broad experimental advance; the evidence is centered on one material and transport direction.", "tier_reason_zh": "在非共面反铁磁体中观测到显著零场二极管响应，并结合计算指出该机制不需要自旋轨道耦合，构成了清晰且具有概念广度的实验进展；不过，现有证据集中于一种材料和一个输运方向。"}, {"id": "arxiv-2610-36199", "arxiv_id": "2610.36199", "type": "arXiv", "journal": "arXiv:2610.36199", "journal_ref": "", "journal_doi": "", "title": "Three-dimensional quantum Hall insulators in magnetic pyrochlore systems", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.mes-hall", "cond-mat.str-el"], "submitted_at": "2026-10-26T19:38:18Z", "updated_at": "2026-10-26T19:38:18Z", "announcement_date": "2026-10-28", "announcement_section": "new", "authors": "Ze-Xun Lin, Robert-Jan Slager, Claudio Castelnovo", "corresponding": "", "url": "https://arxiv.org/abs/2610.36199v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper proposes a route to three-dimensional quantum Hall insulating behavior in magnetic pyrochlore systems, combining a field-selected three-in/one-out magnetic texture with flat-band interference. In the fully occupied lowest-band regime, it predicts a quantized bulk Hall response and chiral surface spectral flow.", "summary": "We show that a class of pyrochlore materials provides a route to realize 3D Quantum Hall insulators, based on magnetic texture and flat band interference. We study itinerant electrons on a pyrochlore lattice Kondo-coupled to localized moments living on another interpenetrating pyrochlore lattice, with the moments forming a field-selected three-in/one-out texture. The noncoplanar texture generates ", "abstract": "We show that a class of pyrochlore materials provides a route to realize 3D Quantum Hall insulators, based on magnetic texture and flat band interference. We study itinerant electrons on a pyrochlore lattice Kondo-coupled to localized moments living on another interpenetrating pyrochlore lattice, with the moments forming a field-selected three-in/one-out texture. The noncoplanar texture generates complex spin-dependent hopping amplitudes and unequal local exchange energies, reconstructing the compact-localized parent flat bands into narrow bands separated by a global three-dimensional gap. The low-energy states are concentrated predominantly on kagome planes within the three-dimensional lattice, reflecting the combined effects of quantum interference and the texture-induced sublattice potential. When the lowest band is fully occupied, the response is characterized by a Chern triplet $\\mathbf{C}=(1,1,1)$ and reciprocal Hall vector $\\mathbf{G}_{\\mathrm{H}}=(2π/a)(1,1,1)$, giving $σ_{yz}=σ_{zx}=σ_{xy}=e^2/(ha)$. The quantized bulk Hall response enforces chiral surface spectral flow, visible as noncontractible Fermi loops at the surface. Our work opens a new direction in the search for three-dimensional quantum Hall physics in magnetic pyrochlore systems, and suggests a broad design principle based on the interplay of magnetic texture and flat-band interference.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "A field-selected noncoplanar magnetic texture and flat-band interference can produce a three-dimensional Chern insulator with Chern triplet (1,1,1), quantized bulk Hall response, and chiral surface spectral flow.", "ai_in_scope": true, "relevance_reason": "It presents a concrete theoretical route to quantized three-dimensional Hall physics in a magnetic pyrochlore system.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": false, "summary_zh": "本文提出在磁性焦绿石系统中实现三维量子霍尔绝缘体的途径，结合了外场选定的“三进一出”磁纹理与平带干涉。最低能带完全占据时，理论预言体系具有量子化体霍尔响应和手性表面谱流。", "method_en": "The authors study itinerant electrons on a pyrochlore lattice, Kondo-coupled to localized moments on an interpenetrating pyrochlore lattice with a field-selected three-in/one-out texture. They analyze how the resulting spin-dependent hopping and sublattice energy differences reconstruct compact-localized parent flat bands.", "method_zh": "作者研究焦绿石格子上的巡游电子，并令其与另一交错焦绿石格子上的局域磁矩发生 Kondo 耦合；局域磁矩形成外场选定的“三进一出”纹理。研究分析由此产生的自旋依赖跃迁和子晶格能量差如何重构母体平带。", "result_en": "The reconstructed narrow bands are separated by a global three-dimensional gap, and their low-energy states are concentrated predominantly on kagome planes. With the lowest band fully occupied, the predicted Chern triplet is C=(1,1,1), the reciprocal Hall vector is G_H=(2π/a)(1,1,1), and σ_yz=σ_zx=σ_xy=e²/(ha). The quantized bulk response entails chiral surface spectral flow, manifested as noncontractible Fermi loops.", "result_zh": "重构后的窄能带之间存在全局三维能隙，低能态主要集中在 kagome 平面上。最低能带完全占据时，预言的陈数三元组为 C=(1,1,1)，倒格矢形式的霍尔矢量为 G_H=(2π/a)(1,1,1)，且 σ_yz=σ_zx=σ_xy=e²/(ha)。量子化体响应要求出现手性表面谱流，其表现为不可收缩的费米环。", "future_en": "The authors propose magnetic pyrochlore systems as a direction for searching for three-dimensional quantum Hall physics and suggest magnetic texture combined with flat-band interference as a broader design principle.", "future_zh": "作者提出可在磁性焦绿石系统中探索三维量子霍尔物理，并将磁纹理与平带干涉的结合概括为一种更广泛的设计思路。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work offers a specific theoretical mechanism and a sharply characterized three-dimensional topological response, but the abstract presents a model-based proposal rather than experimental realization or evidence of broader generality sufficient to favor a higher tier.", "tier_reason_zh": "该工作提出了具体的理论机制，并清楚刻画了三维拓扑响应；但摘要呈现的是基于模型的方案，尚无实验实现，也未显示足以支持更高档次的广泛验证。"}, {"id": "arxiv-2610-37575", "arxiv_id": "2610.37575", "type": "arXiv", "journal": "arXiv:2610.37575", "journal_ref": "", "journal_doi": "", "title": "Topological Criticality with Charge-\\(3e\\) Fluctuations in the \\(\\mathrm{SU}(3)\\) Triangular-Lattice Hofstadter--Hubbard Model", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.str-el"], "submitted_at": "2026-10-27T17:19:29Z", "updated_at": "2026-10-27T17:19:29Z", "announcement_date": "2026-10-28", "announcement_section": "new", "authors": "Yang Liu, Ya-Hui Zhang, Xue-Yang Song", "corresponding": "", "url": "https://arxiv.org/abs/2610.37575v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper investigates how an integer quantum Hall insulator can transition to an SU(3)₁ chiral spin liquid without closing the single-electron gap. It identifies enhanced neutral and charge-3e correlations near the transition as evidence for criticality involving composite excitations.", "summary": "A transition between an integer quantum Hall insulator and a chiral spin liquid can become critical without closing the single-electron gap, raising the question of which composite excitations govern the change in topological order. We investigate this question in the \\(\\mathrm{SU}(3)\\) triangular-lattice Hofstadter--Hubbard model at one particle per site and magnetic flux \\(π/3\\) per triangle. Us", "abstract": "A transition between an integer quantum Hall insulator and a chiral spin liquid can become critical without closing the single-electron gap, raising the question of which composite excitations govern the change in topological order. We investigate this question in the \\(\\mathrm{SU}(3)\\) triangular-lattice Hofstadter--Hubbard model at one particle per site and magnetic flux \\(π/3\\) per triangle. Using infinite density matrix renormalization group calculations, we identify a weak-coupling integer quantum Hall phase and an interaction-driven \\(\\mathrm{SU}(3)_1\\) chiral spin liquid. Near the transition, both the neutral and charge-\\(3e\\) correlation lengths increase substantially, whereas the single-electron correlation length remains short, providing evidence for a Chern--Simons--Higgs critical theory, where a gauge-invariant monopole carries the quantum numbers of a fermionic \\(\\mathrm{SU}(3)\\)-singlet trion. We discuss the implications for doping the system and recent experiments on doping \\(ν=-2/3\\) fractional quantum anomalous Hall in tMoTe\\(_2\\).", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Near the transition, neutral and charge-3e correlation lengths grow while the single-electron correlation length remains short, supporting a critical theory governed by a gauge-invariant fermionic trion excitation.", "ai_in_scope": true, "relevance_reason": "The work uses numerical many-body calculations to investigate a transition between an integer quantum Hall phase and a chiral spin liquid, a substantive advance in quantum-materials physics.", "relevance_method": "semantic", "relevance_score": 83, "feature_candidate": false, "summary_zh": "本文研究整数霍尔绝缘体如何在单电子能隙不闭合的情况下转变为 SU(3)₁ 手性自旋液体。转变附近中性与电荷 3e 关联长度显著增大，被作者视为复合激发参与临界行为的证据。", "method_en": "The authors use infinite density matrix renormalization group calculations for the SU(3) triangular-lattice Hofstadter–Hubbard model at one particle per site and flux π/3 per triangle. They examine correlations and correlation lengths across the interaction-driven transition.", "method_zh": "作者对 SU(3) 三角格 Hofstadter–Hubbard 模型进行无限密度矩阵重整化群计算，模型参数为每个格点一个粒子、每个三角形的磁通为 π/3。研究考察相互作用驱动转变两侧的关联及关联长度。", "result_en": "The calculations identify a weak-coupling integer quantum Hall phase and an interaction-driven SU(3)₁ chiral spin liquid. Near the transition, neutral and charge-3e correlation lengths increase substantially, while the single-electron correlation length remains short. This supports a Chern–Simons–Higgs critical theory in which a gauge-invariant monopole carries the quantum numbers of a fermionic SU(3)-singlet trion.", "result_zh": "计算识别出弱耦合整数霍尔相，以及由相互作用驱动形成的 SU(3)₁ 手性自旋液体。接近转变时，中性和电荷 3e 关联长度显著增大，而单电子关联长度仍较短。这支持一种 Chern–Simons–Higgs 临界理论，其中规范不变磁单极子具有费米型 SU(3) 单态三子（trion）的量子数。", "future_en": "The authors discuss implications for doping the system and for recent experiments on doping ν=−2/3 fractional quantum anomalous Hall states in tMoTe₂.", "future_zh": "作者讨论了这些结果对掺杂该模型的意义，以及对近期在 tMoTe₂ 中掺杂 ν=−2/3 分数量子反常霍尔态实验的启示。", "tier": "PRL", "tier_reason_en": "The work addresses a consequential question about topological transitions without a single-electron gap closing and provides numerical evidence for a distinctive charge-3e critical channel and a proposed field theory. The abstract supports a strong, focused result, though not a broader experimental demonstration warranting a higher tier.", "tier_reason_zh": "该工作探讨了单电子能隙不闭合时的拓扑相变这一重要问题，并为独特的电荷 3e 临界通道及相应场论提供数值证据。摘要所述结果有力且聚焦，但尚无足以支持更高档次的广泛实验验证。"}, {"id": "arxiv-2610-37367", "arxiv_id": "2610.37367", "type": "arXiv", "journal": "arXiv:2610.37367", "journal_ref": "", "journal_doi": "", "title": "Unconventional SOC-activated Altermagnetic Spin Splitting and Half-Angle Locking of Spin Transport", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci"], "submitted_at": "2026-10-27T15:01:49Z", "updated_at": "2026-10-27T15:01:49Z", "announcement_date": "2026-10-28", "announcement_section": "new", "authors": "Weiwei Chen, Ziyu Zhou, Pan Gao, Yanan Pan, Zhongjun Li, Ye Yang, Jianhui Zhou, Rui Wang", "corresponding": "", "url": "https://arxiv.org/abs/2610.37367v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The paper proposes a spin–orbit-coupling-activated contribution to altermagnetic spin splitting and connects its momentum-space angular pattern to directional spin transport. For hexagonal α-MnTe, it predicts out-of-plane d-wave splitting near Γ and an approximate half-angle relation between Néel-vector orientation and the directions maximizing spin conductivities.", "summary": "Conventional altermagnetic spin splitting arises from staggered exchange and sublattice-dependent anisotropic hopping without requiring spin-orbit coupling (SOC). Here we derive a low-energy effective model showing that SOC and staggered exchange can jointly activate additional spin splitting on momentum planes where the nonrelativistic contribution vanishes. In hexagonal $α$-MnTe, this SOC-activa", "abstract": "Conventional altermagnetic spin splitting arises from staggered exchange and sublattice-dependent anisotropic hopping without requiring spin-orbit coupling (SOC). Here we derive a low-energy effective model showing that SOC and staggered exchange can jointly activate additional spin splitting on momentum planes where the nonrelativistic contribution vanishes. In hexagonal $α$-MnTe, this SOC-activated contribution produces d-wave spin splitting near $Γ$ with out-of-plane spin polarization. Its leading angular pattern counter-rotates by half the in-plane Néel-vector rotation angle. First-principles spin-transport calculations reveal a corresponding approximate half-angle locking between the Néel-vector orientation and the electric-field directions maximizing the signed longitudinal and transverse spin conductivities. Analytical transport calculations based on the effective model trace this locking to the same angular coupling between momentum and the Néel vector that governs the spin-splitting pattern. Our findings connect the microscopic mechanism of SOC-activated altermagnetic spin splitting to directional spin transport, providing a theoretical basis for probing Néel-vector orientation and controlling spin-current generation.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "It predicts an out-of-plane-polarized d-wave spin splitting activated jointly by SOC and staggered exchange, with a half-angle relation between Néel-vector rotation and spin-splitting and spin-transport directions.", "ai_in_scope": true, "relevance_reason": "The paper develops a material-specific theory of SOC-activated altermagnetic spin splitting in α-MnTe and links it to distinctive spin transport.", "relevance_method": "semantic", "relevance_score": 76, "feature_candidate": false, "summary_zh": "本文提出一种由自旋轨道耦合激活的交错磁性自旋劈裂贡献，并将其动量空间角向图样与方向性自旋输运联系起来。对六方 α-MnTe，研究预测 Γ 点附近存在面外极化的 d 波劈裂，且 Néel 矢量取向与自旋电导最大方向之间近似满足半角关系。", "method_en": "The authors derive a low-energy effective model incorporating spin–orbit coupling and staggered exchange, and use first-principles calculations to examine spin transport in α-MnTe. They also perform analytical transport calculations to relate the angular dependence of spin splitting to that of the spin conductivities.", "method_zh": "作者推导了同时包含自旋轨道耦合和交错交换作用的低能有效模型，并通过第一性原理计算考察 α-MnTe 的自旋输运。他们还进行解析输运计算，以联系自旋劈裂与自旋电导的角向依赖。", "result_en": "The model yields an additional spin splitting on momentum planes where the nonrelativistic contribution vanishes; in α-MnTe, this appears as out-of-plane d-wave splitting near Γ. Its leading angular pattern counter-rotates by half the in-plane Néel-vector rotation angle, while first-principles and analytical transport results show an approximate half-angle locking between Néel-vector orientation and the electric-field directions maximizing signed longitudinal and transverse spin conductivities.", "result_zh": "该模型在非相对论贡献消失的动量平面上产生额外自旋劈裂；在 α-MnTe 中，这表现为 Γ 点附近的面外 d 波劈裂。其主导角向图样随面内 Néel 矢量旋转而反向变化，转角为其一半；第一性原理及解析输运结果则显示，Néel 矢量取向与使纵向和横向有符号自旋电导达到最大值的电场方向近似满足半角锁定。", "future_en": "The proposed relation suggests that directional spin-transport measurements could probe Néel-vector orientation and test the predicted spin-splitting mechanism. Further studies can assess how robust the approximate half-angle locking is across conditions and materials beyond the α-MnTe case considered here.", "future_zh": "所提出的关系表明，方向性自旋输运测量可用于探测 Néel 矢量取向，并检验预测的自旋劈裂机制。后续研究可考察除本文所讨论的 α-MnTe 外，该近似半角锁定在不同条件和材料中的稳健性。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The paper connects a proposed microscopic mechanism with first-principles and analytical transport calculations and identifies a distinctive angular relation, supporting a strong specialist theory contribution; the abstract does not establish broader validation or impact sufficient to justify a higher tier.", "tier_reason_zh": "该工作将所提出的微观机制与第一性原理及解析输运计算联系起来，并识别出鲜明的角向关系，构成较强的专业领域理论研究；但摘要尚未显示足以支撑更高档次的广泛验证或影响。"}, {"id": "arxiv-2610-36782", "arxiv_id": "2610.36782", "type": "arXiv", "journal": "arXiv:2610.36782", "journal_ref": "", "journal_doi": "", "title": "Real-Space Selection Rule for Moiré Exciton-Phonon Coupling", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci"], "submitted_at": "2026-10-27T07:48:30Z", "updated_at": "2026-10-27T07:48:30Z", "announcement_date": "2026-10-28", "announcement_section": "new", "authors": "Yixuan Liu, Shiyu Peng, Yifan Wang, Peiyao Qin, Wang Yao, Chen Hu", "corresponding": "", "url": "https://arxiv.org/abs/2610.36782v1", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "The paper develops a real-space account of exciton–phonon coupling in moiré systems and identifies a selection rule governed by spatial matching and coherent interference of electron and hole contributions. In WSe2/WS2 moiré heterobilayers, this framework predicts strongly mode-dependent coupling, including near-total suppression from destructive interference.", "summary": "Exciton-phonon coupling (ExPC) governs energy relaxation and exciton dynamics in photoexcited quantum materials. Recent advances have revealed rich and tunable excitonic phenomena in moiré superlattices, yet the microscopic mechanisms underlying the coupling between moiré excitons and moiré phonons remain elusive. Here, we develop a real-space representation for moiré ExPC based on a unified theor", "abstract": "Exciton-phonon coupling (ExPC) governs energy relaxation and exciton dynamics in photoexcited quantum materials. Recent advances have revealed rich and tunable excitonic phenomena in moiré superlattices, yet the microscopic mechanisms underlying the coupling between moiré excitons and moiré phonons remain elusive. Here, we develop a real-space representation for moiré ExPC based on a unified theoretical framework combining the many-body Bethe-Salpeter equation with phonon perturbation theory. Furthermore, we uncover a general real-space selection rule: the spatial matching of a moiré exciton's electron and hole densities with the moiré-phonon-induced potential perturbations determines their individual coupling contributions, while coherent interference between the electron and hole contributions controls the total ExPC. We demonstrate this rule in prototypical WSe2/WS2 moiré heterobilayers, revealing pronounced exciton- and phonon-mode-dependent coupling, including nearly complete suppression of ExPC through destructive electron-hole interference. These findings establish the internal electron-hole spatial configuration of moiré excitons as a key degree of freedom governing the strength and mode selectivity of their coupling to moiré phonons, opening opportunities to engineer ExPC through spatially tailored moiré potentials.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "A real-space selection rule connects moiré exciton electron and hole densities to phonon-induced potentials, showing that their coherent interference can nearly suppress exciton-phonon coupling.", "ai_in_scope": true, "relevance_reason": "This theoretical study identifies a specific mechanism for exciton-phonon coupling in moiré quantum materials, including a predicted near-cancellation from electron-hole interference.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "本文建立了莫尔体系中激子—声子耦合的实空间描述，并提出一种由空间匹配及电子、空穴贡献的相干干涉决定的选择定则。在 WSe2/WS2 莫尔异质双层中，该框架预测耦合具有显著的模式依赖性，并可因相消干涉而几乎完全受到抑制。", "method_en": "The authors combine the many-body Bethe–Salpeter equation with phonon perturbation theory to formulate moiré exciton–phonon coupling in real space. They analyze how the exciton electron and hole densities overlap with phonon-induced potential perturbations and how their contributions interfere.", "method_zh": "作者将多体 Bethe–Salpeter 方程与声子微扰理论结合，构建莫尔激子—声子耦合的实空间表述。他们分析激子的电子与空穴密度同声子诱导势扰动之间的重叠，以及两类贡献之间的干涉。", "result_en": "The proposed selection rule links each electron and hole coupling contribution to the spatial match between its density and the phonon-induced perturbation, while the total coupling depends on their coherent interference. For WSe2/WS2 moiré heterobilayers, the calculations show pronounced dependence on exciton and phonon mode and near-complete suppression of coupling through destructive electron–hole interference.", "result_zh": "所提出的选择定则将电子和空穴各自的耦合贡献与其密度和声子诱导扰动之间的空间匹配联系起来，而总耦合则取决于两者的相干干涉。对 WSe2/WS2 莫尔异质双层的计算显示，耦合显著依赖激子和声子模式，并可因电子—空穴相消干涉而几乎完全消失。", "future_en": "The results suggest that tailoring moiré potentials and exciton spatial configurations could provide a route to controlling the strength and mode selectivity of exciton–phonon coupling. Applying the real-space framework to other moiré systems would test how broadly the proposed selection rule applies.", "future_zh": "这些结果表明，调控莫尔势及激子的空间构型可能成为控制激子—声子耦合强度和模式选择性的途径。将实空间框架应用于其他莫尔体系，可检验该选择定则的适用范围。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The abstract describes a useful general theoretical framework and a striking heterobilayer prediction, but provides no evidence of experimental validation or broader consequences that would clearly support a higher tier.", "tier_reason_zh": "摘要提出了有用的一般理论框架，并给出异质双层中的显著预测，但未显示实验验证或足以明确支撑更高档次的广泛影响。"}, {"id": "arxiv-2610-36332", "arxiv_id": "2610.36332", "type": "arXiv", "journal": "arXiv:2610.36332", "journal_ref": "", "journal_doi": "", "title": "Large superconducting diode effect indicates nonuniform triplet pairing in UTe2", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.str-el", "cond-mat.supr-con"], "submitted_at": "2026-10-26T22:02:42Z", "updated_at": "2026-10-26T22:02:42Z", "announcement_date": "2026-10-28", "announcement_section": "new", "authors": "Zheyu Wu, Daniel Shaffer, Dmitry V. Chichinadze, Mengmeng Long, Hanyi Chen, Andrej Cabala, Theodore I. Weinberger, Maurice Bal, Steffen Wiedmann, Dave Graf, Vladimir Sechovský, Michal Vališka, F. Malte Grosche, Alex Levchenko, Alexander G. Eaton", "corresponding": "", "url": "https://arxiv.org/abs/2610.36332v1", "topic": "Superconductivity", "level": "Feature", "summary_en": "The authors report a large superconducting diode effect in bulk triplet superconductor UTe2, reaching 33% efficiency at 33.6 T. Its confinement to a narrow field range where superconductivity coexists with a field-induced spin-polarized state supports an interpretation in terms of finite-momentum, nonuniform pairing.", "summary": "The superconducting diode effect (SDE) is characterized by unequal critical current magnitudes for opposite-polarity current flow, owing to broken spatial-inversion and time-reversal symmetries. For a superconducting pair wavefunction to spontaneously break inversion symmetry implies the formation of Cooper pairs with nonzero momentum, yielding a nonuniform superconducting state. For singlet super", "abstract": "The superconducting diode effect (SDE) is characterized by unequal critical current magnitudes for opposite-polarity current flow, owing to broken spatial-inversion and time-reversal symmetries. For a superconducting pair wavefunction to spontaneously break inversion symmetry implies the formation of Cooper pairs with nonzero momentum, yielding a nonuniform superconducting state. For singlet superconductors, the formation of such a (FFLO) state has long been understood to provide an escape from high field Pauli pair-breaking -- how and why such an effect might occur for equal spin pairing is an open question. Here we report the observation of a large SDE in bulk specimens of the three-dimensional heavy-fermion triplet superconductor UTe$_2$, with a peak diode efficiency of 33% at the high magnetic field strength of 33.6 T, representing the highest-field observation of the SDE to date. Crucially, this nonreciprocal transport is strictly confined to a narrow field regime where superconductivity coexists with a field-induced spin-polarized state near a first-order metamagnetic phase boundary. The absence of the SDE away from this sle
