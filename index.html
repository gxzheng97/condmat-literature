nder phase-intersection argues strongly against purely extrinsic vortex pinning asymmetries. Instead, our findings indicate spontaneous inversion symmetry breaking accompanied by finite-momentum Cooper pairing. We model this behavior using a phenomenological Ginzburg-Landau theory, demonstrating that the intertwining of magnetic and triplet superconducting orders can stabilize an odd-parity FFLO state.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "A large superconducting diode effect appears only where superconductivity intersects a field-induced spin-polarized state near a metamagnetic boundary, supporting a finite-momentum, odd-parity superconducting state.", "ai_in_scope": true, "relevance_reason": "It reports a distinctive superconducting transport effect in a heavy-fermion material and connects it to triplet pairing and a field-induced magnetic state.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": true, "summary_zh": "作者在块体三重态超导体 UTe2 中观测到显著的超导二极管效应，在 33.6 T 时效率达到 33%。该效应仅出现在超导与场诱导自旋极化态共存的狭窄磁场区间，支持有限动量非均匀配对的解释。", "method_en": "The study measures nonreciprocal critical currents in bulk UTe2 as a function of magnetic field, identifying where the diode response occurs relative to the field-induced spin-polarized state and metamagnetic phase boundary. The authors also model the behavior using a phenomenological Ginzburg–Landau theory coupling magnetic and triplet superconducting orders.", "method_zh": "研究测量块体 UTe2 中随磁场变化的非互易临界电流，并确定二极管响应相对于场诱导自旋极化态和变磁相边界出现的区域。作者还采用唯象 Ginzburg–Landau 理论，对磁序与三重态超导序耦合所产生的行为进行建模。", "result_en": "The peak diode efficiency reaches 33% at 33.6 T, reported as the highest magnetic field at which the SDE had been observed. Crucially, the nonreciprocal response is confined to a narrow field regime in which superconductivity coexists with a field-induced spin-polarized state near a first-order metamagnetic phase boundary. The absence of the effect outside this regime argues against an explanation based solely on extrinsic vortex-pinning asymmetries. The authors interpret the observations as evidence for spontaneous inversion-symmetry breaking and finite-momentum Cooper pairing, and their model shows how intertwined magnetic and triplet superconducting orders can stabilize an odd-parity FFLO state.", "result_zh": "二极管效应峰值效率在 33.6 T 达到 33%；作者称这是迄今观测到该效应的最高磁场。关键的是，非互易响应局限于一个狭窄磁场区间，其中超导态与场诱导自旋极化态在一阶变磁相边界附近共存。效应在该区间之外消失，这不支持仅以外禀涡旋钉扎不对称性解释观测结果。作者将观测解释为自发反演对称性破缺和有限动量库珀配对的证据；其模型则表明，磁序与三重态超导序的交织可稳定奇宇称 FFLO 态。", "future_en": "A valuable follow-up would be to map the diode response more finely across the narrow field regime and determine how it changes with temperature and field orientation. Independent probes sensitive to finite-momentum pairing could further test the proposed odd-parity FFLO interpretation.", "future_zh": "后续可在该狭窄磁场区间内更精细地绘制二极管响应，并研究其随温度和磁场方向的变化。采用对有限动量配对敏感的独立探测手段，可进一步检验所提出的奇宇称 FFLO 解释。", "tier": "PRL", "tier_reason_en": "The record-high-field, 33%-efficient diode response in a bulk triplet superconductor, together with its sharply defined relation to a metamagnetic phase regime, makes a substantial experimental result with broad relevance to unconventional superconductivity; the pairing interpretation is compelling but remains an interpretation supported by transport and phenomenological modelling.", "tier_reason_zh": "该工作在块体三重态超导体中报告了高达 33% 的二极管效率，并将其与变磁相区间明确关联，构成对非常规超导具有广泛意义的重要实验结果；配对机制的解释颇具说服力，但目前仍是由输运测量和唯象建模支持的解释。"}, {"id": "arxiv-2610-36053", "arxiv_id": "2610.36053", "type": "arXiv", "journal": "arXiv:2610.36053", "journal_ref": "", "journal_doi": "", "title": "Proximity-Induced Giant Majorana Spin Response in a UTe$_2$-Metal Film Heterostructure", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.supr-con"], "submitted_at": "2026-10-26T18:00:05Z", "updated_at": "2026-10-26T18:00:05Z", "announcement_date": "2026-10-28", "announcement_section": "new", "authors": "Jushin Tei, Makoto Shimizu, Yukio Tanaka, Satoshi Fujimoto, Takeshi Mizushima", "corresponding": "", "url": "https://arxiv.org/abs/2610.36053v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "The paper proposes using a metal film coupled by proximity to UTe2 to make the Ising spin response of Majorana surface states accessible to NMR. It argues that disorder can enhance the relative Majorana signature by suppressing conventional p-wave proximity correlations while preserving the Majorana contribution.", "summary": "We establish an experimentally accessible route to identifying Majorana surface states through their intrinsic Ising spin response, using UTe$_2$ as a concrete platform. The key is to extend the Majorana correlations into an adjacent metallic film via the superconducting proximity effect, thereby making the otherwise surface-localized response accessible to NMR measurements. Remarkably, disorder f", "abstract": "We establish an experimentally accessible route to identifying Majorana surface states through their intrinsic Ising spin response, using UTe$_2$ as a concrete platform. The key is to extend the Majorana correlations into an adjacent metallic film via the superconducting proximity effect, thereby making the otherwise surface-localized response accessible to NMR measurements. Remarkably, disorder further sharpens the Majorana signature: impurity scattering suppresses the conventional $p$-wave proximity correlations while preserving the Majorana contribution, yielding a giant Ising-anisotropic enhancement of the NMR relaxation rate. This approach also offers a powerful means to distinguish among candidate pairing symmetries.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "The theory predicts that disorder suppresses conventional p-wave proximity correlations while preserving Majorana contributions, producing a giant Ising-anisotropic enhancement of NMR relaxation in an adjacent metal.", "ai_in_scope": true, "relevance_reason": "It develops a testable NMR signature of Majorana surface states in a superconducting quantum material and explains how disorder can enhance that signature.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "本文提出利用与 UTe2 邻接的金属薄膜，使 Majorana 表面态的 Ising 自旋响应能够通过核磁共振探测。作者指出，无序可抑制常规 p 波邻近效应关联而保留 Majorana 贡献，从而增强其相对信号。", "method_en": "The authors analyze a superconducting proximity structure in which Majorana correlations extend from UTe2 into an adjacent metallic film, whose spin response is accessible to NMR. They consider impurity scattering as a means of distinguishing the Majorana contribution from conventional p-wave proximity correlations.", "method_zh": "作者研究了超导邻近结构，其中 Majorana 关联从 UTe2 延伸至相邻金属薄膜，使该薄膜的自旋响应可通过核磁共振测量。他们考察杂质散射如何区分 Majorana 贡献与常规 p 波邻近效应关联。", "result_en": "The proposed mechanism produces a giant Ising-anisotropic enhancement of the NMR relaxation rate in the metal film. The abstract attributes the enhancement to impurity scattering that suppresses conventional p-wave proximity correlations while preserving the Majorana contribution, and notes that the approach could distinguish candidate pairing symmetries.", "result_zh": "该机制预测金属薄膜中的核磁共振弛豫率会出现巨大的 Ising 各向异性增强。摘要将这一增强归因于杂质散射抑制常规 p 波邻近效应关联、同时保留 Majorana 贡献，并指出该方法有望区分不同的候选配对对称性。", "future_en": "NMR measurements on UTe2–metal heterostructures could test the predicted anisotropic relaxation response and evaluate its usefulness in distinguishing candidate pairing symmetries. The proposal also motivates examining how the signal depends on disorder in the proximity-coupled film.", "future_zh": "对 UTe2–金属异质结构进行核磁共振测量，可检验所预测的各向异性弛豫响应，并评估其区分候选配对对称性的能力。该方案也促使人们进一步考察邻近耦合薄膜中的信号如何依赖无序。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The abstract presents a focused theoretical proposal for probing Majorana surface states and a potentially useful disorder-based contrast, but does not report experimental confirmation or evidence of impact broad enough to warrant a higher tier.", "tier_reason_zh": "摘要提出了一种针对 Majorana 表面态的具体理论探测方案，并给出可能有用的无序对比机制；但未报告实验验证，也未显示足以支撑更高档次的广泛影响。"}, {"id": "arxiv-2610-36358", "arxiv_id": "2610.36358", "type": "arXiv", "journal": "arXiv:2610.36358", "journal_ref": "", "journal_doi": "", "title": "Vortex anisotropy in chiral and nematic superconductors with strain", "arxiv_version": 1, "primary_category": "cond-mat.supr-con", "categories": ["cond-mat.str-el", "cond-mat.supr-con"], "submitted_at": "2026-10-26T22:24:01Z", "updated_at": "2026-10-26T22:24:01Z", "announcement_date": "2026-10-28", "announcement_section": "new", "authors": "David Shuliutsky, Moshe Goldstein", "corresponding": "", "url": "https://arxiv.org/abs/2610.36358v1", "topic": "Superconductivity", "level": "Brief", "summary_en": "The paper studies how strain affects vortex anisotropy in two-component nematic and chiral superconductors, motivated by contrasting observations in 4Hb-TaS₂. It finds that strain can produce a nematic-like upper critical field near the transition alongside much weaker, chiral-like vortex anisotropy at lower temperatures.", "summary": "Unconventional superconductors with a two-component order parameter support the existence of a rotational symmetry breaking nematic phase and a time-reversal symmetry breaking chiral phase. A recent experiment on 4Hb-TaS$_2$ surprisingly shows both twofold anisotropy in $H_{c2}$, which suggests nematic superconductivity, as well as isotropic vortices at low temperatures, which suggest chiral super", "abstract": "Unconventional superconductors with a two-component order parameter support the existence of a rotational symmetry breaking nematic phase and a time-reversal symmetry breaking chiral phase. A recent experiment on 4Hb-TaS$_2$ surprisingly shows both twofold anisotropy in $H_{c2}$, which suggests nematic superconductivity, as well as isotropic vortices at low temperatures, which suggest chiral superconductivity. To resolve this apparent conundrum we write down the appropriate Ginzburg-Landau equations and develop a numerically efficient algorithm for finding vortex solutions, allowing us to study their shape and anisotropy over a broad parameter range. We also demonstrate analytically that, to leading order, the vortex anisotropy is independent of strain in the nematic case, but is linearly dependent on it in the chiral phase, providing a possible way to distinguish the two phases. Using all these results we show that, in the presence of strain, in a large parameter regime the system behaves nematically near the transition, leading to an anisotropy of $H_{c2}$, but is dominantly chiral away from the transition, leading to parametrically smaller vortex anisotropy, in line with the experiment.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "In a broad parameter regime, strain permits nematic behavior near the transition but predominantly chiral behavior farther below it; vortex anisotropy is strain-independent to leading order for the nematic phase and linear in strain for the chiral phase.", "ai_in_scope": true, "relevance_reason": "The paper develops a superconducting-order-parameter theory that addresses observed anisotropy through a concrete prediction distinguishing chiral from nematic superconductivity.", "relevance_method": "semantic", "relevance_score": 75, "feature_candidate": false, "summary_zh": "本文研究应变如何影响具有二分量序参量的向列和手性超导体中的涡旋各向异性，动机来自 4Hb-TaS₂ 中相互矛盾的实验迹象。研究发现，应变可使体系在转变附近呈现向列型上临界场，而在较低温度下同时具有较弱、近似手性态的涡旋各向异性。", "method_en": "The authors formulate Ginzburg–Landau equations and develop a numerically efficient algorithm to find vortex solutions across a broad parameter range. They also derive the leading strain dependence of vortex anisotropy analytically for the nematic and chiral cases.", "method_zh": "作者建立 Ginzburg–Landau 方程，并开发高效数值算法，在广泛参数范围内求解涡旋解。他们还分别解析推导了向列态和手性态中涡旋各向异性的最低阶应变依赖。", "result_en": "To leading order, vortex anisotropy is independent of strain in the nematic case but depends linearly on strain in the chiral case. With strain, a large parameter regime behaves nematically near the transition, producing anisotropic Hc2, but is dominantly chiral away from the transition, where vortex anisotropy is parametrically smaller. This behavior is consistent with the combination of observations reported for 4Hb-TaS₂.", "result_zh": "在最低阶近似下，向列态的涡旋各向异性与应变无关，而手性态的涡旋各向异性随应变线性变化。在应变存在时，相当大的参数范围内，体系在转变附近表现为向列态并产生各向异性的 Hc2；远离转变时则主要呈手性特征，涡旋各向异性在参数上显著较小。这与 4Hb-TaS₂ 报道的两种实验现象并存相符。", "future_en": "The authors present strain dependence of vortex anisotropy as a possible way to distinguish nematic from chiral superconductivity.", "future_zh": "作者提出，可将涡旋各向异性对应变的依赖关系作为区分向列超导与手性超导的一种可能方法。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The study combines an analytical diagnostic with efficient vortex calculations and addresses a specific experimental puzzle, making it a solid theoretical contribution. The abstract does not indicate a sufficiently broad result or direct experimental test to support a higher tier.", "tier_reason_zh": "该研究将解析诊断与高效涡旋计算结合起来，并针对具体实验疑难给出解释，是一项扎实的理论工作。摘要未显示足够广泛的结果或直接实验检验，因此不支持评为更高档次。"}, {"id": "arxiv-2610-37301", "arxiv_id": "2610.37301", "type": "arXiv", "journal": "arXiv:2610.37301", "journal_ref": "", "journal_doi": "", "title": "Hydrodynamic fluctuations in Luttinger liquids", "arxiv_version": 1, "primary_category": "cond-mat.mes-hall", "categories": ["cond-mat.mes-hall", "physics.flu-dyn"], "submitted_at": "2026-10-27T14:21:45Z", "updated_at": "2026-10-27T14:21:45Z", "announcement_date": "2026-10-28", "announcement_section": "new", "authors": "Alex Levchenko", "corresponding": "", "url": "https://arxiv.org/abs/2610.37301v1", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The paper develops a fluctuating two-fluid hydrodynamic theory for one-dimensional quantum liquids, distinguishing exponentially slow equilibration from power-law thermalization. It applies the theory to Coulomb-coupled wires to predict signatures in density response, drag, and near-field heat transfer.", "summary": "We develop the theory of hydrodynamic fluctuations for one-dimensional quantum liquids. At low temperatures the relaxation of interacting electrons in a single-channel wire separates into two classes: equilibration, which changes the numbers of right and left movers through backscattering and is exponentially slow, and thermalization, which redistributes energy and momentum at a fixed number of mo", "abstract": "We develop the theory of hydrodynamic fluctuations for one-dimensional quantum liquids. At low temperatures the relaxation of interacting electrons in a single-channel wire separates into two classes: equilibration, which changes the numbers of right and left movers through backscattering and is exponentially slow, and thermalization, which redistributes energy and momentum at a fixed number of movers at a power-law rate. This separation of time scales gives the electron liquid a two-fluid description analogous to superfluid $^4$He, with the zero mode of the Luttinger liquid as the superfluid component and the gas of thermal excitations as the normal component. Using Onsager reciprocity and the fluctuation-dissipation theorem, we add Langevin fluxes to the two-fluid hydrodynamic equations, including a mutual-friction noise generated by rare backscattering events that has no counterpart in helium. We apply the theory to Coulomb-coupled quantum wires and calculate the dynamic structure factors, which contain a second-sound peak next to the plasmon doublet; the Coulomb drag resistivity, where intrawire equilibration acts as a bottleneck and turns the hydrodynamic drag into an activated temperature dependence; and the near-field heat transfer between the wires. Mode frequencies, spectral weights, linewidths, and the crossover scales of the transport coefficients are expressed through the thermodynamic properties of the liquid and a few dissipative coefficients, providing spectroscopic and transport probes of two-fluid behavior in one-dimensional quantum systems.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "The theory predicts a two-fluid hydrodynamic regime in Luttinger liquids, including a second-sound peak, an activated Coulomb-drag dependence from the equilibration bottleneck, and mutual-friction noise from rare backscattering.", "ai_in_scope": true, "relevance_reason": "This develops experimentally relevant hydrodynamics and transport predictions for interacting one-dimensional quantum electrons, including distinctive signatures of two-fluid behavior.", "relevance_method": "semantic", "relevance_score": 79, "feature_candidate": false, "summary_zh": "本文为一维量子液体建立含涨落的双流体流体动力学理论，区分了指数级缓慢的平衡化与按幂律发生的热化。作者将该理论应用于库仑耦合量子线，预测其密度响应、拖曳效应和近场热传递中的特征。", "method_en": "The authors construct two-fluid hydrodynamic equations with Langevin fluxes using Onsager reciprocity and the fluctuation-dissipation theorem, including noise from rare backscattering events. They derive dynamic structure factors, Coulomb drag resistivity, and near-field heat transfer in coupled wires in terms of thermodynamic properties and dissipative coefficients.", "method_zh": "作者基于昂萨格互易关系和涨落耗散定理建立含朗之万通量的双流体方程，并纳入罕见回散射事件产生的噪声。随后，他们用热力学性质和耗散系数推导耦合量子线的动态结构因子、库仑拖曳电阻率及近场热传递。", "result_en": "The theory predicts a second-sound peak alongside the plasmon doublet in the dynamic structure factor. It finds that intrawire equilibration bottlenecks hydrodynamic Coulomb drag, producing activated temperature dependence, and relates mode frequencies, spectral weights, linewidths, and transport crossover scales to thermodynamic and dissipative parameters.", "result_zh": "该理论预测动态结构因子中的等离子体双峰旁会出现第二声峰。研究还指出，线内平衡化会限制流体动力学库仑拖曳，使其呈现激活型温度依赖；模式频率、谱权重、线宽和输运交叉尺度则由热力学参数及耗散参数决定。", "future_en": "The predicted spectral and transport signatures provide concrete targets for spectroscopic and transport tests of two-fluid behavior in one-dimensional quantum systems. Further application to specific wire systems could assess how the predicted crossover scales and activated drag appear under experimentally relevant conditions.", "future_zh": "文中预测的谱学与输运特征为检验一维量子系统中的双流体行为提供了具体目标。将理论进一步应用于特定量子线体系，可研究这些交叉尺度和激活型拖曳在实际实验条件下的表现。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work presents a broad, technically developed hydrodynamic framework and several connected transport and spectroscopic predictions, but the abstract describes a theory application rather than a demonstrated result of unusually broad impact warranting a higher tier.", "tier_reason_zh": "该工作提出了较为系统的流体动力学框架，并给出相互关联的输运和谱学预测；但摘要呈现的是理论及其应用，尚不足以显示达到更高期刊档次所需的特别广泛影响。"}, {"id": "arxiv-2610-36799", "arxiv_id": "2610.36799", "type": "arXiv", "journal": "arXiv:2610.36799", "journal_ref": "", "journal_doi": "", "title": "Stripe antiferromagnetic order and spin dynamics in the Shastry-Sutherland Ising compound Er2Be2GeO7", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.str-el"], "submitted_at": "2026-10-27T08:02:24Z", "updated_at": "2026-10-27T08:02:24Z", "announcement_date": "2026-10-28", "announcement_section": "new", "authors": "Donger Cheng, Otkur Omar, Wenbin Wei, Jan Peter Embs, Xiao Wang, Cheng Su, Hui Cheng, Zhengdong Fu, Xinzhi Liu, Wentao Jin, Ze Hu, Wei Luo, Liming Wang, Jiazheng Hao, Feiran Shen, Lunhua He, Shang Gao, Erxi Feng", "corresponding": "", "url": "https://arxiv.org/abs/2610.36799v1", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The authors characterize magnetic order and spin dynamics in the Shastry–Sutherland Ising compound Er2Be2GeO7, finding k = (0,0,0) stripe-like antiferromagnetic order below TN = 0.84 K. They also report gapped, weakly dispersive excitations and use modeling to account for the excitations and fractional magnetization plateaus.", "summary": "In rare-earth compounds, the interplay between geometric frustration and unusual single-ion anisotropy caused by the crystal electric field often leads to exotic magnetic phases. Here, we investigate the magnetic properties of the rare-earth Shastry-Sutherland compound Er$_2$Be$_2$GeO$_7$ using bulk measurements and neutron scattering down to sub-Kelvin temperatures. A $k=(0,0,0)$ stripe-like anti", "abstract": "In rare-earth compounds, the interplay between geometric frustration and unusual single-ion anisotropy caused by the crystal electric field often leads to exotic magnetic phases. Here, we investigate the magnetic properties of the rare-earth Shastry-Sutherland compound Er$_2$Be$_2$GeO$_7$ using bulk measurements and neutron scattering down to sub-Kelvin temperatures. A $k=(0,0,0)$ stripe-like antiferromagnetic order with locally tilted Er$^{3+}$ moments is revealed by time-of-flight neutron powder diffraction, accompanied with a $λ$-shape specific-heat anomaly at $T_N=0.84$ K. The temperature dependence of the magnetic peak intensity corresponding to the ordered moment of Er$^{3+}$ approximates to the two-dimensional Ising universality class. Thermal- and cold-neutron inelastic scattering experiments demonstrate that the strong Ising anisotropy originates from the local crystal electric field, and reveal gapped magnetic excitations with weak dispersion in the ordered state. Mean-field random-phase approximation with inequivalent nearest-neighbor couplings accounts well for the collective excitations, while classical Monte Carlo simulations yield the fractional $1/4$ and $1/2$ magnetization plateaus. Our work provides a comprehensive description of the spin correlations in Er$_2$Be$_2$GeO$_7$ with a particular focus on the classical origin of its fractional magnetization plateaus.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "Er2Be2GeO7 has stripe-like antiferromagnetic order with locally tilted moments, strong crystal-field-derived Ising anisotropy, and weakly dispersive gapped excitations; its order-parameter behavior is consistent with the two-dimensional Ising universality clas", "ai_in_scope": true, "relevance_reason": "Neutron scattering and bulk measurements establish distinctive low-temperature magnetic order and excitations in a frustrated rare-earth quantum magnet.", "relevance_method": "semantic", "relevance_score": 76, "feature_candidate": false, "summary_zh": "作者研究 Shastry–Sutherland Ising 化合物 Er2Be2GeO7 的磁有序与自旋动力学，发现其在 TN = 0.84 K 以下形成 k = (0,0,0) 条纹状反铁磁序。他们还观测到有能隙且色散较弱的激发，并通过建模解释这些激发及分数磁化平台。", "method_en": "The work combines bulk measurements, time-of-flight neutron powder diffraction, and thermal- and cold-neutron inelastic scattering down to sub-kelvin temperatures, with mean-field random-phase-approximation modeling and classical Monte Carlo simulations.", "method_zh": "研究结合体性质测量、飞行时间中子粉末衍射、热中子与冷中子非弹性散射（温度低至亚开尔文），并采用平均场随机相位近似建模和经典蒙特卡洛模拟。", "result_en": "Neutron diffraction reveals k = (0,0,0) stripe-like antiferromagnetic order with locally tilted Er3+ moments, accompanied by a lambda-shaped specific-heat anomaly at TN = 0.84 K; the ordered-moment intensity approximately follows two-dimensional Ising universality. Inelastic scattering finds gapped, weakly dispersive excitations, which the authors account for using inequivalent nearest-neighbor couplings and the local crystal electric field. Classical Monte Carlo simulations yield fractional 1/4 and 1/2 magnetization plateaus.", "result_zh": "中子衍射揭示了 k = (0,0,0) 条纹状反铁磁序及局部倾斜的 Er3+ 磁矩，并观测到 TN = 0.84 K 处的 λ 形比热异常；有序磁矩强度随温度的变化近似符合二维 Ising 普适类。非弹性散射发现有能隙且色散较弱的激发，作者以不等价最近邻耦合和局部晶体电场加以描述。经典蒙特卡洛模拟得到 1/4 和 1/2 分数磁化平台。", "future_en": "The authors frame the work as a comprehensive account of spin correlations in Er2Be2GeO7 and emphasize clarifying the classical origin of its fractional magnetization plateaus.", "future_zh": "作者将该工作定位为对 Er2Be2GeO7 自旋关联的系统描述，并着重阐明其分数磁化平台的经典起源。", "tier": "PRB", "tier_reason_en": "The abstract presents a substantial, multi-technique characterization and modeling of magnetic order and excitations in a specific frustrated Ising compound, a strong fit for PRB-level condensed-matter research but not evidence of broader conceptual impact at a higher tier.", "tier_reason_zh": "摘要展示了对一种特定受挫 Ising 化合物的磁有序与激发所进行的多手段系统表征和建模，适合 PRB 水平的凝聚态研究；摘要所示的概念影响范围尚不足以支持更高层级。"}], "stats": {"scanned": 169, "first_pass_selected": 32, "selected": 19, "rejected": 150, "ai_assessed": 169, "ai_cached": 0, "ai_unscored": 0, "global_editorial": true, "field_scope_excluded": 0, "duplicate_work_excluded": 0, "arxiv_selected": 14, "journal_selected": 5, "arxiv_harvest_excluded": 80, "pending_journal_abstracts": 0, "non_original_excluded": 26, "publication_not_eligible": 24}}, {"date": "2026-10-27", "title": "Daily Condensed Matter Literature", "generated_at": "2026-10-27T09:52:06.870739-07:00", "screening_version": "quantum-materials-v1-formal-research-v4", "screening_config": {"arxiv_min_score": 70, "journal_min_score": 55, "max_papers": 30, "arxiv_versions": [1], "exclude_soft_matter": true, "journals": ["Science", "Science Advances", "Nature", "Nature Physics", "Nature Materials", "Nature Communications", "PRL", "PRX", "PNAS"], "journal_publication": "publisher-verified formal online publication on the issue date", "journal_document_types": "research article or research letter; no accepted papers, essays, replies or comments", "editorial_interest": "experimental quantum materials; original theory and experiment"}, "sources_complete": true, "papers": [{"id": "doi-10-1038-s41467-026-78381-4", "doi": "10.1038/s41467-026-78381-4", "title": "Magnetic excitons in a suspended 2D antiferromagnetic membrane", "type": "Journal", "journal": "Nature Communications", "authors": "Joanna L. P. Wolff, Loïc Moczko, Jérémy Thoraval, Michelangelo Romeo, Benjamin Bacq-Labreuil, Stéphane Berciaud, Arnaud Gloppe", "abstract": "Abstract Layered magnetic and strongly correlated materials, such as NiPS 3 , present a rich platform for condensed matter physics with intrinsic properties intertwined by magnetism and low-dimensionality. A suspended light-emitting 2D antiferromagnetic membrane forms a highly controllable hybrid system in which the interplay between spin ordering, optical and mechanical degrees of freedom can be uniquely explored. NiPS 3 hosts excitons responsible for a puzzling luminescence down to a few atomic layers, linked to its zigzag antiferromagnetic order. The exact nature of these excitons remains unclear. Here we report on the magnetic excitons of a suspended few-layer NiPS 3 membrane. We reveal nematic zigzag states and study the optical transitions induced by the magnon-mediated motion of the excitation in the magnetic lattice, resulting in magnon-dressed excitons. We observe a strain tuning of these emission lines, dependent on their microscopic origin, with rates that indicate a strong localization of the magnetic excitons, fading with the number of magnon-mediated hops.", "crossref_online_date": [[2026, 10, 27]], "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78381-4", "level": "Feature", "method": "", "result": "", "future": "", "article_kind": "Article", "publication_date": "2026-10-27", "publication_status": "published", "publication_evidence": {"source": "publisher", "url": "https://www.nature.com/articles/s41467-026-78381-4"}, "abstract_source": "Crossref", "abstract_status": "available", "topic": "Magnetism", "summary_en": "This study investigates optical emission from suspended few-layer NiPS3, where excitons are associated with zigzag antiferromagnetic order. It reports nematic zigzag states and strain-dependent emission lines attributed to magnon-dressed magnetic excitons.", "summary": "Abstract Layered magnetic and strongly correlated materials, such as NiPS 3 , present a rich platform for condensed matter physics with intrinsic properties intertwined by magnetism and low-dimensionality. A suspended light-emitting 2D antiferromagnetic membrane forms a highly controllable hybrid system in which the interplay between spin ordering, optical and mechanical degrees of freedom can be ", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "In few-layer NiPS3, the study identifies nematic zigzag states and magnon-dressed magnetic excitons, and shows that strain tuning of their emission depends on their microscopic origin and localization.", "ai_in_scope": true, "relevance_reason": "This experiment probes excitations and magnetic order in a low-dimensional antiferromagnet, establishing a substantive advance in quantum-materials physics.", "relevance_method": "semantic", "relevance_score": 82, "feature_candidate": true, "summary_zh": "本研究考察悬空少层 NiPS3 的光学发射，其中激子与锯齿形反铁磁有序相关。研究报告了向列性锯齿态，并将应变依赖的发射谱线归因于磁振子修饰的磁激子。", "method_en": "The authors study a suspended, light-emitting few-layer NiPS3 membrane and examine its optical transitions and response to strain. They interpret the transitions in terms of excitation motion mediated by magnons in the magnetic lattice.", "method_zh": "作者研究悬空且可发光的少层 NiPS3 膜，考察其光学跃迁及其对应变的响应。他们从磁格子中由磁振子介导的激发运动角度解释这些跃迁。", "result_en": "The study reveals nematic zigzag states in the suspended membrane. The observed optical transitions are attributed to magnon-mediated motion of the excitation, producing magnon-dressed excitons. The emission lines shift with strain at rates that depend on their microscopic origin. Those rates indicate strong localization of the magnetic excitons, with the localization signature fading as the number of magnon-mediated hops increases.", "result_zh": "研究在悬空膜中揭示了向列性锯齿态。观测到的光学跃迁被归因于由磁振子介导的激发运动，从而形成磁振子修饰的激子。发射谱线随应变发生位移，位移速率取决于其微观起源。这些速率表明磁激子具有强局域性，而随着磁振子介导的跳跃次数增加，局域性特征逐渐减弱。", "future_en": "A follow-up could track the emission lines across a wider range of layer numbers and strain to test how the inferred localization changes. Complementary measurements that probe the magnetic order and optical excitations together could further examine the proposed magnon-mediated interpretation.", "future_zh": "后续可在更广的层数和应变范围内追踪发射谱线，以检验推断的局域性如何变化。结合探测磁有序与光学激发的测量，也可进一步考察所提出的磁振子介导解释。"}, {"id": "doi-10-1038-s41467-026-78928-5", "doi": "10.1038/s41467-026-78928-5", "title": "Synthesis-by-design of ferroelectric Dion–Jacobson two-dimensional hybrid organic–inorganic perovskites", "type": "Journal", "journal": "Nature Communications", "authors": "Lulu Wang, Weixin He, Shurong Yuan, Chao Yang, Nihang Fu, Xinnan Peng, Kian Ping Loh, Pengfei Ou", "abstract": "Abstract Dion–Jacobson two-dimensional hybrid organic–inorganic perovskites are promising ferroelectric materials, combining chemically tunable polarity enabled by their organic spacers with enhanced environmental stability. However, rational discovery remains difficult owing to uncertain phase formability and scarce, biased ferroelectric data. Here we show a staged, physically guided synthesis-by-design workflow that integrates learning from scarce ferroelectric data with structure-aware screening. Starting from 11 known ferroelectric compounds in this family, symbolic regression defines a descriptor-bounded ferroelectric-consistent region. Similarity-guided expansion and chemical filtering reduce 83,924 molecules to 1012 candidate divalent spacers, while machine-learned interatomic-potential relaxation and connectivity analysis identify 338 candidates retaining Dion–Jacobson connectivity. Sequential prioritization by connectivity retention, chemical similarity, energetic refinement and synthetic accessibility selects s −2-fluorobutane-1,4-diamine, leading to the synthesis of a PbI 4 -based Dion–Jacobson perovskite with experimentally confirmed ferroelectric switching. This prospective proof of concept shows how sparse property knowledge can be coupled with structural screening to prioritize organic spacer candidates for experimental synthesis.", "crossref_online_date": [[2026, 10, 27]], "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78928-5", "level": "Brief", "method": "", "result": "", "future": "", "article_kind": "Article", "publication_date": "2026-10-27", "publication_status": "published", "publication_evidence": {"source": "publisher", "url": "https://www.nature.com/articles/s41467-026-78928-5"}, "abstract_source": "Crossref", "abstract_status": "available", "topic": "Materials & Growth", "summary_en": "This work develops a physically guided, staged workflow to identify ferroelectric Dion–Jacobson two-dimensional hybrid organic–inorganic perovskites despite scarce and biased property data. Its prospective application leads to the synthesis of a PbI₄-based compound with experimentally confirmed ferroelectric switching.", "summary": "Abstract Dion–Jacobson two-dimensional hybrid organic–inorganic perovskites are promising ferroelectric materials, combining chemically tunable polarity enabled by their organic spacers with enhanced environmental stability. However, rational discovery remains difficult owing to uncertain phase formability and scarce, biased ferroelectric data. Here we show a staged, physically guided synthesis-by", "soft_matter": false, "quantum_materials": false, "research_type": "mixed", "screening_decision": "selected", "physics_advance": "Synthesizes a PbI4-based Dion–Jacobson hybrid perovskite using a selected organic spacer and experimentally confirms ferroelectric switching.", "ai_in_scope": true, "relevance_reason": "The work combines computational screening and experimental synthesis to establish a new ferroelectric hybrid perovskite, a focused solid-state materials result.", "relevance_method": "semantic", "relevance_score": 60, "feature_candidate": false, "summary_zh": "该研究建立了一套物理引导的分阶段工作流程，旨在稀缺且存在偏差的性质数据条件下筛选铁电 Dion–Jacobson 二维有机—无机杂化钙钛矿。该流程的前瞻性应用促成了一种 PbI₄ 基化合物的合成，并通过实验确认其铁电翻转。", "method_en": "Starting from 11 known ferroelectric compounds, the workflow combines symbolic regression, similarity-guided molecular expansion and chemical filtering with machine-learned interatomic-potential relaxation, connectivity analysis, energetic refinement, and synthetic-accessibility prioritization.", "method_zh": "该流程以 11 种已知铁电化合物为起点，结合符号回归、相似性引导的分子扩展与化学筛选、机器学习原子间势弛豫、连接性分析、能量精修及合成可行性排序。", "result_en": "Symbolic regression defines a descriptor-bounded ferroelectric-consistent region, and filtering reduces 83,924 molecules to 1,012 candidate divalent spacers. Relaxation and connectivity analysis identify 338 candidates that retain Dion–Jacobson connectivity. Sequential prioritization selects s−2-fluorobutane-1,4-diamine, leading to synthesis of a PbI₄-based Dion–Jacobson perovskite with experimentally confirmed ferroelectric switching. The result is a prospective proof of concept for using sparse property knowledge together with structure-aware screening to prioritize spacers for synthesis.", "result_zh": "符号回归划定了由描述符限定的铁电一致性区域，筛选过程将 83,924 个分子缩减为 1,012 种候选二价间隔基。弛豫与连接性分析进一步识别出 338 种能够保留 Dion–Jacobson 连接结构的候选物。经分阶段优先级排序，研究选出 s−2-氟丁烷-1,4-二胺，并据此合成一种 PbI₄ 基 Dion–Jacobson 钙钛矿，实验确认其具有铁电翻转。该结果构成了概念验证，展示如何结合稀缺性质知识与结构感知筛选来优先选择待合成间隔基。", "future_en": "A natural follow-up is to apply the workflow prospectively to additional spacer candidates and test whether its prioritization generalizes beyond this proof-of-concept synthesis.", "future_zh": "后续可将该流程前瞻性地用于更多间隔基候选物，并检验其排序能力能否推广至本次概念验证之外的合成研究。"}, {"id": "arxiv-2610-35236", "arxiv_id": "2610.35236", "type": "arXiv", "journal": "arXiv:2610.35236", "journal_ref": "", "journal_doi": "", "title": "Control of the Electronic and Atomic Structure of the Altermagnetic α-MnTe Surface via Substrate-Induced Surfactants", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci"], "submitted_at": "2026-10-26T11:21:43Z", "updated_at": "2026-10-26T11:21:43Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Martin Heinrich, Mahdi Hajlaoui, Takuya Takashiro, Tetiana Zakusylo, Petr Babor, Ondrej Caha, Dawid Wutke, Natalia Olszowska, Gunther Springholz, Matthias Muntwiler", "corresponding": "", "url": "https://arxiv.org/abs/2610.35236v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The study reports that the substrate controls the atomic termination and surface electronic structure of altermagnetic α-MnTe films: SrF₂(111) yields a clean (2×2) reconstruction, whereas InP(111)A produces an InTe-terminated surface with a quasi-periodic dislocation network. The distinct terminations are associated with different surface states and electronic structures observed using photoemission and tunneling spectroscopy.", "summary": "Altermagnets are a novel class of materials with unique momentum dependent spin-polarization of the electronic band structure, which opens up new avenues for spintronic devices. Altermagnetic α-MnTe is particularly interesting for such applications due to its giant spin splitting and the persistence of altermagnetic order up to room temperature. Growth of thin films is, however, challenging and go", "abstract": "Altermagnets are a novel class of materials with unique momentum dependent spin-polarization of the electronic band structure, which opens up new avenues for spintronic devices. Altermagnetic α-MnTe is particularly interesting for such applications due to its giant spin splitting and the persistence of altermagnetic order up to room temperature. Growth of thin films is, however, challenging and governed by interactions with the substrate. As a result, the surface of α-MnTe thin films exhibits very different atomic structures in dependence of the substrate material. Whereas on SrF2(111) an atomically clean, perfectly (2x2) reconstructed surface forms, on InP(111)A the MnTe surface is always InTe terminated due to super-segregation of In from the substrate to the surface. Most strikingly, the InTe surfactant layer displays a quasi-periodic dislocation network to accommodate the InTe/MnTe lattice mismatch. This leads to the emergence of distinct surface states in dependence of surface termination that strongly affect the electronic band structure at the surface as shown by angle resolved photoemission and tunneling spectroscopy. Thus, control and characterization of the atomic structure of the surface is fundamentally important for understanding the properties of altermagnets and provides room for engineering and tailoring of spin-polarized states in actual devices.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "InP-induced InTe surfactant termination and its dislocation network produce surface states distinct from those of the clean reconstructed α-MnTe surface.", "ai_in_scope": true, "relevance_reason": "The study connects substrate-controlled surface structure in an altermagnet to distinct spectroscopically observed surface states, providing a substantive result in quantum-materials physics.", "relevance_method": "semantic", "relevance_score": 76, "feature_candidate": false, "summary_zh": "研究报告指出，衬底会控制交替磁性 α-MnTe 薄膜的原子终止面和表面电子结构：SrF₂(111) 上形成洁净的 (2×2) 重构表面，而 InP(111)A 上则形成带有准周期位错网络的 InTe 终止面。光电子能谱和隧穿谱观测到与不同终止面相关的表面态及电子结构差异。", "method_en": "The authors compare α-MnTe thin films grown on SrF₂(111) and InP(111)A, characterizing their atomic structures and surface electronic states. They use angle-resolved photoemission and tunneling spectroscopy to examine how the substrate-dependent terminations affect the electronic structure.", "method_zh": "作者比较生长在 SrF₂(111) 和 InP(111)A 衬底上的 α-MnTe 薄膜，并表征其原子结构与表面电子态。他们利用角分辨光电子能谱和隧穿谱考察衬底依赖的终止面如何影响电子结构。", "result_en": "On SrF₂(111), the film forms an atomically clean, perfectly (2×2)-reconstructed surface; on InP(111)A, substrate In segregates to produce an InTe-terminated surface. The InTe surfactant layer accommodates the InTe/MnTe lattice mismatch through a quasi-periodic dislocation network. The different terminations yield distinct surface states that strongly affect the surface electronic band structure, according to the reported photoemission and tunneling measurements.", "result_zh": "在 SrF₂(111) 上，薄膜形成原子级洁净且具有完美 (2×2) 重构的表面；在 InP(111)A 上，衬底中的 In 则偏析至表面，形成 InTe 终止面。InTe 表面活性层通过准周期位错网络来适应 InTe 与 MnTe 之间的晶格失配。根据所报告的光电子能谱和隧穿测量，不同终止面会产生不同表面态，并显著影响表面电子能带结构。", "future_en": "A useful follow-up is to determine how deliberately controlling these substrate-dependent terminations affects the spin-polarized states relevant to altermagnetic devices.", "future_zh": "一个有益的后续方向是研究有意调控这些衬底依赖的终止面，会如何影响与交替磁性器件相关的自旋极化态。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The abstract reports a clear substrate-dependent surface-structure result supported by spectroscopy, with relevance to altermagnetism and film engineering; its scope is substantial but appears focused on particular growth systems rather than establishing a field-wide advance.", "tier_reason_zh": "摘要报告了由能谱测量支持的明确衬底依赖表面结构结果，并与交替磁性和薄膜工程相关；其研究内容有分量，但目前看来聚焦于特定生长体系，尚不足以体现全领域层面的推进。"}, {"id": "arxiv-2610-33196", "arxiv_id": "2610.33196", "type": "arXiv", "journal": "arXiv:2610.33196", "journal_ref": "", "journal_doi": "", "title": "Cooperation of itinerant and localized physics in the magnetic phase diagram of 214 Ruddlesden-Popper iridates", "arxiv_version": 1, "primary_category": "cond-mat.str-el", "categories": ["cond-mat.str-el"], "submitted_at": "2026-10-23T18:45:41Z", "updated_at": "2026-10-23T18:45:41Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Francesco Cassol, Michele Casula, Benjamin Lenz", "corresponding": "", "url": "https://arxiv.org/abs/2610.33196v1", "topic": "Magnetism", "level": "Brief", "summary_en": "Using a realistic three-orbital model, the authors place Sr₂IrO₄ and Ba₂IrO₄ in an intermediate regime where itinerant and localized electronic physics cooperate to stabilize antiferromagnetism, with Ba₂IrO₄ slightly more correlated. They identify a two-peak optical-conductivity structure as a reliable fingerprint of this regime, unlike the gap behavior across the Néel temperature or spin-polaron features.", "summary": "The $5d^5$ Ruddlesden-Popper iridates Sr$_2$IrO$_4$ and Ba$_2$IrO$_4$ have attracted considerable attention as spin-orbit entangled analogues of the cuprates, yet the origin of their antiferromagnetic insulating state, of Slater or of Mott-Heisenberg type, remains debated. We find that both materials sit in an intermediate regime in which itinerant and localized electrons cooperate in stabilizing ", "abstract": "The $5d^5$ Ruddlesden-Popper iridates Sr$_2$IrO$_4$ and Ba$_2$IrO$_4$ have attracted considerable attention as spin-orbit entangled analogues of the cuprates, yet the origin of their antiferromagnetic insulating state, of Slater or of Mott-Heisenberg type, remains debated. We find that both materials sit in an intermediate regime in which itinerant and localized electrons cooperate in stabilizing the antiferromagnetic order, with Ba$_2$IrO$_4$ slightly more correlated than Sr$_2$IrO$_4$. We obtain this by computing, within dynamical mean-field theory, the interaction-temperature phase diagram of a realistic three-orbital $t_{2g}$ Hubbard model with spin-orbit coupling. Our study shows that neither the behavior of the gap across the Néel temperature nor the spin-polaron features of the spectral function unambiguously identify the cooperative regime, whereas the two-peak structure of the optical conductivity is reproduced only there and therefore constitutes a reliable fingerprint. By placing both compounds in a common phase diagram, our results reconcile seemingly contradictory experimental and theoretical reports, and provide a unified framework for future studies of the 214 iridates and of other spin-orbit coupled correlated materials.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "theory", "screening_decision": "selected", "physics_advance": "Sr₂IrO₄ and Ba₂IrO₄ occupy an intermediate regime where itinerant and localized electronic physics cooperate to stabilize antiferromagnetism, and a two-peak optical-conductivity structure fingerprints that regime.", "ai_in_scope": true, "relevance_reason": "This is an original correlated-electron theory study of antiferromagnetism and the insulating state in two spin-orbit-coupled iridates.", "relevance_method": "semantic", "relevance_score": 78, "feature_candidate": false, "summary_zh": "作者利用现实的三轨道模型，将 Sr₂IrO₄ 和 Ba₂IrO₄ 定位在巡游电子与局域电子共同稳定反铁磁序的中间区域，其中 Ba₂IrO₄ 的关联性略强。他们指出，光学电导的双峰结构是该区域的可靠特征，而奈尔温度两侧的能隙变化和自旋极化子特征则不足以作出明确判别。", "method_en": "The authors compute an interaction–temperature phase diagram using dynamical mean-field theory for a realistic three-orbital t₂g Hubbard model with spin-orbit coupling. They compare gap behavior, spectral-function features, and optical conductivity across the resulting regimes.", "method_zh": "作者针对包含自旋轨道耦合的现实三轨道 t₂g Hubbard 模型，使用动力学平均场理论计算相互作用—温度相图。他们比较不同区域中的能隙变化、谱函数特征和光学电导。", "result_en": "Both compounds fall in an intermediate regime in which itinerant and localized physics cooperate to stabilize antiferromagnetic order, and Ba₂IrO₄ is found to be slightly more correlated than Sr₂IrO₄. Neither the gap’s behavior across the Néel temperature nor spin-polaron features unambiguously identify this regime, whereas the two-peak optical-conductivity structure is reproduced only there. The resulting common phase diagram is presented as a way to reconcile apparently contradictory accounts of the two materials.", "result_zh": "两种化合物都处于巡游与局域电子物理共同稳定反铁磁序的中间区域，并且 Ba₂IrO₄ 的关联性略强于 Sr₂IrO₄。无论是能隙在奈尔温度两侧的变化，还是自旋极化子特征，都不能明确识别该区域；相反，双峰光学电导结构仅在该区域得到重现。作者认为，建立共同相图有助于调和对这两种材料看似相互矛盾的解释。", "future_en": "A relevant next step is to use the proposed two-peak optical-conductivity fingerprint to assess these materials and other spin-orbit-coupled correlated systems.", "future_zh": "一个相关的后续方向是利用所提出的光学电导双峰特征来评估这两种材料及其他自旋轨道耦合关联体系。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "The work offers a focused, realistic-model phase-diagram study that addresses a debated classification and proposes a discriminating optical signature, fitting a strong specialist condensed-matter contribution; the abstract does not establish a broader breakthrough warranting a higher tier.", "tier_reason_zh": "该研究以现实模型相图为核心，针对一个存在争议的分类问题提出了可区分的光学特征，符合有力的凝聚态专业研究；摘要尚未显示足以支持更高档次评价的更广泛突破。"}, {"id": "arxiv-2610-34312", "arxiv_id": "2610.34312", "type": "arXiv", "journal": "arXiv:2610.34312", "journal_ref": "", "journal_doi": "", "title": "Crystal-surface polarity enables nonreciprocal transport in a centrosymmetric kagome magnet", "arxiv_version": 1, "primary_category": "cond-mat.mtrl-sci", "categories": ["cond-mat.mtrl-sci"], "submitted_at": "2026-10-25T14:25:43Z", "updated_at": "2026-10-25T14:25:43Z", "announcement_date": "2026-10-27", "announcement_section": "new", "authors": "Daiki Yamaguchi, Max T. Birch, Hibiki Onodera, Akiko Kikkawa, Naoto Nagaosa, Yoshinori Tokura", "corresponding": "", "url": "https://arxiv.org/abs/2610.34312v1", "topic": "Magnetism", "level": "Brief", "summary_en": "The authors show that intrinsic polarity at crystal surfaces can enable zero-field nonreciprocal transport in the centrosymmetric kagome magnets TbMn₆Sn₆₋ₓInₓ. Measurements on opposing surfaces, magnetization reversals and rotations, and a spin-reorientation transition support a surface-boundary origin distinct from bulk linear conduction.", "summary": "Every crystal surface breaks inversion symmetry even when the bulk is centrosymmetric, creating an intrinsic boundary polarity ($\\mathbf{\\mathit{P}}$). Here we show that this polarity enables zero-field nonreciprocal transport in the centrosymmetric kagome magnets TbMn$_6$Sn$_{6-x}$In$_x$. In symmetric TbMn$_6$Sn$_{4.4}$In$_{1.6}$ microdevices, opposing side surfaces exhibit second-harmonic longit", "abstract": "Every crystal surface breaks inversion symmetry even when the bulk is centrosymmetric, creating an intrinsic boundary polarity ($\\mathbf{\\mathit{P}}$). Here we show that this polarity enables zero-field nonreciprocal transport in the centrosymmetric kagome magnets TbMn$_6$Sn$_{6-x}$In$_x$. In symmetric TbMn$_6$Sn$_{4.4}$In$_{1.6}$ microdevices, opposing side surfaces exhibit second-harmonic longitudinal resistances of comparable magnitude and opposite sign. Reversing the spontaneous magnetization ($\\mathbf{\\mathit{M}}$) reverses both signals, whereas rotating $\\mathbf{\\mathit{M}}$ so that the toroidal moment $\\mathbf{\\mathit{P}} \\times \\mathbf{\\mathit{M}}$ has no component along the current suppresses the response. In pristine TbMn$_6$Sn$_6$, the signal switches off across the spin-reorientation transition, providing a chemically ordered control of the same symmetry relation. Spatial potential mapping indicates that the nonlinear boundary contribution is distinct from the bulk linear conduction. Spin-orbit-coupled surface states associated with topological bands may enhance the effect. Crystal-surface polarity therefore offers a broadly applicable route to zero-field rectification in centrosymmetric magnetic conductors around room temperature.", "method": "", "result": "", "future": "", "soft_matter": false, "quantum_materials": true, "research_type": "experiment", "screening_decision": "selected", "physics_advance": "Opposing crystal surfaces produce opposite-sign zero-field nonreciprocal transport, governed by surface polarity crossed with spontaneous magnetization; the response vanishes when the relevant toroidal component is absent.", "ai_in_scope": true, "relevance_reason": "Experiments establish a symmetry-linked nonlinear
