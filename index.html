ion switching in such systems. Our results open new possibilities for the realization of advanced, self-contained magnonic nano-circuits.", "method": "", "result": "", "future": "", "summary_zh": "本研究提出了一种无外加磁场的声波子电路，通过利用波导元件的静态磁化状态集成非易失性存储，实现了自旋波传播路径的控制。", "relevance_score": 83, "relevance_method": "semantic", "relevance_reason": "Proposes and demonstrates integrated zero-field magnonic circuits with non-volatile memory via magnetization switching, enabling active spin-wave device control and advancing magnonics for coherent information processing.", "feature_candidate": true, "method_en": "A design strategy is introduced employing low-loss magnetic insulators and magnetization switching in waveguiding elements to manipulate spin-wave propagation paths with low energy cost.", "method_zh": "该方法采用低损耗磁绝缘体和波导元件的磁化方向切换，控制自旋波传播路径，具低能耗特性。", "result_en": "Demonstrated that magnetization switching efficiently controls spin-wave routes, supporting built-in non-volatile memory in magnonic networks operating at zero magnetic field.", "result_zh": "验证了磁化方向切换能够高效控制自旋波路径，实现了在零磁场下工作的带内置非易失性存储的声波子网络。", "future_en": "Future research could optimize selective magnetization switching protocols and integrate these elements into complex magnonic nano-circuit architectures.", "future_zh": "未来研究可优化选择性磁化切换方案，并将这些元件集成至复杂的声波子纳米电路架构中。"}, {"id": "doi-10-1038-s41467-026-78802-4", "doi": "10.1038/s41467-026-78802-4", "type": "Journal", "journal": "Nature Communications", "title": "A van der Waals photon-ratchet for enhancing spin-defect emission and quantum sensing", "authors": "E. Mayner, Y. Zhumagulov, C. de Giorgio, F. Chu, P. P. Swain, G. E. Fantner, A. Kis, O. V. Yazyev, A. Radenovic", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78802-4", "topic": "Magnetism", "level": "Brief", "summary_en": "This study demonstrates a van der Waals heterostructure that boosts photoluminescence intensity of negatively charged boron vacancies in hexagonal boron nitride by up to 45 times at 4 K, enhancing quantum sensing capabilities. The approach preserves optically detected magnetic resonance contrast and compatibility with thin optoelectronics.", "summary": "A van der Waals photon-ratchet architecture enhances emission and sensing signals from spin defects.", "abstract": "Abstract Spin defects in two-dimensional materials are promising platforms for quantum information technologies and nanoscale sensing. The negatively charged boron vacancy ( $${\\mathrm{V}}_{\\mathrm{B}}^{-}$$ V B − ) in hexagonal boron nitride (hBN) is particularly attractive due to its sensitivity to temperature, magnetic fields, and pressure, but its application is limited by intrinsically weak photoluminescence (PL). Here we demonstrate a van der Waals heterostructure that enhances the PL intensity of $${\\mathrm{V}}_{\\mathrm{B}}^{-}$$ V B − by up to 45× at 4 Kelvin while preserving compatibility with ultrathin optoelectronic platforms. A quasi type-I band alignment at the PbI 2 –defected hBN interface facilitates efficient interlayer coupling to the defect, and strong spectral overlap supports fluorescence resonance energy transfer. Ab initio calculations indicate that this coupling enables a photon-ratcheting mechanism, in which optical absorption in PbI 2 generates a nonlinear polarization that drives $${\\mathrm{V}}_{\\mathrm{B}}^{-}$$ V B − excitation. This process is compatible with interlayer energy transfer while maintaining minimal electronic and spin hybridization and preserving optically detected magnetic resonance (ODMR) contrast. The heterostructure further exhibits improved sensitivity to external magnetic fields. These results establish a route for the enhancement of defect emission via interlayer optical coupling and introduce a general materials strategy for amplifying weak quantum defect signals in nanomaterials.", "method": "", "result": "", "future": "", "summary_zh": "该研究展示了一种范德华异质结构，可在4K温度下将六方氮化硼中带负电的硼空位光致发光强度提高至45倍，增强了量子传感能力。该方法保持了光学检测磁共振对比度，并兼容超薄光电子器件。" -Jing Du, Garnet Kin-Lic Chan", "corresponding": "", "url": "https://arxiv.org/abs/2610.30321", "topic": "Superconductivity", "level": "Brief", "summary_en": "High-accuracy simulations on up to 1024 sites find near-degenerate uniform d-wave superconducting, superconducting-stripe and insulating-stripe states in the doped Hubbard model.", "summary": "High-accuracy simulations on up to 1024 sites find near-degenerate uniform d-wave superconducting, superconducting-stripe and insulating-stripe states in the doped Hubbard model.", "abstract": "The two-dimensional Hubbard model was originally proposed as the minimal model of uniform $d$-wave superconductivity in the cuprate high-temperature superconductors, but recent calculations with relevant parameters in a realistic doping regime have often found other ground states. Further, uncertainty remains over such results due to the intrinsic bias of different computational methods. Here we address this uncertainty through state-of-the-art neural tensor network and neural backflow state simulations, enabled by large-scale GPU computation, that together reach an unprecedented variational accuracy on lattices with up to 1024 sites. At $1/8$ doping in the pure Hubbard model, as well as with next-nearest-neighbor hopping relevant to the hole-doped cuprates, we reveal a near degeneracy among a low-energy uniform $d$-wave state, superconducting stripes, and non-superconducting stripe states on the milli-$t$ energy scale. Our work rebalances the narrative that the Hubbard model supports a single dominant order in relevant parameter regimes towards a picture of extreme competition between stripes and superconductivity.", "method": "", "result": "", "future": "", "summary_zh": "在最多 1024 格点的二维 Hubbard 模型中发现均匀 d 波超导、超导条纹和非超导条纹能量极其接近。", "tier": "Nature Communications/Science Advances/PRX", "tier_reason_en": "A substantial conceptual or methodological advance with cross-community relevance.", "tier_reason_zh": "概念或方法进展较显著，可跨多个研究方向应用。", "relevance_score": 85, "relevance_method": "semantic", "relevance_reason": "Large-scale state-of-the-art neural network simulations demonstrate near degeneracy and extreme competition between uniform d-wave superconductivity and stripe orders in the 2D Hubbard model, providing key benchmarks clarifying the nature o", "feature_candidate": true}, {"id": "arxiv-2610-30733", "arxiv_id": "2610.30733", "type": "arXiv", "journal": "arXiv:2610.30733", "journal_ref": "", "title": "Ferroelastic Reversal Magnon Thermal Hall Effect in a Fully Compensated Ferrimagnet", "authors": "Yingxi Bai, Zihan Chen, Chengwang Niu, Ming Yang", "corresponding": "", "url": "https://arxiv.org/abs/2610.30733", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Ferroelastic switching is predicted to reversibly control magnon thermal Hall response in fully compensated ferrimagnets.", "summary": "Ferroelastic switching is predicted to reversibly control magnon thermal Hall response in fully compensated ferrimagnets.", "abstract": "Magnons offer a charge-neutral channel for spin and heat transport, yet reversible and nonvolatile control of their thermal Hall response poses a fundamental challenge in systems with zero net magnetization. Here, we establish ferroelastic switching as an effective route to manipulate magnonic transverse responses in fully compensated ferrimagnets. A minimal Heisenberg-Dzyaloshinskii-Moriya model reveals that ferroelastic switching can re-orientate the lattice anisotropy, which reconstructs the chirality-resolved magnon bands and Berry curvature distribution. Consequently, the two orthogonal fully compensated ferrimagnetic variants related by [C2||C4z] exhibit magnon thermal Hall responses with opposite signs, whereas the response vanishes in the intermediate altermagnetic phase. First-principles calculations further identify monolayer V2SSe as a promising material candidate for realizing the proposed ferroelastic control of transverse magnon transport. R he FePt layer. NbN films 10 nm thick are capped either directly with FePt or through a thin AlN spacer, which reduces electronic proximity effects while preserving magnetic coupling through stray fields. At zero applied magnetic field, the superconducting diode efficiency reaches approximately 50--60% in NbN/FePt when the stripes are perpendicular to the current and is strongly reduced when they are parallel. The diode effect persists in NbN/AlN/FePt with efficiencies reaching approximately 35--40%, supporting a magnetic origin of the nonreciprocity. We interpret the response as asymmetric vortex transport in the remanent magnetic landscape, with preferential edge vorticity and a Lorentz force that favors inward flux injection or outward motion depending on current polarity. Under applied perpendicular magnetic fields, the interplay between the external field and the magnetic stray fields modifies the flux-flow instability and the apparent instability velocity inferred from transport, with values below those reported for bare NbN films. These results show that stripe-domain ferromagnetic overlayers provide a reconfigurable route to control superconducting nonreciprocity and flux-flow stability in NbN-based heterostructures.", "method": "", "result": "", "future": "", "summary_zh": "在 NbN/FePt 条纹磁畴异质结构中实现零外场超导二极管，效率约 50–60%，加入 AlN 隔层后仍保留约 35–40%。", "tier": "PRL", "tier_reason_en": "A clear, testable response or experimentally distinctive mechanism of broad condensed-matter interest.", "tier_reason_zh": "提出清晰可检验的响应或具有代表性的实验机制，具有较广凝聚态意义。", "relevance_score": 85, "relevance_method": "semantic", "relevance_reason": "Demonstrates reconfigurable field-free superconducting diode effect and controlled vortex dynamics via magnetic stray fields in NbN/FePt heterostructures, revealing novel control of superconducting nonreciprocity with experimental and conce", "feature_candidate": true}, {"id": "arxiv-2610-30964", "arxiv_id": "2610.30964", "type": "arXiv", "journal": "arXiv:2610.30964", "journal_ref": "", "title": "Intensity-driven Mott-like transition in a 2D Ruddlesden-Popper perovskite", "authors": "Koushik Mondal, Amit Haldar, Indrajit Mondal, Arpita Dutta, Himanshu Bhatt, Biswajit Mahata, Soumili Banerjee, Hirendra Nath Ghosh, Satyaprasad P Senanayak, Shovon Pal", "corresponding": "", "url": "https://arxiv.org/abs/2610.30964", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "The study reports an intensity-driven Mott-like transition in a two-dimensional Ruddlesden–Popper perovskite.", "summary": "The study reports an intensity-driven Mott-like transition in a two-dimensional Ruddlesden–Popper perovskite.", "abstract": "Two-dimensional Ruddlesden-Popper-type halide perovskites have emerged as promising cutting-edge nonlinear optical materials due to their strong excitonic effects and carrier-density-dependent optical responses. In this work, we investigate the nonlinear optical properties and ultrafast carrier dynamics of (BA)$_2$PbI$_4$ under infrared excitation, resonant with the two-photon energy of its excitonic transition. Using a nonlinear femtosecond Z-scan measurement with a 1030\\,nm pump pulse, we observe a pronounced intensity-dependent evolution of the nonlinear absorption coefficient and the refractive index. With increasing pump intensity, a switch from saturable absorption to reverse saturable absorption emerges, suggesting an intensity-driven Mott-like transition. To elucidate the underlying carrier dynamics, intensity-dependent transient absorption spectroscopy was performed under the same excitation intensities. This reveals a long-lived charge carrier population above the estimated Mott density, reflecting a clear phase transition from an exciton-dominated regime to a dense electron-hole plasma regime. Moreover, such an intensity-driven, high, and switchable nonlinear optical response, along with a Mott-like transition under infrared pulse excitation, makes the 2D (BA)$_2$PbI$_4$ perovskites suitable for all-optical operation in the infrared regime.", "method": "", "result": "", "future": "", "summary_zh": "在二维 Ruddlesden–Popper 钙钛矿中研究光强驱动的类 Mott 转变。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 82, "relevance_method": "semantic", "relevance_reason": "Experimental nonlinear optics establishes an intensity-driven Mott-like phase transition between excitonic and electron-hole plasma regimes in a 2D halide perovskite, revealing novel switchable electronic states and nonlinear responses rele", "feature_candidate": true}, {"id": "arxiv-2610-30241", "arxiv_id": "2610.30241", "type": "arXiv", "journal": "arXiv:2610.30241", "journal_ref": "", "title": "Vacancy-driven topological transition of a Chern insulator", "authors": "Peize Ding, Raquel Queiroz", "corresponding": "", "url": "https://arxiv.org/abs/2610.30241", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Hybridization of vacancy-bound ring states provides a microscopic account of strong-disorder Chern-insulator transitions.", "summary": "Hybridization of vacancy-bound ring states provides a microscopic account of strong-disorder Chern-insulator transitions.", "abstract": "We develop a microscopic description of the strong-disorder transition in a Chern insulator using the in-gap ring states bound to individual vacancies. Using Green's function formalism, we construct an energy-dependent Hamiltonian describing their hybridization. In a commensurate periodic vacancy lattice, a Dirac inversion of the zero-energy vacancy kernel accounts for the change in the occupied-state Chern number of the full system. We treat weak positional disorder using the self-consistent Born approximation and numerical disorder averaging, and study independently distributed vacancies using transfer-matrix and multifractal scaling. The local Chern marker and current texture de slower than in BaTiO3 and PbTiO3, with CsSnBr3 in between. The cubic CsGeBr3 phase is a dynamically disordered state in which oppositely polarized chains flip throughout the crystal, and a long-lived one-dimensional local polarization coexists with zero net polarization. A simple three-dimensional perovskite thus hosts long-ranged one-dimensional polar correlations with remarkably slow dynamics. In the ferroelectric phase the same chains set a one-dimensional switching mechanism, in which the polarization reverses chain by chain.", "method": "", "result": "", "future": "", "summary_zh": "模拟发现 CsGeBr₃ 名义立方相中存在寿命很长、长度达数十纳米的一维极化链。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 80, "relevance_method": "semantic", "relevance_reason": "Discovery of long-lived one-dimensional polar chains and slow dynamics in cubic phase of halide perovskite CsGeBr3 via large-scale molecular dynamics reveals novel dimensionality and dynamics of local polar order, advancing understanding of", "feature_candidate": true}, {"id": "arxiv-2610-30930", "arxiv_id": "2610.30930", "type": "arXiv", "journal": "arXiv:2610.30930", "journal_ref": "", "title": "Chiroptical Valleytronic in SnSe", "authors": "Yiming Pan, Sotirios Fragkos, Umberto Dellasette, Quentin Courtade, Dominique Descamps, Stéphane Petit, Fabio Caruso, Samuel Beaulieu", "corresponding": "", "url": "https://arxiv.org/abs/2610.30930", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Time- and angle-resolved photoemission reveals helicity-selective valley excitation and sub-picosecond relaxation in SnSe.", "summary": "Time- and angle-resolved photoemission reveals helicity-selective valley excitation and sub-picosecond relaxation in SnSe.", "abstract": "Quantum geometric properties of Bloch electrons play a central role in governing light-matter interactions and transport phenomena in solids. Here, we report quantum-geometric chiroptical selection rules that generate a helicity-dependent momentum-space population imbalance in the group-IV monochalcogenide SnSe. By combining time- and angle-resolved extreme-ultraviolet photoemission spectroscopy with ab initio real-time simulations of photoexcited carrier dynamics, we identify valley-selective excitation at opposite crystal momenta arising from the breaking of time-reversal symmetry under circularly polarized illumination. We theoretically demonstrate that the magnitude of valley circular dichroism is strongly constrained by crystal symmetry through its influence on the quantum geometric tensor, the key quantity underlying valley optical selection rules. The resulting chiroptically induced valley polarization decays on sub-picosecond timescales through intervalley scattering mediated by electron-phonon coupling. Furthermore, we show theoretically that the population imbalance between valleys at opposite momenta gives rise to a helicity-reversible transient photocurrent. These findings provide microscopic insight into how quantum geometry governs valley-selective light-matter interactions, valley polarization, and photocurrent generation in van der Waals materials exhibiting hidden and transient symmetry breaking.", "method": "", "result": "", "future": "", "summary_zh": "利用时间分辨角分辨光电子谱在 SnSe 中观测圆偏振激发引起的谷选择性载流子分布。", "tier": "Nature Communications/Science Advances/PRX", "tier_reason_en": "A substantial conceptual or methodological advance with cross-community relevance.", "tier_reason_zh": "概念或方法进展较显著，可跨多个研究方向应用。", "relevance_score": 80, "relevance_method": "semantic", "relevance_reason": "Combined ultrafast ARPES experiments and ab initio theory show helicity-dependent valley polarization and transient photocurrents in SnSe driven by quantum geometry and symmetry, providing new microscopic insight into valleytronic phenomena", "feature_candidate": true}, {"id": "arxiv-2610-30371", "arxiv_id": "2610.30371", "type": "arXiv", "journal": "arXiv:2610.30371", "journal_ref": "", "title": "Emergent altermagnetism in (LaVO$_3$)$_n$/(LaNiO$_3$)$_m$ superlattices from interfacial charge transfer and octahedral tilts", "authors": "Gustavo H. Cassemiro, Walber H. Brito", "corresponding": "", "url": "https://arxiv.org/abs/2610.30371", "topic": "Magnetism", "level": "Brief", "summary_en": "First-principles calculations predict interfacial-charge-transfer- and octahedral-tilt-induced altermagnetism in LaVO3/LaNiO3 superlattices.", "summary": "First-principles calculations predict interfacial-charge-transfer- and octahedral-tilt-induced altermagnetism in LaVO3/LaNiO3 superlattices.", "abstract": "Using first-principles calculations, we show that altermagnetism emerges in (LaVO$_3$)$_n$/(LaNiO$_3$)$_m$ superlattices, with $(n,m) = (1,1), (2,2)$ and $(2,4)$, from the interplay of interfacial charge transfer and octahedral tilts. Charge transfer drives the system towards the V$^{4+}$ and Ni$^{2+}$ configuration, turning the otherwise paramagnetic nickelate layers into a magnetically active sublattice. The resulting $C$-type antiferromagnetic order, combined with $a^-b^+c^-$ or $a^-b^-c^-$ octahedral tilts, links opposite-spin sublattices only through nonsymmorphic operations, yielding a $d$-wave spin splitting without spin-orbit coupling. Within DFT+U, the splitting reaches 118 meV in the insulating (LVO)$_1$/(LNO)$_1$ superlattice, about twice that calculated for bulk LaVO$_3$, and decreases as the nickelate layers become thicker. Our findings indicate that this splitting is hosted by both the V and Ni sublattices, with nearly half of its weight on oxygen $2p$ states through $p$-$d$ covalency. Interfacial charge transfer thus emerges as a \\textit{design} principle for engineering altermagnetism in oxide heterostructures.", "method": "", "result": "", "future": "", "summary_zh": "第一性原理计算表明 LaVO₃/LaNiO₃ 超晶格的界面电荷转移与八面体倾斜可诱导交替磁性。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 80, "relevance_method": "semantic", "relevance_reason": "First-principles prediction of emergent altermagnetism in oxide superlattices via interfacial charge transfer and octahedral tilts provides a new design principle for engineering unconventional spin splitting without spin-orbit coupling, ad", "feature_candidate": true}, {"id": "arxiv-2610-30665", "arxiv_id": "2610.30665", "type": "arXiv", "journal": "arXiv:2610.30665", "journal_ref": "", "title": "From phase analysis to phase tracking: a robust approach to atomic-scale strain mapping", "authors": "Ying Han, Yuan Tian", "corresponding": "", "url": "https://arxiv.org/abs/2610.30665", "topic": "Topology & Transport", "level": "Brief", "summary_en": "This paper introduces geometric phase tracking analysis (GPTA), an improved method for atomic-scale strain mapping that dynamically tracks Bragg reflections in real space, overcoming limitations of standard geometric phase analysis under large strain or grain misorientation.", "summary": "A Bragg-peak-tracking strain-mapping method reduces failure rates from 27% to 11.5% across 13,795 microscopy images.", "abstract": "Atomic-scale strain governs the electronic, ferroic and mechanical properties of materials, and atomic-resolution microscopy measures it most directly. Geometric phase analysis (GPA) is the standard tool, but it fails when a Bragg reflection moves outside its fixed Fourier aperture under large strain or rotation, or in misoriented grains. Here we introduce geometric phase tracking analysis (GPTA), whose Fourier aperture tracks the Bragg reflection at each pixel in real space. A narrow aperture can therefore reject noise without losing a displaced reflection. On 13,795 simulated and experimental atomic-resolution images under various imaging conditions, GPTA reduces GPA's failure rate from 27% to 11.5% with up to 335 times better accuracy. It also gives strain and dislocation maps across grains, resistance to dynamical-scattering extinction, and a confidence map, capabilities that GPA lacks. Tracking the aperture combines reciprocal-space dose efficiency with real-space spatial resolution and extends atomic-scale strain metrology to beam-sensitive materials and challenging imaging conditions.", "method": "", "result": "", "future": "", "summary_zh": "本文提出几何相位追踪分析（GPTA）方法，通过实时跟踪折射点，改进原子级应变映射，克服了标准几何相位分析在大应变和晶粒错位条件下的不足。", "tier": "Uncertain", "tier_reason_en": "This methodological advancement significantly improves strain mapping accuracy, with strong practical value for microscopy, but awaits widespread adoption to determine publication impact level.", "tier_reason_zh": "该方法改进显著提升应变映射精度，具备强大显微镜应用价值，但需进一步推广验证以确认发表影响层次。", "relevance_score": 80, "relevance_method": "semantic", "relevance_reason": "Proposes geometric phase tracking (GPTA) as a robust improvement over GPA for atomic-resolution strain mapping, significantly increasing accuracy and applicability under challenging imaging conditions.", "feature_candidate": false, "method_en": "GPTA uses a Fourier aperture that adaptively tracks Bragg reflections at each pixel, reducing noise and enabling strain and dislocation mapping even under challenging imaging conditions.", "method_zh": "GPTA采用自适应傅里叶孔径追踪每像素处的折射点，降低噪声并实现复杂成像条件下的应变和位错映射。", "result_en": "GPTA reduces GPA failure rates from 27% to 11.5%, improves accuracy by up to 335 times, and enables strain mapping across grains and in beam-sensitive materials with high confidence.", "result_zh": "GPTA将GPA失败率从27%降至11.5%，精度提升最多达335倍，实现了晶粒间和电子束敏感材料中的高置信度应变映射。", "future_en": "Future work might apply GPTA broadly in electron microscopy for real-time strain analysis in diverse material systems, and extend it to other types of scattering data.", "future_zh": "未来工作可将GPTA广泛应用于电子显微镜，实现多样材料体系的实时应变分析，并延展至其他散射数据类型。"}, {"id": "arxiv-2610-30322", "arxiv_id": "2610.30322", "type": "arXiv", "journal": "arXiv:2610.30322", "journal_ref": "", "title": "Kinetic-inductance Parametric Amplification in Superconducting Hybrid Magnonics", "authors": "Pratap Kumar Pal, Moojune Song, Jinho Lim, Juliang Li, Serhii Kruhlov, Ralu Divan, Ulrich Welp, Clarence Chang, Kab-Jin Kim, Valentine Novosad, Axel Hoffmann, Yi Li", "corresponding": "", "url": "https://arxiv.org/abs/2610.30322", "topic": "Superconductivity", "level": "Brief", "summary_en": "This paper reports the demonstration of kinetic inductance parametric amplification within a hybrid magnonic system formed by a nonlinear NbN nanowire resonator strongly coupled to a YIG sphere. The system shows tunable microwave amplification and nonlinear dynamics mediated by magnon-photon interactions.", "summary": "A nonlinear NbN nanowire coupled to YIG magnons exhibits kinetic-inductance parametric amplification with up to 7 dB detuned gain.", "abstract": "Parametric amplification enables sensitive microwave detection and signal processing by amplifying weak signals with minimal added noise. Here, we demonstrate kinetic inductance mediated parametric amplification in a hybrid magnonic system comprising a nonlinear NbN nanowire resonator strongly coupled to a yttrium iron garnet sphere. The resonator exhibits four wave mixing and nonlinear frequency pulling, enabling parametric amplification both away from and within the magnon-photon strong coupling regime. In the magnon detuned regime, we observe 7 dB gain, while coupling to the YIG magnon shifts the parametric amplification response by ~20 MHz and yields 3.4 dB gain in the hybrid mode. Thus, magnon photon coupling provides a route to magnetically tune the spectral position of kinetic inductance parametric amplification. At higher pump powers, the system transitions to a self oscillatory regime featuring comb-like sidebands and probe activated nonlinear mode mixing. These results establish hybrid magnonics as a platform for tunable nonlinear microwave amplification and dynamics.", "method": "", "result": "", "future": "", "summary_zh": "本文展示了在由非线性NbN纳米线谐振腔与YIG球体强耦合构成的混合磁振子系统中实现的动感感应参量放大。系统表现出可调谐的微波放大和由磁振子-光子相互作用介导的非线性动力学。", "tier": "Nature Communications/Science Advances/PRX", "tier_reason_en": "The work demonstrates a novel tunable microwave amplification mechanism in hybrid magnonics with clear experimental validation and potential quantum technology applications, fitting the profile of a high-impact interdisciplinary journal.", "tier_reason_zh": "该研究在混合磁振子领域展示了新颖的可调微波放大机制，有明确实验验证及量子技术潜力，符合高影响力跨学科期刊的特点。", "relevance_score": 80, "relevance_method": "semantic", "relevance_reason": "Introduces kinetic-inductance parametric amplification tunable by magnon coupling in a hybrid superconducting magnonic system, advancing nonlinear microwave amplification and magnon-photon coupling physics.", "feature_candidate": false, "method_en": "The method uses a nonlinear NbN nanowire resonator coupled to a yttrium iron garnet sphere to explore parametric amplification via four-wave mixing and nonlinear frequency pulling in both magnon detuned and strong coupling regimes.", "method_zh": "方法采用非线性NbN纳米线谐振腔与钇铁石榴石球体耦合，研究四波混频与非线性频率牵引下的参量放大，在磁振子失谐和强耦合区域均有表现。", "result_en": "They observed about 7 dB gain away from magnon resonance and 3.4 dB gain within the hybrid mode, with parametric amplification tunable by magnetic coupling. At higher pump powers, self-oscillations and complex nonlinear mode mixing appear.", "result_zh": "在磁振子失谐区获得约7 dB增益，在混合模态中获得3.4 dB增益，参量放大响应可通过磁耦合调节。高泵浦功率下系统进入自激振荡，出现梳状边带及探测激活的非线性模式混合。", "future_en": "Future experiments may explore further tuning mechanisms of the parametric amplifier and investigate detailed nonlinear dynamics at higher pump powers for application in sensitive microwave signal processing.", "future_zh": "未来实验可进一步探讨参量放大器的调节机制，并研究高泵浦功率下的详细非线性动力学，以推动微波灵敏信号处理应用。"}, {"id": "arxiv-2610-30929", "arxiv_id": "2610.30929", "type": "arXiv", "journal": "arXiv:2610.30929", "journal_ref": "", "title": "Piezo-Kerr effect in altermagnets and noncollinear antiferromagnets", "authors": "Yuqi Liu, Qiu-Shi Huang, Xinfeng Chen, Yilin Han, Run-Wu Zhang, Zhi-Ming Yu, Yugui Yao", "corresponding": "", "url": "https://arxiv.org/abs/2610.30929", "topic": "Magnetism", "level": "Brief", "summary_en": "Strain activates symmetry-forbidden Kerr rotation in 16 of 122 magnetic point groups, with calculated signals of tens to hundreds of millidegrees.", "summary": "Strain activates symmetry-forbidden Kerr rotation in 16 of 122 magnetic point groups, with calculated signals of tens to hundreds of millidegrees.", "abstract": "Symmetry is usually viewed as a constraint on physical responses, but it can also be used to design the fields that control them. Here, we adopt the representation-matching principle used to identify conjugate fields of order parameters and apply it to response tensors. A linear coupling, the key ingredient for sign-switching control, is symmetry-allowed when a component (or a combination of components) of the control field and the selected response component share the same irreducible representation of the magnetic point group (MPG) of the system. Applied to the magneto-optical Kerr effect, this principle yields a piezo-Kerr effect, in which specific strain combinations activate a Kerr response forbidden in the unstrained state. Enumerating all 122 MPGs, we identify 16 groups in which the unstrained Kerr response is forbidden while a linear strain-induced contribution is allowed. These groups are realized by altermagnets and noncollinear antiferromagnets with symmetry-enforced vanishing net magnetization. The active strain channels and the associated first-order sign reversals follow directly from symmetry. First-principles calculations for bulk MnTe$_{2}$ and CoF$_{2}$, and Cr$_{2}$Se$_{2}$O and Cr$_{2}$Te$_{2}$O monolayers confirm these predictions. In these materials, the Kerr rotation vanishes without strain, whereas 0.5-3% strain produces rotations ranging from tens to hundreds of millidegrees, and reversing the matched strain channel reverses the Kerr sign. These results establish a general route to large and switchable Kerr responses emerging from symmetry-forbidden states in compensated magnets.", "method": "", "result": "", "future": "", "summary_zh": "提出应变激活原本对称性禁戒的 Kerr 响应；122 种磁点群中有 16 种允许线性效应，预测 Kerr 旋转可达数十至数百毫度。", "tier": "PRL", "tier_reason_en": "A general symmetry selection rule with quantitative material predictions and a clean, testable sign-reversal signature.", "tier_reason_zh": "普适对称性选择定则、定量材料预测及干净可检验的符号翻转特征，具备 PRL 水平潜力。", "method_en": "Magnetic-point-group representation analysis over all 122 MPGs, followed by first-principles magneto-optical conductivity and strain calculations for bulk MnTe2, CoF2 and monolayer Cr2Se2O/Cr2Te2O.", "method_zh": "枚举全部 122 种磁点群的表示，计算线性应变–Kerr 张量；随后对块体 MnTe₂、CoF₂ 及单层 Cr₂Se₂O/Cr₂Te₂O 做第一性原理应变与磁光电导计算。", "result_en": "The central equation is θ_i = Σ_jk Λ_i,jk ε_jk, where the time-reversal-odd piezo-Kerr tensor Λ is symmetry-constrained. Fig. 1 illustrates a zero-background Kerr signal activated and sign-reversed by strain. Table 1 identifies 16 MPGs allowing the response; for 4′/mm′m, θ_z ∝ ε_xx−ε_yy. The calculated Cr2Se2O response (Fig. 4) reaches ~50 mdeg at 1% and 164 mdeg at 3% strain (photon energy 1.44 eV). The authors extend representation matching from order parameters to response tensors.", "result_zh": "核心公式为 θ_i=Σ_jk Λ_i,jk ε_jk，其中时间反演奇的 piezo-Kerr 张量 Λ 由磁点群对称性约束。Fig. 1 展示零背景 Kerr 信号被应变激活并随应变反向翻转；Table 1 列出允许该响应的 16 种磁点群，例如 4′/mm′m 中 θ_z∝ε_xx−ε_yy；Fig. 4 计算单层 Cr₂Se₂O 在 1% 应变下约 50 mdeg、3% 下约 164 mdeg（光子能量 1.44 eV）。作者将序参量的表示匹配原则推广到响应张量。", "future_en": "Test bulk CoF2 or MnTe2 with piezo-driven AC strain and lock-in Kerr rotation; use orthogonal εxx−εyy channels and magnetic-domain training to verify linearity and sign reversal before seeking transverse transport analogues.", "future_zh": "优先在块体 CoF₂ 或 MnTe₂ 上施加压电 AC 应变，用锁相 Kerr 测量；对比 εxx−εyy 的正负通道并训练磁畴，验证线性关系与符号翻转，再寻找相应横向输运响应。", "relevance_score": 80, "relevance_method": "semantic", "relevance_reason": "Introduces the piezo-Kerr effect in altermagnets and noncollinear antiferromagnets, predicting and confirming strain-controlled magneto-optic responses forbidden in unstrained states, advancing symmetry-based control of magneto-optics.", "feature_candidate": true}, {"id": "arxiv-2606-10420", "arxiv_id": "2606.10420", "type": "arXiv", "journal": "arXiv:2606.10420", "journal_ref": "", "title": "Superheating field of clean superconductors near the type-I--type-II boundary: the low-temperature Meissner stability limit of niobium", "authors": "Takayuki Kubo", "corresponding": "", "url": "https://arxiv.org/abs/2606.10420", "topic": "Superconductivity", "level": "Brief", "summary_en": "The work calculates the low-temperature superheating field and Meissner stability near the type-I/type-II boundary.", "summary": "The work calculates the low-temperature superheating field and Meissner stability near the type-I/type-II boundary.", "abstract": "We calculate the low-temperature superheating field $B_{\\rm sh}$ of clean superconductors near the boundary between type-I and type-II superconductivity, with particular emphasis on Nb. Ginzburg--Landau theory is not applicable at low temperatures, while previous microscopic calculations have been limited to either the large-$κ$ regime or the dirty limit. The clean, low-$κ$ regime relevant to Nb has therefore remained unresolved. We solve the self-consistent nonlinear nonlocal Eilenberger problem for the Meissner state and then analyze its stability against small perturbations. For a Nb-like material with $κ_{\\rm GL}=0.7$, we obtain $B_{\\rm sh}\\simeq 290\\,{\\rm mT}$ at $T/T_c=0.2$, using $B_{c0}\\simeq 200\\,{\\rm mT}$. For a TESLA-shaped Nb accelerator cavity, this corresponds to an intrinsic Meissner-stability limit of about $67\\,{\\rm MV/m}$.", "method": "", "result": "", "future": "", "summary_zh": "研究洁净超导体在 I 型与 II 型边界附近的低温过热场及 Meissner 态稳定性。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 80, "relevance_method": "semantic", "relevance_reason": "Provides a crucial microscopic calculation of low-temperature superheating field near type-I/II boundary for clean Nb, resolving a key practical and theoretical gap in superconductivity.", "feature_candidate": false}, {"id": "arxiv-2610-30684", "arxiv_id": "2610.30684", "type": "arXiv", "journal": "arXiv:2610.30684", "journal_ref": "", "title": "Impact of localized $4f$ magnetism on Berry curvature and the intrinsic anomalous Hall effect in CeRu$_2$Si$_2$", "authors": "Takehiro Kobayashi, Shunsuke Hirai, Ibuki Terada, Michi-To Suzuki", "corresponding": "", "url": "https://arxiv.org/abs/2610.30684", "topic": "Magnetism", "level": "Brief", "summary_en": "Localized Ce 4f magnetism can induce conduction-band exchange splitting and intrinsic Berry-curvature Hall response in CeRu2Si2.", "summary": "Localized Ce 4f magnetism can induce conduction-band exchange splitting and intrinsic Berry-curvature Hall response in CeRu2Si2.", "abstract": "The intrinsic anomalous Hall effect (AHE), originating from Berry curvature, has been extensively studied in $f$-electron systems, including Ce-based compounds. However, how the magnetism of localized $f$ electrons affect the intrinsic AHE remains unclear. Here, we investigate this issue in CeRu$_2$Si$_2$ by calculating the intrinsic anomalous Hall conductivity (AHC) for several occupied Ce-$4f$ states using first-principles LDA+$U$ calculations combined with Wannier interpolation method. We find that the intrinsic AHC remains finite even when the Ce-$4f$ states are localized and do not contribute directly to the Fermi surface, and that its magnitude depends on which Ce-$4f$ state is occupied. We show that localized $4f$-electron magnetism induces exchange splitting in the conduction bands, generating son transport, whereas the normal component exhibits slow, thermodynamically limited response, resulting in a flow-rate contrast of 500(49). Exploiting this contrast, we demonstrate repeated filtering of the normal component and dynamical purification of the superfluid, while sustaining coherent driven oscillations for up to 100 cycles. Our results establish a controllable atomic superleak and open possibilities for manipulating transport and thermodynamics in quantum fluids.", "method": "", "result": "", "future": "", "summary_zh": "用光学超晶格实现原子超流体选择性透过的 superleak，超流与正常组分流速对比达 500(49)。", "tier": "Nature Physics/Nature Materials", "tier_reason_en": "A direct experimental realization of a longstanding quantum-fluid transport function.", "tier_reason_zh": "直接实验实现了长期关注的量子流体选择性输运功能。", "relevance_score": 78, "relevance_method": "semantic", "relevance_reason": "Reports first realization of an atomic superleak in ultracold quantum gases selectively transporting superfluid but not normal components, opening new experimental avenues on superfluid transport and thermodynamics.", "feature_candidate": true}, {"id": "arxiv-2610-30918", "arxiv_id": "2610.30918", "type": "arXiv", "journal": "arXiv:2610.30918", "journal_ref": "", "title": "Thermal expansion mechanisms, heat transport, and band-gap renormalization in strongly anharmonic Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ from machine-learned interatomic potentials", "authors": "Ekaterina Spirande, Rustam Arabov, Sofya Demina, Nikita Rybin, Alexander Shapeev", "corresponding": "", "url": "https://arxiv.org/abs/2610.30918", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The study uses machine-learned interatomic potentials trained on DFT to simulate lattice dynamics, thermal expansion, heat transport, and band-gap renormalization in structurally complex anharmonic materials Rb2SO4, Rb2Ca2(SO4)3, and Ba3Lu(BO3)3.", "summary": "Machine-learned potentials connect thermal expansion, heat transport and band-gap renormalization in strongly anharmonic sulfates and borates.", "abstract": "Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ are structurally complex materials whose thermal expansion has been interpreted, on the basis of high-temperature x-ray diffraction, in terms of specific polyhedral rearrangements. We study their lattice dynamics and its consequences for thermal and electronic properties using molecular dynamics with actively learned moment tensor potentials trained on density-functional theory data. The anharmonicity measure $σ^A$ (compares the anharmonic contribution to the interatomic forces with the total forces acting on atoms) reaches $\\approx$0.3-0.5 for $β$-Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ and $\\approx$0.75 for orientationally disordered $α$-Rb$_2$SO$_4$, and the imaginary harmonic modes of Rb$_2$Ca$_2$(SO$_4$)$_3$ and $α$-Rb$_2$SO$_4$ are stabilized at finite temperature. The simulations reproduce the measured thermal expansion and support the mechanisms proposed from diffraction: expansion along $c$ in $β$-Rb$_2$SO$_4$ arises from both elongation and straightening of corrugated Rb chains, BO$_3$ reorientation accompanies the anisotropic expansion of Ba$_3$Lu(BO$_3$)$_3$, and bending of polyhedral linkages limits expansion along the weakly expanding directions and in cubic Rb$_2$Ca$_2$(SO$_4$)$_3$. Green-Kubo lattice thermal conductivities differ by more than an order of magnitude between compounds with comparable $σ^A$, showing that the anharmonicity measure alone does not determine heat transport. Phonon-induced band-gap renormalization, including lattice thermal expansion, reaches 2.7 and 1.7 eV at 1250 K in Rb$_2$Ca$_2$(SO$_4$)$_3$ and Ba$_3$Lu(BO$_3$)$_3$ and 1.4 eV at 650 K in $β$-Rb$_2$SO$_4$, with zero-point renormalizations of 0.64, 0.70, and 0.31 eV for $β$-Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$, respectively.", "method": "", "result": "", "fut s": "Shankeerthan Kalyanasundaram, Swarit Dwivedi, Sanje Mahasivam, Christopher R. McNeill, Sudha Mokkapati", "corresponding": "", "url": "https://arxiv.org/abs/2610.30764", "topic": "Materials & Growth", "level": "Brief", "summary_en": "This paper presents a steric-engineering ternary-solvent growth strategy for synthesizing large-area monolayer and few-layer hybrid perovskites, achieving lateral areas over 1000 µm².", "summary": "A general route to large-area hybrid perovskite monolayers supports lithography-free, low-static-power optoelectronics.", "abstract": "Solution-phase synthesis of monolayer hybrid organic-inorganic perovskites is constrained by rapid out-of-plane crystal growth, uncontrolled nucleation, and strong interlayer aggregation, yielding flakes of only a few μm. We introduce a steric-engineering ternary-solvent growth strategy to synthesize monolayer and few-layer A2MX4 hybrid perovskites with exceptionally large surface areas. By combining alcohol cosolvents with an amine additive, out-of-plane stacking is suppressed. Using (PEA)2CuCl4 as a model system, monolayers with lateral areas exceeding 1000 μm2 are achieved, representing a massive dimensional increase over conventional methods. Molecular dynamics and quantum-chemical calculations show that longer-chain alcohols reorganize precursor solvation, while solvent volatility prolongs edge-mediated precursor transport during annealing. This strategy demonstrates universal applicability across diverse organic spacer cations (PEA+, F-PEA+, PentA+), metal centers (Cu2+, Mn2+, Pb2+), and halides (Cl-, Br-, I-). The large lateral dimensions enable direct, solvent-free electrical contact fabrication via physical shadow masking, bypassing chemical degradation from solvents used in conventional lithography. Planar devices fabricated from isolated ultrathin (PEA)2PbI4 channels exhibit ultra-low dark currents down to the 10^-15 - 10^-13 A range, enabling femtowatt-to-picowatt static power consumption, ~ 0. lomb-Driven Electronic Textures in Lightly Hole-Doped Cuprates", "authors": "Wei-Wei Yang, Yang Shen, Yuxin Wang, Pengfei Li, Mingpu Qin, Kun Jiang", "corresponding": "", "url": "https://arxiv.org/abs/2610.30766", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Poorly screened Coulomb interactions organize electronic textures in lightly hole-doped cuprates.", "summary": "Poorly screened Coulomb interactions organize electronic textures in lightly hole-doped cuprates.", "abstract": "Motivated by recent experiments on Ca$_2$CuO$_2$Cl$_2$, we present a comprehensive study of the interplay between dopants and localized Zhang-Rice singlets in lightly hole-doped cuprates. Owing to the poorly screened Coulomb potential, the interactions between dopants and localized Zhang-Rice singlets favor asymmetric electronic configurations characterized by effective electric \"dipoles\". Using the MPS-based Lanczos method, we show that these localized holes give rise to in-gap bound states within the charge-transfer gap. When tunneling matrix-element effects are included, the bound states exhibit a characteristic $4a_0 \\times 2a_0$ internal structure, consistent with experimental observations. Our results suggest that Coulomb interactions between dopants and localized Zhang-Rice singlets, together with tunneling matrix-element effects, provide a microscopic mechanism for the observed $4a_0$ electronic structures.", "method": "", "result": "", "future": "", "summary_zh": "理论研究轻度空穴掺杂铜氧化物中库仑相互作用驱动的非均匀电子织构。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "MPS-based theoretical study identifies Coulomb-driven asymmetric electronic textures arising from dopant-Zhang-Rice singlet interactions in doped cuprates, providing a microscopic mechanism for observed 4a0 electronic structures and deepeni", "feature_candidate": false}, {"id": "arxiv-2610-31142", "arxiv_id": "2610.31142", "type": "arXiv", "journal": "arXiv:2610.31142", "journal_ref": "", "title": "Interaction-enhanced antiferromagnetic correlations in a Kondo ladder with a gapped band structure", "authors": "Tatsuya Kaneko, Ritsuki Hirabayashi, Yutaka Akagi", "corresponding": "", "url": "https://arxiv.org/abs/2610.31142", "topic": "Magnetism", "level": "Brief", "summary_en": "Interactions enhance antiferromagnetic correlations in a Kondo ladder with a gapped band structure.", "summary": "Interactions enhance antiferromagnetic correlations in a Kondo ladder with a gapped band structure.", "abstract": "We investigate magnetic correlations in the two-leg Kondo-Hubbard ladder using the density-matrix renormalization group method. We focus on a parameter regime in which the noninteracting electronic system has a narrow indirect band gap. In this regime, there is no Fermi surface, and the conventional Fermi-surface-based Ruderman-Kittel-Kasuya-Yosida picture is not directly applicable; magnetic correlations between localized spins become weaker as the noninteracting band gap increases. We find that a moderate on-site Coulomb interaction enhances the antiferromagnetic correlations between localized spins. This enhancement, which is also seen in the staggered magnetization induced by a pinning field at the edges, occurs for both ferromagnetic and antiferromagnetic Kondo couplings. Our results show that electron-electron interactions can enhance magnetic correlations between localized spins even when the underlying noninteracting electronic structure is gapped, suggesting an interaction-driven route to magnetic instabilities in narrow-gap Kondo-lattice systems.", "method": "", "result": "", "future": "", "summary_zh": "研究具有能隙能带结构的 Kondo 梯子中相互作用增强的反铁磁关联。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "DMRG study reveals electron interactions enhance antiferromagnetic correlations in a Kondo ladder with a gapped noninteracting spectrum, highlighting interaction-driven magnetic instabilities beyond Fermi-surface mechanisms in correlated na", "feature_candidate": false}, {"id": "arxiv-2610-29729", "arxiv_id": "2610.29729", "type": "arXiv", "journal": "arXiv:2610.29729", "journal_ref": "", "title": "Intertwined complex orbital order and ferrimagnetism in honeycomb molybdate Fe$_2$Mo$_3$O$_8$", "authors": "Hong-Hao Song, Gang v. Chen", "corresponding": "", "url": "https://arxiv.org/abs/2610.29729", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The authors study intertwined orbital ordering and ferrimagnetism in honeycomb Fe2Mo3O8.", "summary": "The authors study intertwined orbital ordering and ferrimagnetism in honeycomb Fe2Mo3O8.", "abstract": "Motivated by the recent experimental interest in honeycomb molybdates A$_2$Mo$_3$O$_8$, we return and develop the minimal models to capture the essential physics for Fe$_2$Mo$_3$O$_8$. It is pointed out that, the magnetism in these materials arises from the mutual induction between the spin-orbit coupling of the tetrahedral sublattice with active orbitals and the superexchange with the spins from the octahedral sublattice. Essentially, the superexchange between the tetrahedral and octahedral sublattices directly drives the ferrimagnetism, and the residual spin-orbit coupling on the tetrahedral sublattice induces the complex orbital order. The hybrid magnon-phonon excitations are further explored together with their resulting Berry curvatures and thermal Hall effect. We discuss the experimental relevance with Fe$_2$Mo$_3$O$_8$, and the framework can be extended to FeNiMo$_3$O$_8$, Ni$_2$Mo$_3$O$_8$ and other isostructural magnets.", "method": "", "result": "", "future": "", "summary_zh": "研 ations show that uniaxial compression of Sr2RuO4 produces a sizable thermopower anisotropy through modification of the Fermi surfaces. When an idealized spatially inhomogeneous strain field around the Ru lamellae is included, the observed sign and qualitative magnitude of the anisotropy are reproduced more closely than in a simple unstrained two-component model. These results are consistent with a substantial contribution from strain-induced changes in the Sr2RuO4 electronic structure near the interfaces, although contributions from interfacial phase mixing and three-dimensional transport connectivity cannot be excluded.", "method": "", "result": "", "future": "", "summary_zh": "在 Sr₂RuO₄–Ru 共晶中测得相对 Ru 片层平行与垂直方向的热电势各向异性，局域应变模型解释其符号和量级。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "Careful Seebeck and strain-model comparison; its central interpretation is qualitative and based on one eutectic sample.", "tier_reason_zh": "Seebeck 与应变模拟结合较完整，但目前主要是单块共晶样品上的定性机制论证。", "method_en": "Floating-zone-grown Sr2RuO4–Ru eutectic with ~2% visible Ru lamellae; steady-state Seebeck measurements for heat gradients parallel/perpendicular to lamellae; DFT Boltzmann transport and finite-element strain maps.", "method_zh": "使用浮区法生长的 Sr₂RuO₄–Ru 共晶（表面 Ru 片层面积约 2%）；沿片层平行/垂直方向测稳态 Seebeck 系数，结合 DFT Boltzmann 输运和有限元局域应变模拟。", "result_en": "Fig. 1 compares Sxx and Syy of the eutectic with a pure Sr2RuO4 reference and establishes anisotropy tied to lamellar orientation. Figs. 2–3 examine uniaxial-strain-driven Fermi-surface changes and the spatial strain distribution near Ru. Fig. 4 shows that an unstrained two-component mixing model produces <1% anisotropy, while a finite-element strain-informed calculation gives the observed sign and a closer magnitude. The authors argue that thermopower is a sensitive normal-state probe of interfacial strain associated with the 3-K superconducting phase.", "result_zh": "Fig. 1 比较共晶沿 Ru 片层垂直和平行方向的 Sxx、Syy，并以纯 Sr₂RuO₄ 为参照；Figs. 2–3 研究单轴应变导致的费米面变化 esponding": "", "url": "https://arxiv.org/abs/2610.31206", "topic": "Magnetism", "level": "Brief", "summary_en": "Composition-gradient zone-remelted Ni–Mn–Ga crystals identify a Mn-poor regime where martensitic transformations disappear.", "summary": "Composition-gradient zone-remelted Ni–Mn–Ga crystals identify a Mn-poor regime where martensitic transformations disappear.", "abstract": "Composition gradients formed during directional solidification are generally considered undesirable in Ni-Mn-Ga magnetic shape-memory alloys. However, these gradients offer a highly effective platform for systematically investigating composition-property relationships under identical growth and heat-treatment conditions. To exploit this approach, one Mn-deficient and two near-stoichiometric Ni-Mn-Ga oligocrystals were grown by optical zone remelting and characterized by X-ray fluorescence mapping, optical microscopy, X-ray diffraction, low-field magnetic measurements, and vibrating-sample magnetometry. The ingots contained elongated grains and axial compositional gradients, primarily associated with the redistribution of Mn and Ga, whereas Ni remained relatively uniformly distributed. The martensitic and premartensitic transformation temperatures generally increased with increasing Mn content. Neither transformation was detected between 10 and 400 K in specimens containing 20.5-22.0 at.% Mn, all of which had $e/a < 7.40$. In contrast, both transformations were observed in the investigated specimens containing at least 22.1 at.% ($e/a \\geq 7.46$). This abrupt change may indicate a possible electron-concentration threshold for the occurrence of these transformations. Saturation magnetization increased with Mn content up to 25.8 at.%, reaching 96.9 A m$^2$/kg at 10 K and 71.2 A m$^2$/kg at 300 K. Post-growth annealing increased the transition temperatures and changed the low-field magnetic response. The results indicate that composition-gradient oligocrystals serve as an effective platform for investigating the relationships between composition, structure, and magnetic properties in Ni-Mn-Ga alloys with the same processing history.", "method": "", "result": "", "future": "", "summary_zh": "通过光学区熔生长的成分梯度 Ni–Mn–Ga 晶体确定马氏体转变消失的低 Mn 组成区间。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 65, "relevance_method": "semantic", "relevance_reason": "Composition-gradient study of Mn-deficient Ni-Mn-Ga alloys connects electron concentration thresholds to disappearance of martensitic transformations and magnetic properties, providing experimental data relevant for phase transition physics", "feature_candidate": false}, {"id": "arxiv-2610-31127", "arxiv_id": "2610.31127", "type": "arXiv", "journal": "arXiv:2610.31127", "journal_ref": "", "title": "The often overlooked role of sound in liquid thermal transport", "authors": "Kamran Behnia", "corresponding": "", "url": "https://arxiv.org/abs/2610.31127", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "This review revisits the Bridgman formula linking sound velocity and thermal conductivity in liquids, highlighting its empirical success and connections to hydrodynamic theory and quantum-classical heat transport paradoxes.", "summary": "The work emphasizes the role of sound propagation in liquid thermal transport.", "abstract": "Formulated a hundred years ago, the Bridgman formula for thermal conductivity of liquids postulates a proportionality between sound velocity and thermal conductivity. This designates phonons as heat carriers in a liquid. Its empirical success has been under-appreciated and its conceptual implications overlooked. It is not mentioned in well-known condensed-matter textbook. Here, we review its origin, its links to hydrodynamic Euler equations and to the fundamental paradox surrounding the parabolic heat equation and its fate across the quantum-classical crossover.", "method": "", "result": "", "future": "", "summary_zh": "本综述重新探讨了Bridgman公式，该公式将液体中的声速与热导率关联，强调其经验成功及与流体力学和量子-经典热传输悖论的联系。", "tier": "Uncertain", "tier_reason_en": "As a review addressing classical results from a refreshed theoretical perspective without new experimental data, it is more suitable for focused physics or materials science review venues.", "tier_reason_zh": "作为从更新的理论视角审视经典结果的综述，且无新实验数据，更适合物理或材料科学专题综述期刊。", "relevance_score": 65, "relevance_method": "semantic", "relevance_reason": "Highlights overlooked Bridgman formula connecting sound velocity to liquid thermal conductivity, reviewing its hydrodynamic and quantum-classical implications; mainly conceptual with some condensed matter insights.", "feature_candidate": false, "method_en": "The approach reviews foundational literature linking the Bridgman formula with Euler hydrodynamic equations and addresses conceptual paradoxes in classical and quantum heat conduction.", "method_zh": "方法回顾Bridgman公式与欧拉流体力学方程的联系，并讨论经典与量子热传导中的概念悖论。", "result_en": "The analysis clarifies neglected conceptual implications of phonon-mediated heat conduction in liquids and situates the Bridgman formula within contemporary theoretical frameworks.", "result_zh": "分析阐明了液体中声子介导热传导的被忽视的概念意义，并把Bridgman公式置于现代理论框架中。", "future_en": "Further theoretical and experimental work may explore the quantum-classical crossover effects on heat conduction in liquids and verify Bridgman’s relation under novel conditions.", "future_zh": "未来理论和实验工作可探究液体热传导中量子-经典交叉效应，并验证Bridgman关系在新条件下的适用性。"}, {"id": "arxiv-2610-30641", "arxiv_id": "2610.30641", "type": "arXiv", "journal": "arXiv:2610.30641", "journal_ref": "", "title": "How good are universal MLIPs for alloys? A benchmark is only as trustworthy as its controls", "authors": "Gus L. W. Hart, Jacob N. Pursley", "corresponding": "", "url": "https://arxiv.org/abs/2610.30641", "topic": "Correlated Electrons", "level": "Brief", "summary_en": "This paper benchmarks fourtee    const summary=field(p,'summary'),method=field(p,'method'),result=field(p,'result'),future=field(p,'future'),reason=field(p,'tier_reason');
   const details=[p.published_journal?`<p><strong>${esc(t.actualJournal)}</strong> — ${p.published_doi?`<a href="${esc(p.published_doi)}" target="_blank" rel="noopener">${esc(p.published_journal)} ↗</a>`:esc(p.published_journal)}</p>`:'',p.tier?`<p><strong>${esc(t.estimated)}</strong> — ${esc(p.tier)}${reason?' · '+esc(reason):''}</p>`:'',method?`<p><strong>${esc(t.methods)}</strong> — ${esc(method)}</p>`:'',result?`<p><strong>${esc(t.findings)}</strong> — ${esc(result)}</p>`:'',future?`<p><strong>${esc(t.followup)}</strong> — ${esc(future)}</p>`:''].join('');
   return `${heading}<article class="paper" id="${esc(p.id)}"><div class="topline"><div class="label ${p.level==='Feature'?'feature':''}">${esc(displayTopic(p.topic))} · ${esc(p.level==='Feature'?t.feature:t.brief)}</div><span class="pub">${esc(p.journal)}</span></div><h3><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)} ↗</a></h3><div class="authors">${esc(p.authors)}${p.corresponding&&p.corresponding!=='—'?' · '+esc(t.corresponding)+': '+esc(p.corresponding):''}</div>${summary?`<p class="abstract">${esc(summary)}</p>`:''}${details?`<button type="button" class="expand">${esc(t.read)}</button><div class="details" hidden>${details}<p><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(t.fullText)}</a></p></div>`:''}</article>`;
 }).join('')||`<div class="empty">${esc(t.empty)}</div>`;
 byId('papers').querySelectorAll('.expand').forEach(b=>b.addEventListener('click',()=>toggleNotes(b)));
}
byId('lang-en').addEventListener('click',()=>chooseLanguage('en'));
byId('lang-zh').addEventListener('click',()=>chooseLanguage('zh'));
byId('search').addEventListener('input',render);
render();
</script></body></html>
