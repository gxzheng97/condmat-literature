tulates a proportionality between sound velocity and thermal conductivity. This designates phonons as heat carriers in a liquid. Its empirical success has been under-appreciated and its conceptual implications overlooked. It is not mentioned in well-known condensed-matter textbook. Here, we review its origi", "abstract": "Formulated a hundred years ago, the Bridgman formula for thermal conductivity of liquids postulates a proportionality between sound velocity and thermal conductivity. This designates phonons as heat carriers in a liquid. Its empirical success has been under-appreciated and its conceptual implications overlooked. It is not mentioned in well-known condensed-matter textbook. Here, we review its origin, its links to hydrodynamic Euler equations and to the fundamental paradox surrounding the parabolic heat equation and its fate across the quantum-classical crossover.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30918", "arxiv_id": "2610.30918", "type": "arXiv", "journal": "arXiv:2610.30918", "journal_ref": "", "title": "Thermal expansion mechanisms, heat transport, and band-gap renormalization in strongly anharmonic Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ from machine-learned interatomic potentials", "authors": "Ekaterina Spirande, Rustam Arabov, Sofya Demina et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30918", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ are structurally complex materials whose thermal expansion has been interpreted, on the basis of high-temperature x-ray diffraction, in terms of specific polyhedral rearrangements. We study their lattice dynamics and its consequences for thermal and electronic properties using molecular dynamics with actively learned moment tensor po", "summary": "Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ are structurally complex materials whose thermal expansion has been interpreted, on the basis of high-temperature x-ray diffraction, in terms of specific polyhedral rearrangements. We study their lattice dynamics and its consequences for thermal and electronic properties using molecular dynamics with actively learned moment tensor po", "abstract": "Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ are structurally complex materials whose thermal expansion has been interpreted, on the basis of high-temperature x-ray diffraction, in terms of specific polyhedral rearrangements. We study their lattice dynamics and its consequences for thermal and electronic properties using molecular dynamics with actively learned moment tensor potentials trained on density-functional theory data. The anharmonicity measure $σ^A$ (compares the anharmonic contribution to the interatomic forces with the total forces acting on atoms) reaches $\\approx$0.3-0.5 for $β$-Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$ and $\\approx$0.75 for orientationally disordered $α$-Rb$_2$SO$_4$, and the imaginary harmonic modes of Rb$_2$Ca$_2$(SO$_4$)$_3$ and $α$-Rb$_2$SO$_4$ are stabilized at finite temperature. The simulations reproduce the measured thermal expansion and support the mechanisms proposed from diffraction: expansion along $c$ in $β$-Rb$_2$SO$_4$ arises from both elongation and straightening of corrugated Rb chains, BO$_3$ reorientation accompanies the anisotropic expansion of Ba$_3$Lu(BO$_3$)$_3$, and bending of polyhedral linkages limits expansion along the weakly expanding directions and in cubic Rb$_2$Ca$_2$(SO$_4$)$_3$. Green-Kubo lattice thermal conductivities differ by more than an order of magnitude between compounds with comparable $σ^A$, showing that the anharmonicity measure alone does not determine heat transport. Phonon-induced band-gap renormalization, including lattice thermal expansion, reaches 2.7 and 1.7 eV at 1250 K in Rb$_2$Ca$_2$(SO$_4$)$_3$ and Ba$_3$Lu(BO$_3$)$_3$ and 1.4 eV at 650 K in $β$-Rb$_2$SO$_4$, with zero-point renormalizations of 0.64, 0.70, and 0.31 eV for $β$-Rb$_2$SO$_4$, Rb$_2$Ca$_2$(SO$_4$)$_3$, and Ba$_3$Lu(BO$_3$)$_3$, respectively.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2602-22651", "arxiv_id": "2602.22651", "type": "arXiv", "journal": "Phys. Rev. Lett. 137, 160406 (2026)", "journal_ref": "Phys. Rev. Lett. 137, 160406 (2026)", "title": "Thermodynamic Uncertainty Relation with Quantum Feedback", "authors": "Ryotaro Honma, Tan Van Vu", "corresponding": "", "url": "https://arxiv.org/abs/2602.22651", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Fluctuations are intrinsic to microscopic systems and impose fundamental limits on nonequilibrium precision, as captured by the thermodynamic uncertainty relation (TUR), which links current fluctuations to entropy production. While feedback control is expected to further suppress fluctuations, its role within the TUR framework has remained unclear, particularly in quantum systems where control is ", "summary": "Fluctuations are intrinsic to microscopic systems and impose fundamental limits on nonequilibrium precision, as captured by the thermodynamic uncertainty relation (TUR), which links current fluctuations to entropy production. While feedback control is expected to further suppress fluctuations, its role within the TUR framework has remained unclear, particularly in quantum systems where control is ", "abstract": "Fluctuations are intrinsic to microscopic systems and impose fundamental limits on nonequilibrium precision, as captured by the thermodynamic uncertainty relation (TUR), which links current fluctuations to entropy production. While feedback control is expected to further suppress fluctuations, its role within the TUR framework has remained unclear, particularly in quantum systems where control is inherently information-driven. In this Letter, we consider open quantum systems weakly coupled to a thermal environment, in which quantum jumps are continuously monitored, and Markovian feedback is applied. Using quantum mutual information to quantify the information contribution induced by feedback, we derive a finite-time TUR for arbitrary time-integrated currents in terms of entropy production and mutual information. Our results uncover how feedback control suppresses fluctuations together with thermodynamic cost and establish a fundamental precision bound imposed by information-based control. As an application, we analyze a quantum clock model and demonstrate that the clock precision can be enhanced by feedback control in the presence of a single thermal reservoir.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30242", "arxiv_id": "2610.30242", "type": "arXiv", "journal": "arXiv:2610.30242", "journal_ref": "", "title": "Defect flows from functional relations in the asymptotic semiring", "authors": "Federico Ambrosino, Anatoly Konechny, Ingo Runkel et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30242", "topic": "Topology & Transport", "level": "Brief", "summary_en": "We study perturbations of topological defects by a relevant holomorphic defect field in two-dimensional conformal field theory. This produces translation invariant defects and these necessarily flow to topological defects in the infrared. Translation invariant defects form a monoidal category which extends the fusion category of topological defects. We argue that the renormalisation group flow def", "summary": "We study perturbations of topological defects by a relevant holomorphic defect field in two-dimensional conformal field theory. This produces translation invariant defects and these necessarily flow to topological defects in the infrared. Translation invariant defects form a monoidal category which extends the fusion category of topological defects. We argue that the renormalisation group flow def", "abstract": "We study perturbations of topological defects by a relevant holomorphic defect field in two-dimensional conformal field theory. This produces translation invariant defects and these necessarily flow to topological defects in the infrared. Translation invariant defects form a monoidal category which extends the fusion category of topological defects. We argue that the renormalisation group flow defines a semiring homomorphism from the semiring of translation invariant defects to an \"asymptotic semiring\" which we construct from topological defects. The semiring homomorphism preserves functional relations, and we illustrate in the example of Virasoro minimal models that the resulting relations in the asymptotic semiring constrain the defect flow endpoints. The companion paper [1] contains a detailed study of such defect flows in several minimal models, both numerically and analytically.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2609-38654", "arxiv_id": "2609.38654", "type": "arXiv", "journal": "arXiv:2609.38654", "journal_ref": "", "title": "Directional Control of Droplet Motion via Geometric Gating", "authors": "Manoj K. Chaudhury, Vanessa Elias, Michelle Fruge", "corresponding": "", "url": "https://arxiv.org/abs/2609.38654", "topic": "Topology & Transport", "level": "Brief", "summary_en": "We explore new methods for inducing the movement of water droplets on elastomeric substrates, such as polydimethylsiloxane (PDMS). Our approach builds upon the well-known phenomenon that water droplets move easily across these substrates when swelled w,ith silicone oil. While designing shallow open channels and traps on a PDMS film offers a simple way to control a droplet's trajectory by tilting t", "summary": "We explore new methods for inducing the movement of water droplets on elastomeric substrates, such as polydimethylsiloxane (PDMS). Our approach builds upon the well-known phenomenon that water droplets move easily across these substrates when swelled w,ith silicone oil. While designing shallow open channels and traps on a PDMS film offers a simple way to control a droplet's trajectory by tilting t", "abstract": "We explore new methods for inducing the movement of water droplets on elastomeric substrates, such as polydimethylsiloxane (PDMS). Our approach builds upon the well-known phenomenon that water droplets move easily across these substrates when swelled w,ith silicone oil. While designing shallow open channels and traps on a PDMS film offers a simple way to control a droplet's trajectory by tilting the substrate in two orthogonal directions, this method is poorly suited for manipulating multiple droplets simultaneously. To address this limitation, we introduce two new methods. The first method utilizes a plano-concave PDMS platform with a radius of curvature significantly larger than the size of the droplet and its translation distance. When the system's configuration is altered, this curved substrate consistently guides the droplet along a curved geodesic. The second method incorporates diode-like gates on the PDMS. These gates are created on either flat or plano-concave PDMS films by embedding thin, rigid plates into the elastomer prior to crosslinking, followed by swelling in silicone oil. This process generates sigmoidal steps that restrict droplet motion to a single direction. Finally, we demonstrate how combining these two strategies enables various forms of directed motion for both single and multiple droplets.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2607-13294", "arxiv_id": "2607.13294", "type": "arXiv", "journal": "Phys. Rev. Research 8, 043069 (2026)", "journal_ref": "Phys. Rev. Research 8, 043069 (2026)", "title": "Electronic properties and topological aspects of graphene nanohelicoids", "authors": "Xiaoqian Liu, Arsen Herasymchuk, Yaroslav Zhumagulov et al.", "corresponding": "", "url": "https://arxiv.org/abs/2607.13294", "topic": "Topology & Transport", "level": "Brief", "summary_en": "We introduce graphene nanohelicoids, geometric analogs of graphene nanoribbons, in which the honeycomb lattice is embedded on a helicoidal surface. Starting from the three-dimensional helical structure, we construct effective one-dimensional lattice models with band structures characterized by a momentum-shifted particle-hole relation $E_v(k)=-E_c(k+π)$ that reflects an antichiral symmetry arising", "summary": "We introduce graphene nanohelicoids, geometric analogs of graphene nanoribbons, in which the honeycomb lattice is embedded on a helicoidal surface. Starting from the three-dimensional helical structure, we construct effective one-dimensional lattice models with band structures characterized by a momentum-shifted particle-hole relation $E_v(k)=-E_c(k+π)$ that reflects an antichiral symmetry arising", "abstract": "We introduce graphene nanohelicoids, geometric analogs of graphene nanoribbons, in which the honeycomb lattice is embedded on a helicoidal surface. Starting from the three-dimensional helical structure, we construct effective one-dimensional lattice models with band structures characterized by a momentum-shifted particle-hole relation $E_v(k)=-E_c(k+π)$ that reflects an antichiral symmetry arising from the nonsymmorphic symmetry. A systematic investigation of graphene nanohelicoids using the tight-binding approximation reveals a number of trends upon varying width and edge orientation, for instance, alternating transitions between semiconducting and metallic regimes. As the structure width varies, the band gap periodically closes and reopens, accompanied by an alternating Zak phase that switches between trivial and nontrivial. Using an analytic tight-binding model with a continuous deformation of the graphene nanohelicoids, we explain the origin of width- and termination-dependent band inversion and alternating Zak phase, and derive the relationship between the termination-resolved index and the sublattice symmetry operator in one-dimensional nonsymmorphic systems.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31242", "arxiv_id": "2610.31242", "type": "arXiv", "journal": "arXiv:2610.31242", "journal_ref": "", "title": "Fluctuation-free Quantum Battery Charging Enabled by Bell-like Entangled and Separable Charger States", "authors": "Longyan Gong, Jing Zhang, Yongtao Li", "corresponding": "", "url": "https://arxiv.org/abs/2610.31242", "topic": "Topology & Transport", "level": "Brief", "summary_en": "The implication of entanglement in quantum battery charging remains poorly understood. In addition, intrinsic quantum randomness poses a fundamental challenge to charging uniformity across distinct trials. To address these issues, we study a three-qubit system within a cascaded collision frame, with two qubits acting as the charger and the third serving as the battery. After each collision, an ada", "summary": "The implication of entanglement in quantum battery charging remains poorly understood. In addition, intrinsic quantum randomness poses a fundamental challenge to charging uniformity across distinct trials. To address these issues, we study a three-qubit system within a cascaded collision frame, with two qubits acting as the charger and the third serving as the battery. After each collision, an ada", "abstract": "The implication of entanglement in quantum battery charging remains poorly understood. In addition, intrinsic quantum randomness poses a fundamental challenge to charging uniformity across distinct trials. To address these issues, we study a three-qubit system within a cascaded collision frame, with two qubits acting as the charger and the third serving as the battery. After each collision, an adaptive measurement is performed on the charger, yielding four conditional post-measurement battery states with identical expected stored energy. For arbitrary fixed charger states, we derive analytical expressions for the recurrence relation of stored energy. We find that stored-energy fluctuations depend on whether the dynamics relies on the battery phase \\(γ_n\\). For two Bell-like families of entangled states, together with their computational basis states termed Bell-like separable states, the dynamics is \\(γ_n\\)-independent and fluctuations vanish, whereas for other entangled and separable states, fluctuations emerge. These insights establish a paradigm for engineering charger states to design uniform-charging quantum-battery architectures despite inherent quantum randomness.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30665", "arxiv_id": "2610.30665", "type": "arXiv", "journal": "arXiv:2610.30665", "journal_ref": "", "title": "From phase analysis to phase tracking: a robust approach to atomic-scale strain mapping", "authors": "Ying Han, Yuan Tian", "corresponding": "", "url": "https://arxiv.org/abs/2610.30665", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Atomic-scale strain governs the electronic, ferroic and mechanical properties of materials, and atomic-resolution microscopy measures it most directly. Geometric phase analysis (GPA) is the standard tool, but it fails when a Bragg reflection moves outside its fixed Fourier aperture under large strain or rotation, or in misoriented grains. Here we introduce geometric phase tracking analysis (GPTA),", "summary": "Atomic-scale strain governs the electronic, ferroic and mechanical properties of materials, and atomic-resolution microscopy measures it most directly. Geometric phase analysis (GPA) is the standard tool, but it fails when a Bragg reflection moves outside its fixed Fourier aperture under large strain or rotation, or in misoriented grains. Here we introduce geometric phase tracking analysis (GPTA),", "abstract": "Atomic-scale strain governs the electronic, ferroic and mechanical properties of materials, and atomic-resolution microscopy measures it most directly. Geometric phase analysis (GPA) is the standard tool, but it fails when a Bragg reflection moves outside its fixed Fourier aperture under large strain or rotation, or in misoriented grains. Here we introduce geometric phase tracking analysis (GPTA), whose Fourier aperture tracks the Bragg reflection at each pixel in real space. A narrow aperture can therefore reject noise without losing a displaced reflection. On 13,795 simulated and experimental atomic-resolution images under various imaging conditions, GPTA reduces GPA's failure rate from 27% to 11.5% with up to 335 times better accuracy. It also gives strain and dislocation maps across grains, resistance to dynamical-scattering extinction, and a confidence map, capabilities that GPA lacks. Tracking the aperture combines reciprocal-space dose efficiency with real-space spatial resolution and extends atomic-scale strain metrology to beam-sensitive materials and challenging imaging conditions.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2310-03565", "arxiv_id": "2310.03565", "type": "arXiv", "journal": "J. Phys. A: Math. Theor. 57 095004 (2024)", "journal_ref": "J. Phys. A: Math. Theor. 57 095004 (2024)", "title": "Mobility, response and transport in non-equilibrium coarse-grained models", "authors": "Gerhard Jung", "corresponding": "", "url": "https://arxiv.org/abs/2310.03565", "topic": "Topology & Transport", "level": "Brief", "summary_en": "We investigate two different types of non-Markovian coarse-grained models extracted from a linear, non-equilibrium microscopic system, featuring a tagged particle coupled to underdamped oscillators. The first model is obtained by analytically ``integrating out'' the oscillators and the second is based on a derivation using projection operator techniques. We observe that these two models behave ver", "summary": "We investigate two different types of non-Markovian coarse-grained models extracted from a linear, non-equilibrium microscopic system, featuring a tagged particle coupled to underdamped oscillators. The first model is obtained by analytically ``integrating out'' the oscillators and the second is based on a derivation using projection operator techniques. We observe that these two models behave ver", "abstract": "We investigate two different types of non-Markovian coarse-grained models extracted from a linear, non-equilibrium microscopic system, featuring a tagged particle coupled to underdamped oscillators. The first model is obtained by analytically ``integrating out'' the oscillators and the second is based on a derivation using projection operator techniques. We observe that these two models behave very differently when the tagged particle is exposed to external harmonic potentials or pulling forces. Most importantly, we find that the analytic model has a well defined friction kernel and can be used to extract work, consistent with the microscopic system, while the projection model corresponds to an effective equilibrium model, which cannot be used to extract work. We apply the analysis to two popular non-equilibrium systems, time-delay feedback control and the active Ornstein-Uhlenbeck process. Finally, we highlight that our study could have important consequences for dynamic coarse-graining of non-equilibrium systems going far beyond the linear systems investigated in this manuscript.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-31653", "arxiv_id": "2610.31653", "type": "arXiv", "journal": "arXiv:2610.31653", "journal_ref": "", "title": "Onsager Algebras and Lattice Fermions", "authors": "Ioanna Kourkoulou, David Tong", "corresponding": "", "url": "https://arxiv.org/abs/2610.31653", "topic": "Topology & Transport", "level": "Brief", "summary_en": "We study the exact Onsager algebra of free lattice fermions in staggered, Wilson, and overlap incarnations, working in both Hamiltonian and Euclidean formulations in four spacetime dimensions. In each case, we show that the exact lattice algebra emanates the full chiral symmetry of the low-energy theory: if there are $N$ massless Dirac fermions in the continuum, the Onsager algebra reduces to a $U", "summary": "We study the exact Onsager algebra of free lattice fermions in staggered, Wilson, and overlap incarnations, working in both Hamiltonian and Euclidean formulations in four spacetime dimensions. In each case, we show that the exact lattice algebra emanates the full chiral symmetry of the low-energy theory: if there are $N$ massless Dirac fermions in the continuum, the Onsager algebra reduces to a $U", "abstract": "We study the exact Onsager algebra of free lattice fermions in staggered, Wilson, and overlap incarnations, working in both Hamiltonian and Euclidean formulations in four spacetime dimensions. In each case, we show that the exact lattice algebra emanates the full chiral symmetry of the low-energy theory: if there are $N$ massless Dirac fermions in the continuum, the Onsager algebra reduces to a $U(2N)$ chiral symmetry. The details of which generators are quantised or ultra-local differ between formulations. There is also a trade-off between the locality of generators and the maximum compact subgroup of the Onsager algebra.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30389", "arxiv_id": "2610.30389", "type": "arXiv", "journal": "arXiv:2610.30389", "journal_ref": "", "title": "Robust topology optimization of isogeometric Kirchhoff--Love shells by the Speed Method", "authors": "Philipp Eisenhardt, Fernando Hübner Scherer, Barbara Wohlmuth et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30389", "topic": "Topology & Transport", "level": "Brief", "summary_en": "This paper presents a framework for robust topology optimization of Kirchhoff-Love (KL) multi-patch shells using isogeometric analysis and non-matching meshes and provides a CAD-compatible method. The material distribution is optimized via a NURBS-based level set method, enabling accurate boundary representation and seamless export to standard CAD/CAM workflows. The shape derivative is computed us", "summary": "This paper presents a framework for robust topology optimization of Kirchhoff-Love (KL) multi-patch shells using isogeometric analysis and non-matching meshes and provides a CAD-compatible method. The material distribution is optimized via a NURBS-based level set method, enabling accurate boundary representation and seamless export to standard CAD/CAM workflows. The shape derivative is computed us", "abstract": "This paper presents a framework for robust topology optimization of Kirchhoff-Love (KL) multi-patch shells using isogeometric analysis and non-matching meshes and provides a CAD-compatible method. The material distribution is optimized via a NURBS-based level set method, enabling accurate boundary representation and seamless export to standard CAD/CAM workflows. The shape derivative is computed using the speed method, yielding a volume-based formulation that avoids boundary approximations and aligns with the isogeometric principle of coarse, high-order discretizations. This eliminates the need for local refinement, adaptive quadrature, or trimming as the descent direction for the compliance and volume objectives are obtained through a biharmonic equation. The framework is extended to robust optimization under uncertainty, accounting for stochastic loading and material properties via Monte Carlo sampling and Gaussian Random Fields. Numerical examples demonstrate the method's efficiency and robustness across single- and multi-patch shells, reproducing literature results with fewer elements than traditional FEM or refined IGA approaches. The developed methods and tools can be directly extended to problems involving stress-based optimization and risk-averse metrics. The numerical implementations are open-source and available on GitHub.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30330", "arxiv_id": "2610.30330", "type": "arXiv", "journal": "arXiv:2610.30330", "journal_ref": "", "title": "Shear-induced mechanical yielding controls cluster morphology and dynamics in aggregating non-Brownian suspensions", "authors": "Jae Hwan Jeong, Donald L. Koch, Sarah Hormozi", "corresponding": "", "url": "https://arxiv.org/abs/2610.30330", "topic": "Topology & Transport", "level": "Brief", "summary_en": "In sheared aggregating suspensions, flow drives both the formation and breakage of particle clusters, whose dynamic evolution influences transport and rheological properties. Understanding these mechanisms remains challenging due to the complex interplay between interparticle forces, hydrodynamic interactions, and shear flow. Using parallelized Accelerated Stokesian Dynamics (PASD) simulations, we", "summary": "In sheared aggregating suspensions, flow drives both the formation and breakage of particle clusters, whose dynamic evolution influences transport and rheological properties. Understanding these mechanisms remains challenging due to the complex interplay between interparticle forces, hydrodynamic interactions, and shear flow. Using parallelized Accelerated Stokesian Dynamics (PASD) simulations, we", "abstract": "In sheared aggregating suspensions, flow drives both the formation and breakage of particle clusters, whose dynamic evolution influences transport and rheological properties. Understanding these mechanisms remains challenging due to the complex interplay between interparticle forces, hydrodynamic interactions, and shear flow. Using parallelized Accelerated Stokesian Dynamics (PASD) simulations, we investigate cluster microstructure and rotational dynamics, and how their coupling produces suspension stress in sheared, attractive non-Brownian suspensions. When interparticle attraction dominates over separating shear forces, clusters grow until mechanical loading balances maximum interparticle bond strength. We examine how the cluster stresslet depends on cluster size, with both quantities normalized by their mechanical yielding scales. Scaled cluster stresslets collapse onto a master curve exhibiting three distinct regimes: cubic, quadratic, and linear with respect to the scaled radius of gyration $R_g$. In the cubic regime, small, compact clusters behave as rigid bodies, whose hydrodynamic stresslet scales with cluster volume $R_g^3$. As clusters grow into the quadratic regime, low-aspect-ratio clusters preferentially yield under flow, driving a proportional increase in average aspect ratio with size. High-aspect-ratio clusters follow Jeffery rotational dynamics within the flow-gradient plane, spending longer durations aligned with the flow and thereby reducing their time-averaged hydrodynamic stresslet to scale as $R_g^2$. In the linear regime, clusters approach the maximum size sustainable by the interparticle bonds. The internal tension is bounded by the maximum bond strength, limiting the stresslet to an $R_g$ dependence. These findings establish a mechanistic framework connecting microscale cluster morphology and dynamics to macroscale rheology.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30588", "arxiv_id": "2610.30588", "type": "arXiv", "journal": "arXiv:2610.30588", "journal_ref": "", "title": "Supercoiling Drives DNA-Protein Co-Condensation", "authors": "Sihan Liu, Hongbo Zhao, Andrej Košmrlj", "corresponding": "", "url": "https://arxiv.org/abs/2610.30588", "topic": "Topology & Transport", "level": "Brief", "summary_en": "The co-condensation of DNA and proteins plays an important role in genome compaction, including heterochromatin formation and chromosome segregation. Meanwhile, transcription and replication continuously generate DNA supercoiling, yet how the resulting torsional stress affects co-condensation remains poorly understood. Here, by coupling DNA elasticity to a protein concentration field, we show that", "summary": "The co-condensation of DNA and proteins plays an important role in genome compaction, including heterochromatin formation and chromosome segregation. Meanwhile, transcription and replication continuously generate DNA supercoiling, yet how the resulting torsional stress affects co-condensation remains poorly understood. Here, by coupling DNA elasticity to a protein concentration field, we show that", "abstract": "The co-condensation of DNA and proteins plays an important role in genome compaction, including heterochromatin formation and chromosome segregation. Meanwhile, transcription and replication continuously generate DNA supercoiling, yet how the resulting torsional stress affects co-condensation remains poorly understood. Here, by coupling DNA elasticity to a protein concentration field, we show that supercoiling acts as a topological catalyst for co-condensation through a mutually reinforcing interplay with protein wetting. Specifically, protein wetting facilitates twist-to-writhe conversion, generating highly writhed DNA conformations that in turn promote capillary collapse into a protein-rich droplet. In the absence of supercoiling, DNA remains kinetically trapped in metastable extended states within our model, whereas sufficiently strong supercoiling removes the nucleation barrier and enables spontaneous co-condensation. These results establish topology as a distinct control parameter for biomolecular condensation and provide a mechanical framework for how active genomic processes can dynamically regulate large-scale genome organization.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30726", "arxiv_id": "2610.30726", "type": "arXiv", "journal": "arXiv:2610.30726", "journal_ref": "", "title": "Symmetry-Preserving Local Representation for Short-Range Interaction in Complex Materials", "authors": "Hao Cheng, Tong Yang, Hao Wu et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30726", "topic": "Topology & Transport", "level": "Brief", "summary_en": "Modeling short-range interactions in highly disordered materials remains challenging due to the immense configuration space and the disruption of local symmetry in truncated theoretical models. Here, we propose a symmetry-preserving local representation framework that strictly enforces topological continuity and translational invariance via boundary passivation. Applied to high-entropy alloys, thi", "summary": "Modeling short-range interactions in highly disordered materials remains challenging due to the immense configuration space and the disruption of local symmetry in truncated theoretical models. Here, we propose a symmetry-preserving local representation framework that strictly enforces topological continuity and translational invariance via boundary passivation. Applied to high-entropy alloys, thi", "abstract": "Modeling short-range interactions in highly disordered materials remains challenging due to the immense configuration space and the disruption of local symmetry in truncated theoretical models. Here, we propose a symmetry-preserving local representation framework that strictly enforces topological continuity and translational invariance via boundary passivation. Applied to high-entropy alloys, this approach autonomously unravels the nonlinear ligand effects modulating local reactivity and accurately captures coverage-dependent many-body interactions without explicit periodic expansion. By resolving the conflict between localized chemical environments and extended periodic boundaries, this framework not only reduces computational complexity by an order of magnitude but also provides a physically transparent paradigm for deciphering short-range order in complex condensed matter systems.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30232", "arxiv_id": "2610.30232", "type": "arXiv", "journal": "arXiv:2610.30232", "journal_ref": "", "title": "Twisted scattering from Chern-Simons theory", "authors": "Guillermo Arias-Tamargo, Philip Boyle Smith, Rishi Mouland et al.", "corresponding": "", "url": "https://arxiv.org/abs/2610.30232", "topic": "Topology & Transport", "level": "Brief", "summary_en": "We consider boundary conditions of two-dimensional Dirac fermions which preserve a non-anomalous continuous symmetry which acts differently on the left- and right-movers. Such boundaries are equivalent to topological defects of Weyl fermions preserving the symmetry. We give a general construction of such defects for conformally-embedded symmetries using Chern-Simons theory. They always exist and c", "summary": "We consider boundary conditions of two-dimensional Dirac fermions which preserve a non-anomalous continuous symmetry which acts differently on the left- and right-movers. Such boundaries are equivalent to topological defects of Weyl fermions preserving the symmetry. We give a general construction of such defects for conformally-embedded symmetries using Chern-Simons theory. They always exist and c", "abstract": "We consider boundary conditions of two-dimensional Dirac fermions which preserve a non-anomalous continuous symmetry which acts differently on the left- and right-movers. Such boundaries are equivalent to topological defects of Weyl fermions preserving the symmetry. We give a general construction of such defects for conformally-embedded symmetries using Chern-Simons theory. They always exist and can be realised as half-space gauging defects for some finite categorical symmetry. Using this technology, we compute the twist lines to which fermions become attached upon scattering through the defect, the boundary central charge of the corresponding folded boundary state, and its mod-2 valued SPT class. As applications, we first consider abelian symmetries and find agreement with known results in the literature. We then study a novel example where an $SU(2) \\times SU(4) \\times U(1)^2$ symmetry is preserved. In contrast to the abelian case, the twist lines are intrinsically non-invertible and belong to either a $\\text{TY}(\\mathbb{Z}_3 \\times \\mathbb{Z}_3)$ or $\\text{Rep}(\\mathbb{S}_3) \\times \\mathbb{Z}_3$ symmetry depending on whether scattering is to the left or the right.", "method": "", "result": "", "future": ""}, {"id": "arxiv-2610-30241", "arxiv_id": "2610.30241", "type": "arXiv", "journal": "arXiv:2610.30241", "journal_ref": "", "title": "Vacancy-driven topological transition of a Chern insulator", "authors": "Peize Ding, Raquel Queiroz", "corresponding": "", "url": "https://arxiv.org/abs/2610.30241", "topic": "Topology & Transport", "level": "Brief", "summary_en": "We develop a microscopic description of the strong-disorder transition in a Chern insulator using the in-gap ring states bound to individual vacancies. Using Green's function formalism, we construct an energy-dependent Hamiltonian describing their hybridization. In a commensurate periodic vacancy lattice, a Dirac inversion of the zero-energy vacancy kernel accounts for the change in the occupied-s", "summary": "We develop a microscopic description of the strong-disorder transition in a Chern insulator using the in-gap ring states bound to individual vacancies. Using Green's function formalism, we construct an energy-dependent Hamiltonian describing their hybridization. In a commensurate periodic vacancy lattice, a Dirac inversion of the zero-energy vacancy kernel accounts for the change in the occupied-s", "abstract": "We develop a microscopic description of the strong-disorder transition in a Chern insulator using the in-gap ring states bound to individual vacancies. Using Green's function formalism, we construct an energy-dependent Hamiltonian describing their hybridization. In a commensurate periodic vacancy lattice, a Dirac inversion of the zero-energy vacancy kernel accounts for the change in the occupied-state Chern number of the full system. We treat weak positional disorder using the self-consistent Born approximation and numerical disorder averaging, and study independently distributed vacancies using transfer-matrix and multifractal scaling. The local Chern marker and current textures track the transition in real space. Together, these results highlight the role that nonperturbative ring states have as microscopic degrees of freedom through which strong disorder destroys the Chern phase.", "method": "", "result": "", "future": ""}], "stats": {"total": 311}}, {"date": "2026-10-22", "title": "Daily Condensed Matter Literature", "note": "2026-10-22 archival issue, assembled from the first Journal Club plus follow-up selections.", "papers": [{"id": "liu-prx", "type": "Journal", "journal": "Physical Review X", "title": "Nontrivial Boundary-Mediated Superconducting Transport in a TRSB Topological Iron-Based Superconductor", "authors": "Wenyao Liu, Gabriel Natale, Camron Farhang et al.", "corresponding": "Kenneth S. Burch", "url": "https://doi.org/10.1103/8vgt-twh5", "topic": "Superconductivity", "level": "Feature", "summary": "在 FeTe₀.₅₅Se₀.₄₅ 薄片中结合 Kerr 与局域/非局域输运，报告和 TRSB 温标相关的边缘超导电导 plateau。", "method": "Polar Kerr; edge-contact differential conductance; nonlocal transport; sample and contact geometry comparisons.", "result": "报告连续边缘上的异常 conductance plateau，温度演化与 Kerr 定义的 TRSB 温标相关。", "future": "适用于对 4Hb-TaS₂ 等候选材料设计不同接触几何的非局域输运实验。", "summary_zh": "在 FeTe₀.₅₅Se₀.₄₅ 薄片中结合 Kerr 与局域/非局域输运，报告和 TRSB 温标相关的边缘超导电导 plateau。", "summary_en": "Using polar Kerr rotation and local/nonlocal transport in FeTe₀.₅₅Se₀.₄₅ flakes, the authors report an edge-associated conductance plateau whose temperature dependence tracks the onset of time-reversal symmetry breaking.", "method_zh": "Polar Kerr; edge-contact differential conductance; nonlocal transport; sample and contact geometry comparisons.", "method_en": "Polar Kerr measurements, edge-contact differential conductance, nonlocal transport, and comparison of contact geometries.", "result_zh": "报告连续边缘上的异常 conductance plateau，温度演化与 Kerr 定义的 TRSB 温标相关。", "result_en": "An anomalous conductance plateau is observed along a continuous edge; its temperature evolution correlates with the Kerr-defined TRSB onset.", "future_zh": "适用于对 4Hb-TaS₂ 等候选材料设计不同接触几何的非局域输运实验。", "future_en": "Test edge-contact geometries and nonlocal superconducting transport in 4Hb-TaS₂ or other candidate TRSB superconductors."}, {"id": "cscr6sb6", "type": "arXiv", "journal": "arXiv:2610.29366", "title": "Hybridization-Induced Enhancement of the Thermoelectric Response in the Kagome Material CsCr₆Sb₆", "authors": "Hongye Zhang, Boqin Song, Aifeng Wang et al.", "corresponding": "Ying Zhu; Tianping Ying; Mingquan He", "url": "https://arxiv.org/abs/2610.29366", "topic": "Thermal & Thermoelectric", "level": "Feature", "summary": "测量 CsCr₆Sb₆ 单晶的 Seebeck、Nernst、Hall、比热与热导，关联热电增强与能带杂化、Kondo scattering 和 phonon drag。", "method": "Flux-grown single crystals; resistivity, Hall, Seebeck, Nernst, thermal conductivity, specific heat.", "result": "作者识别 ~70 K 的 crossover 和 ~20–25 K 热电极值，并讨论重费米子标度及声子贡献。", "future": "同样品测 Sxx、Syx、Hall、ρxx，加入角分辨和应变调控。", "summary_zh": "测量 CsCr₆Sb₆ 单晶的 Seebeck、Nernst、Hall、比热与热导，关联热电增强与能带杂化、Kondo scattering 和 phonon drag。", "summary_en": "Measurements of Seebeck and Nernst signals, Hall response, thermal conductivity, and heat capacity in CsCr₆Sb₆ link enhanced thermoelectric transport with band hybridization, Kondo scattering, and phonon drag.", "method_zh": "Flux-grown single crystals; resistivity, Hall, Seebeck, Nernst, thermal conductivity, specific heat.", "method_en": "Flux-grown single crystals; electrical resistivity, Hall, Seebeck, Nernst, thermal conductivity, and heat-capacity measurements.", "result_zh": "作者识别 ~70 K 的 crossover 和 ~20–25 K 热电极值，并讨论重费米子标度及声子贡献。", "result_en": "The authors identify a crossover near 70 K and thermoelectric extrema around 20–25 K, and discuss heavy-fermion scaling and phonon contributions.", "future_zh": "同样品测 Sxx、Syx、Hall、ρxx，加入角分辨和应变调控。", "future_en": "Measure longitudinal and transverse thermopower, Hall response, and resistivity on the same crystal, with angle-resolved and strain-dependent follow-ups.", "tier": "PRB / Physical Review Materials", "tier_reason_en": "Detailed thermoelectric, Nernst, Hall, and thermal-transport characterization connects band hybridization to a correlated kagome metal; the central advance is a material-specific transport interpretation rather than a new universal effect.", "tier_reason_zh": "系统的 Seebeck、Nernst、Hall 与热输运实验把能带杂化和 Kagome 关联行为联系起来；亮点是材料体系中的输运物理，而非全新的普适效应。"}, {"id": "fetse-jde", "type": "arXiv", "journal": "arXiv:2610.29124", "title": "Magnetization and Josephson current coupling drives the Josephson diode effect in FeTe₀.₅₅Se₀.₄₅ van der Waals junctions", "authors": "Seung-Hyun Shin, Cheong-Eung Ahn, Chang-Won Choi et al.", "corresponding": "Gil Young Cho; Gil-Ho Lee", "url": "https://arxiv.org/abs/2610.29124", "topic": "Superconductivity", "level": "Feature", "summary": "在 FeTeSe 范德华约瑟夫森结中发现零场二极管效应，结合 Fraunhofer、Shapiro steps 与动力学建模研究磁化与超流耦合。", "method": "van der Waals Josephson junction fabrication; switching currents; Fraunhofer pattern; microwave Shapiro steps.", "result": "非互易临界电流与界面磁化和 Josephson 相位耦合相关。", "future": "在可加工材料中比较 Ic+ / Ic−、场历史、Fraunhofer 和微波响应。", "summary_zh": "在 FeTeSe 范德华约瑟夫森结中发现零场二极管效应，结合 Fraunhofer、Shapiro steps 与动力学建模研究磁化与超流耦合。", "summary_en": "In FeTe₀.₅₅Se₀.₄₅ van der Waals Josephson junctions, the authors report a zero-field Josephson diode effect and examine the coupling of interfacial magnetization to the supercurrent.", "method_zh": "van der Waals Josephson junction fabrication; switching currents; Fraunhofer pattern; microwave Shapiro steps.", "method_en": "Fabrication of van der Waals Josephson junctions; switching-current, Fraunhofer-interference, and microwave Shapiro-step measurements.", "result_zh": "非互易临界电流与界面磁化和 Josephson 相位耦合相关。", "result_en": "Nonreciprocal critical current is attributed to the coupling between interfacial magnetization and the Josephson phase.", "future_zh": "在可加工材料中比较 Ic+ / Ic−、场历史、Fraunhofer 和微波响应。", "future_en": "Compare positive and negative critical currents, magnetic-field training, Fraunhofer patterns, and microwave response in device-compatible superconductors.", "tier": "PRL", "tier_reason_en": "Combines zero-field Josephson diode behavior
