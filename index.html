<script id="issues-data" type="application/json">[{"date": "2026-10-24", "title": "Daily Condensed Matter Literature", "papers": [{"id": "arxiv-2610-30588", "arxiv_id": "2610.30588", "type": "arXiv", "journal": "arXiv:2610.30588", "journal_ref": "", "title": "Supercoiling Drives DNA-Protein Co-Condensation", "authors": "Sihan Liu, Hongbo Zhao, Andrej Košmrlj", "corresponding": "", "url": "https://arxiv.org/abs/2610.30588", "topic": "Topology & Transport", "level": "Feature", "summary_en": "This theoretical study shows that DNA supercoiling acts as a topological catalyst for DNA-protein co-condensation by facilitating twist-to-writhe conversion and promoting protein wetting-induced capillary collapse.", "summary": "The co-condensation of DNA and proteins plays an important role in genome compaction, including heterochromatin formation and chromosome segregation. Meanwhile, transcription and replication continuously generate DNA supercoiling, yet how the resulting torsional stress affects co-condensation remains poorly understood. Here, by coupling DNA elasticity to a protein concentration field, we show that", "abstract": "The co-condensation of DNA and proteins plays an important role in genome compaction, including heterochromatin formation and chromosome segregation. Meanwhile, transcription and replication continuously generate DNA supercoiling, yet how the resulting torsional stress affects co-condensation remains poorly understood. Here, by coupling DNA elasticity to a protein concentration field, we show that supercoiling acts as a topological catalyst for co-condensation through a mutually reinforcing interplay with protein wetting. Specifically, protein wetting facilitates twist-to-writhe conversion, generating highly writhed DNA conformations that in turn promote capillary collapse into a protein-rich droplet. In the absence of supercoiling, DNA remains kinetically trapped in metastable extended states within our model, whereas sufficiently strong supercoiling removes the nucleation barrier and enables spontaneous co-condensation. These results establish topology as a distinct control parameter for biomolecular condensation and provide a mechanical framework for how active genomic processes can dynamically regulate large-scale genome organization.", "method": "", "result": "", "future": "", "physics_advance": "Demonstration that DNA supercoiling catalyzes protein-DNA co-condensation through interplay between twist-to-writhe conversion and protein wetting, introducing topology as a mechanical regulator of biomolecular phase separation.", "ai_in_scope": true, "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "By theoretically establishing how DNA supercoiling serves as a topological control parameter that facilitates DNA-protein co-condensation via twist-to-writhe conversion, the work offers a new physical framework for dynamic genome organizati", "feature_candidate": true, "summary_zh": "该理论研究表明DNA超螺旋通过促进扭转向卷曲的转换与蛋白润湿作用，共同驱动DNA-蛋白质的共凝聚。", "method_en": "By coupling the elasticity of DNA with a protein concentration field, the authors model how supercoiling influences co-condensation dynamics and nucleation barriers.", "method_zh": "将DNA弹性与蛋白浓度场耦合，建立模型研究超螺旋对共凝聚动力学及成核势垒的影响。", "result_en": "Results indicate that strong supercoiling removes kinetic traps and nucleation barriers, enabling spontaneous co-condensation, while absence of supercoiling leaves DNA in metastable extended states.", "result_zh": "结果显示，强超螺旋消除动力学阻碍，促进自发共凝聚，无超螺旋则DNA停留于亚稳扩展态。", "future_en": "This work identifies DNA topology as a control parameter for biomolecular condensation with implications for dynamic genome organization during cellular processes.", "future_zh": "研究确定DNA拓扑结构是调控生物分子凝聚的新参数，对细胞内基因组动态组织有重要影响。", "tier": "Uncertain", "tier_reason_en": "The conceptual model links topology and biomolecular phase separation with novel mechanical insights, but lacks direct experimental validation and broader quantitative predictions.", "tier_reason_zh": "该理论模型将拓扑学与生物分子相分离关联，提出新见解，但缺乏直接实验验证和更广泛的定量预测，评级尚不明确。"}, {"id": "arxiv-2610-30330", "arxiv_id": "2610.30330", "type": "arXiv", "journal": "arXiv:2610.30330", "journal_ref": "", "title": "Shear-induced mechanical yielding controls cluster morphology and dynamics in aggregating non-Brownian suspensions", "authors": "Jae Hwan Jeong, Donald L. Koch, Sarah Hormozi", "corresponding": "", "url": "https://arxiv.org/abs/2610.30330", "topic": "Topology & Transport", "level": "Feature", "summary_en": "This study elucidates how shear flow controls cluster formation, morphology, rotational dynamics, and stress generation in aggregating non-Brownian suspensions with dominant interparticle attraction.", "summary": "In sheared aggregating suspensions, flow drives both the formation and breakage of particle clusters, whose dynamic evolution influences transport and rheological properties. Understanding these mechanisms remains challenging due to the complex interplay between interparticle forces, hydrodynamic interactions, and shear flow. Using parallelized Accelerated Stokesian Dynamics (PASD) simulations, we", "abstract": "In sheared aggregating suspensions, flow drives both the formation and breakage of particle clusters, whose dynamic evolution influences transport and rheological properties. Understanding these mechanisms remains challenging due to the complex interplay between interparticle forces, hydrodynamic interactions, and shear flow. Using parallelized Accelerated Stokesian Dynamics (PASD) simulations, we investigate cluster microstructure and rotational dynamics, and how their coupling produces suspension stress in sheared, attractive non-Brownian suspensions. When interparticle attraction dominates over separating shear forces, clusters grow until mechanical loading balances maximum interparticle bond strength. We examine how the cluster stresslet depends on cluster size, with both quantities normalized by their mechanical yielding scales. Scaled cluster stresslets collapse onto a master curve exhibiting three distinct regimes: cubic, quadratic, and linear with respect to the scaled radius of gyration $R_g$. In the cubic regime, small, compact clusters behave as rigid bodies, whose hydrodynamic stresslet scales with cluster volume $R_g^3$. As clusters grow into the quadratic regime, low-aspect-ratio clusters preferentially yield under flow, driving a proportional increase in average aspect ratio with size. High-aspect-ratio clusters follow Jeffery rotational dynamics within the flow-gradient plane, spending longer durations aligned with the flow and thereby reducing their time-averaged hydrodynamic stresslet to scale as $R_g^2$. In the linear regime, clusters approach the maximum size sustainable by the interparticle bonds. The internal tension is bounded by the maximum bond strength, limiting the stresslet to an $R_g$ dependence. These findings establish a mechanistic framework connecting microscale cluster morphology and dynamics to macroscale rheology.", "method": "", "result": "", "future": "", "physics_advance": "Identification of distinct scaling regimes for cluster stresslets in sheared attractive non-Brownian suspensions and mechanistic connection between cluster morphology, rotational dynamics, and rheological response.", "ai_in_scope": true, "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "The paper reveals new experimentally testable mechanistic insight on how shear-induced forces control the morphology and rotational dynamics of particle clusters in attractive non-Brownian suspensions, directly linking microscale structures", "feature_candidate": true, "summary_zh": "研究阐明剪切流如何控制非布朗聚集悬浮液中簇的形成、形态、旋转动力学及应力产生，尤其在粒子间吸引力占优时。", "method_en": "Parallelized Accelerated Stokesian Dynamics simulations probe the size, shape, rotational behavior, and hydrodynamic stresslets of clusters under shear, normalized by mechanical yielding scales set by maximal bond strength.", "method_zh": "采用并行加速Stokesian动力学模拟，分析剪切条件下簇的尺寸、形状、旋转行为及流体动力学应力矩，均通过最大键强度定义的机械屈服尺度归一化。", "result_en": "The cluster stresslet versus radius of gyration collapses onto a universal curve with three regimes: cubic scaling for small rigid clusters, quadratic scaling where clusters yield and elongate under flow following Jeffery orbits, and linear scaling when clusters reach bond-limited maximum size; these regimes connect microscale structure and dynamics to macroscale rheology.", "result_zh": "簇应力矩相较回转半径展现三阶段普适曲线：小刚性簇呈立方关系，流动中屈服并拉长的簇遵循Jeffery轨道呈二次关系，接近最大键强度尺寸的簇呈线性关系；此分段关系将微观结构动力学与宏观流变相联系。", "future_en": "Future research could extend to polydisperse suspensions and experimental validation to further connect microscopic cluster mechanics with bulk rheological response.", "future_zh": "未来研究可拓展至多分散悬浮液及实验验证，进一步关联微观簇力学与宏观流变响应。"}, {"id": "arxiv-2610-30555", "arxiv_id": "2610.30555", "type": "arXiv", "journal": "arXiv:2610.30555", "journal_ref": "", "title": "Probing quasiperiodic spectral accessibility with a finite-rate quantum Otto cycle", "authors": "Shujie Cheng, Lucas C. Céleri, Norton G. de Almeida, Gao Xianlong, G. D. de Moraes Neto", "corresponding": "", "url": "https://arxiv.org/abs/2610.30555", "topic": "Thermal & Thermoelectric", "level": "Feature", "summary_en": "The authors demonstrate that a finite-rate quantum Otto cycle can probe quasiperiodic spectral accessibility by revealing which spectral regions become thermodynamically relevant during driving. They find that work fluctuations and population dynamics reflect a complex hierarchy of coupled spectral transitions rather than a single gap bottleneck.", "summary": "Quasiperiodic systems combine sharply different spectral and localisation regimes with a dense hierarchy of dynamical time scales. We show that a finite-rate quantum Otto cycle can use this structure as a thermodynamic probe, revealing which parts of the spectrum become dynamically accessible and thermodynamically relevant during a driven transformation. For a generalised Aubry-André-Harper chain,", "abstract": "Quasiperiodic systems combine sharply different spectral and localisation regimes with a dense hierarchy of dynamical time scales. We show that a finite-rate quantum Otto cycle can use this structure as a thermodynamic probe, revealing which parts of the spectrum become dynamically accessible and thermodynamically relevant during a driven transformation. For a generalised Aubry-André-Harper chain, the resulting response is not determined by the static quasiperiodic regime alone: extended, near-critical, and crossing protocols do not exhibit universal ordering of work fluctuations. Instead, the statistics reflect transition pathways that are simultaneously dynamically coupled, thermally occupied, and energetically significant. The same spectral accessibility separates thermodynamic recovery from microscopic adiabatic recovery. Positive mean work can reappear while the population transfer dynamics remain strongly nonadiabatic because finite-rate population transfer is redistributed toward energetically less costly channels rather than suppressed. The full work distribution reveals a further separation, with a finite rate window in which positive-work cycles form a majority although the mean work remains negative. This behaviour persists in finite-size analysis. A thermally weighted spectral susceptibility connects these effects to a distributed hierarchy of dynamically active spectral regions rather than to a single minimum-gap bottleneck. Finite thermal contacts preserve this picture while introducing a second time scale and intercycle memory. Quantum Otto cycles can therefore provide a fluctuation-resolved thermodynamic probe of quasiperiodic spectral accessibility, complementary to direct spectroscopic and eigenstate-resolved diagnostics.", "method": "", "result": "", "future": "", "physics_advance": "Use of finite-rate quantum Otto cycles to reveal spectral accessibility, nonadiabatic transitions, and thermodynamic response in quasiperiodic systems beyond static regime classification", "ai_in_scope": true, "relevance_score": 72, "relevance_method": "semantic", "relevance_reason": "This work demonstrates how finite-rate quantum Otto cycles probe quasiperiodic spectral accessibility and dynamical transitions in driven many-body systems, offering a novel thermodynamic and fluctuation-resolved approach to studying spectr", "feature_candidate": true, "summary_zh": "本文展示了有限速率的量子奥托循环可用作准周期谱可达性的热力学探针，揭示驱动过程中热力学活跃的谱区域，发现功波动和态群转移表现出比单一能隙瓶颈更复杂的耦合谱跃迁层次。", "method_en": "Using a generalized Aubry-André-Harper chain as the model system, the authors analyze work statistics and dynamic population transfers under various protocols, including extended, near-critical, and crossing regimes, supplemented by a thermally weighted spectral susceptibility and finite-size scaling.", "method_zh": "以广义Aubry-André-Harper链为模型，分析不同驱动协议下的功统计与态群转移，结合热加权谱灵敏度和有限尺寸标度研究。", "result_en": "They report no universal ordering of work fluctuations across regimes and identify spectral accessibility that distinguishes thermodynamic from microscopic adiabatic recoveries; notably, positive mean work reappears even with nonadiabatic population transfers redistributed toward lower-energy channels. The work distribution additionally reveals a finite rate window with majority positive-work cycles but negative mean work.", "result_zh": "研究表明不同谱区间内功波动无通用序列，谱可达性区分了热力学与微观绝热恢复，且非绝热条件下正均功可能重现，因群转移向耗能较低通道重分布。功分布还揭示有限速率窗口内大部分循环正功而均功为负。", "future_en": "Future work might explore experimental implementations in quasiperiodic quantum simulators, extend theoretical frameworks to open systems with dissipation, and investigate implications for quantum thermodynamic devices leveraging spectral complexity.", "future_zh": "未来可探讨在准周期量子模拟器上的实验实现，将理论拓展至含耗散开放体系，并研究利用谱复杂性的量子热力学器件。"}, {"id": "arxiv-2602-22651", "arxiv_id": "2602.22651", "type": "arXiv", "journal": "arXiv:2602.22651", "journal_ref": "Phys. Rev. Lett. 137, 160406 (2026)", "title": "Thermodynamic Uncertainty Relation with Quantum Feedback", "authors": "Ryotaro Honma, Tan Van Vu", "corresponding": "", "url": "https://arxiv.org/abs/2602.22651", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "This work derives a finite-time thermodynamic uncertainty relation (TUR) for open quantum systems under continuous monitoring and Markovian feedback, linking current fluctuations, entropy production, and mutual information.", "summary": "Fluctuations are intrinsic to microscopic systems and impose fundamental limits on nonequilibrium precision, as captured by the thermodynamic uncertainty relation (TUR), which links current fluctuations to entropy production. While feedback control is expected to further suppress fluctuations, its role within the TUR framework has remained unclear, particularly in quantum systems where control is ", "abstract": "Fluctuations are intrinsic to microscopic systems and impose fundamental limits on nonequilibrium precision, as captured by the thermodynamic uncertainty relation (TUR), which links current fluctuations to entropy production. While feedback control is expected to further suppress fluctuations, its role within the TUR framework has remained unclear, particularly in quantum systems where control is inherently information-driven. In this Letter, we consider open quantum systems weakly coupled to a thermal environment, in which quantum jumps are continuously monitored, and Markovian feedback is applied. Using quantum mutual information to quantify the information contribution induced by feedback, we derive a finite-time TUR for arbitrary time-integrated currents in terms of entropy production and mutual information. Our results uncover how feedback control suppresses fluctuations together with thermodynamic cost and establish a fundamental precision bound imposed by information-based control. As an application, we analyze a quantum clock model and demonstrate that the clock precision can be enhanced by feedback control in the presence of a single thermal reservoir.", "method": "", "result": "", "future": "", "physics_advance": "Derivation of a quantum thermodynamic uncertainty relation incorporating feedback via quantum mutual information, establishing fundamental quantum limits on precision-fluctuation tradeoffs under information-based control.", "ai_in_scope": true, "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "This work extends the thermodynamic uncertainty relations to quantum systems with continuous quantum jump monitoring and feedback, explicitly connecting entropy production and quantum information measures, providing a new fundamental bound ", "feature_candidate": false, "summary_zh": "本文推导了适用于连续监测和马尔可夫反馈下开放量子系统的有限时间热力学不确定关系(TUR)，关联了电流涨落、熵产生和相互信息。", "method_en": "Using quantum mutual information to quantify the feedback-associated information, the authors establish a finite-time TUR for arbitrary integrated currents in weakly coupled thermal environments.", "method_zh": "通过量子互信息定量反馈引入的信息，作者建立了适用于弱耦合热环境中任意积分电流的有限时间TUR。", "result_en": "Feedback control suppresses current fluctuations with an associated thermodynamic cost, setting a fundamental precision bound; demonstrated in a quantum clock model where feedback enhances clock precision with a single thermal reservoir.", "result_zh": "反馈控制压制电流涨落，同时伴随热力学代价，设定了基本精度界限；在量子时钟模型中展示了反馈在单热库下提升时钟精度的应用。", "future_en": "The results clarify feedback's role in quantum precision limits and open avenues for enhanced quantum sensing and control strategies grounded in information theory.", "future_zh": "结果阐明了反馈在量子精度极限中的作用，为基于信息理论的增强量子传感和控制策略开辟路径。"}, {"id": "arxiv-2610-30210", "arxiv_id": "2610.30210", "type": "arXiv", "journal": "arXiv:2610.30210", "journal_ref": "", "title": "Electronic Screening as a Design Lever in La-Doped BaTiO$_3$: Coupled Polarization, Dielectric Response, and Optical Anisotropy", "authors": "Sikandar Azam, Muhammad Fareed, Qaiser Rafiq, Jan Minar, Abed Alataway", "corresponding": "", "url": "https://arxiv.org/abs/2610.30210", "topic": "Materials & Growth", "level": "Feature", "summary_en": "This theoretical study examines La-doping effects in BaTiO3, showing that donor substitution alters lattice parameters, reduces polarization, and modifies optical and dielectric properties via enhanced electronic screening.", "summary": "Donor substitution can tune the coupled ferroelectric, dielectric, electronic, and optical properties of perovskite oxides by modifying lattice distortions and electronic screening. We investigate these effects in La-doped BaTiO3 using density functional theory, density-functional perturbation theory, and the Berry-phase formalism for polarization. For a model with 12.5% La substitution at the Ba ", "abstract": "Donor substitution can tune the coupled ferroelectric, dielectric, electronic, and optical properties of perovskite oxides by modifying lattice distortions and electronic screening. We investigate these effects in La-doped BaTiO3 using density functional theory, density-functional perturbation theory, and the Berry-phase formalism for polarization. For a model with 12.5% La substitution at the Ba site, La incorporation induces anisotropic lattice contraction, reduces tetragonality and Ti off-centering, and weakens the energetic stabilization of the tetragonal ferroelectric phase. The accompanying reduction in polarization is associated with enhanced electronic screening and reduced anomalous Born effective charges. Phonon calculations indicate that the relaxed doped structure is dynamically stable, while hardening of a low-frequency polar mode is consistent with weakened ferroelectricity. The high-frequency dielectric response increases moderately, whereas the static dielectric response decreases as the lattice contribution is suppressed. Electronic-structure calculations show a Fermi-level shift toward the conduction band without mid-gap defect states. The optical spectra exhibit an absorption-edge shift consistent with a Burstein-Moss-type mechanism, enhanced near-edge transparency, and reduced birefringence. Together, these results suggest a microscopic connection between donor-induced screening, polar-mode hardening, reduced dynamical charges, polarization suppression, and decreased optical anisotropy. The conclusions apply to the investigated 12.5% composition; calculations at additional concentrations are needed to establish quantitative doping trends.", "method": "", "result": "", "future": "", "physics_advance": "Demonstration of donor-induced screening effects coupling polarization suppression, phonon mode hardening, and optical anisotropy changes in La-doped BaTiO3 ferroelectric perovskite.", "ai_in_scope": true, "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "This study reveals how La doping in BaTiO3 tunes interplay between electronic screening and ferroelectric polarization, linking donor substitution to polar mode hardening, dynamical charge reduction, and altered optical anisotropy, offering", "feature_candidate": true, "summary_zh": "该理论研究考察了La掺杂BaTiO3的影响，表明施主掺杂通过增强电子屏蔽改变晶格参数、降低极化并调节光学与介电特性。", "method_en": "The authors use density functional theory and perturbation theory to compute structural relaxations, polarizations, phonons, dielectric responses, and optical spectra for 12.5% La substitution models.", "method_zh": "作者利用密度泛函理论和微扰理论计算12.5% La掺杂模型的结构松弛、极化、声子、介电响应及光学谱。", "result_en": "La doping causes anisotropic lattice contraction, reduces tetragonality and Ti off-centering, hardens low-frequency polar modes, decreases static dielectric response, and shifts absorption edges consistent with a Burstein-Moss effect.", "result_zh": "La掺杂导致各向异性晶格收缩，降低四方畸变和Ti位移，使低频极化模硬化，抑制静态介电响应，吸收边缘向高能位移动符合理斯坦-莫斯效应。", "future_en": "Additional calculations at varied doping concentrations are required to quantify trends and further elucidate donor-induced screening effects in ferroelectric oxides.", "future_zh": "需在更多掺杂浓度下开展计算，以量化趋势并深入揭示施主引发的铁电氧化物屏蔽效应。"}, {"id": "arxiv-2610-30271", "arxiv_id": "2610.30271", "type": "arXiv", "journal": "arXiv:2610.30271", "journal_ref": "", "title": "Charge-monitored Luttinger liquid", "authors": "Victor Gurarie, Leo Radzihovsky", "corresponding": "", "url": "https://arxiv.org/abs/2610.30271", "topic": "Superconductivity", "level": "Brief", "summary_en": "This study analyzes Luttinger liquids under particle density measurements and shows a universal phase boundary between area-law and volume-law entangled phases controlled by the measurement rate and Luttinger parameter.", "summary": "We discuss phases of interacting fermionic Luttinger liquids without particle number conservation, such as those in proximity to a superconductor, subjected to weak continuous measurements of their particle density, in the regime where the bosonization approach is applicable. We show that the phases of these systems are controlled by the competition between measurements, which favor the area-law p", "abstract": "We discuss phases of interacting fermionic Luttinger liquids without particle number conservation, such as those in proximity to a superconductor, subjected to weak continuous measurements of their particle density, in the regime where the bosonization approach is applicable. We show that the phases of these systems are controlled by the competition between measurements, which favor the area-law phase and particle tunneling in and out of the Luttinger liquid, which favors the volume-law phase. The volume-law phase in this system is always charge fuzzy. We show that within this framework, the phase boundary between the two phases is given by a universal dependence of the Luttinger parameter on the measurement rate. This behavior can be contrasted with the non-universal phase boundaries in more generic highly excited one dimensional systems whose behavior is no longer captured by the Luttinger liquid framework.", "method": "", "result": "", "future": "", "physics_advance": "Demonstration that continuous weak measurement combined with particle tunneling controls universal phase boundaries between area-law and volume-law entanglement phases in interacting Luttinger liquids, highlighting measurement-tunneling competition in 1D corre", "ai_in_scope": true, "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "The paper identifies universal phase structure and transitions in Luttinger liquids under particle density monitoring with tunneling, establishing a novel interplay of measurement-induced effects and interactions in 1D fermionic systems, a ", "feature_candidate": false, "summary_zh": "本文分析了含粒子密度测量的Luttinger液体，展示了测量率和Luttinger参数控制的面积律与体积律纠缠相的通用边界。", "method_en": "Employing bosonization methods, the authors describe competition between particle tunneling favoring volume-law entanglement and measurements favoring area-law entanglement.", "method_zh": "利用玻色化方法，作者描绘了粒子隧穿（推动体积律纠缠）与测量（推动面积律纠缠）之间的竞争。", "result_en": "They find that the volume-law phase is always charge fuzzy and the phase boundary exhibits universal dependence on microscopic parameters unlike generic excited 1D systems.", "result_zh": "发现体积律相始终出现电荷模糊，且相界呈现微观参数的通用依赖，区别于一般激发一维系统。", "future_en": "Future work might explore non-Luttinger liquid systems and stronger measurement regimes to understand universality beyond this framework.", "future_zh": "未来研究可拓展至非Luttinger液体及更强测量区，探讨框架外的普适性。"}, {"id": "arxiv-2610-30251", "arxiv_id": "2610.30251", "type": "arXiv", "journal": "arXiv:2610.30251", "journal_ref": "", "title": "Nature of the bosonic edge phase in a double quantum spin Hall insulator", "authors": "Andreas Feuerpfeil, Ronny Thomale, Trithep Devakul, Nicolas Regnault, Julian May-Mann", "corresponding": "", "url": "https://arxiv.org/abs/2610.30251", "topic": "Magnetism", "level": "Brief", "summary_en": "This paper numerically demonstrates an interaction-driven transition from fermionic to bosonic edge phases in double quantum spin Hall insulators, confirming the existence of gapped single-fermion excitations and gapless fermion pairs.", "summary": "Field-theoretic analysis has predicted that the edge of a double quantum spin Hall insulator (DQSHI) can undergo an interaction-driven transition from a phase with fermionic edge modes into one with only bosonic modes. All single-fermion edge excitations are gapped in this bosonic edge phase, but fermion pairs remain gapless, leading to distinct experimental signatures. We numerically simulate the", "abstract": "Field-theoretic analysis has predicted that the edge of a double quantum spin Hall insulator (DQSHI) can undergo an interaction-driven transition from a phase with fermionic edge modes into one with only bosonic modes. All single-fermion edge excitations are gapped in this bosonic edge phase, but fermion pairs remain gapless, leading to distinct experimental signatures. We numerically simulate the interacting DQSHI edge and verify the existence of the bosonic edge phase. This calculation requires an explicit bulk embedding of the DQSHI edge, due to its mixed anomaly between charge and $S^z$ conservation. We hence employ segment DMRG on an infinite two-dimensional cylinder, where the DQSHI bulk is modeled in terms of two copies of the spin-up lowest Landau level, combined with their time-reversed counterparts. We find that interactions can open a single-fermion gap at the DQSHI edge while fermion pairs remain gapless, matching the predictions for the bosonic edge phase. We find the scaling of the single-fermion gap with interaction strength to be consistent with field-theoretic calculations, and discuss the relevance of the bosonic edge phase to twisted homobilayers of WSe$_2$ and MoTe$_2$. We elaborate on the methodological extension of the segment geometry used here to other topological phases with edge anomalies.", "method": "", "result": "", "future": "", "physics_advance": "Numerical demonstration of an interaction-driven bosonic edge phase with gapped fermionic excitations but gapless bosonic modes in a double quantum spin Hall insulator, confirming predicted boundary anomalies and phase transitions.", "ai_in_scope": true, "relevance_score": 85, "relevance_method": "semantic", "relevance_reason": "Using high-precision numerical simulation with an explicit bulk embedding, the paper provides the first concrete evidence and characterization of a bosonic edge phase with gapped single-fermion excitations and gapless fermion pairs in a dou", "feature_candidate": false, "summary_zh": "本文数值证明了双量子自旋霍尔绝缘体中由相互作用驱动的从费米子边缘态到玻色子边缘态的跃迁，确认了单费米子激发有隙、费米子对无隙的存在。", "method_en": "Using segment DMRG on an infinite cylinder with a bulk embedding modeled by spin-polarized Landau levels and their time-reversed counterparts, the edge is explicitly simulated respecting the mixed anomaly.", "method_zh": "通过在无限圆柱上的段DMRG，结合由自旋极化朗道能级及其时间反演构成的体嵌入，明确模拟了包含混合异常的边缘。", "result_en": "Findings include single-fermion gap opening consistent with field theory, gapless pair modes, and implications for experimental systems like twisted WSe2 and MoTe2 homobilayers.", "result_zh": "结果显示单费米子隙符合场论预言，费米子对无隙，且探讨了其在扭曲WSe2和MoTe2同质层中的相关性。", "future_en": "Further research should extend the segment geometry approach to other topological phases with edge anomalies and explore experimental detection techniques.", "future_zh": "未来工作应将段几何方法推广至含边缘异常的其他拓扑相，探索其实验检测手段。", "tier": "Nature Physics/Nature Materials", "tier_reason_en": "The paper presents a significant numerical confirmation of a theoretically predicted bosonic edge phase in topological materials with mixed anomalies, employing advanced tensor network methods with concrete experimental relevance.", "tier_reason_zh": "本文通过先进张量网络方法数值确认了含混合异常拓扑材料中预言的玻色子边缘相，具有重要理论价值和实际实验相关性。"}, {"id": "arxiv-2610-30375", "arxiv_id": "2610.30375", "type": "arXiv", "journal": "arXiv:2610.30375", "journal_ref": "", "title": "Delta-Doped GeV$^-$ in diamond with isotope resolvable optical spectra", "authors": "Ian N. Hammock, Kinfung Ngan, Antoni W. Wellisz, Keira Linder, Midrel Wilfried Ngandeu Ngambou, Jiefei Zhang, Xinghan Guo, Benjamin Pingault, Shuo Sun, David D. Awschalom, F. Joseph Heremans, Alexander A. High, Nazar Delegan", "corresponding": "", "url": "https://arxiv.org/abs/2610.30375", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "The study reports deterministic localization of germanium-vacancy (GeV⁻) centers within <10 nm delta-doped diamond layers, achieving high Ge concentration with minimal strain and spectral inhomogeneity.", "summary": "Group IV color centers in diamond -- silicon, germanium, tin, and lead-vacancy centers -- are a promising platform for quantum networking. Typical Group-IV creation utilizes ion implantation during diamond growth that leaves the color centers with a broad depth distribution and damage-induced strain inhomogeneity. Deterministic placement and damage reduction in Group IV generation are essential fo", "abstract": "Group IV color centers in diamond -- silicon, germanium, tin, and lead-vacancy centers -- are a promising platform for quantum networking. Typical Group-IV creation utilizes ion implantation during diamond growth that leaves the color centers with a broad depth distribution and damage-induced strain inhomogeneity. Deterministic placement and damage reduction in Group IV generation are essential for improving this platform. In this letter, we report on the localization of germanium-vacancy (GeV$^-$) to a $<$ 10 nm layer via the timed injection of GeH$_4$ during microwave plasma chemical vapor deposition. In this layer we have realized 17 ppm of Ge and a strain-free environment for the GeV$^-$. Subsequent electron irradiation and annealing have generated a sheet density of 0.12 GeV$^-$/$μ$m$^2$. The minimal damage from color center generation mitigates spectral inhomogeneity and allows spectral resolution of isotopic clusters, with the best cluster having an inhomogeneous distribution of 2.14 GHz and an average linewidth of $47 \\pm 11$ MHz. Our study gives insight into formation dynamics of GeV$^-$ in delta-doped systems and estimates our vacancy to GeV$^-$ yield to be $\\geq$ 90%, establishing an athermal nearest-neighbor formation model. We further characterized the spin $T_2^*$ and set a lower bound of 730 ns, limited by a paramagnetic defect.", "method": "", "result": "", "future": "", "physics_advance": "Realization of strain-free delta-doped GeV- centers in diamond enabling isotope-resolved optical lines and high spin coherence, advancing understanding of defect formation and spectral homogeneity in solid-state quantum materials", "ai_in_scope": true, "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "The delta-doping growth technique localizes GeV- centers with reduced strain and spectral inhomogeneity, experimentally enabling isotope-resolved optical spectra and insights into defect formation and spin coherence, advancing diamond color", "feature_candidate": false, "summary_zh": "本文报道了锗空位(GeV⁻)色心在<10 nm菱形金刚石δ掺杂层中的精确定域，获得高锗浓度和低应变光谱非均匀性。", "method_en": "Timed GeH₄ gas injection during microwave plasma chemical vapor deposition enabled doping control, followed by electron irradiation and annealing to create GeV⁻ centers; optical spectroscopy resolved isotope clusters.", "method_zh": "通过微波等离子化学气相沉积中定时注入GeH₄气体实现掺杂控制，随后电子辐照与退火生成GeV⁻，光谱学分辨同位素团簇。", "result_en": "They achieved 17 ppm Ge with a strain-free environment, GeV⁻ sheet density of 0.12/μm², isotope-cluster linewidth ~47 MHz, and spin coherence lower bound T₂* of 730 ns, indicating efficient vacancy-to-GeV⁻ conversion (≥90%) via an athermal model.", "result_zh": "实现17 ppm锗浓度、无应变环境、GeV⁻片密度0.12/μm²，同位素团簇线宽约47 MHz，自旋相干时间下界730 ns，表明≥90%空位-至-GeV⁻的高效转化。", "future_en": "Future work can explore integrating such delta-doped GeV⁻ layers into quantum devices and improving spin coherence by reducing paramagnetic defects.", "future_zh": "未来可探究将此类δ掺杂GeV⁻层集成到量子器件中，并通过减少顺磁缺陷提升自旋相干。"}, {"id": "arxiv-2610-31127", "arxiv_id": "2610.31127", "type": "arXiv", "journal": "arXiv:2610.31127", "journal_ref": "", "title": "The often overlooked role of sound in liquid thermal transport", "authors": "Kamran Behnia", "corresponding": "", "url": "https://arxiv.org/abs/2610.31127", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "This paper revisits the Bridgman formula linking sound velocity and thermal conductivity in liquids, a concept overlooked in mainstream condensed matter physics. It reviews its hydrodynamic origins and implications for the quantum-classical crossover in heat transport.", "summary": "Formulated a hundred years ago, the Bridgman formula for thermal conductivity of liquids postulates a proportionality between sound velocity and thermal conductivity. This designates phonons as heat carriers in a liquid. Its empirical success has been under-appreciated and its conceptual implications overlooked. It is not mentioned in well-known condensed-matter textbook. Here, we review its origi", "abstract": "Formulated a hundred years ago, the Bridgman formula for thermal conductivity of liquids postulates a proportionality between sound velocity and thermal conductivity. This designates phonons as heat carriers in a liquid. Its empirical success has been under-appreciated and its conceptual implications overlooked. It is not mentioned in well-known condensed-matter textbook. Here, we review its origin, its links to hydrodynamic Euler equations and to the fundamental paradox surrounding the parabolic heat equation and its fate across the quantum-classical crossover.", "method": "", "result": "", "future": "", "physics_advance": "Clarifies the fundamental link between phonon-like sound modes and thermal transport in liquids, revisiting the origin and limitations of liquid thermal conductivity from hydrodynamic and quantum perspectives.", "ai_in_scope": true, "relevance_score": 55, "relevance_method": "semantic", "relevance_reason": "Reconsiders the century-old Bridgman formula linking sound velocity to liquid thermal conductivity and phonon heat carriers in liquids, clarifying conceptual implications for hydrodynamics and quantum-classical crossover in thermal transpor", "feature_candidate": false, "summary_zh": "本文重新审视了布里奇曼公式，该公式将液体中的声速与热导率联系起来，这一概念在主流凝聚态物理中被忽视。论文回顾了该公式的流体力学起源及其在量子-经典交叉中的热传导含义。", "method_en": "The authors review the original Bridgman formula by linking it to hydrodynamic Euler equations and analyze theoretical implications related to the parabolic heat equation in different regimes.", "method_zh": "作者通过将布里奇曼公式与流体力学欧拉方程联系，分析了与抛物线热方程在不同区域中的理论意义。", "result_en": "The Bridgman formula empirically supports phonons as heat carriers in liquids, providing conceptual insights often missing from textbooks.", "result_zh": "布里奇曼公式的经验验证支持声子作为液体中热载体，提供了教科书中常缺失的概念性见解。", "future_en": "Future work may focus on deeper theoretical understanding and experimental validation across the quantum-to-classical heat transport crossover.", "future_zh": "未来工作可着重于在量子-经典热传导交叉区间的更深理论理解及实验验证。"}, {"id": "arxiv-2610-30749", "arxiv_id": "2610.30749", "type": "arXiv", "journal": "arXiv:2610.30749", "journal_ref": "", "title": "Strain Waves Generate Compression and Trigger Buckling in Active Polymers", "authors": "Wen-de Tian, Kang Chen, Tianhui Zhang", "corresponding": "", "url": "https://arxiv.org/abs/2610.30749", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "The authors show that tension-dependent chemical transitions coupled with bond elasticity induce finite-wavelength traveling strain waves in semiflexible polymers, which reduce active contraction but generate compression driving buckling above a threshold. Released mean load allows longitudinal waves to persist while transverse perturbations decay.", "summary": "Chemical reactions can sustain polymer motion without necessarily generating the compression required for buckling. Theory and simulations show that tension-dependent chemical transitions coupled to bond elasticity generate finite-wavelength traveling strain waves in a semiflexible polymer. In the straight chain at fixed axial span, the waves reduce mean active contraction while leaving mean elast", "abstract": "Chemical reactions can sustain polymer motion without necessarily generating the compression required for buckling. Theory and simulations show that tension-dependent chemical transitions coupled to bond elasticity generate finite-wavelength traveling strain waves in a semiflexible polymer. In the straight chain at fixed axial span, the waves reduce mean active contraction while leaving mean elastic tension unchanged, generating compression that drives bending above a threshold. Releasing the mean load allows longitudinal waves to persist while transverse perturbations decay.", "method": "", "result": "", "future": "", "physics_advance": "Discovery that chemically driven tension-dependent transitions in active polymers generate traveling strain waves producing compression that leads to buckling instabilities, revealing a novel coupling between chemical activity and mechanical deformation.", "ai_in_scope": true, "relevance_score": 60, "relevance_method": "semantic", "relevance_reason": "The paper elucidates a new active matter phenomenon where tension-dependent chemical transitions induce traveling strain waves that generate compressive stresses and trigger buckling instabilities in semiflexible polymers, providing a micro", "feature_candidate": false, "summary_zh": "作者发现张力依赖的化学转变与键弹性耦合产生有限波长的旅行应变波，这些波降低活跃收缩但引发压缩，当超过阈值时导致聚合物屈曲。释放平均载荷后，纵向波持续存在，横向扰动则衰减。", "method_en": "The approach employs theoretical modeling and simulations of semiflexible polymers with tension-dependent chemical transitions coupled to bond elasticity to analyze wave generation, mean contraction, and compression-induced buckling under fixed axial span and varying load conditions.", "method_zh": "方法通过理论建模和模拟，将张力依赖的化学转变与键弹性耦合，分析在固定轴向跨度及不同载荷条件下应变波的产生、平均收缩和由压缩引起的屈曲。", "result_en": "Findings indicate that generated strain waves decrease mean active contraction but not mean elastic tension, resulting in compression sufficient to trigger bending beyond a threshold. With no mean load, longitudinal waves remain while transverse perturbations decay, explaining how chemical reactions sustain polymer motion without compression.", "result_zh": "结果表明应变波降低了平均活跃收缩但平均弹性张力保持不变，产生的压缩超过阈值时导致弯曲。无平均载荷情况下，纵向波持续存在，横向扰动减弱，说明化学反应可维持聚合物运动而不必产生压缩。", "future_en": "Future studies could explore experimental verification of these predicted strain waves and buckling behavior in active polymers, and investigate implications for biological motor-driven filaments.", "future_zh": "未来研究可验证这些应变波及屈曲行为在活性聚合物中的实验观测，并探讨其对生物电机驱动丝状结构的意义。"}, {"id": "arxiv-2610-30419", "arxiv_id": "2610.30419", "type": "arXiv", "journal": "arXiv:2610.30419", "journal_ref": "", "title": "Spin polarization in a chiral ladder: elastic and inelastic environments", "authors": "D. T. Verrilli H., Jorge Cardenas-Gamboa, Mayra Peralta, Claudia Felser, José H. Garcia, Solmar Varela, Nelson Bolívar", "corresponding": "", "url": "https://arxiv.org/abs/2610.30419", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "This paper investigates spin polarization transmitted through a two-leg chiral ladder model with time-reversal-invariant spin-orbit coupling, analyzing how transport window and environmental probe types affect integrated spin currents.", "summary": "We study how the transport window and environmental reinjection determine the spin polarization transmitted through a minimal two-leg chiral ladder. The model contains time-reversal-invariant helical spin--orbit coupling, spin-independent interchain hopping, and nonmagnetic contacts with two orbital modes per lead. Sublattice symmetry makes the coherent spin-transmission kernel exactly odd in ener", "abstract": "We study how the transport window and environmental reinjection determine the spin polarization transmitted through a minimal two-leg chiral ladder. The model contains time-reversal-invariant helical spin--orbit coupling, spin-independent interchain hopping, and nonmagnetic contacts with two orbital modes per lead. Sublattice symmetry makes the coherent spin-transmission kernel exactly odd in energy. A window centered on the symmetry point therefore gives zero integrated spin current, whereas a displaced window selects an uncanceled spectral interval. The resulting polarization reverses between enantiomers and vanishes in the decoupled-chain, zero-spin--orbit, and equivalent-strand limits of this model. We compare uniform absorption, energy-resolved elastic probes, and thermalized voltage probes at the same finite bias, including reinjection whenever probes are present. Charge conservation alone does not prohibit enhancement of the integrated spin signal: the elastic-probe response can increase at finite bias even where its linear-response counterpart decreases. Thermalized probes can also lift the centered-window zero that elastic probes preserve. Absorption and reinjection also change the transmitted charge, so enhancement of spin current and enhancement of normalized polarization must be distinguished. Static onsite disorder produces sample-dependent fluctuations; its signed ensemble mean is reported with uncertainty and is not forced to vanish in a displaced window. These results identify the energy interval and reservoir prescription that must be controlled when interpreting dephasing trends in minimal models relevant to chirality-induced spin selectivity.", "method": "", "result": "", "future": "", "physics_advance": "Identification of energy-window and reservoir-dependent mechanisms controlling spin polarization in chiral ladder models with spin-orbit coupling under various dephasing environments.", "ai_in_scope": true, "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "Provides a detailed theoretical study of how chiral ladder systems with spin-orbit coupling and different environmental couplings affect spin polarization transport, clarifying fundamental mechanisms linking symmetry, decoherence, and energ", "feature_candidate": false, "summary_zh": "本文研究在含时间反演对称螺旋自旋轨道耦合的双腿手性梯子模型中，输运窗口和环境探针类型如何影响传输的自旋极化和积分自旋电流。", "method_en": "Theoretical modeling of spin transport is performed in a minimal two-chain system including uniform absorption, elastic probes, and thermalized voltage probes at finite bias to assess their roles on spin and charge conservation and polarization.", "method_zh": "通过理论建模，在最简双链体系中引入均匀吸收、弹性探针和热化电压探针（有限偏压）以评估它们对自旋和电荷守恒及极化的影响。", "result_en": "Key results show integrated spin current vanishes for windows centered on sublattice-symmetry points but can be nonzero when displaced; elastic probes may enhance spin signals at finite bias, and absorption/reinjection mechanisms alter charge transmission, highlighting the complexity of interpreting dephasing effects in chiral spin transport.", "result_zh": "结果表明，在亚晶格对称点居中的能量窗口积分自旋电流为零，但偏移窗口可产生非零信号；弹性探针在有限偏压下可能增强自旋信号，吸收与再注入机制改变电荷传输，凸显解释手性自旋输运中去相干效应的复杂性。", "future_en": "Further studies should control the energy interval and environment types to better understand dephasing trends in minimal chiral spin models and relate to experimental spin selectivity phenomena.", "future_zh": "未来研究应控制能量区间和环境类型，以更好理解最简手性自旋模型中的去相干趋势，并联系实验中的自旋选择性现象。"}, {"id": "arxiv-2610-31084", "arxiv_id": "2610.31084", "type": "arXiv", "journal": "arXiv:2610.31084", "journal_ref": "", "title": "Nitrogen vacancy cluster-mediated ferroelectric domain growth in wurtzite AlN", "authors": "Zijian Zhou, Kan-Hao Xue, Ziqi Pang, Heng Yu, Shanzhong Xie, Hang Liu, Haiming Qin, Yi Tong, Bowen Su, Yi Yang, Tian-Ling Ren, Xiangshui Miao", "corresponding": "", "url": "https://arxiv.org/abs/2610.31084", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "This study elucidates how nitrogen vacancies influence ferroelectric domain growth and coercive field in AlN, reconciling discrepancies between theoretical and experimental observations.", "summary": "Aluminum nitride-based ferroelectrics combine high remanent polarization, thermal stability, weak size effects, a wide bandgap and back-end process compatibility, making them promising for high density non-volatile memory. However, their high coercive field ($E_\\mathrm{c}$) and unclear polarization switching mechanism limit further applications. Theoretical predictions indicate preferential revers", "abstract": "Aluminum nitride-based ferroelectrics combine high remanent polarization, thermal stability, weak size effects, a wide bandgap and back-end process compatibility, making them promising for high density non-volatile memory. However, their high coercive field ($E_\\mathrm{c}$) and unclear polarization switching mechanism limit further applications. Theoretical predictions indicate preferential reversed domain growth along the polar axis, whereas experiments show nearly isotropic growth or preferential growth perpendicular to this axis. Here, we combine density functional theory, Deep Potential molecular dynamics and experimental characterization to determine how nitrogen vacancies ($V_\\mathrm{N}$) regulate domain growth and $E_\\mathrm{c}$. In ideal crystal, strong lattice coupling along the polar axis drives preferential domain growth in this direction. $V_\\mathrm{N}$ locally weakens this coupling and promotes polarization nucleation. The spatial distribution of $V_\\mathrm{N}$ and the temporal sequence of vacancy induced switching jointly determine the direction and morphology of reversed domain growth. We further show that scandium doping promotes $V_\\mathrm{N}$ formation, thereby enhancing defect mediated nucleation and reducing $E_\\mathrm{c}$. These findings establish a multiscale mechanism governing thin-film domain-growth kinetics and macroscopic $E_\\mathrm{c}$, reconciling experimental observations with ideal crystal simulations and providing defect engineering principles for low-voltage, reliable and scalable ferroelectric devices.", "method": "", "result": "", "future": "", "physics_advance": "Establishment of nitrogen vacancy-driven spatial control and anisotropy of ferroelectric domain growth and coercive field reduction in AlN thin films", "ai_in_scope": true, "relevance_score": 80, "relevance_method": "semantic", "relevance_reason": "Combining multiscale theory and experiment, the paper reveals how nitrogen vacancies regulate ferroelectric domain growth and coercive field in AlN, thus uncovering a defect-mediated domain-switching mechanism and enabling predictive defect", "feature_candidate": false, "summary_zh": "本研究阐明了氮空位如何影响AlN中的铁电畴生长和矫顽场，调和了理论与实验观测之间的差异。", "method_en": "The authors use density functional theory, Deep Potential molecular dynamics, and experiments to analyze vacancy effects and scandium doping on domain kinetics and coercive field.", "method_zh": "作者结合密度泛函理论、深度势分子动力学和实验，分析空位影响及钪掺杂对畴动力学和矫顽场的作用。", "result_en": "Vacancies locally weaken lattice coupling along the polar axis promoting nucleation and affect reversed domain morphology; scandium doping enhances vacancy formation, reducing coercive field.", "result_zh": "空位局部削弱极轴方向的晶格耦合促进核化，影响反转畴形态；钪掺杂促进空位形成，降低矫顽场。", "future_en": "The findings suggest defect engineering strategies for scalable low-voltage ferroelectric devices and emphasize multiscale mechanisms in domain growth.", "future_zh": "研究成果为低压可扩展铁电器件提供缺陷工程策略，强调畴生长的多尺度机制。"}, {"id": "arxiv-2610-31541", "arxiv_id": "2610.31541", "type": "arXiv", "journal": "arXiv:2610.31541", "journal_ref": "", "title": "Sign-problem-free Bosonic Auxiliary Field Quantum Monte Carlo", "authors": "Yin-Kai Yu, Zhong-Chao Wei, Zi-Xiang Li", "corresponding": "", "url": "https://arxiv.org/abs/2610.31541", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "This work develops a bosonic auxiliary-field quantum Monte Carlo (BAFQMC) method that rigorously avoids the sign problem on frustrated lattices via time-reversal symmetry or reflection positivity, greatly extending unbiased simulations of frustrated bosonic systems.", "summary": "The sign problem poses a fundamental barrier to numerically exact quantum Monte Carlo simulations, severely hindering our understanding of quantum many-body physics across disciplines ranging from condensed matter to particle and nuclear physics. Geometrical frustration makes this barrier especially acute for interacting bosons. Here, we develop a bosonic auxiliary-field quantum Monte Carlo (BAFQM", "abstract": "The sign problem poses a fundamental barrier to numerically exact quantum Monte Carlo simulations, severely hindering our understanding of quantum many-body physics across disciplines ranging from condensed matter to particle and nuclear physics. Geometrical frustration makes this barrier especially acute for interacting bosons. Here, we develop a bosonic auxiliary-field quantum Monte Carlo (BAFQMC) method and rigorously prove that time-reversal symmetry and reflection positivity each provide a general sufficient condition for sign-problem-free simulations. Crucially, under either criterion, BAFQMC evades the sign problem even on frustrated lattices where conventional world-line and stochastic-series-expansion methods fail. Benchmarking our approach on a two-flavor Bose-Hubbard model on the triangular lattice yields excellent quantitative agreement with finite-temperature exact diagonalization. By establishing unifying principles to solve the sign problem in BAFQMC, our work substantially expands the reach of unbiased, numerically exact simulations for frustrated bosonic matter.", "method": "", "result": "", "future": "", "physics_advance": "Establishment of general symmetry-based criteria eliminating sign problem in bosonic auxiliary-field quantum Monte Carlo for frustrated systems, expanding exact computational access to frustrated bosonic matter.", "ai_in_scope": true, "relevance_score": 85, "relevance_method": "semantic", "relevance_reason": "Proves general sufficient conditions for sign-problem-free bosonic auxiliary-field quantum Monte Carlo simulations, enabling exact numerics of frustrated bosonic models beyond usual limitations, a major breakthrough in computational condens", "feature_candidate": false, "summary_zh": "本文发展了玻色辅助场量子蒙特卡洛（BAFQMC）方法，严格利用时间反演对称或反射正性避免受挫晶格上的符号问题，显著扩展了无偏的受挫玻色子模拟能力。", "method_en": "The approach leverages symmetry criteria—time-reversal symmetry and reflection positivity—to prove sign-problem-free conditions in BAFQMC, benchmarking accuracy with exact diagonalization on a two-flavor Bose-Hubbard triangular lattice model.", "method_zh": "方法利用时间反演对称和反射正性这两种对称性准则，严格证明BAFQMC中无符号问题的条件，并在三角晶格两味玻色哈伯德模型上与精确对角化进行基准验证。", "result_en": "BAFQMC successfully evades the sign problem even for frustrated lattices where conventional methods fail, yielding excellent quantitative agreement with finite-temperature exact diagonalization results.", "result_zh": "BAFQMC在传统方法失效的受挫晶格上成功避免符号问题，且与有限温度精确对角化结果达成优异的定量一致。", "future_en": "This framework opens pathways for unbiased numerical studies of frustrated bosonic matter and suggests exploring additional symmetry principles to further broaden sign-problem-free quantum Monte Carlo methods.", "future_zh": "该框架为无偏数值研究受挫玻色物质开辟了途径，且提示可探索更多对称性原理以进一步扩展无符号问题的量子蒙特卡洛方法。", "tier": "Nature Communications/Science Advances/PRX", "tier_reason_en": "The paper rigorously solves a fundamental computational barrier—the sign problem—for frustrated bosonic systems using universal symmetry criteria, benchmarks on a nontrivial model, and significantly advances the capabilities of unbiased quantum many-body simulations.", "tier_reason_zh": "本文利用普适的对称性准则严格解决了受挫玻色体系中根本性的计算障碍——符号问题，在复杂模型上进行基准验证，显著提升无偏量子多体模拟能力。"}, {"id": "arxiv-2610-30381", "arxiv_id": "2610.30381", "type": "arXiv", "journal": "arXiv:2610.30381", "journal_ref": "", "title": "Quantum Phases and Structural Transitions of Bosons in Bubble-Shaped Confinements", "authors": "Fabio Cinti, Gabriele Costa, Giuseppe Pellicane, Santi Prestipino, Matteo Ciardi", "corresponding": "", "url": "https://arxiv.org/abs/2610.30381", "topic": "Materials & Growth", "level": "Brief", "summary_en": "This study uses Path Integral Monte Carlo simulations to examine soft-core bosons confined in spherical bubble traps, revealing a sequence of layering transitions driven by particle number increases up to 1800. A finite superfluid fraction (~10%) persists even in the three-layer regime, clarifying particle number's role in layer formation on curved surfaces.", "summary": "We investigate the structural properties and superfluid behavior of soft-core bosons confined in a spherical bubble trap at large particle numbers ($N \\le 1800$). Using Path Integral Monte Carlo simulations with worm algorithm sampling in continuous space, we show that increasing $N$ drives a sequence of layering transitions: beyond the established bilayer supersolid, a third concentric layer of c", "abstract": "We investigate the structural properties and superfluid behavior of soft-core bosons confined in a spherical bubble trap at large particle numbers ($N \\le 1800$). Using Path Integral Monte Carlo simulations with worm algorithm sampling in continuous space, we show that increasing $N$ drives a sequence of layering transitions: beyond the established bilayer supersolid, a third concentric layer of clusters emerges at $N \\approx 1800$. By analyzing the distribution of permutation cycles distribution, we demonstrate that a finite superfluid fraction ($f_s \\approx 10\\%$) persists even in this multi-layer regime. These findings clarify the role of particle number in driving layer formation on curved manifolds, offering a concrete guide for future experiments with bubble-trapped bosons.", "method": "", "result": "", "future": "", "physics_advance": "Identification of layering-induced supersolid transitions and superfluid fraction persistence in soft-core bosons confined to bubble-shaped geometries.", "ai_in_scope": true, "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "Using large-scale path integral Monte Carlo simulations, the paper reveals layering transitions and persistent superfluidity in bubble-confined soft-core bosons, contributing important insights into quantum phases on curved manifolds and co", "feature_candidate": false, "summary_zh": "本研究利用路径积分蒙特卡罗方法研究了软核玻色子在球形泡囊陷阱中的结构性质和超流行为，发现粒子数增加（至1800）会驱动一系列层次转变。即使在三层簇结构中，约10%的超流分数依然存在，阐明了粒子数在曲面层形成中的作用。", "method_en": "The work employs continuous-space Path Integral Monte Carlo simulations with worm algorithm sampling to study a large number of bosons (up to N=1800) in spherical bubble traps, allowing analysis of layering transitions and permutation cycle statistics.", "method_zh": "研究采用连续空间路径积分蒙特卡罗模拟结合蠕虫算法采样，研究多达1800个玻色子在球形泡囊陷阱中的行为，分析层次转变及置换环的分布。", "result_en": "They identify a new third concentric clustering layer emerging at about N=1800 beyond the established bilayer supersolid phase, and show that a nonzero superfluid fraction (~10%) remains in the multilayer configuration, indicating layered supersolidity on curved manifolds.", "result_zh": "研究发现，在已知双层超固体基础上，当粒子数约为1800时出现第三个同心层簇，并证明多层结构中仍保持约10%的有限超流分数，表明了曲面上的分层超固体现象。", "future_en": "These findings provide quantitative guidance for experimental efforts seeking bubble-trapped bosons and shed light on the interplay between particle number and curvature in designing layered quantum phases.", "future_zh": "该结果为未来泡囊陷阱玻色子实验提供定量指导，有助于理解粒子数与曲率在设计分层量子相中的相互作用。"}, {"id": "arxiv-2610-30591", "arxiv_id": "2610.30591", "type": "arXiv", "journal": "arXiv:2610.30591", "journal_ref": "", "title": "Decoding Composition-Structure-Performance Relations in Sodium Layered Oxide Positive Electrode Materials", "authors": "Yunyeong Choi, Hasindhi H. Lokuge, Joshua D. Bocarsly, Pieremanuele Canepa", "corresponding": "", "url": "https://arxiv.org/abs/2610.30591", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "This work compiles and uniformly applies a database of 41 Na/vacancy orderings to over 15 sodium transition-metal oxides, combining machine learning potentials and first-principles calculations to elucidate phase diagrams, redox sequences, and Jahn-Teller distortion suppression via TM mixing.", "summary": "Layered sodium transition-metal (TM) oxides, Na$_x$TMO$_2$, are among the most promising sodium-ion positive electrode materials, yet their Na/vacancy orderings, layer stacking sequences, and cooperative Jahn--Teller distortions are known only for a few single-TM compounds. We compile the Na/vacancy orderings reported in earlier studies into a single library of 41 unique orderings and apply this u", "abstract": "Layered sodium transition-metal (TM) oxides, Na$_x$TMO$_2$, are among the most promising sodium-ion positive electrode materials, yet their Na/vacancy orderings, layer stacking sequences, and cooperative Jahn--Teller distortions are known only for a few single-TM compounds. We compile the Na/vacancy orderings reported in earlier studies into a single library of 41 unique orderings and apply this uniformly to five single-TM and all ten Na$_x$TM$_{0.5}$TM$'_{0.5}$O$_2$ oxides (TM = Ti, Mn, Fe, Co, Ni), screening more than 120,000 structures with machine-learning interatomic potentials prior to 1,025 accurate first-principles calculations. The phase diagrams explain the observed O3/P3/O1 sequences and voltages, and the O3-to-P3 competition hinges on ordering energies of a few meV per atom that scalar descriptors, such as the cationic potential and the interlayer-slab distance, miss. Our extensive analysis reveals that the redox couples form a nearly partner-independent ladder, Ti$^{3+/4+}$ $<$ Mn$^{3+/4+}$ $<$ Co$^{3+/4+}$ $<$ Ni$^{2+/3+}$ $<$ Fe$^{3+/4+}$, explaining pristine charge transfer and the oxidation sequence. Van Vleck analysis of every TMO$_6$ octahedron reveals that TM mixing suppresses the cooperative Jahn--Teller distortions of Mn$^{3+}$ and Ni$^{3+}$ through charge transfer to Jahn--Teller-inactive states or dilution of Jahn--Teller-active centers. We formulate an energy-density-versus-strain map that yields a design rule: a high-voltage couple without Jahn--Teller strain, which Mn$^{4+}$/Ni$^{2+}$ charge transfer realizes in Na$_x$Mn$_{0.5}$Ni$_{0.5}$O$_2$, the most practical composition. We release the ordering-resolved dataset as a training set for subsequent training of accurate machine-learning interatomic potentials.", "method": "", "result": "", "future": "", "physics_advance": "Systematic elucidation of composition-structure-performance relations and Jahn-Teller distortion suppression in layered sodium transition-metal oxides", "ai_in_scope": true, "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "Delivers a comprehensive data-driven phase diagram and mechanistic understanding of Na-ion layered oxides, revealing Jahn-Teller strain suppression by transition-metal mixing and redox ordering, providing fundamental insights into structura", "feature_candidate": false, "summary_zh": "本文汇编并统一应用41种Na/空位有序结构数据库至15种钠过渡金属氧化物，结合机器学习势和第一性原理计算，阐明相图、电荷转移序列及通过过渡金属混合抑制杨-泰勒畸变。", "method_en": "The study screens >120,000 structures with machine-learning interatomic potentials, followed by 1,025 density functional theory calculations; it also conducts Van Vleck analyses of TMO6 octahedra to investigate Jahn-Teller effects and charge transfers.", "method_zh": "研究利用机器学习势筛选超12万结构，随后进行1025次密度泛函理论计算；并对TMO6八面体进行Van Vleck分析，探究杨-泰勒效应及电荷转移。", "result_en": "The authors identify a nearly universal redox ladder Ti3+/4+ < Mn3+/4+ < Co3+/4+ < Ni2+/3+ < Fe3+/4+, explain experimental O3/P3/O1 layer sequence stability, and show that TM mixing suppresses Jahn-Teller distortions, enabling high-voltage compositions like Na_xMn_0.5Ni_0.5O_2 with minimal strain.", "result_zh": "作者确定了近普适的氧化还原顺序Ti3+/4+ < Mn3+/4+ < Co3+/4+ < Ni2+/3+ < Fe3+/4+，解释实验中O3/P3/O1层序列稳定性，且展示过渡金属混合抑制杨-泰勒畸变，实现如Na_xMn_0.5Ni_0.5O_2的高电压低应变组成。", "future_en": "The released data set serves as a benchmark for training machine-learning interatomic potentials, facilitating accelerated computational design of sodium layered oxide electrodes.", "future_zh": "发布的数据集作为训练机器学习势的基准，促进钠层状氧化物正极材料的加速计算设计。"}, {"id": "arxiv-2610-30232", "arxiv_id": "2610.30232", "type": "arXiv", "journal": "arXiv:2610.30232", "journal_ref": "", "title": "Twisted scattering from Chern-Simons theory", "authors": "Guillermo Arias-Tamargo, Philip Boyle Smith, Rishi Mouland, Max Velásquez Cotini Hutt", "corresponding": "", "url": "https://arxiv.org/abs/2610.30232", "topic": "Topology & Transport", "level": "Brief", "summary_en": "This paper constructs topological defects in 2D Dirac fermion systems preserving non-anomalous continuous symmetries acting differently on left- and right-movers, realized via Chern-Simons theory, and computes associated twist lines, boundary central charges, and SPT classes.", "summary": "We consider boundary conditions of two-dimensional Dirac fermions which preserve a non-anomalous continuous symmetry which acts differently on the left- and right-movers. Such boundaries are equivalent to topological defects of Weyl fermions preserving the symmetry. We give a general construction of such defects for conformally-embedded symmetries using Chern-Simons theory. They always exist and c", "abstract": "We consider boundary conditions of two-dimensional Dirac fermions which preserve a non-anomalous continuous symmetry which acts differently on the left- and right-movers. Such boundaries are equivalent to topological defects of Weyl fermions preserving the symmetry. We give a general construction of such defects for conformally-embedded symmetries using Chern-Simons theory. They always exist and can be realised as half-space gauging defects for some finite categorical symmetry. Using this technology, we compute the twist lines to which fermions become attached upon scattering through the defect, the boundary central charge of the corresponding folded boundary state, and its mod-2 valued SPT class. As applications, we first consider abelian symmetries and find agreement with known results in the literature. We then study a novel example where an $SU(2) \\times SU(4) \\times U(1)^2$ symmetry is preserved. In contrast to the abelian case, the twist lines are intrinsically non-invertible and belong to either a $\\text{TY}(\\mathbb{Z}_3 \\times \\mathbb{Z}_3)$ or $\\text{Rep}(\\mathbb{S}_3) \\times \\mathbb{Z}_3$ symmetry depending on whether scattering is to the left or the right.", "method": "", "result": "", "future": "", "physics_advance": "Construction and classification of symmetry-preserving topological defects and twist lines in 2D Dirac fermion systems using Chern-Simons theory, revealing new non-invertible structures and boundary SPT phases.", "ai_in_scope": true, "relevance_score": 80, "relevance_method": "semantic", "relevance_reason": "The paper advances the understanding of topological boundary conditions and defects in 2D Dirac fermion systems with non-anomalous continuous symmetries, employing Chern-Simons theory to reveal novel non-invertible twist lines and boundary ", "feature_candidate": false, "summary_zh": "本文构造了二维Dirac费米子系统中保持非异常连续对称性且左右移动子作用不同的拓扑缺陷，通过Chern-Simons理论实现，并计算相关的扭曲线、边界中心电荷及SPT分类。", "method_en": "Using conformal embedding and categorical symmetry concepts, the authors realize defects as half-space gauging defects and employ Chern-Simons field theory to characterize scattering twists and boundary data.", "method_zh": "借助共形嵌入和范畴对称概念，作者将缺陷实现为半空间规约缺陷，并采用Chern-Simons场论描述散射扭曲及边界信息。", "result_en": "They identify twist lines that are non-invertible in a novel non-abelian symmetry example and reproduce known abelian cases, revealing rich structure in boundary scattering and symmetry-protected topological classifications.", "result_zh": "作者在新颖的非阿贝尔对称实例中发现非可逆扭曲线，并重现了已知阿贝尔情形，揭示了边界散射及对称保护拓扑分类的丰富结构。", "future_en": "Future studies may explore physical realizations, extensions to higher dimensions, and applications to topological quantum computing with non-invertible defects.", "future_zh": "未来研究可探索物理实现、高维扩展及非可逆缺陷在拓扑量子计算中的应用。", "tier": "Uncertain", "tier_reason_en": "The paper advances theoretical understanding of symmetry and topological defects in conformal field theory with sophisticated categorical and field theoretic methods, likely suitable for specialized theoretical physics journals.", "tier_reason_zh": "本文利用复杂的范畴和场论方法推进共形场论中对称性与拓扑缺陷的理论认知，适合专业理论物理期刊。"}, {"id": "arxiv-2610-31067", "arxiv_id": "2610.31067", "type": "arXiv", "journal": "arXiv:2610.31067", "journal_ref": "", "title": "Scale-free localization in pseudo-Hermitian quantum walk", "authors": "Haiting Zhang, Lei Xiao, Cui-Xian Guo, Quan Lin, Peng Xue", "corresponding": "", "url": "https://arxiv.org/abs/2610.31067", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "This paper shows that a single non-Hermitian defect in one-dimensional quantum walks induces scale-free localization (LS) where the localization length scales linearly with system size, accompanied by a pseudo-Hermitian phase transition. Similar phenomena are also demonstrated in two dimensions.", "summary": "Scale-free localization is a distinctive phenomenon in non-Hermitian systems, where specific eigenstates, known as scale-free localized states (LSs), possess localization lengths that scale linearly with the system size. Here, we show that a single non-Hermitian defect in one-dimensional quantum walks (QWs) induces scale-free localization. Driven by non-Hermiticity, the QW system undergoes a pseud", "abstract": "Scale-free localization is a distinctive phenomenon in non-Hermitian systems, where specific eigenstates, known as scale-free localized states (LSs), possess localization lengths that scale linearly with the system size. Here, we show that a single non-Hermitian defect in one-dimensional quantum walks (QWs) induces scale-free localization. Driven by non-Hermiticity, the QW system undergoes a pseudo-Hermitian (PH) phase transition and the PH symmetry breaking is accompanied by the emergence of scale-free localization. As non-Hermiticity is further increased, the system undergoes a second phase transition, marked by the emergence of two pairs of bound states. Crucially, we identify the critical points of both transitions using localization properties. Furthermore, we extend our investigation to two-dimensional QWs, where a single non-Hermitian defect also induces scale-free localization, thereby demonstrating the universality of this phenomenon. Our work provides a valuable perspective for further exploring defect physics and a type of novel LS in non-Hermitian quantum systems.", "method": "", "result": "", "future": "", "physics_advance": "Identification of scale-free localization arising from pseudo-Hermitian phase transitions triggered by single non-Hermitian defects in quantum walks.", "ai_in_scope": true, "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "Demonstrates pseudo-Hermitian phase transitions and identifies scale-free localization induced by a single defect in 1D and 2D quantum walks, revealing new universal localization phenomena in non-Hermitian quantum systems.", "feature_candidate": false, "summary_zh": "本文证明一维量子行走中单一非厄米缺陷可引发尺度无关局域化（LS），其局域长度与系统规模线性相关，并伴随伪厄米相变。二维中也观察到了类似现象。", "method_en": "By introducing a single non-Hermitian defect in quantum walk models, the authors analyze eigenstates’ localization properties and identify critical points of two phase transitions associated with pseudo-Hermiticity and bound state emergence.", "method_zh": "通过在量子行走模型中引入单一非厄米缺陷，作者分析本征态的局域性质，识别与伪厄米对称性及束缚态出现相关的两个相变临界点。", "result_en": "The work identifies the pseudo-Hermitian symmetry breaking accompanied by scale-free LS and a second transition with pairs of bound states, establishing universality of scale-free localization induced by defects in non-Hermitian quantum walks.", "result_zh": "发现伪厄米对称破缺伴随尺度无关LS和随后出现成对束缚态的第二相变，确立了非厄米量子行走中缺陷诱导尺度无关局域化的普适性。", "future_en": "Future research may leverage this perspective to explore novel localized states and defect physics in broader non-Hermitian quantum systems beyond quantum walks.", "future_zh": "未来研究可利用此视角探索非厄米量子系统中量子行走之外的新型局域态和缺陷物理。", "tier": "Uncertain", "tier_reason_en": "Novel theoretical discovery in non-Hermitian quantum systems with broad implications, but appears preliminary pending experimental verification and deeper analysis, placing it in an uncertain tier.", "tier_reason_zh": "非厄米量子系统中的新颖理论发现，具有广泛意义，但尚处于初步阶段，缺乏实验验证与深入分析，故归于不确定层次。"}, {"id": "arxiv-2605-21284", "arxiv_id": "2605.21284", "type": "arXiv", "journal": "arXiv:2605.21284", "journal_ref": "Physical Review B (2026)", "title": "Ligand-mediated Origin of Altermagnetic Spin-Splitting", "authors": "Luigi Camerano, Federico Bisti, Gianni Profeta", "corresponding": "", "url": "https://arxiv.org/abs/2605.21284", "topic": "Magnetism", "level": "Brief", "summary_en": "Using first-principles calculations and Wannier Hamiltonians, the authors identify ligand-mediated hybridization as the dominant microscopic mechanism of altermagnetic spin splitting in Co$_{1/4}$NbSe$_2$, rather than direct magnetic-ion hopping.", "summary": "Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitt", "abstract": "Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitting in the $g$-wave altermagnet Co$_{1/4}$NbSe$_2$. We show that the splitting is captured by a short-range tight-binding model, establishing its local origin. By selectively controlling hopping channels, we demonstrate that the dominant contribution arises not from direct magnetic-ion hopping, but from ligand-mediated hybridization that transfers anisotropy to itinerant states. This identifies ligand-assisted coupling as the key mechanism of altermagnetic spin splitting and provides a microscopic bridge between minimal models and symmetry guided first-principles material searches, enabling real-space design of altermagnetic functionality.", "method": "", "result": "", "future": "", "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "By combining first-principles calculations and microscopic modeling, the paper identifies ligand-mediated hybridization as the dominant mechanism of altermagnetic spin splitting, clarifying its local origin and providing a critical new insi", "feature_candidate": false, "summary_zh": "通过第一性原理计算和Wannier哈密顿量构建，作者发现Co$_{1/4}$NbSe$_2$中的另类磁性自旋劈裂主要源自配体介导的杂化，而非直接磁离子间跃迁。", "method_en": "The study employs short-range tight-binding models selectively controlling hopping channels derived from first-principles to dissect the contributions to spin splitting, supported by Wannier Hamiltonian engineering.", "method_zh": "利用从第一性原理导出的短程紧束缚模型选择性控制跃迁通道，配合Wannier哈密顿量构建，解析自旋劈裂的微观成分。", "result_en": "The analysis shows that ligand-assisted coupling transfers anisotropy to itinerant states, providing a microscopic understanding that bridges minimal models and symmetry-based classifications of altermagnets.", "result_zh": "结果表明配体辅助耦合将各向异性传递给游离态，构建了微观机制，连接了简化模型与基于对称性的另类磁性材料分类。", "future_en": "This insight enables real-space design of altermagnetic properties by tuning ligand environments, facilitating targeted material searches and engineering for spintronic applications.", "future_zh": "该认识使通过调控配体环境实现另类磁性性能的实空间设计成为可能，助力定向材料搜索与自旋电子学应用工程。", "physics_advance": "Identification of ligand-assisted electronic hybridization as the primary microscopic mechanism responsible for altermagnetic spin splitting.", "ai_in_scope": true}, {"id": "doi-10-1073-pnas-2626158123", "doi": "10.1073/pnas.2626158123", "type": "Journal", "journal": "PNAS", "title": "A functional two-pore-domain K + channel from a large DNA virus", "authors": "Oliver Rauh, Sebastian Mach, Oliver Clarke, Jonas Toews, James L. Van Etten, Mike Althaus, Anna Moroni, Gerhard Thiel", "corresponding": "", "url": "https://doi.org/10.1073/pnas.2626158123", "topic": "Materials & Growth", "level": "Brief", "summary_en": "This work identifies a functional two-pore-domain potassium channel encoded in a large DNA virus, the NCLDV Pyramimonas orientalis virus, revealing a primitive viral K2P channel precursor.", "summary": "The evolutionary history of proteins helps to understand their structure/function correlates and suggests on how functional complexity evolved from primitive precursors. In the superfamily of K + channels, functional features of complex eukaryotic inward rectifier (Kir) channels and voltage-dependent (Kv) channels could be understood in terms of an increase in structural complexity of their prokar", "abstract": "The evolutionary history of proteins helps to understand their structure/function correlates and suggests on how functional complexity evolved from primitive precursors. In the superfamily of K + channels, functional features of complex eukaryotic inward rectifier (Kir) channels and voltage-dependent (Kv) channels could be understood in terms of an increase in structural complexity of their prokaryotic precursors. K2P channels, which are made from tandem repeats of two pore domains, are not found in prokaryotes and their evolutionary origin is still unknown. In searching for primitive K2P channel precursors, we screened the genomes of nucleocytoplasmic large DNA viruses (NCLDVs) for genes coding for K2P channels. This was motivated by two reasons: NCLDVs are already known for coding primitive Kir type channels, and they play important roles in the evolution of eukaryotes. Here, we report that the NCLDV Pyramimonas orientalis virus codes for K2P-like K + channels. With only 178 amino acids and no cytosolic domains, this Kpov protein is much smaller than any eukaryotic K2P channel, but still functional as K + selective channel in lipid bilayers. Phylogenetic analysis suggests that Kpov is not the product of molecular piracy from the host but may result from fusion of primitive viral K + channel pore domains.", "method": "", "result": "", "future": "", "physics_advance": "Identification of a minimal, functional viral two-pore-domain K+ channel illuminating evolutionary origins and structure-function of K2P channels", "ai_in_scope": true, "relevance_score": 68, "relevance_method": "semantic", "relevance_reason": "Reports the discovery of a functional two-pore-domain K+ channel encoded by a large DNA virus with implications for ion channel evolution and structure-function correlation in primitive K2P channels.", "feature_candidate": false, "summary_zh": "本研究发现了一种编码于大型DNA病毒NCLDV Pyramimonas orientalis病毒中的功能性双孔域钾通道，揭示了原始病毒K2P通道的前体。", "method_en": "Genomic screening of NCLDVs for K2P channel genes was performed, followed by phylogenetic analyses and functional assays in lipid bilayers to test K+ selectivity and channel activity of the viral protein.", "method_zh": "通过筛选NCLDV病毒基因组寻找K2P通道基因，结合系统发育分析和脂质双层功能测定验证病毒蛋白的K+选择性及通道功能。", "result_en": "The viral Kpov protein, only 178 amino acids long and lacking cytosolic domains, functions as a K+-selective channel and phylogenetically appears to be a fusion of primitive viral pore domains rather than a host gene acquisition.", "result_zh": "该病毒Kpov蛋白仅178个氨基酸且无胞质结构域，作为K+选择性通道功能正常，系统发育分析表明其可能源自原始病毒孔域融合，而非从宿主基因盗取。", "future_en": "These findings suggest a viral origin of K2P channels and provide insights into the evolution of complex eukaryotic ion channels from primitive precursors.", "future_zh": "该发现提示K2P通道可能起源于病毒，为理解复杂真核离子通道由原始祖先进化提供了新视角。"}, {"id": "doi-10-1103-2rw7-bzl4", "doi": "10.1103/2rw7-bzl4", "type": "Journal", "journal": "PRX", "title": "Toward Complete Characterization of Topological Insulators and Superconductors: A Systematic Construction of Topological Invariants Based on Atiyah-Hirzebruch Spectral Sequence", "authors": "Seishiro Ono, Ken Shiozaki", "corresponding": "", "url": "https://doi.org/10.1103/2rw7-bzl4", "topic": "Superconductivity", "level": "Brief", "summary_en": "This study presents a systematic framework for constructing topological invariants across many symmetry classes using the Atiyah-Hirzebruch spectral sequence, overcoming limitations of symmetry-indicator theory. It completely characterizes K groups in 159 space groups, including superconductors where symmetry indicators fail.", "summary": "The past decade has witnessed significant progress in topological materials investigation. Symmetry-indicator theory and topological quantum chemistry provide an efficient scheme to diagnose topological phases from only partial information of wave functions without full knowledge of topological invariants, which has resulted in a recent comprehensive materials search. However, not all topological ", "abstract": "The past decade has witnessed significant progress in topological materials investigation. Symmetry-indicator theory and topological quantum chemistry provide an efficient scheme to diagnose topological phases from only partial information of wave functions without full knowledge of topological invariants, which has resulted in a recent comprehensive materials search. However, not all topological phases can be captured by this framework, and topological invariants are needed for a more refined diagnosis of topological phases. In this study, we present a systematic framework to construct topological invariants for a large part of symmetry classes, which should be contrasted with the existing invariants discovered through one-by-one approaches. Our met
