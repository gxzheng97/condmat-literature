hod is based on the recently developed Atiyah-Hirzebruch spectral sequence in momentum space. As a demonstration, we construct topological invariants for time-reversal-symmetric spinful superconductors with conventional pairing symmetries of all space groups, for which symmetry indicators are silent. We also validate that the obtained quantities work as topological invariants by computing them for randomly generated symmetric Hamiltonians. Remarkably, the constructed topological invariants completely characterize K groups in 159 space groups. Our topological invariants for normal conducting phases are defined under some gauge conditions. To facilitate efficient numerical simulations, we discuss how to derive gauge-independent topological invariants from the gauge-fixed topological invariants through some examples. Combined with first-principles calculations, our results will help us discover topological materials that could be used in next-generation devices and pave the way for a more comprehensive topological materials database.", "method": "", "result": "", "future": "", "physics_advance": "Systematic construction of topological invariants for complex symmetry classes using Atiyah-Hirzebruch spectral sequence, advancing topological classification", "ai_in_scope": true, "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "Develops a systematic theoretical framework to construct topological invariants for a wide range of symmetry classes, enabling refined classification of topological materials beyond symmetry indicators.", "feature_candidate": false, "summary_zh": "本研究提出了一种基于Atiyah-Hirzebruch谱序列的系统性构造拓扑不变量框架，克服了对称性指示器理论的局限，在159个空间群中完全刻画了K群，包括对称性指示器不适用的超导体。", "method_en": "The method employs the Atiyah-Hirzebruch spectral sequence in momentum space to systematically derive topological invariants, and validates them by computing for randomly generated symmetric Hamiltonians, including gauge fixing and deriving gauge-independent forms for numerical efficiency.", "method_zh": "该方法利用动量空间中的Atiyah-Hirzebruch谱序列系统地推导拓扑不变量，并通过随机生成的对称哈密顿量进行验证，同时讨论了规范固定和无规范依赖的拓扑不变量的数值计算方法。", "result_en": "The constructed topological invariants fully characterize K groups in 159 space groups, correctly describing time-reversal-symmetric spinful superconductors with conventional pairing symmetries where symmetry indicators are silent, facilitating comprehensive material searches.", "result_zh": "所构造的拓扑不变量完全刻画了159个空间群中的K群，成功描述了对称性指示器无效的具有常规配对对称性的时间反演对称旋量超导体，促进了全面的材料搜索。", "future_en": "By combining with first-principles calculations, the framework may enable discovery of new topological materials suitable for next-generation devices and support the development of a comprehensive topological materials database.", "future_zh": "结合第一性原理计算，该框架有望推动新拓扑材料的发现，适用于下一代器件，并支持构建全面的拓扑材料数据库。"}, {"id": "arxiv-2605-23848", "arxiv_id": "2605.23848", "type": "arXiv", "journal": "arXiv:2605.23848", "journal_ref": "", "title": "On the Ising/tricritical-Ising interface: From ${W}_3$ symmetry to Rydberg atoms", "authors": "António Antunes, Junchen Rong", "corresponding": "", "url": "https://arxiv.org/abs/2605.23848", "topic": "Magnetism", "level": "Brief", "summary_en": "The study analyzes conformal interfaces between tricritical Ising and Ising models, uncovering emergent W3 chiral symmetry relevant to defect conformal field theories and potential Rydberg atom implementations.", "summary": "We consider interfaces between critical spin-chains in different universality classes, described in the continuum limit by defect/interface conformal field theory (DCFT/ICFT). We focus on a conformal interface between the Tricritical Ising (TIM) and the Ising CFT exploring the possibility of its experimental realizations in the context of Rydberg atom arrays. Our analysis emphasizes non-invertible", "abstract": "We consider interfaces between critical spin-chains in different universality classes, described in the continuum limit by defect/interface conformal field theory (DCFT/ICFT). We focus on a conformal interface between the Tricritical Ising (TIM) and the Ising CFT exploring the possibility of its experimental realizations in the context of Rydberg atom arrays. Our analysis emphasizes non-invertible symmetries and consistency under modular transformations, and uses defect couplings and the defect spectrum -- including in the case of mixed boundary conditions -- to make sharp experimental predictions. The structure of the observables hinges on a newly discovered pattern of emergent ${W}_3$ chiral symmetry for the Tricritical-Ising/Ising interface.", "method": "", "result": "", "future": "", "physics_advance": "Discovery of emergent W3 chiral symmetry and non-invertible symmetry patterns at the tricritical Ising/Ising quantum spin-chain interface with experimentally relevant predictions.", "ai_in_scope": true, "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "The work establishes a novel emergent chiral W3 symmetry in the interface criticality between tricritical Ising and Ising conformal field theories, linking abstract defect/interface CFT to potentially realizable spin-chain physics in Rydber", "feature_candidate": false, "summary_zh": "该研究分析三临界Ising和Ising模型之间的共形界面，发现了与缺陷共形场论相关的涌现W3手征对称性及其在Rydberg原子中的潜在实现。", "method_en": "It applies defect/interface conformal field theory techniques, focusing on non-invertible symmetries, modular consistency, defect couplings, and mixed boundary condition spectra.", "method_zh": "采用缺陷/界面共形场论技术，重点研究不可逆对称性、模对称一致性、缺陷耦合及混合边界条件谱。", "result_en": "The findings highlight a new W3 chiral symmetry at the tricritical-Ising/Ising interface and formulate sharp experimental predictions guiding realizations with Rydberg atom arrays.", "result_zh": "结果揭示了三临界Ising/Ising界面处的新型W3手征对称性，并制定了指导Rydberg原子阵列实现的实验预测。", "future_en": "Further experiments in Rydberg arrays could test the predicted interface phenomena and explore applications of emergent chiral symmetries.", "future_zh": "未来可在Rydberg阵列中实验验证预测的界面现象，探索涌现手征对称性的应用。", "tier": "Uncertain", "tier_reason_en": "This work combines advanced theoretical physics tools with experimental proposal elements, promising for condensed matter and quantum simulation communities.", "tier_reason_zh": "该工作结合了高级理论物理工具和实验提议元素，对凝聚态物理和量子模拟领域有前景。"}, {"id": "arxiv-2610-30764", "arxiv_id": "2610.30764", "type": "arXiv", "journal": "arXiv:2610.30764", "journal_ref": "", "title": "Universal Synthesis of Large-Area Hybrid Perovskite Monolayers Enabling Lithography-Free, Low-Static-Power Optoelectronics", "authors": "Shankeerthan Kalyanasundaram, Swarit Dwivedi, Sanje Mahasivam, Christopher R. McNeill, Sudha Mokkapati", "corresponding": "", "url": "https://arxiv.org/abs/2610.30764", "topic": "Materials & Growth", "level": "Brief", "summary_en": "The authors develop a steric-engineering ternary-solvent growth method that achieves monolayer hybrid perovskite crystals with lateral sizes over 1000 µm², surpassing conventional flake sizes by orders of magnitude and enabling lithography-free device fabrication with ultra-low dark currents and low static power consumption.", "summary": "Solution-phase synthesis of monolayer hybrid organic-inorganic perovskites is constrained by rapid out-of-plane crystal growth, uncontrolled nucleation, and strong interlayer aggregation, yielding flakes of only a few μm. We introduce a steric-engineering ternary-solvent growth strategy to synthesize monolayer and few-layer A2MX4 hybrid perovskites with exceptionally large surface areas. By combin", "abstract": "Solution-phase synthesis of monolayer hybrid organic-inorganic perovskites is constrained by rapid out-of-plane crystal growth, uncontrolled nucleation, and strong interlayer aggregation, yielding flakes of only a few μm. We introduce a steric-engineering ternary-solvent growth strategy to synthesize monolayer and few-layer A2MX4 hybrid perovskites with exceptionally large surface areas. By combining alcohol cosolvents with an amine additive, out-of-plane stacking is suppressed. Using (PEA)2CuCl4 as a model system, monolayers with lateral areas exceeding 1000 μm2 are achieved, representing a massive dimensional increase over conventional methods. Molecular dynamics and quantum-chemical calculations show that longer-chain alcohols reorganize precursor solvation, while solvent volatility prolongs edge-mediated precursor transport during annealing. This strategy demonstrates universal applicability across diverse organic spacer cations (PEA+, F-PEA+, PentA+), metal centers (Cu2+, Mn2+, Pb2+), and halides (Cl-, Br-, I-). The large lateral dimensions enable direct, solvent-free electrical contact fabrication via physical shadow masking, bypassing chemical degradation from solvents used in conventional lithography. Planar devices fabricated from isolated ultrathin (PEA)2PbI4 channels exhibit ultra-low dark currents down to the 10^-15 - 10^-13 A range, enabling femtowatt-to-picowatt static power consumption, ~ 0.2 pW at 5 V, a 250-fold reduction relative to drop-cast films, while maintaining a high light-to-dark current ratio of 4.3 x 102. This work establishes precise steric and solvation control as a paradigm for scalable, compositionally diverse, low-static-power monolayer 2D perovskite optoelectronics.", "method": "", "result": "", "future": "", "physics_advance": "Discovery of solvent and steric control principles enabling large-area hybrid 2D perovskite monolayers with ultra-low static power optoelectronics", "ai_in_scope": true, "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "Demonstrates a new universal steric-solvent engineering strategy to synthesize large-area monolayer 2D hybrid perovskites, enabling study and control of intrinsic low-static-power optoelectronic properties, connecting molecular-scale growth", "feature_candidate": false, "summary_zh": "作者提出了一种立体工程三元溶剂生长策略，成功制备出面积超过1000 µm²的单层杂化钙钛矿晶体，尺寸远超传统薄片，实现无需光刻的器件制造，具备超低暗电流和低静态功耗。", "method_en": "Combining alcohol 4", "topic": "Magnetism", "level": "Brief", "summary_en": "The work explores nonlinear magnetization dynamics and chaotic behavior of two dipolar-coupled anisotropic spins under periodic transverse excitation.", "summary": "We investigate the non-linear magnetization dynamics of two identical anisotropic macrospins coupled by dipolar interaction and subjected to periodic transverse excitation. The coupled Landau- Lifshitz-Gilbert equations are solved numerically using a fourth-order Runge-Kutta method. By combining bifurcation diagrams, local-maxima analysis, Lyapunov exponents, and two-dimensional stability maps, we", "abstract": "We investigate the non-linear magnetization dynamics of two identical anisotropic macrospins coupled by dipolar interaction and subjected to periodic transverse excitation. The coupled Landau- Lifshitz-Gilbert equations are solved numerically using a fourth-order Runge-Kutta method. By combining bifurcation diagrams, local-maxima analysis, Lyapunov exponents, and two-dimensional stability maps, we characterize how dipolar coupling, transverse driving amplitudes, and uniaxial anisotropy govern the long-time dynamics. The results reveal a non-monotonic reorganization of dynamical regimes, with alternating intervals of enhanced and suppressed instability. Analysis of symmetric and antisymmetric coordinates distinguishes the collective and relative spin responses, while Fourier spectra and three-dimensional trajectories provide complementary frequency-domain and geometrical characterizations. Simultaneous positivity of the two largest Lyapunov exponents identifies parameter regions consistent with hyperchaotic dynamics. Finally, analytical linearization and ferromagnetic-resonance calculations reveal the distinct coupling dependence of the collectivemode frequencies and clarify the limitations of the linearized description beyond the stability thresholds of the collinear reference state. These findings establish a unified framework for understanding the interplay of dipolar coupling, anisotropy, and periodic excitation in the non-linear dynamics of a minimal interacting-spin system.", "method": "", "result": "", "future": "", "physics_advance": "Identification and analysis of hyperchaotic dynamics and bifurcations in dipolar-coupled anisotropic spin systems under periodic excitation, linking coupling strength, anisotropy, and nonlinear collective spin modes.", "ai_in_scope": true, "relevance_score": 65, "relevance_method": "semantic", "relevance_reason": "By characterizing nonlinear and hyperchaotic magnetization dynamics of two dipolar-coupled anisotropic spins under periodic drive, this work uncovers rich dynamical regimes and collective mode behavior rarely explored in minimal spin system", "feature_candidate": false, "summary_zh": "本研究探讨了周期横向激发下两个偶极耦合各向异性自旋的非线性磁化动力学及混沌行为。", "method_en": "Numerical solutions of coupled Landau-Lifshitz-Gilbert equations via fourth-order Runge-Kutta are combined with bifurcation analysis, Lyapunov exponents, and stability maps to characterize dynamic regimes and transitions to hyperchaos.", "method_zh": "采用四阶Runge-Kutta数值求解耦合Landau-Lifshitz-Gilbert方程，结合分岔图、Lyapunov指数和稳定性图谱，分析动力学状态和超混沌转变。", "result_en": "The study identifies alternating regimes of instability influenced by dipolar coupling, driving amplitude, and anisotropy, delineates collective versus relative spin responses, and confirms hyperchaotic behavior through dual positive Lyapunov exponents; analytical linearization reveals frequency dependencies and limits of linearized approximations.", "result_zh": "研究发现了偶极耦合、激励幅度和各向异性交互影响下的不稳定周期交替，区分了集体与相对自旋响应，通过两个正Lyapunov指数确认超混沌行为；线性化分析揭示频率依赖及线性近似的适用边界。", "future_en": "Future investigations could extend these nonlinear dynamics insights to larger spin ensembles and experimental systems to design devices exploiting controlled chaotic magnetization.", "future_zh": "未来可将非线性动力学理解扩展至更大自旋群体和实验体系，设计利用受控混沌磁化的器件。"}, {"id": "arxiv-2605-26233", "arxiv_id": "2605.26233", "type": " azzmin Victorin, Huairuo Zhang, James L. Hart, Vsevolod Belosevich, Xi Ling, Qiong Ma, Wan Kyu Park, Kenji Watanabe, Takashi Taniguchi, Judy J. Cha, Albert V. Davydov, Kin Chung Fong, Ethan Arnault, Genda Gu, Rui-Xing Zhang, Enrico Rossi, Jing Xia, Kenneth S. Burch", "corresponding": "", "url": "https://arxiv.org/abs/2606.21507", "topic": "Superconductivity", "level": "Brief", "summary_en": "The study reports anomalous boundary-mediated superconducting transport in FeTe0.55Se0.45 associated with spontaneous time-reversal-symmetry breaking (TRSB) below a characteristic temperature TKerr. This effect manifests as a conductance plateau dependent on edge continuity and doping, observed exclusively in the topologically nontrivial phase.", "summary": "The interplay of superconductivity, band topology, and spontaneous time-reversal-symmetry breaking (TRSB) is expected to enable topological superconducting boundary states. FeTe0.55Se0.45 provides a promising single-material platform because it combines superconductivity, nontrivial band topology, and spontaneous magnetization in the superconducting state. Here we report evidence for a boundary-me", "abstract": "The interplay of superconductivity, band topology, and spontaneous time-reversal-symmetry breaking (TRSB) is expected to enable topological superconducting boundary states. FeTe0.55Se0.45 provides a promising single-material platform because it combines superconductivity, nontrivial band topology, and spontaneous magnetization in the superconducting state. Here we report evidence for a boundary-mediated superconducting transport response in exfoliated Fe(Te,Se) devices. Polar Kerr measurements show that TRSB emerges below TKerr < Tc and coexists with superconductivity across multiple compositions, providing an independent symmetry-breaking scale for transport. Using crystallographically sharp, continuous edges and side-surface-dominant contacts, we find that topological FeTe0.55Se0.45 exhibits an anomalous conductance plateau absent in topologically trivial FeTe0.40Se0.60 and Fe1.02Te0.55Se0.45 under comparable measurements. This plateau requires uninterrupted sharp edges connecting source and drain, persists over micrometer-scale separations far exceeding the bulk coherence length, shows strongly suppressed thermal broadening, and collapses when the drain is moved to the top surface. Its temperature evolution follows the TRSB scale: the plateau remains weakly broadened below T*Kerr and disappears near TKerr rather than Tc. These doping-selective, edge-geometry-dependent, TRSB-correlated, and long-range nonlocal signatures establish experimental criteria for identifying boundary-mediated superconducting transport in FeTe0.55Se0.45 and motivate phase-sensitive and theoretical studies of its microscopic origin.", "method": "", "result": "", "future": "", "physics_advance": "Experimental identification and characterization of nonlocal boundary-mediated superconducting transport correlated with TRS-breaking in topological iron-based superconductor FeTe0.55Se0.45", "ai_in_scope": true, "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "The work experimentally demonstrates a boundary-mediated superconducting transport distinct from bulk superconductivity in a TRS-broken topological iron-based superconductor, linking topological band structure and spontaneous magnetization ", "feature_candidate": false, "summary_zh": "本研究报道了FeTe0.55Se0.45中与特征温度TKerr以下伴随的自发时间反演对称性破缺（TRSB）相关的异常边界介导超导输运。该效应表现为仅在拓扑非平凡相中基于边缘连续性和掺杂依赖的导电平台。", "method_en": "The authors use polar Kerr effect measurements to detect TRSB and fabricate exfoliated devices with well-defined edges and side-surface contacts to differentiate boundary contributions in transport.", "method_zh": "作者采用极化克尔效应测量检测TRSB，并制备具明确边缘和侧表面接触的剥离器件以区分输运中的边界贡献。", "result_en": "They find the conductance plateau persists over micrometer distances exceeding bulk coherence length, strongly correlates with the TRSB scale, and is absent in topologically trivial or edge-disrupted samples, suggesting boundary-mediated topological superconductivity.", "result_zh": "他们发现导电平台在超出体相相干长度的微米尺度距离内保持，强烈关联TRSB标度，在拓扑平凡或边缘破坏样品中缺失，暗示边界介导的拓扑超导性。", "future_en": "Future research is motivated to perform phase-sensitive and theory studies to elucidate the microscopic origin of the TRSB correlated boundary transport phenomena.", "future_zh": "未来研究将开展相位灵敏和理论研究，以阐明与TRSB相关的边界输运现象的微观起源。"}, {"id": "arxiv-2610-31591", "arxiv_id": "2610.31591", "type": "arXiv", "journal": "arXiv:2610.31591", "journal_ref": "", "title": "Screening strongly correlated materials in solid oxide cells with quantum simulation", "authors": "Ouns El Harzli, Jelle Bor, Linde Wester, Leonid Zhukov, Hanl Park, Jean-François Bobier, Matt Langione, Antonino Marco Saitta, Jonathan Owens, Richard Hart, Yudong Cao, François Jamet", "corresponding": "", "url": "https://arxiv.org/abs/2610.31591", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "This paper develops a comprehensive framework for screening strongly correlated oxygen-electrode materials for solid oxide fuel and electrolysis cells using quantum computing. It integrates electronic structure embedding methods with continuum device modeling to link microscopic quantum observables to engineering metrics and estimates the potential industrial impact.", "summary": "We develop an end-to-end framework for assessing a quantum-computing application in industrial materials science: the screening of strongly correlated oxygen-electrode materials for SOFCs and SOECs. We formulate the materials problem in terms of interface observables including oxygen-vacancy formation energies, vacancy migration barriers, and electronic conductivity. We describe how these observab", "abstract": "We develop an end-to-end framework for assessing a quantum-computing application in industrial materials science: the screening of strongly correlated oxygen-electrode materials for SOFCs and SOECs. We formulate the materials problem in terms of interface observables including oxygen-vacancy formation energies, vacancy migration barriers, and electronic conductivity. We describe how these observables can be obtained using a diagrammatic GW-based embedding, either GW+DMFT or self-energy embedding theory (SEET), applied to a DFT-screened shortlist. The atomistic electrode/electrolyte interface defines the electronic structure problem from which the correlated impurity models are constructed. Quantum impurity solvers would provide the finite-temperature impurity Green's functions required by the embedding. The computational challenges that classical solvers may encounter as the interacting active space grows, together with the polynomial scaling of quantum Hamiltonian simulation for efficiently represented discretized models, open an opportunity for quantum advantage. We identify the benchmarks needed to assess this opportunity through convergence of vacancy and migration energetics and comparison with the best applicable classical solvers. We provide illustrative logical qubit counts and identify the thermal state preparation, simulation, measurement, and repeated-solve costs needed for a complete resource assessment. We connect microscopic observables to macroscopic engineering metrics using a continuum model for mixed ionic--electronic conducting oxygen electrodes that couples oxygen surface exchange, solid-state oxygen transport, electrode microstructure, and finite electrode thickness. Finally, we estimate the potential worldwide business value of improved electrode materials under SOFC and SOEC deployment scenarios informed by public technical targets and electrolyser deployment data.", "method": "", "result": "", "future": "", "physics_advance": "Establishes a framework for quantum-empowered prediction of microscopic electronic structure and defect energetics in strongly correlated oxide interfaces relevant for energy conversion materials.", "ai_in_scope": true, "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "This paper presents a novel integration of quantum simulation techniques with advanced many-body embedding methods to predict oxygen vacancy-related properties in strongly correlated materials, addressing a key experimental observable relev", "feature_candidate": false, "summary_zh": "本文提出了一个基于量子计算的端到端框架，用于筛选强关联氧电极材料，用于固体氧化物燃料电池和电解池，结合了电子结构嵌入方法与连续介观模型，连接微观量子观测与工程指标，并评估了其工业应用潜力。", "method_en": "The approach formulates interface observables (vacancy formation energies, migration barriers, conductivity) using GW-based embedding techniques like GW+DMFT or SEET on DFT-screened candidates, employing quantum impurity solvers suitable for quantum hardware to handle computationally challenging correlated impurity problems.", "method_zh": "方法通过GW嵌入技术（GW+DMFT或SEET）结合DFT筛选材料，构建电子结构中的强关联杂质模型，利用量子杂质求解器处理经典算法遇阻的高复杂度问题，评估界面性能指标。", "result_en": "The study details benchmark criteria for quantum advantage assessment, quantifies resource requirements for quantum simulations, and links microscopic quantum calculations of oxygen vacancy energetics to macroscopic electrode performance via continuum modeling, emphasizing business value estimates based on realistic deployment scenarios.", "result_zh": "该研究制定了评估量子优势的基准指标，量化了量子模拟所需资源，并通过连续模型将微观氧空位能量计算与宏观电极性能连接，结合实际应用场景评估商业价值。", "future_en": "Future work may focus on implementing demonstrated quantum algorithms on near-term quantum hardware, refining embedding and impurity solver methods, and extending screening to broader material classes, ultimately integrating predictive quantum simulations into industrial SOFC/SOEC materials design workflows.", "future_zh": "未来研究可能致力于在近场量子硬件上实现所提算法，改进嵌入和杂质求解方法，扩展材料筛选范畴，并将预测性量子模拟整合入工业固体氧化物电池及电解池材料设计流程。"}], "stats": {"original_arxiv_journal_candidates": 201, "oversized_index_before": 124, "ai_assessed": 124, "first_pass_selected": 109, "selected_after_global_editorial": 26, "excluded_from_oversized_index": 98, "featured": 4, "global_edito semiconductors.", "ai_in_scope": true}, {"id": "arxiv-2610-30321", "arxiv_id": "2610.30321", "type": "arXiv", "journal": "arXiv:2610.30321", "journal_ref": "", "title": "Extreme competition between stripes and superconductivity in the hole-doped Hubbard model", "authors": "Ao Chen, Johnnie Gray, Si-Jing Du, Garnet Kin-Lic Chan", "corresponding": "", "url": "https://arxiv.org/abs/2610.30321", "topic": "Superconductivity", "level": "Feature", "summary_en": "High-accuracy simulations on up to 1024 sites find near-degenerate uniform d-wave superconducting, superconducting-stripe and insulating-stripe states in the doped Hubbard model.", "summary": "High-accuracy simulations on up to 1024 sites find near-degenerate uniform d-wave superconducting, superconducting-stripe and insulating-stripe states in the doped Hubbard model.", "abstract": "The two-dimensional Hubbard model was originally proposed as the minimal model of uniform $d$-wave superconductivity in the cuprate high-temperature superconductors, but recent calculations with relevant parameters in a realistic doping regime have often found other ground states. Further, uncertainty remains over such results due to the intrinsic bias of different computational methods. Here we address this uncertainty through state-of-the-art neural tensor network and neural backflow state simulations, enabled by large-scale GPU computation, that together reach an unprecedented variational accuracy on lattices with up to 1024 sites. At $1/8$ doping in the pure Hubbard model, as well as with next-nearest-neighbor hopping relevant to the hole-doped cuprates, we reveal a near degeneracy among a low-energy uniform $d$-wave state, superconducting stripes, and non-superconducting stripe states on the milli-$t$ energy scale. Our work rebalances the narrative that the Hubbard model supports a single dominant order in relevant parameter regimes towards a picture of extreme competition between stripes and superconductivity.", "method": "", "result": "", "future": "", "summary_zh": "在最多 1024 格点的二维 Hubbard 模型中发现均匀 d 波超导、超导条纹和非超导条纹能量极其接近。", "tier": "Nature Communications/Science Advances/PRX", "tier_reason_en": "A substantial conceptual or methodological advance with cross-community relevance.", "tier_reason_zh": "概念或方法进展较显著，可跨多个研究方向应用。", "relevance_score": 90, "relevance_method": "semantic", "relevance_reason": "By achieving benchmark variational accuracy on large lattices, this work reveals near degeneracy and extreme competition among uniform d-wave superconductivity and stripe orders in the 2D Hubbard model, profoundly clarifying a fundamental a", "feature_candidate": true, "physics_advance": "High-accuracy demonstration of near degeneracy and extreme competition between uniform d-wave superconductivity and stripe orders in the hole-doped 2D Hubbard model", "ai_in_scope": true}, {"id": "arxiv-2610-30502", "arxiv_id": "2610.30502", "type": "arXiv", "journal": "arXiv:2610.30502", "journal_ref": "", "title": "Chiral Cavity Vacua as Local Generators and Probes of Non-Abelian Kitaev Topology", "authors": "Yu Zhang", "corresponding": "", "url": "https://arxiv.org/abs/2610.30502", "topic": "Magnetism", "level": "Feature", "summary_en": "A chiral cavity vacuum is predicted to write and probe local non-Abelian Kitaev topological regions.", "summary": "A chiral cavity vacuum is predicted to write and probe local non-Abelian Kitaev topological regions.", "abstract": "We show how a gyrotropic cavity vacuum generates, probes, and spatially programs non-Abelian topology in the Kitaev honeycomb model. Gauge-consistent virtual-photon elimination produces a universal helicity-odd interaction $\\mathrm{i}[P_x,P_y]$ alongside same-order even dressing. For the leading bond polarization, this commutator is exactly the Kitaev three-spin mass. Mode normalization imposes a thermodynamic constraint: one extended normalized mode gives a local mass that vanishes with sample area, whereas a localized mode writes a finite topological island and a finite mode density enables a bulk mass. The exact Majorana solution yields helicity-reversed Chern gaps and edge propagation, while integrated circular dichroism exactly measures the mass generator, $\\langle\\mathrm{i}[P_x,P_y]\\rangle=-\\sqrt3p^2\\langle O_3\\rangle$. Real-space calculations reveal a non-Abelian island and a helicity wall with two co-propagating Majorana modes. Uniform helicity reversal is a Dirac-mass quench with $n_{\\rm ex}\\proptoτ_Q^{-1}$, whereas moving a wall localizes the gap closing. The equilibrium vacuum kernel contains sum-frequency rather than resonant denominators. These results establish distinct criteria for local and bulk cavity-induced topology.", "method": "", "result": "", "future": "", "summary_zh": "提出用手性腔真空在 Kitaev 蜂窝模型中局域产生、探测和编程非阿贝尔拓扑态。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 85, "relevance_method": "semantic", "relevance_reason": "This work establishes a novel theoretical framework and exact solution for cavity-vacuum-induced non-Abelian topological mass terms and edge modes in the Kitaev honeycomb model, demonstrating cavity-induced local and bulk topological states", "feature_candidate": true, "physics_advance": "Demonstration that chiral cavity vacuum modes induce and spatially control non-Abelian topological mass and Majorana edge modes in the Kitaev honeycomb system", "ai_in_scope": true}, {"id": "doi-10-1038-s41467-026-78016-8", "doi": "10.1038/s41467-026-78016-8", "type": "Journal", "journal": "Nature Communications 17, 11076 (2026)", "title": "Giant orbital Zeeman effects in a magnetic topological van der Waals interphase", "authors": "Tobias Wichmann, Mirco Sastges, Keda Jin, Jose Martinez-Castro, Tom G. Saunderson, Dongwook Go, Honey Boban, Samir Lounis, Lukasz Plucinski, Markus Ternes, Yuriy Mokrousov, F. Stefan Tautz, Felix Lüpke", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78016-8", "topic": "Magnetism", "level": "Brief", "summary_en": "Graphene/Fe3GeTe2 interfaces exhibit electrically tunable orbital Zeeman splitting with effective g factors as large as about 230.", "summary": "Graphene/Fe3GeTe2 interfaces exhibit electrically tunable orbital Zeeman splitting with effective g factors as large as about 230.", "abstract": "Abstract Van der Waals (vdW) heterostructures allow the engineering of magnetic and electronic properties via interfacial orbital hybridization and charge transfer. The resulting electric fields can give rise to Rashba spin-orbit coupling and Dzyaloshinskii-Moriya interactions, which may stabilize novel two-dimensional magnetic phases. While such emergent magnetic ‘interphases’ may offer a promising platform for spin-based electronics, direct spectroscopic evidence for them is still lacking. Here, we report electric-field tunable Zeeman effects with Landé g -factors up to ≈ 230 at the interface of graphene and the vdW ferromagnet Fe 3 GeTe 2 . They arise from an interplay of local-moment canting and the itinerant orbital moments of Fe 3 GeTe 2 , producing a giant asymmetric level splitting. Exploiting the inelastic phonon gap of graphene, scanning tunneling spectroscopy allows us to access the buried interface properties, and quantify Faraday-like screening. Our findings provide new insights and opportunities for electrically controlled interface magnetism, e.g. for spintronics and orbitronics devices.", "method": "", "result": "", "future": "", "summary_zh": "在石墨烯/Fe₃GeTe₂ 界面观察到最高约 230 的轨道 Zeeman 有效 g 因子，并用局域电场调节能级分裂。", "published_journal": "Nature Communications", "published_doi": "https://doi.org/10.1038/s41467-026-78016-8", "method_en": "Graphene/Fe3GeTe2/graphite van der Waals stack; low-temperature STM/STS near 6 K, perpendicular magnetic field to 3 T, tip-height electrostatic gating, DFT/Wannier orbital-moment calculations.", "method_zh": "制备石墨烯/Fe₃GeTe₂/石墨 egrated non-volatile memory", "authors": "K. O. Nikolaev, D. Raskhodchikov, J. Bensmann, S. Niehues, V. D. Bessonov, E. Lomonte, L. Jin, R. Schmidt, J. Kern, S. Michaelis de Vasconcellos, R. Bratschitsch, S. O. Demokritov, W. H. P. Pernice, V. E. Demidov", "corresponding": "", "url": "https://doi.org/10.1038/s41563-026-02778-1", "topic": "Magnetism", "level": "Brief", "summary_en": "This work proposes a zero-field magnonic circuit integrating non-volatile memory by utilizing static magnetization states of waveguiding elements, enabling spin-wave path control without external bias.", "summary": "Low-loss magnetic-insulator spin-wave networks use switchable waveguide magnetization as built-in nonvolatile memory at zero bias field.", "abstract": "Abstract Magnonic circuits that use spin waves for nanoscale signal processing and computing are widely regarded as a promising alternative to traditional semiconductor electronics. However, a key missing component of this information nanotechnology is a feasible approach for the integration of memory directly into spin-wave devices. Here we propose a strategy for the implementation of built-in non-volatile memory, which uses the static magnetization states of waveguiding elements within a magnonic network fabricated from a low-loss magnetic insulator and operating at zero bias magnetic field. We show that switching the magnetization direction in these elements enables efficient control over spin-wave propagation paths. Furthermore, we suggest an approach to achieve low-energy selective magnetization switching in such systems. Our results open new possibilities for the realization of advanced, self-contained magnonic nano-circuits.", "method": "", "result": "", "future": "", "summary_zh": "本研究提出了一种无外加磁场的声波子电路，通过利用波导元件的静态磁化状态集成非易失性存储，实现了自旋波传播路径的控制。", "relevance_score": 74, "relevance_method": "semantic", "relevance_reason": "The work proposes and demonstrates integrated non-volatile memory elements in magnonic circuits operatin  "summary": "A van der Waals photon-ratchet architecture enhances emission and sensing signals from spin defects.", "abstract": "Abstract Spin defects in two-dimensional materials are promising platforms for quantum information technologies and nanoscale sensing. The negatively charged boron vacancy ( $${\\mathrm{V}}_{\\mathrm{B}}^{-}$$ V B − ) in hexagonal boron nitride (hBN) is particularly attractive due to its sensitivity to temperature, magnetic fields, and pressure, but its application is limited by intrinsically weak photoluminescence (PL). Here we demonstrate a van der Waals heterostructure that enhances the PL intensity of $${\\mathrm{V}}_{\\mathrm{B}}^{-}$$ V B − by up to 45× at 4 Kelvin while preserving compatibility with ultrathin optoelectronic platforms. A quasi type-I band alignment at the PbI 2 –defected hBN interface facilitates efficient interlayer coupling to the defect, and strong spectral overlap supports fluorescence resonance energy transfer. Ab initio calculations indicate that this coupling enables a photon-ratcheting mechanism, in which optical absorption in PbI 2 generates a nonlinear polarization that drives $${\\mathrm{V}}_{\\mathrm{B}}^{-}$$ V B − excitation. This process is compatible with interlayer energy transfer while maintaining minimal electronic and spin hybridization and preserving optically detected magnetic resonance (ODMR) contrast. The heterostructure further exhibits improved sensitivity to external magnetic fields. These results establish a route for the enhancement of defect emission via interlayer optical coupling and introduce a general materials strategy for amplifying weak quantum defect signals in nanomaterials.", "method": "", "result": "", "future": "", "summary_zh": "该研究展示了一种范德华异质结构，可在4K温度下将六方氮化硼中带负电的硼空位光致发光强度提高至45倍，增强了量子传感能力。该方法保持了光学检测磁共振对比度，并兼容超薄光电子器件。", "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "This work demonstrates an interlayer photon-ratchet mechanism in a van der Waals heterostructure that greatly enhances spin-defect emission in 2D quantum materials, revealing new physics of optically driven interlayer coupling and quantum d", "feature_candidate": true, "method_en": "The method involves creating a quasi type-I band alignment heterostructure between PbI2 and defected hBN that enables efficient interlayer coupling and fluorescence resonance energy transfer, supported by ab initio calculations indicating a photon-ratcheting excitation mechanism.", "method_zh": "该方法通过构建PbI2与缺陷六方氮化硼间的准I型能带排列异质结构，实现高效的层间耦合和荧光共振能量转移，第一性原理计算表明存在光子棘轮激发机制。", "result_en": "Results show a 45-fold photoluminescence enhancement while preserving spin properties and a concomitant increase in sensitivity to external magnetic fields.", "result_zh": "结果显示光致发光增强45倍，同时保持了自旋性质，并且对外部磁场的敏感度得到提升。", "future_en": "Future work may explore further integration with ultrathin optoelectronic platforms and extend this coupling strategy to other quantum defect systems for amplified emission.", "future_zh": "未来可进一步研究与超薄光电子器件平台的集成，并将该耦合策略推广至其他量子缺陷体系以增强发光。", "physics_advance": "Experimental and theoretical identification of a photon-ratcheting interlayer excitation mechanism enhancing negatively charged boron vacancy emission in defected hBN–PbI2 heterostructure, establishing a new route to amplify weak quantum defect signals.", "ai_in_scope": true}, {"id": "doi-10-1103-gd1k-s125", "doi": "10.1103/gd1k-s125", "type": "Journal", "journal": "PRL", "title": "Chiral skyrmionic superconductivity from doping a Chern Ferromagnet", "authors": "Miguel Gonçalves, Kun Yang, Shi-Zeng Lin", "corresponding": "", "url": "https://doi.org/10.1103/gd1k-s125", "topic": "Superconductivity", "level": "Brief", "summary_en": "The authors propose chiral skyrmionic superconductivity upon doping a Chern ferromagnet.", "summary": "The authors propose chiral skyrmionic superconductivity upon doping a Chern ferromagnet.", "abstract": "", "method": "", "result": "", "future": "", "summary_zh": "理论上探讨陈铁磁体掺杂后出现手性斯格明 : "arxiv-2610-30930", "arxiv_id": "2610.30930", "type": "arXiv", "journal": "arXiv:2610.30930", "journal_ref": "", "title": "Chiroptical Valleytronic in SnSe", "authors": "Yiming Pan, Sotirios Fragkos, Umberto Dellasette, Quentin Courtade, Dominique Descamps, Stéphane Petit, Fabio Caruso, Samuel Beaulieu", "corresponding": "", "url": "https://arxiv.org/abs/2610.30930", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Time- and angle-resolved photoemission reveals helicity-selective valley excitation and sub-picosecond relaxation in SnSe.", "summary": "Time- and angle-resolved photoemission reveals helicity-selective valley excitation and sub-picosecond relaxation in SnSe.", "abstract": "Quantum geometric properties of Bloch electrons play a central role in governing light-matter interactions and transport phenomena in solids. Here, we report quantum-geometric chiroptical selection rules that generate a helicity-dependent momentum-space population imbalance in the group-IV monochalcogenide SnSe. By combining time- and angle-resolved extreme-ultraviolet photoemission spectroscopy with ab initio real-time simulations of photoexcited carrier dynamics, we identify valley-selective excitation at opposite crystal momenta arising from the breaking of time-reversal symmetry under circularly polarized illumination. We theoretically demonstrate that the magnitude of valley circular dichroism is strongly constrained by crystal symmetry through its influence on the quantum geometric tensor, the key quantity underlying valley optical selection rules. The resulting chiroptically induced valley polarization decays on sub-picosecond timescales through intervalley scattering mediated by electron-phonon coupling. Furthermore, we show theoretically that the population imbalance between valleys at opposite momenta gives rise to a helicity-reversible transient photocurrent. These findings provide microscopic insight into how quantum geometry governs valley-selective light-matter interactions, valley polarization, and photocurrent generation in van der Waals materials exhibiting hidden and transient symmetry breaking.", "method": "", "result": "", "future": "", "summary_zh": "利用时间分辨角分辨光电子谱在 SnSe 中观测圆偏振激发引起的谷选择性载流子分布。", "tier": "Nature Communications/Science Advances/PRX", "tier_reason_en": "A substantial conceptual or methodological advance with cross-community relevance.", "tier_reason_zh": "概念或方法进展较显著，可跨多个研究方向应用。", "relevance_score": 80, "relevance_method": "semantic", "relevance_reason": "By combining experiment and ab initio theory, the paper establishes quantum geometric selection rules for valley-resolved chiroptical responses and transient valley polarization, linking crystal symmetry, quantum geometry, and helicity-depe", "feature_candidate": true, "physics_advance": "Experimental and theoretical demonstration of symmetry- and quantum-geometry-governed helicity-dependent valley-selective excitation and dynamics in bulk SnSe", "ai_in_scope": true}, {"id": "arxiv-2610-30766", "arxiv_id": "2610.30766", "type": "arXiv", "journal": "arXiv:2610.30766", "journal_ref": "", "title": "Coulomb-Driven Electronic Textures in Lightly Hole-Doped Cuprates", "authors": "Wei-Wei Yang, Yang Shen, Yuxin Wang, Pengfei Li, Mingpu Qin, Kun Jiang", "corresponding": "", "url": "https://arxiv.org/abs/2610.30766", "topic": "Other Condensed Matter", "level": "Brief", "summary_en": "Poorly screened Coulomb interactions organize electronic textures in lightly hole-doped cuprates.", "summary": "Poorly screened Coulomb interactions organize electronic textures in lightly hole-doped cuprates.", "abstract": "Motivated by recent experiments on Ca$_2$CuO$_2$Cl$_2$, we present a comprehensive study of the interplay between dopants and localized Zhang-Rice singlets in lightly hole-doped cuprates. Owing to the poorly screened Coulomb potential, the interactions between dopants and localized Zhang-Rice singlets favor asymmetric electronic configurations characterized by effective electric \"dipoles\". Using the MPS-based Lanczos method, we show that these localized holes give rise to in-gap bound states within the charge-transfer gap. When tunneling matrix-element effects are included, the bound states exhibit a characteristic $4a_0 \\times 2a_0$ internal structure, consistent with experimental observations. Our results suggest that Coulomb interactions between dopants and localized Zhang-Rice singlets, together with tunneling matrix-element effects, provide a microscopic mechanism for the observed $4a_0$ electronic structures.", "method": "", "result": "", "future": "", "summary_zh": "理论研究轻度空穴掺杂铜氧化物中库仑相互作用驱动的非均匀电子织构。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "The work explains experimentally observed 4a0 electronic structures in lightly hole-doped cuprates by identifying Coulomb-driven electric dipole 'textures' involving dopants and Zhang-Rice singlets, linking disorder, Coulomb interactions, a", "feature_candidate": true, "physics_advance": "Microscopic mechanism showing Coulomb interactions between dopants and localized Zhang-Rice singlets generate in-gap bound states with characteristic 4a0 electronic structure in lightly hole-doped cuprates", "ai_in_scope": true}, {"id": "arxiv-2610-30371", "arxiv_id": "2610.30371", "type": "arXiv", "journal": "arXiv:2610.30371", "journal_ref": "", "title": "Emergent altermagnetism in (LaVO$_3$)$_n$/(LaNiO$_3$)$_m$ superlattices from interfacial charge transfer and octahedral tilts", "authors": "Gustavo H. Cassemiro, Walber H. Brito", "corresponding": "", "url": "https://arxiv.org/abs/2610.30371", "topic": "Magnetism", "level": "Brief", "summary_en": "First-principles calculations predict interfacial-charge-transfer- and octahedral-tilt-induced altermagnetism in LaVO3/LaNiO3 superlattices.", "summary": "First-principles calculations predict interfacial-charge-transfer- and octahedral-tilt-induced altermagnetism in LaVO3/LaNiO3 superlattices.", "abstract": "Using first-principles calculations, we show that altermagnetism emerges in (LaVO$_3$)$_n$/(LaNiO$_3$)$_m$ superlattices, with $(n,m) = (1,1), (2,2)$ and $(2,4)$, from the interplay of interfacial charge transfer and octahedral tilts. Charge transfer drives the system towards the V$^{4+}$ and Ni$^{2+}$ configuration, turning the otherwise paramagnetic nickelate layers into a magnetically active sublattice. The resulting $C$-type antiferromagnetic order, combined with $a^-b^+c^-$ or $a^-b^-c^-$ octahedral tilts, links opposite-spin sublattices only through nonsymmorphic operations, yielding a $d$-wave spin splitting without spin-orbit coupling. Within DFT+U, the splitting reaches 118 meV in the insulating (LVO)$_1$/(LNO)$_1$ superlattice, about twice that calculated for bulk LaVO$_3$, and decreases as the nickelate layers become thicker. Our findings indicate that this splitting is hosted by both the V and Ni sublattices, with nearly half of its weight on oxygen $2p$ states through $p$-$d$ covalency. Interfacial charge transfer thus emerges as a \\textit{design} principle for engineering altermagnetism in oxide heterostructures.", "method": "", "result": "", "future": "", "summary_zh": "第一性原理计算表明 LaVO₃/LaNiO₃ 超晶格的界面电荷转移与八面体倾斜可诱导交替磁性。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "Using first-principles calculations, this work identifies a new mechanism for altermagnetism arising from interfacial charge transfer and structural distortions in oxide superlattices, establishing a concrete design principle for spin-split", "feature_candidate": true, "physics_advance": "Prediction of altermagnetism driven by interfacial charge transfer and octahedral tilts in layered oxide superlattices, leading to d-wave spin splitting without spin-orbit coupling", "ai_in_scope": true}, {"id": "arxiv-2610-30733", "arxiv_id": "2610.30733", "type": "arXiv", "journal": "arXiv:2610.30733", "journal_ref": "", "title": "Ferroelastic Reversal Magnon Thermal Hall Effect in a Fully Compensated Ferrimagnet", "authors": "Yingxi Bai, Zihan Chen, Chengwang Niu, Ming Yang", "corresponding": "", "url": "https://arxiv.org/abs/2610.30733", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "Ferroelastic switching is predicted to reversibly control magnon thermal Hall response in fully compensated ferrimagnets.", "summary": "Ferroelastic switching is predicted to reversibly control magnon thermal Hall response in fully compensated ferrimagnets.", "abstract": "Magnons offer a charge-neutral channel for spin and heat transport, yet reversible and nonvolatile control of their thermal Hall response poses a fundamental challenge in systems with zero net magnetization. Here, we establish ferroelastic switching as an effective route to manipulate magnonic transverse responses in fully compensated ferrimagnets. A minimal Heisenberg-Dzyaloshinskii-Moriya model reveals that ferroelastic switching can re-orientate the lattice anisotropy, which reconstructs the chirality-resolved magnon bands and Berry curvature distribution. Consequently, the two orthogonal fully compensated ferrimagnetic variants related by [C2||C4z] exhibit magnon thermal Hall responses with opposite signs, whereas the response vanishes in the intermediate altermagnetic phase. First-principles calculations further identify monolayer V2SSe as a promising material candidate for realizing the proposed ferroelastic control of transverse magnon transport. Remarkably, ferroelastic switching drives a dual magnonic-electronic band reconstruction, enabling nonvolatile reversal of the magnon thermal Hall effect while producing anisotropic orbital Hall responses and distinct magneto-optical spectra as complementary transport and optical fingerprints. Our findings establish ferroelasticity as an effective route to nonvolatile magnon control and multichannel state identification in zero net magnetization systems.", "method": "", "result": "", "future": "", "summary_zh": "提出通过铁弹性翻转非易失地反转完全补偿亚铁磁体的磁振子热霍尔信号。", "tier": "PRL", "tier_reason_en": "A clear, testable response or experimentally distinctive mechanism of broad condensed-matter interest.", "tier_reason_zh": "提出清晰可检验的响应或具有代表性的实验机制，具有较广凝聚态意义。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "Reveals ferroelastic switching as a means to control magnon thermal Hall effect and chirality in fully compensated ferrimagnets, a new mechanism enabling reversible, nonvolatile transverse magnonic transport control at zero net magnetizatio", "feature_candidate": true, "physics_advance": "Establishing ferroelasticity-driven tunable reversal of magnon thermal Hall effect and band reconstruction in compensated ferrimagnets.", "ai_in_scope": true}, {"id": "arxiv-2610-31142", "arxiv_id": "2610.31142", "type": "arXiv", "journal": "arXiv:2610.31142", "journal_ref": "", "title": "Interaction-enhanced antiferromagnetic correlations in a Kondo ladder with a gapped band structure", "authors": "Tatsuya Kaneko, Ritsuki Hirabayashi, Yutaka Akagi", "corresponding": "", "url": "https://arxiv.org/abs/2610.31142", "topic": "Magnetism", "level": "Brief", "summary_en": "Interactions enhance antiferromagnetic correlations in a Kondo ladder with a gapped band structure.", "summary": "Interactions enhance antiferromagnetic correlations in a Kondo ladder with a gapped band structure.", "abstract": "We investigate magnetic correlations in the two-leg Kondo-Hubbard ladder using the density-matrix renormalization group method. We focus on a parameter regime in which the noninteracting electronic system has a narrow indirect band gap. In this regime, there is no Fermi surface, and the conventional Fermi-surface-based Ruderman-Kittel-Kasuya-Yosida picture is not directly applicable; magnetic correlations between localized spins become weaker as the noninteracting band gap increases. We find that a moderate on-site Coulomb interaction enhances the antiferromagnetic correlations between localized spins. This enhancement, which is also seen in the staggered magnetization induced by a pinning field at the edges, occurs for both ferromagnetic and antiferromagnetic Kondo couplings. Our results show that electron-electron interactions can enhance magnetic correlations between localized spins even when the underlying noninteracting electronic structure is gapped, suggesting an interaction-driven route to magnetic instabilities in narrow-gap Kondo-lattice systems.", "method": "", "result": "", "future": "", "summary_zh": "研究具有能隙能带结构的 Kondo 梯子中相互作用增强的反铁磁关联。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "By demonstrating that electron-electron interactions enhance antiferromagnetic correlations in a narrow-gap Kondo-Hubbard ladder where Fermi-surface approaches fail, this work provides new insight into interaction-driven magnetism beyond co", "feature_candidate": true, "physics_advance": "Discovery that Coulomb interactions enhance antiferromagnetic correlations and magnetic instabilities in narrow-gap Kondo-lattice ladders lacking a Fermi surface", "ai_in_scope": true}, {"id": "arxiv-2610-30929", "arxiv_id": "2610.30929", "type": "arXiv", "journal": "arXiv:2610.30929", "journal_ref": "", "title": "Piezo-Kerr effect in altermagnets and noncollinear antiferromagnets", "authors": "Yuqi Liu, Qiu-Shi Huang, Xinfeng Chen, Yilin Han, Run-Wu Zhang, Zhi-Ming Yu, Yugui Yao", "corresponding": "", "url": "https://arxiv.org/abs/2610.30929", "topic": "Magnetism", "level": "Brief", "summary_en": "Strain activates symmetry-forbidden Kerr rotation in 16 of 122 magnetic point groups, with calculated signals of tens to hundreds of millidegrees.", "summary": "Strain activates symmetry-forbidden Kerr rotation in 16 of 122 magnetic point groups, with calculated signals of tens to hundreds of millidegrees.", "abstract": "Symmetry is usually viewed as a constraint on physical responses, but it can also be used to design the fields that control them. Here, we adopt the representation-matching principle used to identify conjugate fields of order parameters and apply it to response tensors. A linear coupling, the key ingredient for sign-switching control, is symmetry-allowed when a component (or a combination of components) of the control field and the selected response component share the same irreducible representation of the magnetic point group (MPG) of the system. Applied to the magneto-optical Kerr effect, this principle yields a piezo-Kerr effect, in which specific strain combinations activate a Kerr response forbidden in the unstrained state. Enumerating all 122 MPGs, we identify 16 groups in which the unstrained Kerr response is forbidden while a linear strain-induced contribution is allowed. These groups are realized by altermagnets and noncollinear antiferromagnets with symmetry-enforced vanishing net magnetization. The active strain channels and the associated first-order sign reversals follow directly from symmetry. First-principles calculations for bulk MnTe$_{2}$ and CoF$_{2}$, and Cr$_{2}$Se$_{2}$O and Cr$_{2}$Te$_{2}$O monolayers confirm these predictions. In these materials, the Kerr rotation vanishes without strain, whereas 0.5-3% strain produces rotations ranging from tens to hundreds of millidegrees, and reversing the matched strain channel reverses the Kerr sign. These results establish a general route to large and switchable Kerr responses emerging from symmetry-forbidden states in compensated magnets.", "method": "", "result": "", "future": "", "summary_zh": "提出应变激活原本对称性禁戒的 Kerr 响应；122 种磁点群中有 16 种允许线性效应，预测 Kerr 旋转可达数十至数百毫度。", "tier": "PRL", "tier_reason_en": "A general symmetry selection rule with quantitative material predictions and a clean, testable sign-reversal signature.", "tier_reason_zh": "普适对称性选择定则、定量材料预测及干净可检验的符号翻转特征，具备 PRL 水平潜力。", "method_en": "Magnetic-point-group representation analysis over all 122 MPGs, followed by first-principles magneto-optical conductivity and strain calculations for bulk MnTe2, CoF2 and monolayer Cr2Se2O/Cr2Te2O.", "method_zh": "枚举全部 122 种磁点群的表示，计算线性应变–Kerr 张量；随后对块体 MnTe₂、CoF₂ 及单层 Cr₂Se₂O/Cr₂Te₂O 做第一性原理应变与磁光电导计算。", "result_en": "The central equation is θ_i = Σ_jk Λ_i,jk ε_jk, where the time-reversal-odd piezo-Kerr tensor Λ is symmetry-constrained. Fig. 1 illustrates a zero-background Kerr signal activated and sign-reversed by strain. Table 1 identifies 16 MPGs allowing the response; for 4′/mm′m, θ_z ∝ ε_xx−ε_yy. The calculated Cr2Se2O response (Fig. 4) reaches ~50 mdeg at 1% and 164 mdeg at 3% strain (photon energy 1.44 eV). The authors extend representation matching from order parameters to response tensors.", "result_zh": "核心公式为 θ_i=Σ_jk Λ_i,jk ε_jk，其中时间反演奇的 piezo-Kerr 张量 Λ 由磁点群对称性约束。Fig. 1 展示零背景 Kerr 信号被应变激活并随应变反向翻转；Table 1 列出允许该响应的 16 种磁点群，例如 4′/mm′m 中 θ_z∝ε_xx−ε_yy；Fig. 4 计算单层 Cr₂Se₂O 在 1% 应变下约 50 mdeg、3% 下约 164 mdeg（光子能量 1.44 eV）。作者将序参量的表示匹配原则推广到响应张量。", "future_en": "Test bulk CoF2 or MnTe2 with piezo-driven AC strain and lock-in Kerr rotation; use orthogonal εxx−εyy channels and magnetic-domain training to verify linearity and sign reversal before seeking transverse transport analogues.", "future_zh": "优先在块体 CoF₂ 或 MnTe₂ 上施加压电 AC 应变，用锁相 Kerr 测量；对比 εxx−εyy 的正负通道并训练磁畴，验证线性关系与符号翻转，再寻找相应横向输运响应。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "This work identifies a symmetry-enabled piezo-Kerr effect in altermagnets and noncollinear AFMs, showing a new mechanism for strain-controlled magneto-optical response in compensated magnets, supported by first-principles calculations.", "feature_candidate": true, "physics_advance": "Prediction and first-principles confirmation of strain-induced Kerr effects absent in unstrained altermagnets and compensated antiferromagnets, revealing a new linear coupling between strain and magneto-optical response controlled by magnetic point group symme", "ai_in_scope": true}, {"id": "arxiv-2606-10420", "arxiv_id": "2606.10420", "type": "arXiv", "journal": "arXiv:2606.10420", "journal_ref": "", "title": "Superheating field of clean superconductors near the type-I--type-II boundary: the low-temperature Meissner stability limit of niobium", "authors": "Takayuki Kubo", "corresponding": "", "url": "https://arxiv.org/abs/2606.10420", "topic": "Superconductivity", "level": "Brief", "summary_en": "The work calculates the low-temperature superheating field and Meissner stability near the type-I/type-II boundary.", "summary": "The work calculates the low-temperature superheating field and Meissner stability near the type-I/type-II boundary.", "abstract": "We calculate the low-temperature superheating field $B_{\\rm sh}$ of clean superconductors near the boundary between type-I and type-II superconductivity, with particular emphasis on Nb. Ginzburg--Landau theory is not applicable at low temperatures, while previous microscopic calculations have been limited to either the large-$κ$ regime or the dirty limit. The clean, low-$κ$ regime relevant to Nb has therefore remained unresolved. We solve the self-consistent nonlinear nonlocal Eilenberger problem for the Meissner state and then analyze its stability against small perturbations. For a Nb-like material with $κ_{\\rm GL}=0.7$, we obtain $B_{\\rm sh}\\simeq 290\\,{\\rm mT}$ at $T/T_c=0.2$, using $B_{c0}\\simeq 200\\,{\\rm mT}$. For a TESLA-shaped Nb accelerator cavity, this corresponds to an intrinsic Meissner-stability limit of about $67\\,{\\rm MV/m}$.", "method": "", "result": "", "future": "", "summary_zh": "研究洁净超导体在 I 型与 II 型边界附近的低温过热场及 Meissner 态稳定性。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 75, "relevance_method": "semantic", "relevance_reason": "Provides a new microscopic calculation of low-temperature superheating fields in clean niobium near the type-I/II boundary, resolving an important regime inaccessible to Ginzburg-Landau theory and relevant to intrinsic stability limits in s", "feature_candidate": true, "physics_advance": "First self-consistent microscopic solution of Meissner-state stability and superheating field in clean niobium near the type-I/II superconductivity boundary.", "ai_in_scope": true}, {"id": "arxiv-2610-31184", "arxiv_id": "2610.31184", "type": "arXiv", "journal": "arXiv:2610.31184", "journal_ref": "", "title": "Anomalous polar chains in halide perovskites", "authors": "Erik Fransson, Apinya Ngoipala, Priyanka Deswal, Ethan Berger, Nicholas C. Bristowe, Paul Erhart, Julia Wiktor", "corresponding": "", "url": "https://arxiv.org/abs/2610.31184", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Molecular dynamics identifies tens-of-nanometers-long, nanosecond-lived polar chains in nominally cubic CsGeBr3.", "summary": "Molecular dynamics identifies tens-of-nanometers-long, nanosecond-lived polar chains in nominally cubic CsGeBr3.", "abstract": "Local polar distortions, their collective ordering, and their field-driven reversal have been studied extensively in ferroelectric perovskites for decades. Here we identify an unusual behavior in the ferroelectric halide perovskite CsGeBr3 using large-scale molecular dynamics with first-principles-trained interatomic potentials. In its nominally cubic phase the Ge off-centering forms one-dimensional polar chains that extend over at least tens of nanometers and relax on nanosecond timescales, four orders of magnitude slower than in BaTiO3 and PbTiO3, with CsSnBr3 in between. The cubic CsGeBr3 phase is a dynamically disordered state in which oppositely polarized chains flip throughout the crystal, and a long-lived one-dimensional local polarization coexists with zero net polarization. A simple three-dimensional perovskite thus hosts long-ranged one-dimensional polar correlations with remarkably slow dynamics. In the ferroelectric phase the same chains set a one-dimensional switching mechanism, in which the polarization reverses chain by chain.", "method": "", "result": "", "future": "", "summary_zh": "模拟发现 CsGeBr₃ 名义立方相中存在寿命很长、长度达数十纳米的一维极化链。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "A focused materials or mechanism study with a specialist audience.", "tier_reason_zh": "材料或机制研究较扎实，主要面向相关专业领域。", "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "Identification of unusually long-lived, one-dimensional polar chains with slow dynamics in cubic halide perovskite CsGeBr3 reveals a novel type of polar order and novel switching mechanism at the nanoscale, extending understanding of polar ", "feature_candidate": true, "physics_advance": "Discovery of long-range, slowly relaxing one-dimensional polar chains and chain-by-chain switching dynamics in nominally cubic halide perovskite", "ai_in_scope": true}, {"id": "arxiv-2610-30556", "arxiv_id": "2610.30556", "type": "arXiv", "journal": "arXiv:2610.30556", "journal_ref": "", "title": "Field-free superconducting diode and tunable vortex dynamics in NbN/FePt stripe-domain heterostructures", "authors": "Juan C. Zapata, Emilio De Biasi, Martin Sirena, Jeehoon Kim, Nestor Haberkorn", "corresponding": "", "url": "https://arxiv.org/abs/2610.30556", "topic": "Superconductivity", "level": "Brief", "summary_en": "NbN/FePt stripe-domain heterostructures exhibit a field-free superconducting diode efficiency of roughly 50–60%, retaining 35–40% with an AlN spacer.", "summary": "NbN/FePt stripe-domain heterostructures exhibit a field-free superconducting diode efficiency of roughly 50–60%, retaining 35–40% with an AlN spacer.", "abstract": "We demonstrate reconfigurable, field-free superconducting diode behavior in NbN/FePt and NbN/AlN/FePt heterostructures with remanent stripe domains in the FePt layer. NbN films 10 nm thick are capped either directly with FePt or through a thin AlN spacer, which reduces electronic proximity effects while preserving magnetic coupling through stray fields. At zero applied magnetic field, the superconducting diode efficiency reaches approximately 50--60% in NbN/FePt when the stripes are perpendicular to the current and is strongly reduced when they are parallel. The diode effect persists in NbN/AlN/FePt with efficiencies reaching approximately 35--40%, supporting a magnetic origin of the nonreciprocity. We interpret the response as asymmetric vortex transport in the remanent magnetic landscape, with preferential edge vorticity and a Lorentz force that favors inward flux injection or outward motion depending on current polarity. Under applied perpendicular magnetic fields, the interplay between the external field and the magnetic stray fields modifies the flux-flow instability and the apparent instability velocity inferred from transport, with values below those reported for bare NbN films. These results show that stripe-domain ferromagnetic overlayers provide a reconfigurable route to control superconducting nonreciprocity and flux-flow stability in NbN-based heterostructures.", "method": "", "result": "", "future": "", "summary_zh": "在 NbN/FePt 条纹磁畴异质结构中实现零外场超导二极管，效率约 50–60%，加入 AlN 隔层后仍保留约 35–40%。", "tier": "PRL", "tier_reason_en": "A clear, testable response or experimentally distinctive mechanism of broad condensed-matter interest.", "tier_reason_zh": "提出清晰可检验的响应或具有代表性的实验机制，具有较广凝聚态意义。", "relevance_score": 70, "relevance_method": "semantic", "relevance_reason": "The paper experimentally demonstrates reconfigurable, field-free superconducting diode behavior and asymmetric vortex dynamics controlled via ferromagnetic stripe domains, providing a novel route to control superconducting nonreciprocity an", "feature_candidate": true, "physics_advance": "Discovery of magnetic domain-controlled field-free superconducting diode effect and tunable vortex dynamics in NbN/FePt heterostructures.", "ai_in_scope": true}, {"id": "arxiv-2610-30684", "arxiv_id": "2610.30684", "type": "arXiv", "journal": "arXiv:2610.30684", "journal_ref": "", "title": "Impact of localized $4f$ magnetism on Berry curvature and the intrinsic anomalous Hall effect in CeRu$_2$Si$_2$", "authors": "Takehiro Kobayashi, Shunsuke Hirai, Ibuki Terada, Michi-To Suzuki", "corresponding": "", "url": "https://arxiv.org/abs/2610.30684", "topic": "Magnetism", "level": "Brief", "summary_en": "Localized Ce 4f magnetism can induce conduction-band exchange splitting and intrinsic Berry-curvature Hall response in CeRu2Si2.", "summary": "Localized Ce 4f magnetism can induce conduction-band exchange splitting and intrinsic Berry-curvature Hall response in CeRu2Si2.", "abstract": "The intrinsic anomalous Hall effect (AHE), originating from Berry curvature, has been extensively studied in $f$-electron systems, including Ce-based compounds. However, how the magnetism of localized $f$ electrons affect the intrinsic AHE remains unclear. Here, we investigate this issue in CeRu$_2$Si$_2$ by calculating the intrinsic anomalous Hall conductivity (AHC) for several occupied Ce-$4f$ states using first-principles LDA+$U$ calculations combined with Wannier interpolation method. We find that the intrinsic AHC remains finite even when the Ce-$4f$ states are localized and do not contribute directly to the Fermi surface, and that its magnitude depends on which Ce-$4f$ state is occupied. We show that localized $4f$-electron magnetism induces exchange splitting in the conduction bands, generating Berry curvature in specific regions near the Fermi surface. This mechanis Okazaki", "corresponding": "Shogo Yoshida; Ryuji Okazaki", "url": "https://arxiv.org/abs/2610.30547", "topic": "Superconductivity", "level": "Brief", "summary_en": "Thermopower measured parallel and perpendicular to Ru lamellae in Sr2RuO4–Ru eutectics is anisotropic; local strain modeling captures its sign and approximate magnitude.", "summary": "Thermopower measured parallel and perpendicular to Ru lamellae in Sr2RuO4–Ru eutectics is anisotropic; local strain modeling captures its sign and approximate magnitude.", "abstract": "The Sr2RuO4-Ru eutectic system, in which metallic Ru inclusions are embedded in a Sr2RuO4 matrix, exhibits an enhanced superconducting onset temperature of about 3 K, known as the 3-K phase. Here we investigate the in-plane thermoelectric response of this eutectic system in the normal state and find a pronounced anisotropy in the thermopower for thermal gradients applied parallel and perpendicular to the Ru lamellae. To clarify its origin, we combine thermopower measurements with electronic-structure-based transport calculations and finite-element modeling of the local strain distribution generated by the thermal-expansion mismatch between Sr2RuO4 and Ru. The calculations show that uniaxial compression of Sr2RuO4 produces a sizable thermopower anisotropy through modification of the Fermi surfaces. When an idealized spatially inhomogeneous strain field around the Ru lamellae is included, the observed sign and qualitative magnitude of the anisotropy are reproduced more closely than in a simple unstrained two-component model. These results are consistent with a substantial contribution from strain-induced changes in the Sr2RuO4 electronic structure near the interfaces, although contributions from interfacial phase mixing and three-dimensional transport connectivity cannot be excluded.", "method": "", "result": "", "future": "", "summary_zh": "在 Sr₂RuO₄–Ru 共晶中测得相对 Ru 片层平行与垂直方向的热电势各向异性，局域应变模型解释其符号和量级。", "tier": "PRB/Physical Review Materials", "tier_reason_en": "Careful Seebeck and strain-model comparison; its central interpretation is qualitative and based on one eutectic sample.", "tier_reason_zh": "Seebeck 与应变模拟结合较完整，但目前主要是单块共晶样品上的定性机制论证。", "method_en": "Floating-zone-grown Sr2RuO4–Ru eutectic with ~2% visible Ru lamellae; steady-state Seebeck measurements for heat gradients parallel/perpendicular to lamellae; DFT Boltzmann transport and finite-element strain maps.", "method_zh": "使用浮区法生长的 Sr₂RuO₄–Ru 共晶（表面 Ru 片层面积约 2%）；沿片层平行/垂直方向测稳态 Seebeck 系数，结合 DFT Boltzmann 输运和有限元局域应变模拟。", "result_en": "Fig. 1 compares Sxx and Syy of the eutectic with a pure Sr2RuO4 reference and establishes anisotropy tied to lamellar orientation. Figs. 2–3 examine uniaxial-strain-driven Fermi-surface changes and the spatial strain distribution near Ru. Fig. 4 shows that an unstrained two-component mixing model produces <1% anisotropy, while a finite-element strain-informed calculation gives the observed sign and a closer magnitude. The authors argue that thermopower is a sensitive normal-state probe of interfacial strain associated with the 3-K superconducting phase.", "result_zh": "Fig. 1 比较共晶沿 Ru 片层垂直和平行方向的 Sxx、Syy，并以纯 Sr₂RuO₄ 为参照；Figs. 2–3 研究单轴应变导致的费米面变化和 Ru 附近的空间应变分布；Fig. 4 表明简单无应变双组分混合模型只给出小于 1% 的各向异性，而纳入有限元应变后可重现实验符号并更接近量级。作者认为热电势是与 3-K 界面超导有关的局域应变的灵敏常态探针。", "future_en": "On strain-controlled Sr2RuO4, measure Sxx−Syy and elastocaloric response on the same crystal while tracking Tc and the van-Hove-sensitive thermopower; repeat with several eutectic lamellar orientations.", "future_zh": "可在同一块受控应变 Sr₂RuO₄ 样品上同时追踪 Sxx−Syy、弹热响应、Tc 及 van Hove 敏感的热电势；再比较不同 Ru 片层取向的共晶样品。", "relevance_score": 62, "relevance_method": "semantic", "relevance_reason": "The paper demonstrates anisotropic thermoelectric transport linked to interface strain effects in Sr2RuO4-Ru eutectics, providing new insights into strain-modified electronic structure and thermopower anisotropy.", "feature_candidate": false, "physics_advance": "Experimental evidence and modeling of strain-induced anisotropic thermoelectric transport caused by Fermi surface modifications near Ru lamellae interfaces in Sr2RuO4, elucidating local strain effects on electronic properties.", "ai_in_scope": true}, {"id": "arxiv-2610-30172", "arxiv_id": "2610.30172", "type": "arXiv", "journal": "arXiv:2610.30172", "journal_ref": "", "title": "Resonant-pair energy return beyond the early Green-Kubo plateau in a quartic chain", "authors": "Julian Olszewski, Zijian Liu, Jie Xu", "corresponding": "", "url": "https://arxiv.org/abs/2610.30172", "topic": "Thermal & Thermoelectric", "level": "Brief", "summary_en": "This study identifies a resonant energy return mechanism in a weakly coupled quartic oscillator chain affecting the early Green–Kubo conductivity plateau. It quantitatively describes how resonant neighbor pairs exchange and coherently return energy.", "summary": "Coherent energy return between resonant oscillators modifies the early Green–Kubo transport plateau in a quartic chain.", "abstract": "Distinguishing rapid local energy exchange from sustained transport matters when thermal conductivity is inferred from finite simulations. In a weakly coupled chain of separable quartic oscillators, we identify a quantitative mechanism that changes an early Green--Kubo plateau: resonant neighbors exchange energy and coherently return it. The pair heat-current integral maps to the classical pendulum trapping response. Quartic homogeneity gives an energy-independent reference period $T_{\\rm lib}=7.77ε^{-1/2}$, where $ε$ is the coupling. Without fitted parameters, the leading response predicts a negative first minimum at $0.952T_{\\rm lib}$ with depth $-0.74$ times the independent-cell exchange coefficient. Isolated-pair simulations test this reference and resolve finite-coupling corrections. The chain reaches its first minimum on the same time scale, with a shallower minimum and a small later residual. Comparisons with chaotic cells and energy-conserving noise show regimes in which coherent return is absent or interrupted over the measured windows. These finite-time results provide a quantitative reference for separating the early exchange plateau from subsequent correlated dynamics.", "method": "", "result": "", "future": "", "summary_zh": "本研究在弱耦合四次振子链中发现谐振能量回返机制，影响早期Green–Kubo导热系数的平稳期，定量描述了谐振相邻对能量交换及相干回返。", "tier": "Uncertain", "tier_reason_en": "The paper provides quantitative theoretical and numerical insights into fundamental heat transport mechanisms, suitable for specialized physics journals pending broader impact validation.", "tier_reason_zh": "论文对基础热传输机制进行定量理论和数值研究，有助于专业物理期刊发表，视影响范围待定。", "relevance_score": 60, "relevance_method": "semantic", "relevance_reason": "Presents a detailed study of resonant energy exchange and coherent return in a classical quartic oscillator chain, elucidating microscopic mechanisms relevant to interpreting thermal transport in model nonlinear lattices.", "feature_candidate": false, "method_en": "The authors theoretically map the pair heat-current integral to a classical pendulum trapping response and validate predictions with isolated-pair simulations and comparisons to noisy and chaotic systems.", "method_zh": "作者将对偶热流积分映射至经典摆锁定响应，通过孤立对模拟及与噪声和混沌系统的比较验证理论预测。", "result_en": "Predicted negative minima of the heat-current integral appear at characteristic time scales without fitting parameters, matching simulations. Coherent energy return is shown to be absent or disrupted under certain conditions.", "result_zh": "热流积分的负极值出现在特征时间尺度上且无拟合参数，与模拟吻合。证明在特定条件下相干能量回返缺失或被打断。", "future_en": "Further studies could investigate how introducing controlled perturbations affects the coherent return and long-time conductivity behaviors experimentally or via simulation.", "future_zh": "后续研究可通过实验或模拟探讨受控扰动如何影响相干回返及长期导热行为。", "physics_advance": "Quantitative identification of resonant-pair coherent energy return phenomena affecting early-time thermal transport signatures in quartic oscillator chains.", "ai_in_scope": true}, {"id": "arxiv-2610-30665", "arxiv_id": "2610.30665", "type": "arXiv", "journal": "arXiv:2610.30665", "journal_ref": "", "title": "From phase analysis to phase tracking: a robust approach to atomic-scale strain mapping", "authors": "Ying Han, Yuan Tian", "corresponding": "", "url": "https://arxiv.org/abs/2610.30665", "topic": "Topology & Transport", "level": "Brief", "summary_en": "This paper introduces geometric phase tracking analysis (GPTA), an improved method for atomic-scale strain mapping that dynamically tracks Bragg reflections in real space, overcoming limitations of standard geometric phase analysis under large strain or grain misorientation.", "summary": "A Bragg-peak-tracking strain-mapping method reduces failure rates from 27% to 11.5% across 13,795 microscopy images.", "abstract": "Atomic-scale strain governs the electronic, ferroic and mechanical properties of materials, and atomic-resolution microscopy measures it most directly. Geometric phase analysis (GPA) is the standard tool, but it fails when a Bragg reflection moves outside its fixed Fourier aperture under large strain or rotation, or in misoriented grains. Here we introduce geometric phase tracking analysis (GPTA), whose Fourier aperture tracks the Bragg reflection at each pixel in real space. A narrow aperture can therefore reject noise without losing a displaced reflection. On 13,795 simulated and experimental atomic-resolution images under various imaging conditions, GPTA reduces GPA's failure rate from 27% to 11.5% with up to 335 times better accuracy. It also gives strain and dislocation maps across grains, resistance to dynamical-scattering extinction, and a confidence map, capabilities that GPA lacks. Tracking the aperture combines reciprocal-space dose efficiency with real-space spatial resolution and extends atomic-scale strain metrology to beam-sensitive materials and challenging imaging conditions.", "method": "", "result": "", "future": "", "summary_zh": "本文提出几何相位追踪分析（GPTA）方法，通过实时跟踪折射点，改进原子级应变映射，克服了标准几何相位分析在大应变和晶粒错位条件下的不足。", "tier": "Uncertain", "tier_reason_en": "This methodological advancement significantly improves strain mapping accuracy, with strong practical value for microscopy, but awaits widespread adoption to determine publication impact level.", "tier_reason_zh": "该方法改进显著提升应变映射精度，具备强大显微镜应用价值，但需进一步推广验证以确认发表影响层次。", "relevance_score": 55, "relevance_method": "semantic", "relevance_reason": "Develops a new robust phase-tracking technique for atomic-scale strain mapping overcoming limitations of geometric phase analysis, enabling more accurate strain measurements which impact understanding of strain-dependent materials physics.", "feature_candidate": false, "method_en": "GPTA uses a Fourier aperture that adaptively tracks Bragg reflections at each pixel, reducing noise and enabling strain and dislocation mapping even under challenging imaging conditions.", "method_zh": "GPTA采用自适应傅里叶孔径追踪每像素处的折射点，降低噪声并实现复杂成像条件下的应变和位错映射。", "result_en": "GPTA reduces GPA failure rates from 27% to 11.5%, improves accuracy by up to 335 times, and enables strain mapping across grains and in beam-sensitive materials with high confidence.", "result_zh": "GPTA将GPA失败率从27%降至11.5%，精度提升最多达335倍，实现了晶粒间和电子束敏感材料中的高置信度应变映射。", "future_en": "Future work might apply GPTA broadly in electron microscopy for real-time strain analysis in diverse material systems, and extend it to other types of scattering data.", "future_zh": "未来工作可将GPTA广泛应用于电子显微镜，实现多样材料体系的实时应变分析，并延展至其他散射数据类型。", "physics_advance": "Introduction of phase tracking microscopy algorithm enabling reliable atomic-scale strain mapping beyond previous Fourier aperture limitations.", "ai_in_scope": true}, {"id": "arxiv-2610-30978", "arxiv_id": "2610.30978", "type": "arXiv", "journal": "arXiv:2610.30978", "journal_ref": "", "title": "Role of Chalcogen-p States in the Optical Response of Bulk PtSe2 and PtTe2", "authors": "Ji Eun Lee, R. Mathew Roy, Premakumar Yanda, Chandra Shekhar, Claudia Felser, Martin Dres <script>
'use strict';
const AVAILABLE_REPORTS={"2026-10-23": {"zh": "reports/2026-10-23.zh.pdf", "en": "reports/2026-10-23.en.pdf"}, "2026-10-22": {"zh": "reports/2026-10-22.zh.pdf", "en": "reports/2026-10-22.en.pdf"}, "2026-10-24": {"en": "reports/2026-10-24.en.pdf", "zh": "reports/2026-10-24.zh.pdf"}};
const issues=JSON.parse(document.getElementById('issues-data').textContent);
const TOPIC_ZH={'All':'全部','Superconductivity':'超导','Thermal & Thermoelectric':'热输运与热电','Magnetism':'磁性','Materials & Growth':'材料与晶体生长','Topology & Transport':'拓扑与输运','Correlated Electrons':'关联电子','Low-dimensional & Optical':'低维与光学','Other Condensed Matter':'其他凝聚态'};
const STR={

 zh:{kicker:'每日凝聚态物理文献速递',title:'凝聚态物理文献',subtitle:'量子材料实验 · 最新论文 · Journal Club',archive:'往期归档',issue:'期刊速递',untitled:'每日文献',papers:'篇论文',featured:'篇重点精读',pdfEn:'Journal Club PDF · English ↗',pdfZh:'Journal Club PDF · 中文 ↗',search:'搜索论文标题、作者、材料与研究结果…',all:'全部',shown:'篇符合条件',indexed:'篇收录',feature:'重点精读',brief:'文献索引',corresponding:'通讯作者',estimated:'预估期刊档次',actualJournal:'实际发表期刊',tierReason:'评级理由',read:'阅读详细笔记 +',close:'收起笔记 −',methods:'研究方法',findings:'作者主要发现',followup:'我们可以做什么',fullText:'阅读论文原文 ↗',empty:'当前筛选条件下没有论文。',footer:'每日凝聚态物理文献 · 每篇均附原始论文链接'}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const JOURNAL_JIF_2025=Object.freeze({

 'nature communications':18.1,'nature physics':18.0,
 'physical review x':16.8,'prx':16.8,'science advances':13.9,
 'pnas':9.5,'proceedings of the national academy of sciences':9.5,

function journalImpact(p){
 // Classify by discovery source; arXiv articles stay last even if accepted by a journal.
 if(p.type==='arXiv'||p.arxiv_id||/^arxiv\b/i.test(String(p.journal||'')))return -Infinity;
 const name=String(p.journal||'').trim().toLowerCase().replace(/\s+/g,' ');
 return JOURNAL_JIF_2025[name]??-1;
}
function journalOrder(a,b){
 const x=journalImpact(a),y=journalImpact(b);
 if(x!==y)return y>x?1:-1;
 return String(a.title||'').localeCompare(String(b.title||''));
}

function field(p,name){
  const en=p[name+'_en'],zh=p[name+'_zh'];
  if(lang==='en')return en||((name==='summary')?(p.abstract||p.summary||''):(p[name]||''));

 const reportLinks=languageOrder.filter(l=>reports[l]).map(l=>`<a class="pdf ${l===lang?'current':''}" href="${esc(reports[l])}" target="_blank" rel="noopener" lang="${l==='zh'?'zh-CN':'en'}">${esc(l==='zh'?t.pdfZh:t.pdfEn)}</a>`).join('');
 const issueTitle=(lang==='zh'&&issue.title_zh)||issue.title||t.untitled;

 const types=['All',...new Set(issue.papers.map(x=>x.topic))];
 byId('topics').innerHTML=types.map(tp=>`<button type="button" class="chip ${topic===tp?'active':''}" data-topic="${esc(tp)}">${esc(displayTopic(tp))}</button>`).join('');
 byId('topics').querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>{topic=b.dataset.topic;render()}));

 const papers=issue.papers.filter(p=>(topic==='All'||p.topic===topic)&&[

 ].join(' ').toLocaleLowerCase().includes(q)).sort((a,b)=>

 byId('papers').innerHTML=papers.map((p,i)=>{
   const isFeatured=p.level==='Feature';
   const prior=papers[i-1];
   const heading=(i===0||isFeatured!==(prior.level==='Feature'))?

   const summary=field(p,'summary'),method=field(p,'method'),result=field(p,'result'),future=field(p,'future'),reason=field(p,'tier_reason');
   const details=[p.published_journal?`<p><strong>${esc(t.actualJournal)}</strong> — ${p.published_doi?`<a href="${esc(p.published_doi)}" target="_blank" rel="noopener">${esc(p.published_journal)} ↗</a>`:esc(p.published_journal)}</p>`:'',p.tier?`<p><strong>${esc(t.estimated)}</strong> — ${esc(p.tier)}${reason?' · '+esc(reason):''}</p>`:'',method?`<p><strong>${esc(t.methods)}</strong> — ${esc(method)}</p>`:'',result?`<p><strong>${esc(t.findings)}</strong> — ${esc(result)}</p>`:'',future?`<p><strong>${esc(t.followup)}</strong> — ${esc(future)}</p>`:''].join('');
   return `${heading}<article class="paper" id="${esc(p.id)}"><div class="topline"><div class="label ${p.level==='Feature'?'feature':''}">${esc(displayTopic(p.topic))} · ${esc(p.level==='Feature'?t.feature:t.brief)}</div><span class="pub">${esc(p.journal)}</span></div><h3><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)} ↗</a></h3><div class="authors">${esc(p.authors)}${p.corresponding&&p.corresponding!=='—'?' · '+esc(t.corresponding)+': '+esc(p.corresponding):''}</div>${summary?`<p class="abstract">${esc(summary)}</p>`:''}${details?`<button type="button" class="expand">${esc(t.read)}</button><div class="details" hidden>${details}<p><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(t.fullText)}</a></p></div>`:''}</article>`;
 }).join('')||`<div class="empty">${esc(t.empty)}</div>`;
 byId('papers').querySelectorAll('.expand').forEach(b=>b.addEventListener('click',()=>toggleNotes(b)));
}
byId('lang-en').addEventListener('click',()=>chooseLanguage('en'));
byId('lang-zh').addEventListener('click',()=>chooseLanguage('zh'));
byId('search').addEventListener('input',render);
render();
</script></body></html>
