nization of transcriptomic regulation at the system level. Here, we analyze the nurse-to-forager transition in worker honeybees ( Apis mellifera ) from ", "summary": "Division of labor in social insects is enabled by coordinated changes in physiology, neural signaling, and gene regulation, yet it remains unclear to what extent behavioral maturation reflects incremental changes in individual genes and/or a reorganization of transcriptomic regulation at the system level. Here, we analyze the nurse-to-forager transition in worker honeybees ( Apis mellifera ) from ", "abstract": "Division of labor in social insects is enabled by coordinated changes in physiology, neural signaling, and gene regulation, yet it remains unclear to what extent behavioral maturation reflects incremental changes in individual genes and/or a reorganization of transcriptomic regulation at the system level. Here, we analyze the nurse-to-forager transition in worker honeybees ( Apis mellifera ) from a network perspective, treating the transcriptome as a gene–gene correlation system whose global organization reflects collective regulatory states. Using fat body gene expression data across five developmental time points that span an interval of behavioral transition, we construct signed gene–gene correlation networks and quantify their macro- and mesostate properties. We then descend to the level of the gene and construct microstate gene lists of interacting genes. Behavioral maturation of worker honeybees is accompanied by coordinated, nonmonotonic changes in global network structure rather than simple global shifts in interaction strength across the network. Early stages exhibit broadly positive, globally synchronized correlations, whereas later stages show increased modular segregation and the emergence of antagonistic gene–gene relationships. Despite this differentiation, networks remain fully connected with high global efficiency, consistent with a flexible small-world–like organization. Positive correlations primarily support global integration, while negative correlations act as localized, boundary-enforcing constraints. Negative correlations form a structured pattern of antagonism that is sparse and module-specific, occurring primarily between functional gene modules rather than within them. Network layouts and module analyses reveal two polarized, attractor-like regulatory states, a structure recapitulated in a vitellogenin-centered subnetwork and consistent with prior experimental perturbation studies.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78802-4", "doi": "10.1038/s41467-026-78802-4", "type": "Journal", "journal": "Nature Communications", "title": "A van der Waals photon-ratchet for enhancing spin-defect emission and quantum sensing", "authors": "E. Mayner, Y. Zhumagulov, C. de Giorgio et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78802-4", "topic": "Magnetism", "level": "Brief", "summary_en": "Abstract Spin defects in two-dimensional materials are promising platforms for quantum information technologies and nanoscale sensing. The negatively charged boron vacancy ( $${\\mathrm{V}}_{\\mathrm{B}}^{-}$$ V B − ) in hexagonal boron nitride (hBN) is particularly attractive due to its sensitivity to temperature, magnetic fields, and pressure, but its application is limited by intrinsically weak p", "summary": "Abstract Spin defects in two-dimensional materials are promising platforms for quantum information technologies and nanoscale sensing. The negatively charged boron vacancy ( $${\\mathrm{V}}_{\\mathrm{B}}^{-}$$ V B − ) in hexagonal boron nitride (hBN) is particularly attractive due to its sensitivity to temperature, magnetic fields, and pressure, but its application is limited by intrinsically weak p", "abstract": "Abstract Spin defects in two-dimensional materials are promising platforms for quantum information technologies and nanoscale sensing. The negatively charged boron vacancy ( $${\\mathrm{V}}_{\\mathrm{B}}^{-}$$ V B − ) in hexagonal boron nitride (hBN) is particularly attractive due to its sensitivity to temperature, magnetic fields, and pressure, but its application is limited by intrinsically weak photoluminescence (PL). Here we demonstrate a van der Waals heterostructure that enhances the PL intensity of $${\\mathrm{V}}_{\\mathrm{B}}^{-}$$ V B − by up to 45× at 4 Kelvin while preserving compatibility with ultrathin optoelectronic platforms. A quasi type-I band alignment at the PbI 2 –defected hBN interface facilitates efficient interlayer coupling to the defect, and strong spectral overlap supports fluorescence resonance energy transfer. Ab initio calculations indicate that this coupling enables a photon-ratcheting mechanism, in which optical absorption in PbI 2 generates a nonlinear polarization that drives $${\\mathrm{V}}_{\\mathrm{B}}^{-}$$ V B − excitation. This process is compatible with interlayer energy transfer while maintaining minimal electronic and spin hybridization and preserving optically detected magnetic resonance (ODMR) contrast. The heterostructure further exhibits improved sensitivity to external magnetic fields. These results establish a route for the enhancement of defect emission via interlayer optical coupling and introduce a general materials strategy for amplifying weak quantum defect signals in nanomaterials.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-6327-7256", "doi": "10.1103/6327-7256", "type": "Journal", "journal": "PRL", "title": "Altermagnetism in Folded Iron Chain Systems", "authors": "Ling-Fang Lin, Yang Zhang, Satoshi Okamoto et al.", "corresponding": "", "url": "https://doi.org/10.1103/6327-7256", "topic": "Magnetism", "level": "Brief", "summary_en": "Altermagnetism in Folded Iron Chain Systems", "summary": "Altermagnetism in Folded Iron Chain Systems", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-1v68-qwcl", "doi": "10.1103/1v68-qwcl", "type": "Journal", "journal": "PRB", "title": "Anatomy of spin-orbit torques in monolayer Fe 3 GeTe 2 and Fe 3 GaTe 2 : Insights from atomistic and momentum-space decompositions", "authors": "Gusthavo M. S. Brizolla, Stepan S. Tsirkin, Yaroslav Zhumagulov et al.", "corresponding": "", "url": "https://doi.org/10.1103/1v68-qwcl", "topic": "Magnetism", "level": "Brief", "summary_en": "Anatomy of spin-orbit torques in monolayer Fe 3 GeTe 2 and Fe 3 GaTe 2 : Insights from atomistic and momentum-space decompositions", "summary": "Anatomy of spin-orbit torques in monolayer Fe 3 GeTe 2 and Fe 3 GaTe 2 : Insights from atomistic and momentum-space decompositions", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78963-2", "doi": "10.1038/s41467-026-78963-2", "type": "Journal", "journal": "Nature Communications", "title": "Author Correction: Coaxially printed magnetic mechanical electrical hybrid structures with actuation and sensing functionalities", "authors": "Yuanxi Zhang, Chengfeng Pan, Pengfei Liu et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78963-2", "topic": "Magnetism", "level": "Brief", "summary_en": "Author Correction: Coaxially printed magnetic mechanical electrical hybrid structures with actuation and sensing functionalities", "summary": "Author Correction: Coaxially printed magnetic mechanical electrical hybrid structures with actuation and sensing functionalities", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-35wk-wmyj", "doi": "10.1103/35wk-wmyj", "type": "Journal", "journal": "PRB", "title": "B-site disorder induced cluster glass and magnetoresistance behaviors in LaSrMnRuO 6 double perovskite", "authors": "Arun Kumar, S. Leelashree, P. N. Santhosh", "corresponding": "", "url": "https://doi.org/10.1103/35wk-wmyj", "topic": "Magnetism", "level": "Brief", "summary_en": "B-site disorder induced cluster glass and magnetoresistance behaviors in LaSrMnRuO 6 double perovskite", "summary": "B-site disorder induced cluster glass and magnetoresistance behaviors in LaSrMnRuO 6 double perovskite", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-cbmf-s76k", "doi": "10.1103/cbmf-s76k", "type": "Journal", "journal": "PRL", "title": "Dihadron Transverse-Spin Asymmetries in Muon-Deuteron Deep-Inelastic Scattering", "authors": "G. D. Alexeev, M. G. Alexeev, C. Alice et al.", "corresponding": "", "url": "https://doi.org/10.1103/cbmf-s76k", "topic": "Magnetism", "level": "Brief", "summary_en": "In 2022, the COMPASS collaboration performed semi-inclusive measurements of deep-inelastic muon-scattering on a transversely polarized deuteron ( LiD 6 ) target. From these data, transverse-spin-dependent dihadron asymmetries are extracted using pairs of oppositely charged hadrons. These asymmetries are directly sensitive to the quark transversity distributions and provide an independent handle on", "summary": "In 2022, the COMPASS collaboration performed semi-inclusive measurements of deep-inelastic muon-scattering on a transversely polarized deuteron ( LiD 6 ) target. From these data, transverse-spin-dependent dihadron asymmetries are extracted using pairs of oppositely charged hadrons. These asymmetries are directly sensitive to the quark transversity distributions and provide an independent handle on", "abstract": "In 2022, the COMPASS collaboration performed semi-inclusive measurements of deep-inelastic muon-scattering on a transversely polarized deuteron ( LiD 6 ) target. From these data, transverse-spin-dependent dihadron asymmetries are extracted using pairs of oppositely charged hadrons. These asymmetries are directly sensitive to the quark transversity distributions and provide an independent handle on these fundamental quantities with respect to the Collins asymmetries measured in single-hadron production. The present results significantly improve upon the previous COMPASS deuteron measurements, which were the only available deuteron data worldwide, and reach a statistical precision comparable to that of the existing proton results from COMPASS. A small but nonzero asymmetry is observed at large Bjorken- x , consistent with theoretical expectations. A point-by-point extraction of the valence-quark transversity distributions yields, in particular, a substantially improved determination of the d -quark transversity. These measurements represent a major step towards a complete flavor mapping of the transverse-spin structure of the nucleon.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-jsvt-jc4l", "doi": "10.1103/jsvt-jc4l", "type": "Journal", "journal": "PRB", "title": "Dynamical magnetism in the disordered cubic lattice material γ − Ba 3 CoNb 2 O 9", "authors": "Fanjun Xu, Ralf Feyerherm, Cecilie Glittum et al.", "corresponding": "", "url": "https://doi.org/10.1103/jsvt-jc4l", "topic": "Magnetism", "level": "Brief", "summary_en": "γ − Ba 3 CoNb 2 O 9 realizes a disordered simple-cubic spin- 1 / 2 lattice in which Co 2 + ions randomly occupy one-third of the sites, placing the system just above the site-percolation threshold for magnetic order. Specific-heat, susceptibility, neutron spin-echo, and muon spin-rotation measurements reveal a broad thermodynamic crossover, short-range magnetic correlations, and persistent fast sp", "summary": "γ − Ba 3 CoNb 2 O 9 realizes a disordered simple-cubic spin- 1 / 2 lattice in which Co 2 + ions randomly occupy one-third of the sites, placing the system just above the site-percolation threshold for magnetic order. Specific-heat, susceptibility, neutron spin-echo, and muon spin-rotation measurements reveal a broad thermodynamic crossover, short-range magnetic correlations, and persistent fast sp", "abstract": "γ − Ba 3 CoNb 2 O 9 realizes a disordered simple-cubic spin- 1 / 2 lattice in which Co 2 + ions randomly occupy one-third of the sites, placing the system just above the site-percolation threshold for magnetic order. Specific-heat, susceptibility, neutron spin-echo, and muon spin-rotation measurements reveal a broad thermodynamic crossover, short-range magnetic correlations, and persistent fast spin dynamics down to at least 0.1 K, with no evidence for static order or conventional spin-glass freezing within the experimental time windows. Monte Carlo simulations yield a broad distribution of orphan spins, finite clusters, and an infinite network. The weakly correlated spin fraction ( ≈ 8.2 % ) inferred phenomenologically from magnetization is consistent with the calculated orphan-spin fraction ( ≈ 8.8 % ). Exact diagonalization of a diluted S = 1 / 2 Heisenberg model captures the broad magnetic specific-heat anomaly and supports the coexistence of weakly and strongly correlated spin environments. These results support a picture in which spin- 1 / 2 quantum fluctuations, together with dilution and proximity to the percolation threshold, can support a disorder-driven dynamical state with short-range correlations in three dimensions, distinct from both classical spin glasses and geometrically frustrated quantum spin liquids.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78018-6", "doi": "10.1038/s41467-026-78018-6", "type": "Journal", "journal": "Nature Communications", "title": "Evidence of optical Aharonov-Bohm interference in spin-polarized moiré excitonic complexes", "authors": "Andreij C. Gadelha, Diego R. Costa, André Pelais et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78018-6", "topic": "Magnetism", "level": "Brief", "summary_en": "Evidence of optical Aharonov-Bohm interference in spin-polarized moiré excitonic complexes", "summary": "Evidence of optical Aharonov-Bohm interference in spin-polarized moiré excitonic complexes", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-gzpm-7s5f", "doi": "10.1103/gzpm-7s5f", "type": "Journal", "journal": "PRL", "title": "Experimental evidence for reflected ions and ion temperature anisotropy in a forming supercritical magnetized collisionless shock", "authors": "R. Yamazaki, T. Takezaki, T. Morita et al.", "corresponding": "", "url": "https://doi.org/10.1103/gzpm-7s5f", "topic": "Magnetism", "level": "Brief", "summary_en": "Experimental evidence for reflected ions and ion temperature anisotropy in a forming supercritical magnetized collisionless shock", "summary": "Experimental evidence for reflected ions and ion temperature anisotropy in a forming supercritical magnetized collisionless shock", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-l4wt-87js", "doi": "10.1103/l4wt-87js", "type": "Journal", "journal": "PRB", "title": "Field-induced metal-insulator transition, Chern insulators, and topological semimetals in the clean magnetic semiconductor GdGaI", "authors": "R. K. Guzman Ilave, Hiroaki Ishizuka", "corresponding": "", "url": "https://doi.org/10.1103/l4wt-87js", "topic": "Magnetism", "level": "Brief", "summary_en": "Field-induced metal-insulator transition, Chern insulators, and topological semimetals in the clean magnetic semiconductor GdGaI", "summary": "Field-induced metal-insulator transition, Chern insulators, and topological semimetals in the clean magnetic semiconductor GdGaI", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-dd19-921m", "doi": "10.1103/dd19-921m", "type": "Journal", "journal": "PRB", "title": "GHz nonreciprocal optical conductivity in hematite α − Fe 2 O 3", "authors": "Peng Rao, Johannes Gröbmeyer, P. Peter Stavropoulos et al.", "corresponding": "", "url": "https://doi.org/10.1103/dd19-921m", "topic": "Magnetism", "level": "Brief", "summary_en": "We study the nonreciprocal properties of the iron oxide α − Fe 2 O 3 (hematite) in the canted easy-plane antiferromagnetic phase, specifically in the GHz to THz frequency range. First, using the the microscopic spin Hamiltonian, we obtain the correct classical ground state where the canting is induced by the Dzyaloshinskii-Moriya interactions (DMI). The magnon spectrum is simulated using linear sp", "summary": "We study the nonreciprocal properties of the iron oxide α − Fe 2 O 3 (hematite) in the canted easy-plane antiferromagnetic phase, specifically in the GHz to THz frequency range. First, using the the microscopic spin Hamiltonian, we obtain the correct classical ground state where the canting is induced by the Dzyaloshinskii-Moriya interactions (DMI). The magnon spectrum is simulated using linear sp", "abstract": "We study the nonreciprocal properties of the iron oxide α − Fe 2 O 3 (hematite) in the canted easy-plane antiferromagnetic phase, specifically in the GHz to THz frequency range. First, using the the microscopic spin Hamiltonian, we obtain the correct classical ground state where the canting is induced by the Dzyaloshinskii-Moriya interactions (DMI). The magnon spectrum is simulated using linear spin wave theory. We then compute the polarizability and the subgap optical conductivities using linear response. We find that the conductivity tensor contains frequency peaks at the zero momentum magnon gaps of order 0.1 meV which can be tuned by the DMI and on-site anisotropic spin interactions. Furthermore, we show that the canting-induced net magnetic moment m represents a measure for the effective time-reversal-symmetry breaking and nonreciprocity of the system: A finite m results in a nonzero Hall conductivity. Finally, we discuss the prospective application of hematite in nonreciprocal circulator design, by computing the nonreciprocal circulator transmission amplitude using the conductivities as input.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78016-8", "doi": "10.1038/s41467-026-78016-8", "type": "Journal", "journal": "Nature Communications", "title": "Giant orbital Zeeman effects in a magnetic topological van der Waals interphase", "authors": "Tobias Wichmann, Mirco Sastges, Keda Jin et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78016-8", "topic": "Magnetism", "level": "Brief", "summary_en": "Abstract Van der Waals (vdW) heterostructures allow the engineering of magnetic and electronic properties via interfacial orbital hybridization and charge transfer. The resulting electric fields can give rise to Rashba spin-orbit coupling and Dzyaloshinskii-Moriya interactions, which may stabilize novel two-dimensional magnetic phases. While such emergent magnetic ‘interphases’ may offer a promisi", "summary": "Abstract Van der Waals (vdW) heterostructures allow the engineering of magnetic and electronic properties via interfacial orbital hybridization and charge transfer. The resulting electric fields can give rise to Rashba spin-orbit coupling and Dzyaloshinskii-Moriya interactions, which may stabilize novel two-dimensional magnetic phases. While such emergent magnetic ‘interphases’ may offer a promisi", "abstract": "Abstract Van der Waals (vdW) heterostructures allow the engineering of magnetic and electronic properties via interfacial orbital hybridization and charge transfer. The resulting electric fields can give rise to Rashba spin-orbit coupling and Dzyaloshinskii-Moriya interactions, which may stabilize novel two-dimensional magnetic phases. While such emergent magnetic ‘interphases’ may offer a promising platform for spin-based electronics, direct spectroscopic evidence for them is still lacking. Here, we report electric-field tunable Zeeman effects with Landé g -factors up to ≈ 230 at the interface of graphene and the vdW ferromagnet Fe 3 GeTe 2 . They arise from an interplay of local-moment canting and the itinerant orbital moments of Fe 3 GeTe 2 , producing a giant asymmetric level splitting. Exploiting the inelastic phonon gap of graphene, scanning tunneling spectroscopy allows us to access the buried interface properties, and quantify Faraday-like screening. Our findings provide new insights and opportunities for electrically controlled interface magnetism, e.g. for spintronics and orbitronics devices.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75477", "doi": "10.1002/adma.75477", "type": "Journal", "journal": "Advanced Materials", "title": "Harnessing Rare Earth Elements in Proteins and Functional Materials for Advanced Optical, Magnetic, and Mechanical Applications", "authors": "Yumeng Jia, Wenhao Cheng, Jingjing Li et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75477", "topic": "Magnetism", "level": "Brief", "summary_en": "ABSTRACT Rare earth‐proteins and their functional materials integrate unique physical properties of rare earth ions (RE 3+ ) with structural programmability of proteins, attracting increasing attention in a wide range of applications. Coordination with RE 3+ can enhance the rigidity and stability of certain proteins, even induce secondary structure transitions, and confer distinct physical propert", "summary": "ABSTRACT Rare earth‐proteins and their functional materials integrate unique physical properties of rare earth ions (RE 3+ ) with structural programmability of proteins, attracting increasing attention in a wide range of applications. Coordination with RE 3+ can enhance the rigidity and stability of certain proteins, even induce secondary structure transitions, and confer distinct physical propert", "abstract": "ABSTRACT Rare earth‐proteins and their functional materials integrate unique physical properties of rare earth ions (RE 3+ ) with structural programmability of proteins, attracting increasing attention in a wide range of applications. Coordination with RE 3+ can enhance the rigidity and stability of certain proteins, even induce secondary structure transitions, and confer distinct physical properties onto functional materials. The programmability of amino acid sequences regulates coordination chemistry between proteins and RE 3+ , enabling the modulation of their optical and magnetic properties. Moreover, RE 3+ incorporation turns protein structures and aggregation state, leading to enhanced mechanical properties and adhesion strength. However, the development of such materials still faces significant challenges due to lack of molecular mechanism analysis and systematic rational design strategies. This review highlights the chemical structural analysis, rational design and synthesis strategies of rare earth‐protein and their functional materials. In addition, their applications in optics, magnetics, and mechanics are summarized. Finally, their current challenges and future perspectives are discussed.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75481", "doi": "10.1002/adma.75481", "type": "Journal", "journal": "Advanced Materials", "title": "In Situ Constructed Pore‐Chain Interlocked Networks in Polyimide‐Covalent Organic Framework Nanocomposites Enable Ultralow k Dielectrics for High‐Fidelity Signal Transmission", "authors": "Jingxin Liu, Yu Xin, Yinghui Sun et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75481", "topic": "Magnetism", "level": "Brief", "summary_en": "ABSTRACT The ultralow k porous polymer dielectrics have been widely explored for Integrated circuit (IC) interconnects, 5G/6G communications, and wearable devices. However, disordered pore structures and poor interfacial adhesion remain a major challenge, thus making it difficult to decouple the k ‐tanδ trade‐off. Here, we employ hollow covalent organic frameworks (H‐TD‐COF) as multifunctional mol", "summary": "ABSTRACT The ultralow k porous polymer dielectrics have been widely explored for Integrated circuit (IC) interconnects, 5G/6G communications, and wearable devices. However, disordered pore structures and poor interfacial adhesion remain a major challenge, thus making it difficult to decouple the k ‐tanδ trade‐off. Here, we employ hollow covalent organic frameworks (H‐TD‐COF) as multifunctional mol", "abstract": "ABSTRACT The ultralow k porous polymer dielectrics have been widely explored for Integrated circuit (IC) interconnects, 5G/6G communications, and wearable devices. However, disordered pore structures and poor interfacial adhesion remain a major challenge, thus making it difficult to decouple the k ‐tanδ trade‐off. Here, we employ hollow covalent organic frameworks (H‐TD‐COF) as multifunctional molecular anchoring nodes to construct robust pore‐chain interlocked networks in polyimide nanofibrous films. The amino‐functionalized COF shells participate in the in situ growth of polyimide (PI) chains, thus enabling interlocked interfaces that fundamentally restrict segmental mobility and suppress dipolar relaxation. Subsequent electrospinning technique allows anchored chains to be stretched along the fiber axis and immobilizes them within an oriented fibrous architecture. This simultaneously disrupts long‐range charge migration pathways while preserving stress‐transfer and heat‐dissipation continuity. The resulting PI‐g‐COF (4) nanocomposites with 4 wt% H‐TD‐COF loading achieve an ultralow dielectric constant of 1.50 and dielectric loss of 0.001 at 1 kHz, with highly stable dielectric properties up to 250°C. Notably, device‐level measurements further reveal a signal‐to‐noise‐and‐distortion ratio (SINAD) of 22.30 dB under 200 MHz crosstalk interference, showing a 52.2% improvement over commercial polyimide. This work lays solid foundations for nanoscale interfacial regulation in porous polymer nanocomposites towards ultralow k dielectrics.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-77066-2", "doi": "10.1038/s41467-026-77066-2", "type": "Journal", "journal": "Nature Communications", "title": "Isolation of uranocenium, the bis-[8]annulene uranium cation", "authors": "Cameron N. Deakin, Iulia Turcas, Benjamin L. L. Réant et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-77066-2", "topic": "Magnetism", "level": "Brief", "summary_en": "Abstract Uranocene, [U IV (η 8 -C 8 H 8 ) 2 ], is the actinide equivalent to ferrocene. While ferrocene is readily oxidised to the ferrocenium cation, higher oxidation states of uranocene are unknown. Here we report the elusive uranocenium cation, [U V (η 8 -C 8 H 8 ) 2 ] + , and demonstrate using electron paramagnetic resonance spectroscopy and magnetometry that this formal U(V) complex has a 5 f", "summary": "Abstract Uranocene, [U IV (η 8 -C 8 H 8 ) 2 ], is the actinide equivalent to ferrocene. While ferrocene is readily oxidised to the ferrocenium cation, higher oxidation states of uranocene are unknown. Here we report the elusive uranocenium cation, [U V (η 8 -C 8 H 8 ) 2 ] + , and demonstrate using electron paramagnetic resonance spectroscopy and magnetometry that this formal U(V) complex has a 5 f", "abstract": "Abstract Uranocene, [U IV (η 8 -C 8 H 8 ) 2 ], is the actinide equivalent to ferrocene. While ferrocene is readily oxidised to the ferrocenium cation, higher oxidation states of uranocene are unknown. Here we report the elusive uranocenium cation, [U V (η 8 -C 8 H 8 ) 2 ] + , and demonstrate using electron paramagnetic resonance spectroscopy and magnetometry that this formal U(V) complex has a 5 f 1 ground state. Enhanced uranium 5 f and 6 d mixing into filled δ-symmetry bonding orbitals in uranocenium, compared to uranocene, amplifies interorbital electron–electron repulsion, and counteracts bond length contraction, which minimises structural change. This manifests in solution where the uranocene/uranocenium redox couple exhibits near-ideal electrochemical reversibility, and in the solid-state where X-ray diffraction studies show minimal U–C bond length change upon oxidation. This demonstrates a case where actinide covalency governs molecular structure and physical properties across both solid and solution phases.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78386-z", "doi": "10.1038/s41467-026-78386-z", "type": "Journal", "journal": "Nature Communications", "title": "Laser-enhanced quantum sensing boosts sensitivity and dynamic range", "authors": "Florian Schall, Lukas Lindner, Yves Rottstaedt et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78386-z", "topic": "Magnetism", "level": "Brief", "summary_en": "Abstract While magnetometers based on nitrogen-vacancy (NV) centers in diamond have emerged as the most important solid-state quantum sensors, ensembles are typically limited to a few percent optical contrast. Here, we demonstrate a laser threshold magnetometry-based NV system that achieves 100% optical contrast in combination with strong output signals up to 50 mW. By integrating the NV centers i", "summary": "Abstract While magnetometers based on nitrogen-vacancy (NV) centers in diamond have emerged as the most important solid-state quantum sensors, ensembles are typically limited to a few percent optical contrast. Here, we demonstrate a laser threshold magnetometry-based NV system that achieves 100% optical contrast in combination with strong output signals up to 50 mW. By integrating the NV centers i", "abstract": "Abstract While magnetometers based on nitrogen-vacancy (NV) centers in diamond have emerged as the most important solid-state quantum sensors, ensembles are typically limited to a few percent optical contrast. Here, we demonstrate a laser threshold magnetometry-based NV system that achieves 100% optical contrast in combination with strong output signals up to 50 mW. By integrating the NV centers into a laser cavity, we show magnetic-field-dependent shifts of the laser threshold, allowing the laser system to be entirely switched off with the NV centers’ magnetic resonance. We determine the photon-shot-noise fundamental sensitivity limit to be &lt; 400 fT/ $$\\sqrt{{{\\rm{Hz}}}}$$ Hz for all vector components and demonstrate that it improves super-linearly with contrast. This sensitivity is not achieved at the usual cost of smaller linewidth, i.e., maintains good intrinsic dynamic range. This provides a perspective for highly sensitive magnetometry operated outside magnetically-shielded rooms for applications including magnetoencephalography, magnetic navigation, and magnetic anomaly detection.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-ytfq-5c74", "doi": "10.1103/ytfq-5c74", "type": "Journal", "journal": "PRB", "title": "Magnetic anisotropy, first-order metamagnetic transitions, and weak antilocalization in the candidate topological semimetal Tb 2 Zn 17", "authors": "Rajesh Swami, Papul Sahu, Sonali S Pradhan et al.", "corresponding": "", "url": "https://doi.org/10.1103/ytfq-5c74", "topic": "Magnetism", "level": "Brief", "summary_en": "Magnetic anisotropy, first-order metamagnetic transitions, and weak antilocalization in the candidate topological semimetal Tb 2 Zn 17", "summary": "Magnetic anisotropy, first-order metamagnetic transitions, and weak antilocalization in the candidate topological semimetal Tb 2 Zn 17", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-wh99-b81w", "doi": "10.1103/wh99-b81w", "type": "Journal", "journal": "PRL", "title": "Magnon Chern Insulator in Two-Dimensional Fully Compensated Ferrimagnetic Heterostructures", "authors": "Yingxi Bai, Zhiqi Chen, Baibiao Huang et al.", "corresponding": "", "url": "https://doi.org/10.1103/wh99-b81w", "topic": "Magnetism", "level": "Brief", "summary_en": "Magnon Chern Insulator in Two-Dimensional Fully Compensated Ferrimagnetic Heterostructures", "summary": "Magnon Chern Insulator in Two-Dimensional Fully Compensated Ferrimagnetic Heterostructures", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-85ds-xp39", "doi": "10.1103/85ds-xp39", "type": "Journal", "journal": "Physical Review Materials", "title": "Microscopic origin of the intrinsic anomalous Hall and spin Hall effects in ferrimagnetic GdCo 5", "authors": "Ngo Trong Hai, Shang-Fan Lee, Jun-Zhi Liang et al.", "corresponding": " e‐Transfer Excitation in a van der Waals Antiferromagnet CrPS 4", "authors": "Muhammad Hassan Shaikh, Kenji Watanabe, Takashi Taniguchi et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75391", "topic": "Magnetism", "level": "Brief", "summary_en": "ABSTRACT Controlling magnetism with light in two‐dimensional van der Waals magnets could enable ultrafast, energy‐efficient spintronics. However, selectively writing distinct magnetic phases, such as chiral magnetic states (e.g., spin spirals and skyrmions) for memory and collinear states for logic, within a single material remains an outstanding challenge. Here, we demonstrate deterministic, phot", "summary": "ABSTRACT Controlling magnetism with light in two‐dimensional van der Waals magnets could enable ultrafast, energy‐efficient spintronics. However, selectively writing distinct magnetic phases, such as chiral magnetic states (e.g., spin spirals and skyrmions) for memory and collinear states for logic, within a single material remains an outstanding challenge. Here, we demonstrate deterministic, phot", "abstract": "ABSTRACT Controlling magnetism with light in two‐dimensional van der Waals magnets could enable ultrafast, energy‐efficient spintronics. However, selectively writing distinct magnetic phases, such as chiral magnetic states (e.g., spin spirals and skyrmions) for memory and collinear states for logic, within a single material remains an outstanding challenge. Here, we demonstrate deterministic, photon‐energy‐selective writing of magnetic order in the air‐stable antiferromagnet chromium thiophosphate (). Its ligand‐to‐metal charge transfer gap serves as an intrinsic switching threshold: excitation below this gap drives – transitions to stabilize chiral magnetic states due to a spin–spiral phase, while excitation above activates a photo‐doping mechanism that renormalizes magnetic exchange and induces a collinear phase. These optically defined states are distinguished through polarization‐resolved magneto‐optical spectroscopy and probed via a proximal monolayer tungsten diselenide (). By establishing optical selectivity in a single material, our work provides a reconfigurable platform for opto‐spintronic circuits where memory and logic functions can be dynamically toggled with light.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75329", "doi": "10.1002/adma.75329", "type": "Journal", "journal": "Advanced Materials", "title": "Optimal Control Drives Ultrafast and Energy‐Efficient Magnetization Switching in Van der Waals Magnets (Adv. Mater. 59/2026)", "authors": "Mohammad H. Badarneh, PeiYu Cai, Elton J. G. Santos", "corresponding": "", "url": "https://doi.org/10.1002/adma.75329", "topic": "Magnetism", "level": "Brief", "summary_en": "Optimal Control Drives Ultrafast and Energy‐Efficient Magnetization Switching in Van der Waals Magnets (Adv. Mater. 59/2026)", "summary": "Optimal Control Drives Ultrafast and Energy‐Efficient Magnetization Switching in Van der Waals Magnets (Adv. Mater. 59/2026)", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-5stq-h3mj", "doi": "10.1103/5stq-h3mj", "type": "Journal", "journal": "PRB", "title": "Pressure-tuned flat-band instability and magnetic suppression in SmCrGe 3", "authors": "Wenli Bi, Cheng Peng, Francisco J. Canales et al.", "corresponding": "", "url": "https://doi.org/10.1103/5stq-h3mj", "topic": "Magnetism", "level": "Brief", "summary_en": "Pressure-tuned flat-band instability and magnetic suppression in SmCrGe 3", "summary": "Pressure-tuned flat-band instability and magnetic suppression in SmCrGe 3", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-zgw5-99k2", "doi": "10.1103/zgw5-99k2", "type": "Journal", "journal": "PRB", "title": "Propagation and localization of spin excitations at altermagnetic domain walls", "authors": "Oksana Peschanska, Jeroen van den Brink, Volodymyr P. Kravchuk", "corresponding": "", "url": "https://doi.org/10.1103/zgw5-99k2", "topic": "Magnetism", "level": "Brief", "summary_en": "Altermagnets ( AMs ) are spin-compensated materials in which opposite-spin sublattices are connected by a symmetry that causes a spin splitting in their elementary excitations. As there is a strong effect of altermagnetism on domain wall properties, it is quite natural to also expect an enrichment of the physics of magnetic excitations at AM domain walls. Here, we consider the propagation of spin ", "summary": "Altermagnets ( AMs ) are spin-compensated materials in which opposite-spin sublattices are connected by a symmetry that causes a spin splitting in their elementary excitations. As there is a strong effect of altermagnetism on domain wall properties, it is quite natural to also expect an enrichment of the physics of magnetic excitations at AM domain walls. Here, we consider the propagation of spin ", "abstract": "Altermagnets ( AMs ) are spin-compensated materials in which opposite-spin sublattices are connected by a symmetry that causes a spin splitting in their elementary excitations. As there is a strong effect of altermagnetism on domain wall properties, it is quite natural to also expect an enrichment of the physics of magnetic excitations at AM domain walls. Here, we consider the propagation of spin eigenexcitations along domain walls in easy-axial d -wave AMs . Investigating the presence of bound states localized on a domain wall, we find that the effect of the AM on the bound states strongly depends on the orientation of the domain wall relative to the crystallographic directions. If the domain wall is oriented along a nodal direction [100] or [010], AM does not change the number of bound states; however, it leads to a nonlinear dispersion and a tilt of the wavefront. The effect of AM is strongest when the domain wall is oriented along the directions [110] or [ 1 ¯ 10 ] , i.e., along the directions of the strongest AM splitting in the magnon spectrum. In this case, (i) the additional gapped bound states appear, (ii) degeneracy of the eigenstates with respect to their polarization (right-hand or left-hand precession of the Néel vector) is removed, and (iii) the localization area of the bound states strongly depends on the eigenfrequency. The latter may lead to strong localization of the bound state at the domain wall. We further consider the influence of a static magnetic field that is applied along the easy axis and find that the magnetic field induces an asymmetry between the localization regions on opposite sides of the domain wall and sets an upper limit on the absolute value of the propagating eigenstate's wave vector.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-6ps1-mw9l", "doi": "10.1103/6ps1-mw9l", "type": "Journal", "journal": "PRX", "title": "Quantum Advantage for Sensing Properties of Classical Fields", "authors": "Jordan Cotler, Daine L. Danielson, Ishaan Kannan", "corresponding": "", "url": "https://doi.org/10.1103/6ps1-mw9l", "topic": "Magnetism", "level": "Brief", "summary_en": "Modern precision experiments often probe unknown classical fields with bosonic sensors in quantum-noise-limited regimes where vacuum fluctuations limit conventional readout. We introduce quantum signal learning, a sensing framework that extends metrology to a broader property-learning setting, and propose a quantum-enhanced protocol that simultaneously estimates many properties of a classical sign", "summary": "Modern precision experiments often probe unknown classical fields with bosonic sensors in quantum-noise-limited regimes where vacuum fluctuations limit conventional readout. We introduce quantum signal learning, a sensing framework that extends metrology to a broader property-learning setting, and propose a quantum-enhanced protocol that simultaneously estimates many properties of a classical sign", "abstract": "Modern precision experiments often probe unknown classical fields with bosonic sensors in quantum-noise-limited regimes where vacuum fluctuations limit conventional readout. We introduce quantum signal learning, a sensing framework that extends metrology to a broader property-learning setting, and propose a quantum-enhanced protocol that simultaneously estimates many properties of a classical signal with shot noise suppressed below the vacuum level. Our scheme requires only two-mode squeezing, passive optics, and static homodyne measurements, and enables classical estimation of many properties from the same experimental dataset. We prove that our protocol enables a quantum speedup for common classical sensing tasks, including measuring electromagnetic correlations, real-time feedback control of interferometric cavities, and Fourier-domain matched filtering. To establish these separations, we introduce an optimal-transport conditioning method and show both worst-case exponential separations from all entanglement-free strategies and practical speedups over homodyne and heterodyne baselines. We further show that when squeezing is treated as a resource, a protocol with squeezed light can sense a structured classical background exponentially faster than any coherent classical probe.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-3mf9-nnt3", "doi": "10.1103/3mf9-nnt3", "type": "Journal", "journal": "PRL", "title": "Quantum geometric ferromagnetism by singular saddle point", "authors": "Taisei Kitamura, Hiroki Nakai, Akito Daido et al.", "corresponding": "", "url": "https://doi.org/10.1103/3mf9-nnt3", "topic": "Magnetism", "level": "Brief", "summary_en": "Quantum geometric ferromagnetism by singular saddle point", "summary": "Quantum geometric ferromagnetism by singular saddle point", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-wkx4-mr24", "doi": "10.1103/wkx4-mr24", "type": "Journal", "journal": "PRB", "title": "Slave-rotor theory of correlated altermagnets on the Lieb lattice", "authors": "Vanuildo S. de Carvalho, Hermann Freire, Rodrigo G. Pereira", "corresponding": "", "url": "https://doi.org/10.1103/wkx4-mr24", "topic": "Magnetism", "level": "Brief", "summary_en": "Slave-rotor theory of correlated altermagnets on the Lieb lattice", "summary": "Slave-rotor theory of correlated altermagnets on the Lieb lattice", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-k8v2-h3dy", "doi": "10.1103/k8v2-h3dy", "type": "Journal", "journal": "PRB", "title": "Spin relaxation in X -wave magnets ( X = p , d , f , g , i )", "authors": "Lijie Liu, Mingbo Dou, Xu Chen et al.", "corresponding": "", "url": "https://doi.org/10.1103/k8v2-h3dy", "topic": "Magnetism", "level": "Brief", "summary_en": "Spin relaxation in X -wave magnets ( X = p , d , f , g , i )", "summary": "Spin relaxation in X -wave magnets ( X = p , d , f , g , i )", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-q75s-35k6", "doi": "10.1103/q75s-35k6", "type": "Journal", "journal": "PRB", "title": "Strong electron correlations and ligand hybridization for altermagnetism", "authors": "Byungkyun Kang, Anderson Janotti, Dai Q. Ho et al.", "corresponding": "", "url": "https://doi.org/10.1103/q75s-35k6", "topic": "Magnetism", "level": "Brief", "summary_en": "Strong electron correlations and ligand hybridization for altermagnetism", "summary": "Strong electron correlations and ligand hybridization for altermagnetism", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78390-3", "doi": "10.1038/s41467-026-78390-3", "type": "Journal", "journal": "Nature Communications", "title": "Tau isoform mapping across tissues and biofluids reveals a signature distinguishing Alzheimer’s disease from amyotrophic lateral sclerosis", "authors": "Samir Abu-Rumeileh, Henning Großkopf, Arthur Guthknecht et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78390-3", "topic": "Magnetism", "level": "Brief", "summary_en": "Abstract Blood phosphorylated tau 217 (p-tau217) accurately detects Alzheimer’s disease (AD) pathology but is also elevated in amyotrophic lateral sclerosis (ALS), likely reflecting peripheral (big) tau released from muscle. Assays selectively measuring brain-derived (BD-) tau and BD-p-tau217 are therefore needed. We analysed serum BD-tau and p-tau217 in ALS ( n = 139), AD ( n = 101) and controls ", "summary": "Abstract Blood phosphorylated tau 217 (p-tau217) accurately detects Alzheimer’s disease (AD) pathology but is also elevated in amyotrophic lateral sclerosis (ALS), likely reflecting peripheral (big) tau released from muscle. Assays selectively measuring brain-derived (BD-) tau and BD-p-tau217 are therefore needed. We analysed serum BD-tau and p-tau217 in ALS ( n = 139), AD ( n = 101) and controls ", "abstract": "Abstract Blood phosphorylated tau 217 (p-tau217) accurately detects Alzheimer’s disease (AD) pathology but is also elevated in amyotrophic lateral sclerosis (ALS), likely reflecting peripheral (big) tau released from muscle. Assays selectively measuring brain-derived (BD-) tau and BD-p-tau217 are therefore needed. We analysed serum BD-tau and p-tau217 in ALS ( n = 139), AD ( n = 101) and controls ( n = 75) using direct immunoassays and after BD-Tau immunoprecipitation (BD-Tau-IP), and tau species in brain ( n = 16), spinal cord ( n = 11) and muscle ( n = 10) by targeted mass spectrometry. With the direct immunoassays, BD-tau and p-tau217 were increased in AD and ALS versus controls. After BD-Tau-IP, BD-tau and BD-p-tau217 were elevated in AD only, improving diagnostic accuracy. Mass spectrometry revealed a central-to-peripheral shift from BD-tau to big tau predominance, with exclusively big p-tau217 detected in muscle. Selective detection of BD-tau species improves the specificity of blood AD biomarkers by reducing peripheral tau confounding.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-9vy6-cs4t", "doi": "10.1103/9vy6-cs4t", "type": "Journal", "journal": "PRL", "title": "Topologically protected surface altermagnetism on antiferromagnets", "authors": "Valentin Leeb, Peru d’’Ornellas, Fernando de Juan et al.", "corresponding": "", "url": "https://doi.org/10.1103/9vy6-cs4t", "topic": "Magnetism", "level": "Brief", "summary_en": "Topologically protected surface altermagnetism on antiferromagnets", "summary": "Topologically protected surface altermagnetism on antiferromagnets", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-yfv7-h21m", "doi": "10.1103/yfv7-h21m", "type": "Journal", "journal": "PRB", "title": "Two-dimensional twisted ferromagnetic domain wall as a spin-wave diffraction grating", "authors": "Ehsan Faridi, Se Kwon Kim, Giovanni Vignale", "corresponding": "", "url": "https://doi.org/10.1103/yfv7-h21m", "topic": "Magnetism", "level": "Brief", "summary_en": "Two-dimensional twisted ferromagnetic domain wall as a spin-wave diffraction grating", "summary": "Two-dimensional twisted ferromagnetic domain wall as a spin-wave diffraction grating", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41563-026-02778-1", "doi": "10.1038/s41563-026-02778-1", "type": "Journal", "journal": "Nature Materials", "title": "Zero-field spin-wave networks with integrated non-volatile memory", "authors": "K. O. Nikolaev, D. Raskhodchikov, J. Bensmann et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41563-026-02778-1", "topic": "Magnetism", "level": "Brief", "summary_en": "Abstract Magnonic circuits that use spin waves for nanoscale signal processing and computing are widely regarded as a promising alternative to traditional semiconductor electronics. However, a key missing component of this information nanotechnology is a feasible approach for the integration of memory directly into spin-wave devices. Here we propose a strategy for the implementation of built-in no", "summary": "Abstract Magnonic circuits that use spin waves for nanoscale signal processing and computing are widely regarded as a promising alternative to traditional semiconductor electronics. However, a key missing component of this information nanotechnology is a feasible approach for the integration of memory directly into spin-wave devices. Here we propose a strategy for the implementation of built-in no", "abstract": "Abstract Magnonic circuits that use spin waves for nanoscale signal processing and computing are widely regarded as a promising alternative to traditional semiconductor electronics. However, a key missing component of this information nanotechnology is a feasible approach for the integration of memory directly into spin-wave devices. Here we propose a strategy for the implementation of built-in non-volatile memory, which uses the static magnetization states of waveguiding elements within a magnonic network fabricated from a low-loss magnetic insulator and operating at zero bias magnetic field. We show that switching the magnetization direction in these elements enables efficient control over spin-wave propagation paths. Furthermore, we suggest an approach to achieve low-energy selective magnetization switching in such systems. Our results open new possibilities for the realization of advanced, self-contained magnonic nano-circuits.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75469", "doi": "10.1002/adma.75469", "type": "Journal", "journal": "Advanced Materials", "title": "Aluminum Scandium Nitride (AlScN) for Advanced Devices: Physical Mechanisms and Emerging Applications", "authors": "Zhigang Wang, Jiale Wan, Ting Li et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75469", "topic": "Materials & Growth", "level": "Brief", "summary_en": "ABSTRACT AlScN is an emerging semiconductor material that exhibits pronounced ferroelectric switching and enhanced piezoelectric responses through the incorporation of scandium (Sc) into aluminum nitride (AlN). These properties make AlScN a promising candidate for next‐generation ferroelectric in‐memory computing architecture and radio‐frequency circuits. However, challenges arise when preparing h", "summary": "ABSTRACT AlScN is an emerging semiconductor material that exhibits pronounced ferroelectric switching and enhanced piezoelectric responses through the incorporation of scandium (Sc) into aluminum nitride (AlN). These properties make AlScN a promising candidate for next‐generation ferroelectric in‐memory computing architecture and radio‐frequency circuits. However, challenges arise when preparing h", "abstract": "ABSTRACT AlScN is an emerging semiconductor material that exhibits pronounced ferroelectric switching and enhanced piezoelectric responses through the incorporation of scandium (Sc) into aluminum nitride (AlN). These properties make AlScN a promising candidate for next‐generation ferroelectric in‐memory computing architecture and radio‐frequency circuits. However, challenges arise when preparing high‐quality epitaxial films with high Sc content, including insufficient ferroelectric endurance, interface instability, and leakage current, which collectively compromise device performance and reliability. This review provides a systematic overview of the ferroelectric and piezoelectric properties of AlScN with underlying physical mechanisms, highlights the challenges in material growth and device integration, and summarizes recent advances of emerging applications in piezoelectric devices, optoelectronic devices, ferroelectric memories, and high‐electron‐mobility transistors (HEMTs). Finally, perspectives are presented on future research directions, focusing on overcoming key barriers to device implementation. With ongoing advances in material optimization and system‐level integration, AlScN presents broad prospects for energy‐efficient computing and sensing hardware, accelerating the development of artificial intelligence (AI).", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78741-0", "doi": "10.1038/s41467-026-78741-0", "type": "Journal", "journal": "Nature Communications", "title": "Asymmetric total synthesis of veraflorizine, peimine and peiminine", "authors": "Hui Wang, Hao Shao, Junjie Chen et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78741-0", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Asymmetric total synthesis of veraflorizine, peimine and peiminine", "summary": "Asymmetric total synthesis of veraflorizine, peimine and peiminine", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75470", "doi": "10.1002/adma.75470", "type": "Journal", "journal": "Advanced Materials", "title": "Design of Bridging‐Oxygen‐Modulated Fe–Ni Dual‐Atom Sites With Multifaceted Stabilization for Durable Cathode Catalysis in Rechargeable Zinc–Air Batteries", "authors": "Wenbo Shi, Qian Zhang, Kai Zhu et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75470", "topic": "Materials & Growth", "level": "Brief", "summary_en": "ABSTRACT Rechargeable zinc–air batteries (RZABs) require durable bifunctional oxygen electrocatalysts. However, the long‐term stability of metal‐nitrogen‐carbon atomic‐site catalysts (M–N–Cs) remains challenged by electrochemical corrosion and reactive oxygen species (ROS)‐induced damage arising from multiple degradation pathways, which collectively demand comprehensive solutions due to the “bucke", "summary": "ABSTRACT Rechargeable zinc–air batteries (RZABs) require durable bifunctional oxygen electrocatalysts. However, the long‐term stability of metal‐nitrogen‐carbon atomic‐site catalysts (M–N–Cs) remains challenged by electrochemical corrosion and reactive oxygen species (ROS)‐induced damage arising from multiple degradation pathways, which collectively demand comprehensive solutions due to the “bucke", "abstract": "ABSTRACT Rechargeable zinc–air batteries (RZABs) require durable bifunctional oxygen electrocatalysts. However, the long‐term stability of metal‐nitrogen‐carbon atomic‐site catalysts (M–N–Cs) remains challenged by electrochemical corrosion and reactive oxygen species (ROS)‐induced damage arising from multiple degradation pathways, which collectively demand comprehensive solutions due to the “buckets effect” of instabilities. Herein, we develop a robust FeNi–N–C dual‐atom catalyst (DAC) featuring a bridging µ 2 ‐O electron modulator for long‐life RZAB catalysis, retaining 80% of its initial energy efficiency after 2800 h. Theoretical simulations and experimental evidence support multifaceted stabilization of the N/O‐coordinated vicinal Fe–Ni configuration. The µ 2 ‐O bridge improves intrinsic structural stability, decreases electron density on adjacent metal and N atoms to mitigate N‐site protonation and intermediate‐induced metal stripping, and promotes an O─O cleavage pathway that suppresses H 2 O 2 /ROS accumulation. These findings provide a coordination‐engineering strategy for designing durable M–N–C catalysts for long‐life RZABs.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-3rxj-2hpp", "doi": "10.1103/3rxj-2hpp", "type": "Journal", "journal": "PRL", "title": "Direct measurement of the 59 Cu( p , α ) 56 Ni excitation function to constrain the NiCu cycle strength and its impact on explosive nucleosynthesis", "authors": "E. Lopez-Saavedra, M. L. Avila, W.-J. Ong et al.", "corresponding": "", "url": "https://doi.org/10.1103/3rxj-2hpp", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Direct measurement of the 59 Cu( p , α ) 56 Ni excitation function to constrain the NiCu cycle strength and its impact on explosive nucleosynthesis", "summary": "Direct measurement of the 59 Cu( p , α ) 56 Ni excitation function to constrain the NiCu cycle strength and its impact on explosive nucleosynthesis", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-4smy-6w2n", "doi": "10.1103/4smy-6w2n", "type": "Journal", "journal": "PRL", "title": "Entangling Ions with Engineered Light Gradients", "authors": "Tommaso Faorlin, Lorenz Panzl, Phoebe Grosser et al.", "corresponding": "", "url": "https://doi.org/10.1103/4smy-6w2n", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Spectral crowding of collective motional modes limits the fidelity of entangling interactions in trapped-ion quantum processors by inducing off-resonant coupling to spectator modes. We introduce a geometric-phase entangling interaction driven by a transverse, time-dependent structured-light force. By applying the force in a plane orthogonal to the optical propagation direction, we reduce the effec", "summary": "Spectral crowding of collective motional modes limits the fidelity of entangling interactions in trapped-ion quantum processors by inducing off-resonant coupling to spectator modes. We introduce a geometric-phase entangling interaction driven by a transverse, time-dependent structured-light force. By applying the force in a plane orthogonal to the optical propagation direction, we reduce the effec", "abstract": "Spectral crowding of collective motional modes limits the fidelity of entangling interactions in trapped-ion quantum processors by inducing off-resonant coupling to spectator modes. We introduce a geometric-phase entangling interaction driven by a transverse, time-dependent structured-light force. By applying the force in a plane orthogonal to the optical propagation direction, we reduce the effects of spectral crowding while preserving single-ion addressing. The scheme is compatible with arbitrary qubit encodings, provided that the qubit states experience a differential AC Stark shift. We experimentally realize high-fidelity two-qubit gates with error rates below 5 × 10 − 3 in ion crystals containing up to 12 ions confined within a single potential well. These results establish gradient-field light-shift gates as a scalable approach to high-fidelity entanglement generation in spectrally crowded trapped-ion systems.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78214-4", "doi": "10.1038/s41467-026-78214-4", "type": "Journal", "journal": "Nature Communications", "title": "High-numerical-aperture extreme ultraviolet flat optics via a cascaded momentum relay", "authors": "Xiaoqi Jiang, Maoxiong Zhao, Shaohua Yang et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78214-4", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Abstract High-numerical-aperture extreme-ultraviolet flat optics are constrained by undersampling of steep edge phase gradients, which reduces phase fidelity and high-angle diffraction efficiency. Here, we introduce a momentum-relay architecture that partitions large wavevector deflections across two cascaded elements. A 4:1 demagnification platform operating at 532 nm synthesizes an effective num", "summary": "Abstract High-numerical-aperture extreme-ultraviolet flat optics are constrained by undersampling of steep edge phase gradients, which reduces phase fidelity and high-angle diffraction efficiency. Here, we introduce a momentum-relay architecture that partitions large wavevector deflections across two cascaded elements. A 4:1 demagnification platform operating at 532 nm synthesizes an effective num", "abstract": "Abstract High-numerical-aperture extreme-ultraviolet flat optics are constrained by undersampling of steep edge phase gradients, which reduces phase fidelity and high-angle diffraction efficiency. Here, we introduce a momentum-relay architecture that partitions large wavevector deflections across two cascaded elements. A 4:1 demagnification platform operating at 532 nm synthesizes an effective numerical aperture of 0.80, producing a measured first-dark-ring radius of 413.2 nm and resolving ~555 nm image-plane features across a 100 μm-diameter field of view. We further translate the concept to 13.24 nm using a compact xenon laser-produced-plasma source. Two Fresnel zone plates, each with a numerical aperture of approximately 0.33, cooperatively synthesize an effective numerical aperture of approximately 0.53. Here, we show that cascaded momentum relay provides a compact route to high-numerical-aperture extreme-ultraviolet projection while relaxing the feature-size and spatial-sampling requirements imposed on each element.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75461", "doi": "10.1002/adma.75461", "type": "Journal", "journal": "Advanced Materials", "title": "Hollow Conjugated Microporous Polymers Anchored With Zn x Cd 1‐x S Quantum Dots: An Additive‐Free Photocatalyst for H 2 O 2 Synthesis via S‐Scheme Charge Transfer", "authors": "Jie Jie Kang, Jian Yi, You Cheng Xing et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75461", "topic": "Materials & Growth", "level": "Brief", "summary_en": "ABSTRACT Photocatalytic H 2 O 2 production via the two‐electron oxygen reduction reaction (2e − ORR) offers a green alternative to the anthraquinone process, but single‐component photocatalysts suffer from rapid charge recombination. Here, we construct an S‐scheme heterojunction by growing Zn x Cd 1‐x S (ZCS) quantum dots (QDs) in situ on hollow conjugated microporous polymers (CMPs) containing se", "summary": "ABSTRACT Photocatalytic H 2 O 2 production via the two‐electron oxygen reduction reaction (2e − ORR) offers a green alternative to the anthraquinone process, but single‐component photocatalysts suffer from rapid charge recombination. Here, we construct an S‐scheme heterojunction by growing Zn x Cd 1‐x S (ZCS) quantum dots (QDs) in situ on hollow conjugated microporous polymers (CMPs) containing se", "abstract": "ABSTRACT Photocatalytic H 2 O 2 production via the two‐electron oxygen reduction reaction (2e − ORR) offers a green alternative to the anthraquinone process, but single‐component photocatalysts suffer from rapid charge recombination. Here, we construct an S‐scheme heterojunction by growing Zn x Cd 1‐x S (ZCS) quantum dots (QDs) in situ on hollow conjugated microporous polymers (CMPs) containing selenadiazole units ( h PSe). The hollow CMPs scaffold provides high surface area, abundant pores for QDs embedding, efficient mass transfer, and enhanced light harvesting, while the selenadiazole units promote strong interfacial coupling. In pure water without any sacrificial agent, the optimal ZCS@ h PSe‐2 composite achieved an outstanding H 2 O 2 production rate of 15.13 mmol g −1 h −1 with a synergy factor of 1.53 and an apparent quantum efficiency (AQE) of 8.82% at 400 nm, operating exclusively via the 2e − ORR. The dramatic performance is attributed to the S‐scheme charge transfer mechanism, which preserves the strong redox potentials of both components and suppresses bulk charge recombination. This work demonstrates that rational integration of QDs with hollow CMPs provides a viable pathway toward efficient, additive‐free photocatalytic H 2 O 2 synthesis.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78795-0", "doi": "10.1038/s41467-026-78795-0", "type": "Journal", "journal": "Nature Communications", "title": "Molecular basis of coupled peptidoglycan synthesis by the FtsWIQLB divisome complex from Vibrio cholerae", "authors": "Aili Hao, Ryotaro Okawa, Akira Katsuyama et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78795-0", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Molecular basis of coupled peptidoglycan synthesis by the FtsWIQLB divisome complex from Vibrio cholerae", "summary": "Molecular basis of coupled peptidoglycan synthesis by the FtsWIQLB divisome complex from Vibrio cholerae", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1073-pnas-2608997123", "doi": "10.1073/pnas.2608997123", "type": "Journal", "journal": "PNAS", "title": "Molecular drivers of cotranslational protein assembly in bacteria", "authors": "Jaro L. Schmitt, Josef J. Auburger, Florian Wruck et al.", "corresponding": "", "url": "https://doi.org/10.1073/pnas.2608997123", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Protein complexes are pivotal to all major cellular processes. Translation-coupled complex assembly is ubiquitous in eukaryotes, but its molecular basis and prevalence in bacteria remain poorly understood. Here, we combine ribosome profiling and single-molecule optical tweezers to establish principles governing cotranslational assembly of four structurally diverse complexes in Escherichia coli . W", "summary": "Protein complexes are pivotal to all major cellular processes. Translation-coupled complex assembly is ubiquitous in eukaryotes, but its molecular basis and prevalence in bacteria remain poorly understood. Here, we combine ribosome profiling and single-molecule optical tweezers to establish principles governing cotranslational assembly of four structurally diverse complexes in Escherichia coli . W", "abstract": "Protein complexes are pivotal to all major cellular processes. Translation-coupled complex assembly is ubiquitous in eukaryotes, but its molecular basis and prevalence in bacteria remain poorly understood. Here, we combine ribosome profiling and single-molecule optical tweezers to establish principles governing cotranslational assembly of four structurally diverse complexes in Escherichia coli . We reveal how heterotetramers form cotranslationally via hierarchical assembly pathways, with initial heterodimer formation priming the assembly of higher-order oligomers through a topology-dependent organization of homomeric and heteromeric interfaces. Co-post assembly, defined as interaction between nascent and fully synthesized subunits, initiates when dimerization domains are completely exposed at the ribosome. The assembly order is predominantly unidirectional and matches the operon gene order, with upstream-encoded subunits being synthesized first, and then engaging downstream nascent partner subunits. The co-post assembly efficiency depends both on the native operon structure and the ribosome-associated chaperone trigger factor, which binds emerging oligomerization domains and whose dissociation marks the onset of partner subunit engagement. The handover from chaperone engagement to cotranslational assembly is mediated by nascent chain folding. Finally, we show that co-post assembly provides a fitness advantage. Together, these findings reveal how genome organization and chaperone-assisted folding coordinate cotranslational assembly to promote efficient complex biogenesis and cellular fitness in bacteria.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78128-1", "doi": "10.1038/s41467-026-78128-1", "type": "Journal", "journal": "Nature Communications", "title": "Reduced-DSP 200G/λ low-voltage slow-light silicon modulator enabled by built-in EO equalizer", "authors": "Keisuke Kawahara, Tai Tsuchizawa, Noritsugu Yamamoto et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78128-1", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Abstract Multi-Tb/s optical interconnects for artificial intelligence data centers necessitate high-speed, energy-efficient, and compact transceivers. However, conventional silicon Mach-Zehnder modulators are fundamentally limited by low modulation efficiency and large physical dimensions that typically extend several millimeters, requiring high-swing drivers and power-intensive digital signal pro", "summary": "Abstract Multi-Tb/s optical interconnects for artificial intelligence data centers necessitate high-speed, energy-efficient, and compact transceivers. However, conventional silicon Mach-Zehnder modulators are fundamentally limited by low modulation efficiency and large physical dimensions that typically extend several millimeters, requiring high-swing drivers and power-intensive digital signal pro", "abstract": "Abstract Multi-Tb/s optical interconnects for artificial intelligence data centers necessitate high-speed, energy-efficient, and compact transceivers. However, conventional silicon Mach-Zehnder modulators are fundamentally limited by low modulation efficiency and large physical dimensions that typically extend several millimeters, requiring high-swing drivers and power-intensive digital signal processing to achieve data rates exceeding 100 Gb/s per lane. Here we show a silicon photonic crystal waveguide slow-light modulator that overcomes the bandwidth-efficiency trade-off via a built-in electro-optic equalizer. By monolithically integrating optical delay lines and crossings within segmented slow-light phase shifters, we synthesized an on-chip feedforward response that extends the 3-dB bandwidth. The fabricated modulator with a small device length of 320 µm demonstrated 140-Gb/s on-off keying operation with an energy consumption of 26 fJ/bit using drive voltages compatible with fin field-effect transistor-based complementary metal-oxide-semiconductor technology. Furthermore, four-level pulse amplitude modulation achieved 180 Gb/s without digital signal processing and 200 Gb/s with a low-complexity 11-tap digital equalizer. By reducing reliance on power-dissipating electronics, this strategy provides a potential route toward future dense multi-Tb/s co-packaged optics for energy-constrained switching systems.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1073-pnas-2620406123", "doi": "10.1073/pnas.2620406123", "type": "Journal", "journal": "PNAS", "title": "Reduction of aflatoxin contamination in maize kernels mediated by host-induced gene silencing", "authors": "Ali Ahmed, Keri Cavanaugh, Patricia Baldrich et al.", "corresponding": "", "url": "https://doi.org/10.1073/pnas.2620406123", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Aflatoxins produced by some species of Aspergillus pose a significant threat to global food safety, because they contaminate a variety of crops including maize. In this study, we used host-induced gene silencing (HIGS) to reduce aflatoxin accumulation in maize upon infection with Aspergillus flavus and Aspergillus parasiticus . Two RNAi constructs were designed and introduced into maize, one targe", "summary": "Aflatoxins produced by some species of Aspergillus pose a significant threat to global food safety, because they contaminate a variety of crops including maize. In this study, we used host-induced gene silencing (HIGS) to reduce aflatoxin accumulation in maize upon infection with Aspergillus flavus and Aspergillus parasiticus . Two RNAi constructs were designed and introduced into maize, one targe", "abstract": "Aflatoxins produced by some species of Aspergillus pose a significant threat to global food safety, because they contaminate a variety of crops including maize. In this study, we used host-induced gene silencing (HIGS) to reduce aflatoxin accumulation in maize upon infection with Aspergillus flavus and Aspergillus parasiticus . Two RNAi constructs were designed and introduced into maize, one targeting two essential fungal genes involved in ergosterol biosynthesis ( CYP51A and CYP51B ) and the other targeting three aflatoxin biosynthesis genes ( AflC , AflD , and AflR ). The presence of RNAi transgenes was confirmed in 17 and 14 independent lines possessing the CYP51A/CYP51B RNAi construct and the AflC/AflD/AflR RNAi construct, respectively. Most transgenic lines had single-locus integrations and one or two copies of the transgene. Transgene expression varied considerably among the lines. Small RNA sequencing confirmed the production of siRNAs from the HIGS trigger sequences. Levels of CYP51A , AflC , AflD, and AflR transcripts in Aspergillus spp. were successfully decreased upon infection of transgenic maize. However, significant reduction in the level of CYP51B transcripts was not achieved and the CYP51A/CYP51B RNAi transgene had no discernible effect on fungal growth in infected maize. In contrast, we observed significant reductions in aflatoxin accumulation in four AflC/AflD/AflR RNAi transgenic lines infected with A. flavus and in two transgenic lines infected with A. parasiticus . Notably, one AflC/AflD/AflR transgenic line exhibited minimal aflatoxin contamination upon kernel infection with A. parasiticus . These results demonstrate the potential of HIGS to reduce aflatoxin production in mature corn kernels.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-77513-0", "doi": "10.1038/s41467-026-77513-0", "type": "Journal", "journal": "Nature Communications", "title": "Renewable-compatible urea electrosynthesis enabled by dynamic asymmetric catalytic domains", "authors": "Yuntong Sun, Denian Wang, Xiaoyuan Zhang et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-77513-0", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Renewable-compatible urea electrosynthesis enabled by dynamic asymmetric catalytic domains", "summary": "Renewable-compatible urea electrosynthesis enabled by dynamic asymmetric catalytic domains", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75474", "doi": "10.1002/adma.75474", "type": "Journal", "journal": "Advanced Materials", "title": "Self‐Segregated Buried‐Interface Regulation Resolves Kinetic–Environmental Coupling for Ambient Flexible Perovskite Solar Cells", "authors": "Chenxin Zhao, Erxin Zhao, Xuan Ji et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75474", "topic": "Materials & Growth", "level": "Brief", "summary_en": "ABSTRACT Ambient fabrication of flexible perovskite solar cells is fundamentally limited by a detrimental kinetic–environmental coupling at the buried interface, where moisture ingress and nonoptimal crystallization mutually compromise film quality—yet the underlying mechanism remains elusive. Using dual‐side in situ photoluminescence, we overturn the conventional top–down model by revealing simul", "summary": "ABSTRACT Ambient fabrication of flexible perovskite solar cells is fundamentally limited by a detrimental kinetic–environmental coupling at the buried interface, where moisture ingress and nonoptimal crystallization mutually compromise film quality—yet the underlying mechanism remains elusive. Using dual‐side in situ photoluminescence, we overturn the conventional top–down model by revealing simul", "abstract": "ABSTRACT Ambient fabrication of flexible perovskite solar cells is fundamentally limited by a detrimental kinetic–environmental coupling at the buried interface, where moisture ingress and nonoptimal crystallization mutually compromise film quality—yet the underlying mechanism remains elusive. Using dual‐side in situ photoluminescence, we overturn the conventional top–down model by revealing simultaneous nucleation at both gas–liquid and liquid–solid interfaces during antisolvent‐assisted solution processing, but find that outward solvent evaporation delays α‐phase conversion at the buried interface relative to the surface, creating kinetic mismatch that exacerbates moisture attack and defect accumulation. To address these kinetic and environmental constraints, we design a self‐segregating multifunctional molecule, 2‐[(3‐trifluoromethyl)phenyl]amino‐3‐pyridinecarboxylic acid (NFA), which spontaneously enriches at the buried interface to synchronize dual‐interface crystallization while simultaneously passivating defects, optimizing energy‐level alignment, and constructing a hydrophobic barrier against moisture ingress. Consequently, this self‐segregated kinetic–environmental regulation yields record ambient flexible photovoltaic performance with power‐conversion efficiencies of 24.84% (0.09 cm 2 , certified at 23.75%) and 21.46% on mini‐modules (13.8 cm 2 ). The optimized devices maintain 96.26% of their starting efficiency following 1000 h damp aging at 85 ± 5% RH. Our work establishes self‐segregated interfacial regulation as a rational route to address kinetic and environmental constraints in scalable flexible photovoltaics.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1002-adma-75475", "doi": "10.1002/adma.75475", "type": "Journal", "journal": "Advanced Materials", "title": "Sequential Crystallization Decouples Cs 4 PbBr 6 and CsPbBr 3 Phases Enabling Efficient Perovskite Light‐Emitting Diodes", "authors": "Jike Zhang, Tao Sheng, Gang Wang et al.", "corresponding": "", "url": "https://doi.org/10.1002/adma.75475", "topic": "Materials & Growth", "level": "Brief", "summary_en": "ABSTRACT Cesium lead bromide has emerged as a leading candidate for high‐performance perovskite light‐emitting diodes (PeLEDs) in next‐generation optoelectronics. However, the formation of the 0D Cs 4 PbBr 6 phase often accompanies CsPbBr 3 crystallization and is difficult to regulate, hampering the efficiency of LED devices in scalable production. In particular, 0D and 3D perovskite phases often ", "summary": "ABSTRACT Cesium lead bromide has emerged as a leading candidate for high‐performance perovskite light‐emitting diodes (PeLEDs) in next‐generation optoelectronics. However, the formation of the 0D Cs 4 PbBr 6 phase often accompanies CsPbBr 3 crystallization and is difficult to regulate, hampering the efficiency of LED devices in scalable production. In particular, 0D and 3D perovskite phases often ", "abstract": "ABSTRACT Cesium lead bromide has emerged as a leading candidate for high‐performance perovskite light‐emitting diodes (PeLEDs) in next‐generation optoelectronics. However, the formation of the 0D Cs 4 PbBr 6 phase often accompanies CsPbBr 3 crystallization and is difficult to regulate, hampering the efficiency of LED devices in scalable production. In particular, 0D and 3D perovskite phases often crystallize as disordered structures, leading to poor crystalline quality and a high density of defects in the perovskite films. To address this challenge, we employed an additive‐mediated sequential crystallization (AMSC) strategy using 3‐carboxyphenylphosphonic acid (3‐CPPA) to modulate the crystallization kinetics of the 0D and 3D phases. Through strong interactions between the additive and perovskite precursors, the initial CsPbBr 3 formation is effectively slowed, allowing for temporally separated crystallization of Cs 4 PbBr 6 and CsPbBr 3 phases. This separated crystallization process significantly enhances the film quality of CsPbBr 3 phase. Remarkably, the AMSC strategy drives the Cs 4 PbBr 6 phase toward the film surface, thereby forming a favorable surface morphology and effectively improving the light outcoupling efficiency of PeLEDs. By leveraging this synergic strategy, we achieve an ultrahigh photoluminescence quantum yield (PLQY) reaching nearly 100% and realize an efficient external quantum efficiency (EQE) of 35.3% in green PeLEDs, underscoring the critical role of phase crystallization engineering in optimizing perovskite emitters.", "method": "", "result": "", "future": ""}, {"id": "doi-10-1103-lr3v-61qw", "doi": "10.1103/lr3v-61qw", "type": "Journal", "journal": "PRB", "title": "Si-O network connectivity as a structural signature of self-passivation of β − FeSi 2 surfaces", "authors": "Jun Chai, Hangjia Shen, Mingping He et al.", "corresponding": "", "url": "https://doi.org/10.1103/lr3v-61qw", "topic": "Materials & Growth", "level": "Brief", "summary_en": "Si-O network connectivity as a structural signature of self-passivation of β − FeSi 2 surfaces", "summary": "Si-O network connectivity as a structural signature of self-passivation of β − FeSi 2 surfaces", "abstract": "", "method": "", "result": "", "future": ""}, {"id": "doi-10-1038-s41467-026-78517-6", "doi": "10.1038/s41467-026-78517-6", "type": "Journal", "journal": "Nature Communications", "title": "Structural basis of bile acid lateral diffusion facilitated by the OSTα/β transporter", "authors": "Kang Xu, Bo-Rui Li, GaoXing Yu- Huang et al.", "corresponding": "", "url": "https://doi.org/10.1038/s41467-026-78517-6", "t
